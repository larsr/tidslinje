name: Bygg, testa och publicera

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Kontrollera datat
        run: uv run scripts/check.py
      - name: Testa formateringen
        run: uv run scripts/test_format.py
      - name: Bygg sajten
        run: uv run scripts/build.py
      - name: Installera Chromium för röktestet
        run: uv run --with playwright==1.56.0 playwright install --with-deps chromium
      - name: Röktest
        run: uv run scripts/smoke.py
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
