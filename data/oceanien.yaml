duyfken-1606-forsta-kanda-europeiska:
  period: 1600
  label: "Duyfken 1606: första kända europeiska landstigningen"
  title: "Duyfken når Australien 1606"
  wiki:
    - "en:Duyfken"
    - "en:Willem Janszoon"
  text: |
    **Duyfken** (”lilla duvan”) var ett litet holländskt skepp, bara omkring 20 meter långt, som tillhörde VOC ([se 1602](#voc-1602)). 1606 skickades det under befäl av **Willem Janszoon** från Banten på Java för att utforska Nya Guinea, i hopp om guld och handel. Det seglade söderut och nådde Kap York-halvön i dagens Queensland, Australiens nordöstra spets – den första kända europeiska landstigningen i Australien.

    Janszoon trodde att landet var en del av Nya Guinea. Han kartlade drygt 300 km kust, men mötet med urbefolkningen, aboriginerna, blev våldsamt; flera i besättningen dödades. Han rapporterade att landet var värdelöst för handel. Samma år seglade spanjoren Luis Váez de Torres genom sundet mellan Australien och Nya Guinea utan att veta att det var ett sund.

    Aboriginerna hade då bott i Australien i minst 50 000 år. Holländarna kartlade under 1600-talet stora delar av väst- och nordkusten och kallade landet Nya Holland; [Abel Tasman nådde Tasmanien och Nya Zeeland 1642](#tasman-tasmanien-nya-zeeland-1642). Men först [James Cook kartlade östkusten 1770](#cook-kartlagger-ostra-australien-1770), och den brittiska koloniseringen började 1788 med [straffkolonin i Sydney](#forsta-flottan-till-sydney-1788).

tasman-tasmanien-nya-zeeland-1642:
  period: 1640
  label: "Tasman: Tasmanien, Nya Zeeland 1642"
  title: "Abel Tasman: Tasmanien och Nya Zeeland 1642"
  wiki:
    - "sv:Abel Tasman"
  text: |
    **Abel Tasman** (1603–1659) var sjökapten i Nederländska Ostindiska kompaniet **[VOC](#voc-1602)**. Holländare hade [sedan 1606](#duyfken-1606-forsta-kanda-europeiska) sett delar av Australiens västkust, som de kallade ”Nya Holland”, men ingen visste hur stort landet var eller om det fanns en stor sydkontinent.

    1642 skickades Tasman från Batavia (Jakarta) med två fartyg. Han seglade söderut och österut och nådde en ö som han döpte till Van Diemens land – idag **Tasmanien**. Därefter kom han som förste europé till **Nya Zeeland**. Vid ett ankringsställe på Sydön angreps en båt av maorier och fyra holländare dödades; Tasman gick aldrig i land. Han fortsatte till Tonga och Fiji och återvände efter tio månader.

    Resan visade att Australien inte hängde ihop med någon stor sydpolskontinent, eftersom han seglat runt det på långt avstånd utan att se det. VOC fann dock inga handelsvaror och tappade intresset. Nya Zeeland fick namn efter den holländska provinsen Zeeland. Nästa europé där var [James Cook 1769](#cook-kartlagger-ostra-australien-1770), vars resor ledde till brittisk [kolonisering av Australien från 1788](#forsta-flottan-till-sydney-1788).

dampier-i-australien-1688:
  period: 1680
  label: "Dampier i Australien 1688"
  title: "Dampier i Australien 1688"
  wiki:
    - "sv:William Dampier"
    - "en:William Dampier"
  text: |
    **William Dampier** (1651–1715) var en engelsk sjörövare (bukanjär – kapare som angrep spanska skepp och städer i Amerika), upptäcktsresande och naturforskare. 1688 landade hans fartyg *Cygnet* på Australiens nordvästkust, och han blev därmed den förste engelsman som dokumenterat ett besök i Australien.

    [Holländarna hade redan kartlagt delar av kusten](#duyfken-1606-forsta-kanda-europeiska) under 1600-talet och kallade landet Nya Holland; [Abel Tasman seglade runt det 1642–1644](#tasman-tasmanien-nya-zeeland-1642) utan att se fastlandet. Dampier stannade cirka två månader för att reparera skeppet. Han beskrev landet som torrt och fattigt och ursprungsbefolkningen nedsättande, vilket bidrog till att européerna länge inte intresserade sig för det.

    Hans bok *A New Voyage Round the World* (1697) blev en bästsäljare och inspirerade senare författare som Jonathan Swift (Gullivers resor) och Daniel Defoe (Robinson Crusoe). Han gjorde totalt tre världsomseglingar. [Brittisk kolonisering av Australien började först 1788](#forsta-flottan-till-sydney-1788), hundra år senare, efter [James Cooks resa 1770](#cook-kartlagger-ostra-australien-1770).

cook-kartlagger-ostra-australien-1770:
  period: 1760
  label: "Cook kartlägger östra Australien 1770"
  title: "Cook kartlägger Australiens östkust 1770"
  wiki:
    - "sv:James Cook"
    - "en:First voyage of James Cook"
  text: |
    **James Cook** (1728–1779) var en brittisk sjöofficer och lantmätare från enkla förhållanden, känd för sina extremt noggranna kartor. Hans första stora resa 1768–1771 med fartyget *Endeavour* hade två mål: att observera Venus passage över solen från Tahiti 1769 (för att räkna ut avståndet till solen) och att i hemlighet leta efter den förmodade sydkontinenten.

    Han kartlade först hela Nya Zeelands kust och seglade sedan västerut. I april 1770 nådde han Australiens sydöstra kust och följde den omkring 3 000 km norrut. [Holländarna hade kartlagt väst- och nordkusten](#duyfken-1606-forsta-kanda-europeiska) redan på 1600-talet men aldrig östkusten. Ombord fanns botanikern Joseph Banks och [Linnés](#linne-systema-naturae) lärjunge Daniel Solander; de samlade så många nya växter vid en vik att den döptes till **Botany Bay**. Endeavour gick nästan under på Stora barriärrevet.

    Cook gjorde anspråk på östkusten för Storbritannien, utan hänsyn till de aboriginska folk som bott där i minst 50 000 år. Botany Bay valdes 1786 som plats för en straffkoloni (se [Första flottan till Sydney 1788](#forsta-flottan-till-sydney-1788)).

    Se även [Cook korsar Antarktiska cirkeln](#cook-korsar-antarktiska-cirkeln), hans andra resa.

forsta-flottan-till-sydney-1788:
  period: 1780
  label: "Första flottan till Sydney 1788"
  title: "Första flottan når Sydney 1788"
  wiki:
    - "sv:Första flottan"
    - "en:Arthur Phillip"
  text: |
    Storbritannien hade länge skickat dömda brottslingar till straffarbete i de amerikanska kolonierna. Efter [förlusten av USA 1783](#amerikanska-kolonier-forlorade-1783) fylldes fängelserna och de gamla fängelseskeppen på Themsen. Lösningen blev en ny straffkoloni på andra sidan jorden, vid Botany Bay som [James Cook besökt 1770](#cook-kartlagger-ostra-australien-1770).

    **Första flottan** bestod av 11 fartyg med uppskattningsvis 1 400–1 500 personer, varav omkring 750 fångar; många dömda för stölder. Under kapten **Arthur Phillip** seglade de i över åtta månader och cirka 24 000 km. Botany Bay visade sig olämplig, så den 26 januari 1788 grundades kolonin vid Sydney Cove i Port Jackson – datumet är Australiens nationaldag. De första åren var nära svält.

    Totalt skickades omkring 160 000 fångar till Australien fram till 1868. För [Australiens ursprungsfolk](#aboriginska-kulturer-50-000-ar), uppskattningsvis 300 000–1 miljon människor i hundratals språkgrupper, var 1788 början på förlust av land och massdöd genom smittkoppor, våld och fördrivning. Därför kallar många dagen *Invasion Day*.

kolonier-i-australien:
  period: 1800
  label: "Kolonier i Australien"
  title: "Kolonierna i Australien växer"
  wiki:
    - "sv:Australiens historia"
    - "en:History of Australia (1788–1850)"
  text: |
    Storbritannien grundade 1788 en straffkoloni i Sydney (New South Wales), sedan de [amerikanska kolonierna som tidigare tagit emot brittiska fångar blivit självständiga](#amerikanska-kolonier-forlorade-1783). Den första flottan hade omkring 1 400 personer, varav ca 750 fångar, efter en åtta månader lång seglats.

    Under början av 1800-talet spred sig kolonisationen: **Van Diemens land** (Tasmanien) 1803, Western Australia 1829, South Australia 1836 och Victoria (Melbourne) runt 1835. Mellan 1788 och 1868 skickades totalt cirka 160 000 fångar till Australien. Ullproduktion från får blev den stora exportnäringen, och fria nybyggare blev allt fler.

    För Australiens ursprungsbefolkning, aboriginerna – uppskattningsvis 300 000 till ett par miljoner människor 1788 – var detta en katastrof. Smittkoppor och andra sjukdomar, fördrivning från land och våldsamma konflikter, som det så kallade Svarta kriget på Tasmanien på 1820-talet, minskade befolkningen kraftigt. [Guldruschen 1851](#guldrusch-1851) tredubblade sedan antalet invandrare på ett decennium.

guldrusch-1851:
  period: 1840
  label: "Guldrusch 1851"
  title: "Guldruschen i Australien 1851"
  wiki:
    - "en:Victorian gold rush"
    - "en:Eureka Rebellion"
  text: |
    År 1851 hittades guld i New South Wales och kort därefter i stora mängder i **Victoria** kring Ballarat och Bendigo. Några av de första upptäckarna hade just återvänt från [guldruschen i Kalifornien](#guldrusch-1849) och visste vad de skulle leta efter.

    Effekten blev enorm. Australiens befolkning av europeiskt ursprung ökade från ungefär 430 000 år 1851 till omkring 1,1 miljoner år 1861. **Melbourne** blev en tid en av imperiets rikaste städer. Under 1850-talet kom omkring en tredjedel av världens guldproduktion från Victoria. Bland invandrarna fanns ca 40 000 kineser, vilket väckte rasistiska reaktioner och särskilda skatter – en tidig rot till den rasistiska invandringspolitiken ”White Australia” som gällde till 1970-talet.

    1854 gjorde guldgrävare vid Ballarat uppror mot de dyra grävlicenserna och bristen på rösträtt, i det så kallade **Eurekaupproret**. Det slogs ned med omkring 30 döda, men licenserna avskaffades och Victoria införde snart rösträtt för alla män och hemlig omröstning. Valsedelsmetoden spreds sedan till andra länder och kallades ”the Australian ballot”.

federationen-narmar-sig:
  period: 1880
  label: "Federationen närmar sig"
  title: "Australiska kolonierna närmar sig federation"
  wiki:
    - "en:Federation of Australia"
    - "en:Henry Parkes"
  text: |
    Under 1800-talet bestod Australien av sex separata brittiska kolonier – New South Wales, Victoria, Queensland, South Australia, Western Australia och Tasmanien – var och en med egen regering, egna tullar och till och med olika spårvidd på järnvägarna. [Guldrushen på 1850-talet](#guldrusch-1851) hade gjort befolkningen ca 3,7 miljoner år 1901.

    Under 1880- och 1890-talen växte rörelsen för en federation (förbundsstat). Argument var gemensamt försvar (oro för Tyskland, Frankrike och Japan i Stilla havet), frihandel mellan kolonierna och en växande australisk identitet. En ledande gestalt var politikern **Henry Parkes**. Konstitutionsutkast skrevs vid konvent 1891 och 1897–98 och godkändes i folkomröstningar.

    Den 1 januari 1901 bildades **[Australiska statsförbundet](#federation-1901)** som ett självstyrande dominion i brittiska imperiet. En av de första lagarna var ”White Australia”-politiken, som stoppade icke-vit invandring fram till 1970-talet. Nya Zeeland valde att stå utanför. Ursprungsbefolkningen var inte ens medräknad i folkräkningen förrän 1967.

federation-1901:
  period: 1900
  label: "Federation 1901"
  title: "Australiens federation 1901"
  wiki:
    - "en:Federation of Australia"
  text: |
    Fram till 1901 bestod Australien av sex separata brittiska kolonier (bl.a. New South Wales och Victoria), med egna regeringar, tullar och till och med olika spårvidder på järnvägarna. Den 1 januari 1901 gick de samman till en federation, Commonwealth of Australia, efter folkomröstningar i kolonierna.

    Australien blev en självstyrande dominion inom det brittiska imperiet, med den brittiske monarken som statschef – vilket fortfarande gäller. Befolkningen var då knappt 4 miljoner. Canberra byggdes senare som kompromisshuvudstad mellan rivalerna Sydney och Melbourne.

    En av de första lagarna var Immigration Restriction Act 1901, grunden för ”Vita Australien-politiken” som i praktiken stängde ute icke-europeiska invandrare fram till 1970-talet. Aboriginerna, landets ursprungsbefolkning, räknades inte ens med i folkräkningen förrän efter en folkomröstning 1967. Samtidigt var Australien tidigt ute med demokratiska reformer: kvinnor fick rösträtt nationellt redan 1902.

    Se även [Federationen närmar sig](#federationen-narmar-sig).

gallipoli-1915:
  period: 1900
  label: "Gallipoli 1915"
  title: "Gallipoli 1915"
  wiki:
    - "sv:Slaget vid Gallipoli"
    - "en:Gallipoli campaign"
  text: |
    Gallipoli är en halvö i nordvästra Turkiet, vid sundet Dardanellerna som leder till Istanbul. Under [första världskriget](#forsta-varldskriget) försökte Storbritannien och Frankrike 1915 ta sig igenom sundet för att slå ut Osmanska riket (Tysklands allierade) och öppna en sjöväg till Ryssland. Idén drevs bl.a. av **[Winston Churchill](#churchill)**, då chef för brittiska flottan.

    Den 25 april 1915 landsteg trupper, bland dem ANZAC – kåren av australiska och nyzeeländska soldater. De fastnade på smala stränder under branta klippor. Efter åtta månader evakuerades de. Uppskattningsvis 250 000 på varje sida dödades, sårades eller insjuknade; omkring 8 700 australier och 2 700 nyzeeländare dog.

    Fiaskot blev paradoxalt nog en grundmyt för Australien och Nya Zeeland: 25 april är ANZAC Day, en nationell minnesdag. På turkisk sida gjorde slaget officeren **Mustafa Kemal** berömd – senare Atatürk, Turkiets grundare (se [Turkiet 1923](#turkiet-1923-ataturk)).

brander-201920:
  period: 2020
  label: "Bränder 2019–20"
  title: "Skogsbränderna i Australien 2019–2020"
  wiki:
    - "en:2019–20 Australian bushfire season"
  text: |
    Under den australiska sommaren 2019–20 (december–februari, eftersom årstiderna är omvända på södra halvklotet) härjade extrema skogs- och buskbränder i sydöstra Australien, främst i delstaterna New South Wales och Victoria. Säsongen kallas i Australien **Black Summer**. 2019 var det varmaste och torraste år som uppmätts i landet, efter flera års torka.

    Uppskattningsvis 18–24 miljoner hektar brann, en yta ungefär hälften så stor som Sverige. 33 människor dog direkt, och röken bedöms ha bidragit till omkring 400 ytterligare dödsfall. Över 3 000 hus förstördes. Forskare har uppskattat att runt 3 miljarder djur dödades eller fördrevs, bland dem tusentals koalor. Röken spreds runt hela södra halvklotet, och i städerna Sydney och Canberra var luften tidvis bland världens sämsta.

    Bränderna blev en symbol för klimatförändringarna. Forskare bedömer att uppvärmningen gjort sådant brandväder betydligt mer sannolikt. Debatten var extra laddad eftersom Australien är en av världens största exportörer av kol, och premiärministern Scott Morrison kritiserades för att ha varit på semester på Hawaii under bränderna. Jämför med skogsbränderna i Sverige sommaren 2018, då omkring 25 000 hektar brann.

    Samma vinter började [Covid-19 (Wuhan)](#covid-19-wuhan).
