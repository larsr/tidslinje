# Australien / Oceanien
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

aboriginska-kulturer-50-000-ar:
  period: 1000
  label: "Aboriginska kulturer (~50 000 år)"
  title: "Aboriginska kulturer i Australien"
  wiki:
    - "sv:Aboriginer"
    - "en:Aboriginal Australians"
  text: |
    **Aboriginerna** är Australiens ursprungsbefolkning. Deras förfäder kom till kontinenten för minst 50 000 år sedan, kanske 65 000, sannolikt med båt från Sydostasien under istiden när havsnivån var lägre. Det gör deras kulturer till några av världens äldsta obrutna. Som jämförelse: jordbruket uppfanns för omkring 12 000 år sedan, och Sverige blev isfritt för omkring 10 000 år sedan.

    Kring år 1000 levde uppskattningsvis 300 000–1 miljon människor i Australien, uppdelade i flera hundra folkgrupper med omkring 250 olika språk. De var jägare och samlare men formade landskapet aktivt, bland annat genom kontrollerad bränning av vegetation för att underlätta jakt och få ny växtlighet. Vissa grupper byggde avancerade fiskefällor och ålodlingar, till exempel vid Budj Bim som är flera tusen år gamla.

    Kunskap och lag fördes vidare muntligt genom berättelser, sånger och hällmålningar, kopplade till *drömtiden* – skapelseberättelser som binder människor till platser. Allt detta förändrades i grunden när britterna började kolonisera Australien 1788: sjukdomar, våld och fördrivning minskade befolkningen kraftigt under 1800-talet. Jämför med [polynesiernas utbredning över Stilla havet](#polynesier-sprider-sig-osterut-i-stilla) under samma tid.

polynesier-sprider-sig-osterut-i-stilla:
  period: 1000
  label: "polynesier sprider sig österut i Stilla havet"
  title: "Polynesiernas utvandring i Stilla havet"
  wiki:
    - "sv:Polynesier"
    - "en:Polynesian navigation"
  text: |
    **Polynesierna** genomförde en av historiens mest imponerande utvandringar. Deras förfäder kom från Taiwan och Sydostasien och hade omkring 900 f.Kr. nått Fiji, Tonga och Samoa. Där stannade de i nästan 2 000 år. Sedan, omkring 1000–1200 e.Kr., spred de sig snabbt över östra Stilla havet.

    På några hundra år nådde de Sällskapsöarna (Tahiti), Hawaii, Påskön och slutligen [Nya Zeeland omkring 1250–1300](#maori-bosatter-nya-zeeland-12501300), där de blev **maorier**. Den polynesiska triangeln, med Hawaii, Påskön och Nya Zeeland i hörnen, är omkring 10 000 km bred – mer än avståndet Stockholm–Peking. Man seglade i dubbelkanoter, upp till 20 meter långa, med familjer, grisar, hundar, höns och växter. [Navigationen skedde utan instrument](#polynesisk-navigation-efter-stjarnor-och): med stjärnor, dyningar, molnformationer och fåglars flykt.

    Polynesierna nådde troligen också Sydamerika: sötpotatis, en amerikansk gröda, fanns i Polynesien före européerna, och DNA-studier visar kontakter omkring 1200. Jämför med [vikingarna i Nordatlanten](#leif-eriksson-nar-vinland-1000) vid samma tid – två folk som samtidigt utforskade enorma hav med segelbåtar, flera hundra år före de europeiska upptäcktsresorna.

polynesisk-navigation-efter-stjarnor-och:
  period: 1020
  label: "Polynesisk navigation efter stjärnor och dyningar"
  title: "Polynesisk navigation"
  wiki:
    - "en:Polynesian navigation"
    - "en:Hōkūleʻa"
  text: |
    **Polynesierna** befolkade den största delen av Stilla havet – ett område större än alla världsdelar tillsammans – utan kompass eller karta. De seglade i stora dubbelkanoter (två skrov förbundna med ett däck), uppemot 20 meter långa, som kunde bära familjer, grisar, hundar, höns och plantor.

    Navigatörer lärde sig utantill i vilken punkt på horisonten hundratals stjärnor går upp och ner. De läste *dyningar* – långa vågor från avlägsna stormar – och hur de bröts mot öar bortom synhåll, kände dem genom skrovet, och följde fåglar som flyger ut till havs på morgonen och tillbaka till land på kvällen. Moln som samlas över öar var ytterligare en ledtråd.

    Avstånden var enorma: Tahiti–Hawaii är cirka 4 000 km. Som jämförelse var vikingarnas överfart från Norge till Island cirka 1 000 km. 1976 seglade kanoten Hōkūleʻa från Hawaii till Tahiti med enbart traditionell navigation och visade att metoderna fungerar. Se även [polynesiernas expansion österut](#polynesier-sprider-sig-osterut-i-stilla).

polynesiska-kolonier-pa-hawaii-och:
  period: 1040
  label: "Polynesiska kolonier på Hawaii och Tahiti"
  title: "Polynesierna bosätter Hawaii och Tahiti"
  wiki:
    - "en:Settlement of Polynesia"
    - "sv:Polynesien"
  text: |
    **Polynesierna** härstammar från folk som för cirka 3 000 år sedan seglade från Sydostasien ut i Stilla havet och nådde Samoa och Tonga (Lapitakulturen). Där stannade expansionen i över tusen år. Sedan kom en ny våg av långväga resor.

    Nyare dateringar med kol-14 (radiokol) tyder på att Sällskapsöarna, där Tahiti ligger, befolkades kring 1000–1100, och att Hawaii, Påskön och [Nya Zeeland](#maori-bosatter-nya-zeeland-12501300) befolkades snabbt därefter, mellan cirka 1000 och 1300. Tidigare trodde man att Hawaii befolkades redan på 300–600-talet, men de äldre dateringarna har ifrågasatts. Det exakta förloppet är fortfarande omdiskuterat.

    Varför det spelar roll: inom några hundra år hade polynesierna bosatt en triangel av öar med sidor på cirka 8 000 km – Hawaii, Nya Zeeland och Påskön. De tog med sig taro, grisar, hundar och höns. Sötpotatisen kommer från Sydamerika, vilket tyder på att polynesier nådde dit före [Columbus](#columbus-1492). Jämför med [vikingarna, som nådde Nordamerika cirka år 1000](#vikingar-i-l-anse-aux-meadows).

maori-bosatter-nya-zeeland-12501300:
  period: 1240
  label: "Maori bosätter Nya Zeeland (~1250–1300)"
  title: "Maorierna bosätter Nya Zeeland ~1250–1300"
  wiki:
    - "sv:Maorier"
    - "en:Settlement of New Zealand"
    - "en:Moa"
  text: |
    Nya Zeeland var en av de sista stora landmassorna i världen som människor nådde. De första bosättarna var **polynesier** – ett sjöfolk som under ca 3 000 år spritt sig österut över Stilla havet, ö för ö. De kom i dubbelskrovade segelkanoter från östra Polynesien (Sällskapsöarna eller Cooköarna), en resa på uppemot 3 000–4 000 km över öppet hav. Man navigerade efter stjärnor, dyningar, fåglar och moln.

    Dateringen har diskuterats länge. Radiokoldatering av bl.a. gnagspår från polynesiska råttor (som följde med i kanoterna) visar nu att bosättningen skedde omkring 1250–1300, inte runt år 800 som man förr trott. Maoriernas traditioner talar om ett antal kanoter (*waka*) som kom, och många maorier härleder sin släkt till en viss kanot. De första bosättarna var troligen några hundra.

    Landet saknade landlevande däggdjur förutom fladdermöss. Bosättarna jagade *moa*, flygoförmögna fåglar på upp till 3,6 m och 200 kg; inom ca 100–150 år var alla moa-arter utrotade. Det är ett av de snabbaste kända exemplen på människans påverkan på en ny miljö. Jämför med Island, bosatt ca 870 – en liknande sen kolonisering av en avlägsen ö. Den förste europé som såg landet var [Abel Tasman 1642](#tasman-tasmanien-nya-zeeland-1642).

maori:
  period: 1260
  label: "Maori"
  title: "Maoriernas tidiga samhälle"
  wiki:
    - "sv:Maorier"
    - "en:History of the Māori"
  text: |
    Efter att polynesiska sjöfarare bosatt Nya Zeeland omkring 1250–1300 (se ”[Maori bosätter Nya Zeeland](#maori-bosatter-nya-zeeland-12501300)”) anpassade de sig till ett helt nytt land. Det var mycket större och kallare än de tropiska öar de kom från: Nya Zeeland är ca 270 000 km², ungefär 60 % av Sveriges yta, medan Tahiti är drygt 1 000 km². Flera tropiska grödor, som brödfrukt och kokospalm, växte inte där. Sötpotatis (*kūmara*) gick att odla på Nordön, med lagring i gropar över vintern.

    De första generationerna levde mycket på jakt: på *moa* (stora flygoförmögna fåglar), sälar och fåglar. När moan utrotats inom ca 100–150 år och sälkolonierna minskat övergick samhället till mer jordbruk, fiske och insamling, särskilt av rötter från ormbunken *aruhe*. Långväga kontakt med övriga Polynesien upphörde efter några generationer.

    Namnet *Māori* betyder ungefär ”vanlig” eller ”infödd” och började användas om folket först efter européernas ankomst. Samhället byggdes kring *iwi* (stammar) och *hapū* (klaner), och senare befästa byar på kullar, *pā*, som tyder på ökande konflikter om mark. När européer kom på allvar (efter James Cook 1769) fanns uppskattningsvis 100 000 maorier.

