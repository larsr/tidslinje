inka-vid-cuzco:
  period: 1200
  label: "Inka vid Cuzco"
  title: "Inka vid Cuzco"
  wiki:
    - "sv:Inkariket"
    - "en:Kingdom of Cusco"
  text: |
    Omkring år 1200 bosatte sig ett litet folk i dalen kring **Cuzco**, på
    cirka 3 400 meters höjd i Anderna i dagens Peru. Enligt deras egna
    legender leddes de av grundaren Manco Cápac. Ordet *inka* betydde
    ursprungligen härskaren och hans släkt, och används i dag för hela
    folket och riket.

    Under de första 200 åren var inkafolket bara en av många små stater i
    området och slogs med grannarna. Större riken i regionen fanns redan,
    som [Chimú](#chimu) vid kusten. Inget skriftspråk fanns; information
    lagrades i *quipu*, knutna snören som kodade tal i ett decimalsystem –
    en sorts fysisk databas.

    Den stora expansionen började först omkring 1438 under
    [Pachacuti](#pachacuti-bygger-inkariket-1438). På mindre än hundra år
    byggde inkafolket Amerikas största rike, från Ecuador till Chile, med
    uppskattningsvis 10 miljoner invånare och omkring 40 000 km vägar. Det
    föll för spanjoren [Francisco Pizarro
    1532](#pizarro-tar-inkariket-1532), med hjälp av inbördeskrig och
    [smittkoppor](#smittkoppor-dodar-miljoner-i-amerika).

inka:
  period: 1220
  label: "Inka"
  title: "Inkafolket i början"
  wiki:
    - "sv:Inkariket"
    - "en:Kingdom of Cusco"
  text: |
    Kring 1200 var inkafolket en liten grupp i dalen kring **Cusco**, högt
    i Anderna i dagens Peru (ca 3 400 m ö.h.). Enligt deras egna
    berättelser grundades staden av **Manco Cápac**, son till solen, som
    kom upp ur Titicacasjön. Det är myt; arkeologiskt var Cusco under
    1200-talet ett av många småriken som stred med grannarna om mark och
    vatten.

    Bakgrunden var att två stora andinska kulturer – [Wari och
    Tiwanaku](#tiwanaku-och-wari-upploses) – hade fallit sönder omkring
    1000–1100, kanske delvis på grund av torka. Det lämnade ett tomrum av
    småstater. *Inka* betydde ursprungligen härskaren, och senare den
    härskande gruppen; vi använder ordet för hela folket och riket.

    Den stora expansionen kom först med **Pachacútec** [från
    1438](#pachacuti-bygger-inkariket-1438). På under hundra år byggde
    inkafolket det största riket i Amerika: uppskattningsvis 10–12
    miljoner invånare längs en 4 000 km lång sträcka av Anderna, med ett
    vägnät på ca 40 000 km, men utan hjul för transport och utan skrift
    (de använde knutsnören, *quipu*, för bokföring). Riket föll för
    [Pizarros 168 spanjorer 1532–33](#pizarro-tar-inkariket-1532),
    försvagat av inbördeskrig och smittkoppor.

