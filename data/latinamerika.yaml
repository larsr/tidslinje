chimu-chan-chan:
  period: 1100
  label: "Chimú: Chan Chan"
  title: "Chimúriket och Chan Chan"
  wiki:
    - "en:Chimú culture"
    - "en:Chan Chan"
  text: |
    **Chimú** var ett rike på Perus norra kust, i en extremt torr
    ökenremsa mellan Anderna och Stilla havet. [Det växte fram omkring år
    900](#chimu-riket-framvaxer-i-peru) och blev under 1300-talet den
    största staten i Sydamerika före inkariket, med en kust på omkring 1
    000 km. Jordbruket byggde helt på konstbevattning: kanaler ledde
    vatten från floderna som rinner ner från Anderna, en av dem nästan 80
    km lång.

    Huvudstaden **Chan Chan**, nära dagens Trujillo, var den största
    staden byggd av soltorkat lertegel (adobe) i Amerika och täckte
    omkring 20 km². Den hade kanske 30 000–60 000 invånare
    (uppskattningarna varierar). Staden bestod av ett tiotal muromgärdade
    palatskomplex, troligen ett för varje kung: när en kung dog blev hans
    palats hans gravplats och efterträdaren byggde ett nytt.

    Kring 1470 [erövrades Chimú av inkariket](#inka-erovrar-chimu-1470),
    som flyttade dess hantverkare, särskilt guld- och silversmeder, till
    Cusco. Drygt 60 år senare [föll inkariket i sin tur för spanjorerna
    (1532)](#pizarro-tar-inkariket-1532). Chan Chan är i dag världsarv men
    hotas av regn och erosion, eftersom lerteglet löses upp.

