aztekerna-i-mexikodalen:
  period: 1300
  label: "Aztekerna i Mexikodalen"
  title: "Aztekerna kommer till Mexikodalen"
  wiki:
    - "sv:Azteker"
    - "en:Aztecs"
  text: |
    **Aztekerna**, som kallade sig *mexica* (därav namnet Mexiko), var ett
    nahuatltalande folk som enligt sina egna berättelser vandrade söderut
    från ett land i norr, Aztlán. Omkring 1250–1300 kom de till
    **Mexikodalen**, en högslätt på 2 200 meters höjd med en grupp sjöar,
    där dagens Mexico City ligger.

    Dalen var redan tättbefolkad av andra nahuatltalande stadsstater, som
    Azcapotzalco och Culhuacan, som såg på de nyanlända som barbarer.
    Aztekerna tjänade som legosoldater och vasaller, och fördrevs flera
    gånger. Enligt legenden skulle de slå sig ner där de såg en örn
    sittande på en kaktus med en orm i näbben – en bild som idag finns på
    Mexikos flagga.

    De hamnade på några öar i sjön Texcoco, där de 1325 grundade
    Tenochtitlan ([se det](#tenochtitlan-grundas-1325)). Inom 200 år hade
    de gått från att vara utstötta legosoldater till att styra ett
    imperium med uppskattningsvis 5–6 miljoner undersåtar, som spanjorerna
    under [Cortés erövrade 1519–21](#cortes-landstiger-1519). [Jämför med
    osmanerna](#osmaner-vaxer-i-anatolien), som samtidigt gick från en
    liten gränsstat till ett imperium.

tenochtitlan-grundas-1325:
  period: 1320
  label: "Tenochtitlan grundas 1325"
  title: "Tenochtitlan grundas 1325"
  wiki:
    - "sv:Tenochtitlán"
    - "en:Tenochtitlan"
  text: |
    **Tenochtitlan** var aztekernas huvudstad, grundad enligt traditionen
    1325 på en sumpig ö i sjön Texcoco i Mexikodalen ([se Aztekerna i
    Mexikodalen](#aztekerna-i-mexikodalen)). Platsen valdes, enligt
    legenden, där man såg en örn på en kaktus – men i praktiken var det
    ett av få lediga ställen; marken runt sjön ägdes av mäktigare
    stadsstater.

    Aztekerna byggde ut ön med *chinampas* – konstgjorda odlingsbäddar av
    lera och växtmaterial i det grunda vattnet, som gav flera skördar per
    år. Staden förbands med fastlandet genom flera kilometer långa
    vägbankar, och en akvedukt förde in färskvatten. I centrum stod Templo
    Mayor, den stora pyramiden för krigsguden Huitzilopochtli och
    regnguden Tlaloc.

    När spanjorerna under [Hernán Cortés kom dit
    1519](#cortes-landstiger-1519) hade staden uppskattningsvis 200 000
    invånare – större än nästan alla europeiska städer då; Sevilla hade
    kanske 50 000 och Paris 200 000. Spanjorerna jämförde den med Venedig.
    De [förstörde den 1521](#aztekriket-faller-1521) och byggde Mexico
    City ovanpå; sjön har sedan dikats ut. Staden sjunker därför
    fortfarande, på vissa ställen uppskattningsvis 20–50 cm per år.

aztekerna:
  period: 1340
  label: "Aztekerna"
  title: "Aztekerna på 1300-talet"
  wiki:
    - "en:Aztecs"
    - "en:Tenochtitlan"
  text: |
    **Aztekerna**, som kallade sig *mexica*, var ett folk som enligt sina
    egna berättelser vandrat in från norr till Mexikodalen. Där fanns
    redan flera mäktiga stadsstater, och nykomlingarna fick nöja sig med
    en sumpig ö i sjön Texcoco. Enligt traditionen grundade de staden
    **Tenochtitlan** [där år 1325](#tenochtitlan-grundas-1325) – på
    platsen där dagens Mexico City ligger.

    På 1340-talet var aztekerna fortfarande en mindre makt. De tjänade som
    legosoldater åt och betalade tribut till tepanekerna i staden
    Azcapotzalco. De utvecklade samtidigt ett effektivt jordbruk med
    *chinampas* – konstgjorda odlingsbäddar uppbyggda av lera och
    växtmaterial i den grunda sjön, som kunde ge flera skördar per år.

    Först 1428 bröt aztekerna sig loss och bildade
    [trippelalliansen](#aztekisk-trippelallians-1428) med två andra
    städer, vilket blev grunden till Aztekriket. När spanjorerna kom 1519
    kan Tenochtitlan ha haft uppskattningsvis 200 000 invånare – större än
    nästan alla europeiska städer då. [Hernán Cortés erövrade staden
    1521](#aztekriket-faller-1521) med hjälp av tusentals inhemska
    allierade och med smittkoppor, som dödade en stor del av befolkningen.

