# Syd-/Centralamerika
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

tolteker-i-tula:
  period: 1000
  label: "Tolteker i Tula"
  title: "Toltekerna och Tula"
  wiki:
    - "sv:Tolteker"
    - "en:Tula (Mesoamerican site)"
  text: |
    **Toltekerna** var ett folk i centrala Mexiko vars huvudstad **Tula**
    (Tollan) låg cirka 80 km norr om dagens Mexico City. Staden blomstrade
    omkring 950–1150 och kan ha haft 30 000–60 000 invånare. Den fyllde
    det maktvakuum som uppstått efter att den stora staden Teotihuacán
    fallit på 500-talet.

    Mest kända är de så kallade **atlanterna** i Tula: fyra 4,6 meter höga
    stenstatyer av krigare med fjäderkrona och kastvapen, som bar upp
    taket på ett tempel. Toltekerna förknippas med en militaristisk
    kultur, med krigarordnar som jaguarer och örnar, och med kulten av den
    befjädrade ormguden **Quetzalcoatl**. Tula förstördes och övergavs
    omkring 1150–1200.

    Toltekerna blev i efterhand en myt.
    [Aztekerna](#aztekerna-i-mexikodalen), som kom till makten i samma
    område på 1400-talet, såg dem som en guldålderns folk och ordet
    *toltecatl* betydde ”konstnär” eller ”mästare”. Aztekiska härskare
    ville gärna härleda sin släkt från toltekerna. Det är därför svårt att
    skilja verklig historia från senare legender. Starka likheter med
    [Chichén Itzá](#chichen-itza) på Yucatán tyder på nära kontakter
    mellan städerna.

chichen-itza:
  period: 1000
  label: "Chichén Itzá"
  title: "Chichén Itzá"
  wiki:
    - "sv:Chichén Itzá"
  text: |
    **Chichén Itzá** var en mayastad på norra Yucatánhalvön i Mexiko och
    den mäktigaste staden i mayaområdet omkring 900–1100. **Mayafolket**
    hade haft sin klassiska storhetstid med städer som Tikal i de södra
    regnskogarna 250–900, men där kollapsade samhällena under 800-talet,
    troligen på grund av torka, krig och överbefolkning. I norr levde dock
    städer vidare.

    Det mest kända bygget är pyramiden **El Castillo** (tillägnad ormguden
    Kukulkan), 30 meter hög. Den är en stenkalender: fyra trappor med 91
    steg var plus toppen ger 365. Vid vår- och höstdagjämningen bildar
    solljuset en skuggbild av en orm som ”kryper” nedför trappan. I staden
    finns också Mesoamerikas största bollplan, 168 meter lång, där man
    spelade ett rituellt bollspel med gummiboll, och en djup naturlig
    brunn, *cenote*, där människor och föremål offrades.

    Arkitekturen har tydliga likheter med [Tula](#tolteker-i-tula) i
    centrala Mexiko, vilket tyder på kontakter eller inflytande från
    toltekerna. Staden förlorade sin ledande ställning kring 1200. Idag är
    den ett världsarv och besöks av över 2 miljoner turister per år.

tiwanaku-och-wari-upploses:
  period: 1000
  label: "Tiwanaku och Wari upplöses"
  title: "Tiwanaku och Wari upplöses"
  wiki:
    - "sv:Tiwanaku"
    - "en:Wari culture"
  text: |
    I Anderna i Sydamerika fanns före inkariket två stora stater.
    **Tiwanaku** låg vid Titicacasjön i dagens Bolivia, på nästan 3 850
    meters höjd. **Wari** låg i dagens centrala Peru. Båda fanns ungefär
    500–1000 och räknas som Andernas första imperier.

    Tiwanaku var ett religiöst och politiskt centrum med monumentala
    stenbyggnader som Solporten, och upp till uppskattningsvis 10 000–20
    000 invånare i staden. Man odlade på upphöjda fält omgivna av
    vattenkanaler, en teknik som skyddade grödorna mot nattfrost på
    höghöjd. Wari byggde vägar och administrativa centra och använde
    troligen redan *quipu* – knutna snören för att föra räkenskaper, som
    inkafolket senare använde.

    Wari kollapsade omkring 1000 och Tiwanaku omkring 1000–1100. Den
    vanligaste förklaringen är en lång period av torka, som kan avläsas i
    borrkärnor från Andernas glaciärer. Därefter splittrades regionen i
    mindre riken i flera hundra år.
    [Inkariket](#pachacuti-bygger-inkariket-1438), som uppstod på
    1400-talet, ärvde mycket från dem: vägar, administration, quipu och
    mytologi – inkafolket ansåg att världen skapats vid Titicacasjön.

chimu-riket-framvaxer-i-peru:
  period: 1020
  label: "Chimú-riket framväxer i Peru"
  title: "Chimúriket växer fram"
  wiki:
    - "en:Chimú culture"
    - "en:Chan Chan"
  text: |
    **Chimú** var ett rike på Perus norra kust, från cirka 900 till 1470.
    Kusten där är en av världens torraste öknar, korsad av floder från
    Anderna. Chimú byggde bevattningskanaler – en av dem cirka 80 km lång
    – och odlade i floddalarna.

    Huvudstaden **Chan Chan** byggdes av soltorkat lertegel och täckte
    cirka 20 km² – världens största stad i lertegel – med uppskattningsvis
    30 000–60 000 invånare. Den bestod av ett tiotal muromgärdade
    palatsområden, troligen ett för varje kung; när en kung dog blev hans
    palats hans gravplats och efterträdaren byggde ett nytt.

    Varför det spelar roll: Chimú var det största riket i Anderna före
    inkariket, och kontrollerade cirka 1 000 km kust. [Inkaerna erövrade
    Chimú omkring 1470](#inka-erovrar-chimu-1470) och tog över mycket av
    dess hantverk, särskilt guld- och silversmide, och sättet att styra
    ett långsmalt rike. Se [inkariket på
    1400-talet](#pachacuti-bygger-inkariket-1438).

postklassisk-maya:
  period: 1020
  label: "postklassisk Maya"
  title: "Postklassisk mayakultur"
  wiki:
    - "en:Maya civilization"
    - "en:Postclassic Maya"
  text: |
    **Maya** är ett folk i södra Mexiko och Centralamerika som byggt
    städer sedan cirka 1000 f.Kr. Den *klassiska perioden* (cirka 250–900)
    var höjdpunkten, med städer som Tikal och Palenque, stora
    pyramidtempel, ett fullt utvecklat skriftsystem och en avancerad
    kalender med begreppet noll.

    Kring 800–900 övergavs de flesta städerna i det södra låglandet – "den
    klassiska mayakollapsen" – troligen på grund av långvarig torka, krig
    och överbefolkning. Den *postklassiska perioden* (cirka 900–1500) är
    tiden därefter, när tyngdpunkten flyttade norrut till Yucatánhalvön.

    Där blomstrade **[Chichén Itzá](#chichen-itza)**, med den kända
    pyramiden El Castillo, och senare Mayapán. Kulturen var mer inriktad
    på handel längs kusterna med kanoter. Mayafolket försvann inte: i dag
    talar uppskattningsvis 6 miljoner människor mayaspråk.

chimu:
  period: 1040
  label: "Chimú"
  title: "Chimúriket"
  wiki:
    - "en:Chimú culture"
    - "en:Chan Chan"
  text: |
    **Chimú** var ett rike längs Perus norra kust (cirka 900–1470), med
    huvudstaden **[Chan Chan](#chimu-chan-chan)** nära nuvarande Trujillo.
    Kusten är ökentorr, så allt jordbruk byggde på bevattning med vatten
    från Andernas floder. Chimú anlade kanaler som kopplade ihop hela
    floddalar.

    Samhället var strikt uppdelat: en kung som sågs som gudomlig, en adel,
    och en stor klass av hantverkare och bönder. Chimú var berömt för sin
    metallkonst – guld, silver och kopparlegeringar – och sina svarta,
    glänsande keramikkärl. Man dyrkade månen, som ansågs mäktigare än
    solen eftersom den syns både dag och natt.

    Vid 1000-talets mitt höll riket på att expandera från sin kärna i
    Moche-dalen. På sin topp på 1400-talet kontrollerade det cirka 1 000
    km kust. [Inkaerna erövrade Chimú omkring
    1470](#inka-erovrar-chimu-1470), enligt traditionen bland annat genom
    att hota att stänga av vattnet, och flyttade dess hantverkare till
    Cusco.

maya-i-yucatan:
  period: 1040
  label: "Maya i Yucatán"
  title: "Mayakulturen i Yucatán"
  wiki:
    - "sv:Chichén Itzá"
    - "en:Maya civilization"
  text: |
    **Yucatánhalvön** i sydöstra Mexiko blev mayakulturens centrum efter
    att städerna i södra låglandet övergivits kring 800–900 (den klassiska
    mayakollapsen). Halvön är platt kalkberg utan floder; vatten fanns i
    *cenoter* – naturliga brunnar där grottak rasat in.

    Vid den här tiden dominerades halvön av **[Chichén
    Itzá](#chichen-itza)**, som byggts kring en stor cenote. Staden visar
    starka [influenser från centrala Mexiko](#tolteker-i-tula), bland
    annat kulten av den befjädrade ormguden Kukulkán (Quetzalcoatl). Den
    stora stegpyramiden El Castillo har 365 steg totalt, ett per dag i
    solåret, och vid vår- och höstdagjämning bildar skuggorna en orm som
    "kryper" nerför trappan.

    Chichén Itzá försvagades efter cirka 1100, och staden Mayapán tog över
    som maktcentrum cirka 1200–1450. När spanjorerna kom på 1500-talet
    fanns ett tjugotal små mayastater. Den spanska erövringen tog lång
    tid; den sista självständiga mayastaden, Nojpetén i Guatemala, föll
    först 1697.

chachapoya-kuelap:
  period: 1060
  label: "Chachapoya (Kuélap)"
  title: "Chachapoya och fästningen Kuélap"
  wiki:
    - "en:Kuélap"
    - "en:Chachapoya culture"
  text: |
    **Chachapoya** var ett folk i molnskogarna på Andernas östsluttning i
    norra Peru – ett regnigt, dimmigt bergsområde mellan högfjällen och
    Amazonas. Ibland kallas de ”molnkrigarna”. De hade inget skriftspråk
    som vi känner till, och det mesta vi vet kommer från arkeologi och
    spanska krönikor.

    Deras mest kända plats är **Kuélap**, en befäst stad på en bergsrygg
    ca 3 000 meter över havet. Murarna är upp till omkring 19 meter höga
    och omsluter en yta på ungefär 600 × 110 meter, med resterna av över
    400 runda stenhus, ofta dekorerade med sicksack- och rombmönster.
    Byggandet pågick under flera hundra år och platsen var som mest aktiv
    ca 900–1400. Kuélap är alltså flera hundra år äldre än inkornas [Machu
    Picchu (ca 1450)](#machu-picchu-byggs).

    Chachapoya är också kända för sina sarkofager och gravhus placerade på
    svåråtkomliga klipphyllor. Omkring 1470 erövrades de av
    [inkariket](#inka-expanderar), och när spanjorerna kom på 1530-talet
    allierade sig en del av dem med spanjorerna mot inkas. Sedan
    decimerades befolkningen av europeiska sjukdomar.

