# Orienten
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

mahmud-av-ghazni:
  period: 1000
  label: "Mahmud av Ghazni"
  title: "Mahmud av Ghazni"
  wiki:
    - "en:Mahmud of Ghazni"
    - "en:Ghaznavids"
  text: |
    **Mahmud av Ghazni** (971–1030) var härskare 998–1030 över
    **Ghaznaviderriket**, med huvudstad i Ghazni i dagens Afghanistan.
    Ätten härstammade från turkiska slavsoldater som tjänat de persiska
    samaniderna och sedan tagit makten själva – ett vanligt mönster i den
    muslimska världen, där turkiska krigare ofta blev härskare.

    Mahmud var den förste att använda titeln **sultan** (”makthavare”) i
    stor skala, och erkände den abbasidiske kalifen i Bagdad som andlig
    överhöghet. Hans rike sträckte sig vid hans död från östra Iran över
    Afghanistan till Punjab i dagens Pakistan och nordvästra Indien –
    uppskattningsvis 3 miljoner km², motsvarande sex–sju Sverige.

    Han är mest känd för 17 plundringståg in i Indien (se [Indien
    ~1000](#mahmud-av-ghazni-plundrar-nordindien)). Bytet, i form av guld,
    juveler och slavar, gjorde Ghazni till ett lysande kulturcentrum. Vid
    hans hov verkade den persiske skalden Firdausi
    ([Shahnameh](#firdausi-shahnameh-1010)) och lärde
    [al-Biruni](#al-biruni-om-indien), som skrev en av de första
    vetenskapliga beskrivningarna av Indien. Riket förlorade sina västra
    delar till [seldjukerna redan
    1040](#seldjuker-slar-ghaznaviderna-dandanaqan) (se seldjuker).

ibn-sina-avicenna:
  period: 1000
  label: "Ibn Sina (Avicenna)"
  title: "Ibn Sina (Avicenna)"
  wiki:
    - "sv:Avicenna"
  text: |
    **Ibn Sina** (980–1037), i Europa kallad *Avicenna*, var en persisk
    läkare och filosof född nära Buchara i dagens Uzbekistan. Han var ett
    underbarn: enligt hans självbiografi kunde han Koranen utantill som
    tioåring och praktiserade som läkare vid 16. Han levde ett
    kringflackande liv vid olika furstehov i Iran, ibland som minister,
    ibland på flykt eller i fängelse.

    Han skrev uppskattningsvis 200–450 verk. De två viktigaste är
    **[Medicinens kanon](#ibn-sina-medicinens-kanon)** (se ~1020), ett
    uppslagsverk över all dåtida medicin, och **Läkningens bok**, ett
    filosofiskt och vetenskapligt verk som byggde vidare på Aristoteles.
    Han tänkte bland annat kring skillnaden mellan väsen (vad något är)
    och existens (att det finns), en distinktion som senare blev central i
    europeisk filosofi.

    Varför spelar han roll? Genom latinska översättningar på 1100-talet
    blev han en av de viktigaste lärarna för Europas universitet. Hans
    medicinska lärobok användes i utbildningen i Europa fram till
    1600-talet, alltså i över 500 år. Han är ett exempel på hur antik
    grekisk kunskap bevarades och utvecklades i den islamiska världen och
    sedan fördes tillbaka till Europa.

firdausi-shahnameh-1010:
  period: 1000
  label: "Firdausi: Shahnameh 1010"
  title: "Firdausi och Shahnameh – Kungaboken 1010"
  wiki:
    - "sv:Shahnameh"
    - "sv:Firdausi"
  text: |
    **Firdausi** (ca 940–1020) var en persisk skald från Tus i nordöstra
    Iran. Han arbetade i omkring 30 år på **Shahnameh** (”Kungaboken”),
    som blev klar omkring 1010. Det är ett diktverk på ungefär 50 000
    tvåradiga verser – flera gånger längre än Homeros Iliaden – som
    berättar Irans historia från världens skapelse till den
    arabisk-muslimska erövringen på 600-talet.

    Verket blandar myter och historia. Mest känd är hjälten **Rostam** och
    den tragiska berättelsen om hur han i strid dödar sin egen son Sohrab
    utan att veta vem han är. Firdausi tillägnade verket sultan [Mahmud av
    Ghazni](#mahmud-av-ghazni), men enligt legenden fick han bara en
    bråkdel av utlovad betalning – i silver i stället för guld.

    Varför är det viktigt? Efter den arabiska erövringen hade arabiska
    blivit språket för religion och lärdom. Firdausi skrev medvetet på
    persiska med få arabiska lånord och anses ha räddat persiskan som
    litterärt språk och den persiska identiteten. Iranier kan än idag läsa
    honom ungefär som vi läser 1500-talets svenska. Jämför med [Genji
    monogatari](#genji-monogatari-murasaki-shikibu) i Japan samtidigt –
    två stora litterära verk på folkspråk, inte lärdomsspråk.

ibn-sina-medicinens-kanon:
  period: 1020
  label: "Ibn Sina: Medicinens kanon"
  title: "Ibn Sina: Medicinens kanon"
  wiki:
    - "en:The Canon of Medicine"
    - "sv:Avicenna"
  text: |
    **Medicinens kanon** (arabiska *al-Qanun fi al-Tibb*) blev klar
    omkring 1025. Den skrevs av den persiske läkaren och filosofen **Ibn
    Sina**, i Europa kallad Avicenna ([se ~1000](#ibn-sina-avicenna)). Det
    är ett medicinskt uppslagsverk i fem böcker, på omkring en miljon ord,
    som samlade all dåtida kunskap från grekisk, persisk och indisk
    medicin med Ibn Sinas egna erfarenheter.

    Medicinen byggde på den grekiska läran om fyra kroppsvätskor (blod,
    slem, gul och svart galla) vars obalans ansågs ge sjukdom – en teori
    vi idag vet är fel. Men boken innehöll också mycket som håller: att
    tuberkulos smittar, att sjukdomar kan spridas via vatten och jord, och
    beskrivningar av hundratals läkemedel. Ibn Sina föreslog regler för
    hur läkemedel ska prövas: på en ren sjukdom, i rätt dos, upprepat och
    med jämförelse – en tidig föregångare till kliniska prövningar.

    Boken översattes till latin på 1100-talet av [Gerard av Cremona i
    Toledo](#toledo-arabisk-vetenskap-till-latin), och blev den viktigaste
    läroboken vid Europas medicinska fakulteter, som i Montpellier och
    Padua. Den användes i undervisningen fram till omkring 1650 – i över
    600 år. Den trycktes i Europa minst 35 gånger på 1400–1500-talen,
    nästan lika ofta som Bibeln.

al-biruni-om-indien:
  period: 1020
  label: "al-Biruni om Indien"
  title: "al-Biruni beskriver Indien (~1030)"
  wiki:
    - "sv:Al-Biruni"
    - "en:Tarikh al-Hind"
  text: |
    **Al-Biruni** (973–cirka 1050) var en persisk-centralasiatisk lärd
    från Khwarazm (nuvarande Uzbekistan) som skrev på arabiska om
    astronomi, matematik, geografi och religion. Han följde med erövraren
    [Mahmud av Ghazni](#mahmud-av-ghazni) (se [Somnath
    1025](#mahmud-plundrar-somnath-templet-1025)) på hans krigståg in i
    Indien och stannade där i flera år.

    Resultatet blev *Kitab ta'rikh al-Hind* ("Boken om Indien", cirka
    1030), en tjock beskrivning av indisk filosofi, religion, kastsystem,
    kalender, astronomi och matematik. Al-Biruni lärde sig sanskrit för
    att kunna läsa källorna själv, och försökte beskriva hinduismen
    utifrån dess egna texter i stället för att döma den – ovanligt för sin
    tid. Han kallas därför ofta en av de första antropologerna.

    Varför det spelar roll: boken är en av de bästa källorna vi har om
    Indien kring år 1000, och den visar hur kunskap flödade mellan den
    indiska och den islamiska världen. Det decimala positionssystemet med
    nolla, som vi använder i dag, gick just den vägen: från Indien via
    arabiska lärda till Europa (se även [Fibonacci
    ~1200](#fibonacci-liber-abaci-1202)).

seldjuker-slar-ghaznaviderna-dandanaqan:
  period: 1020
  label: "seldjuker slår ghaznaviderna (Dandanaqan 1040)"
  title: "Slaget vid Dandanaqan 1040"
  wiki:
    - "en:Battle of Dandanaqan"
    - "en:Seljuk Empire"
  text: |
    **Seldjukerna** var en turkisk nomadklan från stäpperna öster om
    Kaspiska havet, som hade gått över till islam. **Ghaznaviderna** var
    en annan turkiskättad dynasti, med huvudstad i Ghazni (nuvarande
    Afghanistan), som styrde ett rike från Iran till norra Indien.

    År 1040 möttes de vid Dandanaqan, nära Merv i nuvarande Turkmenistan.
    Ghaznavidernas armé, med tungt infanteri och krigselefanter, var
    uppskattningsvis 50 000 man; seldjukerna hade kanske 16 000 lätta
    ryttare. Seldjukerna nötte ut motståndaren genom att i flera dagar
    avskära vattnet och anfalla med pilbågar från hästryggen, i ökenhetta.
    Ghaznaviderna föll samman.

    Följden blev stor: ghaznaviderna drevs österut mot Indien, och
    seldjukerna tog över Iran. Femton år senare [tog de Bagdad
    (1055)](#seldjuker-tar-bagdad-1055-tughril-sultan) och skapade ett
    rike från Centralasien till Medelhavet. Deras seger över Bysans vid
    [Manzikert 1071](#manzikert-1071-seldjuker-krossar-bysans) öppnade
    Anatolien – nuvarande Turkiet – för turkisk invandring, och var en av
    orsakerna till korstågen.

seldjukriket-grundas:
  period: 1040
  label: "Seldjukriket grundas"
  title: "Seldjukriket grundas"
  wiki:
    - "sv:Seldjuker"
    - "en:Seljuk Empire"
  text: |
    **Seldjukerna** var en klan av **oghuzturkar** – turkisktalande
    nomader från stäpperna kring Aralsjön i Centralasien, uppkallad efter
    stamfadern Seldjuk. De konverterade till sunniislam kring år 1000 och
    flyttade söderut in i Iran.

    Efter segern över ghaznaviderna vid [Dandanaqan
    1040](#seldjuker-slar-ghaznaviderna-dandanaqan) utropade brödraparet
    Tughril och Chaghri sig till härskare över Khorasan (östra Iran). Inom
    30 år styrde seldjukerna ett rike från Afghanistan till Anatolien, med
    huvudstad i bland annat Isfahan. Under sultan [Malik
    Shah](#malik-shah) (1072–1092) och hans minister Nizam al-Mulk nådde
    riket sin topp.

    Varför det spelar roll: seldjukerna förde in turkiska folk som
    härskare i Mellanöstern. Efter slaget vid [Manzikert
    1071](#manzikert-1071-seldjuker-krossar-bysans) bosatte sig turkar i
    Anatolien; därur växte senare Osmanska riket och dagens Turkiet.
    Bysans bad om hjälp från väst, vilket blev startpunkten för [korstågen
    (1095)](#paven-utlyser-korstag-i-clermont-1095).

omar-khayyam-fodd-1048:
  period: 1040
  label: "Omar Khayyam född 1048"
  title: "Omar Khayyam (1048–1131)"
  wiki:
    - "sv:Omar Khayyam"
  text: |
    **Omar Khayyam** var en persisk matematiker, astronom och poet, född i
    Nishapur i nordöstra Iran 1048.

    Som matematiker löste han
    *[tredjegradsekvationer](#omar-khayyam-tredjegradsekvationer-loses)*
    (ekvationer med x³) geometriskt, genom att skära kägelsnitt – kurvor
    som parabler och cirklar – med varandra. Det var mer än 400 år före
    den [algebraiska lösningen i Italien på
    1500-talet](#tartaglia-och-cardano). Han ledde också en grupp
    astronomer åt seldjuksultanen Malik Shah som tog fram
    **[Jalali-kalendern](#omar-khayyams-kalender)** (1079), vars
    skottårsregler gav en årslängd som var minst lika exakt som den
    [gregorianska kalender](#gregorianska-kalendern-1582) Europa
    införde 1582. En efterföljare till den används fortfarande i Iran.

    I väst är han mest känd som poet för *Rubáiyát*, fyraradiga dikter om
    vin, vänskap och livets korthet. De blev berömda i Europa genom Edward
    FitzGeralds fria engelska översättning 1859. Hur många av dikterna
    Khayyam själv skrev är osäkert.

malik-shah:
  period: 1060
  label: "Malik Shah"
  title: "Malik Shah – seldjukrikets höjdpunkt"
  wiki:
    - "en:Malik-Shah I"
    - "en:Seljuk Empire"
  text: |
    **Malik Shah I** var sultan av seldjukriket 1072–1092. Seldjukerna var
    en turkisk dynasti från Centralasien som erövrat Iran och Irak; titeln
    sultan betydde ungefär ”den som har makten”, medan kalifen i Bagdad
    behöll den religiösa ledarrollen. Malik Shah var son till Alp Arslan,
    segraren vid [Manzikert
    1071](#manzikert-1071-seldjuker-krossar-bysans).

    Under honom nådde riket sin största utbredning: från Syrien och
    Anatolien i väster till Kashgar i dagens västra Kina – ungefär 4 000
    km. Huvudstaden var **Isfahan** i Iran, där stora delen av
    Fredagsmoskén byggdes. Det verkliga styret sköttes av hans persiske
    vesir (förste minister) Nizam al-Mulk.

    Tre saker förknippas med hans tid: [Nizam al-Mulks statliga
    skolor](#nizam-al-mulk-grundar-madrasor) (madrasor), [Omar Khayyams
    nya kalender](#omar-khayyams-kalender), och att [riket splittrades
    direkt efter hans död 1092](#seldjukriket-splittras-1092) när sönerna
    började slåss om arvet. Den splittringen gjorde Mellanöstern sårbart
    när korsfararna kom bara fem år senare.

nizam-al-mulk-grundar-madrasor:
  period: 1060
  label: "Nizam al-Mulk grundar madrasor"
  title: "Nizam al-Mulk och madrasorna"
  wiki:
    - "en:Nizam al-Mulk"
    - "en:Al-Nizamiyya of Baghdad"
  text: |
    **Nizam al-Mulk** (1018–1092) var persisk vesir – förste minister – åt
    seldjuksultanerna i nästan 30 år och i praktiken rikets verklige
    styresman. Han skrev också en handbok i statskonst, *Siyasatnama*
    (”Boken om regerandet”).

    Hans mest bestående verk var **Nizamiyya-skolorna**: ett nätverk av
    **madrasor**, alltså högre skolor i islamisk rätt och teologi, i bl.a.
    Bagdad (öppnad 1067), Nishapur och Isfahan. Det nya var att de var
    statligt finansierade genom stiftelser, hade avlönade lärare och gav
    studenterna stipendier och bostad. Syftet var både att utbilda
    tjänstemän och domare och att stärka den sunnitiska läran mot den
    shiitiska propaganda som spreds från fatimiderna i Kairo.

    Den berömde teologen al-Ghazali undervisade vid skolan i Bagdad.
    Modellen spreds över hela den muslimska världen. Jämför med Europa,
    där [universitetet i Bologna](#universitetet-i-bologna-1088)
    (traditionellt 1088) växte fram ungefär samtidigt men som en
    självstyrande sammanslutning av studenter snarare än en statlig
    institution. Nizam al-Mulk mördades 1092, traditionellt av en assassin
    (se [assassinerna tar Alamut 1090](#assassinerna-tar-alamut-1090)).

omar-khayyams-kalender:
  period: 1060
  label: "Omar Khayyams kalender"
  title: "Omar Khayyams kalender 1079"
  wiki:
    - "en:Jalali calendar"
    - "sv:Omar Khayyam"
  text: |
    **[Omar Khayyam](#omar-khayyam-fodd-1048)** (1048–1131) var persisk
    matematiker och astronom – i Väst mest känd som poet. Sultan [Malik
    Shah](#malik-shah) gav honom och några kollegor i uppdrag att bygga
    ett observatorium i Isfahan och skapa en ny kalender. Resultatet,
    **Jalali-kalendern**, infördes 1079.

    Problemet var detsamma som för alla kalendrar: ett solår är inte ett
    helt antal dagar utan cirka 365,2422 dagar. Den islamiska månkalendern
    har bara 354 dagar och driver därför genom årstiderna, vilket är
    opraktiskt för skatteuppbörd från skördar. Khayyams kalender följde
    solen och började året vid vårdagjämningen (det persiska nyåret,
    nouruz), med skottdagar insatta efter observationer och regler.

    Den var mer exakt än den julianska kalendern som Europa använde (fel
    på en dag per cirka 128 år) och i klass med den [gregorianska
    kalendern](#gregorianska-kalendern-1582) från 1582 (en dag per cirka 3
    000 år). Dagens iranska kalender bygger fortfarande på den. Jämför:
    Sverige bytte till gregoriansk kalender först 1753, efter ett
    misslyckat försök med en ”svensk kalender” som gav oss 30
    februari 1712.

seldjukriket-splittras-1092:
  period: 1080
  label: "Seldjukriket splittras 1092"
  title: "Seldjukriket splittras 1092"
  wiki:
    - "sv:Seldjuker"
    - "en:Seljuk Empire"
  text: |
    Det **Stora seldjukriket** var ett turkiskt rike som på 1000-talet
    erövrat Iran, Irak, Syrien och stora delar av Anatolien och
    Centralasien. Under sultan [Malik Shah](#malik-shah) (se Malik Shah)
    sträckte det sig ca 4 000 km från Medelhavet till Kina.

    1092 föll allt samman på några månader. Först mördades vesiren **Nizam
    al-Mulk**, den skicklige minister som i praktiken skött riket i 30 år
    – traditionellt av en [assassin](#assassinerna-tar-alamut-1090). En
    månad senare dog Malik Shah själv, bara 37 år gammal. Seldjukerna hade
    ingen fast tronföljdsordning: riket sågs som släktens gemensamma
    egendom. Hans söner, bröder och kusiner började ett inbördeskrig som
    pågick i över ett decennium.

    Resultatet blev en rad halvt självständiga riken:
    [Rum-sultanatet](#rum-sultanatet-i-anatolien) i Anatolien, separata
    furstar i Damaskus och Aleppo, och lokala styresmän (atabeger –
    förmyndare åt unga prinsar, som tog makten själva). Denna splittring
    var en huvudorsak till att det första korståget kunde lyckas bara sju
    år senare. Endast sultan Sanjar (se [Sultan Sanjar](#sultan-sanjar))
    lyckades senare återställa en del av rikets glans i öster.

assassinerna-tar-alamut-1090:
  period: 1080
  label: "assassinerna tar Alamut 1090"
  title: "Assassinerna tar Alamut 1090"
  wiki:
    - "sv:Assassiner"
    - "en:Alamut Castle"
  text: |
    **Nizariterna** var en gren av ismailiterna, en shiamuslimsk rörelse.
    Deras ledare **Hasan-i Sabbah** tog 1090 genom infiltration och utan
    strid över **Alamut**, en bergsfästning ca 2 100 meter över havet i
    Elburzbergen i norra Iran. Därifrån byggde han ett nätverk av fästen i
    Iran och senare Syrien.

    Eftersom de var för få för att möta seldjukernas arméer i öppen strid
    använde de en annan metod: riktade mord på ledare som var fientliga
    mot dem, ofta offentligt och med dolk, utförda av tillgivna anhängare
    (*fida'i*) som räknade med att själva dö. Det mest berömda offret var
    vesiren [Nizam al-Mulk](#nizam-al-mulk-grundar-madrasor) 1092. Hotet
    räckte ofta: sultaner och emirer avstod från angrepp av rädsla för att
    bli nästa offer.

    Fiender kallade dem *hashishiyya*, ett skällsord ungefär ”pack”. Via
    korsfararna blev det vårt ord **assassin** (mördare); berättelserna om
    att de drogades med hasch är troligen myt. [Mongolerna intog Alamut
    1256](#mongoler-forstor-bagdad-1258) och förstörde det berömda
    biblioteket. Nizariternas efterföljare finns kvar idag, och Aga Khan
    är deras ledare.

sultan-sanjar:
  period: 1100
  label: "Sultan Sanjar"
  title: "Sultan Sanjar"
  wiki:
    - "en:Ahmad Sanjar"
    - "en:Battle of Qatwan"
  text: |
    **Ahmad Sanjar** (1086–1157) var son till sultan [Malik
    Shah](#malik-shah) av seldjukriket (en turkisk dynasti som styrt Iran
    och Irak). Efter att riket [splittrats
    1092](#seldjukriket-splittras-1092) blev han 1097 guvernör i
    **Khorasan** – det stora området i östra Iran, Afghanistan och
    Turkmenistan – med huvudstad i Merv. Från 1118 var han överhuvud för
    hela seldjukdynastin.

    Han styrde i ca 60 år och var den siste store seldjuksultanen. Han
    gjorde östra delen av riket till ett nytt centrum och var beskyddare
    av lärda och poeter; Merv var en av världens största städer med kanske
    200 000 invånare. Han tvingade Ghaznaviderna i Afghanistan och
    karakhaniderna i Centralasien att bli hans vasaller.

    Men 1141 krossades hans armé vid **Qatwan** nära Samarkand av **Kara
    Khitai**, ett folk från norra Kina som drivits västerut av
    Jurchen-folket (se [Jurchen grundar Jin
    1115](#jurchen-grundar-jin-1115)). Det var första gången ett
    icke-muslimskt rike besegrat ett stort islamiskt rike i Centralasien.
    Ryktet om att en kristen kung, ”Prästkonungen Johannes”, besegrat
    muslimerna spreds till Europa. 1153 tillfångatogs Sanjar av upproriska
    oghuz-nomader. Hans död 1157 markerade slutet på det stora
    seldjukriket.

omar-khayyam:
  period: 1100
  label: "Omar Khayyam"
  title: "Omar Khayyam"
  wiki:
    - "sv:Omar Khayyam"
    - "en:Rubaiyat of Omar Khayyam"
  text: |
    **Omar Khayyam** (1048–1131) var en persisk matematiker, astronom och
    filosof från Nishapur i nordöstra Iran. Han arbetade vid
    seldjuksultanernas hov och ledde arbetet med den nya Jalali-kalendern
    1079 (se [Omar Khayyams kalender](#omar-khayyams-kalender)).

    Som matematiker skrev han ett verk om algebra där han systematiskt
    klassificerade
    **[tredjegradsekvationer](#omar-khayyam-tredjegradsekvationer-loses)**
    (ekvationer med x³) och löste dem geometriskt, genom att hitta
    skärningspunkter mellan kurvor som cirklar och hyperbler. [Allmänna
    algebraiska lösningsformler hittades först av italienare på
    1500-talet](#tartaglia-och-cardano). Han studerade också [Euklides
    parallellpostulat](#omar-khayyam-om-parallellaxiomet) – frågan om man
    kan bevisa att parallella linjer aldrig möts – och hans resonemang
    pekar mot det som på 1800-talet blev icke-euklidisk geometri.

    I Väst är han dock mest känd som poet. *Rubaiyat* är fyraradiga dikter
    som tillskrivs honom, om vin, kärlek, tidens förgänglighet och tvivel
    på religiösa sanningar. De blev världsberömda genom Edward FitzGeralds
    fria engelska översättning 1859. Hur många av dikterna han faktiskt
    skrev är oklart. Kombinationen matematiker och poet gör honom till en
    symbol för den persiska vetenskapliga guldåldern.

khwarezm-vaxer:
  period: 1120
  label: "Khwarezm växer"
  title: "Khwarezm växer"
  wiki:
    - "sv:Khwarezm"
    - "en:Khwarazmian Empire"
  text: |
    **Khwarezm** är en bördig oas kring floden Amu Darjas nedre lopp söder
    om Aralsjön, i dagens Uzbekistan och Turkmenistan. Området hade
    urgammal bevattningskultur och låg vid sidenvägen, handelsnätet mellan
    Kina och Medelhavet. Matematikern al-Khwarizmi (vars namn gav oss
    ordet algoritm) hette så för att hans släkt härstammade härifrån.

    På 1100-talet styrdes området av en turkisk dynasti som var vasaller
    (underlydande) till seldjukerna, den turkiska stormakt som behärskade
    Iran och Mellanöstern. Härskaren kallades *khwarezmshah*, kung av
    Khwarezm. Under **Atsiz** (1127–56) började man bryta sig loss och
    utvidga riket, medan seldjukriket försvagades.

    Det som började som en provins blev runt år 1200 ett imperium från
    Kaspiska havet till Afghanistan (se
    [Khwarezmshahen](#khwarezmshahen)). Den växande makten fick ett
    dramatiskt slut: 1218 lät en khwarezmisk guvernör döda en
    handelskaravan från Djingis khan, och [mongolernas hämnd
    1219–21](#krossar-khwarezm-1219) krossade riket och förstörde städer
    som Buchara och Samarkand. Det var mongolernas första stora erövring
    utanför Östasien och öppnade vägen västerut mot Ryssland och
    Mellanöstern.

ghuriderna-i-afghanistan:
  period: 1140
  label: "Ghuriderna i Afghanistan"
  title: "Ghuriderna i Afghanistan"
  wiki:
    - "en:Ghurid dynasty"
    - "en:Minaret of Jam"
  text: |
    **Ghuriderna** var en dynasti från **Ghor**, ett svårtillgängligt
    bergsområde i centrala Afghanistan. De var troligen av östiransk
    (tadzjikisk) härkomst och hade länge varit vasaller (underlydande)
    till [ghaznaviderna](#ghaznavider-i-punjab), en turkisk dynasti som
    från staden Ghazni styrt Afghanistan och delar av norra Indien.

    Efter en konflikt där ghaznaviderna dödade två ghuridiska bröder
    hämnades den tredje, **Ala al-Din Husayn**, år 1150: han intog Ghazni
    och lät bränna staden i sju dagar, vilket gav honom tillnamnet
    *Jahan-suz*, ”världsbrännaren”. Därefter växte ghuridriket snabbt. Ett
    känt minnesmärke är den 65 meter höga minareten i Jam, från omkring
    1190, världens näst högsta tegelminaret och i dag världsarv.

    Under bröderna Ghiyath al-Din och Muhammad av Ghor (från 1170-talet)
    vände sig riket mot Indien. Muhammad besegrade de hinduiska
    rajputkungarna i [andra slaget vid Tarain
    1192](#ghurider-vid-tarain-1192-tar-delhi) och erövrade norra Indien
    (se [Ghurider på väg](#ghurider-pa-vag)). Efter hans död 1206 grundade
    hans turkiska slavgeneral Qutb ud-Din Aibak
    [Delhisultanatet](#delhisultanatet-1206), som blev början på över 600
    år av muslimskt styre i norra Indien, fram till mogulrikets slut.

khwarezmshahen:
  period: 1160
  label: "Khwarezmshahen"
  title: "Khwarezmshahen – från vasall till stormakt"
  wiki:
    - "en:Khwarazmian Empire"
    - "en:Ala al-Din Tekish"
  text: |
    **Khwarezmshah** (kung av Khwarezm) var titeln för härskarna i
    Khwarezm, en oas söder om Aralsjön i dagens Uzbekistan (se [Khwarezm
    växer](#khwarezm-vaxer)). Dynastin var turkisk och hade varit vasaller
    till seldjukerna, den turkiska stormakten i Iran.

    Seldjukriket föll sönder efter [sultan Sanjars](#sultan-sanjar) död
    1157, och khwarezmshahen **Il-Arslan** (1156–72) och hans son
    **Tekish** (1172–1200) utnyttjade tomrummet. Tekish besegrade 1194 den
    siste seldjukiske sultanen i Iran och tog västra Iran. Samtidigt
    betalade Khwarezm länge tribut till Qara Khitai, ett rike i
    Centralasien grundat av flyktingar från norra Kina. Hans son
    **Muhammad II** (1200–20) erövrade sedan
    [ghuridernas](#ghuriderna-i-afghanistan) Afghanistan och Transoxanien
    med Samarkand och Buchara, och gjorde riket till den största muslimska
    makten i öster, från Kaspiska havet till Indus.

    Men riket var ungt och splittrat, och Muhammad litade inte på sina
    generaler. När hans guvernör i Otrar 1218 lät döda en handelskaravan
    från Djingis khan, och Muhammad dessutom dödade ett mongoliskt
    sändebud, kom [mongolernas motattack 1219](#krossar-khwarezm-1219).
    Riket föll på två år och städer som Buchara, Samarkand och Merv
    förstördes, med dödstal som uppskattas till hundratusentals.

muhammad-av-ghor:
  period: 1180
  label: "Muhammad av Ghor"
  title: "Muhammad av Ghor"
  wiki:
    - "en:Muhammad of Ghor"
  text: |
    **Muhammad av Ghor** (Mu'izz ad-Din, ca 1149–1206) var sultan i
    Ghuridriket, en dynasti från de afghanska bergen (se
    ”[Ghurider](#ghurider)”). Han delade makten med sin äldre bror Ghiyath
    al-Din, som styrde västerut mot Iran, medan Muhammad hade Ghazni som
    bas och vände sig österut mot Indien.

    Han erövrade Multan 1175 och Lahore 1186. 1191 besegrades han av en
    koalition av hinduiska rajputkungar under Prithviraj Chauhan vid
    Tarain, men kom tillbaka året efter och vann (se ”[Ghurider vid Tarain
    1192](#ghurider-vid-tarain-1192-tar-delhi)”). Därmed öppnades vägen
    till Gangesslätten. Hans generaler tog Delhi, Bihar och Bengalen
    kring 1200.

    Muhammad mördades 1206, och hans före detta slav och general **Qutb
    ud-Din Aibak** grundade då [Delhisultanatet](#delhisultanatet-1206)
    (se detta). Muhammad har därmed en roll i Indiens historia ungefär som
    [Vilhelm Erövraren](#vilhelm-erovraren) i Englands: den som inledde
    ett nytt främmande styre som formade landet i sekler.

djingis-khan-1206:
  period: 1200
  label: "Djingis khan 1206"
  title: "Djingis khan 1206"
  wiki:
    - "sv:Djingis khan"
    - "en:Genghis Khan"
  text: |
    **Temüdjin** (ca 1162–1227) föddes på de mongoliska stäpperna norr om
    Kina, där nomadiska stammar levde av hästar, får och boskap och
    ständigt krigade med varandra. Hans far förgiftades när han var
    omkring nio år, och familjen levde en tid i fattigdom. Genom allianser
    och krig enade han stammarna, och vid ett stort rådsmöte (*kurultai*)
    1206 utropades han till **Djingis khan**, ungefär ”universell
    härskare”.

    Han organiserade armén i decimala enheter om 10, 100, 1 000 och 10 000
    man, delvis tvärs över stamgränserna för att bryta gamla lojaliteter,
    och befordrade efter förmåga snarare än börd. Mongolernas armé var
    helt beriden; varje krigare hade flera hästar och kunde förflytta sig
    långt, ibland uppskattningsvis 100 km per dag. Han införde ett
    skriftspråk och ett kurirsystem med reläposter.

    [Från 1211 anföll han Jinriket](#mongoler-anfaller-jin-1211) i norra
    Kina och [1219 Khwarezm](#krossar-khwarezm-1219) i Centralasien (se
    dessa). Erövringarna kostade miljoner liv. Hans efterträdare skapade
    världshistoriens största sammanhängande landrike, från Korea till
    Ungern. Rikets vägar [öppnade
    sidenvägen](#pax-mongolica-oppnar-sidenvagen) för resenärer som [Marco
    Polo](#marco-polo).

krossar-khwarezm-1219:
  period: 1200
  label: "krossar Khwarezm 1219"
  title: "Mongolerna krossar Khwarezm 1219–21"
  wiki:
    - "en:Mongol invasion of the Khwarazmian Empire"
    - "en:Khwarazmian Empire"
  text: |
    **Khwarezm** var ett muslimskt rike i Centralasien och Iran, [styrt av
    shah Muhammad II](#khwarezmshahen), med rika handelsstäder längs
    sidenvägen som Samarkand, Buchara, Merv och Nishapur. Det var vid
    denna tid ett av de största rikena i den muslimska världen.

    1218 skickade [Djingis khan](#djingis-khan-1206) en handelskaravan på
    omkring 450 man; guvernören i gränsstaden Otrar lät döda dem som
    spioner. När Djingis sände sändebud för att kräva ersättning lät
    shahen döda eller förödmjuka dem. Svaret var invasion 1219 med en armé
    på uppskattningsvis 100 000–150 000 man.

    Under tre år förstördes riket systematiskt. Städer som gjorde motstånd
    utplånades; krönikor talar om hundratusentals döda i städer som Merv
    och Nishapur, siffror som sannolikt är överdrivna men speglar en
    massförstörelse. Bevattningssystem förstördes och vissa regioner
    återhämtade sig inte på århundraden. Shahen flydde och dog på en ö i
    Kaspiska havet. Jämför med Europa: [1241 nådde mongolerna Polen och
    Ungern](#mongoler-i-polen-och-ungern-1241).

mongoler-forstor-samarkand-merv:
  period: 1220
  label: "Mongoler förstör Samarkand, Merv"
  title: "Mongolerna förstör Centralasiens städer 1219–1221"
  wiki:
    - "en:Mongol invasion of the Khwarazmian Empire"
    - "en:Merv"
    - "sv:Samarkand"
  text: |
    Khwarazmriket var en stormakt som omfattade dagens Uzbekistan,
    Turkmenistan, Afghanistan och Iran. 1218 lät dess guvernör i Otrar
    döda en handelskaravan som Djingis khan sänt, och shahen lät sedan
    döda hans sändebud. Djingis svarade med ett fälttåg 1219–1221 som blev
    ett av de mest förödande i historien.

    **Samarkand**, en av sidenvägens rikaste städer, föll 1220 efter några
    dagar; försvararna dödades och hantverkare fördes bort som slavar.
    **Merv** i dagens Turkmenistan, möjligen en av världens största städer
    vid den tiden, föll 1221. Samtida krönikörer påstår att över en miljon
    människor dödades där – en siffra som är kraftigt överdriven, men
    staden tömdes och återhämtade sig aldrig. Urgentj och Nishapur
    drabbades lika hårt.

    Mongolerna använde terror medvetet: städer som gav upp skonades ofta,
    de som gjorde motstånd utplånades, så att nästa stad skulle
    kapitulera. Lika förödande på sikt var att bevattningssystemen
    (kanaler och underjordiska vattenledningar) förstördes; jordbruket i
    delar av Centralasien och Iran tog sekler att återhämta sig. Samarkand
    byggdes upp igen och blev på 1300-talet [Timur
    Lenks](#timur-lenk-i-samarkand-1370) praktfulla huvudstad.

djingis-dor-1227:
  period: 1220
  label: "Djingis dör 1227"
  title: "Djingis khan dör 1227"
  wiki:
    - "sv:Djingis khan"
    - "sv:Mongoliska riket"
  text: |
    **Djingis khan** (född Temüjin ca 1162) växte upp i fattigdom bland
    stridande mongoliska stammar på stäppen norr om Kina. Genom krig och
    allianser enade han stammarna, och 1206 utropades han till Djingis
    khan, ungefär ”universell härskare”. Han organiserade armén i enheter
    om 10, 100, 1 000 och 10 000 man, oberoende av stamtillhörighet, och
    belönade lojalitet och förmåga snarare än börd.

    Under de följande tjugo åren erövrade han delar av norra Kina,
    Centralasien och delar av Iran. Han dog i augusti 1227 under ett
    fälttåg mot tangutriket Xi Xia i nordvästra Kina. Dödsorsaken är okänd
    – ett fall från hästen nämns i källorna – och graven har aldrig
    hittats.

    Riket delades mellan hans söner, och sonen **Ögedei** valdes till
    storkhan 1229. Erövringarna fortsatte: [Ryssland
    1237–40](#mongolinvasionen-123740), [Bagdad
    1258](#mongoler-forstor-bagdad-1258), [hela Kina
    1279](#song-faller-1279). Omkring 1280 var Mongolväldet det största
    sammanhängande landimperiet i historien, ca 24 miljoner km² – ungefär
    50 gånger Sveriges yta. Det var då i praktiken redan uppdelat i fyra
    khanat (Yuan i Kina, Gyllene horden, Ilkhanatet, Chagatai). Genetiska
    studier tyder på att en betydande andel män i Centralasien härstammar
    från en och samma släktlinje, ofta tolkad som Djingis.

ilkhanatet-hulegu:
  period: 1240
  label: "Ilkhanatet (Hülegü)"
  title: "Ilkhanatet och Hülegü"
  wiki:
    - "sv:Ilkhanatet"
    - "en:Hulagu Khan"
  text: |
    **Hülegü** (ca 1217–1265) var sonson till Djingis khan och bror till
    storkhanerna Möngke och Kublai. Han sändes 1253 västerut för att
    underkuva Iran och Mellanöstern. Han krossade först
    *[assassinerna](#assassinerna-tar-alamut-1090)* – en shiitisk sekt
    (nizariter) som från bergsfästningar i Iran i 150 år hade bedrivit
    politiska mord – och erövrade sedan Bagdad 1258 och en tid stora delar
    av Syrien.

    Hans rike kallas **Ilkhanatet**: *il-khan* betyder ungefär
    ”underordnad khan”, eftersom han formellt var underställd storkhanen.
    Det omfattade dagens Iran, Irak, Azerbajdzjan, större delen av Turkiet
    och delar av Afghanistan och Centralasien. Huvudstäder var Maragha och
    senare Tabriz.

    Ilkhanatet låg i konflikt med två grannar: Mamluksultanatet i Egypten,
    som stoppade mongolerna vid [Ain Jalut
    1260](#ain-jalut-1260-mamluker-stoppar), och Gyllene horden i norr,
    som blev muslimsk och allierade sig med mamlukerna. Ilkhanerna sökte
    därför allianser med Europa och korsfararna, utan resultat. Hülegü var
    själv inte muslim, och hans hustru var nestoriansk kristen. [Kring
    1295 övergick Ilkhanatet till islam](#ilkhan-ghazan-blir-muslim-1295).
    [Det föll sönder efter 1335](#ilkhanatet-faller-1335); dess iranska
    kultur levde vidare.

ilkhanat:
  period: 1260
  label: "Ilkhanat"
  title: "Ilkhanatet i Iran"
  wiki:
    - "sv:Ilkhanatet"
    - "en:Rashid al-Din Hamadani"
  text: |
    **Ilkhanatet** var det mongoliska rike som Hülegü (se ”[Ilkhanatet
    (Hülegü)](#ilkhanatet-hulegu)”) grundade i Iran och Irak efter
    erövringen av Bagdad 1258. Det var ett av fyra khanat som Mongolväldet
    delades i efter storkhanen Möngkes död 1259 – de andra var Yuan i
    Kina, Gyllene horden i Ryssland och Chagatai i Centralasien. Khanaten
    krigade ibland mot varandra; Ilkhanatet och Gyllene horden stred om
    Kaukasus.

    Mongolerna var få och styrde via persiska ämbetsmän, som behöll den
    gamla förvaltningen. Ilkhanerna stod nära Kublai i Kina, och sändebud,
    läkare och lärda reste mellan Tabriz och Peking. Det ledde till ett
    ovanligt kulturutbyte: kinesiska motiv (drakar, fenixar, molnmönster)
    kom in i persisk konst och miniatyrmålning. Vesiren **Rashid al-Din**
    skrev kring 1300 en världshistoria som omfattade Kina, Indien, Europa
    och mongolerna – en av de första i sitt slag.

    Ilkhanatet sökte en allians med Europa mot mamlukerna och skickade
    sändebud till påven och till kungarna av Frankrike och England; ett av
    dem, munken Rabban Sauma, kom till Paris 1287. Alliansen blev aldrig
    verklighet. Efter att khanen Ghazan blev muslim 1295 smälte de
    mongoliska härskarna in i den iranska och islamiska kulturen.

maragha-observatoriet-al-tusi:
  period: 1260
  label: "Maragha-observatoriet (al-Tusi)"
  title: "Maraghaobservatoriet och al-Tusi"
  wiki:
    - "en:Maragheh observatory"
    - "en:Nasir al-Din al-Tusi"
    - "en:Tusi couple"
  text: |
    **Nasir al-Din al-Tusi** (1201–1274) var en persisk lärd inom
    astronomi, matematik, filosofi och teologi. Han hade arbetat för
    assassinerna (en shiitisk sekt i bergsfästningar) och gick över till
    Hülegü när mongolerna erövrade dem 1256; han följde med till
    Bagdad 1258.

    Hülegü, som trodde på astrologi, lät honom 1259 bygga ett
    observatorium i **Maragha** i nordvästra Iran. Det var en stor
    forskningsinstitution med instrument (bl.a. en väggkvadrant med flera
    meters radie för att mäta stjärnors höjd), ett bibliotek med enligt
    uppgift 400 000 volymer (troligen överdrivet) och lärda från hela den
    islamiska världen och även Kina. Där sammanställdes 1272 de
    *ilkhaniska tabellerna* över planeternas rörelser.

    Al-Tusis mest kända bidrag är det som kallas **Tusi-paret**: en
    geometrisk konstruktion där en cirkel rullar inuti en dubbelt så stor
    cirkel, vilket gör att en punkt på den lilla cirkeln rör sig fram och
    tillbaka längs en rät linje. Med det kunde han göra Ptolemaios
    planetmodell (se ”[Alfonsinska tabellerna](#alfonsinska-tabellerna)”)
    mer enhetlig, med bara jämna cirkelrörelser. Samma konstruktion dyker
    upp hos Copernicus 1543, och många historiker tror att den nått honom
    från arabiska källor, men vägen är inte klarlagd. Al-Tusi räknas också
    som den som först behandlade trigonometri som en egen disciplin, skild
    från astronomin.

ilkhan-ghazan-blir-muslim-1295:
  period: 1280
  label: "Ilkhan Ghazan blir muslim 1295"
  title: "Ilkhanen Ghazan blir muslim 1295"
  wiki:
    - "en:Ghazan"
    - "en:Ilkhanate"
  text: |
    Mongolväldet delades efter 1260 i fyra delar. En av dem var
    **Ilkhanatet**, grundat av Djingis khans sonson Hülegü, som [1258 hade
    erövrat Bagdad](#mongoler-forstor-bagdad-1258). Det omfattade dagens
    Iran, Irak och delar av Turkiet, Kaukasus och Afghanistan. Härskaren
    kallades *ilkhan*, ungefär ”underordnad khan”.

    De första ilkhanerna var shamanister eller buddhister och styrde en
    till största delen muslimsk befolkning. När **Ghazan** tog makten 1295
    konverterade han till islam, och med honom mongolerna i riket. Det
    gjorde härskarna mer accepterade av undersåtarna.

    Ghazan (död 1304) genomförde också reformer: han minskade godtyckliga
    skatter, reformerade myntet och postväsendet och lät sin vesir Rashid
    al-Din skriva en världshistoria ([se
    det](#rashid-al-din-skriver-varldshistoria)). Mönstret var detsamma i
    alla mongolriken: erövrarna anpassade sig till de erövrades kultur. I
    Kina blev de kinesiska kejsare (Yuan), i Gyllene horden blev de också
    muslimer, och deras språk ersattes av persiska och turkiska.
    Omvändelsen grusade samtidigt europeiska förhoppningar om en
    kristen-mongolisk allians mot mamlukerna i Egypten.

rashid-al-din-skriver-varldshistoria:
  period: 1300
  label: "Rashid al-Din skriver världshistoria"
  title: "Rashid al-Din och den första världshistorien"
  wiki:
    - "en:Rashid al-Din Hamadani"
    - "en:Jami' al-tawarikh"
  text: |
    **Rashid al-Din** (ca 1247–1318) var en persisk läkare av judisk börd
    som konverterade till islam och blev vesir, det vill säga ledande
    minister, i Ilkhanatet – det mongoliska riket i Iran ([se Ghazan
    1295](#ilkhan-ghazan-blir-muslim-1295)). Han var en av sin tids
    rikaste män och grundade ett helt lärdomskvarter i Tabriz.

    På uppdrag av Ghazan skrev han, med ett team av medarbetare, **Jami
    al-Tawarikh** (”Krönikornas samling”), färdig omkring 1307–1310. Den
    räknas ofta som den första verkliga världshistorien: den behandlar
    inte bara mongolerna och islam utan även Kina, Indien, judarna,
    frankerna (européerna) och turkfolken, med uppgifter från bland annat
    kinesiska och europeiska informanter vid hovet. Handskrifterna är rikt
    illustrerade och visar kinesiskt inflytande i persiskt måleri.

    Att den gick att skriva berodde på mongolväldet, som för första gången
    kopplade samman Kina, Iran och Europa så att kunskap och människor
    kunde färdas mellan dem (jämför [Marco Polo](#marco-polo)). Verket är
    en huvudkälla om Djingis khan. Rashid al-Din fick ett bittert slut:
    anklagad för att ha förgiftat ilkhanen avrättades han 1318.

ilkhanatet-faller-1335:
  period: 1320
  label: "Ilkhanatet faller 1335"
  title: "Ilkhanatet faller sönder 1335"
  wiki:
    - "en:Ilkhanate"
    - "en:Abu Sa'id Bahadur Khan"
  text: |
    **Ilkhanatet** var det mongoliska riket i Iran och Irak, grundat av
    Hülegü, sonson till Djingis khan, efter [erövringen av Bagdad
    1258](#mongoler-forstor-bagdad-1258). Det hade blivit muslimskt under
    Ghazan 1295 ([se det](#ilkhan-ghazan-blir-muslim-1295)) och nått en
    kulturell höjdpunkt med [Rashid al-Dins
    världshistoria](#rashid-al-din-skriver-varldshistoria).

    När ilkhanen **Abu Said** dog 1335 utan arvinge ärvde ingen tydlig
    efterträdare tronen. Riket föll då snabbt sönder i en rad lokala
    dynastier som leddes av mongoliska och turkiska militärer och persiska
    familjer – bland andra jalayiriderna i Irak och muzaffariderna i södra
    Iran. Vissa av dem satte upp marionett-khaner av Djingis khans ätt.
    [Pesten nådde området](#pesten-sprids-langs-sidenvagen) strax efter.

    Ilkhanatets fall var en del av en större nedgång: hela mongolväldet
    splittrades under 1300-talet. [Yuan-dynastin i Kina föll
    1368](#mingdynastin-1368), Chagatai-khanatet i Centralasien
    splittrades och Gyllene horden försvagades. Därmed upphörde också den
    ”[mongoliska freden](#pax-mongolica-oppnar-sidenvagen)” som gjort
    handel längs sidenvägen säker. I tomrummet växte en ny erövrare fram:
    **[Timur Lenk](#timur-lenk-i-samarkand-1370)**, som omkring 1370–1405
    byggde ett nytt imperium från Samarkand och plundrade Iran, Indien och
    Mellanöstern.

pesten-sprids-langs-sidenvagen:
  period: 1340
  label: "Pesten sprids längs Sidenvägen"
  title: "Pesten längs Sidenvägen"
  wiki:
    - "sv:Sidenvägen"
    - "en:Black Death"
  text: |
    **Sidenvägen** var inte en enda väg utan ett nätverk av karavanleder
    som förband Kina med Mellanöstern och Europa via Centralasien. Under
    1200- och 1300-talen låg nästan hela sträckan inom de mongoliska
    rikena, vilket gjorde resor och handel ovanligt säkra – ibland kallat
    *[Pax Mongolica](#pax-mongolica-oppnar-sidenvagen)*, ”mongolfreden”.
    Samma nätverk som spred varor och idéer spred också sjukdomar.

    Pesten kommer troligen från Centralasien. Gravstenar från 1338–39 vid
    sjön Issyk-Kul i dagens Kirgizistan nämner en dödlig farsot, och 2022
    hittade forskare DNA från pestbakterien i tänder från just de gravarna
    – det bästa beviset hittills för [var digerdöden
    startade](#digerdoden-yersinia-pestis-via-stappen). Därifrån spred den
    sig västerut över stäppen genom [Gyllene horden](#gyllene-horden) till
    Svarta havet.

    Vid belägringen av den genuesiska handelsstaden **Kaffa** på Krim 1346
    ska mongolerna enligt en samtida berättelse ha slungat pestsmittade
    lik över murarna; om det stämmer är omdiskuterat. Klart är att fartyg
    från Svarta havet förde smittan till Konstantinopel, Egypten och
    Italien 1347. Om pesten också drabbade Kina hårt på 1350-talet är
    fortfarande en öppen fråga.

timur-lenk-i-samarkand-1370:
  period: 1360
  label: "Timur Lenk i Samarkand 1370"
  title: "Timur Lenk tar makten 1370"
  wiki:
    - "sv:Timur Lenk"
    - "sv:Samarkand"
  text: |
    **Timur** (1336–1405) var en turkisk-mongolisk krigsherre från
    Centralasien, i det som idag är Uzbekistan. Namnet Timur Lenk betyder
    ”Timur den halte” – han skadades i benet och handen i unga år, något
    som bekräftades när hans grav öppnades 1941. I Europa kallades han
    Tamerlan.

    Det mongoliska väldet efter Djingis khan hade fallit sönder i
    rivaliserande khanat. Timur var inte ättling till Djingis och kunde
    därför inte bli khan, men 1370 hade han besegrat sina rivaler och
    gjorde sig till härskare med **Samarkand** som huvudstad, en gammal
    handelsstad på Sidenvägen. Han tog titeln emir och styrde genom
    marionettkhaner av Djingis släkt.

    Under 35 år förde han nästan oavbrutet krig: mot Persien, [Gyllene
    horden](#gyllene-horden), Indien ([Delhi
    1398](#timur-plundrar-delhi-1398)), Syrien och osmanerna ([Ankara
    1402](#timur-besegrar-osmanerna-vid-ankara-1402)). Hans fälttåg var
    extremt blodiga – han lät bygga pyramider av huvuden – och dödstalen
    brukar uppskattas till 15–17 miljoner, kanske ett par procent av
    jordens befolkning då, men siffrorna är mycket osäkra. Samtidigt förde
    han hantverkare och konstnärer från erövrade städer till Samarkand,
    som blev en av sin tids praktfullaste städer med de blå kupoler som
    fortfarande finns kvar.

timur-erovrar-persien:
  period: 1380
  label: "Timur erövrar Persien"
  title: "Timur erövrar Persien 1380-talet"
  wiki:
    - "sv:Timur Lenk"
    - "en:Timurid Empire"
  text: |
    Efter att ha tagit makten i Samarkand 1370 ([se den
    punkten](#timur-lenk-i-samarkand-1370)) vände sig **Timur** mot
    **Persien** (dagens Iran med omnejd). Mongolernas Ilkhanat, som styrt
    där, [hade fallit samman 1335](#ilkhanatet-faller-1335), och landet
    var splittrat mellan lokala dynastier. Från 1381 erövrade Timur det
    bit för bit: Herat (i dagens Afghanistan), Khorasan, Tabriz och
    vidare.

    Hans metod var avskräckning. Städer som gav upp skonades mot
    betalning; de som gjorde motstånd eller gjorde uppror utplånades. I
    **Isfahan** 1387 gjorde invånarna uppror och dödade hans
    skatteindrivare. Timur lät då döda stadens befolkning; samtida källor
    talar om 70 000 döda och torn byggda av huvuden – siffran går inte att
    kontrollera, men den visar vilken skräck han spred. Liknande massakrer
    skedde i flera städer.

    Samtidigt deporterade han hantverkare, arkitekter och lärda till
    Samarkand, och persisk kultur kom att prägla hans rike. Hans
    efterträdare, **timuriderna**, styrde Persien och Centralasien under
    1400-talet och blev kända för miniatyrmåleri, astronomi ([Ulugh Begs
    observatorium i Samarkand](#ulugh-begs-observatorium-i-samarkand)) och
    arkitektur. En ättling, Babur, [grundade 1526
    Mogulriket](#babur-vinner-vid-panipat-1526-mogulriket) i Indien.

timur-dor-1405:
  period: 1400
  label: "Timur dör 1405"
  title: "Timur dör 1405"
  wiki:
    - "sv:Timur Lenk"
    - "en:Gur-e-Amir"
  text: |
    **Timur Lenk** hade under 35 år erövrat ett väldigt rike från Turkiet
    till Indien, med Samarkand som huvudstad ([se Timur
    1370](#timur-lenk-i-samarkand-1370)). Efter segern över osmanerna vid
    [Ankara 1402](#timur-besegrar-osmanerna-vid-ankara-1402) vände han sig
    mot det sista stora målet: **[Mingkina](#ming)**, som 1368 drivit ut
    mongolerna och som han ville straffa och kanske erövra. Han var nära
    70 år gammal.

    Vintern 1404–05 samlade han en armé på uppskattningsvis 200 000 man
    och gav sig av österut trots stränga köld. I februari 1405 dog han av
    sjukdom i Otrar, i dagens Kazakstan. Fälttåget avbröts. Han begravdes
    i **Gur-e Amir** i Samarkand, ett mausoleum som anses ha inspirerat
    senare mogulgravar som Taj Mahal i Indien.

    Som många erövrare hade Timur byggt ett rike kring sin egen person.
    Hans söner och sonsöner stred om arvet, och riket krympte snabbt.
    Sonen **Shah Rukh** höll ihop Persien och Centralasien, och under
    honom och sonsonen **Ulugh Beg** – en astronom som byggde ett stort
    [observatorium i Samarkand](#ulugh-begs-observatorium-i-samarkand) och
    mätte årets längd mycket noggrant – blev 1400-talet en kulturell
    blomstringstid. Ättlingen Babur [grundade 1526
    Mogulriket](#babur-vinner-vid-panipat-1526-mogulriket) i Indien.

timurider-i-herat-och-samarkand:
  period: 1400
  label: "timurider i Herat och Samarkand"
  title: "Timuriderna i Herat och Samarkand"
  wiki:
    - "en:Timurid Empire"
    - "en:Shah Rukh"
    - "sv:Samarkand"
  text: |
    **Timuriderna** var ättlingarna till **Timur** (Tamerlan, död 1405),
    en turkisk-mongolisk krigsherre som på 35 år erövrade ett rike från
    Anatolien till Indien och lät plundra Bagdad, Damaskus och Delhi. Hans
    erövringar var extremt blodiga – dödstalen brukar uppskattas till
    miljontals, men siffrorna är mycket osäkra.

    Efter hans död delades riket. Sonen **Shah Rukh** (styrde 1405–1447)
    regerade från **Herat** (i dagens västra Afghanistan), medan sonsonen
    **[Ulugh Beg](#ulugh-begs-observatorium-i-samarkand)** styrde
    **Samarkand** (i dagens Uzbekistan). Båda städerna låg på Sidenvägen,
    handelsleden mellan Kina och Medelhavet.

    Det märkliga är att en dynasti grundad av en hänsynslös erövrare blev
    en av den islamiska världens stora kulturmecenater. Under 1400-talet
    blomstrade persisk poesi, miniatyrmåleri (små detaljrika
    bokillustrationer) och arkitektur med blå kakelkupoler –
    Registantorget i Samarkand är ett exempel. Man brukar tala om en
    *timuridisk renässans*, samtidigt med den italienska ([se Medici i
    Florens, 1420-talet](#medici-i-florens)).

    Timuridernas kultur levde vidare långt efter att riket föll: en
    timuridisk prins, **Babur**, [grundade 1526
    Mogulriket](#babur-vinner-vid-panipat-1526-mogulriket) i Indien, och
    persisk hovkultur följde med dit.

ulugh-begs-observatorium-i-samarkand:
  period: 1420
  label: "Ulugh Begs observatorium i Samarkand"
  title: "Ulugh Begs observatorium"
  wiki:
    - "sv:Ulugh Beg"
    - "en:Ulugh Beg Observatory"
  text: |
    **Ulugh Beg** (1394–1449) var Timurs sonson och styrde Samarkand i
    nuvarande Uzbekistan i nästan 40 år. Han var mer intresserad av
    astronomi och matematik än av krig. Han grundade en madrasa (högre
    skola) i Samarkand 1420 och byggde omkring 1424–1429 ett av
    medeltidens största **observatorier**.

    Huvudinstrumentet var en jättelik **sextant** (eller kvadrant) inbyggd
    i en skyttegrav i berget, med en radie på cirka 40 meter. Det stora
    formatet gav hög precision: ju större skala, desto finare
    vinkelmarkeringar. Den nedre delen finns kvar och grävdes ut 1908.

    Medarbetare var matematikerna **al-Kashi**, [som beräknade π till 16
    decimaler](#al-kashi-med-16-decimaler-1424) (ett rekord i cirka 180
    år), och Qadi Zada. Observatoriet mätte stjärnpositioner ([se Ulugh
    Begs stjärnkatalog](#ulugh-begs-stjarnkatalog)), planetbanor och årets
    längd, som Ulugh Beg angav till 365 dagar, 5 timmar, 49 minuter och 15
    sekunder – cirka 25 sekunder för långt.

    Ulugh Beg mördades 1449 på order av sin egen son, och observatoriet
    förföll. Jämför med [Tycho Brahes observatorium på
    Ven](#tycho-brahe-pa-ven-uraniborg) 150 år senare, som nådde liknande
    precision.

timuriderna-splittras:
  period: 1440
  label: "Timuriderna splittras"
  title: "Timuridernas rike splittras"
  wiki:
    - "en:Timurid Empire"
    - "en:Abu Sa'id Mirza"
  text: |
    Timur (död 1405) hade byggt ett rike från Anatolien till Indien. Hans
    son **Shah Rukh** höll ihop det mesta från Herat fram till sin
    död 1447. Sedan bröt kaoset ut.

    Timurs ättlingar hade ingen fast arvsordning, och alla manliga
    släktingar kunde göra anspråk. Sonsonen **[Ulugh
    Beg](#ulugh-begs-observatorium-i-samarkand)** i Samarkand tog makten
    men besegrades och mördades 1449 av sin egen son Abd al-Latif, som i
    sin tur mördades efter sex månader. Prinsar krigade om Herat,
    Samarkand och Iran i ett tiotal år.

    Utifrån tog andra över. I väster erövrade de turkmenska stamförbunden
    **Kara Koyunlu** (”svarta fåren”) och sedan **Aq Qoyunlu** (”vita
    fåren”) Iran och Irak ([se Aq Qoyunlu](#aq-qoyunlu)). I norr trängde
    de nomadiska **uzbekerna** fram och tog Samarkand omkring 1500.

    En sista blomstring kom i Herat under **Sultan Husayn Bayqara**
    (1469–1506), med poeten Ali-Shir Nava'i och miniatyrmålaren Behzad.
    När uzbekerna tog Herat 1507 flydde timuriden **Babur** till Kabul och
    [erövrade sedan norra Indien
    1526](#babur-vinner-vid-panipat-1526-mogulriket) – Mogulriket. Så
    levde Timurs dynasti vidare i Indien till 1857.

aq-qoyunlu:
  period: 1440
  label: "Aq Qoyunlu"
  title: "Aq Qoyunlu – ”de vita fåren”"
  wiki:
    - "en:Aq Qoyunlu"
    - "en:Uzun Hasan"
  text: |
    **Aq Qoyunlu** betyder ”de med vita fåren” på turkiska – troligen
    efter en totemsymbol eller fårens färg i deras hjordar. Det var ett
    förbund av turkmenska (turkiskspråkiga nomadiska) stammar i östra
    Anatolien, med centrum kring Diyarbakır i nuvarande sydöstra Turkiet.
    De var sunnimuslimer.

    Deras rivaler var **Kara Koyunlu** (”de svarta fåren”), en annan
    turkmensk konfederation som styrde Azerbajdzjan och Irak. När
    timuridernas rike föll sönder ([se Timuriderna
    splittras](#timuriderna-splittras)) kämpade de två om väldet i Iran.

    Aq Qoyunlus störste ledare var **[Uzun
    Hasan](#uzun-hasan-aq-qoyunlu)** (”Hasan den långe”, styrde cirka
    1453–1478). 1467 besegrade han Kara Koyunlu, och 1469 en timuridisk
    armé. Hans rike omfattade nu större delen av Iran, Irak och östra
    Anatolien, med huvudstad i Tabriz. Han allierade sig med Venedig mot
    osmanerna, men förlorade slaget vid Otlukbeli 1473 [mot Mehmed
    II](#mehmed-ii-tar-konstantinopel-1453), eftersom osmanerna hade
    artilleri och handeldvapen.

    Riket föll sönder efter hans död. Hans dotterson **Ismail** grundade
    1501 **[Safavidriket](#safavidriket-1501-shiaislam-i-iran)**, som
    gjorde shiaislam till statsreligion i Iran – vilket det är än i dag.

uzun-hasan-aq-qoyunlu:
  period: 1460
  label: "Uzun Hasan (Aq Qoyunlu)"
  title: "Uzun Hasan och Vita fåren"
  wiki:
    - "en:Uzun Hasan"
    - "en:Aq Qoyunlu"
  text: |
    **Aq Qoyunlu** (turkiska för ”Vita fåren”) var en förbund av
    turkmenska nomadstammar som styrde östra Anatolien, Irak och västra
    Iran ungefär 1378–1503. Namnet kom troligen från fåren på stammarnas
    fanor. Rivalerna hette Qara Qoyunlu, ”Svarta fåren”.

    **Uzun Hasan** (”Långe Hasan”, regerade ca 1453–1478) var den mest
    framgångsrike ledaren. Han krossade Svarta fåren 1467 och en armé från
    [timuriderna](#timuriderna-splittras) (ättlingarna till erövraren
    Timur Lenk) 1469, och styrde därefter det mesta av Iran från Tabriz.

    Han såg Osmanska riket som huvudfiende och förhandlade med Venedig om
    kanoner och en gemensam front. Men vid **Otlukbeli** 1473 förlorade
    hans ryttararmé mot osmanernas artilleri och janitsjarer (sultanens
    elitinfanteri). Det var ett tidigt exempel på att krut avgjorde mot
    nomadkavalleri – [se även Chaldiran 1514](#chaldiran-1514). Efter hans
    död föll riket sönder. Men hans dotterson **Ismail** grundade 1501
    [Safavidriket](#safavidriket-1501-shiaislam-i-iran), som gjorde Iran
    shiamuslimskt.

safaviderna-vaxer:
  period: 1480
  label: "Safaviderna växer"
  title: "Safaviderna växer fram"
  wiki:
    - "en:Safavid order"
    - "en:Qizilbash"
    - "en:Safavid dynasty"
  text: |
    **Safaviderna** började som en sufisk orden – en mystisk muslimsk
    brödraskapsrörelse – grundad i Ardabil i nordvästra Iran omkring 1300
    av shejk Safi ad-Din. Under 1400-talet förvandlades den till en
    militant rörelse som anammade **shiaislam**, den gren av islam som
    anser att ledarskapet tillhör profeten Muhammeds ättlingar via hans
    svärson Ali.

    Ordens anhängare var främst turkmenska stamkrigare som kallades
    **qizilbash**, ”rödhuvuden”, efter sina röda turbaner med tolv veck –
    en symbol för de tolv imamer shiiter vördar. Ledarna Junayd och Haydar
    stupade båda i strid på 1460–80-talen, men rörelsen växte i det kaos
    som följde när [Aq Qoyunlu-riket](#aq-qoyunlu) ([se Uzun
    Hasan](#uzun-hasan-aq-qoyunlu)) föll sönder efter 1478.

    Haydars son **Ismail**, Uzun Hasans dotterson, var bara ett barn när
    fadern dog 1488 och hölls gömd. 1501, som 14-åring, intog han Tabriz
    med sina qizilbash och utropade sig till shah. Det ledde till
    Safavidriket och att Iran blev shiamuslimskt ([se
    1501](#safavidriket-1501-shiaislam-i-iran)).

safavidriket-1501-shiaislam-i-iran:
  period: 1500
  label: "Safavidriket 1501: shiaislam i Iran"
  title: "Safavidriket 1501 – Iran blir shiamuslimskt"
  wiki:
    - "en:Safavid Iran"
    - "en:Ismail I"
    - "en:Twelver Shi'ism"
  text: |
    1501 intog den 14-årige **Ismail**, ledare för den militanta
    safavidorden (se ”[Safaviderna växer](#safaviderna-vaxer)”), staden
    Tabriz och utropade sig till **shah** – kung av Iran. Inom tio år hade
    han erövrat hela Iran och delar av Irak.

    Hans mest varaktiga beslut var att göra **tolvimamitisk shiaislam**
    till statsreligion. Islam hade delats sedan 600-talet: sunnimuslimer
    (majoriteten) godtog de valda kaliferna, medan shiamuslimer menade att
    ledarskapet tillhörde profetens ättlingar via Ali, och vördar tolv
    imamer. Vid 1501 var de flesta iranier sunnimuslimer. Safaviderna
    tvingade fram omvändelsen, ibland med våld, och tog in shiitiska lärda
    från Libanon och Bahrain.

    Det skapade en religiös gräns mot det sunnitiska Osmanska riket och
    mot uzbekerna i öst, och en stark iransk identitet. Riket bestod till
    1736 och nådde sin höjdpunkt under [Abbas I
    (1588–1629)](#abbas-i-1588-isfahan) med huvudstaden Isfahan. Än i dag
    är Iran det största shiamuslimska landet, och sunni–shia-motsättningen
    präglar Mellanöstern, bland annat rivaliteten mellan Iran och
    Saudiarabien.

chaldiran-1514:
  period: 1500
  label: "Chaldiran 1514"
  title: "Slaget vid Chaldiran 1514"
  wiki:
    - "en:Battle of Chaldiran"
    - "en:Ottoman–Safavid War (1514–1555)"
  text: |
    Det nya shiitiska Safavidriket i Iran ([se
    1501](#safavidriket-1501-shiaislam-i-iran)) spred sin propaganda bland
    turkmenska stammar i östra Anatolien, som låg inom det sunnitiska
    **Osmanska riket**. Sultan **Selim I** svarade med att massakrera
    tusentals misstänkta safavidanhängare och marscherade sedan mot Iran.

    Vid **Chaldiran** i nordvästra Iran möttes arméerna den 23
    augusti 1514. Osmanerna hade uppskattningsvis 60 000 man med
    hundratals kanoner och janitsjarer (elitinfanteri med musköter) bakom
    en barrikad av sammankedjade vagnar. Shah Ismail hade kanske 40 000
    ryttare, nästan helt utan eldvapen. Safavidernas kavalleri krossades.
    Ismail sårades och flydde, och Selim intog huvudstaden Tabriz för en
    kort tid.

    Slaget visade återigen att krut nu avgjorde mot ryttararméer – samma
    lärdom som [Otlukbeli 1473](#uzun-hasan-aq-qoyunlu) och [Marj Dabiq
    1516](#osmaner-erovrar-syrien-och-egypten). Det drog också en gräns
    mellan Osmanska riket och Iran som i stort sett motsvarar dagens gräns
    mellan Turkiet/Irak och Iran. Ismail, som tidigare setts som nästan
    gudomlig av sina anhängare, ledde aldrig mer en armé.

safavider:
  period: 1520
  label: "Safavider"
  title: "Safaviderna i Persien"
  wiki:
    - "sv:Safaviderna"
    - "en:Safavid Iran"
  text: |
    Safaviderna var den dynasti som styrde Persien (Iran) 1501–1736.
    Grundaren **Ismail I** var ledare för en religiös sufiorden och
    erövrade Iran med stöd av turkmenska stamkrigare. Han gjorde shiaislam
    – den gren av islam som anser att ledarskapet borde gått i arv via
    profeten Muhammeds svärson Ali – till statsreligion och tvingade
    befolkningen att konvertera.

    Detta är grunden till att Iran än idag är det stora shiamuslimska
    landet, medan grannarna mestadels är sunnimuslimer. Det gjorde också
    safaviderna till ärkerivaler med det sunnimuslimska Osmanska riket.
    1514 förlorade Ismail [slaget vid Chaldiran](#chaldiran-1514) mot
    osmanerna, som hade kanoner och musköter; under 1500-talet krigade de
    båda rikena om Irak och Kaukasus.

    Höjdpunkten kom under **[Shah Abbas I](#abbas-i-1588-isfahan)**
    (1588–1629), som byggde Isfahan till en av världens vackraste städer.
    Persien, Osmanska riket och [Mogulriket i
    Indien](#babur-vinner-vid-panipat-1526-mogulriket) kallas ibland
    tillsammans ”krutimperierna”: stora islamiska riken byggda på arméer
    med eldvapen.

humayun-i-exil-i-persien:
  period: 1540
  label: "Humayun i exil i Persien"
  title: "Humayun i exil i Persien"
  wiki:
    - "sv:Humayun"
    - "en:Sher Shah Suri"
  text: |
    **Humayun** (1508–1556) var son till Babur, som [grundade Mogulriket i
    Indien 1526](#babur-vinner-vid-panipat-1526-mogulriket). När han ärvde
    riket 1530 var det bara fyra år gammalt och dåligt sammanhållet. Hans
    bröder gjorde anspråk på delar av det, och en skicklig afghansk
    ledare, **Sher Shah Suri**, besegrade honom 1539 och 1540 och tog
    Nordindien.

    Humayun flydde och fick till slut skydd hos shah Tahmasp I i
    [Safavidernas Persien](#safavider). Under flykten 1542 föddes [hans
    son Akbar](#akbar-1556). Sher Shah styrde under tiden effektivt i fem
    år: han reformerade skattesystemet, införde silvermyntet rupiya
    (förfadern till dagens rupie) och byggde ut den stora landsvägen genom
    Nordindien, senare kallad Grand Trunk Road.

    Med persiska trupper återtog Humayun Kabul och 1555 Delhi, men dog
    redan året efter efter ett fall i trappan till sitt bibliotek. Exilen
    fick långvarig betydelse: persiska konstnärer och ämbetsmän följde med
    till Indien, och persisk kultur och språk präglade mogulhovet. Hans
    gravmonument i Delhi blev en förebild för [Taj
    Mahal](#taj-mahal-paborjas-1632).

safavider-2:
  period: 1560
  label: "Safavider"
  same_as: safavider

abbas-i-1588-isfahan:
  period: 1580
  label: "Abbas I 1588: Isfahan"
  title: "Shah Abbas I och Isfahan"
  wiki:
    - "sv:Abbas I av Persien"
    - "sv:Isfahan"
  text: |
    **Abbas I**, ”den store” (1571–1629), blev 1588 shah (kung) av
    Persien, det safavidiska riket i dagens Iran. Han tog över ett land i
    kris: [osmanerna i väst](#osmaner-mot-persien) och uzbekerna i öst
    hade erövrat stora områden, och de turkmenska stamkrigarna (qizilbash)
    som burit dynastin till makten var oregerliga.

    Abbas byggde upp en [stående armé](#staende-arme) av soldater som var
    direkt beroende av honom, många av dem georgiska och armeniska
    krigsfångar, och skaffade musköter och kanoner, delvis med hjälp av
    engelska äventyrare. Han tog tillbaka de förlorade landen och drev
    1622 med engelsk hjälp portugiserna från ön Hormuz i Persiska viken.

    1598 flyttade han huvudstaden till **[Isfahan](#isfahan)** och byggde
    om staden kring det enorma torget Naqsh-e Jahan (cirka 510 × 160
    meter, ett av världens största), med moskéer och palats. Isfahan fick
    uppskattningsvis flera hundra tusen invånare, i nivå med London eller
    Paris. Abbas förflyttade armeniska köpmän dit för att styra
    sidenhandeln med Europa. Han var samtidigt grym: han lät döda eller
    blända flera av sina söner av rädsla för kupper.

abbas-i:
  period: 1600
  label: "Abbas I"
  title: "Abbas I – Persiens höjdpunkt"
  wiki:
    - "sv:Abbas I av Persien"
    - "en:Safavid Iran"
  text: |
    **Shah Abbas I** (regerade 1588–1629) var safavidrikets – Persiens –
    mäktigaste härskare ([se även Abbas I 1588:
    Isfahan](#abbas-i-1588-isfahan)). Under 1600-talets första decennier
    var han på höjden av sin makt. Med sin nya, kungatrogna armé av
    musketerare och artilleri vann han tillbaka Azerbajdzjan och Kaukasus
    från osmanerna 1603–1607 och [tog Bagdad 1624](#osmaner-tar-bagdad).

    Han gjorde Persien till en handelsmakt. Sidenet från norra Iran var
    landets viktigaste export, och han gav ensamrätt till armeniska
    köpmän, som han tvångsförflyttade till förorten Nya Julfa i Isfahan.
    Han förde förhandlingar med europeiska makter mot den gemensamma
    fienden osmanerna och tog 1622 med engelska [Ostindiska
    kompaniets](#ostindiska-kompaniet-1600) flotta ön Hormuz från
    portugiserna. Därmed flyttades handeln till den nya hamnen Bandar
    Abbas, uppkallad efter honom.

    Hans styre var hårt: hela folkgrupper, kanske hundratusentals georgier
    och armenier, tvångsförflyttades, och han lät döda eller blända sina
    egna söner. Efter hans död 1629 försvagades riket långsamt, och det
    föll 1722 för en afghansk invasion. Isfahans arkitektur från hans tid
    är idag Unesco-världsarv.

isfahan:
  period: 1620
  label: "Isfahan"
  title: "Isfahan – Persiens praktfulla huvudstad"
  wiki:
    - "sv:Isfahan"
    - "en:Naqsh-e Jahan Square"
  text: |
    **Isfahan** i centrala Iran var huvudstad för
    **[Safaviderna](#safavider)**, den dynasti som styrde Persien
    1501–1736 och gjorde shiaislam till statsreligion – grunden till
    dagens Iran. Shah **[Abbas I](#abbas-i-1588-isfahan)** (1588–1629)
    flyttade huvudstaden hit 1598 och byggde om staden.

    Hjärtat var det enorma torget Naqsh-e Jahan, ungefär 500 × 160 meter –
    flera gånger större än Röda torget i Moskva – omgivet av moskéer,
    palats och basar. Staden hade under 1600-talet uppskattningsvis 400
    000–600 000 invånare, alltså i samma klass som Paris eller London.
    Persiska uttrycket ”Isfahan är halva världen” kommer från denna tid.

    Isfahan var ett nav för sidenhandeln; Abbas lät armeniska köpmän
    bosätta sig i stadsdelen Nya Julfa, och europeiska handelskompanier
    (engelska och holländska) hade kontor där. Prakten avtog efter Abbas
    död, och 1722 belägrades och intogs staden av afghanska stridskrafter
    – slutet för Safavidernas storhetstid (se ”[Safavider
    avtar](#safavider-avtar)”).

safavider-3:
  period: 1640
  label: "Safavider"
  same_as: safavider

safavider-avtar:
  period: 1660
  label: "Safavider avtar"
  title: "Safavidernas nedgång"
  wiki:
    - "sv:Safaviderna"
  text: |
    **Safaviderna** var den dynasti som styrde Persien (Iran) 1501–1736
    och gjorde shiaislam till statsreligion. Höjdpunkten var Shah [Abbas
    I](#abbas-i-1588-isfahan) (1588–1629), som byggde huvudstaden
    [Isfahan](#isfahan) till en av världens största städer.

    Efter Abbas avtog dynastin. En orsak var att prinsarna av
    säkerhetsskäl hölls inspärrade i palatsets harem i stället för att få
    erfarenhet av styre och krig – de kom till tronen utan kunskap om
    omvärlden. Shah Abbas II (1642–1666) var ännu förhållandevis kapabel,
    men hans efterträdare Suleiman (1666–1694) och Sultan Husayn
    (1694–1722) lät hovmän, eunucker och religiösa lärde styra. Armén
    förföll och religiösa minoriteter förföljdes mer.

    Samtidigt minskade Persiens inkomster från sidenhandeln, då européerna
    allt mer handlade direkt med Indien och Kina via havet. 1722 belägrade
    en afghansk armé på bara kanske 20 000 man Isfahan i sex månader;
    svält dödade uppskattningsvis tiotusentals och shahen gav upp.
    Krigsherren Nadir Shah tog sedan makten och 1739 [plundrade han
    mogulernas Delhi](#nader-shah-plundrar-delhi-1739).

afghaner-tar-isfahan-1722:
  period: 1700
  label: "Afghaner tar Isfahan 1722"
  title: "Afghanerna tar Isfahan 1722"
  wiki:
    - "en:Siege of Isfahan"
    - "sv:Safaviderna"
  text: |
    Persien (Iran) styrdes sedan 1501 av
    **[Safaviddynastin](#safavider)**, som gjort shiaislam till
    statsreligion och byggt huvudstaden **[Isfahan](#isfahan)** till en av
    världens vackraste städer, med kanske 500 000–600 000 invånare. Kring
    1700 var dynastin svag, med inkompetenta shaher och religiös
    förföljelse av sunnimuslimska undersåtar.

    Afghanska stammar i öster, ghilzai-pashtuner från Kandahar, gjorde
    uppror. Deras ledare **Mahmud Hotaki** marscherade 1722 mot Isfahan
    med en armé på bara uppskattningsvis 10 000–20 000 man och slog en
    mycket större persisk armé vid Gulnabad. Isfahan belägrades i sju
    månader. Svälten var fruktansvärd; uppskattningar talar om 80 000 döda
    eller fler. Shah Sultan Husayn gav upp och överlämnade kronan.

    Det var i praktiken slutet för safaviderna. Ryssland och Osmanska
    riket passade på att ta persiska områden. Kaoset löstes först när
    fältherren [Nader Shah](#nader-shah) (se den) drev ut afghanerna 1729.
    Isfahan återfick aldrig sin forna storhet.

nader-shah:
  period: 1720
  label: "Nader Shah"
  title: "Nader Shah"
  wiki:
    - "sv:Nadir Shah"
    - "en:Nader Shah"
  text: |
    **Nader Shah** (1688–1747) var en persisk fältherre av turkmensk
    härkomst som steg från enkel bakgrund till att bli shah (kung) av
    Persien. Efter att afghaner erövrat [Isfahan
    1722](#afghaner-tar-isfahan-1722) (se det) och Persien fallit sönder
    ledde han motståndet åt en safavidisk prins. Han drev ut afghanerna
    1729 och tvingade sedan tillbaka osmanerna och ryssarna.

    1736 [avsatte han safaviderna](#safavider-avtar) och kröntes själv.
    Han räknas som en av de skickligaste fältherrarna i sin tid och kallas
    ibland "Persiens Napoleon". 1739 invaderade han Mogulrikets Indien,
    slog en mycket större armé vid Karnal och [plundrade
    Delhi](#nader-shah-plundrar-delhi-1739); uppskattningsvis 20 000–30
    000 invånare dödades på en dag. Han förde hem enorma skatter, bland
    annat Påfågelstronen och diamanten Koh-i-Noor, som idag finns i den
    brittiska kronan.

    Plundringen av Delhi försvagade Mogulriket ytterligare (se [Mogulriket
    i upplösning](#mogulriket-i-upplosning)). Nader blev alltmer grym och
    misstänksam och mördades av sina egna officerare 1747. Hans rike föll
    sönder; i öster grundades ur det dagens Afghanistan.

nader-shah-plundrar-delhi-1739:
  period: 1740
  label: "Nader Shah plundrar Delhi 1739"
  title: "Nader Shah plundrar Delhi 1739"
  wiki:
    - "en:Nader Shah"
    - "en:Nader Shah's invasion of the Mughal Empire"
  text: |
    **Nader Shah** var en krigsherre av turkmenskt ursprung som tog makten
    i Persien (Iran) och lät kröna sig till shah 1736. Han kallas ibland
    Persiens Napoleon för sina snabba fälttåg. 1738 drog han österut genom
    Afghanistan mot **Mogulriket** – det muslimska stormaktsrike som sedan
    1500-talet styrt större delen av Indien från Delhi.

    I februari 1739 krossade han mogulkejsarens mycket större armé vid
    Karnal norr om Delhi. När invånare i Delhi sedan dödade några av hans
    soldater beordrade han en massaker där uppskattningsvis 20 000–30 000
    människor dog på en dag. Han förde hem ett enormt byte, bland annat
    den juvelbesatta påfågelstronen och diamanten **Koh-i-Noor** (som i
    dag sitter i en brittisk drottningkrona). Bytet var så stort att han
    ska ha avskaffat skatterna i Persien i tre år.

    Varför det spelar roll: plundringen visade hur svagt Mogulriket hade
    blivit. [Indien splittrades i regionala
    stater](#mogulriket-i-upplosning), och in i det maktvakuumet trädde
    [det brittiska Ostindiska kompaniet](#ostindiska-kompaniet-1600) (se
    [Plassey 1757](#plassey-1757-ostindiska-kompaniet-tar)).

qajar-dynastin:
  period: 1780
  label: "Qajar-dynastin"
  title: "Qajardynastin i Persien (1789–1925)"
  wiki:
    - "en:Qajar Iran"
    - "en:Agha Mohammad Khan Qajar"
  text: |
    Efter Nader Shahs mord 1747 (se [Nader Shah plundrar Delhi
    1739](#nader-shah-plundrar-delhi-1739)) föll Persien (Iran) sönder i
    inbördeskrig. **Agha Mohammad Khan**, hövding för qajarerna – en
    turkmensk stam i norra Iran – återförenade landet med extrem
    brutalitet; han lät bland annat blinda tusentals invånare i staden
    Kerman. Han gjorde Teheran, då en liten stad, till huvudstad och
    kröntes till shah 1796.

    Qajardynastin styrde Iran till 1925. Under 1800-talet förlorade den
    Kaukasus (dagens Georgien, Armenien och Azerbajdzjan) till Ryssland i
    två krig 1804–1813 och 1826–1828. Iran blev sedan ett spelbräde mellan
    Ryssland i norr och Storbritannien i söder, det så kallade Stora
    spelet – formellt självständigt men ekonomiskt beroende, med
    koncessioner sålda till utländska bolag.

    Missnöjet ledde till den [konstitutionella revolutionen
    1905–1911](#persisk-konstitution-1906), då Iran fick parlament, ett av
    de första i Asien. 1925 tog officeren Reza Khan makten och grundade
    Pahlavidynastin, som störtades i [revolutionen
    1979](#iranska-revolutionen-1979).

ryssland-in-i-centralasien:
  period: 1840
  label: "Ryssland in i Centralasien"
  title: "Ryssland expanderar in i Centralasien 1840–1885"
  wiki:
    - "en:Russian conquest of Central Asia"
    - "sv:Det stora spelet"
  text: |
    Centralasien – dagens Kazakstan, Uzbekistan, Turkmenistan, Kirgizistan
    och Tadzjikistan – bestod på 1800-talet av nomadiska kazakiska stammar
    på stäppen och de muslimska oasstaterna (khanaten) **Chiva**,
    **Buchara** och **Kokand** kring de gamla sidenvägsstäderna Samarkand
    och Buchara.

    Ryssland hade gradvis tagit över den kazakiska stäppen sedan
    1700-talet och byggde fästningslinjer allt längre söderut. Efter
    nederlaget i [Krimkriget 1856](#krimkriget-1853) vände Ryssland
    blicken österut: Tasjkent erövrades 1865, Samarkand 1868, och Chiva
    och Buchara blev ryska protektorat 1868–1873. Turkmenerna besegrades
    vid Geok Tepe 1881. Ryssland lockades av bomull, särskilt när det
    amerikanska [inbördeskriget 1861–1865](#inbordeskriget-186165)
    stoppade bomullsexporten från USA.

    Expansionen förde Ryssland nära Brittiska Indien och skapade en
    rivalitet mellan imperierna om Afghanistan och Persien, kallad **”Det
    stora spelet”**. Den löstes genom att Afghanistan blev buffertstat och
    en avtalsgräns 1907. Ryska och senare sovjetiska Centralasien bestod
    [till 1991](#sovjet-faller-1991), då de fem länderna blev
    självständiga.

ryssland-tar-centralasien:
  period: 1860
  label: "Ryssland tar Centralasien"
  title: "Ryssland erövrar Centralasien 1860–1890-tal"
  wiki:
    - "en:Russian conquest of Central Asia"
    - "sv:Det stora spelet"
  text: |
    Under 1860–1880-talen erövrade det ryska tsarriket de muslimska
    staterna i Centralasien – området som idag är Kazakstan, Uzbekistan,
    Turkmenistan, Kirgizistan och Tadzjikistan. Tasjkent togs 1865,
    emiratet Buchara och khanatet Chiva blev ryska lydstater 1868 och
    1873, och turkmenernas fäste Geok-Tepe stormades 1881 med tusentals
    döda.

    Motiven var bomull (det amerikanska
    [inbördeskriget](#inbordeskriget-186165) hade strypt bomullsexporten
    från USA), prestige efter nederlaget i [Krimkriget](#krimkriget-1853),
    och rivalitet med Storbritannien, som fruktade att Ryssland skulle nå
    Indien. Denna kamp om inflytande i Centralasien och Afghanistan kallas
    **”det stora spelet”**.

    Gränserna som drogs då – och senare sovjetiska republikgränser – är i
    stort sett dagens statsgränser. Afghanistan blev en buffertstat mellan
    de två imperierna.

tobaksupproret-i-persien-1891:
  period: 1880
  label: "Tobaksupproret i Persien 1891"
  title: "Tobaksupproret i Persien 1891–92"
  wiki:
    - "en:Tobacco Protest"
    - "sv:Qajardynastin"
  text: |
    Persien (dagens Iran) styrdes av **Qajardynastin**, vars shaher var
    svaga och ständigt i behov av pengar. Shahen Naser al-Din sålde därför
    koncessioner – ensamrätter – till utländska företag. 1890 fick en
    brittisk affärsman monopol på all köp, försäljning och export av tobak
    i Persien i 50 år.

    Tobak var en stor näring för persiska handlare och odlare, och
    monopolet väckte ilska. 1891 utfärdade en ledande shiamuslimsk lärd,
    **Mirza Hassan Shirazi**, en fatwa (religiöst rättsutlåtande) som
    förbjöd tobaksrökning så länge monopolet gällde. Bojkotten följdes
    enligt berättelserna till och med i shahens eget harem. I januari 1892
    tvingades shahen häva koncessionen.

    Upproret var första gången handlare, präster och vanligt folk gick
    samman mot regimen och utländskt inflytande. Det var ett förspel till
    den konstitutionella revolutionen 1906 (se ”[Persisk konstitution
    1906](#persisk-konstitution-1906)”) och till prästerskapets politiska
    roll ända fram till [revolutionen 1979](#iranska-revolutionen-1979).

persisk-konstitution-1906:
  period: 1900
  label: "Persisk konstitution 1906"
  title: "Persiska konstitutionella revolutionen 1906"
  wiki:
    - "en:Persian Constitutional Revolution"
    - "sv:Qajardynastin"
  text: |
    Persien (Iran) styrdes av den svaga **Qajardynastin**, som lånade
    pengar och sålde ensamrätter till Storbritannien och Ryssland.
    Missnöjet hade synts redan i [tobaksupproret
    1891](#tobaksupproret-i-persien-1891) (se den punkten). 1905–06
    protesterade handlare, präster och intellektuella, och tusentals sökte
    skydd i den brittiska legationens trädgård i Teheran i en sorts
    sittstrejk.

    I augusti 1906 tvingades shahen gå med på en konstitution och ett valt
    parlament, **Majles**. Det var en av de första konstitutionella
    revolutionerna i Asien – samtidigt som Ryssland fick sin duma 1905 och
    strax före [ungturkarna 1908](#ungturkarna-1908). Inspirationen kom
    delvis från [Japans seger över Ryssland
    1905](#seger-over-ryssland-1905), som tolkades som att
    konstitutionella stater var starka.

    Men 1907 delade Storbritannien och Ryssland upp Persien i
    intressesfärer, och 1908 lät en ny shah bombardera parlamentet med
    rysk hjälp. Konstitutionalisterna tog tillbaka makten 1909, men landet
    förblev splittrat. Konstitutionen var formellt i kraft till
    [revolutionen 1979](#iranska-revolutionen-1979), och kampen om
    folkstyre mot shah och utländskt inflytande präglade 1900-talets Iran.

olja-1908:
  period: 1900
  label: "olja 1908"
  title: "Oljefyndet i Persien 1908"
  wiki:
    - "en:Anglo-Persian Oil Company"
    - "en:William Knox D'Arcy"
  text: |
    Den 26 maj 1908 hittade ett brittiskt prospekteringsbolag, lett av
    affärsmannen **William Knox D'Arcy**, olja vid Masjed Soleyman i
    sydvästra Persien (Iran). Det var det första stora oljefyndet i
    Mellanöstern. D'Arcy hade 1901 köpt en koncession – ensamrätt – på
    olja i större delen av Persien i 60 år för 20 000 pund och 16 % av
    vinsten till shahen.

    1909 bildades **Anglo-Persian Oil Company**, som 1954 blev BP. Vid
    samma tid ställde brittiska flottan om från kol till olja – olja ger
    mer energi per ton och snabbare fartyg – och 1914 köpte den brittiska
    staten aktiemajoriteten på initiativ av [Winston
    Churchill](#churchill). Persisk olja blev en strategisk resurs för
    imperiet.

    Fyndet inledde Mellanösterns oljeepok: Irak 1927, Saudiarabien 1938.
    Konflikten om vinsterna ledde till att Iran förstatligade oljan 1951
    och till den brittisk-amerikanskt stödda kuppen 1953 – en grund för
    iransk antivästlig misstro som syns i [revolutionen
    1979](#iranska-revolutionen-1979).

reza-shah-1925:
  period: 1920
  label: "Reza Shah 1925"
  title: "Reza Shah och Pahlavidynastin 1925"
  wiki:
    - "sv:Reza Shah Pahlavi"
    - "en:Pahlavi dynasty"
  text: |
    Persien (dagens Iran) var i början av 1900-talet svagt och delat i
    intressesfärer mellan Ryssland i norr och Storbritannien i söder.
    **Reza Khan**, en officer i kosackbrigaden, genomförde en kupp 1921
    och lät sig 1925 krönas till shah (kung) som Reza Shah, grundare av
    Pahlavidynastin.

    Liksom [Atatürk i Turkiet](#turkiet-1923-ataturk) moderniserade han
    uppifrån och med hård hand: en modern armé, den transiranska järnvägen
    (cirka 1 400 km), universitet, västerländsk klädsel för män och 1936
    förbud mot slöja för kvinnor. 1935 bad han omvärlden att kalla landet
    Iran. Präster och nomadstammar trycktes tillbaka och oppositionen
    fängslades.

    På grund av hans närhet till Tyskland ockuperade Storbritannien och
    Sovjet Iran 1941 och tvingade honom abdikera till förmån för sonen
    **Mohammad Reza Shah**. Sonen störtades i den [islamiska revolutionen
    1979](#iranska-revolutionen-1979). Den religiösa motreaktionen mot
    just Pahlavis sekulära modernisering är en nyckel till dagens Iran.

iranska-revolutionen-1979:
  period: 1960
  label: "Iranska revolutionen 1979"
  title: "Iranska revolutionen 1979"
  wiki:
    - "sv:Iranska revolutionen"
    - "sv:Ruhollah Khomeini"
  text: |
    Iran styrdes av **shahen** (kungen) Mohammad Reza Pahlavi, som hade
    fått tillbaka makten 1953 genom en kupp organiserad av CIA och
    brittisk underrättelsetjänst mot en premiärminister som förstatligat
    oljan. Shahen moderniserade snabbt med oljepengar och var allierad med
    USA, men styrde med hemlig polis (SAVAK), och klyftorna var stora.

    1978 växte protester från väldigt olika grupper: religiösa, vänster,
    liberaler och basarhandlare. Den samlande figuren var den
    landsflyktige shiamuslimske prästen ayatolla **Ruhollah Khomeini**,
    vars predikningar spreds på kassettband. Miljoner demonstrerade. I
    januari 1979 flydde shahen; i februari återvände Khomeini till ett
    jublande Teheran. En folkomröstning gjorde Iran till en islamisk
    republik, där en religiös ledare har sista ordet över valda politiker.
    Snart rensades vänster och liberaler ut.

    I november 1979 ockuperade studenter USA:s ambassad och höll 52
    amerikaner gisslan i 444 dagar. 1980 anföll Irak Iran (se
    [Iran–Irakkriget](#iranirakkriget)). Iranska oljeproduktionen föll,
    och oljepriset fördubblades – [den andra
    oljekrisen](#yom-kippur-1973-oljekris). Revolutionen gjorde politisk
    islam till en kraft i hela regionen och skapade fiendskapen mellan
    Iran och USA som består i dag.

afghanistan-1979:
  period: 1960
  label: "Afghanistan 1979"
  title: "Sovjets invasion av Afghanistan 1979"
  wiki:
    - "en:Soviet–Afghan War"
    - "en:Saur Revolution"
  text: |
    1978 tog ett litet kommunistiskt parti makten i Afghanistan genom en
    kupp. Regimen genomförde hårdhänta reformer – jordreform, sekulär
    skolgång för flickor – i ett fattigt, konservativt och stambaserat
    land, och fängslade och avrättade motståndare. Uppror bröt ut över
    hela landet, och de kommunistiska ledarna började dessutom mörda
    varandra.

    Den 24–27 december 1979 skickade Sovjetunionen in trupper.
    Specialstyrkor dödade landets ledare Hafizullah Amin och ersatte honom
    med en mer lydig ledare. Sovjet räknade med en kort insats; det blev
    ett tioårigt krig – se [Afghanistankriget](#afghanistankriget).

    Invasionen avslutade avspänningen under 1970-talet mellan USA och
    Sovjet. USA svarade med spannmålsembargo, ökad upprustning och bojkott
    av OS i Moskva 1980 tillsammans med ett sextiotal länder. Den
    inträffade samma år som [Iranska
    revolutionen](#iranska-revolutionen-1979) (se det), och tillsammans
    gjorde händelserna 1979 Mellanöstern och Centralasien till kalla
    krigets nya brännpunkt.

afghanistankriget:
  period: 1980
  label: "Afghanistankriget"
  title: "Sovjet–afghanska kriget 1979–1989"
  wiki:
    - "en:Soviet–Afghan War"
    - "en:Mujahideen"
  text: |
    Efter att Sovjetunionen invaderat Afghanistan i december 1979 (se
    [Afghanistan 1979](#afghanistan-1979)) blev det ett tioårigt krig
    mellan Sovjet och den afghanska kommunistregimen å ena sidan, och
    **mujaheddin** – islamistiska gerillagrupper – å den andra. Sovjet
    hade som mest omkring 115 000 soldater i landet. Gerillan
    kontrollerade bergen och landsbygden, Sovjet städerna och vägarna.

    USA, via CIA, tillsammans med Saudiarabien och Pakistan, finansierade
    och beväpnade gerillan med miljarder dollar. Från 1986 fick de
    amerikanska bärbara luftvärnsrobotar, Stinger, som sköt ned sovjetiska
    helikoptrar. Tusentals frivilliga från arabvärlden anslöt sig, bland
    dem saudiern **Usama bin Ladin**, som 1988 grundade al-Qaida.

    Omkring 15 000 sovjetiska soldater dog; för afghanerna dog
    uppskattningsvis 1–2 miljoner, och omkring 5–6 miljoner flydde till
    Pakistan och Iran. Kriget kallades ”Sovjets Vietnam” och bidrog till
    Sovjetunionens fall (se [Sovjet faller 1991](#sovjet-faller-1991)).
    Sovjet drog sig ut i februari 1989. Afghanistan föll sedan i
    inbördeskrig, talibanerna tog makten 1996 och gav al-Qaida en bas –
    vilket ledde till [11 september-attackerna 2001](#september-2001-11)
    och [USA:s 20-åriga krig i Afghanistan](#afghanistan-2001).

afghanistan-2001:
  period: 2000
  label: "Afghanistan 2001"
  title: "Kriget i Afghanistan från 2001"
  wiki:
    - "en:War in Afghanistan (2001–2021)"
    - "sv:Talibanerna"
  text: |
    Efter terrorattackerna [11 september 2001](#september-2001-11) krävde
    USA att **talibanerna** – en extrem islamistisk rörelse som styrt
    större delen av Afghanistan sedan 1996 – skulle lämna ut al-Qaidas
    ledare **Usama bin Ladin**. När de vägrade inledde USA i oktober 2001
    ett krig tillsammans med den afghanska Norra alliansen. Talibanregimen
    föll på ungefär två månader.

    Afghanistan hade då varit i krig sedan 1979: först [Sovjetunionens
    ockupation (1979–89)](#afghanistan-1979), som USA bekämpade genom att
    beväpna islamistiska gerillasoldater, sedan inbördeskrig. Efter 2001
    försökte USA och NATO bygga upp en demokratisk stat. Den NATO-ledda
    insatsen ISAF omfattade som mest över 130 000 soldater från ett
    femtiotal länder, inklusive Sverige, som hade trupp i norra
    Afghanistan 2002–2014.

    Talibanerna återhämtade sig i grannlandet Pakistan och förde ett långt
    gerillakrig. Bin Ladin dödades i Pakistan 2011. Kriget blev USA:s
    längsta, nästan 20 år; omkring 2 400 amerikanska soldater och
    uppskattningsvis 170 000 människor totalt dog, och kostnaden för USA
    var över 2 000 miljarder dollar. Se även [Talibanerna återtar
    Afghanistan 2021](#talibanerna-atertar-afghanistan-2021).

talibanerna-atertar-afghanistan-2021:
  period: 2020
  label: "Talibanerna återtar Afghanistan 2021"
  title: "Talibanerna återtar Afghanistan 2021"
  wiki:
    - "en:2021 Taliban offensive"
    - "en:Fall of Kabul (2021)"
    - "sv:Talibanerna"
  text: |
    I februari 2020 slöt USA under Donald Trump ett avtal med
    **talibanerna** – den extrema islamistiska rörelse som styrt
    Afghanistan 1996–2001 – om att alla utländska trupper skulle lämna
    landet. President Joe Biden höll fast vid tillbakadragandet. Den
    afghanska armén, som på papperet hade omkring 300 000 man och var
    tränad och utrustad av USA under 20 år, kollapsade sommaren 2021,
    delvis på grund av korruption, "spöksoldater" som bara fanns i
    lönelistorna och förlorad moral.

    Den 15 augusti 2021 intog talibanerna Kabul utan strid och president
    Ashraf Ghani flydde. Bilderna från Kabuls flygplats, där desperata
    människor klamrade sig fast vid ett startande amerikanskt
    transportplan, gick världen runt. Under evakueringen flögs över 120
    000 människor ut. Ett självmordsattentat från IS dödade omkring 170
    afghaner och 13 amerikanska soldater vid flygplatsen.

    Talibanerna har sedan återinfört sitt hårda styre. Flickor förbjuds gå
    i skolan efter sexan och kvinnor får inte studera vid universitet
    eller arbeta i de flesta yrken – Afghanistan är det enda landet i
    världen med sådana förbud. Ekonomin föll ihop när biståndet upphörde.
    Se även [Afghanistan 2001](#afghanistan-2001).
