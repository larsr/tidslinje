# Afrika
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

ghana-riket-guld-mot-salt-over-sahara:
  period: 1000
  label: "Ghana-riket: guld mot salt över Sahara"
  title: "Ghanariket och handeln över Sahara"
  wiki:
    - "sv:Ghanariket"
    - "en:Trans-Saharan trade"
  text: |
    **Ghanariket** (Wagadu) låg i Västafrika, i gränsområdet mellan dagens Mali och Mauretanien – inte i dagens Ghana, som tog namnet vid självständigheten 1957. Riket fanns troligen från 300–700-talet och var som störst kring år 1000. Huvudstaden Koumbi Saleh kan ha haft 15 000–20 000 invånare.

    Rikedomen byggde på handel över **Sahara**. Söderut fanns guld från floderna i Västafrika, men ont om salt, som människor och boskap behöver i tropiskt klimat. Norrut i öknen fanns saltgruvor. Berbiska karavaner med kameler – som kunde gå två veckor utan vatten – korsade öknen, en resa på 1 500–2 000 km som tog omkring två månader. Ghanas kung tog skatt på allt guld och salt som passerade och behöll själv alla guldklumpar.

    Guldet från Västafrika blev uppskattningsvis huvudkällan till de guldmynt som användes i Medelhavsvärlden och mellanöstern. Handeln förde också med sig islam och arabisk skrift söderut. Ghana försvagades efter angrepp från de nordafrikanska [almoraviderna](#almoravidrorelsen-borjar-i-sahara) omkring 1076 och efterträddes av **Maliriket** på 1200-talet, vars kung [Mansa Musa](#mansa-musa-1312) blev legendarisk för sin rikedom.

stor-zimbabwe-vaxer:
  period: 1000
  label: "Stor-Zimbabwe växer"
  title: "Stor-Zimbabwe"
  wiki:
    - "sv:Stora Zimbabwe"
    - "en:Great Zimbabwe"
  text: |
    **Stor-Zimbabwe** (Great Zimbabwe) är en ruinstad i sydöstra Zimbabwe, byggd av bantutalande shonafolk. Bosättningen började växa på 1000-talet och var som störst omkring 1300–1450, då den kan ha haft 10 000–18 000 invånare. Ordet *zimbabwe* betyder ungefär ”stenhus”, och landet Zimbabwe har tagit sitt namn efter platsen.

    Mest kända är murarna: upp till 11 meter höga och 5 meter tjocka, byggda av tillhuggna granitblock helt utan murbruk. Den största inhägnaden är den största förkoloniala stenbyggnaden söder om Sahara. Rikedomen kom från boskap och från handel med guld och elfenben, som fördes till kusten vid Indiska oceanen och vidare med arabiska och swahiliska köpmän. Arkeologer har hittat kinesiskt porslin och persisk keramik på platsen.

    Platsen är också viktig för vår egen tid. När europeiska kolonisatörer kom dit på 1800-talet vägrade de tro att afrikaner byggt den och påstod att den var fenicisk eller byggd av drottningen av Saba. Rhodesias vita regim höll fast vid sådana idéer in på 1970-talet. Idag är det arkeologiskt helt klarlagt att den byggdes av lokala afrikanska samhällen. Jämför med handelsstaden [Kilwa](#kilwa-handelsstad) på den östafrikanska kusten.

ife-kulturen:
  period: 1000
  label: "Ife-kulturen"
  title: "Ife – yorubafolkets heliga stad"
  wiki:
    - "en:Ife"
    - "en:Ife Empire"
  text: |
    **Ife** (Ile-Ife) är en stad i sydvästra Nigeria, i yorubafolkets område. Enligt yorubas religion är Ife platsen där världen skapades och människan först satte sin fot. Stadens kung, *Ooni*, har haft en andlig ledarroll bland yorubafolket i århundraden, och titeln finns kvar idag.

    Ife var en stadsstat som blomstrade från omkring 1000-talet till 1400-talet. Den är mest känd för sina skulpturer: naturalistiska, mycket detaljerade huvuden i terrakotta (bränd lera) och i mässing och koppar, gjutna med **gjutning med förlorad vax**-metoden – man formar en vaxmodell, täcker den med lera, smälter ut vaxet och häller metall i hålrummet. De flesta är från 1100–1400-talen.

    När europeiska forskare såg huvudena i början av 1900-talet ansåg många att de inte kunde vara afrikanska och spekulerade om grekiskt inflytande eller Atlantis, ungefär som med [Stor-Zimbabwe](#stor-zimbabwe-vaxer). Idag ses Ife-konsten som en av världens stora konsttraditioner. Den påverkade de senare **[Benin](#benin)bronserna** i grannriket Benin, varav många plundrades av britterna 1897 och nu är föremål för återlämningsdebatter.

almoravidrorelsen-borjar-i-sahara:
  period: 1020
  label: "Almoravidrörelsen börjar i Sahara"
  title: "Almoraviderna – en religiös rörelse i Sahara"
  wiki:
    - "sv:Almoravider"
  text: |
    **Almoraviderna** började som en religiös reformrörelse bland berberstammar – Nordafrikas ursprungsfolk – i västra Sahara (nuvarande Mauretanien) på 1030- och 1040-talet. En stamledare hade varit på pilgrimsfärd till Mecka och tog med sig en lärd, Abdallah ibn Yasin, som predikade en sträng tolkning av islamisk lag.

    Namnet kommer troligen av arabiskans *al-murabitun*, "de som samlats i en ribat" – en befäst kloster-borg. Rörelsen kombinerade religiös disciplin med militär organisation av ökenkrigare, och spred sig snabbt.

    Varför det spelar roll: inom 50 år hade almoraviderna erövrat Marocko ([Marrakech grundades cirka 1070](#almoravider-grundar-marrakesh-1070)), tagit kontroll över guldhandeln över Sahara, och gått över till Spanien 1086 för att stoppa de kristna kungarna där (se [Alfons VI](#alfons-vi) och [El Cid](#el-cid)). De visar ett mönster som återkommer i historien: en religiös väckelse bland fattiga ökenfolk som blir en erövrande stat.

ife-bronser:
  period: 1020
  label: "Ife-bronser"
  title: "Ife-skulpturerna (1000–1400-talen)"
  wiki:
    - "en:Ife bronze head"
    - "en:Ile-Ife"
  text: |
    **Ife** (Ile-Ife) i sydvästra Nigeria var den religiösa och politiska huvudstaden för **yorubafolket**, i dag en av Afrikas största folkgrupper (cirka 45 miljoner). Från ungefär 1000- till 1400-talet gjorde konstnärer där huvuden och figurer i koppar, mässing och terrakotta (bränd lera).

    Skulpturerna är naturalistiska – realistiska ansikten, ofta med fina linjer i ansiktet – och gjordes med *gjutning med förlorad vaxform*: man formar figuren i vax, täcker den med lera, smälter ut vaxet och häller i metall. Metallen måste ha handlats långväga, troligen över Sahara.

    Varför det spelar roll: när den tyske etnologen Leo Frobenius 1910 såg Ife-skulpturer hävdade han att de inte kunde vara afrikanska, utan rester av det försvunna Atlantis. Fynden visade tvärtom att det fanns avancerad metallkonst i Västafrika samtidigt som romansk konst i Europa. De är förstadiet till de mer kända [Benin-bronserna](#benin) (från 1400-talet). Se även [Ife-kulturen](#ife-kulturen) i stort.

kilwa-handelsstad:
  period: 1020
  label: "Kilwa handelsstad"
  title: "Kilwa – handelsstad vid Swahilikusten"
  wiki:
    - "sv:Kilwa Kisiwani"
    - "en:Swahili coast"
  text: |
    **Kilwa Kisiwani** är en ö utanför nuvarande Tanzania. Från omkring år 1000 blev den en av de viktigaste städerna på **swahilikusten** – Östafrikas kust från Somalia till Moçambique, där afrikansk bantukultur blandades med arabiska och persiska handelsmän. Swahili, språket, är i grunden ett bantuspråk med många arabiska lånord.

    Kilwa kontrollerade handeln med guld från [Stora Zimbabwe](#stor-zimbabwe-vaxer) i inlandet, och skeppade det tillsammans med elfenben och slavar till Arabien, Persien, Indien och ända till Kina. Handeln drevs av monsunvindarna, som blåser åt ena hållet halva året och åt andra hållet den andra halvan. Staden präglade egna kopparmynt, och dess stora moské och palatset Husuni Kubwa (1300-talet) var bland de största byggnaderna söder om Sahara.

    Den marockanske resenären Ibn Battuta kallade 1331 Kilwa en av världens vackraste städer. [Portugiserna plundrade staden 1505](#portugiser-tar-kilwa-mombasa), och den förföll. Ruinerna är i dag världsarv.

almoravider-erovrar-sijilmasa-1054:
  period: 1040
  label: "Almoravider erövrar Sijilmasa 1054"
  title: "Almoraviderna erövrar Sijilmasa 1054"
  wiki:
    - "en:Sijilmasa"
    - "sv:Almoravider"
  text: |
    **Sijilmasa** var en handelsstad i en oas i södra Marocko, i norra kanten av Sahara. Den var den viktigaste nordliga ändpunkten för karavanhandeln över Sahara: kameler fraktade salt och tyger söderut och kom tillbaka med guld från Västafrika – [riket Ghana](#ghana-riket-guld-mot-salt-over-sahara), i nuvarande Mali/Mauretanien. En karavan kunde ha tusentals kameler och resan tog uppemot två månader.

    År 1054 erövrade **almoraviderna**, den religiösa krigarrörelsen från västra Sahara (se [Almoravidrörelsen](#almoravidrorelsen-borjar-i-sahara)), Sijilmasa. Samma år, eller strax efter, tog de Awdaghust, den södra ändpunkten av samma handelsväg.

    Varför det spelar roll: med båda ändarna av guldvägen kontrollerade almoraviderna en av världens viktigaste guldkällor. Guldet finansierade deras erövring av Marocko och Spanien, och deras guldmynt (*morabetinos*) blev en standardvaluta i Medelhavsområdet, även i de kristna rikena i Spanien. Jämför: Västafrikas guld blev ännu mer känt med [Mansa Musa](#mansa-musas-pilgrimsfard-1324-guld-i) på 1300-talet.

banu-hilal-beduiner-odelagger-ifriqiya:
  period: 1040
  label: "Banu Hilal-beduiner ödelägger Ifriqiya"
  title: "Banu Hilal invaderar Ifriqiya"
  wiki:
    - "en:Banu Hilal"
    - "en:Hilalian invasion of Ifriqiya"
  text: |
    **Ifriqiya** var det arabiska namnet för ungefär dagens Tunisien och östra Algeriet (därav ordet Afrika). Området styrdes av **ziriderna**, en berberdynasti som varit vasaller till [fatimiderna i Egypten](#fatimiderna-forsvagas). Kring 1048 bröt ziriderna med fatimiderna och erkände i stället abbasidkalifen i Bagdad.

    Som straff ska fatimiderna ha uppmuntrat **Banu Hilal** och Banu Sulaym, arabiska beduinstammar (nomadiska ökenfolk) som bodde i Övre Egypten, att flytta västerut. Uppskattningsvis 200 000 personer eller fler, med familjer och boskap, vandrade in i Ifriqiya. De besegrade ziriderna 1052, och huvudstaden Kairouan plundrades 1057.

    Varför det spelar roll: historikern Ibn Khaldun (1300-talet) liknade dem vid en gräshoppssvärm som förstörde jordbruket, men moderna historiker menar att förfallet också hade andra orsaker. Klart är att invandringen bidrog starkt till att Nordafrika blev arabisktalande: tidigare talade landsbygden mest berberspråk.

almoravider-grundar-marrakesh-1070:
  period: 1060
  label: "Almoravider grundar Marrakesh ~1070"
  title: "Almoraviderna grundar Marrakesh"
  wiki:
    - "sv:Almoraviderna"
    - "sv:Marrakech"
  text: |
    **Almoraviderna** var en religiös och militär rörelse bland berbiska nomadstammar (berber = Nordafrikas ursprungsbefolkning, före araberna) i västra Sahara. [Rörelsen startade omkring 1040](#almoravidrorelsen-borjar-i-sahara) kring predikanten Abdallah ibn Yasin, som krävde en sträng tolkning av islam. Namnet kommer från arabiskans *al-murabitun*, ungefär ”de som samlats i ett gränsfort”.

    Omkring 1070 (traditionellt anges ibland 1062) grundade de staden **Marrakesh** vid foten av Atlasbergen som militärläger och huvudstad. Läget var strategiskt: mellan karavanvägarna över Sahara – där guld fördes norrut från Västafrika – och det bördiga norra Marocko. Själva namnet *Marocko* kommer från Marrakesh.

    Under ledaren **Yusuf ibn Tashfin** växte riket till att sträcka sig från Senegalfloden till Algeriet, och från 1086 även över det muslimska Spanien (se [almoravider vinner vid Sagrajas 1086](#almoravider-vinner-vid-sagrajas-1086)). Det var ett av de få tillfällen då Nordafrika och Spanien var ett enda rike. Marrakesh är idag Marockos fjärde största stad.

almoravider-tar-al-andalus:
  period: 1080
  label: "Almoravider tar al-Andalus"
  title: "Almoraviderna tar över al-Andalus"
  wiki:
    - "sv:Almoraviderna"
    - "en:Almoravid dynasty"
  text: |
    **Almoraviderna** var en strängt religiös berberrörelse från Sahara som erövrat Marocko och grundat Marrakesh (se [Almoravider grundar Marrakesh ~1070](#almoravider-grundar-marrakesh-1070)). Deras ledare **Yusuf ibn Tashfin** kallades 1086 in till **al-Andalus** – det muslimska Spanien – av de muslimska småkungarna (taifas) för att stoppa Kastilien, och vann vid [Sagrajas](#almoravider-vinner-vid-sagrajas-1086).

    Men Yusuf var missnöjd med taifa-kungarna: de bråkade sinsemellan, betalade tribut till kristna kungar, tog ut skatter som inte fanns i islamisk lag och levde i lyx med poesi och vin. Med stöd av religiösa lärda som utfärdade fatwor mot dem avsatte han dem en efter en 1090–1094: Granada, Sevilla, Badajoz m.fl. Bara Zaragoza i norr klarade sig ett tag.

    För första gången var Nordafrika och al-Andalus ett enda rike, styrt från Marrakesh. Det gav islam i Spanien ett nytt militärt ryggstöd och stoppade reconquista under ett par generationer. Samtidigt blev den religiösa toleransen mot kristna och judar mindre än under taifa-tiden. Väldet höll till ca 1145, då det avlöstes av den ännu strängare [almohadrörelsen](#almohader-ibn-tumart-mot-almoravider).

kanem-bornu-islamiseras:
  period: 1080
  label: "Kanem-Bornu islamiseras"
  title: "Kanem blir muslimskt"
  wiki:
    - "en:Kanem Empire"
    - "en:Kanem–Bornu Empire"
  text: |
    **Kanem** var ett rike kring Tchadsjön i centrala Afrika, ungefär i dagens Tchad, Niger och norra Nigeria. Det grundades kanske på 700-talet och styrdes av **Sayfawa-dynastin** – en av världens mest långlivade kungaätter, som höll makten i nästan 1 000 år, till 1846.

    Omkring 1085 konverterade kungen (titeln var *mai*) **Humai** till islam, och hans efterträdare reste på pilgrimsfärd till Mecka. Islam kom med köpmän över Sahara och gav fördelar: kontakter med Nordafrika och Egypten, skriftkunniga rådgivare som kunde arabiska, och en gemensam rättstradition för handeln. Kanems rikedom kom från handel över Sahara – särskilt slavar som såldes norrut till Libyen och Egypten, i utbyte mot hästar, salt, tyger och metallvaror.

    Riket expanderade på 1200-talet, men på 1300-talet tvingades dynastin flytta väster om Tchadsjön till **Bornu** (i dagens Nigeria), därav namnet Kanem-Bornu. Jämför med [Ghana](#ghana-riket-guld-mot-salt-over-sahara) och senare [Mali](#mali-vaxer) i Västafrika, som också islamiserades genom handel över Sahara ungefär samtidigt.

almoravidvaldet:
  period: 1100
  label: "Almoravidväldet"
  title: "Almoravidväldet i sin höjdpunkt"
  wiki:
    - "en:Almoravid dynasty"
    - "en:Almohad Caliphate"
  text: |
    Under början av 1100-talet var **almoravidriket** – grundat av en religiös rörelse bland berberstammar i Sahara (se [Almoravider grundar Marrakesh](#almoravider-grundar-marrakesh-1070)) – ett av de största rikena i den muslimska världen. Det sträckte sig från Senegalfloden i söder genom Marocko och västra Algeriet till det muslimska Spanien i norr, uppskattningsvis 3 000 km.

    Den mest kände härskaren efter grundaren Yusuf ibn Tashfin (död 1106) var hans son **Ali ibn Yusuf** (1106–1143). Riket kontrollerade de västra handelsvägarna över Sahara, där guld från Västafrika fördes norrut. Almoravidernas guldmynt, *dinarer*, var så välrenommerade att de efterliknades i det kristna Spanien under namnet *maravedí*.

    Från 1120-talet växte en ny rörelse i Atlasbergen: **[almohaderna](#almohader-ibn-tumart-mot-almoravider)**, ledda av predikanten Ibn Tumart, som anklagade almoraviderna för att ha en felaktig syn på Gud. Samtidigt pressade de kristna kungarna i Spanien på. [1147 erövrade almohaderna Marrakesh](#almohader-erovrar-marrakesh-1147) och dödade den siste almoravidhärskaren. Den religiösa förnyelserörelse som blir slapp vid makten och sedan störtas av en ny, strängare rörelse är ett mönster som historikern Ibn Khaldun beskrev på 1300-talet.

ghana-forsvagas:
  period: 1100
  label: "Ghana försvagas"
  title: "Ghanariket försvagas"
  wiki:
    - "sv:Ghanariket"
    - "en:Ghana Empire"
  text: |
    **[Ghanariket](#ghana-riket-guld-mot-salt-over-sahara)** (kallat Wagadou av folket själva) låg i Sahelbältet – gränslandet mellan Sahara och savannen – i dagens södra Mauretanien och västra Mali, alltså inte där dagens stat Ghana ligger. Det fanns sedan kanske 300-talet och var Västafrikas första stora rike. Rikedomen kom från att kontrollera handeln mellan arabiska köpmän från norr och guldfälten längre söderut; arabiska geografer kallade det ”guldets land”.

    Huvudstaden **Koumbi Saleh** hade troligen 15 000–20 000 invånare och bestod av två delar: en muslimsk köpmannastad med tolv moskéer och kungens stad. Kungen var inte muslim men anställde muslimska skrivare och ministrar.

    Under slutet av 1000-talet kom riket under tryck från **[almoraviderna](#almoravidrorelsen-borjar-i-sahara)** i norr. Arabiska källor talar om en erövring av Koumbi Saleh omkring 1076, men detta är omdiskuterat bland forskare. Klart är att riket under 1100-talet förlorade kontrollen över handeln, kanske också pga. torka och överbetning. Det delades i mindre stater, och omkring 1240 inkorporerades resterna i det nya **[Malirike](#mali-vaxer)**, vars kung [Mansa Musa](#mansa-musa-1312) på 1300-talet blev världsberömd för sin rikedom.

almohader-ibn-tumart-mot-almoravider:
  period: 1120
  label: "Almohader (Ibn Tumart) mot almoravider"
  title: "Almohaderna utmanar almoraviderna"
  wiki:
    - "sv:Almohader"
    - "sv:Almoravider"
    - "en:Ibn Tumart"
  text: |
    **Almoraviderna** var en berbisk (berber: Nordafrikas ursprungsbefolkning) dynasti som vuxit fram ur en religiös rörelse bland nomader i Sahara. De grundade [Marrakesh omkring 1070](#almoravider-grundar-marrakesh-1070) och [styrde runt 1100 både Marocko och muslimska Spanien](#almoravidvaldet-i-al-andalus).

    Omkring 1120 började **Ibn Tumart**, en berbisk teolog från Atlasbergen som studerat i Österlandet, predika mot dem. Han anklagade almoraviderna för moraliskt förfall och för en felaktig syn på Gud, och betonade Guds absoluta enhet (*tawhid*). Hans anhängare kallades därför *al-Muwahhidun*, ”de som bekänner enheten” – på svenska **almohader**. Ibn Tumart utropade sig till *mahdi*, en messiasgestalt som enligt islamisk tradition ska upprätta rättvisan, och byggde upp en bas i bergsbyn Tinmal.

    Ibn Tumart dog omkring 1130, men hans efterträdare **Abd al-Mumin** fortsatte kampen och [erövrade Marrakesh 1147](#almohader-erovrar-marrakesh-1147) (se dit). Almohadriket blev det största i Nordafrikas historia – från Atlanten till Libyen – och omfattade även al-Andalus. Mönstret med en religiös reformrörelse som störtar en dynasti som anses slapp återkommer ofta i islamisk historia; almoraviderna hade själva börjat så.

almohader-erovrar-marrakesh-1147:
  period: 1140
  label: "Almohader erövrar Marrakesh 1147"
  title: "Almohaderna erövrar Marrakesh 1147"
  wiki:
    - "sv:Almohader"
    - "sv:Marrakech"
    - "en:Abd al-Mu'min"
  text: |
    **Marrakesh** i Marocko grundades [omkring 1070](#almoravider-grundar-marrakesh-1070) av almoraviderna, en berbisk dynasti som styrde Nordvästafrika och muslimska Spanien. Staden var deras huvudstad. Från 1120-talet hade de utmanats av **almohaderna**, en religiös reformrörelse från Atlasbergen grundad av Ibn Tumart (se [Almohader mot almoravider](#almohader-ibn-tumart-mot-almoravider)).

    Under ledning av **Abd al-Mumin**, Ibn Tumarts efterträdare, erövrade almohaderna steg för steg Marocko. 1147, efter en belägring på omkring elva månader, föll Marrakesh. Den siste almoravidiske härskaren, en tonåring, dödades och många invånare massakrerades. Almohaderna rev almoravidernas moskéer, som de ansåg religiöst felriktade, och byggde nya; den mest kända, Kutubiyya-moskén, har en 77 meter hög minaret som blev förebild för Giralda i Sevilla.

    Abd al-Mumin tog titeln kalif – ledare för alla muslimer – vilket var en direkt utmaning mot abbasidkalifen i Bagdad. Han utvidgade riket österut till Tunisien, och tog bland annat tillbaka städer som normanderna från Sicilien erövrat (se [normander i Tunisien](#normander-i-tunisien)). Almohadriket blev det största i Nordafrikas historia och styrde även [al-Andalus fram till 1212](#las-navas-de-tolosa-1212-almohaderna).

normander-i-tunisien:
  period: 1140
  label: "normander i Tunisien"
  title: "Normandernas Afrikarike"
  wiki:
    - "en:Kingdom of Africa"
    - "en:George of Antioch"
  text: |
    Kung **Roger II** av Sicilien (se [Roger II 1130](#roger-ii-normandiska-kungariket-sicilien)) styrde ett rikt, normandiskt kungarike bara 15 mil från Afrikas kust. Det som i dag är Tunisien och västra Libyen hette då *Ifriqiya* och var splittrat mellan rivaliserande muslimska småhärskare, försvagat av krig och svält.

    Från 1146 tog Rogers flotta, ledd av amiralen **Georg av Antiochia** (en grekisktalande kristen från Syrien), den ena kuststaden efter den andra: Tripoli 1146, Mahdia, Sousse och Sfax 1148. Under ungefär tio år fanns ett normandiskt välde längs kusten, ibland kallat kungariket Afrika. Normanderna styrde främst genom lokala muslimska guvernörer och tog ut skatt och tullar, men lät befolkningen behålla sin religion.

    Syftet var att kontrollera sjöfarten och handeln i centrala Medelhavet, mellan Sicilien och Afrika, samt spannmålshandeln. Väldet blev kortvarigt: lokala uppror bröt ut, och almohaderna från Marocko (se [Almohader erövrar Marrakesh](#almohader-erovrar-marrakesh-1147)) erövrade de sista städerna, med Mahdia 1160. Episoden visar hur sammanflätade den kristna och den muslimska världen var vid Medelhavet – samtidigt arbetade den arabiske geografen [al-Idrisi](#al-idrisis-varldskarta-1154-sicilien) vid Rogers hov.

etiopien-zagwe-dynastin:
  period: 1160
  label: "Etiopien: Zagwe-dynastin"
  title: "Zagwe-dynastin i Etiopien"
  wiki:
    - "en:Zagwe dynasty"
    - "en:Lalibela"
    - "en:Rock-hewn Churches, Lalibela"
  text: |
    Etiopiens högland hade sedan 300-talet varit kristet – ett av världens äldsta kristna länder – efter att riket Aksum antagit kristendomen. Aksum försvann som makt under 900-talet. Omkring 1137 (osäkert, kanske tidigare) tog en ny dynasti, **Zagwe**, makten. Den kom från agaw-folket, inte från de gamla aksumitiska eliterna.

    Den mest kände Zagwe-kungen, **[Lalibela](#lalibelas-klippkyrkor)** (regerade ca 1185–1225), lät hugga ut elva kyrkor direkt i berggrunden i staden Roha, som sedan fick hans namn. Kyrkorna är inte byggda utan uthuggna uppifrån och ned ur massiv vulkanisk tuff; den mest kända, Sankt Georgskyrkan, är korsformad och omkring 12 meter hög. Avsikten var enligt traditionen att skapa ett nytt Jerusalem, efter att [Saladin tagit det riktiga 1187](#saladin-vinner-vid-hattin-1187-tar) och pilgrimsresor försvårats. Platsen är världsarv och fortfarande ett levande pilgrimsmål.

    Zagwe störtades omkring 1270 av **Yekuno Amlak**, som grundade [den salomoniska dynastin](#etiopien-salomoniska-dynastin-1270), som påstod sig härstamma från kung Salomo och drottningen av Saba. Den styrde Etiopien – med avbrott – ända till 1974, då kejsar Haile Selassie avsattes.

almohader:
  period: 1160
  label: "almohader"
  title: "Almohaderna i Nordafrika"
  wiki:
    - "sv:Almohader"
    - "en:Almohad Caliphate"
  text: |
    **Almohaderna** var en berbisk muslimsk rörelse och dynasti som från cirka 1147 styrde Marocko och snart hela Nordafrika från Atlanten till dagens Libyen, plus södra Spanien (al-Andalus). Namnet kommer från arabiskans al-muwahhidun, ”de som bekänner Guds enhet”. Rörelsen grundades av predikanten [Ibn Tumart](#almohader-ibn-tumart-mot-almoravider), som ville rensa islam från det han såg som slapphet, och kalifen Abd al-Mumin byggde sedan riket.

    Runt 1160–1180 var de på toppen: huvudstaden var Marrakech, och i Sevilla byggdes stora moskén vars minaret i dag är katedralens klocktorn Giralda. Hovet gynnade filosofer som **[Averroës](#averroes-kommenterar-aristoteles)** (Ibn Rushd), vars kommentarer till Aristoteles senare blev grundläggande vid Europas universitet.

    Almohaderna var samtidigt hårda mot judar och kristna; den judiske filosofen Maimonides familj flydde. Riket vann över Kastilien vid [Alarcos 1195](#almohader-vinner-vid-alarcos-1195) men krossades vid [Las Navas de Tolosa 1212](#las-navas-de-tolosa-1212-almohaderna) (se dessa), varefter det föll sönder och ersattes av mindre stater som Marinidernas Marocko och Hafsidernas Tunis.

lalibelas-klippkyrkor:
  period: 1180
  label: "Lalibelas klippkyrkor"
  title: "Lalibelas klippkyrkor"
  wiki:
    - "sv:Lalibela"
    - "en:Rock-Hewn Churches, Lalibela"
  text: |
    Etiopien hade varit kristet sedan 300-talet (Aksumriket) och har en egen ortodox kyrka. Omkring 1137–1270 styrdes landet av **[Zagwedynastin](#etiopien-zagwe-dynastin)**. Dess mest kände kung, **Lalibela** (regerade ungefär 1181–1221), lät enligt traditionen bygga en grupp kyrkor i staden Roha, som senare fick hans namn.

    Kyrkorna är inte byggda utan uthuggna ur berget: man högg ner i den röda vulkaniska klippan och lämnade kvar en kyrka i ett stycke, med fönster, valv och pelare. Det finns elva kyrkor; den mest kända, Bete Giyorgis, är korsformad och omkring 12 meter hög. Hur lång tid arbetet tog är okänt; forskare tror att vissa delar är äldre än Lalibela.

    Tanken var enligt traditionen att skapa ett ”nytt Jerusalem” – en pilgrimsort, just när [Saladin tagit det riktiga Jerusalem (1187)](#saladin-vinner-vid-hattin-1187-tar). Lalibela är i dag världsarv och fortfarande en levande pilgrimsort; vid jul samlas tiotusentals pilgrimer där.

kanem-bornu:
  period: 1200
  label: "Kanem-Bornu"
  title: "Kanemriket"
  wiki:
    - "sv:Kanem-Bornu"
    - "en:Kanem–Bornu Empire"
  text: |
    **Kanem** var ett rike runt Tchadsjön i centrala Afrika, i dagens Tchad, Niger, Nigeria och Kamerun. Det grundades troligen redan på 700–800-talet och styrdes av Sayfawa-dynastin, som höll makten i omkring 1 000 år – en av de längsta dynastierna i världshistorien. Kungen hade titeln *mai*, och [hovet blev muslimskt omkring 1085](#kanem-bornu-islamiseras).

    Rikets rikedom byggde på [handeln över Sahara](#ghana-riket-guld-mot-salt-over-sahara): norrut till Libyen och Medelhavet gick framför allt slavar, men också elfenben; söderut kom hästar, salt, tyg och metallvaror. Handelsvägen från Tchadsjön till Tripoli var en av de kortaste över Sahara, omkring 2 000 km.

    Under **mai Dunama Dibalemi** (ca 1210–1248) nådde Kanem sin största utbredning, upp mot Fezzan i Libyen. På 1300-talet tvingades dynastin flytta väster om Tchadsjön till **Bornu**, därav namnet Kanem-Bornu. Riket blomstrade igen på 1500-talet med eldvapen från osmanerna och bestod till 1800-talet.

benin:
  period: 1200
  label: "Benin"
  title: "Kungariket Benin"
  wiki:
    - "sv:Kungariket Benin"
    - "en:Kingdom of Benin"
    - "en:Benin Bronzes"
  text: |
    Kungariket **Benin** låg i skogsområdet i dagens södra Nigeria – inte att förväxla med den moderna staten Benin, som ligger längre västerut. Folket var edo. Enligt traditionen styrdes området först av en dynasti av ogiso-kungar; omkring 1180–1200 grundades den nuvarande dynastin, med kungatiteln *oba*, enligt traditionen av en prins från [yorubastaden Ife](#ife-kulturen).

    Huvudstaden Benin City omgavs av ett enormt system av jordvallar och diken, som byggdes ut successivt under många hundra år. Den sammanlagda längden i hela regionen har uppskattats till omkring 16 000 km – ett av världens största förindustriella anläggningsarbeten, om än byggt under mycket lång tid.

    Benin är mest känt för **Beninbronserna**, tusentals plattor och skulpturer i mässing och brons, gjutna med vaxmetoden. 1897 plundrade en brittisk straffexpedition staden och förde bort bronserna till Europa; frågan om återlämnande är aktuell i dag, och vissa har lämnats tillbaka sedan 2022. Jämför med [Ife-bronserna](#ife-bronser), som föregick Beninbronserna.

sundiata-grundar-mali-1235:
  period: 1220
  label: "Sundiata grundar Mali ~1235"
  title: "Sundiata Keita grundar Mali ~1235"
  wiki:
    - "sv:Sundiata Keita"
    - "sv:Maliriket"
  text: |
    I Västafrika, kring övre Nigerfloden (dagens Mali och Guinea), hade det gamla Ghanariket fallit sönder. Kungen av Sosso, **Sumanguru**, dominerade området. Enligt traditionen besegrades han omkring 1235 i slaget vid Kirina av **Sundiata Keita**, en prins av mandingofolket, som därmed grundade **Maliriket**.

    Det mesta vi vet om Sundiata kommer från *Sundiataeposet*, som bevarats muntligt av *griots* – yrkesberättare och släkthistoriker som generation efter generation memorerat och framfört det. Där är han en förlamad pojke som lär sig gå och blir hjälte. Det är alltså legend lika mycket som historia; arabiska resenärer bekräftar dock rikets existens och storlek.

    Malis styrka var guldet. Guldfälten i Bambuk och Bure gav en stor del av guldet i den dåtida Gamla världen, och det handlades norrut över Sahara mot salt, tyger och hästar, i karavaner på tusentals kameler. Riket växte på 1300-talet till en yta jämförbar med Västeuropa. Den mest kända kungen, **Mansa Musa**, [gjorde 1324 en pilgrimsfärd](#mansa-musas-pilgrimsfard-1324-guld-i) till Mecka med så mycket guld att guldpriset i Kairo föll i flera år. [Timbuktu](#timbuktu) blev ett centrum för islamisk lärdom.

mali-vaxer:
  period: 1240
  label: "Mali växer"
  title: "Maliriket växer"
  wiki:
    - "sv:Maliriket"
    - "en:Trans-Saharan trade"
  text: |
    Under årtiondena efter Sundiata Keitas grundande av Mali (~1235, se ”[Sundiata grundar Mali](#sundiata-grundar-mali-1235)”) utvidgades riket längs Nigerfloden. Sundiatas efterträdare, bl.a. sonen **Mansa Uli** (*mansa* = kung på mandinka), erövrade områden västerut mot Atlanten och österut mot städerna Timbuktu och Gao. Mansa Uli gjorde en pilgrimsfärd till Mecka, som blev en tradition bland kungarna.

    Riket var en federation snarare än en centralstat: lokala hövdingar behöll mycket makt så länge de betalade tribut och erkände mansan. Ekonomin vilade på tre ben: guld från gruvorna i söder, jordbruk längs Nigers översvämningsslätter (ris, hirs) och kontroll över handeln över Sahara. Karavaner med tusentals kameler tog guld, slavar och elfenben norrut mot salt (bröts i Sahara och behövdes för att konservera mat och för hälsan i det heta klimatet), koppar, hästar och tyger.

    Härskarna och handelseliten var muslimer, medan många bönder behöll de traditionella religionerna. Under 1300-talets höjdpunkt hade Mali uppskattningsvis några miljoner invånare – osäkra siffror. Riket ersattes på 1400-talet av [Songhairiket](#songhai-sunni-ali-tar-timbuktu-1468), med centrum i Gao.

mamluker:
  period: 1240
  label: "mamluker"
  title: "Mamlukerna i Egypten"
  wiki:
    - "sv:Mamluker"
    - "en:Mamluk Sultanate"
  text: |
    **Mamlukerna** var slavsoldater – i huvudsak turkisktalande pojkar från stäpperna norr om Svarta havet, senare även tjerkesser från Kaukasus – som köptes, konverterades till islam och utbildades till ryttare och befälhavare. 1250 tog de makten i Egypten (se ”[Mamluker i Egypten 1250](#mamluker-i-egypten-1250)”) och styrde sedan Egypten och Syrien till 1517.

    Deras rike var under 1200- och 1300-talen den starkaste staten i den islamiska världen. Det stoppade mongolerna (Ain Jalut 1260), drev ut korsfararna (Akko 1291) och kontrollerade Röda havet – och därmed handeln med kryddor från Indien till Medelhavet, där de sålde vidare till Venedig. Det gjorde Kairo rikt: under 1300-talet hade staden uppskattningsvis 200 000–500 000 invånare, betydligt fler än någon europeisk stad.

    Systemets egenhet var att mamlukernas söner i regel inte fick ärva ställningen. Varje generation köptes nya slavar in. Det höll eliten stridsduglig men gjorde politiken våldsam. Ett av Europas motiv för att söka sjövägen till Indien runt Afrika (Vasco da Gama 1498) var att komma förbi mamlukernas mellanhandsroll i kryddhandeln.

etiopien-salomoniska-dynastin-1270:
  period: 1260
  label: "Etiopien: salomoniska dynastin 1270"
  title: "Etiopien: salomoniska dynastin 1270"
  wiki:
    - "en:Solomonic dynasty"
    - "en:Yekuno Amlak"
    - "en:Kebra Nagast"
  text: |
    Etiopien är ett av världens äldsta kristna länder: riket Aksum blev kristet på 300-talet, ungefär samtidigt som Romarriket. Från ca 900–1100-talet styrdes landet av **Zagwedynastin**, som är mest känd för de klippkyrkor som kung Lalibela lät hugga ut kring 1200 – elva kyrkor huggna direkt ur berggrunden, en del över 10 m djupa.

    1270 störtades den siste Zagwekungen av **Yekuno Amlak**, en adelsman från provinsen Amhara. Han och hans efterträdare hävdade att de härstammade från kung **Salomo** i Bibeln och drottningen av Saba, via deras påstådde son Menelik I – därför kallas dynastin den salomoniska. Legenden berättas i krönikan *Kebra Nagast* (”Kungarnas ära”), nedskriven på 1300-talet. Den hävdar även att Menelik fört förbundsarken från Jerusalem till Etiopien.

    Härkomstanspråket gav dynastin legitimitet och knöt den tätt till kyrkan. Den salomoniska dynastin satt, med avbrott, ända till 1974, då kejsaren **Haile Selassie** störtades av en marxistisk militärjunta. Det gör den till en av världens längst regerande släkter, drygt 700 år. Haile Selassie dyrkas av rastafarirörelsen på Jamaica.

kilwa:
  period: 1280
  label: "Kilwa"
  title: "Kilwa – Swahilikustens rikaste stad"
  wiki:
    - "en:Kilwa Kisiwani"
    - "en:Kilwa Sultanate"
  text: |
    **Kilwa Kisiwani** är en ö utanför kusten i dagens södra Tanzania. Från 1100- till 1400-talet var den den rikaste staden på **Swahilikusten** – den 3 000 km långa östafrikanska kusten från Somalia till Moçambique, där en blandkultur vuxit fram mellan afrikanska bantufolk och arabiska och persiska köpmän. Swahili är ett bantuspråk med många arabiska låneord och talas idag av över 100 miljoner.

    Kilwas rikedom kom från guld. Guldet bröts i **[Stora Zimbabwe](#stor-zimbabwe-pa-topp)** i inlandet och fördes via hamnen Sofala till Kilwa, som kontrollerade handeln. Därifrån gick det till Arabien, Persien och Indien, med monsunvindarna som skiftar riktning varje halvår. Tillbaka kom textilier, glaspärlor och kinesiskt porslin.

    Omkring 1300 byggdes palatset Husuni Kubwa, med över 100 rum, och den stora moskén utvidgades. Kilwa slog egna kopparmynt. [Ibn Battuta besökte](#ibn-battuta-reser-132554) staden 1331 och kallade den en av världens vackraste. Nedgången kom när portugisen [Vasco da Gama nådde kusten 1498](#vasco-da-gama-i-calicut-1498); Kilwa plundrades 1505. Ruinerna är idag världsarv.

mali:
  period: 1280
  label: "Mali"
  title: "Maliriket"
  wiki:
    - "sv:Maliriket"
    - "en:Mali Empire"
  text: |
    **Maliriket** var en stat i Västafrika, grundad omkring 1235 av **[Sundiata Keita](#sundiata-grundar-mali-1235)**, som enligt muntlig tradition besegrade en rival och enade mandinkafolken. Det låg i dagens Mali, Guinea, Senegal och Gambia, längs floderna Niger och Senegal, och var på sin höjd ungefär lika stort som Västeuropa.

    Rikedomen kom från guld och salt. Söder om riket fanns guldfält; i Sahara bröts salt, som var livsnödvändigt i det heta klimatet. Mali kontrollerade handeln mellan dem och med karavanerna över Sahara till Nordafrika – en resa på uppskattningsvis två månader med kamel. Västafrika stod då för en mycket stor del av guldet i Medelhavsvärlden.

    Härskaren kallades *mansa* (kung). Eliten var muslimsk, medan de flesta invånare behöll traditionell religion. Den mest kända mansan är Mansa Musa ([se 1312](#mansa-musa-1312) och [1324](#mansa-musas-pilgrimsfard-1324-guld-i)), under vilken Timbuktu blev ett lärdomscentrum. Mali föregicks av [Ghanariket](#ghana-riket-guld-mot-salt-over-sahara) och efterträddes på 1400-talet av Songhairiket. Dagens stat Mali tog namnet 1960 till minne av det gamla riket.

mansa-musa-1312:
  period: 1300
  label: "Mansa Musa 1312"
  title: "Mansa Musa blir kung av Mali 1312"
  wiki:
    - "sv:Mansa Musa"
    - "en:Mansa Musa"
  text: |
    **Mansa Musa** blev härskare (*mansa*, kung) över Maliriket i Västafrika omkring 1312 och styrde till omkring 1337. Mali kontrollerade då guldfälten i Västafrika och handeln över Sahara ([se Mali](#mali)), och han räknas ofta som en av historiens rikaste människor – även om sådana jämförelser med moderna förmögenheter är omöjliga att göra exakt.

    Enligt en berättelse han själv återgav fick han makten efter att hans företrädare seglat ut på Atlanten med en stor flotta och aldrig återvänt. Under Musa nådde riket sin största utbredning och omfattade bland annat handelsstäderna [Timbuktu](#timbuktu) och Gao vid Niger.

    Han är mest känd för sin pilgrimsfärd till Mecka 1324 ([se det](#mansa-musas-pilgrimsfard-1324-guld-i)), då han delade ut så mycket guld i Kairo att guldpriset föll. Han var en from muslim och lät bygga moskéer, bland annat Djinguereber i Timbuktu, och tog med lärda och arkitekter hem från Mekka. Han satte därmed Västafrika på världskartan: på den katalanska atlasen från 1375 avbildas han med en guldklump i handen. Jämför: samtidigt i Europa var Sverige ett fattigt land med kanske en halv miljon invånare.

mansa-musas-pilgrimsfard-1324-guld-i:
  period: 1320
  label: "Mansa Musas pilgrimsfärd 1324, guld i Kairo"
  title: "Mansa Musas pilgrimsfärd 1324"
  wiki:
    - "sv:Mansa Musa"
    - "en:Catalan Atlas"
  text: |
    **Mansa Musa**, kung av Maliriket i Västafrika ([se 1312](#mansa-musa-1312)), var muslim och gjorde 1324–25 den religiösa pilgrimsfärden, *hajj*, till Mekka – en resa på uppskattningsvis 6 000 km genom Sahara och Egypten, som tog över ett år.

    Arabiska krönikörer beskriver ett följe på tusentals människor, enligt vissa uppgifter tiotusentals, och kameler lastade med guld – uppgifter som talar om 10–18 ton guld, men siffrorna är osäkra och kan vara överdrivna. Särskilt berömt är besöket i **Kairo**, där han delade ut och spenderade så mycket guld att guldets värde föll. Den egyptiske historikern al-Umari skrev ett tiotal år senare att priset ännu inte hade återhämtat sig. Det är ett tidigt exempel på inflation orsakad av ett plötsligt utbud av pengar – jämför med hur spanskt silver från Amerika höjde priserna i Europa på 1500-talet.

    Resan gjorde Mali känt i hela den muslimska världen och i Europa. På den katalanska atlasen från 1375 avbildas Musa på tronen med en guldklump. Han tog med sig lärda och arkitekten al-Sahili hem, som byggde moskéer, och Timbuktu blev ett centrum för islamisk lärdom ([se Timbuktu](#timbuktu)).

timbuktu:
  period: 1320
  label: "Timbuktu"
  title: "Timbuktu"
  wiki:
    - "sv:Timbuktu"
    - "en:Timbuktu manuscripts"
  text: |
    **Timbuktu** ligger i dagens Mali, vid kanten av Sahara, några kilometer från floden Niger. Läget gjorde den till en mötesplats: kamelkaravaner från Nordafrika kom dit med salt, tyg och böcker, och båtar på Niger fraktade guld, slavar och spannmål från söder. Staden grundades omkring år 1100 som ett tuaregläger.

    Under Maliriket, särskilt efter Mansa Musas pilgrimsfärd 1324 ([se det](#mansa-musas-pilgrimsfard-1324-guld-i)), växte staden. Den stora lermoskén **Djinguereber** byggdes omkring 1327 av arkitekten al-Sahili, som Musa tagit med från Mekka. Senare blev staden del av [Songhairiket](#songhai-sunni-ali-tar-timbuktu-1468), och på 1400–1500-talen var den ett centrum för islamisk lärdom med tusentals studenter och stora privata bibliotek. Uppskattningsvis hundratusentals handskrifter – om juridik, astronomi, medicin och matematik – har bevarats i familjer i regionen.

    I Europa blev namnet en symbol för något avlägset och mytiskt rikt. Ingen europé nådde staden förrän 1826. Jämför med att europeiska universitet som [Uppsala (1477)](#uppsala-universitet-1477) grundades ungefär samtidigt som Timbuktus lärdomsperiod. Delar av handskrifterna hotades när islamister ockuperade staden 2012, men det mesta räddades.

ibn-battuta-i-mali:
  period: 1340
  label: "Ibn Battuta i Mali"
  title: "Ibn Battuta besöker Mali 1352–1353"
  wiki:
    - "sv:Ibn Battuta"
    - "en:Mali Empire"
  text: |
    **Ibn Battuta** (1304–ca 1369) var en rättslärd från Tanger i Marocko som blev medeltidens mest beresta människa. Under omkring 30 år reste han uppskattningsvis 100 000–120 000 km – genom Nordafrika, Mellanöstern, Indien, Sydostasien och troligen Kina. Det är betydligt längre än [Marco Polo](#marco-polo). Hans reseskildring, *Rihla*, dikterades i efterhand och är en viktig källa till 1300-talets värld.

    Hans sista stora resa gick 1352–53 över Sahara till **[Maliriket](#mali)** i Västafrika, ett muslimskt rike som var rikt på guld och kontrollerade handeln med salt och guld över öknen. Mali hade blivit världsberömt när kungen Mansa Musa [vallfärdade till Mecka 1324](#mansa-musas-pilgrimsfard-1324-guld-i) och delade ut så mycket guld i Kairo att guldpriset där sjönk i flera år. Ibn Battuta träffade Mansa Musas bror, kungen Mansa Sulayman.

    Han var kritisk på vissa punkter – han tyckte kungen var snål och att seder skilde sig från dem i Marocko – men berömde rikets säkerhet: en resenär kunde färdas utan fara, och dödas egendom förvaltades åt arvingarna. Skildringen visar att Västafrika var en del av den islamiska världens handels- och lärdomsnätverk, med städer som [Timbuktu](#timbuktu).

pest-i-nordafrika:
  period: 1340
  label: "pest i Nordafrika"
  title: "Pesten i Nordafrika 1348–1350"
  wiki:
    - "sv:Ibn Khaldun"
    - "en:Black Death in the Middle East"
  text: |
    Pesten spreds 1348 [från Egypten](#digerdoden-i-kairo) och från Medelhavets hamnar till **Maghreb** – Nordafrikas västra del, dagens Libyen, Tunisien, Algeriet och Marocko. Regionen var uppdelad mellan flera muslimska dynastier, bl.a. marinidernas sultanat i Marocko, som just då försökte erövra Tunis.

    Det mest kända offret för pesten här är indirekt: den då 16-årige **Ibn Khaldun** i Tunis förlorade båda sina föräldrar och många av sina lärare 1348–49. Han blev senare en av medeltidens största tänkare. I sitt verk *Muqaddima* (1377) beskriver han pesten som något som ”svalde upp” folk och städer och fick civilisationen att krympa. Han försökte förklara historien med orsakssamband – ekonomi, sammanhållning mellan grupper, städers och dynastiers uppgång och fall – och ses ofta som en föregångare till sociologi och nationalekonomi.

    Exakta dödstal saknas, men förlusterna antas ha varit i samma storleksordning som i Europa och Egypten. Pesten återkom sedan regelbundet i Nordafrika ända in på 1800-talet, längre än i Västeuropa.

songhai-i-gao:
  period: 1360
  label: "Songhai i Gao"
  title: "Songhai i Gao"
  wiki:
    - "en:Songhai Empire"
    - "en:Gao"
  text: |
    **Songhai** är ett folk som bor längs floden Niger i Västafrika, i dagens Mali och Niger. Deras viktigaste stad var **Gao**, en handelsstad vid Nigerfloden där karavanerna över Sahara mötte flodtrafiken. Gaos härskare hade varit muslimer sedan omkring år 1000.

    Under 1300-talet var Gao underlagt det mäktiga **[Maliriket](#mali)** ([se Ibn Battuta i Mali](#ibn-battuta-i-mali)), som var berömt för sitt guld. När Mali försvagades efter Mansa Sulaymans död 1360 började Songhaifurstarna i Gao, den s.k. Sunni-dynastin, frigöra sig. Exakt när de blev helt självständiga är osäkert, men på 1400-talet hade Mali förlorat kontrollen över Gao.

    Detta var början till **Songhairiket**, som under härskarna [Sunni Ali (1464–1492)](#songhai-sunni-ali-tar-timbuktu-1468) och Askia Muhammad (1493–1528) blev det största riket i Västafrikas historia, med kontroll över [Timbuktu](#timbuktu) och Djenné och de transsahariska handelsvägarna. Riket föll 1591 när en marockansk armé på några tusen man med musköter och kanoner besegrade en mycket större songhaiarmé vid Tondibi – ett tidigt exempel på hur krutvapen förändrade maktbalansen.

mali-2:
  period: 1360
  label: "Mali"
  same_as: mali

kongoriket-1390:
  period: 1380
  label: "Kongoriket ~1390"
  title: "Kongoriket grundas ca 1390"
  wiki:
    - "en:Kingdom of Kongo"
    - "en:Afonso I of Kongo"
  text: |
    **Kongoriket** låg vid Kongoflodens mynning i västra Centralafrika, i det som idag är norra Angola, västra Kongo-Kinshasa och Kongo-Brazzaville. Enligt muntlig tradition grundades det omkring 1390 av **Lukeni lua Nimi**, som erövrade området och gjorde staden Mbanza Kongo till huvudstad. Ledaren kallades *manikongo*. Exakta årtal är osäkra eftersom det saknas skriftliga källor från denna tid.

    Riket var välorganiserat, med provinser styrda av guvernörer, ett skattesystem och en egen valuta – *nzimbu*, små snäckskal som samlades från ön Luanda. På 1500-talet kan det ha haft uppskattningsvis 2–3 miljoner invånare.

    När portugiserna kom 1483 inleddes en tid av samarbete: kung [Nzinga a Nkuwu döptes 1491](#kongos-kung-dops-1491), och hans son **Afonso I** (1509–1542) gjorde kristendomen till statsreligion och skrev brev till Portugals kung på portugisiska. Men portugisernas efterfrågan på slavar undergrävde riket, och Afonso protesterade förgäves i brev mot slavhandeln. Regionen blev en av de största källorna för den [atlantiska slavhandeln](#atlantisk-slavhandel-borjar), som förde uppskattningsvis 12 miljoner afrikaner över Atlanten.

zheng-hes-flotta-nar-ostafrika:
  period: 1400
  label: "Zheng Hes flotta når Östafrika"
  title: "Zheng He vid Östafrikas kust"
  wiki:
    - "sv:Zheng He"
    - "en:Swahili coast"
    - "en:Ming treasure voyages"
  text: |
    Mellan 1405 och 1433 skickade Kinas Mingdynasti [sju stora flottexpeditioner](#zheng-hes-flottor-140533) under amiralen **Zheng He**, en muslimsk eunuck (kastrerad hovtjänare) i kejsarens tjänst. Under de senare resorna, ungefär 1417–1422, nådde delar av flottan **Östafrikas kust**: Mogadishu (Somalia), Brava och Malindi (Kenya).

    Östafrikas kust var då **Swahilikusten** – en rad muslimska handelsstäder som [Kilwa](#kilwa), Mombasa och Malindi som sedan länge handlade med Arabien, Persien och Indien. De exporterade guld (bland annat från [Stor-Zimbabwe](#stor-zimbabwe-pa-topp)), elfenben och slavar, och köpte tyger och porslin. Kinesiskt porslin hade nått kusten långt tidigare via mellanhänder.

    Den mest berömda följden var en **giraff** som kom till Peking 1414 (via ett sändebud från Bengalen, ursprungligen från Malindi). Hovet tolkade den som en *qilin*, ett lyckobringande fabeldjur, och såg det som ett tecken på kejsarens goda styre.

    Jämför: [1498 kom Vasco da Gama till Malindi](#vasco-da-gama-i-calicut-1498) med fyra fartyg och cirka 170 man. Zheng Hes flotta hade varit där 80 år tidigare med tiotals fartyg. Men Kina lämnade, och portugiserna stannade och tog över handeln med våld.

stor-zimbabwe-pa-topp:
  period: 1400
  label: "Stor-Zimbabwe på topp"
  title: "Stor-Zimbabwe på sin höjdpunkt"
  wiki:
    - "sv:Stor-Zimbabwe"
    - "en:Kingdom of Zimbabwe"
  text: |
    **Stor-Zimbabwe** var huvudstad i ett rike i södra Afrika, byggt av förfäder till dagens shonafolk i nuvarande Zimbabwe. Staden var som störst ungefär 1300–1450 och hade uppskattningsvis 10 000–18 000 invånare – i nivå med en större europeisk stad på den tiden.

    Det mest kända är murarna av huggen granit, lagda **utan murbruk**. Den så kallade Stora inhägnaden har murar upp till cirka 11 meter höga och omkring 250 meter långa – den största förkoloniala stenkonstruktionen söder om Sahara. Ordet *zimbabwe* betyder ungefär ”stenhus” på shona.

    Rikedomen kom från **guld** och boskap. Guldet fördes till kusten vid Sofala (Moçambique) och därifrån till [Kilwa](#kilwa) och andra swahilistäder, som sålde det vidare över Indiska oceanen. Vid utgrävningar har man hittat kinesiskt porslin och persiska glaspärlor.

    Under 1400-talets mitt övergavs staden, troligen på grund av utarmad jord och att guldhandeln flyttade norrut till Mutapariket. Under kolonialtiden påstod europeiska forskare att afrikaner inte kunde ha byggt den – en rasistisk myt som arkeologin har motbevisat. Landet Zimbabwe tog sitt namn efter ruinerna vid självständigheten 1980.

portugiser-rundar-kap-bojador-1434:
  period: 1420
  label: "Portugiser rundar Kap Bojador 1434"
  title: "Kap Bojador rundas 1434"
  wiki:
    - "sv:Kap Bojador"
    - "en:Gil Eanes"
  text: |
    **Kap Bojador** är en udde på Västsaharas kust, söder om [Kanarieöarna](#kastilien-erovrar-kanarieoarna). För europeiska sjömän var det länge en gräns för det kända: starka strömmar, grunda rev, dimma och vindar som blåste söderut gjorde det svårt att ta sig tillbaka. Det fanns också föreställningar om att havet bortom kokade eller var fullt av monster.

    Henrik Sjöfararen ([se 1420-talet](#henrik-sjofararen-madeira-azorerna)) skickade minst 15 expeditioner som vände om. 1434 lyckades kaptenen **Gil Eanes** runda udden – genom att segla långt ut till havs innan han vände söderut, och sedan tillbaka norrut i en båge (en manöver som senare kallades *volta do mar*, ”havets sväng”) för att utnyttja Atlantens vindsystem.

    Gil Eanes hittade inget märkvärdigt – han tog med sig några växter som bevis – men barriären var bruten, både praktiskt och psykologiskt. Inom tio år nådde portugiserna Kap Verde, och 1444 började de föra afrikaner till Portugal som slavar ([se Portugisisk slavhandel 1444](#portugisisk-slavhandel-borjar-1444)).

    Jämför: från Kap Bojador till Godahoppsudden ([Dias 1488](#dias-rundar-godahoppsudden-1488)) är det cirka 6 000 km kustlinje – och det tog portugiserna 54 år.

portugiser-i-guinea:
  period: 1440
  label: "Portugiser i Guinea"
  title: "Portugiserna når Guinea"
  wiki:
    - "en:Portuguese Guinea"
    - "en:Arguin"
    - "en:Elmina Castle"
  text: |
    Efter att ha rundat [Kap Bojador 1434](#portugiser-rundar-kap-bojador-1434) seglade portugiserna allt längre söderut längs Afrikas västkust. På 1440-talet nådde de floden Senegal, Kap Verde (1444) och området som européerna kallade **Guinea** – ett löst begrepp för hela västafrikanska kusten söder om Sahara, från Senegal till ungefär Kamerun. Dagens länder Guinea, Guinea-Bissau och Ekvatorialguinea har tagit sina namn efter det.

    Här stötte portugiserna på tätbefolkade jordbrukssamhällen och kungadömen. Försök till räder misslyckades ofta – lokala krigare med förgiftade pilar dödade flera expeditioner. Därför övergick portugiserna till handel. 1448 byggde de en handelsstation, en så kallad *feitoria*, på ön Arguin (i dagens Mauretanien), den första europeiska handelsstationen i Afrika söder om Sahara.

    Varorna var guld, elfenben, malagettapeppar (”paradiskorn”) och slavar, i utbyte mot hästar, tyger, koppar och mässing. Genom att handla direkt vid kusten kunde portugiserna gå förbi de arabiska karavanerna över Sahara som tidigare kontrollerade Västafrikas guldhandel.

    1482 byggdes fästningen **[Elmina](#portugiser-pa-guldkusten)** på Guldkusten (dagens Ghana), som senare blev ett centrum för [slavhandeln](#atlantisk-slavhandel-borjar).

atlantisk-slavhandel-borjar:
  period: 1440
  label: "atlantisk slavhandel börjar"
  title: "Den atlantiska slavhandeln börjar"
  wiki:
    - "sv:Atlantisk slavhandel"
    - "en:Atlantic slave trade"
  text: |
    Den **atlantiska slavhandeln** var det system där européer köpte människor i Afrika och transporterade dem över Atlanten för att arbeta som slavar, främst på plantager i Amerika. Den började i liten skala med portugisernas handel på 1440-talet ([se Portugisisk slavhandel 1444](#portugisisk-slavhandel-borjar-1444)), först till Portugal och till sockerplantager på Atlantöarna Madeira och São Tomé.

    Efter [Columbus 1492](#columbus-1492) och erövringen av Amerika växte den explosionsartat. Ursprungsbefolkningen i Amerika dog i massor av europeiska sjukdomar, och plantageägare i Brasilien och Karibien ville ha arbetskraft för socker, senare tobak och bomull.

    Från 1500-talet till 1860-talet fördes uppskattningsvis **12,5 miljoner** människor ombord på slavfartyg; cirka 10,7 miljoner överlevde resan. Överfarten, den så kallade *mellanpassagen*, tog ungefär 1–3 månader under fruktansvärda förhållanden. Nära hälften fördes till Brasilien; omkring 4 % till Nordamerika. Handeln nådde sin topp på 1700-talet.

    Jämför med den arabiska slavhandeln över Sahara och Indiska oceanen, som pågick längre och också omfattade miljoner människor. Den atlantiska handeln förbjöds av Storbritannien 1807; slaveriet avskaffades i Brasilien först 1888. Sverige deltog i liten skala via kolonin Saint-Barthélemy.

songhai-sunni-ali-tar-timbuktu-1468:
  period: 1460
  label: "Songhai: Sunni Ali tar Timbuktu 1468"
  title: "Sunni Ali tar Timbuktu 1468"
  wiki:
    - "en:Sonni Ali"
    - "en:Songhai Empire"
    - "en:Timbuktu"
  text: |
    I Västafrika, längs floden Niger, följde flera stora riken på varandra: [Ghana](#ghana-riket-guld-mot-salt-over-sahara), Mali (känt för den rike kungen [Mansa Musa](#mansa-musa-1312) på 1300-talet) och sedan **Songhai** med huvudstad i Gao. Rikedomen kom från handeln över Sahara: guld och slavar norrut, salt, tyger och böcker söderut med kamelkaravaner.

    **Sunni Ali** (regerade 1464–1492) gjorde Songhai till ett storrike. Med ett snabbt kavalleri och en flodflotta på Niger tog han 1468 **[Timbuktu](#timbuktu)**, en handelsstad och lärdomscentrum med moskéskolor och tusentals handskrifter. Därefter belägrade han Djenné, enligt traditionen i sju år. Han hade ett spänt förhållande till de muslimska lärda i Timbuktu, som framställde honom som grym.

    Under efterföljaren Askia Muhammad nådde Songhai sin största utbredning, ungefär lika stort som Västeuropa. [Riket föll 1591](#marocko-krossar-songhai-1591) när en marockansk armé på uppskattningsvis 4 000 man med musköter besegrade en mångdubbelt större Songhai-armé – ännu ett exempel på krutvapnens genombrott.

portugiser-pa-guldkusten:
  period: 1460
  label: "portugiser på Guldkusten"
  title: "Portugiserna på Guldkusten 1471"
  wiki:
    - "en:Elmina Castle"
    - "en:Portuguese Gold Coast"
  text: |
    Portugal hade sedan 1400-talets början skickat fartyg allt längre söderut [längs Afrikas västkust](#portugiser-i-guinea), delvis för att komma runt de muslimska mellanhänderna i handeln över Sahara. 1471 nådde portugiserna kusten i dagens **Ghana** och fann att det gick att köpa guld direkt av lokala handlare. Kusten fick namnet **Guldkusten**.

    1482 byggde de borgen **São Jorge da Mina** (Elmina). Stenblocken hade huggits färdigt i Portugal och skeppades dit som en monteringssats. Det är den äldsta bevarade europeiska byggnaden söder om Sahara. Under några årtionden fick Portugal härifrån en betydande del av sitt guld, vilket finansierade fortsatta upptäcktsfärder – bland annat [Dias](#dias-rundar-godahoppsudden-1488) och [Vasco da Gama](#vasco-da-gama-i-calicut-1498).

    Senare blev Elmina och liknande fort centrum för den [transatlantiska slavhandeln](#atlantisk-slavhandel-borjar). [Holländarna tog Elmina 1637](#hollandare-pa-guldkusten), och britterna tog över hela kusten på 1800-talet. Ghana blev 1957 den första kolonin söder om Sahara att bli självständig.

dias-rundar-godahoppsudden-1488:
  period: 1480
  label: "Dias rundar Godahoppsudden 1488"
  title: "Bartolomeu Dias rundar Godahoppsudden 1488"
  wiki:
    - "en:Bartolomeu Dias"
    - "en:Cape of Good Hope"
  text: |
    Portugal hade [i 70 år arbetat sig söderut längs Afrikas kust](#portugiser-rundar-kap-bojador-1434), ett par hundra mil per expedition. Målet var att hitta en sjöväg till Indiens kryddor, som annars gick via muslimska och venetianska mellanhänder med kraftiga påslag.

    1487 skickades **Bartolomeu Dias** med två karaveller (små, lättmanövrerade segelfartyg) och ett förrådsskepp. Vid Afrikas sydspets drev en storm honom långt ut till havs i flera dagar. När han styrde mot land igen låg kusten plötsligt norr om honom och sträckte sig österut – han hade rundat kontinenten utan att se den. Han gick i land i Mossel Bay i början av 1488. Besättningen vägrade fortsätta, och på hemvägen såg han udden som han kallade Stormarnas udde. Kung Johan II döpte om den till **Godahoppsudden**, för att den gav hopp om vägen till Indien.

    Resan visade att Indiska oceanen var öppen. Tio år senare seglade [Vasco da Gama](#vasco-da-gama-i-calicut-1498) hela vägen till Indien. Dias själv omkom 1500 när hans skepp förliste just vid Godahoppsudden.

kongos-kung-dops-1491:
  period: 1480
  label: "Kongos kung döps 1491"
  title: "Kongos kung döps 1491"
  wiki:
    - "en:Kingdom of Kongo"
    - "en:Afonso I of Kongo"
    - "en:João I of Kongo"
  text: |
    **[Kungariket Kongo](#kongoriket-1390)** låg vid Kongoflodens mynning, i dagens norra Angola och västra Kongo-Kinshasa. Det var en välorganiserad stat med provinser, skatter och en valuta av snäckskal (nzimbu), med uppskattningsvis ett par miljoner invånare. Portugiserna kom dit 1483.

    1491 lät kungen (*manikongo*) **Nzinga a Nkuwu** döpa sig och tog namnet João I efter Portugals kung. Hans son **Afonso I** (regerade ca 1509–1542) blev en övertygad katolik, lät utbilda adelsbarn i Lissabon, och hans son Henrique blev 1518 Afrikas första svarta biskop. Kongo och Portugal skickade ambassadörer till varandra som jämlikar.

    Men portugiserna ville framför allt ha slavar till sina sockerplantager på São Tomé och senare i Brasilien. Afonso skrev brev till den portugisiske kungen och klagade över att handlarna kidnappade hans undersåtar – några av breven finns bevarade. Kristendomen i Kongo levde kvar, men [slavhandeln](#atlantisk-slavhandel-borjar) och senare krig med portugisiska Angola bröt ner riket på 1600-talet.

portugiser-tar-kilwa-mombasa:
  period: 1500
  label: "Portugiser tar Kilwa, Mombasa"
  title: "Portugiserna tar Kilwa och Mombasa 1505"
  wiki:
    - "en:Kilwa Kisiwani"
    - "en:Swahili coast"
    - "en:Francisco de Almeida"
  text: |
    Längs Östafrikas kust låg en rad rika handelsstäder – **Kilwa**, **Mombasa**, Malindi, Zanzibar – i den så kallade **swahilikulturen**: muslimsk, afrikansk med arabiska och persiska inslag, med stenhus och moskéer. [Kilwa kontrollerade](#kilwa) guldhandeln från [Zimbabwes inland](#stor-zimbabwe-pa-topp), och [Ibn Battuta](#ibn-battuta-reser-132554) hade på 1300-talet kallat den en av världens vackraste städer.

    Efter [Vasco da Gamas resa 1498](#vasco-da-gama-i-calicut-1498) ville Portugal kontrollera handeln i Indiska oceanen med våld. 1505 kom **Francisco de Almeida**, Portugals förste vicekung i Indien, med en flotta på drygt 20 skepp. Han intog och plundrade Kilwa och byggde ett fort där. Mombasa vägrade underkasta sig, stormades och brändes. Enligt portugisiska källor dödades hundratals invånare.

    Portugiserna krävde tribut och tullar men lyckades aldrig ta över handeln helt. Swahilistäderna gick tillbaka. I Mombasa byggde Portugal 1593 **Fort Jesus**, som omani-araber erövrade 1698 efter en belägring på nära tre år. Språket swahili, som uppstod ur kustens blandkultur, talas i dag av uppskattningsvis 100 miljoner människor.

etiopien-anfalls-av-adal:
  period: 1520
  label: "Etiopien anfalls av Adal"
  title: "Adal anfaller Etiopien (1529–1543)"
  wiki:
    - "en:Ethiopian–Adal War"
    - "en:Ahmad ibn Ibrahim al-Ghazi"
  text: |
    Etiopien var ett kristet kejsardöme i Afrikas horn, kristet sedan 300-talet och med en egen kyrka. Öster om det låg det muslimska sultanatet **Adal** (i dagens Somalia, Djibouti och östra Etiopien). De två hade krigat i generationer.

    Från 1529 ledde Adals befälhavare **Ahmad ibn Ibrahim al-Ghazi**, kallad Gragn (”den vänsterhänte”), en stor offensiv. Med hjälp av osmanska musköter och kanoner – vapen som etiopierna nästan saknade – krossade han kejsarens armé vid Shimbra Kure 1529. Under drygt ett decennium erövrade Adal största delen av Etiopiens högland; kyrkor och kloster brändes och många tvingades konvertera.

    Kejsaren bad Portugal om hjälp. 1541 landsteg omkring 400 portugisiska musketörer (se [Portugiser hjälper Etiopien](#portugiser-hjalper-etiopien)), och 1543 stupade Ahmad i slaget vid Wayna Daga. Kriget försvagade båda parter så mycket att oromofolket kunde flytta in i stora delar av området. Konflikten är en lokal del av rivaliteten mellan Osmanska riket och Portugal i Indiska oceanen.

portugiser-hjalper-etiopien:
  period: 1540
  label: "Portugiser hjälper Etiopien"
  title: "Portugal hjälper Etiopien 1541–1543"
  wiki:
    - "en:Cristóvão da Gama"
    - "en:Battle of Wayna Daga"
  text: |
    Det kristna Etiopien höll på att erövras av det muslimska sultanatet Adal (se [Etiopien anfalls av Adal](#etiopien-anfalls-av-adal)), som fick vapen och soldater från Osmanska riket. Kejsar Lebna Dengel bad Portugal om hjälp. Portugiserna hade sedan länge sökt den legendariske kristne kungen ”Prästen Johannes” och såg Etiopien som en allierad mot osmanerna i Röda havet och Indiska oceanen.

    1541 landsteg omkring 400 portugisiska musketörer under **Cristóvão da Gama**, son till [Vasco da Gama](#vasco-da-gama-i-calicut-1498). De vann flera strider, men da Gama tillfångatogs och avrättades 1542. De överlevande portugiserna, omkring 200, slog sig ihop med den nye kejsaren Gelawdewos, och i slaget vid Wayna Daga 1543 stupade Adals ledare Ahmad Gragn. Hans armé upplöstes.

    Hjälpen räddade Etiopiens självständighet, som landet sedan behöll – det blev, tillsammans med Liberia, ett av de få afrikanska länder som aldrig koloniserades (bortsett från Italiens ockupation 1936–41). Senare försökte jesuiter göra Etiopien katolskt, vilket ledde till inbördeskrig och att europeiska missionärer utvisades på 1630-talet.

slavhandeln-vaxer:
  period: 1540
  label: "slavhandeln växer"
  title: "Den atlantiska slavhandeln växer"
  wiki:
    - "sv:Atlantiska slavhandeln"
    - "en:Atlantic slave trade"
  text: |
    Slaveri fanns i Afrika och längs handelsvägar över Sahara och Indiska oceanen långt före européerna. Det nya på 1500-talet var den atlantiska handeln: [portugiser köpte människor](#portugisisk-slavhandel-borjar-1444) av afrikanska kungar och handelsmän längs Västafrikas kust och i Kongo och Angola och skeppade dem över Atlanten.

    Orsaken var arbetskraftsbristen i Amerika när ursprungsbefolkningen dog i epidemier (se [Smittkoppor dödar miljoner i Amerika](#smittkoppor-dodar-miljoner-i-amerika)), och [sockerplantagerna](#sockerplantager-och-slaveri-i-karibien) – först på öar som São Tomé, sedan i Brasilien och Karibien – som krävde hårt arbete. Spanien sålde licenser (asiento) för slavimport till sina kolonier. Under 1500-talet fördes uppskattningsvis 250 000–300 000 människor över Atlanten.

    Det var bara början. Handeln nådde sin topp på 1700-talet, och totalt fördes omkring 12,5 miljoner afrikaner över Atlanten fram till 1860-talet; uppskattningsvis 1,5–2 miljoner dog under själva överfarten. Den formade befolkningen i Brasilien, Karibien och USA och försvagade många afrikanska samhällen. [Storbritannien förbjöd handeln 1807](#slavhandel-forbjuden-1807), och Brasilien avskaffade slaveriet som sista land i Amerika 1888.

marocko-vinner-vid-alcacer-quibir-1578:
  period: 1560
  label: "Marocko vinner vid Alcácer Quibir 1578"
  title: "Slaget vid Alcácer Quibir 1578"
  wiki:
    - "en:Battle of Alcácer Quibir"
    - "sv:Sebastian I av Portugal"
  text: |
    Portugal hade sedan 1400-talet haft fästningar på Marockos kust. Den unge portugisiske kungen **Sebastian**, 24 år, ville göra korståg i Marocko och tog parti i en tronstrid där: han stödde den avsatte sultanen al-Mutawakkil mot dennes farbror Abd al-Malik, som hade osmanskt stöd.

    4 augusti 1578 möttes arméerna vid Alcácer Quibir (Ksar el-Kebir) i norra Marocko. Den portugisiska armén på uppskattningsvis 17 000–23 000 man var i underläge mot en marockansk armé som kan ha varit dubbelt så stor, med mycket kavalleri. Den portugisiska armén förintades; uppskattningsvis 8 000 dödades och de flesta övriga tillfångatogs. Slaget kallas ”de tre kungarnas slag”, eftersom alla tre dog: Sebastian, al-Mutawakkil och Abd al-Malik.

    Följderna blev stora. Abd al-Maliks bror Ahmad al-Mansur blev sultan och byggde upp Marocko med de enorma lösensummorna för fångarna. Sebastian lämnade ingen arvinge, och [1580 tog Filip II av Spanien över Portugal](#personalunion-med-portugal-1580) – [unionen varade till 1640](#portugal-fritt-1640). I Portugal levde legenden att Sebastian skulle återvända och rädda landet (sebastianismen).

marocko-krossar-songhai-1591:
  period: 1580
  label: "Marocko krossar Songhai 1591"
  title: "Slaget vid Tondibi 1591"
  wiki:
    - "en:Battle of Tondibi"
    - "sv:Songhairiket"
  text: |
    **[Songhairiket](#songhai-sunni-ali-tar-timbuktu-1468)** i Västafrika, kring Nigerfloden i dagens Mali och Niger, var på 1500-talet ett av Afrikas största riken, med handelsstäderna Gao och Timbuktu. Det kontrollerade handeln över Sahara med guld och salt. Marockos sultan **Ahmad al-Mansur** ville åt guldet och saltgruvorna.

    1590 skickade han en armé på cirka 4 000 man, däribland många spanska konvertiter och legosoldater med musköter, under befäl av Judar Pasha. De korsade Sahara – omkring 2 000 km öken på cirka fyra månader; en stor del dog på vägen. Vid **Tondibi** 1591 mötte de en Songhaiarmé som var många gånger större men saknade eldvapen. Ljudet och verkan av musköterna fick kavalleriet och boskapen som drevs framför hären att få panik. Songhai förlorade.

    Marocko lyckades inte styra området länge; de marockanska soldaterna blev en lokal härskarklass och kontakten med Marocko tunnades ut. Men Songhairiket föll sönder, Timbuktu förlorade sin roll som lärdomsstad, och handeln över Sahara minskade när européernas sjöhandel längs kusten tog över ([se Holländare på Guldkusten](#hollandare-pa-guldkusten)).

    Se även [Marocko vinner vid Alcácer Quibir 1578](#marocko-vinner-vid-alcacer-quibir-1578), som gav sultanen medel att bygga upp armén.

hollandare-pa-guldkusten:
  period: 1600
  label: "Holländare på Guldkusten"
  title: "Holländarna på Guldkusten"
  wiki:
    - "en:Dutch Gold Coast"
    - "sv:Elmina"
  text: |
    **Guldkusten** var européernas namn på kusten av dagens Ghana i Västafrika, efter guldet som de lokala akanfolken bröt i inlandet och sålde. [Portugiserna byggde fästningen Elmina](#portugiser-pa-guldkusten) där redan 1482 och hade i över ett sekel nästan ensamrätt på handeln. Kring 1600 började holländska köpmän segla dit och erbjöd bättre och billigare varor: tyger, metallvaror och vapen.

    Holländarna byggde 1612 Fort Nassau vid Mouri, och 1637 erövrade Nederländska Västindiska kompaniet (grundat 1621 som systerbolag till [VOC](#voc-1602)) Elmina från portugiserna. Kusten blev snart full av europeiska fort – till slut ett 60-tal på cirka 500 km – byggda av holländare, engelsmän, danskar, brandenburgare och, en kort tid, svenskar (Carolusborg 1650-talet).

    Först handlade man mest med guld, men under 1600-talet blev slavhandeln allt viktigare, eftersom sockerplantagerna i Amerika krävde arbetskraft ([se Holländare i Karibien](#hollandare-i-karibien)). Från fästningarna skeppades hundratusentals förslavade människor över Atlanten. Ghana blev 1957 den första kolonin söder om Sahara som blev självständig; forten står kvar och är världsarv.

drottning-nzinga-i-angola:
  period: 1620
  label: "Drottning Nzinga i Angola"
  title: "Drottning Nzinga i Angola"
  wiki:
    - "en:Nzinga of Ndongo and Matamba"
  text: |
    **Nzinga** (ca 1583–1663) var drottning av **Ndongo** och **Matamba**, två riken i nuvarande Angola i sydvästra Afrika. Hennes motståndare var portugiserna, som från kustbasen Luanda (grundad 1576) jagade slavar till sina sockerplantager i Brasilien.

    Hon blev känd som diplomat 1622, då hon förhandlade med den portugisiske guvernören. Enligt berättelsen erbjöds hon ingen stol och satte sig då på ryggen av en tjänare för att sitta i jämnhöjd. Hon lät döpa sig till katolik för att vinna tid men bröt sedan med portugiserna och förde gerillakrig i decennier. Hon allierade sig med holländarna när de tog Luanda 1641–1648 (en del av den nederländsk-portugisiska kampen, [se Brasilien](#hollandare-i-nordostra-brasilien)).

    Nzinga styrde i omkring 40 år och slöt till sist fred med Portugal 1657. Hennes rike deltog själv i slavhandeln – en påminnelse om att [den atlantiska slavhandeln](#atlantisk-slavhandel-borjar) byggde på samarbete med afrikanska härskare. I dagens Angola är hon en nationalsymbol för motstånd mot kolonialism.

kapstaden-grundas-1652:
  period: 1640
  label: "Kapstaden grundas 1652"
  title: "Kapstaden grundas 1652"
  wiki:
    - "sv:Kapstaden"
    - "en:Dutch Cape Colony"
  text: |
    Sjövägen från Europa till Asien runt Afrikas sydspets var lång: en resa från Amsterdam till [Batavia](#voc-grundar-batavia-1619) (dagens Jakarta) tog ofta 6–8 månader. Besättningarna drabbades av **skörbjugg** (brist på C-vitamin) och många dog. Nederländska Ostindiska kompaniet **[VOC](#voc-1602)** behövde en station halvvägs där fartygen kunde fylla på färskvatten, grönsaker och kött.

    1652 landsteg **Jan van Riebeeck** med omkring 90 personer vid Taffelbukten och byggde ett fort och odlingar. Det var tänkt som en provianteringsstation, inte en koloni. Men snart fick kompanianställda bli fria bönder (*boer*) och flytta inåt landet. Där kom de i konflikt med khoikhoi-folket, som förlorade betesmark och boskap och decimerades av smittkoppor (1713). Slavar fördes in från Indonesien, Indien, Madagaskar och Moçambique.

    Ättlingarna till de holländska, tyska och franska (hugenottiska) bosättarna blev **afrikanerna**, vars språk afrikaans utvecklades ur holländska. [Kolonin blev brittisk 1806](#kapkolonin-brittisk). Härifrån går en rak linje till boerkrigen kring 1900 och apartheid 1948–1994.

slavhandeln-okar-kraftigt:
  period: 1660
  label: "Slavhandeln ökar kraftigt"
  title: "Den atlantiska slavhandeln ökar kraftigt"
  wiki:
    - "sv:Atlantisk slavhandel"
  text: |
    Den **atlantiska slavhandeln** var transporten av förslavade afrikaner över Atlanten till Amerika, från 1500-talet till 1860-talet. Totalt fördes uppskattningsvis 12,5 miljoner människor från Afrika; omkring 10,7 miljoner överlevde resan. Ungefär 15 procent dog i genomsnitt under överfarten, som tog 1–3 månader.

    Från mitten av 1600-talet ökade handeln kraftigt. Orsaken var socker: efter att [holländarna förts ut ur Brasilien 1654](#hollandarna-drivs-ut-ur-brasilien-1654) spred sig [sockerplantager](#sockerplantager-och-slaveri-i-karibien) till Karibien – Barbados, Jamaica och franska öar. Sockerodling var mycket arbetsintensiv och dödlig, och plantageägarna fann det billigare att köpa nya slavar än att låta dem överleva. Engelska Royal African Company grundades 1660 (nyorganiserat 1672). Från omkring 7 000 per år kring 1650 ökade antalet till uppskattningsvis 20 000–30 000 per år på 1680–90-talen, och toppen nåddes på 1700-talet med uppåt 80 000 per år.

    Européerna köpte slavar från afrikanska härskare och handelsmän vid kusten mot textilier, vapen, järn och snäckvalutan kauri. Handeln förändrade västra Afrika: krig för att fånga slavar ökade, befolkningstillväxten stannade av, och vissa stater som [Dahomey](#dahomey) och Asante byggde sin makt på handeln. [Den brittiska slavhandeln förbjöds 1807](#slavhandel-forbjuden-1807).

ashantiriket:
  period: 1680
  label: "Ashantiriket"
  title: "Ashantiriket"
  wiki:
    - "sv:Ashantiriket"
    - "en:Osei Kofi Tutu I"
  text: |
    **Ashantiriket** (Asante) var ett rike i dagens Ghana i Västafrika, grundat kring 1670–1700 av **Osei Tutu**, som enade flera småstater inom akanfolket. Huvudstad var Kumasi. Enligt traditionen föll den gyllene pallen ner från himlen till Osei Tutu; den blev symbol för rikets enhet och finns kvar idag.

    Riket blev rikt på guld – området kallades av européerna [Guldkusten](#hollandare-pa-guldkusten) – och på handel med européerna vid kusten. En stor del av den handeln gällde slavar, som togs i krig och såldes till europeiska köpmän i utbyte mot vapen och tyger. På sin höjd på 1700–1800-talet hade riket uppskattningsvis några miljoner invånare.

    Ashanti var en av Västafrikas starkaste stater och gjorde motstånd mot britterna i en rad krig under 1800-talet. Först 1901–1902 blev det en del av den brittiska kolonin. Ghana blev 1957 den första kolonin söder om Sahara som blev självständig, och Ashantikungen finns kvar som traditionell ledare.

    Se även [Dahomey](#dahomey), en annan stat som byggde sin makt på slavhandeln.

dahomey:
  period: 1700
  label: "Dahomey"
  title: "Kungariket Dahomey"
  wiki:
    - "sv:Dahomey"
    - "en:Kingdom of Dahomey"
  text: |
    **Dahomey** var ett kungarike i dagens Benin i Västafrika, grundat på 1600-talet av fon-folket med huvudstaden Abomey. Under kung **Agaja** (1718–1740) erövrade det 1727 kuststaden Ouidah (Whydah), en av de största slavhamnarna.

    Dahomey blev en starkt militariserad stat. Ekonomin byggde till stor del på att fånga människor i krig och räder mot grannfolk och sälja dem till europeiska slavhandlare mot skjutvapen, krut, tyger och kaurisnäckor (som användes som pengar). Kungen hade monopol på slavhandeln. Riket var känt för en kvinnlig elitkår, som européerna kallade "amasoner".

    Området kallades Slavkusten; uppskattningsvis över 1 miljon människor skeppades ut från Ouidah under slavhandelns tid. När britterna [förbjöd slavhandeln 1807](#slavhandel-forbjuden-1807) och patrullerade haven gick Dahomey över till palmolja. Frankrike erövrade riket 1892–1894. Jämför [Ashantiriket](#ashantiriket) i grannskapet (se det).

slavhandel:
  period: 1700
  label: "slavhandel"
  title: "Den atlantiska slavhandeln"
  wiki:
    - "sv:Atlantiska slavhandeln"
  text: |
    Den **atlantiska slavhandeln** var transporten av förslavade afrikaner över Atlanten till Amerika, från 1500-talet till omkring 1860. Totalt fördes uppskattningsvis 12,5 miljoner människor ombord på fartygen, och cirka 10,7 miljoner överlevde resan. 1700-talet var toppen, med uppåt 60 000–80 000 personer per år.

    Européerna fångade sällan själva slavarna. De köpte dem i hamnar vid Västafrikas kust av afrikanska stater och handlare (se [Dahomey](#dahomey), [Ashantiriket](#ashantiriket)), som fått fångarna i krig och räder, mot vapen, tyger, metall och alkohol. Överfarten, "Middle Passage", tog 1–3 månader i trånga lastrum; uppskattningsvis 12–15 % dog ombord. De största aktörerna var Portugal och Storbritannien; även Sverige och Danmark deltog i liten skala (Sverige ägde ön Saint-Barthélemy).

    Slavarna arbetade främst på socker-, tobaks- och bomullsplantager (se [Sockerplantager och slaveri i Karibien](#sockerplantager-och-slaveri-i-karibien)). [Storbritannien förbjöd handeln 1807](#slavhandel-forbjuden-1807), USA 1808, men slaveriet bestod längre: i USA till 1865, i Brasilien till 1888. Handeln formade befolkningen i Amerika och försvagade stora delar av Västafrika.

sierra-leone-grundas:
  period: 1780
  label: "Sierra Leone grundas"
  title: "Sierra Leone grundas 1787–1792"
  wiki:
    - "sv:Sierra Leone"
    - "en:Freetown"
  text: |
    Under [amerikanska frihetskriget](#amerikanska-kolonier-forlorade-1783) lovade britterna frihet åt slavar som flydde från rebellerna. Efter kriget hamnade tusentals av dessa så kallade *svarta lojalister* i London och i Nova Scotia i Kanada, ofta i fattigdom. Brittiska slaverimotståndare, bland andra Granville Sharp, ville ge dem en ny början i Afrika – en idé som blandade filantropi med en önskan att bli av med de fattiga.

    1787 seglade omkring 400 nybyggare till Västafrika och köpte land av en lokal hövding. Den första bosättningen dog nästan ut av sjukdomar och konflikter. 1792 kom omkring 1 200 frigivna från Nova Scotia och grundade **Freetown**, med stöd av Sierra Leone-kompaniet, där bl.a. [Wilberforce](#wilberforce-mot-slavhandeln) satt i ledningen. 1808 blev området brittisk kronkoloni.

    Efter att Storbritannien [förbjudit slavhandeln 1807](#slavhandel-forbjuden-1807) (se den) satte flottan i land befriade afrikaner från beslagtagna slavskepp i Freetown, uppskattningsvis omkring 80 000 under 1800-talet. Deras ättlingar, krio-folket, blev en elit. Jämför med Liberia, som amerikaner grundade på samma sätt 1822. Sierra Leone blev självständigt 1961.

kapkolonin-brittisk:
  period: 1800
  label: "Kapkolonin brittisk"
  title: "Kapkolonin blir brittisk 1795–1814"
  wiki:
    - "sv:Kapkolonin"
    - "en:Great Trek"
  text: |
    **Kapkolonin** vid Afrikas sydspets grundades 1652 av det nederländska Ostindiska kompaniet (VOC) som en proviantstation för fartyg på väg till Asien. Kolonisterna, kallade boer (holländska för bönder), spred sig inåt landet och tog mark från khoikhoi- och sanfolken.

    Under revolutionskrigen ockuperade Storbritannien kolonin 1795 för att hindra att Frankrike fick kontroll över sjövägen till Indien. Den lämnades tillbaka 1803, togs igen 1806 och blev formellt brittisk vid fredsuppgörelserna 1814–1815. Vid övertagandet bodde där uppskattningsvis 25 000 kolonister av europeiskt ursprung och ungefär lika många slavar.

    Brittiskt styre innebar engelska som officiellt språk och att slaveriet avskaffades 1834 (se [slaveriets avskaffande 1833](#slaveriet-avskaffas-1833)). Många boer missnöjda med detta vandrade på 1830-talet norrut i den så kallade **Stora trekket** och grundade egna republiker (Oranjefristaten, Transvaal). Konflikten mellan boer och britter ledde senare till [boerkrigen](#boerkriget-1899) 1880–1881 och 1899–1902, och lade grunden till det rasskiktade samhälle som blev Sydafrika och senare [apartheid](#apartheid-1948).

shaka-bygger-zuluriket:
  period: 1800
  label: "Shaka bygger zuluriket"
  title: "Shaka och zuluriket ca 1816–1828"
  wiki:
    - "sv:Shaka Zulu"
    - "en:Mfecane"
  text: |
    **Shaka** (ca 1787–1828) var hövding för zulu, då en liten klan bland bantutalande folk i nuvarande KwaZulu-Natal i östra Sydafrika. Han tog makten omkring 1816 och byggde på drygt tio år upp ett centraliserat kungadöme med en stående armé.

    Han reformerade krigföringen: soldaterna organiserades i åldersregementen (amabutho), fick ett kort stötspjut (iklwa) i stället för kastspjut, stora sköldar och en anfallsformation med ”horn” som omringade fienden. Armén växte till uppskattningsvis 20 000–40 000 man, och riket omfattade så småningom ett område stort som ungefär Danmark till flera gånger det.

    Shakas expansion sammanföll med en period av krig, flykt och folkomflyttningar i södra Afrika, kallad **mfecane** (”krossandet”). Omfattningen och orsakerna är omdebatterade bland historiker; torka och slavhandel från portugisiska Moçambique spelade sannolikt också in. Shaka mördades 1828 av sina halvbröder. Zuluriket bestod och besegrade britterna vid Isandlwana 1879, men erövrades kort därefter.

    Jämför med [Kapkolonin brittisk](#kapkolonin-brittisk).

algeriet-franskt:
  period: 1820
  label: "Algeriet franskt"
  title: "Algeriet blir franskt från 1830"
  wiki:
    - "en:French Algeria"
    - "en:French conquest of Algeria"
  text: |
    Frankrike invaderade Algeriet 1830 och intog Alger, sedan staden i tre århundraden varit huvudort för ett i praktiken självständigt styre under Osmanska riket, känt bland annat för sjöröveri i Medelhavet. Erövringen av inlandet tog nästan 20 år och mötte hårt motstånd från emiren **Abd el-Kader**, som enade arabiska och berberstammar och höll ut till 1847.

    Krigföringen var brutal och inbegrep förstörelse av byar och skördar; i vissa fall dödades människor som sökt skydd i grottor genom att fransmännen tände eld vid ingången. Algeriets befolkning, uppskattningsvis 3 miljoner 1830, minskade kraftigt av krig, svält och epidemier.

    Algeriet blev Frankrikes viktigaste koloni och från 1848 formellt franska departement. Europeiska nybyggare (kallade *pieds-noirs*) blev omkring en miljon på 1950-talet och ägde den bästa jorden, medan muslimerna saknade fulla medborgerliga rättigheter. Detta var grunden till det blodiga Algerietkriget 1954–1962. Erövringen var också startskottet för Frankrikes stora afrikanska kolonialvälde, som senare omfattade större delen av Väst- och Nordafrika.

    Se även [Algeriet erövras](#algeriet-erovras).

livingstone:
  period: 1840
  label: "Livingstone"
  title: "David Livingstone – upptäcktsresande i Afrika"
  wiki:
    - "sv:David Livingstone"
  text: |
    **David Livingstone** (1813–1873) var en skotsk läkare och missionär som började som barnarbetare i en bomullsspinneri. Han kom till södra Afrika 1841 och blev den förste europé som korsade kontinenten från väst till öst (1853–1856), från Luanda i Angola till Quelimane i Moçambique. Under resan nådde han 1855 det stora vattenfall som lokalt hette Mosi-oa-Tunya, ”röken som dundrar”, och som han döpte till **Victoriafallen**.

    Livingstone blev en kändis i Storbritannien. Han såg ”kristendom, handel och civilisation” som botemedel mot den arabisk-swahiliska slavhandeln, som fortfarande förde tiotusentals människor per år från Östafrika till Arabien och Indiska oceanens öar. Hans skildringar av slavhandelns grymheter bidrog till att Zanzibars slavmarknad stängdes 1873.

    På sin sista resa sökte han Nilens källor och var försvunnen i flera år. 1871 fann journalisten Henry Morton Stanley honom vid Tanganyikasjön med de berömda orden ”Dr. Livingstone, I presume?” Livingstone dog 1873 i nuvarande Zambia. Hans resor öppnade Afrikas inland för europeiskt intresse och blev en del av förspelet till kolonialmakternas ”[kapplöpning om Afrika](#berlinkonferensen-1884-kapplopningen-om)” på 1880-talet.

diamanter-i-kapkolonin-1867:
  period: 1860
  label: "Diamanter i Kapkolonin 1867"
  title: "Diamantfynden i Sydafrika 1867"
  wiki:
    - "en:Mineral Revolution"
    - "sv:Cecil Rhodes"
  text: |
    År 1867 hittades en diamant vid Oranjefloden i södra Afrika, och 1871 upptäcktes rika fyndigheter vid det som blev staden **Kimberley**. Området låg i gränslandet mellan den brittiska **Kapkolonin** (kring Kapstaden) och boerrepublikerna – stater som grundats av ättlingar till holländska nybyggare, kallade boer (”bönder”).

    Tiotusentals sökare strömmade dit och grävde ”Big Hole”, ett handgrävt hål ca 240 m djupt. Britterna annekterade området 1871. Affärsmannen **Cecil Rhodes** köpte upp gruvorna och grundade De Beers 1888, som länge kontrollerade runt 90 % av världens diamanthandel.

    Diamanterna – och guldfynden vid Witwatersrand 1886 – förvandlade södra Afrika från ett jordbruksområde till en gruvekonomi byggd på billig svart migrantarbetskraft i slutna arbetarläger, en föregångare till [apartheid](#apartheid-1948). Rivaliteten om rikedomarna ledde till boerkrigen (se ”[Boerkriget 1899](#boerkriget-1899)”).

berlinkonferensen-1884-kapplopningen-om:
  period: 1880
  label: "Berlinkonferensen 1884: kapplöpningen om Afrika"
  title: "Berlinkonferensen 1884–85 och kapplöpningen om Afrika"
  wiki:
    - "sv:Berlinkonferensen 1884–1885"
    - "sv:Kapplöpningen om Afrika"
  text: |
    År 1870 kontrollerade européer bara ca 10 % av Afrika, främst kustområden. År 1914 var det ungefär 90 % – bara Etiopien och Liberia var självständiga. Denna snabba erövring kallas **kapplöpningen om Afrika** (”Scramble for Africa”).

    För att undvika krig sinsemellan bjöd Bismarck in 14 stater till **Berlinkonferensen** november 1884–februari 1885. Inga afrikaner var med. Man kom överens om spelregler: en stat som ville göra anspråk på ett område måste ha ”effektiv ockupation” där och meddela de andra. Konferensen delade inte själv upp Afrika, men satte fart på uppdelningen; Kongo gick till Belgiens kung (se ”[Kongofristaten](#kongofristaten)”).

    Möjliggörande tekniker var [kinin mot malaria](#kininbark-mot-malaria), ångbåtar på floderna och kulsprutan (Maxim, 1884). Gränser drogs ofta med linjal på kartor, rakt genom folk och riken; många av dem är dagens statsgränser och en orsak till senare konflikter.

kongofristaten:
  period: 1880
  label: "Kongofristaten"
  title: "Kongofristaten 1885–1908"
  wiki:
    - "sv:Kongostaten"
    - "sv:Leopold II av Belgien"
  text: |
    **Kongofristaten** var inte en belgisk koloni utan den belgiske kungen **Leopold II**:s privata egendom, ett område i Kongoflodens bäcken ungefär 76 gånger så stort som Belgien. Han fick det erkänt vid [Berlinkonferensen 1885](#berlinkonferensen-1884-kapplopningen-om) genom att lova frihandel och kamp mot slavhandeln.

    I stället blev det ett system för plundring. När efterfrågan på gummi exploderade på 1890-talet (cykel- och bildäck) tvingades befolkningen samla vildgummi med kvoter. Leopolds privatarmé, Force Publique, tog gisslan, brände byar och högg av händer på människor. Våld, svält, sjukdom och sjunkande födelsetal gjorde att befolkningen minskade drastiskt; uppskattningarna varierar, ofta anges miljontals döda, men exakta siffror är osäkra.

    En internationell kampanj, ledd av bl.a. journalisten E.D. Morel och diplomaten Roger Casement, kallas ofta världens första stora människorättskampanj och använde fotografier som bevis. 1908 tvingades Leopold överlämna Kongo till belgiska staten. [Kongo blev självständigt 1960](#afrikas-ar-1960).

herero-folkmordet-1904:
  period: 1900
  label: "Herero-folkmordet 1904"
  title: "Folkmordet på herero och nama 1904–1908"
  wiki:
    - "sv:Folkmordet på herero och nama"
    - "sv:Tyska Sydvästafrika"
  text: |
    **Tyska Sydvästafrika** (dagens Namibia) var Tysklands [koloni från 1884](#berlinkonferensen-1884-kapplopningen-om). Tyska nybyggare tog mark och boskap från herero- och namafolken, som var boskapsskötare. I januari 1904 gjorde hererofolket uppror och dödade ca 120 tyska bosättare.

    Tyskland skickade generalen **Lothar von Trotha** med uppskattningsvis 10 000–15 000 soldater. Efter slaget vid Waterberg i augusti 1904 drevs hererofolket ut i Omaheke-öknen, där brunnarna vaktades. I oktober utfärdade von Trotha en **förintelseorder**: varje herero inom tyska gränsen skulle skjutas. Överlevande sattes i koncentrationsläger med tvångsarbete, där dödligheten var mycket hög. Nama gjorde uppror 1904 och drabbades på liknande sätt.

    Uppskattningsvis dog 60–80 % av hererofolket (siffror kring 65 000 anges ofta) och omkring hälften av nama. Det kallas ofta 1900-talets första folkmord. Tyskland erkände det officiellt som folkmord 2021. Historiker har diskuterat kopplingar i metoder och idéer till [Nazitysklands senare brott](#forintelsen).

sydafrikanska-unionen-1910:
  period: 1900
  label: "Sydafrikanska unionen 1910"
  title: "Sydafrikanska unionen 1910"
  wiki:
    - "sv:Sydafrikanska unionen"
    - "en:Natives Land Act, 1913"
  text: |
    Den 31 maj 1910, åtta år efter [boerkriget](#boerkriget), slogs de fyra brittiska kolonierna Kapkolonin, Natal, Transvaal och Oranjefristaten ihop till **Sydafrikanska unionen**, ett självstyrande dominion i brittiska imperiet, likt Kanada och Australien. Förste premiärminister blev boergeneralen **Louis Botha**, som bara tio år tidigare stridit mot britterna.

    Försoningen gällde de vita: britter och boer (afrikaner). Svarta afrikaner, som var ca två tredjedelar av befolkningen på knappt 6 miljoner, fick i stort sett ingen rösträtt utanför Kapprovinsen. 1913 följde **Natives Land Act**, som förbjöd svarta att äga eller hyra mark utanför reservat motsvarande ca 7 % av landet (senare 13 %).

    Som motreaktion grundades 1912 den organisation som blev **ANC** (African National Congress). Den rasistiska ordningen skärptes [efter 1948](#apartheid-1948) till **apartheid** och [föll först 1994](#apartheid-slut-1994), när Nelson Mandela blev president. Unionen blev republik 1961.

italien-invaderar-etiopien-1935:
  period: 1920
  label: "Italien invaderar Etiopien 1935"
  title: "Italien invaderar Etiopien 1935"
  wiki:
    - "sv:Andra italiensk-abessinska kriget"
    - "sv:Haile Selassie"
  text: |
    Etiopien, under kejsaren **Haile Selassie**, var tillsammans med Liberia det enda afrikanska land som inte koloniserats. Det hade redan 1896 slagit tillbaka en italiensk invasion vid Adwa, en förödmjukelse [Mussolini](#mussolini-1922) ville hämnas.

    I oktober 1935 anföll Italien med uppskattningsvis 400 000–500 000 man, flygplan och stridsvagnar mot en dåligt utrustad etiopisk armé. Italienarna använde senapsgas, i strid med internationell rätt. Addis Abeba föll i maj 1936. Uppskattningsvis 275 000 etiopier dog i kriget, och under ockupationen begicks massakrer.

    Nationernas förbund, föregångaren till FN, införde sanktioner men inte på olja, och Storbritannien och Frankrike lät [Suezkanalen](#suezkanalen-1869) vara öppen. Haile Selassie talade i Genève 1936 och varnade för att det som hände Etiopien kunde hända vem som helst. Förbundets misslyckande visade att det var verkningslöst, vilket [uppmuntrade Hitler](#hitler-1933). Etiopien befriades av brittiska och etiopiska styrkor 1941.

apartheid-1948:
  period: 1940
  label: "Apartheid 1948"
  title: "Apartheid 1948"
  wiki:
    - "sv:Apartheid"
  text: |
    Apartheid (afrikaans för ”åtskildhet”) var det system av lagstadgad rasåtskillnad som Sydafrika införde efter att Nationalistpartiet, som företrädde den vita afrikaansspråkiga befolkningen (boerna), vann valet 1948. Diskriminering fanns redan, men nu blev den totalt systematiserad.

    Varje person registrerades som vit, svart, färgad eller indisk. Blandäktenskap förbjöds, bostadsområden, skolor, bussar och stränder segregerades, och svarta måste bära passerkort. Svarta, omkring 70 % av befolkningen, hade ingen rösträtt och tilldelades formellt ”hemländer” som omfattade omkring 13 % av marken. Vid Sharpeville 1960 sköt polis ihjäl 69 demonstranter, och befrielserörelsen ANC förbjöds.

    ANC-ledaren **Nelson Mandela** satt fängslad i 27 år. Internationella sanktioner, bojkotter (Sverige var en tidig och stor stödjare av ANC) och inhemskt motstånd tvingade till slut fram förhandlingar. Mandela släpptes 1990, och [1994](#apartheid-slut-1994) hölls de första fria valen, där han blev president. Apartheid används idag som juridiskt begrepp för brott mot mänskligheten.

    Se även [Sydafrikanska unionen 1910](#sydafrikanska-unionen-1910).

ghana-fritt-1957:
  period: 1940
  label: "Ghana fritt 1957"
  title: "Ghanas självständighet 1957"
  wiki:
    - "sv:Ghana"
    - "sv:Kwame Nkrumah"
  text: |
    Ghana, tidigare den brittiska kolonin Guldkusten i Västafrika, blev 6 mars 1957 det första landet söder om Sahara att bli självständigt från en europeisk kolonialmakt. Namnet togs från ett medeltida västafrikanskt rike, [Ghanariket](#ghana-riket-guld-mot-salt-over-sahara).

    Ledaren var **Kwame Nkrumah**, utbildad i USA och Storbritannien, som organiserade strejker och bojkotter och fängslades av britterna innan han vann valen. Han blev premiärminister och sedan president. Han var en förgrundsgestalt för panafrikanismen, idén om afrikansk enhet, och var med och grundade Afrikanska enhetsorganisationen 1963. Han blev dock alltmer auktoritär och störtades i en militärkupp 1966.

    Ghana blev startskottet för Afrikas avkolonisering. Bara 1960, ”[Afrikas år](#afrikas-ar-1960)”, blev 17 länder självständiga. Kring 1975 var nästan hela kontinenten självständig. Många av de nya staterna fick gränser som kolonialmakterna dragit utan hänsyn till folkgrupper, vilket bidrog till senare konflikter. Jämför med [Indiens självständighet](#sjalvstandighet-och-delning-1947) tio år tidigare.

afrikas-ar-1960:
  period: 1960
  label: "Afrikas år 1960"
  title: "Afrikas år 1960"
  wiki:
    - "en:Year of Africa"
    - "en:Decolonisation of Africa"
  text: |
    1960 blev 17 afrikanska länder självständiga, de flesta tidigare franska kolonier i Väst- och Centralafrika (bland andra Senegal, Elfenbenskusten och Kamerun), men också Nigeria (från Storbritannien), Somalia och Belgiska Kongo. Därför kallas 1960 ”Afrikas år”.

    Bakgrund: vid ”[kapplöpningen om Afrika](#berlinkonferensen-1884-kapplopningen-om)” runt 1880–1914 delade europeiska makter upp nästan hela kontinenten mellan sig, ofta med raka linjer på kartan utan hänsyn till folkgrupper. Efter andra världskriget var Storbritannien och Frankrike försvagade, USA och Sovjet var emot traditionella kolonier, och självständighetsrörelser växte. [Ghana blev först söder om Sahara 1957](#ghana-fritt-1957). Jämför med [Indien 1947](#sjalvstandighet-och-delning-1947) och [Indonesien 1949](#indonesien-fritt) (se det).

    Vägen efteråt blev ofta svår. Kongo hamnade direkt i inbördeskrig, där FN ingrep och FN:s generalsekreterare Dag Hammarskjöld omkom 1961. Många länder fick enpartistyre eller militärdiktatur, gränsdragningen orsakade konflikter (se [Biafra](#biafra)), och kalla kriget gjorde Afrika till slagfält för stormakternas ombudskrig. Portugals kolonier blev fria först 1975 (se [nejlikerevolutionen](#nejlikerevolutionen-i-portugal-1974)), och i Sydafrika varade vitt minoritetsstyre till 1994 (se [Apartheid slut 1994](#apartheid-slut-1994)). Afrikas befolkning var 1960 cirka 280 miljoner; i dag är den omkring 1,5 miljarder.

biafra:
  period: 1960
  label: "Biafra"
  title: "Biafrakriget 1967–1970"
  wiki:
    - "sv:Biafrakriget"
  text: |
    Nigeria, självständigt från Storbritannien 1960, var Afrikas folkrikaste land med cirka 55 miljoner invånare och hundratals folkgrupper. De största var hausa i norr, yoruba i sydväst och igbo i sydöst. 1966 kom två militärkupper och massakrer på tusentals igbo i norr. Igbo flydde till sydöst.

    I maj 1967 utropade sydöstra Nigeria under överste **Odumegwu Ojukwu** självständighet som republiken **Biafra**. Området hade mycket av landets nyfunna olja. Nigerias regering anföll och omringade Biafra, som snart stängdes inne. Blockaden orsakade svält: uppskattningsvis 500 000 till 2 miljoner civila dog, de flesta av svält. Biafra kapitulerade i januari 1970.

    Bilderna på svältande barn blev några av de första tv-sända humanitära katastroferna. De ledde till en enorm luftbro av hjälporganisationer, där bland andra svenske greven Carl Gustaf von Rosen flög in hjälp. Franska läkare som arbetade där grundade senare Läkare utan gränser (1971). Kriget visade vad koloniala gränser kunde leda till (se [Afrikas år 1960](#afrikas-ar-1960)), och att Nigeria trots allt hölls ihop. Landet har i dag över 220 miljoner invånare.

apartheid-slut-1994:
  period: 1980
  label: "Apartheid slut 1994"
  title: "Apartheid upphör i Sydafrika 1994"
  wiki:
    - "sv:Apartheid"
    - "sv:Nelson Mandela"
  text: |
    **Apartheid** (afrikaans för ”åtskillnad”) var det system av rasåtskillnad som Sydafrikas regering, dominerad av den vita minoriteten, införde [från 1948](#apartheid-1948). Befolkningen delades in i raser enligt lag. Svarta, omkring tre fjärdedelar av befolkningen, saknade rösträtt, fick inte bo var de ville, behövde passerkort och hänvisades till sämre skolor och till fattiga ”hemländer”. Blandäktenskap var förbjudna.

    Den svarta befrielserörelsen **ANC** förbjöds 1960 efter massakern i Sharpeville, där polis dödade 69 demonstranter. Dess ledare **Nelson Mandela** dömdes 1964 till livstids fängelse och satt i 27 år. Under 1970–80-talen växte uppror i kåkstäderna och internationella sanktioner och bojkotter; Sverige var en av de tidigaste och största stödjarna av ANC. Efter kalla kriget fanns inte längre argumentet att regimen var ett bålverk mot kommunismen.

    Presidenten **F. W. de Klerk** släppte Mandela 1990 och förhandlade om övergång. Den 27 april 1994 hölls det första valet där alla fick rösta; ANC fick 62 procent och Mandela blev president. Övergången skedde utan inbördeskrig. En sannings- och försoningskommission granskade övergreppen. Mandela och de Klerk delade Nobels fredspris 1993. De ekonomiska klyftorna är dock fortfarande bland världens största.

rwanda-1994:
  period: 1980
  label: "Rwanda 1994"
  title: "Folkmordet i Rwanda 1994"
  wiki:
    - "sv:Folkmordet i Rwanda"
  text: |
    Rwanda är ett litet, tättbefolkat land i Centralafrika med då omkring 7 miljoner invånare. Befolkningen bestod främst av **hutu** (cirka 85 procent) och **tutsi** (cirka 14 procent). Under kolonialtiden gynnade Belgien tutsierna och förde in etnisk tillhörighet i identitetshandlingarna, vilket gjorde gruppgränserna fasta. Efter självständigheten 1962 styrde hutuer och tutsier förföljdes; många flydde. En tutsiledd gerilla, RPF, invaderade från Uganda 1990.

    Den 6 april 1994 sköts presidentens flygplan ned. Samma natt startade hutuextremister ett planerat folkmord. Armén och milisen Interahamwe, men också vanliga grannar, dödade tutsier och moderata hutuer, ofta med machete. Hatpropagandan spreds via radiostationen RTLM. På omkring 100 dagar dödades uppskattningsvis 500 000–800 000 människor.

    FN hade en fredsstyrka på plats men drog ned den i stället för att förstärka den; USA och andra länder undvek ordet ”folkmord” för att slippa ingripa. Folkmordet stoppades i juli när RPF under **Paul Kagame** tog makten; han styr fortfarande. Omkring 2 miljoner hutuer flydde till Kongo, vilket utlöste Kongokrigen med miljontals döda. En FN-domstol dömde ansvariga. Jämför med Srebrenica 1995 (se [Jugoslaviska krigen](#jugoslaviska-krigen)).

hiv:
  period: 1980
  label: "hiv"
  title: "Hivepidemin i Afrika"
  wiki:
    - "sv:Hiv"
    - "en:HIV/AIDS in Africa"
  text: |
    **Hiv** (humant immunbristvirus) är ett virus som angriper immunförsvarets vita blodkroppar. Obehandlad leder infektionen efter i snitt 8–10 år till **aids**, då kroppen inte längre klarar vanliga infektioner. Viruset sprids via blod, sex och från mor till barn. Genetiska studier visar att det gick över från schimpanser till människor i Centralafrika (kring Kinshasa) redan omkring 1920, men upptäcktes först 1981–83.

    Afrika söder om Sahara drabbades hårdast. Kring år 2000 var i vissa länder (Botswana, Sydafrika, Zimbabwe) uppskattningsvis 20–35 % av de vuxna smittade, och medellivslängden föll med 10–15 år. Totalt har omkring 40 miljoner människor i världen dött av aids, varav ungefär två tredjedelar i Afrika – en dödssiffra i samma storleksordning som [första världskriget](#forsta-varldskriget).

    Vändningen kom med bromsmediciner (antiretrovirala läkemedel) från 1996. De var först alldeles för dyra för Afrika (runt 10 000 dollar per person och år), men indiska kopior och biståndsprogram som amerikanska PEPFAR (2003) pressade priset under 100 dollar. I dag behandlas runt 30 miljoner människor och en smittad kan leva ett nästan normalt liv. Se även [AIDS](#aids) under Globalt.

darfur:
  period: 2000
  label: "Darfur"
  title: "Konflikten i Darfur"
  wiki:
    - "en:War in Darfur"
    - "sv:Darfur"
  text: |
    **Darfur** är en region i västra Sudan, ungefär lika stor som Frankrike, med uppskattningsvis 6 miljoner invånare 2003. Spänningar fanns länge mellan nomadiserande herdefolk som identifierade sig som arabiska och bofasta jordbrukande folk som identifierade sig som afrikanska, förstärkta av torka och kamp om mark och vatten. Nästan alla var muslimer.

    2003 gjorde rebellgrupper från de bofasta folken uppror mot regeringen i Khartoum, som de ansåg diskriminerade regionen. Diktatorn **Omar al-Bashir** svarade med flygbombningar och genom att beväpna arabiska ryttarmiliser, kallade **janjawid**, som brände byar, mördade och våldtog. Omkring 300 000 människor beräknas ha dött under de första åren, av våld, svält och sjukdom, och cirka 2,5 miljoner fördrevs. USA kallade det folkmord 2004.

    Darfur blev en internationell kampanjfråga, men FN:s och Afrikanska unionens fredsstyrkor kunde göra lite. Internationella brottmålsdomstolen i Haag utfärdade 2009 en arresteringsorder mot al-Bashir – första gången mot en sittande statschef. Han störtades 2019 men har inte utlämnats. Janjawid-milisen blev senare kärnan i RSF, som sedan 2023 strider mot armén. Se även [Inbördeskrig i Sudan](#inbordeskrig-i-sudan).

ebola-2014:
  period: 2000
  label: "ebola 2014"
  title: "Ebolaepidemin i Västafrika 2014–2016"
  wiki:
    - "en:Western African Ebola virus epidemic"
    - "sv:Ebola"
  text: |
    **Ebola** är en virussjukdom som orsakar hög feber, blödningar och organsvikt. Utan behandling dör ofta hälften eller fler av de smittade. Viruset upptäcktes 1976 i Kongo och tros finnas naturligt i fladdermöss. Det smittar genom direkt kontakt med kroppsvätskor från sjuka eller döda, inte genom luften – så tidigare utbrott hade varit små och lokala, med högst några hundra fall.

    Utbrottet som började i Guinea i december 2013 var annorlunda. Det spred sig till grannländerna **Liberia** och **Sierra Leone**, och för första gången in i större städer. Länderna var bland världens fattigaste, med svaga sjukvårdssystem efter långa inbördeskrig – Liberia hade bara ett par hundra läkare för över 4 miljoner invånare. Begravningsseder där man tvättar och rör vid den döde bidrog också till spridningen.

    Totalt rapporterades över 28 000 fall och omkring 11 300 döda – mer än alla tidigare ebolautbrott sammantagna. Världshälsoorganisationen WHO kritiserades för att ha reagerat för sent. Epidemin påskyndade utvecklingen av ett effektivt vaccin, godkänt 2019, och blev en varning inför [covid-19](#covid-19): hur snabbt en epidemi kan växa där sjukvården är svag.

inbordeskrig-i-sudan:
  period: 2020
  label: "Inbördeskrig i Sudan"
  title: "Inbördeskriget i Sudan från 2023"
  wiki:
    - "en:Sudanese civil war (2023–present)"
    - "sv:Sudan"
  text: |
    **Sudan** är ett av Afrikas största länder, med omkring 45–50 miljoner invånare. Diktatorn Omar al-Bashir (se [Darfur](#darfur)) störtades 2019 efter massiva fredliga protester. En övergång till civilt styre inleddes men avbröts av en militärkupp 2021, genomförd gemensamt av arméchefen **Abdel Fattah al-Burhan** och **Mohamed Hamdan Dagalo**, kallad Hemedti, ledare för den paramilitära styrkan **RSF** (Rapid Support Forces). RSF växte fram ur janjawid-milisen som begick övergrepp i Darfur.

    De två generalerna blev rivaler om makten, och i april 2023 bröt strider ut mellan armén och RSF i huvudstaden Khartoum och snart i stora delar av landet. Utomstående makter, bland annat Förenade Arabemiraten och Egypten, anklagas för att stödja olika sidor. RSF har anklagats för etnisk rensning och folkmord mot icke-arabiska folk i Darfur igen.

    FN har beskrivit situationen som världens största humanitära kris: omkring 12 miljoner människor har drivits på flykt, fler än i något annat land, och svält har konstaterats i flera områden. Antalet döda är mycket osäkert men uppskattas till tiotusentals, troligen betydligt fler. Kriget har fått långt mindre uppmärksamhet i väst än [Ukraina](#krig-mot-ukraina) och [Gaza](#oktober-2023-gazakriget-7).
