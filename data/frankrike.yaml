# Frankrike
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

robert-ii-kapetinger:
  period: 1000
  label: "Robert II (kapetinger)"
  title: "Robert II av Frankrike och kapetingerna"
  wiki:
    - "en:Robert II of France"
    - "sv:Kapetingerna"
  text: |
    **Robert II**, kallad den fromme, var kung av Frankrike 996–1031. Han
    var den andre kungen av ätten **kapetingerna**, uppkallad efter hans
    far Hugo Capet, som valdes till kung 987 när den gamla karolingiska
    ätten (Karl den stores släkt) dog ut.

    Kungen hade då mycket liten verklig makt. Han kontrollerade direkt
    bara ett litet område runt Paris och Orléans, ungefär lika stort som
    ett par svenska län. Hertigarna av Normandie, Aquitanien och Burgund
    och greven av Flandern var i praktiken självständiga och ofta
    mäktigare än kungen. Robert ägnade mycket tid åt att med vapen ta
    Burgund, och han ställde till kyrklig skandal genom sina äktenskap –
    påven bannlyste honom för att han gift sig med en släkting.

    Varför är kapetingerna viktiga? De höll ut. Genom att varje kung lät
    kröna sin son medan han själv levde säkrade de tronföljden, och ätten
    (med sidogrenar som Valois och Bourbon) regerade Frankrike fram till
    revolutionen 1789. Ur det lilla kärnområdet kring Paris växte långsamt
    den centraliserade franska staten fram. Jämför med
    [feodalismen](#svag-kungamakt-feodalism) som präglade Frankrike.

svag-kungamakt-feodalism:
  period: 1000
  label: "svag kungamakt, feodalism"
  title: "Feodalismen i Frankrike kring år 1000"
  wiki:
    - "sv:Feodalism"
    - "en:Feudalism"
  text: |
    **Feodalism** är det samhällssystem där makt och jord byttes mot
    trohet och krigstjänst. En kung eller hertig gav en adelsman ett län
    (jord med bönder som arbetade den), och adelsmannen svor i gengäld att
    vara herrens **vasall** – att lyda och strida för honom. Vasallen
    kunde i sin tur dela ut jord till egna vasaller. Längst ner fanns
    bönderna, ofta livegna: bundna vid jorden och skyldiga att arbeta åt
    herren.

    Systemet växte fram för att det saknades pengaekonomi och fungerande
    statsapparat. Utan skatteintäkter kunde kungen inte betala en armé; i
    stället ”betalade” han med jord. Problemet var att makten då hamnade
    lokalt. Kring år 1000 hade Frankrike splittrats i hundratals små
    herradömen där borgherrar styrde över några byar var. Kungen var
    formellt överhuvud men praktiskt taget maktlös utanför Paris-området.

    Jämför med Kina vid samma tid, där [Songdynastin](#songdynastin)
    styrde ett rike på uppskattningsvis 100 miljoner människor med betalda
    tjänstemän rekryterade genom examensprov. Det tog Europa flera hundra
    år att bygga upp centralstater igen; den franska kungamakten blev
    stark först på 1200-talet.

gudsfredsrorelsen:
  period: 1000
  label: "Gudsfredsrörelsen"
  title: "Gudsfreden – kyrkan försöker tämja riddarna"
  wiki:
    - "en:Peace and Truce of God"
    - "sv:Gudsfred"
  text: |
    **Gudsfreden** (latin *Pax Dei*) var en rörelse som startade i södra
    och mellersta Frankrike kring 975–1000. Eftersom kungen var för svag
    för att hålla ordning slogs lokala riddare och borgherrar ständigt med
    varandra och plundrade bönder, präster och kloster. Kyrkan tog då
    själv initiativet.

    Biskopar kallade till stora möten ute på fälten, dit man bar
    helgonreliker (ben och föremål från helgon som ansågs ha övernaturlig
    kraft). Där fick riddarna svära att inte angripa obeväpnade: präster,
    munkar, bönder, kvinnor, köpmän, boskap och kyrkor. Den som bröt eden
    hotades med bannlysning – uteslutning ur kyrkan, vilket man trodde
    betydde evig förtappelse.

    Från omkring 1027 kom en skärpning, **Gudsvapenvilan** (*Treuga Dei*):
    inga strider alls från onsdag kväll till måndag morgon och under
    kyrkliga högtider. Effekten var begränsad, men rörelsen är viktig av
    två skäl. Den är ett tidigt försök till folkrätt – regler för vilka
    som får angripas i krig – och den visar hur kyrkan började styra
    riddarnas våld. Nästa steg var att leda våldet utåt: [korstågen från
    1095](#paven-utlyser-korstag-i-clermont-1095).

henrik-i-1031:
  period: 1020
  label: "Henrik I 1031"
  title: "Henrik I av Frankrike 1031"
  wiki:
    - "en:Henry I of France"
    - "en:Anne of Kiev"
  text: |
    **Henrik I** (1008–1060) var kung av Frankrike 1031–1060, den tredje
    kungen av ätten kapetingerna. Han ärvde en [svag
    kungamakt](#svag-kungamakt-feodalism): kungen kontrollerade direkt
    bara området kring Paris och Orléans, medan stora hertigar och grevar
    i praktiken var självständiga.

    Hans regering började med uppror från hans egen mor och bror, som
    ville ha brodern Robert på tronen. Henrik besegrade dem med hjälp av
    hertigen av Normandie men tvingades ge bort Burgund till brodern, vars
    ättlingar sedan styrde Burgund i över 300 år. Senare under hans
    regering växte **Normandie** under [hertig
    Vilhelm](#vilhelm-av-normandie-sakrar-makten-val) (sedermera
    Erövraren) till en farlig rival, och Henrik förlorade två fälttåg mot
    honom 1054 och 1057.

    Henrik är mest känd för sitt äktenskap. Eftersom kyrkan förbjöd
    giftermål med släktingar och nästan alla västeuropeiska prinsessor var
    avlägset släkt med honom, hämtade han 1051 en brud från Kiev:
    **Anna**, dotter till storfurst [Jaroslav den
    vise](#jaroslav-den-vise) och den svenska prinsessan Ingegerd. Deras
    son fick det grekiska namnet Filip, som sedan blev ett vanligt franskt
    kunganamn. Det visar hur tätt Europas kungahus var sammanflätade, från
    Sverige till Kiev och Paris.

normandiska-riddare-soker-lycka-i-soder:
  period: 1020
  label: "normandiska riddare söker lycka i söder"
  title: "Normandiska riddare söker lyckan i söder"
  wiki:
    - "sv:Normander"
    - "en:Norman conquest of southern Italy"
  text: |
    **Normandie** i norra Frankrike grundades 911 när den franske kungen
    gav området till vikingahövdingen Rollo mot att han skyddade landet
    mot andra vikingar. Ättlingarna – **normanderna** (”nordmännen”) –
    blev snabbt fransktalande och kristna, men behöll en krigisk och
    expansiv kultur. De blev skickliga ryttare och borgbyggare.

    Normandie hade många söner i adelsfamiljerna men begränsat med jord
    att ärva, eftersom äldste sonen ofta fick allt. Yngre söner fick
    därför söka lyckan på annat håll som legosoldater. Från omkring 1017
    strömmade normandiska riddare till **Syditalien**, där bysantinare,
    langobardiska furstar och muslimer i Sicilien slogs om makten. Ett
    känt exempel är bröderna Hauteville: tolv söner till en småadelsman,
    varav flera blev furstar.

    Det ledde till att normander [erövrade Syditalien och
    Sicilien](#normander-i-syditalien) (se Europa ~1020) och grundade
    [kungariket Sicilien 1130](#roger-ii-normandiska-kungariket-sicilien).
    Samtidigt erövrade Vilhelm av Normandie [England
    1066](#stamford-bridge-och-hastings-1066), och normander var ledande i
    [första korståget](#forsta-korstaget-jerusalem-intas-1099) 1096–1099.
    På mindre än hundra år hade ättlingarna till några tusen vikingar
    tagit kungakronor i England, Syditalien och Antiokia i Mellanöstern.

henrik-i:
  period: 1040
  label: "Henrik I"
  title: "Henrik I av Frankrike"
  wiki:
    - "sv:Henrik I av Frankrike"
    - "sv:Kapetingerna"
  text: |
    **Henrik I** (1008–1060) var kung av Frankrike 1031–1060, av den
    **kapetingiska** ätten – kungasläkten som grundats av Hugo Capet 987
    och som (med sidogrenar) styrde Frankrike till revolutionen 1789.

    [Frankrikes kung var vid den här tiden
    svag](#svag-kungamakt-feodalism). Han kontrollerade i praktiken bara
    ett litet område kring Paris och Orléans. Resten av landet styrdes av
    mäktiga hertigar och grevar, som formellt var kungens vasaller
    (adelsmän som lovat kungen trohet i utbyte mot land), men ofta var
    starkare än han – till exempel hertigen av Normandie.

    Henrik hjälpte först den unge Vilhelm av Normandie att behålla makten
    ([Val-ès-Dunes 1047](#vilhelm-av-normandie-sakrar-makten-val)), men
    vände sig sedan emot honom och förlorade. Han gifte sig med **Anna av
    Kiev**, dotter till storfursten [Jaroslav](#jaroslav-den-vise) av
    Kievrus – ett tecken på hur långt Europas dynastiska nät sträckte sig.
    Deras son Filip I blev nästa kung.

vilhelm-av-normandie-sakrar-makten-val:
  period: 1040
  label: "Vilhelm av Normandie säkrar makten (Val-ès-Dunes 1047)"
  title: "Slaget vid Val-ès-Dunes 1047"
  wiki:
    - "sv:Vilhelm Erövraren"
    - "en:Battle of Val-ès-Dunes"
  text: |
    **Vilhelm av Normandie** (cirka 1028–1087), senare kallad Erövraren,
    blev hertig av Normandie i norra Frankrike redan som sjuåring (1035).
    Han var oäkta son till förre hertigen, och flera av hans förmyndare
    mördades. **Normandie** var grundat av vikingar som fått land av
    franske kungen år 911 – därav namnet ("nordmännens land").

    År 1047 gjorde baroner i västra Normandie uppror. Den unge Vilhelm,
    cirka 19 år, fick hjälp av franske kungen [Henrik I](#henrik-i) och de
    vann slaget vid Val-ès-Dunes nära Caen. Slaget var nästan ett rent
    kavallerislag, med uppskattningsvis några tusen ryttare på var sida.

    Varför det spelar roll: segern gav Vilhelm kontroll över Normandie.
    Han byggde upp ett av Europas mest centraliserade hertigdömen, med
    lojala vasaller och borgar. Det var den basen som gjorde det möjligt
    för honom att 19 år senare samla en armé och [erövra
    England](#vilhelm-erovraren) (se [Hastings
    1066](#stamford-bridge-och-hastings-1066)).

filip-i:
  period: 1060
  label: "Filip I"
  title: "Filip I av Frankrike (1060–1108)"
  wiki:
    - "sv:Filip I av Frankrike"
  text: |
    **Filip I** (1052–1108) var kung av Frankrike 1060–1108 – nästan 50 år
    – av den kapetingiska ätten. Han var son till [Henrik I](#henrik-i)
    och Anna av Kiev, och hans namn, som var grekiskt och ovanligt i väst,
    kom från hennes släkt.

    [Kungamakten var fortfarande svag](#svag-kungamakt-feodalism): Filip
    kontrollerade bara området kring Paris och Orléans, medan hans
    vasaller, till exempel hertigen av Normandie, var rikare och starkare.
    När hans vasall [Vilhelm av Normandie blev kung av England
    1066](#vilhelm-erovraren) hade Frankrike plötsligt en granne som var
    formellt underordnad men i praktiken mäktigare. Filip lade mycket
    kraft på att stödja Vilhelms söner mot varandra.

    Han är mest ihågkommen för en skandal: 1092 förskjöt han sin hustru
    och gifte sig med Bertrade av Montfort, som redan var gift med greven
    av Anjou. Påven bannlyste honom – uteslöt honom ur kyrkan. Därför
    deltog han inte i [första korståget
    (1096–1099)](#forsta-korstaget-jerusalem-intas-1099), trots att många
    av dess ledare var franska adelsmän, bland dem hans egen bror.

normandisk-expansion-till-england:
  period: 1060
  label: "normandisk expansion till England"
  title: "Normandisk expansion till England"
  wiki:
    - "sv:Normander"
    - "en:Norman conquest of England"
  text: |
    **Normandie**, i norra Frankrike, grundades år 911 när den franske
    kungen gav land åt vikingahövdingen Rollo mot att han skyddade landet
    mot andra vikingar. Inom ett par generationer blev normanderna
    fransktalande, kristna riddare – men behöll en expansiv krigarkultur.

    Mellan 1016 och 1100 erövrade normander Syditalien och Sicilien (se
    [Robert Guiscard](#normander-under-robert-guiscard)), [England
    (1066)](#stamford-bridge-och-hastings-1066), och deltog som ledare i
    [första korståget](#forsta-korstaget-jerusalem-intas-1099), där en
    normand grundade furstendömet Antiochia i Syrien. Hemligheten var en
    kombination av tungt pansarkavalleri, borgbyggande och snabb
    anpassning till lokala förvaltningssystem.

    Varför det spelar roll för Frankrike: när hertigen av Normandie också
    blev kung av England blev en fransk vasall en självständig kung. Under
    1100-talet ärvde de engelska kungarna ([anjouriket under Henrik
    II](#henrik-ii-1154-angevinska-riket)) halva Frankrike. Konflikten om
    de engelska kungarnas franska länder höll på i århundraden och
    kulminerade i **hundraårskriget** (1337–1453). Först efter det var
    England och Frankrike tydligt åtskilda.

paven-utlyser-korstag-i-clermont-1095:
  period: 1080
  label: "Påven utlyser korståg i Clermont 1095"
  title: "Påven utlyser korståg 1095"
  wiki:
    - "sv:Första korståget"
    - "en:Council of Clermont"
  text: |
    I november 1095 höll påven **Urban II** ett kyrkomöte i Clermont i
    mellersta Frankrike. Han hade fått en vädjan från den bysantinske
    kejsaren Alexios I om hjälp mot turkarna, som efter slaget vid
    [Manzikert 1071](#manzikert-1071-seldjuker-krossar-bysans) tagit
    större delen av Anatolien. I ett tal på ett fält utanför staden
    uppmanade Urban de västeuropeiska riddarna att i stället för att kriga
    mot varandra dra österut, hjälpa de kristna i öst och befria
    Jerusalem.

    Det nya var löftet att deltagarna skulle få sina synder förlåtna –
    kriget framställdes som en botgöring och pilgrimsfärd. Publiken ska ha
    ropat ”Deus vult!” (Gud vill det!). Gensvaret blev enormt:
    uppskattningsvis 60 000–100 000 människor gav sig av 1096–1097, varav
    kanske en femtedel var stridande. Avståndet till Jerusalem landvägen
    var ca 4 000 km.

    Urban hade också egna motiv: att stärka påvens ledning av kristenheten
    under investiturstriden mot den tyske kejsaren (se [Henrik IV mot
    påven](#henrik-iv-mot-paven-motkungar)) och kanske förena den västliga
    och östliga kyrkan som [splittrats
    1054](#stora-schismen-1054-katolska-och). Talet blev startskottet för
    nästan 200 år av korståg (se [Första korståget: Jerusalem intas
    1099](#forsta-korstaget-jerusalem-intas-1099)).

cluny-reformen:
  period: 1080
  label: "Cluny-reformen"
  title: "Cluny-reformen"
  wiki:
    - "sv:Cluny kloster"
    - "en:Cluniac Reforms"
  text: |
    Klostret **Cluny** i Burgund grundades 910 med en ovanlig regel: det
    skulle lyda direkt under påven och inte under någon lokal adelsman
    eller biskop. På den tiden var kloster och kyrkor ofta i praktiken
    ägda av adeln, som tillsatte släktingar som abbotar och biskopar och
    tog en del av inkomsterna.

    Cluny blev mönster för en reformrörelse som ville rena kyrkan från två
    saker: **simoni** (att köpa och sälja kyrkliga ämbeten) och gifta
    präster. Cluny växte till ett nätverk av omkring 1 000 underordnade
    kloster över hela Europa, styrda från moderklostret – en sorts
    multinationell koncern. Klosterkyrkan Cluny III, påbörjad 1088, var
    med sina ca 187 meters längd världens största kyrka fram till att
    Peterskyrkan i Rom byggdes på 1500-talet.

    Reformtankarna spreds till påvedömet, och flera påvar var Cluny-munkar
    – bl.a. Urban II, som [utlyste korståget
    1095](#paven-utlyser-korstag-i-clermont-1095). De ledde till
    [investiturstriden](#investiturstriden-borjar): striden om vem som
    fick utse biskopar, kungen eller påven (se [Henrik IV mot
    påven](#henrik-iv-mot-paven-motkungar)). Senare kritiserades Cluny
    självt för rikedom och lyx, vilket gav upphov till den strängare
    cisterciensorden 1098.

ludvig-vi:
  period: 1100
  label: "Ludvig VI"
  title: "Ludvig VI av Frankrike"
  wiki:
    - "sv:Ludvig VI av Frankrike"
    - "en:Louis VI of France"
  text: |
    **Ludvig VI**, kallad ”den tjocke” (kung 1108–1137), tillhörde
    **Capetingerna**, den släkt som styrt Frankrike sedan 987. Men
    [kungens makt var vid den här tiden mycket
    liten](#svag-kungamakt-feodalism). Det mesta av Frankrike styrdes av
    mäktiga hertigar och grevar – hertigen av Normandie var samtidigt kung
    av England och mycket rikare än den franske kungen. Kungen
    kontrollerade i praktiken bara ett område kring Paris och Orléans,
    ungefär 200 km långt.

    Ludvig ägnade större delen av sitt liv åt att få ordning i detta
    kärnland: han slog ner småbaroner som rånade resande och kyrkor från
    sina borgar. Han allierade sig med kyrkan och städerna, som ville ha
    ordning. Hans rådgivare var abboten **Suger** av Saint-Denis, som
    skrev hans biografi och som senare byggde om [klosterkyrkan i
    Saint-Denis](#saint-denis-1137-forsta-gotiska-kyrkan) i den nya
    gotiska stilen – början på gotiken.

    1124 hotades Frankrike av en invasion från den tyske kejsaren [Henrik
    V](#henrik-v); Ludvig samlade en ovanligt stor här från hela riket,
    och kejsaren vände. Han gifte bort sin son med **[Eleonora av
    Akvitanien](#ludvig-vii-gifter-sig-med-eleonora-av)**, arvtagerska
    till stora delar av sydvästra Frankrike. Han lade grunden till att den
    franska kungamakten under de följande 200 åren långsamt blev Europas
    starkaste.

abelard-undervisar-i-paris:
  period: 1100
  label: "Abélard undervisar i Paris"
  title: "Abélard i Paris"
  wiki:
    - "sv:Pierre Abélard"
    - "en:Peter Abelard"
  text: |
    **Petrus Abélard** (1079–1142) var en fransk filosof och teolog, och
    den mest berömda läraren i Paris omkring 1110–1120. Hans undervisning
    lockade studenter från hela Europa och var en av orsakerna till att
    [Paris universitet](#universitet-i-paris-och-oxford-tar-form) växte
    fram omkring 1200.

    Hans metod var att använda **logik** på teologiska frågor. I boken
    *Sic et non* (”Ja och nej”) samlade han citat från Bibeln och
    kyrkofäderna som verkade motsäga varandra, och visade hur man genom
    att noga definiera begreppen kunde lösa motsägelserna. Han skrev:
    ”Genom att tvivla kommer vi till frågandet, genom frågandet till
    sanningen.” Det blev grunden till **skolastiken**, den medeltida
    universitetsmetoden att diskutera frågor genom systematiska argument
    för och emot. Han deltog också i debatten om **universalier** – om
    allmänbegrepp som ”människa” finns på riktigt eller bara är ord – en
    tidig form av frågor som idag rör typer och klasser.

    Han är kanske mest känd för sin kärleksaffär med sin elev **Héloïse**,
    som fick ett barn; hennes farbror lät som hämnd kastrera honom. Båda
    gick i kloster och deras brevväxling är berömd. Han dömdes två gånger
    för kätteri, 1121 och 1141, efter angrepp från bl.a. Bernhard av
    Clairvaux. Jämför med [universitetet i
    Bologna](#universitetet-i-bologna-1088), som växte fram samtidigt.

saint-denis-1137-forsta-gotiska-kyrkan:
  period: 1120
  label: "Saint-Denis 1137: första gotiska kyrkan"
  title: "Saint-Denis – gotikens födelse"
  wiki:
    - "en:Basilica of Saint-Denis"
    - "en:Abbot Suger"
    - "sv:Gotik"
  text: |
    Klosterkyrkan i **Saint-Denis**, strax norr om Paris, var de franska
    kungarnas gravkyrka. Abboten **Suger**, nära rådgivare till kungarna
    Ludvig VI och Ludvig VII, lät bygga om den med start i slutet av
    1130-talet; västfasaden blev klar omkring 1140 och det nya koret
    invigdes 1144. Det räknas som det första gotiska byggnadsverket.

    Den tidigare [romanska stilen](#speyerdomen-paborjas) hade tjocka
    murar, rundbågar och små fönster, eftersom murarna måste bära valvens
    tyngd. [Gotiken kombinerade tre
    tekniker](#gotisk-byggteknik-spetsbage-stravpelare): spetsbågar (som
    leder trycket mer rakt nedåt), kryssribbvalv (där tyngden samlas i
    ribbor och pelare i stället för väggar) och senare strävbågar (yttre
    stöd). Då kunde väggarna ersättas av stora glasmålningar. För Suger
    var ljuset teologi: Gud som ljus.

    Stilen spred sig snabbt: [Notre-Dame i Paris
    (1163)](#notre-dame-i-paris-paborjas-1163), Chartres och sedan över
    hela Europa – i Sverige till exempel Uppsala domkyrka från slutet av
    1200-talet. Ordet ”gotik” är ett skällsord från renässansen, då man
    ansåg stilen barbarisk (”som goterna”). Som jämförelse byggdes [Angkor
    Wat](#angkor-wat-byggs) i Kambodja ungefär samtidigt.

ludvig-vii-gifter-sig-med-eleonora-av:
  period: 1120
  label: "Ludvig VII gifter sig med Eleonora av Akvitanien"
  title: "Ludvig VII och Eleonora av Akvitanien 1137"
  wiki:
    - "sv:Eleonora av Akvitanien"
    - "sv:Ludvig VII av Frankrike"
  text: |
    **Eleonora av Akvitanien** (ca 1122–1204) var arvtagare till
    hertigdömet Akvitanien i sydvästra Frankrike – ett område mycket
    större och rikare än det som den franske kungen själv direkt
    kontrollerade runt Paris. Vid denna tid var den franske kungen bara
    formellt överhuvud för stora vasaller (länsherrar som lydde under
    kungen) som ofta var mäktigare än han.

    1137, när Eleonora var i 13–15-årsåldern, gifte hon sig med den
    17-årige **Ludvig**, son till kung [Ludvig VI](#ludvig-vi). Samma
    sommar dog fadern och paret blev kung och drottning av Frankrike.
    Äktenskapet var ett stort maktpolitiskt kap: det skulle ungefär
    fördubbla den franska kronans landområden.

    Men paret passade dåligt ihop: Ludvig var from och försiktig, Eleonora
    livlig och politiskt ambitiös. Båda följde med på [andra
    korståget](#andra-korstaget-114749) (1147–49), där relationen sprack.
    De fick två döttrar men ingen son, och 1152 upplöstes äktenskapet med
    hänvisning till att de var för nära släkt. Åtta veckor senare gifte
    Eleonora om sig med Henrik av Anjou, snart kung av England – och
    Akvitanien hamnade under engelska kungar (se [Eleonora gifter om sig
    1152](#eleonora-gifter-om-sig-med-henrik-ii)). Det lade grunden till
    300 års konflikter mellan England och Frankrike, fram till
    [hundraåriga krigets slut 1453](#hundraarskriget-slut-1453).

andra-korstaget-ludvig-vii:
  period: 1140
  label: "Andra korståget (Ludvig VII)"
  title: "Ludvig VII och andra korståget"
  wiki:
    - "sv:Andra korståget"
    - "sv:Ludvig VII av Frankrike"
  text: |
    När korsfararstaten Edessa (i dagens sydöstra Turkiet) föll 1144 (se
    [Zengi tar Edessa](#zengi-tar-edessa-1144)) utlyste påven ett nytt
    korståg. Den mest inflytelserike predikanten var **Bernhard av
    Clairvaux**, ledaren för cisterciensorden, som 1146 i Vézelay fick
    tusentals att ta korset. Den franske kungen **Ludvig VII** blev en av
    två ledare, tillsammans med den tyske kungen [Konrad
    III](#konrad-iii-hohenstaufen-1138). Det var första gången kungar
    själva ledde ett korståg.

    Ludvig drog iväg 1147 med uppskattningsvis 15 000–25 000 man, och
    drottning Eleonora av Akvitanien följde med. Marschen genom Anatolien
    blev en katastrof: i januari 1148 överfölls hären i bergen vid Kadmos
    av turkarna och led stora förluster. Ludvig fortsatte till sjöss med
    en del av hären från Attaleia, men lämnade många kvar.

    Väl i Jerusalem beslutade korsfararna att anfalla Damaskus – en
    muslimsk stad som faktiskt varit allierad med kungariket Jerusalem.
    Belägringen i juli 1148 gav upp efter bara fyra dagar. Ludvig
    återvände 1149 utan resultat. Misslyckandet stärkte de muslimska
    härskarna, och på resan brast även äktenskapet med Eleonora, vilket
    fick långtgående följder (se [Eleonora gifter om sig
    1152](#eleonora-gifter-om-sig-med-henrik-ii)).

eleonora-gifter-om-sig-med-henrik-ii:
  period: 1140
  label: "Eleonora gifter om sig med Henrik II 1152"
  title: "Eleonora gifter om sig med Henrik 1152"
  wiki:
    - "sv:Eleonora av Akvitanien"
    - "sv:Henrik II av England"
  text: |
    I mars 1152 upplöstes äktenskapet mellan **Eleonora av Akvitanien**
    och den franske kungen Ludvig VII, formellt för att de var för nära
    släkt, i praktiken för att det inte fungerade och inte gav någon son
    (se [Ludvig VII gifter sig med
    Eleonora](#ludvig-vii-gifter-sig-med-eleonora-av)). Hon fick tillbaka
    sitt hertigdöme Akvitanien, en stor och rik del av sydvästra
    Frankrike.

    Bara åtta veckor senare, i maj 1152, gifte hon sig med **Henrik av
    Anjou**, elva år yngre, som redan härskade över Normandie och Anjou.
    Det var en chock för Ludvig: hans vasall hade plötsligt blivit
    mäktigare än han själv. Två år senare blev Henrik [kung av England som
    Henrik II](#henrik-ii-1154-angevinska-riket), och Eleonora blev
    drottning av sitt andra land.

    Paret fick åtta barn, bland dem två kungar av England: **[Rikard
    Lejonhjärta](#rikard-lejonhjarta)** och **[Johan utan
    land](#johan-utan-land-forlorar-normandie-1204)**. Men äktenskapet
    blev stormigt; 1173 stödde Eleonora sina söners uppror mot Henrik, som
    höll henne fängslad i 16 år. Hon levde till 82 års ålder och var
    politiskt aktiv in i det sista. Följden av giftermålet blev att
    Akvitanien var engelskt i 300 år, vilket var en huvudorsak till
    hundraåriga kriget (1337–1453). Bordeaux-vinets ställning i England är
    ett arv från den tiden.

notre-dame-i-paris-paborjas-1163:
  period: 1160
  label: "Notre-Dame i Paris påbörjas 1163"
  title: "Notre-Dame i Paris påbörjas 1163"
  wiki:
    - "sv:Notre-Dame de Paris"
    - "en:Maurice de Sully"
  text: |
    Paris var på 1100-talet på väg att bli Europas största stad och de
    franska kungarnas huvudstad. Biskopen **Maurice de Sully** lät riva
    den gamla katedralen på ön Île de la Cité och börja bygga en ny i den
    nya gotiska stilen, som skapats i
    [Saint-Denis](#saint-denis-1137-forsta-gotiska-kyrkan) bara 20 år
    tidigare (se dit). Enligt traditionen lades grundstenen 1163 i närvaro
    av påven Alexander III.

    Bygget tog omkring 180 år; koret var klart 1182, fasaden med de två
    tornen omkring 1250 och det mesta 1345. Kyrkan är 128 meter lång och
    valven 33 meter höga – mycket högre än tidigare kyrkor – vilket krävde
    [strävbågar](#gotisk-byggteknik-spetsbage-stravpelare), yttre
    stödbågar som tar upp valvens tryck. Notre-Dame var en av de första
    byggnaderna där de användes i stor skala.

    Katedralen har spelat roll i fransk historia i 850 år: Napoleon
    kröntes där 1804, och Victor Hugos roman *Ringaren i Notre-Dame*
    (1831) räddade den från förfall. Branden i april 2019 förstörde taket
    och spiran; den återinvigdes i december 2024 efter en restaurering på
    drygt fem år – betydligt snabbare än det ursprungliga bygget.

filip-ii-august-starker-kungamakten:
  period: 1180
  label: "Filip II August stärker kungamakten"
  title: "Filip II August"
  wiki:
    - "sv:Filip II av Frankrike"
    - "en:Philip II of France"
  text: |
    **Filip II August** (1165–1223) var kung av Frankrike 1180–1223. När
    han tillträdde kontrollerade kungen själv bara ett litet område runt
    Paris; stora delar av landet ägdes av mäktiga vasaller, värst av alla
    den engelske kungen, som genom huset Plantagenet ägde Normandie, Anjou
    och Akvitanien – mer av Frankrike än kungen själv.

    Filip deltog i [tredje korståget](#tredje-korstaget-118992) men åkte
    hem tidigt för att utnyttja [Rikard Lejonhjärtas](#rikard-lejonhjarta)
    frånvaro. Hans stora framgång kom mot Rikards bror Johan: 1204 tog han
    Normandie (se ”[Johan utan
    land](#johan-utan-land-forlorar-normandie-1204)”), och vid [Bouvines
    1214](#bouvines-1214) (se detta) besegrade han en koalition av England
    och den tyske kejsaren.

    Han byggde också en förvaltning med avlönade tjänstemän (*baillis*) i
    stället för att lita på adeln, kungens arkiv fick en fast plats i
    Paris, och han lät mura in staden och stensätta gator. Kungadömets
    landområden ungefär tredubblades. Det lade grunden för det
    centraliserade Frankrike som sedan blev Europas starkaste stat.

bouvines-1214:
  period: 1200
  label: "Bouvines 1214"
  title: "Slaget vid Bouvines 1214"
  wiki:
    - "sv:Slaget vid Bouvines"
    - "en:Battle of Bouvines"
  text: |
    Slaget vid **Bouvines** i nordöstra Frankrike, 27 juli 1214, var ett
    av medeltidens mest avgörande. På ena sidan stod Frankrikes kung
    **[Filip II August](#filip-ii-august-starker-kungamakten)**. På den
    andra en koalition: tysk-romerske kejsaren Otto IV (av släkten
    welfer), greven av Flandern och andra, finansierade av [Johan utan
    land](#johan-utan-land-forlorar-normandie-1204) av England, som
    samtidigt anföll från sydväst.

    Arméerna var små med moderna mått, uppskattningsvis kring 7 000–9 000
    man på franska sidan och något fler på koalitionens; uppgifterna är
    osäkra. Filip vann en tydlig seger, greven av Flandern tillfångatogs,
    och Otto flydde.

    Följderna kom i tre länder. I Frankrike säkrades erövringen av
    Normandie och kungamakten stärktes. I England var Johan försvagad, och
    baronerna tvingade honom till [Magna Carta](#magna-carta-1215) året
    efter. I Tyskland förlorade Otto IV kejsarkronan till Fredrik II av
    Hohenstaufen (se ”[welfer mot
    Hohenstaufen](#welfer-mot-hohenstaufen)”). Ett enda slag på en
    eftermiddag formade alltså tre staters utveckling.

korstag-mot-katarerna-1209:
  period: 1200
  label: "korståg mot katarerna 1209"
  title: "Albigenserkorståget 1209"
  wiki:
    - "sv:Albigenserkriget"
    - "sv:Katarer"
    - "en:Albigensian Crusade"
  text: |
    **Katarerna** (även kallade albigenser, efter staden Albi) var en
    kristen rörelse i södra Frankrike (Languedoc) som katolska kyrkan såg
    som kättare. De trodde att den materiella världen var skapad av en ond
    makt och att själen måste befrias från den. Deras präster, ”de
    fullkomliga”, levde asketiskt, vilket stod i skarp kontrast till många
    katolska prelater. Läran hade stöd bland adeln i regionen.

    1208 mördades ett påvligt sändebud, och påven Innocentius III utlyste
    ett **korståg** mot katarerna – första gången ett korståg riktades mot
    kristna i Västeuropa. 1209 stormades staden Béziers, och tusentals
    invånare dödades; enligt en senare krönika sade påvens legat ”Döda dem
    alla, Gud känner sina egna”, men citatet är omdiskuterat.

    Kriget pågick till 1229 (se ”[katarkriget
    slut](#katarkriget-slut-1229)”). Det drevs av nordfransk adel under
    Simon de Montfort och gav i praktiken den franska kronan kontroll över
    södra Frankrike. För att spåra kvarvarande katarer inrättades den
    påvliga inkvisitionen (se ”[Påvlig inkvisition
    1231](#pavlig-inkvisition-1231)”).

ludvig-ix:
  period: 1220
  label: "Ludvig IX"
  title: "Ludvig IX – den helige"
  wiki:
    - "sv:Ludvig IX av Frankrike"
    - "en:Louis IX of France"
  text: |
    **Ludvig IX** (1214–1270) var kung av Frankrike 1226–1270, i omkring
    44 år, och barnbarn till [Filip II
    August](#filip-ii-august-starker-kungamakten). Han blev kung som
    tolvåring; hans mor Blanka av Kastilien styrde som regent och slog ned
    adelsuppror. Han är den ende franske kungen som helgonförklarats
    (1297), därav namnet Saint Louis – som t.ex. staden St. Louis i USA
    fått sitt namn efter.

    Han förknippas med tre saker: fromhet, rättvisa och korståg. Han var
    känd för att döma tvister personligen under en ek i Vincennes, förbjöd
    rättegång genom envig (tvekamp) i sina domäner och stärkte de kungliga
    domstolarna. Han byggde [Sainte-Chapelle](#sainte-chapelle) i Paris
    för att förvara Kristi törnekrona, köpt för en mycket stor summa.

    Hans två korståg misslyckades: på [sjunde korståget
    (1248–54)](#ludvig-ix-s-sjunde-korstag-1248) tillfångatogs han i
    Egypten och löstes ut, och på åttonde [dog han i Tunis
    1270](#ludvig-ix-dor-i-tunis-1270), troligen av dysenteri. Under honom
    blev Frankrike Europas mest respekterade monarki, och Paris kulturell
    huvudstad.

katarkriget-slut-1229:
  period: 1220
  label: "katarkriget slut 1229"
  title: "Albigenserkriget slutar 1229"
  wiki:
    - "sv:Albigenserkriget"
    - "en:Treaty of Paris (1229)"
  text: |
    Korståget mot **katarerna** i södra Frankrike, som började 1209 (se
    ”[korståg mot katarerna](#korstag-mot-katarerna-1209)”), hade blivit
    ett erövringskrig. Katarerna var en kristen rörelse som kyrkan såg som
    kättare. Nordfransk adel under Simon de Montfort tog land från de
    sydfranska herrarna, främst greven av Toulouse. Simon dödades 1218 av
    en sten från en kastmaskin vid belägringen av Toulouse.

    När kronan själv gick in i kriget 1226 hade greven ingen chans.
    **Freden i Paris** 1229 tvingade greve Raimond VII att avträda stora
    delar av sina länder och gifta bort sin dotter med kungens bror, så
    att resten tillföll kronan 1271. Languedoc, med eget språk
    (occitanska) och egen kultur, blev därmed en del av Frankrike.

    Katarerna levde kvar i hemlighet. Inkvisitionen (se ”[Påvlig
    inkvisition 1231](#pavlig-inkvisition-1231)”) jagade dem, och 1244
    föll deras sista fäste, borgen Montségur, där omkring 200 katarer
    brändes. Rörelsen dog ut i början av 1300-talet.

ludvig-ix-s-sjunde-korstag-1248:
  period: 1240
  label: "Ludvig IX:s sjunde korståg 1248"
  title: "Ludvig IX:s korståg 1248–1254"
  wiki:
    - "sv:Ludvig IX av Frankrike"
    - "sv:Sjunde korståget"
  text: |
    **Ludvig IX** (1214–1270), kung av Frankrike från 1226, var känd för
    sin fromhet och rättvisa; han helgonförklarades 1297 och kallas Saint
    Louis. Han lovade att gå på korståg efter att Jerusalem
    plundrats 1244.

    1248 seglade han med uppskattningsvis 15 000–25 000 man från den
    nybyggda hamnen Aigues-Mortes. Målet var inte Jerusalem direkt utan
    **Egypten**, maktens centrum: den som höll Egypten kunde hålla
    Palestina. Hamnstaden Damietta i Nildeltat togs 1249 nästan utan
    strid. Men framryckningen mot Kairo fastnade vid Mansura 1250; armén
    försvagades av skörbjugg och dysenteri och omringades. Ludvig själv
    blev tillfångatagen och friköptes mot en enorm lösensumma, ungefär
    motsvarande en årsinkomst för franska kronan.

    Under förhandlingarna mördades den egyptiske sultanen av sina egna
    slavsoldater, *mamlukerna*, som tog makten (se ”[Mamluker i Egypten
    1250](#mamluker-i-egypten-1250)”). Korståget banade alltså oavsiktligt
    väg för den mamlukiska staten som senare krossade korsfararstaterna.
    Ludvig stannade fyra år i Palestina för att befästa städerna och
    försökte igen 1270 (se ”[Ludvig IX dör i Tunis
    1270](#ludvig-ix-dor-i-tunis-1270)”).

sainte-chapelle:
  period: 1240
  label: "Sainte-Chapelle"
  title: "Sainte-Chapelle i Paris"
  wiki:
    - "sv:Sainte-Chapelle"
    - "sv:Gotik"
  text: |
    **Sainte-Chapelle** (”det heliga kapellet”) är ett kapell på Île de la
    Cité i Paris, byggt ca 1242–1248 åt Ludvig IX. Det skulle förvara
    reliker Ludvig köpt av den latinske kejsaren i Konstantinopel, bl.a.
    det som sades vara Jesu törnekrona – för uppskattningsvis 135 000
    livres, mer än vad hela kapellet kostade att bygga.

    Byggnaden är ett av de renaste exemplen på *gotik*, den byggstil som
    uppstod i Frankrike på 1100-talet. Gotikens tekniska knep är
    spetsbågar, ribbvalv och strävpelare utanpå väggen: tyngden från taket
    leds ned i pelare, så att väggarna inte behöver bära och kan ersättas
    av fönster. I övervåningen av Sainte-Chapelle består väggarna nästan
    helt av glasmålningar, ca 600 m² med över 1 100 bildscener ur Bibeln.
    Effekten är ett rum som verkar byggt av färgat ljus.

    Kapellet byggdes på ungefär sex år, mycket snabbt jämfört med
    katedraler som [Notre-Dame (ca
    1163–1260)](#notre-dame-i-paris-paborjas-1163) eller Kölnerdomen
    (påbörjad 1248, färdig 1880). Det visade Frankrikes ställning som
    Europas kulturella centrum vid denna tid. Törnekronan flyttades senare
    till Notre-Dame och räddades vid branden 2019.

ludvig-ix-dor-i-tunis-1270:
  period: 1260
  label: "Ludvig IX dör i Tunis 1270"
  title: "Ludvig IX dör i Tunis 1270"
  wiki:
    - "sv:Ludvig IX av Frankrike"
    - "sv:Åttonde korståget"
  text: |
    **Ludvig IX** av Frankrike (se ”[Ludvig IX:s sjunde korståg
    1248](#ludvig-ix-s-sjunde-korstag-1248)”) hade misslyckats i Egypten
    men ville ändå göra ett nytt försök. Läget i Mellanöstern var dåligt
    för de kristna: mamluksultanen [Baibars (se den)](#baibars) erövrade
    korsfararnas städer en efter en, bl.a. Antiokia 1268.

    1270 startade Ludvig, 56 år gammal och sjuklig, det åttonde korståget.
    Det gick inte till Palestina utan till **Tunis** i Nordafrika. Varför
    är omdiskuterat: kanske trodde man att emiren av Tunis kunde omvändas
    till kristendomen, kanske påverkade Ludvigs bror Karl av Anjou, kung
    av Sicilien, som hade egna intressen i Tunis. Armén landsteg i juli i
    sommarhettan nära Kartagos ruiner och drabbades snabbt av sjukdom,
    troligen dysenteri. Ludvig dog den 25 augusti 1270.

    Korståget upplöstes efter ett fredsavtal. Det räknas ofta som det
    sista av de stora korstågen. 1291 föll Akko, den sista korsfararstaden
    i Palestina. Ludvig helgonförklarades 1297 och blev ett ideal för
    fransk kungamakt: rättvis domare, from och stark. Hans sonson Filip IV
    skulle använda kungamakten mycket mer hänsynslöst.

filip-iv-den-skone:
  period: 1280
  label: "Filip IV den sköne"
  title: "Filip IV den sköne (kung 1285–1314)"
  wiki:
    - "sv:Filip IV av Frankrike"
    - "en:Philip IV of France"
  text: |
    **Filip IV**, kallad ”den sköne” för sitt utseende, var kung av
    Frankrike 1285–1314. Han byggde ut en centraliserad statsapparat med
    jurister som tjänstemän och försökte göra kungen till högsta makt över
    allt inom landets gränser – även över kyrkan.

    Tre saker förknippas med honom. Först konflikten med påven
    **Bonifatius VIII**, som hävdade att påven stod över alla kungar.
    Filip svarade 1303 med att låta sina män gripa påven i Anagni; påven
    dog kort efter. Snart flyttade påvestolen till Avignon under fransk
    kontroll ([se 1309](#paven-till-avignon-1309)). För det andra krossade
    han **Tempelherreorden** 1307 ([se
    det](#tempelherrarna-krossas-1307)), delvis för att komma åt deras
    pengar – kronan var ständigt skuldsatt. För det tredje kallade han
    1302 för första gången in *generalständerna*, en församling av adel,
    präster och borgare, för att få stöd för skatter.

    Han fördrev också judarna 1306 och konfiskerade deras egendom, och
    försämrade myntet för att finansiera krig. Jämfört med kungarna 100 år
    tidigare var Frankrike nu en betydligt starkare stat. Hans tre söner
    dog alla utan söner inom 14 år, vilket ledde till dynastibytet 1328
    och [hundraårskriget](#hundraarskriget).

tempelherrarna-krossas-1307:
  period: 1300
  label: "Tempelherrarna krossas 1307"
  title: "Tempelherreorden krossas 1307"
  wiki:
    - "sv:Tempelherreorden"
    - "en:Knights Templar"
  text: |
    **Tempelherreorden** grundades omkring 1119 i Jerusalem som en
    riddarorden – munkar som samtidigt var soldater – för att skydda
    pilgrimer. Den växte till en internationell organisation med borgar,
    gods och kapital som gjorde den till en tidig bank: en pilgrim kunde
    sätta in pengar i Paris och ta ut dem i Jerusalem. Kungar lånade av
    dem.

    Efter korstågsstaternas fall 1291 ([se
    Akko](#akko-faller-1291-korstagen-slut)) hade orden förlorat sitt
    syfte men behållit rikedomen. Den franske kungen **[Filip
    IV](#filip-iv-den-skone)** var djupt skuldsatt. Fredagen den 13
    oktober 1307 lät han gripa alla tempelherrar i Frankrike samtidigt –
    en ovanligt samordnad polisaktion för tiden. De anklagades för
    kätteri, avgudadyrkan och obscena ritualer, och många erkände under
    tortyr.

    Påven **Klemens V**, som var beroende av Filip ([se påven till
    Avignon](#paven-till-avignon-1309)), upplöste orden 1312. Stormästaren
    Jacques de Molay brändes på bål i Paris 1314. Egendomen gick formellt
    till johanniterorden, men Filip fick ut stora summor. Händelsen visade
    hur långt en kung nu kunde gå mot kyrkans institutioner. Den har gett
    upphov till otaliga konspirationsteorier, till exempel i *Da
    Vinci-koden*.

paven-till-avignon-1309:
  period: 1300
  label: "påven till Avignon 1309"
  title: "Påvarna i Avignon 1309–1377"
  wiki:
    - "en:Avignon Papacy"
    - "sv:Påvestolen i Avignon"
  text: |
    Efter konflikten mellan påven Bonifatius VIII och Frankrikes kung
    Filip IV ([se det](#filip-iv-den-skone)) valdes 1305 en fransman,
    **Klemens V**, till påve. Rom var då osäkert, med strider mellan
    adelsfamiljer, och 1309 slog han sig ned i **Avignon** i södra
    Frankrike. Staden tillhörde formellt inte Frankrike, men låg intill
    och under starkt franskt inflytande.

    Påvarna stannade i nästan 70 år. Alla sju var fransmän. De byggde ett
    väldigt palats och en effektiv förvaltning som samlade in avgifter
    från hela kyrkan – en av Europas första stora byråkratier. Kritikerna
    kallade tiden ”kyrkans babyloniska fångenskap” efter judarnas exil i
    Babylon i Bibeln, och menade att påven var Frankrikes redskap.
    Petrarca ([se 1320](#petrarca-tidig-humanism)) var en av de hårdaste
    kritikerna.

    [Påven återvände till Rom 1377](#paven-tillbaka-i-rom-1377). Men redan
    1378 valdes två påvar, en i Rom och en i Avignon, och den *[stora
    schismen](#stora-schismen-tva-pavar-1378)* (splittringen) varade till
    1417 – en tid med två, ibland tre, påvar som bannlyste varandra. Det
    skadade kyrkans anseende och banade väg för kritik som senare ledde
    till reformationen på 1500-talet.

valois-1328:
  period: 1320
  label: "Valois 1328"
  title: "Huset Valois tar Frankrikes tron 1328"
  wiki:
    - "sv:Huset Valois"
    - "en:House of Valois"
  text: |
    Den franska kungaätten, **kapetingerna**, hade gått i rakt nedstigande
    led från far till son sedan 987 – över 300 år. Men Filip IV:s tre
    söner ([se Filip IV](#filip-iv-den-skone)) dog alla inom 14 år utan
    att lämna söner efter sig. När den siste, Karl IV, dog 1328 måste man
    välja en ny kung.

    Den närmaste manliga släktingen var den engelske kungen **Edvard
    III**, son till Filip IV:s dotter Isabella. Men den franska adeln
    ville inte ha en engelsk kung och bestämde att tronen inte kunde ärvas
    via en kvinna. Man valde i stället Filip IV:s brorson, **Filip VI av
    Valois** (efter grevskapet Valois). Regeln motiverades senare med den
    gamla *saliska lagen*, en germansk lag från 500-talet, som blev en
    hörnsten i fransk tronföljd.

    Edvard accepterade först, men 1337 gjorde han anspråk på tronen, och
    hundraårskriget började ([se det](#hundraarskriget-borjar-1337)).
    Huset Valois styrde Frankrike till 1589, då det efterträddes av
    Bourbon. Kungar ur ätten är bland andra [Ludvig
    XI](#ludvig-xi-mot-burgund), [Frans I](#frans-i) och Henrik II. Jämför
    med Sverige, där kvinnlig arvsrätt till tronen infördes först 1980.

hundraarskriget:
  period: 1320
  label: "hundraårskriget"
  title: "Hundraårskriget sett från Frankrike"
  wiki:
    - "sv:Hundraårskriget"
    - "en:Hundred Years' War"
  text: |
    **Hundraårskriget** (1337–1453) var en serie krig mellan England och
    Frankrike om den franska tronen och om de engelska kungarnas
    besittningar i Frankrike ([se hundraårskriget börjar
    1337](#hundraarskriget-borjar-1337)). Kriget utkämpades nästan helt på
    fransk mark, och det var Frankrike som led mest.

    De första decennierna var en katastrof för Frankrike. Den engelska
    flottan vann vid Sluys 1340, och den franska riddararmén led
    förkrossande nederlag vid **Crécy** 1346 och **Poitiers** 1356, där
    kungen själv togs till fånga ([se det](#poitiers-1356)). Engelska
    trupper gjorde *chevauchées* – plundringståg på hästrygg genom
    landsbygden, där byar brändes för att skada fiendens ekonomi. Mellan
    striderna härjade arbetslösa legosoldatband. Samtidigt kom [digerdöden
    1348](#digerdoden-1348), och bönderna gjorde uppror ([Jacquerie
    1358](#jacquerie-upproret-1358)).

    Frankrikes befolkning beräknas ha minskat kraftigt mellan 1340 och
    1450, kanske med en tredjedel eller mer, av krig, pest och svält
    tillsammans. Men på sikt stärktes kungamakten: kriget motiverade
    permanenta skatter och en stående armé, och det skapades en nationell
    känsla, symboliserad av [Jeanne d'Arc
    1429](#jeanne-d-arc-befriar-orleans-1429-branns). Frankrike blev 1453
    Europas starkaste stat.

digerdoden:
  period: 1340
  label: "Digerdöden"
  title: "Digerdöden i Frankrike"
  wiki:
    - "sv:Digerdöden"
    - "en:Black Death"
  text: |
    **Digerdöden** var en pestepidemi orsakad av bakterien *Yersinia
    pestis*, som sprids med loppor från råttor och i lungpestform direkt
    mellan människor. Den kom från Centralasien längs handelsvägarna till
    Svarta havet och nådde Europa 1347 med genuesiska handelsfartyg. I
    januari 1348 kom den till **Marseille** och spred sig därifrån genom
    Frankrike, med en hastighet av uppskattningsvis några kilometer per
    dag.

    I Avignon, där påven bodde ([se 1309](#paven-till-avignon-1309)), dog
    kanske hälften av invånarna; påven lät viga floden Rhône så att lik
    kunde kastas i den. I Paris dog uppskattningsvis tiotusentals. Totalt
    dog sannolikt en tredjedel till hälften av Frankrikes befolkning, som
    före pesten uppskattas till 15–20 miljoner. I Europa som helhet dog
    uppskattningsvis 25–50 miljoner – den värsta pandemin i känd historia
    räknat som andel av befolkningen.

    Det skedde mitt under [hundraårskriget](#hundraarskriget-borjar-1337),
    och krig, pest och svält förstärkte varandra. Pesten återkom med jämna
    mellanrum i 300 år; Frankrikes befolkning nådde nivån från 1340 först
    omkring 1500-talet. Läkare vid universitetet i Paris förklarade pesten
    med en ogynnsam planetkonstellation – bakterien upptäcktes först 1894.

jacquerie-upproret-1358:
  period: 1340
  label: "Jacquerie-upproret 1358"
  title: "Jacquerie-upproret 1358"
  wiki:
    - "en:Jacquerie"
  text: |
    **Jacquerie** var ett bondeuppror i norra Frankrike, kring Paris,
    under några veckor i maj–juni 1358. Namnet kommer av *Jacques
    Bonhomme* (”Jakob godeman”), adelns nedsättande öknamn på bönder.
    Därav kommer ordet *jacquerie* för bondeuppror i allmänhet.

    Bakgrunden var förtvivlan: digerdöden 1348 ([se
    det](#digerdoden-1348)), höga skatter för
    [hundraårskriget](#hundraarskriget-borjar-1337), plundrande
    legosoldater och – det som väckte mest ilska – att adeln, som skulle
    skydda landet, hade förlorat vid [Poitiers 1356](#poitiers-1356) och
    nu krävde nya pengar för att lösa ut sin kung och sig själva.
    Bönderna, kanske några tusen, anföll slott, dödade adelsfamiljer och
    brände gods. Paris borgarledare Étienne Marcel stödde dem en kort tid.

    Adeln slog tillbaka hårt. Vid Mello besegrades böndernas ledare
    Guillaume Cale, som lurades till förhandlingar och avrättades.
    Därefter följde en våg av hämnd där uppskattningsvis tusentals bönder
    dödades. Upproret var ett av flera i 1300-talets Europa efter pesten:
    jämför med Ciompi-upproret i Florens 1378 och det [engelska
    bondeupproret 1381](#bondeupproret-1381). Gemensamt var att
    befolkningsras gjorde de överlevande mer medvetna om sitt värde.

karl-v-och-du-guesclin-atertar-mark:
  period: 1360
  label: "Karl V och du Guesclin återtar mark"
  title: "Karl V och du Guesclin vänder hundraårskriget"
  wiki:
    - "sv:Karl V av Frankrike"
    - "en:Bertrand du Guesclin"
    - "sv:Hundraårskriget"
  text: |
    **Hundraårskriget** (1337–1453) var en serie krig mellan England och
    Frankrike, ytterst om att den engelske kungen gjorde anspråk på den
    franska tronen. Första fasen gick katastrofalt för Frankrike:
    engelsmännen vann vid [Crécy 1346](#crecy-1346) och [Poitiers
    1356](#poitiers-1356), där den franske kungen Johan II togs till
    fånga. I freden i Brétigny 1360 fick England ungefär en tredjedel av
    Frankrike.

    **Karl V** (”den vise”, kung 1364–1380) ändrade strategin. Han hade
    sett riddararméer krossas av engelska bågskyttar och undvek därför
    stora fältslag. I stället lät hans befälhavare **Bertrand du
    Guesclin** – en lågadlig bretonsk krigare, känd som ful, hårdför och
    skicklig – föra ett utnötningskrig: belägra borgar en i taget, anfalla
    förrådståg och låta engelska härar tåga genom ett avfolkat land utan
    att hitta någon att slåss mot. Karl V reformerade också skatterna så
    att kronan fick fasta inkomster till en stående armé.

    Vid Karls död 1380 hade engelsmännen trängts tillbaka till några
    kustområden, främst kring Calais och Bordeaux. Framgången varade dock
    inte: under [hans sinnessjuke son Karl VI](#karl-vi-blir-sinnessjuk)
    föll Frankrike sönder igen ([se Agincourt 1415](#agincourt-1415)).

karl-vi-blir-sinnessjuk:
  period: 1380
  label: "Karl VI blir sinnessjuk"
  title: "Karl VI:s sinnessjukdom 1392"
  wiki:
    - "sv:Karl VI av Frankrike"
    - "en:Treaty of Troyes"
  text: |
    **Karl VI** blev kung av Frankrike 1380 som elvaåring, efter sin far
    Karl V som hade återtagit mycket land från engelsmännen ([se
    1360-talet](#karl-v-och-du-guesclin-atertar-mark)). Han kallades först
    ”den älskade”, senare ”den galne”.

    I augusti 1392, när han red genom en skog med sina trupper, fick han
    ett anfall: han drog svärdet och dödade flera av sina egna män. Resten
    av livet, 30 år, växlade han mellan klara perioder och svåra anfall –
    han kände inte igen sin familj, sprang omkring i palatset, och trodde
    ibland att han var gjord av glas och kunde gå sönder. Moderna läkare
    har föreslagit schizofreni eller bipolär sjukdom, men det går inte att
    veta säkert.

    Följderna blev politiskt katastrofala. När kungen var oförmögen stred
    hans släktingar om makten, främst hans bror hertigen av **Orléans**
    och hans farbror hertigen av **Burgund**. Det ledde till
    inbördeskriget mellan burgunder och armagnacer ([se
    1400-talet](#inbordeskrig-burgund-mot-armagnac)), som England
    utnyttjade: Henrik V vann vid [Agincourt 1415](#agincourt-1415), och
    1420 tvingades Karl VI erkänna Henrik V som tronarvinge och göra sin
    egen son arvlös. Först [Jeanne d'Arc
    1429](#jeanne-d-arc-befriar-orleans-1429-branns) vände utvecklingen.

agincourt-1415:
  period: 1400
  label: "Agincourt 1415"
  title: "Agincourt 1415 – Frankrikes katastrof"
  wiki:
    - "sv:Slaget vid Agincourt"
    - "sv:Hundraårskriget"
  text: |
    Frankrike var 1415 i dåligt skick: kungen **Karl VI** var periodvis
    sinnessjuk, och två adelspartier, burgunderna och armagnacerna,
    kämpade om makten ([se nästa
    punkt](#inbordeskrig-burgund-mot-armagnac)). När England under
    **[Henrik V](#henrik-v-vinner-vid-agincourt-1415)** landsteg i
    Normandie samlade armagnacerna en armé, medan hertigen av Burgund höll
    sig utanför.

    Vid **Agincourt** i norra Frankrike den 25 oktober 1415 led den
    franska armén ett av sina värsta nederlag. Fransmännen var betydligt
    fler, men slagfältet var en lerig åker och deras tunga riddare
    pressades ihop mot engelska bågskyttar bakom spetsade pålar.
    Uppskattningsvis 6 000–10 000 fransmän dog, däribland tre hertigar och
    omkring 90 andra höga adelsmän – en stor del av landets politiska
    ledning. Henrik lät dessutom döda många fångar under slaget, av rädsla
    för ett nytt anfall.

    Nederlaget öppnade vägen för den engelska erövringen av Normandie
    1417–1419 och för att burgunderna 1419 gick över till England. Det
    militära mönstret – fotfolk med avståndsvapen som besegrar riddare –
    syntes även vid [Crécy 1346](#crecy-1346) och föregick krutvapnens
    genombrott. Frankrike vände kriget först med [Jeanne d'Arc
    1429](#jeanne-d-arc-befriar-orleans-1429-branns).

inbordeskrig-burgund-mot-armagnac:
  period: 1400
  label: "inbördeskrig Burgund mot Armagnac"
  title: "Inbördeskriget mellan burgunder och armagnacer"
  wiki:
    - "en:Armagnac–Burgundian Civil War"
    - "en:John the Fearless"
  text: |
    När den franske kungen **Karl VI** blev sinnessjuk 1392 ([se den
    punkten](#karl-vi-blir-sinnessjuk)) stred hans släktingar om makten.
    Ena sidan leddes av kungens bror **Ludvig av Orléans**, den andra av
    hertigarna av **Burgund** – Burgund var ett rikt hertigdöme i östra
    Frankrike som också ägde Flandern, Europas viktigaste textilområde.

    1407 lät hertig **Johan den orädde** av Burgund mörda Ludvig av
    Orléans på en gata i Paris. Orléans anhängare samlades under greven av
    Armagnac och kallades **armagnacer**. Det blev ett öppet inbördeskrig,
    med massakrer i Paris och växlande kontroll över huvudstaden. 1419
    mördades i sin tur Johan den orädde av armagnacer under ett fredsmöte
    på en bro i Montereau, i närvaro av den franske tronarvingen.

    Hämnden fick stora följder: Johans son Filip den gode slöt förbund med
    England. 1420 erkändes [Englands kung Henrik
    V](#henrik-v-vinner-vid-agincourt-1415) som arvinge till Frankrike i
    freden i Troyes, och England och Burgund kontrollerade norra Frankrike
    med Paris. Först när Burgund bytte sida 1435 kunde Frankrike driva ut
    engelsmännen; [kriget slutade 1453](#hundraarskriget-slut-1453).
    Burgund blev under tiden en egen stormakt mellan Frankrike och
    Tyskland.

jeanne-d-arc-befriar-orleans-1429-branns:
  period: 1420
  label: "Jeanne d'Arc befriar Orléans 1429, bränns 1431"
  title: "Jeanne d'Arc 1429–1431"
  wiki:
    - "sv:Jeanne d'Arc"
    - "en:Siege of Orléans"
  text: |
    **Jeanne d'Arc** var en bondflicka från byn Domrémy i östra Frankrike,
    född omkring 1412. Hon sade att hon hörde röster från helgon som
    befallde henne att hjälpa kronprinsen Karl att driva ut engelsmännen.
    Läget var då desperat: England och dess allierade Burgund höll norra
    Frankrike, och Karl var inte ens krönt.

    Vid 17 års ålder fick hon träffa Karl och övertygade honom. Hon fick
    följa med en undsättningsarmé till staden **Orléans**, som varit
    belägrad av engelsmännen i över sex månader. I maj 1429 bröts
    belägringen på nio dagar. Hennes roll var mer att höja moralen än att
    leda taktiskt, men effekten var stor. I juli samma år kröntes Karl VII
    i katedralen i Reims.

    1430 tillfångatogs hon av burgunderna och såldes till engelsmännen.
    Ett kyrkligt tribunal i Rouen dömde henne för kätteri (avvikelse från
    kyrkans lära) – formellt bland annat för att hon bar mansklädsel. Hon
    brändes på bål den 30 maj 1431, cirka 19 år gammal.

    1456 upphävdes domen, och 1920 helgonförklarades hon. Hon blev en
    fransk nationalsymbol, särskilt från 1800-talet.

    Jämför med [Agincourt 1415](#agincourt-1415), nederlaget som gjorde
    Frankrikes läge så desperat.

frankrike-vinner-hundraarskriget:
  period: 1440
  label: "Frankrike vinner hundraårskriget"
  title: "Frankrike vinner hundraårskriget"
  wiki:
    - "sv:Karl VII av Frankrike"
    - "sv:Hundraårskriget"
  text: |
    Frankrikes kung **Karl VII** (styrde 1422–1461) började som en svag
    och fattig kung som kontrollerade bara södra Frankrike. Hans fiender
    kallade honom spydigt ”kungen av Bourges”, efter den stad han höll.
    Ändå var det han som vann kriget.

    Vändpunkterna: [Jeanne
    d'Arc](#jeanne-d-arc-befriar-orleans-1429-branns) bröt belägringen av
    Orléans 1429 och fick honom krönt i Reims; 1435 lämnade det mäktiga
    hertigdömet **Burgund** alliansen med England; 1436 tog han tillbaka
    Paris. Sedan reformerade han armén och statens finanser. Bröderna
    **Bureau** byggde upp ett modernt **artilleri** som kunde skjuta
    sönder engelska borgar på dagar istället för månader.

    1449–1450 erövrades Normandie, avgjort vid Formigny 1450, och 1453
    Gascogne efter slaget vid Castillon. Endast Calais förblev engelskt.

    Segern gjorde Frankrike till en centraliserad monarki med en permanent
    skatt (*taille*) som kungen kunde ta ut utan att fråga ständerna, och
    en stående armé ([se stående armé](#staende-arme)). Frankrike blev
    Europas folkrikaste och mäktigaste land – uppskattningsvis 12–15
    miljoner invånare kring 1500, jämfört med Englands cirka 2–3 miljoner.

staende-arme:
  period: 1440
  label: "stående armé"
  title: "Frankrikes stående armé"
  wiki:
    - "en:Compagnies d'ordonnance"
    - "sv:Stående armé"
  text: |
    En **stående armé** är en armé som finns permanent, även i fredstid,
    och betalas av staten. Under medeltiden fanns inga sådana i
    Västeuropa: kungen kallade in vasaller (adelsmän som fått land mot
    krigstjänst) och hyrde legosoldater för enskilda fälttåg. När kriget
    var slut skickades de hem utan lön – och arbetslösa legosoldater,
    *écorcheurs* (”flåare”), plundrade landsbygden i Frankrike.

    1445 skapade Karl VII **compagnies d'ordonnance**: 15 kompanier tunga
    ryttare, sammanlagt uppskattningsvis 9 000 man (varje enhet, en
    *lance*, bestod av en tungt rustad ryttare och fem följeslagare). De
    fick regelbunden lön och var stationerade i garnisoner. 1448 kom ett
    infanteri av *francs-archers* (”fria bågskyttar”), en man per 50–80
    hushåll, som befriades från skatt mot att öva och hålla sig redo.

    Det krävde en **permanent skatt**, och så blev det: kungen tog ut
    skatten *taille* utan att ständerna behövde godkänna den varje år.
    Armén och skatten förutsatte varandra.

    Det här var en byggsten för den moderna staten: monopol på våld och
    permanent beskattning. Andra länder följde efter; Sverige fick en
    indelt armé under 1600-talet.

    Se även hur Karl VII vann kriget: [Frankrike vinner
    hundraårskriget](#frankrike-vinner-hundraarskriget).

ludvig-xi-mot-burgund:
  period: 1460
  label: "Ludvig XI mot Burgund"
  title: "Ludvig XI mot Karl den djärve av Burgund"
  wiki:
    - "sv:Ludvig XI av Frankrike"
    - "sv:Karl den djärve"
  text: |
    **Ludvig XI** (kung av Frankrike 1461–1483) var son till [Karl VII,
    som vunnit hundraårskriget](#frankrike-vinner-hundraarskriget). Han
    var oattraktiv, misstänksam och listig, och kallades ”den universella
    spindeln” för sina intriger. Han föredrog mutor, diplomati och spioner
    framför krig.

    Hans stora motståndare var **Burgund**, ett hertigdöme som vuxit till
    en stat mellan Frankrike och Tyskland, med Bourgogne i söder och
    dagens Belgien och Nederländerna i norr – Europas rikaste område, tack
    vare Flanderns ylleindustri och städer som Brygge och Gent. Hertigen
    var formellt vasall till Frankrike men i praktiken självständig.
    Hertig **Karl den djärve** (1467–1477) ville göra Burgund till ett
    eget kungarike.

    Ludvig undvek öppen strid och finansierade istället Karls fiender,
    bland annat de schweiziska kantonerna. Schweizarnas pikbeväpnade
    infanteri besegrade Karl vid Grandson och Murten 1476, och vid Nancy
    1477 dödades han. Hans kropp hittades frusen i en sjö.

    Ludvig tog Bourgogne och Picardie. Men Karls dotter Maria gifte sig
    med [habsburgaren Maximilian](#maximilian-i), så Nederländerna gick
    till **Habsburg**. Konflikten mellan Frankrike och Habsburg präglade
    sedan Europa i 250 år.

karl-viii-invaderar-italien-1494:
  period: 1480
  label: "Karl VIII invaderar Italien 1494"
  title: "Karl VIII invaderar Italien 1494"
  wiki:
    - "en:Charles VIII of France"
    - "en:Italian War of 1494–1495"
  text: |
    **Karl VIII** var kung av Frankrike 1483–1498. Han gjorde anspråk på
    kungariket Neapel i södra Italien genom ett gammalt arv från huset
    Anjou. Italien bestod då av många rika men små stater: Milano,
    Venedig, Florens, Kyrkostaten och Neapel.

    1494 tågade Karl över Alperna med en armé på uppskattningsvis 25 000
    man och ett nytt slags artilleri: lättrörliga bronskanoner på
    hjulförsedda lavetter, som sköt järnkulor. Medeltida borgar med höga
    murar föll på timmar i stället för månader. I februari 1495 intog han
    Neapel nästan utan strid.

    Framgången skrämde de andra makterna, som bildade en allians mot
    honom. Han tvingades tillbaka och kämpade sig ut vid Fornovo 1495. Men
    invasionen startade de **[italienska
    krigen](#italienska-krigen-1494)** (1494–1559), där Frankrike och
    Habsburg slogs om Italien. Den spred också
    [syfilis](#syfilis-i-europa-1494) över Europa och förde renässansens
    konst och idéer till Frankrike. Som svar på kanonerna uppfann
    italienarna låga, stjärnformade fästningar.

frans-i:
  period: 1500
  label: "Frans I"
  title: "Frans I av Frankrike"
  wiki:
    - "en:Francis I of France"
    - "en:Ordinance of Villers-Cotterêts"
  text: |
    **Frans I** (1494–1547) var kung av Frankrike 1515–1547. Han ses som
    den första renässanskungen i Frankrike: ung, äventyrlig och mycket
    intresserad av italiensk konst och lärdom.

    Hans regering dominerades av rivaliteten med Habsburgaren **[Karl
    V](#karl-v-habsburg-1516)**, som var kung av Spanien och tysk-romersk
    kejsare och omringade Frankrike på nästan alla sidor. Frans vann vid
    [Marignano 1515](#marignano-1515) men blev [tillfångatagen vid Pavia
    1525](#frans-i-tillfangatas-vid-pavia-1525) och satt ett år i
    fångenskap i Madrid. För att balansera Karl ingick han till och med en
    allians med den muslimske osmanske sultanen Süleyman – det väckte
    skandal i kristenheten men var tidig maktbalanspolitik.

    Frans bjöd in **[Leonardo da Vinci](#leonardo)** till Frankrike 1516;
    Leonardo dog där 1519, och därför finns Mona Lisa i Louvren. Frans
    byggde slotten Chambord och Fontainebleau, grundade Collège de France
    och bestämde 1539 att franska, inte latin, skulle vara språket i
    officiella dokument. Han skickade [Jacques Cartier till Kanada
    1534](#cartier-vid-s-t-lawrence-1534), början på Nya Frankrike.

marignano-1515:
  period: 1500
  label: "Marignano 1515"
  title: "Slaget vid Marignano 1515"
  wiki:
    - "en:Battle of Marignano"
    - "en:Swiss neutrality"
  text: |
    Ett av de italienska krigens stora slag ([se
    1494](#italienska-krigen-1494)). Den nykrönte franske kungen **[Frans
    I](#frans-i)** ville återta hertigdömet Milano, som kontrollerades av
    schweiziska legosoldater i hertigen Sforzas tjänst.

    Schweizarna var Europas mest fruktade infanteri. De stred i stora täta
    fyrkanter med 5–6 meter långa pikar och hade krossat burgundiska och
    habsburgska arméer. Vid **Marignano** (Melegnano), sydost om Milano,
    anföll omkring 20 000 schweizare en fransk armé på uppskattningsvis 30
    000 man den 13–14 september 1515. Striden pågick i två dagar. Franskt
    artilleri och tungt kavalleri, och till slut venetianska
    förstärkningar, avgjorde. Uppskattningsvis 10 000–16 000 dog totalt.

    Det var första gången schweiziska pikfyrkanter besegrades i ett stort
    slag, och det visade att kanoner och kombinerade vapen var framtiden.
    Schweiz drog slutsatsen att landet skulle hålla sig utanför
    stormaktskrigen. Ur det växte den schweiziska neutraliteten, formellt
    erkänd 1815. Schweizare fortsatte dock som legosoldater – därav påvens
    schweizergarde, som funnits sedan 1506.

frans-i-tillfangatas-vid-pavia-1525:
  period: 1520
  label: "Frans I tillfångatas vid Pavia 1525"
  title: "Slaget vid Pavia 1525"
  wiki:
    - "en:Battle of Pavia"
    - "en:Arquebus"
  text: |
    Under de italienska krigen ([se 1494](#italienska-krigen-1494))
    försökte Frankrikes kung **[Frans I](#frans-i)** återta Milano från
    kejsar **[Karl V](#karl-v-habsburg-1516)**. Hösten 1524 belägrade han
    staden Pavia, söder om Milano, som försvarades av en kejserlig
    garnison.

    Den 24 februari 1525 – Karls 25-årsdag – anföll en kejserlig
    undsättningsarmé. Omkring 23 000 man stod på var sida. Fransmännen
    hade det tunga riddarkavalleriet; kejsarsidan hade spanska
    arkebusiärer (soldater med tidiga musköter) och tyska landsknektar med
    pikar. När det franska kavalleriet red in framför sitt eget artilleri
    sköts det sönder. Fransmännen förlorade uppskattningsvis 10 000 man,
    mot cirka 1 500 på kejsarsidan, och Frans själv togs till fånga.

    Han satt i Madrid i ett år och släpptes 1526 mot att avstå från
    Italien och Burgund och lämna två söner som gisslan – löften han bröt
    direkt. Pavia ses ofta som det slag där eldvapen på allvar slog ut
    riddarna. Karls segrar ledde också till [plundringen av Rom
    1527](#rom-plundras-1527).

calvin-i-geneve:
  period: 1540
  label: "Calvin i Genève"
  title: "Calvin i Genève"
  wiki:
    - "sv:Jean Calvin"
    - "sv:Kalvinism"
  text: |
    **Jean Calvin** (1509–1564) var en fransk jurist och teolog som flydde
    Frankrike när kungen började förfölja protestanter. 1536 publicerade
    han sin stora lärobok *Institutio*, en systematisk framställning av
    protestantisk tro. Samma år hamnade han i Genève, en fransktalande
    stad som just hade brutit med sin biskop.

    Efter en kort utvisning återvände han 1541 och var stadens ledande
    gestalt till sin död. Han byggde en kyrkoordning där ett konsistorium
    – ett råd av präster och lekmän – övervakade invånarnas moral: dans,
    kortspel och svordomar kunde bestraffas. Mest känd är avrättningen
    1553 av Michael Servetus, som förnekade treenigheten.

    Genève blev en utbildningscentral för protestanter. Calvins akademi
    (grundad 1559) utbildade präster som skickades tillbaka till
    Frankrike, där deras församlingar – hugenotterna – växte snabbt under
    1550-talet. Det ledde direkt till de franska religionskrigen (se
    [Hugenottkrigen 1562](#hugenottkrigen-1562)) och spred kalvinismen
    till Skottland och Nederländerna.

    Jämför med Zwinglis reformation i Zürich: [Zwingli,
    Calvin](#zwingli-calvin).

religionsstrider-tar-form:
  period: 1540
  label: "religionsstrider tar form"
  title: "Religionsstriderna tar form i Frankrike"
  wiki:
    - "sv:Hugenotter"
    - "en:Affair of the Placards"
  text: |
    Frankrike var med uppskattningsvis 16–18 miljoner invånare Europas
    folkrikaste land och officiellt katolskt. Kungen hade sedan 1516 genom
    ett avtal med påven rätt att utse biskopar, så han hade inget behov av
    att [bryta med Rom](#henrik-viii-bryter-med-rom-1534) på det sätt
    Henrik VIII gjorde.

    Ändå spreds protestantismen, framför allt [Calvins variant från
    Genève](#calvin-i-geneve). Från 1534, då protestantiska affischer mot
    mässan sattes upp i Paris och enligt uppgift till och med på kungens
    sovrumsdörr, började [Frans I](#frans-i) och sedan Henrik II förfölja
    protestanter med kättarbål och en särskild domstol. Trots det fanns
    omkring 1560 uppskattningsvis 1–2 miljoner hugenotter, omkring 10 % av
    befolkningen, och kanske en tredjedel av adeln.

    Att adelsfamiljer delade sig i katolska och protestantiska läger
    gjorde religionsfrågan till en maktkamp om kronan. När Henrik II dog
    1559 efter en tornerspelsolycka och efterträddes av svaga barnkungar
    exploderade det: 1562 började hugenottkrigen (se [Hugenottkrigen
    1562](#hugenottkrigen-1562)), som pågick i över 30 år.

hugenottkrigen-1562:
  period: 1560
  label: "Hugenottkrigen 1562"
  title: "Hugenottkrigen börjar 1562"
  wiki:
    - "sv:Hugenottkrigen"
    - "en:French Wars of Religion"
  text: |
    Hugenotter kallades de franska kalvinistiska protestanterna. Omkring
    1560 kan de ha utgjort omkring 10 % av Frankrikes uppskattningsvis
    16–18 miljoner invånare (se [religionsstrider tar
    form](#religionsstrider-tar-form)). Efter Henrik II:s död 1559 styrdes
    landet av svaga barnkungar och deras mor **Katarina av Medici**, medan
    adelsätter – katolska Guise och protestantiska Bourbon – kämpade om
    makten.

    I mars 1562 dödade hertigen av Guises män omkring 50 hugenotter som
    höll gudstjänst i en lada i Vassy. Det utlöste det första av åtta krig
    som med korta fredsperioder pågick till 1598. Det var både
    religionskrig och inbördeskrig, med utländsk inblandning: Spanien
    stödde katolikerna, England och tyska furstar protestanterna. Den
    värsta händelsen var [Bartolomeinatten 1572](#bartolomeinatten-1572).

    Krigen avslutades när protestanten Henrik av Navarra blev [kung Henrik
    IV](#henrik-iv-1589), gick över till katolicismen (”Paris är väl en
    mässa värd”) och 1598 utfärdade [ediktet i
    Nantes](#nantes-ediktet-1598), som gav hugenotterna religionsfrihet.
    Totalt beräknas krigen, med svält och sjukdomar, ha kostat
    uppskattningsvis 2–4 miljoner liv.

bartolomeinatten-1572:
  period: 1560
  label: "Bartolomeinatten 1572"
  title: "Bartolomeinatten 1572"
  wiki:
    - "sv:Bartolomeinatten"
    - "en:St. Bartholomew's Day massacre"
  text: |
    I augusti 1572 samlades protestantisk adel i Paris för bröllopet
    mellan den protestantiske Henrik av Navarra och kungens katolska
    syster Margareta. Bröllopet skulle försona katoliker och hugenotter
    efter tio års krig (se [Hugenottkrigen 1562](#hugenottkrigen-1562)).

    Natten till 24 augusti, Sankt Bartolomeus dag, beordrade hovet –
    sannolikt med kung Karl IX:s och hans mor Katarina av Medicis
    godkännande – mord på hugenottledarna, med amiral Coligny i spetsen.
    Morden spred sig till Paris folkmassor och därifrån till ett tiotal
    andra städer under flera veckor. Uppskattningar av antalet döda
    varierar kraftigt: omkring 2 000–3 000 i Paris och sammanlagt kanske 5
    000–30 000 i hela Frankrike.

    Massakern förstörde varje förtroende mellan parterna och förlängde
    krigen i ytterligare 25 år. Påven lät fira den med en
    tacksägelsemässa, vilket väckte avsky i protestantiska länder. Henrik
    av Navarra överlevde genom att konvertera, och blev senare [kung
    Henrik IV](#henrik-iv-1589) och den som avslutade krigen. Jämför:
    [Stockholms blodbad 1520](#stockholms-blodbad-1520) var en avrättning
    av omkring 80–100 personer; Bartolomeinatten var ett massvåld i helt
    annan skala.

henrik-iv-1589:
  period: 1580
  label: "Henrik IV 1589"
  title: "Henrik IV blir kung av Frankrike 1589"
  wiki:
    - "sv:Henrik IV av Frankrike"
    - "en:French Wars of Religion"
  text: |
    **Henrik IV** (1553–1610) var kung av det lilla Navarra i Pyrenéerna
    och ledare för de franska **hugenotterna** (protestanter). Frankrike
    hade sedan 1562 slitits sönder av
    [hugenottkrigen](#hugenottkrigen-1562), åtta inbördeskrig mellan
    katoliker och protestanter. Det värsta ögonblicket var
    Bartolomeinatten 1572, då uppskattningsvis 5 000–30 000 protestanter
    mördades i Paris och landsorten.

    När kung Henrik III mördades 1589 utan söner var Henrik av Navarra
    närmaste arvinge – men en protestant kunde de katolska parisarna inte
    acceptera. Efter flera års krig konverterade han 1593 till
    katolicismen, enligt en (troligen påhittad) anekdot med orden ”Paris
    är väl värt en mässa”. Han kröntes 1594 och fick Paris att öppna sina
    portar.

    Henrik IV blev en av Frankrikes populäraste kungar. Han utfärdade
    Nantes-ediktet 1598 ([se där](#nantes-ediktet-1598)), byggde upp
    ekonomin med sin minister Sully och lär ha önskat att varje bonde
    skulle ha en höna i grytan på söndagar. Han grundade huset Bourbon som
    styrde Frankrike till revolutionen 1789. Han [mördades
    1610](#henrik-iv-mordas-1610) (se där).

nantes-ediktet-1598:
  period: 1580
  label: "Nantes-ediktet 1598"
  title: "Nantes-ediktet 1598"
  wiki:
    - "en:Edict of Nantes"
    - "sv:Hugenotter"
  text: |
    **Nantes-ediktet** var en lag som kung [Henrik IV](#henrik-iv-1589)
    utfärdade 1598 för att avsluta de franska religionskrigen (1562–1598).
    Det gav de protestantiska **hugenotterna** samvetsfrihet, rätt att
    hålla gudstjänst på vissa platser, tillgång till offentliga ämbeten
    och rätt att behålla omkring 150 befästa platser som säkerhet.
    Katolicismen förblev statsreligion.

    Det var ett av de första försöken i Europa att låta två kristna
    trosriktningar samexistera i samma stat genom lag, i stället för
    principen att undersåtarna följer furstens religion. Hugenotterna var
    då uppskattningsvis drygt en miljon av Frankrikes cirka 16–18 miljoner
    invånare.

    Freden var bräcklig. [Richelieu](#richelieu) tog ifrån hugenotterna
    deras fästningar på 1620-talet (belägringen av La Rochelle 1627–28),
    och [Ludvig XIV upphävde ediktet helt
    1685](#nantes-ediktet-upphavs-1685-hugenotter). Då flydde
    uppskattningsvis 200 000 hugenotter – ofta skickliga hantverkare och
    köpmän – till Nederländerna, England, Preussen och även Sverige,
    vilket gynnade dessa länders ekonomier på Frankrikes bekostnad.

henrik-iv-mordas-1610:
  period: 1600
  label: "Henrik IV mördas 1610"
  title: "Mordet på Henrik IV 1610"
  wiki:
    - "sv:Henrik IV av Frankrike"
    - "en:François Ravaillac"
  text: |
    Den 14 maj 1610 stannade kung **Henrik IV**s vagn i en trång gata i
    Paris. Den katolske fanatikern **François Ravaillac** hoppade upp och
    högg kungen med kniv. Henrik dog nästan omedelbart. Ravaillac menade
    att kungen var för vänlig mot protestanterna och skulle föra krig mot
    påven; han avrättades genom att slitas sönder av hästar.

    Henrik IV hade avslutat de franska religionskrigen och utfärdat
    Nantes-ediktet ([se 1598](#nantes-ediktet-1598)). Han hade överlevt
    omkring ett dussin mordförsök tidigare. När han dog förberedde han
    krig mot habsburgarna, den katolska dynasti som styrde Spanien och
    Österrike, i en tvist om några tyska hertigdömen.

    Hans son **Ludvig XIII** var bara 8 år, och hans mor Maria av Medici
    blev regent. Frankrike fick en orolig period med adelsuppror, tills
    kardinal Richelieu tog makten ([se 1620-talet](#richelieu)). Kriget
    mot Habsburg sköts upp, men konflikten bröt senare ut i det
    trettioåriga kriget ([se 1618](#trettioariga-kriget-1618)), där
    Frankrike gick in 1635.

champlain-grundar-quebec-1608:
  period: 1600
  label: "Champlain grundar Québec 1608"
  title: "Samuel de Champlain grundar Québec 1608"
  wiki:
    - "sv:Samuel de Champlain"
    - "sv:Québec (stad)"
  text: |
    **Samuel de Champlain** (cirka 1567–1635) var en fransk
    upptäcktsresande och kartograf. 1608 grundade han Québec vid S:t
    Lawrencefloden, där floden smalnar av (namnet kommer av ett
    algonkinord för ”där floden smalnar”). Det blev huvudstad i **Nya
    Frankrike**, Frankrikes nordamerikanska koloni. Första vintern
    överlevde bara 8 av 28 män, de flesta dog av skörbjugg.

    Drivkraften var pälshandeln, framför allt bäverskinn till filthattar
    som var högsta mode i Europa. Fransmännen var för få för att ta land,
    så de byggde allianser med indianfolk som huroner och algonkiner, som
    levererade skinn mot metallvaror. Champlain stred med dem mot
    [irokeserna](#irokeskrigen-baverkrigen) – en fiendskap som präglade
    regionen i ett sekel.

    Nya Frankrike växte långsamt: omkring 1660 bodde där bara cirka 3 000
    fransmän, jämfört med tiotusentals engelsmän i kolonierna längre
    söderut. [Britterna erövrade Québec
    1759](#parisfreden-1763-kanada-forloras) under sjuårskriget. Den
    fransktalande befolkningen blev kvar, och därför är Québec idag
    fransktalande inom Kanada.

    Jämför med Cartiers tidigare resor: [Cartier vid S:t Lawrence
    1534](#cartier-vid-s-t-lawrence-1534).

richelieu:
  period: 1620
  label: "Richelieu"
  title: "Kardinal Richelieu (Frankrike 1624–1642)"
  wiki:
    - "sv:Kardinal Richelieu"
    - "en:Siege of La Rochelle"
  text: |
    **Armand-Jean du Plessis, kardinal de Richelieu** (1585–1642) var
    katolsk kardinal och från 1624 kung Ludvig XIII:s förste minister – i
    praktiken Frankrikes ledare i 18 år. Han är känd från Dumas roman *De
    tre musketörerna* som skurken, men räknas av historiker som en av
    grundarna av den moderna franska staten.

    Hans mål var att stärka kungamakten inåt och Frankrike utåt. Inåt
    krossade han hugenotternas militära makt genom belägringen av La
    Rochelle 1627–28, där uppskattningsvis 4/5 av stadens cirka 27 000
    invånare dog, mest av svält; de fick behålla sin religionsfrihet men
    inte sina fästningar (se [Nantes-ediktet](#nantes-ediktet-1598)). Han
    lät riva adelns borgar, förbjöd dueller och skickade ut kungliga
    ämbetsmän, intendenter, för att styra provinserna.

    Utåt var hans stora fiende den katolska Habsburgdynastin i Spanien och
    Österrike. Därför finansierade han, trots att han var kardinal,
    protestantiska Sverige i [trettioåriga
    kriget](#trettioariga-kriget-1618) (fördraget i Bärwalde 1631: 400 000
    riksdaler om året) och gick 1635 själv in i kriget. Han myntade i
    praktiken idén om *raison d'état* – att statens intresse går före
    religion. Han grundade också Franska akademien ([se
    1635](#franska-akademien-1635)).

franska-akademien-1635:
  period: 1620
  label: "Franska akademien 1635"
  title: "Franska akademien 1635"
  wiki:
    - "sv:Franska akademien"
    - "sv:Svenska Akademien"
  text: |
    **Académie française** grundades 1635 av [kardinal
    Richelieu](#richelieu) (se där) av en privat krets av författare som
    träffats sedan 1629. Den har 40 ledamöter, kallade ”de odödliga”, som
    sitter på livstid; när någon dör väljer de övriga en efterträdare.

    Uppdraget var att göra det franska språket ”rent, vältaligt och i
    stånd att behandla konst och vetenskap”, alltså att fastställa regler
    för stavning, grammatik och ordförråd. Den första upplagan av
    akademiens ordbok kom 1694, nästan 60 år senare; den nionde upplagan
    blev klar 2024. Akademien var också ett sätt för staten att knyta
    kulturlivet till kungamakten.

    Franskan blev under 1600- och 1700-talen Europas diplomati- och
    överklasspråk, delvis tack vare detta arbete och Frankrikes politiska
    makt. Akademien blev förebild för andra: **Svenska Akademien**
    grundades 1786 av Gustav III efter fransk modell, med 18 ledamöter på
    livstid, och delar sedan 1901 ut Nobelpriset i litteratur. Franska
    akademien försöker idag fortfarande ersätta engelska lånord, som
    ”courriel” i stället för ”email”.

    Jämför med den engelska vetenskapsakademin [Royal
    Society](#royal-society).

fronden-1648:
  period: 1640
  label: "Fronden 1648"
  title: "Fronden 1648–1653"
  wiki:
    - "sv:Fronden"
  text: |
    **Fronden** var en serie uppror i Frankrike 1648–1653 mot kungamakten.
    Namnet kommer av ordet för slangbella (fronde), som Parisbarn använde
    för att kasta sten. Kungen, **[Ludvig XIV](#ludvig-xiv-1643)**, var
    bara tio år, och riket styrdes av hans mor Anna av Österrike och den
    italienskfödde kardinalen **Mazarin**.

    Frankrike var hårt beskattat efter årtionden av krig mot Spanien och i
    [trettioåriga kriget](#trettioariga-kriget-1618). Först gjorde Paris
    parlament – en domstol av adliga ämbetsmän – motstånd mot nya skatter;
    när Mazarin lät arrestera ledarna 1648 restes barrikader i Paris.
    Senare tog högadeln och prinsar av blodet till vapen. Kungafamiljen
    fick fly från Paris två gånger.

    Upproret var splittrat och föll ihop. Men den unge Ludvig glömde
    aldrig förnedringen. Den förklarar mycket av hans senare politik: han
    samlade makten hos sig själv, tämjde adeln genom att låta den leva vid
    hovet i Versailles ([se 1660-talet](#ludvig-xiv-versailles)) och
    flyttade bort från Paris. Det var början på det franska **enväldet** –
    kungen styr ensam utan begränsningar.

ludvig-xiv-1643:
  period: 1640
  label: "Ludvig XIV 1643"
  title: "Ludvig XIV blir kung 1643"
  wiki:
    - "sv:Ludvig XIV av Frankrike"
  text: |
    **Ludvig XIV** (1638–1715), ”Solkungen”, blev kung av Frankrike som
    fyraåring 1643 och regerade i 72 år – längst av alla europeiska
    monarker. Hans far Ludvig XIII hade med [kardinal
    Richelieu](#richelieu) redan stärkt kungamakten.

    Under barndomen styrde modern och kardinal **Mazarin**, och [upproret
    Fronden](#fronden-1648) (1648–53) lärde honom att misstro adeln och
    Paris. När Mazarin dog 1661 meddelade Ludvig att han skulle styra
    själv utan förste minister. Han blev symbolen för **enväldet**
    (absolutismen): kungen har all makt och står bara till svars inför
    Gud. Citatet ”Staten, det är jag” är troligen apokryft men fångar
    idén.

    Frankrike var Europas folkrikaste land med uppskattningsvis 20
    miljoner invånare (Sverige hade drygt 1). Ludvig [byggde
    Versailles](#ludvig-xiv-versailles), lät [Colbert](#colbert)
    organisera ekonomin (se 1660-talet) och förde nästan oavbrutet krig
    för att utvidga Frankrikes gränser; armén växte till kanske 300
    000–400 000 man. 1685 upphävde han protestanternas religionsfrihet
    (Nantesiska ediktet), vilket drev ut uppskattningsvis 200 000
    hugenotter. Han efterlämnade ett mäktigt men skuldsatt land.

ludvig-xiv-versailles:
  period: 1660
  label: "Ludvig XIV: Versailles"
  title: "Ludvig XIV och Versailles"
  wiki:
    - "sv:Versailles slott"
    - "sv:Ludvig XIV av Frankrike"
  text: |
    **Versailles** var ursprungligen ett jaktslott cirka 20 km sydväst om
    Paris. Från 1661 lät **Ludvig XIV** (”Solkungen”, [se
    1643](#ludvig-xiv-1643)) bygga ut det till Europas största palats.
    1682 flyttade hovet och regeringen dit permanent. Bygget pågick i
    decennier med tiotusentals arbetare; spegelsalen är 73 meter lång.

    Syftet var politiskt. Efter upproret [Fronden](#fronden-1648)
    (1648–53) ville Ludvig ha högadeln under uppsikt. Vid hovet bodde
    tusentals adelsmän som tävlade om kungens gunst genom en noggrann
    etikett – att få hålla ljuset när kungen gick till sängs var en ära.
    Adelsmän som var upptagna med hovliv utmanade inte kungen. Samtidigt
    hölls de borta från sina egna landsbygdsregioner.

    Versailles blev förebild för hela Europas furstar; Drottningholm i
    Sverige och Schönbrunn i Wien är exempel. Franska blev språket för
    diplomati och fint folk. Men kostnaden var enorm och avståndet mellan
    hovet och folket ökade. Det var just till Versailles som Parisborna
    marscherade i oktober 1789 för att hämta kungafamiljen under [franska
    revolutionen](#franska-revolutionen-1789).

colbert:
  period: 1660
  label: "Colbert"
  title: "Jean-Baptiste Colbert"
  wiki:
    - "sv:Jean-Baptiste Colbert"
    - "sv:Merkantilism"
  text: |
    **Jean-Baptiste Colbert** (1619–1683) var [Ludvig
    XIV](#ludvig-xiv-1643):s finansminister från 1661 och kungens
    viktigaste ämbetsman i över tjugo år. Han var son till en
    klädeshandlare, inte adlig av gammal släkt, och arbetade ofta 15–16
    timmar per dag.

    Han är förknippad med **merkantilismen** – den ekonomiska idén att ett
    lands rikedom mäts i guld och silver, och att staten därför ska
    maximera export och minimera import. Colbert införde höga tullar på
    utländska varor, gav statsstöd till fabriker för lyxvaror som speglar,
    gobelänger, siden och porslin, och lockade hit hantverkare från
    Venedig och Nederländerna. Han byggde kanaler (som Canal du Midi, 240
    km mellan Atlanten och Medelhavet) och vägar.

    Han byggde också upp den franska flottan från ett tjugotal fartyg till
    uppskattningsvis 200, grundade handelskompanier för Ostindien och
    Västindien, och lät förbereda *Code Noir* (utfärdad 1685), lagen om
    slaveriet i de franska kolonierna. Han grundade franska
    vetenskapsakademien 1666. Hans sparsamhet kämpade förgäves mot kungens
    krig och byggen. Idag betyder ”colbertism” en statsstyrd
    industripolitik.

    Se även [Ludvig XIV: Versailles](#ludvig-xiv-versailles), det största
    av kungens byggen.

moliere:
  period: 1660
  label: "Molière"
  title: "Molière"
  wiki:
    - "sv:Molière"
  text: |
    **Molière** (Jean-Baptiste Poquelin, 1622–1673) var en fransk
    skådespelare, teaterchef och dramatiker, den mest kända
    komediförfattaren i fransk litteratur. Franska kallas ibland ”Molières
    språk”, som engelska kallas [Shakespeares](#shakespeare-fodd-1564).

    Han turnerade i 13 år i landsorten med sitt teatersällskap innan han
    1658 fick spela inför [Ludvig XIV](#ludvig-xiv-1643) i Paris. Kungen
    tyckte om honom och skyddade honom. Molière skrev satirer om sin tids
    typer: hycklaren i *Tartuffe* (1664), den snåle i *Den girige*,
    uppkomlingen som vill vara adlig i *Borgaren adelsman*, och läkare som
    hittar på latinska ord i *Den inbillade sjuke*.

    *Tartuffe*, om en from bedragare, förbjöds i fem år efter protester
    från kyrkan och fromma kretsar vid hovet. Molière dog 1673 efter att
    ha kollapsat på scenen under den fjärde föreställningen av *Den
    inbillade sjuke*, där han själv spelade huvudrollen. Hans sällskap
    blev 1680 grunden för Comédie-Française, som fortfarande finns. Han
    spelas än idag, även på svenska scener.

nantes-ediktet-upphavs-1685-hugenotter:
  period: 1680
  label: "Nantes-ediktet upphävs 1685, hugenotter flyr"
  title: "Nantesiska ediktet upphävs 1685"
  wiki:
    - "sv:Nantesiska ediktet"
    - "sv:Hugenotter"
  text: |
    **Hugenotter** var franska protestanter (kalvinister). Efter de
    franska religionskrigen på 1500-talet hade kung Henrik IV 1598
    utfärdat **[Nantesiska ediktet](#nantes-ediktet-1598)**, som gav dem
    religionsfrihet och vissa säkerheter. 1685 upphävde **[Ludvig
    XIV](#ludvig-xiv-1643)** ediktet genom Fontainebleau-ediktet:
    protestantismen förbjöds, kyrkor revs, och den som inte konverterade
    förföljdes.

    Uppskattningsvis 150 000–200 000 hugenotter flydde, trots att
    utvandring var förbjuden – till Nederländerna, England,
    [Brandenburg-Preussen](#brandenburg-preussen-vaxer), Schweiz,
    Sydafrika och Nordamerika. Många var hantverkare, köpmän och bankirer,
    till exempel sidenvävare, urmakare och tryckare.

    Frankrike förlorade därmed kompetens och kapital, medan konkurrenterna
    vann. Brandenburg bjöd aktivt in flyktingarna med Potsdam-ediktet, och
    omkring var femte invånare i Berlin var en tid fransman. Jämför med
    andra tillfällen där en stat driver ut sin egen kompetens, som
    [judarna från Spanien 1492](#judar-utvisas) eller forskarna från
    Nazityskland på 1930-talet.

spanska-tronfoljdskriget:
  period: 1700
  label: "Spanska tronföljdskriget"
  title: "Spanska tronföljdskriget 1701–1714"
  wiki:
    - "sv:Spanska tronföljdskriget"
  text: |
    När Spaniens barnlöse kung Karl II dog 1700 lämnade han riket till
    **Filip av Anjou**, sonson till Frankrikes kung Ludvig XIV (se
    [Spanska tronföljden hotar](#spanska-tronfoljden-hotar)). Med Spanien
    och Frankrike under samma släkt, Bourbonerna, skulle Frankrike
    dominera Europa och Spaniens kolonier.

    En allians – England, Nederländerna, Österrike, Preussen och Portugal
    – gick därför i krig för att i stället ge tronen till den österrikiske
    ärkehertigen Karl. Kriget utkämpades i Nederländerna, Tyskland,
    Italien, Spanien och kolonierna. De mest kända fältherrarna var
    engelsmannen **hertigen av Marlborough** och Eugen av Savojen, som
    vann vid Blenheim 1704. Slaget vid Malplaquet 1709 kostade runt 30 000
    döda och sårade på en dag. Totalt dog uppskattningsvis 400 000–700 000
    soldater.

    Det slutade med [Utrechtfreden 1713](#utrechtfreden-1713) (se den):
    Filip fick Spanien men avsade sig rätten till Frankrikes tron.
    Österrike fick Spanska Nederländerna och delar av Italien,
    Storbritannien fick [Gibraltar](#gibraltar-brittiskt-1713). Kriget
    samtidigt som [stora nordiska kriget](#stora-nordiska-kriget) i norr
    gjorde att Västeuropas makter aldrig ingrep där.

ludvig-xiv-dor-1715:
  period: 1700
  label: "Ludvig XIV dör 1715"
  title: "Ludvig XIV dör 1715"
  wiki:
    - "sv:Ludvig XIV"
    - "sv:Versailles slott"
  text: |
    **Ludvig XIV**, kallad **Solkungen**, var kung av Frankrike 1643–1715
    – 72 år, den längsta regeringstiden för en monark i en större
    europeisk stat. Han blev kung som fyraåring.

    Han är sinnebilden av **enväldet**, kungamakt utan parlament eller
    andra begränsningar; citatet "Staten är jag" tillskrivs honom, men
    troligen felaktigt. Han lät bygga slottet i
    **[Versailles](#ludvig-xiv-versailles)** och samlade adeln där, så att
    den blev beroende av hovet i stället för att bygga egen makt.
    Frankrike var Europas folkrikaste land med uppskattningsvis 20
    miljoner invånare (jämför England med cirka 5 miljoner) och hade dess
    största armé, upp mot 400 000 man.

    Ludvig förde krig under nästan halva sin regeringstid; det sista,
    [spanska tronföljdskriget](#spanska-tronfoljdskriget) (se det), tömde
    statskassan. Han upphävde [Nantesiska ediktet
    1685](#nantes-ediktet-upphavs-1685-hugenotter) (se det). Han
    efterträddes av sitt femåriga barnbarnsbarn, Ludvig XV. Statsskulden
    han lämnade efter sig blev ett återkommande problem som till slut
    bidrog till [franska revolutionen 1789](#franska-revolutionen-1789).

mississippi-bubblan:
  period: 1720
  label: "Mississippi-bubblan"
  title: "Mississippibubblan 1719–1720"
  wiki:
    - "sv:Mississippibubblan"
    - "sv:John Law"
  text: |
    **John Law** (1671–1729) var en skotsk ekonom och spelare som fick
    Frankrikes regent att pröva hans idéer. Frankrike var skuldsatt efter
    [Ludvig XIV](#ludvig-xiv-dor-1715):s krig. Law grundade 1716 en bank
    som gav ut papperspengar – en nyhet i Frankrike – och tog över ett
    kompani med monopol på handeln med Louisiana (se [New Orleans
    1718](#new-orleans-1718)), Mississippikompaniet.

    Kompaniet tog över statsskulden: folk fick byta statsobligationer mot
    aktier, och banken tryckte sedlar som användes för att köpa fler
    aktier. Kursen steg från cirka 500 livres 1719 till omkring 10 000
    livres i början av 1720, ungefär 20 gånger. Ordet "miljonär" lär ha
    myntats då. Law blev finansminister.

    I själva verket gav Louisiana knappt någon vinst. När folk började
    lösa in sedlar mot guld och silver kollapsade kursen 1720, inflationen
    sköt i höjden och Law flydde landet. Fransmännen blev misstänksamma
    mot papperspengar och banker i årtionden. Jämför
    [Södersjöbubblan](#sodersjobubblan-1720) samma år i London, och se hur
    statsskulden senare bidrog till [franska revolutionen
    1789](#franska-revolutionen-1789).

voltaire:
  period: 1720
  label: "Voltaire"
  title: "Voltaire"
  wiki:
    - "sv:Voltaire"
    - "sv:Upplysningen"
  text: |
    **Voltaire** (François-Marie Arouet, 1694–1778) var en fransk
    författare och filosof, den mest kända gestalten i **upplysningen** –
    1700-talets rörelse som ville ersätta tradition, kyrkans auktoritet
    och kungens godtycke med förnuft, vetenskap och mänskliga rättigheter.

    Han satt i Bastiljen 1717–1718 för en satir mot regenten och
    landsförvisades 1726 till England, där han studerade
    [Newton](#newton-principia-1687) och Locke och imponerades av den
    större friheten. Hans *Filosofiska brev* (1734) prisade England och
    bannlystes i Frankrike. Han skrev pjäser, historia, tusentals brev och
    den satiriska romanen *Candide* (1759), som hånar idén att allt är
    till det bästa i den bästa av världar.

    Han kämpade mot religiös intolerans och justitiemord, bland annat i
    fallet Jean Calas, en protestant som avrättades 1762. Han umgicks med
    [Fredrik den store](#fredrik-den-store) i Preussen. Hans idéer om
    yttrande- och religionsfrihet påverkade den amerikanska och [den
    franska revolutionen](#franska-revolutionen-1789). Citatet "Jag
    ogillar det du säger men ska försvara din rätt att säga det" är dock
    skrivet av en senare biograf.

encyklopedin-1751:
  period: 1740
  label: "Encyklopedin 1751"
  title: "Encyklopedin 1751"
  wiki:
    - "sv:Encyclopédie"
    - "sv:Denis Diderot"
  text: |
    **Encyklopedin** (*Encyclopédie, ou dictionnaire raisonné des
    sciences, des arts et des métiers*) var ett franskt uppslagsverk som
    gavs ut 1751–1772 av filosofen **Denis Diderot** och matematikern
    **Jean le Rond d'Alembert**. Det började som en översättning av ett
    engelskt lexikon men växte till 28 band med cirka 72 000 artiklar och
    2 500 kopparstick.

    Det var **upplysningens** stora projekt: att samla all mänsklig
    kunskap ordnad efter förnuftet, inte efter kyrkans auktoritet. Bland
    de cirka 140 skribenterna fanns [Voltaire](#voltaire), Rousseau och
    Montesquieu. Mycket utrymme ägnades åt hantverk och teknik –
    vävstolar, gruvor, tryckerier – med detaljerade bilder, vilket var
    nytt: praktiskt kunnande sågs som lika värdefullt som teologi.

    Kritik mot kyrkan och kungamakten smögs in, ofta via korshänvisningar.
    Verket förbjöds 1759 och påven satte det på listan över förbjudna
    böcker, men det trycktes vidare i halvhemlighet. Det spred kritiskt
    tänkande som bidrog till [franska revolutionen
    1789](#franska-revolutionen-1789). Jämför med Wikipedia idag – samma
    idé om fri kunskap för alla.

parisfreden-1763-kanada-forloras:
  period: 1760
  label: "Parisfreden 1763: Kanada förloras"
  title: "Parisfreden 1763: Frankrike förlorar Kanada"
  wiki:
    - "en:Treaty of Paris (1763)"
    - "en:New France"
  text: |
    Parisfreden i februari 1763 avslutade
    [sjuårskriget](#sjuarskriget-slut-1763) mellan Storbritannien å ena
    sidan och Frankrike och Spanien å den andra. Det var Frankrikes
    svåraste nederlag på över ett sekel.

    Frankrike överlämnade Kanada och allt land öster om Mississippi till
    Storbritannien. Louisiana väster om floden hade redan getts till
    Spanien. I Indien fick Frankrike bara behålla några handelsstationer.
    Men Frankrike valde att få tillbaka de små sockeröarna Guadeloupe och
    Martinique i Karibien hellre än Kanada – socker odlat av slavar var
    mycket mer lönsamt. [Voltaire](#voltaire) avfärdade Kanada som ”några
    tunnland snö”. Av det stora franska Nordamerika återstod bara öarna
    Saint-Pierre och Miquelon, som är franska än i dag.

    Två långsiktiga följder: omkring 60 000–70 000 fransktalande i Québec
    hamnade under brittiskt styre, vilket är ursprunget till dagens
    tvåspråkiga Kanada. Och Frankrike sökte revansch – därför stödde
    landet den [amerikanska revolutionen
    1778–1783](#amerikanska-kolonier-forlorade-1783), vilket gav en
    statsskuld som bidrog till [franska revolutionen
    1789](#franska-revolutionen-1789).

franska-revolutionen-1789:
  period: 1780
  label: "Franska revolutionen 1789"
  title: "Franska revolutionen 1789"
  wiki:
    - "sv:Franska revolutionen"
    - "sv:Stormningen av Bastiljen"
  text: |
    Frankrike var Europas folkrikaste land med omkring 28 miljoner
    invånare. Samhället var uppdelat i tre stånd: prästerskap, adel och
    resten – 97 procent av folket, som bar nästan hela skattebördan. Efter
    dyra krig, särskilt [stödet till
    USA](#amerikanska-kolonier-forlorade-1783), var staten i praktiken
    bankrutt, och dåliga skördar hade höjt brödpriserna kraftigt.

    Kung Ludvig XVI kallade 1789 in **generalständerna**, en ståndsriksdag
    som inte samlats sedan 1614. Tredje ståndet förklarade sig i juni vara
    nationalförsamling. Den 14 juli stormade folk i Paris fästningen
    **Bastiljen**; i augusti avskaffades adelns privilegier och
    deklarationen om människans och medborgarens rättigheter antogs.

    Revolutionen radikaliserades: monarkin avskaffades 1792, [kungen
    avrättades 1793](#ludvig-xvi-avrattas-1793) och skräckväldet 1793–94
    avrättade omkring 17 000 personer efter rättegång. Den slutade med
    [Napoleons makttagande 1799](#napoleon). Den gav oss begrepp som höger
    och vänster (efter var man satt i församlingen),
    [metersystemet](#metersystemet-1795) och idén om nationen som suverän
    – grundidéer i dagens politik.

ludvig-xvi-avrattas-1793:
  period: 1780
  label: "Ludvig XVI avrättas 1793"
  title: "Ludvig XVI avrättas 1793"
  wiki:
    - "sv:Ludvig XVI av Frankrike"
  text: |
    **Ludvig XVI** blev kung av Frankrike 1774, gift med österrikiska
    Marie Antoinette, dotter till [Maria Teresia](#maria-teresia). Han var
    välmenande men obeslutsam, mer intresserad av lås och jakt än av
    politik. När [revolutionen kom 1789](#franska-revolutionen-1789)
    försökte han först anpassa sig som konstitutionell monark.

    I juni 1791 försökte kungafamiljen fly utomlands men greps i Varennes.
    Det förstörde förtroendet. När Österrike och Preussen gick i krig mot
    Frankrike 1792 misstänktes kungen för att samarbeta med fienden. I
    augusti stormades slottet Tuilerierna, monarkin avskaffades och
    Frankrike blev republik. Konventet, den nya nationalförsamlingen,
    ställde ”medborgaren Louis Capet” inför rätta och dömde honom till
    döden med knapp majoritet.

    Han avrättades med giljotin i Paris den 21 januari 1793; Marie
    Antoinette i oktober samma år. Giljotinen var tänkt som en jämlik och
    human avrättningsmetod. Kungamordet chockade Europa: Storbritannien,
    Spanien och Nederländerna [gick med i kriget mot
    Frankrike](#revolutionskrigen), och inne i landet började
    skräckväldet.

napoleon:
  period: 1780
  label: "Napoleon"
  title: "Napoleon Bonaparte"
  wiki:
    - "sv:Napoleon I"
    - "sv:Napoleonkrigen"
  text: |
    **Napoleon Bonaparte** (1769–1821) föddes på Korsika, som just blivit
    franskt, i en lågadlig familj. Han var artilleriofficer, och
    revolutionen öppnade karriärvägar som stängts för sådana som han.
    Under 1790-talet steg han snabbt: hans fälttåg i Italien 1796–97 som
    26-årig general gjorde honom till hjälte, och efter [fälttåget i
    Egypten 1798](#napoleon-i-egypten-1798) tog han makten i en kupp i
    november 1799.

    Han gjorde sig till [kejsare 1804](#napoleon-kejsare-1804) och
    besegrade Österrike, Preussen och Ryssland i snabba slag som
    Austerlitz 1805. Som mest kontrollerade han, direkt eller via
    släktingar, större delen av Europa. Men fälttåget mot Ryssland 1812
    kostade uppskattningsvis 400 000–500 000 av hans soldater livet eller
    friheten, och han besegrades slutgiltigt vid [Waterloo
    1815](#waterloo-1815).

    Hans varaktiga arv är civilrättsligt: *Code Napoléon* (1804), en
    lagbok med likhet inför lagen och äganderätt, som spreds över Europa
    och Latinamerika. Han satte också punkt för [Tysk-romerska riket
    (1806)](#tysk-romerska-riket-upplost-1806), och hans marskalk
    Bernadotte blev svensk kung.

napoleon-kejsare-1804:
  period: 1800
  label: "Napoleon kejsare 1804"
  title: "Napoleon kröns till kejsare 1804"
  wiki:
    - "sv:Napoleon I"
    - "sv:Code civil"
  text: |
    [Napoleon Bonaparte](#napoleon) tog makten i en kupp 1799 och styrde
    som förste konsul, i praktiken diktator. 1802 gjorde han sig till
    konsul på livstid. Genom en folkomröstning 1804 – med officiellt 99
    procent ja, men under knappast fria former – blev han kejsare av
    fransmännen.

    Vid kröningen i Notre-Dame i Paris den 2 december 1804 var påven Pius
    VII närvarande, men Napoleon satte kronan på sitt eget huvud, en
    symbolisk markering att makten inte kom från kyrkan. Samma år antogs
    **Code civil**, senare kallad Code Napoléon: en enhetlig lagbok med
    likhet inför lagen, äganderätt och civiläktenskap, men också mannens
    makt över hustrun. Den ersatte hundratals lokala lagsystem och
    påverkar fortfarande civilrätten i Frankrike, Belgien, Spanien,
    Latinamerika och andra länder.

    Det var en ironi: [en revolution](#franska-revolutionen-1789) som
    avskaffat kungadömet slutade med ett nytt kejsardöme, med en ny adel
    och ärftlig tron. Ludwig van Beethoven ska ha strukit dedikationen
    till Napoleon på sin tredje symfoni, *Eroica*, i ilska när han hörde
    nyheten.

julirevolutionen-1830:
  period: 1820
  label: "Julirevolutionen 1830"
  title: "Julirevolutionen i Frankrike 1830"
  wiki:
    - "sv:Julirevolutionen"
  text: |
    Efter [Napoleons fall 1815](#waterloo-1815) återinsattes kungahuset
    **Bourbon**, som styrt Frankrike före revolutionen 1789. Kung **Karl
    X** (från 1824) försökte återställa kungens och adelns makt och
    utfärdade i juli 1830 förordningar som upplöste parlamentet,
    inskränkte rösträtten och införde censur av pressen.

    Paris reagerade med ett uppror under tre dagar, 27–29 juli (”de tre
    ärorika dagarna”), med barrikader i gatorna. Ungefär 1 000–2 000
    människor dödades. Karl X abdikerade och flydde. I stället blev hans
    släkting **Ludvig Filip** av Orléans kung – en så kallad borgarkung
    som styrde under en konstitution och med stöd av de förmögna.
    Rösträtten utvidgades, men bara till omkring 170 000 män av en
    befolkning på drygt 30 miljoner.

    Revolutionen inspirerade uppror på andra håll, bl.a. Belgiens
    frigörelse från Nederländerna ([Belgien 1830](#belgien-1830)) och ett
    misslyckat polskt uppror mot Ryssland. Missnöjet med den snäva
    rösträtten ledde till nästa [revolution 1848](#revolution-1848).
    Eugène Delacroix målning *Friheten på barrikaderna* skildrar
    julirevolutionen.

algeriet-erovras:
  period: 1820
  label: "Algeriet erövras"
  title: "Frankrikes erövring av Algeriet 1830–1847"
  wiki:
    - "en:French conquest of Algeria"
    - "sv:Abd el-Kader"
  text: |
    Algeriet var formellt en del av Osmanska riket (det turkiska imperium
    som styrde Mellanöstern och delar av Nordafrika) men i praktiken
    självstyrande under en dej (lokal härskare) i Alger. En diplomatisk
    incident 1827 – dejen slog den franske konsuln med en solfjäder – blev
    förevändning för krig. Den impopuläre Karl X hoppades att en militär
    seger skulle stärka hans ställning.

    Fransmännen intog Alger i juli 1830, bara veckor innan Karl X
    störtades i [Julirevolutionen](#julirevolutionen-1830). Erövringen av
    inlandet tog sedan nästan två decennier. Motståndet leddes främst av
    emiren **Abd el-Kader**, som höll ut till 1847. Frankrike satte in upp
    till 100 000 soldater och krigföringen var brutal, med förstörda byar
    och skördar. Algeriets befolkning minskade kraftigt av krig, svält och
    epidemier, enligt vissa uppskattningar med en tredjedel fram till
    1870-talet.

    Algeriet blev 1848 formellt en del av Frankrike, inte en vanlig
    koloni, och hundratusentals europeiska nybyggare flyttade dit. Det
    gjorde avkoloniseringen extra blodig: [Algerietkriget
    1954–1962](#algeriet-fritt-1962) kostade hundratusentals liv och
    störtade den franska fjärde republiken.

revolution-1848:
  period: 1840
  label: "1848: revolution"
  title: "Februarirevolutionen i Frankrike 1848"
  wiki:
    - "sv:Februarirevolutionen"
    - "en:French Revolution of 1848"
  text: |
    Under ”borgarkungen” **Ludvig Filip** (kung sedan [Julirevolutionen
    1830](#julirevolutionen-1830)) hade bara de rikaste rösträtt – runt
    250 000 män av drygt 35 miljoner invånare. Missväxt 1846–1847 och en
    ekonomisk kris gav arbetslöshet och dyr mat. Oppositionen ordnade
    politiska ”banketter” för att kringgå mötesförbud, och när regeringen
    förbjöd en sådan i februari 1848 bröt upplopp ut i Paris.

    Efter tre dagar av strider abdikerade kungen. Den **andra republiken**
    utropades, och allmän rösträtt för män infördes – Frankrikes väljarkår
    ökade på en gång till ca 9 miljoner. Slaveriet i kolonierna
    avskaffades. Staten inrättade nationella verkstäder för att ge de
    arbetslösa jobb.

    När verkstäderna lades ned i juni 1848 gjorde Paris arbetare uppror
    (**junidagarna**), som slogs ned av armén; uppskattningsvis flera
    tusen dödades. I december valdes Napoleons brorson Louis-Napoléon
    Bonaparte till president med stor majoritet, och han gjorde sig 1852
    till kejsare (se [Napoleon III](#napoleon-iii)). Februarirevolutionen
    utlöste en våg av uppror i hela Europa (se [1848 års
    revolutioner](#ars-revolutioner-1848)).

napoleon-iii:
  period: 1840
  label: "Napoleon III"
  title: "Napoleon III – Frankrikes andra kejsardöme 1852–1870"
  wiki:
    - "sv:Napoleon III"
    - "sv:Andra franska kejsardömet"
  text: |
    **Louis-Napoléon Bonaparte** (1808–1873) var brorson till Napoleon I.
    Han hade gjort två misslyckade kuppförsök och suttit i fängelse, men
    valdes 1848 till president i den nya franska republiken, mycket tack
    vare sitt kända namn. Eftersom författningen inte tillät omval tog han
    1851 makten i en statskupp och utropade sig 1852 till kejsare
    **Napoleon III**.

    Hans tid, det andra kejsardömet, präglades av auktoritärt styre men
    snabb modernisering: järnvägsnätet sexdubblades, banker som Crédit
    Lyonnais grundades, och Paris byggdes om av prefekten **Haussmann**
    med breda boulevarder, avlopp och parker – det Paris turister ser
    idag. Utrikespolitiskt deltog Frankrike i [Krimkriget
    1853–1856](#krimkriget-1853), hjälpte [Italien att
    enas](#italien-enas-1861), byggde ut kolonier i Västafrika och
    [Indokina](#fransk-indokina-saigon-1862), och gjorde ett misslyckat
    försök att installera en kejsare i Mexiko.

    Han föll när han lät sig provoceras av Bismarck in i [fransk-tyska
    kriget 1870](#fransk-tyska-kriget-1870). Han tillfångatogs med sin
    armé vid Sedan, avsattes, och Frankrike blev republik igen (den tredje
    republiken). Han dog i exil i England.

pasteur:
  period: 1860
  label: "Pasteur"
  title: "Louis Pasteur och bakterieteorin"
  wiki:
    - "sv:Louis Pasteur"
    - "sv:Pastörisering"
  text: |
    **Louis Pasteur** (1822–1895) var en fransk kemist som kom att lägga
    grunden för mikrobiologin – läran om mikroorganismer som bakterier och
    jästsvampar. Han började med att undersöka varför vin och öl ibland
    blev surt, och visade att jäsning och förruttnelse orsakas av levande
    mikroorganismer, inte uppstår av sig själva.

    Med ett berömt experiment med svanhalsade glaskolvar visade han
    omkring 1860 att näringslösning förblir steril om inga mikrober kan
    komma in utifrån – därmed avfärdades den gamla idén om att liv uppstår
    spontant. Han uppfann **pastörisering**: kort upphettning (t.ex. till
    ca 60–70 °C) som dödar de flesta mikrober utan att förstöra drycken,
    idag använd på mjölk i hela världen. Hans arbete stödde
    **bakterieteorin**, att många sjukdomar orsakas av mikroorganismer.

    Bakterieteorin fick kirurgen [Joseph Lister](#lister-antiseptik-1867)
    att införa antiseptik (karbolsyra) vid operationer 1867, vilket
    dramatiskt minskade infektionsdödligheten. Pasteur utvecklade också
    vacciner mot mjältbrand och [rabies
    (1885)](#pasteurs-rabiesvaccin-1885). Tillsammans med tysken [Robert
    Koch, som identifierade tuberkelbacillen
    1882](#koch-tuberkelbakterien-1882), gjorde han medicinen
    vetenskaplig. Bakterieteorin förklarade också i efterhand
    [Semmelweis](#semmelweis) iakttagelser om handtvätt.

fransk-tyska-kriget-1870:
  period: 1860
  label: "fransk-tyska kriget 1870"
  title: "Fransk-tyska kriget 1870–1871"
  wiki:
    - "sv:Fransk-tyska kriget"
  text: |
    Preussen, under premiärministern **Otto von Bismarck**, ville ena de
    tyska staterna under preussisk ledning. Frankrike under kejsar
    [Napoleon III](#napoleon-iii) såg en enad tysk stormakt vid sin gräns
    som ett hot. Bismarck provocerade fram kriget genom att publicera en
    tillspetsad version av ett telegram från den preussiske kungen
    (Emsdepeschen), och Frankrike förklarade krig i juli 1870. Det fick de
    sydtyska staterna att ansluta sig till Preussen.

    Den tyska sidan mobiliserade snabbt omkring 1,2 miljoner man med hjälp
    av järnvägar och ett modernt generalstabssystem, och hade överlägset
    artilleri av stål från Krupp. Bara sex veckor in i kriget, i slaget
    vid **Sedan** den 1 september, tillfångatogs Napoleon III med omkring
    100 000 soldater. Paris belägrades i fyra månader och kapitulerade i
    januari 1871. Uppskattningsvis 140 000–180 000 soldater dog totalt.

    Tyska riket utropades i spegelsalen i Versailles den 18 januari 1871
    (se [Tyska riket 1871](#tyska-riket-1871-bismarck)). Frankrike blev
    republik, fick betala 5 miljarder franc och förlorade
    **Alsace-Lorraine**. Hämndkänslorna i Frankrike blev en av orsakerna
    till [första världskriget 1914](#forsta-varldskriget).

pariskommunen-1871:
  period: 1860
  label: "Pariskommunen 1871"
  title: "Pariskommunen 1871"
  wiki:
    - "sv:Pariskommunen"
  text: |
    Efter Frankrikes nederlag i [fransk-tyska
    kriget](#fransk-tyska-kriget-1870) hade Paris genomlidit en fyra
    månader lång belägring med svält – stadsborna åt hästar, hundar och
    till och med djuren i zoo. Den nyvalda nationalförsamlingen var
    konservativ och monarkistisk och slöt fred på hårda villkor.
    Pariserna, särskilt arbetarna och nationalgardet (en beväpnad
    medborgarmilis), kände sig svikna.

    När regeringen i mars 1871 försökte ta nationalgardets kanoner gjorde
    Paris uppror. Staden valde ett eget styre, **Kommunen**, som styrde i
    drygt två månader. Den införde åtskillnad mellan kyrka och stat,
    avskaffade nattarbete i bagerier och gav övergivna verkstäder till
    arbetarkooperativ. Regeringen satt under tiden i Versailles.

    I maj 1871 stormade regeringens armé Paris under **”den blodiga
    veckan”**. Kommunarderna sköt gisslan och satte eld på byggnader;
    regeringstrupperna avrättade fångar i massor. Uppskattningsvis 10
    000–20 000 kommunarder dödades, och tusentals deporterades. Marx
    beskrev kommunen som det första exemplet på ”proletariatets diktatur”,
    och den blev en symbol för den socialistiska och kommunistiska
    rörelsen; Lenin studerade den noga [inför 1917](#revolutionerna-1917).

eiffeltornet-1889:
  period: 1880
  label: "Eiffeltornet 1889"
  title: "Eiffeltornet 1889"
  wiki:
    - "sv:Eiffeltornet"
    - "sv:Gustave Eiffel"
  text: |
    Eiffeltornet byggdes till **världsutställningen i Paris 1889**, som
    firade hundraårsdagen av [franska
    revolutionen](#franska-revolutionen-1789). Det konstruerades av
    ingenjörsfirman som leddes av **Gustave Eiffel**, som även byggt
    stommen till Frihetsgudinnan. Tornet är ca 300 m högt (idag 330 m med
    antenner) och byggdes på drygt två år av ca 18 000 järndelar och 2,5
    miljoner nitar.

    Det var världens högsta byggnad fram till Chrysler Building i New York
    1930 – nästan dubbelt så högt som det tidigare rekordet, Washington
    Monument (169 m). Det visade vad järnkonstruktion kunde åstadkomma,
    samma teknik som gjorde skyskrapor och långa järnvägsbroar möjliga.

    Många konstnärer protesterade mot ”det värdelösa och monstruösa
    tornet”, och tillståndet gällde bara 20 år. Det räddades bl.a. för att
    det var användbart för radiosändningar – en ny teknik (se ”[Marconi:
    radio 1895](#marconi-radio-1895)”). Idag har det runt 6–7 miljoner
    besökare per år.

dreyfusaffaren-1894:
  period: 1880
  label: "Dreyfusaffären 1894"
  title: "Dreyfusaffären 1894–1906"
  wiki:
    - "sv:Dreyfusaffären"
    - "sv:Alfred Dreyfus"
  text: |
    År 1894 dömdes den judiske franske arméofficeren **Alfred Dreyfus**
    för att ha sålt militära hemligheter till Tyskland. Han fick livstids
    deportation till Djävulsön i Franska Guyana. Bevisen var svaga, och
    hans judiska bakgrund spelade tydligt roll.

    1896 fann armén att den verklige förrädaren var en annan officer,
    Esterhazy, men ledningen mörkade det och Esterhazy frikändes. 1898
    publicerade författaren **Émile Zola** det öppna brevet *J'accuse…!*
    (”Jag anklagar”), som anklagade armén för mörkläggning. Frankrike
    splittrades i två läger: ”dreyfusarder” (republikaner, liberaler,
    socialister) mot ”antidreyfusarder” (armén, kyrkan, nationalister och
    antisemiter).

    Dreyfus benådades 1899 och friades helt 1906. Affären bidrog till att
    kyrka och stat skildes åt i Frankrike 1905. Den österrikiske
    journalisten **Theodor Herzl**, som bevakade rättegången, drog
    slutsatsen att judar behövde en egen stat och grundade den politiska
    sionismen – en väg till [Balfourdeklarationen
    1917](#balfourdeklarationen-1917) och [Israel 1948](#israel-1948).

broderna-lumiere-film-1895:
  period: 1880
  label: "bröderna Lumière, film 1895"
  title: "Bröderna Lumière och filmens födelse 1895"
  wiki:
    - "sv:Bröderna Lumière"
    - "en:Cinématographe"
  text: |
    Den 28 december 1895 visade bröderna **Auguste och Louis Lumière**,
    som drev en fotografisk fabrik i Lyon, rörliga bilder för betalande
    publik på ett kafé i Paris. Det räknas ofta som biografens födelse.
    Filmerna var under en minut långa, t.ex. arbetare som lämnar fabriken
    eller ett tåg som anländer till en station.

    Deras apparat, **kinematografen**, var kamera, kopieringsmaskin och
    projektor i ett, och vägde bara några kilo. Den visade ca 16 bilder
    per sekund på en duk – tillräckligt snabbt för att ögat uppfattar
    rörelse. Konkurrenten var amerikanen Thomas Edison, vars kinetoskop
    (1891–93) bara visade film för en person i taget genom ett titthål.

    Inom 20 år var film en industri: långfilmer, Hollywood från
    1910-talet, ljudfilm 1927. Filmen blev 1900-talets stora massmedium,
    sedan [TV](#tv) och nu strömning – samma grundidé med stillbilder i
    snabb följd.

    Se även [fotografi](#fotografi).

verdun-1916:
  period: 1900
  label: "Verdun 1916"
  title: "Slaget vid Verdun 1916"
  wiki:
    - "sv:Slaget vid Verdun"
  text: |
    Slaget vid **Verdun** i nordöstra Frankrike pågick från februari till
    december 1916, ungefär 300 dagar – ett av historiens längsta slag. Den
    tyske överbefälhavaren **Erich von Falkenhayn** angrep en
    fästningsstad som fransmännen av prestigeskäl inte kunde ge upp, med
    syftet att ”blöda Frankrike vitt”, alltså döda så många franska
    soldater att landet inte orkade fortsätta.

    Frankrike försvarade staden under generalen **Philippe Pétain**, med
    parollen ”de ska inte komma igenom”. Nästan hela den franska armén
    roterades genom slaget via en enda väg, ”Voie Sacrée”, där en lastbil
    passerade ungefär var fjortonde sekund. Artilleriet sköt
    uppskattningsvis tiotals miljoner granater och området blev ett
    månlandskap som delvis fortfarande är avspärrat.

    Fronten flyttades bara några kilometer. Förlusterna var ca 700 000
    döda, sårade och saknade, varav uppskattningsvis 300 000 döda. Verdun
    blev Frankrikes symbol för kriget. Samma år pågick slaget vid Somme.
    Pétain blev nationalhjälte – och ledde senare Vichyregimen som
    samarbetade med [Nazityskland 1940–44](#ockupationen-1940).

folkfronten-1936:
  period: 1920
  label: "Folkfronten 1936"
  title: "Folkfronten i Frankrike 1936"
  wiki:
    - "sv:Folkfronten (Frankrike)"
    - "en:Popular Front (France)"
  text: |
    Folkfronten var en valallians mellan Frankrikes socialister,
    kommunister och vänsterliberaler (radikalerna), bildad för att stoppa
    fascismen efter våldsamma högerextrema upplopp i Paris i
    februari 1934. Den vann valet i maj 1936, och socialisten **Léon
    Blum** blev Frankrikes förste socialistiske – och förste judiske –
    premiärminister.

    Valsegern följdes av en våg av strejker och fabriksockupationer med
    uppskattningsvis 2 miljoner deltagare. Regeringen genomförde snabbt
    reformer: 40 timmars arbetsvecka, två veckors betald semester (första
    gången för många arbetare, som åkte till havet för första gången),
    kollektivavtal och lönehöjningar.

    Folkfronten splittrades av frågan om att hjälpa den spanska republiken
    i inbördeskriget (se [Spanska inbördeskriget
    1936](#spanska-inbordeskriget-193639-franco)), som Blum av rädsla för
    krig avstod från, och av ekonomiska problem. Regeringen föll
    redan 1937. Jämför med samtida reformer i Sverige
    ([Folkhemmet](#folkhemmet-socialdemokrati)) och USA ([New
    Deal](#new-deal)) – olika svar på [depressionen](#depressionen).

ockupationen-1940:
  period: 1940
  label: "Ockupationen 1940"
  title: "Frankrikes fall och ockupationen 1940"
  wiki:
    - "sv:Fälttåget i väst"
    - "sv:Vichyregimen"
  text: |
    I maj 1940 anföll Tyskland Frankrike genom Ardennerna, ett skogigt
    område som fransmännen trott var ofarbart för stridsvagnar, och
    kringgick därmed Maginotlinjen, Frankrikes dyra befästningssystem
    längs gränsen. På sex veckor var Frankrike besegrat. Omkring 340 000
    brittiska och franska soldater evakuerades från Dunkerque. Frankrike
    hade en av världens största arméer – snabbheten chockade alla.

    Vid vapenstilleståndet i juni delades Frankrike: norra delen och
    Atlantkusten ockuperades av Tyskland, och i söder styrde en
    samarbetsregim i Vichy under [förste världskrigshjälten](#verdun-1916)
    marskalk **Philippe Pétain**. Vichyregimen deltog i deportationen av
    omkring 76 000 judar från Frankrike till
    [förintelselägren](#forintelsen).

    Från London uppmanade generalen **Charles de Gaulle** till fortsatt
    kamp, och en motståndsrörelse, la Résistance, växte fram. Frankrike
    befriades 1944 efter de allierades landstigning i Normandie. Frågan om
    kollaborationen förblev en öm punkt i fransk självbild i decennier.

indokinakriget:
  period: 1940
  label: "Indokinakriget"
  title: "Indokinakriget 1946–54"
  wiki:
    - "sv:Indokinakriget"
    - "sv:Slaget vid Dien Bien Phu"
  text: |
    [Franska Indokina](#fransk-indokina-saigon-1862) omfattade dagens
    Vietnam, Laos och Kambodja och hade varit fransk koloni sedan slutet
    av 1800-talet. Under andra världskriget ockuperades det av Japan. När
    Japan kapitulerade 1945 utropade den kommunistiske ledaren **Ho Chi
    Minh** Vietnams självständighet, men Frankrike ville återta sin
    koloni.

    Kriget började 1946 mellan Frankrike och Viet Minh, Ho Chi Minhs
    självständighetsrörelse. Efter [Kinas kommunistiska revolution
    1949](#folkrepubliken-1949) fick Viet Minh vapen från Kina, och USA
    började finansiera Frankrike, till slut omkring 80 % av kostnaderna.
    Avgörandet kom vid [Dien Bien Phu 1954](#dien-bien-phu-1954), där
    omkring 11 000 franska soldater omringades och kapitulerade efter 57
    dagars belägring.

    Uppskattningsvis 400 000–500 000 dog i kriget. Vid Genèvekonferensen
    1954 delades Vietnam vid 17:e breddgraden i ett kommunistiskt nord och
    ett västorienterat syd. USA tog över Frankrikes roll, vilket ledde
    till [Vietnamkriget](#vietnamkriget) på 1960–70-talen.

algeriet-fritt-1962:
  period: 1960
  label: "Algeriet fritt 1962"
  title: "Algeriets självständighet 1962"
  wiki:
    - "sv:Algerietkriget"
    - "sv:Charles de Gaulle"
  text: |
    [Frankrike erövrade Algeriet från 1830](#algeriet-franskt), och till
    skillnad från andra kolonier räknades det formellt som en del av
    Frankrike, uppdelat i franska departement. Omkring en miljon européer
    bodde där (”pieds-noirs”, svartfötter) och styrde över cirka nio
    miljoner muslimska algerier som saknade fulla rättigheter.

    1954 startade självständighetsrörelsen **FLN** (Nationella
    befrielsefronten) ett uppror. **Algerietkriget** 1954–62 var brutalt
    på båda sidor: bombdåd mot civila, och systematisk tortyr från fransk
    armé. Uppskattningarna av döda algerier varierar kraftigt, från
    omkring 300 000 till över en miljon; omkring 25 000 franska soldater
    dog. Frankrike hade som mest omkring 400 000 soldater där.

    Kriget fällde Fjärde republiken: 1958 hotade generaler i Alger med
    kupp, och krigshjälten **Charles de Gaulle** kallades tillbaka och
    skrev en ny författning med stark president – dagens Femte republik.
    de Gaulle insåg att kriget inte gick att vinna, och efter Evianavtalen
    blev Algeriet självständigt den 5 juli 1962. Inom några månader flydde
    nästan alla pieds-noirs till Frankrike. Kriget präglar än i dag
    relationerna mellan länderna och fransk invandringsdebatt.

maj-1968:
  period: 1960
  label: "maj 1968"
  title: "Majrevolten i Frankrike 1968"
  wiki:
    - "en:May 68"
  text: |
    I maj 1968 ockuperade studenter universitet i Paris, först i förorten
    Nanterre och sedan Sorbonne. Polisen slog till hårt, och studenterna
    byggde barrikader i Latinkvarteren. Protesterna riktade sig mot ett
    stelt, auktoritärt universitet och samhälle, mot
    [Vietnamkriget](#vietnamkriget) (se det) och mot den åldrande
    presidenten **Charles de Gaulle**, som styrt sedan 1958.

    Det oväntade var att arbetarna anslöt sig: en generalstrejk med
    uppskattningsvis 7–10 miljoner strejkande lamslog Frankrike i flera
    veckor – fabriker ockuperades, tåg och post stod still. de Gaulle flög
    i hemlighet till en fransk militärbas i Västtyskland. Han kom
    tillbaka, upplöste parlamentet och vann en jordskredsseger i valet i
    juni, när många väljare tröttnat på kaoset. Arbetarna fick bland annat
    35 procents höjd minimilön. Ett år senare avgick de Gaulle.

    1968 var ett globalt protestår: [Pragvåren](#pragvaren-1968) (se det),
    studentprotester i USA, Västtyskland och Mexiko, och i Stockholm
    ockuperades studentkårens hus i maj. Revoltens bestående effekter var
    mest kulturella: friare relationer mellan generationer och könen,
    mindre auktoritära skolor och arbetsplatser, och en ny vänster.

mitterrand:
  period: 1980
  label: "Mitterrand"
  title: "François Mitterrand 1981–1995"
  wiki:
    - "sv:François Mitterrand"
  text: |
    **François Mitterrand** (1916–1996) var socialist och Frankrikes
    president i 14 år, 1981–1995 – den längsta tiden för någon fransk
    president. Han var den förste vänsterpresidenten i Femte republiken,
    som de Gaulle grundat 1958 (se [Algeriet fritt
    1962](#algeriet-fritt-1962)).

    De första åren förde han en radikal vänsterpolitik: förstatligande av
    storbanker och industrikoncerner, höjd minimilön, 39 timmars
    arbetsvecka, femte semesterveckan, pension vid 60 och avskaffat
    dödsstraff (1981). Men kapitalflykt, ökande underskott och inflation
    tvingade fram en kovändning 1983 till åtstramning och en stark franc.
    Det blev ett exempel som påverkade vänstern i hela Europa: ett enskilt
    lands ”socialism” var svår i en öppen världsekonomi.

    Mitterrand fick två gånger regera med en högerregering (”samboende”).
    Hans viktigaste arv är europeiskt: tillsammans med Västtysklands
    förbundskansler Helmut Kohl drev han på den inre marknaden och
    Maastrichtfördraget som skapade [EU 1993](#eu-1993) (se det) och lade
    grunden för euron. Delvis var det ett sätt att binda det återförenade
    Tyskland (se [återföreningen 1990](#aterforeningen-1990)) till Europa.
    Han lät också bygga stora projekt i Paris som glaspyramiden vid
    Louvren. Senare kom avslöjanden om hans samarbete med Vichyregimen
    under kriget och en hemlig utomäktenskaplig dotter.
