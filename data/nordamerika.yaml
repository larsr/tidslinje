# Nordamerika
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

vikingar-i-l-anse-aux-meadows:
  period: 1000
  label: "Vikingar i L'Anse aux Meadows"
  title: "L'Anse aux Meadows – vikingar i Amerika"
  wiki:
    - "sv:L'Anse aux Meadows"
  text: |
    **L'Anse aux Meadows** är en plats på norra spetsen av Newfoundland i
    Kanada där norska arkeologen Anne Stine Ingstad och hennes man Helge
    Ingstad 1960 hittade resterna av en nordisk bosättning. Det är det
    enda säkert bekräftade spåret av vikingar i Amerika, och ett världsarv
    sedan 1978.

    Man fann åtta byggnader av torv på en träram, av samma typ som på
    Island och Grönland, en smedja med järnslagg, en spinnhjul-tyngd (som
    tyder på att kvinnor var med) och nötskal från smörnötter som inte
    växer så långt norrut – ett tecken på att man rest längre söderut.
    Platsen kan ha rymt uppskattningsvis 70–90 personer och var troligen
    en bas för utforskning snarare än en permanent koloni.

    2021 kunde forskare datera trästycken som huggits med metallyxa till
    exakt år **1021**, tack vare en kraftig solstorm år 993 som lämnade
    ett tydligt märke i trädens årsringar. Det är det tidigaste säkra
    datumet för européer i Amerika, 471 år före
    [Columbus](#columbus-1492). Platsen övergavs efter några år, troligen
    för att den låg för långt från Grönland och ursprungsbefolkningen var
    fientlig. Se även [Leif Erikssons resa till
    Vinland](#leif-eriksson-nar-vinland-1000) enligt sagorna.

mississippikultur-cahokia:
  period: 1000
  label: "Mississippikultur, Cahokia"
  title: "Mississippikulturen och Cahokia"
  wiki:
    - "sv:Cahokia"
    - "en:Mississippian culture"
  text: |
    **Mississippikulturen** är arkeologernas namn på de indianska
    samhällen som växte fram i Mississippiflodens dalgång och sydöstra USA
    från omkring 800 till 1600. De odlade majs, bönor och squash, levde i
    hövdingadömen med tydlig rangordning och byggde stora jordpyramider
    med platt topp, på vilka tempel och ledarnas hus stod.

    Den största orten var **Cahokia**, nära dagens St. Louis. Den växte
    explosionsartat kring 1050 och hade som mest uppskattningsvis 10
    000–20 000 invånare – lika stor som London vid samma tid, och ingen
    stad i det som blev USA var större förrän Philadelphia på 1780-talet.
    Huvudhögen, **Monks Mound**, är 30 meter hög med en basyta större än
    Cheopspyramidens, byggd av uppskattningsvis 600 000 m³ jord som burits
    i korgar.

    Cahokia övergavs omkring 1350, troligen av flera skäl: överutnyttjande
    av skog, översvämningar, klimatförändringar och politisk splittring.
    När européerna kom på 1500-talet fanns Mississippikulturen kvar i
    sydöst, men de sjukdomar som spanjorerna förde med sig
    ([smittkoppor](#smittkoppor-dodar-miljoner-i-amerika) m.m.) decimerade
    den kraftigt.

chaco-kanjonen-puebloan:
  period: 1000
  label: "Chaco-kanjonen (Puebloan)"
  title: "Chaco Canyon och puebloindianerna"
  wiki:
    - "en:Chaco Culture National Historical Park"
    - "en:Ancestral Puebloans"
  text: |
    **Puebloindianerna** (tidigare kallade anasazi) är förfäder till
    dagens Hopi, Zuni och andra pueblofolk i sydvästra USA. **Chaco
    Canyon** i nordvästra New Mexico var deras centrum omkring 850–1150,
    med topp kring 1020–1120.

    I kanjonen byggdes ett dussin *great houses*, stora flervåningshus av
    sten. Det största, **Pueblo Bonito**, hade omkring 650–800 rum i upp
    till fem våningar och var den största byggnaden i Nordamerika fram
    till 1800-talet. Uppskattningsvis 200 000 stockar bars till fots från
    bergen upp till 80 km bort, eftersom det saknades skog i ökenkanjonen.
    Ett nätverk av raka vägar, upp till 10 meter breda, gick ut från
    kanjonen – trots att man saknade hjul och dragdjur.

    Chaco var troligen främst ett religiöst och ceremoniellt centrum.
    Byggnaderna är riktade efter solens och månens rörelser. Man hade
    handel ända till Mexiko: kakao och papegojfjädrar har hittats. Kring
    1130–1180 drabbades området av [en lång
    torka](#chaco-i-kris-torka-1130) och Chaco övergavs; folket flyttade
    till klippbostäder som [Mesa Verde](#mesa-verde-klippbostader) och
    senare söderut, där deras ättlingar bor kvar.

cahokia-vaxer:
  period: 1020
  label: "Cahokia växer"
  title: "Cahokia – Nordamerikas största stad"
  wiki:
    - "sv:Cahokia"
    - "en:Mississippian culture"
  text: |
    **Cahokia** låg nära nuvarande St. Louis vid Mississippifloden i USA.
    Den var centrum för
    **[Mississippikulturen](#mississippikultur-cahokia)**, folk som odlade
    majs och byggde stora jordhögar ("mounds"). Kring 1050 växte staden
    snabbt, kanske genom en religiös rörelse som lockade inflyttare.

    På sin topp (cirka 1050–1150) hade Cahokia uppskattningsvis 10 000–20
    000 invånare – lika många som London vid samma tid. Den största
    jordhögen, Monks Mound, är 30 meter hög med en bas större än
    Cheopspyramidens, byggd med uppskattningsvis 22 miljoner korgar jord,
    burna för hand. Där fanns också en "Woodhenge", cirklar av trästolpar
    som troligen användes som solkalender.

    Staden övergavs omkring 1350, kanske på grund av torka,
    översvämningar, skogsskövling och inre konflikter. När européer kom på
    1500-talet fanns den inte kvar, och många trodde länge att högarna
    byggts av något annat folk än indianerna. Cahokia är i dag världsarv.

chaco-kanjonen:
  period: 1020
  label: "Chaco-kanjonen"
  title: "Chacokanjonen"
  wiki:
    - "en:Chaco Culture National Historical Park"
    - "en:Ancestral Puebloans"
  text: |
    **Chacokanjonen** i nuvarande New Mexico, USA, var centrum för
    **puebloindianernas** förfäder (ofta kallade anasazi) mellan cirka 850
    och 1150. Pueblo betyder by på spanska och syftar på deras byggstil.

    De byggde "Great Houses" – flervåningshus i sten. Det största, Pueblo
    Bonito, hade cirka 650 rum i upp till fem våningar, och var en av de
    största byggnaderna i Nordamerika ända till 1800-talet. Från kanjonen
    utgick raka vägar, upp till 10 meter breda, över hundratals kilometer,
    trots att man varken hade hjul eller dragdjur. Byggnaderna är
    orienterade efter sol- och månrörelser.

    Varför det spelar roll: allt detta byggdes i en torr öken med cirka 20
    cm nederbörd per år. När [en lång torka](#chaco-i-kris-torka-1130) kom
    omkring 1130–1180 övergavs Chaco. Folket flyttade till klippbostäder
    som [Mesa Verde](#mesa-verde-klippbostader) och senare till de
    pueblobyar som fortfarande finns i New Mexico och Arizona.

mississippikultur-hogbyggare:
  period: 1040
  label: "Mississippikultur, högbyggare"
  title: "Mississippikulturen – högbyggarna"
  wiki:
    - "en:Mississippian culture"
    - "sv:Cahokia"
  text: |
    **Mississippikulturen** (cirka 800–1600) var ett nätverk av indianska
    samhällen i floddalarna i sydöstra och mellersta USA. De kallas ofta
    *högbyggare* (mound builders) eftersom de byggde stora jordhögar, ofta
    med platta toppar där tempel eller hövdingars hus stod.

    Grunden var majsodling, som kommit från Mexiko och blivit mer
    produktiv kring år 900. Det gav överskott, större byar och
    hövdingadömen med tydlig rangordning. Samhällena handlade över stora
    avstånd: koppar från Stora sjöarna, snäckor från Mexikanska golfen och
    glimmer från Appalacherna. Största centrum var Cahokia (se [Cahokia
    växer](#cahokia-vaxer)), men det fanns hundratals andra, som
    Moundville i Alabama och Etowah i Georgia.

    Varför det spelar roll: när spanjoren [Hernando de
    Soto](#coronado-de-soto) tågade genom området 1539–1543 mötte han
    fortfarande hövdingadömen av Mississippityp. Inom några decennier hade
    de flesta brutit samman, troligen främst av europeiska sjukdomar som
    [smittkoppor](#smittkoppor-dodar-miljoner-i-amerika). Folk som
    cherokee, creek och natchez är deras ättlingar.

cahokia:
  period: 1060
  label: "Cahokia"
  title: "Cahokia – Nordamerikas största stad"
  wiki:
    - "en:Cahokia"
    - "en:Mississippian culture"
  text: |
    **Cahokia** låg vid Mississippifloden, mittemot dagens St. Louis, och
    var centrum för
    **[Mississippikulturen](#mississippikultur-hogbyggare)** – indianska
    samhällen som odlade majs och byggde stora jordkullar. [Staden växte
    explosionsartat strax efter 1050](#cahokia-vaxer) och hade sin
    höjdpunkt omkring 1050–1150.

    Befolkningen uppskattas till 10 000–20 000 (vissa forskare säger mer),
    ungefär lika mycket som London vid samma tid. Ingen stad norr om
    Mexiko blev större förrän Philadelphia på 1780-talet. Mittpunkten var
    **Monks Mound**, en plattformskulle av packad jord, cirka 30 meter hög
    och med en bas på ungefär 290 × 240 meter – med en grundyta större än
    Cheopspyramidens. All jord bars dit i korgar; man hade inga dragdjur
    och inga hjul.

    Omkring kullen fanns ett stort torg, ett hundratal mindre kullar och
    cirklar av trästolpar som troligen användes för att följa solens
    rörelser. Från omkring 1200 minskade befolkningen och ca 1350 var
    platsen övergiven – orsakerna diskuteras: skogsskövling,
    översvämningar, torka eller politisk splittring. När européerna kom
    fanns bara kullarna kvar.

cahokia-2:
  period: 1080
