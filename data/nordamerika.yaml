  same_as: cahokia

cahokia-pa-topp-10-00020-000-inv:
  period: 1100
  label: "Cahokia på topp (~10 000–20 000 inv.)"
  title: "Cahokia – Nordamerikas största stad före Columbus"
  wiki:
    - "sv:Cahokia"
    - "en:Mississippian culture"
    - "en:Monks Mound"
  text: |
    **Cahokia** låg vid Mississippifloden, mitt emot dagens St. Louis. Det
    var huvudorten i den så kallade
    [Mississippikulturen](#mississippikultur-hogbyggare), ett samhälle av
    bönder som odlade majs, bönor och squash och byggde stora
    jordpyramider med platt topp (*mounds*). Staden hade sin storhetstid
    omkring 1050–1150 med uppskattningsvis 10 000–20 000 invånare.

    Det största bygget, **Monks Mound**, är omkring 30 meter högt och har
    en bottenyta på ungefär 290 × 240 meter – jämförbar med
    Cheopspyramidens bas. Det byggdes helt för hand med korgar av jord,
    uppskattningsvis 600 000 kubikmeter. Runt centrum fanns en träpalissad
    och cirklar av trästolpar som troligen användes för att följa solens
    gång.

    För jämförelse hade London vid samma tid ungefär lika många invånare.
    Ingen stad i det som blev USA blev större förrän på 1700-talet
    (Philadelphia). Cahokia övergavs gradvis under 1300-talet, troligen på
    grund av en kombination av torka, översvämningar, skogsskövling och
    politisk splittring – likt det som drabbade Chaco-kulturen i sydväst
    (se [torkan ~1130](#chaco-i-kris-torka-1130)).

chaco-i-kris-torka-1130:
  period: 1120
  label: "Chaco i kris, torka ~1130"
  title: "Chaco Canyon i kris – torkan ~1130"
  wiki:
    - "en:Chaco Culture National Historical Park"
    - "en:Ancestral Puebloans"
    - "en:Pueblo Bonito"
  text: |
    **Chaco Canyon** i dagens New Mexico var centrum för den kultur som
    brukar kallas förfäderspueblo (tidigare anasazi) – förfäderna till
    dagens Pueblo-folk, som Hopi och Zuni. Mellan ungefär 850 och 1130
    byggdes där stora flervåningshus av sten, så kallade *great houses*.
    Det största, Pueblo Bonito, hade omkring 650 rum och upp till fyra
    eller fem våningar – den största byggnaden i Nordamerika fram till
    1800-talet.

    Chaco var ett nav för ett nätverk av raka vägar, upp till 10 meter
    breda, och för handel med turkos, kakao och arapapegojor från Mexiko.
    Man byggde i ett område där det regnar lite och odling krävde noggrann
    vattenhushållning.

    Omkring 1130 började en torka som varade i ungefär 50 år; det vet vi
    från trädringar, som ger exakta årtal för både regnmängder och när
    timret höggs. Nybyggnationen upphörde och befolkningen flyttade under
    de följande decennierna norrut till platser som Mesa Verde (se [Mesa
    Verde: klippbostäder](#mesa-verde-klippbostader)). Det är ett av de
    tydligaste exemplen på hur klimatförändringar fick ett samhälle att
    omorganisera sig – samtidigt fanns en liknande torka även i
    [Cahokia-området](#mississippikultur-cahokia).

mesa-verde-klippbostader:
  period: 1140
  label: "Mesa Verde: klippbostäder"
  title: "Mesa Verde och klippbostäderna"
  wiki:
    - "en:Mesa Verde National Park"
    - "en:Cliff Palace"
    - "en:Ancestral Puebloans"
  text: |
    **Mesa Verde** (spanska för ”gröna platån”) ligger i sydvästra
    Colorado, nära gränsen där fyra amerikanska delstater möts. Här bodde
    förfäderspueblo-folket, förfäder till dagens Pueblo-folk som Hopi, i
    flera hundra år. Efter [torkan omkring 1130](#chaco-i-kris-torka-1130)
    och nedgången för [Chaco Canyon](#chaco-kanjonen) (se dit) ökade
    befolkningen i området.

    Från omkring 1190 och under 1200-talet flyttade många in i bostäder
    byggda i nischer och grottor i branta klippväggar. Det mest kända,
    **Cliff Palace**, har omkring 150 rum och 23 *kivor* – runda, delvis
    nedgrävda rum för ceremonier och möten – och kan ha haft 100–120
    invånare. Timret i husen gör att trädringsdatering ger exakta byggår.
    Ingen vet säkert varför man flyttade upp i klipporna; skydd mot
    fiender och mot väder är de vanligaste förklaringarna.

    [Omkring 1280 var Mesa Verde
    övergivet](#puebloans-lamnar-four-corners). En ny lång [torka
    1276–99](#stor-torka-i-sydvast-127699) är en sannolik orsak, kanske
    tillsammans med konflikter. Folket flyttade söderut till Rio
    Grande-dalen och Arizona, där deras ättlingar bor i dag. Mesa Verde
    blev nationalpark 1906 och var 1978 bland de första platserna på
    Unescos världsarvslista.

cahokia-3:
  period: 1160
  label: "Cahokia"
  same_as: cahokia

mississippikultur:
  period: 1180
  label: "Mississippikultur"
  title: "Mississippikulturen"
  wiki:
    - "sv:Mississippikulturen"
    - "en:Mississippian culture"
  text: |
    **Mississippikulturen** (ca 800–1600) är arkeologernas namn på de
    jordbrukande samhällena i Mississippiflodens dal och sydöstra USA. De
    odlade majs, bönor och squash, levde i hövdingadömen med tydlig
    rangordning och byggde stora jordhögar (*mounds*) med platta toppar,
    på vilka tempel och hövdingars hus stod. Man hade inte hjulet,
    dragdjur eller metallverktyg för jordbruk.

    Den största staden var **[Cahokia](#cahokia-vaxer)** nära dagens St.
    Louis, som runt 1050–1200 hade uppskattningsvis 10 000–20 000 invånare
    – i samma storleksordning som London vid samma tid. Den största
    jordhögen, Monks Mound, är cirka 30 meter hög och har en bas större än
    Cheopspyramidens.

    Långväga handel gav koppar från de stora sjöarna och snäckor från
    Mexikanska golfen. Efter 1200 minskade Cahokia (se ”[Cahokia
    avtar](#cahokia-avtar)”), men andra centra som Moundville i Alabama
    levde vidare. När spanjoren [Hernando de Soto](#coronado-de-soto) kom
    1539–43 fanns hövdingadömen kvar; [europeiska
    sjukdomar](#smittkoppor-dodar-miljoner-i-amerika) härjade dem sedan
    svårt.

cahokia-avtar:
  period: 1200
  label: "Cahokia avtar"
  title: "Cahokia avtar"
  wiki:
    - "sv:Cahokia"
    - "en:Cahokia"
  text: |
    **Cahokia**, nära dagens St. Louis i USA, var den största staden i
    Nordamerika norr om Mexiko före 1700-talet. Den hörde till
    [Mississippikulturen](#mississippikultur) (se denna). Vid sin topp
    omkring 1050–1150 hade den uppskattningsvis 10 000–20 000 invånare,
    omkring 120 jordhögar och ett centralt torg på cirka 20 hektar.

    Efter omkring 1200 började befolkningen minska, och runt 1350–1400 var
    platsen i stort sett övergiven. Kring centrum byggdes en träpalissad
    på cirka 3 km, flera gånger ombyggd, vilket tyder på krig eller oro.
    Orsakerna är omdiskuterade: översvämningar, torka, utarmade skogar och
    jordar, politiska konflikter eller en kombination.

    Befolkningen spreds till andra platser; Mississippikulturen levde
    vidare i södra USA. Cahokia är världsarv sedan 1982. Jämför med Angkor
    (se ”[Angkor på topp](#angkor-pa-topp)”), som också var en utbredd
    stad beroende av vattenhantering och som också tynade bort efter några
    hundra år.

mesa-verde:
  period: 1220
  label: "Mesa Verde"
  title: "Mesa Verde – klippbostäderna"
  wiki:
    - "en:Mesa Verde National Park"
    - "en:Ancestral Puebloans"
  text: |
    **Mesa Verde** (spanska: ”grönt bordsberg”) i sydvästra Colorado är en
    högplatå där *Ancestral Puebloans* (förfäderna till dagens pueblofolk,
    förr kallade anasazi) bodde i flera hundra år. De odlade majs, bönor
    och squash på torr mark och samlade regnvatten i dammar.

    Det mest kända är klippbostäderna, byggda ca 1190–1280 i grunda
    grottor under klipputsprång. Den största, **Cliff Palace**, har
    ungefär 150 rum och ett tjugotal *kivor* (runda, nedsänkta rum för
    ceremonier och sammankomster). Varför man flyttade upp i klipporna är
    omdiskuterat; försvar mot konflikter är en vanlig förklaring. Hela
    regionen kring Mesa Verde kan ha haft uppskattningsvis 20 000 invånare
    kring 1250.

    Inom några decennier efter 1280 var området helt övergivet. Orsakerna
    var sannolikt flera: en svår torka 1276–99 (se ”[Stor torka i
    sydväst](#stor-torka-i-sydvast-127699)”), utarmad jord och våld.
    Människorna flyttade söderut till Rio Grande-dalen och till Hopi- och
    Zuniområdena, där deras ättlingar bor än idag. Mesa Verde blev
    nationalpark 1906 och ett av de första världsarven 1978.

puebloans:
  period: 1240
  label: "Puebloans"
  title: "Ancestral Puebloans – pueblofolkens förfäder"
  wiki:
    - "en:Ancestral Puebloans"
    - "en:Chaco Culture National Historical Park"
  text: |
    **Ancestral Puebloans** (tidigare kallade *anasazi*, ett navajoord som
    brukar översättas ”de gamla fienderna”, som ättlingarna inte
    uppskattar) var jordbruksfolk i Four Corners-området, där Utah,
    Colorado, Arizona och New Mexico möts. De odlade majs, bönor och
    squash i ett torrt klimat med noggrann hantering av regnvatten, och
    tillverkade svartvit målad keramik.

    De byggde *pueblos* (spanska för ”byar”): flervåningshus av sten och
    lera med hundratals rum, ofta med takingångar via stegar. Toppen av
    deras kultur var **[Chaco Canyon](#chaco-kanjonen)** i New Mexico (ca
    850–1150), med byggnaden Pueblo Bonito på uppemot 600–800 rum, och ett
    nätverk av raka vägar. Efter 1150 avtog Chaco, och tyngdpunkten
    flyttade till Mesa Verde och liknande platser, där klippbostäderna
    byggdes (se ”[Mesa Verde](#mesa-verde)”).

    Kring 1250 levde troligen tiotusentals människor i regionen. Inom
    femtio år lämnades hela Four Corners-området (se ”[Stor torka i
    sydväst 1276–99](#stor-torka-i-sydvast-127699)”). Ättlingarna – hopi,
    zuni och pueblofolken längs Rio Grande – bor kvar i Arizona och New
    Mexico och har bevarat språk och ceremonier. Taos Pueblo har varit
    bebott i ca 1 000 år.

stor-torka-i-sydvast-127699:
  period: 1260
  label: "Stor torka i sydväst 1276–99"
  title: "Den stora torkan i sydvästra Nordamerika 1276–1299"
  wiki:
    - "en:Ancestral Puebloans"
    - "sv:Dendrokronologi"
  text: |
    Mellan 1276 och 1299 drabbades sydvästra Nordamerika – Four
    Corners-området där Colorado, Utah, Arizona och New Mexico möts – av
    en lång och svår torka. Vi vet det från *dendrokronologi*: årsringarna
    i träd är tunna under torra år och tjocka under våta, och genom att
    jämföra mönstren i många gamla trästockar kan man datera varje år
    exakt. Metoden utvecklades i just detta område av astronomen A. E.
    Douglass under början av 1900-talet, och ”den stora torkan” blev ett
    av de första kända resultaten.

    För **Ancestral Puebloans** (se ”[Puebloans](#puebloans)” och ”[Mesa
    Verde](#mesa-verde)”), som odlade majs på torr mark utan
    konstbevattning från floder, var det förödande. Men torkan förklarar
    inte allt: det hade funnits torka förut, och befolkningen hade vuxit.
    Forskare pekar också på utarmad jord, avskogning, konflikter (det
    finns spår av våld och befästningar) och kanske religiösa
    förändringar.

    Hela Four Corners-området – där kanske tiotusentals människor bott –
    var nästan tomt år 1300. Folket flyttade söderut och österut till Rio
    Grande och till Hopi- och Zuniområdena. Torkan är ett exempel som ofta
    tas upp i diskussionen om hur klimatförändringar påverkar samhällen
    (jämför mayakulturens kollaps ca 800–900 och den lilla istiden i
    Europa från 1300-talet).

puebloans-lamnar-four-corners:
  period: 1280
  label: "Puebloans lämnar Four Corners"
  title: "Puebloanerna lämnar Four Corners"
  wiki:
    - "en:Ancestral Puebloans"
    - "en:Mesa Verde National Park"
  text: |
    **Four Corners** är området i sydvästra USA där delstaterna Utah,
    Colorado, Arizona och New Mexico möts. Där levde
    **förfäderspuebloanerna** (tidigare kallade anasazi), ett
    jordbruksfolk som odlade majs, bönor och squash. De är kända för hus
    av sten och lera i flera våningar, bland annat klippbostäderna i [Mesa
    Verde](#mesa-verde) och de stora byggnaderna i [Chaco
    Canyon](#chaco-kanjonen), med flera hundra rum.

    Omkring 1280–1300 övergavs regionen nästan helt. Uppskattningsvis
    tiotusentals människor flyttade söderut och österut till Rio
    Grande-dalen och Arizona. Trädringar visar en svår torka 1276–1299.
    Forskarna tror att den samverkade med andra faktorer: skogsskövling,
    utarmad jord, konflikter (vissa byar visar tecken på våld) och
    religiösa förändringar.

    Folket försvann inte – deras ättlingar är dagens pueblofolk, som hopi
    och zuni, som fortfarande bor i området. Händelsen är ett exempel på
    hur samhällen sårbara för klimatsvängningar tvingas flytta. Jämför med
    att samma tid markerade början på den kallare perioden i Europa ([se
    Lilla istiden](#lilla-istiden-borjar)) och att norrmännens
    bosättningar på Grönland övergavs ungefär 100–150 år senare.

mississippikultur-2:
  period: 1300
  label: "Mississippikultur"
  same_as: mississippikultur

irokesfolken:
  period: 1400
  label: "Irokesfolken"
  title: "Irokesfolken och Irokesförbundet"
  wiki:
    - "sv:Irokeser"
    - "en:Iroquois Confederacy"
  text: |
    **Irokeserna**, som själva kallar sig *Haudenosaunee* (”folket i
    långhuset”), bodde i nuvarande delstaten New York och angränsande
    delar av Kanada. Fem folk – mohawk, oneida, onondaga, cayuga och
    seneca – bildade ett förbund; tuscarora anslöt 1722 som det sjätte.

    Enligt traditionen grundades förbundet av fredsmäklaren **Deganawida**
    och **Hiawatha**, som fick de krigande folken att anta en gemensam
    författning, *Den stora fredslagen*. Dateringen är omstridd: förslag
    finns från 1100-talet till 1500-talet, men 1400-talet nämns ofta.

    Förbundet hade ett råd med 50 hövdingar som fattade beslut i enighet.
    Släkttillhörighet gick på moderns sida, och de äldre kvinnorna i
    klanerna (”klanmödrarna”) utsåg och kunde avsätta hövdingarna. Man
    bodde i byar med **långhus**, upp till 50–60 meter långa, där flera
    familjer bodde, och odlade majs, bönor och squash.

    Förbundet blev en betydande makt i 1600- och 1700-talens krig mellan
    fransmän och engelsmän. Benjamin Franklin hänvisade till det som
    förebild för en union av kolonierna, och USA:s kongress erkände 1988
    ett visst inflytande på konstitutionen – hur stort är omdiskuterat.

    Jämför med ett annat statsförbund i Amerika, den [aztekiska
    trippelalliansen 1428](#aztekisk-trippelallians-1428).

cabot-vid-newfoundland-1497:
  period: 1480
  label: "Cabot vid Newfoundland 1497"
  title: "John Cabot vid Newfoundland 1497"
  wiki:
    - "en:John Cabot"
    - "en:Grand Banks of Newfoundland"
    - "en:Beothuk"
  text: |
    Fem år efter [Columbus](#columbus-1492) seglade den venetianske
    sjömannen **John Cabot** (Giovanni Caboto) västerut i engelsk tjänst
    från Bristol, med kung Henrik VII:s tillstånd. Med det lilla skeppet
    *Matthew* och ungefär 18–20 man gick han i land i juni 1497, troligen
    på **Newfoundland** eller Kap Breton i dagens Kanada. Han trodde att
    han nått nordöstra Asien.

    Cabot såg spår av människor men mötte ingen. Området beboddes av
    beothukfolket, som senare dog ut på 1800-talet efter kontakten med
    europeiska bosättare. Mest betydelsefullt i hans rapport var de enorma
    torskstimmen på **Grand Banks**. Inom några årtionden fiskade
    baskiska, portugisiska, franska och engelska fartyg där varje sommar.
    Torskfisket där pågick i nästan 500 år, tills beståndet kollapsade och
    fisket stoppades 1992.

    Cabot är den förste europé sedan vikingarna ([L'Anse aux
    Meadows](#vikingar-i-l-anse-aux-meadows), ca år 1000) som säkert nådde
    Nordamerika. Hans resa blev Englands rättsliga grund för anspråk i
    Nordamerika, men den första varaktiga engelska kolonin kom först 1607
    ([Jamestown](#jamestown-1607)).

ponce-de-leon-i-florida-1513:
  period: 1500
  label: "Ponce de León i Florida 1513"
  title: "Ponce de León i Florida 1513"
  wiki:
    - "en:Juan Ponce de León"
    - "en:Spanish Florida"
  text: |
    **Juan Ponce de León** (1474–1521) var en spansk conquistador –
    conquistadorerna var de spanska soldater och äventyrare som erövrade
    Amerika. Han hade varit med på [Columbus andra resa
    1493](#columbus-i-karibien-1492) och var guvernör över Puerto Rico,
    där han tvingade [taínofolket](#tainofolket-dor-ut) till arbete i
    guldgruvorna.

    1513 seglade han norrut från Puerto Rico med tre skepp och kom i april
    till en kust han döpte till **La Florida**, eftersom det var påsktid
    (*Pascua Florida*, ”den blomstrande påsken”) och landet var grönt. Han
    var en av de första européerna som säkert gick i land i det som i dag
    är USA. Han upptäckte också Golfströmmen, den starka havsströmmen som
    senare användes av spanska skattflottor på väg hem till Spanien.

    Legenden om att han sökte **ungdomens källa** nämns i källor först
    efter hans död och är troligen påhittad. 1521 återvände han för att
    grunda en koloni, men calusafolket anföll och han dog av ett pilsår.
    Spanien grundade [St. Augustine 1565](#s-t-augustine-florida-1565),
    den äldsta kontinuerligt bebodda staden av europeiskt ursprung i USA.
    Florida köptes av USA 1819.

cartier-vid-s-t-lawrence-1534:
  period: 1520
  label: "Cartier vid S:t Lawrence 1534"
  title: "Jacques Cartier och S:t Lawrencefloden 1534"
  wiki:
    - "sv:Jacques Cartier"
    - "en:Jacques Cartier"
  text: |
    **Jacques Cartier** (1491–1557) var en fransk sjöfarare som av kung
    [Frans I](#frans-i) fick i uppdrag att söka guld och en nordvästlig
    passage till Asien. Spanien och Portugal hade delat upp de nya
    länderna mellan sig, och Frankrike ville också ha del.

    1534 kom han till Newfoundland och S:t Lawrenceviken i dagens Kanada.
    På andra resan 1535–36 seglade han uppför S:t Lawrencefloden till
    irokesiska byar där Québec och Montréal nu ligger. Ordet ”kanata”,
    irokesiska för by, ska ha gett landet dess namn. Vintern var
    förödande: omkring 25 av hans män dog av
    [skörbjugg](#lind-citrus-mot-skorbjugg-1747) (C-vitaminbrist), och de
    övriga räddades av ett avkok på barr och bark som urinvånarna lärde
    dem.

    Han hittade inget guld – det han tog hem visade sig vara kvarts och
    pyrit – och någon passage fanns inte. Men resorna grundade Frankrikes
    anspråk på området. Permanent fransk bosättning kom först med
    [Champlains Québec 1608](#champlain-grundar-quebec-1608), och fransk
    kultur och språk lever kvar i Québec idag.

coronado-de-soto:
  period: 1540
  label: "Coronado, de Soto"
  title: "Coronado och de Soto i Nordamerika"
  wiki:
    - "sv:Hernando de Soto"
    - "en:Francisco Vázquez de Coronado"
  text: |
    Efter att [Cortés](#aztekriket-faller-1521) och
    [Pizarro](#pizarro-tar-inkariket-1532) funnit enorma rikedomar hos
    aztekerna och inkafolket hoppades spanjorer på liknande riken norr om
    Mexiko. Två stora expeditioner gav sig ut nästan samtidigt.

    **Hernando de Soto** landsteg i Florida 1539 med omkring 600 man,
    hästar och grisar, och vandrade i fyra år genom dagens sydöstra USA.
    Han var den förste européen som korsade Mississippifloden (1541).
    Expeditionen var våldsam mot urinvånarna; de Soto dog själv 1542 och
    omkring hälften av hans män överlevde. **Francisco Vázquez de
    Coronado** drog 1540–42 med uppskattningsvis 300–400 spanjorer och
    över 1 000 indianska allierade från Mexiko norrut genom Arizona och
    New Mexico ända till Kansas, på jakt efter de legendariska ”sju
    guldstäderna” i Cíbola. Han fann byar av soltorkat lertegel. Några av
    hans män var de första européer som såg Grand Canyon.

    Inget guld hittades, och spanjorerna förlorade intresset för området i
    flera decennier. Men de Sotos expedition spred troligen sjukdomar: när
    nästa européer kom till Mississippi-området över 100 år senare var
    många av de stora samhällen han beskrivit borta.

s-t-augustine-florida-1565:
  period: 1560
  label: "S:t Augustine, Florida 1565"
  title: "S:t Augustine grundas 1565"
  wiki:
    - "en:St. Augustine, Florida"
    - "en:Pedro Menéndez de Avilés"
  text: |
    **S:t Augustine** i Florida grundades 1565 av den spanske amiralen
    Pedro Menéndez de Avilés. Det är den äldsta europeiska stad i
    nuvarande USA som har varit bebodd utan avbrott, 42 år äldre än
    engelska [Jamestown (1607)](#jamestown-1607) och 55 år äldre än
    pilgrimernas [Plymouth (1620)](#mayflower-1620).

    Spanien grundade staden främst av militära skäl: de spanska
    silverflottorna från Mexiko och Karibien seglade hem längs Floridas
    kust med Golfströmmen, och kusten behövde skyddas mot pirater och mot
    franska protestanter (hugenotter) som just byggt Fort Caroline i
    närheten. Menéndez anföll fransmännen och lät avrätta flera hundra av
    dem.

    Staden förblev liten – några hundra till ett par tusen invånare under
    lång tid – och byggde senare stenfästningen Castillo de San Marcos
    (1672–1695). Florida bytte ägare flera gånger (till Storbritannien
    1763, tillbaka till Spanien 1783) och övergick till USA 1821. S:t
    Augustine påminner om att stora delar av USA:s södra och västra del
    först var spanska, långt före de engelska kolonierna.

roanoke-kolonin-forsvinner:
  period: 1580
  label: "Roanoke-kolonin försvinner"
  title: "Den försvunna kolonin Roanoke"
  wiki:
    - "en:Roanoke Colony"
    - "sv:Walter Raleigh"
  text: |
    **Roanoke** var Englands första försök att grunda en bosättning i
    Nordamerika, på en ö i nuvarande North Carolina. Den finansierades av
    hovmannen **Walter Raleigh**; området hade döpts till Virginia efter
    den ogifta drottningen [Elisabet I](#elisabet-i-1558)
    (”jungfrudrottningen”). Ett första försök 1585–86 gav upp.

    1587 kom omkring 115 nybyggare, med män, kvinnor och barn, under
    ledning av John White. Där föddes Virginia Dare, det första engelska
    barnet i Amerika. White seglade hem efter förnödenheter, men kriget
    med Spanien (se [Armadan 1588](#armadan-slas-1588)) hindrade honom att
    återvända. När han kom tillbaka 1590 var kolonin övergiven. Det enda
    spåret var ordet ”CROATOAN” ristat i en stolpe – namnet på en
    närliggande ö och ett indianfolk.

    Vad som hände är fortfarande okänt. Den vanligaste teorin är att
    nybyggarna gick upp i lokala indianfolk. Misslyckandet visade hur
    svårt kolonisation var utan regelbunden försörjning. Nästa engelska
    försök, Jamestown 1607 ([se där](#jamestown-1607)), var ett aktiebolag
    med större resurser – och även det var nära att dö ut.

jamestown-1607:
  period: 1600
  label: "Jamestown 1607"
  title: "Jamestown 1607"
  wiki:
    - "sv:Jamestown, Virginia"
    - "en:Jamestown, Virginia"
  text: |
    **Jamestown** i Virginia, grundad i maj 1607, var den första varaktiga
    engelska bosättningen i Nordamerika. Den drevs av Virginiakompaniet,
    ett aktiebolag som hoppades hitta guld och en väg till Asien. Omkring
    105 män kom med tre skepp och slog sig ned på en sumpig halvö vid
    floden James (uppkallad efter kung Jakob I).

    De första åren var katastrofala. Malaria, tyfus, dåligt vatten och
    konflikter med Powhatanfolket, ett förbund av indianfolk som
    behärskade området, tog hårt. Vintern 1609–10, ”svälttiden”, sjönk
    antalet invånare från omkring 500 till ungefär 60; arkeologer har
    hittat bevis för kannibalism. Kapten **John Smith** och Powhatans
    dotter **Pocahontas** hör till kolonins kända namn; Pocahontas gifte
    sig senare med kolonisten John Rolfe och reste till England.

    Räddningen blev tobak: Rolfe odlade från cirka 1612 en mildare sort,
    och exporten växte snabbt. Tobaksodlingen krävde mycket arbetskraft,
    vilket ledde till kontraktsarbetare från England och snart till
    afrikanska slavar ([se
    1619](#forsta-afrikanska-slavarna-till-virginia)). 1619 hölls också
    den första valda församlingen, en föregångare till USA:s demokrati.

    Se även det tidigare misslyckade försöket, [Roanoke-kolonin
    försvinner](#roanoke-kolonin-forsvinner).

quebec-1608:
  period: 1600
  label: "Québec 1608"
  title: "Québec grundas 1608"
  wiki:
    - "sv:Québec (stad)"
    - "sv:Nya Frankrike"
  text: |
    År 1608 grundade fransmannen **Samuel de Champlain** handelsposten
    Québec vid S:t Lawrencefloden i nuvarande Kanada ([se även Champlain
    grundar Québec 1608](#champlain-grundar-quebec-1608)). Platsen valdes
    för att floden där smalnar av till ungefär en kilometer, under en hög
    klippa, och därmed var lätt att försvara och kontrollera. Det var bara
    ett år efter [Jamestown](#jamestown-1607) längre söderut.

    Québec blev centrum för **Nya Frankrike**. Kolonin byggde på
    pälshandel med indianfolk: bäverskinn till hattar för den europeiska
    marknaden. Via S:t Lawrencefloden och de stora sjöarna nådde
    fransmännen långt in i kontinenten, och senare följde de Mississippi
    ända till Mexikanska golfen och grundade Louisiana och [New Orleans
    1718](#new-orleans-1718).

    Fransmännen var dock alltid få jämfört med engelsmännen; kring 1750
    fanns uppskattningsvis 60 000–70 000 fransmän i Nya Frankrike mot över
    en miljon i de brittiska kolonierna. Britterna erövrade Québec 1759,
    och [Frankrike förlorade Kanada
    1763](#parisfreden-1763-kanada-forloras). Den gamla staden innanför
    murarna är Unesco-världsarv.

forsta-afrikanska-slavarna-till-virginia:
  period: 1600
  label: "första afrikanska slavarna till Virginia 1619"
  title: "De första afrikanerna i Virginia 1619"
  wiki:
    - "en:1619 in the Colony of Virginia"
    - "en:Slavery in the colonial history of the United States"
  text: |
    I augusti 1619 kom ett engelskt kaparskepp, *White Lion*, till Point
    Comfort nära Jamestown i Virginia ([se 1607](#jamestown-1607)). Ombord
    fanns ”20 och några” afrikaner, enligt kolonisten John Rolfe. De var
    troligen från Ndongo i dagens Angola och hade tagits från ett
    portugisiskt slavskepp på väg till Mexiko. De byttes mot
    förnödenheter.

    Deras rättsliga ställning var till en början oklar; en del verkar ha
    behandlats som kontraktsarbetare som kunde bli fria efter ett antal
    år, och någon fast lagstiftning om slaveri fanns ännu inte. Under
    1600-talet skärptes lagarna steg för steg: från 1662 ärvde barn sin
    mors status, och kring 1705 var slaveri på livstid baserat på hudfärg
    fastslaget i Virginias lag.

    Året 1619 har blivit en symbol för slaveriets början i det som blev
    USA. Slaveriet bestod till 1865 och omfattade då cirka 4 miljoner
    människor. Jämför: av de uppskattningsvis 12,5 miljoner afrikaner som
    [fördes över Atlanten 1500–1866](#atlantisk-slavhandel-borjar) kom
    bara ungefär 4–5 procent till Nordamerika; de flesta hamnade i
    Brasilien och Karibien.

mayflower-1620:
  period: 1620
  label: "Mayflower 1620"
  title: "Mayflower 1620"
  wiki:
    - "sv:Mayflower"
    - "en:Plymouth Colony"
  text: |
    **Mayflower** var ett engelskt handelsskepp som 1620 förde 102
    passagerare över Atlanten på drygt två månader. En del av dem var
    **puritaner** – strängt protestantiska kristna som tyckte att engelska
    statskyrkan var för katolsk – och de hade först flytt till
    Nederländerna. Eftervärlden kallar dem pilgrimsfäderna.

    De landade vid Cape Cod i Massachusetts och grundade kolonin
    **Plymouth**. Innan de gick i land skrev de under Mayflower-kompakten,
    ett kort avtal om att styra sig själva genom gemensamma beslut – ofta
    sett som ett tidigt exempel på självstyre i Amerika. Första vintern
    dog ungefär hälften. Med hjälp av wampanoag-folket, som lärde dem odla
    majs, överlevde resten; skördefesten 1621 räknas traditionellt som den
    första Thanksgiving.

    Plymouth förblev litet, men det var början på den stora puritanska
    utvandringen till New England (se [Boston 1630](#boston-1630)).
    Engelsmännen hade redan 1607 grundat [Jamestown](#jamestown-1607) i
    Virginia. Jämför: [Nya Sverige](#nya-sverige-1638) kom 1638.

nya-amsterdam-1626:
  period: 1620
  label: "Nya Amsterdam 1626"
  title: "Nya Amsterdam 1626"
  wiki:
    - "sv:Nya Amsterdam"
    - "en:New Netherland"
  text: |
    **Nya Amsterdam** var huvudorten i den nederländska kolonin Nya
    Nederländerna längs Hudsonfloden. [Henry Hudson hade utforskat floden
    1609](#hudson-soker-nordvastpassagen) på uppdrag av holländarna, och
    handelsplatsen grundades på södra spetsen av Manhattan 1624–25.

    1626 ”köpte” koloniledaren Peter Minuit ön Manhattan av lenapefolket
    för varor värda 60 gulden – enligt en populär men osäker omräkning
    ungefär 24 dollar. Ursprungsbefolkningen såg troligen affären som en
    rätt att använda marken, inte en försäljning. Samme Minuit ledde
    senare Sveriges koloni [Nya Sverige](#nya-sverige-1638) (1638).

    Staden var liten – några hundra invånare på 1620-talet, kring 1 500 på
    1660-talet – men ovanligt blandad: det talades kanske ett tiotal
    språk, och holländsk tolerans gjorde den till en handelsstad mer än en
    religiös koloni. Wall Street har fått sitt namn efter en försvarsmur,
    och Brooklyn och Harlem är holländska ortnamn. 1664 tog engelsmännen
    över och döpte om staden till New York ([se
    1660-talet](#nya-amsterdam-blir-new-york-1664)).

boston-1630:
  period: 1620
  label: "Boston 1630"
  title: "Boston grundas 1630"
  wiki:
    - "sv:Boston"
    - "en:Massachusetts Bay Colony"
  text: |
    1630 anlände en flotta på elva skepp med omkring 700 **puritaner**
    (strängt protestantiska engelsmän) under ledning av advokaten John
    Winthrop. De grundade **Massachusetts Bay-kolonin** och staden Boston.
    Winthrop talade om att bygga ”en stad på ett berg” – ett föredöme för
    världen – ett uttryck som amerikanska presidenter än idag citerar.

    Det var inledningen på **den stora utvandringen**: fram till 1640 kom
    uppskattningsvis 20 000 engelsmän till New England, mest hela
    familjer. De flydde förföljelse under [kung Karl I](#karl-i), vars
    kyrkopolitik puritanerna hatade (konflikten slutade i inbördeskriget
    1642, [se 1640-talet](#inbordeskriget-1642)).

    Kolonin var religiöst styrd och ofördragsam mot avvikare; oliktänkande
    drevs ut och grundade Rhode Island. Men satsningen på läskunnighet var
    stor: Harvard grundades redan 1636 och den första tryckpressen i de
    engelska kolonierna kom 1638–39. Boston blev senare centrum för
    upproret mot Storbritannien ([Boston Tea Party
    1773](#boston-tea-party-1773)).

irokeskrigen-baverkrigen:
  period: 1640
  label: "Irokeskrigen (bäverkrigen)"
  title: "Irokeskrigen (bäverkrigen)"
  wiki:
    - "en:Beaver Wars"
    - "en:Iroquois"
  text: |
    **Irokesförbundet** (Haudenosaunee) var en allians av fem, senare sex,
    folk i nuvarande delstaten New York söder om Ontariosjön. Förbundet
    hade gemensamma råd och regler för att lösa konflikter, och nämns
    ibland som en inspiration för senare federala idéer.

    På 1600-talet var bäverskinn högsta mode i Europa: av bäverfilt
    gjordes hattar. Européerna bytte till sig skinn mot metallvaror, tyg
    och vapen. Holländarna i [Nya Amsterdam](#nya-amsterdam-1626) och Fort
    Orange (Albany) handlade med irokeserna, fransmännen i
    [Québec](#quebec-1608) med huroner och andra folk norrut. När bävern
    var utfångad i irokesernas eget område började de, beväpnade med
    holländska musköter, angripa grannarna för att ta över jaktmarker och
    handelsvägar.

    Krigen pågick ungefär 1640–1701. 1649 krossade irokeserna huronerna,
    som redan halverats av smittkoppor och andra europeiska sjukdomar –
    från uppskattningsvis 20 000–30 000 personer till ett fåtal tusen.
    Hela regioner kring de stora sjöarna avfolkades. Krigen slutade med
    den stora freden i Montréal 1701. Konflikten var en del av den kamp
    mellan Frankrike och England om Nordamerika som [avgjordes
    1763](#parisfreden-1763-kanada-forloras).

nya-amsterdam-blir-new-york-1664:
  period: 1660
  label: "Nya Amsterdam blir New York 1664"
  title: "Nya Amsterdam blir New York 1664"
  wiki:
    - "sv:New York"
    - "sv:Nya Amsterdam"
  text: |
    **Nya Amsterdam** på Manhattan var huvudstaden i den nederländska
    kolonin Nya Nederländerna ([se 1626](#nya-amsterdam-1626)). Den låg
    mellan engelska kolonier i både norr (New England) och söder
    (Virginia, Maryland), och England betraktade området som sitt. England
    och Nederländerna var de stora rivalerna om världshandeln.

    Kung Karl II gav 1664 hela området till sin bror Jakob, **hertigen av
    York**. I augusti 1664 kom fyra engelska krigsfartyg med cirka 450
    soldater till hamnen. Den holländske guvernören Peter Stuyvesant ville
    strida, men invånarna – omkring 1 500 personer – vägrade, och staden
    gavs upp utan strid. Den döptes om till **New York** efter hertigen.
    Detta bidrog till andra engelsk-nederländska kriget (1665–67).

    Vid freden i Breda 1667 behöll England New York, medan Nederländerna
    behöll Surinam i Sydamerika med dess sockerplantager – då ansett som
    ett bättre byte. Holländarna återtog staden kort 1673–74. Holländska
    spår lever kvar i namn som Brooklyn, Harlem, Wall Street och Broadway.
    Idag har New York-regionen omkring 20 miljoner invånare.

    Se även [Nya Sverige 1638](#nya-sverige-1638), som holländarna
    tidigare tagit över.

king-philip-s-war-1675:
  period: 1660
  label: "King Philip's War 1675"
  title: "King Philip's War 1675–1676"
  wiki:
    - "en:King Philip's War"
    - "en:Metacomet"
  text: |
    **King Philip's War** var ett krig i New England (nordöstra USA)
    mellan engelska kolonister och en allians av ursprungsfolk. Ledaren på
    indiansk sida var **Metacom**, hövding för wampanoag-folket, som
    engelsmännen kallade King Philip. Wampanoag var samma folk som hjälpt
    [pilgrimerna i Plymouth](#mayflower-1620) att överleva på 1620-talet.

    Orsaken var att kolonisterna stadigt tog mer mark och krävde att
    ursprungsfolken skulle underordna sig engelsk lag. Kriget varade drygt
    ett år. Uppskattningsvis dog runt 600–800 kolonister och flera tusen
    ur ursprungsbefolkningen; många fler [såldes som slavar till
    Karibien](#sockerplantager-och-slaveri-i-karibien). Ett tiotal
    kolonistsamhällen brändes ner helt.

    Räknat per invånare räknas det som ett av de blodigaste krigen i
    nordamerikansk historia. Efteråt var ursprungsfolkens självständiga
    makt i södra New England i praktiken bruten, och kolonierna kunde
    expandera fritt. Mönstret – expansion, krig, fördrivning – upprepades
    sedan västerut i 200 år, ända till 1800-talets indiankrig.

pennsylvania-1681:
  period: 1680
  label: "Pennsylvania 1681"
  title: "Pennsylvania grundas 1681"
  wiki:
    - "sv:Pennsylvania"
    - "sv:William Penn"
  text: |
    1681 fick kväkaren **William Penn** ett stort landområde i Nordamerika
    av den engelske kungen Karl II, som betalning för en skuld till Penns
    far. Kväkarna var en radikal protestantisk rörelse som förkastade
    präster, eder och krig, och som därför förföljdes i England.

    Penn gjorde kolonin till ett "heligt experiment": religionsfrihet för
    alla som trodde på Gud, en vald församling och försök till rättvisa
    avtal med ursprungsfolket lenape. Huvudstaden Philadelphia
    ("broderskärlek" på grekiska) planerades i rutnät. Kolonin lockade
    engelska, walesiska, tyska och holländska invandrare.

    Pennsylvania växte snabbt och Philadelphia blev omkring 1770 den
    största staden i de brittiska kolonierna, med runt 30 000 invånare.
    Där skrevs [självständighetsförklaringen
    1776](#sjalvstandighetsforklaringen-1776) och [USA:s författning
    1787](#usa-s-konstitution-1787). Penns religionsfrihet blev en
    förebild för den amerikanska modellen med skild kyrka och stat.

    Jämför med puritanernas koloni i [Boston 1630](#boston-1630).

salem-1692:
  period: 1680
  label: "Salem 1692"
  title: "Häxprocesserna i Salem 1692"
  wiki:
    - "sv:Häxprocesserna i Salem"
  text: |
    I byn Salem i Massachusetts, [en puritansk koloni i New
    England](#boston-1630), började några flickor 1692 få anfall som
    tolkades som häxeri. Puritanerna var stränga protestanter som tog
    djävulens existens bokstavligt.

    Anklagelserna spreds snabbt; över 200 personer anklagades. 19 personer
    hängdes, en man pressades till döds under stenar och några dog i
    fängelset. Domstolen godtog så kallat spektralbevis – att vittnen sa
    sig se den anklagades ande i drömmar och syner. Efter ungefär ett år
    avbröts processerna, och flera domare och vittnen bad senare
    offentligt om ursäkt.

    Jämfört med [Europa](#haxprocesser) var Salem litet: där avrättades
    uppskattningsvis 40 000–60 000 personer för häxeri 1450–1750, och i
    Sverige omkring 300 under det stora oväsendet 1668–1676. Salem har
    blivit en symbol för masshysteri, bland annat i Arthur Millers pjäs
    *Häxjakten* (1953), skriven som kommentar till McCarthy-erans
    kommunistjakt.

new-orleans-1718:
  period: 1700
  label: "New Orleans 1718"
  title: "New Orleans grundas 1718"
  wiki:
    - "sv:New Orleans"
  text: |
    Frankrike gjorde anspråk på hela Mississippiflodens avrinningsområde i
    Nordamerika och kallade det **Louisiana** efter [Ludvig
    XIV](#ludvig-xiv-1643). 1718 grundade **Jean-Baptiste Le Moyne de
    Bienville** staden La Nouvelle-Orléans nära flodens mynning, uppkallad
    efter hertigen av Orléans, Frankrikes regent.

    Kolonin drevs av John Laws Mississippikompani (se
    [Mississippi-bubblan](#mississippi-bubblan)), som lockade nybyggare
    med överdriven reklam. Läget var ett träsk med översvämningar, orkaner
    och sjukdomar. Från 1719 kom stora skeppslaster förslavade afrikaner.
    1722 blev staden huvudort i Louisiana.

    Frankrike lämnade Louisiana till Spanien 1762, fick tillbaka det 1800
    och sålde det 1803 till USA i [Louisianaköpet](#louisianakopet-1803),
    vilket fördubblade USA:s yta. New Orleans blev USA:s viktigaste hamn
    för bomull och slavhandel inom landet, och födelseplats för jazzen
    omkring 1900. Läget under havsytan visade sig farligt när orkanen
    Katrina 2005 dränkte stora delar av staden.

brittiska-kolonier-vaxer:
  period: 1720
  label: "Brittiska kolonier växer"
  title: "De brittiska kolonierna i Nordamerika växer"
  wiki:
    - "sv:De tretton kolonierna"
  text: |
    Längs Nordamerikas östkust låg kring 1720 ett tolvtal brittiska
    kolonier (Georgia, den trettonde, grundades 1732): från New England i
    norr, med fiske, handel och skeppsbyggnad, via
    [Pennsylvania](#pennsylvania-1681) och New York till Virginia och
    Carolina i söder, med plantager för tobak och ris som drevs av
    [förslavade afrikaner](#slavhandel).

    Befolkningen växte mycket snabbt: från uppskattningsvis 250 000 år
    1700 till omkring 1,2 miljoner 1750 och 2,5 miljoner 1775. Det berodde
    på höga födelsetal, gott om mark och stor invandring från England,
    Skottland, Irland och Tyskland, plus slavimport. Som jämförelse hade
    Nya Frankrike (Kanada och Louisiana) bara några tiotusentals
    invånare 1750.

    Kolonierna styrde sig i hög grad själva med egna valda församlingar,
    medan Storbritannien mest reglerade handeln. Denna självständighet och
    den växande befolkningen ledde till konflikter, först med Frankrike i
    [sjuårskriget 1756–1763](#sjuarskriget-slut-1763), sedan med
    Storbritannien om skatter, vilket mynnade ut i [amerikanska
    revolutionen 1775–1783](#amerikanska-kolonier-forlorade-1783).

franska-och-indiankriget-1754:
  period: 1740
  label: "Franska och indiankriget 1754"
  title: "Fransk-indianska kriget 1754–1763"
  wiki:
    - "sv:Fransk-indianska kriget"
    - "sv:Sjuårskriget"
  text: |
    Fransk-indianska kriget var den nordamerikanska delen av
    [sjuårskriget](#sjuarskriget-slut-1763) mellan Storbritannien och
    Frankrike. Namnet kommer från de brittiska kolonisternas perspektiv:
    de slogs mot fransmännen och deras allierade bland ursprungsfolken.
    Det handlade om vem som skulle kontrollera Ohiodalen väster om
    Appalacherna.

    Kriget började 1754 när en 22-årig milisofficer, **George
    Washington**, drabbade samman med franska trupper och tvingades
    kapitulera vid Fort Necessity. Styrkeförhållandet var ojämnt: de
    brittiska kolonierna hade ungefär 1,5 miljoner invånare, Nya Frankrike
    (Kanada och Mississippidalen) bara runt 60 000–70 000 européer.
    Avgörandet kom 1759 när britterna intog Québec efter slaget på
    Abrahams slätter.

    Varför det spelar roll: Frankrike förlorade Kanada i [Parisfreden
    1763](#parisfreden-1763-kanada-forloras). Men kriget kostade
    Storbritannien enormt. För att betala skulden försökte London beskatta
    kolonierna – stämpelskatten 1765, teskatten 1773 – vilket ledde till
    [Boston Tea Party](#boston-tea-party-1773) och den [amerikanska
    revolutionen 1776](#sjalvstandighetsforklaringen-1776). Washington,
    som lärt sig krigets hantverk här, blev revolutionens general.

boston-tea-party-1773:
  period: 1760
  label: "Boston Tea Party 1773"
  title: "Boston Tea Party 1773"
  wiki:
    - "sv:Boston Tea Party"
  text: |
    Efter [sjuårskriget](#sjuarskriget-slut-1763) hade Storbritannien en
    enorm statsskuld och ville att de 13 nordamerikanska kolonierna skulle
    bidra. Men kolonisterna hade ingen representation i parlamentet i
    London och protesterade med slagordet *”No taxation without
    representation”* – ingen beskattning utan representation. De flesta
    skatterna drogs tillbaka, men en symbolisk skatt på te behölls.

    1773 gav parlamentet det skuldtyngda **[Ostindiska
    kompaniet](#ostindiska-kompaniet-1600)** rätt att sälja te direkt till
    kolonierna. Teet blev faktiskt billigare, men det slog ut lokala
    handlare och smugglare, och att köpa det betydde att godta skatten.
    Kvällen den 16 december 1773 bordade ett sextiotal män, lätt utklädda
    till mohawk-indianer, tre fartyg i Bostons hamn och dumpade 342
    tekistor i vattnet – omkring 40 ton te.

    London svarade med att stänga Bostons hamn och upphäva Massachusetts
    självstyre. Det enade kolonierna mot Storbritannien. Den första
    kontinentalkongressen samlades 1774, och i april 1775 bröt kriget ut
    vid Lexington och Concord – vägen mot [självständighetsförklaringen
    1776](#sjalvstandighetsforklaringen-1776).

sjalvstandighetsforklaringen-1776:
  period: 1760
  label: "självständighetsförklaringen 1776"
  title: "USA:s självständighetsförklaring 1776"
  wiki:
    - "sv:USA:s självständighetsförklaring"
    - "sv:Thomas Jefferson"
  text: |
    Kriget mellan de 13 brittiska kolonierna i Nordamerika och
    Storbritannien hade pågått i över ett år när kontinentalkongressen –
    kolonisternas gemensamma församling – den 4 juli 1776 antog
    självständighetsförklaringen. Den skrevs huvudsakligen av den 33-årige
    virginiske plantageägaren **Thomas Jefferson**, med redigering av
    bland andra [Benjamin
    Franklin](#franklin-blixten-ar-elektricitet-1752) och John Adams.

    Den mest kända meningen säger att ”alla människor är skapade jämlika”
    med rätt till ”liv, frihet och strävan efter lycka”, och att en
    regering som kränker dessa rättigheter får störtas. Idéerna kom från
    upplysningen, särskilt filosofen John Locke. Motsägelsen var tydlig
    redan då: Jefferson ägde över 600 slavar under sitt liv, och omkring
    en femtedel av koloniernas cirka 2,5 miljoner invånare var förslavade.

    Förklaringen vann inte kriget – [det tog till
    1783](#amerikanska-kolonier-forlorade-1783) och krävde fransk hjälp.
    Men den blev en mall. [Franska revolutionens deklaration om människans
    rättigheter 1789](#franska-revolutionen-1789), [Haitis självständighet
    1804](#haiti-fritt-1804) och många senare befrielserörelser lånade
    dess språk.

usa-s-konstitution-1787:
  period: 1780
  label: "USA:s konstitution 1787"
  title: "USA:s konstitution 1787"
  wiki:
    - "sv:USA:s konstitution"
    - "sv:James Madison"
  text: |
    [Efter självständigheten](#sjalvstandighetsforklaringen-1776) styrdes
    USA av **konföderationsartiklarna**, ett löst förbund där
    centralmakten inte kunde ta ut skatt eller ha egen armé. Det fungerade
    dåligt: staterna tullade varandra och ett bondeuppror i Massachusetts
    1786 (Shays uppror) visade hur svag staten var.

    Sommaren 1787 möttes 55 delegater i Philadelphia under ledning av
    [George Washington](#washington-president). I stället för att justera
    artiklarna skrev de en helt ny konstitution, med **James Madison** som
    huvudarkitekt. Den bygger på maktdelning: en president
    (verkställande), en kongress i två kamrar (lagstiftande) och en högsta
    domstol, som balanserar varandra. Kompromissen mellan stora och små
    stater gav representanthuset (efter folkmängd) och senaten (två per
    stat). Den ökända tre femtedels-kompromissen räknade varje slav som
    tre femtedels person vid fördelningen av mandat.

    Konstitutionen trädde i kraft 1789 och kompletterades 1791 med de tio
    första tilläggen, rättighetsförklaringen (*[Bill of
    Rights](#bill-of-rights)*). Med 27 tillägg är den världens äldsta
    fortfarande gällande skrivna nationella konstitution – jämför Sveriges
    nuvarande regeringsform från 1974.

washington-president:
  period: 1780
  label: "Washington president"
  title: "George Washington blir president 1789"
  wiki:
    - "sv:George Washington"
  text: |
    **George Washington** (1732–1799) var en plantageägare från Virginia
    som stridit i [fransk-indianska
    kriget](#franska-och-indiankriget-1754) och sedan blev överbefälhavare
    för den kontinentala armén i det [amerikanska frihetskriget
    1775–1783](#amerikanska-kolonier-forlorade-1783). Hans armé förlorade
    fler slag än den vann, men han höll den samman under svåra vintrar och
    vann till slut vid Yorktown 1781.

    Det som gjorde honom unik var att han lämnade makten frivilligt. 1783
    avsade han sig sitt befäl och åkte hem, i stället för att, som många
    fruktade, göra sig till diktator. När han 1789 enhälligt valdes till
    USA:s förste president enligt [den nya
    konstitutionen](#usa-s-konstitution-1787) var det just för att alla
    litade på honom. Han satt två mandatperioder, till 1797, och avböjde
    en tredje – en praxis som höll till Franklin Roosevelt och som skrevs
    in i grundlagen 1951.

    Han höll USA neutralt i krigen mellan Storbritannien och
    [revolutionens Frankrike](#franska-revolutionen-1789) och varnade i
    sitt avskedstal för partier och utländska allianser. Han ägde också
    hundratals slavar, som frigavs först efter hans och hustruns död.
    Huvudstaden Washington, D.C. bär hans namn.

louisianakopet-1803:
  period: 1800
  label: "Louisianaköpet 1803"
  title: "Louisianaköpet 1803"
  wiki:
    - "sv:Louisianaköpet"
  text: |
    År 1803 köpte USA under president **Thomas Jefferson** det franska
    Louisiana-territoriet av Napoleon för 15 miljoner dollar – ungefär 3
    cent per acre (ca 7 dollar per kvadratkilometer). Territoriet
    omfattade drygt 2 miljoner km², i princip hela Mississippiflodens
    västra avrinningsområde, och fördubblade ungefär USA:s yta. Som
    jämförelse är Sverige 450 000 km².

    Frankrike hade fått tillbaka området från Spanien 1800. Napoleon sålde
    för att han behövde pengar inför kriget mot Storbritannien och hade
    gett upp planerna på ett amerikanskt imperium efter att hans armé
    misslyckats med att återta Haiti (se [Haiti fritt
    1804](#haiti-fritt-1804)).

    Köpet gav USA kontroll över hamnen i New Orleans och Mississippi, den
    viktigaste transportleden för bönderna väster om Appalacherna. Det
    öppnade för expansionen västerut (se [Lewis & Clark](#lewis-clark)),
    men också för den bittra frågan om nya delstater skulle tillåta
    slaveri, som till slut ledde till [inbördeskriget
    1861](#inbordeskriget-186165).

lewis-clark:
  period: 1800
  label: "Lewis & Clark"
  title: "Lewis och Clarks expedition 1804–1806"
  wiki:
    - "sv:Lewis och Clarks expedition"
  text: |
    Efter [Louisianaköpet 1803](#louisianakopet-1803) skickade president
    Jefferson armékaptenerna **Meriwether Lewis** och **William Clark**
    att utforska det nyköpta, för amerikanerna i stort sett okända,
    området och hitta en vattenväg till Stilla havet.

    Expeditionen, ett trettiotal man, startade från St. Louis i maj 1804,
    tog sig uppför Missourifloden, över Klippiga bergen och nedför
    Columbiafloden till Stillahavskusten, som nåddes i november 1805. Hela
    resan tog drygt två år och täckte uppskattningsvis 13 000 km tur och
    retur. Endast en deltagare dog, troligen av blindtarmsinflammation.
    Den shoshone-kvinnan **Sacagawea** var med som tolk och vägvisare.

    Någon sammanhängande vattenväg fanns inte – bergen var en mycket
    större barriär än man trott. Men expeditionen kartlade terrängen,
    beskrev hundratals nya växt- och djurarter och etablerade kontakter
    med ett femtiotal ursprungsfolk. Den stärkte USA:s anspråk på
    Oregonområdet och blev en symbol för den västerutriktade expansionen
    som tog sin fart med [guldruschen 1849](#guldrusch-1849) och
    [järnvägen till Stilla havet 1869](#transkontinental-jarnvag-1869).

kriget-1812:
  period: 1800
  label: "1812-kriget"
  title: "1812 års krig 1812–1815"
  wiki:
    - "sv:1812 års krig"
  text: |
    **1812 års krig** utkämpades mellan USA och Storbritannien (med
    brittiska Kanada). Orsakerna var att britterna, mitt i kriget mot
    Napoleon, stoppade amerikanska handelsfartyg och tvångsrekryterade
    sjömän ur dem, samt att britterna stödde ursprungsfolk som gjorde
    motstånd mot den amerikanska expansionen västerut. Många amerikaner
    hoppades också kunna erövra Kanada.

    Invasionerna av Kanada misslyckades. 1814 brände brittiska trupper
    Washington, inklusive Vita huset och kongressbyggnaden. Ungefär 15
    000–20 000 dog totalt, de flesta av sjukdom – litet jämfört med
    Napoleonkrigen i Europa samtidigt, där hundratusentals dog per år.
    Freden i Gent i december 1814 återställde i stort sett läget före
    kriget. Det mest berömda slaget, vid New Orleans i januari 1815,
    utkämpades efter fredsslutet eftersom nyheten ännu inte nått fram –
    ett exempel på hur långsam kommunikation var före
    [telegrafen](#telegrafen-morse-1837).

    Följderna: Kanada förblev brittiskt och fick en egen identitet,
    ursprungsfolkens motstånd i Mellanvästern bröts, och USA och
    Storbritannien har inte krigat mot varandra sedan dess. Segern vid New
    Orleans gjorde generalen **Andrew Jackson** till nationalhjälte och
    senare president (se [Indian Removal Act
    1830](#indian-removal-act-1830)).

monroedoktrinen-1823:
  period: 1820
  label: "Monroedoktrinen 1823"
  title: "Monroedoktrinen 1823"
  wiki:
    - "sv:Monroedoktrinen"
  text: |
    År 1823 förklarade USA:s president **James Monroe** i sitt årliga tal
    till kongressen att den amerikanska kontinenten inte längre var öppen
    för ny europeisk kolonisation, och att USA skulle betrakta europeisk
    inblandning i de amerikanska staternas angelägenheter som en fientlig
    handling. I gengäld lovade USA att inte blanda sig i europeiska
    konflikter.

    Bakgrunden var att de spanska kolonierna i Latinamerika just blivit
    självständiga (se [Mexiko, Brasilien, Peru
    fria](#mexiko-brasilien-peru-fria)), och man fruktade att de
    konservativa europeiska monarkierna skulle hjälpa Spanien att återta
    dem. Även Rysslands anspråk på Stillahavskusten norr om Kalifornien
    oroade.

    USA hade 1823 en liten armé och flotta och kunde inte själv
    upprätthålla doktrinen; i praktiken var det den brittiska flottan som
    höll andra européer borta, eftersom Storbritannien ville handla fritt
    med de nya staterna. Men doktrinen blev en hörnsten i amerikansk
    utrikespolitik. Runt 1900 tolkades den om till en rätt för USA att
    själv ingripa militärt i Latinamerika, vilket skedde många gånger
    under 1900-talet (t.ex. i Nicaragua, Haiti och Guatemala).

indian-removal-act-1830:
  period: 1820
  label: "Indian Removal Act 1830"
  title: "Indian Removal Act 1830 och Tårarnas väg"
  wiki:
    - "en:Indian Removal Act"
    - "sv:Tårarnas väg"
  text: |
    **Indian Removal Act** var en lag som USA:s kongress antog 1830 på
    initiativ av president **Andrew Jackson**, krigshjälte från
    [1812-kriget](#kriget-1812). Den gav presidenten rätt att förhandla
    fram avtal där ursprungsfolk i sydöstra USA lämnade sina landområden i
    utbyte mot mark väster om Mississippi, i nuvarande Oklahoma.

    Det gällde främst de så kallade ”fem civiliserade nationerna” –
    cherokee, muskogee (creek), seminole, chickasaw och choctaw – som hade
    bofasta jordbrukssamhällen, egna författningar och, i cherokeernas
    fall, ett eget skriftspråk och en tidning. Vita bosättare ville åt
    jorden för bomullsodling, och guldfynd i Georgia 1828 ökade trycket.
    Trots att högsta domstolen 1832 gav cherokeerna rätt struntade Jackson
    i domen.

    Uppskattningsvis 60 000 människor tvångsförflyttades under 1830-talet.
    Cherokeernas marsch 1838–1839, ca 1 900 km till fots under vintern,
    kallas **Tårarnas väg** (Trail of Tears); uppskattningsvis 4 000 av
    omkring 16 000 dog. Marken de lämnade blev en del av det
    bomullsodlande slavsamhället i Södern.

mexikanska-kriget-1846:
  period: 1840
  label: "Mexikanska kriget 1846"
  title: "Mexikanska kriget 1846–1848"
  wiki:
    - "sv:Mexikansk-amerikanska kriget"
  text: |
    Texas hade varit en del av Mexiko men bröt sig loss 1836 efter ett
    uppror lett av amerikanska nybyggare, som bland annat ville behålla
    slaveriet som Mexiko avskaffat. USA tog in Texas som delstat 1845.
    Mexiko erkände inte detta, och gränsen var omtvistad. President
    **James K. Polk** trodde på ”Manifest Destiny” – idén att USA var
    förutbestämt att sträcka sig från Atlanten till Stilla havet – och
    ville åt Kalifornien.

    Efter en gränsincident 1846 förklarade USA krig. Amerikanska arméer
    tog Kalifornien och New Mexico och landsteg 1847 vid Veracruz och
    marscherade mot Mexico City, som intogs i september 1847.
    Uppskattningsvis 13 000 amerikaner dog (de flesta av sjukdom) och
    omkring 25 000 mexikaner.

    Genom fredsavtalet i **Guadalupe Hidalgo** 1848 avträdde Mexiko
    ungefär 55 % av sitt territorium – nuvarande Kalifornien, Nevada,
    Utah, större delen av Arizona och New Mexico, med mera, omkring 1,4
    miljoner km² – mot 15 miljoner dollar. Bara veckor tidigare hade guld
    hittats i Kalifornien (se [guldrusch 1849](#guldrusch-1849)). Frågan
    om slaveri skulle tillåtas i de nya områdena skärpte konflikten mellan
    Nord och Syd fram till [inbördeskriget 1861](#inbordeskriget-186165).

guldrusch-1849:
  period: 1840
  label: "guldrusch 1849"
  title: "Guldruschen i Kalifornien 1848–1855"
  wiki:
    - "sv:Guldruschen i Kalifornien"
  text: |
    I januari 1848 hittade snickaren James Marshall guldkorn vid en såg
    som han byggde vid Sutter's Mill i Kaliforniens inland, just när
    området [övergick från Mexiko till USA](#mexikanska-kriget-1846).
    Nyheten spreds långsamt – före [telegrafen](#telegraf) – men 1849 kom
    den stora vågen: de som kom kallades **”forty-niners”**.

    Uppskattningsvis 300 000 människor strömmade till Kalifornien från
    USA:s östkust, Latinamerika, Europa, Kina och Australien. Resan från
    östkusten tog månader: sex månader med fartyg runt Kap Horn, kortare
    via Panamanäset, eller fem–sex månader med vagn över kontinenten. San
    Francisco växte från omkring 1 000 invånare 1848 till uppskattningsvis
    25 000 år 1849. Guld för hundratals miljoner dollar bröts under
    1850-talet. De som tjänade mest var ofta handlarna – t.ex. Levi
    Strauss, som sålde arbetsbyxor.

    Kalifornien blev delstat redan 1850. För Kaliforniens
    ursprungsbefolkning blev ruschen en katastrof: av uppskattningsvis 150
    000 människor 1848 återstod omkring 30 000 år 1870, efter sjukdomar,
    svält och avsiktliga massakrer. Ruschen gav idén till liknande
    [guldruscher i Australien 1851](#guldrusch-1851), Klondike 1896 och
    Sydafrika 1886.

inbordeskriget-186165:
  period: 1860
  label: "Inbördeskriget 1861–65"
  title: "Amerikanska inbördeskriget 1861–1865"
  wiki:
    - "sv:Amerikanska inbördeskriget"
    - "sv:Abraham Lincoln"
  text: |
    När **Abraham Lincoln**, vars republikanska parti ville stoppa
    slaveriets spridning till nya delstater, valdes till president 1860
    bröt sig elva sydstater ut och bildade **Amerikas konfedererade
    stater**. Kärnfrågan var slaveriet: ca 4 miljoner slavar fanns i
    södern, ungefär en tredjedel av sydstaternas befolkning.

    Kriget mellan Nordstaterna (Unionen) och Sydstaterna varade fyra år.
    Nordstaterna hade ca 22 miljoner invånare och det mesta av industrin
    och järnvägarna, södern ca 9 miljoner. Uppskattningsvis 620 000–750
    000 soldater dog – ungefär lika många som i alla USA:s övriga krig
    tillsammans. Avgörande slag var **Gettysburg** 1863. Kriget var tidigt
    ”industriellt”: järnväg, telegraf, räfflade gevär och pansarfartyg.

    Nordstaterna vann; slaveriet avskaffades (se ”[slaveriet
    avskaffas](#slaveriet-avskaffas)”) och Lincoln mördades fem dagar
    efter sydstatsarméns kapitulation 1865. USA:s enhet säkrades, och
    landet blev efteråt en industriell jätte.

slaveriet-avskaffas:
  period: 1860
  label: "slaveriet avskaffas"
  title: "Slaveriet avskaffas i USA 1865"
  wiki:
    - "en:Thirteenth Amendment to the United States Constitution"
    - "en:Reconstruction era"
  text: |
    [Under inbördeskriget](#inbordeskriget-186165) utfärdade president
    Lincoln 1863 **emancipationsproklamationen**, som förklarade slavarna
    i de upproriska sydstaterna fria. Den gällde i praktiken bara där
    nordstatsarmén tog sig fram. Det slutgiltiga avskaffandet kom genom
    **13:e tillägget** till USA:s konstitution, som trädde i kraft i
    december 1865 och förbjöd slaveri i hela landet. Omkring 4 miljoner
    människor blev fria.

    Under **rekonstruktionen** (1865–1877), när nordstatstrupper
    ockuperade södern, fick svarta män rösträtt och flera valdes till
    kongressen. Men när trupperna drogs tillbaka infördes de så kallade
    **Jim Crow-lagarna** – raslagar som skilde svarta och vita åt och i
    praktiken tog bort svartas rösträtt – och lynchningar användes som
    terror.

    Det dröjde till [medborgarrättsrörelsen](#medborgarrattsrorelsen) och
    lagarna 1964–65 innan lika rättigheter garanterades. Jämför:
    [Storbritannien avskaffade slaveriet i sina kolonier
    1833](#slaveriet-avskaffas-1833), Sverige på Saint-Barthélemy 1847,
    och [Brasilien sist i Amerika
    1888](#brasilien-avskaffar-slaveriet-1888).

transkontinental-jarnvag-1869:
  period: 1860
  label: "transkontinental järnväg 1869"
  title: "Första transkontinentala järnvägen 1869"
  wiki:
    - "sv:Första transkontinentala järnvägen"
    - "en:First transcontinental railroad"
  text: |
    Den 10 maj 1869 slogs en symbolisk spik av guld in vid Promontory
    Summit i Utah, där två järnvägsbolags spår möttes. Därmed förbands
    USA:s östra järnvägsnät med Kalifornien vid Stilla havet. Den nybyggda
    sträckan från Omaha till Sacramento var ca 2 800 km.

    Bygget, som påbörjats 1863 mitt under
    [inbördeskriget](#inbordeskriget-186165), utfördes till stor del av
    irländska invandrare från öst och av uppskattningsvis 10 000–15 000
    **kinesiska arbetare** från väst, som sprängde sig genom Sierra Nevada
    under farliga förhållanden. Staten betalade bolagen med mark och lån.

    Resan över kontinenten krympte från 4–6 månader med vagn eller båt
    till ungefär en vecka. Järnvägen öppnade väst för bosättare,
    boskapsindustri och handel – men förstörde bisonhjordarna och
    ursprungsfolkens livsgrund (se ”[Wounded Knee
    1890](#wounded-knee-1890)”). Samma år öppnade
    [Suezkanalen](#suezkanalen-1869); 1869 var ett år då världen krympte
    märkbart.

edisons-glodlampa:
  period: 1880
  label: "Edisons glödlampa"
  title: "Edisons glödlampa 1879–1882"
  wiki:
    - "sv:Glödlampa"
    - "sv:Thomas Edison"
    - "en:War of the currents"
  text: |
    Elektriskt ljus fanns redan som båglampor, men de var för starka och
    farliga för hem. Flera uppfinnare arbetade med **glödlampan**, där en
    tunn tråd glöder när ström går igenom den i ett vakuumrör – britten
    Joseph Swan var först med en fungerande lampa. Amerikanen **Thomas
    Edison** och hans forskningslaboratorium i Menlo Park lyckades 1879 få
    en lampa med kolfibertråd att lysa i över 13 timmar, och senare över 1
    000 timmar med förkolnad bambu.

    Edisons viktigaste bidrag var hela systemet: generatorer, kablar,
    elmätare, säkringar och lampor. 1882 startade han [kraftstationen på
    Pearl Street](#edisons-kraftstation-1882) i New York, som försörjde
    några hundra kunder. Hans likström (DC) förlorade sedan det s.k.
    ”[strömkriget](#stromkriget-tesla-och-vaxelstrom)” mot växelström (AC)
    från Westinghouse och Nikola Tesla, som kunde transporteras längre
    sträckor.

    Elektrifieringen förvandlade fabriker, städer och vardagsliv under
    1900-talet. Edisons labb, med ca 1 000 patent, var också en
    föregångare till dagens industriella forskningsavdelningar.

wounded-knee-1890:
  period: 1880
  label: "Wounded Knee 1890"
  title: "Massakern vid Wounded Knee 1890"
  wiki:
    - "sv:Massakern vid Wounded Knee"
    - "en:Ghost Dance"
  text: |
    Under 1800-talet trängdes Nordamerikas ursprungsfolk undan av den vita
    bosättningen västerut. Bisonhjordarna, som slättindianerna levde av,
    minskade från uppskattningsvis 30–60 miljoner djur till under 1 000
    kring 1889, mycket genom kommersiell jakt. Lakota-sioux och andra folk
    tvingades in i **reservat** – avgränsade områden där de var beroende
    av statliga ransoner.

    1889–90 spreds en religiös rörelse, **andedansen**, som lovade att de
    vita skulle försvinna och bisonen komma tillbaka. Myndigheterna såg
    den som upprorisk. Den 29 december 1890, vid bäcken Wounded Knee i
    South Dakota, skulle amerikanska kavalleriet avväpna en grupp lakota.
    Ett skott gick av och soldaterna öppnade eld med gevär och
    snabbskjutande kanoner. Mellan ca 150 och 300 lakota dödades, många
    kvinnor och barn; ca 25 soldater dog.

    Wounded Knee brukar ses som slutet på indiankrigen. Samma år
    förklarade USA:s folkräkning att ”gränsen” mot obebyggd mark var
    stängd.

    Se även [transkontinental järnväg
    1869](#transkontinental-jarnvag-1869).

broderna-wright-1903:
  period: 1900
  label: "Bröderna Wright 1903"
  title: "Bröderna Wright flyger 1903"
  wiki:
    - "sv:Bröderna Wright"
    - "en:Wright Flyer"
  text: |
    **Orville och Wilbur Wright** var två cykelhandlare från Dayton, Ohio.
    Den 17 december 1903 vid Kitty Hawk i North Carolina gjorde de den
    första kontrollerade, motordrivna flygningen med ett flygplan tyngre
    än luft. Den första turen varade 12 sekunder och gick 37 meter –
    kortare än vingspannet på en modern Boeing 747. Dagens längsta
    flygning samma dag nådde 260 meter på 59 sekunder.

    Deras genombrott var inte motorn utan styrningen: genom att vrida
    vingarna (”vingvridning”) kunde de kontrollera rollen, alltså att luta
    planet i sidled. De byggde också en egen vindtunnel och mätte
    vingprofiler systematiskt, ett tidigt exempel på ingenjörsmässig
    datainsamling.

    Utvecklingen gick sedan snabbt. 1909 flög Louis Blériot över Engelska
    kanalen, under [första världskriget](#forsta-varldskriget) användes
    tusentals flygplan, 1927 flög [Lindbergh över
    Atlanten](#lindbergh-over-atlanten-1927) (se 1920-talet) och 1969 –
    bara 66 år efter Kitty Hawk – [landade människor på
    månen](#manlandningen-1969).

ford-t-1908:
  period: 1900
  label: "Ford T 1908"
  title: "Ford T 1908"
  wiki:
    - "sv:Ford Model T"
    - "sv:Henry Ford"
  text: |
    Ford T, även kallad ”Tin Lizzie”, var en bil som **Henry Ford**
    lanserade 1908. Före den var bilar leksaker för de rika. Ford ville
    bygga en enkel, robust bil som vanliga arbetare kunde köpa.

    Nyckeln var det rörliga [löpande bandet](#lopande-bandet-1913), infört
    1913: i stället för att arbetarna gick till bilen rullade bilen förbi
    arbetarna, som var och en gjorde ett enda moment. Tillverkningstiden
    för ett chassi sjönk från cirka 12 timmar till omkring 1,5 timme.
    Priset sjönk från 850 dollar 1908 till ungefär 260 dollar på
    1920-talet. 1914 införde Ford också en lön på 5 dollar per dag,
    ungefär dubbelt mot branschen, så att arbetarna själva kunde köpa
    bilen.

    Fram till 1927 tillverkades drygt 15 miljoner Ford T, vid ett
    tillfälle ungefär hälften av alla bilar i världen. Massproduktion
    (”fordism”) blev modell för hela 1900-talets industri. Bilen formade
    städer, förorter, oljeberoendet och vägnätet – och därmed mycket av
    världen vi lever i idag.

borskraschen-1929:
  period: 1920
  label: "Börskraschen 1929"
  title: "Börskraschen 1929"
  wiki:
    - "sv:Wall Street-kraschen 1929"
  text: |
    Under 1920-talet steg aktiekurserna på New York-börsen (Wall Street)
    kraftigt: Dow Jones-index fyrdubblades 1924–29. Många köpte aktier på
    kredit, med bara 10–20 % egna pengar och resten lånat. Det fungerar så
    länge kurserna stiger.

    I oktober 1929 började kurserna falla. På ”svarta torsdagen” 24
    oktober och ”svarta tisdagen” 29 oktober såldes rekordmängder aktier i
    panik. Lånen krävdes in, vilket tvingade fram fler försäljningar.
    Fallet fortsatte i tre år: i juli 1932 hade Dow Jones sjunkit omkring
    89 % från toppen, och indexet återhämtade sig inte till 1929 års nivå
    förrän 1954.

    Kraschen orsakade inte ensam depressionen, men den utlöste den. När
    tusentals banker gick omkull försvann människors sparpengar, eftersom
    det inte fanns någon insättningsgaranti. Se
    [depressionen](#depressionen) och [New Deal](#new-deal). Jämför med
    IT-bubblan 2000 och [finanskrisen 2008](#finanskrisen-2008).

new-deal:
  period: 1920
  label: "New Deal"
  title: "New Deal"
  wiki:
    - "sv:New Deal"
    - "sv:Franklin D. Roosevelt"
  text: |
    New Deal var det reformprogram som USA:s president **Franklin D.
    Roosevelt** genomförde från 1933 för att [bekämpa
    depressionen](#depressionen). När han tillträdde var omkring 25 % av
    arbetskraften arbetslös och banksystemet höll på att kollapsa.

    Under de första hundra dagarna stängdes bankerna tillfälligt och
    granskades, och en statlig insättningsgaranti (FDIC) infördes. Staten
    startade stora offentliga arbeten: bl.a. anställdes miljontals i
    program som byggde vägar, skolor, broar och dammar, som Tennessee
    Valley Authority som förde ut elektricitet till landsbygden. Social
    Security Act 1935 skapade USA:s allmänna pension och
    arbetslöshetsförsäkring. Fackföreningar fick rätt att förhandla.

    Arbetslösheten sjönk men låg kvar runt 15 % 1940; den verkliga
    återhämtningen kom med upprustningen inför [andra
    världskriget](#andra-varldskriget). New Deal utökade den federala
    statens roll permanent och formade det politiska landskapet i
    decennier. Jämför med [folkhemmet](#folkhemmet-socialdemokrati) i
    Sverige och [Folkfronten](#folkfronten-1936) i Frankrike – och med hur
    Tyskland svarade på krisen.

manhattanprojektet:
  period: 1940
  label: "Manhattanprojektet"
  title: "Manhattanprojektet 1942–1946"
  wiki:
    - "sv:Manhattanprojektet"
    - "sv:J. Robert Oppenheimer"
  text: |
    Manhattanprojektet var USA:s hemliga program för att bygga atombomben,
    tillsammans med Storbritannien och Kanada. Bakgrunden: 1938 upptäckte
    tyskarna Otto Hahn och Fritz Strassmann att [urankärnor kan
    klyvas](#karnklyvning-1938), och Lise Meitner – då flykting i Sverige
    – förklarade fysiken. Klyvningen frigör energi och nya neutroner som
    kan klyva fler kärnor, en kedjereaktion. 1939 varnade Einstein
    president Roosevelt för att Nazityskland kunde bygga en bomb.

    Projektet leddes militärt av general Leslie Groves och vetenskapligt
    av fysikern **J. Robert Oppenheimer** i Los Alamos, New Mexico. Det
    var ett industriprojekt av enorm skala: som mest omkring 130 000
    anställda, jättefabriker i Oak Ridge för att anrika uran och i Hanford
    för att tillverka plutonium, och en kostnad på cirka 2 miljarder
    dollar (motsvarar uppskattningsvis 30 miljarder dollar i dag).

    Den första provsprängningen, Trinity, skedde 16 juli 1945; tre veckor
    senare fälldes bomberna över [Hiroshima och
    Nagasaki](#hiroshima-nagasaki-1945). Projektet blev mallen för
    storskalig statlig forskning (se även [månlandningen
    1969](#manlandningen-1969)). Det drev också datortekniken: John von
    Neumann arbetade med projektet, och [ENIAC](#eniac) (se det) användes
    strax efter kriget för beräkningar till vätebomben.

fn-1945:
  period: 1940
  label: "FN 1945"
  title: "Förenta nationerna grundas 1945"
  wiki:
    - "sv:Förenta nationerna"
    - "sv:Dag Hammarskjöld"
  text: |
    Förenta nationerna (FN) grundades när andra världskriget tog slut.
    FN-stadgan undertecknades i San Francisco i juni 1945 av 50 stater och
    trädde i kraft den 24 oktober 1945. FN ersatte Nationernas förbund
    från 1920, som misslyckats med att stoppa andra världskriget – bland
    annat för att USA aldrig gick med.

    Kärnan är **säkerhetsrådet**, där de fem segrarmakterna USA,
    Sovjetunionen (i dag Ryssland), Storbritannien, Frankrike och Kina har
    permanenta platser och vetorätt: var och en kan ensam stoppa ett
    beslut. Det gjorde att FN under kalla kriget ofta var
    handlingsförlamat. Ett undantag var [Koreakriget
    1950](#koreakriget-195053), då Sovjet bojkottade rådet (se det).

    FN har i dag 193 medlemsländer, jämfört med 50 från början – ökningen
    kommer främst av avkoloniseringen (se [Afrikas år
    1960](#afrikas-ar-1960)). Sverige gick med 1946, och svensken **Dag
    Hammarskjöld** var generalsekreterare 1953–61 och byggde upp FN:s
    fredsbevarande styrkor. Han omkom i en flygolycka under Kongokrisen.
    Till FN-familjen hör också organ som WHO, som ledde [utrotningen av
    smittkoppor 1980](#smittkoppor-utrotade-1980) och arbetet mot polio
    (se [poliovaccin](#poliovaccin)).

medborgarrattsrorelsen:
  period: 1960
  label: "Medborgarrättsrörelsen"
  title: "Medborgarrättsrörelsen i USA"
  wiki:
    - "en:Civil rights movement"
    - "sv:Martin Luther King"
  text: |
    [Slaveriet i USA avskaffades 1865](#slaveriet-avskaffas) efter
    inbördeskriget, men i sydstaterna infördes från 1870-talet ”Jim
    Crow-lagar”: lagstadgad rassegregering i skolor, bussar, restauranger
    och toaletter, och regler som i praktiken hindrade svarta från att
    rösta. Lynchningar var vanliga. Rörelsen för att få slut på detta
    kallas medborgarrättsrörelsen och var som starkast 1954–68.

    Milstolpar: 1954 förbjöd Högsta domstolen segregerade skolor. 1955
    vägrade **Rosa Parks** lämna sin bussplats till en vit man i
    Montgomery, Alabama, vilket startade en ettårig bussbojkott ledd av
    den unge pastorn **Martin Luther King Jr.** Rörelsen använde ickevåld,
    inspirerad av Gandhi: sittstrejker, marscher och massarresteringar,
    som filmades av tv och chockade resten av landet. 1963 talade King
    inför cirka 250 000 i Washington (”I have a dream”).

    Resultatet blev Civil Rights Act 1964, som förbjöd diskriminering, och
    Voting Rights Act 1965, som skyddade rösträtten. King mördades 1968.
    Andra grenar, som Malcolm X och Black Panthers, ville inte bara
    integration utan svart självständighet. Rörelsen inspirerade kvinno-,
    homo- och minoritetsrörelser, även i
    [Nordirland](#nordirlandskonflikten) (se det). Skillnader i
    förmögenhet och behandling lever kvar, jämför Black Lives Matter 2020.

kennedy-mordas:
  period: 1960
  label: "Kennedy mördas"
  title: "Mordet på John F. Kennedy 1963"
  wiki:
    - "sv:Mordet på John F. Kennedy"
    - "sv:John F. Kennedy"
  text: |
    **John F. Kennedy** valdes 1960 till USA:s president, 43 år gammal,
    den yngste som valts och den förste katoliken. Hans korta tid
    präglades av kalla kriget: den misslyckade invasionen i [Grisbukten på
    Kuba 1961](#kubanska-revolutionen-1959), [Berlinmuren
    1961](#berlinmuren-1961), [Kubakrisen 1962](#kubakrisen-1962) (se
    dessa), löftet om att [landa på månen](#manlandningen-1969) och ökande
    inblandning i Vietnam.

    Den 22 november 1963 sköts Kennedy till döds när han åkte i öppen bil
    genom Dallas, Texas. Lee Harvey Oswald, en före detta marinsoldat som
    bott i Sovjetunionen, greps samma dag, men sköts själv ihjäl två dagar
    senare av nattklubbsägaren Jack Ruby – live i tv. Den statliga
    Warrenkommissionen kom 1964 fram till att Oswald agerade ensam. Det
    omständliga förloppet har gett upphov till otaliga
    konspirationsteorier.

    Vicepresident **Lyndon B. Johnson** tog över. Han använde chocken
    efter mordet till att driva igenom Kennedys medborgarrättslag 1964 (se
    [Medborgarrättsrörelsen](#medborgarrattsrorelsen)) och stora sociala
    reformer, men [eskalerade också Vietnamkriget](#vietnamkriget). 1968
    mördades även Kennedys bror Robert och Martin Luther King. Mordet är
    ett av de första ögonblick som en hel värld upplevde genom tv nästan
    samtidigt.

manlandningen-1969:
  period: 1960
  label: "månlandningen 1969"
  title: "Månlandningen 1969"
  wiki:
    - "sv:Apollo 11"
    - "sv:Apolloprogrammet"
    - "en:Apollo Guidance Computer"
  text: |
    1961, efter Sovjets framgångar med [Sputnik](#sputnik-1957) och
    [Gagarin](#gagarin-1961) (se dessa), lovade president Kennedy att USA
    skulle landa en människa på månen och föra hem honom säkert före 1970.
    Resultatet blev **Apolloprogrammet**. Det kostade cirka 25 miljarder
    dollar på den tiden (uppskattningsvis 250–300 miljarder i dag), och
    som mest arbetade omkring 400 000 människor med det. NASA:s budget var
    några år omkring 4 procent av USA:s federala budget.

    Den 16 juli 1969 sköts Apollo 11 upp med Saturn V, den kraftigaste
    raket som byggts fram till dess, 110 meter hög. Den 20 juli landade
    **Neil Armstrong** och **Buzz Aldrin** i månlandaren, medan Michael
    Collins kretsade i omloppsbana. Armstrong klev ut med orden ”ett litet
    steg för en människa, ett jättekliv för mänskligheten”.
    Uppskattningsvis 600 miljoner människor såg det i tv.

    För en datavetare: färddatorn (Apollo Guidance Computer) hade ungefär
    4 kB arbetsminne och 72 kB fast minne och var en av de första
    datorerna byggda med integrerade kretsar (se [mikrochip](#mikrochip));
    Apolloprogrammet köpte en stor del av världens chip i början.
    Mjukvaran leddes av Margaret Hamilton. Totalt landade tolv män på
    månen 1969–72. Ingen har varit där sedan dess.

pc:
  period: 1980
  label: "PC"
  title: "IBM PC och persondatorindustrin"
  wiki:
    - "sv:IBM PC"
    - "en:IBM Personal Computer"
  text: |
    År 1981 lanserade **IBM**, då världens dominerande datorföretag, sin
    **IBM PC** (Personal Computer). Den kostade cirka 1 600 dollar
    (motsvarar över 5 000 i dag), hade en Intel 8088-processor på 4,77 MHz
    och 16–256 kB minne. För att hinna i kapp konkurrenter som Apple II
    byggdes den av standardkomponenter, och operativsystemet köptes in
    från ett litet företag, **Microsoft**, som fick behålla rätten att
    sälja MS-DOS till andra.

    Det blev avgörande. Eftersom arkitekturen var öppen kunde företag som
    Compaq och Dell bygga kompatibla kloner, och värdet hamnade hos de två
    leverantörer alla behövde: Microsoft (programvaran) och Intel
    (processorn) – det som senare kallades Wintel. IBM tappade kontrollen
    över marknaden det skapat. Apple svarade 1984 med Macintosh, den
    första massmarknadsdatorn med grafiskt gränssnitt och mus.

    Under 1980-talet gick datorn från att vara en företagsmaskin till att
    stå på skrivbord i kontor och hem: kalkylprogram, ordbehandling och
    spel. Det lade grunden för att [webben på 1990-talet](#webben) snabbt
    fick miljontals användare. Se även [persondatorn](#persondatorn) under
    Globalt.

reagan:
  period: 1980
  label: "Reagan"
  title: "Ronald Reagan, USA:s president 1981–1989"
  wiki:
    - "sv:Ronald Reagan"
    - "en:Reaganomics"
  text: |
    **Ronald Reagan** (1911–2004) var en före detta Hollywoodskådespelare
    och guvernör i Kalifornien som blev USA:s 40:e president. Han
    tillträdde efter 1970-talets kriser: oljechocker, hög inflation (över
    13 % 1980), [Vietnamnederlaget](#vietnamkriget) och [gisslandramat i
    Iran](#iranska-revolutionen-1979).

    Inrikes stod han för det som kallas **reaganomics**: kraftigt sänkta
    skatter (högsta marginalskatten från 70 % till 28 %), avreglering och
    mindre statliga välfärdsutgifter – samma riktning som [Margaret
    Thatcher](#thatcher) i Storbritannien. Samtidigt ökade
    försvarsutgifterna kraftigt och statsskulden nästan tredubblades. Han
    överlevde ett mordförsök 1981. Hans andra mandatperiod skakades av
    **Iran–Contras-affären**, där vapen hemligt sålts till Iran och
    pengarna förts till högergerillan i Nicaragua.

    Utrikes började han med hård retorik mot Sovjetunionen (det onda
    imperiet) och ett planerat rymdbaserat robotförsvar, Star Wars. Men
    när reformatorn Michail Gorbatjov kom till makten 1985 förhandlade de
    fram INF-avtalet 1987, som för första gången avskaffade en hel klass
    kärnvapen. [Kalla kriget tog slut](#sovjet-faller-1991) strax efter
    hans tid. Hans politiska linje präglade det republikanska partiet i
    årtionden.

september-2001-11:
  period: 2000
  label: "11 september 2001"
  title: "Terrorattackerna 11 september 2001"
  wiki:
    - "sv:Terrorattackerna den 11 september 2001"
    - "en:September 11 attacks"
  text: |
    Morgonen den 11 september 2001 kapade 19 män från terrornätverket
    **al-Qaida** fyra passagerarplan i USA. Två flögs in i tvillingtornen
    i **World Trade Center** i New York, som rasade inom två timmar. Ett
    tredje flögs in i försvarshögkvarteret Pentagon utanför Washington. I
    det fjärde gjorde passagerarna uppror och planet störtade i
    Pennsylvania. Nästan 3 000 människor dödades – fler än vid den
    japanska attacken mot [Pearl Harbor 1941](#pearl-harbor).

    Al-Qaida var en sunnimuslimsk extremistgrupp ledd av saudiern **Usama
    bin Ladin**, som vuxit fram bland frivilliga [som stridit mot
    Sovjetunionen i Afghanistan på 1980-talet](#afghanistankriget).
    Gruppen ville driva ut USA från Mellanöstern och störta regimer de såg
    som USA-vänliga. Attacken var planerad i Afghanistan, där talibanerna
    gav dem skydd. Hela operationen beräknas ha kostat al-Qaida runt en
    halv miljon dollar.

    Följderna blev enorma. USA inledde ett "krig mot terrorismen":
    invasionerna av Afghanistan 2001 och Irak 2003, fångläger på
    Guantánamo och utbyggd övervakning (Patriot Act). Flygsäkerheten
    förändrades för alltid. Krigen som följde dödade hundratusentals och
    kostade USA flera tusen miljarder dollar. Se även [Afghanistan
    2001](#afghanistan-2001) och [Irak 2003](#irak-2003).

iphone-2007:
  period: 2000
  label: "iPhone 2007"
  title: "Apples iPhone 2007"
  wiki:
    - "sv:Iphone"
    - "en:IPhone (1st generation)"
  text: |
    I januari 2007 presenterade Apples grundare **Steve Jobs** iPhone: "en
    iPod, en telefon och en internetkommunikatör" i en enda apparat. Den
    hade en pekskärm på 3,5 tum som styrdes med fingrarna (multitouch) i
    stället för penna eller knappsats, och en riktig webbläsare som visade
    vanliga webbsidor. Den kostade 499–599 dollar och såldes från
    juni 2007.

    Smarta telefoner fanns redan – Nokias Symbian-telefoner och BlackBerry
    med fysiskt tangentbord dominerade – men de var krångliga att använda.
    Det stora genombrottet kom 2008 med **App Store**, där fristående
    utvecklare kunde sälja program till alla användare. Google lanserade
    samma år operativsystemet **Android**, som gavs bort till tillverkare
    som Samsung och i dag finns på omkring 70 % av världens smartphones.

    Nokia, världens största mobiltillverkare, och BlackBerry förlorade
    nästan hela marknaden på fem år; även Ericssons telefonsamarbete med
    Sony försvann. Smartphonen gjorde mobilt internet till norm, och
    möjliggjorde tjänster som Uber, Instagram, Spotify och Swish samt
    mobilkameran som förändrade nyhetsrapportering. I dag har
    uppskattningsvis 4–5 miljarder människor en smartphone. Se även
    [mobiltelefonen](#mobiltelefonen) och [sociala
    medier](#sociala-medier).

stormningen-av-kapitolium-2021:
  period: 2020
  label: "Stormningen av Kapitolium 2021"
  title: "Stormningen av Kapitolium 6 januari 2021"
  wiki:
    - "en:January 6 United States Capitol attack"
  text: |
    **Kapitolium** är byggnaden i Washington där USA:s kongress –
    representanthuset och senaten – sammanträder. Den 6 januari 2021
    skulle kongressen formellt räkna elektorsrösterna och bekräfta att
    **Joe Biden** vunnit presidentvalet i november 2020 med 306 mot 232
    elektorsröster. Den avgående presidenten **Donald Trump** vägrade
    erkänna förlusten och hävdade, utan bevis, att valet var stulet; ett
    sextiotal rättsprocesser om valfusk hade nästan alla avvisats.

    Samma dag höll Trump ett tal inför tusentals anhängare och uppmanade
    dem att gå till Kapitolium och "kämpa som tusan". Flera tusen trängde
    sig in i byggnaden, slog sönder fönster och dörrar och drabbade samman
    med polis. Kongressledamöterna och vicepresident Mike Pence, som en
    del av mobben ropade skulle hängas, fick evakueras. Omkring 140
    poliser skadades, och fem människor dog i samband med händelsen eller
    strax efter. Kongressen fullföljde rösträkningen samma natt.

    Det var första gången sedan britterna [brände Washington
    1814](#kriget-1812) som Kapitolium intogs, och första gången i USA:s
    historia som makten inte överlämnades fredligt utan störningar. Över 1
    500 personer åtalades. Trump ställdes inför riksrätt men friades i
    senaten. Efter att han vunnit valet 2024 benådade han nästan alla
    dömda. Se även [Trump åter 2025](#trump-ater-2025).

trump-ater-2025:
  period: 2020
  label: "Trump åter 2025"
  title: "Donald Trump president igen 2025"
  wiki:
    - "sv:Donald Trump"
    - "en:Second presidency of Donald Trump"
  text: |
    **Donald Trump** (född 1946) är en fastighetsmagnat och
    tv-personlighet som var USA:s president 2017–2021 för det
    republikanska partiet. Han förlorade valet 2020 mot Joe Biden och
    vägrade erkänna förlusten (se [Stormningen av Kapitolium
    2021](#stormningen-av-kapitolium-2021)). Han åtalades i flera mål och
    dömdes 2024 i New York för att ha förfalskat affärshandlingar – första
    gången en före detta president dömts för brott.

    Ändå vann han valet i november 2024 mot vicepresident Kamala Harris,
    och vann både elektorsrösterna och flest röster totalt. Viktiga
    orsaker var missnöje med den höga inflationen efter pandemin och oro
    över invandringen. Han tillträdde den 20 januari 2025 som andra
    president i historien att få två mandatperioder som inte följer på
    varandra (efter Grover Cleveland på 1890-talet).

    Hans andra period har präglats av mycket snabba och omfattande
    förändringar: höga tullar mot både motståndare och allierade (de
    högsta i USA sedan 1930-talet), massutvisningar av papperslösa
    invandrare, kraftiga nedskärningar och uppsägningar i
    statsförvaltningen, nedläggning av biståndsmyndigheten USAID och
    starkt utvidgad användning av presidentens makt, vilket utmanats i
    domstolar. Relationen till Europa och NATO har blivit osäkrare. Jämför
    med [Reagan](#reagan) på 1980-talet, en annan republikansk president
    som förändrade partiets inriktning.
