# Globalt / vetenskap
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

gerbert-pave-sylvester-ii-for-in:
  period: 1000
  label: "Gerbert (påve Sylvester II) för in arabiska siffror och abakus i Europa"
  title: "Gerbert av Aurillac – arabiska siffror i Europa"
  wiki:
    - "sv:Sylvester II"
    - "en:Hindu–Arabic numeral system"
  text: |
    **Gerbert av Aurillac** (ca 946–1003) var en fransk munk och lärd som blev påve år 999 under namnet **Sylvester II**. Som ung studerade han i Katalonien, nära gränsen till det muslimska al-Andalus, där han kom i kontakt med arabisk matematik och astronomi. Han var lärare till kejsar [Otto III](#otto-iii-dor-1002), som såg till att han blev påve.

    Gerbert var en av de första som förde in de **indisk-arabiska siffrorna** 1–9 i Europa. Siffrorna med positionssystem, där en siffras värde beror på dess plats, uppfanns i Indien och spreds via arabvärlden. Gerbert använde dem på en **abakus** – en räknetavla med kolumner för ental, tiotal, hundratal osv. – där man lade märken med siffror i kolumnerna. Det gjorde räkning mycket snabbare än med romerska siffror (prova att multiplicera XLVII med CCXIV). Han saknade dock nollan; en tom kolumn fick visa den.

    Genombrottet kom först senare: [Fibonacci förklarade systemet med nollan 1202](#fibonacci-liber-abaci-1202), och först på 1400–1500-talen slog det igenom brett, med handeln och boktrycket. Gerbert byggde också astronomiska instrument och ansågs så lärd att rykten påstod att han förbundit sig med djävulen.

al-biruni-beraknar-jordens-radie:
  period: 1020
  label: "al-Biruni beräknar jordens radie"
  title: "Al-Biruni mäter jordens radie"
  wiki:
    - "sv:Al-Biruni"
    - "en:Earth radius"
  text: |
    **Al-Biruni** (973–cirka 1050), persisk-centralasiatisk lärd (se [al-Biruni om Indien](#al-biruni-om-indien)), mätte jordens storlek med en ny metod kring 1020–1030, i nuvarande Pakistan.

    Metoden: först mätte han höjden på ett berg med trigonometri, genom att sikta på toppen från två punkter. Sedan stod han på toppen och mätte vinkeln ner till horisonten. Ju större jorden är, desto mindre sänker sig horisonten. Med enkel trigonometri ger berghöjden och vinkeln jordens radie. Det krävde bara en person på en plats, i motsats till Eratosthenes metod (cirka 240 f.Kr.), som krävde mätning av en lång sträcka mellan två städer.

    Hans resultat motsvarar cirka 6 340 km, mot dagens värde 6 371 km – mindre än en procents fel, även om en del av precisionen nog var tur, eftersom ljusets brytning i luften påverkar horisonten. Jämför: [Columbus](#columbus-1492) räknade 1492 med en jord som var ungefär en fjärdedel för liten, vilket var därför han trodde att Asien låg nära.

supernovan-1054-krabbnebulosan-noteras:
  period: 1040
  label: "Supernovan 1054 (Krabbnebulosan) noteras av kinesiska astronomer"
  title: "Supernovan 1054"
  wiki:
    - "sv:SN 1054"
    - "sv:Krabbnebulosan"
  text: |
    Den 4 juli 1054 noterade astronomer vid [Songdynastins hov](#songdynastin) i Kina en "gäststjärna" i stjärnbilden Oxen. Den var så ljus att den syntes i dagsljus i 23 dagar och på natthimlen i nästan två år. Liknande observationer finns från Japan och från arabiska källor; märkligt nog finns nästan inga europeiska noteringar.

    Det var en **supernova** – en tung stjärna som exploderade när dess bränsle tog slut. Den ligger cirka 6 500 ljusår bort, så explosionen hade egentligen skett cirka 6 500 år tidigare. Resterna är **Krabbnebulosan**, ett expanderande gasmoln som i dag är cirka 11 ljusår brett. I mitten finns en *pulsar*: en neutronstjärna – stjärnans kollapsade kärna, cirka 20 km i diameter – som snurrar cirka 30 varv per sekund och sänder ut strålning som en fyr.

    Varför det spelar roll: kopplingen mellan de kinesiska anteckningarna och nebulosan, gjord på 1900-talet, var ett av de första beläggen för att supernovor ger upphov till neutronstjärnor. Kinas noggranna astronomiska arkiv är än i dag en datakälla för forskningen. Jämför med [Tycho Brahes supernova 1572](#tycho-brahes-supernova-1572), som observerades i Europa.

kompassen-beskrivs-shen-kuo-1088:
  period: 1060
  label: "Kompassen beskrivs (Shen Kuo, ~1088)"
  title: "Kompassen – från spådom till navigation"
  wiki:
    - "en:Compass"
    - "en:History of the compass"
  text: |
    Kineserna kände till att magnetit (ett naturligt magnetiskt mineral) ställer in sig i nord–sydlig riktning redan omkring år 0. Men den tidiga ”sydpekaren”, en sked av magnetit på en bronsplatta, användes för spådom och för att placera hus och gravar rätt enligt *fengshui*, inte för resor.

    Omkring 1088 beskrev ämbetsmannen **[Shen Kuo](#shen-kuo-magnetkompass-deklination)** en magnetiserad nål upphängd i en tråd – en verklig kompass – och noterade dessutom [missvisningen](#shen-kuo-magnetisk-deklination), att nålen avviker något från sann nord–syd. Kring 1117 omtalas att [kinesiska sjömän använde kompass](#magnetkompass-for-navigation-kina-1090) när de inte kunde se sol eller stjärnor. I Europa nämns kompassen första gången [ca 1190](#kompassen-namns-i-europa-neckam-1190) och i arabiska källor på 1200-talet; om den spreds dit från Kina eller uppfanns på nytt är omdiskuterat.

    Kompassen gjorde det möjligt att navigera i mulet väder och över öppet hav, och blev ett av de verktyg som möjliggjorde de europeiska upptäcktsresorna från 1400-talet. Den förblev det främsta riktningsinstrumentet i ca 800 år, tills gyrokompassen (1900-talet) och satellitnavigering (GPS, 1990-talet) tog över.

korsfarare-kommer-i-kontakt-med-arabisk:
  period: 1080
  label: "Korsfarare kommer i kontakt med arabisk lärdom"
  title: "Europa möter arabisk lärdom"
  wiki:
    - "en:Latin translations of the 12th century"
    - "sv:Arabiska siffror"
  text: |
    Under 800–1000-talen hade den muslimska världen tagit över och vidareutvecklat grekisk vetenskap och filosofi och kombinerat den med indisk matematik. I Bagdad, Kairo och Córdoba fanns bibliotek med hundratusentals volymer, medan de största europeiska klosterbiblioteken hade några hundra.

    [Korstågen från 1096](#forsta-korstaget-jerusalem-intas-1099) och korsfararstaterna gav en viss kontakt, men den viktigaste överföringen skedde på andra håll: i **Spanien**, där [Toledo erövrades 1085](#toledo-erovras-1085) och blev centrum för översättningar från arabiska till latin, och på **[Sicilien](#normander-tar-sicilien-palermo-1072)**, som normanderna tog från muslimerna 1061–1091. Där översattes bl.a. Aristoteles, Euklides geometri, Ptolemaios astronomi (*Almagest*), Ibn Sinas (Avicennas) medicin och al-Khwarizmis algebra.

    Det viktigaste för en datavetare: de **indisk-arabiska siffrorna** med nollan och positionssystemet, som [Leonardo Fibonacci populariserade i Europa 1202](#fibonacci-liber-abaci-1202). Utan dem vore dagens aritmetik och datorer otänkbara. Även ord som algoritm, algebra, chiffer och noll kommer från arabiskan. Denna kunskapsöverföring var en grundförutsättning för universiteten, skolastiken och senare renässansen och den vetenskapliga revolutionen.

adelard-av-bath-oversatter-euklides-fran:
  period: 1100
  label: "Adelard av Bath översätter Euklides från arabiska"
  title: "Adelard av Bath och Euklides"
  wiki:
    - "en:Adelard of Bath"
    - "en:Euclid's Elements"
  text: |
    **Adelard av Bath** (ca 1080–1152) var en engelsk lärd som reste i Frankrike, södra Italien, på Sicilien och i Mellanöstern för att lära sig det som de arabiskspråkiga lärda kunde. Omkring 1120-talet översatte han Euklides *Elementa* från arabiska till latin – den första fullständiga version som västeuropeiska lärda kunde läsa.

    *Elementa* skrevs av den grekiske matematikern Euklides omkring 300 f.Kr. i Alexandria. Den består av 13 böcker och bygger upp geometrin från några få definitioner och axiom genom strikta bevis – i grunden samma metod som formell matematik och bevisassistenter använder i dag. Grekiska original var i stort sett okända i väst men levde kvar i arabiska översättningar från 800-talet.

    Adelard översatte också [al-Khwarizmis astronomiska tabeller](#adelard-oversatter-al-khwarizmis) (al-Khwarizmi är mannen vars namn gav oss ordet algoritm). Versioner som byggde på hans Euklides låg till grund för den första tryckta utgåvan i Venedig 1482, och *Elementa* förblev den vanligaste läroboken i geometri ända in på 1800-talet. Se även [översättarskolan i Toledo](#oversattarskolan-i-toledo), som under samma århundrade förde in mycket mer arabisk vetenskap i Europa.

toledo-arabisk-vetenskap-till-latin:
  period: 1120
  label: "Toledo: arabisk vetenskap till latin (Gerhard av Cremona)"
  title: "Gerhard av Cremona i Toledo"
  wiki:
    - "en:Gerard of Cremona"
    - "en:Toledo School of Translators"
    - "sv:Almagest"
  text: |
    **Gerhard av Cremona** (ca 1114–1187) var en italiensk lärd som reste till Toledo i Spanien för att få tag på Ptolemaios *Almagest*, antikens stora verk om astronomi. Den fanns inte på latin, bara på arabiska. Han stannade resten av livet och lärde sig arabiska för att översätta den, vilket han blev klar med 1175.

    Han blev den mest produktive översättaren under medeltiden: omkring 70–90 verk tillskrivs honom. Bland dem Euklides geometri, al-Khwarizmis algebra, flera av Aristoteles skrifter, Galenos medicin och [Avicennas](#ibn-sina-medicinens-kanon) *Kanon* – ett medicinskt uppslagsverk som blev standardlärobok vid europeiska universitet i 500 år. Han arbetade troligen med hjälp av arabisk- eller mozarabisktalande medarbetare (mozaraber: kristna som levt under muslimskt styre).

    Toledo var en av få platser där det var möjligt, eftersom staden hade arabiska bibliotek och flerspråkig befolkning (se [översättarskolan i Toledo](#oversattarskolan-i-toledo)). Översättningarna blev grunden för universitetsundervisningen när universiteten växte fram omkring 1200. Den latinska *Almagest* var standardverket i astronomi tills [Kopernikus 1543](#kopernikus-1543) föreslog att jorden rör sig kring solen. Jämför med [Adelard av Bath](#adelard-av-bath-oversatter-euklides-fran), som översatt Euklides några decennier tidigare.

al-idrisis-varldskarta-1154-sicilien:
  period: 1140
  label: "al-Idrisis världskarta 1154 (Sicilien)"
  title: "Al-Idrisis världskarta 1154"
  wiki:
    - "sv:Muhammad al-Idrisi"
    - "en:Tabula Rogeriana"
  text: |
    **Muhammad al-Idrisi** (ca 1100–1165) var en arabisk geograf från Ceuta i Nordafrika som studerat i Córdoba och rest i Spanien, Nordafrika och Mindre Asien. Omkring 1138 bjöds han in av den normandiske kungen **[Roger II](#roger-ii-normandiska-kungariket-sicilien)** av Sicilien (se dit), som ville ha en heltäckande beskrivning av världen.

    Under 15 år samlade al-Idrisi uppgifter från äldre arabiska och grekiska verk (bl.a. Ptolemaios) och genom att intervjua resande köpmän och sjömän i Palermo. Resultatet blev 1154 boken som kallas *Tabula Rogeriana* (Rogers bok): en text och 70 regionkartor som täcker världen från Atlanten till Kina, indelad i sju klimatzoner. Till detta hörde en världskarta graverad på en stor silverskiva, som sedan förstördes. Kartan har söder uppåt, enligt arabisk tradition, och även Skandinavien finns beskrivet.

    Det var den mest exakta världskartan på flera hundra år. Jämför med samtida europeiska *mappae mundi*, som snarare var religiösa bilder med Jerusalem i mitten. Arbetet visar hur Sicilien var en mötesplats för arabisk, grekisk och latinsk kunskap, på samma sätt som Toledo i Spanien (se [översättarskolan i Toledo](#oversattarskolan-i-toledo)).

universitet-i-paris-och-oxford-tar-form:
  period: 1160
  label: "Universitet i Paris och Oxford tar form"
  title: "Universiteten i Paris och Oxford"
  wiki:
    - "sv:Paris universitet"
    - "sv:Oxfords universitet"
    - "en:Medieval university"
  text: |
    Ett universitet var från början en *universitas*, en sammanslutning (ungefär ett skrå) av lärare och studenter som skyddade sina gemensamma intressen mot stad och kyrka. Under 1100-talet växte sådana fram ur katedralskolor där kända lärare drog studenter från hela Europa. [Bologna (juridik, ca 1088)](#universitetet-i-bologna-1088) räknas som det äldsta.

    I **Paris** samlades lärare kring Notre-Dame-skolan; [Pierre Abélard](#abelard-undervisar-i-paris) drog stora skaror på 1110–30-talen. Universitetet fick kungligt privilegium år 1200 och påvliga stadgar 1215. I **Oxford** pågick undervisning från ca 1096, och tillväxten tog fart 1167 när Henrik II förbjöd engelska studenter att studera i Paris.

    Utbildningen byggde på latin, logik och Aristoteles, som just översatts från arabiska och grekiska. Det skapade en ny yrkesklass av utbildade jurister, läkare och teologer. Ur Oxford knoppades [Cambridge av 1209](#universitet-cambridge-1209) (se detta); i Norden kom [Uppsala först 1477](#uppsala-universitet-1477). Modellen med fakulteter och examina lever kvar.

kompassen-namns-i-europa-neckam-1190:
  period: 1180
  label: "Kompassen nämns i Europa (Neckam ~1190)"
  title: "Kompassen i Europa – Neckam ~1190"
  wiki:
    - "en:Alexander Neckam"
    - "en:History of the compass"
  text: |
    **Alexander Neckam** (1157–1217) var en engelsk lärd och munk som undervisat i Paris. Omkring 1190 skrev han i två verk, *De utensilibus* och *De naturis rerum*, att sjömän använder en nål som rörts vid en magnet för att hitta norr när solen eller polstjärnan är skymd. Det är den äldsta kända europeiska beskrivningen av kompassen.

    Kineserna hade beskrivit sjökompassen omkring hundra år tidigare (se ”[Kompass i sjöfart](#kompass-i-sjofart)”). Om tekniken spreds via arabiska och indiska handelsvägar eller uppfanns igen i Europa är oklart. Neckam talar om den som något sjömän redan känner till, så den var sannolikt i bruk en tid före honom.

    De första kompasserna var en nål på ett flötstycke i en skål med vatten. Torrkompassen med nålen på en tapp kom i Medelhavet runt 1300. Tillsammans med sjökort och senare kvadrant och astrolabium möjliggjorde den 1400-talets portugisiska och spanska upptäcktsresor. [Petrus Peregrinus](#petrus-peregrinus-om-magneter-1269) skrev 1269 den första vetenskapliga avhandlingen om magneter.

universitet-cambridge-1209:
  period: 1200
  label: "Universitet: Cambridge 1209"
  title: "Cambridges universitet 1209"
  wiki:
    - "sv:Cambridges universitet"
    - "en:History of the University of Cambridge"
  text: |
    De första universiteten – sammanslutningar av lärare och studenter med egna rättigheter – hade vuxit fram i [Bologna](#universitetet-i-bologna-1088), Paris och Oxford under 1100-talet (se ”[Universitet i Paris och Oxford tar form](#universitet-i-paris-och-oxford-tar-form)”). Relationen mellan studenter och stadsbor var ofta spänd, och konflikter kunde göra att lärare och studenter helt enkelt flyttade.

    1209 anklagades en student i Oxford för att ha dödat en kvinna. Stadsborna hängde i hämnd två eller tre andra studenter. Universitetet stängdes i protest, och en grupp lärare och studenter flyttade till den lilla staden **Cambridge**, där de fortsatte undervisa. Kung Henrik III gav dem skydd 1231, och påven erkände universitetet 1233.

    Det äldsta kollegiet, Peterhouse, grundades 1284. Oxford och Cambridge (”Oxbridge”) var Englands enda universitet i 600 år. Cambridge blev med tiden ett centrum för matematik och naturvetenskap: Newton, Darwin, Maxwell, Turing och upptäckten av DNA:s struktur 1953.

arabiska-siffror-sprids:
  period: 1200
  label: "arabiska siffror sprids"
  title: "Arabiska siffror sprids i Europa"
  wiki:
    - "sv:Arabiska siffror"
    - "en:Hindu–Arabic numeral system"
  text: |
    Våra siffror 0–9 och *positionssystemet* – att en siffras värde beror på var den står, så att 3 i 300 betyder tre hundratal – uppfanns i Indien, med nollan som siffra senast på 600-talet. Arabiska och persiska matematiker tog över systemet; al-Khwarizmi skrev om det omkring 825, och hans namn har gett oss ordet *algoritm*.

    I Europa räknade man med romerska siffror, som saknar noll och positionssystem; själva beräkningarna gjordes på kulram och resultatet skrevs med romerska siffror. [Gerbert av Aurillac](#gerbert-pave-sylvester-ii-for-in) (påve år 999) försökte införa siffrorna, men de slog igenom först med Fibonaccis *[Liber Abaci](#fibonacci-liber-abaci-1202)* 1202 (se denna), främst bland italienska köpmän.

    Spridningen gick långsamt. Florens förbjöd 1299 bankirer att använda de nya siffrorna i bokföring, eftersom de ansågs lätta att förfalska (en 0 kunde ändras till 6 eller 9). Först med [boktrycket på 1400-talet](#gutenberg-tryckpress-1450-bibeln-1455) och [den dubbla bokföringen](#pacioli-summa-1494-dubbel-bokforing) blev de standard. Utan positionssystemet hade det varit svårt att utveckla algebra, logaritmer och så småningom datorer.

pax-mongolica-oppnar-sidenvagen:
  period: 1220
  label: "Pax Mongolica öppnar Sidenvägen"
  title: "Pax Mongolica – mongolisk fred längs Sidenvägen"
  wiki:
    - "en:Pax Mongolica"
    - "sv:Sidenvägen"
  text: |
    *Pax Mongolica* (latin för ”den mongoliska freden”) kallas perioden ca 1250–1350 då mongolerna kontrollerade nästan hela landvägen mellan Kina och Östeuropa. Efter förödelsen vid själva erövringen blev handelsvägarna paradoxalt nog säkrare än på länge: en enda maktsfär, färre tullar och färre rövare.

    **Sidenvägen** är inte en väg utan ett nät av karavanleder mellan Kina, Centralasien, Persien och Medelhavet, där siden, kryddor, porslin, hästar och silver byttes. Mongolerna byggde ett reläsystem, *yam*, med stationer ungefär var 30–40:e km där kurirer bytte häst; brådskande budskap kunde färdas uppåt 300 km per dag. Resande fick *paiza*, metallbrickor som fungerade som pass.

    Det öppnade för de första europeiska resorna till Östasien: munken Plano Carpini 1245–47, Wilhelm av Rubruck 1253–55 och [Marco Polo 1271–95](#marco-polo-reser-1271). Kunskap om krut, kompass och tryckteknik spreds västerut ungefär under denna tid (exakt hur är omdiskuterat). Men vägarna spred också smitta: [digerdöden nådde Svarta havet 1346](#pesten-sprids-langs-sidenvagen) längs samma nät och dödade sedan uppskattningsvis en tredjedel av Europas befolkning.

roger-bacon-experiment-optik:
  period: 1240
  label: "Roger Bacon: experiment, optik"
  title: "Roger Bacon – experiment och optik"
  wiki:
    - "sv:Roger Bacon"
    - "en:Ibn al-Haytham"
  text: |
    **Roger Bacon** (ca 1219–1292) var en engelsk lärd och franciskanermunk som undervisade i Oxford och Paris. Medeltidens universitet var då nya (Bologna ~1088, Paris ~1150, Oxford ~1167), och lärandet byggde på att kommentera auktoriteter – främst Aristoteles, som nyligen översatts från arabiska och grekiska till latin.

    Bacon hävdade att kunskap om naturen måste prövas genom erfarenhet: *scientia experimentalis*, ”experimentell vetenskap”. Det är inte den moderna vetenskapliga metoden med kontrollerade försök och hypotesprövning, men en tidig betoning av observation. Han byggde på den arabiske fysikern **Ibn al-Haytham** (Alhazen, ca 965–1040), vars bok om optik förklarade synen som ljus som kommer in i ögat. Bacon skrev om reflektion, brytning och regnbågen, och beskrev hur linser kan förstora – glasögon dök upp i Italien kring 1286.

    Hans huvudverk *Opus Majus* (1267) skrevs på påvens begäran. Han nämner i ett verk en blandning som motsvarar krut, en av de tidigaste europeiska beskrivningarna, och spekulerade om flygmaskiner och självgående fordon. Senare legender gjorde honom till trollkarl. Han ska inte förväxlas med Francis Bacon (1561–1626), som 350 år senare formulerade den empiriska metoden mer systematiskt.

marco-polo:
  period: 1260
  label: "Marco Polo"
  title: "Marco Polo och hans bok"
  wiki:
    - "sv:Marco Polo"
    - "en:The Travels of Marco Polo"
  text: |
    **Marco Polo** (1254–1324) reste 1271 med sin far och farbror från Venedig till Kublai khans Kina och kom hem först 1295 (se ”[Marco Polo reser 1271](#marco-polo-reser-1271)”). Några år senare blev han tillfångatagen i ett krig mellan Venedig och Genua. I fängelset i Genua berättade han om sina resor för en medfånge, **Rustichello da Pisa**, som skrev riddarromaner. Resultatet blev boken känd som *Il Milione* eller ”Marco Polos resor”, skriven på en fransk-italiensk blandform.

    Boken beskrev Kina (”Cathay”) som ett land av otrolig rikedom: städer större än någon i Europa, pappersmynt, kol som bränsle, ett postväsen med tusentals stationer. Den nämner också Japan (”Cipangu”) som ett land med guld, som han själv aldrig besökt. Många samtida tvivlade på berättelserna.

    Moderna historiker diskuterar hur mycket han verkligen sett; han nämner inte Kinesiska muren, tedrickande eller kvinnors fotbindning. De flesta anser dock att han var i Kina, eftersom många detaljer stämmer med kinesiska källor. Boken blev mycket populär, finns i över 150 handskrifter och trycktes 1477. **Columbus** hade ett exemplar med egna anteckningar i marginalen – han letade efter Marco Polos Asien [när han seglade västerut 1492](#columbus-1492).

mekaniska-ur-i-europeiska-kyrktorn:
  period: 1280
  label: "Mekaniska ur i europeiska kyrktorn"
  title: "Mekaniska ur i kyrktornen"
  wiki:
    - "en:History of timekeeping devices"
    - "en:Verge escapement"
  text: |
    Kring 1280–1300 började man i England, Italien och Frankrike bygga de första **mekaniska uren**, drivna av ett fallande tungt lod. Den avgörande uppfinningen var *gången* (eng. escapement): en mekanism som släpper fram kugghjulet ett steg i taget, så att lodet sjunker i jämn takt i stället för att rasa ned. Tidigare hade man solur, vattenur och timglas. Uppfinnaren är okänd.

    Uren byggdes av smeder i järn och placerades i kyrk- och stadstorn. De första hade ofta ingen urtavla utan slog bara varje timme – engelskans *clock* kommer av ett ord för ringklocka. Noggrannheten var dålig, uppskattningsvis 15–30 minuter fel per dag. [Pendeluret 1656 (Huygens)](#huygens-pendelur) gjorde fel på sekunder per dag, och ett modernt kvartsur på under en sekund.

    Effekten var att tiden blev gemensam och mätbar i lika långa timmar, i stället för klosterklockans böner och solens gång. Det gav städer, marknader och arbetsdagar en ny rytm. Många historiker ser uret som en nyckelmaskin för senare industri och vetenskap – en första automat, och förfadern till all finmekanik.

lilla-istiden-borjar:
  period: 1300
  label: "Lilla istiden börjar"
  title: "Lilla istiden börjar"
  wiki:
    - "sv:Lilla istiden"
    - "en:Little Ice Age"
  text: |
    **Lilla istiden** är namnet på en period med kallare klimat, särskilt på norra halvklotet, som brukar dateras till ungefär 1300–1850. Medeltemperaturen sjönk inte mycket globalt – kanske 0,5 °C eller mindre jämfört med den varmare perioden före – men regionala och säsongsvisa effekter var stora: kalla vintrar, korta växtsäsonger och regniga somrar. Jämför med dagens uppvärmning, som är ungefär 1,2–1,3 °C sedan 1800-talet.

    Orsakerna diskuteras. De viktigaste förklaringarna är kraftiga vulkanutbrott (som sprider partiklar som skuggar solen), perioder med låg solaktivitet och förändringar i havsströmmar. Glaciärerna i Alperna och Norge växte och slukade gårdar.

    Effekterna syns genom hela tidslinjen: [den stora svälten 1315–17](#stora-svalten-131517), att de norröna bosättningarna på Grönland övergavs omkring 1400–1450, nödår i Europa på 1600-talet, och att Karl X Gustav kunde [marschera över isen på Bält 1658](#roskildefreden-1658-skane-svenskt). Många historiker kopplar också kriser på 1600-talet – krig, uppror och svält i både Europa och Kina – till klimatet. Det är ett tydligt exempel på hur jordbrukssamhällen var sårbara för små klimatförändringar.

ibn-battuta-reser-132554:
  period: 1320
  label: "Ibn Battuta reser 1325–54"
  title: "Ibn Battutas resor 1325–1354"
  wiki:
    - "sv:Ibn Battuta"
    - "en:Ibn Battuta"
  text: |
    **Ibn Battuta** (1304–ca 1368) var en rättslärd från Tanger i Marocko. 1325, 21 år gammal, gav han sig av på pilgrimsfärd till Mekka – och kom hem först 24 år senare. Han räknas som den förmoderna tidens mest berest kända person: uppskattningsvis 120 000 km, ungefär tre varv runt jorden, mest till fots, med kamel, häst och skepp.

    Han reste genom Nordafrika, Mellanöstern, Östafrikas swahilikust ([Kilwa](#kilwa)), [Gyllene horden](#gyllene-horden) vid Volga, Centralasien och Indien, där han i flera år var domare hos sultanen Muhammad bin Tughluq ([se det](#muhammad-bin-tughluq-ny-huvudstad)). Han fortsatte till Maldiverna, Sri Lanka, Sydostasien och troligen Kina. Efter hemkomsten for han till [Granada](#granada) och över Sahara till [Maliriket](#mali) 1352–53.

    Att det gick berodde på den muslimska världens enhet: en lärd kunde på arabiska få arbete som domare och gästfrihet från Spanien till Indonesien. Hans reseskildring, *Rihla*, dikterades 1355 för en skrivare och är en huvudkälla för många av de platserna. Jämför med Marco Polo ([se Marco Polo hos Kublai](#marco-polo-hos-kublai)), som reste en generation tidigare men betydligt kortare. [Ibn Battuta såg också digerdöden i Syrien 1348](#digerdoden-1348).

digerdoden-yersinia-pestis-via-stappen:
  period: 1340
  label: "Digerdöden (Yersinia pestis) via stäppen"
  title: "Pestbakterien och stäppen"
  wiki:
    - "sv:Yersinia pestis"
    - "en:Second plague pandemic"
  text: |
    Digerdöden orsakades av bakterien **Yersinia pestis**, som upptäcktes först 1894 av Alexandre Yersin under en pestepidemi i Hongkong. Bakterien lever naturligt hos gnagare, t.ex. murmeldjur på de centralasiatiska stäpperna och råttor, och sprids främst via loppor som biter människor. Den ger *böldpest* (svullna lymfkörtlar, ”bölder”) och kan övergå i *lungpest*, som smittar direkt mellan människor via hosta och dödar nästan alla obehandlade.

    Att det verkligen var just denna bakterie som orsakade digerdöden bevisades först på 2000-talet, genom DNA-analys av skelett från pestgravar, bl.a. i London och Kirgizistan. Stäppen – det väldiga gräslandet från Ungern till Mongoliet – fungerade som både smitthärd och motorväg: det mongoliska väldet förband området med handelsvägar och karavaner.

    Digerdöden räknas som den andra stora pestpandemin. Den första var Justinianus pest från år 541, den tredje började i Kina på 1850-talet och dödade uppskattningsvis 12–15 miljoner, mest i Indien. Idag behandlas pest med vanliga antibiotika, men hundratals fall rapporteras fortfarande varje år, främst på Madagaskar och i Kongo-Kinshasa.

    Se även hur smittan färdades: [Pesten sprids längs Sidenvägen](#pesten-sprids-langs-sidenvagen).

pesten-aterkommer-var-10-e15-e-ar:
  period: 1360
  label: "Pesten återkommer var 10:e–15:e år"
  title: "Pestens återkomst"
  wiki:
    - "en:Second plague pandemic"
    - "sv:Karantän"
  text: |
    [Digerdöden 1347–1351](#digerdoden-1-3-av-europa-dor) var inte en engångshändelse. Pesten fanns kvar hos gnagare, och nya utbrott kom återkommande: i England 1361, 1369, 1375 och så vidare, ungefär vart tionde till femtonde år under resten av medeltiden. Utbrottet 1361 kallades ”barnpesten”, eftersom den slog särskilt hårt mot barn som fötts efter den första vågen.

    Varje våg dödade färre än den första, men de upprepade slagen gjorde att Europas befolkning fortsatte att **minska eller stå still** i över hundra år. Englands befolkning kan ha gått från uppskattningsvis 5 miljoner före 1348 till kanske 2–2,5 miljoner på 1400-talet. Det är en viktig skillnad mot t.ex. en enstaka krigskatastrof: det var långvarig arbetskraftsbrist som förändrade ekonomin, med högre löner, mer boskapsskötsel i stället för spannmålsodling och svagare livegenskap.

    Erfarenheterna ledde också till de första åtgärderna för smittskydd: [Ragusa (dagens Dubrovnik) införde 1377](#karantan-i-ragusa-1377) regeln att resenärer skulle isoleras i 30 dagar, senare 40 – italienska *quaranta giorni*, vilket gav ordet **karantän**. Den sista stora pesten i Västeuropa var i Marseille 1720; i Sverige var den sista [1710–1713](#pest-1710).

zheng-hes-resor-over-indiska-oceanen:
  period: 1400
  label: "Zheng Hes resor över Indiska oceanen"
  title: "Zheng Hes resor i världsperspektiv"
  wiki:
    - "en:Ming treasure voyages"
    - "sv:Zheng He"
  text: |
    Zheng Hes sju expeditioner 1405–1433 var de största sjöexpeditionerna i världen före 1500-talet. Flottorna hade tiotals till hundratals fartyg och upp till cirka 28 000 man, och de nådde Java, Sri Lanka, Calicut i Indien, Hormuz i Persiska viken, Aden, Mecka (en mindre delegation) och Östafrika.

    Navigeringen byggde på kunskap som Kina hade haft länge: **[magnetkompassen](#magnetkompass-for-navigation-kina-1090)** (använd till sjöss i Kina sedan ungefär 1000-talet), stjärnhöjdsmätning och detaljerade seglingsbeskrivningar. En karta från resorna, den så kallade *Mao Kun-kartan*, finns bevarad i ett verk från 1621.

    Jämförelse: [Bartolomeu Dias rundade Godahoppsudden 1488](#dias-rundar-godahoppsudden-1488) och [Vasco da Gama kom till Indien 1498](#vasco-da-gama-i-calicut-1498) med fyra fartyg. Det var den europeiska resan som förändrade världshandeln – inte för att européerna hade bättre fartyg, utan för att de stannade, byggde fort och sökte monopol, medan Kina [avslutade resorna 1433](#ming-upphor-med-flottexpeditionerna-1433).

    Frågan varför Kina slutade, och vad som hade hänt om det fortsatt, är en klassisk diskussion om varför det blev Europa och inte Kina som koloniserade världen.

ulugh-begs-stjarnkatalog:
  period: 1420
  label: "Ulugh Begs stjärnkatalog"
  title: "Ulugh Begs stjärnkatalog"
  wiki:
    - "en:Zij-i Sultani"
    - "sv:Ulugh Beg"
  text: |
    Med det stora observatoriet i Samarkand ([se 1420-talet](#ulugh-begs-observatorium-i-samarkand)) sammanställde **Ulugh Beg** och hans medarbetare stjärnkatalogen *Zij-i Sultani*, färdig omkring 1437. En *zij* är en astronomisk handbok med tabeller för att beräkna himlakropparnas positioner.

    Katalogen angav positionerna för 1 018 stjärnor. Det var den första omfattande stjärnkatalogen byggd på nya observationer sedan grekern **Ptolemaios** på 100-talet e.Kr. – i 1 300 år hade astronomer i stort sett kopierat och justerat Ptolemaios siffror. Noggrannheten låg typiskt på ungefär en tiondels grad eller bättre för många stjärnor.

    Verket innehöll också trigonometriska tabeller för sinus och tangens med hög precision, och kalenderberäkningar. Det översattes till latin och gavs ut i Oxford 1665, där det användes av europeiska astronomer.

    Jämför: **Tycho Brahe** [mätte omkring 1 000 stjärnor på Ven](#tycho-brahe-pa-ven-uraniborg) på 1580–1590-talet, med en noggrannhet runt en sextiondels grad (en bågminut) – utan teleskop. Det var hans data som [Kepler](#kepler-planetlagarna-1609) använde för att visa att planeternas banor är ellipser. Ulugh Begs katalog var det sista stora steget i den islamiska astronomin innan tyngdpunkten flyttade till Europa.

boktryck-sprider-kunskap-snabbt:
  period: 1440
  label: "Boktryck sprider kunskap snabbt"
  title: "Boktrycket sprider kunskap"
  wiki:
    - "sv:Boktryckarkonst"
    - "sv:Inkunabel"
  text: |
    [Efter att Gutenberg](#gutenberg-tryckpress-1450-bibeln-1455) utvecklat tryck med lösa metalltyper i Mainz omkring 1450 spreds tekniken mycket snabbt. 1500 fanns tryckerier i uppskattningsvis 250 europeiska städer, och man hade tryckt omkring 30 000 olika titlar – sammanlagt kanske 10–20 miljoner exemplar. Böcker tryckta före 1501 kallas *inkunabler* (”vaggtryck”).

    Effekten liknas ofta vid internet. Kostnaden per bok föll dramatiskt – kanske till en åttondel eller mindre jämfört med handskrifter. Tidigare skrevs böcker av för hand, ofta i kloster, och varje kopia riskerade nya fel. Nu fanns tusentals identiska exemplar: en forskare i Kraków och en i Venedig kunde hänvisa till samma sida. Det gjorde det möjligt att korrigera fel och bygga vidare på varandras arbeten, en förutsättning för den vetenskapliga revolutionen på 1500–1600-talen ([Kopernikus 1543](#kopernikus-de-revolutionibus-1543), Galileo, Newton).

    Trycket drev också religiös och politisk förändring. [Luthers skrifter från 1517](#luther-95-teser-1517) spreds i hundratusentals exemplar, och utan tryck hade **reformationen** troligen kvävts som Hus' rörelse hundra år tidigare ([se Hussitkrigen](#hussitkrigen)). Folkspråken standardiserades när böcker trycktes på tyska, engelska och svenska istället för latin.

    Sveriges första tryckta bok kom 1483 i Stockholm.

regiomontanus-trigonometri:
  period: 1460
  label: "Regiomontanus: trigonometri"
  title: "Regiomontanus och trigonometrin"
  wiki:
    - "en:Regiomontanus"
    - "en:De triangulis omnimodis"
  text: |
    **Regiomontanus** är det latiniserade namnet på Johannes Müller (1436–1476) från Königsberg i Franken. Han var astronom och matematiker och en av de första vetenskapsmännen som tog boktryckarkonsten i bruk ([se Gutenberg ~1450](#gutenbergs-tryckpress-1450)).

    Hans verk *De triangulis omnimodis* (”Om trianglar av alla slag”, skrivet 1464, tryckt 1533) var den första europeiska läroboken i **trigonometri** – läran om sambanden mellan vinklar och sidor i trianglar (sinus, cosinus osv.) – som ett eget ämne, inte bara ett verktyg i astronomin. Mycket byggde på arabiska och grekiska föregångare.

    I Nürnberg startade han ett eget tryckeri och gav 1474 ut *Ephemerides*, tabeller över himlakropparnas positioner för 32 år framåt. Sådana tabeller var navigationens ”GPS-data”. [Columbus](#columbus-1492) hade dem med sig, och 1504 på Jamaica sägs han ha använt en förutsagd månförmörkelse för att skrämma lokalbefolkningen till att ge hans män mat. Regiomontanus översättning av Ptolemaios astronomi [lästes senare av Kopernikus](#kopernikus-forsta-utkast).

columbianska-utbytet-majs-potatis:
  period: 1480
  label: "Columbianska utbytet: majs, potatis, smittkoppor, syfilis (Europa 1494)"
  title: "Det columbianska utbytet"
  wiki:
    - "en:Columbian exchange"
    - "en:History of syphilis"
  text: |
    Det **columbianska utbytet** ([efter Columbus](#columbus-1492)) är historikern Alfred Crosbys term för den massiva överföringen av växter, djur, människor och sjukdomar mellan Amerika och resten av världen efter 1492. I över 10 000 år hade kontinenterna utvecklats separat.

    Från Amerika kom **majs, potatis, tomat, chili, kakao, tobak, jordnötter, vanilj och kassava**. Potatisen gav så mycket kalorier per hektar att den bidrog till befolkningsökningen i Nordeuropa från 1700-talet; majs och sötpotatis gjorde detsamma i Kina. Åt andra hållet gick vete, socker, kaffe, hästar, kor, grisar och får till Amerika – utan hästar hade prärieindianernas ryttarkultur aldrig uppstått.

    Sjukdomarna var värst. Smittkoppor, mässling och influensa dödade uppskattningsvis 50–90 % av Amerikas ursprungsbefolkning inom ett sekel – kanske tiotals miljoner människor. [Jämför digerdöden](#digerdoden-1-3-av-europa-dor), som dödade en tredjedel till hälften av Europas befolkning. Åt andra hållet dök **[syfilis](#syfilis-i-europa-1494)** upp i Europa 1494–95, bland soldaterna i Karl VIII:s armé i Neapel. Att den kom från Amerika är den vanligaste men fortfarande omdiskuterade förklaringen.

smittkoppor-i-karibien-1518:
  period: 1500
  label: "Smittkoppor i Karibien 1518"
  title: "Smittkopporna når Amerika 1518"
  wiki:
    - "en:History of smallpox in Mexico"
    - "en:Smallpox"
  text: |
    **Smittkoppor** var en virussjukdom som spreds via luften, gav hög feber och blåsor över kroppen och dödade ungefär 30 % av de smittade i Europa. Den hade funnits i Eurasien i tusentals år, så de flesta européer hade antingen haft den som barn eller hade släktingar som överlevt.

    I Amerika fanns den inte. I december 1518 bröt den första kända smittkoppsepidemin ut på **Hispaniola**, troligen förd med skepp från Spanien eller Afrika. Den dödade en stor del av de återstående [taínofolket](#tainofolket-dor-ut) – samtida källor anger en tredjedel till hälften – och spred sig till Puerto Rico och Kuba.

    Därifrån följde den med spanjorerna till Mexiko 1520. Epidemin i Tenochtitlan dödade bland andra aztekernas nye kejsare Cuitláhuac och avgjorde i praktiken [Cortés erövring](#cortes-landstiger-1519). Den spred sig sedan söderut, långt före spanjorerna, och nådde inkariket omkring 1525, där kejsaren Huayna Capac dog; det utlöste ett inbördeskrig som [Pizarro](#pizarro-tar-inkariket-1532) utnyttjade. Smittkoppor var den största enskilda dödsorsaken i det [columbianska utbytet](#columbianska-utbytet-majs-potatis). Sjukdomen förklarades utrotad 1980, efter ett globalt vaccinationsprogram – den första och hittills enda människosjukdom som utrotats.

kopernikus-forsta-utkast:
  period: 1500
  label: "Kopernikus första utkast"
  title: "Kopernikus första utkast: Commentariolus"
  wiki:
    - "en:Commentariolus"
    - "en:Nicolaus Copernicus"
    - "en:Copernican heliocentrism"
  text: |
    **Nikolaus Kopernikus** (1473–1543) var en polsk kanik (präst vid en domkyrka), läkare och astronom i Frauenburg (Frombork). Den rådande bilden av universum kom från den grekiske astronomen Ptolemaios (100-talet): jorden stod stilla i mitten och solen, månen och planeterna kretsade runt den i ett krångligt system av cirklar på cirklar (epicykler).

    Någon gång före 1514 skrev Kopernikus en kort handskrift, ***Commentariolus*** (”Liten kommentar”), som han bara lät cirkulera bland vänner. Där lade han fram idén att **solen** står i mitten och att jorden är en planet som roterar runt sin axel varje dygn och går runt solen på ett år. Det förklarade på ett enkelt sätt varför planeterna ibland ser ut att gå baklänges på himlen.

    Hans huvudverk, *De revolutionibus*, [trycktes först 1543](#kopernikus-de-revolutionibus-1543), samma år som han dog – enligt legenden fick han ett exemplar på dödsbädden. Modellen var fortfarande ganska krånglig, eftersom han höll fast vid cirkelbanor. [Kepler (ellipser, 1609)](#kepler-planetlagarna-1609), [Galileo (teleskop, 1610)](#galileis-teleskop-1609) och [Newton (gravitation, 1687)](#newton-principia-1687) fullbordade det som kallas den vetenskapliga revolutionen.

smittkoppor-dodar-miljoner-i-amerika:
  period: 1520
  label: "Smittkoppor dödar miljoner i Amerika"
  title: "Smittkoppor och den stora dödligheten i Amerika"
  wiki:
    - "en:Population history of the Indigenous peoples of the Americas"
    - "sv:Smittkoppor"
  text: |
    Amerikas ursprungsbefolkningar hade varit isolerade från Eurasien i över 10 000 år och saknade immunitet mot sjukdomar som smittkoppor, mässling, influensa och tyfus. Eurasiens sjukdomar hade uppstått i tät samvaro med husdjur, som Amerika hade få av.

    Smittkopporna nådde Karibien 1518 och Mexiko 1520, där epidemin slog till mitt under [Cortés angrepp på aztekerna](#aztekriket-faller-1521). Den spreds längs handelsvägar snabbare än spanjorerna själva och nådde Inkariket [före Pizarro](#pizarro-tar-inkariket-1532). Hur många som dog är mycket osäkert, eftersom befolkningen före 1492 uppskattas allt från omkring 10 till över 100 miljoner. En vanlig bedömning är att 50–90 % dog under det första århundradet. I centrala Mexiko kan befolkningen ha sjunkit från kanske 15–25 miljoner till runt 1–2 miljoner omkring 1600.

    Det är proportionellt sett en av de största demografiska katastroferna i historien – jämför med [digerdöden ~1350](#digerdoden-1-3-av-europa-dor), som dödade omkring en tredjedel till hälften av Europas befolkning. Den förklarar mycket av varför små europeiska styrkor kunde ta över, och arbetskraftsbristen bidrog till att man började importera afrikanska slavar (se [slavhandeln växer](#slavhandeln-vaxer)).

vetenskapliga-revolutionen-borjar:
  period: 1540
  label: "Vetenskapliga revolutionen börjar (Kopernikus, Vesalius)"
  title: "Den vetenskapliga revolutionen börjar"
  wiki:
    - "sv:Vetenskapliga revolutionen"
    - "en:Scientific Revolution"
  text: |
    Med **vetenskapliga revolutionen** menas omvandlingen ungefär 1543–1700 från ett vetande som byggde på antika auktoriteter (Aristoteles, Ptolemaios, Galenos) till ett som byggde på observation, experiment och matematik. 1543 ses ofta som startåret, eftersom två banbrytande böcker kom då: [Kopernikus om solen i centrum](#kopernikus-1543) och [Vesalius om människokroppens anatomi](#vesalius-anatomi-1543).

    Förutsättningar fanns redan: boktrycket (Gutenberg ~1450) gjorde att texter, tabeller och exakta bilder kunde spridas i tusentals identiska kopior; renässansen återupptäckte antika texter och därmed också deras motsägelser; och upptäcktsresorna visade att antikens geografer haft fel om stora saker.

    Revolutionen tog 150 år: Tycho Brahes mätningar (1570–90-tal), [Keplers ellipsbanor (1609)](#kepler-planetlagarna-1609), Galileis teleskop (1610), Harveys blodomlopp (1628), Descartes och till sist [Newtons gravitationslag 1687](#newton-principia-1687). Med den kom institutioner som vetenskapliga akademier och tidskrifter. Det är grunden för modern naturvetenskap – och, via 1700-talets upplysning och 1800-talets industrialisering, för den teknik vi har idag.

mercatorprojektionen-1569:
  period: 1560
  label: "Mercatorprojektionen 1569"
  title: "Mercatorprojektionen 1569"
  wiki:
    - "en:Mercator projection"
    - "sv:Gerardus Mercator"
  text: |
    En **kartprojektion** är en matematisk regel för hur jordklotets krökta yta ritas på ett platt papper. Det går inte att göra utan förvrängning; man måste välja vad som ska bevaras. Den flamländske kartografen **Gerardus Mercator** publicerade 1569 en världskarta där vinklar bevaras lokalt: en kurs med konstant kompassriktning blir en rak linje på kartan.

    För sjöfarare var det revolutionerande. Man kunde dra ett streck mellan två hamnar, läsa av vinkeln och styra efter kompassen. Priset är att ytor blir kraftigt förstorade mot polerna. Grönland ser ut att vara lika stort som Afrika men är i verkligheten ungefär 14 gånger mindre. Mercator konstruerade nätet geometriskt; den exakta formeln (som kräver en integral av sekansfunktionen) kom först senare, efter logaritmerna (se [Napier 1614](#napier-logaritmer-1614)).

    Projektionen är fortfarande standard i sjökort och – i en variant – i Google Maps, OpenStreetMap och de flesta webbkartor, eftersom den bevarar former lokalt när man zoomar. Den har kritiserats för att ge en skev bild av världens proportioner till Europas fördel.

    Jämför med den äldre globen [Behaims glob 1492](#behaims-glob-1492).

mikroskopet-1590:
  period: 1580
  label: "Mikroskopet (~1590)"
  title: "Mikroskopet (~1590)"
  wiki:
    - "sv:Mikroskop"
    - "sv:Antonie van Leeuwenhoek"
  text: |
    Glasögon hade funnits sedan 1200-talet i Italien, och Nederländerna hade på 1500-talet skickliga glasslipare. Kring 1590 kom de första **sammansatta mikroskopen** – ett rör med två linser, där den ena förstorar bilden från den andra. Uppfinningen tillskrivs ofta glasögonmakarna Hans och Zacharias Janssen i Middelburg, men uppgifterna är osäkra. Teleskopet ([se 1609](#teleskopet-1608)) kom från samma miljö och nästan samma teknik.

    De första mikroskopen förstorade bara omkring 3–10 gånger. Genombrottet kom senare. Robert Hooke beskrev 1665 i boken *[Micrographia](#hookes-micrographia-1665)* ”celler” i kork – ordet ”cell” kommer därifrån. Holländaren **[Antonie van Leeuwenhoek](#leeuwenhoek-bakterier-1676)** slipade på 1670-talet små enkla linser som förstorade upp till cirka 270 gånger och såg som förste människa bakterier, spermier och encelliga djur.

    Mikroskopet öppnade en helt ny värld, men kopplingen mellan mikrober och sjukdom bevisades först av Pasteur och Koch på 1860–80-talen – nästan 300 år senare. Jämför med elektronmikroskopet (1930-talet), som idag kan avbilda enskilda atomer.

logaritmer-napier-1614:
  period: 1600
  label: "Logaritmer (Napier 1614)"
  title: "Napiers logaritmer 1614"
  wiki:
    - "sv:Logaritm"
    - "sv:John Napier"
  text: |
    Astronomer och navigatörer kring 1600 måste multiplicera och dividera långa tal för hand, och det tog lång tid och gav fel. Den skotske adelsmannen och matematikern **John Napier** publicerade 1614 *Mirifici logarithmorum canonis descriptio*, där han beskrev logaritmer. En logaritm gör om multiplikation till addition: log(a·b) = log(a) + log(b). Med en tabell slår man upp logaritmerna, adderar dem och slår upp svaret baklänges.

    Napiers egen definition var krånglig. Engelsmannen **Henry Briggs** samarbetade med honom och publicerade 1617–1624 tabeller med tiologaritmer (bas 10), som blev standard. [Kepler](#kepler-planetlagarna-1609) använde logaritmer direkt i sina planetberäkningar; Laplace sades senare ha sagt att de genom att förkorta arbetet fördubblade astronomernas livslängd.

    Logaritmer låg till grund för [räknestickan](#raknestickan-1622) (uppfunnen på 1620-talet av William Oughtred), som ingenjörer använde i över 300 år – ända tills miniräknaren slog igenom på 1970-talet; Apolloprogrammet räknades till stor del fram med räknesticka. Idag är logaritmer centrala i allt från decibel och pH till komplexitetsanalys av algoritmer (O(log n)).

    Se även [Mercatorprojektionen 1569](#mercatorprojektionen-1569), vars exakta formel först kom efter logaritmerna.

kepler:
  period: 1600
  label: "Kepler"
  title: "Johannes Kepler (1571–1630)"
  wiki:
    - "sv:Johannes Kepler"
    - "en:Rudolphine Tables"
  text: |
    **Johannes Kepler** var en tysk astronom och matematiker och en av den vetenskapliga revolutionens nyckelfigurer. Han var protestant i ett Europa på väg in i trettioåriga kriget, och han tvingades flytta flera gånger; hans mor anklagades 1615 för häxeri (se [Häxprocesser](#haxprocesser)) och han försvarade henne själv i en flerårig process tills hon frikändes.

    1600 började han arbeta för Tycho Brahe i Prag och ärvde efter dennes död 1601 hans mätdata och tjänst som kejserlig matematiker. Ur dem härledde han sina tre planetlagar (se [Kepler 1609](#kepler-planetlagarna-1609)): planeterna går i ellipser, de rör sig fortare nära solen, och det finns ett exakt samband mellan omloppstid och avstånd. Han förklarade också hur linser och ögat fungerar och konstruerade en förbättrad teleskoptyp med två konvexa linser (1611).

    1627 publicerade han *Rudolfinska tabellerna*, planetpositionstabeller som var ungefär 30 gånger noggrannare än tidigare; beräkningarna underlättades av Napiers nya logaritmer ([se 1614](#napier-logaritmer-1614)). Med dem förutsade han en Merkuriuspassage över solen 1631. [Newton byggde sin gravitationsteori 1687](#newton-principia-1687) direkt på Keplers lagar.

harvey:
  period: 1620
  label: "Harvey"
  title: "William Harvey och blodomloppet 1628"
  wiki:
    - "sv:William Harvey"
    - "en:De Motu Cordis"
  text: |
    **William Harvey** (1578–1657) var en engelsk läkare, bland annat livläkare åt [kung Karl I](#karl-i). 1628 publicerade han boken *De motu cordis* (”Om hjärtats rörelse”), där han visade att [blodet cirkulerar i ett slutet kretslopp](#harvey-blodomloppet-1628): hjärtat pumpar ut det i artärerna och det kommer tillbaka genom venerna.

    Före Harvey dominerade läran från den romerske läkaren Galenos (ca 200 e.Kr.): blodet ansågs bildas i levern av födan och förbrukas i kroppen. Harvey använde ett kvantitativt argument som en datavetare kan uppskatta: han räknade ut hur mycket blod hjärtat pumpar per slag och fick fram att det per timme blir långt mer än kroppens vikt. Blodet måste alltså återanvändas. Han gjorde också experiment med avsnörda armar och studerade venklaffarna.

    Det var ett tidigt exempel på experimentell, mätande vetenskap inom medicinen. En lucka kvarstod: hur blodet tar sig från artärerna till venerna. Svaret – kapillärerna – sågs först [i mikroskop](#mikroskopet-1590) av Marcello Malpighi 1661 (jämför [Leeuwenhoek 1676](#leeuwenhoek-bakterier-1676)).

analytisk-geometri-descartes:
  period: 1620
  label: "analytisk geometri (Descartes)"
  title: "Analytisk geometri – Descartes 1637"
  wiki:
    - "sv:Analytisk geometri"
    - "sv:Kartesiskt koordinatsystem"
  text: |
    **Analytisk geometri** betyder att man beskriver geometriska figurer med tal och ekvationer. En punkt i planet blir ett talpar (x, y), en linje blir en ekvation som y = 2x + 1, och en cirkel blir x² + y² = r². Systemet med två vinkelräta axlar kallas fortfarande **kartesiskt koordinatsystem** efter Descartes (latin: Cartesius).

    Descartes beskrev metoden 1637 i bilagan *La Géométrie* till sin *[Discours de la méthode](#descartes-discours-1637)*. Fransmannen **Pierre de [Fermat](#fermat)** kom på liknande idéer ungefär samtidigt men publicerade dem inte. Descartes införde också mycket av den algebraiska notation vi använder: x, y, z för okända, a, b, c för kända storheter, och exponenter som x³.

    Betydelsen är svår att överskatta: geometri och algebra blev ett och samma språk. Det öppnade vägen för differential- och integralkalkylen hos [Newton och Leibniz](#newton-och-leibniz-differentialkalkyl) (1660–80-talen), och hela den moderna fysiken bygger på det. Varje datorgrafikprogram, GPS och CAD-system arbetar i grunden med kartesiska koordinater.

vakuumpumpen-guericke:
  period: 1640
  label: "Vakuumpumpen (Guericke)"
  title: "Guerickes vakuumpump"
  wiki:
    - "sv:Otto von Guericke"
    - "sv:Magdeburgska halvkloten"
  text: |
    **Otto von Guericke** (1602–1686) var borgmästare i Magdeburg i Tyskland, en stad som förstörts i [trettioåriga kriget](#trettioariga-kriget-1618), och samtidigt naturforskare. Omkring 1650 konstruerade han den första fungerande **vakuumpumpen** – i princip en cylinder med kolv och ventiler som steg för steg pumpade ut luften ur en behållare.

    Hans mest kända försök gjordes inför den tyske kejsaren 1654 och i Magdeburg 1657: två kopparhalvklot, cirka 50 cm i diameter, lades ihop och luften pumpades ut. Två spann om åtta hästar vardera kunde inte dra isär dem, eftersom lufttrycket utifrån pressade ihop dem med en kraft motsvarande ungefär två ton. När luften släpptes in föll de isär av sig själva. Försöket kallas de **magdeburgska halvkloten**.

    Guericke visade också att ljud inte går genom vakuum och att ljus slocknar där. Experimenten bekräftade [Torricellis slutsats från 1643](#torricellis-barometer-1643) att lufttrycket är verkligt. Engelsmannen Robert Boyle förbättrade pumpen och kom fram till [Boyles lag (1662)](#boyles-lag-1662) om gasers tryck och volym – grunden för senare [ångmaskiner](#newcomens-angmaskin-1712), där vakuum och tryck utförde arbete.

ljusets-hastighet-romer-1676:
  period: 1660
  label: "Ljusets hastighet (Rømer 1676)"
  title: "Rømer mäter ljusets hastighet 1676"
  wiki:
    - "en:Rømer's determination of the speed of light"
    - "sv:Ole Rømer"
  text: |
    Den danske astronomen **Ole Rømer**, verksam vid observatoriet i Paris, studerade Jupiters måne Io. Io går runt Jupiter på cirka 42,5 timmar och borde därför försvinna bakom Jupiter med exakt jämna mellanrum. Men Rømer såg att förmörkelserna kom för sent när jorden var på väg bort från Jupiter och för tidigt när den närmade sig. 1676 förutsade han att en förmörkelse skulle komma cirka 10 minuter sent – och fick rätt.

    Hans förklaring: ljuset behöver tid att färdas. Han uppskattade att ljuset tar cirka 22 minuter att korsa jordbanans diameter (rätt värde är ungefär 16,7 minuter). Med dåtidens mått på avstånden räknade [Christiaan Huygens](#huygens) fram cirka 220 000 km/s – rätt storleksordning mot det verkliga värdet 299 792 km/s.

    Tidigare trodde de flesta, bland andra [Descartes](#descartes-discours-1637), att ljuset gick omedelbart. Rømers resultat visade att ljusets hastighet är ändlig och mätbar. Det blev en grund för senare fysik – [Maxwells elektromagnetism](#maxwell-elektromagnetism) på 1860-talet och [Einsteins relativitetsteori 1905](#einstein-relativitetsteorin-1905) bygger båda på ljushastigheten som naturkonstant. I datatermer: ljuset går ungefär 30 cm per nanosekund.

newton-och-leibniz-differentialkalkyl:
  period: 1680
  label: "Newton och Leibniz: differentialkalkyl"
  title: "Newton, Leibniz och differentialkalkylen"
  wiki:
    - "sv:Infinitesimalkalkyl"
    - "sv:Gottfried Wilhelm von Leibniz"
    - "en:Leibniz–Newton calculus controversy"
  text: |
    **Differential- och integralkalkylen** (infinitesimalkalkyl) är matematiken för förändring: derivator mäter hur snabbt något ändras, integraler summerar oändligt många små bidrag. Den behövs för att beskriva rörelse, krafter, flöden – i dag grunden för fysik, ingenjörskonst, ekonomi och maskininlärning (gradientmetoder är derivator).

    Två personer utvecklade den oberoende av varandra. **Isaac Newton** i England arbetade fram sin version, "[fluxionsmetoden](#newton-fluxioner-1665)", omkring 1665–1666 men publicerade inte. Den tyske filosofen och diplomaten **Gottfried Wilhelm Leibniz** arbetade fram sin på 1670-talet och [publicerade 1684](#leibniz-publicerar-kalkylen-1684). Leibniz notation – dx, dy och integraltecknet ∫ – är den vi använder idag.

    Det blev en [bitter prioritetsstrid](#prioritetsstriden-newtonleibniz). [Royal Society](#royal-society), med Newton som ordförande, anklagade 1712 Leibniz för plagiat. Historiker anser idag att båda kom fram till det på egen hand. Striden gjorde att engelska matematiker höll fast vid Newtons klumpigare notation och halkade efter kontinenten i ungefär hundra år. Leibniz konstruerade för övrigt en mekanisk räknemaskin och studerade det binära talsystemet.

gravitationslagen:
  period: 1680
  label: "gravitationslagen"
  title: "Newtons gravitationslag"
  wiki:
    - "sv:Newtons gravitationslag"
  text: |
    **Gravitationslagen** säger att två kroppar drar till sig varandra med en kraft som är proportionell mot produkten av deras massor och omvänt proportionell mot kvadraten på avståndet: dubbla avståndet ger en fjärdedel av kraften. Isaac Newton publicerade den i [Principia 1687](#newton-principia-1687) (se den).

    Det nya var att samma kraft som får ett äpple att falla håller månen i bana runt jorden och planeterna runt solen. Ur lagen kunde Newton härleda [Johannes Keplers](#kepler-planetlagarna-1609) tre lagar för planeternas elliptiska banor, som Kepler funnit empiriskt ur observationer 1609–1619. Idén om en kraft som verkar på avstånd utan kontakt kritiserades av samtida, bland andra Leibniz, som "ockult".

    Lagen gjorde det möjligt att förutsäga. [Edmond Halley](#halley) räknade ut att en komet skulle återkomma 1758, och den gjorde det (Halleys komet). 1846 hittades planeten Neptunus genom beräkningar av störningar i Uranus bana. [Einstein ersatte 1915](#einstein-1905-och-1915) lagen med den allmänna relativitetsteorin, där gravitation är rumtidens krökning; skillnaden märks bara vid starka fält – men GPS-satelliter måste korrigera för den.

fahrenheit-termometern:
  period: 1700
  label: "Fahrenheit-termometern"
  title: "Fahrenheits termometer"
  wiki:
    - "sv:Daniel Gabriel Fahrenheit"
    - "sv:Fahrenheit"
  text: |
    **Daniel Gabriel Fahrenheit** (1686–1736) var en tysk instrumentmakare, född i Danzig (Gdańsk), verksam i Amsterdam. Omkring 1714 konstruerade han den första pålitliga kvicksilvertermometern. Tidigare termometrar använde alkohol och gav olika värden från instrument till instrument; Fahrenheits var tillräckligt likadana för att mätningar kunde jämföras.

    1724 publicerade han sin temperaturskala. Nollpunkten var en blandning av is, vatten och salmiak, den kallaste temperatur han kunde få fram i laboratoriet; 32 grader var vattnets fryspunkt och 96 grader ungefär människans kroppstemperatur. Med senare justeringar hamnade vattnets kokpunkt på 212 grader.

    1742 föreslog svensken **[Anders Celsius](#celsius-skalan-1742)** i Uppsala en skala med 100 grader mellan vattnets frys- och kokpunkt (ursprungligen omvänd, med 100 som fryspunkt). Celsius blev standard i nästan hela världen, men USA använder fortfarande Fahrenheit i vardagen. Exakt temperaturmätning blev viktig för kemi, meteorologi och senare för [ångmaskinernas](#angmaskinen) termodynamik.

angmaskinen:
  period: 1700
  label: "ångmaskinen"
  title: "Ångmaskinen"
  wiki:
    - "sv:Ångmaskin"
    - "sv:Industriella revolutionen"
  text: |
    En **ångmaskin** omvandlar värme till mekaniskt arbete: man kokar vatten, och ångans tryck – eller undertrycket när den kondenserar – driver en kolv. Det var den första maskin som gjorde människan oberoende av muskelkraft, vind och vattenfall som energikällor.

    Utvecklingen gick i steg. Thomas Savery patenterade 1698 en ångpump utan kolv. Thomas Newcomen byggde 1712 den första praktiska maskinen med kolv (se [Newcomens ångmaskin](#newcomens-angmaskin-1712)), för att pumpa vatten ur gruvor. Den var mycket ineffektiv, men vid kolgruvor var kolet billigt. James [Watts separata kondensor 1769](#watts-angmaskin-1769) och hans roterande maskin på 1780-talet gjorde den användbar för att driva fabriker. Högtrycksmaskiner kring 1800 blev små nog för lok och fartyg.

    Ångmaskinen var motorn i **[industriella revolutionen](#industriella-revolutionen-watts)**: textilfabriker, järnvägar ([Stephensons lok 1829](#stephensons-rocket-1829)), ångfartyg. Den gjorde också kol till grundlagen för ekonomin, och därmed började de koldioxidutsläpp som idag driver klimatförändringen. Termodynamiken, läran om värme och energi, växte fram på 1800-talet för att förstå just ångmaskiner.

smittkoppsympning-variolation-sprids:
  period: 1720
  label: "Smittkoppsympning (variolation) sprids"
  title: "Variolation mot smittkoppor"
  wiki:
    - "sv:Variolisering"
    - "sv:Smittkoppor"
  text: |
    **Smittkoppor** var en virussjukdom som dödade uppskattningsvis 20–30 % av de smittade och lämnade många överlevande ärrade eller blinda. På 1700-talet dog uppskattningsvis 400 000 européer per år; i Sverige stod den för omkring en av tio dödsfall. Den som överlevt blev immun.

    **Variolation** innebar att man medvetet smittade en frisk person med material från en smittkoppsblåsa, genom ett litet snitt i huden. Det gav oftast en mildare sjukdom; dödligheten var cirka 1–2 %, mot 20–30 % vid naturlig smitta. Metoden var känd sedan länge i Kina, Indien, Osmanska riket och Afrika. Lady Mary Wortley Montagu, gift med den brittiske ambassadören i Istanbul, lät variolera sina barn och [spred metoden i England 1721](#variolation-mot-smittkoppor-1721). Bostonläkaren Zabdiel Boylston prövade den samma år under en epidemi, efter tips från den förslavade afrikanen Onesimus.

    Metoden var omstridd eftersom den variolerade kunde smitta andra. Den ersattes av **[Edward Jenners vaccination](#jenners-vaccin-1796)** 1796, som använde den ofarliga kokoppan – ordet vaccin kommer av latinets vacca, ko. [1980 förklarades smittkoppor utrotade](#smittkoppor-utrotade-1980), den första sjukdom som människan utrotat.

franklin-blixten-ar-elektricitet-1752:
  period: 1740
  label: "Franklin: blixten är elektricitet 1752"
  title: "Franklin visar att blixten är elektricitet 1752"
  wiki:
    - "sv:Benjamin Franklin"
    - "en:Kite experiment"
  text: |
    **Benjamin Franklin** (1706–1790) var boktryckare i Philadelphia, självlärd vetenskapsman och senare en av USA:s grundare. På 1740-talet var elektricitet en salongskuriositet: man laddade upp glasstavar och [Leidenflaskor](#leidenflaskan-1745) (en tidig kondensator, uppfunnen 1745) och gav varandra stötar. Franklin misstänkte att blixten var samma fenomen i stor skala.

    Han föreslog ett experiment med en hög järnstång. Fransmannen Dalibard utförde det först, i maj 1752, och fick gnistor ur stången under ett åskmoln. Franklin gjorde enligt sin egen beskrivning samma sak med en [drake i juni 1752](#franklins-drake-1752) och laddade en Leidenflaska via en nyckel i draksnöret. Försöket var livsfarligt: Georg Richmann i Sankt Petersburg dödades 1753 när han gjorde liknande mätningar.

    Det praktiska resultatet var **[åskledaren](#askledaren)**, som snabbt spreds till kyrktorn och krutförråd. Franklin myntade också begreppen positiv och negativ laddning. Det tog sedan ett halvsekel till [Voltas batteri (1800)](#voltas-batteri-1800), som gav jämn ström i stället för korta urladdningar.

lind-citrus-mot-skorbjugg:
  period: 1740
  label: "Lind: citrus mot skörbjugg"
  title: "James Lind och citrus mot skörbjugg 1747"
  wiki:
    - "en:James Lind"
    - "sv:Skörbjugg"
  text: |
    **Skörbjugg** är en bristsjukdom som beror på för lite C-vitamin: tandköttet blöder, gamla sår går upp och till slut dör man. På långa sjöresor utan färsk mat var det sjömännens största dödsorsak. Under britten Ansons världsomsegling 1740–1744 dog uppskattningsvis över 1 000 av knappt 2 000 man, de flesta av skörbjugg.

    1747 gjorde den skotske skeppsläkaren **James Lind** ett försök ombord på HMS Salisbury. Han tog 12 sjuka sjömän med likartade symtom, delade dem i sex par och gav varje par en olika behandling: cider, utspädd svavelsyra, vinäger, havsvatten, en kryddblandning, eller två apelsiner och en citron om dagen. Bara citrusparet blev snabbt friskt. Det räknas som ett av de första kontrollerade kliniska försöken – idén bakom dagens läkemedelsprövningar.

    Lind publicerade resultatet 1753, men brittiska flottan införde citronsaft som standard först 1795, nästan 50 år senare. Själva C-vitaminet isolerades inte förrän på 1930-talet.

    Jämför med [Cartier vid S:t Lawrence 1534](#cartier-vid-s-t-lawrence-1534), där urinvånarna räddade franska sjömän från skörbjugg med ett avkok på barr.

lavoisier-syre-kemins-revolution:
  period: 1760
  label: "Lavoisier: syre, kemins revolution"
  title: "Lavoisier och kemins revolution"
  wiki:
    - "sv:Antoine Lavoisier"
    - "en:Phlogiston theory"
  text: |
    På 1700-talet förklarade kemister förbränning med **flogistonteorin**: brännbara ämnen skulle innehålla ett osynligt ämne, flogiston, som avgavs när de brann. Problemet var att metaller blev tyngre, inte lättare, när de oxiderade.

    Fransmannen **Antoine Lavoisier** (1743–1794) var förmögen skatteindrivare och använde sina pengar till de mest exakta vågar som fanns. Svensken Carl Wilhelm Scheele (omkring 1771) och engelsmannen Joseph Priestley (1774) hade framställt en gas som fick ljus att brinna starkare. Lavoisier förstod vad den var: ett grundämne som [förbrukas vid förbränning och andning](#lavoisier-andning-ar-forbranning). Han döpte det till *oxygène*, syre. Genom att väga allt före och efter visade han att massan bevaras i kemiska reaktioner.

    Hans lärobok 1789 införde den moderna kemiska namngivningen och en lista över grundämnen. Det gjorde kemin till en exakt, kvantitativ vetenskap – jämför med vad [Newton](#newton-principia-1687) gjorde för fysiken. Ironiskt nog blev hans skatteuppdrag hans död: under [franska revolutionen](#franska-revolutionen-1789) giljotinerades han 1794.

jenners-vaccin-1796:
  period: 1780
  label: "Jenners vaccin 1796"
  title: "Jenners smittkoppsvaccin 1796"
  wiki:
    - "sv:Edward Jenner"
    - "sv:Smittkoppor"
  text: |
    **Smittkoppor** var en virussjukdom som dödade omkring 20–30 procent av de smittade och lämnade överlevare ärrade, ofta blinda. I 1700-talets Europa dog uppskattningsvis 400 000 människor om året; i Sverige stod den för ungefär en tiondel av alla dödsfall. En äldre metod var *[variolation](#smittkoppsympning-variolation-sprids)*: man smittade avsiktligt friska med lite material från en smittkoppsblåsa och fick en lindrigare sjukdom, men det kunde ändå döda och sprida smittan.

    Den engelske lantläkaren **Edward Jenner** lade märke till folktron att mjölkerskor som haft kokoppor – en mild sjukdom från kor – inte fick smittkoppor. I maj 1796 tog han vätska från en mjölkerskas kokoppsblåsa och ympade in den på den åttaårige pojken James Phipps. Senare utsatte han pojken för smittkoppor, och han blev inte sjuk. Ordet **vaccin** kommer från latinets *vacca*, ko.

    Metoden spreds snabbt; Sverige var tidigt ute och införde obligatorisk vaccination 1816. Det var första gången människan kunde förebygga en sjukdom systematiskt. [1980 förklarade WHO smittkopporna utrotade](#smittkoppor-utrotade-1980) – den enda mänskliga sjukdom som utrotats hittills.

luftballong-1783:
  period: 1780
  label: "luftballong 1783"
  title: "Första luftballongfärderna 1783"
  wiki:
    - "sv:Bröderna Montgolfier"
    - "sv:Luftballong"
  text: |
    Bröderna **Joseph-Michel och Jacques-Étienne Montgolfier** drev ett pappersbruk i Annonay i södra Frankrike. De upptäckte att en påse av papper och tyg som fylldes med varm luft steg uppåt – varm luft är lättare än kall. I juni 1783 visade de en obemannad ballong offentligt, och i september steg en ballong i Versailles med ett får, en anka och en tupp som första passagerare, inför [Ludvig XVI](#ludvig-xvi-avrattas-1793).

    Den 21 november 1783 genomförde Pilâtre de Rozier och markisen d’Arlandes den första bemannade fria flygningen i en varmluftsballong över Paris: omkring 9 km på cirka 25 minuter. Bara tio dagar senare flög fysikern **Jacques Charles** en ballong fylld med vätgas, som är mycket lättare än luft – en konkurrerande teknik som visade sig bättre för långa färder. Han nådde ungefär 3 000 meters höjd.

    Det var första gången människor lämnade marken. Ballonger användes snart för spaning i krig (redan av [revolutionsarmén 1794](#revolutionskrigen)) och för vetenskapliga mätningar. Jämför: det dröjde 120 år till bröderna Wrights motorflygplan 1903. Pilâtre de Rozier blev också flygets första dödsoffer 1785.

daltons-atomteori:
  period: 1800
  label: "Daltons atomteori"
  title: "Daltons atomteori ca 1803–1808"
  wiki:
    - "sv:John Dalton"
    - "en:Atomic theory"
  text: |
    Den engelske kemisten och läraren **John Dalton** (1766–1844) lade fram den första vetenskapligt användbara atomteorin. Idén att materia består av odelbara partiklar fanns redan hos de antika grekerna, men Dalton gjorde den mätbar.

    Hans kärnpåståenden: varje grundämne består av likadana atomer med en bestämd vikt; olika grundämnen har olika atomvikter; kemiska föreningar bildas när atomer kombineras i enkla heltalsförhållanden. Det förklarade varför ämnen alltid reagerar i fasta viktproportioner, något kemister som [Lavoisier](#lavoisier-syre-kemins-revolution) observerat. Dalton publicerade den första tabellen över relativa atomvikter (väte = 1), även om många värden blev fel eftersom han gissade fel formel, t.ex. HO för vatten.

    Atomteorin blev grunden för den moderna kemin: svensken **Jöns Jacob Berzelius** mätte noggrannare atomvikter och införde de kemiska symbolerna vi använder idag (H, O, Fe), och Mendelejev ordnade grundämnena i det [periodiska systemet 1869](#periodiska-systemet-mendelejev-1869). Att atomer i sin tur består av mindre delar upptäcktes först runt 1900 ([elektronen 1897](#elektronen-1897), [atomkärnan 1911](#rutherford-atomkarnan-1911)).

anglok:
  period: 1800
  label: "ånglok"
  title: "Det första ångloket 1804"
  wiki:
    - "en:Richard Trevithick"
    - "sv:Ånglok"
  text: |
    Ett **ånglok** är ett fordon på räls som drivs av en ångmaskin: kol eldar en panna, ångan trycker kolvar fram och tillbaka och kolvarna vrider hjulen. Ångmaskinen hade funnits sedan [början av 1700-talet](#newcomens-angmaskin-1712) och förbättrats av [James Watt](#watts-angmaskin-1769), men var stor och tung och användes främst stillastående för att pumpa vatten ur gruvor.

    Den brittiske ingenjören **Richard Trevithick** byggde en ångmaskin med högtrycksånga, som var tillräckligt liten och stark för att flyttas. 1804 drog hans lok cirka 10 ton järn och 70 personer knappt 16 km vid ett järnbruk i Wales, med ungefär 8 km/h. Skenorna av gjutjärn sprack dock under tyngden.

    Under de följande två decennierna förbättrades loken av bland andra **George Stephenson**, främst vid kolgruvor där hästar tidigare dragit vagnarna. Genombrottet kom med järnvägen Stockton–Darlington 1825 och framför allt [Liverpool–Manchester 1830](#jarnvag-liverpoolmanchester-1830), den första moderna järnvägen för passagerare och gods. Före järnvägen var den snabbaste landtransporten en häst – kanske 10–15 km/h över kort sträcka.

faraday-induktion-1831:
  period: 1820
  label: "Faraday: induktion 1831"
  title: "Faraday upptäcker elektromagnetisk induktion 1831"
  wiki:
    - "sv:Michael Faraday"
    - "sv:Elektromagnetisk induktion"
  text: |
    **Michael Faraday** (1791–1867) var en brittisk fysiker och kemist som började som bokbindarlärling utan formell utbildning. 1820 hade dansken H.C. [Ørsted](#orsted-strom-ger-magnetism-1820) visat att en elektrisk ström skapar ett magnetfält. Faraday undrade om det omvända gällde.

    År 1831 visade han att ett **föränderligt** magnetfält skapar en elektrisk ström i en ledare – **elektromagnetisk induktion**. Om man rör en magnet genom en spole av koppartråd, eller roterar en ledare i ett magnetfält, uppstår ström. Han byggde den första enkla generatorn (en roterande kopparskiva mellan magnetpolerna) och den första transformatorn (två spolar på en järnring).

    Detta är principen bakom nästan all elproduktion idag: generatorer i vatten-, kärn-, vind- och kolkraftverk omvandlar rörelse till el genom induktion. Transformatorer, elmotorer, induktionshällar och trådlös laddning bygger på samma fenomen. Faraday kunde inte matematik nog att formulera teorin; det gjorde James Clerk Maxwell på 1860-talet (se [Maxwell: elektromagnetism](#maxwell-elektromagnetism)). Den praktiska elektrifieringen kom först på 1880-talet med Edison och Westinghouse.

kolerapandemier:
  period: 1820
  label: "kolerapandemier"
  title: "Kolerapandemierna på 1800-talet"
  wiki:
    - "sv:Kolera"
    - "en:1817–1824 cholera pandemic"
    - "en:1854 Broad Street cholera outbreak"
  text: |
    **Kolera** är en tarminfektion orsakad av bakterien *Vibrio cholerae*, som sprids via vatten eller mat förorenad med avföring. Den ger våldsamma diarréer och kan döda en frisk vuxen inom ett dygn genom uttorkning. Sjukdomen hade länge funnits kring Gangesdeltat i Indien.

    Från 1817 spreds den för första gången över världen, längs handels- och militärvägar som nu var snabbare och tätare än förr. Den andra pandemin nådde Europa och Nordamerika 1830–1832; Sverige drabbades från 1834, då över 12 000 dog. Under 1800-talet förekom sex pandemier, med sammanlagt tiotals miljoner döda, de flesta i Indien.

    Kolera fick stor betydelse för folkhälsan: Läkaren **[John Snow](#snow-kolera-och-vattenpumpen-1854)** visade 1854 i London att utbrottet kring en enskild vattenpump i Soho spreds via dricksvattnet, långt innan bakterien identifierades (av Robert Koch 1883). Detta ledde till att storstäderna byggde avloppssystem och rent vatten under andra halvan av 1800-talet – en av de största förbättringarna av livslängd i historien. Kolera finns fortfarande där rent vatten saknas.

fotografi:
  period: 1820
  label: "fotografi"
  title: "Fotografiets uppfinning 1826–1839"
  wiki:
    - "sv:Fotografiets historia"
    - "sv:Daguerreotypi"
  text: |
    Den så kallade *camera obscura* – en låda med ett hål eller en lins som projicerar en bild – var känd sedan länge. Problemet var att fånga bilden permanent. Lösningen var kemikalier, främst silversalter, som mörknar av ljus.

    Fransmannen **Nicéphore Niépce** tog den äldsta bevarade fotografiska bilden omkring 1826–1827, en utsikt från ett fönster; exponeringen tog flera timmar, kanske dagar. Hans kompanjon **Louis Daguerre** utvecklade metoden till **daguerreotypin**, som presenterades 1839: en skarp bild på en försilvrad kopparplåt, med exponeringstid på några minuter som snart kortades till sekunder. Varje bild var unik och kunde inte kopieras. Samtidigt uppfann britten **William Henry Fox Talbot** negativ-positivmetoden på papper, som gjorde att man kunde göra många kopior – principen som gällde för film fram till digitalkamerorna.

    Fotografiet förändrade hur människor såg världen: porträtt blev billiga, krig dokumenterades ([Krimkriget 1853](#krimkriget-1853), [amerikanska inbördeskriget](#inbordeskriget-186165)), och vetenskapen fick ett exakt registreringsinstrument. [Rörliga bilder kom på 1890-talet](#broderna-lumiere-film-1895), och den första digitalkameran 1975.

darwin-arternas-uppkomst-1859:
  period: 1840
  label: "Darwin: Arternas uppkomst 1859"
  title: "Darwin: Om arternas uppkomst 1859"
  wiki:
    - "sv:Om arternas uppkomst"
    - "sv:Charles Darwin"
  text: |
    **Charles Darwin** (1809–1882) var en engelsk naturforskare som 1831–1836 seglade jorden runt med fartyget *Beagle*. På Galápagosöarna och i Sydamerika samlade han fossil och iakttog hur arter skilde sig åt mellan närliggande öar. Han utvecklade under 20 år i hemlighet en teori, men publicerade först 1859 när en annan forskare, **Alfred Russel Wallace**, kommit fram till samma idé.

    Teorin om **naturligt urval**: individer i en art varierar; fler föds än kan överleva; de som råkar ha egenskaper som passar miljön bättre överlever och får fler avkommor, och egenskaperna förs vidare. Över väldigt lång tid – miljontals år – ger detta nya arter. Alla levande varelser har alltså gemensamma förfäder. Darwin visste inte hur ärftligheten fungerade; det svaret gav Mendel (se [Mendel: ärftlighet](#mendel-arftlighet)) och senare upptäckten av [DNA (1953)](#dna-strukturen-1953).

    Boken – första upplagan på 1 250 exemplar sålde slut direkt – väckte enorm debatt, eftersom den gjorde människan till en del av djurvärlden och ifrågasatte skapelseberättelsen. Den är grunden för all modern biologi. Idén missbrukades också i ”socialdarwinism” och rasbiologi, vilket Darwins teori i sig inte ger stöd för.

narkos-1846:
  period: 1840
  label: "narkos 1846"
  title: "Den första narkosen 1846"
  wiki:
    - "en:Ether Dome"
    - "sv:Narkos"
    - "en:William T. G. Morton"
  text: |
    Före 1846 skedde operationer utan bedövning. Patienten hölls fast medan kirurgen arbetade så snabbt som möjligt – en skicklig kirurg kunde amputera ett ben på under en minut. Alkohol och opium hjälpte föga. Kirurgi var därför en sista utväg, och många dog av chock.

    Den 16 oktober 1846 sövde tandläkaren **William Morton** en patient med **eter** (ett flyktigt lösningsmedel vars ånga orsakar medvetslöshet) på Massachusetts General Hospital i Boston, medan kirurgen tog bort en tumör från patientens hals. Patienten kände ingen smärta. Nyheten spreds med ångfartyg till Europa på några veckor, och eter användes i Sverige redan i början av 1847. Året efter introducerades **kloroform** av skotten James Simpson; drottning Viktoria använde det vid en förlossning 1853, vilket gjorde det socialt accepterat.

    Narkosen gjorde längre och mer komplicerade operationer möjliga. Men infektioner dödade fortfarande en stor del av de opererade, eftersom man inte förstod bakterier. Det förändrades först med [Semmelweis](#semmelweis), Pasteur och [Listers antiseptik](#lister-antiseptik-1867) på 1860-talet (se [Pasteur](#pasteur)). Tillsammans gjorde dessa genombrott modern kirurgi möjlig.

semmelweis:
  period: 1840
  label: "Semmelweis"
  title: "Ignaz Semmelweis och handtvätt 1847"
  wiki:
    - "sv:Ignaz Semmelweis"
  text: |
    **Ignaz Semmelweis** (1818–1865) var en ungersk läkare på Allmänna sjukhuset i Wien. Sjukhusets förlossningsavdelning hade två kliniker. På den ena, där läkarstudenter arbetade, dog omkring 10 % av mödrarna i **barnsängsfeber** (en blodförgiftning efter förlossning) – på den andra, där barnmorskor arbetade, bara omkring 4 %.

    När en kollega dog av en infektion efter att ha skurit sig vid en obduktion insåg Semmelweis 1847 sambandet: läkarna gick direkt från obduktioner av döda till att undersöka födande kvinnor och förde med sig något smittsamt (”likpartiklar”). Han införde handtvätt med klorkalklösning, och dödligheten sjönk till ca 1–2 %.

    Men han kunde inte förklara mekanismen – [bakterieteorin](#bakterieteorin) fanns ännu inte – och många läkare tog illa vid sig av tanken att de själva dödade patienter. Semmelweis blev alltmer bitter, publicerade sina resultat sent och fick inte gehör. Han dog 1865 på ett mentalsjukhus, sannolikt efter misshandel av personalen. Hans iakttagelser bekräftades några år senare genom [Pasteurs bakteriologi](#pasteur) och [Listers antiseptik](#lister-antiseptik-1867). Idag ses han som en pionjär för hygien i vården.

periodiska-systemet-mendelejev-1869:
  period: 1860
  label: "Periodiska systemet (Mendelejev 1869)"
  title: "Mendelejevs periodiska system 1869"
  wiki:
    - "sv:Periodiska systemet"
    - "sv:Dmitrij Mendelejev"
  text: |
    På 1860-talet kände kemister till ca 63 grundämnen – ämnen som inte kan delas upp kemiskt, som syre, järn och guld – men ingen förstod sambandet mellan dem. Den ryske kemisten **Dmitrij Mendelejev** ordnade 1869 grundämnena efter atomvikt i en tabell där ämnen med liknande egenskaper hamnade i samma kolumn.

    Det geniala var att han lämnade luckor och förutsade egenskaperna hos ännu okända ämnen. När gallium (1875), skandium (1879) och germanium (1886) upptäcktes och stämde med förutsägelserna blev systemet accepterat – ett tidigt exempel på en teori som gör testbara förutsägelser. Tysken Lothar Meyer kom fram till ett liknande system ungefär samtidigt.

    Varför periodiciteten finns förstod man först på 1900-talet, med elektronen (se ”[elektronen 1897](#elektronen-1897)”) och [kvantmekaniken](#kvantmekaniken-192526): det är elektronernas skal som avgör ämnenas kemi. Idag innehåller tabellen 118 grundämnen.

bakterieteorin:
  period: 1860
  label: "bakterieteorin"
  title: "Bakterieteorin – mikrober orsakar sjukdom"
  wiki:
    - "en:Germ theory of disease"
    - "sv:Louis Pasteur"
  text: |
    **Bakterieteorin** (”germ theory”) säger att många sjukdomar orsakas av mikroorganismer – bakterier, virus m.m. – som sprids mellan människor. Före 1860-talet trodde de flesta läkare att sjukdom kom från *miasma*, dålig luft från förruttnelse.

    Fransmannen **[Louis Pasteur](#pasteur)** visade på 1860-talet att jäsning och förruttnelse orsakas av mikrober och att de inte uppstår spontant; han utvecklade också pastörisering och vacciner (mjältbrand 1881, rabies 1885). Britten **[Joseph Lister](#lister-antiseptik-1867)** började 1867 desinficera operationssår med karbolsyra, och dödligheten efter amputationer sjönk kraftigt (enligt hans egna siffror från ca 45 % till ca 15 %). Tysken **Robert Koch** visade vilka bakterier som orsakar mjältbrand, [tuberkulos (1882)](#koch-tuberkelbakterien-1882) och kolera (1883).

    Teorin förklarade varför rent vatten, avlopp, handtvätt och sterilisering fungerar, och lade grunden för modern medicin. Den förväntade livslängden i Europa steg kraftigt under de följande 100 åren, mycket tack vare detta – långt före antibiotikan ([penicillin, 1928](#fleming-penicillin-1928)).

rontgenstralning:
  period: 1880
  label: "Röntgenstrålning"
  title: "Röntgenstrålning – en ny sorts ljus"
  wiki:
    - "sv:Röntgenstrålning"
    - "sv:Röntgenkristallografi"
  text: |
    **Röntgenstrålning** är elektromagnetisk strålning, samma sorts vågor som ljus och radio, men med mycket kortare våglängd (ungefär en tusendel av synligt ljus). Därför har den hög energi och kan tränga igenom material som stoppar vanligt ljus. Den upptäcktes av Wilhelm [Röntgen 1895](#rontgen-1895) (se ”Röntgen 1895”).

    Den uppstår när snabba elektroner bromsas in mot en metall. Mjukvävnad släpper igenom den medan ben, som innehåller tunga atomer som kalcium, absorberar den – därav skuggbilderna. 1912 visade Max von Laue att kristaller böjer av röntgenstrålar, och familjen Bragg utvecklade **röntgenkristallografi**, en metod att kartlägga atomernas läge. Den användes 1952 när Rosalind Franklin tog bilden som avslöjade [DNA:s dubbelspiral](#dna-strukturen-1953).

    Strålningen är joniserande – den kan skada DNA – vilket man förstod först efter att tidiga forskare och läkare skadats. Idag används den i sjukvård, datortomografi, säkerhetskontroller på flygplatser och i astronomi, där röntgenteleskop i rymden studerar svarta hål.

radioaktivitet:
  period: 1880
  label: "radioaktivitet"
  title: "Upptäckten av radioaktivitet 1896–1898"
  wiki:
    - "sv:Radioaktivitet"
    - "sv:Marie Curie"
  text: |
    År 1896 upptäckte fransmannen **Henri Becquerel** av en slump att uransalter svärtade fotografiska plåtar inlindade i svart papper, även utan solljus. Uranet strålade av sig självt. Marie Skłodowska-Curie, en polsk forskare i Paris, och hennes man Pierre undersökte fenomenet, gav det namnet **radioaktivitet** och upptäckte 1898 två nya grundämnen, polonium och radium, genom att bearbeta ton av uranmalm.

    Radioaktivitet innebär att instabila atomkärnor sönderfaller och sänder ut strålning. Ernest Rutherford visade kring 1900 att det fanns olika strålslag (alfa, beta, gamma) och att ett grundämne kan förvandlas till ett annat – alkemisternas dröm, men naturens egen. Becquerel och paret Curie delade Nobelpriset i fysik 1903; Marie fick även kemipriset 1911.

    Upptäckten visade att atomen inte är odelbar och att den rymmer enorma energimängder. Det ledde till atomfysiken, [kärnkraften](#karnkraft-1954), [atombomben 1945](#atombomben-1945), strålbehandling av cancer och kol-14-datering. Marie Curie dog 1934, sannolikt av strålningsskador.

elektronen-1897:
  period: 1880
  label: "elektronen 1897"
  title: "J.J. Thomson upptäcker elektronen 1897"
  wiki:
    - "sv:Elektron"
    - "sv:Joseph John Thomson"
  text: |
    År 1897 visade den brittiske fysikern **J.J. Thomson** i Cambridge att katodstrålar – strålarna i ett nästan lufttomt glasrör när man lägger på hög spänning – består av partiklar med negativ laddning. Genom att böja av strålarna med elektriska och magnetiska fält mätte han förhållandet mellan laddning och massa och fann att partiklarna var ungefär 1 000 gånger lättare än en väteatom (idag vet vi: ca 1 836 gånger).

    Partikeln fick namnet **elektron**. Det var den första kända subatomära partikeln och bevisade att atomen har inre delar. Thomson föreslog den s.k. ”russinkaksmodellen” med elektroner insprängda i en positiv massa; den ersattes 1911 av [Rutherfords modell](#rutherford-atomkarnan-1911) med en liten tung kärna.

    För en datavetare är kopplingen direkt: elektronikens hela historia – radiorör (1904), [transistorn (1947)](#transistorn-1947), integrerade kretsar och dagens processorer – bygger på att styra elektroners rörelse. Thomson fick Nobelpriset 1906. Det var även elektronernas skal som förklarade [Mendelejevs periodiska system](#periodiska-systemet-mendelejev-1869).

spanska-sjukan-1918-50-milj-doda:
  period: 1900
  label: "Spanska sjukan 1918 (~50 milj. döda)"
  title: "Spanska sjukan 1918–1920"
  wiki:
    - "sv:Spanska sjukan"
  text: |
    Spanska sjukan var en influensapandemi orsakad av ett influensavirus av typen H1N1. Den kallades ”spanska” bara för att det neutrala Spanien inte censurerade sina tidningar under [första världskriget](#forsta-varldskriget), så nyheterna kom därifrån. Var den började är oklart.

    Den kom i tre vågor 1918–1920. Uppskattningsvis 500 miljoner människor smittades, ungefär en tredjedel av jordens befolkning, och mellan 17 och 50 miljoner dog, enligt vissa uppskattningar fler. Det är fler än de omkring 17 miljoner som dog i hela första världskriget. Ovanligt var att unga friska vuxna i 20–40-årsåldern drabbades hårt. I Sverige dog omkring 34 000–38 000 personer.

    Jämför med [digerdöden 1347–51](#digerdoden-1-3-av-europa-dor) (kanske en tredjedel av Europas befolkning) och [covid-19](#covid-19) (omkring 7 miljoner rapporterade döda, troligen betydligt fler). Det fanns varken vaccin, antibiotika mot följdinfektioner ([penicillin upptäcktes 1928](#fleming-penicillin-1928)) eller ens kunskap om att influensa orsakas av virus – det påvisades först 1933.

kvantmekanik:
  period: 1920
  label: "Kvantmekanik"
  title: "Kvantmekaniken"
  wiki:
    - "sv:Kvantmekanik"
    - "en:History of quantum mechanics"
  text: |
    Kvantmekaniken är den fysikaliska teorin för hur atomer, elektroner och ljus beter sig. Den växte fram 1900–1930. **[Max Planck](#planck-kvanta)** föreslog 1900 att energi avges i små paket, kvanta, och **Albert Einstein** förklarade 1905 ljus som partiklar (fotoner). **[Niels Bohr](#bohr-1913)** i Köpenhamn gav 1913 en atommodell där elektroner bara kan ha vissa energinivåer.

    Den egentliga teorin formulerades 1925–27 av bland andra **Werner Heisenberg** och **Erwin Schrödinger**. Centralt är att partiklar beskrivs av en vågfunktion som bara ger sannolikheter för mätresultat, och osäkerhetsprincipen: man kan inte samtidigt veta både en partikels exakta läge och rörelsemängd. Einstein ogillade detta och sa att Gud inte spelar tärning.

    Kvantmekaniken är grunden för nästan all modern teknik: [transistorn (1947)](#transistorn-1947) och därmed datorer, lasern, LED, MRI-kameror, solceller och atomklockor (som GPS bygger på). Den är också basen för kvantdatorer och kvantkryptografi. Se även [kärnklyvning 1938](#karnklyvning-1938).

hubble-universum-expanderar:
  period: 1920
  label: "Hubble: universum expanderar"
  title: "Hubble: universum expanderar"
  wiki:
    - "sv:Edwin Hubble"
    - "sv:Hubbles lag"
  text: |
    Den amerikanske astronomen **Edwin Hubble** arbetade vid Mount Wilson-observatoriet i Kalifornien, då med världens största teleskop (2,5 m spegel). 1924 visade han att vissa suddiga ”nebulosor” var galaxer långt utanför vår egen Vintergatan. Universum var alltså mycket större än man trott.

    1929 visade han att ju längre bort en galax ligger, desto snabbare rör den sig bort från oss – ljuset från den är förskjutet mot rött, ungefär som en sirens ton sjunker när den åker bort. Sambandet kallas Hubbles lag (numera Hubble–Lemaîtres lag, efter den belgiske prästen och fysikern **Georges Lemaître** som förutsagt det 1927). Slutsatsen: universum expanderar.

    Spolar man tillbaka expansionen måste allt ha börjat i ett mycket tätt tillstånd, det som kallas Big Bang. Dagens uppskattning av universums ålder är omkring 13,8 miljarder år. [Einstein hade lagt till](#einstein-1905-och-1915) en term i sina ekvationer för att få ett statiskt universum och kallade det senare sitt största misstag. [Rymdteleskopet Hubble (1990)](#hubbleteleskopet-1990) är uppkallat efter honom.

karnklyvning-1938:
  period: 1920
  label: "kärnklyvning 1938"
  title: "Kärnklyvningen upptäcks 1938"
  wiki:
    - "sv:Kärnklyvning"
    - "sv:Lise Meitner"
  text: |
    I december 1938 bombarderade de tyska kemisterna **Otto Hahn** och **Fritz Strassmann** i Berlin uran med neutroner och fann barium, ett mycket lättare grundämne. Den österrikiska fysikern **Lise Meitner**, som flytt från Nazityskland till Sverige, förklarade resultatet under julhelgen i Kungälv tillsammans med sin brorson Otto Frisch: urankärnan hade klyvts i två delar. Hahn fick ensam Nobelpriset 1944.

    Vid klyvningen frigörs enorm energi, enligt [Einsteins E = mc²](#einstein-1905-och-1915), ungefär 200 miljoner elektronvolt per kärna – miljoner gånger mer än i en kemisk reaktion. Ett kilo uran-235 motsvarar omkring 2 700 ton kol. Dessutom frigörs nya neutroner, vilket gör en kedjereaktion möjlig.

    Fysiker insåg genast den militära potentialen. Einstein skrev 1939 ett brev till Roosevelt, vilket ledde till [Manhattanprojektet](#manhattanprojektet) och atombomberna mot [Hiroshima och Nagasaki 1945](#hiroshima-nagasaki-1945). Samma fenomen driver [kärnkraften](#karnkraft-1954); Sveriges första reaktor startade 1954.

eniac:
  period: 1940
  label: "ENIAC"
  title: "ENIAC 1945 – den första stora elektroniska datorn"
  wiki:
    - "sv:ENIAC"
    - "en:Von Neumann architecture"
  text: |
    **ENIAC** (Electronic Numerical Integrator and Computer) byggdes 1943–45 vid University of Pennsylvania av John Mauchly och J. Presper Eckert, beställd av amerikanska armén för att räkna ut skjuttabeller för artilleri – tabeller över hur en granat flyger beroende på vinkel, vind och laddning. Den visades offentligt i februari 1946.

    Den var enorm: omkring 17 500 elektronrör (glödande glasrör som fungerar som strömbrytare, föregångare till transistorn), 30 ton, golvyta som en stor villa och ungefär 150 kW effekt. Den klarade cirka 5 000 additioner per sekund – tusen gånger snabbare än tidigare elektromekaniska maskiner. En modern mobiltelefon gör grovt räknat hundratals miljarder gånger fler operationer per sekund.

    ENIAC programmerades genom att man drog om kablar och ställde om vred, ett arbete som tog dagar och sköttes av sex kvinnliga programmerare. Erfarenheterna ledde till idén om ett lagrat program i minnet, beskrivet av John [von Neumann](#von-neumann) 1945 – grunden för nästan alla datorer sedan dess. ENIAC var inte ensam: britternas Colossus knäckte tyska koder 1944 och tysken Konrad Zuse byggde reläbaserade [Z3 1941](#zuses-z3-1941). Sveriges första elektroniska dator, BESK, kom 1953. Se även [transistorn 1947](#transistorn-1947).

transistorn-1947:
  period: 1940
  label: "transistorn 1947"
  title: "Transistorn 1947"
  wiki:
    - "sv:Transistor"
    - "en:History of the transistor"
  text: |
    I december 1947 visade **John Bardeen** och **Walter Brattain** vid Bell Labs, telefonbolaget AT&T:s forskningslaboratorium, den första fungerande transistorn; deras chef **William Shockley** utvecklade strax en bättre variant. En transistor är en strömbrytare eller förstärkare i ett halvledarmaterial (först germanium, sedan kisel), styrd av en liten ström eller spänning – utan rörliga delar.

    Den ersatte elektronröret, som var stort, drog mycket ström, blev varmt och gick sönder ofta (ENIAC hade 17 500 sådana, se [ENIAC](#eniac)). Transistorn var liten, snål och höll i princip för evigt. Den första massprodukten var transistorradion på 1950-talet; Sony byggde sitt namn på den. De tre fick Nobelpriset i fysik 1956.

    Shockley flyttade 1956 till Kalifornien och grundade ett företag. Åtta av hans medarbetare lämnade honom och startade Fairchild Semiconductor, varifrån bland annat Intel knoppades av – så föddes Silicon Valley. Nästa steg blev att bygga många transistorer på samma kiselbit, se [mikrochip](#mikrochip). I dag har de största chippen tiotals miljarder transistorer, och transistorn är troligen den mest tillverkade produkten i mänsklighetens historia.

dna-strukturen-1953:
  period: 1940
  label: "DNA-strukturen 1953"
  title: "DNA:s struktur upptäcks 1953"
  wiki:
    - "sv:DNA"
    - "en:Molecular structure of Nucleic Acids"
  text: |
    Man visste sedan 1940-talet att arvsanlagen satt i molekylen **DNA**, men inte hur den såg ut eller hur den kunde kopieras. I april 1953 publicerade **James Watson** och **Francis Crick** i Cambridge modellen av DNA som en dubbelspiral: två strängar som vrider sig runt varandra, sammanhållna av par av ”baser”, kemiska bokstäver. A passar bara ihop med T, och G bara med C.

    Det förklarade direkt hur arv fungerar: dra isär strängarna, så kan varje sträng användas som mall för en ny kopia. Modellen byggde avgörande på [röntgenbilder](#rontgenstralning) av **Rosalind Franklin**, som togs fram vid King's College i London och visades för Watson utan hennes vetskap. Watson, Crick och Maurice Wilkins fick Nobelpriset 1962; Franklin hade då dött 1958.

    För en datavetare: DNA är en kod med fyra tecken, alltså 2 bitar per bas. Människans arvsmassa har omkring 3 miljarder baspar, ungefär 750 MB. Att läsa den första gången ([Human Genome Project, klart 2003](#manniskans-genom-2003)) kostade omkring 3 miljarder dollar; i dag kostar det några hundra dollar. Upptäckten ledde till genteknik, gentester, kriminalteknik, [mRNA-vacciner](#mrna-vacciner) och gensaxen [CRISPR](#crispr).

poliovaccin:
  period: 1940
  label: "poliovaccin"
  title: "Poliovaccinet 1955"
  wiki:
    - "sv:Polio"
    - "en:Polio vaccine"
  text: |
    **Polio** (barnförlamning) är en virussjukdom som sprids via förorenat vatten och kontakt. De flesta smittade märker lite, men omkring 1 av 200 får förlamningar, ofta barn. Om andningsmusklerna förlamas krävs en ”järnlunga” – en tank som pumpar luft i lungorna. Under 1940–50-talen kom stora epidemier i västvärlden; i USA insjuknade 1952 omkring 58 000. President Franklin D. Roosevelt hade förlamats 1921 av vad som diagnostiserades som polio.

    **Jonas Salk** tog fram ett vaccin av avdödat virus som provades 1954 på omkring 1,8 miljoner amerikanska barn – ett av de största medicinska försöken någonsin – och godkändes i april 1955. Salk tog inget patent. Några år senare kom **Albert Sabins** vaccin av försvagat levande virus som kunde ges som droppar på en sockerbit, billigare och lättare att ge i stor skala.

    Sverige använde Salks typ av vaccin och började vaccinera 1957. Fallen försvann snabbt i rika länder. 1988 startade WHO ett globalt utrotningsprogram; då fanns uppskattningsvis 350 000 fall per år. I dag är fallen över 99 procent färre och vilt poliovirus finns bara kvar i Pakistan och Afghanistan. Jämför med [smittkoppor](#smittkoppor-utrotade-1980), den enda människosjukdom som hittills utrotats (1980).

lasern:
  period: 1960
  label: "Lasern"
  title: "Lasern 1960"
  wiki:
    - "sv:Laser"
    - "en:Theodore Maiman"
  text: |
    En **laser** ger ljus där alla vågor har samma våglängd och svänger i takt, vilket gör att strålen kan hållas mycket smal och koncentrerad. Principen, stimulerad emission, beskrevs teoretiskt av Albert Einstein 1917: en atom i högt energitillstånd kan förmås att sända ut en foton som är exakt likadan som den som träffar den. Ordet är en förkortning av ”light amplification by stimulated emission of radiation”.

    1954 byggde Charles Townes en motsvarande apparat för mikrovågor (masern). Den 16 maj 1960 fick **Theodore Maiman** vid Hughes Research Laboratories i Kalifornien den första lasern att fungera, med en rubinkristall och en blixtlampa. Den kallades länge ”en lösning som söker ett problem” – ingen visste vad den skulle användas till.

    I dag finns lasrar överallt: i fiberoptiken som bär nästan all internettrafik mellan kontinenter, i streckkodsläsare, cd/dvd/Blu-ray, laserskrivare, ögonoperationer, svetsning och skärning, avståndsmätning (lidar) och i tillverkningen av [mikrochip](#mikrochip), där extremt ultraviolett ljus från laserskapad plasma används för att rita kretsar på några nanometer. [Gravitationsvågor upptäcktes 2015](#gravitationsvagor-2015) med laserinterferometrar som kan mäta avstånd mindre än en protons diameter.

mikrochip:
  period: 1960
  label: "mikrochip"
  title: "Mikrochippet – integrerade kretsar"
  wiki:
    - "sv:Integrerad krets"
    - "sv:Moores lag"
  text: |
    Ett mikrochip, eller **integrerad krets**, är många transistorer (se [transistorn 1947](#transistorn-1947)) och deras ledningar tillverkade tillsammans på en enda bit halvledare. Tidigare löddes varje transistor fast för hand, och komplexa kretsar blev dyra och opålitliga – ”siffrornas tyranni”.

    1958 visade **Jack Kilby** på Texas Instruments en krets på germanium, och 1959 utvecklade **Robert Noyce** på Fairchild Semiconductor en version i kisel där ledningar lades i ett plant lager ovanpå – den metod som blev standard. Tidiga stora kunder var Apolloprogrammet (se [månlandningen 1969](#manlandningen-1969)) och kärnvapenrobotar, som betalade höga priser och drev ner kostnaden. 1965 noterade Gordon Moore att antalet transistorer per chip fördubblades ungefär varje år, senare reviderat till vartannat år – **Moores lag**.

    Noyce och Moore grundade Intel 1968, och 1971 kom [Intel 4004](#intel-4004-1971), den första mikroprocessorn: en hel processor på ett chip med 2 300 transistorer. Det ledde till [persondatorer](#persondatorn), mobiltelefoner och allt annat digitalt. Dagens största chip har över 100 miljarder transistorer – en ökning med en faktor på ungefär 50 miljoner på 50 år. Kilby fick Nobelpriset 2000. Tillverkningen är i dag koncentrerad till Taiwan (TSMC), en strategisk fråga mellan USA och Kina.

p-piller:
  period: 1960
  label: "p-piller"
  title: "P-pillret 1960"
  wiki:
    - "sv:P-piller"
    - "en:Combined oral contraceptive pill"
  text: |
    P-pillret är ett hormonpreparat som tas dagligen och förhindrar ägglossning, och därmed graviditet. Forskningen finansierades främst av den amerikanska kvinnorättsaktivisten Katharine McCormick och drevs av födelsekontrollaktivisten **Margaret Sanger**, med biologen **Gregory Pincus** och läkaren John Rock. Det byggde på syntetiska könshormoner som kemister i Mexiko och USA tagit fram i början av 1950-talet.

    1960 godkändes det första p-pillret, Enovid, i USA. Det var det första läkemedlet avsett för friska människor att ta varje dag. I flera amerikanska delstater var preventivmedel fortfarande olagliga och blev det för gifta par först 1965. Sverige godkände p-piller 1964. De tidiga pillren hade betydligt högre hormondoser än dagens, med ökad risk för blodproppar.

    För första gången kunde kvinnor själva och säkert styra när de skaffade barn. Det var en viktig förutsättning för att kvinnor utbildade sig längre och arbetade i större utsträckning från 1960–70-talen, och för den sexuella revolutionen. Tillsammans med fri abort (i Sverige 1975) bidrog det till sjunkande barnafödande i västvärlden. Katolska kyrkan förbjöd p-piller för katoliker 1968. I dag använder uppskattningsvis 150 miljoner kvinnor p-piller.

    Se även [maj 1968](#maj-1968).

aids:
  period: 1980
  label: "AIDS"
  title: "Aids – en ny global pandemi"
  wiki:
    - "sv:Aids"
    - "en:HIV/AIDS"
  text: |
    I juni 1981 rapporterade amerikanska smittskyddsmyndigheten CDC om fem unga homosexuella män i Los Angeles med en ovanlig lunginflammation som normalt bara drabbar personer med svårt nedsatt immunförsvar. Sjukdomen fick namnet **aids** (förvärvat immunbristsyndrom) 1982. 1983 [identifierade forskare vid Pasteurinstitutet i Paris orsaken](#hiv-identifieras-1983), ett virus senare kallat **hiv**.

    Under 1980-talet var en diagnos i praktiken en dödsdom. Sjukdomen omgavs av stigma, eftersom de först drabbade var homosexuella män, sprutnarkomaner och blödarsjuka som fått smittat blod. Det första läkemedlet, AZT, kom 1987, men det verkliga genombrottet var kombinationsbehandling 1996, där tre läkemedel samtidigt håller viruset nere.

    Globalt har omkring 90 miljoner smittats och runt 40 miljoner dött – flest i Afrika (se [hiv](#hiv) under Afrika). Det finns fortfarande inget vaccin, trots 40 års försök, eftersom viruset muterar snabbt. Pandemin förändrade synen på sexualupplysning, patienträttigheter och snabbare läkemedelsgodkännanden. Jämför med [spanska sjukan 1918](#spanska-sjukan-1918-50-milj-doda) (uppskattningsvis 50 miljoner döda på två år) och [Covid-19](#covid-19).

persondatorn:
  period: 1980
  label: "persondatorn"
  title: "Persondatorns genombrott"
  wiki:
    - "sv:Persondator"
    - "en:History of personal computers"
  text: |
    En **persondator** är en dator som en enskild person äger och använder själv – i motsats till de stora delade datorerna (stordatorer) på företag och universitet. Det blev möjligt tack vare **mikroprocessorn**, en hel processor på ett enda chip ([Intel 4004](#intel-4004-1971), 1971). De första byggsatserna kom 1975 (Altair 8800), och 1977 lanserades färdiga hemdatorer som Apple II och Commodore PET.

    Under 1980-talet exploderade marknaden. [IBM PC (1981)](#ibm-pc-1981) och dess kloner tog kontoren, medan billiga hemdatorer som Commodore 64 (uppskattningsvis 12–17 miljoner sålda, den mest sålda enskilda datormodellen) och i Sverige ABC 80 tog hemmen och skolorna. Apples Macintosh (1984) och senare Microsoft Windows gjorde grafiska gränssnitt med fönster och mus till standard – idéer som utvecklats vid Xerox PARC på 1970-talet.

    Prestandan följde **Moores lag**, iakttagelsen att antalet transistorer på ett chip fördubblas ungefär vartannat år. Kring 1990 fanns datorer i en stor del av västvärldens kontor, vilket gjorde att [webben (1991)](#webben) snabbt fick användare. Jämför med [boktryckarkonsten ~1450](#gutenbergs-tryckpress-1450): båda gjorde ett tidigare elitverktyg till ett massverktyg.

webben:
  period: 1980
  label: "webben"
  title: "World Wide Web 1989–1991"
  wiki:
    - "sv:World Wide Web"
    - "en:History of the World Wide Web"
    - "sv:Tim Berners-Lee"
  text: |
    **Webben** (World Wide Web) uppfanns av den brittiske fysikern och programmeraren **Tim Berners-Lee** vid partikelfysiklaboratoriet **CERN** utanför Genève. 1989 föreslog han ett system för att länka dokument mellan datorer, och 1990–91 skrev han de tre grundstenarna: HTML (språket för sidor), HTTP (protokollet för att hämta dem) och URL (adresser), plus den första webbläsaren och servern.

    Webben byggde ovanpå **internet**, nätverket av nätverk som vuxit fram ur amerikanska militärforskningsnätet [ARPANET (1969)](#arpanet-1969) och TCP/IP-protokollen (1983). Internet hade e-post och filöverföring men var svårt för vanligt folk. CERN släppte webben fritt och avgiftsfritt 1993, samma år som den grafiska webbläsaren Mosaic kom – två avgörande skäl till att den slog ut konkurrerande system som Gopher.

    Tillväxten var extrem: från cirka 130 webbplatser 1993 till uppskattningsvis 10–20 miljoner år 2000 och över en miljard i dag. Webben möjliggjorde e-handel (Amazon 1994), sökmotorer (Google 1998) och senare sociala medier. Den ledde också till IT-bubblan som sprack år 2000. Se även [sociala medier](#sociala-medier) och [generativ AI](#generativ-ai).

mobiltelefonen:
  period: 1980
  label: "mobiltelefonen"
  title: "Mobiltelefonen och GSM"
  wiki:
    - "sv:Mobiltelefon"
    - "sv:GSM"
    - "en:History of mobile phones"
  text: |
    Den första handhållna mobiltelefonen till försäljning, Motorola DynaTAC 8000X, kom 1983. Den vägde nästan ett kilo, gav 30 minuters samtalstid och kostade nära 4 000 dollar. Redan 1981 hade de nordiska länderna startat **NMT** (Nordisk MobilTelefon), ett av världens första automatiska mobilnät som fungerade över landsgränser – en tidig nordisk ledarposition.

    Det stora genombrottet var **[GSM](#gsm-1991)**, en europeisk standard för digital mobiltelefoni, med första samtalet 1991 och snabb spridning under 1990-talet. Digital överföring gav bättre ljud, SIM-kort och SMS (första sms:et skickades 1992). Eftersom hela Europa valde samma standard fick tillverkare enorma skalfördelar. Svenska **Ericsson** och finska **Nokia** blev världsledande; Nokia var världens största mobiltillverkare 1998–2011.

    Spridningen gick fortare än för någon tidigare teknik: från cirka 11 miljoner abonnemang i världen 1990 till omkring 740 miljoner år 2000 och fler abonnemang än människor i dag. I Afrika och Asien hoppade många länder över fasta telefonnät helt. Jämför med [telefonen (1876)](#bells-telefon-1876), som tog nästan ett sekel att nå de flesta hushåll i rika länder. Se även [iPhone 2007](#iphone-2007).

manniskans-genom-2003:
  period: 2000
  label: "Människans genom 2003"
  title: "Människans genom kartläggs 2003"
  wiki:
    - "sv:Humangenomprojektet"
    - "en:Human Genome Project"
  text: |
    Ett **genom** är hela arvsmassan hos en organism: all DNA, som i en människa består av ungefär 3 miljarder baspar – "bokstäver" av fyra sorter (A, C, G, T). **Humangenomprojektet** var ett internationellt forskningsprojekt som startade 1990 för att läsa av hela sekvensen. Det drevs av offentliga forskare i bland annat USA och Storbritannien, och från 1998 i kapplöpning med det privata företaget Celera under Craig Venter.

    Ett första utkast presenterades 2000 och projektet förklarades i stort sett färdigt i april 2003, 50 år efter att Watson och Crick beskrivit [DNA:s dubbelspiral 1953](#dna-strukturen-1953). Det kostade cirka 3 miljarder dollar. En överraskning var att människan bara har omkring 20 000 gener som kodar för proteiner – ungefär lika många som en rundmask, och långt färre än de 100 000 som många väntat sig.

    Det verkliga genomslaget kom med nya sekvenseringsmetoder. Kostnaden för att läsa ett helt genom föll från miljarder till runt 1 000 dollar kring 2015 och ännu lägre i dag – snabbare än Moores lag för datorer. Det möjliggjorde genetisk diagnostik, cancerforskning, släktforskning med DNA, studier av neandertalares DNA (Svante Pääbo, Nobelpris 2022) och snabb [sekvensering av covid-viruset 2020](#covid-19). Se även [CRISPR](#crispr).

higgs-2012:
  period: 2000
  label: "Higgs 2012"
  title: "Higgsbosonen upptäcks 2012"
  wiki:
    - "sv:Higgsboson"
    - "en:Higgs boson"
    - "sv:Large Hadron Collider"
  text: |
    Den 4 juli 2012 meddelade partikelfysiklaboratoriet **CERN** utanför Genève att man hittat en ny partikel som passade med **Higgsbosonen**. Den förutsades teoretiskt redan 1964 av bland andra Peter Higgs och François Englert, som fick Nobelpriset i fysik 2013. Partikeln är ett tecken på Higgsfältet, som enligt teorin fyller hela universum och ger elementarpartiklar deras massa.

    Higgsbosonen var den sista saknade biten i **standardmodellen**, den teori som beskriver alla kända elementarpartiklar och tre av de fyra naturkrafterna (inte gravitationen). Att hitta den krävde världens största maskin: **Large Hadron Collider** (LHC), en 27 km lång cirkulär tunnel cirka 100 meter under marken, där protoner accelereras till nästan ljusets hastighet och krockar. Den kostade uppskattningsvis 5 miljarder dollar att bygga, och experimenten involverade tusentals forskare. Krockarna producerade så mycket data att CERN byggde ett världsomspännande datornät för att analysera dem.

    Upptäckten bekräftade teorin men gav inga ledtrådar om de stora öppna frågorna, som vad mörk materia är. Jämför med [webben](#webben-berners-lee-1989), som också uppfanns på CERN (1989).

crispr:
  period: 2000
  label: "CRISPR"
  title: "CRISPR – gensaxen"
  wiki:
    - "sv:CRISPR"
    - "en:CRISPR gene editing"
  text: |
    **CRISPR-Cas9**, populärt kallad gensaxen, är en metod för att klippa i DNA på en exakt vald plats och därmed ändra gener. Den bygger på ett försvarssystem som bakterier använder mot virus: bakterien sparar bitar av virus-DNA och använder ett protein (Cas9) styrt av en matchande RNA-molekyl för att hitta och klippa sönder viruset vid nästa angrepp.

    2012 visade **Emmanuelle Charpentier** (som då forskade i Umeå) och **Jennifer Doudna** att systemet kan programmeras att klippa var som helst i valfritt DNA genom att byta ut styr-RNA:t. De fick Nobelpriset i kemi 2020, ovanligt snabbt. Tidigare metoder för genredigering var dyra och tog månader; CRISPR gjorde det billigt och enkelt nog för vanliga laboratorier – ungefär som att gå från hålkort till textredigerare.

    Tillämpningarna är många: växtförädling, forskning och sjukdomsbehandling. 2023 godkändes den första CRISPR-behandlingen, Casgevy, mot sicklecellanemi, en ärftlig blodsjukdom. Tekniken väcker också etiska frågor. 2018 meddelade den kinesiske forskaren He Jiankui att han redigerat gener i embryon som blivit två tvillingflickor, vilket fördömdes världen över och gav honom fängelse. Se även [Människans genom 2003](#manniskans-genom-2003).

sociala-medier:
  period: 2000
  label: "sociala medier"
  title: "Sociala medier"
  wiki:
    - "sv:Sociala medier"
    - "en:Social media"
  text: |
    **Sociala medier** är webbtjänster där användarna själva skapar innehållet och kopplas ihop i nätverk. **Facebook** startades 2004 av Harvardstudenten Mark Zuckerberg, YouTube kom 2005 och Twitter 2006. Med smartphonen ([iPhone 2007](#iphone-2007)) blev de något man använde hela dagen. Facebook nådde en miljard användare 2012; i dag har de största plattformarna tillsammans flera miljarder.

    Affärsmodellen är reklam: tjänsterna är gratis, och företagen tjänar pengar på att samla data om användarna och visa riktad reklam. Därför optimeras flödena med algoritmer för att hålla kvar uppmärksamheten så länge som möjligt. Från omkring 2016 blev kinesiska **TikTok**, med korta videor och ett mycket effektivt rekommendationssystem, en av de snabbast växande.

    Effekterna är omdebatterade. Sociala medier spelade roll för att organisera protester under [arabiska våren 2011](#arabiska-varen-2011), men också för desinformation och polarisering. Facebook har kritiserats för sin roll i våldet mot rohingyafolket i Myanmar 2017, och skandalen kring Cambridge Analytica 2018 visade hur data om 87 miljoner användare samlats in för politisk påverkan. Debatten om ungas psykiska hälsa och skärmtid pågår. Jämför med [tryckpressen ~1450](#gutenbergs-tryckpress-1450) och radion, som också förändrade hur nyheter och propaganda spreds.

covid-19:
  period: 2020
  label: "Covid-19"
  title: "Covid-19-pandemin"
  wiki:
    - "sv:Covid-19-pandemin"
    - "en:COVID-19 pandemic"
  text: |
    **Covid-19** är sjukdomen som orsakas av coronaviruset SARS-CoV-2. Den upptäcktes i Wuhan i Kina i december 2019 (se [Covid-19 (Wuhan)](#covid-19-wuhan)) och förklarades som pandemi – en epidemi som sprids över hela världen – av WHO den 11 mars 2020. Viruset smittar via luften, ofta innan man har symtom, vilket gjorde det mycket svårare att stoppa [än till exempel ebola](#ebola-2014). De flesta fick milda symtom, men risken för död steg kraftigt med ålder.

    Våren 2020 stängde många länder skolor, gränser och företag; omkring hälften av världens befolkning levde under någon form av nedstängning. Distansarbete via Zoom och Teams blev normalt på några veckor. Världsekonomin krympte cirka 3 % 2020, och statliga stödpaket i tusentals miljarder dollar följdes av hög inflation 2021–23. Sverige blev internationellt uppmärksammat för att främst lita på frivilliga rekommendationer.

    Officiellt rapporterades omkring 7 miljoner döda, men WHO:s beräkningar av överdödligheten – hur många fler som dog än normalt – landar på uppskattningsvis 15–20 miljoner eller mer fram till 2022. Det gör covid till den dödligaste pandemin sedan [spanska sjukan 1918–20](#spanska-sjukan-1918-50-milj-doda) (uppskattningsvis 50 miljoner döda). Snabbt framtagna vaccin, främst mRNA-vaccin, räddade enligt studier miljontals liv. Se även [mRNA-vaccin](#mrna-vaccin).

mrna-vaccin:
  period: 2020
  label: "mRNA-vaccin"
  title: "mRNA-vaccin"
  wiki:
    - "en:MRNA vaccine"
    - "sv:Katalin Karikó"
  text: |
    Ett vaccin tränar immunförsvaret att känna igen en sjukdomsalstrare utan att man blir sjuk. Traditionella vaccin innehåller försvagade eller avdödade virus eller virusproteiner, och tar ofta många år att utveckla. Ett **mRNA-vaccin** innehåller i stället en instruktion: **budbärar-RNA** (mRNA) är den molekyl som cellen använder för att föra genetisk information från DNA till cellens proteinfabriker. Vaccinet får kroppens egna celler att tillfälligt tillverka ett ofarligt virusprotein, [i covidfallet](#covid-19) det så kallade spikproteinet på virusets yta, som immunförsvaret sedan lär sig känna igen.

    Tekniken utvecklades i årtionden, länge utan framgång, eftersom mRNA som injicerades orsakade inflammation och bröts ner snabbt. **Katalin Karikó** och **Drew Weissman** visade 2005 att en liten ändring av RNA-byggstenarna löste inflammationsproblemet; de fick Nobelpriset i medicin 2023. Små fettkulor (lipidnanopartiklar) skyddar RNA:t på vägen in i cellen.

    När covidvirusets arvsmassa publicerades i januari 2020 tog det bara några dagar att designa ett vaccin – i princip som att skriva ny kod. Pfizer–BioNTech och Moderna fick sina vaccin godkända i december 2020, under ett år efter att viruset upptäckts, mot normalt 5–10 år. Flera miljarder doser gavs världen över. Forskning pågår nu om mRNA-vaccin mot cancer och andra sjukdomar.

generativ-ai:
  period: 2020
  label: "generativ AI"
  title: "Generativ AI och stora språkmodeller"
  wiki:
    - "en:Generative artificial intelligence"
    - "en:Large language model"
    - "sv:ChatGPT"
  text: |
    **Generativ AI** är AI-system som skapar nytt innehåll – text, bilder, ljud, kod – i stället för att bara klassificera data. Grunden är **neurala nätverk**, matematiska modeller löst inspirerade av hjärnan, som tränas på enorma datamängder. Två genombrott låg bakom: [djupinlärning](#djupinlarning-alexnet-2012) tog fart 2012, när ett nätverk tränat på grafikkort (GPU:er) vann en bildigenkänningstävling stort, och 2017 publicerade Google-forskare **transformer**-arkitekturen, som gjorde det möjligt att träna mycket stora språkmodeller effektivt.

    En **stor språkmodell** tränas att förutsäga nästa ord i texter från stora delar av internet, och visar sig då lära sig grammatik, fakta och viss förmåga att resonera. Den 30 november 2022 släppte OpenAI chattjänsten **ChatGPT**, som fick uppskattningsvis 100 miljoner användare på två månader – snabbare än någon tidigare konsumentapp. Därefter följde konkurrenter som Googles Gemini, Anthropics Claude, Metas Llama och kinesiska DeepSeek, samt bildgeneratorer som Midjourney.

    Träningen av de största modellerna kostar hundratals miljoner dollar och kräver enorma datahallar; Nvidia, som tillverkar AI-chippen, blev ett av världens mest värdefulla företag. AI används för programmering, översättning och forskning – [AlphaFold](#alphafold-2020), som förutsäger proteiners struktur, gav Nobelpriset i kemi 2024. Samtidigt pågår debatt om jobb, upphovsrätt, desinformation och säkerhet. Jämför med [webben](#webben) och [persondatorn](#persondatorn) som tidigare teknikskiften.
