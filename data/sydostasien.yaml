# Sydostasien
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

srivijaya-styr-malackasundet:
  period: 1000
  label: "Srivijaya styr Malackasundet"
  title: "Srivijaya – sjöväldet vid Malackasundet"
  wiki:
    - "sv:Srivijaya"
    - "en:Strait of Malacca"
  text: |
    **Srivijaya** var ett buddhistiskt sjövälde med centrum kring Palembang på Sumatra i dagens Indonesien, från 600-talet till 1200-talet. Det var inget territorialrike i modern mening utan ett nätverk av hamnar som lydde under en maharaja.

    Makten byggde på läget. **Malackasundet**, mellan Sumatra och Malackahalvön, är den kortaste sjövägen mellan Indiska oceanen och Sydkinesiska havet, och därmed mellan Indien, arabvärlden och Kina. Fartygen var beroende av monsunvindarna, som blåser åt olika håll halvåret om, och fick vänta i hamnarna på rätt vind. Srivijaya tog tull av alla som passerade och bekämpade sjörövare. Än idag passerar omkring en fjärdedel av världens sjöhandel genom sundet.

    Srivijaya var också ett centrum för buddhistisk lärdom; kinesiska pilgrimer stannade där för att studera sanskrit på väg till Indien. 1025 [anföll det sydindiska Cholariket](#chola-flottan-anfaller-srivijaya-1025) (se Indien ~1000) med en flotta och plundrade hamnarna, ett slag som riket aldrig helt återhämtade sig från. Senare övertog först [Majapahit](#majapahit-1293) på Java, och sedan Malacka-sultanatet och [portugiserna (1511)](#portugiser-tar-malacka-1511), kontrollen över sundet.

khmer-angkor-vaxer:
  period: 1000
  label: "Khmer/Angkor växer"
  title: "Khmerriket och Angkor"
  wiki:
    - "sv:Khmerriket"
    - "sv:Angkor"
  text: |
    **Khmerriket** var en stormakt i Sydostasien 802–1431, med centrum i dagens Kambodja. Det sträckte sig som störst över dagens Kambodja, Thailand, Laos och södra Vietnam. Huvudstaden **Angkor**, vid sjön Tonle Sap, växte kraftigt kring år 1000 under kung Suryavarman I (1006–1050).

    Angkor var troligen den största förindustriella staden i världen sett till yta: laserskanning från luften har visat ett stadsområde på omkring 1 000 km², med uppskattningsvis 700 000–900 000 invånare som mest. Staden byggde på ett gigantiskt system av kanaler och vattenreservoarer, *baray*; den västra reservoaren som påbörjades på 1000-talet är 8 × 2 km. Vattnet möjliggjorde flera risskördar om året.

    Det mest kända templet, **[Angkor Wat](#angkor-wat-byggs)**, byggdes senare, under 1100-talets första hälft, ursprungligen åt hinduguden Vishnu och senare buddhistiskt. Det är världens största religiösa byggnadskomplex. Angkor övergavs på 1400-talet, troligen på grund av en kombination av krig med thailändska riken och torka och översvämningar som förstörde vattensystemet – ett tidigt exempel på hur klimat kan fälla en stad.

srivijaya-forsvagat-efter-chola-anfallet:
  period: 1020
  label: "Srivijaya försvagat efter Chola-anfallet"
  title: "Srivijaya försvagas"
  wiki:
    - "sv:Srivijaya"
  text: |
    **Srivijaya** var ett buddhistiskt handelsrike med centrum i Palembang på Sumatra (Indonesien), som från 600-talet dominerade Malackasundet – sjövägen mellan Indiska oceanen och Kina. Riket levde på tullar och hamnavgifter, och var ett centrum för buddhistiska studier som kinesiska pilgrimer besökte.

    När [Cholarikets flotta](#chola-flottan-anfaller-srivijaya-1025) från södra Indien anföll 1025, plundrade ett dussintal hamnar och tog kungen till fånga, förlorade Srivijaya sitt grepp. Riket fanns kvar i ytterligare ett par hundra år, men handeln spreds till konkurrerande hamnar, bland annat på Java.

    Varför det spelar roll: på 1200-talet ersattes Srivijaya av [Majapahit](#majapahit-1293) på Java, och på 1400-talet av [Malackasultanatet](#malacka-grundas-1400), när islam spred sig i regionen. Det är därför Indonesien i dag är världens största muslimska land, med buddhistiska och hinduiska fornlämningar som Borobudur.

angkor-suryavarman-i:
  period: 1020
  label: "Angkor (Suryavarman I)"
  title: "Angkor under Suryavarman I"
  wiki:
    - "en:Suryavarman I"
    - "sv:Angkor"
  text: |
    **[Khmerriket](#khmer-angkor-vaxer)** (cirka 800–1430) var en stat i nuvarande Kambodja med huvudstad i **Angkor**. **Suryavarman I** (styrde cirka 1006–1050) tog makten efter ett inbördeskrig och utvidgade riket in i nuvarande Thailand och Laos.

    Angkors styrka låg i vatten: ett enormt system av kanaler och reservoarer – den västra reservoaren West Baray, påbörjad under hans tid, är 8 km lång och 2 km bred – gav risodling även under torrperioden. Staden kan ha haft uppemot en miljon invånare i sitt omland, vilket skulle göra den till världens största förindustriella stadsområde. Som jämförelse hade London kanske 15 000 invånare vid samma tid.

    Varför det spelar roll: under Suryavarmans efterträdare byggdes [Angkor Wat](#angkor-wat-byggs) (1100-talet), världens största religiösa byggnad. Riket föll senare, delvis troligen för att vattensystemet inte klarade växlande monsuner – ett tidigt exempel på klimat och infrastruktur som avgör en civilisations öde.

anawrahta-grundar-pagan-riket-i-burma:
  period: 1040
  label: "Anawrahta grundar Pagan-riket i Burma 1044"
  title: "Anawrahta grundar Paganriket 1044"
  wiki:
    - "en:Anawrahta"
    - "en:Pagan Kingdom"
  text: |
    **Anawrahta** (styrde 1044–1077) var kung av staden **Pagan** (Bagan) i centrala Burma (dagens Myanmar), där det burmesiska folket, bamar, invandrat från norr några hundra år tidigare. Han besteg tronen 1044 och enade på några årtionden större delen av landet för första gången.

    Han erövrade monfolkets rike Thaton i söder (1057), varifrån han tog med sig munkar, skrifter och hantverkare. Han byggde bevattningssystem som gjorde centrala Burmas torra slätt till ett risområde, och han gjorde **[theravadabuddism](#theravadabuddism)** till rikets religion.

    Varför det spelar roll: Paganriket (1044–1287) lade grunden för Myanmar som stat, med burmesiskt språk, skrift och buddhism. I huvudstaden byggdes på 250 år över 10 000 tempel och pagoder på cirka 100 km² – över 2 000 står kvar. Riket föll efter mongoliska anfall 1287. Jämför med [Angkor](#khmer-angkor-vaxer) i Kambodja vid samma tid.

theravadabuddism:
  period: 1040
  label: "theravadabuddism"
  title: "Theravadabuddism"
  wiki:
    - "sv:Theravada"
  text: |
    **Buddhismen** grundades av Siddhartha Gautama, Buddha, i Indien kring 400-talet f.Kr. Med tiden delades den i två huvudriktningar: **mahayana** ("stora farkosten"), som spreds till Kina, Korea och Japan och betonar hjälp från bodhisattvor – upplysta varelser som hjälper andra – och **theravada** ("de äldstes lära").

    Theravada håller sig till de äldsta skrifterna, nedskrivna på språket pali på Sri Lanka omkring 1 f.Kr. Tonvikten ligger på munklivet och den enskildes egen väg mot upplysning genom meditation och etik. Munkarna lever på allmosor. Från Sri Lanka spreds riktningen till Sydostasien. Avgörande var när kung [Anawrahta](#anawrahta-grundar-pagan-riket-i-burma) i Burma gjorde den till statsreligion på 1000-talet; därifrån spred den sig till Thailand, Laos och Kambodja under följande århundraden.

    Varför det spelar roll: theravada är i dag huvudreligionen i Sri Lanka, Myanmar, Thailand, Laos och Kambodja, med uppskattningsvis 150 miljoner anhängare. I Indien självt dog buddhismen nästan ut efter cirka 1200. Mindfulness-rörelsen i väst har delvis sina rötter i theravadas meditationstraditioner.

ly-dynastin-i-ai-viet-slar-tillbaka-song:
  period: 1060
  label: "Lý-dynastin i Đại Việt slår tillbaka Song 1077"
  title: "Đại Việt slår tillbaka Song 1077"
  wiki:
    - "en:Lý dynasty"
    - "en:Song–Đại Việt war"
  text: |
    **Đại Việt** var namnet på det vietnamesiska riket i norra delen av dagens Vietnam, som blivit självständigt från Kina 938 efter tusen år av kinesiskt styre. **Lý-dynastin** (1009–1225) gjorde Thăng Long (dagens Hanoi) till huvudstad 1010 och byggde upp en stat efter kinesisk modell, med ett litteraturtempel för utbildning av ämbetsmän 1070.

    När [Songdynastins](#songdynastin) Kina rustade för att ta tillbaka området gick generalen **Lý Thường Kiệt** till förebyggande anfall 1075–76 och förstörde städer i södra Kina. Song svarade med en invasion 1076–77, med en armé som enligt källorna omfattade omkring 100 000 soldater plus ett stort antal bärare. Vid floden Như Nguyệt (norr om Hanoi) stoppades den. Stora delar av den kinesiska hären dog av sjukdomar och hetta.

    Till kriget knyts dikten *Nam quốc sơn hà* (”Södra landets berg och floder”), som hävdar att söderns kung har sitt eget mandat från himlen. Den kallas ibland Vietnams första självständighetsförklaring. Vietnam stod emot kinesiska och mongoliska invasioner även senare, ett mönster som återkommer ända till kriget mot Kina 1979.

pagan-ananda-templet:
  period: 1080
  label: "Pagan: Ananda-templet"
  title: "Pagan och Ananda-templet"
  wiki:
    - "en:Ananda Temple"
    - "en:Pagan Kingdom"
  text: |
    **Pagan** (idag Bagan) var huvudstad i det första enade riket i Burma (Myanmar), vid floden Irrawaddy. Under kung **[Anawrahta](#anawrahta-grundar-pagan-riket-i-burma)** (1044–1077) erövrades bl.a. mon-folkets stad Thaton i söder, och riket gjorde **[theravada-buddhism](#theravadabuddism)** – den äldre, mer munkcentrerade grenen av buddhismen – till statsreligion. Det är fortfarande Myanmars dominerande religion.

    Kung **Kyansittha** (1084–1112) byggde **Ananda-templet**, färdigt omkring 1105. Det är byggt i tegel i form av ett grekiskt kors, ca 50 meter högt, med fyra stora stående buddhastatyer av förgyllt trä, ca 9,5 meter höga, vända åt var sitt väderstreck. Korridorerna är fodrade med hundratals stenreliefer och glaserade plattor som berättar Buddhas liv.

    Under 1000–1200-talet byggdes över 10 000 tempel, pagoder och kloster på Pagans slätt, av vilka drygt 2 000 står kvar. Det var ett sätt för kungar och rika att samla religiös förtjänst. Riket föll efter mongoliska invasioner 1287. Jämför med [Angkor Wat](#angkor-wat-byggs) i Kambodja, som byggdes samtidigt (ca 1113–1150). Bagan blev världsarv 2019.

suryavarman-ii-1113-borjar-bygga-angkor:
  period: 1100
  label: "Suryavarman II (1113) börjar bygga Angkor Wat"
  title: "Suryavarman II och Angkor Wat"
  wiki:
    - "en:Suryavarman II"
    - "sv:Angkor Wat"
    - "en:Khmer Empire"
  text: |
    **Suryavarman II** var kung över [Khmerriket](#khmer-angkor-vaxer), ett rike med centrum i dagens Kambodja som under sin storhetstid kontrollerade stora delar av Thailand, Laos och södra Vietnam. Han tog makten 1113 efter en strid mellan rivaliserande prinsar och regerade till omkring 1150. Han förde krig mot grannriket Champa (centrala Vietnam) och mot Dai Viet (norra Vietnam), oftast utan framgång.

    Hans stora eftermäle är **[Angkor Wat](#angkor-wat-byggs)**, ett tempel tillägnat den hinduiska guden Vishnu och sannolikt tänkt som hans eget gravtempel. Det är världens största religiösa byggnadsverk: anläggningen med vallgrav mäter ungefär 1,5 × 1,3 km, och vallgraven är omkring 190 meter bred. Sandstenen bröts vid berget Kulen ungefär 40 km bort och fraktades troligen på kanaler.

    Jämför med Europa: [Saint-Denis, den första gotiska kyrkan](#saint-denis-1137-forsta-gotiska-kyrkan), byggdes om ungefär samtidigt (~1137–44), och [Notre-Dame i Paris påbörjades 1163](#notre-dame-i-paris-paborjas-1163). Angkor-området var en av sin tids största stadsbildningar, med uppskattningsvis flera hundratusen invånare spridda över ett stort område med konstgjorda reservoarer och kanaler.

angkor-wat-byggs:
  period: 1120
  label: "Angkor Wat byggs"
  title: "Bygget av Angkor Wat"
  wiki:
    - "sv:Angkor Wat"
    - "en:Angkor"
  text: |
    Angkor Wat byggdes under kung Suryavarman II av [Khmerriket](#khmer-angkor-vaxer) (se [Suryavarman II 1113](#suryavarman-ii-1113-borjar-bygga-angkor)), troligen från 1110- eller 1120-talet till strax efter hans död omkring 1150 – alltså ungefär 30–40 år. Templet tillägnades hinduguden Vishnu och var byggt som en modell av universum: de fem tornen föreställer berget Meru, gudarnas boning, och vallgraven världshavet.

    Bygget krävde enorma resurser. Uppskattningsvis 5–10 miljoner sandstensblock, vissa på flera ton, bröts vid berget Phnom Kulen omkring 40 km bort och fraktades troligen på kanaler. Väggarna är täckta av reliefer, bland annat ett 600 meter långt galleri med scener från indiska epos och från kungens egna krig. Hur många som arbetade är osäkert; uppskattningar talar om tiotusentals arbetare och elefanter.

    Det som gjorde bygget möjligt var Angkors vattensystem: väldiga reservoarer (den största, västra Baray, är 8 × 2 km) och kanaler som gav flera risskördar per år och föda åt en stor befolkning. Jämför med [europeiska katedraler](#notre-dame-i-paris-paborjas-1163) från samma tid, som ofta tog över hundra år att bygga. Angkor Wat omvandlades senare till ett buddhistiskt tempel och har aldrig helt övergivits. Det finns i dag på Kambodjas flagga.

angkor-wat-fullbordas:
  period: 1140
  label: "Angkor Wat fullbordas"
  title: "Angkor Wat fullbordas"
  wiki:
    - "sv:Angkor Wat"
    - "en:Jayavarman VII"
  text: |
    Angkor Wat byggdes under kung Suryavarman II av Khmerriket (se [Suryavarman II 1113](#suryavarman-ii-1113-borjar-bygga-angkor) och [Angkor Wat byggs](#angkor-wat-byggs)). Bygget tycks ha pågått ungefär 30–40 år och avslutades strax efter kungens död omkring 1150; vissa reliefer blev aldrig helt färdiga. Templet var tillägnat Vishnu och troligen kungens gravtempel, vilket förklarar att det, ovanligt nog, vetter mot väster – dödens riktning i hinduisk tradition.

    Efter Suryavarmans död följde oroligheter. [1177 anföll grannriket Champa](#cham-plundrar-angkor-1177) (centrala Vietnam) och plundrade Angkor. Det ledde till att **[Jayavarman VII](#jayavarman-vii-angkor-thom-bayon)** (kung ca 1181–1218) tog makten, drev ut angriparna och byggde den nya muromgärdade huvudstaden Angkor Thom med templet Bayon, känt för sina jättelika stenansikten. Han var buddhist, och under 1200–1300-talen blev Khmerriket successivt buddhistiskt; Angkor Wat blev ett buddhistiskt tempel.

    Angkor försvagades under 1300–1400-talet, delvis på grund av att vattensystemet inte klarade växlingar mellan torka och skyfall, och delvis på grund av krig med thailändska riket Ayutthaya. Huvudstaden [flyttades söderut efter 1431](#angkor-overges-1431-efter-ayutthayas). Angkor Wat övergavs dock aldrig helt utan förblev en pilgrimsplats, och västerlänningar som besökte det på 1800-talet beskrev det som en ”glömd” stad.

cham-plundrar-angkor-1177:
  period: 1160
  label: "Cham plundrar Angkor 1177"
  title: "Cham plundrar Angkor 1177"
  wiki:
    - "sv:Champa"
    - "en:Khmer–Cham wars"
  text: |
    **Champa** var en grupp kungariken längs kusten i dagens centrala och södra Vietnam, befolkade av chamfolket, ett sjöfarande folk med hinduisk kultur. **[Khmerriket](#khmer-angkor-vaxer)** med huvudstaden Angkor (i dagens Kambodja) var regionens stormakt, och de två låg i ständig konflikt.

    1177 seglade en chamflotta uppför Mekong och in i den stora sjön Tonle Sap, överraskade Angkor och plundrade staden. Khmerkungen dödades. Det var ett svårt slag mot ett rike som byggt [Angkor Wat](#angkor-wat-fullbordas) bara några decennier tidigare.

    Svaret kom från prinsen **[Jayavarman VII](#jayavarman-vii-angkor-thom-bayon)**, som drev ut chamerna 1181, blev kung och senare själv erövrade Champa. Han byggde om huvudstaden med kraftiga murar – Angkor Thom – och templet Bayon (se ”Jayavarman VII”). Plundringen visar hur sårbar en flodstad var för ett anfall från vattnet.

jayavarman-vii-angkor-thom-bayon:
  period: 1180
  label: "Jayavarman VII: Angkor Thom, Bayon"
  title: "Jayavarman VII, Angkor Thom och Bayon"
  wiki:
    - "sv:Jayavarman VII"
    - "sv:Angkor Thom"
    - "en:Bayon"
  text: |
    **Jayavarman VII** (ca 1122–ca 1218) var kung i [Khmerriket](#khmer-angkor-vaxer) (dagens Kambodja med delar av Thailand, Laos och Vietnam) från 1181. Han tog makten efter att ha drivit ut chamerna som [plundrat Angkor 1177](#cham-plundrar-angkor-1177) (se detta), och han erövrade sedan själv Champa. Under honom nådde riket sin största utbredning.

    Till skillnad från tidigare hinduiska kungar var han mahayanabuddhist. Han byggde den nya muromgärdade huvudstaden **Angkor Thom**, omkring 9 km² med en kvadratisk mur cirka 3 km på varje sida och en vallgrav. I centrum ligger templet **Bayon** med omkring 200 enorma stenansikten som blickar ut åt alla väderstreck – troligen en buddhistisk gestalt, kanske med kungens drag.

    Enligt inskrifter lät han också bygga 102 sjukhus och omkring 120 vilohus längs vägarna. Byggtakten var enorm och tros ha ansträngt riket. Angkor var vid den tiden troligen en av världens största städer, med en befolkning i storleksordningen hundratusentals i det utbredda stadsområdet.

angkor-pa-topp:
  period: 1200
  label: "Angkor på topp"
  title: "Angkor på sin höjdpunkt"
  wiki:
    - "sv:Angkor"
    - "en:Khmer Empire"
  text: |
    **Angkor** var huvudstad i [Khmerriket](#khmer-angkor-vaxer), i dagens nordvästra Kambodja, från omkring 800 till 1400-talet. Runt 1200, under kung [Jayavarman VII](#jayavarman-vii-angkor-thom-bayon) (se denna), omfattade riket stora delar av Fastlandssydostasien – dagens Kambodja, Thailand, Laos och södra Vietnam.

    Staden var inte tätbebyggd som en europeisk stad, utan ett utbrett landskap av tempel, risfält, kanaler och enorma vattenreservoarer (*baray*); den största, västra barayn, är cirka 8 × 2 km. Laserskanning från luften (lidar) har på 2010-talet visat att stadsområdet var mycket stort, och befolkningen uppskattas i nyare forskning till i storleksordningen 700 000–900 000 – kanske världens största förindustriella stadsområde, jämfört med Paris kanske 100 000 vid samma tid.

    [Angkor Wat](#angkor-wat-byggs), byggt under 1100-talet, är världens största religiösa byggnad. Efter 1200-talet minskade Angkor, bland annat på grund av torka och översvämningar som skadade vattensystemet, konkurrens från thailändska riken och övergång till [theravadabuddhism](#theravadabuddism). Hovet flyttade söderut mot Phnom Penh på 1400-talet.

sukhothai-forsta-thairiket-1238:
  period: 1220
  label: "Sukhothai, första thairiket ~1238"
  title: "Sukhothai, det första thairiket ~1238"
  wiki:
    - "en:Sukhothai Kingdom"
    - "sv:Thailands historia"
  text: |
    Under 1100–1200-talen dominerades Sydostasiens fastland av **Khmerriket** med huvudstad i Angkor (dagens Kambodja), som byggt tempelstaden [Angkor Wat](#angkor-wat-byggs). Samtidigt hade thaifolk (tai) under flera hundra år vandrat söderut från dagens södra Kina och slagit sig ned i dalarna i det som idag är norra Thailand och Laos.

    Omkring 1238 gjorde två thailändska hövdingar uppror mot khmerernas guvernör i staden **Sukhothai** och grundade ett eget rike. Namnet betyder ungefär ”lyckans gryning”. Det räknas traditionellt som det första thairiket och som början på Thailands historia.

    Sukhothai var till en början en liten stadsstat. Det blev stort under kung Ramkhamhaeng (se ”[Ramkhamhaeng: thailändsk skrift](#ramkhamhaeng-thailandsk-skrift)”) kring 1280–1300 och tog till sig *theravadabuddhismen*, den äldre buddhistiska inriktningen som kom via Sri Lanka och som fortfarande är Thailands huvudreligion. [Från 1351 tog det nya riket](#ayutthaya-grundas-1351) **Ayutthaya** längre söderut över ledningen, och Sukhothai blev vasall. Ruinerna är idag världsarv.

sukhothai:
  period: 1240
  label: "Sukhothai"
  title: "Sukhothairiket"
  wiki:
    - "en:Sukhothai Kingdom"
    - "en:Sukhothai Historical Park"
  text: |
    **Sukhothai** var det första kungadömet skapat av thaifolket, grundat omkring 1238 när två hövdingar frigjorde staden från khmerriket i Angkor (se ”[Sukhothai, första thairiket ~1238](#sukhothai-forsta-thairiket-1238)”). Riket låg i det som idag är centrala och norra Thailand.

    Under 1240- och 1250-talen var Sukhothai en liten stat bland flera thailändska furstendömen, t.ex. Lanna kring Chiang Mai i norr och Phayao. Khmerriket var på tillbakagång, och thaistaterna fyllde tomrummet. Mongolernas framfart i södra Kina, bl.a. erövringen av [Dali (Yunnan) 1253](#kublai-erovrar-yunnan), kan ha drivit ytterligare thaifolk söderut.

    Sukhothai byggde på risodling med bevattningsdammar och kanaler, och på handel. Staden blev senare känd för sin keramik, *sangkhalok*, som exporterades i stora mängder till Indonesien och Filippinerna. Rikets glansperiod kom under kung Ramkhamhaeng från ca 1279 (se ”[Ramkhamhaeng: thailändsk skrift](#ramkhamhaeng-thailandsk-skrift)”). Thailand räknar Sukhothai som sin första huvudstad, och den medeltida stadens ruiner med Buddhastatyer är ett välbesökt världsarv.

ramkhamhaeng-thailandsk-skrift:
  period: 1260
  label: "Ramkhamhaeng: thailändsk skrift"
  title: "Ramkhamhaeng och den thailändska skriften"
  wiki:
    - "en:Ram Khamhaeng"
    - "en:Ramkhamhaeng Inscription"
    - "en:Thai script"
  text: |
    **Ramkhamhaeng** (”Rama den djärve”) var kung av Sukhothai (se ”[Sukhothai](#sukhothai)”) ca 1279–1298. Under honom blev riket det ledande i området och omfattade, åtminstone som lösa vasallförhållanden, stora delar av dagens Thailand samt delar av Laos och Burma. Han allierade sig med thaikungarna i norr (Lanna och Phayao) och sände sändebud till Yuan-Kina.

    Han tillskrivs skapandet av **thailändsk skrift** år 1283, byggd på khmerisk skrift, som i sin tur härstammar från sydindiska skriftsystem. Skriften har tecken för vokaler och för toner – viktigt eftersom thai är ett tonspråk, där samma stavelse betyder olika saker beroende på tonhöjden.

    Källan är **Ramkhamhaeng-stelen**, en stenpelare med inskription daterad 1292 som hittades 1833 av prinsen och munken Mongkut (senare kung Rama IV). Den beskriver ett idealrike: ”i vattnet finns fisk, på fälten finns ris”, där kungen lyssnar på klagomål och handeln är fri. Några forskare har ifrågasatt om stelen är äkta eller en 1800-talsförfalskning; de flesta anser idag att den är äkta. Stelen ingår i Unescos register Memory of the World.

mongolanfall-mot-java:
  period: 1280
  label: "Mongolanfall mot Java"
  title: "Mongolernas anfall mot Java 1292–93"
  wiki:
    - "en:Mongol invasion of Java"
    - "en:Raden Wijaya"
  text: |
    Kublai khan, mongolernas härskare i Kina (Yuan-dynastin), skickade sändebud till kungadömet **Singhasari** på östra Java och krävde underkastelse. Kung Kertanagara lät 1289 skära ansiktet på sändebudet och skicka hem honom. Som straff sände Kublai 1292 en flotta på uppskattningsvis 20 000–30 000 man och omkring 1 000 fartyg – en sjöresa på över 3 000 km.

    När flottan kom fram var Kertanagara redan död, dödad av en upprorisk vasall. Hans svärson **Raden Wijaya** utnyttjade läget skickligt: han allierade sig med mongolerna, lät dem besegra hans rival, och vände sig sedan mot dem och drev ut dem. Mongolerna, som led av sjukdomar och hettan och ville hinna hem med monsunvindarna, gav upp och seglade bort 1293.

    Det var ett av mongolernas få stora misslyckanden, liksom [Japan 1281](#andra-mongolinvasionen-1281-kamikaze) och Vietnam 1288 – sjö- och tropikkrig passade dåligt för ett rytterifolk från stäppen. Raden Wijaya grundade samma år Majapahit ([se det](#majapahit-1293)), som blev Sydostasiens största rike.

majapahit-1293:
  period: 1280
  label: "Majapahit 1293"
  title: "Majapahit grundas 1293"
  wiki:
    - "sv:Majapahit"
    - "en:Majapahit"
  text: |
    **Majapahit** var ett hindu-buddhistiskt kungarike med centrum på östra Java i dagens Indonesien. Det grundades 1293 av **Raden Wijaya**, som just hade utnyttjat och sedan drivit bort en mongolisk invasionsarmé ([se Mongolanfall mot Java](#mongolanfall-mot-java)). Namnet kommer av en bitter frukt, *maja*, som enligt legenden växte på platsen.

    Rikets styrka byggde på två saker. Javas bördiga vulkanjord gav stora risskördar och därmed en stor befolkning. Och läget mellan Indiska oceanen och Sydkinesiska havet gjorde det möjligt att kontrollera kryddhandeln – kryddnejlika, muskot och peppar från Moluckerna och andra öar, som var mycket värdefulla i Kina, Indien och Europa.

    Under 1300-talet växte Majapahit till sitt största omfång under ministern Gajah Mada ([se 1320](#majapahit-gajah-mada)). Det dominerade, åtminstone genom tributrelationer (där underordnade härskare betalade skatt och erkände överhögheten), ett område som ungefär motsvarar dagens Indonesien. Därför används det idag i Indonesien som historisk förebild för nationen. Riket försvagades på 1400-talet när islam spred sig via handelsstäderna och försvann omkring 1500. Hinduismen lever kvar på Bali.

majapahit:
  period: 1300
  label: "Majapahit"
  title: "Majapahit omkring 1300"
  wiki:
    - "sv:Majapahit"
    - "en:Trowulan"
  text: |
    **Majapahit** var ett hindu-buddhistiskt kungarike på östra Java i dagens Indonesien, grundat 1293 ([se det](#majapahit-1293)). Kring 1300–1320 var riket fortfarande ungt och upptaget av att konsolidera makten på Java.

    Grundaren Raden Wijaya dog 1309 och efterträddes av sonen **Jayanagara**, som styrde till 1328. Hans tid präglades av uppror från tidigare allierade och hovmän. Under ett uppror 1319 räddades kungen av en ung livvaktsofficer, **Gajah Mada**, som därmed började sin karriär och senare blev rikets mäktigaste minister ([se 1320](#majapahit-gajah-mada)).

    Ekonomiskt byggde Majapahit på våtrisodling – de bördiga vulkaniska jordarna på Java gav två skördar per år – och på kryddhandeln från öarna i öster. Huvudstaden Trowulan var stor, med tegelbyggnader, kanaler och vattenreservoarer; arkeologer har hittat mängder av kinesiskt porslin och mynt. Kinesiska kopparmynt användes som valuta. Jämför med att Europa samtidigt drabbades av [den stora svälten 1315–17](#stora-svalten-131517): risbaserade jordbruk i tropikerna kunde föda betydligt fler människor per hektar.

majapahit-gajah-mada:
  period: 1320
  label: "Majapahit (Gajah Mada)"
  title: "Majapahit under Gajah Mada"
  wiki:
    - "en:Gajah Mada"
    - "sv:Majapahit"
  text: |
    **Gajah Mada** var en militär och statsman i kungariket **Majapahit** på Java ([se 1293](#majapahit-1293)). Han började som livvaktsofficer, räddade kungen under ett uppror 1319 och blev omkring 1331 *patih* – ungefär premiärminister – under drottning Tribhuwana och sedan kung Hayam Wuruk. Han hade makten till sin död 1364.

    Enligt traditionen svor han vid tillträdet **Palapa-eden**: att inte äta kryddor (eller avstå från ett visst nöje) förrän han förenat hela arkipelagen under Majapahit. Under hans ledning skickades flottor till Bali (erövrat 1343), Sumatra, Borneo, Malackahalvön och längre bort. Hur mycket som var verklig kontroll och hur mycket handelsrelationer och tribut är omstritt, men riket blev Sydostasiens mäktigaste.

    Ett känt bakslag var slaget vid Bubat 1357, när en prinsessa från Sundariket på västra Java skulle giftas bort till Hayam Wuruk; Gajah Mada krävde att hon skulle lämnas som underkastelse, och hennes följe dödades. I dagens Indonesien är Gajah Mada en nationalhjälte – ett stort universitet och den första kommunikationssatelliten, Palapa (1976), är uppkallade efter honom och hans ed.

ayutthaya-grundas-1351:
  period: 1340
  label: "Ayutthaya grundas 1351"
  title: "Ayutthaya grundas 1351"
  wiki:
    - "en:Ayutthaya Kingdom"
    - "en:Ramathibodi I"
  text: |
    År 1351 grundade kung **Ramathibodi I** (även kallad U Thong) staden **Ayutthaya** på en ö i floden Chao Phraya, ungefär 80 km norr om dagens Bangkok. Den blev huvudstad i ett thailändskt (siamesiskt) kungarike som skulle bestå i över 400 år.

    Läget var strategiskt: floden förband det bördiga risodlingslandet i inlandet med havet, så Ayutthaya blev en knutpunkt för handel mellan Kina, Indien, Japan och senare Europa. Riket var buddhistiskt men lånade kungaideologi och hovceremonier från Khmerriket (Angkor) i öster, som Ayutthaya [plundrade 1431](#angkor-overges-1431-efter-ayutthayas) – vilket bidrog till Angkors nedgång. På 1600-talet kan staden ha haft omkring 200 000 invånare (osäker siffra) och utländska kvarter för portugiser, holländare, japaner och kineser.

    År 1767 intogs och brändes Ayutthaya av en burmesisk armé. Kungadömet återuppstod snabbt med ny huvudstad, från 1782 Bangkok, och dagens Thailand ser Ayutthaya som sin direkta föregångare. Ruinerna är idag ett världsarv. Thailand är för övrigt det enda landet i Sydostasien som aldrig koloniserades av en europeisk makt.

majapahit-pa-topp:
  period: 1360
  label: "Majapahit på topp"
  title: "Majapahitriket på sin höjdpunkt"
  wiki:
    - "en:Majapahit"
    - "en:Gajah Mada"
  text: |
    **Majapahit** var ett hindu-buddhistiskt rike med centrum på östra **Java** i dagens Indonesien, [grundat 1293](#majapahit-1293) efter att ett mongoliskt invasionsförsök slagits tillbaka. Riket nådde sin höjdpunkt under kung **Hayam Wuruk** (1350–1389) och hans förste minister **[Gajah Mada](#majapahit-gajah-mada)** (död 1364).

    Gajah Mada ska enligt traditionen ha avlagt en ed att avstå från njutningar tills hela arkipelagen var enad under Majapahit. Riket gjorde anspråk på inflytande över stora delar av dagens Indonesien och Malaysia. Hur mycket som verkligen styrdes är omdiskuterat; många områden betalade bara tribut eller var handelspartner. Rikets rikedom kom från risodling på Java och från handeln med kryddor – kryddnejlika och muskot från Moluckerna – som gick vidare till Kina, Indien och till slut Europa.

    Majapahit är viktigt för det moderna Indonesien: när landet blev självständigt 1945 användes riket som historiskt bevis för att ö-riket var en naturlig enhet. Riket försvagades på 1400-talet när islam spreds via handelsstäder som [Malacka](#malacka-grundas-1400), och det upphörde i början av 1500-talet. Ön Bali behöll dock sin hinduiska kultur fram till idag.

malacka-grundas-1400:
  period: 1380
  label: "Malacka grundas ~1400"
  title: "Malacka grundas ca 1400"
  wiki:
    - "en:Malacca Sultanate"
    - "en:Parameswara (sultan)"
  text: |
    Omkring år 1400 grundade **Parameswara**, en prins från Sumatra som fördrivits från Singapore (då kallat Temasek), staden **Malacka** (Melaka) på Malackahalvöns västkust i dagens Malaysia. Läget var nyckeln: staden ligger vid **Malackasundet**, den smala havsvägen mellan Malackahalvön och Sumatra som all sjöfart mellan Indiska oceanen och Sydkinesiska havet måste passera. Monsunvindarna gjorde att fartyg från Indien och Kina ofta fick vänta där på rätt vind.

    Parameswara sökte skydd hos [Mingkina](#ming), som 1405 erkände Malacka, och [Zheng He:s flottor](#zheng-hes-flottor-140533) använde staden som bas. Senare övergick härskarna till islam, och Malacka blev det viktigaste centrumet för islams spridning i Sydostasien. Under 1400-talet blev det en av världens största handelshamnar, där kryddor från Moluckerna, tyger från Indien och porslin och siden från Kina byttes. Det sades att 84 språk talades på gatorna.

    [Portugiserna erövrade Malacka 1511](#portugiser-tar-malacka-1511) för att ta kontroll över kryddhandeln; [holländarna tog den 1641](#voc-tar-malacka-1641) och britterna 1824. Malackasundet är fortfarande en av världens viktigaste sjöleder – omkring en fjärdedel av världens sjöburna handel passerar där, inklusive mycket av Kinas och Japans olja.

malacka-blir-muslimskt-handelsnav:
  period: 1400
  label: "Malacka blir muslimskt handelsnav"
  title: "Malacka grundas och blir muslimskt"
  wiki:
    - "en:Malacca Sultanate"
    - "en:Parameswara"
    - "sv:Malackasundet"
  text: |
    **Malacka** (Melaka) ligger på Malackahalvön vid **Malackasundet**, det smala sundet mellan Malaysia och Sumatra som förbinder Indiska oceanen med Sydkinesiska havet. Staden [grundades omkring 1400](#malacka-grundas-1400) av **Parameswara**, en flyktad prins från Palembang på Sumatra.

    Läget var perfekt på grund av **monsunvindarna**: segelfartyg från Indien och Arabien kom med en monsun och fick vänta på att vinden vände innan de kunde åka hem, medan kinesiska fartyg kom med den motsatta. Malacka blev platsen där de möttes och bytte varor – kryddor, tyger, porslin, guld.

    Parameswara sökte skydd hos Kina och besökte själv kejsaren; [Zheng Hes flotta](#zheng-hes-flottor-140533) använde Malacka som bas. Omkring 1414 gick han – eller hans son – över till **islam**, vilket gjorde staden attraktiv för muslimska handlare från Indien och Arabien. Därifrån spreds islam vidare till Indonesien, som i dag är världens folkrikaste muslimska land.

    Malacka [erövrades av portugiserna 1511](#portugiser-tar-malacka-1511). Sundet är fortfarande en av världens viktigaste sjöleder; en mycket stor del av världens oljetransporter och containertrafik passerar där.

angkor-overges-1431-efter-ayutthayas:
  period: 1420
  label: "Angkor överges 1431 efter Ayutthayas anfall"
  title: "Angkor överges 1431"
  wiki:
    - "sv:Angkor"
    - "en:Ayutthaya Kingdom"
    - "sv:Khmerriket"
  text: |
    **Angkor** i nuvarande Kambodja var huvudstad i **Khmerriket**, som på 1100–1200-talen dominerade stora delar av Sydostasien. Templet [Angkor Wat](#angkor-wat-byggs), byggt på 1100-talet, är världens största religiösa byggnad. Staden var omgiven av ett enormt system av kanaler och vattenreservoarer; storstadsområdet kan ha haft upp emot 700 000–900 000 invånare (siffran är osäker) och var kanske världens största förindustriella stad till ytan.

    Thaistaten **Ayutthaya**, [grundad 1351 i nuvarande Thailand](#ayutthaya-grundas-1351), växte och anföll Angkor flera gånger. 1431 intogs och plundrades staden. Khmerkungarna flyttade sedan huvudstaden söderut mot området kring dagens Phnom Penh, närmare Mekongfloden och sjöhandeln.

    Plundringen var dock bara en del av förklaringen. Forskning (bland annat trädringar) visar att decennier av svår torka följt av kraftiga översvämningar under 1300- och 1400-talen förstörde det sårbara vattensystemet. Handeln flyttade också till kusten.

    Angkor övergavs aldrig helt – Angkor Wat användes som buddhistiskt tempel – men staden växte igen av djungel. Franska forskare gjorde det känt i Europa på 1860-talet.

malacka:
  period: 1440
  label: "Malacka"
  title: "Malackasultanatet vid sin höjdpunkt"
  wiki:
    - "en:Malacca Sultanate"
    - "en:Tun Perak"
  text: |
    Mitten av 1400-talet var **Malackasultanatets** storhetstid. Staden, grundad omkring 1400 ([se Malacka blir muslimskt handelsnav](#malacka-blir-muslimskt-handelsnav)), låg vid Malackasundet mellan Malackahalvön och Sumatra – den naturliga passagen för all sjöhandel mellan Indiska oceanen och Kina.

    Under sultanen **Muzaffar Shah** (1445–1459) och hans efterträdare, med den mäktige ministern (*bendahara*) **Tun Perak**, utvidgades riket över södra Malackahalvön och östra Sumatra, och stod emot anfall från det thailändska [Ayutthaya](#ayutthaya-grundas-1351).

    Staden var extremt kosmopolitisk. En portugisisk författare, Tomé Pires, skrev kring 1512 att man talade 84 språk där. Det fanns gujaratiska, tamilska, arabiska, persiska, kinesiska, javanesiska handlare. Varje stor grupp hade en egen *shahbandar*, hamnmästare, som hanterade tull och tvister. Befolkningen uppskattades till uppemot 100 000–200 000 vid 1500-talets början.

    Varorna var bland annat kryddnejlika och muskot från Moluckerna, peppar från Sumatra, indiska bomullstyger och kinesiskt siden och porslin. Pires skrev: ”Den som är herre över Malacka har handen om Venedigs strupe.” [Portugiserna erövrade staden 1511](#portugiser-tar-malacka-1511).

ai-viet-erovrar-champa-1471:
  period: 1460
  label: "Đại Việt erövrar Champa 1471"
  title: "Đại Việt erövrar Champa 1471"
  wiki:
    - "en:Cham–Vietnamese War (1471)"
    - "en:Lê Thánh Tông"
    - "en:Champa"
  text: |
    Det som i dag är Vietnam var länge två länder. I norr låg **Đại Việt**, det vietnamesiska riket kring Röda flodens delta, starkt påverkat av Kina. I mitten låg **Champa**, ett rike som funnits sedan omkring 200 e.Kr., med indiskt präglad kultur, hinduiska tempel och ett eget folk, chamerna.

    De två hade krigat i århundraden. 1471 anföll kejsaren **Lê Thánh Tông**, en av Vietnams mest kända härskare, med en mycket stor armé och intog Champas huvudstad Vijaya. Enligt vietnamesiska krönikor dödades omkring 60 000 och 30 000 togs till fånga; siffrorna är osäkra men visar att det var en förödande seger.

    Champa krympte till en liten rest som slutligen annekterades på 1830-talet. Erövringen var ett stort steg i den vietnamesiska ”marschen söderut” (*Nam tiến*), som på 1700-talet nådde Mekongdeltat och gav landet dess långa S-form. Kvarvarande chamer är i dag en minoritet på något hundratusental, många av dem muslimer.

    Jämför med [Inkas erövring av Chimú omkring 1470](#inka-erovrar-chimu-1470), en samtida erövring av ett grannrike på andra sidan jorden.

malacka-2:
  period: 1480
  label: "Malacka"
  same_as: malacka

portugiser-tar-malacka-1511:
  period: 1500
  label: "Portugiser tar Malacka 1511"
  title: "Portugiserna tar Malacka 1511"
  wiki:
    - "en:Capture of Malacca (1511)"
    - "en:Malacca Sultanate"
    - "en:Strait of Malacca"
  text: |
    **Malacka** (Melaka) på Malackahalvön var en av världens viktigaste handelsstäder. Den låg vid **Malackasundet**, den smala sjövägen mellan Indiska oceanen och Sydkinesiska havet. Allt som gick mellan Kina, Kryddöarna (Moluckerna) och Indien passerade där. En portugisisk iakttagare, Tomé Pires, skrev att den som behärskade Malacka hade Venedig i sitt grepp. Staden hade kanske 100 000 invånare och sägs ha haft köpmän som talade 84 språk.

    Malacka var ett muslimskt sultanat. 1511 anföll **[Afonso de Albuquerque](#portugisisk-goa-1510)** med 18 skepp och omkring 1 000–1 400 portugiser plus indiska hjälptrupper. Efter några veckors strider föll staden. Han byggde fästningen A Famosa.

    Erövringen gav Portugal ett nav för kryddhandeln, och 1512 nådde portugiser Moluckerna, där kryddnejlika och muskot växte. Men muslimska handelsmän flyttade till andra hamnar, som Aceh och Johor. [Holländarna tog Malacka 1641](#voc-tar-malacka-1641) och britterna 1824. Sundet är än i dag en av världens viktigaste sjöleder: omkring en fjärdedel av världshandeln till sjöss passerar där.

magellan-dodas-pa-filippinerna-1521:
  period: 1520
  label: "Magellan dödas på Filippinerna 1521"
  title: "Magellan dödas på Filippinerna 1521"
  wiki:
    - "sv:Ferdinand Magellan"
    - "en:Battle of Mactan"
  text: |
    **Ferdinand Magellan** var en portugisisk sjöfarare i spansk tjänst. 1519 [avseglade han från Spanien](#magellan-avseglar-1519) med fem fartyg och omkring 240–270 man för att nå Kryddöarna (Moluckerna i dagens Indonesien) västerut, runt Amerika. Han hittade sundet söder om Sydamerika som nu bär hans namn och korsade sedan Stilla havet – en resa på över tre månader, mycket längre än någon räknat med, där besättningen åt läder och råttor.

    I mars 1521 nådde han Filippinerna. Där försökte han göra lokala hövdingar till kristna allierade av Spanien. När hövdingen **Lapulapu** på ön Mactan vägrade gick Magellan i land med omkring 50 man och dödades i strid 27 april 1521. Lapulapu firas idag som nationalhjälte i Filippinerna.

    Resan fortsatte utan honom (se [Elcano fullbordar första världsomseglingen 1522](#elcano-fullbordar-forsta)). Besöket lade grunden för Spaniens senare kolonisering av Filippinerna, som fick sitt namn efter Filip II (se [Manila 1571](#manila-1571)).

spanska-ansprak-pa-filippinerna:
  period: 1540
  label: "Spanska anspråk på Filippinerna"
  title: "Spanska anspråk på Filippinerna"
  wiki:
    - "en:Spanish East Indies"
    - "en:Ruy López de Villalobos"
  text: |
    Filippinerna var på 1500-talet en ögrupp med många små samhällen (barangay) under lokala hövdingar, utan gemensam stat. I söder fanns muslimska sultanat, och handeln med Kina, Borneo och Malacka var livlig.

    Magellan gjorde anspråk på öarna för Spanien 1521 men dödades (se [Magellan dödas på Filippinerna 1521](#magellan-dodas-pa-filippinerna-1521)). Ett problem var att Spanien och Portugal 1494 hade [delat jorden](#tordesillas-1494) längs en meridian i Atlanten – men ingen visste var motsvarande linje gick på andra sidan jorden. Genom fördraget i Zaragoza 1529 sålde Spanien sina anspråk på Moluckerna till Portugal, men Filippinerna låg i en gråzon. 1542–43 skickades en expedition under Ruy López de Villalobos, som döpte öarna till *Las Islas Filipinas* efter kronprinsen, sedermera Filip II.

    Det avgörande problemet var vägen hem: vindarna gjorde det svårt att segla österut över Stilla havet. När Andrés de Urdaneta 1565 hittade en returväg norrut, med vindar och strömmar mot Kalifornien, kunde Spanien kolonisera öarna. Legazpi började samma år, och Manila grundades 1571 (se [Manila 1571](#manila-1571)).

manilagaleonerna-till-acapulco:
  period: 1560
  label: "Manilagaleonerna till Acapulco"
  title: "Manilagaleonerna 1565–1815"
  wiki:
    - "en:Manila galleon"
    - "sv:Acapulco"
  text: |
    **Manilagaleonerna** var spanska handelsfartyg som en eller två gånger om året seglade över Stilla havet mellan Manila på Filippinerna och Acapulco i Mexiko. En galeon är ett stort, tungt beväpnat segelfartyg med flera däck. Rutten öppnades 1565, när sjöfararen Andrés de Urdaneta hittade en returväg österut via de västliga vindarna längre norrut, och den trafikerades i 250 år, till 1815.

    Resan var cirka 15 000 km. Västerut tog den ungefär 3 månader, österut 4–6 månader, och många sjömän dog av skörbjugg (C-vitaminbrist) och svält. Från Amerika gick silver, framför allt från gruvan i Potosí (se [~1580](#potosi-varldens-storsta-silvergruva)). Tillbaka kom kinesiskt siden, porslin och kryddor, som Kina sålde mot silvret.

    Detta var den första regelbundna handelslinjen som knöt ihop Asien, Amerika och (via Mexiko och Atlanten) Europa – ofta beskrivet som början på en verkligt global ekonomi. Kina, som tog betalt i silver, sög upp en mycket stor del av världens silverproduktion, vilket påverkade priser i både Europa och Asien. Jämför med Portugals och senare Hollands sjöväg runt Afrika (se [VOC 1602](#voc-1602)).

voc-grundar-batavia-1619:
  period: 1600
  label: "VOC grundar Batavia 1619"
  title: "VOC grundar Batavia 1619"
  wiki:
    - "sv:Jakarta"
    - "en:Batavia, Dutch East Indies"
    - "en:Jan Pieterszoon Coen"
  text: |
    Holländska Ostindiska kompaniet (VOC, [se 1602](#voc-1602)) behövde ett fast huvudkontor i Asien. 1619 erövrade generalguvernören **Jan Pieterszoon Coen** staden Jayakarta på norra Java, brände den och byggde en ny befäst stad som fick namnet **Batavia** (efter ett latinskt namn på holländarnas förfäder). Idag heter den Jakarta och är Indonesiens huvudstad, med över 10 miljoner invånare i själva staden.

    Batavia byggdes som en holländsk stad med kanaler och var centrum för VOC:s handelsnät, som sträckte sig från Persiska viken till Japan. Coen var hänsynslös: han skrev till direktörerna att handel inte kunde bedrivas utan krig. 1621 lät han erövra Bandaöarna, den enda platsen i världen där muskot växte; större delen av de uppskattningsvis 15 000 invånarna dödades, svältes ihjäl eller förslavades.

    Batavia blev en mångkulturell men starkt segregerad stad med många kinesiska invånare och förslavade människor från hela Asien. Härifrån växte under 1800-talet den holländska kolonin Nederländska Ostindien, som omfattade hela dagens Indonesien och bestod till 1949.

amboyna-massakern-1623:
  period: 1620
  label: "Amboyna-massakern 1623"
  title: "Amboyna-massakern 1623"
  wiki:
    - "en:Amboyna massacre"
  text: |
    **Kryddöarna** (Moluckerna i dagens östra Indonesien) var den enda platsen i världen där kryddnejlika och muskot växte. Kryddorna var så värdefulla i Europa att vinsten på en lyckad resa kunde bli många hundra procent. Både det nederländska **[VOC](#voc-1602)** (Ostindiska kompaniet, ett aktiebolag med egen armé) och det [engelska Ostindiska kompaniet](#ostindiska-kompaniet-1600) ville ha handeln.

    På ön Ambon (Amboyna) arresterade VOC 1623 engelska handelsmän anklagade för att planera ett överfall på det holländska fortet. Efter tortyr med vatten och eld erkände de, och tio engelsmän, nio japanska legosoldater och en portugis avrättades.

    Händelsen blev en propagandafråga i England i årtionden och bidrog till de engelsk-nederländska krigen på 1650–70-talen. I praktiken drog sig engelsmännen tillbaka från Indonesien och satsade i stället på Indien – vilket på sikt blev grunden till Brittiska Indien. Holländarna behöll Indonesien till 1949.

voc-tar-malacka-1641:
  period: 1640
  label: "VOC tar Malacka 1641"
  title: "VOC tar Malacka 1641"
  wiki:
    - "en:Capture of Malacca (1641)"
    - "sv:Nederländska Ostindiska kompaniet"
  text: |
    **Malacka** på Malackahalvön (i dagens Malaysia) ligger vid Malackasundet, den smala passagen mellan Indiska oceanen och Sydkinesiska havet. Den som kontrollerade sundet kontrollerade en stor del av handeln mellan Indien och Kina – än idag passerar en stor del av världens sjöburna olja där. [Portugal hade erövrat staden 1511](#portugiser-tar-malacka-1511).

    **VOC** – Nederländska Ostindiska kompaniet, [grundat 1602](#voc-1602), världens första stora aktiebolag med rätt att föra krig, sluta fördrag och prägla mynt – ville bryta Portugals ställning i Asien. Med hjälp av sultanatet Johor belägrade VOC Malacka i över fem månader 1640–41. Staden föll i januari 1641; svält och sjukdom hade dödat större delen av befolkningen.

    VOC behöll Malacka men satsade främst på sin egen huvudort [Batavia](#voc-grundar-batavia-1619) (Jakarta) på Java. Samma år tog holländarna också Luanda i Angola, och under 1650-talet Ceylon. Portugals asiatiska imperium krympte till Goa, Macao och Timor. Malacka blev brittiskt 1824, och britterna byggde [Singapore (1819)](#singapore-1819) som efterträdare i rollen som sundets handelsnav.

voc:
  period: 1660
  label: "VOC"
  title: "VOC – Nederländska Ostindiska kompaniet"
  wiki:
    - "sv:Nederländska Ostindiska kompaniet"
  text: |
    **VOC** (Vereenigde Oostindische Compagnie) grundades 1602 och anses vara världens första moderna aktiebolag: vem som helst kunde köpa andelar, som sedan handlades på [Amsterdams börs](#amsterdams-bors) – världens första fondbörs. Staten gav kompaniet monopol på nederländsk handel öster om Godahoppsudden och rätt att föra krig, sluta fördrag, bygga fort och prägla mynt. Det var i praktiken ett företag med egen stat.

    Huvudorten var **[Batavia](#voc-grundar-batavia-1619)** (Jakarta) på Java, grundad 1619. På 1660-talet var VOC på sin höjdpunkt: det kontrollerade kryddhandeln från Moluckerna (muskot, kryddnejlika), hade tagit [Malacka (1641)](#voc-tar-malacka-1641) och Ceylon (1658), hade en station i Kapstaden (1652) och var enda europeiska företag med handelsrätt i Japan. Under sin livstid sände VOC uppskattningsvis nära 5 000 fartygsresor och omkring en miljon européer till Asien.

    Metoderna var brutala: på Bandaöarna dödades eller förslavades 1621 större delen av befolkningen för att säkra muskotmonopolet. Utdelningen till aktieägarna var i genomsnitt omkring 18 procent per år. VOC gick i konkurs 1799, och Nederländska staten tog över Indonesien. Jämför med [Brittiska Ostindiska kompaniet](#ostindiska-kompaniet-1600), som tog Indien.

singapore-1819:
  period: 1800
  label: "Singapore 1819"
  title: "Singapore grundas 1819"
  wiki:
    - "sv:Singapores historia"
    - "en:Founding of modern Singapore"
  text: |
    År 1819 slöt den brittiske kolonialtjänstemannen **Stamford Raffles** ett avtal med lokala malajiska härskare om att få anlägga en handelsstation på ön Singapore vid Malackasundets södra spets. Sundet mellan Malackahalvön och Sumatra är den kortaste sjövägen mellan Indiska oceanen och Sydkinesiska havet – idag passerar en betydande del av världens sjöburna handel där.

    Syftet var att bryta Nederländernas grepp om handeln i området (holländarna kontrollerade nuvarande Indonesien). Singapore blev en frihamn utan tullar, vilket lockade handelsmän från Kina, Indien och hela regionen. Befolkningen växte från något tusental 1819 till uppskattningsvis 50–80 000 runt 1860, till stor del kinesiska invandrare.

    Gränsen mellan brittiskt och holländskt område fastställdes i ett fördrag 1824 – den lever kvar som gränsen mellan Malaysia/Singapore och Indonesien. Singapore blev självständigt 1965 och är idag en av världens största hamnar och finanscentra.

    Jämför med [Malacka blir muslimskt handelsnav](#malacka-blir-muslimskt-handelsnav).

fransk-indokina-saigon-1862:
  period: 1860
  label: "Fransk Indokina (Saigon 1862)"
  title: "Frankrike tar Saigon 1862 – Franska Indokina"
  wiki:
    - "sv:Franska Indokina"
    - "en:Cochinchina campaign"
  text: |
    År 1858 angrep Frankrike Vietnam, officiellt för att skydda katolska missionärer som förföljts. 1859 intogs **Saigon** (idag Ho Chi Minh-staden), och genom fördraget 1862 tvingades den vietnamesiska Nguyendynastin avstå tre provinser i södra Mekongdeltat. De blev kolonin **Cochinkina**.

    Därifrån bredde Frankrike ut sig: Kambodja blev protektorat (en stat med egen kung men under fransk kontroll) 1863, norra och centrala Vietnam 1883–85 efter krig mot Kina, och Laos 1893. Tillsammans bildade de **Franska Indokina** 1887, med ca 20 miljoner invånare kring 1900.

    Kolonin byggde på export av ris och gummi. Fransk kolonialism väckte vietnamesisk nationalism som ledde till [Indokinakriget 1946–54](#indokinakriget), där Frankrike förlorade vid [Dien Bien Phu](#dien-bien-phu-1954), och därefter till [Vietnamkriget](#vietnamkriget). Jämför: under samma årtionden tog Storbritannien Burma och Malaya; bara Siam (Thailand) förblev självständigt som buffert.

filippinska-revolutionen-1896:
  period: 1880
  label: "Filippinska revolutionen 1896"
  title: "Filippinska revolutionen 1896–1898"
  wiki:
    - "en:Philippine Revolution"
    - "sv:José Rizal"
  text: |
    Filippinerna hade varit en spansk koloni sedan 1560-talet, styrd med stort inflytande av katolska munkordnar. Under 1800-talet växte en utbildad filippinsk elit fram som krävde reformer; den mest kända är läkaren och författaren **José Rizal**, vars romaner kritiserade kolonialstyret.

    1892 grundades det hemliga sällskapet **Katipunan**, lett av **Andrés Bonifacio**, som ville ha väpnad självständighet. Revolten bröt ut i augusti 1896. Spanjorerna avrättade Rizal i december 1896, vilket gjorde honom till martyr och nationalhjälte. Ledarskapet togs över av **Emilio Aguinaldo**.

    När [spansk-amerikanska kriget](#spansk-amerikanska-kriget-1898-kuba) bröt ut 1898 utropade Aguinaldo Asiens första republik. Men USA köpte Filippinerna av Spanien och ett nytt krig följde, **[filippinsk-amerikanska kriget](#usa-i-filippinerna)** 1899–1902, där uppskattningsvis 200 000 eller fler filippinska civila dog, främst av svält och sjukdom. Filippinerna blev självständigt först 1946.

usa-i-filippinerna:
  period: 1900
  label: "USA i Filippinerna"
  title: "USA i Filippinerna"
  wiki:
    - "sv:Filippinsk-amerikanska kriget"
    - "en:History of the Philippines (1898–1946)"
  text: |
    Filippinerna hade varit spansk koloni sedan 1500-talet. Efter [spansk-amerikanska kriget 1898](#spansk-amerikanska-kriget-1898-kuba) köpte USA öarna av Spanien för 20 miljoner dollar. Men filippinierna hade redan [utropat en egen republik](#filippinska-revolutionen-1896) under **Emilio Aguinaldo**, och 1899 bröt filippinsk-amerikanska kriget ut.

    Kriget pågick officiellt till 1902 och i vissa områden längre. Omkring 4 200 amerikanska soldater och uppskattningsvis 20 000 filippinska soldater dog, och civila dödsfall av strider, svält och kolera uppskattas till 200 000 eller fler. Det var USA:s första stora koloniala krig utomlands och väckte stark kritik hemma, bl.a. från författaren Mark Twain.

    USA styrde sedan Filippinerna som koloni, införde engelska i skolan och ett amerikanskt inspirerat politiskt system. 1935 fick landet självstyre, Japan ockuperade det 1942–45, och full självständighet kom 4 juli 1946. Filippinerna visar att USA, trots sin antikoloniala självbild, också blev en kolonialmakt kring 1900.

indonesien-fritt:
  period: 1940
  label: "Indonesien fritt"
  title: "Indonesiens självständighet 1945–1949"
  wiki:
    - "en:Indonesian National Revolution"
    - "sv:Sukarno"
  text: |
    Indonesien – den ögrupp på över 17 000 öar som tidigare hette Nederländska Ostindien – hade i drygt 300 år styrts av Nederländerna, först via handelsbolaget [VOC](#voc-1602) och sedan som koloni. Kolonin var mycket lönsam: kryddor, kaffe, socker, gummi och olja. Under andra världskriget ockuperade Japan området 1942–45 och sparkade ut holländarna.

    Två dagar efter Japans kapitulation, den 17 augusti 1945, utropade nationalistledaren **Sukarno** självständighet. Nederländerna försökte ta tillbaka kolonin med omkring 200 000 soldater. I fyra års krig dog uppskattningsvis tiotusentals, kanske över 100 000, indonesier. Under amerikanskt tryck – USA hotade att dra in [Marshallhjälpen](#marshallplanen) – erkände Nederländerna självständigheten i december 1949.

    Indonesien hade då runt 75 miljoner invånare; i dag omkring 280 miljoner, världens fjärde folkrikaste land och det land med flest muslimer. Sukarno störtades 1965–66 av generalen Suharto, under massakrer där uppskattningsvis 500 000–1 miljon påstådda kommunister dödades. Indonesien var en av de första kolonierna att bli fria efter kriget, efter [Indien 1947](#sjalvstandighet-och-delning-1947) – se även [Afrikas år 1960](#afrikas-ar-1960).

dien-bien-phu-1954:
  period: 1940
  label: "Dien Bien Phu 1954"
  title: "Slaget vid Dien Bien Phu 1954"
  wiki:
    - "sv:Slaget vid Dien Bien Phu"
    - "en:First Indochina War"
  text: |
    Efter andra världskriget ville Frankrike återta sin koloni Indokina (dagens Vietnam, Laos och Kambodja). Den kommunistiska självständighetsrörelsen **Viet Minh**, ledd av Ho Chi Minh, gjorde motstånd, och 1946–54 utkämpades det [första Indokinakriget](#indokinakriget).

    Fransmännen byggde en befäst bas i dalen Dien Bien Phu i norra Vietnam för att locka fienden till ett öppet slag. Men Viet Minh-generalen **Vo Nguyen Giap** lät tiotusentals bärare och cyklar dra tunga kanoner upp på bergen runt dalen – något fransmännen trott var omöjligt. Omkring 50 000 Viet Minh-soldater belägrade cirka 15 000 fransmän. Efter 56 dagars strid föll basen den 7 maj 1954. Omkring 11 000 fransmän tillfångatogs, och många dog i fångenskapen.

    Det var första gången en kolonialarmé besegrades i ett stort fältslag av en självständighetsrörelse. Vid fredskonferensen i Genève samma år delades Vietnam vid 17:e breddgraden i ett kommunistiskt norr och ett västvänligt söder. USA tog över Frankrikes roll i söder, vilket ledde till [Vietnamkriget](#vietnamkriget) (se det). Nederlaget bidrog också till att Frankrike strax därefter hamnade i Algerietkriget (se [Algeriet fritt 1962](#algeriet-fritt-1962)).

vietnamkriget:
  period: 1960
  label: "Vietnamkriget"
  title: "Vietnamkriget 1955–1975"
  wiki:
    - "sv:Vietnamkriget"
  text: |
    Efter Frankrikes nederlag vid [Dien Bien Phu 1954](#dien-bien-phu-1954) (se det) delades Vietnam i ett kommunistiskt norr under **Ho Chi Minh** och ett USA-stött söder. En gerilla i syd, kallad **FNL** eller Viet Cong, stödd av Nordvietnam, kämpade för att störta sydregimen och ena landet. USA såg det som en del av kampen mot kommunismen enligt ”dominoteorin”: faller ett land, faller grannarna.

    USA skickade rådgivare under Kennedy och, efter en omstridd incident i Tonkinbukten 1964, stridstrupper under president Lyndon Johnson. 1968 fanns omkring 540 000 amerikanska soldater i Vietnam. USA släppte mer bomber över Indokina än alla parter tillsammans i andra världskriget. Tet-offensiven 1968, en storoffensiv från FNL, var militärt ett misslyckande för FNL men vände amerikansk opinion: kriget gick inte att vinna.

    USA drog sig ut 1973, och Saigon föll 30 april 1975. Uppskattningsvis dog 1,5–3 miljoner vietnameser och 58 000 amerikaner. Kriget var det första tv-sända kriget och väckte världsvida protester (se [maj 1968](#maj-1968), [Palme](#palme)). Det spred sig till Laos och Kambodja (se [Röda khmererna 1975](#roda-khmererna-1975)). Vietnam är i dag enpartistat men marknadsekonomi och en viktig handelspartner till USA.

roda-khmererna-1975:
  period: 1960
  label: "Röda khmererna 1975"
  title: "Röda khmererna i Kambodja 1975–1979"
  wiki:
    - "sv:Röda khmererna"
    - "sv:Pol Pot"
  text: |
    Kambodja drogs in i [Vietnamkriget](#vietnamkriget): USA bombade landet kraftigt 1969–73 för att slå mot nordvietnamesiska förbindelseleder, och ett inbördeskrig bröt ut. Den 17 april 1975 intog den kommunistiska gerillan **Röda khmererna**, ledd av **Pol Pot**, huvudstaden Phnom Penh.

    Det som följde var ett av 1900-talets mest extrema experiment. Regimen ville skapa ett klasslöst bondesamhälle från ”år noll”. Inom några dagar tvångsevakuerades städerna, cirka 2 miljoner människor, ut till landsbygden. Pengar, marknader, skolor, religion och privat egendom avskaffades. Folk arbetade i jordbrukskollektiv under slavlika förhållanden. Utbildade – lärare, läkare, folk med glasögon – och etniska minoriteter avrättades. I fängelset Tuol Sleng (S-21) torterades omkring 15 000 människor; bara ett fåtal överlevde.

    På knappt fyra år dog uppskattningsvis 1,5–2 miljoner av omkring 8 miljoner invånare, en fjärdedel av befolkningen, genom avrättningar, svält och sjukdomar. I januari 1979 invaderade Vietnam och störtade regimen. Röda khmererna fortsatte ändå att ha Kambodjas FN-plats i flera år med stöd av Kina och väst, ett tydligt exempel på kalla krigets logik. Pol Pot dog 1998 utan att ha ställts inför rätta.

tsunamin-2004-2:
  period: 2000
  label: "Tsunamin 2004"
  same_as: tsunamin-2004

militarkupp-i-myanmar-2021:
  period: 2020
  label: "Militärkupp i Myanmar 2021"
  title: "Militärkuppen i Myanmar 2021"
  wiki:
    - "en:2021 Myanmar coup d'état"
    - "en:Myanmar civil war (2021–present)"
    - "sv:Aung San Suu Kyi"
  text: |
    **Myanmar** (tidigare Burma), med omkring 55 miljoner invånare, styrdes av militären från 1962. Den mest kända oppositionsledaren var **Aung San Suu Kyi**, som fick Nobels fredspris 1991 och satt i husarrest i sammanlagt 15 år. Från 2011 lättade militären på greppet, och hennes parti vann valet 2015. Militären behöll dock stor makt, och 2017 genomförde den en våldsam fördrivning av den muslimska minoriteten **rohingya**, där över 700 000 flydde till Bangladesh. Suu Kyi försvarade militären, vilket skadade hennes internationella anseende.

    Efter att hennes parti vann valet i november 2020 med stor marginal tog militären under general **Min Aung Hlaing** makten den 1 februari 2021, med påståenden om valfusk. Suu Kyi fängslades och dömdes till långa straff. Massprotester och generalstrejker slogs ned med skarp ammunition.

    Motståndet blev väpnat. Unga demokratiaktivister bildade gerillagrupper och gick ihop med de etniska rebellarméer som i årtionden kämpat mot militären i gränsområdena. Militären har sedan 2023 förlorat stora delar av landet. Inbördeskriget har drivit uppskattningsvis 3 miljoner på flykt, och militären bombar byar från luften.

    Jämför med [Himmelska fridens torg 1989](#himmelska-fridens-torg-1989).
