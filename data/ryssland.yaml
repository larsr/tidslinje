# Ryssland
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

kievrus-vladimir-den-store-dop-988-dor:
  period: 1000
  label: "Kievrus: Vladimir den store (dop 988) dör 1015"
  title: "Vladimir den store och Kievrus"
  wiki:
    - "sv:Vladimir I av Kiev"
    - "sv:Kievriket"
  text: |
    **Kievrus** var ett rike som växte fram på 800-talet längs floderna mellan Östersjön och Svarta havet, med centrum i Kiev. Det grundades av **varjager** – skandinaviska vikingar, många från Sverige – som handlade och tog tribut längs flodvägarna till Bysans och Bagdad. Ledarskiktet blev snabbt slaviserat. Kievrus räknas som ursprunget till både Ryssland, Ukraina och Belarus.

    **Vladimir** (ca 958–1015) blev storfurste omkring 980. Den mest kända händelsen är hans dop **988**. Enligt krönikan lät han sända ut sändebud för att undersöka islam, judendom, västlig och östlig kristendom; islam avvisades eftersom den förbjöd alkohol. I praktiken var dopet en del av en allians: han fick gifta sig med den bysantinske kejsaren [Basileios II](#bysans-basileios-ii-krossar-bulgarerna):s syster Anna. Kievborna döptes kollektivt i floden Dnepr.

    Beslutet att välja den grekisk-ortodoxa kristendomen från Bysans, inte den latinska från Rom, präglar Östeuropa än idag: kyrillisk skrift, ortodox kyrka och en kulturell skiljelinje mot Polen och Västeuropa. När Vladimir dog 1015 utbröt strid mellan hans söner (se [brödrakrig](#brodrakrig)).

brodrakrig:
  period: 1000
  label: "brödrakrig"
  title: "Brödrakriget i Kievrus 1015–1019"
  wiki:
    - "en:Boris and Gleb"
    - "en:Yaroslav the Wise"
  text: |
    När storfursten **Vladimir den store** av Kievrus dog 1015 lämnade han ett tiotal söner, var och en furste över en egen stad. Det fanns ingen fast regel för vem som skulle ärva, så sönerna slogs om makten i Kiev.

    **Svjatopolk** tog först makten och lät enligt krönikan mörda tre av sina bröder, bland dem **Boris och Gleb**. De två unga bröderna gjorde inget motstånd utan lät sig dödas, och blev därför de första ryska helgonen – en förebild för idén om det ödmjuka, icke-våldsamma lidandet i rysk fromhet. Svjatopolk fick tillnamnet ”den förbannade”. Han fick stöd av sin svärfar [Bolesław I av Polen](#bolesaw-i-i-polen), som 1018 intog Kiev.

    Brodern **Jaroslav** i Novgorod vann till slut 1019, bland annat med hjälp av hyrda svenska varjager. Han blev [Jaroslav den vise](#jaroslav-den-vise) (se ~1020) och gifte sig med Ingegerd, dotter till [Olof Skötkonung](#olof-skotkonung). Sådana arvstvister upprepades i varje generation och bidrog till att Kievrus på 1100-talet splittrades i furstendömen – vilket gjorde det lätt för mongolerna att erövra landet [1237–1240](#mongolinvasionen-123740).

jaroslav-den-vise:
  period: 1020
  label: "Jaroslav den vise"
  title: "Jaroslav den vise"
  wiki:
    - "sv:Jaroslav den vise"
    - "sv:Ingegerd Olofsdotter"
  text: |
    **Jaroslav den vise** (ca 978–1054) var son till Vladimir den store och storfurste av **Kievrus**, det rike som är ursprunget till Ryssland, Ukraina och Belarus. Han segrade i [brödrakriget](#brodrakrig) efter faderns död (se ~1000) och kontrollerade från 1036 hela riket. Under honom nådde Kievrus sin storhetstid.

    Han är känd för tre saker. Han lät nedteckna den första östslaviska lagboken, **[Russkaja Pravda](#lagboken-russkaja-pravda)** (se nedan). Han byggde Kiev till en praktfull stad med **[Sofiakatedralen](#sofiakatedralen-i-kiev-1037)** (se 1037) efter förebild från Konstantinopel, grundade skolor och bibliotek. Och han slog 1036 tillbaka nomadfolket petjenegerna, som hotat Kiev i årtionden.

    Han kallas ibland ”Europas svärfar”. Han var gift med **Ingegerd**, dotter till Sveriges kung Olof Skötkonung, och deras döttrar gifte sig med kungarna av Frankrike (Anna, med [Henrik I](#henrik-i-1031)), Norge (Elisabet, med Harald Hårdråde) och Ungern. Det visar att Kievrus då var en fullvärdig del av Europa med nära band till Skandinavien. Efter hans död delades riket mellan sönerna, vilket ledde till nya konflikter och splittring.

sofiakatedralen-i-kiev-1037:
  period: 1020
  label: "Sofiakatedralen i Kiev 1037"
  title: "Sofiakatedralen i Kiev"
  wiki:
    - "en:Saint Sophia Cathedral, Kyiv"
  text: |
    **Sofiakatedralen** i Kiev grundades 1037 av storfurst [Jaroslav den vise](#jaroslav-den-vise), enligt traditionen på platsen där han besegrat nomadfolket petjenegerna året innan. Namnet kommer från **[Hagia Sofia](#bysans-hagia-sofia-mosaiker)** (”den heliga visheten”) i Konstantinopel, det östromerska rikets huvudkyrka, som Jaroslav ville efterlikna för att visa att Kiev var ett nytt Konstantinopel.

    Kyrkan byggdes av bysantinska byggmästare med 13 kupoler, som symboliserade Kristus och apostlarna. Interiören har bevarade mosaiker och fresker från 1000-talet, bland annat en stor mosaik av Jungfru Maria med upplyfta händer, och fresker som visar Jaroslavs familj. På väggarna finns också hundratals *graffiti* ristade av besökare, bland dem inskrifter som nämner Jaroslavs död 1054 – värdefulla källor till vardagsspråket.

    Katedralen var Kievrus andliga centrum och plats för furstarnas kröningar och gravar; Jaroslav själv ligger begravd där. Den skadades vid [mongolernas förstörelse av Kiev 1240](#mongolinvasionen-123740), och yttre delar byggdes om i barockstil på 1600–1700-talen. Den blev 1990 Ukrainas första världsarv. Sofiakatedraler med samma förebild byggdes också i Novgorod och Polotsk.

lagboken-russkaja-pravda:
  period: 1020
  label: "lagboken Russkaja Pravda"
  title: "Russkaja Pravda – Kievrus lagbok"
  wiki:
    - "en:Russkaya Pravda"
  text: |
    **Russkaja Pravda** (”den ryska rätten”) är den äldsta bevarade lagsamlingen från Kievrus. Den äldsta delen tillskrivs storfurst **[Jaroslav den vise](#jaroslav-den-vise)** och skrevs troligen ned omkring 1016–1054. Den utökades sedan av hans söner och senare furstar.

    Lagen bygger på gammal sedvänja, mycket lik den nordiska och germanska rätten. Den äldsta delen tillåter blodshämnd: en släkting till en dräpt får döda dråparen. Annars betalades böter, *vira*, som varierade efter offrets status – en furstes man kostade 80 grivna (silvertackor), en vanlig fri man 40, en träl betydligt mindre. Jaroslavs söner avskaffade blodshämnden och ersatte den med böter till fursten.

    Lagboken visar hur samhället faktiskt fungerade: vilka grupper som fanns, hur skulder, arv och handel reglerades. Den liknar de svenska landskapslagarna, som Västgötalagen från 1200-talet, och visar både skandinaviskt inflytande och hur en stat växte fram när fursten övertog straffen från släkterna. Jämför med Englands lagar eller med [Islands Alltinget](#island-antar-kristendomen-1000) vid samma tid. Den påverkade rysk rätt ända in på 1400-talet.

jaroslav-dor-1054:
  period: 1040
  label: "Jaroslav dör 1054"
  title: "Jaroslav den vise dör 1054"
  wiki:
    - "sv:Jaroslav den vise"
    - "sv:Kievriket"
  text: |
    **Jaroslav den vise** (cirka 978–1054) var storfurste av **Kievrus** – en stat kring Kiev och Novgorod som grundats av nordiska vikingar ("ruser") på 800-talet och som är förfader till både Ryssland, Ukraina och Belarus. Folket var mest slaviskt; härskarsläkten var av nordiskt ursprung men blev snabbt slavisk.

    Under Jaroslav nådde Kievrus sin höjdpunkt. Han lät skriva den första ryska lagboken, *[Russkaja Pravda](#lagboken-russkaja-pravda)*, och bygga [Sofiakatedralen i Kiev](#sofiakatedralen-i-kiev-1037), efter förebild av Hagia Sofia. Han var gift med **Ingegerd**, dotter till svenske kungen [Olof Skötkonung](#olof-skotkonung). Hans döttrar gifte sig med kungarna av Frankrike (Anna, med Henrik I), Norge (Elisabet, med Harald Hårdråde) och Ungern – han kallas ibland "Europas svärfar".

    Varför det spelar roll: Kiev hade då uppskattningsvis 30 000–50 000 invånare, fler än Paris eller London. Vid hans död delades riket mellan sönerna (se [Kievrus delas](#kievrus-delas-mellan-sonerna)), vilket ledde till splittring.

kievrus-delas-mellan-sonerna:
  period: 1040
  label: "Kievrus delas mellan sönerna"
  title: "Kievrus delas mellan Jaroslavs söner"
  wiki:
    - "sv:Kievriket"
  text: |
    När **[Jaroslav den vise](#jaroslav-dor-1054)** dog 1054 fördelade han Kievrus mellan sina söner: den äldste fick Kiev, de andra fick städer som Tjernigov, Perejaslavl och Smolensk. Systemet byggde på en rotationsprincip: när den äldste brodern dog skulle nästa i tur flytta upp till Kiev, och alla andra flytta upp ett steg.

    Systemet var nästan omöjligt att följa. Nästa generation kusiner hade alla anspråk, och det ledde till ständiga inbördeskrig mellan furstarna. Under 1100-talet splittrades Kievrus i ett dussintal furstendömen, med centra som Novgorod, Vladimir-Suzdal och Galitjien.

    Varför det spelar roll: splittringen gjorde området sårbart när mongolerna kom: [1240 förstördes Kiev](#mongolinvasionen-123740). Under de följande 200 åren av mongoliskt herravälde växte Moskva fram som nytt maktcentrum i nordöst, medan väst (dagens Ukraina och Belarus) hamnade under Litauen och Polen. Där går en rot till skillnaden mellan Ryssland och Ukraina. Jämför: frankiska riket delades på liknande sätt 843.

polovtser-kumaner-harjar:
  period: 1060
  label: "Polovtser (kumaner) härjar"
  title: "Polovtserna – nomaderna på stäppen"
  wiki:
    - "sv:Kumaner"
    - "en:Cumans"
  text: |
    **Polovtser** (ryska namnet; i väst kallade **kumaner**, på turkiska kiptjaker) var ett turkisktalande ryttarfolk som runt 1050–1060 tog över stäppen norr om Svarta havet – det öppna gräslandet i dagens Ukraina och södra Ryssland. De levde av boskap och rörde sig med sina hjordar.

    För Kievriket – den östslaviska stat som vikingaättlingar grundat kring Kiev och Novgorod – blev de ett ständigt hot. 1068 besegrades de ryska furstarna vid floden Alta, och därefter kom plundringståg nästan årligen: byar brändes och människor fördes bort för att säljas som slavar på marknaderna vid Krim. Samtidigt användes polovtserna ofta som legosoldater av ryska furstar som slogs mot varandra (se [furstefejder](#furstefejder)).

    Konflikten pågick i över 150 år och lever kvar i det ryska eposet *[Igorkvädet](#igorkvadet-1185)* om ett misslyckat fälttåg 1185. Den tog slut först när mongolerna krossade både ryssar och polovtser [1223–1240](#slaget-vid-kalka-1223). Många kumaner flydde då till Ungern. Mönstret – jordbrukande riken mot rörliga stäppfolk – återkommer genom hela tidslinjen, från hunnerna till mongolerna.

furstefejder:
  period: 1060
  label: "furstefejder"
  title: "Furstefejder i Kievriket"
  wiki:
    - "en:Kievan Rus'"
    - "en:Council of Liubech"
  text: |
    **Kievriket** (Kievs Rus) var ett löst förbund av furstendömen kring Kiev, Novgorod, Tjernigov m.fl., styrt av **Rurikätten** – en släkt som enligt traditionen härstammade från skandinaviska vikingar. När den mäktige storfursten Jaroslav den vise dog 1054 delade han riket mellan sina söner.

    Regeln var en sorts rotation: den äldste i släkten skulle sitta i Kiev, och när han dog flyttade alla ett steg uppåt till ett finare furstendöme. Med många söner, kusiner och brorsöner blev det omöjligt att tolka vem som var ”äldst” – ungefär som ett protokoll utan entydig prioritetsordning. Resultatet blev ständiga krig mellan släktingar, ofta med [polovtiska legosoldater](#polovtser-kumaner-harjar) som samtidigt plundrade landet.

    1097 möttes furstarna i Ljubetj och kom överens om att var och en skulle behålla sin fars land. Två månader senare blev en av dem bländad av sina kusiner. Under [Vladimir Monomach](#vladimir-monomach) (storfurste 1113–1125) blev det lugnare, men [efter 1132](#kievrus-splittras-efter-1132) splittrades riket i ett tiotal självständiga furstendömen. Den splittringen var en huvudorsak till att mongolerna kunde ta landet [1237–1240](#mongolinvasionen-123740). Jämför med Tyskland, som också förblev splittrat i hundratals år.

vladimir-monomach:
  period: 1080
  label: "Vladimir Monomach"
  title: "Vladimir Monomach"
  wiki:
    - "sv:Vladimir Monomach"
    - "en:Vladimir II Monomakh"
  text: |
    **Vladimir Monomach** (1053–1125) var en rysk furste av Rurikätten, den släkt av vikingaursprung som styrde Kievriket – det tidiga östslaviska riket kring Kiev och Novgorod. Hans mor var troligen en bysantinsk prinsessa av kejsarsläkten Monomachos, därav namnet.

    Under 1080- och 1090-talen var han furste i Tjernigov och sedan Perejaslavl, en gränsstad mot stäppen. Han var mest känd för sina många fälttåg mot **polovtserna**, de turkiska nomader som plundrade Ryssland (se [Polovtser härjar](#polovtser-kumaner-harjar)). Han tog initiativ till furstemötet i Ljubetj 1097 för att stoppa [furstefejderna](#furstefejder) och samlade 1103 och 1111 de ryska furstarna till gemensamma offensiver ut på stäppen som gav polovtserna svåra nederlag.

    Han efterlämnade en *Lärdom till mina barn*, en sorts självbiografi och råd om hur en furste ska leva – en av de första personliga texterna på fornryska. Han räknade själv upp 83 större fälttåg. 1113 blev han storfurste i Kiev (se [Vladimir Monomach storfurste 1113](#vladimir-monomach-storfurste-1113)). Senare ryska tsarer hävdade härstamning från honom, och den ryska kronan kallas ”Monomachs mössa”.

nestorskronikan:
  period: 1100
  label: "Nestorskrönikan"
  title: "Nestorskrönikan"
  wiki:
    - "sv:Nestorskrönikan"
    - "en:Primary Chronicle"
  text: |
    **Nestorskrönikan** (på ryska *Povest vremennych let*, ”Berättelsen om svunna år”) är den viktigaste källan till östslavernas tidiga historia. Den sammanställdes omkring 1113 i **Grottklostret i Kiev** och tillskrivs traditionellt munken Nestor. Den bygger på äldre krönikor, bysantinska källor, muntliga berättelser och avskrifter av fördrag.

    Krönikan berättar historien från syndafloden fram till 1100-talet. Mest omdiskuterad är berättelsen om att slaviska och finska stammar år 862 kallade in **varjager** – skandinaviska vikingar – under **Rurik** för att styra dem, eftersom de inte kunde enas själva: ”Vårt land är stort och rikt, men ordning finns där inte.” Detta ledde till Rurikdynastin, som styrde Ryssland ända till 1598. Krönikan berättar också om Olga, om [Vladimirs dop 988](#kievrus-vladimir-den-store-dop-988-dor) och om [furstarnas fejder](#furstefejder).

    Hur stor del vikingarna hade i skapandet av den ryska staten har varit en politiskt laddad fråga i 300 år: ryska nationalister har tonat ner det, medan arkeologin visar skandinavisk närvaro längs floderna. Krönikan finns bevarad i avskrifter, den äldsta från 1377. Den är för ryska, ukrainska och belarusiska historien ungefär vad [Snorre](#snorre-sturlason-skriver) är för Norden.

vladimir-monomach-storfurste-1113:
  period: 1100
  label: "Vladimir Monomach storfurste 1113"
  title: "Vladimir Monomach blir storfurste 1113"
  wiki:
    - "sv:Vladimir Monomach"
    - "en:Russkaya Pravda"
  text: |
    1113 dog storfursten av Kiev, Svjatopolk. Hans styre hade varit illa omtyckt; han hade skyddat judiska och andra köpmän som lånat ut pengar mot hög ränta. När han dog utbröt ett uppror i Kiev där folk plundrade ockrarnas hus. Stadens styrande kallade in **[Vladimir Monomach](#vladimir-monomach)** (se Vladimir Monomach), den populäre fursten som var känd för sina segrar mot [polovtserna](#polovtser-kumaner-harjar), trots att han enligt turordningen inte stod först i tur.

    Som storfurste 1113–1125 lugnade han ner situationen med nya lagar: han begränsade räntorna på lån och skyddade fria bönder från att bli skuldslavar. Lagarna lades till i *[Russkaja Pravda](#lagboken-russkaja-pravda)*, den gamla ryska lagboken. Han höll furstarna i schack, och polovtserna drevs långt ut på stäppen.

    Hans 12 år ses som Kievrikets sista storhetstid. Han var gift med Gytha, dotter till Harald Godwinson, den engelske kung som dog vid [Hastings 1066](#stamford-bridge-och-hastings-1066) – ett exempel på hur sammanflätade de europeiska kungahusen var. Hans son Mstislav höll ihop riket till 1132, men därefter splittrades det i självständiga furstendömen, som mongolerna erövrade 1237–1240.

kievrus-splittras-efter-1132:
  period: 1120
  label: "Kievrus splittras efter 1132"
  title: "Kievrus splittras efter 1132"
  wiki:
    - "sv:Kievriket"
    - "en:Mstislav the Great"
  text: |
    **Kievrus** var en lös statsbildning av östslaviska furstendömen som uppstod på 800-talet längs handelsvägen från Östersjön till Svarta havet. Den styrdes av ätten Rurik, enligt sägnen grundad av en skandinav. Huvudstad var Kiev, och riket hade antagit ortodox kristendom från Bysans [988](#kievrus-vladimir-den-store-dop-988-dor). Dagens Ryssland, Ukraina och Belarus räknar alla Kievrus som sitt ursprung.

    Arvssystemet var problematiskt: makten fördelades mellan bröder och kusiner i ätten, som flyttade mellan städerna efter rang. Det skapade ständiga tvister. Den siste storfursten som höll ihop riket, **Mstislav den store**, dog 1132. Efter honom delades Kievrus upp i ungefär ett dussin furstendömen, som Novgorod, Vladimir-Suzdal, Galizien-Volynien och Tjernigov – med tiden blev de fler.

    Kiev förlorade gradvis sin betydelse; 1169 plundrades staden av en rysk furste (se [Andrej Bogoljubskij](#andrej-bogoljubskij-plundrar-kiev-1169)). Splittringen gjorde att furstendömena inte kunde stå emot mongolerna, som erövrade nästan alla [1237–40](#mongolinvasionen-123740). Jämför med det tysk-romerska riket, som också var splittrat i hundratals självstyrande enheter. Det som senare blev Ryssland växte fram ur Moskva, en liten ort i Vladimir-Suzdal (se [Moskva nämns 1147](#moskva-namns-forsta-gangen-1147)).

novgorod-sjalvstyrande-1136:
  period: 1120
  label: "Novgorod självstyrande 1136"
  title: "Republiken Novgorod 1136"
  wiki:
    - "sv:Republiken Novgorod"
    - "en:Birch bark document"
  text: |
    **Novgorod** i nordvästra Ryssland var en av de viktigaste handelsstäderna i Kievrus, med förbindelser till Gotland och senare [Hansan](#hansan-vaxer). Staden kontrollerade väldiga skogsområden ända till Ural, varifrån den fick pälsverk, vax och honung att sälja till Västeuropa.

    1136 avsatte stadens invånare sin furste Vsevolod och fängslade honom. Därefter valde Novgorod själv sina furstar, som blev ungefär anställda militära befälhavare som kunde avskedas. Den verkliga makten låg hos *vetjet* – ett folkmöte av stadens fria män – som valde borgmästare (*posadnik*) och till och med ärkebiskop. I praktiken dominerades systemet av rika köpmanna- och godsägarfamiljer, inte så olikt italienska stadsrepubliker eller Hansastäderna.

    Ett unikt fynd är **björknäverbreven**: över 1 000 korta meddelanden ristade i björkbark, bevarade i den syrefattiga marken. De innehåller affärsbrev, kärleksbrev och skolövningar och visar att läskunnigheten var spridd även utanför eliten. Novgorod klarade sig undan mongolernas förstörelse men betalade tribut. Republiken bestod till 1478, då den [annekterades av Moskva under Ivan III](#ivan-iii-tar-novgorod-1478) – en milstolpe i framväxten av den ryska enhetsstaten.

moskva-namns-forsta-gangen-1147:
  period: 1140
  label: "Moskva nämns första gången 1147"
  title: "Moskva nämns första gången 1147"
  wiki:
    - "sv:Moskvas historia"
    - "en:Yuri Dolgorukiy"
  text: |
    Det första skriftliga omnämnandet av Moskva finns i en rysk krönika för år 1147. Där bjuder fursten **Jurij Dolgorukij** (”den långarmade”, kallad så för att han sträckte sin makt långt) en allierad furste till ett gästabud ”i Moskov”. Moskva var då bara en liten befäst gård vid floden Moskva i furstendömet Rostov-Suzdal, långt från Kievrus centrala delar.

    Jurij var son till storfursten [Vladimir Monomach](#vladimir-monomach) och en av många furstar som stred om makten när Kievrus splittrades [efter 1132](#kievrus-splittras-efter-1132) (se dit). Han lät 1156 bygga en träpalissad kring Moskva – den första föregångaren till **Kreml** (som betyder fästning). Han räknas som Moskvas grundare och har en ryttarstaty mitt emot stadshuset.

    I mer än hundra år var Moskva oviktigt. Först under mongolväldet på 1300-talet började dess furstar växa i makt, delvis genom att samla in skatt åt mongolerna. Ivan III (1462–1505) gjorde Moskva till centrum i en rysk stat och [annekterade Novgorod 1478](#ivan-iii-tar-novgorod-1478). Jämför: när Moskva nämndes första gången hade [Stockholm](#birger-jarl-stockholm-1250) ännu inte grundats (första omnämnandet 1252).

andrej-bogoljubskij-plundrar-kiev-1169:
  period: 1160
  label: "Andrej Bogoljubskij plundrar Kiev 1169"
  title: "Andrej Bogoljubskij plundrar Kiev 1169"
  wiki:
    - "sv:Andrej Bogoljubskij"
    - "en:Sack of Kiev (1169)"
  text: |
    **Andrej Bogoljubskij** (ca 1111–1174) var son till Jurij Dolgorukij, den furste som grundade Moskva (se [Moskva nämns 1147](#moskva-namns-forsta-gangen-1147)). Hans tillnamn betyder ”den gudsälskande” och kommer från hans residens Bogoljubovo. Han var furste av [Vladimir-Suzdal](#vladimir-suzdal) i nordöstra Ryssland (se dit) och den mäktigaste av de ryska furstarna efter att [Kievrus splittrats](#kievrus-splittras-efter-1132) (se dit).

    Kiev var fortfarande formellt huvudstad och titeln storfurste av Kiev var den förnämsta. 1169 sände Andrej en armé med allierade furstar som stormade och plundrade staden i två dagar: kyrkor och kloster plundrades och invånare fördes bort. Men i stället för att flytta dit, som tidigare segrare gjort, satte Andrej in sin yngre bror som furste och stannade själv i Vladimir.

    Det var en symbolisk vändpunkt: maktens centrum hade flyttat från Kiev i söder till nordost, och det var där – senare i Moskva – som den ryska staten växte fram. Kiev blev kvar som en av flera mindre furstestäder och ödelades sedan av [mongolerna 1240](#mongolinvasionen-123740). Händelsen har i dag politisk laddning, eftersom Rysslands och Ukrainas historieskrivningar tolkar arvet efter Kievrus olika. Andrej själv mördades av sina egna bojarer (stormän) 1174.

vladimir-suzdal:
  period: 1160
  label: "Vladimir-Suzdal"
  title: "Furstendömet Vladimir-Suzdal"
  wiki:
    - "sv:Vladimir-Suzdal"
    - "sv:Vladimir (stad)"
  text: |
    **Vladimir-Suzdal** var ett av de furstendömen som uppstod när [Kievrus splittrades efter 1132](#kievrus-splittras-efter-1132) (se dit). Det låg i nordöst, i skogslandet mellan floderna Oka och Volga, öster om dagens Moskva – ett område som tidigare varit glest befolkat av finsk-ugriska folk. Nybyggare från de oroliga södra delarna sökte sig dit, bort från stäppnomadernas plundringståg.

    Under **Jurij Dolgorukij** och hans söner **Andrej Bogoljubskij** (1157–74) och Vsevolod ”Stora boet” (1176–1212, kallad så för att han hade så många barn) blev det det starkaste ryska furstendömet. Andrej flyttade huvudstaden från Suzdal till Vladimir och lät bygga vita kalkstenskyrkor som Uspenskij-katedralen och Pokrovkyrkan vid Nerl, i dag världsarv. [1169 plundrade han Kiev](#andrej-bogoljubskij-plundrar-kiev-1169) (se dit).

    Till skillnad från [Novgorod](#novgorod-sjalvstyrande-1136), där folkmötet hade makt, styrdes Vladimir-Suzdal av furstar som stod starkare gentemot sina stormän (bojarer). Mongolerna erövrade och brände Vladimir 1238. Under mongolväldet växte sedan den lilla orten Moskva inom furstendömet till den ledande staden, och Moskvas furstar tog titeln storfurste av Vladimir. Vladimir-Suzdal är alltså den direkta föregångaren till den ryska staten.

igorkvadet-1185:
  period: 1180
  label: "Igorkvädet (1185)"
  title: "Igorkvädet"
  wiki:
    - "sv:Igorkvädet"
    - "en:The Tale of Igor's Campaign"
  text: |
    På 1100-talet var Kievriket – den östslaviska staten som är föregångare till Ryssland, Ukraina och Belarus – [splittrat i en mängd furstendömen](#kievrus-splittras-efter-1132) styrda av olika grenar av samma släkt, rurikiderna. De stred ofta med varandra och med **[kumanerna](#polovtser-kumaner-harjar)** (polovtsy), ett turkiskt nomadfolk på stäppen i söder.

    1185 ledde fursten **Igor Svjatoslavitj** av Novgorod-Severskij ett misslyckat fälttåg mot kumanerna. Hans armé förintades och han blev själv tillfångatagen men flydde. Händelsen skildras i *Slovo o polku Igoreve*, ”Sången om Igors härnad”, ett episkt diktverk som uppmanar furstarna att ena sig mot yttre fiender.

    Kvädet räknas som den östslaviska litteraturens klassiker, ungefär som Beowulf eller Rolandssången. Manuskriptet hittades på 1790-talet och brann 1812 i Moskva, och äktheten har därför ifrågasatts, men de flesta forskare anser det vara äkta. Borodins opera *Furst Igor* (1890) bygger på det. Uppmaningen till enighet fick tragisk aktualitet när [mongolerna kom 1237–40](#mongolinvasionen-123740).

riga-grundas-1201:
  period: 1200
  label: "Riga grundas 1201"
  title: "Riga grundas 1201"
  wiki:
    - "sv:Riga"
    - "en:Albert of Riga"
  text: |
    Kring Dvinas mynning i dagens Lettland bodde hedniska folk – liver och letter. Tyska köpmän hade handlat där sedan 1100-talet, och missionärer hade försökt kristna dem med liten framgång. Påven stödde därför de *[nordiska korstågen](#venden-korstaget-1147)*, krig för att erövra och kristna Baltikum.

    Biskop **Albert av Buxhövden** kom 1200 med en flotta korsfarare och grundade 1201 staden **Riga** som bas. 1202 grundades [Svärdsriddarna](#svardsriddarna) (se detta), en riddarorden som skulle erövra området. Staden byggdes av tyska köpmän och blev [hansestad](#hansan-vaxer); tyska förblev stadens överklassspråk ända in på 1900-talet.

    Riga blev huvudstaden i **Livland** (ungefär dagens Lettland och Estland), som i 300 år styrdes av en tysk elit medan lokalbefolkningen blev ofria bönder. Senare tillhörde Riga Polen, Sverige (1621–1710, då Sveriges största stad) och Ryssland. I dag är den Lettlands huvudstad med cirka 600 000 invånare.

svardsriddarna:
  period: 1200
  label: "Svärdsriddarna"
  title: "Svärdsriddarna"
  wiki:
    - "sv:Svärdsriddarorden"
    - "en:Livonian Brothers of the Sword"
  text: |
    **Svärdsriddarna** (Svärdsbrödraorden) var en riddarorden – krigare som avlagt munklöften – som grundades 1202 i Riga (se ”[Riga grundas 1201](#riga-grundas-1201)”). Namnet kommer från emblemet, ett rött svärd och kors på vit mantel. Uppgiften var att erövra och kristna de hedniska folken i Livland, ungefär dagens Lettland och Estland.

    På några decennier erövrade orden liver, letter och ester i hårda krig. Folk som underkastade sig döptes, ofta under tvång, och fick betala tionde. Orden byggde borgar och kom ofta i konflikt med biskopen och med ryska furstar i Novgorod och Pskov, som också ville ha inflytande i området.

    1236 krossades orden av litauerna i slaget vid Saule, där stormästaren och omkring 50 riddare dog. Resterna slogs 1237 samman med Tyska orden (se ”[Tyska orden 1190](#tyska-orden-1190)”) som dess livländska gren. Den gemensamma östexpansionen stoppades 1242 av [Alexander Nevskij i slaget på Peipussjöns is](#alexander-nevskij-neva-1240-peipus-1242).

slaget-vid-kalka-1223:
  period: 1220
  label: "Slaget vid Kalka 1223"
  title: "Slaget vid Kalka 1223"
  wiki:
    - "en:Battle of the Kalka River"
    - "en:Subutai"
  text: |
    Våren 1223 dök en mongolisk styrka upp på stäppen norr om Svarta havet. Den leddes av generalerna **Jebe** och **Subutai**, sända av Djingis khan på en lång spaningsritt runt Kaspiska havet – uppskattningsvis 20 000–30 000 ryttare. Kumanerna (ett turkiskt nomadfolk på stäppen) bad de ryska furstarna om hjälp.

    ”[Ryssland](#ryssland-in-i-centralasien)” var då inget enat land utan *Kievriket* – ett lapptäcke av furstendömen (Kiev, Tjernigov, Galitj, Smolensk m.fl.) styrda av släktingar som ofta krigade med varandra. Flera furstar samlade en armé, kanske några tiotusen man (siffrorna är osäkra). Vid floden Kalka, i dagens östra Ukraina, låtsades mongolerna fly, drog ut de allierade i ett långt led och slog dem sedan i stycken. Enligt krönikorna kvävdes tillfångatagna furstar under en träplattform som mongolerna höll segerfest på.

    Sedan red mongolerna bara hem. Ryssarna visste inte vilka de var och glömde dem nästan. Fjorton år senare kom de tillbaka med en hel armé (se ”[mongolinvasionen 1237–40](#mongolinvasionen-123740)”). Kalka är ett tidigt exempel på mongolernas metod: rörlighet, låtsad reträtt och noggrann spaning innan den stora invasionen.

mongolinvasionen-123740:
  period: 1220
  label: "mongolinvasionen 1237–40"
  title: "Mongolernas erövring av Ryssland 1237–1240"
  wiki:
    - "en:Mongol invasion of Kievan Rus'"
    - "sv:Batu khan"
  text: |
    Vintern 1237 gick en mongolisk armé under **Batu** (sonson till Djingis khan) och generalen Subutai in i de ryska furstendömena, kanske 100 000–150 000 man inklusive turkiska hjälptrupper (uppskattningarna varierar mycket). De anföll på vintern med avsikt: frusna floder fungerade som vägar för kavalleriet.

    Städerna föll en efter en: Rjazan i december 1237, Vladimir i februari 1238, därefter ett tiotal andra. Novgorod klarade sig – vårens tjällossning gjorde marken till lera och mongolerna vände ca 100 km före staden. 1240 föll **Kiev**, då en av Östeuropas största städer; ett påvligt sändebud som passerade några år senare rapporterade att bara ett par hundra hus stod kvar. Befolkningsförlusterna går inte att räkna exakt men var mycket stora.

    Följden blev ungefär 240 år av mongoliskt överherravälde, i rysk historieskrivning kallat *tatarokket* ([fram till 1480](#fri-fran-horden-1480)). Furstarna fick behålla sina länder men betalade tribut till [Gyllene horden (se den)](#gyllene-horden). Tyngdpunkten i rysk historia flyttade från Kiev till nordost, där Moskva så småningom växte fram genom att samarbeta med mongolerna. Direkt efteråt, 1241, fortsatte samma armé in i Polen och Ungern.

alexander-nevskij-neva-1240-peipus-1242:
  period: 1240
  label: "Alexander Nevskij: Neva 1240, Peipus 1242"
  title: "Alexander Nevskij: Neva 1240 och Peipus 1242"
  wiki:
    - "sv:Alexander Nevskij"
    - "en:Battle on the Ice"
    - "sv:Slaget vid Neva"
  text: |
    **Alexander Jaroslavitj** (ca 1221–1263) var furste av **Novgorod**, en rik handelsrepublik i nordvästra Ryssland som klarat sig undan mongolernas förödelse. Novgorod var hotat från väst av svenskar och tyska riddare, som ville ta kontroll över handeln och omvända de ortodoxa till katolicismen.

    1240 besegrade han en svensk styrka vid floden **Neva**, där S:t Petersburg senare grundades; därav tillnamnet Nevskij. Slaget nämns inte i svenska källor och var sannolikt en mindre sammandrabbning. I april 1242 slog han **Livländska orden** – en gren av Tyska orden, tyska korsriddare som erövrat Baltikum – på den frusna sjön Peipus, på gränsen mellan dagens Estland och Ryssland. Arméerna räknades troligen i några tusen.

    Mot mongolerna valde Alexander en annan väg: underkastelse. Han reste till [Gyllene horden](#gyllene-horden) och till Karakorum, blev storfurste av Vladimir med khanens stöd och hjälpte till att driva in tributen. Han helgonförklarades av ortodoxa kyrkan och gjordes till nationalhjälte, särskilt i Eisensteins film från 1938, där isslaget skildras som ett dramatiskt slag mot tyskarna, lagom inför andra världskriget.

gyllene-horden:
  period: 1240
  label: "Gyllene horden"
  title: "Gyllene horden"
  wiki:
    - "sv:Gyllene horden"
    - "en:Mongol yoke"
  text: |
    **Gyllene horden** var den västligaste delen av Mongolväldet, grundad ca 1242 av **Batu**, sonson till Djingis khan. Den omfattade stäpperna från Ural till Donau och från Kaspiska havet norrut. Huvudstaden **Saraj** låg vid Volgas nedre lopp och blev en stor handelsstad. Namnet är ryskt och senare; khanatet kallade sig ungefär ”Jochis ulus” (Jochis folk/rike, efter Djingis äldste son).

    Mongolerna själva var få; majoriteten av khanatets befolkning var turkisktalande nomader (kiptjaker), och härskarna övergick till islam och turkiskt språk under 1300-talet. Därför kallas de i ryska källor ofta *tatarer*.

    De ryska furstendömena styrdes inte direkt utan var vasaller. En furste behövde khanens *jarlyk* (utnämningsbrev) och fick resa till Saraj för att få det, och betalade tribut. [Detta varade till 1480](#fri-fran-horden-1480). Gyllene horden splittrades på 1400-talet i khanaten Kazan, Astrachan, Krim m.fl. Krimkhanatet överlevde till 1783 och gjorde ännu [1571 en räd som brände Moskva](#krimtatarer-branner-moskva-1571). Dagens tatarer i Tatarstan och på Krim är delvis ättlingar.

tribut-till-gyllene-horden:
  period: 1260
  label: "Tribut till Gyllene horden"
  title: "Tributen till Gyllene horden"
  wiki:
    - "en:Mongol yoke"
    - "sv:Gyllene horden"
  text: |
    Efter mongolernas erövring 1237–40 styrdes de ryska furstendömena inte direkt av mongolerna utan förblev under sina egna furstar – som vasaller till **Gyllene horden** ([se den](#gyllene-horden)), mongolernas västliga khanat med huvudstad vid Volga.

    Systemet byggde på två saker. För det första måste varje furste ha khanens *jarlyk*, ett utnämningsbrev, och resa till Saraj (ibland ända till Karakorum i Mongoliet) för att få det. Furstar som misshagade khanen kunde avrättas. För det andra skulle furstendömena betala tribut, en årlig skatt i silver och pälsar, och ställa upp med soldater. 1257–59 genomförde mongolerna en folkräkning i Ryssland för att fastställa skatten. Den första tiden drevs den in av mongoliska ämbetsmän (*basqaq*), vilket ledde till uppror, bl.a. i Novgorod.

    Med tiden fick de ryska storfurstarna själva uppgiften att samla in tributen. Det gynnade **Moskva**: dess furstar blev khanens skatteindrivare, berikade sig och köpte upp grannarnas land. Moskva kunde på så sätt bygga upp sin makt och slutligen vägra betala – efter mötet vid [floden Ugra 1480](#fri-fran-horden-1480), då en tatarisk armé drog sig tillbaka utan strid. Ryssarna kallar perioden ”tatarokket”.

moskva-eget-furstendome:
  period: 1280
  label: "Moskva eget furstendöme"
  title: "Moskva blir eget furstendöme"
  wiki:
    - "en:Grand Duchy of Moscow"
    - "en:Daniel of Moscow"
  text: |
    Under 1200-talet var de ryska områdena splittrade i många furstendömen och sedan 1240 underställda **Gyllene horden** – den mongoliska staten vid Volga som tog ut skatt (tribut) av de ryska furstarna och utsåg vem som fick vara storfurste. Moskva var då en obetydlig liten stad.

    Omkring 1280-talet fick Moskva en egen furste, **Daniel**, yngste son till [Alexander Nevskij](#alexander-nevskij-neva-1240-peipus-1242) (som besegrat svenskarna vid Neva 1240). Daniel ärvde den minsta och fattigaste delen. Men Moskvas läge var bra: vid floder som förband viktiga handelsvägar och skyddat av skog mot räder från stäppen.

    Daniels ättlingar byggde systematiskt upp makten genom att köpa land, gifta sig rätt och samarbeta med mongolerna. Ivan Kalita fick titeln storfurste 1328 ([se det](#ivan-kalita-storfurste-1328)), och kyrkans ledare flyttade till Moskva ([se det](#metropoliten-flyttar-till-moskva)). Om ungefär 200 år var Moskva centrum för hela Ryssland, och [1480 slutade det betala tribut](#fri-fran-horden-1480) till horden. Daniels ätt styrde ända till 1598. Från en stad med kanske några tusen invånare växte en av världens största stater.

metropoliten-flyttar-till-moskva:
  period: 1300
  label: "Metropoliten flyttar till Moskva"
  title: "Metropoliten flyttar till Moskva"
  wiki:
    - "en:Metropolitan of Kiev and all Rus'"
    - "en:Peter of Moscow"
  text: |
    Den ryska ortodoxa kyrkan leddes av en **metropolit** – den högste biskopen, ungefär en ärkebiskop – som var underställd patriarken i Konstantinopel. Metropoliten hade suttit i Kiev, men efter mongolernas förstörelse av staden 1240 flyttade han 1299 till Vladimir i nordost.

    Metropoliten **Peter** knöt nära band till Moskvas furstar och dog i Moskva 1326, där han begravdes. Hans efterträdare **Theognostos** slog sig ned i Moskva permanent. Moskva var då ännu en ganska liten stad och konkurrerade med Tver om att bli den ledande ryska staden.

    Flytten gav Moskva enorm prestige: staden blev det andliga centrumet för alla ryska kristna. Kyrkan stod för skrift, lärdom och ideologi, och den stödde Moskvas furstar som de som skulle samla de ryska länderna ([se Ivan Kalita 1328](#ivan-kalita-storfurste-1328)). Jämför med hur påvens närvaro gav Rom auktoritet. När [Konstantinopel föll 1453](#konstantinopel-faller-1453) framställdes Moskva som ”det tredje Rom”, arvtagaren till både det romerska och det bysantinska riket. Kyrkans koppling till statsmakten i Moskva består än idag.

ivan-kalita-storfurste-1328:
  period: 1320
  label: "Ivan Kalita, storfurste 1328"
  title: "Ivan Kalita blir storfurste 1328"
  wiki:
    - "en:Ivan I of Moscow"
  text: |
    **Ivan I** av Moskva (furste 1325–1340) kallas **Kalita**, ”penningpungen”, för sin snålhet eller rikedom. Han var sonsons son till [Alexander Nevskij](#alexander-nevskij-neva-1240-peipus-1242). Ryssland var vid denna tid vasall under **[Gyllene horden](#gyllene-horden)**, den mongoliska stat vid Volga som bestämde vilken rysk furste som fick titeln *storfurste* av Vladimir och därmed vara de övrigas överhuvud.

    1327 gjorde staden Tver, Moskvas huvudrival, uppror mot de mongoliska skatteindrivarna. Ivan erbjöd sig att slå ned upproret och deltog i en mongolisk straffexpedition som ödelade Tver. Som belöning fick han 1328 storfurstetiteln och rätten att samla in skatten åt horden från andra ryska furstar.

    Det blev grunden för Moskvas makt: en del av pengarna stannade i Moskva, och Ivan använde dem för att köpa land och byar. Han fick också metropoliten, kyrkans ledare, att bosätta sig i Moskva ([se det](#metropoliten-flyttar-till-moskva)). Från 1328 behöll Moskvas furstar nästan alltid storfurstetiteln. Det var början på den process som gjorde Moskva till huvudstad i ett enat Ryssland. Strategin – samarbeta med den starke för att bli starkast själv – är typisk för Moskvas tidiga historia.

digerdoden-1352:
  period: 1340
  label: "Digerdöden 1352"
  title: "Digerdöden i Ryssland 1352–1353"
  wiki:
    - "en:Black Death"
    - "en:Simeon of Moscow"
  text: |
    Pesten nådde de ryska furstendömena 1352, troligen västerifrån via handelsstäderna **Pskov** och **Novgorod**, som hade nära kontakt med Hansan och Östersjöhandeln. Därifrån spred den sig till Moskva 1353. Ryssland var då inte en enad stat utan en samling furstendömen som betalade tribut till [Gyllene horden](#gyllene-horden), den mongoliska staten på stäppen i söder.

    Krönikorna beskriver massdöd: i Pskov ska prästerna inte ha hunnit begrava de döda var för sig utan lagt flera i varje grav. Exakta dödstal finns inte. I Moskva dog storfursten **Simeon den stolte** 1353, tillsammans med sina söner och kyrkans överhuvud, metropoliten Theognost. Tronen gick därför till Simeons bror Ivan II, och sedan vidare till dennes son Dmitrij Donskoj ([se 1360-talet](#dmitrij-donskoj)).

    Precis som i Västeuropa kom pesten tillbaka i flera vågor under resten av 1300-talet. Att den så tydligt slog mot Moskvas härskarfamilj visar hur slumpartat pesten kunde ändra politiken – en tronföljd kunde avgöras av vilka som råkade överleva.

kremls-stenmur-1367:
  period: 1360
  label: "Kremls stenmur 1367"
  title: "Kremls första stenmur 1367"
  wiki:
    - "sv:Kreml"
    - "en:Moscow Kremlin Wall"
  text: |
    **Kreml** betyder ungefär ”borg” på ryska; många ryska städer har ett. Moskvas Kreml var från början en träborg på en kulle vid Moskvafloden. På 1300-talet var Moskva ett av flera ryska furstendömen som alla betalade tribut till [Gyllene horden](#gyllene-horden), den mongoliska staten på stäppen i söder, och konkurrerade med t.ex. Tver och Litauen om ledarskapet.

    Efter en stor brand 1365 lät den unge storfursten **Dmitrij** (senare kallad Donskoj, [se nästa punkt](#dmitrij-donskoj)) bygga en mur av vit kalksten runt Kreml 1367–68 – den första stenbefästningen i nordöstra Ryssland. Den stod emot belägringar från litauerna 1368 och 1370 och gav Moskva ett försprång. Staden fick smeknamnet ”vitstensstaden”.

    Muren skyddade dock inte mot allt: Tochtamysj brände Moskva 1382 ([se den punkten](#tochtamysj-branner-moskva-1382)). De röda tegelmurar och torn man ser idag byggdes 1485–1495 av italienska arkitekter, ungefär 2,2 km långa, under [Ivan III](#ivan-iii-tar-novgorod-1478) – den furste som slutligen gjorde sig fri från mongolerna. Kreml blev symbol för Moskvas och sedan Rysslands statsmakt, och är fortfarande presidentens säte.

dmitrij-donskoj:
  period: 1360
  label: "Dmitrij Donskoj"
  title: "Dmitrij Donskoj (1350–1389)"
  wiki:
    - "sv:Dmitrij Donskoj"
    - "sv:Gyllene horden"
  text: |
    **Dmitrij Ivanovitj** var storfurste av Moskva från 1359, då han bara var nio år. Under hans barndom styrde metropoliten Aleksej, ledaren för den ryska kyrkan, i hans namn. Ryssland var då ett lapptäcke av furstendömen som betalade tribut till **[Gyllene horden](#gyllene-horden)**, den mongoliska staten på stäppen, och vars furstar behövde khanens godkännande, en s.k. *jarlyk*, för att få storfurstetiteln.

    Dmitrij är känd för tre saker: han lät bygga [Kremls första stenmur 1367](#kremls-stenmur-1367), han stärkte Moskva gentemot rivalerna Tver och Litauen, och framför allt besegrade han 1380 en mongolisk armé vid **Kulikovo** nära floden Don – därav tillnamnet Donskoj, ”från Don”. Det var första gången en rysk furste slog horden i ett stort fältslag ([se Kulikovo 1380](#kulikovo-1380)).

    Segern gav inte självständighet. Två år senare brändes Moskva av khanen [Tochtamysj](#tochtamysj-branner-moskva-1382), och tributen fick fortsätta betalas i ungefär hundra år till. Men Dmitrij blev symbol för rysk motståndskraft och för Moskvas anspråk på att leda Ryssland. Han förklarades helgon av rysk-ortodoxa kyrkan 1988.

kulikovo-1380:
  period: 1380
  label: "Kulikovo 1380"
  title: "Slaget vid Kulikovo 1380"
  wiki:
    - "sv:Slaget vid Kulikovo"
    - "sv:Dmitrij Donskoj"
  text: |
    De ryska furstendömena hade sedan 1240 varit underställda **[Gyllene horden](#gyllene-horden)**, den mongoliska staten på stäppen norr om Svarta och Kaspiska havet, och betalat tribut. På 1370-talet var horden splittrad av inbördesstrider, och den verklige makthavaren var krigsherren **Mamaj**. [Moskvas storfurste Dmitrij](#dmitrij-donskoj) slutade betala tribut.

    Den 8 september 1380 möttes Dmitrijs armé och Mamajs armé på **Kulikovo pole**, ”snäppfältet”, vid floden Don söder om Moskva. Arméernas storlek är mycket osäker: krönikorna talar om hundratusentals, men moderna forskare tror snarare på kanske några tiotusen på varje sida. Ryssarna vann efter en blodig strid, avgjord när en dold reservstyrka anföll i flanken. Litauiska trupper som var på väg för att hjälpa Mamaj kom aldrig fram.

    Segern var den första stora ryska segern över mongolerna och gav Dmitrij namnet **Donskoj**. Men den gav ingen frihet: två år senare brände khanen Tochtamysj Moskva ([se nästa punkt](#tochtamysj-branner-moskva-1382)) och [tributen fortsatte till 1480](#fri-fran-horden-1480). Ändå blev Kulikovo en symbol i rysk historieskrivning, där Moskva för första gången ledde de ryska furstarna gemensamt mot en yttre fiende.

tochtamysj-branner-moskva-1382:
  period: 1380
  label: "Tochtamysj bränner Moskva 1382"
  title: "Tochtamysj bränner Moskva 1382"
  wiki:
    - "en:Siege of Moscow (1382)"
    - "en:Tokhtamysh"
  text: |
    **Tochtamysj** var en ättling till Djingis khan som, med stöd av [Timur Lenk](#timur-lenk-i-samarkand-1370), enade [Gyllene horden](#gyllene-horden) igen efter decennier av inbördeskrig. Han besegrade Mamaj, som just förlorat vid [Kulikovo 1380](#kulikovo-1380), och ville återställa hordens grepp om de ryska furstarna.

    I augusti 1382 dök han oväntat upp vid Moskva med en armé. Storfursten [Dmitrij Donskoj](#dmitrij-donskoj) var bortrest för att samla trupper. Stadsborna försvarade sig i tre dagar bakom Kremls nya stenmur ([se 1367](#kremls-stenmur-1367)), men släppte sedan in tatarerna efter löften om att staden skulle skonas. Löftet bröts: Moskva plundrades och brändes, och enligt krönikorna dödades tusentals invånare – siffran 24 000 nämns, men den är osäker.

    Dmitrij tvingades återuppta tributbetalningarna och skicka sin son som gisslan till horden. Bara två år efter den stora segern vid Kulikovo visade detta att Moskva ännu inte kunde stå på egna ben. Tochtamysj själv vände sig senare mot sin beskyddare Timur, som i två krig 1391 och 1395 krossade honom och ödelade hordens städer. Det försvagade horden permanent och gynnade på sikt Moskva.

litauen-stormakt-vytautas:
  period: 1400
  label: "Litauen stormakt (Vytautas)"
  title: "Vytautas och Litauens storhetstid"
  wiki:
    - "sv:Vytautas"
    - "sv:Storfurstendömet Litauen"
  text: |
    **Storfurstendömet Litauen** var under 1300-talet Europas sista hedniska stat. Det hade vuxit enormt genom att ta över ryska furstendömen efter att mongolerna försvagat dem, och omfattade stora delar av dagens Vitryssland och Ukraina. Det mesta av befolkningen var ortodoxt kristna östslaver.

    **Vytautas** (ca 1350–1430), kallad ”den store”, var kusin till kung Jagiełło, som 1386 blivit kung av Polen. Efter år av inbördeskrig mellan kusinerna blev Vytautas 1392 storfurste i Litauen och styrde landet i praktiken självständigt, men i förbund med Polen. Tillsammans krossade de Tyska orden vid **Grunwald 1410** ([se den punkten](#grunwald-1410-tyska-orden-slas)).

    Under Vytautas nådde Litauen sin största utbredning, från Östersjön nästan ner till Svarta havet – ungefär en miljon kvadratkilometer, mer än dubbelt så stort som Sverige. Han blandade sig också i [Gyllene hordens](#gyllene-horden) inbördesstrider, men led ett svårt nederlag mot horden vid floden Vorskla 1399. Unionen med Polen fördjupades och blev 1569 en gemensam stat, **Polsk-litauiska samväldet**, en av Europas största stater fram till delningarna på 1700-talet.

gyllene-horden-splittras:
  period: 1400
  label: "Gyllene horden splittras"
  title: "Gyllene horden faller sönder"
  wiki:
    - "sv:Gyllene horden"
    - "en:Disintegration of the Golden Horde"
  text: |
    **Gyllene horden** var den mongoliska staten som efter Djingis khans erövringar styrde stäpperna från Svarta havet till Kazakstan, med huvudstad Saraj vid Volga. Den tog tribut av de ryska furstendömena från 1240-talet. Härskarklassen var mongolisk men befolkningen till stor del turkisktalande, och de kallas ofta *tatarer*.

    Hordens försvagning började [med pesten på 1340-talet](#pesten-sprids-langs-sidenvagen) och ett långt inbördeskrig 1359–1380. Det avgörande slaget kom när **[Timur Lenk](#timur-lenk-i-samarkand-1370)** 1395 krossade khanen Tochtamysj och förstörde hordens städer och handelsplatser längs Volga. Under 1400-talets början styrde krigsherren Edigu i praktiken, men efter hans död 1419 föll horden sönder.

    Under de följande decennierna bröt flera självständiga **khanat** loss: Kazan (ca 1438), Krim (1441), Astrachan (1466) och Sibir. Det som blev kvar kallades Stora horden. Splittringen gjorde det möjligt för [Moskva att 1480 sluta betala tribut](#fri-fran-horden-1480) – ”stillaståendet vid floden Ugra”. Ivan den förskräcklige [erövrade senare Kazan (1552) och Astrachan (1556)](#tar-kazan-1552-astrachan-1556), vilket öppnade vägen mot Sibirien. Krimkhanatet överlevde som osmansk vasall till 1783.

vasilij-ii-inbordeskrig:
  period: 1420
  label: "Vasilij II, inbördeskrig"
  title: "Vasilij II och det moskovitiska inbördeskriget"
  wiki:
    - "en:Vasily II of Moscow"
    - "en:Muscovite War of Succession"
  text: |
    Kring 1400-talets början var Ryssland inte ett enat land utan en samling furstendömen som betalade tribut (årlig skatt) till **[Gyllene horden](#gyllene-horden)**, det mongoliska khanatet på stäppen. Det starkaste furstendömet var **Moskva**, vars storfurste samlade in skatten åt mongolerna.

    **Vasilij II** blev storfurste 1425 som tioåring. Hans farbror Jurij hävdade att han själv hade rätt till tronen enligt den äldre principen att bröder ärver före söner. Det ledde till ett inbördeskrig som pågick 1425–1453 med flera tronbyten. 1445 tillfångatogs Vasilij av tatarerna och fick betala en enorm lösesumma. 1446 tog hans kusin Dmitrij Sjemjaka honom till fånga och lät sticka ut hans ögon – därefter kallades han *Vasilij den blinde*.

    Vasilij vann ändå till slut, med stöd av kyrkan och den moskovitiska adeln. Resultatet blev att principen far–son-arv slog igenom och att makten koncentrerades till storfursten.

    Hans son **Ivan III** (1462–1505) kunde sedan [lägga under sig Novgorod](#ivan-iii-tar-novgorod-1478) och [1480 sluta betala tribut](#fri-fran-horden-1480) till mongolerna – grunden för den ryska staten.

rysk-kyrka-sjalvstandig-1448:
  period: 1440
  label: "Rysk kyrka självständig 1448"
  title: "Ryska kyrkan blir självständig 1448"
  wiki:
    - "en:Russian Orthodox Church"
    - "en:Jonah (metropolitan of Moscow)"
    - "en:Council of Florence"
  text: |
    Den ryska kyrkan var en del av den **ortodoxa** (östliga) kristendomen, och sedan kristnandet 988 hade den letts av en metropolit (ärkebiskop) som utsågs av patriarken i Konstantinopel, ofta en grek.

    1439, vid **kyrkomötet i Florens**, gick den bysantinske kejsaren och patriarken med på en union med den katolska kyrkan under påven. Bysans var desperat efter militär hjälp mot osmanerna. Metropoliten av Moskva, grekern **Isidoros**, skrev under. När han kom hem 1441 lät [storfursten Vasilij II](#vasilij-ii-inbordeskrig) arrestera honom; han flydde sedan till Rom.

    1448 valde en församling av ryska biskopar på egen hand **Jona** till metropolit, utan att fråga Konstantinopel. Det innebar i praktiken att den ryska kyrkan blev **autokefal** – självstyrande med eget överhuvud. Efter [Konstantinopels fall 1453](#konstantinopel-faller-1453) fanns det inte längre någon ortodox kejsare, och i Moskva växte idén att Ryssland var den sanna ortodoxins sista försvarare, ”det tredje Rom”.

    1589 fick Moskva sin egen patriark. Kyrkans nära band till storfurste- och senare tsarmakten präglar fortfarande relationen mellan stat och kyrka i Ryssland.

kazan-khanatet:
  period: 1440
  label: "Kazan-khanatet"
  title: "Kazankhanatet"
  wiki:
    - "en:Khanate of Kazan"
    - "sv:Gyllene horden"
  text: |
    **[Gyllene horden](#gyllene-horden)** var det mongoliska rike som sedan 1240-talet dominerade stäppen norr om Svarta och Kaspiska havet och tog ut tribut från de ryska furstendömena. [Under 1400-talet föll det sönder](#gyllene-horden-splittras) i flera mindre **khanat** (stater ledda av en khan, en mongolisk-turkisk härskartitel).

    **Kazankhanatet** grundades omkring 1438 av khanen Ulugh Muhammad, som drivits bort från Gyllene horden. Det låg vid floden Volga, kring staden Kazan i nuvarande Tatarstan, cirka 800 km öster om Moskva. Befolkningen var till stor del muslimska tatarer (turkisktalande ättlingar till folken i horden). Andra efterföljarstater var Krimkhanatet (1441), Astrachan och Sibir.

    Kazan var en rik handelsstad som kontrollerade handeln längs Volga mot Kaspiska havet och Persien. Khanatet gjorde ofta räder in i ryska områden och tog fångar som såldes som slavar. 1445 tillfångatog Ulugh Muhammads söner till och med [storfursten Vasilij II](#vasilij-ii-inbordeskrig) av Moskva.

    [1552 erövrade Ivan IV](#tar-kazan-1552-astrachan-1556) (den förskräcklige) Kazan efter en belägring med uppskattningsvis 150 000 man. Det var Rysslands första erövring av en icke-rysk muslimsk stat och öppnade vägen österut mot Sibirien.

ivan-iii-tar-novgorod-1478:
  period: 1460
  label: "Ivan III tar Novgorod 1478"
  title: "Moskva annekterar Novgorod 1478"
  wiki:
    - "en:Ivan III of Russia"
    - "en:Novgorod Republic"
  text: |
    **Ivan III** (storfurste av Moskva 1462–1505, kallad ”den store”) är den som gjorde Moskva till kärnan i ett ryskt rike. Före honom var det som i dag är Ryssland ett lapptäcke av furstendömen, och alla betalade tribut till mongolernas [Gyllene horden](#gyllene-horden).

    **Novgorod** var ett av de rikaste: en handelsrepublik i nordväst som styrdes av en folkförsamling (*veche*) och hade nära band till [Hansan](#hansan-vaxer), det tyska handelsförbundet, som hade ett kontor i staden. Novgorods landområden sträckte sig ända till Uralbergen, mycket större än Moskvas eget område.

    Ivan besegrade Novgorod vid floden Sjelon 1471 och tog 1478 över staden helt. Vecheklockan, symbolen för stadens självstyre, fraktades till Moskva och tusentals familjer tvångsflyttades. 1494 stängde Ivan Hansans kontor. Med Novgorod ungefär fördubblades Moskvas territorium, och vägen var öppen för den ryska expansionen österut. Se även hur [Pskov annekterades 1510](#vasilij-iii-tar-pskov-smolensk).

fri-fran-horden-1480:
  period: 1460
  label: "fri från horden 1480"
  title: "Stilleståndet vid Ugra 1480"
  wiki:
    - "en:Great Stand on the Ugra River"
    - "en:Golden Horde"
  text: |
    Sedan [mongolerna erövrade de ryska furstendömena](#mongolinvasionen-123740) på 1240-talet hade de betalat tribut till **[Gyllene horden](#gyllene-horden)** – det mongoliska (senare tatariska) riket på stäppen norr om Svarta havet och Kaspiska havet. Ryska furstar måste få sin makt bekräftad av khanen. Ryssar kallar perioden ”tatarokets tid”, ungefär 240 år.

    [Ivan III](#ivan-iii-tar-novgorod-1478) hade slutat betala tribut. 1480 marscherade khan **Achmat** mot Moskva, och arméerna ställde upp på var sin sida om floden **Ugra**, cirka 200 km sydväst om Moskva. I flera veckor hände nästan ingenting utom skärmytslingar. När vintern kom och Achmats allierade (Polen–Litauen) uteblev drog han sig tillbaka. Han dödades kort därefter av en rival.

    Det blev inget stort slag, men resultatet räknas som slutet på mongolväldet över Ryssland. Gyllene horden splittrades och upphörde 1502. Moskva var nu en självständig stormakt, och efterföljarna (khanaten Kazan, Astrachan och Krim) erövrades senare av Ryssland – de två första av [Ivan den förskräcklige på 1550-talet](#tar-kazan-1552-astrachan-1556).

ivan-iii-gifter-sig-med-bysantinsk:
  period: 1480
  label: "Ivan III gifter sig med bysantinsk prinsessa, tsartitel"
  title: "Ivan III, Sofia Palaiologina och tsartiteln"
  wiki:
    - "en:Sophia Palaiologina"
    - "en:Moscow, third Rome"
    - "en:Tsar"
  text: |
    1472 gifte sig storfursten **Ivan III** av Moskva med **Sofia (Zoe) Palaiologina**, brorsdotter till den siste bysantinske (östromerske) kejsaren, som stupat när osmanerna tog [Konstantinopel 1453](#konstantinopel-faller-1453). Äktenskapet förmedlades av påven, som hoppades få Ryssland med i ett korståg mot turkarna – det blev inget av det.

    För Moskva gav giftet prestige: Ivan började använda den bysantinska dubbelörnen som riksvapen (den finns kvar i Rysslands statsvapen i dag) och ett bysantinskt hovceremoniel. Efter [befrielsen från mongolerna 1480](#fri-fran-horden-1480) kallade han sig ibland **tsar** – ryska för ”kejsare”, från latinets *Caesar*. Hans sonson [Ivan IV (den förskräcklige)](#ivan-den-forskracklige-tsar-1547) kröntes formellt till tsar 1547.

    Runt 1500 formulerades också idén om Moskva som ”det tredje Rom”: Rom hade fallit i kätteri, Konstantinopel till turkarna, och nu var Moskva den sanna kristenhetens centrum. Ivan lät dessutom italienska arkitekter [bygga om Kreml](#kremls-stenmur-1367) med de tegelmurar och katedraler som står där i dag.

vasilij-iii-tar-pskov-smolensk:
  period: 1500
  label: "Vasilij III tar Pskov, Smolensk"
  title: "Vasilij III tar Pskov 1510 och Smolensk 1514"
  wiki:
    - "en:Vasili III of Russia"
    - "en:Pskov Republic"
    - "en:Siege of Smolensk (1514)"
  text: |
    **Vasilij III** (storfurste av Moskva 1505–1533) var son till Ivan III och Sofia Palaiologina. Han fortsatte faderns arbete med att ”samla de ryska länderna” under Moskva.

    **Pskov** var, liksom Novgorod ([se 1478](#ivan-iii-tar-novgorod-1478)), en självstyrande handelsrepublik i nordväst med en folkförsamling. 1510 annekterades den: vecheklockan togs ned och omkring 300 ledande familjer tvångsflyttades. Därmed fanns inga självständiga ryska stadsrepubliker kvar – Moskvas envälde hade inga konkurrenter.

    **Smolensk**, en viktig fästningsstad vid Dnepr på vägen mot väst, hade tillhört storfurstendömet Litauen i över hundra år. Efter flera belägringar intog Vasilij den 1514 med hjälp av artilleri. Samma år besegrades dock ryssarna stort av Polen–Litauen vid Orsja. Smolensk bytte ägare flera gånger fram till 1600-talet. Vasilijs son blev Ivan IV, ”den förskräcklige”, [Rysslands förste krönte tsar 1547](#ivan-den-forskracklige-tsar-1547).

vasilij-iii:
  period: 1520
  label: "Vasilij III"
  title: "Vasilij III, storfurste av Moskva 1505–1533"
  wiki:
    - "sv:Vasilij III av Ryssland"
    - "en:Vasili III of Russia"
  text: |
    **Vasilij III** var storfurste av Moskva – ledare för det furstendöme som höll på att bli Ryssland – och son till Ivan III, som hade [brutit tatarernas överhöghet 1480](#fri-fran-horden-1480). Vasilij fortsatte faderns politik att samla de ryska furstendömena under Moskva.

    Han annekterade de sista självständiga ryska stadsstaterna och furstendömena: [Pskov 1510](#vasilij-iii-tar-pskov-smolensk) och Rjazan omkring 1521, och erövrade Smolensk från Polen-Litauen 1514. Därmed var i stort sett hela det ryska kärnområdet förenat. Styret var autokratiskt: adeln (bojarerna) hölls kort.

    Under hans tid formulerades idén om Moskva som ”det tredje Rom”: efter att Konstantinopel (det andra Rom) [fallit till osmanerna 1453](#konstantinopel-faller-1453) sågs Moskva som den ortodoxa kristenhetens centrum. Han dog 1533, och hans son blev vid tre års ålder storfurste – det var **Ivan IV**, senare kallad den förskräcklige (se [Ivan den förskräcklige tsar 1547](#ivan-den-forskracklige-tsar-1547)).

ivan-den-forskracklige-tsar-1547:
  period: 1540
  label: "Ivan den förskräcklige tsar 1547"
  title: "Ivan IV kröns till tsar 1547"
  wiki:
    - "sv:Ivan IV av Ryssland"
    - "en:Ivan the Terrible"
  text: |
    **Ivan IV** (1530–1584) blev storfurste av Moskva vid tre års ålder 1533 och växte upp under maktkamp mellan adelsfamiljerna (bojarerna). 1547, vid 16 års ålder, kröntes han som den förste som officiellt bar titeln **tsar** – av latinets *caesar*, kejsare. Titeln markerade att Moskva såg sig som efterträdare till det bysantinska riket.

    De första åren präglades av reformer: en ny lagbok 1550, en första riksförsamling (zemskij sobor) och ett stående infanteri med musköter, streltsy. Han erövrade de tatariska khanaten Kazan och Astrachan (se [tar Kazan 1552, Astrachan 1556](#tar-kazan-1552-astrachan-1556)). Från 1558 förde han det utdragna Livländska kriget om Baltikum, som han till slut förlorade mot Polen-Litauen och Sverige.

    Efter hustrun Anastasias död 1560 blev han alltmer misstänksam och brutal: [terrorregimen opritjnina](#opritjnina) (se Opritjnina), och 1581 dödade han i raseri sin egen son och tronföljare. Öknamnet *Groznyj* betyder egentligen ”den som injagar fruktan”. Hans död ledde så småningom till dynastins slut och kaoset ”[den stora oredan](#stora-oredan)” omkring 1600.

tar-kazan-1552-astrachan-1556:
  period: 1540
  label: "tar Kazan 1552, Astrachan 1556"
  title: "Ryssland erövrar Kazan 1552 och Astrachan 1556"
  wiki:
    - "en:Siege of Kazan (1552)"
    - "sv:Kazankhanatet"
  text: |
    Efter att mongolernas Gyllene horden föll sönder på 1400-talet bildades flera tatariska khanat – muslimska turkspråkiga stater ledda av ättlingar till Djingis khan. Kazan låg vid mellersta Volga och Astrachan vid Volgas mynning i Kaspiska havet. Därifrån gjordes räder mot ryska områden, där tusentals människor fördes bort som slavar.

    1552 belägrade [Ivan IV](#ivan-den-forskracklige-tsar-1547) Kazan med en armé på uppskattningsvis 100 000–150 000 man och stormade staden efter att ha sprängt murarna med krut. Till minne av segern byggdes Vasilijkatedralen på Röda torget i Moskva. 1556 föll även Astrachan, nästan utan strid.

    Därmed kontrollerade Moskva hela Volga, Europas längsta flod (ca 3 500 km), och handelsvägen till Kaspiska havet och Persien. Det var första gången Ryssland erövrade en icke-rysk, icke-ortodox stat – början på det mångetniska imperiet. Vägen österut låg öppen: [från 1580-talet tog kosacker sig över Uralbergen in i Sibirien](#jermak-erovrar-sibirien) och nådde Stilla havet redan 1639.

opritjnina:
  period: 1560
  label: "Opritjnina"
  title: "Opritjnina (1565–1572)"
  wiki:
    - "sv:Opritjnina"
    - "en:Oprichnina"
  text: |
    **Opritjnina** var namnet på en terrorpolitik som tsar Ivan IV (”den förskräcklige”, se [Ivan den förskräcklige tsar 1547](#ivan-den-forskracklige-tsar-1547)) införde 1565. Ivan, som var övertygad om att adeln (bojarerna) konspirerade mot honom, lämnade plötsligt Moskva och hotade abdikera. Han återvände bara på villkoret att få obegränsad makt att straffa förrädare.

    Han delade landet i två delar: opritjnina (ordet betyder ungefär ”det som är avskilt”), ett område som tsaren styrde personligen, och resten, som styrdes som förut. I opritjnina-området fanns en särskild styrka, *opritjniki*, uppskattningsvis 1 000 som växte till omkring 6 000 man, klädda i svart och ridande med hundhuvuden och kvastar vid sadeln – symboler för att de skulle ”sniffa upp och sopa bort” förrädare. De mördade adelsmän, präster och bönder och konfiskerade deras jord. Vid massakern i Novgorod 1570 dödades tusentals invånare.

    Systemet avskaffades 1572, kort efter att krimtatarerna bränt Moskva (se [krimtatarer bränner Moskva 1571](#krimtatarer-branner-moskva-1571)), då opritjnikis militära svaghet blivit uppenbar. Det lämnade Ryssland ekonomiskt försvagat. Opritjnina jämförs ofta med Stalins terror på 1930-talet – Stalin själv beundrade Ivan.

krimtatarer-branner-moskva-1571:
  period: 1560
  label: "krimtatarer bränner Moskva 1571"
  title: "Krimtatarerna bränner Moskva 1571"
  wiki:
    - "en:Fire of Moscow (1571)"
    - "sv:Krimkhanatet"
  text: |
    Krimkhanatet var en tatarisk muslimsk stat på Krimhalvön och stäppen norr om Svarta havet, en kvarleva från mongolernas Gyllene horden. Från 1475 var det lydstat under Osmanska riket. Dess ekonomi byggde delvis på räder in i Ryssland, Polen och Ukraina för att fånga människor och sälja dem som slavar på marknader som Kaffa; under 1500- och 1600-talen fördes på så sätt uppskattningsvis flera hundra tusen, kanske över en miljon, människor bort.

    Våren 1571 utnyttjade khanen **Devlet Giray** att Ryssland var försvagat av Livländska kriget, [opritjnina](#opritjnina)-terrorn och svält. Med uppskattningsvis 40 000 ryttare tog han sig förbi de ryska gränsförsvaren och nådde Moskva. [Ivan IV](#ivan-den-forskracklige-tsar-1547) flydde. Tatarerna satte eld på förstäderna, och elden spred sig till nästan hela staden, där bara Kreml klarade sig. Antalet döda anges ofta som tiotusentals; samtida siffror som 60 000 eller fler är osäkra. Tusentals fördes bort som fångar.

    Året därpå kom Devlet Giray tillbaka, men ryssarna besegrade honom vid Molodi 1572. Efter det byggde Ryssland ut sina försvarslinjer söderut. Krim förblev ett hot till Katarina den stora [annekterade halvön 1783](#krim-annekteras-1783).

jermak-erovrar-sibirien:
  period: 1580
  label: "Jermak erövrar Sibirien"
  title: "Jermak och Sibiriens erövring 1581–1585"
  wiki:
    - "en:Yermak Timofeyevich"
    - "en:Russian conquest of Siberia"
  text: |
    **Jermak** var ledare för en grupp kosacker – fria, beväpnade gränsbor i södra Ryssland. Han anställdes av köpmannasläkten **Stroganov**, som hade stora saltverk och pälshandel vid Uralbergen, för att skydda dem mot det tatariska Sibirkhanatet öster om Ural. Kring 1581–82 gick han över Ural med bara omkring 540–840 man, med musköter mot fiender som mest hade pilbåge.

    Han intog khanatets huvudstad Qashliq nära dagens Tobolsk och skänkte landet till tsar [Ivan den förskräcklige](#ivan-den-forskracklige-tsar-1547). Jermak dog 1585 i ett bakhåll, men erövringen fortsatte. Drivkraften var päls, framför allt sobel, som var Rysslands viktigaste exportvara – ”mjukt guld”.

    Expansionen gick otroligt snabbt: ryssarna nådde Stilla havet vid [Ochotsk redan 1639](#ochotsk-vid-stilla-havet-1647), cirka 5 000 km på mindre än 60 år, genom att följa floderna. Jämför med att de europeiska kolonisterna i Nordamerika behövde över 200 år för att korsa kontinenten. Sibirien gjorde Ryssland till världens största land, och dess gas, olja och metaller är än idag grunden för Rysslands ekonomi.

patriarkat-1589:
  period: 1580
  label: "patriarkat 1589"
  title: "Moskvapatriarkatet 1589"
  wiki:
    - "en:Patriarch of Moscow and all Rus'"
    - "en:Moscow, third Rome"
  text: |
    En **patriark** är den högste biskopen i en ortodox kyrka, ungefär motsvarande en påve men bara för den egna kyrkan. Den ryska kyrkan hade länge lytt under patriarken i Konstantinopel. Efter att Konstantinopel [erövrats av osmanerna 1453](#konstantinopel-faller-1453) började ryssarna se Moskva som ”det tredje Rom” – den sista sanna kristna huvudstaden, efter Rom och Konstantinopel.

    1589 besökte patriark Jeremias II av Konstantinopel Moskva för att samla in pengar. Den mäktige regenten **Boris Godunov** (som styrde för den svage tsar Fjodor I) höll honom kvar tills han gick med på att upphöja Moskvas metropolit Job till patriark. Därmed blev den ryska kyrkan självständig och en av de fem stora ortodoxa kyrkorna.

    Patriarkerna blev mycket mäktiga, särskilt Filaret, far till den förste Romanovtsaren ([se 1613](#romanov-1613)). [Peter den store](#peter-den-store-1682) avskaffade ämbetet 1721 och lät kyrkan styras av ett statligt ämbetsverk, den heliga synoden. Patriarkatet återinfördes 1917 och finns idag; kyrkans nära band till staten består.

stora-oredan:
  period: 1600
  label: "Stora oredan"
  title: "Stora oredan i Ryssland 1598–1613"
  wiki:
    - "sv:Stora oredan"
    - "en:Time of Troubles"
  text: |
    **Stora oredan** (ryska smuta, ”fördunklingen”) var en period av kaos i Ryssland. Den började 1598 när tsar Fjodor I, son till [Ivan den förskräcklige](#ivan-den-forskracklige-tsar-1547), dog utan arvingar och den gamla Rurikdynastin, som styrt Ryssland i över 700 år, dog ut. Regenten Boris Godunov blev tsar, men 1601–1603 drabbades landet av en katastrofal hungersnöd efter kalla somrar – troligen orsakade av ett vulkanutbrott i Peru 1600 – där uppskattningsvis en tredjedel av befolkningen dog.

    Sedan följde en rad ”falska Dmitrij” – män som utgav sig för att vara Ivans son Dmitrij, som egentligen dött som barn 1591. Den förste blev faktiskt tsar 1605 med polskt stöd men mördades 1606. Bondeuppror, kosackhärar och utländska arméer drog genom landet. Polen ockuperade Moskva 1610–1612, och Sverige erövrade Novgorod 1611; en tid diskuterades en svensk prins som tsar.

    Oredan slutade när en folkarmé ledd av köpmannen Kuzma Minin och fursten Dmitrij Pozjarskij drev ut polackerna 1612 och [Romanovätten valdes 1613](#romanov-1613) (se där). Befrielsen firas än idag som helgdag i Ryssland den 4 november.

romanov-1613:
  period: 1600
  label: "Romanov 1613"
  title: "Romanovdynastin 1613"
  wiki:
    - "sv:Huset Romanov"
    - "sv:Mikael I av Ryssland"
  text: |
    Efter [Stora oredan](#stora-oredan) (se där) samlades 1613 en riksförsamling, **zemskij sobor**, med representanter för adel, kyrka, städer, kosacker och fria bönder i Moskva. Den valde den 16-årige **Mikael Romanov** till tsar. Han var släkt med Ivan den förskräckliges första hustru, och hans far Filaret var en mäktig kyrkoman som satt i polsk fångenskap. Valet var en kompromiss: Mikael var ung, utan fiender och knuten till den gamla dynastin.

    När Filaret kom hem 1619 blev han patriark ([se 1589](#patriarkat-1589)) och i praktiken medregent. Mikael slöt fred med Sverige i Stolbova 1617 (Ryssland förlorade kusten vid Finska viken) och med Polen 1618.

    **Romanovdynastin** styrde Ryssland i 304 år, 1613–1917. Den omfattade bland andra [Peter den store](#peter-den-store-1682), som gjorde Ryssland till europeisk stormakt, och [Katarina den stora](#katarina-den-stora). Den sista tsaren, Nikolaj II, avsattes i ryska revolutionen 1917 och mördades med sin familj 1918. Jämför med Vasaätten i Sverige (1523–1654) och Bourbonerna i Frankrike (1589–1792).

mikael-romanov:
  period: 1620
  label: "Mikael Romanov"
  title: "Mikael Romanov – den förste Romanov"
  wiki:
    - "en:Michael of Russia"
    - "sv:Huset Romanov"
  text: |
    **Mikael Romanov** (tsar 1613–1645) var den förste tsaren av [ätten Romanov](#romanov-1613), som sedan styrde Ryssland i drygt 300 år, fram till revolutionen 1917.

    Han valdes som 16-åring av en riksförsamling efter **[den stora oredan](#stora-oredan)** (Smuta, ca 1598–1613) – en period då den gamla härskarätten dött ut, tronpretendenter avlöste varandra, hungersnöd rasade och Polen ockuperade Moskva medan Sverige tog Novgorod. Mikael valdes delvis för att han var ung och ansågs ofarlig; i praktiken styrde under många år hans far, patriarken Filaret.

    Under Mikael byggdes staten upp igen. Freden i Stolbova 1617 med Sverige kostade Ryssland kusten vid Finska viken – landet blev avskuret från Östersjön, något [Peter den store](#peter-den-store-1682) ändrade ett sekel senare. Samtidigt fortsatte expansionen österut genom Sibirien mot Stilla havet (se [Ochotsk 1647](#ochotsk-vid-stilla-havet-1647)). Bönderna bands allt hårdare till jorden, en utveckling som ledde till full livegenskap 1649.

saltupproret-1648:
  period: 1640
  label: "Saltupproret 1648"
  title: "Saltupproret i Moskva 1648"
  wiki:
    - "en:Moscow uprising of 1648"
    - "en:Sobornoye Ulozheniye"
  text: |
    Den unge tsaren **Aleksej** (regerade 1645–1676, son till [Mikael Romanov](#mikael-romanov)) lät sin svåger och rådgivare Boris Morozov sköta regeringen. För att fylla statskassan infördes 1646 en kraftigt höjd skatt på salt – en nödvändig vara, eftersom saltning var det viktigaste sättet att konservera mat. Saltpriset steg mångdubbelt; fisk ruttnade och folket svalt. Skatten drogs tillbaka 1647, men då krävdes de gamla skatterna in i efterskott.

    I juni 1648 försökte Moskvabor lämna en petition till tsaren och blev bortkörda. Upplopp bröt ut: palats plundrades, flera ämbetsmän lynchades, och en brand förstörde stora delar av staden. Tsaren fick lämna ut några av de hatade ämbetsmännen och skicka bort Morozov.

    Följden blev viktig: 1649 antogs en ny lagbok, **Sobornoje Ulozjenije**, som skulle lugna adeln och stadsborna. Den band bönderna permanent till jorden och sina herrar – **livegenskapen** blev fullständig och varade till 1861. Saltupproret var ett av många uppror under 1600-talet, som Ryssland kallar ”upprorens århundrade” (jämför [Stenka Razin 1670](#stenka-razins-uppror-1670)).

ochotsk-vid-stilla-havet-1647:
  period: 1640
  label: "Ochotsk vid Stilla havet 1647"
  title: "Ochotsk vid Stilla havet 1647"
  wiki:
    - "en:Okhotsk"
    - "en:Russian conquest of Siberia"
  text: |
    Rysslands expansion genom **Sibirien** började 1582, när kosackhövdingen [Jermak erövrade det sibiriska khanatet](#jermak-erovrar-sibirien) öster om Uralbergen. Drivkraften var pälsar – sobel, räv och hermelin – som var Rysslands viktigaste exportvara. Små grupper av kosacker och pälsjägare tog sig fram längs floderna, byggde träfort (ostrog) och tvingade urfolken att betala skatt i pälsar.

    Takten var enorm: på drygt 60 år tog de sig omkring 5 000 km österut, till Stilla havet. 1639 nådde Ivan Moskvitin Ochotska havet, och 1647 grundades **Ochotsk**, Rysslands första hamn vid Stilla havet. 1648 seglade Semjon Dezjnjov runt Asiens nordöstra udde, genom det sund som senare fick namnet Berings sund. Jämför: de engelska kolonisterna i Nordamerika hade vid samma tid inte kommit längre än cirka 200 km från Atlantkusten.

    Ochotsk blev bas för senare expeditioner till Kamtjatka, Alaska (rysk 1741–1867) och mot Japan. Ryssland blev världens till ytan största land, vilket det är än idag.

stenka-razins-uppror-1670:
  period: 1660
  label: "Stenka Razins uppror 1670"
  title: "Stenka Razins uppror 1670–71"
  wiki:
    - "sv:Stenka Razin"
  text: |
    **Kosacker** var fria bönder och krigare som levde i gränsområdena i södra Ryssland, längs floder som Don och Volga. Många var förrymda livegna. De styrde sig själva i församlingar och livnärde sig på fiske, krigstjänst och plundringståg.

    **Stepan ”Stenka” Razin** (ca 1630–1671) var en donkosack som först blev känd för plundringståg längs Volga och över Kaspiska havet till Persien 1667–69. 1670 startade han ett stort uppror mot tsar Aleksejs stat. Han lovade att befria folket från adeln, de rika och ämbetsmännen. Livegna bönder, städernas fattiga och folk som tatarer och tjuvasjer anslöt; hans armé uppgick till uppskattningsvis tiotusentals man. Han intog städer längs Volga som Astrachan, Tsaritsyn (Volgograd) och Samara.

    Vid Simbirsk 1670 besegrades han av en regeringsarmé med västerländskt utbildade regementen. Han förråddes av andra kosacker och avrättades genom styckning i Moskva 1671. Tusentals upprorsmän dödades. Razin blev en folkhjälte i visor – visan om honom och den persiska prinsessan sjungs än – och en förebild för [Pugatjovs uppror 1773](#pugatjovs-uppror-1773).

    Jämför med [Saltupproret 1648](#saltupproret-1648), ett tidigare uppror mot samma tsar.

kyrkoschism:
  period: 1660
  label: "kyrkoschism"
  title: "Raskol – rysk-ortodoxa kyrkans schism"
  wiki:
    - "en:Schism of the Russian Church"
    - "sv:Gammaltroende"
  text: |
    En **schism** är en splittring inom en kyrka. Den ryska kallas **raskol**. På 1650-talet genomförde [patriarken](#patriarkat-1589) **Nikon**, kyrkans överhuvud, med stöd av tsar Aleksej reformer för att anpassa ryska kyrkans texter och riter till den grekisk-ortodoxa kyrkans. Under århundraden hade ryska kopior av böcker fått avvikelser.

    Förändringarna kan verka små: korstecknet skulle göras med tre fingrar i stället för två, ”halleluja” sjungas tre gånger i stället för två, och namnet Jesus stavas annorlunda. Men för många var de gamla riterna själva vägen till frälsning, och Moskva sågs som ”det tredje Rom”, den sanna troens försvarare. Att ändra efter grekerna kändes som förräderi.

    Motståndarna, kallade **gammaltroende**, leddes av ärkeprästen Avvakum, som brändes på bål 1682. Kyrkomötet 1666–67 bannlyste dem. De förföljdes hårt; tusentals brände sig själva till döds i sina kyrkor hellre än att ge upp. Flera miljoner gammaltroende fanns kvar i början av 1900-talet. Schismen stärkte också statens grepp om kyrkan, vilket [Peter den store](#peter-den-store-1682) fullbordade.

peter-den-store-1682:
  period: 1680
  label: "Peter den store 1682"
  title: "Peter den store blir tsar 1682"
  wiki:
    - "sv:Peter I av Ryssland"
  text: |
    **Peter I**, kallad **Peter den store** (1672–1725), utropades till tsar 1682, tio år gammal, tillsammans med halvbrodern Ivan V. Halvsystern Sofia styrde i praktiken som regent. Peter tog makten själv 1689.

    Ryssland var då stort men tekniskt efter Västeuropa, utan isfri hamn mot väst och med en armé av gammal typ. Peter genomförde en hårdhänt modernisering: flottan byggdes upp från nästan ingenting, armén organiserades efter västerländskt mönster, adeln tvingades tjäna staten, och han beordrade till och med att skägg skulle rakas. Han reste själv inkognito till Västeuropa (se [stora ambassaden 1697](#stora-ambassaden-1697)).

    Hans stora krig var [stora nordiska kriget](#stora-nordiska-kriget) mot Sverige (1700–1721), som gav Ryssland Baltikum och en väg till Östersjön. Där grundade han [S:t Petersburg 1703](#s-t-petersburg-1703) (se det). 1721 tog han titeln kejsare. Han var omkring två meter lång och känd för sitt våldsamma humör – han lät till exempel förhöra sin egen son, som dog efter tortyr 1718.

stora-ambassaden-1697:
  period: 1680
  label: "stora ambassaden 1697"
  title: "Stora ambassaden 1697–1698"
  wiki:
    - "en:Grand Embassy of Peter the Great"
    - "sv:Peter I av Ryssland"
  text: |
    Den **stora ambassaden** var en rysk diplomatisk delegation till Västeuropa 1697–1698, med ungefär 250 personer. Officiellt skulle den söka allierade mot Osmanska riket. Tsar **[Peter den store](#peter-den-store-1682)** följde med inkognito under namnet Peter Michajlov, vilket ingen tsar tidigare gjort – ryska härskare lämnade normalt inte landet.

    Peter arbetade bland annat som skeppsbyggare på holländska Ostindiska kompaniets varv i Amsterdam och besökte varv, verkstäder, observatorier och myntverket i England. Han rekryterade hundratals västerländska experter – sjöofficerare, ingenjörer, hantverkare – till Ryssland.

    Resan avbröts när strelitserna (Moskvas gamla gardesregementen) gjorde uppror; Peter återvände och lät avrätta flera hundra av dem. Ambassaden misslyckades med alliansen mot turkarna, men Peter fick i stället stöd för [ett krig mot Sverige](#stora-nordiska-kriget). Den blev starten för hans västerniseringsreformer – en sorts tidig tekniköverföring, jämför Japans Iwakura-mission 1871.

s-t-petersburg-1703:
  period: 1700
  label: "S:t Petersburg 1703"
  title: "S:t Petersburg grundas 1703"
  wiki:
    - "sv:Sankt Petersburg"
  text: |
    1703, under [stora nordiska kriget](#stora-nordiska-kriget), erövrade **[Peter den store](#peter-den-store-1682)** en svensk skans vid floden Nevas mynning i Finska viken. Samma år började han bygga fästningen Peter och Paul där. Området var sankt träskland som tillhört Sverige (Ingermanland).

    Peter ville ha en hamn mot Östersjön och ett "fönster mot Europa", och 1712 flyttade han huvudstaden dit från Moskva. Bygget krävde tvångsarbete: tiotusentals livegna bönder och krigsfångar, däribland svenskar från [Poltava](#poltava-1709), arbetade under hårda förhållanden. Uppskattningar av hur många som dog varierar kraftigt, från flera tusen till tiotusentals. Adeln tvingades bygga hus i staden.

    Staden byggdes efter västerländska förebilder med kanaler (Amsterdam stod modell) och europeiska arkitekter. Den var Rysslands huvudstad till 1918. Där började [ryska revolutionen 1917](#revolutionerna-1917), och under namnet Leningrad belägrades den av tyskarna 1941–1944, då uppskattningsvis 800 000–1 miljon civila dog. Idag har den cirka 5,5 miljoner invånare.

poltava-1709-2:
  period: 1700
  label: "Poltava 1709"
  same_as: poltava-1709

peter-dor-1725:
  period: 1720
  label: "Peter dör 1725"
  title: "Peter den store dör 1725"
  wiki:
    - "sv:Peter I av Ryssland"
    - "sv:Katarina I av Ryssland"
  text: |
    **Peter den store** dog i februari 1725 i [S:t Petersburg](#s-t-petersburg-1703), 52 år gammal, efter ett liv av krig och reformer (se [Peter den store 1682](#peter-den-store-1682)). Han hade gjort Ryssland till en europeisk stormakt med en modern armé på uppskattningsvis 200 000 man och en flotta i Östersjön.

    Han hade inte utsett någon efterträdare. Hans son Aleksej hade dött 1718 efter förhör och tortyr, anklagad för förräderi. Peter hade själv 1722 infört en lag som lät tsaren välja efterträdare fritt, men hann inte använda den. Gardesregementena utropade hans änka, en före detta livländsk tjänsteflicka, till kejsarinna **Katarina I**.

    Det inledde en period på nästan 40 år med korta regeringar och palatskupper där gardet avgjorde vem som satt på tronen, ofta kvinnor: Anna, Elisabet och 1762 [Katarina II](#katarina-den-stora), "den stora". Peters reformer bestod dock: S:t Petersburg förblev huvudstad, och den rangordning för tjänstemän och officerare han införde 1722 gällde till 1917.

bering-expeditionen:
  period: 1720
  label: "Bering-expeditionen"
  title: "Berings expeditioner"
  wiki:
    - "sv:Vitus Bering"
    - "en:Great Northern Expedition"
  text: |
    **Vitus Bering** (1681–1741) var en dansk sjöofficer i rysk tjänst. Strax före sin död 1725 gav [Peter den store](#peter-den-store-1682) honom i uppdrag att utforska om Asien och Amerika hängde ihop. Bering reste med sitt följe tvärs genom Sibirien till Kamtjatka, cirka 9 000 km, en resa som tog ungefär tre år, och byggde där fartyg.

    På den första expeditionen 1728 seglade han genom sundet mellan kontinenterna (se [Beringsundet 1728](#beringsundet-1728)) men såg på grund av dimma inte Amerika. Den andra, **stora nordiska expeditionen** 1733–1743, var ett av historiens största vetenskapliga projekt med flera tusen deltagare. Den kartlade Sibiriens norra kust. 1741 nådde Bering Alaska, men på hemvägen förliste han på en ö, Beringön, där han dog i [skörbjugg](#lind-citrus-mot-skorbjugg-1747) (C-vitaminbrist) med en stor del av besättningen.

    Expeditionerna gav Ryssland anspråk på Alaska, dit pälsjägare snart kom för sjöutter. Ryssland sålde Alaska till USA 1867 för 7,2 miljoner dollar. Beringhav och Beringsund bär hans namn.

moskvas-universitet-1755:
  period: 1740
  label: "Moskvas universitet 1755"
  title: "Moskvas universitet grundas 1755"
  wiki:
    - "en:Moscow State University"
    - "sv:Michail Lomonosov"
  text: |
    Moskvas universitet grundades 1755 under kejsarinnan **Elisabet**, dotter till [Peter den store](#peter-den-store-1682), som styrde Ryssland 1741–1762. Initiativet kom från hovmannen Ivan Sjuvalov och vetenskapsmannen **Michail Lomonosov**, en fiskarson från Vita havet som blev kemist, fysiker, poet och språkreformator – Rysslands första stora naturvetare. Universitetet bär i dag hans namn.

    Det var Rysslands första riktiga universitet (vetenskapsakademien i Sankt Petersburg från 1724 var främst en forskningsinstitution). Som jämförelse grundades [Uppsala universitet 1477](#uppsala-universitet-1477) och Bologna kring 1088, så Ryssland låg århundraden efter. Undervisningen skedde till en början mest på latin och tyska; livegna bönder fick inte studera.

    Universitetet ingick i den modernisering ovanifrån som Peter den store inledde: Ryssland skulle hämta västerländsk teknik och vetenskap utan att släppa på enväldet. Det mönstret – snabb statsstyrd modernisering kombinerad med politisk kontroll – återkommer i rysk historia ända in i sovjettiden.

katarina-den-stora:
  period: 1760
  label: "Katarina den stora"
  title: "Katarina den stora (regerade 1762–1796)"
  wiki:
    - "sv:Katarina II av Ryssland"
  text: |
    **Katarina II** var en tysk prinsessa, Sophie av Anhalt-Zerbst, som gifte sig med den ryske tronföljaren Peter. Han blev tsar 1762 men var impopulär, och efter ett halvår avsatte Katarina honom i en kupp med hjälp av gardesofficerare. Peter dog kort därefter under oklara omständigheter. Hon styrde sedan Ryssland i 34 år.

    Under henne växte Ryssland kraftigt: genom [krigen mot Osmanska riket](#osmaner-forlorar-mot-ryssland-1774) fick landet norra Svarta havskusten och [Krim (1783)](#krim-annekteras-1783), och genom [Polens delningar](#polens-forsta-delning-1772) stora delar av dagens Belarus, Ukraina och Litauen. Befolkningen ökade från omkring 19–20 till uppskattningsvis 35–40 miljoner.

    Hon brevväxlade med Voltaire och Diderot och såg sig som upplyst härskare, skrev en reformplan för lagstiftningen, grundade Smolnyjinstitutet för flickor och lade grunden till Eremitagets konstsamlingar. Men för de livegna bönderna – ungefär halva befolkningen, i praktiken ägda av godsägarna – blev livet hårdare. Det bidrog till [Pugatjovs uppror 1773](#pugatjovs-uppror-1773) och till den klyfta mellan elit och folk som präglade Ryssland till 1917.

pugatjovs-uppror-1773:
  period: 1760
  label: "Pugatjovs uppror 1773"
  title: "Pugatjovs uppror 1773–1775"
  wiki:
    - "en:Pugachev's Rebellion"
    - "sv:Jemeljan Pugatjov"
  text: |
    **Jemeljan Pugatjov** var en don-kosack – kosackerna var fria krigarbönder i Rysslands sydliga gränsland – som 1773 utgav sig för att vara tsar Peter III, [Katarina den storas](#katarina-den-stora) make som dött efter hennes kupp 1762. Det var inte ovanligt: många falska Peter uppträdde i Ryssland.

    Hans löfte om frihet för de livegna bönderna och om rätt till land och religion för kosacker, basjkirer och andra folk vid Volga och Ural gav honom stort stöd. Upproret svepte över ett område stort som flera europeiska länder; hans styrkor brände staden Kazan och dödade tusentals adelsmän och ämbetsmän. Det räknas som Rysslands största bondeuppror före 1900-talet.

    Först när [kriget mot Osmanska riket slutade 1774](#osmaner-forlorar-mot-ryssland-1774) kunde Katarina sätta in reguljära trupper. Pugatjov förråddes, fördes i bur till Moskva och avrättades i januari 1775. Följden blev inte reformer utan hårdare kontroll: Katarina gav adeln ännu mer makt över bönderna. Aleksandr Pusjkin skrev senare romanen *Kaptenens dotter* om upproret.

    Jämför med [Stenka Razins uppror 1670](#stenka-razins-uppror-1670), ett tidigare kosackuppror.

krim-annekteras-1783:
  period: 1780
  label: "Krim annekteras 1783"
  title: "Ryssland annekterar Krim 1783"
  wiki:
    - "en:Annexation of the Crimean Khanate by the Russian Empire"
    - "sv:Krimkhanatet"
  text: |
    Krim var sedan 1400-talet säte för **Krimkhanatet**, en stat för krimtatarerna – ett muslimskt turkspråkigt folk, ättlingar till Gyllene hordens mongolväldet – som var vasall åt Osmanska riket. I århundraden [gjorde krimtatarerna räder](#krimtatarer-branner-moskva-1571) in i Ryssland och Polen och sålde fångar som slavar; uppskattningsvis flera miljoner människor fördes bort.

    Freden 1774 (se [Osmaner förlorar mot Ryssland](#osmaner-forlorar-mot-ryssland-1774)) gjorde khanatet formellt självständigt, i praktiken under ryskt inflytande. 1783 annekterade [Katarina den stora](#katarina-den-stora) halvön genom ett manifest, ett arbete lett av hennes favorit **Grigorij Potemkin**. Han grundade marinbasen Sevastopol och gjorde Krim till bas för Rysslands Svartahavsflotta. Uttrycket ”Potemkinkulisser” kommer från påståendet att han visade Katarina falska byar under hennes resa dit 1787.

    Krim blev en viktig del av den ryska självbilden. Det ledde till Krimkriget 1853–56, Stalins deportation av krimtatarerna 1944, överföringen till Ukraina 1954 och Rysslands annektering 2014 – jämför de två annekteringarna med 231 års mellanrum.

napoleon-i-moskva-1812:
  period: 1800
  label: "Napoleon i Moskva 1812"
  title: "Napoleons fälttåg mot Ryssland 1812"
  wiki:
    - "sv:Napoleons ryska fälttåg"
    - "sv:Slaget vid Borodino"
  text: |
    Tsar Alexander I hade 1810 lämnat [Napoleon](#napoleon)s blockad mot brittisk handel. Napoleon svarade med att invadera Ryssland i juni 1812 med **Grande Armée**, uppskattningsvis 450 000–600 000 man från hela det franskdominerade Europa – den största armé som dittills samlats.

    Ryssarna drog sig tillbaka och brände det de lämnade efter sig. Vid **Borodino** utanför Moskva i september 1812 stupade eller sårades omkring 70 000 man på en dag, ett av historiens blodigaste slag. Napoleon intog Moskva den 14 september men fann staden nästan tom, och sedan brann den, troligen anlagd av ryssarna. Tsaren vägrade förhandla.

    Efter fem veckor började reträtten, i oktober. Kyla ner mot −30 °C, svält, tyfus och kosackers anfall förintade armén; bara uppskattningsvis 30 000–100 000 man tog sig ut. Katastrofen fick Preussen, Österrike och Sverige att vända sig mot Napoleon, som besegrades vid Leipzig 1813. Tjajkovskijs *1812-uvertyr* och Tolstojs *Krig och fred* handlar om fälttåget. Hitler upprepade misstaget 1941.

    Fortsättningen: [Waterloo 1815](#waterloo-1815).

dekabristupproret-1825:
  period: 1820
  label: "Dekabristupproret 1825"
  title: "Dekabristupproret 1825"
  wiki:
    - "sv:Dekabristupproret"
  text: |
    Under Napoleonkrigen hade ryska officerare marscherat genom Europa ända till Paris 1814 och sett länder med författningar och utan livegenskap (ett system där bönderna var bundna till jorden och i praktiken ägdes av godsägaren). Hemma i Ryssland styrde tsaren enväldigt. Många officerare bildade hemliga sällskap med målet att införa en författning och avskaffa livegenskapen.

    När tsar Alexander I dog i december 1825 uppstod oklarhet om tronföljden. Den 14 december (enligt den ryska kalendern; därav namnet, av ryska *dekabr* = december) samlade de sammansvurna omkring 3 000 soldater på Senatstorget i Sankt Petersburg och vägrade svära trohet till den nye tsaren **Nikolaj I**. Han lät artilleri skjuta in i folkmassan, och upproret föll samma dag.

    Fem ledare hängdes och över hundra skickades till Sibirien. Nikolaj I:s styre (1825–1855) blev starkt reaktionärt med hemlig polis och censur. Dekabristerna blev dock förebilder för senare [ryska revolutionärer](#revolutionerna-1917); reformerna de krävde kom först med [livegenskapens avskaffande 1861](#livegenskapen-avskaffas-1861) och en folkvald duma 1906.

krimkriget:
  period: 1840
  label: "Krimkriget"
  title: "Krimkriget ur rysk synvinkel 1853–1856"
  wiki:
    - "sv:Krimkriget"
    - "en:Siege of Sevastopol (1854–1855)"
  text: |
    Ryssland under tsar **Nikolaj I** (regerade 1825–1855) såg sig som Europas starkaste landmakt och beskyddare av de ortodoxa kristna i Osmanska riket. Nikolaj kallade Osmanska riket ”Europas sjuke man” och räknade med att kunna dela det. En tvist om vem som skulle förvalta de kristna heliga platserna i Jerusalem blev förevändning för krig 1853.

    Ryssland hade en jättelik armé på uppemot en miljon man, men med föråldrade vapen, livegna soldater med 25 års tjänstgöring och ingen järnväg söderut – förstärkningar till Krim tog veckor till fots, medan britter och fransmän kunde skeppa trupper med ångfartyg. Ryska gevär var ofta slätborrade musköter medan de allierade hade räfflade gevär med betydligt längre räckvidd. Sevastopol föll i september 1855 efter elva månaders belägring.

    Nikolaj I dog under kriget, och hans son **Alexander II** slöt fred i Paris 1856. Nederlaget blev en chock som visade att det feodala Ryssland inte kunde konkurrera med industrialiserade stater. Det ledde till de stora reformerna: [livegenskapen avskaffades 1861](#livegenskapen-avskaffas-1861), rättsväsendet moderniserades och allmän värnplikt infördes 1874.

livegenskapen-avskaffas-1861:
  period: 1860
  label: "Livegenskapen avskaffas 1861"
  title: "Livegenskapen avskaffas i Ryssland 1861"
  wiki:
    - "en:Emancipation reform of 1861"
    - "sv:Alexander II av Ryssland"
  text: |
    **Livegenskap** var ett system där bönderna var bundna till den jord de brukade och inte fick flytta; godsägaren kunde kräva arbete, straffa dem och i praktiken sälja dem. I Västeuropa hade det i stort sett försvunnit under medeltiden, men i Ryssland skärptes det under 1600–1700-talen. Omkring 1860 var ungefär 23 miljoner ryssar livegna under privata godsägare, ungefär lika många statsbönder hade liknande villkor – sammanlagt en majoritet av befolkningen.

    Efter nederlaget i [Krimkriget 1856](#krimkriget-1853) insåg tsar **Alexander II** att systemet höll tillbaka landet ekonomiskt och militärt, och att det var bättre att avskaffa det ”ovanifrån än att vänta på att det avskaffas underifrån”. Manifestet om frigörelse kom 1861, bara två år före Lincolns emancipationsproklamation i USA.

    Bönderna blev personligen fria, men måste betala för jorden de fick genom inlösningsavgifter under 49 år, och de fick ofta mindre och sämre jord än de brukat. Jorden ägdes kollektivt av byn (*mir*). Missnöjet bestod och bidrog till [revolutionerna 1905 och 1917](#revolutionerna-1917). Alexander II själv [mördades av revolutionärer 1881](#alexander-ii-mordas-1881).

alaska-saljs-1867:
  period: 1860
  label: "Alaska säljs 1867"
  title: "Alaska säljs till USA 1867"
  wiki:
    - "sv:Alaskaköpet"
  text: |
    Ryssland hade koloniserat **Alaska** sedan 1700-talet, främst för pälshandel med havsutter. Det ryska Amerikanska kompaniet hade sin huvudort i Sitka, men aldrig mer än några hundra ryska invånare. Efter [Krimkriget](#krimkriget-1853) hade Ryssland dålig ekonomi, pälsdjuren var nästan utrotade, och Alaska var omöjligt att försvara mot Storbritannien, vars kanadensiska kolonier gränsade till området. Hellre sälja till USA än förlora det till britterna.

    I mars 1867 förhandlade USA:s utrikesminister **William Seward** fram köpet för 7,2 miljoner dollar – omkring 2 cent per acre (knappt 5 dollar per km²) för ca 1,5 miljoner km², drygt tre gånger Sveriges yta. Kritiker kallade det ”Sewards dårskap” och ”Sewards isbox”.

    Köpet visade sig mycket lönsamt: guld hittades på 1890-talet (Klondike-ruschen i Kanada passerade genom Alaska) och olja 1968 vid Prudhoe Bay. Under kalla kriget blev Alaskas läge, bara ca 85 km från Sovjetunionen över Berings sund, strategiskt viktigt. Alaska blev delstat 1959.

    Jämför med [Louisianaköpet 1803](#louisianakopet-1803).

alexander-ii-mordas-1881:
  period: 1880
  label: "Alexander II mördas 1881"
  title: "Alexander II mördas 1881"
  wiki:
    - "sv:Alexander II av Ryssland"
    - "en:Assassination of Alexander II"
  text: |
    **Alexander II** var rysk tsar (enväldig kejsare) 1855–1881. Han tillträdde under [Krimkriget](#krimkriget-1853), som Ryssland förlorade, och drog slutsatsen att landet måste moderniseras. Han kallas ”befriaren” för att han 1861 avskaffade **[livegenskapen](#livegenskapen-avskaffas-1861)** – ett system där ca 23 miljoner bönder var bundna till godsägarnas jord. Han reformerade också domstolar, armé och lokalt självstyre.

    Reformerna var för långsamma för radikala studenter och för stora för konservativa. Den revolutionära gruppen **Narodnaja Volja** (”Folkets vilja”) ville störta tsarväldet genom terror och gjorde flera mordförsök. Den 13 mars 1881 i S:t Petersburg kastades två bomber mot hans vagn; den andra dödade honom.

    Effekten blev den motsatta: hans son **Alexander III** slog tillbaka med hårt förtryck, censur, förföljelse av judar (pogromer) och förryskning av minoriteter, också i Finland. Klyftan mellan regim och samhälle växte – en väg till [revolutionerna 1905 och 1917](#revolutionerna-1917).

transsibiriska-jarnvagen-1891:
  period: 1880
  label: "transsibiriska järnvägen 1891"
  title: "Transsibiriska järnvägen påbörjas 1891"
  wiki:
    - "sv:Transsibiriska järnvägen"
  text: |
    År 1891 började bygget av **transsibiriska järnvägen**, som skulle knyta ihop det europeiska Ryssland med Stillahavskusten i Vladivostok. Med ca 9 300 km är den fortfarande världens längsta järnvägslinje – ungefär fyra gånger avståndet Stockholm–Rom.

    Bygget leddes av finansministern Sergej Witte och utfördes av soldater, fångar och tusentals inhyrda arbetare, ofta i permafrost och svår kyla. En provisorisk förbindelse var klar 1904 (med båtfärja över Bajkalsjön), och sträckan helt på rysk mark blev klar 1916. Resan som tidigare tog månader tog nu drygt en vecka.

    Järnvägen hade militära och ekonomiska syften: att befolka Sibirien (miljontals bönder flyttade dit) och att stärka Rysslands ställning i Ostasien, särskilt i Manchuriet. Det oroade Japan och bidrog till [rysk-japanska kriget 1904–05](#rysk-japanska-kriget). Jämför med USA:s [transkontinentala järnväg 1869](#transkontinental-jarnvag-1869), som var drygt en fjärdedel så lång.

rysk-japanska-kriget:
  period: 1900
  label: "Rysk-japanska kriget"
  title: "Rysk-japanska kriget 1904–1905"
  wiki:
    - "sv:Rysk-japanska kriget"
    - "en:Battle of Tsushima"
  text: |
    Ryssland och Japan konkurrerade om **Manchuriet** (nordöstra Kina) och **Korea**. Ryssland hade tagit flottbasen Port Arthur och byggde [transsibiriska järnvägen](#transsibiriska-jarnvagen-1891) för att stärka sin ställning. I februari 1904 anföll Japan utan krigsförklaring den ryska flottan i Port Arthur.

    Port Arthur föll efter en lång belägring i januari 1905. Vid **Mukden** i mars 1905 möttes ca 600 000 soldater – ett av historiens största slag dittills. Ryssland skickade sin Östersjöflotta runt halva jordklotet, ca 33 000 km på sju månader, men den förintades på ett dygn vid **Tsushima** i maj 1905. Totalt dog uppskattningsvis över 100 000 soldater.

    Freden i Portsmouth, USA, gav Japan Korea och södra Manchuriet. Det var första gången i modern tid en asiatisk stat besegrade en europeisk stormakt, vilket inspirerade antikoloniala rörelser från Indien till Egypten. I Ryssland utlöste nederlaget **revolutionen 1905**, som tvingade fram ett parlament (duman) – ett [förspel till 1917](#revolutionerna-1917).

revolutionerna-1917:
  period: 1900
  label: "revolutionerna 1917"
  title: "Ryska revolutionerna 1917"
  wiki:
    - "sv:Ryska revolutionen"
    - "sv:Oktoberrevolutionen"
  text: |
    År 1917 hade Ryssland förlorat miljontals soldater i [första världskriget](#forsta-varldskriget), städerna svalt och tsar **Nikolaj II** var djupt impopulär. I **februarirevolutionen** (mars enligt vår kalender) ledde brödkravaller och strejker i Petrograd (S:t Petersburg) till att soldaterna vägrade skjuta och anslöt sig. Tsaren abdikerade och 300 år av Romanovstyre tog slut. En provisorisk regering tog över men fortsatte kriget.

    Vid sidan av den fanns **sovjeter** – råd av arbetare och soldater. Bolsjevikerna, ett radikalt marxistiskt parti lett av **Vladimir Lenin**, som Tyskland hjälpt att resa hem genom bl.a. Sverige, lovade ”fred, jord och bröd”. I **oktoberrevolutionen** (7 november) tog bolsjevikerna makten genom en nästan blodlös statskupp under ledning av Lev Trotskij.

    Lenin slöt fred med Tyskland 1918, avskaffade privat egendom och upplöste det valda parlamentet. Det [ledde till inbördeskrig](#inbordeskrig) (se ”inbördeskrig”) och till [Sovjetunionen 1922](#sovjetunionen-1922) – världens första kommunistiska stat, som bestod [till 1991](#sovjet-faller-1991).

inbordeskrig:
  period: 1900
  label: "inbördeskrig"
  title: "Ryska inbördeskriget 1917–1922"
  wiki:
    - "sv:Ryska inbördeskriget"
  text: |
    Efter bolsjevikernas maktövertagande i [oktober 1917](#revolutionerna-1917) bröt ett inbördeskrig ut mellan de **röda** – bolsjevikerna, ledda av Lenin, med **Röda armén** som byggdes upp av Lev Trotskij – och de **vita**, en splittrad koalition av monarkister, liberaler, kosacker och tidigare tsargeneraler. Även nationella rörelser (ukrainare, polacker, balter m.fl.) och bondearméer stred, och Storbritannien, Frankrike, USA och Japan skickade trupper till stöd för de vita.

    De röda kontrollerade kärnan kring Moskva och Petrograd, med järnvägarna och industrin, medan de vita anföll från utkanterna utan samordning. Båda sidor använde terror; bolsjevikernas hemliga polis **Tjekan** avrättade tiotusentals. Tsarfamiljen sköts i juli 1918.

    Uppskattningsvis 7–12 miljoner människor dog, de flesta civila, av strider, terror, epidemier och svält – svälten 1921–22 dödade i sig flera miljoner. De röda vann, och 1922 bildades **[Sovjetunionen](#sovjetunionen-1922)**. Krigets centralstyrning och våld blev en mall för den sovjetiska staten under [Stalin](#stalin).

sovjetunionen-1922:
  period: 1920
  label: "Sovjetunionen 1922"
  title: "Sovjetunionen bildas 1922"
  wiki:
    - "sv:Sovjetunionen"
    - "en:Treaty on the Creation of the USSR"
  text: |
    Efter [ryska revolutionen 1917](#revolutionerna-1917), då bolsjevikerna (Lenins kommunistiska parti) tog makten, följde ett [inbördeskrig 1917–22](#inbordeskrig) mot de ”vita” – en lös allians av monarkister, liberaler och andra – med uppskattningsvis 7–12 miljoner döda inklusive svält och sjukdom. Bolsjevikerna vann.

    Den 30 december 1922 bildades Unionen av socialistiska sovjetrepubliker, Sovjetunionen, av Ryssland, Ukraina, Vitryssland och Transkaukasien. ”Sovjet” betyder råd, efter arbetarråden 1917. Formellt var det en union av republiker, men i praktiken styrdes allt av kommunistpartiet i Moskva. Ledaren **Vladimir Lenin** dog 1924 och [Stalin](#stalin) tog över.

    Sovjetunionen var världens första kommunistiska stat och den största till ytan, omkring 22 miljoner km². Den blev en av två supermakter efter andra världskriget, med 15 republiker, och [upplöstes 1991](#sovjet-faller-1991). De gränser som drogs mellan republikerna är idag statsgränser, bland annat mellan Ryssland och Ukraina.

stalin:
  period: 1920
  label: "Stalin"
  title: "Josef Stalin"
  wiki:
    - "sv:Josef Stalin"
    - "sv:Den stora utrensningen"
  text: |
    **Josef Stalin** (1878–1953) var en georgisk revolutionär som blev [Sovjetunionens](#sovjetunionen-1922) diktator efter Lenins död 1924. Han var partiets generalsekreterare och använde den posten för att placera lojala personer överallt och slå ut rivaler, främst Leo Trotskij, som mördades i Mexiko 1940.

    Tre saker förknippas med honom. Först tvångsindustrialiseringen genom femårsplaner från 1928, som på ett decennium gjorde Sovjet till en industrimakt, och tvångskollektiviseringen av jordbruket, som orsakade svält (se [Holodomor](#holodomor-193233)). Sedan den stora terrorn 1936–38, då omkring 680 000 människor avrättades efter skenrättegångar och miljoner skickades till Gulag, arbetslägren. Slutligen andra världskriget: pakten med Hitler 1939, och sedan segern över Tyskland efter enorma förluster.

    Stalins totala antal offer är omstritt men brukar uppskattas till flera miljoner, ofta 6–20 miljoner beroende på vad som räknas. Efter kriget kontrollerade han Östeuropa (se [järnridån](#jarnridan)) och [skaffade atombomben](#atombomb-1949). Han dog 1953.

holodomor-193233:
  period: 1920
  label: "Holodomor 1932–33"
  title: "Holodomor 1932–33"
  wiki:
    - "sv:Holodomor"
  text: |
    Holodomor (ukrainska för ”död genom svält”) var en hungersnöd i Ukraina 1932–33. Den var en följd av [Stalins](#stalin) tvångskollektivisering: småbrukarnas jord slogs ihop till statliga kollektivjordbruk, och bönder som gjorde motstånd stämplades som kulaker (”rika bönder”) och deporterades. Produktionen rasade.

    Trots det krävde staten ut orimliga mängder spannmål, även utsäde. Byar som inte nådde kvoterna svartlistades och fick inga varor, och från januari 1933 förbjöds bönder att lämna Ukraina för att söka mat. Samtidigt exporterade Sovjetunionen spannmål. Uppskattningsvis 3,5–5 miljoner ukrainare dog. Svälten drabbade även Kazakstan hårt, där kanske en fjärdedel av kazakerna dog, och delar av Ryssland.

    [Sovjetunionen förnekade](#sovjetunionen-1922) svälten i decennier. Idag erkänner Ukraina och ett trettiotal andra länder Holodomor som folkmord, avsiktlig förintelse av en folkgrupp; Sveriges riksdag gjorde det 2023. Minnet av svälten är en viktig del av den ukrainska identiteten och relationen till Ryssland.

stalingrad:
  period: 1940
  label: "Stalingrad"
  title: "Slaget vid Stalingrad 1942–43"
  wiki:
    - "sv:Slaget vid Stalingrad"
  text: |
    I juni 1941 anföll Tyskland Sovjetunionen med omkring 3 miljoner soldater, det största anfallet i historien. Sommaren 1942 ryckte tyska styrkor mot oljefälten i Kaukasus och mot Stalingrad (dagens Volgograd), en industristad vid floden Volga som bar [Stalins namn](#stalin).

    Från augusti 1942 utkämpades strid hus för hus i den sönderbombade staden. I november inledde Röda armén en motoffensiv som omringade den tyska 6:e armén under general **Friedrich Paulus**, omkring 250 000–300 000 man. Hitler förbjöd utbrytning. Efter en vinter av svält och köld kapitulerade de sista i februari 1943. Av omkring 91 000 tillfångatagna kom bara ungefär 5 000–6 000 hem.

    De totala förlusterna, döda, sårade och tillfångatagna, uppskattas till 1,5–2 miljoner, vilket gör det till ett av historiens blodigaste slag. Jämför med [Hastings 1066](#stamford-bridge-och-hastings-1066) med kanske 15 000 man totalt. Stalingrad brukar ses som vändpunkten i kriget i Europa: därefter var Tyskland på reträtt i öst.

jarnridan:
  period: 1940
  label: "järnridån"
  title: "Järnridån"
  wiki:
    - "sv:Järnridån"
    - "sv:Kalla kriget"
  text: |
    Järnridån var gränsen mellan det kommunistiska Östeuropa, kontrollerat av Sovjetunionen, och det demokratiska Västeuropa under kalla kriget. Uttrycket blev känt genom **[Winston Churchill](#churchill)**, som i ett tal i Fulton, USA, 1946 sa att en järnridå hade sänkts över kontinenten ”från Stettin vid Östersjön till Triest vid Adriatiska havet”.

    Efter andra världskriget installerade Sovjet kommunistiska regeringar i länder som Röda armén befriat: Polen, Tjeckoslovakien, Ungern, Rumänien, Bulgarien och Östtyskland. Kalla kriget var en konflikt mellan USA och Sovjet 1947–1991 som aldrig blev ett direkt krig mellan dem, men utkämpades via kapprustning, spionage och krig i andra länder (Korea, Vietnam, Afghanistan).

    Gränsen blev bokstavlig: taggtråd, minfält och vakttorn genom Europa, omkring 7 000 km, och [Berlinmuren från 1961](#berlinmuren-1961). Uppror i Ungern 1956 och Tjeckoslovakien 1968 krossades av sovjetiska stridsvagnar. [Järnridån föll 1989](#murens-fall-1989), när Ungern öppnade gränsen mot Österrike och Berlinmuren revs.

atombomb-1949:
  period: 1940
  label: "atombomb 1949"
  title: "Sovjets atombomb 1949"
  wiki:
    - "en:RDS-1"
    - "sv:Kärnvapenkapprustningen"
  text: |
    Den 29 augusti 1949 sprängde Sovjetunionen sin första atombomb på provområdet Semipalatinsk i Kazakstan. USA hade haft monopol på kärnvapen sedan 1945, då bomberna över [Hiroshima och Nagasaki](#hiroshima-nagasaki-1945) dödade uppskattningsvis 110 000–210 000 människor, och amerikanska bedömare hade trott att Sovjet skulle behöva många år till.

    Projektet leddes av fysikern **Igor Kurtjatov** och övervakades av säkerhetstjänstens chef Lavrentij Berija. Det fick stor hjälp av spionage: bland andra den tyskfödde fysikern Klaus Fuchs, som arbetat i [Manhattanprojektet](#manhattanprojektet), lämnade ritningar. Den första sovjetiska bomben var nästan en kopia av den amerikanska plutoniumbomben.

    Bomben startade kärnvapenkapprustningen. USA svarade med vätebomben 1952, Sovjet följde 1953. Vid toppen omkring 1986 fanns uppskattningsvis 70 000 kärnvapen i världen; idag omkring 12 000. Ömsesidig förstörelseförmåga – vetskapen att båda skulle förintas – höll paradoxalt nog supermakterna från direkt krig. [Kubakrisen 1962](#kubakrisen-1962) var närmast.

gagarin-1961:
  period: 1960
  label: "Gagarin 1961"
  title: "Jurij Gagarin – första människan i rymden 1961"
  wiki:
    - "sv:Jurij Gagarin"
    - "sv:Vostok 1"
  text: |
    Den 12 april 1961 blev den sovjetiske stridspiloten **Jurij Gagarin**, 27 år, den första människan i rymden. Rymdkapseln Vostok 1 sköts upp från Bajkonur i Kazakstan med en version av samma raket som bar Sputnik (se [Sputnik 1957](#sputnik-1957)). Han gjorde ett varv runt jorden på 108 minuter, på upp till omkring 300 km höjd, och landade med fallskärm efter att ha skjutits ut ur kapseln.

    Det var ännu en sovjetisk seger i rymdkapplöpningen – tävlingen mellan USA och Sovjetunionen om att vara först i rymden, som också handlade om prestige och raketteknik för kärnvapen. USA:s Alan Shepard gjorde en kort hopp-färd tre veckor senare (15 minuter, ej i omloppsbana); John Glenn varvade jorden först 1962. Sovjet var först även med första kvinnan i rymden, Valentina Teresjkova 1963, och första rymdpromenaden 1965.

    Gagarin blev världskändis och turnerade över hela världen. Han dog 1968, 34 år gammal, i en flygolycka under ett träningspass. Sex veckor efter hans färd lovade president Kennedy att USA skulle landa en människa på månen före decenniets slut – se [månlandningen 1969](#manlandningen-1969).

kubakrisen-1962:
  period: 1960
  label: "Kubakrisen 1962"
  title: "Kubakrisen 1962"
  wiki:
    - "sv:Kubakrisen"
  text: |
    Kubakrisen var de 13 dagar i oktober 1962 då världen var närmast ett kärnvapenkrig. Sovjetledaren **Nikita Chrusjtjov** hade i hemlighet placerat kärnvapenrobotar på Kuba, 15 mil från Florida – dels för att skydda Castros regim efter USA:s misslyckade invasion i Grisbukten 1961 (se [Kubanska revolutionen 1959](#kubanska-revolutionen-1959)), dels som svar på att USA hade robotar i Turkiet nära Sovjet. USA hade då långt fler kärnvapen än Sovjet.

    Den 14 oktober fotograferade ett amerikanskt spaningsplan robotbaserna. President **John F. Kennedy** valde att inte bomba direkt utan införde en sjöblockad (kallad ”karantän”) och krävde att robotarna togs bort. Spänningen var extrem: ett amerikanskt spaningsplan sköts ner över Kuba, och en sovjetisk ubåt med en kärnvapentorped var nära att avfyra den när den trakasserades av amerikanska fartyg.

    Den 28 oktober gick Chrusjtjov med på att ta bort robotarna mot att USA lovade att inte invadera Kuba och i hemlighet tog bort robotarna i Turkiet. Efter krisen installerades en direktlinje mellan Vita huset och Kreml (”heta linjen”), och 1963 förbjöds kärnvapenprov i atmosfären. Men Sovjet började också en massiv kärnvapenupprustning för att aldrig mer vara underlägset.

tjernobyl-1986:
  period: 1980
  label: "Tjernobyl 1986"
  title: "Tjernobylolyckan 1986"
  wiki:
    - "sv:Tjernobylolyckan"
  text: |
    Natten mot den 26 april 1986 exploderade reaktor 4 i kärnkraftverket i **Tjernobyl** i norra Ukraina, då en del av Sovjetunionen. Under ett säkerhetstest, utfört felaktigt och med avstängda säkerhetssystem, rusade effekten okontrollerat. Reaktortypen, RBMK, hade en konstruktionsbrist som gjorde den instabil vid låg effekt – och den saknade en tät inneslutning. Ångexplosioner sprängde bort det tusen ton tunga locket, och grafiten i reaktorn brann i tio dagar och spred radioaktiva ämnen över Europa.

    Sovjet teg först. Det var **Forsmarks kärnkraftverk** i Sverige som den 28 april upptäckte förhöjd strålning hos personalen, insåg att den inte kom från Forsmark, och slog larm. Först därefter erkände Sovjet olyckan. Staden Pripjat med omkring 50 000 invånare evakuerades, och en zon på 30 km runt verket är fortfarande avstängd. Nedfallet drabbade även delar av Sverige, bland annat Gävle- och Västerbottenstrakten; renkött och svamp kontrollerades i årtionden.

    Omkring 30 personal och räddningsarbetare dog av akut strålsjuka. Antalet framtida cancerdödsfall är omstritt; uppskattningar från FN-organ ligger runt 4 000 bland de mest utsatta, andra långt högre. Olyckan underminerade förtroendet för sovjetstaten och Gorbatjovs glasnost (se [Sovjet faller 1991](#sovjet-faller-1991)), och förstärkte kärnkraftsmotståndet i hela världen. Jämför med Harrisburg 1979 och [Fukushima 2011](#fukushima-2011).

sovjet-faller-1991:
  period: 1980
  label: "Sovjet faller 1991"
  title: "Sovjetunionens upplösning 1991"
  wiki:
    - "sv:Sovjetunionens upplösning"
    - "sv:Michail Gorbatjov"
  text: |
    **Sovjetunionen**, [bildad 1922](#sovjetunionen-1922) efter ryska revolutionen, bestod av 15 republiker, med omkring 290 miljoner invånare. Ryssland var störst men hade bara drygt hälften av befolkningen. På 1980-talet stod ekonomin stilla, det kostsamma [Afghanistankriget](#afghanistankriget) (se det) pågick och oljepriset föll. Michail Gorbatjov, ledare från 1985, försökte rädda systemet med öppenhet (glasnost) och reformer (perestrojka), men kritiken som släpptes fri riktades snart mot själva systemet, och republikerna började kräva självständighet, först de baltiska länderna.

    I augusti 1991 försökte konservativa kommunister en kupp mot Gorbatjov. **Boris Jeltsin**, Rysslands nyvalde president, ställde sig på en stridsvagn utanför parlamentet i Moskva och samlade motståndet; kuppen föll efter tre dagar. Därefter gick det fort: republik efter republik lämnade unionen. Den 25 december 1991 avgick Gorbatjov och den röda flaggan halades över Kreml.

    Upplösningen skedde utan storkrig, men 1990-talet blev kaotiskt för Ryssland: ekonomin krympte med uppskattningsvis 40 procent, förväntad livslängd för män sjönk under 60 år, och statsegendom hamnade billigt hos ”oligarker”. [Vladimir Putin tog makten 1999–2000](#putin-2000) och har kallat Sovjets fall ”århundradets största geopolitiska katastrof”. Frågan om Ukraina, självständigt sedan 1991, ledde till Rysslands [angrepp 2014](#krim-2014) och [fullskaliga invasion 2022](#rysslands-invasion-av-ukraina-2022).

putin-2000:
  period: 2000
  label: "Putin 2000"
  title: "Vladimir Putin tar makten 2000"
  wiki:
    - "sv:Vladimir Putin"
    - "en:Vladimir Putin"
  text: |
    **Vladimir Putin** (född 1952) var tidigare officer i Sovjetunionens säkerhetstjänst **KGB**, bland annat stationerad i Östtyskland. Efter [Sovjetunionens fall](#sovjet-faller-1991) gjorde han snabb karriär och blev 1998 chef för FSB (KGB:s efterträdare) och i augusti 1999 premiärminister. När president Boris Jeltsin oväntat avgick på nyårsafton 1999 blev Putin tillförordnad president, och han vann valet i mars 2000.

    1990-talet hade varit kaotiskt i Ryssland: ekonomin krympte med uppskattningsvis 40 %, staten ställde in betalningarna på sina lån 1998 och ett fåtal **oligarker** (affärsmän med politiskt inflytande) hade lagt beslag på stora delar av statens tillgångar. Putin lovade ordning. Han förde ett hårt krig i Tjetjenien, tog kontroll över tv-kanalerna och tvingade oligarkerna att underordna sig – den rikaste, Michail Chodorkovskij, fängslades 2003.

    Stigande oljepriser gav en högkonjunktur på 2000-talet och realinkomsterna ungefär fördubblades, vilket gav honom stor popularitet. Efter två mandatperioder bytte han plats med Dmitrij Medvedev 2008–12 och ändrade senare grundlagen för att kunna sitta kvar. Han har styrt längre än någon rysk ledare sedan [Stalin](#stalin). Se även [Georgien 2008](#georgien-2008), [Krim 2014](#krim-2014) och [Krig mot Ukraina](#krig-mot-ukraina).

georgien-2008:
  period: 2000
  label: "Georgien 2008"
  title: "Kriget i Georgien 2008"
  wiki:
    - "en:Russo-Georgian War"
    - "sv:Georgien"
  text: |
    **Georgien** är ett land med cirka 4 miljoner invånare i Kaukasus, söder om Ryssland, som var en del av Sovjetunionen [fram till 1991](#sovjet-faller-1991). Två regioner, **Sydossetien** och **Abchazien**, bröt sig loss i krig i början av 1990-talet och stöddes sedan av Ryssland. Georgiens president Micheil Saakasjvili var västorienterad och ville gå med i NATO; vid NATO-mötet i Bukarest i april 2008 lovades Georgien och Ukraina att de någon gång skulle bli medlemmar.

    I augusti 2008, efter månader av skärmytslingar, anföll Georgien Sydossetiens huvudstad. Ryssland svarade med en fullskalig invasion som tydligt var förberedd och gick djupt in i Georgien. Kriget varade bara fem dagar. Omkring 850 människor dödades och över 100 000 tvingades fly.

    Efteråt erkände Ryssland Sydossetien och Abchazien som självständiga stater och har trupper där än i dag. Väst reagerade svagt och återgick snart till normala relationer. Kriget brukar ses som det första tecknet på att [Putin](#putin-2000) var beredd att använda militärt våld för att hindra före detta sovjetrepubliker från att närma sig väst – ett mönster som upprepades med [Krim 2014](#krim-2014) och [invasionen av Ukraina 2022](#rysslands-invasion-av-ukraina-2022).

krim-2014:
  period: 2000
  label: "Krim 2014"
  title: "Rysslands annektering av Krim 2014"
  wiki:
    - "en:Annexation of Crimea by the Russian Federation"
    - "sv:Krim"
  text: |
    Vintern 2013–14 protesterade hundratusentals ukrainare på Majdantorget i Kiev mot att president Viktor Janukovytj, efter ryska påtryckningar, plötsligt avbrutit ett samarbetsavtal med EU. Protesterna, kallade **Euromajdan**, slogs ned våldsamt och omkring 100 demonstranter dödades. I februari 2014 flydde Janukovytj till Ryssland.

    Några dagar senare dök soldater i gröna uniformer utan beteckningar – "de små gröna männen" – upp på halvön **Krim** och tog kontroll över parlament och flygplatser. Ryssland förnekade först att de var ryska soldater. Krim hade tillhört Ukraina sedan 1954 men hade rysk majoritetsbefolkning och var bas för Rysslands Svartahavsflotta. En folkomröstning, som inte erkändes internationellt, hölls under ockupation, och i mars 2014 annekterade Ryssland Krim – första gången sedan [andra världskriget](#andra-varldskriget) som en europeisk stat tog land från en annan med våld.

    Samma vår startade ryskstödda separatister krig i östra Ukrainas **Donbass**-region; till 2022 dödades uppskattningsvis 14 000 människor. I juli 2014 sköts passagerarplanet MH17 ner med 298 ombord. Väst införde sanktioner, men de var begränsade. Se även [Rysslands invasion av Ukraina 2022](#rysslands-invasion-av-ukraina-2022).

krig-mot-ukraina:
  period: 2020
  label: "Krig mot Ukraina"
  title: "Rysslands krig mot Ukraina"
  wiki:
    - "en:Russo-Ukrainian war"
    - "sv:Rysslands invasion av Ukraina 2022"
  text: |
    Rysslands krig mot Ukraina började 2014 med annekteringen av Krim och ett ryskstött krig i östra Ukraina (se [Krim 2014](#krim-2014)), och blev ett fullskaligt krig med invasionen den 24 februari 2022. För Ryssland under **[Vladimir Putin](#putin-2000)** handlar det om att hindra Ukraina från att närma sig EU och NATO; Putin har hävdat att ryssar och ukrainare är "ett folk" och att Ukraina inte är en riktig stat.

    Efter de första årens rörelser har kriget blivit ett utnötningskrig med en ungefär stillastående front. Det har kallats världens första stora drönarkrig: båda sidor använder hundratusentals billiga drönare för spaning och attacker, och Ukraina har med havsdrönare drivit bort stora delar av Rysslands Svartahavsflotta. Ryssland ockuperar ungefär en femtedel av Ukrainas yta. Förlusterna är svåra att fastställa men uppskattas i hundratusentals döda och skadade på varje sida, de största i Europa sedan 1945.

    Inom Ryssland har kriget gått hand i hand med hårdare förtryck: oberoende medier stängdes, kritik mot kriget kriminaliserades och oppositionsledaren Aleksej Navalnyj dog i fångläger 2024. Rysslands ekonomi ställdes om till krigsekonomi med försvarsutgifter på uppskattningsvis 6–7 % av BNP. Se även [Rysslands invasion av Ukraina 2022](#rysslands-invasion-av-ukraina-2022) och [Finland och Sverige i NATO](#finland-2023-och-sverige-2024-i-nato).
