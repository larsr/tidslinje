# Sverige
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

olof-skotkonung:
  period: 1000
  label: "Olof Skötkonung"
  title: "Olof Skötkonung – Sveriges förste kristne kung"
  wiki:
    - "sv:Olof Skötkonung"
  text: |
    **Olof Skötkonung** (död ca 1022) är den förste kung som vi vet styrde
    både över svearna (kring Mälaren) och götarna (i Väster- och
    Östergötland). Han räknas därför ofta som den förste kungen av något
    som liknar Sverige. Tillnamnet kan betyda ”skattkung”, kanske för att
    han betalade skatt till Danmark, men tolkningen är osäker.

    Han var den förste svenske kungen som döptes, troligen omkring år 1008
    vid Husaby i Västergötland. Han lät också prägla de första svenska
    mynten, i Sigtuna omkring 995 – efter engelsk förebild, präglade av
    engelska myntmästare. Sigtuna var grundat kring 980 som en kunglig
    stad och blev ett tidigt kristet centrum.

    Olof deltog år 1000 i slaget vid Svolder, där han tillsammans med
    [Sven Tveskägg](#sven-tveskagg-kung-1013) besegrade Norges kung Olav
    Tryggvason. Kristnandet av Sverige gick dock långsamt: [hednatemplet i
    Uppsala](#adam-av-bremen-om-uppsalatemplet-1075) fanns kvar ännu på
    1070-talet, och hedniska och kristna kungar avlöste varandra långt in
    på 1100-talet. Jämför [Island](#island-antar-kristendomen-1000), som
    blev kristet med ett beslut år 1000.

sigtuna-praglar-mynt:
  period: 1000
  label: "Sigtuna präglar mynt"
  title: "Sveriges första mynt"
  wiki:
    - "sv:Sigtuna"
    - "sv:Olof Skötkonung"
  text: |
    Omkring år 995 började kung [Olof Skötkonung](#olof-skotkonung) slå
    mynt i Sigtuna, en stad han eller hans far grundat vid Mälaren
    kring 980. Det var de första mynt som präglats i Svealand. Mynten var
    kopior av engelska silverpenningar från kung Æthelred II, och
    myntmästarna var troligen engelsmän. På vissa står *OLAF REX AN SITUN*
    – ”Olof, kung i Sigtuna”.

    Förebilden var ingen slump. Under samma tid betalade England enorma
    summor silver, *danagäld*, till skandinaviska vikingahärar för att
    slippa plundring (se [Sven Tveskägg](#sven-tveskagg-erovrar-england)).
    Mycket av silvret hamnade i Skandinavien; på Gotland och i Mälardalen
    har man hittat tiotusentals engelska och arabiska silvermynt.

    Att prägla egna mynt var ett maktanspråk: kungen visade att han styrde
    ett rike på europeiskt manér, med stad, kyrka och mynt. Det fungerade
    dock inte länge. Präglingen upphörde under sonen [Anund
    Jakob](#anund-jakob) runt 1030-talet, och i Svealand dröjde det sedan
    mer än ett sekel innan kungar åter slog mynt. Det säger något om hur
    svag den kungliga förvaltningen ännu var.

anund-jakob:
  period: 1020
  label: "Anund Jakob"
  title: "Anund Jakob, kung ca 1022–1050"
  wiki:
    - "sv:Anund Jakob"
  text: |
    Anund Jakob var son till [Olof Skötkonung](#olof-skotkonung) och kung
    över svearna ungefär 1022–1050. Han döptes Jakob, och enligt
    traditionen krävde svearna att han också skulle ha ett hedniskt namn,
    Anund – ett tecken på att kristendomen ännu var ny och omstridd.

    Hans tid präglades av kampen mot danske Knut den store, som byggde upp
    [ett välde runt Nordsjön](#knuts-nordsjovalde). Anund Jakob allierade
    sig med norske kungen Olav Haraldsson, och omkring 1026 möttes de och
    Knut i slaget vid Helgeå i Skåne. Utgången är oklar, men Knut stod
    kvar som den starkaste. Olav fördrevs och stupade senare i [slaget vid
    Stiklestad 1030](#slaget-vid-stiklestad-1030-olav-den).

    Under Anund Jakob fortsatte myntpräglingen i Sigtuna en tid och
    upphörde sedan. Kungamakten i Svealand var fortfarande mest personlig:
    kungen var en krigsledare och storbonde snarare än chef för en
    statsapparat. Efter honom tog hans halvbror [Emund den
    gamle](#emund-den-gamle) över.

runstenar-i-uppland:
  period: 1020
  label: "runstenar i Uppland"
  title: "Upplands runstenar"
  wiki:
    - "sv:Runsten"
    - "sv:Upplands runinskrifter"
  text: |
    Runstenar är resta stenar med inskrifter i runor, det skandinaviska
    alfabetet. Den vikingatida runraden, *futharken*, hade bara 16 tecken.
    De flesta runstenar restes under 1000-talet, och Uppland är världens
    tätaste runstensområde: ungefär 1 300 av Sveriges cirka 2 500–3 000
    kända vikingatida runstenar finns där.

    En typisk text lyder ”X lät resa denna sten efter Y, sin fader”.
    Stenarna var minnesmärken men också ett slags offentliga dokument: de
    visade vem som ärvde gård och mark. Många har ett kors och en bön som
    ”Gud hjälpe hans själ” – de är alltså spår av övergången från
    [hedendom till kristendom](#hedendom-mot-kristendom). Kända ristare,
    som Öpir och Åsmund Kåresson, signerade sina verk.

    Inskrifterna berättar om resor: ett tjugotal Ingvarsstenar minns män
    som dog på Ingvar den vittfarnes färd österut omkring 1040, och andra
    stenar nämner Grekland (Bysans) och England. För en tid nästan utan
    skrivna källor är runstenarna därför en av de viktigaste källorna till
    hur människor levde och tänkte.

adam-av-bremen-om-uppsalatemplet-1075:
  period: 1040
  label: "Adam av Bremen om Uppsalatemplet (~1075)"
  title: "Adam av Bremen beskriver Uppsalatemplet"
  wiki:
    - "sv:Adam av Bremen"
    - "sv:Uppsalatemplet"
  text: |
    **Adam av Bremen** var en tysk präst och historiker i Bremen, då
    centrum för den kyrkliga missionen i Norden. Omkring 1075 skrev han en
    historia om ärkestiftet Hamburg-Bremen, med en fjärde del om Nordens
    geografi och folk – en av de viktigaste skrivna källorna om Sverige
    vid den här tiden.

    Han beskriver ett hedniskt tempel i **Uppsala**, "helt prytt med
    guld", med statyer av gudarna Tor, Oden och Fricco (troligen Frej).
    Vart nionde år hölls en stor offerfest där nio hanar av varje art,
    även människor, offrades och hängdes i en lund vid templet. Han hade
    inte själv varit där utan byggde på uppgifter från den danske kungen
    Sven Estridsson och andra.

    Varför det spelar roll: texten är vår huvudkälla till förkristen
    religion i Sverige, men den är omdiskuterad – Adam var en kyrkoman som
    ville framställa hedningarna negativt. Arkeologer har hittat stora
    byggnader i Gamla Uppsala, men inget som säkert är "templet". Sverige
    kristnades sent: Uppsala blev ärkebiskopssäte först 1164. Jämför med
    Sveriges tidiga kristnande under [Olof Skötkonung](#olof-skotkonung).

emund-den-gamle:
  period: 1040
  label: "Emund den gamle"
  title: "Emund den gamle, kung ca 1050–1060"
  wiki:
    - "sv:Emund den gamle"
  text: |
    Emund den gamle var son till [Olof Skötkonung](#olof-skotkonung) med
    en frilla (en kvinna han levde med utan att vara gift) och halvbror
    till [Anund Jakob](#anund-jakob). Han var kung ungefär 1050–1060 och
    den siste av den gamla kungaätten i Uppsala.

    Det vi vet om honom kommer främst från den tyske krönikören [Adam av
    Bremen](#adam-av-bremen-om-uppsalatemplet-1075), som kallade honom
    ”den onde”. Skälet var kyrkopolitik: ärkebiskopen i Hamburg-Bremen
    ville styra kyrkan i Norden, men Emund stödde en biskop, Osmund, som
    vigts på annat håll. Det visar att även en kristen kung kunde spela ut
    olika kyrkliga maktcentra mot varandra – ungefär som europeiska
    furstar gjorde mellan påven och kejsaren.

    Enligt senare tradition gjorde Emund en gränsöverenskommelse med
    Danmark. När han dog utan överlevande son gick makten till en
    västgötsk stormannasläkt, [Stenkilsätten](#stenkilsatten).

stenkilsatten:
  period: 1060
  label: "Stenkilsätten"
  title: "Stenkilsätten, ca 1060–1125"
  wiki:
    - "sv:Stenkilska ätten"
  text: |
    Stenkilsätten är namnet på de kungar som härstammade från Stenkil, en
    stormann från Västergötland som blev kung omkring 1060 efter [Emund
    den gamle](#emund-den-gamle). Han var troligen ingift i den gamla
    kungaätten. Ätten regerade, med avbrott, till omkring 1125.

    Perioden var orolig. Efter Stenkils död omkring 1066 slogs flera
    kungar samtidigt om makten. Den mest kända är hans son [Inge den
    äldre](#inge-den-aldre), som regerade fram till omkring 1110.
    Västergötland var tidigt kristet, medan svearna i Uppland höll fast
    vid den gamla religionen, och konflikten mellan [hedendom och
    kristendom](#hedendom-mot-kristendom) blev också en strid mellan
    landskap.

    Kungadömet var ännu en lös förbindelse mellan landskap med egna lagar
    och ting (folkförsamlingar). Kungen valdes och kunde avsättas. När
    ättens manliga linje dog ut tog [Sverker den
    äldre](#sverker-den-aldre) från Östergötland över, och den långa
    striden mellan Sverkers och Eriks ätter började.

hedendom-mot-kristendom:
  period: 1060
  label: "hedendom mot kristendom"
  title: "Religionsskiftet i Sverige"
  wiki:
    - "sv:Sveriges kristnande"
    - "sv:Templet i Uppsala"
  text: |
    Kristna missionärer kom till Sverige redan omkring 830, då Ansgar
    besökte Birka. Men religionsskiftet tog flera hundra år. Det handlade
    inte bara om tro: den gamla religionen var knuten till offerfester som
    stormännen ledde, och den nya kom med kyrka, biskopar och band till
    Europa.

    Västergötland blev tidigt kristet; där fanns ett biskopssäte i Skara
    från början av 1000-talet. Svealand och Uppland var mer motsträviga.
    Omkring 1075 beskrev [Adam av
    Bremen](#adam-av-bremen-om-uppsalatemplet-1075) ett hedniskt tempel i
    Uppsala med stora offerfester vart nionde år. Hans uppgifter bygger på
    hörsägen, men visar att Uppsala sågs som hedendomens centrum. Kung
    [Inge den äldre](#inge-den-aldre) fördrevs enligt sagorna för att han
    vägrade offra, och hans svåger ”Blot-Sven” (blot = offer) tog makten
    en tid.

    Samtidigt restes [många runstenar med kors](#runstenar-i-uppland), så
    kristendomen spred sig underifrån bland storbönderna. Omkring 1100 var
    striden i stort sett avgjord. Jämför med Island, där altinget fattade
    ett formellt beslut om [att anta kristendomen år
    1000](#island-antar-kristendomen-1000) – i Sverige skedde det
    långsammare och utan något enskilt beslut.

inge-den-aldre:
  period: 1080
  label: "Inge den äldre"
  title: "Inge den äldre, kung ca 1080–1110"
  wiki:
    - "sv:Inge den äldre"
  text: |
    Inge den äldre var son till Stenkil (se
    [Stenkilsätten](#stenkilsatten)) och kung ungefär 1080–1110. Han är
    den förste svenske kung som en påve skrev till: år 1080 sände
    Gregorius VII ett brev till honom. Det visar att Sverige börjat räknas
    som en del av den kristna kyrkans Europa.

    Inge var en övertygad kristen. Enligt den isländska sagotraditionen
    krävde svearna att han skulle upprätthålla de gamla offren; när han
    vägrade fördrevs han, och hans svåger Sven, kallad Blot-Sven, blev
    kung. Efter ungefär tre år återvände Inge, dödade Sven och tog
    tillbaka makten. Berättelsen är skriven långt senare och kan vara
    tillspetsad, men den speglar striden mellan [hedendom och
    kristendom](#hedendom-mot-kristendom).

    Omkring 1101 möttes Inge, norske Magnus Barfot och danske Erik Ejegod
    vid Kungahälla (vid nuvarande Kungälv) och slöt fred – ett
    ”trekungamöte” som fastställde gränser. Det är ett tidigt exempel på
    att de tre nordiska rikena började bete sig som stater med
    territorier.

strider-mellan-sverkers-och-eriks-atter:
  period: 1100
  label: "Strider mellan Sverkers och Eriks ätter"
  title: "Kampen mellan Sverkers och Eriks ätter"
  wiki:
    - "sv:Sverkerska ätten"
    - "sv:Erikska ätten"
  text: |
    Från omkring 1130 till 1250 växlade Sveriges krona mellan två släkter:
    ättlingarna till [Sverker den äldre](#sverker-den-aldre) från
    Östergötland och ättlingarna till [Erik den helige](#erik-den-helige),
    troligen med rötter i Västergötland eller Uppland. Det fanns ingen
    fast arvsordning; kungen valdes av stormän, och den som hade flest
    anhängare och vapen vann.

    Resultatet blev en lång rad mord och slag. Sverker den äldre mördades
    1156, Erik 1160 och Sverkers sonson Karl 1167. Sverker den yngre
    förlorade [slaget vid Lena 1208](#slaget-vid-lena-1208) mot Eriks
    sonson Erik Knutsson. Ungefär åtta kungar avlöste varandra, och flera
    dog våldsamt.

    Samma mönster fanns i Norge, där
    [inbördeskrigen](#norska-inbordeskrigen-borjar-1130) pågick ungefär
    lika länge. Oron upphörde först när Eriks ätt dog ut 1250 och Birger
    jarls släkt tog över. Trots kaoset växte kyrka, kloster och
    skriftkultur under perioden, och Sverige fick ett eget
    ärkebiskopssäte 1164.

sverker-den-aldre:
  period: 1120
  label: "Sverker den äldre"
  title: "Sverker den äldre, kung ca 1130–1156"
  wiki:
    - "sv:Sverker den äldre"
  text: |
    Sverker den äldre var en stormann från Östergötland som blev kung
    omkring 1130, efter att [Stenkilsätten](#stenkilsatten) dött ut. Han
    grundade den sverkerska ätten, som i över hundra år turades om med den
    erikska ätten om kronan (se [striderna mellan
    ätterna](#strider-mellan-sverkers-och-eriks-atter)).

    Sverker förde Sverige närmare den europeiska kyrkan. Tillsammans med
    drottning Ulvhild gav han mark till de första klostren: munkar från
    Clairvaux i Frankrike grundade [Alvastra](#alvastra-kloster-1143) och
    Nydala 1143. År 1152–53 besökte påvens sändebud Nicholas Breakspear
    (sedan påve Hadrianus IV) Norden och höll ett kyrkomöte i Linköping.
    Planerna på ett svenskt ärkebiskopssäte stannade då av, eftersom svear
    och götar inte kunde enas om var det skulle ligga.

    Sverker mördades julen 1156 på väg till kyrkan, enligt uppgift av sin
    egen tjänare. Mordet var typiskt för tiden: kungamakten vilade på
    personliga lojaliteter och kunde brytas med en kniv.

cisterciensermunkar-kommer:
  period: 1120
  label: "cisterciensermunkar kommer"
  title: "Cistercienserna kommer till Sverige"
  wiki:
    - "sv:Cistercienserorden"
    - "sv:Alvastra kloster"
  text: |
    Cistercienserorden är en munkorden som grundades 1098 i Cîteaux i
    Burgund. Den ville återgå till en enkel och sträng klosterregel: bön,
    tystnad och kroppsarbete. Under ledning av Bernhard av Clairvaux spred
    den sig snabbt, och vid år 1200 fanns flera hundra
    cistercienserkloster i Europa, organiserade som ett nätverk med årliga
    gemensamma möten – ett slags tidig internationell organisation.

    År 1143 kom de första cistercienserna till Sverige, sända från
    Clairvaux. De grundade [Alvastra](#alvastra-kloster-1143) i
    Östergötland och Nydala i Småland, på mark från [Sverker den
    äldre](#sverker-den-aldre) och drottning Ulvhild. Snart följde Varnhem
    i Västergötland och fler kloster.

    Klostren betydde mer än religion. Munkarna förde med sig kunskap om
    jordbruk, vattenledningar, kvarnar och byggande i sten och tegel,
    liksom skrivkonst och latin. De blev tidens teknik- och
    kunskapsöverföring från kontinenten, ungefär som när ett företag
    öppnar kontor i ett nytt land och tar med sig arbetsmetoderna.
    Klostren förblev viktiga fram till
    [reformationen](#reformation-vasteras-1527) på 1500-talet.

erik-den-helige:
  period: 1140
  label: "Erik den helige"
  title: "Erik den helige"
  wiki:
    - "sv:Erik den helige"
    - "sv:Erikska ätten"
  text: |
    **Erik den helige** (även Erik Jedvardsson) var svensk kung omkring
    1156–1160. Vi vet mycket lite säkert om honom; de flesta berättelser
    kommer från en legend skriven över hundra år senare för att göra honom
    till helgon. Han blev stamfar för den *erikska ätten*, som turades om
    att styra Sverige med den *sverkerska ätten* i en ofta blodig maktkamp
    (se [Norska inbördeskrigen](#norska-inbordeskrigen-borjar-1130) för en
    parallell).

    Enligt legenden ledde Erik ett korståg till Finland för att kristna
    finnarna, tillsammans med den engelske biskopen Henrik (enligt finsk
    tradition mördad av en bonde, Lalli). Detta så kallade första svenska
    korståget är omtvistat bland historiker och kan vara
    efterhandskonstruktion. Eriks död är bättre belagd: han dödades 1160 i
    Östra Aros (dagens Uppsala) av en dansk prins, Magnus Henriksson, som
    gjorde anspråk på tronen.

    Erik blev Sveriges skyddshelgon och hans reliker förvaras i Uppsala
    domkyrka. Stockholms stadsvapen visar hans huvud. Hans helgonstatus
    var politiskt användbar: hans son Knut Eriksson och efterföljande
    kungar kunde hänvisa till en helig förfader – samma knep som Norge
    använde med [Olav den helige](#slaget-vid-stiklestad-1030-olav-den).

alvastra-kloster-1143:
  period: 1140
  label: "Alvastra kloster 1143"
  title: "Alvastra kloster"
  wiki:
    - "sv:Alvastra kloster"
  text: |
    Alvastra kloster grundades 1143 vid foten av berget Omberg nära
    Vättern i Östergötland. Det var tillsammans med Nydala Sveriges första
    kloster av [cistercienserorden](#cisterciensermunkar-kommer). Munkarna
    kom från moderklostret Clairvaux i Frankrike, och marken skänktes av
    kung [Sverker den äldre](#sverker-den-aldre) och drottning Ulvhild.

    Alvastra blev den sverkerska kungaättens gravkyrka och ett av landets
    andliga och intellektuella centra. Härifrån grundades dotterkloster,
    bland annat Varnhem och Julita. Munken Stefan från Alvastra blev 1164
    Sveriges förste ärkebiskop när [Uppsala
    ärkestift](#uppsala-arkestift-1164) inrättades. Även
    [Birgitta](#heliga-birgitta) bodde en tid vid Alvastra på 1340-talet.

    Efter [reformationen](#reformation-vasteras-1527) drog kronan in
    klostrets egendomar, och klostret lades ned på 1500-talet. Stenarna
    fraktades bort och användes bland annat till Vadstena slott. Idag
    återstår ruiner, som ger en bild av hur ett europeiskt kloster såg ut
    i 1100-talets Sverige.

korstag-mot-finland-trad:
  period: 1140
  label: "korståg mot Finland (trad.)"
  title: "Det första korståget mot Finland"
  wiki:
    - "sv:Första svenska korståget"
    - "sv:Henrik (biskop)"
  text: |
    Enligt traditionen ledde kung [Erik den helige](#erik-den-helige) och
    biskop Henrik av Uppsala omkring 1150-talet ett korståg till Finland
    för att kristna finnarna. Henrik ska sedan ha dödats av bonden Lalli
    på isen vid sjön Köyliö och blev Finlands skyddshelgon. Men
    berättelsen finns bara i legender skrivna mer än hundra år senare, och
    många historiker tvivlar på att något korståg ägde rum. Därav ”trad.”
    – traditionellt.

    Ett korståg var ursprungligen ett påvligt sanktionerat krig mot
    ”otrogna”, först i Mellanöstern från 1096, men begreppet användes
    snart också om krig mot hedningar kring Östersjön, som
    [Vendenkorståget 1147](#venden-korstaget-1147). Tyskar, danskar och
    svenskar utvidgade sina riken österut med kyrkans välsignelse.

    Säkrare är de senare svenska expeditionerna: en till Tavastland (inre
    Finland) i mitten av 1200-talet, kopplad till [Birger
    jarl](#birger-jarl-stockholm-1250), och en till Karelen 1293. Finland
    blev därefter en del av det svenska riket i över 500 år, tills
    [Finland gick till Ryssland 1809](#finland-till-ryssland-1809).

uppsala-arkestift-1164:
  period: 1160
  label: "Uppsala ärkestift 1164"
  title: "Uppsala blir ärkestift 1164"
  wiki:
    - "sv:Uppsala ärkestift"
    - "sv:Stefan (ärkebiskop)"
  text: |
    Ett ärkestift är en kyrkoprovins under en ärkebiskop, som är
    överordnad flera vanliga biskopar. Fram till 1100-talet låg hela
    Norden först under ärkebiskopen i Hamburg-Bremen och sedan under
    [Lund, som blev ärkesäte 1103](#lund-arkesate-for-norden-1103). År
    1164 inrättade påven Alexander III ett eget ärkestift för Sverige i
    Uppsala.

    Den förste ärkebiskopen var Stefan, en munk från [Alvastra
    kloster](#alvastra-kloster-1143). Han vigdes i Sens i Frankrike, där
    påven då uppehöll sig. Uppsala fick dock stå under ärkebiskopen i
    Lund, som behöll titeln ”Sveriges primas” (främste). Säte var först
    Gamla Uppsala, den gamla hedniska kultplatsen; 1273 flyttades det till
    dagens Uppsala.

    Beslutet var en markering: Sverige räknades nu som ett eget kristet
    rike i Europa, med en egen kyrklig organisation, skatter (tionde) och
    skriftkunniga präster i kungens närhet. Norge hade fått samma sak elva
    år tidigare när [Nidaros blev ärkesäte
    1153](#nidaros-eget-arkesate-1153).

knut-eriksson:
  period: 1160
  label: "Knut Eriksson"
  title: "Knut Eriksson, kung ca 1167–1195"
  wiki:
    - "sv:Knut Eriksson"
  text: |
    Knut Eriksson var son till [Erik den helige](#erik-den-helige). År
    1167 dödade han kung Karl Sverkersson på Visingsö och tog makten;
    efter några års strider var han ensam kung från början av 1170-talet
    till sin död omkring 1195. Han var alltså en del av [kampen mellan
    Sverkers och Eriks ätter](#strider-mellan-sverkers-och-eriks-atter),
    men hans långa regering blev ett ovanligt lugnt avbrott.

    Under Knut stärktes kungamakten. Han lät åter slå mynt, och från hans
    tid finns några av de äldsta bevarade svenska kungabreven – skriftliga
    dokument som gav kyrkor och kloster rättigheter. Han främjade kulten
    av sin far som helgon, vilket gav hans egen släkt helig glans; Erik
    blev senare Sveriges skyddshelgon.

    Hans tid var också osäker utåt: år 1187 plundrades och brändes
    [Sigtuna](#sigtuna-plundras-1187) av anfallare österifrån. Efter Knuts
    död gick kronan till Sverker den yngre, eftersom Knuts söner var för
    unga – ett tecken på hur ätterna fortfarande turades om.

sigtuna-plundras-1187:
  period: 1180
  label: "Sigtuna plundras 1187"
  title: "Sigtuna plundras 1187"
  wiki:
    - "sv:Sigtuna"
    - "sv:Sigtunas plundring 1187"
  text: |
    År 1187 anfölls Sigtuna, en av Mälardalens viktigaste städer, av
    sjörövare från andra sidan Östersjön. Staden brändes och ärkebiskop
    Johan dödades. Vilka anfallarna var är oklart: senare källor nämner
    karelare, ester eller kurer (från dagens Lettland). Klart är att
    plundring gick åt båda hållen över Östersjön – det var inte bara
    skandinaver som for i härnad.

    Sigtuna hade varit kungens stad sedan [myntpräglingen omkring
    995](#sigtuna-praglar-mynt), men var redan på nedgång. En orsak var
    landhöjningen: efter istiden reser sig marken kring Mälaren ungefär en
    halv meter per sekel, vilket gjorde inloppen grundare och Mälaren
    successivt till en insjö. Kyrkans makt hade också flyttat till
    Uppsala.

    Traditionellt kopplas anfallet till [grundandet av
    Stockholm](#birger-jarl-stockholm-1250): en befäst stad vid Mälarens
    utlopp kunde stänga vägen in för fiender. Sambandet är troligt men
    inte direkt belagt. Några decennier senare tog Stockholm över Sigtunas
    roll som Mälardalens handelsstad.

slaget-vid-lena-1208:
  period: 1200
  label: "Slaget vid Lena 1208"
  title: "Slaget vid Lena 1208"
  wiki:
    - "sv:Slaget vid Lena"
    - "sv:Erik Knutsson"
  text: |
    Sverige var på 1100–1200-talen ett ungt och instabilt kungadöme. Två
    släkter turades om på tronen: den **sverkerska** och den **erikska**
    ätten (efter Sverker den äldre och [Erik den
    helige](#erik-den-helige)). Kungar mördades eller drevs i landsflykt i
    en takt som liknar [Norges samtida
    inbördeskrig](#norska-inbordeskrigen-borjar-1130).

    1208 hade sverkerske kungen **Sverker Karlsson** regerat sedan 1196,
    men den erikske tronpretendenten **Erik Knutsson** gjorde uppror.
    Sverker fick stöd från Danmark, och en dansk armé kom till hjälp. Vid
    **Lena** i Västergötland (troligen nära Falköping) besegrades Sverker
    och danskarna i januari 1208. Enligt danska källor var förlusterna
    stora, men pålitliga siffror saknas.

    Erik Knutsson blev kung (Erik X) och var 1210 den förste svenske
    kungen som vi vet kröntes. Sverker försökte återta makten men stupade
    vid Gestilren 1210. Slaget minskade danskt inflytande över Sverige för
    en tid, och danskarna riktade sig i stället mot Baltikum (se ”[Danmark
    erövrar Estland](#danmark-erovrar-estland-1219)”).

erik-laspe-och-halte:
  period: 1220
  label: "Erik läspe och halte"
  title: "Erik Eriksson, ”läspe och halte”"
  wiki:
    - "sv:Erik Eriksson (kung)"
  text: |
    Erik Eriksson (1216–1250) var den siste kungen av Eriks ätt. Han blev
    kung 1222 vid ungefär sex års ålder, så landet styrdes av förmyndare.
    Tillnamnet ”läspe och halte” kommer från senare krönikor och syftar på
    att han ska ha talat otydligt och haltat; om det stämmer vet vi inte
    säkert.

    År 1229 tog stormannen Knut Långe makten efter slaget vid Olustra, och
    Erik flydde till Danmark. Han kom tillbaka 1234 när Knut dött och
    regerade sedan till sin död 1250. Den verkliga makten låg dock alltmer
    hos jarlen, kungens högste befälhavare och rådgivare. Från 1248 var
    det [Birger jarl](#birger-jarl-stockholm-1250), som var gift med Eriks
    syster Ingeborg.

    När Erik dog barnlös valdes Birgers son Valdemar till kung, och Birger
    styrde i hans namn. Därmed slutade [striderna mellan Sverkers och
    Eriks ätter](#strider-mellan-sverkers-och-eriks-atter) och en ny
    dynasti, ofta kallad [folkungaätten](#folkungar), tog över.

folkungar:
  period: 1220
  label: "folkungar"
  title: "Folkungarna"
  wiki:
    - "sv:Folkungar"
    - "sv:Bjälboätten"
  text: |
    Ordet ”folkungar” används på två sätt, vilket ofta skapar förvirring.
    I 1200-talets källor var folkungarna en grupp stormän, främst i
    Uppland och Östergötland, som gjorde uppror mot den växande
    kungamakten och mot [Birger jarl](#birger-jarl-stockholm-1250). De
    ville behålla stormännens och landskapens gamla självständighet.

    Birger jarl besegrade dem i flera slag, bland annat vid Sparrsätra
    1247 och Herrevadsbro 1251; vid det senare lät han avrätta
    upprorsledarna trots löfte om fri lejd. Upprorens nederlag gjorde att
    en centraliserad kungamakt kunde byggas upp.

    Senare historiker gav paradoxalt nog namnet ”folkungaätten” åt Birger
    jarls egen släkt, som regerade 1250–1364: Valdemar, [Magnus
    Ladulås](#magnus-ladulas-1275), Birger Magnusson och Magnus Eriksson.
    Ett mer korrekt namn är Bjälboätten, efter släktgården Bjälbo i
    Östergötland. Under denna ätt fick Sverige riksgemensamma lagar, ett
    råd och en adel – grunden för ett medeltida rike – innan [Albrekt av
    Mecklenburg](#albrekt-av-mecklenburg) tog över 1364.

birger-jarl-stockholm-1250:
  period: 1240
  label: "Birger jarl, Stockholm ~1250"
  title: "Birger jarl och Stockholm ~1250"
  wiki:
    - "sv:Birger jarl"
    - "sv:Stockholms historia"
  text: |
    **Birger jarl** (ca 1210–1266) var Sveriges mäktigaste man i mitten av
    1200-talet. En *jarl* var kungens främste man, en sorts
    överbefälhavare och vicekung. Birger var gift med kungens syster, och
    när kung Erik Eriksson dog 1250 valdes Birgers unge son **Valdemar**
    till kung. Birger styrde i praktiken landet till sin död. Han grundade
    därmed den s.k. Bjälboätten, som bl.a. gav Sverige [Magnus
    Ladulås](#magnus-ladulas-1275).

    Han förknippas med några saker: ett korståg mot Tavastland i Finland
    (troligen 1249, dateringen omdiskuterad) som fäste svenskt styre där;
    fridslagar (*edsöreslagar*) som förbjöd våld i hemmet, kyrkan, på
    tinget och mot kvinnor; ett handelsavtal med Lübeck som gav tyska
    köpmän rätt att bo i Sverige; och **Stockholm**.

    Stockholm nämns första gången i ett brev 1252. Platsen var strategisk:
    där Mälaren rinner ut i Östersjön kunde man med en befästning
    kontrollera all sjötrafik till Mälardalens städer (Sigtuna, Västerås,
    Uppsala). Staden växte snabbt med hjälp av tyska köpmän och var på
    1300-talet Sveriges största. Att Birger ”grundade” Stockholm är en
    tradition snarare än ett belagt faktum, men han låg sannolikt bakom
    dess tidiga utbyggnad.

magnus-ladulas-1275:
  period: 1260
  label: "Magnus Ladulås 1275"
  title: "Magnus Ladulås blir kung 1275"
  wiki:
    - "sv:Magnus Ladulås"
    - "sv:Alsnö stadga"
    - "sv:Frälse"
  text: |
    **Magnus Ladulås** (ca 1240–1290) var son till Birger jarl (se
    ”[Birger jarl, Stockholm ~1250](#birger-jarl-stockholm-1250)”). Hans
    äldre bror Valdemar var kung, men Magnus gjorde uppror, och med hjälp
    av danska trupper besegrade han Valdemar vid Hova 1275 och tog makten.

    Han förknippas med tre saker. **Alsnö stadga** (ca 1280) gav
    skattefrihet åt den som tjänade kungen med häst och rustning i krig.
    Det skapade *frälset* – den svenska adeln, en grupp fria från skatt i
    utbyte mot krigstjänst. Till skillnad från stora delar av Europa fick
    Sverige aldrig livegenskap, och de skattebetalande bönderna förblev
    fria. Tillnamnet **Ladulås** (”lås för ladorna”) syftar enligt
    traditionen på att han förbjöd stormännen att tvinga sig till mat och
    husrum hos bönderna när de reste – bondens lada skulle vara låst för
    dem. Förklaringen är dock osäker. Och han stärkte kungamakten mot
    stormännen; några som gjorde uppror avrättades 1280.

    Han begravdes i franciskanernas klosterkyrka i Stockholm, dagens
    Riddarholmskyrkan, som senare blev den svenska kungliga gravkyrkan.
    Hans söner, kung Birger Magnusson och hertigarna Erik och Valdemar,
    låg efter hans död i blodig konflikt med varandra (Nyköpings gästabud
    1317).

alsno-stadga-1280:
  period: 1280
  label: "Alsnö stadga 1280"
  title: "Alsnö stadga 1280 – frälset skapas"
  wiki:
    - "sv:Alsnö stadga"
    - "sv:Magnus Ladulås"
  text: |
    **Alsnö stadga** utfärdades omkring 1280 av kung **[Magnus
    Ladulås](#magnus-ladulas-1275)** vid kungsgården Alsnö hus på Adelsö i
    Mälaren. Magnus var kung av Sverige 1275–1290 och hade tagit makten
    från sin bror Valdemar.

    Det viktigaste i stadgan var att den som tjänade kungen som beväpnad
    ryttare, med häst och rustning, slapp betala skatt. Därmed uppstod
    **frälset** – det svenska ordet för de skattebefriade: adeln
    (världsligt frälse) och kyrkan (andligt frälse). Ordet ”frälse”
    betyder ungefär befriad. Stadgan förbjöd också stormän att tvinga
    bönder att ge dem gratis mat och logi på resor, vilket enligt
    traditionen gav Magnus tillnamnet ”Ladulås” (lås för bondens lada) –
    men tillnamnet är kanske senare.

    Varför det spelade roll: Sverige fick en adel som särskilt stånd,
    ungefär 200 år efter att liknande system vuxit fram i Frankrike och
    Tyskland. Frälsets skattefrihet var en central fråga i svensk politik
    i 400 år, fram till [Karl XI:s reduktion på
    1680-talet](#karl-xi-envalde-1680-reduktionen), och adelns privilegier
    avskaffades helt först på 1800-talet.

visby-i-hansan:
  period: 1280
  label: "Visby i Hansan"
  title: "Visby och Hansan"
  wiki:
    - "sv:Hansan"
    - "sv:Visby"
  text: |
    Hansan var ett förbund av tyska köpmän och handelsstäder, med Lübeck
    (grundad 1143) som centrum. Från 1200-talet till 1400-talet dominerade
    den handeln i Östersjön och Nordsjön: spannmål, sill, pälsar, vax,
    järn och tyg. På sin höjd omfattade den uppåt 200 städer. Den var
    ingen stat, men kunde föra krig och ställa krav på kungar.

    Gotland låg mitt i Östersjön och gotländska bönder hade länge handlat
    med Ryssland. Tyska köpmän bosatte sig i Visby från 1100-talet, och
    staden blev en av Hansans viktigaste knutpunkter, med mellanhandel
    till Novgorod. Under slutet av 1200-talet byggdes Visbys ringmur,
    omkring 3,4 km lång och till stor del bevarad. År 1288 utkämpade
    staden ett inbördeskrig mot öns bönder, och kung [Magnus
    Ladulås](#magnus-ladulas-1275) ingrep och stärkte sitt grepp om ön.

    Visbys storhetstid tog slut när Lübeck tog över ledningen och när
    [danske Valdemar Atterdag erövrade Gotland
    1361](#valdemar-atterdag-tar-visby-1361). [Hansans
    makt](#hansan-dominerar-ostersjon) formade nordisk ekonomi: många
    svenska städer, även Stockholm, hade länge tyska borgare i ledningen.

nykopings-gastabud-1317:
  period: 1300
  label: "Nyköpings gästabud 1317"
  title: "Nyköpings gästabud 1317"
  wiki:
    - "sv:Nyköpings gästabud"
    - "sv:Birger Magnusson"
  text: |
    Sveriges kung **Birger Magnusson** låg i en lång maktstrid med sina
    bröder, hertigarna **Erik och Valdemar**, söner liksom han till
    [Magnus Ladulås](#magnus-ladulas-1275). Bröderna hade 1306 tagit honom
    till fånga i Håtuna och tvingat honom att dela riket med dem. Birger
    glömde inte.

    Vid jul 1317 bjöd Birger bröderna till gästabud på **Nyköpingshus**.
    Efter festen lät han gripa dem i sängen och kasta dem i fängelsehålan.
    Enligt Erikskrönikan sa Birger ”Minns I nu Håtunaleken?”. Bröderna dog
    i fångenskap 1318, troligen av svält. Händelsen blev legendarisk och
    har gett namn åt ett av Sveriges mest kända svek.

    Men kuppen slog tillbaka. Brödernas anhängare gjorde uppror, Birger
    fick fly till Danmark och dog där i exil. Adeln valde i stället Eriks
    treårige son **Magnus Eriksson** till kung 1319, samtidigt som han
    ärvde Norges tron ([se union
    Norge–Sverige](#union-norgesverige-1319)). Det stärkte riksrådet –
    adelns och biskoparnas råd – som styrde under hans omyndighet.
    Gästabudet spelas fortfarande som teater på Nyköpingshus.

union-norgesverige-1319:
  period: 1300
  label: "union Norge–Sverige 1319"
  title: "Union mellan Norge och Sverige 1319"
  wiki:
    - "sv:Magnus Eriksson"
  text: |
    År 1319 fick **Magnus Eriksson**, då tre år gammal, två kronor
    samtidigt. Han ärvde Norge efter sin morfar, kung Håkon V, som dog
    utan söner. Och han valdes till kung av Sverige efter att hans farbror
    Birger flytt efter Nyköpings gästabud ([se
    det](#nykopings-gastabud-1317)). Det var första gången Sverige och
    Norge hade samma kung.

    Unionen var en *personalunion*: länderna hade samma kung men behöll
    egna lagar, råd och förvaltning. Under Magnus barndom styrde riksråden
    i varje land, med hans mor **Ingeborg** som inflytelserik figur. Samma
    år slöts i Oslo ett avtal som garanterade att varje land styrdes
    enligt sina egna lagar.

    Det var ett första steg mot de större nordiska unionerna. Magnus
    lyckades också tillfälligt köpa Skåne från Danmark 1332. Senare skulle
    hans sons hustru, Margareta, samla Danmark, Norge och Sverige i
    **Kalmarunionen** [1397](#kalmarunionen-1397-margareta).
    Personalunioner var vanliga i Europa och uppstod genom arv och
    giftermål, som när England och Skottland fick samma kung 1603 eller
    Sverige och Norge igen 1814–1905.

magnus-eriksson:
  period: 1320
  label: "Magnus Eriksson"
  title: "Magnus Eriksson (kung 1319–1364)"
  wiki:
    - "sv:Magnus Eriksson"
    - "sv:Magnus Erikssons landslag"
  text: |
    **Magnus Eriksson** blev kung av både Norge och Sverige 1319, tre år
    gammal ([se union Norge–Sverige](#union-norgesverige-1319)). Han var
    son till hertig Erik, som dog efter [Nyköpings
    gästabud](#nykopings-gastabud-1317). Han styrde Sverige själv från
    1332 och var kung till 1364 – en av de längsta regeringstiderna under
    medeltiden.

    Han förknippas med flera saker. Han köpte **Skåne** och Blekinge från
    ett splittrat Danmark 1332 för en enorm summa, men förlorade dem igen
    till Valdemar Atterdag 1360. Han lät skriva **[Magnus Erikssons
    landslag](#magnus-erikssons-landslag)** (omkring 1350), Sveriges
    första lag för hela riket, som ersatte de olika landskapslagarna och
    gällde i grunden fram till 1734. Den innehöll till exempel regler om
    kungaval och kungens ed. En stadslag kom samtidigt. Han förbjöd också
    slaveri i Västergötland och Värmland 1335.

    Under hans tid kom [digerdöden till Norden
    1349–50](#digerdoden-134950) och dödade kanske en tredjedel av
    befolkningen. Han hamnade i konflikt med adeln och med heliga
    Birgitta, som kritiserade honom hårt. 1364 avsattes han av en
    adelsgrupp som kallade in hans systerson [Albrekt av
    Mecklenburg](#albrekt-av-mecklenburg). Han fick tillnamnet ”Magnus
    Smek”, vilket kan syfta på att han var lättledd.

magnus-erikssons-landslag:
  period: 1340
  label: "Magnus Erikssons landslag"
  title: "Magnus Erikssons landslag ~1350"
  wiki:
    - "sv:Magnus Erikssons landslag"
    - "sv:Magnus Eriksson"
  text: |
    **[Magnus Eriksson](#magnus-eriksson)** var kung av Sverige 1319–1364
    och under en tid även av Norge. Han blev kung som treåring, och hans
    regeringstid präglades av digerdöden, konflikter med adeln och
    förlusten av Skåne till Danmark 1360.

    Hans viktigaste arv är **landslagen** från omkring 1350 – den första
    lag som gällde för hela Sveriges landsbygd. Tidigare hade varje
    landskap sin egen lag (Upplandslagen, Västgötalagen osv.), så
    rättsreglerna skilde sig mellan t.ex. Uppland och Västergötland.
    Ungefär samtidigt kom en *stadslag* för städerna. Man kan jämföra med
    att gå från många inkompatibla lokala standarder till en gemensam
    nationell.

    Lagen innehöll bland annat regler om att kungen skulle **väljas**
    (inte ärva tronen), om kungens ed att styra med råd av rådet, om
    jordägande, arv, brott och straff. Principen om valkungadöme blev
    viktig i striderna mellan kung och adel under 1400-talet. En reviderad
    version kom 1442 (Kristoffers landslag), och den gällde i princip fram
    till **1734 års lag** – alltså nästan 300 år till. Delar av 1734 års
    lag gäller formellt fortfarande i Sverige och Finland.

heliga-birgitta:
  period: 1340
  label: "Heliga Birgitta"
  title: "Heliga Birgitta (1303–1373)"
  wiki:
    - "sv:Heliga Birgitta"
  text: |
    Birgitta Birgersdotter föddes 1303 i en mäktig adelssläkt i Uppland;
    fadern var lagman (domare för ett landskap). Hon gifte sig vid 13 års
    ålder med Ulf Gudmarsson och fick åtta barn. Efter makens död 1344
    började hon nedteckna uppenbarelser – syner där hon menade att Kristus
    och Maria talade till henne. De samlades i *Revelationes*, ett av den
    svenska medeltidens mest spridda verk.

    Birgitta var också politisk. Hon var rådgivare och sedan hård kritiker
    av kung [Magnus Eriksson](#magnus-eriksson), och från Rom, dit hon
    flyttade 1349 under [digerdödens](#digerdoden-134950) år, uppmanade
    hon påven att lämna Avignon i Frankrike och återvända till Rom. Hon
    grundade en egen klosterorden, birgittinorden, som godkändes av
    påven 1370.

    Hon dog i Rom 1373 och helgonförklarades 1391. Ordens moderkloster
    blev [Vadstena](#vadstena-kloster-blomstrar). Birgitta är Sveriges
    mest kända medeltida person internationellt och utsågs 1999 av påven
    till ett av Europas skyddshelgon.

albrekt-av-mecklenburg:
  period: 1360
  label: "Albrekt av Mecklenburg"
  title: "Albrekt av Mecklenburg, kung 1364–1389"
  wiki:
    - "sv:Albrekt av Mecklenburg"
    - "sv:Slaget vid Åsle"
  text: |
    **Albrekt av Mecklenburg** var en tysk furste vars mor var syster till
    Sveriges [kung Magnus Eriksson](#magnus-eriksson). När den svenska
    adeln 1363–64 gjorde uppror mot Magnus, som var försvagad av förlusten
    av Skåne och dålig ekonomi, bjöd de in Albrekt och valde honom till
    kung.

    Albrekt blev aldrig populär. Han gav många borgar och förläningar till
    tyska adelsmän från Mecklenburg, och i praktiken styrde den svenska
    högadeln – främst storheten **Bo Jonsson Grip**, som en tid
    kontrollerade ungefär en tredjedel av Sverige. När Albrekt efter Bo
    Jonssons död 1386 försökte ta tillbaka adelns jord vände sig adeln i
    stället till drottning **Margareta** av Danmark och Norge.

    År 1389 besegrades Albrekt vid **Falköping** (slaget vid Åsle) och
    tillfångatogs. Hans anhängare höll Stockholm i flera år till, med
    hjälp av sjörövare kallade *vitaliebröder*, som ursprungligen skeppade
    proviant (”viktualier”) till staden och sedan plundrade i hela
    Östersjön. Albrekts fall öppnade vägen för [Kalmarunionen
    1397](#kalmarunionen-1397-margareta), då Sverige, Danmark och Norge
    fick en gemensam kung.

albrekt-avsatts-1389:
  period: 1380
  label: "Albrekt avsätts 1389"
  title: "Albrekt av Mecklenburg avsätts 1389"
  wiki:
    - "sv:Albrekt av Mecklenburg"
    - "sv:Slaget vid Åsle"
  text: |
    Albrekt av Mecklenburg var en nordtysk furste som blev svensk kung
    1364, när missnöjda stormän avsatte [Magnus
    Eriksson](#magnus-eriksson) och kallade in honom (se [Albrekt av
    Mecklenburg](#albrekt-av-mecklenburg)). I praktiken styrde stormännen
    själva, främst drotsen Bo Jonsson Grip, som till sin död 1386 ägde
    eller kontrollerade en stor del av riket. Albrekt försökte ge borgar
    och län till sina tyska anhängare, vilket gjorde honom impopulär.

    Bo Jonssons testamentsexekutorer vände sig till drottning Margareta,
    som redan styrde Danmark och Norge. År 1389 besegrades Albrekt i
    slaget vid Åsle nära Falköping och tillfångatogs. Han satt fången i
    sex år.

    Stockholm, med en stark tysk borgarklass, höll ut för Albrekt
    till 1398. Hans anhängare anlitade sjörövare, vitaliebröderna, som
    härjade i Östersjön. Men Margaretas seger öppnade vägen för
    [Kalmarunionen 1397](#kalmarunionen-1397-margareta), där de tre
    nordiska rikena fick en gemensam kung – en union som skulle prägla
    Norden i mer än hundra år.

vadstena-kloster-blomstrar:
  period: 1400
  label: "Vadstena kloster blomstrar"
  title: "Vadstena kloster"
  wiki:
    - "sv:Vadstena kloster"
    - "sv:Birgittinorden"
  text: |
    Vadstena kloster vid Vättern var moderkloster för birgittinorden,
    grundad av [Heliga Birgitta](#heliga-birgitta). Det invigdes 1384 och
    var ett dubbelkloster: enligt Birgittas regel skulle det rymma 60
    nunnor och 25 bröder (präster och lekbröder) i skilda delar, under
    ledning av en abbedissa – ovanligt i en tid då kvinnor sällan ledde
    institutioner.

    Under 1400-talet blev Vadstena Sveriges främsta andliga och
    intellektuella centrum. Gåvor från adel och kungar gjorde klostret
    till en av landets största jordägare. Det hade ett av Nordens största
    bibliotek, och i dess skrivstuga översattes och skrevs texter på
    svenska, vilket gör Vadstena viktigt för svenska språkets historia.
    Pilgrimer kom från hela Norden, och birgittinkloster grundades i bland
    annat England, Tyskland och Italien.

    Kopplingen till utbildning var stark: när [Uppsala
    universitet](#uppsala-universitet-1477) grundades kom flera lärda män
    från Vadstenamiljön. Efter [reformationen](#reformation-vasteras-1527)
    förlorade klostret sina gods och stängdes 1595. Klosterkyrkan,
    Blåkyrkan, står kvar.

engelbrektsupproret-1434:
  period: 1420
  label: "Engelbrektsupproret 1434"
  title: "Engelbrektsupproret 1434"
  wiki:
    - "sv:Engelbrektsupproret"
    - "sv:Engelbrekt Engelbrektsson"
    - "sv:Kalmarunionen"
  text: |
    Sverige ingick då i **Kalmarunionen** [(från
    1397)](#kalmarunionen-1397-margareta) – en union där Danmark, Norge
    och Sverige hade samma kung. Kungen var **[Erik av
    Pommern](#erik-av-pommern-unionskung)**, som styrde från Danmark. Han
    förde krig mot Hansan (de nordtyska handelsstäderna) om Slesvig,
    vilket ledde till en handelsblockad som stoppade exporten av järn och
    koppar från Bergslagen. Samtidigt höjde han skatterna och tillsatte
    danska och tyska fogdar (kungliga ämbetsmän) på svenska slott.

    **Engelbrekt Engelbrektsson** var en lågadlig bergsman – ägare av
    gruvor och hyttor – från Bergslagen. 1434 ledde han ett uppror av
    bönder och bergsmän från Dalarna. På några månader drevs fogdarna ut
    och slotten intogs i stora delar av landet. Riksrådet, de mäktigaste
    stormännen, anslöt sig och sade upp trohet mot Erik.

    Engelbrekt valdes till rikshövitsman (högste militär ledare) 1435 vid
    [mötet i Arboga](#arboga-mote-1435). Men 1436 mördades han av
    adelsmannen Måns Bengtsson (Natt och Dag) på en holme i sjön
    Hjälmaren.

    Under 1800-talet blev han en nationalhjälte och symbol för frihet.
    Upproret var början på hundra år av konflikter som slutade med att
    [Gustav Vasa bröt unionen 1523](#gustav-vasa-1523).

arboga-mote-1435:
  period: 1420
  label: "Arboga möte 1435"
  title: "Arboga möte 1435"
  wiki:
    - "sv:Arboga möte"
    - "sv:Engelbrektsupproret"
  text: |
    I januari 1435, mitt under Engelbrektsupproret ([se
    1434](#engelbrektsupproret-1434)), samlades representanter för olika
    samhällsgrupper i staden **Arboga** i Västmanland. Mötet räknas
    traditionellt som **Sveriges första riksdag**.

    Det nya var vilka som var med. Tidigare hade kungen fattat beslut med
    riksrådet – ett fåtal stormän och biskopar. I Arboga fanns enligt
    traditionen även lågadel, borgare (stadsbor) och bönder
    representerade. Källorna är dock knapphändiga, och historiker är oense
    om hur representativt mötet verkligen var och om man kan kalla det en
    riksdag i senare mening. Begreppet ”riksdag” användes först på
    1500-talet.

    Mötet valde **Engelbrekt** till rikshövitsman, högsta militära ledare,
    i upproret mot unionskungen [Erik av
    Pommern](#erik-av-pommern-unionskung).

    Arbogamötet blev viktigt som symbol. Riksdagen med fyra stånd – adel,
    präster, borgare och bönder – tog fast form under 1500–1600-talen och
    bestod till 1866, då den ersattes av en tvåkammarriksdag. Att svenska
    bönder hade en egen röst i riksdagen var ovanligt i Europa. Riksdagen
    firade 2010 sitt 575-årsjubileum med 1435 som utgångspunkt.

karl-knutsson:
  period: 1440
  label: "Karl Knutsson"
  title: "Karl Knutsson (Bonde)"
  wiki:
    - "sv:Karl Knutsson (Bonde)"
    - "sv:Kalmarunionen"
  text: |
    **Karl Knutsson** (Bonde) (1408/09–1470) var en av Sveriges rikaste
    stormän, med stora gods. Han var riksföreståndare efter
    [Engelbrektsupproret](#engelbrektsupproret-1434) och valdes till
    svensk kung 1448, i opposition mot Kalmarunionen (unionen med Danmark
    och Norge) och mot den danske kungen **[Kristian
    I](#kristian-i-oldenburgska-atten-1448)**.

    Hans regeringstid är unik för sin osäkerhet: han var kung **tre
    gånger**. 1448–1457 regerade han, men avsattes efter ett uppror lett
    av ärkebiskopen Jöns Bengtsson (Oxenstierna) och flydde till Danzig.
    1464–1465 var han kung en kort tid, och avsattes igen. 1467–1470 var
    han kung en tredje gång, till sin död. Han var en tid även kung av
    Norge (1449–1450).

    Konflikten gällde både personer och principer. På ena sidan stod de
    som ville ha en egen svensk kung och skydda bergsbrukets handel med
    Lübeck; på andra sidan unionsvänliga stormän och kyrkan, som ville ha
    en gemensam nordisk kung. De mäktiga adelssläkterna Oxenstierna/Vasa
    och Tott bytte sida efter egenintresse.

    Hans systerson **[Sten Sture den äldre](#sten-sture-d-a)** tog över
    efter hans död och vann slaget vid [Brunkeberg
    1471](#brunkeberg-1471). Konflikten avslutades först när [Gustav Vasa
    bröt unionen 1523](#gustav-vasa-1523).

brunkeberg-1471:
  period: 1460
  label: "Brunkeberg 1471"
  title: "Slaget vid Brunkeberg 1471"
  wiki:
    - "sv:Slaget vid Brunkeberg"
    - "sv:Sten Sture den äldre"
  text: |
    Efter att [Karl Knutsson](#karl-knutsson) dog 1470 blev hans systerson
    **[Sten Sture den äldre](#sten-sture-d-a)** riksföreståndare i
    Sverige. Den danske kungen **[Kristian
    I](#kristian-i-oldenburgska-atten-1448)** ville återupprätta
    **[Kalmarunionen](#kalmarunionen-1397-margareta)** (unionen mellan
    Danmark, Norge och Sverige) och få den svenska kronan. Sommaren 1471
    seglade han till Stockholm med en armé och slog läger på
    **Brunkebergsåsen**, en grusås där dagens Norrmalm och Brunkebergstorg
    ligger.

    Den 10 oktober 1471 anföll Sten Sture med en armé av bönder, bergsmän
    från Dalarna och adelsmän, tillsammans med borgare från Stockholm. Han
    hade fått stöd av Nils och Knut Sture. Kristians armé – omkring 5 000
    man, många legosoldater – trycktes tillbaka mot sina skepp; många
    drunknade när en bro över Norrström bröt samman. Kristian skadades och
    förlorade tänder. Dödstalen är osäkra men brukar anges till några
    hundra till över tusen.

    Segern firades med **Sankt Göran och draken**, den stora träskulptur
    av Bernt Notke som invigdes i Storkyrkan 1489 – draken stod för
    Danmark.

    Sten Sture styrde Sverige till 1503. Brunkeberg försvagade unionen men
    bröt den inte; det gjorde först [Gustav Vasa 1523](#gustav-vasa-1523),
    efter [Stockholms blodbad](#stockholms-blodbad-1520).

uppsala-universitet-1477:
  period: 1460
  label: "Uppsala universitet 1477"
  title: "Uppsala universitet grundas 1477"
  wiki:
    - "sv:Uppsala universitet"
    - "en:Jakob Ulvsson"
  text: |
    **Uppsala universitet** grundades 1477, efter att påven Sixtus IV gett
    tillstånd. Drivande var ärkebiskop **Jakob Ulvsson** med stöd av
    riksföreståndaren [Sten Sture d.ä.](#sten-sture-d-a) Det är Nordens
    äldsta universitet – Köpenhamn följde två år senare, 1479. Jämför med
    [Bologna (~1088)](#universitetet-i-bologna-1088), [Paris
    (~1150)](#universitet-i-paris-och-oxford-tar-form) och Prag (1348).

    Före 1477 måste svenskar som ville bli präster, läkare eller jurister
    med högre utbildning resa till Paris, Prag, Leipzig eller Rostock. Ett
    eget universitet betydde att landet kunde utbilda sina egna ämbetsmän
    och kyrkans folk, och var också ett politiskt ställningstagande:
    Sverige ville vara ett eget rike och inte bara en del av den
    danskledda [Kalmarunionen](#kalmarunionen-1397-margareta).

    Universitetet var litet – några få lärare och kanske ett par hundra
    studenter – och nästan dog ut under reformationsårtiondena på
    1500-talet. Det återupprättades 1595 och fick stora jordegendomar av
    Gustav II Adolf 1624. Senare verkade här bland andra Celsius och Linné
    (1700-talet).

sten-sture-d-a:
  period: 1480
  label: "Sten Sture d.ä."
  title: "Sten Sture den äldre"
  wiki:
    - "sv:Sten Sture den äldre"
    - "sv:Slaget vid Brunkeberg"
  text: |
    **Sten Sture den äldre** (ca 1440–1503) var Sveriges
    **riksföreståndare** – den som styrde riket när det saknades en kung –
    1470–1497 och 1501–1503. Sverige var formellt med i Kalmarunionen med
    Danmark och Norge, men Sten Sture ledde den falang i adeln och bland
    bönder och bergsmän som ville styra landet självt.

    Hans mest kända seger var **slaget vid
    [Brunkeberg](#brunkeberg-1471)** 1471, utkämpat på en ås i nuvarande
    centrala Stockholm (ungefär vid dagens Sergels torg/Norrmalm). Han
    besegrade den danske kungen [Kristian
    I](#kristian-i-oldenburgska-atten-1448). Uppskattningsvis några tusen
    deltog på var sida. Segern firades med Bernt Notkes skulptur *Sankt
    Göran och draken* i Storkyrkan, där draken symboliserar Danmark.

    Under hans tid grundades [Uppsala universitet
    1477](#uppsala-universitet-1477), och den första boken trycktes i
    Sverige 1483. Han förlorade makten till [kung Hans](#kung-hans) 1497
    men fick tillbaka den 1501. Han hade inga barn; senare Sture-ledare
    var bara avlägset släkt. Kampen mot unionen fullbordades av [Gustav
    Vasa 1523](#gustav-vasa-1523).

sten-sture-d-y:
  period: 1500
  label: "Sten Sture d.y."
  title: "Sten Sture den yngre"
  wiki:
    - "sv:Sten Sture den yngre"
    - "sv:Gustav Trolle"
    - "sv:Slaget på Åsundens is"
  text: |
    **Sten Sture den yngre** (1493–1520) var Sveriges riksföreståndare
    1512–1520. Han var bara 19 år när han tog makten. Han var inte släkt
    med [Sten Sture d.ä.](#sten-sture-d-a) men tog Sture-namnet för att
    anknyta till hans ”svenska” politik mot den danskledda
    [Kalmarunionen](#kalmarunionen-1397-margareta).

    Han hamnade i konflikt med ärkebiskopen **Gustav Trolle**, som stödde
    unionen och den danske kungen. 1517 lät Sten Sture riksdagen avsätta
    Trolle och riva hans borg Stäket. Påven bannlyste Sten Sture och hans
    anhängare, och [Kristian II](#kristian-ii) av Danmark fick ett
    religiöst skäl att anfalla.

    Vid **Bogesund** (Ulricehamn) i januari 1520, på isen på sjön Åsunden,
    sårades Sten Sture av en kanonkula i benet. Han dog några veckor
    senare på slädfärden mot Stockholm, på Mälarens is. Hans änka
    **Kristina Gyllenstierna** försvarade Stockholm till september. När
    Kristian II tagit staden följde [Stockholms
    blodbad](#stockholms-blodbad-1520) i november 1520, då Sten Stures
    anhängare avrättades och hans lik grävdes upp och brändes.

stockholms-blodbad-1520:
  period: 1520
  label: "Stockholms blodbad 1520"
  title: "Stockholms blodbad 1520"
  wiki:
    - "sv:Stockholms blodbad"
    - "sv:Kristian II"
  text: |
    Under Kalmarunionen (från 1397) hade Danmark, Norge och Sverige samma
    kung, men svenska stormän styrde ofta Sverige i praktiken genom
    riksföreståndare, till exempel [Sten Sture den
    yngre](#sten-sture-d-y). Den danske kungen **[Kristian
    II](#kristian-ii)** erövrade Sverige 1520 och kröntes i Stockholm i
    november.

    Några dagar efter kröningsfesten, 8–9 november 1520, lät han avrätta
    omkring 80–100 personer på Stortorget: biskopar, adelsmän och borgare
    som stött Sture-partiet. Formellt dömdes de som kättare, eftersom de
    hade avsatt ärkebiskopen Gustav Trolle, en anhängare till unionen.

    Massavrättningen fick motsatt effekt mot den avsedda. Bland de dödade
    fanns **Gustav Erikssons** (senare Gustav Vasa) far. Gustav ledde ett
    uppror från Dalarna som drev ut danskarna, och 1523 valdes han till
    kung (se [Gustav Vasa 1523](#gustav-vasa-1523)). Kalmarunionen var
    därmed i praktiken slut. I Sverige fick Kristian II öknamnet Kristian
    Tyrann.

gustav-vasa-1523:
  period: 1520
  label: "Gustav Vasa 1523"
  title: "Gustav Vasa blir kung 1523"
  wiki:
    - "sv:Gustav Vasa"
    - "sv:Befrielsekriget"
  text: |
    **Gustav Eriksson Vasa** (ca 1496–1560) var en svensk adelsman vars
    far avrättades i [Stockholms blodbad 1520](#stockholms-blodbad-1520).
    Han samlade bönder och bergsmän i Dalarna till uppror mot den danske
    kungen Kristian II (befrielsekriget 1521–1523). Med hjälp av
    hansestaden Lübeck, som lånade ut skepp och soldater på kredit, intogs
    Stockholm, och 6 juni 1523 valdes han till kung i Strängnäs – därav
    nationaldagen.

    Han regerade i 37 år och byggde den svenska staten. Skulden till
    Lübeck löstes bland annat genom att konfiskera kyrkans egendomar (se
    [reformation, Västerås 1527](#reformation-vasteras-1527)). Han
    centraliserade skatteuppbörd och förvaltning, byggde upp en egen armé
    och flotta och gjorde 1544 Sverige till arvrike, så att kronan gick i
    arv inom Vasaätten i stället för att kungen valdes.

    Hans styre var hårt; flera bondeuppror slogs ner, mest känt
    [Dackefejden 1542](#dackefejden-1542). Sverige hade då
    uppskattningsvis 750 000–1 miljon invånare. Hans söner [Erik XIV,
    Johan III](#erik-xiv-johan-iii) och Karl IX blev alla kungar efter
    honom.

reformation-vasteras-1527:
  period: 1520
  label: "reformation (Västerås 1527)"
  title: "Reformationen i Sverige – Västerås riksdag 1527"
  wiki:
    - "sv:Reformationen i Sverige"
    - "sv:Västerås riksdag 1527"
  text: |
    [Gustav Vasa](#gustav-vasa-1523) behövde pengar: han var skyldig
    Lübeck för hjälpen i befrielsekriget, och kyrkan ägde uppskattningsvis
    en femtedel av Sveriges jord. Samtidigt spreds [Luthers
    idéer](#luther-95-teser-1517), i Sverige främst genom bröderna **Olaus
    och Laurentius Petri**, som studerat i Wittenberg.

    På riksdagen i Västerås 1527 hotade Gustav att abdikera om han inte
    fick sin vilja igenom. Resultatet blev att kronan fick dra in
    biskoparnas och klostrens ”överflödiga” egendomar och att kyrkan
    ställdes under kungen. Det var lika mycket en ekonomisk och politisk
    reform som en religiös.

    Den teologiska förändringen kom gradvis: Nya testamentet på svenska
    1526, hela Bibeln (Gustav Vasas bibel) 1541, en svensk mässa på
    1530-talet. Först vid [Uppsala möte 1593](#uppsala-mote-1593)
    fastslogs den lutherska läran formellt. Jämför med England, där
    [Henrik VIII bröt med påven 1534](#henrik-viii-bryter-med-rom-1534)
    delvis av egna skäl. Svenska kyrkan förblev statskyrka till år 2000.

dackefejden-1542:
  period: 1540
  label: "Dackefejden 1542"
  title: "Dackefejden 1542–1543"
  wiki:
    - "sv:Dackefejden"
    - "sv:Nils Dacke"
  text: |
    **Nils Dacke** var en bonde från Småland som 1542 ledde det största
    bondeupproret i Sveriges historia, mot [Gustav
    Vasa](#gustav-vasa-1523). Orsakerna var många: höjda skatter, att
    kronan drog in kyrkans silver och klockor [vid
    reformationen](#reformation-vasteras-1527), förbud mot handel över
    gränsen till danska Blekinge och Skåne (som småländska bönder levde
    av), och en allt mer påträngande kunglig fogdemakt.

    Dackes bondearmé använde skogen och gerillataktik och besegrade
    kungens trupper i flera strider; under en tid kontrollerade
    upprorsmännen i praktiken stora delar av Småland. Det fanns kontakter
    med kungens fiender i Tyskland. Gustav Vasa ändrade taktik, blockerade
    området och använde propaganda, och i mars 1543 besegrades bönderna.
    Dacke dödades under flykten samma år.

    Hämnden var hård, med avrättningar och deportationer. Men kungen drog
    också slutsatser och blev försiktigare med skatter och handelsförbud.
    Dackefejden är ett exempel på hur Vasa-statens centralisering stötte
    på motstånd, något som återkommer i många europeiska länder vid samma
    tid, t.ex. det [tyska bondekriget 1524–25](#bondekriget-152425).

erik-xiv-johan-iii:
  period: 1560
  label: "Erik XIV, Johan III"
  title: "Erik XIV och Johan III"
  wiki:
    - "sv:Erik XIV"
    - "sv:Johan III"
  text: |
    [Gustav Vasas](#gustav-vasa-1523) söner efterträdde honom. **Erik
    XIV** (kung 1560–1568) var välutbildad, språkkunnig och friade bland
    annat till [Elisabet I](#elisabet-i-1558) av England. Han startade
    Sveriges expansion i Baltikum genom att ta Reval (Tallinn) 1561 och
    förde [Nordiska sjuårskriget](#nordiska-sjuarskriget-156370) mot
    Danmark. Han blev alltmer misstänksam och psykiskt instabil: 1567
    mördade han och hans män flera medlemmar av adelssläkten Sture i
    Uppsala (Sturemorden). Han gifte sig med Karin Månsdotter, en
    soldatdotter.

    Hans halvbror **Johan** hade suttit fängslad av Erik. 1568 gjorde
    Johan och brodern Karl uppror och avsatte Erik, som hölls fången till
    sin död 1577 – enligt traditionen förgiftad med arsenik i ärtsoppa.
    Johan III (kung 1568–1592) var gift med den katolska polska prinsessan
    Katarina Jagellonica och försökte närma Svenska kyrkan till
    katolicismen med en ny kyrkoordning, ”den röda boken”. Han älskade
    arkitektur och byggde om slott som Kalmar och Vadstena.

    Hans son Sigismund blev kung av Polen 1587 och sedan även av Sverige,
    men var katolik och avsattes av farbrodern Karl IX – början på ett
    halvsekel av krig mellan Sverige och Polen.

uppsala-mote-1593:
  period: 1580
  label: "Uppsala möte 1593"
  title: "Uppsala möte 1593"
  wiki:
    - "sv:Uppsala möte"
    - "sv:Sigismund"
  text: |
    [Sveriges reformation](#reformation-vasteras-1527) hade börjat under
    [Gustav Vasa](#gustav-vasa-1523) på 1520-talet, men det var oklart
    exakt vad Svenska kyrkan skulle tro. Kung [Johan
    III](#erik-xiv-johan-iii) experimenterade med en liturgi nära
    katolicismen. När han dog 1592 var arvingen hans son **Sigismund** –
    katolik och sedan 1587 också kung av Polen.

    Innan Sigismund hann komma till Sverige samlades omkring 300 präster
    och företrädare för ständerna i Uppsala i mars 1593 under ledning av
    hertig **Karl** (Johans bror, senare Karl IX). Mötet beslöt att
    Sverige bekände sig till den lutherska läran enligt den [Augsburgska
    bekännelsen (1530)](#augsburgska-bekannelsen-1530), avskaffade Johans
    liturgi och förbjöd katolsk gudstjänst. Mötet räknas som Svenska
    kyrkans födelse som en uttryckligen luthersk kyrka.

    Sigismund tvingades godkänna besluten för att bli krönt, men
    konflikten mellan honom och Karl ledde till inbördeskrig och slaget
    vid Stångebro 1598. Sigismund avsattes 1599, och den polska och
    svenska grenen av huset Vasa förblev fiender i 60 år. Den lutherska
    enhetskyrkan präglade Sverige fram till religionsfrihetslagen 1951.

gustav-ii-adolf-1611:
  period: 1600
  label: "Gustav II Adolf 1611"
  title: "Gustav II Adolf blir kung 1611"
  wiki:
    - "sv:Gustav II Adolf"
    - "sv:Svenska stormaktstiden"
  text: |
    **Gustav II Adolf** (1594–1632) blev Sveriges kung 1611, bara 16 år
    gammal, efter sin far Karl IX. Sverige hade då kanske 1–1,5 miljoner
    invånare (inklusive Finland) och var ett fattigt bondeland i krig med
    Danmark (se [Kalmarkriget](#kalmarkriget)), Ryssland och Polen
    samtidigt.

    Tillsammans med rikskanslern **Axel Oxenstierna** byggde han om
    staten: kollegier (centrala ämbetsverk, föregångare till dagens
    myndigheter), en ny rättsordning med Svea hovrätt (1614), Uppsala
    universitet fick stora donationer, och nya städer grundades, bland dem
    Göteborg 1621. Armén byggdes på utskrivning av bönder, och han
    utvecklade en ny taktik med lätta, rörliga kanoner, grundare
    formationer och samordning mellan musketerare, pikenerare och
    kavalleri.

    Efter segrar mot Ryssland (freden i Stolbova 1617, som stängde
    Ryssland ute från Östersjön) och Polen gick han 1630 in i
    [trettioåriga kriget](#trettioariga-kriget-1618) och vann vid
    [Breitenfeld 1631](#breitenfeld-1631-lutzen-1632), men stupade vid
    [Lützen 1632](#gustav-ii-adolf-stupar-1632) (se där). Han lade grunden
    till den svenska stormaktstiden, då Sverige fram till 1721 var en av
    Europas stormakter.

sverige-stormakt:
  period: 1620
  label: "Sverige stormakt"
  title: "Sverige blir stormakt"
  wiki:
    - "sv:Svenska stormaktstiden"
  text: |
    **Stormaktstiden** kallas perioden ungefär 1611–1721 då Sverige var en
    av Europas militära stormakter och kontrollerade stora delar av
    Östersjöns kuster: Finland, Estland, Livland (dagens norra Lettland
    och södra Estland), Ingermanland (kring dagens S:t Petersburg) och
    efter 1648 delar av norra Tyskland.

    Det var märkligt med tanke på storleken: Sverige (med Finland) hade
    uppskattningsvis 1–1,5 miljoner invånare, jämfört med Frankrikes cirka
    18–20 miljoner. Framgången byggde på en effektiv statsförvaltning
    (kansler Axel Oxenstierna), utskrivning av bondesöner till en
    nationell armé, ny taktik, lätt rörligt fältartilleri och export av
    koppar och järn som finansierade krigen. Mycket av kriget bekostades
    också av de ockuperade områdena själva.

    Genombrottet kom när **[Gustav II Adolf](#gustav-ii-adolf-1611)** gick
    in i [trettioåriga kriget](#trettioariga-kriget-1618) i Tyskland 1630.
    Priset var högt: många socknar förlorade en stor del av sina unga män.
    Stormaktstiden tog slut efter [stora nordiska
    kriget](#stora-nordiska-kriget) och [freden i Nystad
    1721](#nystad-1721-stormaktstiden-slut), då Ryssland under Peter den
    store tog över rollen som Östersjöns ledande makt.

gustav-ii-adolf-stupar-1632:
  period: 1620
  label: "Gustav II Adolf stupar 1632"
  title: "Gustav II Adolf stupar vid Lützen 1632"
  wiki:
    - "sv:Gustav II Adolf"
    - "sv:Slaget vid Lützen (1632)"
  text: |
    **Gustav II Adolf** (kung 1611–1632) är Sveriges mest kända kung. Han
    moderniserade armén och förvaltningen och gick 1630 in i
    **[trettioåriga kriget](#trettioariga-kriget-1618)** (1618–1648) – ett
    krig i Tyskland som började som en strid mellan protestantiska och
    katolska furstar och blev en europeisk maktkamp. Han landsteg i
    Pommern med uppskattningsvis 13 000 man.

    1631 vann han en stor seger vid
    [Breitenfeld](#breitenfeld-1631-lutzen-1632) nära Leipzig över den
    katolska kejserliga armén. Den 6 november 1632 möttes svenskarna och
    den kejserlige fältherren Wallenstein vid **Lützen**, sydväst om
    Leipzig, med kanske 15–20 000 man på varje sida. Svenskarna vann
    slaget, men kungen red in i dimma och krutrök och dödades.

    Hans dotter [Kristina](#kristina) var sex år, så kansler Axel
    Oxenstierna ledde riket. Sverige fortsatte kriget fram till
    Westfaliska freden 1648 ([se 1640-talet](#westfaliska-freden-1648)). I
    Sverige firas 6 november som Gustav Adolfsdagen, och protestanter i
    Tyskland såg honom länge som räddare av sin tro.

nya-sverige-1638:
  period: 1620
  label: "Nya Sverige 1638"
  title: "Nya Sverige 1638"
  wiki:
    - "sv:Nya Sverige"
  text: |
    **Nya Sverige** var en liten svensk koloni vid floden Delaware i
    Nordamerika, där dagens delstater Delaware, Pennsylvania och New
    Jersey möts. 1638 anlände skeppen Kalmar Nyckel och Fogel Grip och
    grundade Fort Christina (dagens Wilmington), uppkallat efter
    [drottning Kristina](#kristina).

    Bakom låg ett handelskompani med svenska, nederländska och tyska
    intressenter; ledaren Peter Minuit hade tidigare arbetat för
    holländarna och ”köpt” Manhattan. Syftet var främst handel med
    bäverskinn och tobak. Kolonin förblev mycket liten – som mest
    uppskattningsvis 400–600 nybyggare, många av dem finnar från Värmland
    och Finland.

    1655 erövrade holländarna från [Nya Amsterdam](#nya-amsterdam-1626)
    (dagens New York) kolonin, och [nio år senare tog engelsmännen över
    allt](#nya-amsterdam-blir-new-york-1664). Men nybyggarna stannade
    kvar. De anses ha introducerat timmerstugan (log cabin) i Nordamerika,
    och den svensk-lutherska kyrkan Gloria Dei i Philadelphia från 1700
    står än idag. Jämför med [Englands kolonier](#mayflower-1620) i samma
    område, som redan 1640 hade tiotusentals invånare.

kristina:
  period: 1640
  label: "Kristina"
  title: "Drottning Kristina"
  wiki:
    - "sv:Kristina (regent)"
  text: |
    **Kristina** (1626–1689) var dotter till Gustav II Adolf och blev
    drottning av Sverige vid sex års ålder när [fadern stupade
    1632](#gustav-ii-adolf-stupar-1632). Kanslern Axel Oxenstierna styrde
    tills hon blev myndig 1644. Hon hade uppfostrats som en prins och var
    mycket lärd – hon läste latin, grekiska och filosofi.

    Hon ville göra Stockholm till ett lärdomscentrum och bjöd in utländska
    tänkare, bland andra filosofen **[René
    Descartes](#descartes-discours-1637)**, som kom 1649 och dog i
    lunginflammation i Stockholm vintern därpå. Hon drev på freden 1648
    (Westfaliska freden). Hon delade också ut adelskap och kronans
    jordegendomar i stor skala; antalet adelsätter fördubblades, vilket
    försvagade statens ekonomi och senare ledde till [Karl XI:s
    reduktion](#karl-xi-envalde-1680-reduktionen) (indragning av adelns
    gods till kronan).

    1654 gjorde hon något chockerande: hon abdikerade, gick över till
    katolicismen – förbjudet i Sverige – och flyttade till Rom, där hon
    levde till sin död och blev mecenat för musik och konst. Hon vägrade
    gifta sig. Hon är en av få kvinnor begravda i Peterskyrkan. Tronen
    gick till kusinen Karl X Gustav (se
    [Roskildefreden](#roskildefreden-1658-skane-svenskt)).

sverige-far-pommern-1648:
  period: 1640
  label: "Sverige får Pommern 1648"
  title: "Sverige får Pommern 1648"
  wiki:
    - "sv:Svenska Pommern"
  text: |
    Genom **[Westfaliska freden](#westfaliska-freden-1648)** 1648, som
    avslutade [trettioåriga kriget](#trettioariga-kriget-1618), fick
    Sverige betalt för sitt deltagande. Sverige fick **Vorpommern**
    (västra Pommern vid Östersjöns sydkust) med Stettin (dagens Szczecin)
    och ön Rügen, staden **Wismar**, samt **Bremen-Verden** vid Nordsjön
    nära Elbes och Wesers mynningar. Dessutom fick Sverige 5 miljoner
    riksdaler för att avveckla sin armé – en enorm summa, flera gånger
    statens årsinkomster.

    Det viktiga var kontrollen över flodmynningar: tullar på handeln längs
    floderna Oder, Elbe och Weser gav inkomster. Dessutom blev Sveriges
    kung riksfurste i det tysk-romerska riket med plats i riksdagen i
    Regensburg. Sverige blev en av fredens garanter.

    Men besittningarna var svåra att försvara och drog Sverige in i nya
    krig med Brandenburg (senare Preussen), Danmark och Polen.
    Bremen-Verden förlorades 1719, större delen av Pommern 1720, och
    resten 1815. Wismar pantsattes 1803. Ett minne lever kvar: Greifswalds
    universitet var svenskt i 170 år.

roskildefreden-1658-skane-svenskt:
  period: 1660
  label: "Roskildefreden 1658: Skåne svenskt"
  title: "Roskildefreden 1658: Skåne blir svenskt"
  wiki:
    - "sv:Freden i Roskilde"
    - "sv:Tåget över Bält"
  text: |
    **Karl X Gustav** (kung 1654–1660), kusin till [drottning
    Kristina](#kristina), var i krig med Polen när Danmark 1657 förklarade
    krig mot Sverige för att ta tillbaka det som förlorats vid [Brömsebro
    1645](#bromsebro-1645). Karl marscherade då snabbt från Polen till
    Jylland.

    Vintern 1658 var ovanligt kall. I januari–februari lät Karl sin armé –
    uppskattningsvis 7 000–12 000 man med hästar och kanoner – gå över
    isen på Lilla Bält och Stora Bält, en sträcka på flera mil. Två
    skvadroner gick genom isen och drunknade. När svenskarna stod på
    Själland nära Köpenhamn gav Danmark upp.

    Vid freden i **Roskilde** i februari 1658 fick Sverige **Skåne,
    Halland, Blekinge**, Bohuslän, Trondheims län och Bornholm. De två
    sista lämnades tillbaka 1660. Sverige fick därmed i stort sett sina
    nuvarande gränser i söder och väster. Danmark förlorade ungefär en
    tredjedel av sitt territorium. Karl försökte samma år erövra hela
    Danmark men misslyckades. Skåne försvenskades under följande
    årtionden, bland annat genom Lunds universitet ([se
    1666](#lunds-universitet-1666)).

lunds-universitet-1666:
  period: 1660
  label: "Lunds universitet 1666"
  title: "Lunds universitet grundas 1666"
  wiki:
    - "sv:Lunds universitet"
  text: |
    Efter [Roskildefreden 1658](#roskildefreden-1658-skane-svenskt) var
    Skåne svenskt, men befolkningen talade danska, kyrkan följde danska
    ordningar och prästerna hade utbildats i Köpenhamn. Den svenska
    regeringen ville binda landskapet till Sverige. Ett av medlen var att
    grunda ett universitet i **Lund**, som redan var ett kyrkligt centrum
    med en domkyrka från 1100-talet.

    **Lunds universitet** invigdes 1668 (beslutat 1666) med namnet Regia
    Academia Carolina efter den unge kungen Karl XI. Det skulle utbilda
    präster och ämbetsmän på svenska och i svensk anda. Det var Sveriges
    andra universitet efter [Uppsala (1477)](#uppsala-universitet-1477);
    Åbo i Finland hade grundats 1640 och Dorpat (Tartu) 1632.

    Universitetet fick en svår start: under skånska kriget 1676–79, då
    Danmark försökte ta tillbaka Skåne, stängdes det, och flera år gick
    innan det öppnade igen 1682. Försvenskningen av Skåne var i stort sett
    genomförd under 1700-talet. Idag har Lunds universitet omkring 40
    000–45 000 studenter och är ett av Nordens största.

karl-xi-envalde-1680-reduktionen:
  period: 1680
  label: "Karl XI: envälde 1680, reduktionen"
  title: "Karl XI, enväldet och reduktionen"
  wiki:
    - "sv:Karl XI"
    - "sv:Reduktionen"
    - "sv:Indelningsverket"
  text: |
    **Karl XI** (kung 1660–1697) blev kung som fyraåring; under hans
    förmyndare skuldsattes riket och kronan sålde eller skänkte bort mark
    till adeln. Efter det svåra skånska kriget mot Danmark 1675–1679
    genomförde han stora förändringar.

    Vid riksdagen 1680 inleddes **enväldet**: kungen styrde utan att
    behöva rådet eller riksdagens godkännande. Samtidigt inleddes
    **reduktionen** – kronan tog tillbaka gods som skänkts eller sålts
    till adeln. Adelns andel av jorden sjönk från ungefär två tredjedelar
    till ungefär en tredjedel. Bönderna stödde detta eftersom det hindrade
    att de hamnade under adelsgodsen.

    Inkomsterna finansierade **indelningsverket**: varje landskap höll ett
    visst antal soldater med torp och lön, så Sverige fick en ständigt
    beredd armé utan stora extraskatter. Den armén använde [Karl
    XII](#karl-xii-1697) i [stora nordiska kriget](#stora-nordiska-kriget)
    (se det). Enväldet varade till 1718; därefter kom
    [frihetstiden](#frihetstiden).

karl-xii-1697:
  period: 1680
  label: "Karl XII 1697"
  title: "Karl XII blir kung 1697"
  wiki:
    - "sv:Karl XII"
    - "sv:Stora nordiska kriget"
  text: |
    **[Karl XI](#karl-xi-envalde-1680-reduktionen)I** (1682–1718) blev
    kung av Sverige 1697 när fadern Karl XI dog. Han var 15 år och
    förklarades myndig redan samma år, med fullt envälde. Sverige var då
    en stormakt som ägde Finland, Baltikum (Estland, Livland) och delar av
    norra Tyskland.

    Grannarna såg en tonårskung som en chans: Danmark, Sachsen-Polen och
    Ryssland gick ihop och anföll 1700, vilket startade [stora nordiska
    kriget](#stora-nordiska-kriget) (se det). Karl visade sig vara en
    skicklig fältherre. Han vann vid Narva 1700 mot en mycket större rysk
    armé, men tillbringade sedan nästan hela sin regeringstid i fält,
    långt från Sverige.

    Han kom aldrig tillbaka till Stockholm efter 1700. Efter nederlaget
    vid [Poltava 1709](#poltava-1709) satt han fem år i Osmanska riket.
    Han dödades vid [Fredrikstens fästning i Norge
    1718](#karl-xii-dor-1718). Hans eftermäle är omstritt: hjälte för
    vissa, den som ledde Sverige till förlusten av stormaktsställningen
    för andra.

stora-nordiska-kriget:
  period: 1700
  label: "Stora nordiska kriget"
  title: "Stora nordiska kriget 1700–1721"
  wiki:
    - "sv:Stora nordiska kriget"
  text: |
    **Stora nordiska kriget** var ett krig mellan Sverige och en koalition
    av Ryssland, Danmark-Norge och Sachsen-Polen, senare även Preussen och
    Hannover. Sverige var stormakt med Finland, Baltikum och delar av
    norra Tyskland, och grannarna ville ta tillbaka land när den 18-årige
    [Karl XII](#karl-xii-1697) var ny kung.

    Karl XII vann först stort: Danmark tvingades till fred 1700, ryssarna
    slogs vid Narva samma år, och kungen i Polen avsattes. Sedan
    invaderade Karl Ryssland, men armén förlorade vid
    **[Poltava](#poltava-1709)** 1709 (se det). Därefter tog fienderna
    Baltikum, Finland och de tyska provinserna, medan Karl satt i Osmanska
    riket. Ryska flottor härjade svenska kusten 1719–1721 och brände bland
    annat Norrköping och Södertälje.

    Kriget pågick i 21 år. Sverige förlorade uppskattningsvis 200 000
    soldater – av en befolkning på knappt 2 miljoner inklusive Finland.
    Det slutade med [freden i Nystad
    1721](#nystad-1721-stormaktstiden-slut) (se den): Sveriges
    stormaktstid var slut och Ryssland blev ny stormakt i norra Europa.

poltava-1709:
  period: 1700
  label: "Poltava 1709"
  title: "Slaget vid Poltava 1709"
  wiki:
    - "sv:Slaget vid Poltava"
  text: |
    Efter segrar i Polen marscherade **[Karl XII](#karl-xii-1697)** 1708
    in i Ryssland mot Moskva. [Peter den store](#peter-den-store-1682)
    använde bränd jords taktik, och den svenska armén vek söderut mot
    Ukraina, där kosackledaren Mazepa lovat stöd. Vintern 1708–1709 var en
    av de kallaste i Europa på flera hundra år, och tusentals soldater
    frös ihjäl. En stor förstärkning med förråd hade förlorats vid
    Lesnaja.

    Den 28 juni 1709 (svensk tideräkning) angrep cirka 16 000–17 000
    svenskar en befäst rysk armé på uppskattningsvis 40 000–45 000 man vid
    staden Poltava. Karl XII var skadad i foten och bars på bår. Anfallet
    misslyckades; omkring 7 000 svenskar dödades eller sårades. Tre dagar
    senare kapitulerade resterna av armén, cirka 14 000 personer, vid
    Perevolotjna. De flesta fördes som fångar till Sibirien; bara ett par
    tusen kom hem.

    Karl XII flydde till Osmanska riket. Slaget räknas som vändpunkten när
    [Sverige förlorade sin
    stormaktsställning](#nystad-1721-stormaktstiden-slut) och Ryssland tog
    över. Det är ett av de mest kända slagen i svensk historia.

karl-xii-dor-1718:
  period: 1700
  label: "Karl XII dör 1718"
  title: "Karl XII dör 1718"
  wiki:
    - "sv:Karl XII:s död"
    - "sv:Karl XII"
  text: |
    Efter fem år i Osmanska riket kom **[Karl XII](#karl-xii-1697)**
    tillbaka 1714 – han red genom Europa till Stralsund på cirka två
    veckor. Sverige hade förlorat Baltikum och Finland men han vägrade
    sluta fred. Med hjälp av sin minister Georg Heinrich von Görtz skrev
    han ut nya skatter och gav ut nödmynt för att bygga upp en ny armé.

    1718 anföll han Norge, som tillhörde Danmark. Den 30 november 1718
    sköts han i huvudet när han inspekterade skyttegravarna vid
    belägringen av **Fredrikstens fästning** vid Halden. Han var 36 år. Om
    kulan kom från fästningen eller från en svensk mördare har diskuterats
    i 300 år; graven har öppnats flera gånger utan entydigt svar.

    Hans död avslutade enväldet. Han var ogift och barnlös; systern Ulrika
    Eleonora fick tronen bara efter att ha godkänt att riksdagen fick
    makten. Det blev starten på [frihetstiden](#frihetstiden) (se den).
    Görtz avrättades 1719. Kriget avslutades med [freden i Nystad
    1721](#nystad-1721-stormaktstiden-slut).

pest-1710:
  period: 1700
  label: "pest 1710"
  title: "Pesten i Sverige 1710–1713"
  wiki:
    - "en:Great Northern War plague outbreak"
  text: |
    Pest är en bakteriesjukdom som sprids med loppor från råttor och, i
    sin lungform, direkt mellan människor. Den hade återkommit i Europa
    sedan [digerdöden 1347–1351](#digerdoden-1348). Under [stora nordiska
    kriget](#stora-nordiska-kriget) spred den sig med trupper och
    flyktingar från Polen genom Baltikum, och kom till Stockholm 1710 med
    ett skepp från Pernau (Pärnu i Estland).

    I Stockholm dog uppskattningsvis 20 000 personer, kanske en tredjedel
    av stadens cirka 55 000 invånare. I hela Sverige och Finland dog
    uppskattningsvis 100 000 eller fler. I Köpenhamn 1711 dog omkring 20
    000, ungefär en tredjedel av befolkningen. I Baltikum var dödligheten
    ännu högre; Riga och Reval (Tallinn) förlorade stora delar av sina
    invånare.

    Det var den sista stora pestepidemin i Norden. Myndigheterna försökte
    med karantän, avspärrning och pesthus. Pesten slog samtidigt som
    kriget tömde landet på män och pengar, vilket förvärrade krisen [efter
    Poltava](#poltava-1709). Jämför pesten i Marseille 1720, den sista
    stora i Västeuropa.

nystad-1721-stormaktstiden-slut:
  period: 1720
  label: "Nystad 1721: stormaktstiden slut"
  title: "Freden i Nystad 1721"
  wiki:
    - "sv:Freden i Nystad"
    - "sv:Svenska stormaktstiden"
  text: |
    **Freden i Nystad** (Uusikaupunki i Finland) avslutade 1721 stora
    nordiska kriget mellan Sverige och Ryssland (se [Stora nordiska
    kriget](#stora-nordiska-kriget)). Kriget hade pågått i 21 år.

    Sverige avstod Livland (norra Lettland och södra Estland), Estland,
    Ingermanland (där [S:t Petersburg](#s-t-petersburg-1703) nu låg) och
    en del av Karelen med Viborg till Ryssland. Sverige fick tillbaka
    resten av Finland, som ryssarna ockuperat sedan 1714 ("stora
    ofreden"), och 2 miljoner riksdaler. Redan 1719–1720 hade Sverige gett
    upp Bremen och Verden till Hannover och delar av Pommern till
    Preussen.

    Det innebar slutet på **[stormaktstiden](#sverige-stormakt)**,
    perioden 1611–1721 då Sverige var en av Europas stormakter och
    Östersjön nästan ett svenskt innanhav. Ryssland blev i stället den
    ledande makten i norra Europa, och Peter tog titeln kejsare samma år.
    Sverige försökte ta tillbaka områdena i krig 1741–1743 och 1788–1790,
    utan framgång, och förlorade hela Finland till Ryssland 1809.

frihetstiden:
  period: 1720
  label: "frihetstiden"
  title: "Frihetstiden 1719–1772"
  wiki:
    - "sv:Frihetstiden"
    - "sv:Hattarna och mössorna"
  text: |
    **Frihetstiden** var perioden i Sverige 1719–1772, efter [Karl XII:s
    död](#karl-xii-dor-1718), då riksdagen och inte kungen hade makten.
    Med "frihet" menades frihet från enväldet. Kungarna Fredrik I och
    Adolf Fredrik var i praktiken maktlösa; när Adolf Fredrik vägrade
    skriva under fanns en namnstämpel.

    Riksdagen bestod av fyra stånd: adel, präster, borgare och bönder.
    Från 1730-talet dominerades politiken av två partier, **hattarna**
    (för krig mot Ryssland och stöd till industri) och **mössorna** (för
    fred och sparsamhet). Det var ett av Europas tidigaste partisystem,
    men korruptionen var stor och utländska makter mutade riksdagsmän.

    Perioden gav stora framsteg i vetenskap och kultur: [Carl von
    Linné](#linne-systema-naturae), Anders Celsius,
    Vetenskapsakademien 1739. Världens första
    [tryckfrihetsförordning](#tryckfrihetsforordningen-1766), med
    offentlighetsprincipen, kom 1766 – en direkt föregångare till dagens
    svenska offentlighetsprincip. Frihetstiden avslutades av [Gustav III:s
    statskupp 1772](#gustav-iii-s-statskupp-1772).

linne-systema-naturae:
  period: 1740
  label: "Linné: Systema Naturae"
  title: "Linné och Systema Naturae"
  wiki:
    - "sv:Carl von Linné"
    - "sv:Systema naturae"
  text: |
    **Carl von Linné** (1707–1778) var botaniker och läkare i Uppsala.
    1735 gav han ut *Systema Naturae*, först bara ett dussintal stora
    sidor, som delade in naturen i tre riken (djur, växter, mineral) och
    sedan i klass, ordning, släkte och art – en hierarki ungefär som ett
    filsystem eller en paketstruktur.

    Hans viktigaste bidrag var den **binära nomenklaturen**: varje art får
    ett tvådelat latinskt namn, släkte plus art, som *Homo sapiens* eller
    *Bellis perennis* (tusensköna). Tidigare hade arter långa beskrivande
    latinska fraser. Systemet slog igenom med *[Species
    Plantarum](#linne-binomiala-namn-1753)* 1753 för växter och tionde
    upplagan av Systema Naturae 1758 för djur; de åren räknas fortfarande
    som startpunkter för giltiga artnamn.

    Linné skickade ut lärjungar över hela världen för att samla arter,
    till exempel Daniel Solander som följde med [James Cook till
    Australien 1770](#cook-kartlagger-ostra-australien-1770). Hans system
    byggde på att arterna var oföränderliga och skapade av Gud; ett sekel
    senare gav [Darwins evolutionsteori
    (1859)](#darwin-och-wallace-evolution-185859) en förklaring till
    varför hierarkin ser ut som ett släktträd.

celsius-skalan-1742:
  period: 1740
  label: "Celsius-skalan 1742"
  title: "Celsiusskalan 1742"
  wiki:
    - "sv:Anders Celsius"
    - "en:Celsius"
  text: |
    **Anders Celsius** (1701–1744) var astronom vid Uppsala universitet.
    1742 föreslog han en temperaturskala med 100 grader mellan vattnets
    frys- och kokpunkt. Hans original var dock upp och ned: 100 vid
    fryspunkten och 0 vid kokpunkten. Kort efter hans död 1744 vändes
    skalan till dagens form, troligen av [Linné](#linne-systema-naturae)
    eller instrumentmakare i Uppsala.

    Det fanns redan konkurrerande skalor, framför allt tysk-holländaren
    [Fahrenheits från 1724](#fahrenheit-termometern) som fortfarande
    används i USA, och Réaumurs skala med 80 grader. Celsius fördel var
    att den var decimal och knuten till lätt reproducerbara fixpunkter,
    vilket passade det [metriska systemet](#metersystemet-1795) som
    infördes i Frankrike på 1790-talet. Kelvinskalan (1848) använder samma
    gradsteg men börjar vid absoluta nollpunkten, −273,15 °C.

    Celsius deltog också i den franska expeditionen till Tornedalen
    1736–37 som mätte jordens form och visade att den är tillplattad vid
    polerna, som [Newton](#newton-principia-1687) förutsagt. Han var med
    och lade grunden till Uppsala observatorium.

gustav-iii-s-statskupp-1772:
  period: 1760
  label: "Gustav III:s statskupp 1772"
  title: "Gustav III:s statskupp 1772"
  wiki:
    - "sv:Gustav III:s statskupp"
    - "sv:Frihetstiden"
  text: |
    Från 1719 till 1772 hade Sverige **[frihetstiden](#frihetstiden)**:
    efter [Karl XII:s död](#karl-xii-dor-1718) och stormaktens fall låg
    makten hos riksdagen och dess partier, *hattarna* och *mössorna*,
    medan kungen var nästan maktlös. Systemet gav yttrandefrihet och
    debatt men också korruption; Frankrike och Ryssland mutade öppet
    riksdagsmän för att styra svensk utrikespolitik.

    Den 19 augusti 1772 genomförde den 26-årige kungen **Gustav III** en
    oblodig statskupp i Stockholm med stöd av garnisonen. Riksdagen
    tvingades anta en ny regeringsform som gav kungen mycket av makten
    tillbaka, men ännu inte enväldet – det tog han 1789 med Förenings- och
    säkerhetsakten mitt under ett krig mot Ryssland.

    Gustav III var upplysningskung och kulturälskare: han grundade
    Kungliga Operan 1773 och Svenska Akademien 1786 och avskaffade det
    mesta av tortyren. Men adeln kände sig överkörd, och 1792 sköts han på
    en maskeradbal (se [Gustav III mördad 1792](#gustav-iii-mordad-1792)).

tryckfrihetsforordningen-1766:
  period: 1760
  label: "tryckfrihetsförordningen 1766"
  title: "Tryckfrihetsförordningen 1766"
  wiki:
    - "sv:Tryckfrihetsförordningen 1766"
    - "sv:Anders Chydenius"
  text: |
    1766 antog den svenska riksdagen världens första lag som skyddade
    tryckfriheten i grundlag. Den avskaffade förhandsgranskningen –
    censuren där en statlig censor måste godkänna allt innan det trycktes
    – för de flesta skrifter, utom teologiska. Den införde också
    **offentlighetsprincipen**: medborgare fick rätt att ta del av och
    trycka myndigheternas handlingar, till exempel riksdagens protokoll.

    Drivande var prästen och riksdagsmannen **Anders Chydenius** från
    Österbotten (i dagens Finland, då en del av Sverige), en tidig liberal
    ekonom som argumenterade för frihandel ungefär samtidigt som Adam
    Smith. Bakgrunden var partistriden mellan [hattar och
    mössor](#frihetstiden); mössorna ville granska hattarnas maktinnehav.

    Friheten blev kortlivad: Gustav III inskränkte den efter [statskuppen
    1772](#gustav-iii-s-statskupp-1772). Men principen levde kvar och
    återkom i 1810 och 1949 års tryckfrihetsförordningar, som fortfarande
    är en av Sveriges grundlagar. Jämför: USA:s yttrandefrihetstillägg kom
    1791, Frankrikes i [revolutionens deklaration
    1789](#franska-revolutionen-1789).

gustav-iii-mordad-1792:
  period: 1780
  label: "Gustav III mördad 1792"
  title: "Mordet på Gustav III 1792"
  wiki:
    - "sv:Mordet på Gustav III"
    - "sv:Gustav III"
  text: |
    **Gustav III** hade tagit tillbaka kungamakten genom [statskuppen
    1772](#gustav-iii-s-statskupp-1772) och 1789 gjort sig i praktiken
    enväldig. Det skedde mitt under hans krig mot Ryssland 1788–1790, som
    inleddes utan riksdagens tillstånd och där en grupp officerare i
    Anjalaförbundet öppet förhandlade med fienden. Adeln hatade hans
    inskränkningar i deras makt.

    Den 16 mars 1792 omringades kungen på en maskeradbal på Operan i
    Stockholm av maskerade män, och kaptenen **Jacob Johan Anckarström**
    sköt honom i ryggen med en pistol laddad med hagel och spikar. Kungen
    dog av sårinfektion nästan två veckor senare, den 29 mars. Anckarström
    piskades och halshöggs; adliga medkonspiratörer fick lindrigare
    straff.

    Mordet var en konservativ adelskonspiration, inte en revolution – men
    skedde i skuggan av [franska
    revolutionen](#franska-revolutionen-1789), som Gustav III ville
    bekämpa militärt. Han efterträddes av sonen Gustav IV Adolf, som 1809
    [förlorade Finland](#finland-till-ryssland-1809) och avsattes. Verdis
    opera *Maskeradbalen* bygger på mordet.

finland-till-ryssland-1809:
  period: 1800
  label: "Finland till Ryssland 1809"
  title: "Finland förloras till Ryssland 1809"
  wiki:
    - "sv:Finska kriget"
    - "sv:Storfurstendömet Finland"
  text: |
    Finland hade varit en del av Sverige sedan medeltiden – inte en koloni
    utan en integrerad landsdel, med representation i riksdagen. Omkring
    en tredjedel av rikets befolkning bodde där, ungefär 900 000
    människor.

    1807 slöt [Napoleon](#napoleon) och tsar Alexander I fred i Tilsit,
    och Ryssland lovade att tvinga Sverige in i blockaden mot
    Storbritannien. När kung Gustav IV Adolf vägrade gick ryska trupper in
    i Finland i februari 1808. **Finska kriget** 1808–1809 gick illa för
    Sverige; fästningen Sveaborg utanför Helsingfors kapitulerade utan
    strid. Krigets svenska hjältedåd blev senare sentimentaliserat i
    Runebergs diktsamling *Fänrik Ståls sägner*, där ”Vårt land”, Finlands
    nationalsång, ingår.

    I freden i Fredrikshamn i september 1809 avträddes hela Finland och
    Åland. Det blev ett autonomt **storfurstendöme** under tsaren, med
    egna lagar och lantdag, och Helsingfors blev huvudstad 1812. Förlusten
    ledde till att Gustav IV Adolf avsattes och till 1809 års
    regeringsform. Finland blev självständigt först 1917.

    Se även [Bernadotte](#bernadotte), som valdes till tronföljare året
    efter.

bernadotte:
  period: 1800
  label: "Bernadotte"
  title: "Jean Baptiste Bernadotte – Karl XIV Johan"
  wiki:
    - "sv:Karl XIV Johan"
    - "sv:Ätten Bernadotte"
  text: |
    **Jean Baptiste Bernadotte** (1763–1844) föddes i Pau i södra
    Frankrike som son till en advokat, tog värvning som menig soldat och
    gjorde snabb karriär under [revolutionskrigen](#revolutionskrigen).
    Napoleon gjorde honom till marskalk 1804. Han hade dessutom släktband
    till Napoleon via sin hustru Désirée Clary, Napoleons före detta
    fästmö.

    1810 behövde Sverige en ny tronföljare: kungen Karl XIII var barnlös
    och den valde tronföljaren hade dött plötsligt. Svenska officerare,
    som hoppades på Napoleons stöd för att [återta
    Finland](#finland-till-ryssland-1809), föreslog Bernadotte, som de
    hade lärt känna som vänlig mot svenska fångar 1806. Riksdagen i Örebro
    valde honom i augusti 1810. Han tog namnet Karl Johan.

    Han gjorde motsatsen till vad man väntat: han gav upp Finland och gick
    1812 i allians med Ryssland mot Napoleon, med Norge som kompensation
    ([se union Sverige–Norge 1814](#union-sverigenorge-1814)). Han blev
    [kung Karl XIV Johan](#karl-xiv-johan) 1818 och regerade till 1844.
    Huset Bernadotte sitter fortfarande på Sveriges tron, och 1814 var
    sista gången Sverige var i krig.

union-sverigenorge-1814:
  period: 1800
  label: "union Sverige–Norge 1814"
  title: "Unionen Sverige–Norge 1814"
  wiki:
    - "sv:Svensk-norska unionen"
    - "sv:Norges grundlag"
  text: |
    Norge hade varit förenat med Danmark i över 400 år. Danmark stod på
    [Napoleons sida](#napoleon), och i freden i Kiel i januari 1814
    tvingades den danske kungen avträda Norge till Sveriges kung – den
    [kompensation för Finland](#finland-till-ryssland-1809) som kronprins
    [Karl Johan (Bernadotte)](#bernadotte) förhandlat fram med Ryssland
    och Storbritannien.

    Norrmännen accepterade inte att bli överlämnade. Vid ett möte på
    **Eidsvoll** antogs den 17 maj 1814 en egen grundlag, en av tidens
    mest liberala, och den danske prinsen Christian Frederik valdes till
    kung. Karl Johan svarade med ett kort fälttåg i juli–augusti 1814. Det
    slutade med konventionen i Moss: Norge gick med på union med Sverige
    men fick behålla sin grundlag, sitt storting (parlament) och egen
    regering. Endast kungen och utrikespolitiken var gemensamma. 17 maj är
    Norges nationaldag.

    Kriget 1814 var Sveriges senaste krig. Unionen höll i 91 år men
    skavde, särskilt kring frågan om egna norska konsulat. [1905 upplöste
    Norge unionen](#unionsupplosningen-1905) fredligt – en sällsynt
    fredlig separation i europeisk historia.

karl-xiv-johan:
  period: 1820
  label: "Karl XIV Johan"
  title: "Karl XIV Johan – Sveriges franske kung"
  wiki:
    - "sv:Karl XIV Johan"
  text: |
    **Karl XIV Johan** (1763–1844), född Jean-Baptiste Bernadotte i Pau i
    Frankrike, var en av Napoleons marskalkar (högsta generaler). Efter
    att Sverige [förlorat Finland till Ryssland
    1809](#finland-till-ryssland-1809) och den valde tronföljaren dött,
    valdes han 1810 till svensk kronprins, i hopp om att han skulle hålla
    Frankrike vänligt och kanske återta Finland.

    I stället bytte han sida: Sverige anslöt sig till koalitionen mot
    Napoleon, och han ledde en av de allierade arméerna i slaget vid
    Leipzig 1813. Som ersättning för Finland tvingade han Danmark att
    avstå Norge 1814 – efter ett kort krig [gick Norge in i en union med
    Sverige](#union-sverigenorge-1814) som [varade till
    1905](#unionsupplosningen-1905). Kriget 1814 var Sveriges senaste
    krig.

    Han var kung 1818–1844 och lärde sig aldrig svenska. Hans styre var
    konservativt och ibland auktoritärt, med pressindragningar, men under
    hans tid växte befolkningen och Göta kanal blev klar 1832. Han inledde
    den svenska utrikespolitiken av neutralitet och grundade ätten
    Bernadotte, som fortfarande är Sveriges kungahus.

representationsreform-narmar-sig:
  period: 1840
  label: "Representationsreform närmar sig"
  title: "Vägen mot representationsreformen 1866"
  wiki:
    - "sv:Representationsreformen"
    - "sv:Ståndsriksdag"
  text: |
    Sverige styrdes fram till 1866 av en **ståndsriksdag** med fyra
    kammare: adeln, prästerskapet, borgarna och bönderna (de självägande).
    Systemet hade funnits sedan 1400-talet. Stora och växande grupper –
    industriarbetare, tjänstemän, torpare, akademiker utanför
    prästerskapet, de nya företagarna utanför städernas borgarskap –
    saknade helt representation.

    Under 1840- och 1850-talen växte kraven på reform bland liberaler, med
    tidningen Aftonbladet (grundad 1830) som viktigaste röst. Flera
    reformförslag föll, ofta på adelns och prästernas motstånd. Samtidigt
    moderniserades landet på andra sätt: allmän folkskola infördes 1842,
    lika arvsrätt för kvinnor och män 1845, och näringsfrihet och
    frihandel genomfördes under 1840–60-talen.

    Statsmannen **Louis De Geer** drev till slut igenom en reform, och i
    december 1865 röstade även adeln ja. Från 1866 fick Sverige en
    tvåkammarriksdag (se [tvåkammarriksdag 1866](#tvakammarriksdag-1866)).
    Jämför med Storbritannien och Frankrike, som utvidgade rösträtten 1832
    [respektive 1848](#revolution-1848).

emigration-till-amerika:
  period: 1860
  label: "Emigration till Amerika"
  title: "Den svenska och nordiska emigrationen till Amerika"
  wiki:
    - "sv:Svenskamerikaner"
    - "sv:Nödåren 1867–1869"
  text: |
    Mellan omkring 1850 och 1930 emigrerade ungefär 1,2–1,3 miljoner
    svenskar till Nordamerika, främst USA – runt en femtedel av
    befolkningen. Från Norge, i förhållande till befolkningen, emigrerade
    ännu fler. [Bara Irland](#irlandska-svalten-1845) hade större
    utvandring i Europa relativt sin storlek.

    Orsakerna: befolkningen växte snabbt tack vare bättre hälsa och mer
    mat (potatisen, freden), men jorden räckte inte till. Många var
    torpare och statare (lantarbetare som fick lön i natura). Under
    **nödåren 1867–1869** gav missväxt svält i Sverige, och den första
    stora utvandringsvågen tog fart. Samtidigt lockade USA med billig
    eller gratis jord (Homestead Act 1862), högre löner och religiös
    frihet; ångfartyg och järnvägar gjorde resan kortare och billigare.
    Ett biljettpris över Atlanten motsvarade några månadslöner för en
    dräng.

    De flesta bosatte sig i Mellanvästern, särskilt Minnesota, Illinois
    och Wisconsin. Chicago var en tid världens näst största ”svenska” stad
    efter Stockholm. Utvandringen bidrog till att Sverige reformerades –
    rösträtt, bättre arbetsvillkor – för att hålla kvar folk. Vilhelm
    Mobergs romansvit *Utvandrarna* skildrar den.

tvakammarriksdag-1866:
  period: 1860
  label: "tvåkammarriksdag 1866"
  title: "Representationsreformen 1866 – tvåkammarriksdagen"
  wiki:
    - "sv:Representationsreformen"
    - "sv:Tvåkammarriksdagen"
  text: |
    År 1866 ersattes den svenska **ståndsriksdagen**, där adel, präster,
    borgare och bönder suttit i var sin kammare sedan 1400-talet, med en
    **tvåkammarriksdag**. Reformen drevs igenom av justitieministern
    **Louis De Geer**, och avgörandet kom när adeln själv röstade för den
    i december 1865 efter fyra dagars debatt.

    **Första kammaren** valdes indirekt, av landsting och större städers
    fullmäktige, och ledamöterna måste ha hög inkomst eller förmögenhet –
    den blev en konservativ kammare för godsägare och industrimän. **Andra
    kammaren** valdes direkt, men rösträtten krävde inkomst eller egendom
    över en viss gräns. Bara omkring 20 % av de vuxna männen, ca 5–6 % av
    befolkningen, fick rösta, och inga kvinnor. Bönderna, genom
    Lantmannapartiet, dominerade andra kammaren under flera decennier.

    Reformen var en övergång från samhällsklasser till individer som grund
    för representation, men långt ifrån demokrati. Allmän rösträtt för män
    till andra kammaren kom 1909, och för kvinnor 1919/1921.
    Tvåkammarriksdagen ersattes av dagens enkammarriksdag 1971.

    Förhistorien beskrivs i [Representationsreform närmar
    sig](#representationsreform-narmar-sig).

arrhenius:
  period: 1880
  label: "Arrhenius"
  title: "Svante Arrhenius – elektrolyter och växthuseffekten"
  wiki:
    - "sv:Svante Arrhenius"
    - "sv:Växthuseffekt"
  text: |
    **Svante Arrhenius** (1859–1927) var en svensk fysiker och kemist,
    verksam i Uppsala och Stockholm. I sin doktorsavhandling 1884 föreslog
    han att salter som löses i vatten delas upp i elektriskt laddade
    partiklar, joner. Teorin fick ett svalt mottagande i Uppsala men gav
    honom senare [Nobelpriset i kemi 1903](#nobelpriset-1901) – den förste
    svenske Nobelpristagaren.

    Han är idag mest känd för en artikel från 1896 där han räknade ut hur
    jordens temperatur beror på mängden **koldioxid** i luften. Koldioxid
    släpper igenom solljus men hindrar en del av värmestrålningen från
    jorden att lämna atmosfären – växthuseffekten. Han beräknade att en
    fördubblad halt skulle höja medeltemperaturen med ca 5–6 °C; dagens
    uppskattningar ligger kring 2,5–4 °C.

    Arrhenius trodde att uppvärmningen skulle ta tusentals år och kunde
    vara positiv för kalla länder som Sverige. Utsläppen har gått mycket
    snabbare än han anade. Han var även inblandad i rasbiologiska
    institutet i Uppsala, en mörkare del av hans eftermäle.

unionsupplosningen-1905:
  period: 1900
  label: "Unionsupplösningen 1905"
  title: "Unionsupplösningen 1905"
  wiki:
    - "sv:Unionsupplösningen"
    - "sv:Svensk-norska unionen"
  text: |
    [Sedan 1814](#union-sverigenorge-1814) var Sverige och Norge förenade
    i en **personalunion**: två självständiga stater med egna parlament
    och lagar men med samma kung och gemensam utrikespolitik, som sköttes
    från Stockholm. Norge hade fått unionen påtvingad efter
    Napoleonkrigen, och norsk nationalism växte under 1800-talet.

    Den utlösande frågan var **konsulatfrågan**: Norge, med en stor
    handelsflotta, ville ha egna konsuler (handelsrepresentanter
    utomlands). När kung Oscar II vägrade godkänna lagen förklarade det
    norska Stortinget den 7 juni 1905 att unionen var upplöst. I en
    folkomröstning röstade ca 368 000 norrmän för och bara 184 emot.

    Det fanns krigsstämning, och trupper mobiliserades på båda sidor, men
    efter förhandlingar i Karlstad godtog Sverige upplösningen. Norge
    valde monarki och den danske prinsen Carl blev kung **Haakon VII**.
    Att en union kunde upplösas fredligt har ofta lyfts fram som förebild
    – jämför med [Balkans blodiga separationer](#balkankrigen) samtidigt.

nobelpriset-1901:
  period: 1900
  label: "Nobelpriset 1901"
  title: "De första Nobelprisen 1901"
  wiki:
    - "sv:Nobelpriset"
    - "sv:Alfred Nobel"
  text: |
    **Alfred Nobel** (1833–1896) var en svensk kemist och industriman som
    uppfann [dynamiten 1867](#nobel-dynamit-1867) och byggde upp ett
    internationellt imperium av ca 90 sprängämnes- och vapenfabriker.
    Enligt en berättelse publicerade en fransk tidning av misstag hans
    dödsruna 1888 med rubriken ”Dödens köpman är död”, vilket ska ha fått
    honom att tänka på sitt eftermäle.

    I sitt testamente 1895 lät han större delen av sin förmögenhet, ca 31
    miljoner kronor (motsvarar idag mer än 2 miljarder kronor), bilda en
    fond vars avkastning skulle belöna dem som gjort ”mänskligheten den
    största nytta”. Priserna gällde fysik, kemi, fysiologi eller medicin,
    litteratur och fred. Fredspriset skulle utdelas av Norge, då i union
    med Sverige.

    De första priserna delades ut den 10 december 1901, Nobels dödsdag.
    Bland pristagarna fanns [Wilhelm Röntgen](#rontgen-1895) (fysik, för
    röntgenstrålningen) och Henri Dunant, Röda korsets grundare (fred).
    Ekonomipriset tillkom 1968, instiftat av Riksbanken. Nobelpriset blev
    världens mest prestigefyllda vetenskapspris.

folkhemmet-socialdemokrati:
  period: 1920
  label: "Folkhemmet, socialdemokrati"
  title: "Folkhemmet och socialdemokratin"
  wiki:
    - "sv:Folkhemmet"
    - "sv:Saltsjöbadsavtalet"
  text: |
    ”Folkhemmet” var socialdemokraternas vision av samhället som ett gott
    hem där ingen är privilegierad eller styvbarn, lanserad av
    partiledaren **Per Albin Hansson** 1928. Han blev statsminister 1932
    och socialdemokraterna styrde Sverige sedan oavbrutet i 44 år,
    till 1976.

    Två händelser lade grunden. Kohandeln 1933 var en uppgörelse med
    Bondeförbundet: bönderna fick prisstöd, socialdemokraterna stöd för
    krispolitik med offentliga arbeten mot arbetslösheten.
    Saltsjöbadsavtalet 1938 mellan LO och arbetsgivarna fastslog att
    parterna själva skulle förhandla om löner med få strejker och utan
    statlig inblandning, ”den svenska modellen”.

    Efter kriget byggdes välfärdsstaten ut: barnbidrag, allmän pension,
    sjukförsäkring och miljonprogrammet med en miljon bostäder 1965–74.
    Liknande utveckling skedde i Norge och Danmark. Det finns också mörka
    sidor: tvångssteriliseringar av omkring 21 000 personer 1935–75.
    Jämför med [New Deal](#new-deal) i USA och
    [Folkfronten](#folkfronten-1936) i Frankrike.

neutralitet-och-permittenttrafik:
  period: 1940
  label: "Neutralitet och permittenttrafik"
  title: "Sveriges neutralitet och permittenttrafiken"
  wiki:
    - "sv:Permittenttrafiken"
    - "sv:Sverige under andra världskriget"
  text: |
    Sverige var neutralt under [andra världskriget](#andra-varldskriget),
    men neutraliteten var flexibel och anpassades efter vem som var
    starkast. Efter att [Tyskland ockuperat Norge och
    Danmark](#norge-och-danmark-ockuperas) i april 1940 var Sverige
    omringat av Tyskland och dess allierade. I juli 1940 gick regeringen
    med på permittenttrafiken: tyska soldater på permission (ledighet)
    fick resa med tåg genom Sverige mellan Norge och Tyskland.

    Fram till augusti 1943 gjordes uppskattningsvis över två miljoner
    resor av tyska militärer genom Sverige, och även krigsmateriel
    fraktades. Sommaren 1941, under ”midsommarkrisen”, fick en hel tysk
    division, Engelbrechtdivisionen, transporteras från Norge till
    Finland. Sverige exporterade också järnmalm och kullager till
    Tyskland.

    När kriget vände 1943 vände också Sverige: transiterna stoppades,
    Sverige tog emot omkring 7 000 judar som flydde från Danmark i oktober
    1943 och tränade norska och danska ”polistrupper”. Eftergifterna
    räddade troligen Sverige från krig men har sedan debatterats som
    moraliskt tveksamma. Jämför med Finland, som utkämpade
    [vinterkriget](#vinterkriget), och Norge och Danmark som ockuperades.

palme:
  period: 1960
  label: "Palme"
  title: "Olof Palme – 1960- och 70-talen"
  wiki:
    - "sv:Olof Palme"
  text: |
    **Olof Palme** (1927–1986) var socialdemokrat och kom från en
    överklassfamilj i Stockholm. Han var statsråd på 1960-talet och
    efterträdde Tage Erlander som partiledare och statsminister 1969. Han
    var statsminister 1969–76 och 1982–86.

    Internationellt blev han känd som skarp kritiker av USA:s
    [Vietnamkrig](#vietnamkriget) (se det). 1968 gick han i ett
    demonstrationståg med Nordvietnams ambassadör, och i ett tal julen
    1972 jämförde han USA:s bombningar av Hanoi med nazisternas massakrer.
    USA frös då de diplomatiska förbindelserna i över ett år. Han
    kritiserade också Sovjets invasion av Tjeckoslovakien 1968 (se
    [Pragvåren](#pragvaren-1968)), Francoregimen och
    [apartheid](#apartheid-1948).

    På hemmaplan präglades 1970-talet av kraftigt utbyggd offentlig
    sektor, särbeskattning 1971 (makar beskattas var för sig, vilket
    gjorde det lönsamt för båda att arbeta), daghemsutbyggnad, ny grundlag
    1974 där kungen förlorade all politisk makt, fri abort 1975 och nya
    arbetsrättslagar som anställningsskyddet (LAS) och
    medbestämmandelagen. 1976 förlorade han valet till Thorbjörn Fälldin,
    delvis över kärnkraften – den första icke-socialistiska regeringen på
    44 år. Palme var en polariserande gestalt: beundrad och hatad. Se
    [Palme mördas 1986](#palme-mordas-1986).

palme-mordas-1986:
  period: 1980
  label: "Palme mördas 1986"
  title: "Mordet på Olof Palme 1986"
  wiki:
    - "sv:Mordet på Olof Palme"
  text: |
    Den 28 februari 1986, strax efter klockan 23, sköts statsminister
    **Olof Palme** (se [Palme](#palme)) till döds på Sveavägen i Stockholm
    när han och hustrun Lisbet promenerade hem från bio, utan livvakter.
    Gärningsmannen flydde uppför trapporna mot Malmskillnadsgatan. Det var
    första gången sedan [Gustav III 1792](#gustav-iii-mordad-1792) som en
    svensk statschef eller regeringschef mördats.

    Polisutredningen blev en av världens största. Den kritiserades hårt
    för misstag från första natten: brottsplatsen spärrades av för snävt
    och larmet till gränser gick ut sent. Utredningen följde länge ett
    spår om den kurdiska organisationen PKK. 1988 dömdes missbrukaren
    Christer Pettersson i tingsrätten efter att Lisbet Palme pekat ut
    honom, men han friades av hovrätten 1989.

    I juni 2020 meddelade åklagaren att man ansåg att grafiska formgivaren
    Stig Engström, ”Skandiamannen” som arbetat i en byggnad nära
    brottsplatsen, var den troliga gärningsmannen. Han hade dött 2000, och
    utredningen lades ned – en slutsats som många ifrågasatt. Mordet blev
    ett trauma som förändrade bilden av Sverige som ett tryggt, öppet
    land, och efteråt skärptes skyddet av politiker. Jämför med mordet på
    utrikesminister Anna Lindh 2003.

estonia-1994:
  period: 1980
  label: "Estonia 1994"
  title: "Estoniakatastrofen 1994"
  wiki:
    - "sv:Estoniakatastrofen"
  text: |
    Natten mot den 28 september 1994 sjönk passagerarfärjan **M/S
    Estonia** i storm på väg från Tallinn till Stockholm, sydväst om Åbo
    skärgård. Av 989 personer ombord omkom 852, varav 501 svenskar. Endast
    137 överlevde. Det är den värsta fredstida fartygskatastrofen i Europa
    efter andra världskriget och Sveriges värsta katastrof i modern tid.

    Fartyget hade en bogvisir, en stor lucka i fören som fälls upp så att
    bilar kan köra in. Enligt den officiella haveriutredningen 1997 slets
    visiret loss av vågorna, rampen bakom öppnades och vatten forsade in
    på bildäcket. Ett bildäck utan skott fylls snabbt och får fartyget att
    kantra – samma risk hade färjan Herald of Free Enterprise, som kantrat
    1987 med 193 döda. Estonia sjönk på under en timme; de flesta hann
    inte ut ur hytterna.

    Vraket ligger på cirka 80 meters djup. Sverige, Estland och Finland
    beslutade att inte bärga det utan skydda det som gravplats, vilket
    väckte stark kritik från anhöriga. Konspirationsteorier om sprängning
    och militär transport har levt kvar. 2020 avslöjades ett hål i skrovet
    i en dokumentär, vilket ledde till nya undersökningar; dessa har
    hittills bekräftat att visiret var huvudorsaken. Efteråt skärptes
    säkerhetsreglerna för färjor.

    Jämför med [Titanic 1912](#titanic-1912).

eu-1995:
  period: 1980
  label: "EU 1995"
  title: "Sverige går med i EU 1995"
  wiki:
    - "en:1994 Swedish European Union membership referendum"
  text: |
    Under kalla kriget ansåg Sverige att medlemskap i EG (se [EG
    1973](#eg-1973)) inte var förenligt med neutraliteten. Sverige var i
    stället med i frihandelsorganisationen EFTA. När kalla kriget tog slut
    (se [Murens fall 1989](#murens-fall-1989)) och Sverige drabbades av en
    djup ekonomisk kris i början av 1990-talet, med bankkris, en
    arbetslöshet som steg från runt 2 till över 8 procent och räntor som
    Riksbanken en kort tid höjde till 500 procent 1992, svängde den
    politiska majoriteten. Socialdemokratiska regeringen under Ingvar
    Carlsson ansökte 1991.

    I folkomröstningen den 13 november 1994 röstade 52,3 procent ja och
    46,8 procent nej. Särskilt Norrland och kvinnor röstade nej,
    storstäderna ja. Sverige gick med den 1 januari 1995, samtidigt som
    Finland och Österrike. Norge röstade nej för andra gången (se [Olja i
    Nordsjön](#olja-i-nordsjon)).

    Medlemskapet innebar att Sverige blev en del av EU:s inre marknad och
    lagstiftning (se [EU 1993](#eu-1993)). I en ny folkomröstning 2003
    sade dock 56 procent nej till euron, så Sverige behöll kronan – till
    skillnad från Finland, som införde euron 1999. Sverige har därefter
    blivit med i [Nato 2024](#finland-2023-och-sverige-2024-i-nato),
    vilket fullbordade övergivandet av den gamla neutralitetspolitiken.

tsunamin-2004:
  period: 2000
  label: "Tsunamin 2004"
  title: "Tsunamin i Indiska oceanen 2004"
  wiki:
    - "sv:Jordbävningen i Indiska oceanen 2004"
    - "en:2004 Indian Ocean earthquake and tsunami"
  text: |
    Den 26 december 2004 inträffade en jordbävning med magnituden 9,1–9,3
    under havet utanför Sumatra i Indonesien – en av de tre kraftigaste
    som någonsin uppmätts. Havsbotten höjdes längs en cirka 1 500 km lång
    förkastning och satte enorma vattenmassor i rörelse. En **tsunami** är
    en sådan våg: på öppet hav är den bara någon meter hög men rör sig i
    jetplans hastighet, omkring 700–800 km/h, och tornar upp sig när den
    når grunt vatten nära kusten.

    Vågorna, upp till 30 meter höga, slog in mot kuster i fjorton länder,
    från Indonesien till Thailand, Sri Lanka, Indien och ända till
    Somalia. Omkring 230 000 människor dog, flest i provinsen Aceh i
    Indonesien (cirka 170 000). Det fanns inget varningssystem i Indiska
    oceanen, så många hann inte fly trots att vågen tog timmar att nå
    vissa kuster.

    För Sverige var det den värsta naturkatastrofen i modern tid: 543
    svenskar dog, de flesta på semester i Thailand – fler än i någon annan
    händelse sedan [Estoniakatastrofen 1994](#estonia-1994). Regeringens
    långsamma krishantering kritiserades hårt. Efteråt byggdes ett
    internationellt tsunamivarningssystem för Indiska oceanen.

    Jämför med [Fukushima 2011](#fukushima-2011).

spotify-2006:
  period: 2000
  label: "Spotify 2006"
  title: "Spotify"
  wiki:
    - "sv:Spotify"
  text: |
    Spotify grundades i Stockholm 2006 av Daniel Ek och Martin Lorentzon
    och lanserades 2008. Det var en strömningstjänst: i stället för att
    köpa och ladda ner låtar lyssnar man direkt via nätet på en enorm
    katalog, gratis med reklam eller mot en månadsavgift.

    Bakgrunden var piratkopieringen. Sedan Napster 1999 delade miljoner
    människor musikfiler gratis, och svenska The Pirate Bay (2003) var en
    av världens största fildelningssajter. Skivbolagens intäkter sjönk
    kraftigt. Spotifys idé var att göra laglig musik enklare än
    piratkopierad, och man förhandlade licensavtal med skivbolagen. Tidigt
    använde tjänsten peer-to-peer-teknik (där användarnas datorer delar
    data med varandra) för att leverera musiken snabbt.

    Modellen fungerade: musikindustrins intäkter började växa igen kring
    mitten av 2010-talet, och strömning dominerar nu. Spotify hade runt
    700 miljoner användare 2025. Kritiken gäller främst att artister får
    mycket lite betalt per spelning. Spotify är ett av flera svenska
    teknikföretag som byggde på [webben](#webben-berners-lee-1989),
    bredbandsutbyggnad och sedan smarttelefoner som
    [iPhone](#iphone-2007), liksom Skype och Minecraft.

finland-2023-och-sverige-2024-i-nato:
  period: 2020
  label: "Finland (2023) och Sverige (2024) i NATO"
  title: "Finland och Sverige går med i NATO"
  wiki:
    - "sv:Nato"
    - "en:Finland–NATO relations"
    - "en:Sweden–NATO relations"
  text: |
    **NATO** (Nordatlantiska fördragsorganisationen) är en militär
    försvarsallians [grundad 1949](#nato-1949) mot Sovjetunionen. Kärnan
    är artikel 5: ett väpnat angrepp mot ett medlemsland räknas som ett
    angrepp mot alla. Sverige hade varit alliansfritt sedan Napoleonkrigen
    och inte varit i krig sedan 1814. Finland hade efter förlusten mot
    Sovjetunionen i [andra världskriget](#andra-varldskriget) fört en
    försiktig neutralitetspolitik, där man undvek att utmana Moskva.

    Rysslands invasion av Ukraina i februari 2022 ändrade opinionen på
    några veckor. I Finland, som har en 1 340 km lång gräns mot Ryssland,
    steg stödet för NATO-medlemskap från omkring 25 % till över 70 %. Båda
    länderna ansökte i maj 2022. **Finland** blev medlem den 4 april 2023.
    **Sverige** fick vänta: Turkiet krävde bland annat hårdare tag mot
    kurdiska grupper som Turkiet betraktar som terrorister, och Ungern
    förhalade. Sverige blev medlem den 7 mars 2024.

    Det var den största förändringen av svensk säkerhetspolitik på 200 år.
    Östersjön är nu i praktiken omgiven av NATO-länder, med undantag för
    Rysslands kust vid S:t Petersburg och enklaven Kaliningrad. Se även
    [Rysslands invasion av Ukraina
    2022](#rysslands-invasion-av-ukraina-2022).
