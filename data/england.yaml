# England / Storbritannien
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

danegeld-till-vikingar:
  period: 1000
  label: "Danegeld till vikingar"
  title: "Danegäld – England betalar vikingarna"
  wiki:
    - "sv:Danegäld"
    - "en:Æthelred the Unready"
  text: |
    **Danegäld** var det silver som engelska kungar betalade till danska vikingahärar för att de skulle sluta plundra. Kring år 1000 regerade **Ethelred den rådville** (978–1016), en kung som gått till eftervärlden som svag och dåligt rådgiven. Vikingarna återkom nästan varje år, och i stället för att slå tillbaka köpte England fred.

    Summorna var enorma: 991 betalades 10 000 pund silver, 994 16 000, 1002 24 000 och 1012 hela 48 000 pund – uppskattningsvis tiotals ton silver. Ett pund var 240 silverpenningar. För att få fram pengarna infördes en landsomfattande skatt, ett av Europas första fungerande skattesystem.

    Varför spelar det roll för oss? Mycket av silvret hamnade i Skandinavien: fler engelska mynt från den här tiden har hittats i svenska skattfynd, särskilt på Gotland, än i England självt. Systemet visade också vikingarna att England var rikt och svagt – vilket ledde till att Sven Tveskägg och sedan [Knut den store](#knut-den-store-kung-av-england-danmark) helt enkelt tog över landet (se [1013](#sven-tveskagg-kung-1013) och 1016).

s-t-brice-massakern-pa-danskar-1002:
  period: 1000
  label: "S:t Brice-massakern på danskar 1002"
  title: "S:t Brice-massakern 1002"
  wiki:
    - "en:St. Brice's Day massacre"
    - "en:Æthelred the Unready"
  text: |
    Den 13 november 1002, på helgonet S:t Brictius dag, beordrade den engelske kungen **Ethelred den rådville** att alla danskar i England skulle dödas. Han var rädd att danska bosättare skulle göra gemensam sak med de vikingahärar som år efter år plundrade landet, och påstod att de planerade att mörda honom.

    Hur många som dog vet man inte – i praktiken drabbades nog främst danska grupper i södra England, inte hela den danska befolkningen i nordöstra England (Danelagen, området där danskar bott sedan 800-talet). I Oxford sökte danskar skydd i en kyrka som brändes ner. Arkeologer har hittat massgravar med 35–37 unga män i Oxford som kan höra till händelsen.

    Massakern blev ett politiskt misstag. Enligt senare berättelser fanns den danske kungen **Sven Tveskäggs** syster bland offren. Oavsett om det stämmer gav dådet Sven ett hämndmotiv, och han ledde de följande åren allt större anfall mot England – som slutade med att han själv blev [kung 1013](#sven-tveskagg-kung-1013).

sven-tveskagg-kung-1013:
  period: 1000
  label: "Sven Tveskägg kung 1013"
  title: "Sven Tveskägg erövrar England 1013"
  wiki:
    - "sv:Sven Tveskägg"
    - "sv:Knut den store"
  text: |
    **Sven Tveskägg** (död 1014) var kung av Danmark, son till Harald Blåtand (han som enligt Jellingestenen gjorde danskarna kristna). Sven gjorde Danmark till Nordens starkaste rike och ledde i över tio år vikingatåg mot England.

    Efter [S:t Brice-massakern 1002](#s-t-brice-massakern-pa-danskar-1002) blev anfallen allt större. 1013 kom Sven med en invasionsflotta, och den här gången erövrade han landet: norra England underkastade sig snabbt, London gav upp, och kung Ethelred flydde till Normandie. Sven utropades till kung av England på juldagen 1013 – men han dog redan i februari 1014, efter bara drygt fem veckor.

    Hans död var dock inte slutet. Hans son **Knut den store** återkom och erövrade England definitivt 1016. Under Knut blev England, Danmark och Norge ett gemensamt rike kring Nordsjön (se [Knuts Nordsjövälde](#knuts-nordsjovalde) ~1020). Det är det närmaste Skandinavien kommit att vara en stormakt i västra Europa före 1600-talets Sverige.

knut-den-store-kung-av-england-danmark:
  period: 1020
  label: "Knut den store kung av England, Danmark och Norge"
  title: "Knut den store – kung över tre riken"
  wiki:
    - "sv:Knut den store"
  text: |
    **Knut den store** (ca 995–1035) var son till danske kungen [Sven Tveskägg](#sven-tveskagg-kung-1013), som erövrade England 1013 men dog redan året därpå. Knut återvände och efter ett års hårda strider, bland annat slaget vid Assandun 1016, blev han kung över hela England 1016. Han blev kung av Danmark 1018 när hans bror dog, och erövrade Norge 1028.

    Knut styrde England förvånansvärt väl. Han gifte sig med Emma av Normandie, änka efter den engelske kungen Ethelred, behöll engelska lagar och engelska rådgivare och delade landet i fyra stora jarldömen. En sista jättelik [danegäld](#danegeld-till-vikingar) på 72 000 pund (plus 10 500 från London) togs ut 1018 för att betala av flottan, varefter England fick nästan tjugo års fred. Knut reste 1027 till Rom för kejsar [Konrad II](#konrad-ii-saliska-dynastin-1024):s kröning – ett tecken på att han räknades som en av Europas ledande kungar.

    Han förekommer i den kända legenden där han sätter sig vid stranden och befaller tidvattnet att vända, för att visa hovet att en kungs makt är begränsad. Hans [Nordsjövälde (se Norden ~1020)](#knuts-nordsjovalde) föll sönder snabbt efter hans död 1035, och 1042 fick England åter en engelsk kung.

godwin-atten-stiger:
  period: 1020
  label: "Godwin-ätten stiger"
  title: "Godwinätten stiger"
  wiki:
    - "en:Godwin, Earl of Wessex"
    - "en:House of Godwin"
  text: |
    **Godwin** (ca 1001–1053) var en engelsk adelsman av ganska enkel bakgrund som gjorde karriär under den danske kungen [Knut den store](#knut-den-store-kung-av-england-danmark). Knut gjorde honom omkring 1020 till jarl av Wessex, södra Englands rikaste del, och han gifte sig med Gytha, syster till en dansk jarl som var gift med Knuts syster. Godwin blev därmed rikets mäktigaste man efter kungen.

    Efter Knuts död 1035 var Godwin den som i praktiken avgjorde vem som skulle bli kung. Han var inblandad i att prins Alfred, Ethelreds son, blindades och dog 1036. När Alfreds bror **[Edvard Bekännaren](#edvard-bekannaren-1042)** blev kung 1042 tvingades Edvard gifta sig med Godwins dotter Edith, och Godwins söner fick egna jarldömen. Familjen ägde uppskattningsvis lika mycket jord som kungen själv.

    Det viktigaste arvet är sonen **Harald Godwinsson**, som blev kung av England i januari 1066 när Edvard dog barnlös. Han besegrade norrmännen vid Stamford Bridge i september 1066 men dog i **[slaget vid Hastings](#stamford-bridge-och-hastings-1066)** i oktober mot [Vilhelm Erövraren](#vilhelm-erovraren) från Normandie. Därmed tog den anglosaxiska och skandinaviska epoken i England slut.

edvard-bekannaren-1042:
  period: 1040
  label: "Edvard Bekännaren 1042"
  title: "Edvard Bekännaren blir kung 1042"
  wiki:
    - "sv:Edvard Bekännaren"
  text: |
    **Edvard Bekännaren** (cirka 1003–1066) var kung av England 1042–1066. Han var son till den engelske kungen Ethelred och den normandiska adelsdamen Emma. När danskarna under [Knut den store](#knut-den-store-kung-av-england-danmark) tog Englands tron (1016) växte Edvard upp i exil i Normandie, i norra Frankrike. Han återkom när den danska kungalinjen dog ut.

    Hans regering präglades av maktkampen med den mäktige jarlen **[Godwin](#godwin-atten-stiger)** och dennes söner, bland dem Harald Godwinson. Edvard var djupt religiös – därav namnet "Bekännaren" (en helgontitel för någon som levt fromt, utan att vara martyr) – och han byggde [Westminster Abbey](#westminster-abbey-paborjas).

    Varför det spelar roll: Edvard dog barnlös i januari 1066. Tre män gjorde anspråk på tronen: Harald Godwinson, Norges kung Harald Hårdråde och hertig Vilhelm av Normandie, Edvards släkting som menade att han lovats tronen. Det ledde direkt till slagen vid [Stamford Bridge och Hastings 1066](#stamford-bridge-och-hastings-1066).

westminster-abbey-paborjas:
  period: 1040
  label: "Westminster Abbey påbörjas"
  title: "Westminster Abbey påbörjas"
  wiki:
    - "sv:Westminster Abbey"
  text: |
    **Westminster Abbey** är en kyrka i London. [Edvard Bekännaren](#edvard-bekannaren-1042) lät från cirka 1045 bygga om ett benediktinkloster (ett kloster för munkar som lever enligt Benedikt av Nursias regel) på platsen, i den nya romanska stilen från kontinenten – tunga murar och rundbågar. Kyrkan invigdes i december 1065, en vecka innan Edvard dog, och han begravdes där.

    Den nuvarande gotiska kyrkan (spetsbågar, höga fönster) byggdes från 1245 på samma plats på order av Henrik III.

    Varför det spelar roll: sedan [Vilhelm Erövraren](#vilhelm-erovraren) kröntes där på juldagen 1066 har nästan alla engelska och brittiska monarker krönts i Westminster Abbey, senast Karl III 2023 – en tradition på nästan tusen år. Där ligger också över 3 000 personer begravda, bland andra Isaac Newton, Charles Darwin och Stephen Hawking. Kyrkan ligger intill parlamentet, Westminsterpalatset, som byggdes som kungapalats bredvid.

stamford-bridge-och-hastings-1066:
  period: 1060
  label: "1066: Stamford Bridge och Hastings"
  title: "1066: Stamford Bridge och Hastings"
  wiki:
    - "sv:Slaget vid Hastings"
    - "sv:Slaget vid Stamford Bridge"
  text: |
    När **[Edvard Bekännaren](#edvard-bekannaren-1042)** dog barnlös i januari 1066 kröntes jarlen **Harald Godwinson** till kung av England. Två andra gjorde anspråk: Norges kung **[Harald Hårdråde](#harald-hardrade-kung-1046)** och hertig **Vilhelm av Normandie**.

    I september landsteg Harald Hårdråde i nordöstra England med uppskattningsvis 300 skepp och kanske 10 000 man. Harald Godwinson marscherade cirka 300 km norrut på ett par dagar och överraskade norrmännen vid **Stamford Bridge** den 25 september. [Harald Hårdråde stupade](#harald-hardrade-stupar-1066); enligt krönikan behövdes bara 24 skepp för att föra hem de överlevande. Tre dagar senare landsteg Vilhelm i södra England. Den utmattade engelska armén marscherade tillbaka och mötte normanderna vid **Hastings** den 14 oktober. Arméerna var uppskattningsvis 5 000–8 000 man vardera. Efter ett heldagsslag stupade Harald Godwinson, enligt legenden av en pil i ögat.

    Varför det spelar roll: [Vilhelm kröntes på juldagen 1066](#vilhelm-erovraren). Den engelska överklassen ersattes av fransktalande normander, och engelskan fick tusentals franska ord – därför har engelskan både "cow" (bondens ord för djuret) och "beef" (herrskapets ord för köttet). Ingen har sedan dess lyckats erövra England genom invasion.

vilhelm-erovraren:
  period: 1060
  label: "Vilhelm Erövraren"
  title: "Vilhelm Erövraren"
  wiki:
    - "sv:Vilhelm Erövraren"
    - "sv:Domesday Book"
  text: |
    **Vilhelm Erövraren** (cirka 1028–1087) var hertig av Normandie från 1035 och kung av England från 1066, efter [segern vid Hastings](#stamford-bridge-och-hastings-1066). Han var oäkta son till hertig Robert och kallades i samtiden ofta "Vilhelm Bastarden".

    Erövringen var brutal. Efter uppror i norra England 1069–1070 lät han bränna byar och förstöra skördar – det så kallade *Harrying of the North* – vilket enligt samtida uppgifter ledde till att uppemot 100 000 människor dog, främst av svält. Nästan hela den anglosaxiska adeln ersattes av normandiska baroner, och de högre kyrkliga ämbetena gick till normander. Han lät bygga hundratals borgar (se [normandiska borgar](#normandiska-borgar)).

    Varför det spelar roll: 1086 lät han göra **[Domesday Book](#domesday-book-1086)**, en inventering av mark, djur och ägare i nästan hela England – en sorts medeltida databas för beskattning, unik i Europa. Den låter oss uppskatta Englands befolkning till cirka 1,5–2 miljoner. Hans ättlingar har burit Englands krona ända till i dag, och kopplingen mellan England och Frankrike ledde till århundraden av krig, bland annat [hundraårskriget](#hundraarskriget-borjar-1337).

normandiska-borgar:
  period: 1060
  label: "normandiska borgar"
  title: "Normandiska borgar"
  wiki:
    - "en:Motte-and-bailey castle"
    - "sv:Towern"
  text: |
    För att kontrollera ett land med kanske två miljoner invånare med några tusen normandiska riddare byggde [Vilhelm Erövraren](#vilhelm-erovraren) och hans baroner hundratals borgar efter 1066 – uppskattningsvis 500 eller fler inom ett par decennier.

    Den vanligaste typen var **motte-and-bailey**: en konstgjord jordkulle (motte), ofta 5–15 meter hög, med ett torn i trä på toppen, och nedanför en inhägnad gård (bailey) med palissad och vallgrav. En sådan kunde byggas på några veckor med tvångsarbete av lokalbefolkningen. Så småningom ersattes många av stenborgar. Den mest kända är **[Towern](#tower-of-london)** i London, vars stentorn White Tower påbörjades omkring 1078; en annan är Windsor Castle.

    Varför det spelar roll: borgarna var både militärbaser och symboler för den nya makten. De gjorde det nästan omöjligt för upprorsmän att ta tillbaka landet. Borgbyggandet spred sig över hela Västeuropa: medeltidens borgar var i grunden ett system som lät en liten krigarelit kontrollera en stor bondebefolkning.

domesday-book-1086:
  period: 1080
  label: "Domesday Book 1086"
  title: "Domesday Book 1086"
  wiki:
    - "sv:Domesday Book"
    - "en:Domesday Book"
  text: |
    Tjugo år efter att [normanderna erövrat England 1066](#stamford-bridge-och-hastings-1066) lät **[Vilhelm Erövraren](#vilhelm-erovraren)** genomföra en enorm inventering av landet. Kungliga utsände reste runt i nästan alla grevskap och frågade: vem äger marken, hur mycket plogmark, hur många bönder, [kvarnar](#domesday-raknar-5-600-vattenkvarnar), grisar och fiskevatten finns här – och vad var det värt 1066 jämfört med nu?

    Resultatet skrevs in på latin i **Domesday Book**, som täcker drygt 13 000 orter. Den visar att England hade uppskattningsvis 1,5–2 miljoner invånare och att ca 10 % var slavar. Den visar också hur grundligt erövringen bytt ut eliten: nästan all mark hade gått från anglosaxiska till normandiska ägare. Syftet var främst att veta vad man kunde ta ut i skatt och vem som var skyldig kungen vad.

    Namnet kommer av ”domedagen” (Domesday): precis som vid den yttersta domen gick det inte att överklaga det som stod i boken. Det var en sorts medeltida databas och saknar motsvarighet i Europa på flera hundra år. Jämför med Sverige, där de första heltäckande jordeböckerna kom på 1500-talet under Gustav Vasa. Boken finns kvar i Riksarkivet i London.

vilhelm-ii:
  period: 1080
  label: "Vilhelm II"
  title: "Vilhelm II Rufus av England"
  wiki:
    - "sv:Vilhelm II av England"
    - "en:William II of England"
  text: |
    **Vilhelm II** (kung 1087–1100) var son till [Vilhelm Erövraren](#vilhelm-erovraren), den normandiske hertig som erövrat England 1066. Han kallades *Rufus*, ”den röde”, troligen för sin rödlätta hy eller sitt hår. Hans äldre bror Robert fick Normandie, medan Vilhelm fick England.

    Han var en duglig krigare som slog ner uppror från baroner som hellre ville ha Robert som kung, och han befäste gränsen mot Skottland och Wales. Men han var illa omtyckt av kyrkan, som skrev historien: han lät biskopsposter stå tomma så att kungen kunde ta deras inkomster, och han hamnade i konflikt med ärkebiskopen **Anselm av Canterbury**, en av tidens stora teologer, som gick i exil. När Robert reste på det [första korståget 1096](#forsta-korstaget-jerusalem-intas-1099) pantsatte han Normandie till Vilhelm för 10 000 mark silver.

    Vilhelm dog 1100 när han träffades av en pil under jakt i New Forest. Om det var en olycka eller mord är omdiskuterat; hans yngre bror Henrik, som var med på jakten, red direkt till Winchester för att ta skattkammaren och kröntes tre dagar senare (se [Charter of Liberties 1100](#charter-of-liberties-1100)). Han byggde också Westminster Hall, som fortfarande står kvar i parlamentsbyggnaden.

tower-of-london:
  period: 1080
  label: "Tower of London"
  title: "Tower of London"
  wiki:
    - "sv:Towern"
    - "en:Tower of London"
  text: |
    Efter den [normandiska erövringen 1066](#stamford-bridge-och-hastings-1066) byggde **[Vilhelm Erövraren](#vilhelm-erovraren)** [borgar över hela England](#normandiska-borgar) för att hålla en fientlig befolkning i schack – ett par tusen normandiska riddare skulle kontrollera ett land med kanske 2 miljoner invånare. I London, landets största stad, började han omkring 1078 bygga ett stort torn av sten vid Themsen.

    Tornet, som kallas **White Tower**, stod färdigt omkring 1100. Det är ca 27 meter högt med upp till 4,5 meter tjocka murar, och var för sin tid en enorm byggnad som syntes över hela staden. Det var både bostad, fästning och en tydlig maktdemonstration. Stenen hämtades delvis från Caen i Normandie.

    Under följande sekler byggdes ringmurar och fler torn runt det. Tower of London har sedan fungerat som kunglig residens, statsfängelse och avrättningsplats (bl.a. för Henrik VIII:s hustru Anne Boleyn 1536), myntverk, arsenal och förvaringsplats för kronjuvelerna, som fortfarande finns där. Det är idag ett världsarv och en av Londons mest besökta platser.

henrik-i-2:
  period: 1100
  label: "Henrik I"
  same_as: henrik-i

charter-of-liberties-1100:
  period: 1100
  label: "Charter of Liberties 1100"
  title: "Henrik I:s frihetsbrev 1100"
  wiki:
    - "en:Charter of Liberties"
    - "sv:Henrik I av England"
  text: |
    När kung [Vilhelm II](#vilhelm-ii) dog i en jaktolycka i augusti 1100 (se Vilhelm II) tog hans yngre bror **Henrik I** snabbt makten, trots att den äldre brodern Robert av Normandie hade bättre anspråk. Henrik behövde stöd från baronerna (de stora godsägarna) och kyrkan.

    Vid kröningen utfärdade han därför ett **frihetsbrev** (Charter of Liberties), där han lovade att avskaffa ”orättvisa pålagor” som brodern infört: att inte tömma kyrkans inkomster när biskopsstolar stod tomma, att inte ta ut godtyckliga avgifter när en baron dog och arvingen skulle ärva, att inte tvinga änkor och döttrar att gifta sig mot betalning, och att återgå till ”[Edvard Bekännarens](#edvard-bekannaren-1042) lag” från före erövringen.

    Henrik höll inte alla löften, men själva idén – att kungen skriftligt binder sig vid regler mot sina undersåtar – blev viktig. När baronerna 1215 tvingade kung Johan att skriva under **[Magna Charta](#magna-carta-1215)** använde de frihetsbrevet från 1100 som förebild. Magna Charta ses i sin tur som en rot till idén om att även makthavare står under lagen, som återfinns i senare konstitutioner som USA:s.

white-ship-olyckan-1120:
  period: 1100
  label: "White Ship-olyckan 1120"
  title: "Vita skeppets förlisning 1120"
  wiki:
    - "en:White Ship"
    - "en:The Anarchy"
  text: |
    Den 25 november 1120 skulle kung **Henrik I** av England (son till [Vilhelm Erövraren](#vilhelm-erovraren)) segla hem från Normandie. Hans ende legitime son och arvinge, **Vilhelm Adelin**, 17 år, tog i stället ett nytt fartyg, **Vita skeppet**, tillsammans med ett stort följe av unga adelsmän. Besättningen fick vin och var berusad.

    Fartyget avgick på kvällen från Barfleur, försökte köra ikapp kungens skepp och gick på ett skär strax utanför hamnen. Omkring 300 människor dog, enligt krönikorna överlevde bara en, en slaktare från Rouen. Enligt berättelsen kom Vilhelm först iväg i en båt men vände tillbaka för att rädda sin halvsyster, och båten sjönk när alltför många klättrade ombord.

    Olyckan fick enorma politiska följder. Henrik hade ingen manlig arvinge och lät baronerna svära trohet till sin dotter **Matilda**. Men när han dog 1135 tog hans brorson **Stefan** kronan, och det följde ett inbördeskrig, ”[Anarkin](#anarkin-113554-stefan-mot-matilda)”, i nästan 20 år (1135–1153). Det slutade med att Matildas son blev kung [Henrik II 1154](#henrik-ii-1154-angevinska-riket) och grundade Plantagenet-dynastin – som genom sina franska besittningar i sin tur bäddade för [hundraårskriget](#hundraarskriget-borjar-1337) med Frankrike.

anarkin-113554-stefan-mot-matilda:
  period: 1120
  label: "Anarkin 1135–54: Stefan mot Matilda"
  title: "Anarkin i England 1135–1154"
  wiki:
    - "en:The Anarchy"
    - "en:Empress Matilda"
    - "en:Stephen, King of England"
  text: |
    Kung Henrik I av England (son till [Vilhelm Erövraren](#vilhelm-erovraren)) förlorade sin ende legitime son när skeppet *[White Ship](#white-ship-olyckan-1120)* sjönk 1120. Han lät därför stormännen svära trohet till dottern **Matilda**, änka efter den tysk-romerske kejsaren och omgift med greven av Anjou. Men när Henrik dog 1135 grep hans systerson **Stefan av Blois** kronan, eftersom många stormän inte ville ha en kvinna som härskare.

    Det blev inbördeskrig i nästan 20 år, i efterhand kallat *the Anarchy*. Ingen sida kunde vinna: Stefan tillfångatogs 1141, Matilda fick 1142 fly från en belägring i Oxford över den isbelagda Themsen, enligt berättelsen i vita kläder mot snön. Stormännen byggde egna borgar och plundrade fritt; en krönika skrev att folk sade att ”Kristus och hans helgon sov”.

    Kriget slutade med en kompromiss 1153: Stefan fick behålla kronan livet ut, men Matildas son Henrik skulle ärva. Året efter blev han kung som **Henrik II** och grundade den plantagenetska ätten, som styrde England till 1485 (se [Henrik II och det angevinska riket 1154](#henrik-ii-1154-angevinska-riket)). Kaoset förklarar varför Henrik II satsade så hårt på en stark central rättskipning (se [common law](#common-law)).

geoffrey-av-monmouth-arthur:
  period: 1120
  label: "Geoffrey av Monmouth (Arthur)"
  title: "Geoffrey av Monmouth och kung Arthur"
  wiki:
    - "en:Geoffrey of Monmouth"
    - "en:Historia Regum Britanniae"
    - "sv:Kung Arthur"
  text: |
    **Geoffrey av Monmouth** (ca 1095–1155) var en präst och lärd verksam i Oxford. Omkring 1136 skrev han på latin *Historia Regum Britanniae* (Britanniens kungars historia), en påstådd historia över Britannien från trojanen Brutus fram till 600-talet.

    Boken är till största delen påhittad, men den blev en medeltida bästsäljare: över 200 handskrivna exemplar finns bevarade, ett mycket högt antal före boktryckarkonsten. Det var Geoffrey som gjorde **kung Arthur** – tidigare en vag gestalt i walesiska sägner – till en stor kung som erövrar halva Europa, med trollkarlen Merlin, drottning Guinevere och svärdet Caliburn (senare Excalibur). Även kung Lear, som Shakespeare senare använde, har sitt ursprung här.

    Andra byggde vidare: den franske poeten Chrétien de Troyes lade på 1170–80-talet till Lancelot och sökandet efter den heliga Graal, och Thomas Malorys *Le Morte d’Arthur* (tryckt 1485) samlade allt. Arthurlegenden lever i dag genom romaner, filmer och spel. För de normandiska och [plantagenetska kungarna](#henrik-ii-1154-angevinska-riket) var berättelsen också användbar: den gav Britannien en ärorik förhistoria oberoende av anglosaxarna de själva besegrat.

henrik-ii-1154-angevinska-riket:
  period: 1140
  label: "Henrik II 1154: Angevinska riket"
  title: "Henrik II och det angevinska riket 1154"
  wiki:
    - "sv:Henrik II av England"
    - "en:Angevin Empire"
  text: |
    **Henrik II** (1133–1189) var son till Matilda (se [Anarkin](#anarkin-113554-stefan-mot-matilda)) och greve Geoffrey av Anjou. Han ärvde Anjou och Normandie från sina föräldrar, fick Akvitanien när han [gifte sig med Eleonora av Akvitanien 1152](#eleonora-gifter-om-sig-med-henrik-ii), och blev kung av England 1154 vid 21 års ålder. Han var den förste kungen av ätten **Plantagenet**, som styrde England till 1485.

    Hans välde kallas i efterhand det **angevinska riket** (efter Anjou). Det sträckte sig från skotska gränsen till Pyrenéerna – Henrik kontrollerade mer av Frankrike än den franske kungen själv, fast han formellt var dennes vasall för de franska områdena. Det var ingen enhetlig stat utan en samling länder med olika lagar, som Henrik höll ihop genom att ständigt resa runt.

    I England byggde Henrik upp en stark central rättskipning med resande domare (se [common law](#common-law)), och hans konflikt med ärkebiskopen Thomas Becket slutade med [mordet 1170](#thomas-becket-mordas-1170). Hans sista år präglades av uppror från sina egna söner, bland dem Rikard Lejonhjärta och Johan utan land. Under Johan förlorades Normandie 1204, och konflikten om de franska länderna fortsatte till hundraåriga krigets slut 1453.

common-law:
  period: 1140
  label: "common law"
  title: "Common law – engelsk sedvanerätt"
  wiki:
    - "sv:Common law"
    - "en:Assize of Clarendon"
  text: |
    **Common law** (”gemensam rätt”) är det rättssystem som används i England och de länder som ärvt det: USA, Kanada, Australien, Indien med flera. Det växte fram under **[Henrik II](#henrik-ii-1154-angevinska-riket)** (kung 1154–89), som efter inbördeskriget (se [Anarkin](#anarkin-113554-stefan-mot-matilda)) ville ta tillbaka rättskipningen från de lokala stormännen.

    Henrik skickade ut kungliga domare som reste runt i landet och dömde efter samma principer överallt – därav ”gemensam” för hela riket, i stället för lokal sedvänja. Med Clarendon-assisen 1166 infördes en föregångare till juryn: grupper om tolv män från orten skulle anmäla misstänkta brott. Vem som helst kunde mot en avgift köpa en standardiserad skrivelse (*writ*) för att få sin sak prövad i kungens domstol, vilket var attraktivt och ökade kungens inkomster.

    Det särskiljande med common law är att lagen till stor del byggs upp av tidigare domar (prejudikat) snarare än av en skriven lagbok. Jämför med Sverige och övriga kontinentaleuropa, där rätten bygger på kodifierade lagar med rötter i romersk rätt (s.k. civilrätt). Skillnaden märks ännu i dag – till exempel i hur amerikanska avtal och mjukvarulicenser är skrivna, och i juryns roll i amerikanska rättegångar.

thomas-becket-mordas-1170:
  period: 1160
  label: "Thomas Becket mördas 1170"
  title: "Mordet på Thomas Becket 1170"
  wiki:
    - "sv:Thomas Becket"
    - "sv:Henrik II av England"
  text: |
    **Thomas Becket** (ca 1120–1170) var son till en London-köpman och blev kung **[Henrik II](#henrik-ii-1154-angevinska-riket)**:s kansler och nära vän. 1162 gjorde Henrik honom till ärkebiskop av Canterbury, Englands högsta kyrkoämbete, i tron att han då skulle få kyrkan under kontroll. Men Becket bytte sida och försvarade kyrkans rättigheter mot kungen.

    Huvudfrågan var om präster som begått brott skulle dömas av kungens domstolar eller bara av kyrkans, som var mildare (de kunde inte döma till döden). Prästerskapet var stort – alla som kunde läsa räknades in. Konflikten tvingade Becket i exil i Frankrike i sex år. När han kom tillbaka 1170 och bannlyste biskopar som stött kungen ska Henrik ha utbrustit något i stil med: ”Vill ingen befria mig från denne besvärlige präst?” Fyra riddare tog det som en order och dödade Becket i Canterbury-katedralen den 29 december 1170.

    Mordet chockade Europa. Becket helgonförklarades redan 1173, och Henrik gjorde offentlig botgöring vid graven och fick backa i flera frågor. Canterbury blev en av Europas största pilgrimsorter, som skildras i [Chaucers](#chaucer) *Canterbury-berättelser* (1300-talets slut). Jämför med [investiturstriden](#investiturstriden-borjar) (se [Konkordatet i Worms](#konkordatet-i-worms-1122)) – samma grundkonflikt om kyrkans makt gentemot kungens.

invasion-av-irland-1169:
  period: 1160
  label: "invasion av Irland 1169"
  title: "Den normandiska invasionen av Irland 1169"
  wiki:
    - "en:Anglo-Norman invasion of Ireland"
    - "en:Richard de Clare, 2nd Earl of Pembroke"
  text: |
    Irland bestod på 1100-talet av ett antal kungariken som ofta krigade med varandra, med en ”högkung” som hade begränsad makt. 1166 fördrevs **Diarmait Mac Murchada**, kung av Leinster i sydöstra Irland, av sina rivaler. Han reste till England och bad [Henrik II](#henrik-ii-1154-angevinska-riket) om hjälp.

    Henrik lät sina vasaller hjälpa till. 1169 landsteg en liten styrka normandiska och walesiska riddare och bågskyttar, några hundra man, i Wexford. Året efter kom **Richard de Clare**, kallad *Strongbow*, med omkring 1 000 man, tog Waterford och Dublin och gifte sig med Diarmaits dotter. Med pansar, borgar och långbågar var de överlägsna de irländska styrkorna.

    Henrik blev orolig för att Strongbow skulle bli kung i eget namn och kom själv 1171 med en stor armé – uppskattningsvis 4 000 man – och tog emot de irländska kungarnas underkastelse. Han åberopade ett påvebrev (se [Nidaros](#nidaros-eget-arkesate-1153) och Hadrianus IV). Det blev början på över 750 år av engelskt herravälde över Irland, fram till Irländska fristatens bildande 1922 – och Nordirland ingår fortfarande i Storbritannien.

rikard-lejonhjarta:
  period: 1180
  label: "Rikard Lejonhjärta"
  title: "Rikard Lejonhjärta"
  wiki:
    - "sv:Rikard I av England"
    - "en:Richard I of England"
  text: |
    **Rikard I** (1157–1199), kallad Lejonhjärta, var kung av England 1189–1199. Han tillhörde huset Plantagenet, som genom arv och giftermål också styrde stora delar av västra Frankrike – det så kallade angevinska riket, från Skottlands gräns till Pyrenéerna. Han talade franska och tillbringade bara omkring sex månader av sin regeringstid i England.

    Han förknippas med tre saker: [tredje korståget (1189–92)](#tredje-korstaget-118992), där han var den främste militären mot Saladin; att han blev [tillfångatagen i Österrike](#fangen-i-osterrike) på hemvägen och löstes ut mot en enorm lösensumma; och kriget mot den franske kungen Filip II August om de franska besittningarna, där han dog av ett armborstskott 1199.

    Eftervärlden har gjort honom till riddaridealet, bland annat i Robin Hood-legenderna. Men hans krig och lösensumman tömde England, vilket bidrog till de skattekonflikter som hans bror och efterträdare [Johan utan land](#johan-utan-land-forlorar-normandie-1204) fick ta – och som ledde till [Magna Carta 1215](#magna-carta-1215).

tredje-korstaget:
  period: 1180
  label: "tredje korståget"
  title: "Englands roll i tredje korståget"
  wiki:
    - "sv:Tredje korståget"
    - "en:Third Crusade"
  text: |
    Ett *korståg* var ett krig som påven förklarade heligt; den som deltog lovades syndaförlåtelse. Det tredje korståget (1189–92) startades efter att sultanen Saladin 1187 tagit Jerusalem från de kristna korsfararstaterna. Kungarna av England och Frankrike och den tysk-romerske kejsaren gav sig iväg.

    För England betalades det med **Saladinskatten** (1188), en skatt på en tiondel av inkomster och lösöre – en tidig allmän skatt. [Rikard Lejonhjärta](#rikard-lejonhjarta) seglade med en flotta på omkring 100 skepp, erövrade Cypern på vägen och tog hamnstaden Akko 1191 efter en lång belägring. Där lät han avrätta cirka 2 700 muslimska fångar.

    Han vann vid Arsuf 1191 men vågade aldrig anfalla Jerusalem; han bedömde att staden inte gick att hålla. Freden 1192 lät de kristna behålla en kustremsa och gav pilgrimer tillträde till Jerusalem. Se även [Tredje korståget 1189–92](#tredje-korstaget-118992) och [Saladin vid Hattin](#saladin-vinner-vid-hattin-1187-tar).

fangen-i-osterrike:
  period: 1180
  label: "fången i Österrike"
  title: "Rikard Lejonhjärta tillfångatas"
  wiki:
    - "en:Richard I of England"
    - "en:Leopold V, Duke of Austria"
  text: |
    På hemvägen från [tredje korståget](#tredje-korstaget-118992) 1192 led [Rikard Lejonhjärta](#rikard-lejonhjarta) skeppsbrott i Adriatiska havet och försökte ta sig landvägen förklädd genom Europa. Nära Wien tillfångatogs han av hertig **Leopold V av Österrike**, som han hade förolämpat under belägringen av Akko, bland annat genom att låta kasta ned Leopolds fana.

    Leopold lämnade över honom till den tysk-romerske kejsaren Henrik VI, som höll honom fången i över ett år. Lösensumman blev 150 000 mark silver, ungefär 34 ton silver – uppskattningsvis två till tre gånger den engelska kronans årsinkomster. Den samlades in genom en skatt på en fjärdedel av allt lösöre, och kyrkornas silver smältes ned.

    Rikard släpptes 1194. Pengarna hjälpte Henrik VI att erövra Sicilien (se ”[Henrik VI får Sicilien](#henrik-vi-far-sicilien)”), och Leopold använde sin del till att bygga stadsmurarna i Wien. Påven bannlyste Leopold för att ha fängslat en korsfarare.

johan-utan-land-forlorar-normandie-1204:
  period: 1200
  label: "Johan utan land förlorar Normandie 1204"
  title: "Johan utan land förlorar Normandie 1204"
  wiki:
    - "sv:Johan utan land"
    - "en:John, King of England"
  text: |
    **Johan** (1166–1216) var [Rikard Lejonhjärtas yngre bror](#rikard-lejonhjarta) och kung av England 1199–1216. Smeknamnet ”utan land” fick han som barn, eftersom han som yngste son inte ärvde några landområden. Han räknas som en av Englands sämsta kungar och förknippas med tre saker: förlusten av Normandie, konflikten med påven och Magna Carta.

    **Normandie** hade hört ihop med England sedan Vilhelm Erövraren 1066. Den franske kungen **[Filip II August](#filip-ii-august-starker-kungamakten)** utnyttjade en tvist om Johans giftermål för att döma honom förlustig sina franska län. 1204 föll fästningen Château-Gaillard efter en månadslång belägring, och sedan Rouen. Även Anjou och Maine gick förlorade.

    Förlusten betydde att den engelska adeln, som tidigare ägt mark på båda sidor om Engelska kanalen, blev mer ”engelsk”. Johans försök att återta landet krävde höga skatter, och när det misslyckades vid [Bouvines 1214](#bouvines-1214) gjorde baronerna uppror, vilket ledde till [Magna Carta 1215](#magna-carta-1215).

magna-carta-1215:
  period: 1200
  label: "Magna Carta 1215"
  title: "Magna Carta 1215"
  wiki:
    - "sv:Magna Carta"
    - "en:Magna Carta"
  text: |
    **Magna Carta** (latin för ”det stora brevet”) är ett dokument som [kung Johan utan land](#johan-utan-land-forlorar-normandie-1204) tvingades godkänna vid Runnymede vid Themsen den 15 juni 1215. Bakgrunden var att engelska baroner – den högre adeln – gjort uppror efter Johans misslyckade krig i Frankrike och höga godtyckliga skatter. Det hade 63 paragrafer, de flesta om konkreta tvister: arv, skulder, skogsrätt.

    Några principer blev med tiden viktiga: att kungen inte får ta ut extra skatt utan rådets samtycke, och att ingen fri man får fängslas eller berövas egendom ”utom genom laglig dom av hans likar eller enligt landets lag”. Kärnan är idén att även kungen står under lagen.

    På kort sikt misslyckades det: påven ogiltigförklarade det redan efter tio veckor, och inbördeskrig följde. Men det återutfärdades 1216, 1217 och [1225](#magna-carta-aterutfardas-1225) (se detta). Senare åberopades det mot kungamakten i 1600-talets England och av de amerikanska revolutionärerna; det har påverkat USA:s konstitution. Fyra originalexemplar från 1215 finns kvar.

henrik-iii-2:
  period: 1220
  label: "Henrik III"
  same_as: henrik-iii

magna-carta-aterutfardas-1225:
  period: 1220
  label: "Magna Carta återutfärdas 1225"
  title: "Magna Carta återutfärdas 1225"
  wiki:
    - "en:Magna Carta"
    - "sv:Henrik III av England"
  text: |
    Den ursprungliga [Magna Carta från 1215](#magna-carta-1215) (se denna), som tvingades på [kung Johan](#johan-utan-land-forlorar-normandie-1204) av upproriska baroner, ogiltigförklarades av påven redan efter tio veckor. Johan dog 1216, och hans son **Henrik III** blev kung som nioåring. Hans förmyndare utfärdade en förkortad version 1216 och igen 1217 för att vinna adelns stöd.

    1225 utfärdade Henrik III, nu personligen, en ny version i utbyte mot att adel och kyrka beviljade en extra skatt – en femtondel av allt lösöre. Den hade 37 paragrafer, mot originalets 63. Det var den här versionen, inte den från 1215, som blev en del av engelsk lag och som domstolarna åberopade i århundraden.

    Mönstret – kungen bekräftar rättigheter i utbyte mot skatt – blev grunden för det engelska parlamentets makt. Parlamentet (från franskans parler, att tala) med representanter för städerna [samlades första gången 1265](#simon-de-montfort-parlament-1265). Tre av paragraferna gäller fortfarande som brittisk lag.

provisions-of-oxford-1258-baroner:
  period: 1240
  label: "Provisions of Oxford 1258: baroner begränsar kungen"
  title: "Provisions of Oxford 1258"
  wiki:
    - "en:Provisions of Oxford"
    - "sv:Henrik III av England"
  text: |
    Englands kung **Henrik III** (regerade 1216–1272) var son till Johan utan land, kungen som 1215 tvingats skriva under *[Magna Carta](#magna-carta-1215)* – ett dokument som band kungen vid lagen. Henrik var from och konstintresserad (han byggde om Westminster Abbey) men misslyckades i krig, spenderade stort och gynnade släktingar från Frankrike. 1258 ville han ha pengar för ett äventyr på Sicilien, samtidigt som en missväxt gav svält.

    Baronerna – de högadliga storgodsägarna som höll land direkt av kungen – kom beväpnade till ett möte i Oxford och tvingade honom att godkänna **Provisions of Oxford** (”Oxfordbestämmelserna”). Ett råd på 15 personer skulle övervaka regeringen och utse de högsta ämbetsmännen, och ett *parlament* (från franska *parler*, tala – ett rådsmöte) skulle hållas tre gånger om året.

    Det var ett radikalt försök att låta ett råd styra över kungen, och dokumentet utfärdades även på engelska, ovanligt för tiden. Henrik fick påven att ogiltigförklara det 1261, vilket ledde till inbördeskrig (se ”[Simon de Montfort: parlament 1265](#simon-de-montfort-parlament-1265)”). Idén att kungen behövde samtycke och kontroll levde vidare och är ett steg på den långa vägen till parlamentarism.

simon-de-montfort-parlament-1265:
  period: 1260
  label: "Simon de Montfort: parlament 1265"
  title: "Simon de Montforts parlament 1265"
  wiki:
    - "sv:Simon de Montfort"
    - "en:Simon de Montfort's Parliament"
    - "en:Second Barons' War"
  text: |
    **Simon de Montfort** (ca 1208–1265) var en fransktfödd adelsman som blivit earl av Leicester och gift sig med kung Henrik III:s syster. Han blev ledare för baronerna som 1258 tvingat kungen att acceptera Provisions of Oxford ([se den](#provisions-of-oxford-1258-baroner)). När Henrik bröt mot avtalet utbröt inbördeskrig, det s.k. andra baronkriget.

    I slaget vid **Lewes** i maj 1264 tog Simon kungen och tronföljaren Edvard till fånga och styrde därefter England i kungens namn. I januari 1265 kallade han till ett *parlament* där inte bara baroner och biskopar deltog utan också två riddare från varje grevskap och två borgare från ett antal städer. Det var första gången representanter för städerna kallades – en tidig form av det som blev *underhuset* (House of Commons), den folkvalda kammaren i dagens brittiska parlament.

    Motivet var praktiskt: Simon behövde stöd utanför högadeln. Men framgången varade kort. Edvard rymde, samlade en armé och dödade Simon i slaget vid **Evesham** i augusti 1265; kroppen styckades. Ändå tog Edvard, som kung Edvard I, själv upp idén att kalla riddare och borgare till parlamentet, eftersom det var ett effektivt sätt att få skatter beviljade (se ”[Edvard I 1272](#edvard-i-1272)”).

edvard-i-1272:
  period: 1260
  label: "Edvard I 1272"
  title: "Edvard I av England (1272–1307)"
  wiki:
    - "sv:Edvard I av England"
    - "en:Edict of Expulsion"
  text: |
    **Edvard I** (1239–1307), kallad ”Longshanks” (långben – han var ovanligt lång, uppskattningsvis ca 188 cm), blev kung 1272 medan han var på väg hem från korståg. Han hade som ung besegrat Simon de Montfort (se ”[Simon de Montfort: parlament 1265](#simon-de-montfort-parlament-1265)”) och var en hård, kompetent krigare och administratör.

    Han förknippas med tre saker. **Erövringen av Wales** 1277–83, säkrad av en ring av väldiga stenborgar (se ”[Edvard I erövrar Wales 1283](#edvard-i-erovrar-wales-1283)”). **Krigen mot Skottland** från 1296: han tog den skotska kröningsstenen till London och avrättade upprorsledaren [William Wallace](#wallace-stirling-bridge-1297) 1305, vilket gav honom tillnamnet ”Skottarnas hammare”, men Skottland lyckades frigöra sig under Robert Bruce ([slaget vid Bannockburn 1314](#bannockburn-1314-skotsk-seger)). Och **lagstiftning och parlament**: han utfärdade många lagar om egendom och rättsskipning, och hans ”Modellparlament” 1295 samlade adel, präster, riddare och borgare – en förebild för senare parlament.

    En mörk sida: 1290 utvisade Edvard alla judar ur England, uppskattningsvis 2 000–3 000 personer, efter år av hårda skatter på dem. Det var den första landsomfattande utvisningen av judar i medeltida Europa; Frankrike följde 1306 och Spanien 1492. Judar fick återvända till England först 1656.

edvard-i-erovrar-wales-1283:
  period: 1280
  label: "Edvard I erövrar Wales 1283"
  title: "Edvard I erövrar Wales 1283"
  wiki:
    - "en:Conquest of Wales by Edward I"
    - "en:Llywelyn ap Gruffudd"
    - "en:Castles and Town Walls of King Edward in Gwynedd"
  text: |
    **Wales** hade sedan romartiden varit keltiskt, med eget språk (walesiska) och egna lagar, uppdelat i flera furstendömen. Sedan 1066 hade normandiska herrar från England tagit stora delar av södra och östra Wales, men i norr, kring bergsområdet Snowdonia, höll furstendömet **Gwynedd** ut. Dess furste **Llywelyn ap Gruffudd** erkändes 1267 som ”prins av Wales” av den engelske kungen.

    Edvard I (se ”[Edvard I 1272](#edvard-i-1272)”) och Llywelyn hamnade i konflikt om trohet och tribut. Edvard angrep 1277 och igen 1282–83 med en stor armé, uppskattningsvis 15 000 man, och en flotta som skar av Gwynedds spannmålsförsörjning från ön Anglesey. Llywelyn dödades i strid i december 1282 och hans bror Dafydd avrättades 1283 genom hängning, släpning och fyrdelning – ett av de första kända fallen av det straffet för förräderi i England.

    För att hålla landet byggde Edvard en ring av stenborgar: **Conwy, Caernarfon, Harlech och Beaumaris**, idag världsarv. De ritades av byggmästaren James of St George och kostade enorma summor – uppskattningsvis motsvarande flera års kungliga inkomster. Wales fick engelsk förvaltning genom Rhuddlanstadgan 1284. 1301 fick Edvards son titeln ”prins av Wales” – sedan dess titeln för den brittiske tronarvingen.

wallace-stirling-bridge-1297:
  period: 1280
  label: "Wallace, Stirling Bridge 1297"
  title: "William Wallace och slaget vid Stirling Bridge 1297"
  wiki:
    - "sv:William Wallace"
    - "sv:Slaget vid Stirling Bridge"
  text: |
    År 1296 invaderade den engelske kungen **[Edvard I](#edvard-i-1272)** Skottland, avsatte den skotske kungen och tog med sig kröningsstenen till London. Skottland skulle styras som ett lydland. Motståndet leddes bland annat av **William Wallace**, en lågadlig skotte som snabbt blev ledare för ett folkligt uppror.

    Vid **Stirling Bridge** i september 1297 lät Wallace och Andrew Moray en engelsk armé (uppskattningsvis 8 000–10 000 man) börja gå över en smal träbro där bara två ryttare fick plats i bredd. När ungefär halva hären kommit över anföll skottarna och högg ned den, medan resten stod maktlös på andra sidan floden. Det var en chock: fotfolk med spjut hade besegrat tungt rytteri.

    Segern varade inte. 1298 besegrades Wallace vid Falkirk av engelska långbågsskyttar, och 1305 avrättades han i London. Men kampen fortsatte under Robert Bruce och avgjordes vid Bannockburn 1314 ([se det](#bannockburn-1314-skotsk-seger)). Wallace blev en nationalsymbol – i modern tid känd genom filmen *Braveheart* (1995), som är historiskt mycket fri.

bannockburn-1314-skotsk-seger:
  period: 1300
  label: "Bannockburn 1314: skotsk seger"
  title: "Slaget vid Bannockburn 1314"
  wiki:
    - "sv:Slaget vid Bannockburn"
    - "en:Battle of Bannockburn"
  text: |
    Efter [William Wallaces död 1305](#wallace-stirling-bridge-1297) tog **Robert Bruce**, en skotsk adelsman, ledningen för det skotska motståndet och kröntes till kung 1306. Han förde ett gerillakrig och tog en efter en tillbaka de borgar som engelsmännen höll. När Stirling Castle var nära att ge upp marscherade den engelske kungen **Edvard II** norrut för att undsätta den.

    Vid **Bannockburn** i juni 1314 möttes en engelsk här på uppskattningsvis 15 000–20 000 man och en skotsk på kanske 6 000–8 000. Skottarna stod i täta formationer av spjutbärare (*schiltrons*) och hade grävt gropar för att stoppa rytteriet. Den engelska armén fastnade i sankmark och trängdes ihop; rytteriet kunde inte manövrera och långbågsskyttarna kom inte till. Det blev en förkrossande engelsk förlust.

    Bannockburn säkrade Skottlands självständighet i praktiken. I *Arbroath-deklarationen* 1320 skrev skotska adelsmän till påven att de aldrig skulle underkasta sig England. England erkände Skottland 1328. Riket förblev självständigt tills det fick samma kung som England 1603 och [gick upp i Storbritannien 1707](#storbritannien-bildas-1707). Slaget nämns i den inofficiella nationalsången *Flower of Scotland*.

edvard-ii:
  period: 1300
  label: "Edvard II"
  title: "Edvard II av England (kung 1307–1327)"
  wiki:
    - "sv:Edvard II av England"
    - "en:Edward II of England"
  text: |
    **Edvard II** var son till den krigiske och respekterade Edvard I. Han blev kung 1307 men saknade faderns förmåga. Han är känd för tre saker: förlusten vid Bannockburn 1314 ([se det](#bannockburn-1314-skotsk-seger)), att han förlitade sig helt på personliga favoriter, och sitt våldsamma slut.

    Favoriterna – först **Piers Gaveston** och senare familjen Despenser – fick stora gåvor och makt, vilket retade de engelska baronerna (de mäktigaste adelsmännen). Gaveston dödades av baronerna 1312. Kungen och baronerna låg i konflikt, ibland öppet krig, under stora delar av hans styre, samtidigt som den stora svälten 1315–17 drabbade landet ([se det](#stora-svalten-131517)).

    1326 vände hans egen drottning **Isabella**, dotter till [Filip IV av Frankrike](#filip-iv-den-skone), sig mot honom. Hon invaderade från Frankrike tillsammans med sin älskare Roger Mortimer. Edvard tvingades abdikera 1327 till förmån för sin 14-årige son [Edvard III](#edvard-iii-1327) – första gången en engelsk kung avsattes – och dog i fångenskap samma år, troligen mördad. Det visade att adeln och parlamentet i praktiken kunde avsätta en kung. Marlowes pjäs *Edward II* (1590-talet) handlar om honom.

edvard-iii-1327:
  period: 1320
  label: "Edvard III 1327"
  title: "Edvard III blir kung 1327"
  wiki:
    - "sv:Edvard III av England"
    - "en:Edward III of England"
  text: |
    **Edvard III** blev kung av England 1327, 14 år gammal, efter att hans far Edvard II avsatts av hans mor Isabella och hennes älskare Roger Mortimer ([se Edvard II](#edvard-ii)). De två styrde i hans namn. 1330, som 17-åring, gjorde Edvard en kupp: Mortimer greps och avrättades och Isabella förvisades till ett slott.

    Edvard styrde i 50 år, till 1377, och blev en av Englands mest kända kungar. Han är förknippad med tre saker. Han startade **hundraårskriget** 1337 genom att göra anspråk på Frankrikes tron via sin mor ([se det](#hundraarskriget-borjar-1337)), och vann stora segrar vid [Crécy 1346](#crecy-1346) och [Poitiers 1356](#poitiers-1356). Han grundade riddarorden **Strumpebandsorden** omkring 1348, som fortfarande är Englands främsta orden. Och under hans tid kom [digerdöden 1348](#digerdoden-1348).

    Under hans styre stärktes parlamentet, eftersom kungen behövde dess godkännande för skatter till krigen. Parlamentet delades i ett överhus för adel och biskopar och ett underhus för representanter från grevskap och städer – samma struktur som idag. Engelska började också ersätta franska som språk i domstolar [(1362)](#engelska-blir-rattssprak-1362). Hans sista år präglades av förluster i Frankrike och skandaler vid hovet.

hundraarskriget-borjar-1337:
  period: 1320
  label: "hundraårskriget börjar 1337"
  title: "Hundraårskriget börjar 1337"
  wiki:
    - "sv:Hundraårskriget"
    - "en:Hundred Years' War"
  text: |
    **Hundraårskriget** var en serie krig mellan England och Frankrike 1337–1453 – alltså 116 år, med långa pauser. Det fanns två grundorsaker. Den engelske kungen ägde sedan 1100-talet stora områden i sydvästra Frankrike (Gascogne, med vinhandeln i Bordeaux) och var därför formellt vasall till den franske kungen, vilket ledde till ständiga konflikter. Och när den franska kungaätten dog ut på svärdssidan 1328 hade Edvard III, via sin mor, ett anspråk på Frankrikes tron, men fransmännen valde i stället en kusin, Filip VI av Valois ([se Valois 1328](#valois-1328)).

    1337 konfiskerade Filip Gascogne, och Edvard svarade med att utropa sig till kung av Frankrike. Frankrike var mycket större – uppskattningsvis 15–20 miljoner invånare mot Englands 4–5 miljoner – men England vann de stora slagen tack vare **långbågen**, en båge som kunde skjuta tio pilar i minuten upp till 200–300 meter.

    Kriget fördes mest som plundringståg i Frankrike. Det slutade med att England förlorade allt utom Calais. Det gav båda länderna en starkare nationell identitet, stående arméer och skatter – och [Jeanne d'Arc (1429)](#jeanne-d-arc-befriar-orleans-1429-branns). Engelska kungar kallade sig formellt kung av Frankrike ända till 1801.

crecy-1346:
  period: 1340
  label: "Crécy 1346"
  title: "Slaget vid Crécy 1346"
  wiki:
    - "sv:Slaget vid Crécy"
    - "en:Battle of Crécy"
  text: |
    Slaget vid **Crécy** i norra Frankrike 26 augusti 1346 var det första stora slaget i hundraårskriget ([se det](#hundraarskriget)). Edvard III hade landstigit i Normandie med uppskattningsvis 12 000–15 000 man och plundrat sig fram genom landet. Den franske kungen Filip VI förföljde honom med en här som var minst dubbelt så stor, kanske 25 000–30 000.

    Engelsmännen ställde upp på en sluttning, med riddarna avsuttna till fots och tusentals bågskyttar med **långbågen**, en walesisk-engelsk båge på nästan 2 meter som en tränad skytt kunde avfyra 10–12 gånger i minuten med pilar som nådde 200–300 meter. De franska genuesiska armborstskyttarna, som sköt kanske 2 skott i minuten, sköts sönder. Därefter anföll det franska rytteriet uppför backen i upprepade vågor och slogs ned. Fransmännen förlorade uppskattningsvis flera tusen man, däribland stora delar av adeln; engelsmännens förluster var små.

    Crécy visade att disciplinerat fotfolk med avståndsvapen kunde krossa tungt rytteri – riddarnas tidsålder var på väg att ta slut. Det finns också uppgifter om tidiga kanoner vid Crécy. Edvard belägrade sedan Calais, som förblev engelsk till 1558.

digerdoden-1348:
  period: 1340
  label: "digerdöden 1348"
  title: "Digerdöden når England 1348"
  wiki:
    - "sv:Digerdöden"
    - "en:Black Death in England"
  text: |
    **Digerdöden** var den pestepidemi som 1346–1353 svepte över Västasien, Nordafrika och Europa. Den orsakades av bakterien *Yersinia pestis*, som sprids via loppor på råttor och, i lungpestform, direkt mellan människor. Utan behandling dog en stor del av de smittade inom några dagar. Antibiotika, som idag botar pest, fanns inte förrän på 1940-talet.

    Pesten nådde England i juni 1348 via hamnar i sydväst, troligen Weymouth, och spred sig till London på hösten. Uppskattningsvis 30–50 procent av Englands befolkning på cirka 4–5 miljoner dog på två år. Hela byar övergavs; arkeologer har funnit massgravar i London med tusentals kroppar.

    Följderna var stora. När arbetskraften blev knapp krävde lantarbetare högre löner. Kungen och parlamentet försökte frysa lönerna med lagar 1349 och 1351, men det skapade bitterhet som bidrog till [bondeupproret 1381](#bondeupproret-1381). På sikt försvann livegenskapen – bundenheten till godsägarens jord – i England, och lönerna steg. Många ekonomiska historiker ser detta som en av rötterna till att Nordvästeuropa senare blev rikt. Jämför med spanska sjukan 1918 och covid-19, som dödade en betydligt mindre andel av befolkningen.

poitiers-1356:
  period: 1340
  label: "Poitiers 1356"
  title: "Slaget vid Poitiers 1356"
  wiki:
    - "sv:Slaget vid Poitiers (1356)"
    - "en:Battle of Poitiers"
  text: |
    Tio år efter Crécy ([se det](#crecy-1346)) ledde Edvard III:s äldste son, **Edvard den svarte prinsen** (troligen efter sin svarta rustning), ett plundringståg från de engelska besittningarna i Gascogne i sydvästra Frankrike. Vid **Poitiers** i västra Frankrike hann den franske kungen **Johan II** ifatt honom i september 1356, med en här som uppskattas ha varit ungefär dubbelt så stor som den engelska på kanske 6 000–8 000 man.

    Fransmännen hade lärt sig att rytteriet inte klarade sig mot långbågarna och lät därför de flesta riddarna anfalla till fots. Men i rustning var de långsamma, och de engelska skyttarna och en flankattack med ryttare bröt den franska armén. Kung Johan själv tillfångatogs tillsammans med en av sina söner och många adelsmän.

    Det var en katastrof för Frankrike. Lösensumman för kungen sattes till 3 miljoner guldkronor – flera års statsinkomster – och i freden i Brétigny 1360 fick England ungefär en tredjedel av Frankrike. Medan kungen satt fången rådde kaos: Paris borgare revolterade under Étienne Marcel, och bönderna gjorde uppror i Jacquerie ([se det](#jacquerie-upproret-1358)). Frankrike vände kriget först under [Karl V](#karl-v-och-du-guesclin-atertar-mark) på 1370-talet.

chaucer:
  period: 1360
  label: "Chaucer"
  title: "Geoffrey Chaucer (ca 1343–1400)"
  wiki:
    - "sv:Geoffrey Chaucer"
    - "sv:Canterburysägner"
  text: |
    **Geoffrey Chaucer** var en engelsk diktare, men också tjänsteman: han var hovman, diplomat i Frankrike och Italien och tullkontrollant i Londons hamn. Han kallas ofta ”den engelska litteraturens fader”.

    Orsaken är språket. Sedan [normandernas erövring 1066](#stamford-bridge-och-hastings-1066) hade franska varit överklassens och hovets språk i England, och latin lärdomens. Chaucer skrev i stället på *medelengelska*, det talade språket – en tidig form av engelska som en modern läsare med lite övning delvis kan förstå. Hans mest kända verk, **Canterburysägnerna** (påbörjade omkring 1387), är en samling berättelser som en grupp pilgrimer på väg till katedralen i Canterbury berättar för varandra: en riddare, en mjölnare, en nunna, en svindlare som säljer avlat och många fler. Det ger en livfull bild av samhällets alla skikt.

    Chaucer var påverkad av italienarna [Dante](#dante-divina-commedia) och Boccaccio – Boccaccios *Decamerone* från 1350-talet har en liknande ram, med unga människor som flytt pesten och berättar historier. Chaucer begravdes i Westminster Abbey, och platsen blev början på ”Poets' Corner”, där bl.a. Dickens senare begravdes. Se även att [engelska blev rättsspråk 1362](#engelska-blir-rattssprak-1362).

    Chaucer skrev också en [traktat om astrolabiet 1391](#chaucer-traktat-om-astrolabium-1391).

engelska-blir-rattssprak-1362:
  period: 1360
  label: "engelska blir rättsspråk 1362"
  title: "Engelska blir rättsspråk 1362"
  wiki:
    - "en:Pleading in English Act 1362"
    - "en:Law French"
  text: |
    Efter att [normanderna erövrat England 1066](#stamford-bridge-och-hastings-1066) talade kungen, adeln och domstolarna **franska** (en normandisk variant, ”anglo-normandiska”), medan kyrka och förvaltning skrev på latin. Vanligt folk talade engelska. Under 1300-talet ändrades detta: [hundraårskriget mot Frankrike](#hundraarskriget-borjar-1337) (från 1337) gjorde franskan till fiendens språk, och efter digerdöden fick den engelsktalande mellanklassen större betydelse.

    År 1362 antog parlamentet **Statute of Pleading**, en lag som sade att rättegångar skulle föras muntligt på engelska, eftersom folk inte förstod vad som sades om dem i domstolen. Samma år öppnades parlamentet för första gången med ett tal på engelska. Lagen följdes inte fullt ut – protokollen skrevs fortfarande på latin och juristerna använde en speciell ”lagfranska” i flera hundra år till.

    Spåren syns än idag: engelsk juridisk terminologi är full av franska ord som *court*, *judge*, *jury*, *attorney* och *plaintiff*. Beslutet var en del av den process som gjorde engelska till ett skriftspråk med status – samtidigt skrev [Chaucer](#chaucer) sina dikter på engelska, och Wycliffes anhängare översatte Bibeln ([se 1380-talet](#wycliffe-bibeln)).

bondeupproret-1381:
  period: 1380
  label: "Bondeupproret 1381"
  title: "Bondeupproret i England 1381"
  wiki:
    - "sv:Bondeupproret i England 1381"
    - "en:Wat Tyler"
  text: |
    [Efter digerdöden](#digerdoden-1-3-av-europa-dor) fanns det färre arbetare, och de kunde kräva högre löner. Kungen och jordägarna svarade 1351 med en lag, *Statute of Labourers*, som försökte frysa lönerna på nivån före pesten. Samtidigt behövde kronan pengar till [hundraårskriget](#hundraarskriget-borjar-1337) och införde 1377–1380 en **huvudskatt** (*poll tax*) – samma belopp per person oavsett inkomst, vilket slog hårdast mot de fattiga. Den tredje skatten 1380 var tre gånger högre än den första.

    I maj–juni 1381 gjorde bönder och hantverkare i Essex och Kent uppror. Ledda av **Wat Tyler** och prästen **John Ball** – känd för frågan ”När Adam grävde och Eva spann, vem var då adelsman?” – marscherade tiotusentals till London, brände palats och dödade ärkebiskopen av Canterbury, som också var landets finansminister. Den 14-årige kungen **[Rikard II](#rikard-ii-avsatts-1399)** mötte rebellerna och lovade att avskaffa livegenskapen. Vid ett nytt möte dödades Wat Tyler, och upproret föll ihop. Löftena drogs tillbaka och ledarna avrättades.

    Upproret misslyckades på kort sikt, men huvudskatten övergavs och livegenskapen i England dog i praktiken ut under det följande århundradet, eftersom arbetskraftsbristen gav bönderna förhandlingsstyrka. [Jämför med Engelbrektsupproret i Sverige 1434](#engelbrektsupproret-1434).

wycliffe-bibeln:
  period: 1380
  label: "Wycliffe-bibeln"
  title: "Wycliffebibeln, 1380-talet"
  wiki:
    - "sv:John Wycliffe"
    - "en:Wycliffe's Bible"
  text: |
    **John Wycliffe** (ca 1330–1384) var präst och teolog vid universitetet i Oxford. Han kritiserade kyrkans rikedom och makt, ifrågasatte påvens auktoritet och läran att brödet i nattvarden bokstavligen förvandlas till Kristi kropp. Hans huvudtanke var att Bibeln, inte påven eller kyrkans traditioner, är den högsta auktoriteten – och att vanligt folk därför borde kunna läsa den själv.

    På 1380-talet översatte Wycliffe och hans medarbetare hela Bibeln från latin till engelska – den första fullständiga engelska bibeln. Allt skrevs för hand, eftersom boktryckarkonsten ännu inte fanns ([Gutenberg ~1450](#gutenberg-tryckpress-1450-bibeln-1455)), och en kopia kunde ta månader att skriva. Ändå finns omkring 250 handskrifter bevarade, vilket visar hur spridd den blev. Kyrkan förbjöd 1409 bibelöversättningar till engelska utan biskopens tillstånd.

    Wycliffes anhängare kallades **lollarder** och förföljdes ([se 1400-talet](#lollarder-forfoljs)). Hans skrifter spreds till Böhmen, där de inspirerade **[Jan Hus](#jan-hus-branns-i-konstanz-1415)**, som brändes 1415. Wycliffe kallas därför ibland ”reformationens morgonstjärna” – hans idéer föregick [Martin Luthers](#luther-95-teser-1517) med ungefär 140 år. 1428 grävdes hans kvarlevor upp, brändes och askan kastades i en flod.

rikard-ii-avsatts-1399:
  period: 1380
  label: "Rikard II avsätts 1399"
  title: "Rikard II avsätts 1399"
  wiki:
    - "sv:Rikard II av England"
    - "sv:Henrik IV av England"
  text: |
    **Rikard II** blev kung av England 1377 som tioåring, efter sin farfar Edvard III. Hans far, den berömde krigaren Svarte prinsen, hade dött året innan. Rikard är känd för att som 14-åring ha mött rebellerna i bondeupproret 1381 ([se den punkten](#bondeupproret-1381)).

    Som vuxen styrde han alltmer egenmäktigt. Han hämnades på adelsmän som tidigare begränsat hans makt, höll ett påkostat hov och tog ut godtyckliga skatter. När hans farbror John av Gaunt dog 1399 konfiskerade Rikard arvet, som skulle gått till sonen **Henrik Bolingbroke**, som Rikard redan landsförvisat. Medan Rikard var på fälttåg i Irland återvände Henrik, fick adelns stöd och tvingade Rikard att abdikera. Parlamentet godkände att Henrik blev kung som **Henrik IV**. Rikard dog i fångenskap 1400, troligen av svält.

    Avsättningen var betydelsefull eftersom den bröt den raka tronföljden. Henriks ätt, huset Lancaster, sågs av rivaler som usurpatorer, och det låg bakom **[Rosornas krig](#rosornas-krig-1455)** (1455–1487) mellan husen Lancaster och York. Shakespeare skrev om hela förloppet i sina kungadramer, från *Rikard II* till *Rikard III*.

henrik-v-vinner-vid-agincourt-1415:
  period: 1400
  label: "Henrik V vinner vid Agincourt 1415"
  title: "Henrik V och Agincourt 1415"
  wiki:
    - "sv:Henrik V av England"
    - "sv:Slaget vid Agincourt"
  text: |
    **Henrik V** (kung 1413–1422) var son till Henrik IV, som [tagit tronen från Rikard II 1399](#rikard-ii-avsatts-1399). Han ville stärka sin osäkra dynastis anseende och utnyttja att Frankrike var lamslaget av en sinnessjuk kung [(Karl VI)](#karl-vi-blir-sinnessjuk) och inbördeskrig. 1415 återupptog han [hundraårskriget](#hundraarskriget-borjar-1337) och gjorde anspråk på den franska kronan.

    Efter att ha intagit hamnstaden Harfleur var hans armé decimerad av dysenteri. På väg mot Calais blev den genskjuten vid **Agincourt** den 25 oktober 1415. Engelsmännen var uppskattningsvis 6 000–9 000 man, mest bågskyttar; fransmännen kanske 12 000–15 000 eller fler (siffrorna är omdiskuterade). Det hade regnat, och de tungt rustade franska riddarna fastnade i leran på en smal, plöjd åker mellan två skogar, där de besköts av engelska **långbågar** – pilbågar av idegran som kunde skjuta 10–12 pilar i minuten. Tusentals fransmän dog, bland dem stora delar av adeln, mot några hundra engelsmän.

    Segern gjorde Henrik till nationalhjälte (Shakespeares *Henrik V*). 1420 tvingade han fram freden i Troyes, där han erkändes som arvinge till Frankrikes tron. Men han dog 1422, bara 35 år gammal, och hans spädbarnsson kunde inte hålla det vunna.

lollarder-forfoljs:
  period: 1400
  label: "lollarder förföljs"
  title: "Förföljelsen av lollarderna"
  wiki:
    - "sv:Lollarder"
    - "en:John Oldcastle"
  text: |
    **Lollarderna** var anhängare till teologen John Wycliffe ([se Wycliffebibeln, 1380-talet](#wycliffe-bibeln)). De ville att vanligt folk skulle läsa Bibeln på engelska, kritiserade kyrkans rikedom, helgondyrkan, pilgrimsfärder och läran att brödet i nattvarden förvandlas till Kristi kropp. Namnet kommer troligen från ett holländskt ord för ”mumlare”.

    Efter att Henrik IV tagit makten 1399 behövde han kyrkans stöd, och 1401 antogs lagen *De heretico comburendo* (”om att bränna kättare”), som gjorde det möjligt att bränna dömda kättare på bål – första gången i England. 1409 förbjöds bibelöversättningar till engelska utan tillstånd.

    Lollarderna fick en ledare i **Sir John Oldcastle**, en riddare och tidigare vän till Henrik V. Han dömdes för kätteri men rymde, och 1414 försökte lollarder ett uppror som snabbt slogs ner. Oldcastle avrättades 1417. Rörelsen gick sedan under jorden men överlevde i små grupper fram till 1500-talet, då den smälte samman med den protestantiska reformationen. Oldcastle blev för övrigt förebild för Shakespeares komiska figur Falstaff.

henrik-vi-barnkung:
  period: 1420
  label: "Henrik VI barnkung"
  title: "Henrik VI blir kung som spädbarn"
  wiki:
    - "sv:Henrik VI av England"
    - "sv:Hundraårskriget"
  text: |
    **Henrik VI** blev kung av England i september 1422, bara nio månader gammal, när hans far Henrik V dog plötsligt av sjukdom. Fadern hade just vunnit stora segrar i [hundraårskriget](#hundraarskriget-borjar-1337) ([Agincourt 1415](#henrik-v-vinner-vid-agincourt-1415)) och genom fördraget i Troyes 1420 fått löfte om Frankrikes krona. Några veckor senare dog även den franske kungen, så barnet blev formellt kung över båda länderna. Han kröntes i Paris 1431.

    Ett barn kan inte regera, så makten låg hos en regentskapsstyrelse: farbrodern hertigen av **Bedford** ledde kriget i Frankrike, och farbrodern hertigen av **Gloucester** styrde hemma. Adelns olika fraktioner tävlade om inflytande.

    Som vuxen var Henrik from och fredlig men svag som ledare. Han grundade skolan Eton (1440) och King's College i Cambridge (1441). 1453 drabbades han av ett psykiskt sammanbrott och var i över ett år helt oförmögen att tala eller känna igen sin omgivning.

    Hans svaghet är en huvudorsak till två katastrofer: [förlusten av nästan alla engelska områden i Frankrike](#frankrike-forloras-successivt) och **[Rosornas krig](#rosornas-krig-1455)** (1455–1485), då adelsätten York utmanade honom om kronan.

frankrike-forloras-successivt:
  period: 1420
  label: "Frankrike förloras successivt"
  title: "England förlorar Frankrike"
  wiki:
    - "sv:Hundraårskriget"
    - "en:Lancastrian War"
  text: |
    Under **hundraårskriget** (1337–1453) krävde Englands kungar Frankrikes krona, eftersom de härstammade från den franska kungaätten. Kring 1420 såg England ut att vinna: man kontrollerade norra Frankrike med Paris, i allians med det mäktiga hertigdömet **Burgund**.

    Sedan vände det steg för steg. 1429 bröt [Jeanne d'Arc](#jeanne-d-arc-befriar-orleans-1429-branns) belägringen av Orléans och den franske kungen Karl VII kröntes. 1435 bytte Burgund sida (freden i Arras), och 1436 föll Paris till fransmännen. Under ett stillestånd 1444–1449 byggde Frankrike upp en stående armé och ett starkt artilleri. 1450 föll Normandie efter slaget vid Formigny, och [1453 förlorades Gascogne](#hundraarskriget-slut-1453) (kring Bordeaux), som varit engelskt i 300 år.

    Kvar fanns bara **Calais**, som England behöll till 1558. Engelska kungar fortsatte ändå att kalla sig ”kung av Frankrike” ända till 1801.

    Förlusterna var förödmjukande och dyra. Soldater och adelsmän kom hem besvikna och beväpnade, och skulden lades på kungens rådgivare. Det bidrog direkt till [Rosornas krig 1455](#rosornas-krig-1455). På längre sikt vände sig England bort från kontinenten och mot havet.

hundraarskriget-slut-1453:
  period: 1440
  label: "Hundraårskriget slut 1453"
  title: "Hundraårskriget tar slut 1453"
  wiki:
    - "sv:Hundraårskriget"
    - "en:Battle of Castillon"
  text: |
    **Hundraårskriget** (1337–1453) var en serie krig mellan England och Frankrike, med långa uppehåll, om vem som skulle vara kung av Frankrike och om engelska kungars landområden i Frankrike. Det pågick i 116 år, men med vapenstillestånd var de faktiska krigsåren betydligt färre.

    Slutet kom vid slaget vid **Castillon** i juli 1453, i Gascogne i sydvästra Frankrike. Den franska armén hade cirka 300 kanoner, och den engelske befälhavaren **John Talbot** anföll ett befäst läger rakt in i artilleriet och dödades. Det räknas som ett av de första fältslagen som avgjordes av fältartilleri. I oktober föll Bordeaux. Inget fredsavtal skrevs – kriget bara upphörde.

    Kriget förändrade båda länderna. Riddarnas tid som avgörande militärmakt var förbi; engelska långbågsskyttar och sedan krut hade gjort dem sårbara. Båda länderna fick en starkare nationell identitet, och i England ersatte engelska under kriget gradvis franska som språk vid hovet och i förvaltningen.

    Samma år, 1453, [föll Konstantinopel till osmanerna](#konstantinopel-faller-1453). Därför används 1453 ofta som gräns mellan medeltid och nyare tid.

    Se även hur Frankrike vann kriget: [Frankrike vinner hundraårskriget](#frankrike-vinner-hundraarskriget).

rosornas-krig-1455:
  period: 1440
  label: "Rosornas krig 1455"
  title: "Rosornas krig börjar 1455"
  wiki:
    - "sv:Rosornas krig"
    - "en:First Battle of St Albans"
  text: |
    **Rosornas krig** (1455–1487) var en serie inbördeskrig om Englands krona mellan två grenar av kungaätten Plantagenet: **Lancaster** (symbol: röd ros) och **York** (vit ros). Namnet ”[rosornas krig](#rosornas-krig)” myntades i efterhand, främst på 1800-talet.

    Bakgrunden var kung **[Henrik VI](#henrik-vi-barnkung)** (av Lancaster): han var svag, drabbades 1453 av ett psykiskt sammanbrott och hade just [förlorat nästan allt i Frankrike](#frankrike-forloras-successivt). **Richard av York**, som också härstammade från Edvard III, utsågs till protektor (riksföreståndare) under sjukdomen, men när kungen tillfrisknade knuffades han undan av drottningen **Margareta av Anjou** och hennes allierade.

    Det första slaget stod vid **St Albans** i maj 1455. Det var kort – kanske en timme – och relativt få dödades, kanske 50–100 man, men flera av Yorks motståndare bland adeln dödades och kungen tillfångatogs.

    Kriget pågick i 30 år med växlande segrare. Det största slaget, Towton 1461, kan ha haft upp mot 50 000–75 000 deltagare. Det slutade 1485 när Henrik Tudor [besegrade Rikard III vid Bosworth](#bosworth-1485-tudor-atten) och grundade **Tudordynastin** – Henrik VIII:s och Elisabet I:s släkt. Kriget inspirerade Shakespeares kungadramer och, långt senare, *Game of Thrones*.

rosornas-krig:
  period: 1460
  label: "Rosornas krig"
  title: "Rosornas krig på 1460-talet"
  wiki:
    - "sv:Rosornas krig"
    - "sv:Slaget vid Towton"
  text: |
    **Rosornas krig** (1455–1487) var inbördeskrig om Englands krona mellan ätterna **Lancaster** (röd ros) och **York** (vit ros) ([se Rosornas krig 1455](#rosornas-krig-1455)). 1460-talet var krigets mest våldsamma fas.

    I december 1460 föll Richard av York i slaget vid Wakefield; hans huvud sattes upp på stadsporten i York med en papperskrona. Hans 18-årige son Edvard tog upp kampen och utropades till kung som **[Edvard IV](#edvard-iv)** i mars 1461. Några veckor senare, den 29 mars 1461, stod slaget vid **Towton** i Yorkshire i snöstorm. Uppemot 50 000–75 000 man deltog, och dödstalet brukar anges till cirka 28 000, även om forskare i dag tror att det var lägre, kanske 10 000 eller färre. Det räknas ändå som det blodigaste slaget på engelsk mark.

    [Henrik VI flydde](#henrik-vi-barnkung), tillfångatogs 1465 och sattes i Towern. 1470 bytte Edvards mäktigaste allierade, earlen av **Warwick** – kallad ”kungamakaren” – sida och återinsatte Henrik. Edvard flydde till Burgund men kom tillbaka 1471 och vann vid Barnet och Tewkesbury. Warwick och Henriks son dödades, och Henrik själv mördades troligen i Towern.

    Kriget dödade en stor del av den högsta adeln, vilket senare gjorde det lättare för [Tudorkungarna](#bosworth-1485-tudor-atten) att stärka kronans makt.

edvard-iv:
  period: 1460
  label: "Edvard IV"
  title: "Edvard IV av England"
  wiki:
    - "sv:Edvard IV av England"
    - "en:Princes in the Tower"
  text: |
    **Edvard IV** (1442–1483) var son till Richard av York och den förste kungen av ätten York. Han tog kronan 1461, 18 år gammal, efter segern vid Towton under Rosornas krig ([se Rosornas krig](#rosornas-krig)). Han var nästan två meter lång, karismatisk och en skicklig fältherre som aldrig förlorade ett slag han själv ledde.

    Han regerade i två omgångar: 1461–1470 och 1471–1483. Han förlorade tronen en kort tid när hans främste allierade, earlen av Warwick, bytte sida efter att Edvard i hemlighet gift sig med **Elizabeth Woodville**, en lågadlig änka, istället för att göra ett politiskt äktenskap med en fransk prinsessa. Edvard kom tillbaka och vann 1471.

    Hans andra regeringstid var lugnare. Han förbättrade kronans finanser, främjade handeln och fick 1475 en stor årlig betalning av Frankrikes kung [Ludvig XI](#ludvig-xi-mot-burgund) för att avstå från krig. Han stödde också William Caxton, som startade Englands första tryckeri 1476 ([se Caxton](#caxton-trycker-i-london-1476)).

    När han dog 1483 var hans söner 12 och 9 år. Hans bror tog makten som **Rikard III**, och pojkarna – ”prinsarna i Towern” – försvann, troligen mördade. Edvards dotter Elizabeth gifte sig med [Henrik VII Tudor](#bosworth-1485-tudor-atten) och blev farmor till Henrik VIII.

caxton-trycker-i-london-1476:
  period: 1460
  label: "Caxton trycker i London 1476"
  title: "William Caxton trycker i England 1476"
  wiki:
    - "sv:William Caxton"
  text: |
    **William Caxton** (cirka 1422–1491) var en engelsk köpman som bodde i nästan 30 år i Brygge i Flandern, där han ledde de engelska köpmännens organisation. Han lärde sig boktryck i Köln, och tryckte omkring 1473–1474 i Brygge den första boken på engelska: en översättning av en fransk riddarroman om Troja, som han själv gjort.

    1476 flyttade han hem och startade Englands första tryckeri i **Westminster**, nära kungens palats och parlamentet (formellt utanför London stad). Han tryckte omkring 100 titlar, bland annat Chaucers *[Canterburysägner](#chaucer)* (cirka 1476) och Malorys *Le Morte d'Arthur* om kung Arthur (1485). Han valde texter som sålde till adel och rika borgare – han var lika mycket förläggare som tryckare.

    Hans största betydelse var för **engelska språket**. På den tiden skiljde sig dialekterna kraftigt. Caxton skrev själv om hur ett ord som ”ägg” kunde vara *eggys* eller *eyren* beroende på region. Han valde i stort sett Londons och hovets språk, vilket bidrog till att det blev standard. Många av engelskans ologiska stavningar kommer från tryckeriernas tid, då uttalet förändrades men stavningen frös.

    Jämför: Sveriges första tryckta bok kom 1483 i Stockholm, av tysken Johann Snell.

bosworth-1485-tudor-atten:
  period: 1480
  label: "Bosworth 1485: Tudor-ätten"
  title: "Slaget vid Bosworth 1485"
  wiki:
    - "en:Battle of Bosworth Field"
    - "en:Wars of the Roses"
    - "en:House of Tudor"
  text: |
    England hade i 30 år plågats av **[Rosornas krig](#rosornas-krig)** (1455–1487): inbördeskrig mellan två grenar av kungaätten, York (vit ros) och Lancaster (röd ros), om tronen. Kungar avsattes och dödades i omgångar.

    1485 regerade **Rikard III** av York, som misstänktes ha låtit mörda sina unga brorsöner. **Henrik Tudor**, en avlägsen arvinge till Lancaster, landsteg i Wales från exil i Frankrike. Vid **Bosworth** i Mellanengland möttes uppskattningsvis 8 000–10 000 man på Rikards sida och 5 000 på Henriks. Det avgörande var att Stanley-familjens trupper bytte sida mitt i slaget. Rikard dog – den siste engelske kung som stupat i strid. Hans skelett hittades 2012 under en parkeringsplats i Leicester.

    Henrik VII gifte sig med Elizabeth av York och förenade rosorna. **Tudor-ätten** (1485–1603) gav England [Henrik VIII](#henrik-viii-1509), som bröt med påven, och [Elisabet I](#elisabet-i-1558), under vilken England blev sjömakt. Henrik VII själv byggde upp kronans finanser och sponsrade [Cabots resa 1497](#cabot-till-newfoundland-1497).

cabot-till-newfoundland-1497:
  period: 1480
  label: "Cabot till Newfoundland 1497"
  title: "John Cabots resa 1497"
  wiki:
    - "en:John Cabot"
    - "en:Matthew (ship)"
  text: |
    **John Cabot** (Giovanni Caboto) var en sjöman från Venedig som, liksom Columbus, trodde att man kunde nå Asien genom att segla västerut. Spanien och Portugal hade redan anställt sina sjöfarare, så han vände sig till Englands kung Henrik VII och handelsmännen i Bristol.

    I maj 1497 seglade han med ett enda litet skepp, *Matthew*, med omkring 18–20 mans besättning. Den 24 juni gick han i land någonstans på Nordamerikas östkust – troligen Newfoundland eller Kap Breton. Han trodde att det var Asien. Resan över tog ungefär fem veckor. Cabot rapporterade om haven fulla med torsk, så att man kunde ta upp fisk med korgar.

    Han gav sig ut igen 1498 med fem skepp och försvann spårlöst. Resan blev ändå grunden för Englands senare anspråk i Nordamerika. Jämför: vikingarna hade varit på Newfoundland redan omkring år 1000 ([L'Anse aux Meadows](#vikingar-i-l-anse-aux-meadows)), men det hade inte fått några följder. [Se även Columbus 1492](#columbus-1492).

henrik-viii-1509:
  period: 1500
  label: "Henrik VIII 1509"
  title: "Henrik VIII blir kung 1509"
  wiki:
    - "en:Henry VIII"
    - "en:Wives of Henry VIII"
  text: |
    **Henrik VIII** (1491–1547) blev kung av England 1509, bara 17 år gammal, efter sin far Henrik VII, grundaren av Tudor-ätten ([se Bosworth 1485](#bosworth-1485-tudor-atten)). Han var i början atletisk, musikalisk och bildad, och styrde i 38 år.

    Han är mest känd för sina **sex hustrur** – minnesramsan lyder ”skild, halshuggen, död, skild, halshuggen, överlevde”. Hans första hustru, den spanska prinsessan Katarina av Aragonien, födde bara en överlevande dotter (Maria). Henrik ville ha en son och ville skilja sig. När påven vägrade bröt Henrik 1534 med Rom och gjorde sig själv till överhuvud för den engelska kyrkan ([se 1534](#henrik-viii-bryter-med-rom-1534)). Han stängde och konfiskerade klostren och deras stora jordegendomar.

    Han förde dyra krig mot Frankrike och byggde upp flottan (bl.a. *Mary Rose*, som sjönk 1545 och bärgades 1982). Han efterträddes av sina tre barn: Edvard VI, Maria I och slutligen [Elisabet I](#elisabet-i-1558).

thomas-more-utopia-1516:
  period: 1500
  label: "Thomas More: Utopia 1516"
  title: "Thomas More skriver Utopia 1516"
  wiki:
    - "en:Utopia (book)"
    - "en:Thomas More"
  text: |
    **Thomas More** (1478–1535) var engelsk jurist, humanist och statsman – [humanismen](#petrarca-tidig-humanism) var renässansens rörelse som ville återuppliva antikens litteratur och tänkande. Han var nära vän med Erasmus av Rotterdam, tidens mest kände lärde.

    1516 publicerade han på latin ***Utopia***, ett ordskämt av grekiskans ”ingenstans” och ”det goda stället”. Boken skildrar en ö där ingen privat egendom finns, alla arbetar sex timmar om dagen, religionsfrihet råder och ledarna väljs. Det är oklart hur allvarligt More menade det; boken är också en satir över England, där fårfarmer tog över åkrar och drev bönder till fattigdom och tjuvnad. Ordet ”utopi” kommer härifrån, och boken inspirerade senare socialistiska idéer.

    More blev 1529 Englands lordkansler, högsta ämbetsman. Han var dock en övertygad katolik och vägrade erkänna [Henrik VIII](#henrik-viii-1509) som kyrkans överhuvud efter [brytningen med Rom 1534](#henrik-viii-bryter-med-rom-1534). Han halshöggs 1535 och helgonförklarades av katolska kyrkan 1935.

henrik-viii-bryter-med-rom-1534:
  period: 1520
  label: "Henrik VIII bryter med Rom 1534"
  title: "Henrik VIII bryter med Rom 1534"
  wiki:
    - "en:English Reformation"
    - "en:Acts of Supremacy"
    - "en:Dissolution of the monasteries"
  text: |
    **Henrik VIII** av England hade varit gift i nära 20 år med Katarina av Aragonien, men de hade bara en överlevande dotter. Han ville ha en son som arvinge – Rosornas krig ([se Bosworth 1485](#bosworth-1485-tudor-atten)) visade vad en oklar tronföljd kunde leda till – och han var förälskad i hovdamen Anne Boleyn. Han begärde att påven skulle ogiltigförklara äktenskapet.

    Påven Clemens VII vägrade, delvis för att Katarina var faster till kejsar [Karl V](#karl-v-habsburg-1516), vars trupper höll Rom i sitt grepp efter [plundringen 1527](#rom-plundras-1527). Henrik gifte sig i hemlighet med Anne 1533, lät ärkebiskopen av Canterbury upplösa det första äktenskapet, och genom **supremitetsakten** 1534 gjorde parlamentet kungen till överhuvud för **Englands kyrka**. [Thomas More](#thomas-more-utopia-1516), som vägrade godta detta, halshöggs 1535.

    Brytningen var i första hand politisk; Henrik var ingen protestant i läran. Men den öppnade för protestantism, och mellan 1536 och 1541 stängdes omkring 800 kloster, vars egendom tillföll kronan och adeln. Efter ett katolskt avbrott under Maria I blev den anglikanska kyrkan permanent under [Elisabet I](#elisabet-i-1558). Jämför [Gustav Vasas reformation i Sverige 1527](#reformation-vasteras-1527) – också med stark ekonomisk drivkraft.

edvard-vi-maria-i-blodiga-mary:
  period: 1540
  label: "Edvard VI, Maria I (Blodiga Mary)"
  title: "Edvard VI och Maria I (1547–1558)"
  wiki:
    - "sv:Edvard VI av England"
    - "sv:Maria I av England"
  text: |
    Efter Henrik VIII:s död 1547 formade hans barn i tur och ordning Englands religion. [Henrik hade brutit med påven 1534](#henrik-viii-bryter-med-rom-1534) men behållit mycket katolsk lära. Sonen **Edvard VI** blev kung vid nio års ålder; hans förmyndare drev England i tydligt protestantisk riktning, med en ny engelskspråkig gudstjänstordning (Book of Common Prayer, 1549). Edvard dog 1553, bara 15 år gammal.

    Hans halvsyster **Maria I**, dotter till den katolska Katarina av Aragonien, tog makten och återförde England till påvekyrkan. Omkring 280–300 protestanter brändes som kättare under hennes fem år, vilket gav henne öknamnet ”Bloody Mary”. Hon gifte sig med [Filip II](#filip-ii-1556) av Spanien, vilket var impopulärt, och England förlorade Calais, sin sista besittning i Frankrike, 1558.

    Hon dog barnlös 1558 och efterträddes av halvsystern **[Elisabet I](#elisabet-i-1558)**, som gjorde England protestantiskt för gott. Antalet avrättade var högt, men jämför med [Bartolomeinatten i Frankrike 1572](#bartolomeinatten-1572), där tusentals dödades på några dagar.

elisabet-i-1558:
  period: 1560
  label: "Elisabet I (1558)"
  title: "Elisabet I blir drottning 1558"
  wiki:
    - "sv:Elisabet I av England"
    - "en:Elizabeth I"
  text: |
    **Elisabet I** (1533–1603) var dotter till Henrik VIII och Anne Boleyn, som avrättades när Elisabet var två år. Hon efterträdde halvsystern Maria I (”Blodiga Mary”) 1558 och regerade i 45 år. England hade då bara uppskattningsvis 3–4 miljoner invånare – en andrarangsmakt jämfört med Spanien och Frankrike.

    Hon gjorde England varaktigt protestantiskt men med en medelväg: den anglikanska kyrkan behöll biskopar och mycket av den katolska ceremonin. Hon gifte sig aldrig – ”jungfrudrottningen” – delvis för att undvika att en make skulle dra in England i utländska intressen. Hon lät avrätta sin katolska kusin Maria Stuart, Skottlands avsatta drottning, 1587.

    Hennes tid förknippas med tre saker: segern över [spanska Armadan 1588](#armadan-slas-1588), när Filip II:s flotta på omkring 130 fartyg misslyckades med att invadera England; sjöhjältar och kapare som [Drake](#drake) (se Drake); och en kulturell blomstring med [Shakespeare](#shakespeare-fodd-1564) (se Shakespeare född 1564). 1600 grundades [Ostindiska kompaniet](#ostindiska-kompaniet-1600), början på det som blev det brittiska imperiet. Hon dog barnlös och efterträddes av Maria Stuarts son, Jakob av Skottland.

shakespeare-fodd-1564:
  period: 1560
  label: "Shakespeare född 1564"
  title: "William Shakespeare föds 1564"
  wiki:
    - "sv:William Shakespeare"
    - "en:William Shakespeare"
  text: |
    **William Shakespeare** (1564–1616) föddes i småstaden Stratford-upon-Avon som son till en handskmakare. Omkring 1590 dök han upp i London som skådespelare och dramatiker. London hade då uppskattningsvis 150 000–200 000 invånare, och de första fasta teaterhusen, som The Globe (1599), lockade publik från alla samhällsklasser – entré för den billigaste ståplatsen kostade en penny.

    [Han skrev omkring 37–39 pjäser](#shakespeares-forsta-pjaser), bland dem *Romeo och Julia*, *Hamlet*, *Macbeth* och *Kung Lear*, samt 154 sonetter. Ungefär hälften av pjäserna trycktes först efter hans död, i samlingsutgåvan 1623 (”First Folio”) – utan den hade de gått förlorade.

    Shakespeare påverkade det engelska språket mer än någon annan enskild författare: uttryck som ”to be or not to be” och många ord dokumenteras först hos honom. Han var samtida med Cervantes, som skrev *[Don Quijote](#cervantes-don-quijote-1605)* (1605); [båda dog 1616](#shakespeare-dor-1616). Jämför med att Sverige vid samma tid hade knappt någon världslitteratur – svensk skönlitteratur tog fart på 1600-talet.

drake:
  period: 1560
  label: "Drake"
  title: "Francis Drake"
  wiki:
    - "sv:Francis Drake"
    - "en:Francis Drake"
  text: |
    **Francis Drake** (ca 1540–1596) var en engelsk sjökapten, kapare och slavhandlare. En kapare var i praktiken en statligt godkänd pirat: han anföll fiendens skepp och delade bytet med kronan. Drakes mål var Spanien och dess silvertransporter från Amerika (se [Potosí-silver](#potosi-silver)).

    Hans mest kända bedrift var världsomseglingen 1577–1580, den andra i historien efter [Magellan och Elcano](#elcano-fullbordar-forsta). Han rundade Sydamerika, plundrade spanska hamnar och skepp längs Stilla havskusten – det rikaste bytet var silverskeppet *Cacafuego* – och kom hem med en last som enligt uppskattningar översteg den engelska kronans årsinkomst. [Elisabet I](#elisabet-i-1558) dubbade honom till riddare ombord på hans skepp *Golden Hind*.

    1587 brände han en stor del av den spanska flottan i Cádiz (”sveda kungens skägg”), vilket försenade [Armadan](#armadan-slas-1588) ett år, och 1588 var han en av befälhavarna när England slog tillbaka den. Han dog av dysenteri under en expedition till Karibien 1596. För engelsmännen var han en hjälte, för spanjorerna en pirat – ”El Draque”.

armadan-slas-1588:
  period: 1580
  label: "Armadan slås 1588"
  title: "Spanska armadan besegras 1588"
  wiki:
    - "sv:Spanska armadan"
    - "en:Spanish Armada"
  text: |
    1588 sände Spaniens kung **[Filip II](#filip-ii-1556)** en flotta, **Armadan**, på cirka 130 fartyg och omkring 30 000 man mot England. Planen var att segla upp genom Engelska kanalen, hämta en armé från Spanska Nederländerna (dagens Belgien) och invadera England. Motiven: England stödde de [protestantiska upprorsmännen i Nederländerna](#nederlandska-upproret-1568), engelska [kapare som Drake](#drake) plundrade spanska skepp, och den katolska skotska drottningen Maria Stuart hade avrättats 1587.

    Den engelska flottan under Lord Howard och Francis Drake var snabbare och hade bättre långdistanskanoner. Vid Calais skickade engelsmännen in brinnande fartyg (brännare) som skingrade Armadan, och i slaget vid Gravelines tvingades den norrut. Den fick segla runt Skottland och Irland, där stormar förstörde många skepp. Uppskattningsvis bara cirka 65–85 fartyg kom hem, och kanske hälften av männen dog.

    Nederlaget krossade inte Spanien – kriget fortsatte till 1604 – men det räddade det protestantiska England och blev en grundmyt för engelsk sjömakt. Under de följande seklen blev Storbritannien världens dominerande sjömakt.

shakespeares-forsta-pjaser:
  period: 1580
  label: "Shakespeares första pjäser"
  title: "Shakespeares första pjäser (~1590)"
  wiki:
    - "sv:William Shakespeare"
  text: |
    **William Shakespeare** (1564–1616) var skådespelare och dramatiker från Stratford-upon-Avon. Kring 1590 började han skriva för Londons teatrar; hans första pjäser var troligen krönikespelen om Henrik VI, *Richard III* och komedier som *Förväxlingskomedin*. Exakta årtal är osäkra eftersom pjäserna trycktes först senare.

    London hade då omkring 200 000 invånare och en ny kommersiell teaterbransch: de första permanenta teaterhusen byggdes från 1576, och upp till 2–3 000 åskådare kunde trängas i en föreställning för en penny för ståplats. Teatern var underhållning för alla klasser, ungefär som film idag.

    Under cirka 25 år skrev Shakespeare omkring 37–39 pjäser och 154 sonetter, bland dem *Hamlet*, *Macbeth*, *Romeo och Julia* och *Kung Lear*. Han tillförde engelskan hundratals ord och uttryck, och hans verk är fortfarande de mest spelade pjäserna i världen. Samtidigt i Spanien skrev Cervantes *[Don Quijote](#cervantes-don-quijote-1605)* (1605) – [båda dog 1616](#shakespeare-dor-1616).

ostindiska-kompaniet-1600:
  period: 1600
  label: "Ostindiska kompaniet 1600"
  title: "Brittiska Ostindiska kompaniet 1600"
  wiki:
    - "sv:Brittiska Ostindiska kompaniet"
    - "en:East India Company"
  text: |
    Den 31 december 1600 gav [drottning Elisabet I](#elisabet-i-1558) en grupp Londonköpmän ensamrätt på all engelsk handel öster om Godahoppsudden. Det blev **East India Company**. Det var ett aktiebolag: investerare satsade pengar och delade på vinsten, vilket spred risken för långa och farliga resor. Från början hade det drygt 200 delägare och ett kapital på omkring 70 000 pund.

    Kompaniet var till en början mycket mindre än sin holländska konkurrent VOC ([se 1602](#voc-1602)) och fick koncentrera sig på Indien i stället för kryddöarna. Det handlade med bomullstyger, siden, indigo, salpeter (till krut) och senare te. Det fick tillstånd av mogulkejsaren att handla i [Surat](#engelsk-handel-i-surat) (se där) och grundade senare Madras, Bombay och Calcutta.

    Efter slaget vid [Plassey 1757](#plassey-1757-ostindiska-kompaniet-tar) blev kompaniet en territoriell makt med egen armé – som mest omkring 260 000 soldater, ungefär dubbelt så stor som den brittiska armén – och styrde i praktiken stora delar av Indien. Efter ett stort uppror 1857 tog brittiska staten över och kompaniet upplöstes 1874. Det är ett av historiens tydligaste exempel på ett företag som blev en stat.

shakespeare-dor-1616:
  period: 1600
  label: "Shakespeare dör 1616"
  title: "Shakespeares död 1616"
  wiki:
    - "sv:William Shakespeare"
    - "en:First Folio"
  text: |
    **William Shakespeare** dog den 23 april 1616 i Stratford-upon-Avon, 52 år gammal. Han hade dragit sig tillbaka från London några år tidigare som en förmögen man; han var delägare i skådespelartruppen King's Men och i Globe-teatern. Bland hans sista pjäser var *Stormen* (cirka 1611).

    Han efterlämnade inga manuskript. Att vi har hälften av hans pjäser alls beror på att två skådespelarkolleger 1623 gav ut den så kallade **First Folio**, med 36 pjäser, varav 18 aldrig tryckts förut. Uppskattningsvis 750 exemplar trycktes; omkring 235 finns kvar, och de säljs idag för tiotals miljoner kronor.

    Dagen innan, den 22 april 1616, dog Miguel de Cervantes (se *[Don Quijote](#cervantes-don-quijote-1605)* 1605) i Madrid. Datumet 23 april har därför blivit Unescos världsbokdag – fast England och Spanien hade olika kalendrar (se [gregorianska kalendern 1582](#gregorianska-kalendern-1582)), så i verkligheten skilde det tio dagar. Shakespeare blev med tiden symbolen för engelsk litteratur och spreds med det brittiska imperiet över världen.

king-james-bibeln-1611:
  period: 1600
  label: "King James-bibeln 1611"
  title: "King James-bibeln 1611"
  wiki:
    - "sv:King James-bibeln"
    - "sv:Jakob I av England"
  text: |
    **Jakob I** (James I) var kung av Skottland och blev 1603 också kung av England efter [Elisabet I](#elisabet-i-1558), som dog barnlös – början på en union mellan länderna. Den engelska kyrkan, frigjord från påven sedan [Henrik VIII:s brytning 1534](#henrik-viii-bryter-med-rom-1534), var splittrad mellan biskopsvänliga och puritaner (strängt reformerta protestanter), och de använde olika bibelöversättningar.

    1604 beställde Jakob en ny gemensam översättning. Omkring 47 lärda i sex arbetsgrupper översatte från hebreiska och grekiska, och byggde mycket på William Tyndales tidigare översättning från 1520-talet. Arbetet tog cirka sju år, och bibeln trycktes 1611.

    **King James Version** blev den dominerande engelska bibeln i 300 år och har tillsammans med [Shakespeare](#shakespeares-forsta-pjaser) format det engelska språket mer än något annat verk; uttryck som ”the salt of the earth” och ”let there be light” kommer härifrån. Jämför med Gustav Vasas bibel (1541), som på motsvarande sätt formade det svenska skriftspråket.

karl-i:
  period: 1620
  label: "Karl I"
  title: "Karl I av England (1625–1649)"
  wiki:
    - "sv:Karl I av England"
    - "en:Petition of Right"
  text: |
    **Karl I** (1600–1649) blev kung av England, Skottland och Irland 1625 efter sin far Jakob I. Han trodde starkt på kungens gudomliga rätt att styra, och han hamnade snabbt i konflikt med **parlamentet**, den församling av adel och valda representanter som måste godkänna nya skatter.

    När parlamentet vägrade bevilja pengar till hans krig mot Spanien och Frankrike tog han ut skatter på egen hand och lät fängsla motståndare. Parlamentet svarade 1628 med ”Petition of Right” som slog fast att kungen inte fick beskatta utan parlamentets samtycke eller fängsla utan rättegång. 1629 upplöste Karl parlamentet och styrde utan det i elva år. Han gifte sig dessutom med en katolsk fransk prinsessa, och hans ärkebiskop Laud införde ritualer som puritanerna såg som katolska.

    När han försökte tvinga på Skottland en ny bönbok 1637 utbröt uppror, och Karl måste kalla in parlamentet för pengar. Konflikten ledde till [engelska inbördeskriget 1642–1651](#inbordeskriget-1642). Karl förlorade, ställdes inför rätta och [halshöggs 1649](#karl-i-avrattas-1649) – första gången en europeisk monark avrättades efter en rättegång i folkets namn. England blev en tid republik under [Oliver Cromwell](#cromwell).

harvey-blodomloppet-1628:
  period: 1620
  label: "Harvey: blodomloppet 1628"
  title: "William Harvey upptäcker blodomloppet 1628"
  wiki:
    - "sv:William Harvey"
    - "en:De Motu Cordis"
  text: |
    I nästan 1 500 år hade medicinen följt den grekisk-romerske läkaren **Galenos** (100-talet e.Kr.). Han lärde att blodet bildas i levern av maten, fördes ut i kroppen och förbrukades där, ungefär som bränsle, och att en del sipprade genom små porer i hjärtats skiljevägg.

    Den engelske läkaren **William Harvey** (1578–1657), livläkare åt Jakob I och Karl I, publicerade 1628 boken *De motu cordis* (”Om hjärtats rörelse”). Han visade med experiment på djur och med ett enkelt räknestycke att det var omöjligt: hjärtat pumpar ut så mycket blod per slag att det på en timme blir flera gånger kroppens vikt. Blodet kan inte nybildas så fort – det måste cirkulera. Han visade också att venernas klaffar bara släpper blodet mot hjärtat.

    Harvey kunde inte se hur blodet tog sig från artärerna till venerna. Det visade italienaren Marcello Malpighi 1661 med mikroskop ([se ~1590](#mikroskopet-1590)): de tunna kapillärerna. Upptäckten var ett tidigt exempel på kvantitativ, experimentell medicin, men gav få praktiska behandlingar på länge; åderlåtning fortsatte in på 1800-talet.

    Jämför med [Vesalius anatomi 1543](#vesalius-anatomi-1543), som hundra år tidigare rättade Galenos anatomi.

inbordeskriget-1642:
  period: 1640
  label: "Inbördeskriget 1642"
  title: "Engelska inbördeskriget 1642"
  wiki:
    - "sv:Engelska inbördeskriget"
  text: |
    Det **engelska inbördeskriget** (1642–1651) stod mellan kung **[Karl I](#karl-i)** och **parlamentet**. Grundfrågan var vem som hade makten: kungen menade att han styrde av Guds nåde och kunde ta ut skatter utan parlamentets samtycke; parlamentet ansåg att det måste godkänna skatter och lagar. Till detta kom religion: **puritaner** (stränga protestanter) misstänkte att kungen ville föra kyrkan mot katolicismen.

    Karl styrde 1629–1640 utan parlament. När han behövde pengar till krig mot Skottland måste han kalla in det, och konflikten eskalerade. 1642 gick kungen i krig. Kungens anhängare kallades *kavaljerer*, parlamentets *rundhuvuden* (efter puritanernas korta frisyrer).

    Parlamentet skapade 1645 en professionell armé, **New Model Army**, där befordran byggde på förmåga snarare än börd; med den vann man. Uppskattningsvis 200 000 dog i England, Skottland och Irland av strider och sjukdomar – i England sannolikt en större andel av befolkningen än i första världskriget. Kriget slutade med [kungens avrättning 1649](#karl-i-avrattas-1649) och [Cromwells](#cromwell) styre (se nästa punkter).

karl-i-avrattas-1649:
  period: 1640
  label: "Karl I avrättas 1649"
  title: "Karl I avrättas 1649"
  wiki:
    - "sv:Karl I av England"
  text: |
    **Karl I** (kung av England, Skottland och Irland 1625–1649) förlorade inbördeskriget mot parlamentet ([se 1642](#inbordeskriget-1642)). Han fortsatte att förhandla med olika sidor och startade ett nytt krig 1648 med skotsk hjälp, vilket övertygade arméledningen om att han inte gick att lita på.

    Armén rensade parlamentet från kungavänliga ledamöter, och det kvarvarande ”rumpparlamentet” ställde kungen inför rätta för förräderi mot sitt eget folk. Det var unikt: aldrig tidigare hade en regerande monark dömts av en domstol inför offentligheten. Karl vägrade erkänna domstolen. Han halshöggs utanför Banqueting House i London den 30 januari 1649.

    Monarkin och överhuset avskaffades och England blev republik (”the Commonwealth”), snart lett av **[Oliver Cromwell](#cromwell)**. Avrättningen chockade Europa och fick efterföljd: [Ludvig XVI avrättades i franska revolutionen 1793](#ludvig-xvi-avrattas-1793). Monarkin återupprättades 1660 (se [Restaurationen](#restaurationen-1660)), men principen att kungen står under lag och parlament levde vidare.

cromwell:
  period: 1640
  label: "Cromwell"
  title: "Oliver Cromwell"
  wiki:
    - "sv:Oliver Cromwell"
  text: |
    **Oliver Cromwell** (1599–1658) var en puritansk lantadelsman och parlamentsledamot som blev parlamentsarméns främste general i engelska inbördeskriget ([se 1642](#inbordeskriget-1642)). Han byggde upp disciplinerat kavalleri, kallat *Ironsides*, och var central i den nya professionella armén.

    Han drev på [avrättningen av Karl I 1649](#karl-i-avrattas-1649) och ledde sedan erövringen av Irland 1649–50. Där massakrerades tusentals försvarare och civila i städerna Drogheda och Wexford, och stora mängder katolsk jord konfiskerades och gavs till protestanter – ett trauma som präglat irländsk historia sedan dess. Han besegrade också skottarna.

    1653 upplöste Cromwell parlamentet och blev **Lord Protector** – i praktiken militärdiktator. Han förbjöd många nöjen som puritanerna såg som syndiga, men tillät judar att åter bosätta sig i England. Hans utrikespolitik gjorde England till en sjömakt (Navigationsakten 1651 riktades mot holländsk handel). Han dog 1658, sonen Richard misslyckades, och [1660 återinsattes kungadömet](#restaurationen-1660). Cromwells kropp grävdes upp och ”avrättades” postumt.

restaurationen-1660:
  period: 1660
  label: "Restaurationen 1660"
  title: "Restaurationen 1660"
  wiki:
    - "en:Stuart Restoration"
    - "sv:Karl II av England"
  text: |
    **Restaurationen** kallas återinförandet av kungadömet i England, Skottland och Irland 1660. Efter [avrättningen av Karl I 1649](#karl-i-avrattas-1649) hade landet varit republik, i praktiken styrd av [Oliver Cromwell](#cromwell) som militärdiktator. När han dog 1658 klarade sonen Richard inte uppgiften, och landet hotades av kaos mellan arméfraktioner.

    Generalen George Monck marscherade till London och lät välja ett nytt parlament, som bjöd hem den landsflyktige sonen **Karl II** (kung 1660–1685). Han hade levt i exil i Frankrike och Nederländerna. Han lovade amnesti för de flesta, men ett tiotal av dem som dömt hans far avrättades.

    Karl II kallades ”den glade monarken”: teatrarna, som puritanerna stängt, öppnade igen, nu med kvinnliga skådespelare för första gången. [Royal Society](#royal-society) grundades (se nästa punkt). Men grundfrågan om makten mellan kung och parlament var inte löst. Den avgjordes i **[ärorika revolutionen](#glorious-revolution-1688)** 1688, då Karls katolske bror Jakob II avsattes och parlamentets överhöghet slogs fast – grunden till Storbritanniens parlamentariska system.

royal-society:
  period: 1660
  label: "Royal Society"
  title: "Royal Society grundas 1660"
  wiki:
    - "sv:Royal Society"
    - "en:Philosophical Transactions of the Royal Society"
  text: |
    **Royal Society** grundades i London i november 1660 av en grupp naturforskare, bland andra arkitekten Christopher Wren och kemisten Robert Boyle. Kung Karl II gav sällskapet kungligt privilegium 1662. Det är världens äldsta ännu verksamma vetenskapsakademi.

    Idén kom från filosofen Francis Bacon (död 1626): kunskap ska byggas på experiment och observation, inte på auktoriteter som Aristoteles. Sällskapets motto *Nullius in verba* betyder ungefär ”lita inte på någons ord”. På mötena utfördes experiment inför ledamöterna; Robert Hooke var anställd för att ta fram demonstrationer, och han publicerade 1665 *[Micrographia](#hookes-micrographia-1665)* med bilder från mikroskop – det var där ordet ”cell” myntades.

    1665 startade sällskapet *Philosophical Transactions*, världens äldsta fortlöpande vetenskapliga tidskrift – början på systemet med publicering och granskning som forskningen än idag bygger på. Newtons *[Principia](#newton-principia-1687)* 1687 publicerades med sällskapets stöd, och Newton blev senare dess ordförande. Jämför: franska vetenskapsakademien grundades 1666, Kungliga Vetenskapsakademien i Sverige 1739.

    Se även [Restaurationen 1660](#restaurationen-1660), då sällskapet grundades under Karl II.

pesten-i-london-1665-branden-1666:
  period: 1660
  label: "pesten i London 1665, branden 1666"
  title: "Pesten i London 1665 och branden 1666"
  wiki:
    - "en:Great Plague of London"
    - "sv:Branden i London 1666"
  text: |
    **Den stora pesten i London** 1665–66 var det sista stora utbrottet av böldpest i England. Pest sprids av bakterien *Yersinia pestis* via loppor på råttor och människor; detta visste ingen då. Uppskattningsvis 75 000–100 000 dog i London, ungefär en fjärdedel av stadens befolkning. De rika, inklusive kungen, flydde staden. [Isaac Newton](#newton-gravitation-och-prisman-1666) lämnade Cambridge för landet och utvecklade där mycket av sin matematik och optik. Jämför med [digerdöden 1347–51](#digerdoden-1348), som dödade kanske en tredjedel till hälften av Europas befolkning.

    I september 1666 började det brinna i ett bageri på Pudding Lane. Under fyra dagar, med torr blåst, förstördes omkring 13 000 hus, 87 kyrkor och den medeltida St Paul's-katedralen – stora delar av City of London. Officiellt dog bara ett fåtal, men den verkliga siffran är okänd.

    Staden byggdes upp med tegel och sten i stället för trä. Christopher Wren ritade nya St Paul's och ett femtiotal kyrkor. Branden gav också upphov till moderna brandförsäkringsbolag. Pesten återkom inte till London i stor skala efter 1666.

glorious-revolution-1688:
  period: 1680
  label: "Glorious Revolution 1688"
  title: "Ärorika revolutionen 1688"
  wiki:
    - "sv:Ärorika revolutionen"
    - "sv:Vilhelm III av England"
  text: |
    Den **ärorika revolutionen** (Glorious Revolution) var när den engelske kungen **Jakob II** avsattes. Jakob var katolik i ett protestantiskt land och styrde alltmer utan parlamentet. När han 1688 fick en son, och en katolsk kungadynasti hotade, bjöd ledande politiker in hans protestantiska svärson **Vilhelm av Oranien**, ledare för Nederländerna.

    Vilhelm landsteg med uppskattningsvis 15 000–20 000 man. Jakobs armé föll samman genom avhopp, och Jakob flydde till Frankrike nästan utan strid i England (i Irland och Skottland blev det däremot krig). Vilhelm och hans fru Maria, Jakobs dotter, blev gemensamma regenter.

    Betydelsen: parlamentet hade nu i praktiken valt kung på egna villkor. Kungamakten blev beroende av parlamentet, särskilt för pengar och armé. Det var starten på den konstitutionella monarkin som Storbritannien har idag, och kontrasten mot Frankrikes envälde under [Ludvig XIV](#ludvig-xiv-1643) blev tydlig. Se även [Bill of Rights 1689](#bill-of-rights).

bill-of-rights:
  period: 1680
  label: "Bill of Rights"
  title: "Bill of Rights 1689"
  wiki:
    - "en:Bill of Rights 1689"
    - "sv:Ärorika revolutionen"
  text: |
    Den engelska **Bill of Rights** antogs 1689 som villkor när Vilhelm III och Maria II tog över tronen efter [ärorika revolutionen](#glorious-revolution-1688) (se den). Det är en lag som begränsar kungens makt och slår fast parlamentets rättigheter.

    Huvudpunkter: kungen får inte ta ut skatt eller hålla en [stående armé](#staende-arme) i fredstid utan parlamentets godkännande, inte upphäva lagar på egen hand, och val till parlamentet ska vara fria. Det ska råda yttrandefrihet i parlamentets debatter, och grymma och ovanliga straff förbjuds. Katoliker utestängdes från tronen.

    Det var inte en demokrati – bara en liten del av männen fick rösta – men principen att makten är bunden av lag blev bestående. Lagen gäller fortfarande i Storbritannien. Den inspirerade amerikanernas Bill of Rights 1791 (de tio första tilläggen till [USA:s författning](#usa-s-konstitution-1787)), och formuleringen om grymma straff finns kvar där nästan ordagrant. Jämför Sveriges regeringsform 1809.

newton-principia-1687:
  period: 1680
  label: "Newton: Principia 1687"
  title: "Newtons Principia 1687"
  wiki:
    - "sv:Philosophiae Naturalis Principia Mathematica"
    - "sv:Isaac Newton"
  text: |
    **Isaac Newton** (1643–1727) var professor i matematik i Cambridge. 1687 publicerade han *Philosophiæ Naturalis Principia Mathematica* (Naturfilosofins matematiska principer), ofta kallad Principia, på latin och i tre band.

    Där formulerade han de tre rörelselagarna (tröghet, kraft = massa × acceleration, verkan och motverkan) och den allmänna [gravitationslagen](#gravitationslagen) (se den). Med dessa kunde han härleda [Keplers lagar](#kepler-planetlagarna-1609) för planetbanorna och förklara tidvatten och kometers banor – samma lagar gällde på jorden och i rymden. Det var nytt: sedan Aristoteles hade man trott att himlen följde andra regler.

    Principia skrevs mest i geometriskt språk, inte i den [differentialkalkyl](#newton-och-leibniz-differentialkalkyl) Newton själv utvecklat. Boken blev grunden för fysiken i drygt 200 år, tills [relativitetsteorin](#einstein-relativitetsteorin-1905) och kvantmekaniken på 1900-talet visade dess gränser. Newtons mekanik räcker dock än idag för det mesta inom teknik, och för att räkna ut rymdsonders banor. Den gav också upplysningstiden dess förebild: att naturen följer förnuftiga, matematiska lagar.

storbritannien-bildas-1707:
  period: 1700
  label: "Storbritannien bildas 1707"
  title: "Storbritannien bildas 1707"
  wiki:
    - "sv:Unionsakten 1707"
    - "sv:Kungariket Storbritannien"
  text: |
    England och Skottland hade haft samma kung sedan 1603, då Skottlands kung Jakob VI även ärvde Englands tron. Men de var fortfarande två skilda stater med egna parlament, lagar och ekonomier.

    1707 trädde **unionsakterna** i kraft: de två parlamenten slogs ihop till ett i London, och det nya kungariket **Storbritannien** bildades. Skottland behöll sin egen kyrka (presbyteriansk), sitt rättssystem och sina universitet. Ett skäl var ekonomiskt: Skottlands försök att grunda en koloni i Darién i Panama på 1690-talet hade misslyckats katastrofalt och kostat uppskattningsvis en fjärdedel av landets kapital. Unionen gav tillgång till Englands handel och kolonier, och skulden ersattes delvis. För England var målet att stänga en bakdörr för Frankrike och för de [landsflyktiga Stuartarna](#glorious-revolution-1688).

    Unionen var impopulär i Skottland och ledde till jakobitiska uppror (se [Culloden 1746](#jakobitupproret-culloden-1746)). Med Irland tillkom 1801 Förenade kungariket. Skottland fick ett eget parlament igen 1999 och röstade 2014 i en folkomröstning nej till självständighet (55 % mot 45 %).

newcomens-angmaskin-1712:
  period: 1700
  label: "Newcomens ångmaskin 1712"
  title: "Newcomens ångmaskin 1712"
  wiki:
    - "sv:Newcomens ångmaskin"
    - "sv:Thomas Newcomen"
  text: |
    **Thomas Newcomen** (1664–1729) var en järnhandlare från Devon i England. 1712 byggde han den första fungerande ångmaskinen i praktiskt bruk, vid en kolgruva i Dudley. Den användes för att pumpa vatten ur gruvor – grundvatten var det stora hindret för att gräva djupare.

    Principen: ånga fylls i en cylinder, sedan sprutas kallt vatten in så att ångan kondenserar och det blir undertryck. Lufttrycket pressar då ner kolven, som via en vippbalk drar pumpstången. Det kallas atmosfärisk maskin. Effekten var uppskattningsvis 4–5 hästkrafter, och verkningsgraden extremt låg, under 1 % – den slösade kol eftersom cylindern kyldes och värmdes varje slag. Vid kolgruvor spelade det mindre roll.

    Ungefär 60 år senare förbättrade **James Watt** konstruktionen med en [separat kondensor (1769)](#watts-angmaskin-1769), vilket gav ungefär tre till fyra gånger bättre bränsleekonomi och gjorde ångmaskinen användbar i fabriker. Det blev motorn i den [industriella revolutionen](#industriella-revolutionen-watts). Jämför [Thomas Saverys enklare ångpump 1698](#saverys-angpump-1698). [Se även ångmaskinen](#angmaskinen).

sodersjobubblan-1720:
  period: 1720
  label: "Södersjöbubblan 1720"
  title: "Södersjöbubblan 1720"
  wiki:
    - "sv:Södersjöbubblan"
    - "en:South Sea Company"
  text: |
    **Söderhavskompaniet** (South Sea Company) var ett brittiskt aktiebolag grundat 1711. Det tog över en stor del av statsskulden i utbyte mot ränta från staten och monopol på handel med Spanska Sydamerika, bland annat rätten att sälja slavar (asiento, se [Utrechtfreden](#utrechtfreden-1713)). Handeln var i verkligheten liten.

    1720 erbjöd kompaniet att ta över ännu mer av statsskulden mot nya aktier. Med hjälp av mutor till politiker, rykten och lån för att köpa aktier steg kursen från cirka 128 pund i januari till omkring 1 000 pund i juni – nästan åtta gånger. Massor av andra bolag startades med vaga affärsidéer. Sedan rasade kursen till under 200 pund på hösten. Tusentals förlorade sina besparingar; även Isaac Newton förlorade, enligt uppgift 20 000 pund.

    Det blev en av världens första stora börskrascher. En parlamentarisk utredning avslöjade korruption, och Robert [Walpole](#walpole) (se Walpole) fick i uppdrag att reda upp. Den så kallade Bubble Act försvårade bolagsbildning i hundra år. Jämför samtidiga [Mississippibubblan](#mississippi-bubblan) i Paris, IT-bubblan 2000 och finanskrisen 2008.

walpole:
  period: 1720
  label: "Walpole"
  title: "Robert Walpole"
  wiki:
    - "sv:Robert Walpole"
  text: |
    **Robert Walpole** (1676–1745) brukar räknas som Storbritanniens förste premiärminister, en titel som formellt inte fanns. Han ledde regeringen 1721–1742, i 21 år, vilket fortfarande är rekord.

    Han kom till makten efter [Södersjöbubblan 1720](#sodersjobubblan-1720) (se den), som han hanterade genom att stabilisera finanserna och skydda både kungen och ledande politiker från skandalen. Kungarna Georg I och Georg II var från tyska Hannover; Georg I talade dålig engelska och deltog sällan i regeringsmötena. Därför kunde en minister som hade parlamentets stöd ta över den praktiska makten. Walpole höll majoriteten genom att dela ut tjänster och pengar – kritiker kallade det korruption.

    Hans politik var låga skatter, fred och handel; han höll Storbritannien utanför krig i nästan 20 år. Han flyttade in i 10 Downing Street 1735, som fortfarande är premiärministerns bostad. Under hans tid uppstod idén att regeringen måste ha förtroende i parlamentet – grunden för det parlamentariska system som Sverige och många andra länder har idag.

    Jämför med Sveriges [frihetstiden](#frihetstiden), då riksdagen styrde.

jakobitupproret-culloden-1746:
  period: 1740
  label: "Jakobitupproret, Culloden 1746"
  title: "Jakobitupproret och Culloden 1746"
  wiki:
    - "sv:Slaget vid Culloden"
    - "sv:Jakobitism"
  text: |
    **Jakobiterna** var anhängare av den katolska Stuart-släkten, som förlorat Storbritanniens tron i [ärorika revolutionen 1688](#glorious-revolution-1688) (se den). Namnet kommer av Jacobus, latin för Jakob, efter den avsatte Jakob II. De gjorde flera uppror, med starkast stöd bland klanerna i skotska högländerna.

    1745 landsteg Jakob II:s sonson **Charles Edward Stuart**, "Bonnie Prince Charlie", i Skottland, samlade klaner, tog Edinburgh och marscherade ända till Derby, cirka 200 km från London. Där vände armén, som saknade stöd i England. Den 16 april 1746 krossades den vid **Culloden** nära Inverness: cirka 5 000 utmattade jakobiter mot cirka 8 000 regeringssoldater under hertigen av Cumberland. Slaget tog under en timme; uppskattningsvis 1 500–2 000 jakobiter dödades, mot cirka 50 regeringssoldater.

    Det var det sista fältslaget på brittisk mark. Efteråt förbjöds högländernas vapen, kilten och tartan en tid, och klansystemet bröts ner. Charles flydde till Frankrike. Under senare 1700-tal och 1800-tal tvingades många höglänningar bort från sin mark (Highland Clearances) och emigrerade till Kanada och USA.

    Se även [Storbritannien bildas 1707](#storbritannien-bildas-1707), unionen som jakobiterna ville upplösa.

industriella-revolutionen-watts:
  period: 1760
  label: "Industriella revolutionen: Watts ångmaskin 1769, spinning jenny"
  title: "Industriella revolutionen börjar: ångmaskin och spinnmaskin"
  wiki:
    - "sv:Industriella revolutionen"
    - "sv:James Watt"
    - "en:Spinning jenny"
  text: |
    Den **industriella revolutionen** är övergången från handarbete och muskelkraft till maskiner drivna av vatten och kol. Den började i Storbritannien kring 1760–1780, delvis för att landet hade billigt kol, höga löner och ett växande handelsimperium.

    Först kom textilindustrin. **[Spinning jenny](#spinning-jenny-1764)**, uppfunnen av James Hargreaves runt 1764, lät en spinnare driva åtta spolar samtidigt i stället för en – senare över hundra. Richard Arkwrights vattendrivna spinnmaskin (1769) flyttade arbetet från hemmen in i fabriker. Bomullstyg blev billigt; råvaran kom från slavplantager i Amerika.

    [Ångmaskinen](#angmaskinen) fanns redan: [Newcomens maskin från 1712](#newcomens-angmaskin-1712) pumpade vatten ur gruvor men slösade enormt med kol. **[James Watt](#watts-angmaskin-1769)** patenterade 1769 en separat kondensor, så att cylindern inte behövde kylas och värmas varje slag. Det minskade kolåtgången till ungefär en fjärdedel. Med kompanjonen Boulton sålde han från 1775 maskiner som också kunde driva fabriker. Enheterna watt och hästkraft (som Watt själv införde för att marknadsföra maskinen) påminner om honom. Inom 70 år drev ånga järnvägar och fartyg.

amerikanska-kolonier-forlorade-1783:
  period: 1780
  label: "Amerikanska kolonier förlorade 1783"
  title: "Storbritannien förlorar de amerikanska kolonierna 1783"
  wiki:
    - "sv:Amerikanska frihetskriget"
    - "en:Treaty of Paris (1783)"
  text: |
    Det amerikanska frihetskriget började 1775. Storbritannien hade världens starkaste flotta och skickade som mest omkring 50 000 soldater, inklusive tyska legosoldater från Hessen. Men det var svårt att styra ett krig 5 000 km bort, med veckors fördröjning för varje order, mot kolonier med omkring 2,5 miljoner invånare.

    Vändpunkten var 1777 när en brittisk armé kapitulerade vid Saratoga. Det fick Frankrike, ivrigt att hämnas [sjuårskriget](#sjuarskriget-slut-1763), att gå in i kriget 1778; Spanien och Nederländerna följde. 1781 blev en brittisk armé på omkring 8 000 man under Cornwallis instängd vid **Yorktown** i Virginia av amerikanska och franska trupper och en fransk flotta, och kapitulerade.

    I Parisfreden 1783 erkände Storbritannien [USA:s självständighet](#sjalvstandighetsforklaringen-1776), med gräns vid Mississippi. Omkring 60 000 lojalister, kolonister som stött kronan, flydde främst till Kanada. Storbritannien vände i stället blicken mot Indien och senare Australien. För Frankrike blev segern dyr: krigsskulden bidrog till statsbankrutten som utlöste [revolutionen 1789](#franska-revolutionen-1789).

wilberforce-mot-slavhandeln:
  period: 1780
  label: "Wilberforce mot slavhandeln"
  title: "Wilberforce och kampen mot slavhandeln"
  wiki:
    - "sv:William Wilberforce"
    - "en:Abolitionism in the United Kingdom"
  text: |
    Den **[transatlantiska slavhandeln](#atlantisk-slavhandel-borjar)** förde mellan 1500- och 1800-talet uppskattningsvis 12,5 miljoner afrikaner över Atlanten; omkring 1,8 miljoner dog på vägen. Brittiska fartyg var på 1700-talet de största aktörerna, och [sockerplantagerna i Karibien](#sockerplantager-och-slaveri-i-karibien) gav enorma vinster.

    **William Wilberforce** (1759–1833) var en ung, rik parlamentsledamot som efter en religiös omvändelse blev rörelsens röst i parlamentet från 1787. Bakom honom stod kväkare och aktivister som Thomas Clarkson, som samlade bevis från slavskepp, och tidigare förslavade som Olaudah Equiano, vars självbiografi 1789 blev en storsäljare. Rörelsen uppfann mycket av dagens kampanjteknik: massnamninsamlingar, konsumentbojkott av slavodlat socker (uppskattningsvis 300 000 hushåll deltog) och ett emblem med en fjättrad slav.

    Wilberforce lade fram lagförslag år efter år från 1791. Först 1807 förbjöds slavhandeln ([se 1807](#slavhandel-forbjuden-1807)), och [slaveriet självt i brittiska kolonier avskaffades genom en lag 1833](#slaveriet-avskaffas-1833) – som klubbades strax efter hans död.

trafalgar-1805:
  period: 1800
  label: "Trafalgar 1805"
  title: "Slaget vid Trafalgar 1805"
  wiki:
    - "sv:Slaget vid Trafalgar"
    - "sv:Horatio Nelson"
  text: |
    1805 planerade [Napoleon](#napoleon) att invadera England med en armé på omkring 200 000 man i lägren vid Boulogne. För det behövde han kontroll över Engelska kanalen, och därför var den brittiska flottan det stora hindret.

    Den 21 oktober 1805 möttes vid Kap Trafalgar utanför sydvästra Spanien en brittisk flotta på 27 linjeskepp under viceamiral **Horatio Nelson** och en fransk-spansk flotta på 33 under Villeneuve. Linjeskepp var segelfartyg med upp till över 100 kanoner. Nelson bröt mot den gamla taktiken att segla parallellt och skjuta bredsidor; han anföll i två kolonner rakt in i fiendelinjen och splittrade den. Omkring 22 fransk-spanska fartyg erövrades eller förstördes, inget brittiskt. Nelson själv sköts av en fransk prickskytt och dog under slaget.

    Napoleon hade redan gett upp invasionen och vann två månader senare sin största landseger vid Austerlitz. Men Trafalgar gav Storbritannien herravälde till sjöss i ett sekel och tvingade Napoleon att i stället försöka strypa Englands handel med kontinentalsystemet, som ledde till [krigen i Spanien](#napoleon-i-spanien-1808) och [Ryssland](#napoleon-i-moskva-1812).

slavhandel-forbjuden-1807:
  period: 1800
  label: "slavhandel förbjuden 1807"
  title: "Storbritannien förbjuder slavhandeln 1807"
  wiki:
    - "en:Slave Trade Act 1807"
    - "en:West Africa Squadron"
  text: |
    Efter 20 års kampanj av William Wilberforce, kväkare och tidigare förslavade (se [Wilberforce mot slavhandeln](#wilberforce-mot-slavhandeln)) antog brittiska parlamentet i mars 1807 *Slave Trade Act*. Den förbjöd brittiska undersåtar att köpa, transportera eller sälja förslavade människor. Under decenniet innan hade brittiska fartyg fört uppskattningsvis 30 000–40 000 afrikaner per år över Atlanten. USA förbjöd import av slavar samma år, från 1808.

    Förbudet gällde handeln, inte slaveriet. Omkring 700 000 människor förblev slavar i de brittiska kolonierna fram till [avskaffandet 1833–1838](#slaveriet-avskaffas-1833), då slavägarna – inte slavarna – fick 20 miljoner pund i ersättning, omkring 40 procent av statens årsbudget.

    Storbritannien började sedan driva förbudet globalt. Royal Navys **Västafrikanska skvadron** patrullerade kusten och stoppade uppskattningsvis 1 600 slavskepp och befriade omkring 150 000 människor 1808–1860, varav många sattes i land i [Sierra Leone](#sierra-leone-grundas). Ändå fortsatte smugglingen till Brasilien och Kuba länge; Brasilien avskaffade slaveriet sist i Amerika, 1888.

waterloo-1815:
  period: 1800
  label: "Waterloo 1815"
  title: "Slaget vid Waterloo 1815"
  wiki:
    - "sv:Slaget vid Waterloo"
    - "sv:De hundra dagarna"
  text: |
    Efter [katastrofen i Ryssland 1812](#napoleon-i-moskva-1812) och nederlaget vid Leipzig 1813 tvingades Napoleon abdikera 1814 och skickades i exil på ön Elba utanför Italien. I mars 1815 rymde han, landsteg i Frankrike och tog makten igen utan strid – början på de så kallade **hundra dagarna**.

    Den 18 juni 1815 möttes han vid Waterloo, söder om Bryssel. Napoleon hade omkring 73 000 man. Mot honom stod en brittisk-nederländsk-tysk armé på ungefär 68 000 under hertigen av **Wellington**, och under dagen anlände omkring 50 000 preussare under Blücher. Wellingtons trupper höll stånd mot franska anfall hela eftermiddagen tills preussarna slog in i Napoleons flank. Sammanlagt stupade eller sårades uppskattningsvis 45 000–50 000 man på en enda dag.

    Napoleon abdikerade igen och förvisades till den avlägsna ön Sankt Helena i södra Atlanten, där han dog 1821. Wienkongressen ([se 1815](#wienkongressen-1815)) kunde slutföra sin nyordning av Europa, och det blev inget stort krig mellan stormakterna förrän Krimkriget 1853. ”Att möta sitt Waterloo” betyder i dag att lida slutgiltigt nederlag.

jarnvag-liverpoolmanchester-1830:
  period: 1820
  label: "Järnväg Liverpool–Manchester 1830"
  title: "Järnvägen Liverpool–Manchester 1830"
  wiki:
    - "en:Liverpool and Manchester Railway"
    - "sv:Stephensons Rocket"
  text: |
    Den 15 september 1830 öppnades järnvägen mellan hamnstaden **Liverpool** och textilstaden **Manchester**, 56 km. Det var världens första järnväg som helt drevs med ånglok (inga hästar), hade dubbelspår, tidtabell och tog både passagerare och gods.

    Vilka lok som skulle användas avgjordes i en tävling 1829, **Rainhilltävlingen**, som vanns av **Robert Stephensons** lok *[Rocket](#stephensons-rocket-1829)* med en toppfart på ca 45 km/h. Resan som med hästdragen diligens tagit ca 4–5 timmar tog nu under två. Redan första året reste över 400 000 passagerare med banan. Vid invigningen blev parlamentsledamoten William Huskisson påkörd och dödad – en av de första dödsolyckorna med tåg.

    Framgången utlöste en järnvägsboom: Storbritannien hade omkring 10 000 km järnväg 1850. Järnvägen sänkte transportkostnader drastiskt, skapade nationella marknader och krävde standardiserad tid i hela landet (”järnvägstid”) – före detta hade varje stad sin egen lokaltid. Sverige fick sina första stambanor på 1850–60-talen, och [telegrafen](#telegraf) byggdes ofta längs järnvägsspåren.

slaveriet-avskaffas-1833:
  period: 1820
  label: "slaveriet avskaffas 1833"
  title: "Slaveriet avskaffas i Brittiska imperiet 1833"
  wiki:
    - "en:Slavery Abolition Act 1833"
    - "sv:William Wilberforce"
  text: |
    Storbritannien hade varit en av de största aktörerna i den atlantiska slavhandeln, där uppskattningsvis 12,5 miljoner afrikaner skeppades till Amerika mellan 1500- och 1800-talet. En folkrörelse ledd av bl.a. kväkare och parlamentsledamoten **[William Wilberforce](#wilberforce-mot-slavhandeln)** fick först själva *handeln* med slavar [förbjuden 1807](#slavhandel-forbjuden-1807).

    Genom **Slavery Abolition Act** 1833 (i kraft 1834) avskaffades slaveriet i större delen av imperiet. Cirka 800 000 människor, främst på sockerplantagerna i Västindien, frigavs – men tvingades först arbeta vidare som ”lärlingar” i några år. Plantageägarna fick 20 miljoner pund i kompensation, cirka 40 % av statens årliga budget; lånet för detta betalades av den brittiska staten först 2015. De förslavade själva fick ingenting.

    Britterna använde sedan sin flotta för att bekämpa slavhandel på haven. Andra länder följde efter: Frankrike 1848, Sverige på Saint-Barthélemy 1847, USA 1865 efter inbördeskriget och [Brasilien som sista land i Amerika 1888](#brasilien-avskaffar-slaveriet-1888).

irlandska-svalten-1845:
  period: 1840
  label: "Irländska svälten 1845"
  title: "Den stora svälten på Irland 1845–1852"
  wiki:
    - "sv:Den stora svälten på Irland"
  text: |
    Irland var på 1840-talet en del av Storbritannien, med cirka 8,5 miljoner invånare. Det mesta av jorden ägdes av ofta frånvarande, protestantiska godsägare, och miljontals katolska småbönder arrenderade små lappar mark. Den fattigaste tredjedelen levde nästan helt på **potatis**, som ger mycket föda per ytenhet.

    1845 kom **potatisbladmögel**, en svampliknande organism från Amerika, som förstörde skördarna flera år i rad. Uppskattningsvis 1 miljon människor dog av svält och följdsjukdomar som tyfus, och ytterligare cirka 1–2 miljoner [emigrerade, främst till USA](#emigration-till-amerika). Befolkningen minskade med 20–25 % på några år, och Irland har än idag färre invånare än före svälten.

    Den brittiska regeringen var präglad av tron att staten inte skulle störa marknaden; under svälten exporterades fortfarande spannmål och kött från Irland. Hjälpinsatserna var otillräckliga och ibland avvecklades de tidigt. Svälten skapade djup bitterhet mot Storbritannien och drev den irländska självständighetsrörelsen, som ledde till [Irlands frigörelse 1922](#irland-fritt-1922). Den irländska diasporan blev en stor politisk kraft i USA.

telegraf:
  period: 1840
  label: "telegraf"
  title: "Den elektriska telegrafen 1837–1866"
  wiki:
    - "sv:Telegraf"
    - "sv:Morsealfabetet"
    - "en:Transatlantic telegraph cable"
  text: |
    En **elektrisk telegraf** skickar meddelanden som strömpulser genom en tråd. Före den gick ett meddelande aldrig snabbare än en häst, ett fartyg eller en optisk signalkedja (semaforer på torn, som bara fungerade i dagsljus och klart väder).

    År 1837 patenterade britterna **William Cooke** och **Charles Wheatstone** en nåltelegraf som snart användes längs järnvägarna. Samma år utvecklade amerikanen **Samuel Morse** sitt system med en enda tråd och en kod av korta och långa pulser – **morsekoden**, i princip en tidig binär kodning av text. Hans första långdistanslinje [Washington–Baltimore öppnades 1844](#morsetelegraf-1844) med meddelandet ”What hath God wrought”.

    Nätet växte explosivt: 1851 lades en kabel under Engelska kanalen, och 1866 kom en fungerande [kabel över Atlanten](#atlantkabeln-1858). Ett meddelande London–New York som tagit ca 10 dagar med ångbåt tog nu minuter. Telegrafen kallas ibland ”det viktorianska internet”: den möjliggjorde gemensamma finansmarknader, väderprognoser, nyhetsbyråer som Reuters och styre av imperier på distans. [Telefonen följde 1876](#bells-telefon-1876).

maxwell-elektromagnetism:
  period: 1860
  label: "Maxwell: elektromagnetism"
  title: "Maxwells ekvationer 1861–1865"
  wiki:
    - "sv:James Clerk Maxwell"
    - "sv:Maxwells ekvationer"
  text: |
    **James Clerk Maxwell** (1831–1879) var en skotsk fysiker. Under 1800-talets början hade man upptäckt att elektricitet och magnetism hänger ihop: ström skapar magnetfält ([Ørsted 1820](#orsted-strom-ger-magnetism-1820)) och föränderliga magnetfält skapar ström ([Faraday 1831](#faraday-induktion-1831)). Men det saknades en samlad matematisk teori.

    Maxwell formulerade 1861–1865 en uppsättning ekvationer – idag fyra, de så kallade **Maxwells ekvationer** – som beskriver hur elektriska och magnetiska fält uppstår och förändras. Ur dem följde något oväntat: förändringar i fälten fortplantar sig som vågor, och den beräknade hastigheten var ungefär 300 000 km/s, samma som ljusets uppmätta hastighet. Maxwell drog slutsatsen att **ljus är en elektromagnetisk våg**.

    Teorin förutsade att det borde finnas andra sådana vågor med andra våglängder. [Heinrich Hertz påvisade radiovågor experimentellt 1887](#hertz-radiovagor-1887), och Marconi skickade radiosignaler över Atlanten 1901. Radio, tv, radar, mobiltelefoni, wifi och GPS bygger alla på detta. Maxwells teori var också startpunkten för [Einsteins speciella relativitetsteori 1905](#einstein-relativitetsteorin-1905). Den räknas ofta som den största fysikaliska syntesen mellan Newton och Einstein.

boerkriget-1899:
  period: 1880
  label: "Boerkriget 1899"
  title: "Andra boerkriget bryter ut 1899"
  wiki:
    - "sv:Andra boerkriget"
    - "en:Second Boer War"
  text: |
    **Boerna** var ättlingar till holländska, tyska och franska nybyggare i södra Afrika som talade det språk som blev afrikaans. De hade grundat två självständiga republiker, Transvaal och Oranjefristaten. När världens rikaste guldfyndigheter hittades i Transvaal 1886 strömmade brittiska gruvarbetare dit, och Storbritannien ville få kontroll.

    I oktober 1899 bröt kriget ut. Boerna hade bara några tiotusentals beridna soldater men tillfogade britterna pinsamma nederlag. Storbritannien satte till slut in ca 450 000 man. Boerna övergick till gerillakrig, och britterna svarade med att bränna gårdar och spärra in civila i **koncentrationsläger** – ordet blev känt då. Där dog ca 26 000 boerkvinnor och barn och uppskattningsvis 14 000–20 000 svarta afrikaner.

    Kriget slutade 1902 med brittisk seger (se [”Boerkriget”](#boerkriget) 1900–1919 och ”[Sydafrikanska unionen 1910](#sydafrikanska-unionen-1910)”). Det skadade det brittiska imperiets anseende och visade hur svårt det var att besegra gerilla.

imperiet-pa-topp:
  period: 1880
  label: "imperiet på topp"
  title: "Brittiska imperiet på sin höjdpunkt"
  wiki:
    - "sv:Brittiska imperiet"
    - "en:Pax Britannica"
  text: |
    Kring 1880–1914 var **brittiska imperiet** världens största. Det bestod av kolonier, protektorat och självstyrande ”dominions” (Kanada, Australien, Nya Zeeland, senare Sydafrika). Runt 1900 omfattade det ungefär en femtedel av jordens landyta och ca 400 miljoner människor – ”imperiet där solen aldrig går ner”.

    Grunden var industrialiseringen, världens största flotta och kontrollen över handel och finans: London var världens finanscentrum, och pundet fungerade som världsvaluta, ungefär som dollarn idag. Telegrafkablar under havet knöt samman imperiet; ett meddelande till Indien tog minuter i stället för veckor. 1897 firades drottning **Victorias** 60 år på tronen med stor imperieparad.

    Men toppen var också början på nedgången: USA och Tyskland gick om Storbritannien i industriproduktion runt 1900, [boerkriget visade](#boerkriget-1899) sårbarheten, och de två världskrigen tömde landet. Efter 1945 avvecklades imperiet, med [Indiens självständighet 1947](#sjalvstandighet-och-delning-1947) som vändpunkt.

boerkriget:
  period: 1900
  label: "Boerkriget"
  title: "Andra boerkriget 1899–1902"
  wiki:
    - "sv:Andra boerkriget"
    - "en:Second Boer War concentration camps"
  text: |
    Andra boerkriget stod mellan Storbritannien och de två **boerrepublikerna** Transvaal och Oranjefristaten – stater grundade av afrikaanstalande ättlingar till holländska nybyggare. Kärnan var kontrollen över Transvaals guldgruvor, världens rikaste.

    Efter [brittiska bakslag 1899](#boerkriget-1899) vände övermakten kriget: Storbritannien satte in ca 450 000 soldater från hela imperiet mot högst ca 80 000 boer, och 1900 föll huvudstäderna. Boerna fortsatte med gerillakrig i två år. Britterna svarade med ”bränd jord” – ca 30 000 gårdar brändes – och spärrade in civila i **koncentrationsläger**, där ca 26 000 boerkvinnor och barn och uppskattningsvis minst 14 000–20 000 svarta afrikaner dog av sjukdom och undernäring. Ca 22 000 brittiska soldater dog, de flesta av sjukdom.

    Freden i Vereeniging 1902 gjorde republikerna till brittiska kolonier, men boerna fick snabbt självstyre och 1910 bildades [Sydafrikanska unionen](#sydafrikanska-unionen-1910). Svarta afrikaner, som var majoriteten, lämnades utan politiska rättigheter. Kriget chockade Storbritannien – rekryterna var ofta undernärda – och bidrog till sociala reformer hemma.

suffragetter:
  period: 1900
  label: "suffragetter"
  title: "Suffragetterna och kvinnlig rösträtt"
  wiki:
    - "sv:Suffragetter"
    - "sv:Emmeline Pankhurst"
  text: |
    **Suffragetterna** (av engelska *suffrage*, rösträtt) var militanta brittiska kvinnorättsaktivister som krävde rösträtt för kvinnor. Organisationen **Women's Social and Political Union** grundades 1903 av **Emmeline Pankhurst** och hennes döttrar med parollen ”handling, inte ord”. De mer försiktiga, som arbetade med lagliga metoder, kallades suffragister.

    Suffragetterna avbröt möten, krossade fönster, brände postlådor och tomma byggnader. Fängslade aktivister hungerstrejkade och tvångsmatades. 1913 sprang Emily Davison ut framför kungens häst på derbyt och dog av skadorna.

    Under [första världskriget](#forsta-varldskriget) lade rörelsen ned kampanjen och kvinnor tog över många mäns jobb. 1918 fick brittiska kvinnor över 30 år rösträtt, och 1928 på samma villkor som män (från 21 år). Jämför: Nya Zeeland var först 1893, Finland 1906 (först i Europa), Norge 1913, Sverige 1919 (första val 1921), USA 1920, Frankrike först 1944 och Schweiz 1971.

forsta-varldskriget:
  period: 1900
  label: "första världskriget"
  title: "Första världskriget 1914–1918"
  wiki:
    - "sv:Första världskriget"
    - "sv:Skyttegravskrig"
  text: |
    Första världskriget stod mellan **ententen** (Storbritannien, Frankrike, Ryssland, senare Italien och från 1917 USA) och **centralmakterna** (Tyskland, Österrike-Ungern, Osmanska riket och Bulgarien). Det utlöstes av mordet i Sarajevo i juni 1914 (se ”[Sarajevo 1914](#sarajevo-1914)”), men orsakerna låg i alliansssystem, kapprustning, nationalism och kolonial rivalitet.

    Storbritannien gick med när Tyskland marscherade in i neutrala Belgien. På västfronten fastnade arméerna i **skyttegravskrig** – nedgrävda linjer från Engelska kanalen till Schweiz, där kulsprutor och artilleri gjorde anfall till slakt. Bara första dagen vid Somme 1916 förlorade britterna ca 57 000 man, varav ca 19 000 döda. Nya vapen var giftgas, stridsvagnar, flygplan och ubåtar.

    Totalt mobiliserades ca 65–70 miljoner soldater; ca 9–10 miljoner soldater och uppskattningsvis 6–8 miljoner civila dog. Fyra imperier föll: det ryska, tyska, österrikisk-ungerska och osmanska. Versaillesfreden 1919 och det bittra arvet bidrog till [andra världskriget](#andra-varldskriget) 20 år senare.

irland-fritt-1922:
  period: 1920
  label: "Irland fritt 1922"
  title: "Irländska fristaten 1922"
  wiki:
    - "sv:Irländska fristaten"
    - "en:Anglo-Irish Treaty"
  text: |
    Irland hade varit under engelsk kontroll i olika former sedan 1100-talet och ingick sedan 1801 i Storbritannien. Efter påskupproret 1916 och irländska självständighetskriget 1919–21 – ett gerillakrig mellan IRA (Irländska republikanska armén) och brittiska styrkor – slöts ett fördrag. 1922 bildades Irländska fristaten, ett självstyrande område inom det brittiska imperiet.

    Men fördraget delade ön: sex nordöstra grevskap med protestantisk majoritet, Nordirland, stannade i Storbritannien. Irländarna splittrades i en bitter inbördeskrigsstrid 1922–23 mellan de som accepterade fördraget (bl.a. **Michael Collins**, som dödades) och de som ville ha en hel republik (**Éamon de Valera**).

    Irland blev helt självständig republik 1949. Delningen ledde senare till ”[the Troubles](#nordirlandskonflikten)” i Nordirland 1968–98, med omkring 3 500 döda, som avslutades med långfredagsavtalet 1998. Gränsen på ön blev åter en het fråga under [Brexit](#brexit-2020) efter 2016.

fleming-penicillin-1928:
  period: 1920
  label: "Fleming: penicillin 1928"
  title: "Fleming upptäcker penicillinet 1928"
  wiki:
    - "sv:Penicillin"
    - "sv:Alexander Fleming"
  text: |
    Den skotske bakteriologen **Alexander Fleming** kom 1928 tillbaka från semester till sitt laboratorium i London och märkte att en mögelsvamp (Penicillium) hade förorenat en odlingsskål med bakterier – och att bakterierna runt möglet hade dött. Ämnet han kallade penicillin var det första antibiotikumet, ett medel som dödar bakterier utan att skada människan.

    Fleming lyckades inte framställa det i användbar mängd. Först kring 1940 renade **Howard Florey** och **Ernst Chain** i Oxford fram penicillin, och under [andra världskriget](#andra-varldskriget) startade [massproduktion i USA](#penicillin-massproduceras). Till D-dagen 1944 fanns omkring 2,3 miljoner doser. De tre delade Nobelpriset 1945.

    Före antibiotika kunde en skråma, en lunginflammation eller en förlossning bli dödlig. Antibiotika är en huvudorsak till att medellivslängden steg kraftigt under 1900-talet. Fleming varnade redan 1945 för resistens, att bakterier utvecklar motståndskraft – idag ett av de största hoten mot folkhälsan.

blitzen:
  period: 1940
  label: "Blitzen"
  title: "Blitzen 1940–41"
  wiki:
    - "sv:Blitzen"
    - "sv:Slaget om Storbritannien"
  text: |
    Blitzen (från tyskans Blitzkrieg, blixtkrig) var Tysklands bombkampanj mot brittiska städer från september 1940 till maj 1941. Den följde på slaget om Storbritannien sommaren 1940, då det tyska flygvapnet Luftwaffe misslyckades med att slå ut det brittiska flygvapnet RAF inför en planerad invasion.

    London bombades 57 nätter i rad. Även Coventry, Liverpool, Birmingham och andra industristäder träffades. Omkring 43 000 civila dödades och över en miljon bostäder skadades eller förstördes. Londonborna sov i tunnelbanestationer. Ett viktigt försvar var radar, en brittisk teknik som upptäckte inkommande plan på långt avstånd.

    Målet, att knäcka moralen och tvinga fram fred, misslyckades. I stället blev Blitzen en del av den brittiska självbilden (”Blitz spirit”). De allierade bombade sedan tyska städer i mycket större skala: i Hamburg 1943 dog omkring 37 000–42 000 på en vecka, i Dresden 1945 uppskattningsvis 25 000. Totalt dog omkring 400 000–600 000 tyska civila av bombningar.

    Se även [Churchill](#churchill).

churchill:
  period: 1940
  label: "Churchill"
  title: "Winston Churchill"
  wiki:
    - "sv:Winston Churchill"
  text: |
    **Winston Churchill** (1874–1965) var en brittisk konservativ politiker, soldat och författare. Han hade en ojämn karriär – han låg bakom fiaskot vid [Gallipoli 1915](#gallipoli-1915) – och var på 1930-talet en isolerad röst som [varnade för Hitler](#hitler-1933) när regeringen förde eftergiftspolitik.

    Han blev premiärminister i maj 1940, samma dag som Tyskland anföll Frankrike. Efter Frankrikes fall stod Storbritannien i ett år i praktiken ensamt mot Tyskland. Churchill vägrade förhandla om fred, och hans radiotal (”Vi ska slåss på stränderna … vi ska aldrig ge upp”) blev berömda. Han byggde alliansen med USA:s Roosevelt och, från 1941, med Stalin, och deltog i konferenserna i Teheran och Jalta som formade efterkrigsvärlden.

    Paradoxalt nog förlorade han valet 1945 mot Labour, som byggde välfärdsstaten (se [NHS 1948](#nhs-1948)). 1946 myntade han uttrycket ”[järnridån](#jarnridan)”. Han var premiärminister igen 1951–55 och fick Nobelpriset i litteratur 1953. Hans syn på det brittiska imperiet och dess kolonier, bl.a. Indien, är idag omdebatterad.

nhs-1948:
  period: 1940
  label: "NHS 1948"
  title: "NHS 1948"
  wiki:
    - "sv:National Health Service"
    - "en:Beveridge Report"
  text: |
    National Health Service (NHS) är Storbritanniens statliga sjukvårdssystem, infört 5 juli 1948. Idén kom från Beveridgerapporten 1942, där ekonomen William Beveridge föreslog ett socialt skyddsnät mot ”fem jättar”: nöd, sjukdom, okunnighet, misär och arbetslöshet. Labourregeringen som vann valet 1945 genomförde den, med hälsoministern **Aneurin Bevan** som drivande kraft.

    Principen var ny: all vård gratis för alla när den behövs, finansierad med skatter. Tidigare betalade många själva eller via försäkringar som inte täckte alla, särskilt inte kvinnor och barn. Läkarkåren var först emot. Omkring 2 600 sjukhus förstatligades.

    NHS blev en modell och en nationell symbol. Det är idag en av världens största arbetsgivare med över 1,5 miljoner anställda. Jämför med Sverige, där vården blev landstingens ansvar, och USA, som valde privata försäkringar. Samtidigt byggdes välfärdsstater ut i hela Västeuropa efter kriget.

    Jämför med [Folkhemmet, socialdemokrati](#folkhemmet-socialdemokrati).

nordirlandskonflikten:
  period: 1960
  label: "Nordirlandskonflikten"
  title: "Nordirlandskonflikten 1968–1998"
  wiki:
    - "sv:Konflikten i Nordirland"
    - "en:Good Friday Agreement"
  text: |
    [När Irland blev självständigt 1921–22](#irland-fritt-1922) stannade sex nordliga grevskap kvar i Storbritannien som **Nordirland**. Där var protestanterna, ättlingar till brittiska nybyggare från 1600-talet, i majoritet och ville vara kvar i Storbritannien (”unionister”). Den katolska minoriteten, cirka en tredjedel, ville oftast förenas med Irland (”nationalister”) och diskriminerades vid jobb, bostäder och val.

    1968 började en [medborgarrättsrörelse](#medborgarrattsrorelsen) – inspirerad av den i USA – demonstrera, och möttes av våld. 1969 skickades brittisk armé in. På ”Bloody Sunday” 1972 i Derry sköt brittiska soldater ihjäl 14 obeväpnade demonstranter. Därefter eskalerade konflikten, som på engelska kallas ”the Troubles”: väpnade grupper som katolska **IRA** (Irländska republikanska armén) och protestantiska lojalistgrupper sprängde bomber och mördade, även i England.

    På 30 år dog omkring 3 500 människor i ett område med 1,5 miljoner invånare. Långfredagsavtalet 1998 gav maktdelning mellan grupperna och avväpning. Frågan om gränsen mellan Nordirland och Irland blev sedan ett av de svåraste problemen i [Brexitförhandlingarna](#brexit-2020), eftersom en hård gräns riskerade att väcka konflikten igen.

eg-1973:
  period: 1960
  label: "EG 1973"
  title: "Storbritannien går med i EG 1973"
  wiki:
    - "en:1973 enlargement of the European Communities"
    - "sv:Brexit"
  text: |
    **EG**, Europeiska gemenskaperna, var föregångaren till EU. Kärnan var den ekonomiska gemenskapen EEC, grundad 1957 genom [Romfördraget](#romfordraget-1957) av sex länder: Frankrike, Västtyskland, Italien och Beneluxländerna. Den skapade en tullunion – inga tullar inom gemenskapen och gemensamma tullar utåt – samt en gemensam jordbrukspolitik.

    Storbritannien stod först utanför; man hade sitt samvälde (före detta kolonier) och misstrodde överstatlighet. När EEC-länderna växte snabbare än Storbritannien ansökte britterna, men Frankrikes president Charles de Gaulle lade in veto 1963 och 1967 – han såg britterna som USA:s trojanska häst. Först efter de Gaulles avgång kunde Storbritannien gå med den 1 januari 1973, samtidigt som Danmark och Irland. Norge sade nej i folkomröstning 1972.

    Redan 1975 hölls en folkomröstning om att stanna kvar, där 67 procent röstade ja. Men skepsisen levde kvar, särskilt mot överstatligheten efter [EU 1993](#eu-1993) (se det). I folkomröstningen 2016 röstade 52 procent för att lämna, och Storbritannien [gick ur den 31 januari 2020](#brexit-2020) – efter 47 års medlemskap. Sverige gick med först 1995 (se [EU 1995](#eu-1995)).

thatcher:
  period: 1980
  label: "Thatcher"
  title: "Margaret Thatcher 1979–1990"
  wiki:
    - "sv:Margaret Thatcher"
    - "en:Thatcherism"
  text: |
    **Margaret Thatcher** (1925–2013), konservativ, var Storbritanniens första kvinnliga premiärminister, 1979–1990 – den längsta sammanhängande tiden under 1900-talet. Hon tog över ett land som på 1970-talet kallats ”Europas sjuke man”: hög inflation (över 20 procent 1975), olönsamma statliga industrier, mäktiga fackföreningar och en strejkvåg vintern 1978–79, ”missnöjets vinter”.

    Hennes politik, ”thatcherismen”, gick ut på att minska statens roll: privatisering av statliga bolag som British Telecom, British Gas och British Airways, försäljning av omkring en miljon kommunala hyresbostäder till hyresgästerna, sänkta skatter, avreglering av finansmarknaden i London (”Big Bang” 1986) och lagar som försvagade facken. Gruvarbetarstrejken 1984–85, ett år lång, slutade med fackets nederlag och att de flesta kolgruvor stängdes. Arbetslösheten steg över 3 miljoner.

    Utrikespolitiskt vann hon [Falklandskriget 1982](#falklandskriget-1982) (se det) och var nära allierad med USA:s president Ronald [Reagan](#reagan), som förde liknande politik. Sovjetisk press gav henne smeknamnet ”järnladyn”. Hon var skeptisk till fördjupat EG-samarbete, och den frågan fällde henne till slut 1990, tillsammans med en impopulär kommunalskatt. Hennes politik påverkade även Labour under Tony Blair och reformer i många länder, inklusive Sverige på 1990-talet. Hon är fortfarande starkt omstridd.

falklandskriget-1982:
  period: 1980
  label: "Falklandskriget 1982"
  title: "Falklandskriget 1982"
  wiki:
    - "sv:Falklandskriget"
  text: |
    Falklandsöarna är en ögrupp i södra Atlanten med då omkring 1 800 invånare av brittisk härkomst, mest fårfarmare. De har varit brittiska sedan 1833, men Argentina, cirka 50 mil bort, gör anspråk på dem och kallar dem Malvinas.

    Argentina styrdes av en militärjunta, en diktatur som under ”det smutsiga kriget” låtit uppskattningsvis 10 000–30 000 människor ”försvinna”, och som hade en ekonomisk kris. För att samla folket bakom sig invaderade juntan öarna den 2 april 1982. [Thatcher](#thatcher) (se det) skickade en flotta på över 100 fartyg, med två hangarfartyg, 13 000 km söderut. Argentinska flygplan sänkte flera brittiska fartyg med franska Exocet-robotar; en brittisk ubåt sänkte kryssaren General Belgrano med över 300 döda. Den 14 juni kapitulerade argentinarna i huvudorten Stanley.

    Omkring 650 argentinare och 255 britter dog under de 74 dagarna. Följderna blev stora: militärjuntan föll och Argentina blev demokrati 1983, och Thatcher, som varit impopulär, vann en jordskredsseger i valet 1983. Argentina gör fortfarande anspråk på öarna; i en folkomröstning 2013 röstade öborna nästan enhälligt för att förbli brittiska.

webben-berners-lee-1989:
  period: 1980
  label: "webben (Berners-Lee 1989)"
  title: "World Wide Web 1989"
  wiki:
    - "sv:World Wide Web"
    - "sv:Tim Berners-Lee"
  text: |
    I mars 1989 skrev den brittiske fysikern och programmeraren **Tim Berners-Lee**, anställd vid partikelfysiklaboratoriet **CERN** utanför Genève, ett förslag om hur forskare skulle kunna dela dokument. Hans chef skrev ”vagt men spännande” i marginalen. 1990 byggde han, tillsammans med belgaren Robert Cailliau, de tre beståndsdelarna: språket HTML för att skriva sidor med länkar (hypertext), protokollet HTTP för att hämta dem, och URL:er som adresser. Han skrev den första webbservern och webbläsaren på en NeXT-dator. Den första webbsidan gick live i december 1990.

    Webben är alltså inte samma sak som internet: internet (se [ARPANET 1969](#arpanet-1969)) är nätet som för paketen, webben är en tjänst ovanpå. Det fanns samtidigt konkurrerande system, som Gopher från University of Minnesota. Avgörande för webben var att CERN 1993 släppte tekniken fritt utan licensavgifter, samma år som grafiska webbläsaren Mosaic gjorde den lättanvänd.

    Utvecklingen gick extremt fort: från ett fåtal servrar 1991 till omkring 10 000 1994 och miljontals runt 2000. Netscape, Amazon (1994), Google (1998) och senare [sociala medier](#sociala-medier) byggdes på webben. Berners-Lee grundade 1994 standardiseringsorganet W3C och adlades 2004. I dag finns omkring 1 miljard webbplatser, och cirka två tredjedelar av världens befolkning är uppkopplad.

irakkriget:
  period: 2000
  label: "Irakkriget"
  title: "Storbritannien och Irakkriget 2003"
  wiki:
    - "sv:Irakkriget"
    - "en:Iraq Inquiry"
    - "sv:Tony Blair"
  text: |
    I mars 2003 invaderade USA och Storbritannien Irak för att störta diktatorn **Saddam Hussein**. Storbritannien skickade omkring 45 000 soldater, den näst största styrkan. Premiärminister **Tony Blair** (Labour, 1997–2007) var USA:s närmaste allierade och motiverade kriget med att Irak hade massförstörelsevapen (kemiska och biologiska vapen) som utgjorde ett hot.

    Kriget var mycket omstritt. I februari 2003 demonstrerade uppskattningsvis en miljon människor i London – den största demonstrationen i landets historia – och FN:s säkerhetsråd gav inget uttryckligt mandat. Inga massförstörelsevapen hittades. Regeringens underlag, bland annat en rapport som påstod att Irak kunde sätta in vapen på 45 minuter, visade sig bygga på bristfällig underrättelseinformation.

    179 brittiska soldater dog innan trupperna lämnade 2009. En officiell utredning, **Chilcotrapporten** (2016), slog fast att kriget inleddes innan fredliga alternativ var uttömda och att planeringen för tiden efter invasionen var otillräcklig. Kriget skadade Blairs eftermäle och förtroendet för politiker och underrättelsetjänster för lång tid. Se även [Irak 2003](#irak-2003) under Mellanöstern.

finanskrisen-2008:
  period: 2000
  label: "finanskrisen 2008"
  title: "Finanskrisen 2008"
  wiki:
    - "sv:Finanskrisen 2007–2008"
    - "en:2008 financial crisis"
  text: |
    Finanskrisen började i USA:s bostadsmarknad. Under 2000-talet gavs bolån till hushåll med dålig betalningsförmåga (**subprime-lån**). Bankerna paketerade tusentals sådana lån till värdepapper som såldes vidare över hela världen, ofta med högsta kreditbetyg. När bostadspriserna började falla 2006–07 slutade många låntagare betala, och ingen visste riktigt vilka banker som satt på förlusterna.

    Den 15 september 2008 gick investmentbanken **Lehman Brothers** i konkurs, den största konkursen i USA:s historia. Bankerna slutade låna ut till varandra och det globala finanssystemet var nära att stanna. I Storbritannien hade banken Northern Rock redan 2007 drabbats av den första bankrusningen på över hundra år; 2008 tog staten i praktiken över Royal Bank of Scotland och en stor del av Lloyds, med statligt stöd på flera hundra miljarder pund. London som finanscentrum var extra utsatt.

    Världsekonomin krympte 2009 för första gången sedan andra världskriget; det blev den värsta krisen sedan [1930-talets depression](#depressionen). Efterverkningar blev åtstramningspolitik, [eurokrisen](#eurokrisen), nollräntor i ett decennium och en misstro mot eliter som många kopplar till [Brexit](#brexit-2020) och populismens framväxt. Jämför med [Japans krasch 1990](#bubbla-krasch-1990).

brexit-2020:
  period: 2020
  label: "Brexit 2020"
  title: "Brexit – Storbritannien lämnar EU 2020"
  wiki:
    - "sv:Brexit"
    - "en:Brexit"
  text: |
    **Brexit** (av British exit) är Storbritanniens utträde ur Europeiska unionen. Landet gick med 1973 men var alltid en motvillig medlem: det stod utanför euron och den passfria Schengenzonen. I en folkomröstning den 23 juni 2016, utlyst av den konservative premiärministern David Cameron, röstade 51,9 % för att lämna. Viktiga argument var invandringen från de nya EU-länderna efter 2004, misstro mot EU:s byråkrati i Bryssel och missnöje i avindustrialiserade områden. London och Skottland röstade för att stanna.

    Därefter följde tre och ett halvt år av politiskt kaos. Premiärminister Theresa May fick inte sitt utträdesavtal genom parlamentet. Det svåraste problemet var gränsen [mellan Nordirland och Irland](#nordirlandskonflikten), som enligt fredsavtalet 1998 skulle vara öppen. **Boris Johnson** vann valet i december 2019 på parollen "Get Brexit done", och landet lämnade formellt EU den 31 januari 2020; ett handelsavtal trädde i kraft 1 januari 2021.

    Brexit var första gången ett land lämnade EU. Ekonomer, bland annat den brittiska budgetmyndigheten OBR, bedömer att det på lång sikt sänker Storbritanniens BNP med några procent och har minskat handeln med EU. Opinionsmätningar har sedan visat en majoritet som anser att beslutet var fel. Se även [EU utvidgas 2004](#eu-utvidgas-2004) och [finanskrisen 2008](#finanskrisen-2008).

covid:
  period: 2020
  label: "covid"
  title: "Covid-19 i Storbritannien"
  wiki:
    - "en:COVID-19 pandemic in the United Kingdom"
    - "en:Partygate"
  text: |
    Covid-19 (se [Covid-19](#covid-19) under Globalt) nådde Storbritannien i början av 2020. Regeringen under **Boris Johnson** tvekade först, men införde den 23 mars 2020 en nationell nedstängning (lockdown) där folk bara fick lämna hemmet för nödvändiga ärenden. Johnson själv låg på intensivvården i april 2020. Med omkring 230 000 dödsfall med covid fram till 2023 hade landet en av de högsta dödstalen i Europa.

    Två saker stack ut. Den ena var vaccinationen: Storbritannien var i december 2020 först i världen med att godkänna och ge ett noggrant testat covidvaccin (Pfizer–BioNTechs mRNA-vaccin), och Oxford-universitetets vaccin tillsammans med AstraZeneca såldes billigt till många länder. Den andra var **Partygate**: det avslöjades att personal på premiärministerns kansli, Downing Street 10, haft fester under nedstängningen när vanliga människor inte ens fick besöka döende anhöriga. Skandalen bidrog till att Johnson tvingades avgå 2022.

    Jämför med Sverige, som valde frivilliga rekommendationer i stället för nedstängning. En officiell utredning har kritiserat att Storbritannien var dåligt förberett och agerade för sent. Se även [mRNA-vaccin](#mrna-vaccin).
