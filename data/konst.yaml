# Konsthistoria
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

ottonsk-bokmalning:
  period: 1000
  label: "Ottonsk bokmålning"
  title: "Ottonsk bokmålning – kejsarnas praktböcker"
  wiki:
    - "en:Ottonian art"
    - "en:Reichenau School"
  text: |
    **Ottonsk** kallas konsten i det tysk-romerska riket under den
    sachsiska kejsarätten (919–1024), uppkallad efter de tre kejsarna som
    hette Otto. Den mest påkostade konstformen var **bokmålning**
    (illuminering): handskrivna böcker på pergament – beredd kalv- eller
    fårhud – som dekorerades med bilder i färg och bladguld. Det var
    främst evangelieböcker och liturgiska böcker som lästes vid mässan.

    Centrum var klostret Reichenau på en ö i Bodensjön. Där gjordes runt
    år 1000 bland annat Otto III:s evangeliebok och, för [Henrik
    II](#henrik-ii-kejsare-1014), en perikopbok (texter för kyrkoårets
    söndagar). Bilderna har guldbakgrund i stället för landskap, figurerna
    är platta med stora ögon och kraftfulla handgester – de ska berätta
    och betyda, inte avbilda verkligheten. Kejsaren själv visas ofta
    tronande, krönt av Kristus eller hyllad av rikets folk, vilket gjorde
    böckerna till politisk propaganda om kungamakt av Guds nåde.

    Böckerna beställdes av kejsare och biskopar och skänktes till
    domkyrkor; en enda kunde kräva hundratals djurhudar och år av arbete.
    Stilen påverkades av Bysans – [Otto III](#otto-iii-dor-1002)s mor
    Theophanu var en bysantinsk prinsessa – och av den karolingiska
    konsten från Karl den stores tid kring år 800.

hildesheims-bronsdorrar-1015:
  period: 1000
  label: "Hildesheims bronsdörrar 1015"
  title: "Bernwards bronsdörrar i Hildesheim"
  wiki:
    - "en:Bernward Doors"
    - "en:Bernward of Hildesheim"
  text: |
    Biskop **Bernward av Hildesheim** (ca 960–1022), tidigare lärare åt
    den unge Otto III, lät gjuta ett par bronsdörrar som enligt sin
    inskrift sattes upp 1015. Varje dörrblad är omkring 4,7 meter högt och
    gjöts i ett enda stycke – en teknisk bedrift som inte gjorts i norra
    Europa sedan antiken. Dörrarna står i dag i Hildesheims domkyrka i
    Niedersachsen.

    Tekniken var **gjutning med förlorat vax**: man formade reliefen i vax
    på en lerkärna, täckte den med lera, smälte ut vaxet och hällde smält
    brons (koppar och tenn) i hålrummet. Varje dörr har åtta bildfält.
    Vänster dörr berättar Första Moseboken uppifrån och ned – skapelsen,
    syndafallet, Kain och Abel – och höger dörr Jesu liv nedifrån och upp.
    Bilderna är parade så att de speglar varandra: syndafallet står mot
    korsfästelsen, Eva mot jungfru Maria. Figurerna sticker ut nästan helt
    från bakgrunden och gestikulerar livligt, med kroppsspråk som en
    serietidning.

    Bernward hade varit i Rom och sett antika bronsdörrar och kejsarnas
    segerkolonner; han lät också gjuta en bronskolonn med Jesu liv i
    spiral efter mönster av Trajanuskolonnen. Projektet visar hur kyrkan
    kring år 1000, under [Henrik II](#henrik-ii-kejsare-1014), ville
    framstå som arvtagare till Romarriket.

byodo-in-japan:
  period: 1000
  label: "Byōdō-in (Japan)"
  title: "Byōdō-in – Fenixhallen och Amidas paradis"
  wiki:
    - "en:Byōdō-in"
    - "en:Jōchō"
  text: |
    **Byōdō-in** i Uji söder om Kyoto var ursprungligen en lantvilla som
    tillhörde den mäktige regenten Fujiwara no Michinaga (se
    [Heiantiden](#heian-tiden-fujiwara-no-michinaga)). Sonen Yorimichi
    gjorde den till buddhistiskt tempel [1052](#byodo-in-1052), och året
    därpå invigdes **Fenixhallen** (Hōōdō): en liten trähall med två
    flygelgångar som ser ut som en fågel med utbredda vingar, speglad i en
    damm.

    Bakgrunden är **Rena landets buddhism**, tron att man genom att åkalla
    buddhan Amida kan återfödas i hans paradis i väster. Många japaner
    trodde att en förfallsepok för läran (mappō) inleddes just 1052,
    vilket gjorde behovet av räddning akut. Hallen är en byggd bild av
    Amidas paradis, och dammen är den lotussjö som de troende tänkte sig.

    Inne sitter en knappt tre meter hög förgylld Amidastaty av skulptören
    **Jōchō** (död 1057). Han utvecklade tekniken *yosegi-zukuri*: statyn
    byggs av många urholkade träblock som fogas ihop, vilket gör den
    lättare, minskar sprickbildning och låter en verkstad arbeta
    parallellt – en tidig form av arbetsdelning. Väggarna bär 52 små
    träfigurer av musicerande bodhisattvor på moln. Byggnaden finns
    avbildad på det japanska 10-yensmyntet.

romansk-kyrkoarkitektur:
  period: 1020
  label: "Romansk kyrkoarkitektur"
  title: "Romansk kyrkoarkitektur"
  wiki:
    - "sv:Romansk arkitektur"
    - "en:Romanesque architecture"
  text: |
    **Romansk** stil kallas Europas kyrkoarkitektur ungefär 1000–1200.
    Namnet sattes på 1800-talet eftersom byggnaderna liknade romerska:
    **rundbågar**, tjocka murar, små fönster och tunga pelare. Munken
    Raoul Glaber skrev kring 1030 att det var som om världen klädde sig i
    en vit mantel av kyrkor – efter år 1000 byggdes det i sten överallt.

    Det nya var **stenvalven**. Tidigare kyrkor hade platt trätak som lätt
    brann. Ett tunnvalv (en utdragen halvcirkel) eller ett kryssvalv (två
    tunnvalv som korsar varandra) i sten är brandsäkert men trycker utåt
    och nedåt med stor kraft. Därför behövdes meterstjocka väggar och små
    fönsteröppningar, vilket ger det romanska rummet dess dunkla, slutna
    karaktär. Byggherrarna kunde inte räkna på hållfasthet; de byggde på
    erfarenhet och ibland rasade valven.

    Pengarna kom från kloster, biskopar och furstar. Klosterordern i Cluny
    ([Clunyreformen](#cluny-reformen)) byggde från 1088 en kyrka på
    omkring 187 meter – kristenhetens största fram till Peterskyrkan på
    1500-talet. Pilgrimsfärderna till Santiago de Compostela gav stora
    kyrkor längs vägen, och kejsarna byggde
    [Speyerdomen](#speyerdomen-paborjas). I Norden är Lunds domkyrka
    (invigd 1145) det främsta exemplet, och Sverige har hundratals
    romanska stenkyrkor på landsbygden.

kandariya-mahadeva-templet-khajuraho:
  period: 1020
  label: "Kandariya Mahadeva-templet (Khajuraho)"
  title: "Kandariya Mahadeva – berget av sten i Khajuraho"
  wiki:
    - "en:Kandariya Mahadeva Temple"
    - "en:Khajuraho Group of Monuments"
  text: |
    I Khajuraho i dagens Madhya Pradesh lät **Chandela**-dynastin, som
    styrde delar av centrala Indien, bygga ett 85-tal tempel mellan
    ungefär 950 och 1050; omkring 25 finns kvar. Det största, **Kandariya
    Mahadeva**, uppfördes kring 1030 och är tillägnat guden Shiva.

    Templet står på en hög terrass och reser sig i en serie allt högre
    torn (på sanskrit *shikhara*) upp till drygt 30 meter. De många
    småtornen som klättrar uppför huvudtornet ska föreställa Himalayas
    toppar och berget Kailash, Shivas boning. Inne leder en mörk gång till
    en liten helgedom med en *linga*, Shivas symbol. Den nordindiska
    byggstilen kallas *nagara* – jämför det sydindiska tornet på
    [Thanjavurtemplet](#cholariket-rajaraja-i-thanjavur-templet), som är
    pyramidformat.

    Fasaderna bär runt 800 skulpturer i sandsten: gudar, himmelska nymfer,
    musikanter och de berömda erotiska paren. Deras betydelse är
    omdebatterad – fruktbarhet, tantriska riter eller helt enkelt bilder
    av hela livet. Templen byggdes utan murbruk, med stenblock som låstes
    ihop med tappar. Samtidigt plundrade Mahmud av Ghazni rika tempel i
    nordväst ([Somnath 1025](#mahmud-plundrar-somnath-templet-1025));
    Khajuraho klarade sig, delvis för att det låg avsides. Jämför med att
    Europa samtidigt byggde sina första stora
    [romanska](#romansk-kyrkoarkitektur) stenkyrkor.

fan-kuan-monumentalt-landskapsmaleri:
  period: 1040
  label: "Fan Kuan: monumentalt landskapsmåleri (Kina)"
  title: "Fan Kuan och det monumentala landskapet"
  wiki:
    - "en:Fan Kuan"
    - "en:Travelers Among Mountains and Streams"
  text: |
    **Fan Kuan** (verksam ca 990–1030) var en kinesisk målare under den
    tidiga [Songdynastin](#songdynastin) som sägs ha levt avskilt i bergen
    i Shaanxi. Hans mest kända verk, *Resande bland berg och strömmar*, är
    en hängrulle i tusch och lätta färger på siden, ungefär 2 × 1 meter,
    som i dag finns i Nationalpalatsmuseet i Taipei.

    Bilden domineras av en jättelik bergsvägg som fyller två tredjedelar
    av ytan. Längst ned, nästan osynlig, går en liten karavan med
    mulåsnor. Kontrasten visar människans litenhet inför naturen – ett
    taoistiskt och konfucianskt tema om en ordnad kosmos. Bergets yta är
    byggd av tusentals små prickiga penseldrag, så kallade
    regndroppsstreck, ett av de "texturstreck" kinesiska målare utvecklade
    för att återge sten. Fan Kuans signatur upptäcktes först 1958, gömd i
    lövverket.

    Materialet var **tusch** – sot blandat med lim, pressat till en stång
    och rivet med vatten – och pensel. Målaren arbetade utan rättelser,
    eftersom tusch inte kan målas över. Landskapsmåleriet hade högst
    status i Kina och utövades av lärda ämbetsmän. Europa hade vid den här
    tiden inget självständigt landskapsmåleri alls; där var bilder nästan
    uteslutande religiösa, och landskap som eget motiv kom först på
    1400–1500-talen.

speyerdomen:
  period: 1040
  label: "Speyerdomen"
  title: "Speyerdomen – kejsarnas valvkyrka"
  wiki:
    - "en:Speyer Cathedral"
  text: |
    Domkyrkan i Speyer vid Rhen påbörjades kring 1030 av kejsar [Konrad
    II](#konrad-ii-saliska-dynastin-1024), den förste av de saliska
    kejsarna, och invigdes 1061. Den skulle vara dynastins gravkyrka, och
    åtta tyska kejsare och kungar ligger begravda där. Med en längd på
    omkring 134 meter är den världens största bevarade romanska kyrka.

    Kring 1080–1106 byggde [Henrik IV](#henrik-iv) om den och ersatte det
    platta trätaket i mittskeppet med **kryssvalv** av sten, cirka 33
    meter upp – ett av de första så stora stenvalven i Europa sedan
    romartiden. Ett kryssvalv bildas när två halvcirkelformade tunnvalv
    korsar varandra; trycket samlas då i hörnen, där tjocka pelare tar upp
    det. Väggarna av röd sandsten är därför massiva, med rundbågiga
    fönster och dekorativa blinda arkader.

    Ombyggnaden skedde mitt i
    [investiturstriden](#investiturstriden-borjar), kampen mellan kejsare
    och påve om vem som fick tillsätta biskopar. Samma Henrik IV fick 1077
    göra botgång till påven i Canossa. Den väldiga kyrkan var ett budskap:
    kejsarmakten är av Gud och lika stor som påvens. Speyerdomen har varit
    världsarv sedan 1981.

bayeuxtapeten-1070:
  period: 1060
  label: "Bayeuxtapeten (~1070)"
  title: "Bayeuxtapeten – 1066 som tecknad serie"
  wiki:
    - "sv:Bayeuxtapeten"
    - "en:Bayeux Tapestry"
  text: |
    **Bayeuxtapeten** är egentligen inte en vävd tapet utan ett broderi:
    färgat ullgarn sytt på linnetyg. Den är omkring 68 meter lång men bara
    50 centimeter hög och berättar i ett femtiotal scener hur hertig
    Vilhelm av Normandie erövrade England
    [1066](#stamford-bridge-och-hastings-1066). Den gjordes troligen inom
    ett decennium efter slaget, sannolikt i England (kanske Canterbury),
    på beställning av biskop Odo av Bayeux, [Vilhelm
    Erövrarens](#vilhelm-erovraren) halvbror.

    Berättelsen läses från vänster till höger som en serie, med latinska
    bildtexter. Den visar hur engelsmannen Harald Godwinson svär trohet
    till Vilhelm, blir kung ändå, hur normanderna bygger skepp, korsar
    kanalen med hästar, och till sist slaget vid Hastings där Harald dör –
    kanske av en pil i ögat. Halleys komet syns som ett ödesdigert tecken.
    Kanterna fylls av fabeldjur, vardagsliv och några nakna figurer.

    Det är segrarens version: Harald framställs som edsbrytare, så att
    erövringen blir rättfärdig. Som källa är tapeten ovärderlig för vapen,
    skepp, kläder och byggen på 1000-talet – bland annat vikingatida
    skeppstyper och de tidiga [normandiska borgarna](#normandiska-borgar).
    Den förvaras i dag i Bayeux i Normandie.

san-marco-i-venedig:
  period: 1060
  label: "San Marco i Venedig"
  title: "San Marco – Venedigs bysantinska kyrka"
  wiki:
    - "en:St Mark's Basilica"
  text: |
    Markuskyrkan i Venedig fick sin nuvarande form från 1063, då bygget
    påbörjades under dogen Domenico Contarini; den invigdes på 1090-talet.
    Den var dogens palatskyrka och förvarade relikerna av evangelisten
    Markus, som venetianska köpmän enligt legenden smugglat ut ur
    Alexandria år 828.

    Förebilden var Apostlakyrkan i Konstantinopel: planen är ett
    **grekiskt kors** med fyra lika långa armar och fem kupoler, en över
    mitten och en över varje arm. Det skiljer San Marco från
    västeuropeiska kyrkor med sitt långa skepp. Interiören täcks av
    omkring 8 000 kvadratmeter **mosaik** med guldgrund, utförd under
    flera århundraden. Mosaik byggs av tusentals små bitar färgat glas
    (tesserae); guldet är bladguld inlagt mellan två glasskikt, så att
    väggarna glöder i fladdrande ljus.

    Venedig var en handelsstad som levde på utbytet med Bysans, och fick
    1082 omfattande tullfrihet där
    ([handelsprivilegier](#venedig-far-handelsprivilegier-i-bysans)).
    Kyrkan blev också ett skattkammare för byten: de fyra bronshästarna på
    fasaden och mycket marmor och guldsmide fördes hit efter att [fjärde
    korståget plundrade Konstantinopel
    1204](#fjarde-korstaget-plundrar-konstantinopel).

guo-xi-tidig-var-1072:
  period: 1080
  label: "Guo Xi: Tidig vår 1072"
  title: "Guo Xi: Tidig vår (1072)"
  wiki:
    - "en:Early Spring (painting)"
    - "en:Guo Xi"
  text: |
    **Guo Xi** (ca 1020–1090) var hovmålare hos Songkejsaren Shenzong,
    samme kejsare som stödde [Wang Anshis
    reformer](#wang-anshis-reformer). Hans *Tidig vår*, daterad 1072, är
    en hängrulle i tusch och lätta färger på siden, ungefär 1,6 × 1,1
    meter, i Nationalpalatsmuseet i Taipei.

    Bilden visar ett berg som tycks röra sig: klippformationer slingrar
    sig uppåt som moln, dimma sveper mellan dem och träden har krokiga,
    klolika grenar. Små figurer – fiskare, en familj, resenärer – syns i
    vattenfåran och på stigarna. Det är vårens första dag, när naturen
    vaknar efter vintern, och berget har lästs som en bild av kejsaren
    omgiven av sina ämbetsmän.

    Guo Xis idéer är bevarade i en text som hans son sammanställde, *Höga
    budskap om skogar och källor*. Där beskrivs **tre avstånd**: att se
    ett berg underifrån (höjd), från framsidan in i djupet, och från ett
    närliggande berg ut mot fjärran (vidd). En bild kan blanda alla tre.
    Kinesisk målning använder alltså inte en enda betraktarpunkt som den
    europeiska centralperspektivet (geometrisk konstruktion med en
    flyktpunkt, utvecklad i Florens på 1400-talet); betraktaren vandrar i
    stället genom landskapet. Jämför med Fan Kuans orörliga
    [bergsmassiv](#fan-kuan-monumentalt-landskapsmaleri) en generation
    tidigare.

durhams-katedral:
  period: 1080
  label: "Durhams katedral"
  title: "Durhams katedral – revbensvalv före gotiken"
  wiki:
    - "en:Durham Cathedral"
  text: |
    Efter erövringen 1066 byggde normanderna om nästan alla stora kyrkor i
    England, både av fromhet och för att visa vem som bestämde – ungefär
    som [borgarna](#normandiska-borgar). Katedralen i Durham i nordöstra
    England påbörjades 1093 av den normandiske biskopen Vilhelm av
    Saint-Calais och stod i stort sett klar omkring 1133. Den byggdes på
    en klippa ovanför floden Wear, intill borgen, och rymde graven efter
    helgonet Cuthbert, en viktig pilgrimsort.

    Durham är känd för att ha ett av Europas tidigaste **revbensvalv**
    över ett helt kyrkskepp. Ett revbensvalv är ett kryssvalv där
    korsningslinjerna förstärks med murade bågar, "revben", som bär valvet
    medan det byggs och leder trycket ned i pelarna. Mellanrummen kan då
    muras tunnare och lättare. I mittskeppet används också några
    **spetsbågar**, som trycker mindre åt sidorna än rundbågar.

    Detta är just de två tekniker som några årtionden senare blev grunden
    för gotiken i [Saint-Denis](#saint-denis-1137-gotiken-fods). Men
    Durham är fortfarande romansk i sin helhet: väldiga runda pelare,
    omkring sju meter i omkrets, ristade med sicksack- och spiralmönster,
    och tjocka väggar. Katedralen och borgen är världsarv sedan 1986.

romanska-skulpturportaler-moissac:
  period: 1100
  label: "Romanska skulpturportaler (Moissac, Vézelay)"
  title: "Romanska portaler – Moissac och Vézelay"
  wiki:
    - "en:Abbey of Saint-Pierre, Moissac"
    - "en:Vézelay Abbey"
  text: |
    Efter romarrikets fall hade monumental stenskulptur nästan försvunnit
    i Västeuropa i sex hundra år. Kring 1100 återkom den på kyrkornas
    portaler. Fältet ovanför dörren, det halvrunda **tympanon**, fylldes
    med reliefer som alla som gick in måste passera. De flesta var
    ursprungligen målade i starka färger.

    I klosterkyrkan i **Moissac** i sydvästra Frankrike, som hörde till
    [Clunyordern](#cluny-reformen), höggs omkring 1115–1130 ett tympanon
    efter Uppenbarelseboken: en jättelik Kristus som domare, omgiven av
    evangeliernas symboldjur och 24 kungar med musikinstrument som alla
    vrider huvudet mot honom. På mittpelaren står profeten Jeremia,
    utdragen och smal som en dansare. Figurerna är inte realistiska;
    proportioner och storlek anger betydelse.

    I **Vézelay** i Burgund visar tympanon i förhallen (ca 1120–1132) hur
    Kristus sänder ut apostlarna till världens alla folk – inklusive
    fantasifolk med hundhuvuden och öron stora som filtar, tagna ur antika
    reseskildringar. Vézelay var en startpunkt för pilgrimsvägen till
    Santiago, och här predikade Bernhard av Clairvaux 1146 för [andra
    korståget](#andra-korstaget-114749). Portalen var alltså också ett
    budskap om mission och expansion.

kejsar-huizongs-akademi:
  period: 1100
  label: "Kejsar Huizongs akademi"
  title: "Kejsar Huizong och målarakademin"
  wiki:
    - "en:Emperor Huizong of Song"
  text: |
    [Huizong](#kejsar-huizong-konst) (1082–1135, kejsare 1100–1126) var
    Songdynastins kanske största konstnär och dess mest misslyckade
    härskare. Han målade själv, främst fåglar och blommor, och skapade en
    egen elegant kalligrafistil, "smalt guld". Hans *Lyckobringande
    tranor* (1112) visar tjugo tranor som cirklar över en palatsport mot
    en turkos himmel.

    Huizong omorganiserade hovets målarakademi och knöt den till
    ämbetsmannasystemet: målare fick rang och lön, och antagningsproven
    bestod i att illustrera en diktrad på ett fyndigt sätt. Idealet var
    noggrann iakttagelse – han ska ha krävt att en påfågel som klev upp på
    en stol alltid målades med vänster fot först. Den kejserliga samlingen
    katalogiserades i *Xuanhe huapu* med över 6 000 målningar, ett tidigt
    exempel på ett systematiskt museiregister.

    Samtidigt försummade Huizong riket. Han lät hämta sällsynta stenar
    från hela landet till sina trädgårdar, vilket kostade enormt och
    väckte uppror. 1127 intog jurchenfolkets Jinrike huvudstaden Kaifeng
    ([Kaifeng 1127](#jin-erovrar-kaifeng-1127)); Huizong fördes bort som
    fånge och dog i norr. Akademin återuppstod i Hangzhou under Södra Song
    och fortsatte hans stil.

saint-denis-1137-gotiken-fods:
  period: 1120
  label: "Saint-Denis 1137: gotiken föds"
  title: "Saint-Denis – gotikens födelse"
  wiki:
    - "sv:Gotik"
    - "en:Basilica of Saint-Denis"
    - "en:Abbot Suger"
  text: |
    Klosterkyrkan Saint-Denis norr om Paris var de franska kungarnas
    gravkyrka. Abboten **Suger** (ca 1081–1151), rådgivare åt två kungar,
    lät från 1137 bygga en ny västfasad och 1140–1144 ett nytt kor. Koret
    räknas som den första **gotiska** byggnaden (se [första gotiska
    kyrkan](#saint-denis-1137-forsta-gotiska-kyrkan)).

    Ordet "gotik" myntades långt senare av italienska renässansskribenter
    som ett skällsord: barbarisk stil, som gjord av goter. Gotiken
    kombinerar tre tekniker som fanns var för sig: **spetsbågen**, som
    trycker mer nedåt och mindre utåt än rundbågen och kan göras olika
    hög; **revbensvalvet**, där bärande murade bågar leder trycket till
    några få punkter; och senare **strävbågar**, utvändiga stödbågar som
    tar upp sidotrycket (se [gotisk
    byggteknik](#gotisk-byggteknik-spetsbage-stravpelare)). När väggen
    inte längre bär kan den ersättas med glas.

    Suger ville just det. Han var påverkad av en mystisk teologi där Gud
    är ljus, och beskrev sitt kor som fyllt av "underbart och oavbrutet
    ljus" genom färgade glasfönster. Han redovisade noga byggets kostnader
    och skatter i egna skrifter. Inom några årtionden spreds stilen till
    Île-de-France-katedraler som [Notre-Dame i
    Paris](#notre-dame-i-paris-paborjas-1163), Chartres och Reims – och
    den förstärkte kungamaktens anspråk, eftersom stilen var knuten till
    kungens kyrka.

angkor-wats-reliefer:
  period: 1120
  label: "Angkor Wats reliefer"
  title: "Angkor Wat och dess reliefer"
  wiki:
    - "sv:Angkor Wat"
    - "en:Angkor Wat"
  text: |
    Angkor Wat i dagens Kambodja byggdes av khmerkungen [Suryavarman
    II](#suryavarman-ii-1113-borjar-bygga-angkor) under ungefär trettio år
    från omkring 1113. Det är världens största religiösa byggnadsverk:
    hela anläggningen med vallgrav täcker omkring 1,5 × 1,3 kilometer.
    Templet var tillägnat hinduguden Vishnu och troligen också kungens
    gravmonument.

    Planen är ett **tempelberg**: fem torn, där det mittersta reser sig
    drygt 60 meter över marken, föreställer berget Meru, gudarnas boning i
    hinduisk kosmologi, och vallgraven är världshavet. Sandstenen bröts i
    Kulenbergen några mil bort och flottades på kanaler. Uppskattningsvis
    flera miljoner ton sten flyttades.

    Det yttre galleriets väggar bär **reliefer** – bilder huggna i låg
    relief direkt i stenen – som löper hundratals meter. Den mest kända,
    omkring 49 meter lång, visar "kärnandet av mjölkhavet": gudar och
    demoner drar i en jätteorm lindad kring ett berg för att vispa fram
    odödlighetens elixir. En annan visar Suryavarman II själv i parad med
    sin armé, med prinsar på elefanter och parasoller som rangtecken.
    Reliefen läses moturs, en riktning kopplad till dödsriter. Samtidigt
    byggde Europa sina första [gotiska
    kor](#saint-denis-1137-gotiken-fods); Angkor var då troligen en av
    världens största städer.

glasmalningar-i-chartres:
  period: 1140
  label: "Glasmålningar i Chartres"
  title: "Glasmålningarna i Chartres"
  wiki:
    - "en:Chartres Cathedral"
    - "en:Stained glass"
  text: |
    En **glasmålning** är ett fönster sammansatt av hundratals små bitar
    färgat glas. Glaset färgades i smältan med metalloxider – kobolt för
    blått, koppar för rött – blåstes till skivor, skars till form och fick
    detaljer som ansikten och veck målade med en brun glasfärg som brändes
    fast. Bitarna fogades med blyspröjsar och hölls på plats av en
    järnram. Tekniken beskrivs i munken Theophilus handbok från omkring
    1120-talet.

    Katedralen i Chartres sydväst om Paris har Europas största bevarade
    samling medeltida glas, och den äldsta delen hör till 1140–1150-talen:
    de tre höga fönstren i västfasaden med Jesu barndom, passion och
    släktträd, samt Madonnan kallad *La Belle Verrière*. De klarade
    branden 1194 och är kända för sitt djupa, lysande "Chartresblå".
    Resten av kyrkans omkring 170 fönster tillkom vid
    [återuppbyggnaden](#chartres-katedral-byggs-om-11941220) efter
    branden.

    Fönstren var den tidens bildskärmar: de flesta kyrkobesökare kunde
    inte läsa, och bibliska berättelser och helgonlegender visades i ruta
    efter ruta, lästa nedifrån och upp. Hantverkarskrån – bagare,
    skomakare, vinhandlare – bekostade många fönster och lät avbilda sig
    själva i nedersta rutan, som en sorts sponsorlogga. Idén med kyrkorum
    fyllda av färgat ljus kom från abbot Suger i
    [Saint-Denis](#saint-denis-1137-gotiken-fods).

monreales-mosaiker:
  period: 1140
  label: "Monreales mosaiker"
  title: "Normandiska Siciliens mosaiker – från Palermo till Monreale"
  wiki:
    - "en:Monreale Cathedral"
    - "en:Cappella Palatina"
  text: |
    Normandiska riddare erövrade Sicilien från araberna under 1000-talet
    ([Palermo 1072](#normander-tar-sicilien-palermo-1072)), och [Roger
    II](#roger-ii-normandiska-kungariket-sicilien) blev kung 1130. Hans
    rike var Europas mest blandade: latinska, grekiska och arabiska
    användes i förvaltningen, och vid hovet arbetade den arabiske
    geografen al-Idrisi. Konsten speglar detta.

    På 1140-talet lät Roger bygga Cappella Palatina i sitt palats i
    Palermo och katedralen i Cefalù. Väggarna täcktes av **mosaik** i
    bysantinsk stil – bilder lagda av små glasbitar, ofta med guldgrund –
    utförda av hantverkare från Konstantinopel. Cappella Palatinas tak är
    däremot ett islamiskt stalaktitvalv i trä (muqarnas) målat av
    muslimska konstnärer, med bilder av dansare och musikanter. Tre
    kulturer i ett rum.

    Höjdpunkten är katedralen i **Monreale** ovanför Palermo, byggd av
    kung Vilhelm II från 1174. Dess mosaiker, utförda på 1180-talet,
    täcker omkring 6 000 kvadratmeter och berättar hela Bibeln. I absiden
    tronar en jättelik Kristus Pantokrator ("allhärskaren"). Mosaikerna
    var ett maktspråk: Vilhelm visade sig själv krönt direkt av Kristus,
    inte av påven. Jämför med Venedigs [San Marco](#san-marco-i-venedig),
    också med bysantinska förebilder.

notre-dame-i-paris-paborjas-1163-2:
  period: 1160
  label: "Notre-Dame i Paris påbörjas 1163"
  same_as: notre-dame-i-paris-paborjas-1163

gotlands-dopfuntar:
  period: 1160
  label: "Gotlands dopfuntar"
  title: "Gotlands dopfuntar – stenhuggare för export"
  wiki:
    - "sv:Dopfunt"
    - "sv:Gotland"
  text: |
    En **dopfunt** är kyrkans behållare för dopvatten, ofta en skål på en
    fot. När Norden kristnades på 1000–1100-talen behövde varje ny
    sockenkyrka en, och dopet var den rit som gjorde någon till kristen.
    Gotland, som hade ett 90-tal medeltida kyrkor och rika bönder och
    köpmän, blev ett centrum för tillverkning av romanska stenfuntar.

    Gotländsk kalksten och sandsten var lätt att hugga, och flera
    verkstäder var aktiva från mitten av 1100-talet till 1200-talet.
    Konsthistoriker har gett dem namn: **Hegvald**, känd för täta reliefer
    med Jesu barndom och tronande figurer; **Majestatis**, efter en
    Kristus i majestät; och **Sigraf**, som signerade sina verk med runor
    – bland annat funten i Åkirkeby på Bornholm. Relieferna blandar
    bibliska scener med drakar, lejon och flätmönster som påminner om
    vikingatida ornamentik.

    Funtarna exporterades med båt till fastlandet, Danmark, Baltikum och
    norra Tyskland – en tidig industri, där färdiga produkter såldes över
    Östersjön. De visar att Gotland redan före [Hansans](#visby-i-hansan)
    tid var en handelsknut. Samtidigt organiserades den svenska kyrkan,
    med [Uppsala ärkestift 1164](#uppsala-arkestift-1164).

unkei-kamakura-skulptur-japan:
  period: 1180
  label: "Unkei: Kamakura-skulptur (Japan)"
  title: "Unkei och Kamakura-skulpturen"
  wiki:
    - "en:Unkei"
    - "en:Kei school"
  text: |
    **Unkei** (ca 1150–1223) var Japans mest berömda skulptör, ledare för
    Kei-skolan i Nara. Han verkade när krigaradeln tog makten: efter
    [Genpei-kriget](#genpei-kriget-118085) bildades
    [Kamakura-shogunatet](#kamakura-shogunatet-1192), en militärregim som
    styrde i kejsarens namn. Under kriget brände Tairaklanen 1180 de stora
    templen i Nara, och återuppbyggnaden gav skulptörerna enorma uppdrag.

    Kamakura-skulpturen bröt med det lugna, eleganta idealet från
    Heiantiden (jämför Jōchōs Amida i [Byōdō-in](#byodo-in-japan)). Unkeis
    figurer är muskulösa, rörliga och realistiska, i linje med
    samurajernas smak. Han satte in **kristallögon** – bitar av
    bergkristall målade bakifrån – så att blicken glänser. Statyerna
    byggdes av många hopfogade träblock, vilket tillät stora format och
    arbete i lag.

    Hans mest kända verk är de två Niō, väktargestalter, i Tōdaijis södra
    port i Nara, utförda 1203 tillsammans med Kaikei och ett stort antal
    medhjälpare. De är drygt åtta meter höga och färdigställdes enligt
    uppgift på omkring 70 dagar – byggt som ett projekt med arbetsdelning.
    Unkeis porträttstatyer av munkarna Muchaku och Seshin i Kōfukuji
    (ca 1212) är så individuella att de liknar porträtt av levande
    människor.

canterbury:
  period: 1180
  label: "Canterbury"
  title: "Canterbury – gotiken når England"
  wiki:
    - "en:Canterbury Cathedral"
  text: |
    Katedralen i Canterbury var säte för Englands främste biskop,
    ärkebiskopen. 1170 mördades ärkebiskop Thomas Becket där av riddare
    som trodde att de gjorde kung Henrik II en tjänst
    ([Becketmordet](#thomas-becket-mordas-1170)). Becket helgonförklarades
    redan 1173, och Canterbury blev en av Europas största pilgrimsorter.

    När koret brann 1174 anlitade munkarna en fransk mästare, **Vilhelm av
    Sens**, som byggde det nya koret i den nya franska [gotiska
    stilen](#saint-denis-1137-gotiken-fods): spetsbågar, revbensvalv och
    smala pelare av polerad mörk Purbeckmarmor som kontrasterar mot ljus
    kalksten. Det var gotikens första stora genombrott i England. Vilhelm
    föll 1178 från en byggnadsställning och skadades svårt; arbetet togs
    över av "Vilhelm engelsmannen". Munken Gervasius skrev en noggrann
    dagboksrapport om bygget, en sällsynt källa till hur medeltida byggen
    gick till.

    Bakom koret byggdes Trinity Chapel för Beckets helgonskrin, med
    glasmålningar som skildrar mirakler vid graven – pilgrimer som botats.
    Pilgrimernas gåvor finansierade bygget, en tidig form av
    turistekonomi. Två hundra år senare gjorde Geoffrey Chaucer
    pilgrimsfärden till ramberättelse i *Canterburysägner*.

chartres-katedral-byggs-om-11941220:
  period: 1200
  label: "Chartres katedral byggs om 1194–1220"
  title: "Chartres katedral – högotikens mönster"
  wiki:
    - "en:Chartres Cathedral"
    - "sv:Gotik"
  text: |
    Natten till 11 juni 1194 brann den romanska katedralen i Chartres ned.
    Bara västfasaden, kryptan och tornen klarade sig – och relikerna,
    framför allt en tunika som sades ha tillhört jungfru Maria. Att den
    överlevt tolkades som ett tecken på att Maria ville ha en större
    kyrka. Bygget gick ovanligt fort: på drygt 25 år stod den nya
    katedralen i stort sett färdig.

    Chartres blev mönstret för **högotiken**. Mittskeppets väggar har tre
    våningar: pelararkader nederst, ett smalt galleri (triforium) och
    överst stora fönster. Valven når omkring 37 meter. **Strävbågar** –
    utvändiga stenbågar som leder valvens sidotryck ut till fristående
    pelare – planerades från början i stället för att läggas till i
    efterhand, vilket gjorde det möjligt med så stora fönsterytor.
    Sammanlagt har kyrkan omkring 170 glasmålningar, de flesta från
    1200–1260 (se [glasmålningarna](#glasmalningar-i-chartres)).

    Pengarna kom från biskopen och domkapitlet, som avstod inkomster i
    flera år, från kungen och adeln och från stadens skrån. Kring
    portalerna står hundratals skulpturer, där de äldsta – på den så
    kallade kungliga portalen från 1140-talet – visar stela, avlånga
    figurer, medan de nya portalerna har mjukare och mer levande
    gestalter. Jämför med den samtida [Bayon](#bayon-i-angkor-thom) i
    Kambodja.

bayon-i-angkor-thom:
  period: 1200
  label: "Bayon i Angkor Thom"
  title: "Bayon – templet med de leende ansiktena"
  wiki:
    - "en:Bayon"
    - "en:Angkor Thom"
  text: |
    År 1177 plundrade grannfolket cham khmerernas huvudstad Angkor ([Cham
    plundrar Angkor](#cham-plundrar-angkor-1177)). Kungen [Jayavarman
    VII](#jayavarman-vii-angkor-thom-bayon) (regerade ca 1181–1218) drev
    ut dem och byggde en ny befäst stad, **Angkor Thom**, omgiven av en
    mur på omkring tre kilometer per sida. Han var mahayanabuddist, till
    skillnad från hinduiska föregångare, och lät också bygga sjukhus och
    rasthus längs vägarna.

    I stadens mitt ligger **Bayon**, byggt kring 1200. Det är ett
    tempelberg som [Angkor Wat](#angkor-wats-reliefer), men tätare och mer
    labyrintiskt. Bayon har omkring 37 bevarade torn, och de flesta bär
    fyra jättelika ansikten i sten som blickar åt väderstrecken – totalt
    över 200 ansikten med ett milt, slutet leende. Vem de föreställer är
    omdiskuterat: bodhisattvan Lokeshvara (barmhärtighetens gestalt),
    kungen själv, eller båda.

    Relieferna på de yttre gallerierna skiljer sig från Angkor Wats myter:
    här syns sjöslag mot cham men också vardagsliv – marknadsscener,
    matlagning, tuppfäktning, fiske. Stenblocken är staplade utan murbruk
    och huggna på plats, vilket gjorde bygget snabbare men mindre stabilt.
    Samtidigt reste fransmännen
    [Chartres](#chartres-katedral-byggs-om-11941220); båda byggena var
    religiösa och politiska manifestationer av en återupprättad ordning.

sainte-chapelle-1248:
  period: 1220
  label: "Sainte-Chapelle 1248"
  title: "Sainte-Chapelle – ett relikskrin av glas"
  wiki:
    - "en:Sainte-Chapelle"
  text: |
    Den franske kungen [Ludvig IX](#ludvig-ix), senare helgonförklarad,
    köpte 1239 Kristi törnekrona från den latinske kejsaren i
    Konstantinopel, som behövde pengar – staden hade erövrats av
    korsfarare 1204 och relikerna var i västerländska händer. Priset var
    135 000 livres, en enorm summa. För att förvara den byggde han
    palatskapellet **Sainte-Chapelle** på Île de la Cité i Paris,
    invigt 1248. Kapellet kostade omkring 40 000 livres – alltså mindre än
    reliken.

    Byggnaden har två våningar: ett lågt nedre kapell för hovfolket och
    ett övre för kungen och reliken. Det övre är nästan bara glas: femton
    fönster, omkring 15 meter höga, med totalt över 1 100 bildfält från
    Bibeln, sammanlagt omkring 600 kvadratmeter. Väggen har i praktiken
    upplösts i tunna stenpelare, och dolda järnankare håller ihop
    konstruktionen. Stilen kallas **rayonnant** ("strålande"), efter de
    stjärnformade rosfönstren.

    Sainte-Chapelle var politisk teologi: Paris skulle bli ett nytt
    Jerusalem och den franske kungen kristenhetens främste. Ludvig drog
    själv ut på korståg samma år ([sjunde korståget
    1248](#ludvig-ix-s-sjunde-korstag-1248)). Kapellet blev förebild för
    gotiska kapell i hela Europa.

reims-katedral:
  period: 1220
  label: "Reims katedral"
  title: "Reims katedral – kröningskyrkan"
  wiki:
    - "en:Reims Cathedral"
  text: |
    I Reims i nordöstra Frankrike döptes frankernas kung Klodvig omkring
    år 500, och sedan dess kröntes nästan alla franska kungar här – i över
    1 000 år. När den gamla katedralen brann 1210 påbörjades året därpå en
    ny i högotisk stil. Arkitekternas namn är kända eftersom de skrevs in
    i en labyrint på golvet (förstörd på 1700-talet): bland andra Jean
    d'Orbais och Bernard de Soissons.

    Reims utvecklade
    [Chartres](#chartres-katedral-byggs-om-11941220)-modellen. Mittskeppet
    är högre, omkring 38 meter, och västfasaden har glasfönster i stället
    för stenreliefer ovanför portalerna. Kyrkan är framför allt känd för
    sin skulptur – uppskattningsvis över 2 000 figurer. Den mest kända är
    "Den leende ängeln" från omkring 1240, vars lätta leende var något
    nytt: medeltida skulptur hade hittills varit allvarlig. Andra figurer,
    som Marias besök hos Elisabet, har dräkter och huvuden som liknar
    antika romerska statyer.

    Kröningen var det tillfälle då kungen smordes med helig olja och
    därmed fick sin makt av Gud – därför var kyrkan ett statsprojekt. I
    första världskriget sköts katedralen i brand av tyskt artilleri 1914
    och blev en symbol för krigets förstörelse; restaureringen bekostades
    delvis av amerikanen John D. Rockefeller Jr.

naumburgs-donatorstatyer:
  period: 1240
  label: "Naumburgs donatorstatyer"
  title: "Naumburgs donatorstatyer – Uta och de andra"
  wiki:
    - "en:Naumburg Cathedral"
    - "en:Naumburg Master"
  text: |
    I domkyrkan i Naumburg i östra Tyskland står i västkoret tolv statyer
    i naturlig storlek, utförda omkring 1250 av en okänd konstnär som
    kallas **Naumburgmästaren**. De föreställer kyrkans grundare, adelsmän
    och adelsdamer från 1000-talet – de var alltså döda sedan två hundra
    år och ingen visste hur de sett ut. Ändå har varje figur ett eget
    ansikte, egen kroppshållning och eget humör.

    Den mest kända är markgrevinnan **Uta**, som drar upp mantelkragen mot
    kinden, bredvid sin make Ekkehard med svärd och sköld. Andra ser
    bistra, förlägna eller stridslystna ut. Statyerna var målade, och
    skulptören studerade uppenbarligen tyg, rustningar och levande
    ansikten. Liknande realism fanns i fransk katedralskulptur, som i
    [Reims](#reims-katedral), där mästaren troligen hade lärt sig.

    Varför avbilda gamla donatorer? Biskopen behövde pengar till bygget
    och lovade 1249 i ett brev avlat till dem som gav, med hänvisning till
    grundarna. Statyerna visade att gåvor till kyrkan ger evigt minne.
    Samtidigt sönderföll kejsarmakten efter [Fredrik II:s död
    1250](#fredrik-ii-dor-1250), och lokala furstar och biskopar blev
    viktigare beställare. På 1900-talet gjordes Uta till en nationalikon,
    även i nazistisk propaganda. Katedralen blev världsarv 2018.

alhambra-paborjas:
  period: 1240
  label: "Alhambra påbörjas"
  title: "Alhambra – det sista muslimska palatset i Spanien"
  wiki:
    - "sv:Alhambra"
    - "en:Alhambra"
  text: |
    När de kristna kungarikena erövrade Córdoba, Valencia och Sevilla på
    1230–40-talen ([Sevilla 1248](#sevilla-erovras-1248)) återstod bara
    emiratet Granada under nasriddynastin (se
    [Granada](#granada-nasrider-kvar-muslimskt)). Dess grundare Muhammad I
    började 1238 bygga en befäst palatsstad på en höjd ovanför staden.
    Namnet kommer av arabiskans *al-Qal'a al-Hamra*, "den röda borgen",
    efter den rödaktiga murfärgen.

    De mest berömda delarna byggdes på 1300-talet under Yusuf I och
    Muhammad V: Comarespalatset med en lång spegeldamm och Lejongården med
    en fontän buren av tolv stenlejon. Utsidan är enkel, men inne täcks
    väggarna av snidad och målad gips, kakelmosaik i geometriska mönster
    och arabisk kalligrafi – bland annat dikter som beskriver rummen
    själva. Taken bär **muqarnas**, valv uppbyggda av hundratals små
    nischer som liknar droppstenar eller bikakor.

    Islamisk religiös konst undviker bilder av människor, så dekoren
    bygger på geometri, växtornament och skrift. De periodiskt upprepade
    mönstren har fascinerat matematiker; konstnären M. C. Escher studerade
    dem och de inspirerade hans tessellationer. Vattnet, som leds i
    kanaler från bergen, var också en del av arkitekturen. Granada föll
    1492 till Ferdinand och Isabella, men palatset bevarades.

nicola-pisano-predikstolen-i-pisa-1260:
  period: 1260
  label: "Nicola Pisano: predikstolen i Pisa 1260"
  title: "Nicola Pisano – antiken återvänder"
  wiki:
    - "en:Nicola Pisano"
    - "en:Pisa Baptistery"
  text: |
    **Nicola Pisano** (ca 1220–1284) var en skulptör som troligen kom från
    Apulien i Syditalien, där kejsar Fredrik II hade främjat en konst
    inspirerad av antika romerska förebilder. Han verkade i Pisa, då en
    rik handels- och sjöfartsstad. 1260 signerade och daterade han en
    predikstol i marmor för dopkyrkan i Pisa.

    Predikstolen är sexkantig och vilar på pelare, några på ryggen av
    lejon. Relieferna visar Jesu födelse, de tre vise männen, frambärandet
    i templet, korsfästelsen och den yttersta domen. Det nya är att
    figurerna är tunga, breda och tredimensionella, med ansikten och
    dräkter kopierade från **romerska sarkofager** (stenkistor) som fanns
    på Pisas kyrkogård. Jungfru Maria ser ut som en romersk matrona och en
    naken Herkules får gestalta dygden styrka – en av de första nakna
    hjältefigurerna sedan antiken.

    Därmed tog Nicola ett första steg mot det som 150 år senare kallades
    renässansen ("pånyttfödelsen" av antiken). Han och hans son Giovanni
    gjorde sedan predikstolen i Sienas domkyrka (1265–68). Måleriet i
    Toscana följde samma väg några decennier senare, med
    [Cimabue](#cimabue) och [Giotto](#giotto-scrovegnikapellet-1305). Norr
    om Alperna dominerade samtidigt gotiken, som i
    [Reims](#reims-katedral).

cimabue:
  period: 1260
  label: "Cimabue"
  title: "Cimabue – den bysantinska traditionens sista mästare"
  wiki:
    - "sv:Cimabue"
    - "en:Cimabue"
  text: |
    **Cimabue** (egentligen Cenni di Pepo, ca 1240–ca 1302) var en
    florentinsk målare. Han målade i **tempera** på trä: färgpigment
    blandat med äggula, lagt i tunna skikt på en träpanel täckt med gips.
    Bakgrunden var bladguld. Tempera torkar snabbt och ger klara men matta
    färger, och kan inte blandas mjukt på ytan som den senare oljefärgen.

    Stilen han ärvde kallades i Italien *maniera greca*, "det grekiska
    sättet", efter Bysans ikonmåleri: platta, avlånga figurer, guldlinjer
    i kläderna, ingen rumslig djup. Cimabue gjorde den mer kroppslig. Hans
    stora krucifix för Santa Croce i Florens (svårt skadat i
    översvämningen 1966) visar en Kristus vars kropp böjer sig av tyngd,
    och hans *Maestà* (tronande Madonna) för Santa Trinita, nästan fyra
    meter hög, försöker skapa en tron som står i rummet. Han målade också
    fresker i basilikan i Assisi, som byggdes för den nya Franciskusorden.

    Enligt 1500-talsförfattaren Vasari upptäckte Cimabue den unge
    [Giotto](#giotto) och blev hans lärare. Dante skrev i [Den gudomliga
    komedin](#dante-divina-commedia) att Cimabue trodde sig vara främst i
    måleriet, "men nu är det Giotto som hyllas". Få verk är säkert hans.
    2019 hittades en liten panel, *Kristus hånas*, i ett franskt kök och
    såldes för omkring 24 miljoner euro.

duccio:
  period: 1280
  label: "Duccio"
  title: "Duccio – Sienas mästare"
  wiki:
    - "sv:Duccio di Buoninsegna"
    - "en:Duccio"
  text: |
    **Duccio di Buoninsegna** (ca 1255–1319) var den främste målaren i
    Siena, Florens rival i Toscana. Siena var en rik bankstad på pilgrims-
    och handelsvägen mot Rom, styrd av en republik av köpmän som tävlade
    med Florens i krig, handel och konst.

    Hans första stora verk är *Rucellai-Madonnan* (1285), beställd av ett
    religiöst brödraskap för kyrkan Santa Maria Novella i Florens. Den är
    omkring 4,5 meter hög, målad i tempera med guldbakgrund, och
    tillskrevs länge [Cimabue](#cimabue). Kontraktet finns bevarat och
    visar att Duccio själv skulle måla den och använda dyr blå färg –
    vanligt i en tid då konst var hantverk på beställning, med material
    reglerat i avtal.

    Duccio höll fast vid den bysantinska traditionen med guldgrund och
    ikonlika ansikten, men gav den mjukhet: en fin, flytande linje, starka
    och eleganta färger och mänsklig värme mellan mor och barn. Han
    berättade gärna i små scener med byggnader och landskap. Medan
    florentinaren [Giotto](#giotto) gick mot tyngd, volym och drama, stod
    Duccio för förfining och dekor. Hans huvudverk är
    [Maestà](#duccios-maesta-1311) för Sienas domkyrka, och hans elever,
    som [Simone Martini](#simone-martini), förde stilen vidare.

ma-yuan-skolan:
  period: 1280
  label: "Ma Yuan-skolan"
  title: "Ma Yuan och Xia Gui – det tomma rummets måleri"
  wiki:
    - "en:Ma Yuan"
    - "en:Ma–Xia school"
  text: |
    **Ma Yuan** (ca 1160–1225) och **Xia Gui** (verksam ca 1180–1230) var
    hovmålare vid Södra Songs akademi i Hangzhou (se [Södra
    Song](#sodra-song-med-hangzhou)), som hade återupprättats efter
    Huizongs [akademi](#kejsar-huizongs-akademi) i norr. Deras stil, ofta
    kallad Ma–Xia-skolan, präglade kinesiskt hovmåleri under 1200-talet
    och levde kvar efter att Song föll för mongolerna 1279.

    Ma Yuan kallades "Ett hörn-Ma": i stället för de väldiga bergsmassiven
    hos Fan Kuan placerade han motivet – en lärd man under en tall, ett
    berg som sticker upp ur dimman – i ena hörnet och lät resten av bilden
    vara tom eller dimmig. Det tomma rummet är inte ofärdigt utan
    föreställer luft, avstånd och stämning. Formaten var små: albumblad
    och solfjädrar, ofta med en dikt skriven av kejsaren eller
    kejsarinnan.

    Senare kinesiska kritiker, som höll de lärda amatörmålarna högre, såg
    Ma–Xia-stilen som för elegant och yrkesmässig. I Japan blev den
    däremot avgörande: zenbuddhistiska munkar tog med sig sådana
    målningar, och på 1400-talet utvecklade japanska målare som Sesshū ett
    tuschmåleri byggt på samma principer.

yuan-landskapet-zhao-mengfu:
  period: 1280
  label: "Yuan-landskapet (Zhao Mengfu)"
  title: "Zhao Mengfu och Yuanlandskapet"
  wiki:
    - "en:Zhao Mengfu"
  text: |
    När mongolerna under [Kublai khan](#kublai-khan-yuan-1271) erövrade
    hela Kina och [Song föll 1279](#song-faller-1279) stod den kinesiska
    lärda eliten inför ett val: tjäna främlingarna eller dra sig tillbaka.
    Många vägrade och blev "kvarlevande" som målade och skrev privat.
    **Zhao Mengfu** (1254–1322), själv ättling till Songs kejsarhus, valde
    att tjäna Kublais hov och steg till höga ämbeten – något som gav honom
    både makt och dåligt rykte.

    Zhao var främst kalligraf, och hans stil blev normgivande i
    århundraden. I måleriet ville han lämna Södra Song-akademins förfinade
    dimstil (se [Ma Yuan-skolan](#ma-yuan-skolan)) och gå tillbaka till
    äldre, enklare förebilder från Tang och tidig Song. Hans *Höstfärger
    på bergen Qiao och Hua* (1295), en kort horisontell rulle, är medvetet
    naiv: platta berg, enkla träd, penseldrag som visar handens rörelse
    snarare än verklighetens yta.

    Detta blev grunden för **de lärdas måleri** (wenrenhua): målningen ska
    uttrycka konstnärens sinne och bildning, ungefär som handstil, inte
    imponera med teknik. Det blev det dominerande idealet i Kina fram till
    1900-talet och fördes vidare av Yuans "fyra mästare", som Huang
    Gongwang. Zhaos hustru Guan Daosheng var också en känd målare av
    bambu.

giotto-scrovegnikapellet-1305:
  period: 1300
  label: "Giotto: Scrovegnikapellet ~1305"
  title: "Giotto och Scrovegnikapellet"
  wiki:
    - "sv:Giotto di Bondone"
    - "en:Scrovegni Chapel"
  text: |
    **Giotto di Bondone** (ca 1267–1337) från Florens räknas som den
    målare som bröt med den bysantinska traditionen (se
    [Cimabue](#cimabue)) och började måla människor som kroppar med tyngd
    och känslor i ett rum. Hans huvudverk är freskerna i
    **Scrovegnikapellet** i Padua, färdigt omkring 1305.

    Kapellet beställdes av bankiren Enrico Scrovegni, vars far var så känd
    ockrare att Dante placerade honom i helvetet ([Den gudomliga
    komedin](#dante-divina-commedia)). Ränta på lån var synd enligt
    kyrkan, och kapellet var delvis en investering i familjens själar.
    Väggarna täcks av ett trettiotal scener om Maria och Jesus i tre band,
    med yttersta domen på bakväggen – där Scrovegni själv räcker fram
    kapellet till änglarna. Taket är målat i djupblått med guldstjärnor;
    den blå färgen var ultramarin av malen lapis lazuli från Afghanistan,
    dyrare än guld.

    **Fresk** betyder att man målar med vattenlösta pigment på färsk, våt
    kalkputs; när den torkar binds färgen kemiskt i väggen. Man kan bara
    putsa så mycket som hinns måla samma dag, så varje scen är lagd i
    dagsportioner. Giottos figurer har volym, skuggning och tydliga
    känslor – i *Begråtandet* sörjer människor med ryggen mot betraktaren,
    och himlen fylls av klagande änglar. I scenen med de vise männen syns
    en komet, troligen Halleys från 1301 – samma komet som finns på
    [Bayeuxtapeten](#bayeuxtapeten-1070).

duccios-maesta-1311:
  period: 1300
  label: "Duccios Maestà 1311"
  title: "Duccios Maestà – en hel stad i procession"
  wiki:
    - "en:Maestà (Duccio)"
    - "sv:Duccio di Buoninsegna"
  text: |
    *Maestà*, "majestät", betyder en bild av Jungfru Maria tronande med
    Jesusbarnet och omgiven av helgon och änglar. Siena såg Maria som
    stadens skyddshelgon – sienesarna tillskrev henne segern mot Florens
    1260 – och 1308 beställde staden en ny huvudaltartavla för domkyrkan
    av [Duccio](#duccio). Kontraktet krävde att han målade den med egen
    hand.

    Den 9 juni 1311 bars den färdiga tavlan i procession från Duccios
    verkstad till domkyrkan, med präster, ämbetsmän och folk, klockor som
    ringde och butiker stängda. Tavlan var dubbelsidig. Framsidan, omkring
    4 meter bred, visar Maria på tronen bland ett tjugotal helgon och
    änglar mot guldgrund. Baksidan bestod av drygt tjugo små scener från
    Jesu lidande, med livliga berättelser i byggnader och landskap. Med
    alla småpaneler var det ett av de mest omfattande målade verken i sin
    tid.

    1771 sågades altartavlan isär. De flesta delar finns i domkyrkomuseet
    i Siena, men några småpaneler hamnade i London, Washington och New
    York. Duccio-verk är extremt sällsynta: när Metropolitan Museum 2004
    köpte en liten Madonna av honom (inte från Maestà) betalade museet
    enligt uppgift omkring 45 miljoner dollar. Samtidigt arbetade
    [Giotto](#giotto-scrovegnikapellet-1305) med en mer dramatisk och
    kroppslig stil; Sienas tradition fördes vidare av [Simone
    Martini](#simone-martini) och bröderna Lorenzetti.

simone-martini:
  period: 1320
  label: "Simone Martini"
  title: "Simone Martini – Sienas elegans och guld"
  wiki:
    - "sv:Simone Martini"
    - "en:Annunciation with St. Margaret and St. Ansanus"
  text: |
    **Simone Martini** (ca 1284–1344) var målare i den toskanska
    stadsstaten Siena och elev eller efterföljare till [Duccio](#duccio).
    Han målade främst med *tempera* – pigment blandade med äggula – på
    träpaneler som täcktes med tunt bladguld. Guldbakgrunden var inte ett
    landskap utan en symbol för himlen, och den glänste i stearinljusets
    sken i kyrkorna.

    Hans mest kända verk är *Bebådelsen* (1333, i dag i Uffizierna i
    Florens), målad tillsammans med svågern Lippo Memmi för Sienas
    domkyrka. Ängeln Gabriel och jungfru Maria är långsträckta, smäckra
    figurer med böljande, mönstrade tyger, och orden ängeln säger är
    bokstavligen präglade i guldet mellan dem. Stilen är mindre kroppslig
    och dramatisk än Giottos i Florens, men mer förfinad och dekorativ –
    den passade hovens och kyrkans smak för lyx.

    Simone arbetade för Sienas stadsstyre (en stor Maestà, en tronande
    Madonna, i stadshuset 1315), för franciskanerna i Assisi och för den
    franske kungaätten i Neapel. Omkring 1336 flyttade han till Avignon,
    där [påvarna nu residerade](#paven-till-avignon-1309). Där träffade
    han poeten [Petrarca](#petrarca-tidig-humanism), som skrev sonetter om
    ett (förlorat) porträtt Simone målat av hans älskade Laura. Genom
    Avignon spreds sienesisk stil norrut och blev en av rötterna till den
    så kallade internationella gotiken.

lorenzettis-det-goda-styrets-allegori:
  period: 1320
  label: "Lorenzettis Det goda styrets allegori 1338"
  title: "Lorenzetti: politisk propaganda på väggen"
  wiki:
    - "en:The Allegory of Good and Bad Government"
    - "sv:Ambrogio Lorenzetti"
  text: |
    År 1338–39 målade **Ambrogio Lorenzetti** (ca 1290–1348) tre väggar i
    det rum i Sienas stadshus där stadens regering, *De nio* – ett råd av
    köpmän och bankirer – sammanträdde. Tekniken var *fresk*: man målar
    vattenlösliga pigment direkt på färsk, våt kalkputs, så att färgen
    binds in i väggen när putsen härdar. Man måste därför måla en
    dagsportion i taget innan putsen torkar.

    Motivet är en *allegori*, det vill säga abstrakta idéer framställda
    som personer: Rättvisan, Freden, Visheten och det Gemensamma Bästa
    sitter på rad som en domstol. På väggen bredvid visas följderna av
    gott styre: en livlig stad där folk handlar, bygger hus och dansar,
    och utanför murarna ett vidsträckt odlat landskap med bönder, åkrar
    och resande. Det är ett av de första stora landskapen i europeisk
    målning sedan antiken. Mittemot visas det dåliga styret, med
    Tyranniet, förfallna hus och härjade fält.

    Bilden är alltså politisk reklam för ett republikanskt köpmannastyre,
    i en tid då italienska städer ofta föll i händerna på enväldiga
    herrar. Tio år senare kom [digerdöden](#digerdoden-1-3-av-europa-dor);
    Ambrogio och troligen även hans bror Pietro dog 1348, och Sienas
    storhetstid var över. Jämför med samtida [Simone
    Martini](#simone-martini), som målade i samma byggnad men i en mer
    höviskt dekorativ stil.

huang-gongwang-bostad-i-fuchunbergen:
  period: 1340
  label: "Huang Gongwang: Bostad i Fuchunbergen"
  title: "Huang Gongwang och den kinesiska lärdomsmålningen"
  wiki:
    - "en:Dwelling in the Fuchun Mountains"
    - "en:Huang Gongwang"
  text: |
    **Huang Gongwang** (1269–1354) var en kinesisk målare under
    [Yuandynastin](#yuan), då mongolerna styrde Kina. Många kinesiska
    lärda nekades eller vägrade ämbeten under de främmande härskarna och
    ägnade sig i stället åt poesi, kalligrafi och måleri. Den här
    traditionen kallas *lärdomsmåleri* (wenrenhua): målning som personligt
    uttryck för en bildad amatör, inte som hantverk på beställning. Huang
    räknas till Yuantidens ”fyra mästare”.

    *Bostad i Fuchunbergen* målades ungefär 1347–1350 som en *handrulle*:
    en lång pappersremsa som man rullar upp bit för bit, så att landskapet
    upplevs som en vandring. Den är målad med enbart tusch – svart bläck
    utspätt i olika grader – i torra, lösa penseldrag. Kullar, träd och
    vattnet längs floden Fuchun nära Hangzhou är inte exakt avbildade;
    poängen är penseldragets karaktär, nästan som handstil.

    Rullen fick ett dramatiskt öde: en ägare ville att den skulle brännas
    med honom vid hans död 1650. Den räddades ur elden men delades i två
    delar. Den korta delen (cirka en halv meter) finns i Zhejiangs
    provinsmuseum i Hangzhou, den långa (över sex meter) i
    Nationalpalatsmuseet i Taipei. År 2011 visades delarna tillsammans i
    Taipei – en händelse som också tolkades politiskt. Jämför med det
    äldre monumentala landskapet hos [Fan
    Kuan](#fan-kuan-monumentalt-landskapsmaleri) och med föregångaren
    [Zhao Mengfu](#yuan-landskapet-zhao-mengfu).

pesten-i-konsten:
  period: 1340
  label: "pesten i konsten"
  title: "Pesten i konsten: döden blir ett motiv"
  wiki:
    - "sv:Dödsdans"
    - "en:Black Death in medieval culture"
  text: |
    När [digerdöden](#digerdoden-1-3-av-europa-dor) svepte över Europa
    1347–51 dog uppskattningsvis en tredjedel av befolkningen, och pesten
    kom sedan tillbaka med några decenniers mellanrum i 300 år. Det satte
    spår i konsten. Döden blev ett eget bildmotiv, ofta som ett skelett
    eller ett ruttnande lik.

    Det mest spridda motivet var *dödsdansen*: döden som dansar i en kedja
    med människor från alla samhällsklasser – påve, kejsare, köpman,
    bonde, barn – för att visa att alla dör, oavsett rang. En berömd
    version fanns på kyrkogården Cimetière des Innocents i Paris (1424),
    och i Lübeck målade [Bernt Notke](#bernt-notke-s-t-goran-1489) en lång
    dödsdans 1463 (förstörd 1942, men ett fragment av en kopia finns i
    Tallinn). I svenska kyrkor syns döden hos [Albertus
    Pictor](#albertus-pictor-i-svenska-kyrkor), till exempel i Täby kyrka
    där döden spelar schack med en man.

    Andra följder var pesthelgon som man bad till om skydd – särskilt S:t
    Sebastian, vars pilar liknades vid pestens ”pilar”, och S:t Rochus,
    som visas med en pestböld på låret – och gravmonument där den döde
    visas som förruttnande kropp. Konsthistorikern Millard Meiss hävdade
    1951 att måleriet i Florens och Siena blev mer stelt och fromt efter
    pesten; tesen är omdiskuterad. Säkert är att många konstnärer dog och
    att rädda donatorer beställde mängder av altartavlor och kapell för
    sin själs frälsning.

wiltondiptyken:
  period: 1360
  label: "Wiltondiptyken"
  title: "Wiltondiptyken – en kungs privata altare"
  wiki:
    - "en:Wilton Diptych"
  text: |
    En *diptyk* är en målning på två gångjärnsförsedda paneler som kan
    fällas ihop som en bok. **Wiltondiptyken** (ca 1395–99, National
    Gallery i London) är liten – varje panel är ungefär 53 × 37 cm – och
    gjordes för att kung [Rikard II av England](#rikard-ii-avsatts-1399)
    skulle kunna be framför den, även på resor. Namnet kommer från Wilton
    House, där den länge ägdes av en adelssläkt.

    På vänster panel knäböjer den unge kungen, presenterad av tre helgon,
    bland dem två tidigare engelska kungar. På höger panel står jungfru
    Maria med Jesusbarnet bland elva änglar i djupblått mot guldbakgrund.
    Änglarna bär Rikards personliga märke, en vit hjort – ett sätt att
    visa att himlen står på kungens sida. Det blå är ultramarin, malen
    lapis lazuli från gruvor i dagens Afghanistan, då dyrare än guld per
    vikt.

    Vem som målade den är okänt; konstnären kan ha varit fransk, engelsk
    eller från Nederländerna. Det är typiskt för [internationell
    gotik](#internationell-gotik), en hovstil som såg likadan ut i Paris,
    Prag och London: smala, eleganta figurer, rika färger och stort
    guldarbete. Ironiskt nog avsattes Rikard 1399 och dog i fångenskap
    kort därefter – bilden av gudomligt understöd hjälpte inte.

alhambras-lejongard:
  period: 1360
  label: "Alhambras Lejongård"
  title: "Alhambras Lejongård – islamisk palatskonst i Spanien"
  wiki:
    - "en:Court of the Lions"
    - "sv:Alhambra"
  text: |
    [Alhambra](#alhambra-paborjas) är en befäst palatsstad på en höjd
    ovanför Granada i södra Spanien, byggd av nasriddynastin, de sista
    muslimska härskarna på Iberiska halvön. Medan de kristna kungarikena
    erövrade resten av halvön överlevde [emiratet Granada](#granada) genom
    att betala tribut. Lejongården byggdes under sultan Muhammad V från
    1360-talet.

    Gården är en rektangel, ungefär 29 × 16 meter, omgiven av gångar som
    bärs av drygt hundra smala marmorkolonner. I mitten står en fontän med
    tolv marmorlejon som sprutar vatten; från den löper rännor i fyra
    riktningar, en anspelning på paradisets fyra floder i Koranen. Vatten
    var både lyx och symbol i ett torrt land.

    Det nya ligger i utsmyckningen. Väggarna är täckta av snidad gips
    (stuck) i geometriska och växtartade mönster och arabisk skrift, bland
    annat dikter av hovpoeten Ibn Zamrak. I salarna runt gården finns
    *muqarnas*: valv uppbyggda av hundratals små nischer som bildar en
    droppstensliknande yta. Materialen var billiga – gips, trä, kakel –
    men effekten är överdådig. Islamisk religiös konst undviker ofta
    bilder av människor, vilket gjorde mönster och skrift till huvudsak.
    Granada föll 1492 ([Granada faller](#granada-faller-1492)), men de
    katolska kungarna behöll palatset och det påverkade senare spansk
    dekorkonst.

internationell-gotik:
  period: 1380
  label: "Internationell gotik"
  title: "Internationell gotik – Europas gemensamma hovstil"
  wiki:
    - "sv:Internationell gotik"
    - "en:International Gothic"
  text: |
    *Gotik* är den konst- och byggstil som uppstod i Frankrike på
    1100-talet med spetsbågar, höga katedraler och stora glasfönster.
    **Internationell gotik** är ett senare begrepp för en målar- och
    skulpturstil som rådde ungefär 1375–1425 vid hoven i Paris, Dijon,
    Prag, Milano, London och Siena. Den kallas internationell eftersom den
    såg ungefär likadan ut överallt.

    Kännetecknen är smala, svajande figurer, långa böljande tygveck, klara
    dyrbara färger, mycket guld och en förtjust detaljrikedom: blommor,
    hundar, fåglar, modekläder. Beställarna var furstar och påvar som
    ville visa rikedom, och konsten bestod ofta av små lyxföremål –
    illuminerade handskrifter, altarskåp för privat andakt, guldsmide –
    som kunde ges bort eller fraktas.

    Stilen spreds för att konstnärer flyttade mellan hov och för att
    furstehusen var släkt med varandra. Exempel är
    [Wiltondiptyken](#wiltondiptyken) i England, [bröderna
    Limbourgs](#broderna-limbourg-tres-riches-heures) bönbok i Frankrike
    och Gentile da Fabrianos *Konungarnas tillbedjan* (1423) i Florens.
    Samtidigt var Europa splittrat av krig och av [schismen med två
    påvar](#stora-schismen-tva-pavar-1378); den ljusa, idealiserade
    hovkonsten var delvis en flykt från det. Kring 1420 började två nya
    riktningar ersätta stilen: perspektivmåleriet i Florens och den skarpa
    realismen i Flandern.

claus-sluter-mosebrunnen:
  period: 1380
  label: "Claus Sluter: Mosebrunnen"
  title: "Claus Sluter: Mosebrunnen i Dijon"
  wiki:
    - "en:Well of Moses"
    - "en:Claus Sluter"
  text: |
    **Claus Sluter** (ca 1350–1405/06) var en nederländsk bildhuggare från
    Haarlem som arbetade för hertig Filip den djärve av Burgund.
    Hertigarna av Burgund var en sidogren av det franska kungahuset och
    styrde ett rike av rika handelsstäder i Flandern och Brabant samt
    Burgund i östra Frankrike. Filip grundade ett kartusiankloster,
    Champmol, utanför Dijon som familjens gravkyrka, och Sluter blev dess
    bildhuggare.

    *Mosebrunnen* (ca 1395–1405) var egentligen sockeln till ett stort
    krucifix mitt i klostrets brunn. Krucifixet är förstört, men sockeln
    finns kvar: en sexkantig pelare med sex nästan manshöga stenfigurer av
    gammaltestamentliga profeter – Mose, David, Jeremia med flera – som
    håller skriftband med förutsägelser om Kristi död. Figurerna var
    målade och förgyllda (Mose hade till och med glasögon av metall) av
    hovmålaren Jean Malouel.

    Det nya var realismen. Där den samtida [internationella
    gotiken](#internationell-gotik) gjorde smala, idealiserade figurer har
    Sluters profeter tunga kroppar, rynkiga individuella ansikten och
    massiva, tunga tygveck som verkar ha verklig vikt. Han gjorde också
    hertigens gravmonument med små sörjande munkar, *pleurants*. Denna
    burgundiska realism ledde vidare till de flamländska målarna [van
    Eyck](#van-eyck-gentaltaret-1432) och [Rogier van der
    Weyden](#rogier-van-der-weyden).

broderna-limbourg-tres-riches-heures:
  period: 1400
  label: "Bröderna Limbourg: Très Riches Heures"
  title: "Très Riches Heures – en furstes bönbok"
  wiki:
    - "sv:Très Riches Heures du Duc de Berry"
    - "en:Limbourg brothers"
  text: |
    *Très Riches Heures du Duc de Berry* (”hertigens av Berry mycket rika
    timbok”) är en *timbok*: en handskriven bönbok för lekmän, med böner
    för dygnets olika timmar och en kalender över kyrkoårets helgdagar.
    Den beställdes av Jean av Berry, bror till den franske kungen och en
    av tidens stora konstsamlare. Den målades ca 1411–1416 av bröderna
    **Paul, Herman och Johan Limbourg**, från Nijmegen i dagens
    Nederländerna.

    Boken är skriven på pergament (behandlat djurskinn) och målad med
    pigment i ett bindemedel av gummi och ägg; den bildteknik som kallas
    *illuminering* innebar mikroskopiskt fint penselarbete, guld och
    kostbar ultramarin. Mest kända är tolv kalenderbilder, en för varje
    månad: adelns fester och jakter, böndernas sådd, skörd och slakt, ofta
    med hertigens verkliga slott i bakgrunden – bland annat Louvren i
    Paris såsom den såg ut då. Det är en av de första gångerna vardag,
    årstider och verkliga platser skildras så noggrant.

    Både bröderna och hertigen dog 1416, troligen av pest, och boken blev
    ofullbordad. Den färdigställdes först på 1440-talet och 1485–89 av
    andra målare. I dag finns den på Musée Condé i Chantilly och visas
    sällan, eftersom färgerna är ljuskänsliga. Den är huvudverket i
    [internationell gotik](#internationell-gotik), målad samtidigt som
    Frankrike slets av inbördeskrig och förlorade mot England vid
    [Agincourt 1415](#agincourt-1415).

ghibertis-dopkyrkodorrar:
  period: 1400
  label: "Ghibertis dopkyrkodörrar"
  title: "Ghibertis bronsdörrar i Florens"
  wiki:
    - "en:Florence Baptistery"
    - "sv:Lorenzo Ghiberti"
  text: |
    Dopkyrkan (baptisteriet) i Florens är en åttkantig byggnad framför
    domkyrkan där alla stadens barn döptes. År 1401 utlyste
    klädeshandlarnas gille, som skötte byggnaden, en tävling om ett par
    nya bronsdörrar. De sökande fick gjuta en provpanel med Abrahams offer
    av Isak. Den unge guldsmeden **Lorenzo Ghiberti** (1378–1455) vann
    över bland andra Filippo Brunelleschi, som sedan gav sig in i
    arkitekturen och byggde [domkyrkans
    kupol](#brunelleschis-kupol-i-florens-142036). Tävlingen brukar ses
    som renässansens startskott i Florens.

    De första dörrarna (1403–24) har 28 små reliefer i gotisk ram.
    Ghiberti fick sedan beställning på ännu ett par, som tog 27 år
    (1425–52). Här är reliefen bara tio stora fyrkantiga fält med
    gammaltestamentliga scener, i förgylld brons. Figurerna nära
    betraktaren sticker ut nästan helt ur bakgrunden medan byggnader och
    landskap längre bort blir allt plattare, och arkitekturen är
    konstruerad i det nya
    [centralperspektivet](#perspektivet-brunelleschi-masaccio).
    Michelangelo ska ha kallat dem ”Paradisets portar”.

    Tekniken var gjutning i förlorad form: man modellerar i vax, bäddar in
    vaxet i lera, smälter ur vaxet och häller i brons. Ghibertis verkstad
    var en skola för en hel generation, bland andra Donatello. Jämför med
    de mycket äldre [bronsdörrarna i
    Hildesheim](#hildesheims-bronsdorrar-1015). Originalen finns sedan
    restaureringen i domkyrkomuseet; på kyrkan sitter kopior.

masaccio-perspektivet-1427:
  period: 1420
  label: "Masaccio: perspektivet ~1427"
  title: "Masaccio och det matematiska perspektivet"
  wiki:
    - "sv:Masaccio"
    - "en:Holy Trinity (Masaccio)"
    - "sv:Centralperspektiv"
  text: |
    *Centralperspektiv* är en geometrisk metod att avbilda rummet på en
    plan yta: linjer som i verkligheten är parallella och leder bort från
    betraktaren dras så att de möts i en gemensam *flyktpunkt* i ögonhöjd,
    och föremål krymper i exakt proportion till avståndet. Det är samma
    projektion som en kamera – eller en 3D-grafikmotor – gör. Arkitekten
    Filippo Brunelleschi visade metoden i Florens omkring 1415–20 med ett
    experiment med spegel och målad tavla
    ([perspektivet](#perspektivet-brunelleschi-masaccio)).

    Målaren **Masaccio** (Tommaso di ser Giovanni, 1401–1428) var den
    förste som använde metoden fullt ut i en stor målning. I
    *Treenigheten* (ca 1425–27) i kyrkan Santa Maria Novella målade han
    ett kapell med kassettvalv som ser ut att gå in i väggen; flyktpunkten
    ligger i en vuxen betraktares ögonhöjd. Den som stod i kyrkan såg ett
    illusoriskt rum. Målningen är en *fresk*, alltså målad på våt
    kalkputs.

    I Brancaccikapellet målade han samtidigt bibelscener med tunga,
    skulpturala människor som kastar skuggor från ett enhetligt ljus, ett
    arv från [Giotto](#giotto-scrovegnikapellet-1305) hundra år tidigare.
    Masaccio dog i Rom bara 26 år gammal. År 1435 beskrev Leon Battista
    Alberti perspektivkonstruktionen i boken *Om måleriet*, och därefter
    blev den standard i italiensk konst. Bakgrunden var Florens som rik
    bankstad där familjer som [Medici](#medici-i-florens) och andra köpmän
    tävlade om att bekosta kyrkokonst.

van-eyck-gentaltaret-1432:
  period: 1420
  label: "van Eyck: Gentaltaret 1432"
  title: "Gentaltaret – oljemåleriets genombrott"
  wiki:
    - "sv:Gentaltaret"
    - "sv:Jan van Eyck"
  text: |
    *Gentaltaret*, eller *Tillbedjan av Guds lamm*, står i S:t
    Bavokatedralen i Gent i Flandern (dagens Belgien). Enligt en
    inskription påbörjades det av Hubert van Eyck och fullbordades 1432 av
    hans bror **Jan van Eyck** (ca 1390–1441), hovmålare hos hertigen av
    Burgund. Beställare var en rik borgare, Joos Vijd, och hans hustru,
    som är avbildade på utsidan. Altaret är en *polyptyk*, ett skåp av
    tolv målade paneler som kan öppnas och stängas; öppet är det omkring
    3,5 × 4,6 meter.

    Jan van Eyck uppfann inte oljefärgen men utvecklade den till något
    nytt ([van Eyck: oljemålning](#van-eyck-oljemalning)). Pigment rivna i
    linolja torkar långsamt och kan läggas i tunna genomskinliga lager,
    *laseringar*, där ljuset tränger igenom och reflekteras. Det ger djupa
    färger och gör det möjligt att återge ytor med häpnadsväckande
    precision: blänk i juveler, enskilda hårstrån, hundratals botaniskt
    korrekta växter. Där [Masaccio](#masaccio-perspektivet-1427) i Florens
    samtidigt byggde rummet med geometri, byggde van Eyck det med ljus och
    detalj.

    Altaret är kanske världens mest stulna konstverk: Napoleons trupper
    förde bort det, delar såldes till Preussen, nazisterna tog det och det
    återfanns 1945 i en saltgruva i Österrike. En panel, ”De rättfärdiga
    domarna”, stals 1934 och är fortfarande försvunnen. En stor
    restaurering pågår sedan 2012.

donatello-david:
  period: 1440
  label: "Donatello: David"
  title: "Donatellos David – antikens nakna kropp återkommer"
  wiki:
    - "en:David (Donatello)"
    - "sv:Donatello"
  text: |
    **Donatello** (Donato di Niccolò, ca 1386–1466) var Florens främste
    bildhuggare och hade lärt sig bronsgjutning i [Ghibertis
    verkstad](#ghibertis-dopkyrkodorrar). Hans bronsstaty av David, den
    bibliske herdepojken som fällde jätten Goliat, är omkring 1,6 meter
    hög och daterad oftast till 1440-talet (dateringen är osäker). Den
    stod på en pelare på innergården i
    [Medicifamiljens](#medici-i-florens) palats.

    Det sensationella var att det var den första fristående nakna
    mansstatyn i full storlek i Europa sedan antiken – drygt tusen år.
    Medeltida skulptur satt nästan alltid fast i kyrkornas väggar och
    portaler, och nakenhet förknippades med synd. David står i en
    avslappnad hållning med tyngden på ena benet (det antika
    *kontrapost*), bär bara en herdehatt och stövlar och har Goliats
    avhuggna huvud under foten. Kroppen är pojkaktig, nästan sensuell,
    vilket har gett upphov till mycket tolkning.

    Statyn var också politik: David, den lille som besegrar den store, var
    Florens symbol mot mäktigare grannar som hertigdömet Milano. Att
    Medici, en bankfamilj utan formell titel, ställde den hemma i sitt
    palats visade att de såg sig som stadens beskyddare. Donatellos David
    är typisk för den [florentinska renässansen](#florentinsk-renassans):
    inspiration från antik skulptur, intresse för anatomi, och rika
    privatpersoner som beställare vid sidan av kyrkan.

fra-angelico:
  period: 1440
  label: "Fra Angelico"
  title: "Fra Angelico – munken som målade"
  wiki:
    - "sv:Fra Angelico"
    - "en:San Marco, Florence"
  text: |
    **Fra Angelico** (”broder ängel”, egentligen Guido di Pietro, ca
    1395–1455) var dominikanermunk och målare i Florens. Dominikanerna var
    en predikarorden, och för dem var bilder ett verktyg för undervisning
    och meditation. Han förenade den äldre gotikens guld och klara blå
    färger med de nya idéerna om rum och ljus från
    [Masaccio](#masaccio-perspektivet-1427).

    Hans huvudverk är freskerna i klostret San Marco i Florens, målade
    omkring 1438–45. Klostret byggdes om på bekostnad av bankiren Cosimo
    de' [Medici](#medici-i-florens), som också hade en egen cell där. Fra
    Angelico och hans medhjälpare målade en *fresk* (målning på våt
    kalkputs) i varje munkcell, ett fyrtiotal, med enkla, nästan tomma
    scener ur Kristi liv som munkarna skulle betrakta i bön. Överst i
    trappan finns den berömda *Bebådelsen*: ängeln och Maria i en ljus
    pelargång konstruerad i perspektiv, utan onödiga detaljer.

    Cosimos stöd var delvis botgöring: en bankir som tog ränta kunde
    anklagas för ocker, en synd i kyrkans ögon, och donationer till kyrkor
    var ett sätt att visa fromhet och tvätta pengarnas rykte. Senare
    arbetade Fra Angelico i Vatikanen åt påven Nikolaus V. Han
    saligförklarades av påven 1982 och är konstnärernas skyddshelgon.

rogier-van-der-weyden:
  period: 1440
  label: "Rogier van der Weyden"
  title: "Rogier van der Weyden – sorgens målare"
  wiki:
    - "sv:Rogier van der Weyden"
    - "en:The Descent from the Cross (van der Weyden)"
  text: |
    **Rogier van der Weyden** (ca 1399–1464) föddes i Tournai och blev
    1436 stadsmålare i Bryssel, som tillhörde hertigdömet Burgund. Han var
    efter [Jan van Eyck](#van-eyck-gentaltaret-1432) den mest
    inflytelserike flamländske målaren och arbetade, som han, i oljefärg
    på ekpanel.

    Hans mest kända verk är *Nedtagandet från korset* (ca 1435, i dag i
    Prado i Madrid), omkring 2,2 × 2,6 meter, målat för armborstskyttarnas
    gille i Leuven. Tio figurer står tätt i en grund guldfärgad låda,
    nästan som målade träskulpturer – ett arv från burgundisk skulptur som
    [Claus Sluters](#claus-sluter-mosebrunnen). Det nya var
    känsloskildringen: tårar som glittrar på kinderna, Maria som svimmar i
    en kroppsställning som speglar den döde Kristus. Van Eyck var sval och
    iakttagande; Rogier ville att betraktaren skulle gråta med.

    Han målade också många porträtt av burgundiska adelsmän och en stor
    *Yttersta domen* för ett sjukhus i Beaune, beställt av hertigens
    kansler Nicolas Rolin, så att sjuka i salen kunde se den från sina
    sängar. Han besökte Rom vid jubelåret 1450. Verkstaden exporterade
    målningar och kopior till Spanien, Italien och Tyskland, och hans
    figurtyper kopierades i hela norra Europa i femtio år – ända upp till
    de altarskåp som importerades till svenska kyrkor.

piero-della-francesca:
  period: 1460
  label: "Piero della Francesca"
  title: "Piero della Francesca – målaren som var matematiker"
  wiki:
    - "sv:Piero della Francesca"
    - "en:Flagellation of Christ (Piero della Francesca)"
  text: |
    **Piero della Francesca** (ca 1415–1492) kom från småstaden Borgo San
    Sepolcro i Toscana och arbetade i flera små italienska hov, framför
    allt hos hertig Federico da Montefeltro i Urbino. Han var både målare
    och matematiker: han skrev en lärobok i räkning för köpmän, en
    avhandling om de fem regelbundna polyedrarna och *De prospectiva
    pingendi* (”Om perspektiv i måleriet”), den första systematiska
    geometriska behandlingen av
    [perspektivet](#perspektivet-brunelleschi-masaccio), med
    konstruktioner punkt för punkt av till exempel en kropp eller ett
    huvud i projektion.

    Hans målningar ser ut som de är byggda: lugna, stilla figurer med
    enkla, nästan geometriska former, ett klart och jämnt dagsljus och
    ljusa pastellfärger. I *Gisslingen av Kristus* (Urbino, ca 1455–60) är
    rummet konstruerat så exakt att forskare har kunnat rekonstruera
    planlösningen och golvets mönster i mått. Freskerna om *Det heliga
    korsets legend* i Arezzo (ca 1452–66) och dubbelporträttet av Federico
    och hans hustru, i strikt profil mot ett vidsträckt landskap, hör till
    de mest kända.

    Hans matematiska texter användes av hans landsman Luca Pacioli, vars
    bok om aritmetik och [dubbel
    bokföring](#pacioli-summa-1494-dubbel-bokforing) blev en storsäljare i
    tryck; konstkrönikören Giorgio Vasari anklagade honom senare för
    plagiat. Piero visar hur nära konst, köpmannaräkning och geometri låg
    varandra i 1400-talets Italien.

mantegna:
  period: 1460
  label: "Mantegna"
  title: "Andrea Mantegna – antiken och illusionen"
  wiki:
    - "sv:Andrea Mantegna"
    - "en:Camera degli Sposi"
  text: |
    **Andrea Mantegna** (ca 1431–1506) utbildades i Padua, en
    universitetsstad där lärda samlade romerska inskriptioner och ruiner
    studerades. Han blev besatt av antiken: hans målningar är fulla av
    noggrant återgivna romerska byggnader, rustningar och reliefer, och
    figurerna ser nästan ut som av sten. Från 1460 var han hovmålare hos
    familjen Gonzaga, markiser av Mantua, resten av livet.

    Hans mest berömda verk är *Camera degli Sposi* (brudparets rum) i
    Mantuas palats, målat 1465–74. Väggarna visar familjen Gonzaga, hovmän
    och hundar i naturlig storlek, som om de stod i rummet. I taket målade
    han en illusorisk rund öppning mot himlen, där änglar och tjänarinnor
    tittar ner över en balustrad – det första stora exemplet på perspektiv
    sett rakt underifrån. Det tekniska tricket blev standard i barockens
    takmålningar. I *Den döde Kristus* (Milano) är kroppen skildrad i
    extrem förkortning från fötterna.

    Mantegna var också en av de första stora konstnärerna som använde
    *kopparstick*: en bild graveras in i en kopparplåt, plåten färgas in
    och trycks på papper i många exemplar. Samtidigt som
    [boktryckerier](#tryckerier-i-alla-storre-stader) spred sig över
    Europa började bilder alltså spridas som massvara. Den unge [Albrecht
    Dürer](#durer) i Nürnberg kopierade Mantegnas stick för att lära sig
    italiensk stil. Mantegna var gift med dotter till venetianaren Jacopo
    Bellini och påverkade det venetianska måleriet.

albertus-pictor-i-svenska-kyrkor:
  period: 1460
  label: "Albertus Pictor i svenska kyrkor"
  title: "Albertus Pictor – Mälardalens kyrkmålare"
  wiki:
    - "sv:Albertus Pictor"
    - "sv:Täby kyrka"
  text: |
    **Albertus Pictor** (”Albert målaren”, ca 1440–1509) var en tyskfödd
    konstnär, troligen från Hessen, som kom till Stockholm på 1460-talet.
    Han gifte sig med änkan efter en målare och tog över hans verkstad –
    det vanliga sättet att få verkstad i en skråstyrd stad. Han var också
    pärlstickare och broderade kyrkliga textilier. Som de flesta
    hantverkare i det hansedominerade Stockholm var han en del av en
    nordtysk kultur.

    Hans verkstad målade valv och väggar i ett trettiotal kyrkor i
    Uppland, Västmanland och Södermanland, bland andra Härkeberga, Täby,
    Solna och Odensala. Målningarna är *kalkmålningar*, målade på torr
    kalkputs i ett begränsat antal färger: rött, gult, grönt, svart. De är
    klara, berättande och ofta humoristiska, med bibelscener,
    helgonlegender och moraliska bilder. Förebilden var ofta tryckta
    blockböcker som *Biblia pauperum* (”de fattigas bibel”), en tidig
    bilderbok där gammaltestamentliga och nytestamentliga scener ställs
    bredvid varandra.

    Det mest kända motivet är *Döden spelar schack* i Täby kyrka, en del
    av senmedeltidens dödsbilder efter pesten (se [pesten i
    konsten](#pesten-i-konsten)). Ingmar Bergman lät sig inspireras av det
    i filmen *Det sjunde inseglet* (1957). Kyrkorna var församlingarnas
    samlingslokaler, och för en befolkning som inte kunde läsa var
    målningarna en sorts lärobok. Jämför med Lübeckmästaren [Bernt
    Notke](#bernt-notke-s-t-goran-1489), som samtidigt arbetade i
    Stockholm. Efter [reformationen](#reformation-vasteras-1527) kalkades
    många målningar över och har tagits fram igen i modern tid.

botticelli-venus-fodelse:
  period: 1480
  label: "Botticelli: Venus födelse"
  title: "Botticelli: Venus födelse"
  wiki:
    - "sv:Venus födelse (Botticelli)"
    - "sv:Sandro Botticelli"
  text: |
    **Sandro Botticelli** (ca 1445–1510) var en florentinsk målare som
    arbetade för kretsen kring [Medici](#medici-i-florens), stadens
    styrande bankfamilj. *Venus födelse* målades omkring 1484–86 och finns
    i dag i Uffizierna i Florens. Den är stor, ungefär 1,7 × 2,8 meter,
    och målad med tempera (pigment i äggula) på duk – ovanligt vid denna
    tid, då duk mest användes för billigare dekorationer.

    Motivet kommer från grekisk mytologi: kärleksgudinnan Venus har fötts
    ur havets skum och blåses i land på ett snäckskal av västanvinden, där
    en gudinna väntar med en mantel. Hon är naken och nästan i naturlig
    storlek – den första stora icke-religiösa nakenbilden av en kvinna
    sedan antiken. Hennes pose kommer från en antik staty. Ändå är figuren
    inte anatomiskt realistisk: halsen är lång, axlarna sluttar, hon
    svävar snarare än står. Botticelli var mer intresserad av linje och
    rytm än av kroppar med tyngd.

    Kretsen kring Medici var påverkad av *nyplatonismen*, filosofen
    Marsilio Ficinos försök att förena Platons filosofi med kristendomen,
    där jordisk skönhet kunde leda själen mot det gudomliga. Det gjorde
    hedniska motiv acceptabla. Kring 1490 vände stämningen i Florens när
    botpredikanten [Savonarola](#savonarola) fördömde lyx och lät bränna
    ”fåfänglighetens” föremål. Botticelli blev enligt senare källor själv
    from och målade därefter mest religiösa bilder.

leonardo-nattvarden-1498:
  period: 1480
  label: "Leonardo: Nattvarden 1498"
  title: "Leonardo da Vincis Nattvarden"
  wiki:
    - "sv:Nattvarden (Leonardo da Vinci)"
    - "sv:Leonardo da Vinci"
  text: |
    **[Leonardo da Vinci](#leonardo)** (1452–1519) var utbildad i Florens
    men arbetade 1482–99 i Milano hos hertigen Ludovico Sforza, som
    ingenjör, festarrangör och målare. Sforza lät bekosta en ny målning i
    matsalen i dominikanerklostret Santa Maria delle Grazie, där munkarna
    åt under tystnad. Leonardo målade den ca 1495–98 på väggens hela
    bredd, ungefär 4,6 × 8,8 meter.

    Motivet är Jesu sista måltid. Leonardo valde ögonblicket direkt efter
    att Jesus sagt ”en av er ska förråda mig”: de tolv lärjungarna
    reagerar i fyra grupper om tre, med gester av förskräckelse, ilska och
    förnekelse – ett psykologiskt drama i stället för en stel rad. Rummets
    perspektivlinjer möts i Jesu huvud, så att geometrin själv pekar ut
    huvudpersonen. Målningen ser ut att förlänga den verkliga matsalen.

    Leonardo ville arbeta långsamt och kunna ändra, vilket en äkta *fresk*
    på våt puts inte tillåter. Han experimenterade därför med tempera och
    olja på torr puts. Det misslyckades: färgen började flagna redan inom
    några decennier. Väggen överlevde ett bombanfall 1943 tack vare
    sandsäckar, och en restaurering 1978–99 – 21 år – tog bort århundraden
    av övermålningar. Mycket av det vi ser i dag är rester. Leonardos
    experimentlusta syns också i hans [anteckningsböcker om flygmaskiner
    och mekanik](#leonardo-flygmaskiner-mekanik).

bernt-notke-s-t-goran-1489:
  period: 1480
  label: "Bernt Notke: S:t Göran 1489"
  title: "Bernt Notke: S:t Göran och draken"
  wiki:
    - "sv:S:t Göran och draken (Storkyrkan)"
    - "sv:Bernt Notke"
  text: |
    **Bernt Notke** (ca 1435–1509) var bildhuggare och målare från Lübeck,
    Hansans huvudstad, och den ledande konstnären i Östersjöområdet under
    senmedeltiden. Han gjorde altarskåp till Århus och Tallinn, och en
    lång målad dödsdans till Lübecks Mariakyrka (1463).

    Den svenske riksföreståndaren [Sten Sture d.ä.](#sten-sture-d-a)
    beställde av honom en skulpturgrupp till Storkyrkan i Stockholm som
    minnesmärke över segern mot danske kungen vid [Brunkeberg
    1471](#brunkeberg-1471). Den invigdes 1489. Gruppen visar helgonet S:t
    Göran (Georg) till häst när han dödar en drake för att rädda en
    prinsessa, som står bredvid och ber. Den är snidad i ek, målad och
    förgylld, i mer än naturlig storlek. Notke använde riktiga älghorn som
    taggar på drakens rygg, och riddarens rustning är detaljerat skuren
    efter tidens verkliga harneskar.

    Budskapet var tydligt: draken var Danmark, prinsessan Sverige och
    riddaren Sten Sture, som enligt traditionen själv står modell. Gruppen
    innehöll också reliker – benbitar av helgonet – vilket gjorde den till
    ett andaktsföremål. Det är en sengotisk stil: livlig, detaljerad, med
    veckade tyger och dramatik, långt från den antikinspirerade renässans
    som samtidigt växte i Italien. I samma period målade [Albertus
    Pictor](#albertus-pictor-i-svenska-kyrkor) Mälardalens kyrkor. En
    bronskopia står på Köpmantorget i Gamla stan.

mona-lisa:
  period: 1500
  label: "Mona Lisa"
  title: "Mona Lisa – världens mest kända målning"
  wiki:
    - "sv:Mona Lisa"
  text: |
    *Mona Lisa* är ett porträtt av Lisa Gherardini, hustru till
    sidenhandlaren Francesco del Giocondo i Florens (därav det italienska
    namnet *La Gioconda*). [Leonardo da Vinci](#leonardo) började måla det
    omkring 1503, men lämnade aldrig ifrån sig det; han fortsatte arbeta
    på det i över tio år och tog det med till Frankrike när han 1516
    flyttade dit på inbjudan av kung [Frans I](#frans-i). Därför hamnade
    det i franska kungliga samlingen och sedan i Louvren.

    Målningen är liten, 77 × 53 cm, i oljefärg på en panel av poppelträ.
    Det nya var tekniken *sfumato* (”rökigt”): Leonardo lade på dussintals
    nästan genomskinliga oljelager så att konturerna löses upp i mjuka
    övergångar utan skarpa linjer. Därför är det svårt att avgöra exakt
    var mungiporna slutar – det gåtfulla leendet är delvis en optisk
    effekt. Hon sitter i trekvartsvy framför ett drömlikt landskap, en
    komposition som kopierades av unga [Rafael](#rafael) och blev en
    modell för porträttkonsten.

    Världsberömd blev hon först 1911, när en italiensk glasmästare stal
    henne från Louvren. Tidningar över hela världen skrev om stölden i två
    år tills tavlan återfanns 1913. Därefter har den blivit en ikon för
    reklam och popkonst. Den anses i praktiken ovärderlig; vid en utlåning
    till USA 1962–63 värderades den för försäkringsändamål till 100
    miljoner dollar.

michelangelo-sixtinska-kapellet-150812:
  period: 1500
  label: "Michelangelo: Sixtinska kapellet 1508–12"
  title: "Michelangelos tak i Sixtinska kapellet"
  wiki:
    - "sv:Sixtinska kapellet"
    - "sv:Michelangelo"
  text: |
    **Michelangelo Buonarroti** (1475–1564) från Florens såg sig själv som
    bildhuggare – han hade redan huggit sin berömda marmorstaty David.
    Ändå beordrade påven Julius II honom 1508 att måla taket i Sixtinska
    kapellet i Vatikanen, påvens privata kapell där påveval fortfarande
    hålls. Han arbetade i fyra år, 1508–12, med få medhjälpare, stående på
    en ställning av egen konstruktion med huvudet bakåtböjt (inte
    liggande, som myten säger).

    Takvalvet är omkring 40 × 13 meter. Det är målat i *fresk* –
    vattenbaserade pigment på våt kalkputs, en dagsportion i taget – och
    rymmer över 300 figurer. I mitten visas nio scener ur Första
    Moseboken, från ljusets skapelse till Noas berusning, med den berömda
    *Adams skapelse* där Guds och Adams fingrar nästan möts. Runtom sitter
    profeter och sibyllor (antikens kvinnliga siare) och nakna unga män,
    *ignudi*, som visar Michelangelos fascination för den muskulösa
    manskroppen. Allt är inramat av målad, illusorisk arkitektur.

    Bakgrunden var påvens ambition att göra Rom till kristenhetens
    prakthuvudstad. Samtidigt arbetade [Rafael](#rafael) några rum bort,
    och Peterskyrkan byggdes om – ett projekt som delvis finansierades
    genom försäljning av avlat, vilket utlöste [Luthers protest
    1517](#luther-95-teser-1517). En restaurering 1980–94 tog bort sot och
    lim och avslöjade starka, klara färger, vilket ändrade bilden av
    Michelangelo som kolorist. Han återvände senare för att måla [Yttersta
    domen](#michelangelo-yttersta-domen-1541) på altarväggen.

rafael:
  period: 1500
  label: "Rafael"
  title: "Rafael – högrenässansens harmoni"
  wiki:
    - "sv:Rafael (konstnär)"
    - "sv:Skolan i Aten"
  text: |
    **Rafael** (Raffaello Sanzio, 1483–1520) var son till en hovmålare i
    Urbino och lärde sig snabbt av alla han mötte: Perugino, och i Florens
    [Leonardo](#leonardo) och Michelangelo. Han är känd för sina mjuka,
    harmoniska madonnabilder, där Maria och barnet bildar en lugn triangel
    i ett ljust landskap. Tillsammans med Leonardo och Michelangelo räknas
    han till *högrenässansen*, de ungefär trettio år kring 1500 då den
    italienska renässansens ideal om balans och naturtrohet nådde sin
    fulländning.

    År 1508 kallades han till Rom av påven Julius II för att måla påvens
    bostadsrum i Vatikanen, *Stanze*, samtidigt som Michelangelo målade
    [Sixtinska kapellets tak](#michelangelo-sixtinska-kapellet-150812).
    Mest känd är fresken *Skolan i Aten* (ca 1509–11): ett femtiotal
    antika filosofer och vetenskapsmän – Platon, Aristoteles, Euklides,
    Pythagoras – samlade i en väldig valvhall konstruerad i perspektiv.
    Platon har troligen Leonardos ansikte. Bilden fungerar som en bildlig
    förklaring till att kyrkan nu omfamnade antik vetenskap.

    Rafael drev en verkstad med omkring femtio medhjälpare, blev
    chefsarkitekt för Peterskyrkan 1514 och ritade vävda gobelänger till
    Sixtinska kapellet, vävda i Bryssel. Hans kompositioner spreds över
    Europa genom kopparstick som Marcantonio Raimondi tryckte efter hans
    teckningar. Han dog bara 37 år gammal 1520. Hans efterföljare drev
    hans stil mot det konstlade, vilket blev början på
    [manierismen](#manierism).

durer:
  period: 1500
  label: "Dürer"
  title: "Albrecht Dürer – tryckkonstens första stjärna"
  wiki:
    - "sv:Albrecht Dürer"
    - "en:Melencolia I"
  text: |
    **Albrecht Dürer** (1471–1528) var son till en guldsmed i Nürnberg, en
    av Tysklands rikaste handelsstäder och ett centrum för boktryck. Hans
    gudfar var en av tidens största boktryckare. Dürer reste två gånger
    till Italien (1494–95 och 1505–07), studerade [Mantegna](#mantegna)
    och venetianarna och blev den som förde renässansens idéer om
    proportion, perspektiv och anatomi till norra Europa.

    Han förstod tidigt att
    [tryckpressen](#tryckerier-i-alla-storre-stader) gjorde bilder till en
    handelsvara. Han gjorde *träsnitt* (bilden skärs ut i relief i en
    träkloss och trycks som boktryck) och *kopparstick* (linjer graveras i
    kopparplåt) och sålde dem själv i tusentals exemplar på marknader över
    Europa. Serien *Apokalypsen* (1498) och sticken *Riddaren, döden och
    djävulen* (1513) och *Melencolia I* (1514), med ett magiskt kvadrat
    där mittraden bildar årtalet 1514, hör till de mest kända. Hans
    träsnitt av en noshörning (1515), som han aldrig sett, blev
    européernas bild av djuret i 200 år. Han stämde en italiensk kopist
    som förfalskat hans monogram AD – ett tidigt upphovsrättsfall.

    Han var också en av de första konstnärerna som målade självporträtt
    som självständiga verk, bland annat ett från 1500 där han framställer
    sig nästan som Kristus. Han skrev läroböcker i geometri och
    proportioner och ritade apparater för att teckna i perspektiv. Under
    reformationen sympatiserade han med [Luther](#luther-95-teser-1517).

tizian:
  period: 1520
  label: "Tizian"
  title: "Tizian – färgens mästare i Venedig"
  wiki:
    - "sv:Tizian"
    - "en:Assumption of the Virgin (Titian)"
  text: |
    **Tizian** (Tiziano Vecellio, ca 1488/90–1576) var den ledande målaren
    i Venedig i över femtio år. Venedig var en rik handelsrepublik som
    importerade pigment från hela Medelhavet och Orienten, och stadens
    målare arbetade i oljefärg på duk i stället för fresk, eftersom den
    fuktiga luften förstörde väggmålningar. Duk var också lätt att rulla
    ihop och skicka – viktigt för en konstnär med kunder i hela Europa.

    Medan florentinarna byggde bilden på teckning och kontur (*disegno*)
    byggde venetianarna den på färg och ljus (*colorito*). Tizian målade i
    många lager och lät penseldragen synas, och på äldre dar blev hans
    måleri nästan löst, med färg pålagd även med fingrarna. Kända verk är
    den nästan sju meter höga altartavlan *Marie himmelsfärd* (1516–18) i
    kyrkan Frari i Venedig och *Venus från Urbino* (1538), en naken kvinna
    på en säng i ett samtida rum, som blev förebild för liggande
    nakenbilder ända till Manets *Olympia* 1863.

    Han blev hovmålare hos kejsar [Karl V](#karl-v-kejsare), den
    mäktigaste mannen i Europa, och målade honom till häst efter segern
    vid Mühlberg 1547 – en förebild för alla senare härskarporträtt. Sedan
    målade han mytologiska bilder för hans son [Filip II av
    Spanien](#filip-ii-1556). Tizian dog under en pestepidemi i
    Venedig 1576.

holbein:
  period: 1520
  label: "Holbein"
  title: "Hans Holbein d.y. – porträttören vid Henrik VIII:s hov"
  wiki:
    - "sv:Hans Holbein d.y."
    - "en:The Ambassadors (Holbein)"
  text: |
    **Hans Holbein den yngre** (1497/98–1543) föddes i Augsburg i en
    målarfamilj och verkade först i Basel, en boktryckarstad där han
    ritade illustrationer och porträtterade humanisten Erasmus av
    Rotterdam. När reformationen kom till Basel och bilder rensades ut ur
    kyrkorna 1529 försvann marknaden för religiös konst. Med
    rekommendationsbrev från Erasmus reste Holbein till England, först
    1526–28 hos [Thomas More](#thomas-more-utopia-1516) och sedan 1532 för
    gott.

    Han blev hovmålare åt [Henrik VIII](#henrik-viii-bryter-med-rom-1534)
    och skapade den bild av kungen vi fortfarande har: bred, frontal, med
    benen isär och dyrbara kläder – medvetet maktpropaganda. Hans porträtt
    i oljefärg är extremt detaljerade och nästan fotografiskt exakta i
    tyger, pälsar och ansikten. I *Ambassadörerna* (1533, London) står två
    franska diplomater bland vetenskapliga instrument, och över golvet
    svävar en sned form som blir till en dödskalle bara om man ser den
    från sidan – en *anamorfos*, en avsiktligt förvrängd perspektivbild.
    Den påminde om döden mitt i den världsliga lärdomen.

    Holbein skickades också att porträttera tänkbara brudar åt kungen.
    Hans smickrande porträtt av Anna av Kleve bidrog till äktenskapet
    1540, som Henrik ångrade och upplöste inom ett halvår. Holbein ritade
    också en berömd träsnittsserie med dödsdansmotiv (tryckt 1538, se
    [pesten i konsten](#pesten-i-konsten)). Han dog i London 1543,
    troligen av pest.

manierism:
  period: 1520
  label: "manierism"
  title: "Manierismen – konst efter fulländningen"
  wiki:
    - "sv:Manierism"
    - "en:Madonna with the Long Neck"
  text: |
    **Manierism** kallas den stil som rådde i Italien ungefär 1520–1600,
    mellan högrenässansen och barocken. Ordet kommer av italienskans
    *maniera*, ”stil” eller ”sätt”. När [Rafael](#rafael), Leonardo och
    Michelangelo ansågs ha löst måleriets problem – perspektiv, anatomi,
    harmoni – sökte nästa generation något nytt genom att medvetet bryta
    mot reglerna. Ordet användes länge nedsättande, om konst som var
    konstlad.

    Kännetecknen är långsträckta kroppar med små huvuden, vridna poser
    (*figura serpentinata*, ”ormlik figur”), trånga eller orimliga rum,
    skarpa och onaturliga färger som syrligt rosa och grönt, och ett
    kyligt, intellektuellt raffinemang. Exempel är Parmigianinos *Madonnan
    med den långa halsen* (1534–40), där Maria har en orimligt lång hals,
    Pontormos svävande, rumslösa *Nedtagandet från korset* (1525–28) i
    Florens och Bronzinos glatta, porslinsaktiga hovporträtt för
    Medicihertigarna. Inom skulpturen gjorde Giambologna figurer som
    skulle ses från alla håll.

    Tiden var orolig: [Rom plundrades 1527](#rom-plundras-1527) av
    kejsarens legosoldater, reformationen splittrade kyrkan och Italien
    hamnade under spansk dominans. Manierismen var främst en hovkonst för
    kännare som uppskattade skicklighet och elegans. Stilen spreds till
    Frankrike genom slottet Fontainebleau och till Prag, och den sene
    Michelangelos [Yttersta domen](#michelangelo-yttersta-domen-1541) och
    [El Grecos](#el-greco) målningar i Spanien har tydliga manieristiska
    drag.

mogulmalning-tar-form:
  period: 1520
  label: "Mogulmålning tar form"
  title: "Mogulmåleriet – persisk miniatyr möter Indien"
  wiki:
    - "en:Mughal painting"
    - "en:Hamzanama"
  text: |
    År 1526 erövrade Babur, en centralasiatisk furste som härstammade från
    både Timur och Djingis khan, norra Indien ([slaget vid
    Panipat](#babur-vinner-vid-panipat-1526-mogulriket)) och grundade
    Mogulriket. Hans son Humayun förlorade riket och levde 1540-talet i
    [exil i Persien](#humayun-i-exil-i-persien) vid safavidhovet, som hade
    den tidens förnämsta bokmåleri. När han återvände tog han med sig två
    persiska mästare, Mir Sayyid Ali och Abd al-Samad, som byggde upp en
    kunglig målarverkstad.

    Under Humayuns son [Akbar](#akbar-1556) växte verkstaden till omkring
    hundra konstnärer, de flesta indiska hinduer och muslimer. Den första
    stora beställningen var *Hamzanama* (ca 1562–77), ett äventyrsepos om
    profeten Muhammeds farbror, med cirka 1 400 stora målningar på tyg,
    varav ett par hundra finns kvar. Bilderna visades upp medan berättaren
    läste högt – nästan som en serieroman.

    Tekniken var opak vattenfärg (pigment med gummi arabicum) på papper
    eller tyg, polerat med sten så att ytan glänste, med mycket fina
    penslar. Stilen förenar persiskt bokmåleris klara färger, platta
    mönster och höga horisonter med indisk livlighet, rörelse och djur,
    och senare även europeiskt perspektiv och skuggning från gravyrer som
    jesuitmissionärer förde med sig. Mogulmåleriet blev mer realistiskt
    med tiden och utvecklades vidare under [Akbars
    bokmålare](#akbars-bokmalare) mot porträtt och naturstudier.

michelangelo-yttersta-domen-1541:
  period: 1540
  label: "Michelangelo: Yttersta domen 1541"
  title: "Michelangelos Yttersta domen"
  wiki:
    - "sv:Yttersta domen (Michelangelo)"
    - "en:The Last Judgment (Michelangelo)"
  text: |
    Mer än tjugo år efter
    [takmålningarna](#michelangelo-sixtinska-kapellet-150812) återvände
    Michelangelo till Sixtinska kapellet för att täcka hela altarväggen,
    ungefär 13,7 × 12 meter, med en fresk av *Yttersta domen*: världens
    slut, då Kristus enligt kristen tro dömer alla människor till himmel
    eller helvete. Han arbetade 1536–41, först på uppdrag av påven Clemens
    VII och sedan Paulus III.

    Världen hade förändrats sedan taket. Rom hade [plundrats
    1527](#rom-plundras-1527), och reformationen hade splittrat kyrkan.
    Bilden är mörkare och mer orolig än taket: över 300 muskulösa,
    mestadels nakna gestalter virvlar runt en kraftfull, skägglös Kristus
    med lyftad arm. Det finns ingen lugn perspektivisk arkitektur, bara
    kroppar i ett blått tomrum – ett drag som pekar mot
    [manierismen](#manierism). Helgonet Bartolomeus, som enligt legenden
    flåddes levande, håller upp sin avdragna hud, och i den har man sett
    ett förvrängt självporträtt av Michelangelo.

    Nakenheten väckte skandal. Påvens ceremonimästare Biagio da Cesena
    kallade den passande för ett badhus; Michelangelo målade då in honom
    som helvetesdomaren Minos med åsneöron och en orm runt kroppen. Efter
    [tridentinska mötet](#tridentinska-motet-jesuiter), där katolska
    kyrkan skärpte kraven på anständighet i religiös konst, fick målaren
    Daniele da Volterra 1565 måla över könsdelar med tygstycken, vilket
    gav honom öknamnet ”byxmakaren”. Några av dessa togs bort vid
    restaureringen på 1990-talet.

mimar-sinan-suleymaniyemosken:
  period: 1540
  label: "Mimar Sinan: Süleymaniyemoskén"
  title: "Mimar Sinan och Süleymaniyemoskén"
  wiki:
    - "sv:Süleymaniyemoskén"
    - "sv:Mimar Sinan"
  text: |
    **Mimar Sinan** (ca 1490–1588; *mimar* betyder arkitekt) var
    chefsarkitekt i Osmanska riket i nästan femtio år, från 1539. Han var
    född kristen i Anatolien och togs ut genom *devşirme*, ett system där
    osmanerna rekryterade kristna pojkar som konverterades och utbildades
    till soldater och ämbetsmän. Som janitsjar (elitsoldat) lärde han sig
    bygga broar och fästningar under fälttåg. Hundratals byggnader
    tillskrivs honom – moskéer, skolor, badhus, broar och karavanseraljer.

    Süleymaniyemoskén i Istanbul byggdes 1550–57 åt sultan [Süleyman den
    store](#suleyman-den-store-1520), då riket var på höjden av sin makt.
    Den centrala kupolen är omkring 26 meter i diameter och når ungefär 53
    meter över golvet, buren av fyra väldiga pelare och halvkupoler, och
    omgiven av fyra minareter. Interiören är ljus tack vare över hundra
    fönster, och väggarna har kakel från Iznik med blommotiv. Moskén ingår
    i en *külliye*, ett stiftelsekomplex med skolor, sjukhus, soppkök för
    fattiga, badhus och gravarna för Süleyman och hans hustru Hürrem.

    Förebilden och konkurrenten var Hagia Sofia, den bysantinska
    kejsarkyrkan från 500-talet som blivit moské efter att [osmanerna
    erövrade Konstantinopel 1453](#mehmed-ii-tar-konstantinopel-1453).
    Sinan ville överträffa den, vilket han själv ansåg att han lyckades
    med i Selimiyemoskén i Edirne (1568–75). Samtidigt formulerade
    [Palladio](#palladio) i Italien en egen tolkning av antik arkitektur –
    två parallella svar på samma romerska arv.

bruegel-bonder-och-babels-torn:
  period: 1560
  label: "Bruegel: Bönder och Babels torn"
  title: "Pieter Bruegel – bönder, årstider och Babels torn"
  wiki:
    - "sv:Pieter Bruegel den äldre"
    - "en:The Tower of Babel (Bruegel)"
  text: |
    **Pieter Bruegel den äldre** (ca 1525/30–1569) verkade i Antwerpen och
    Bryssel i de spanskstyrda Nederländerna. Antwerpen var då Europas
    största handelshamn, och där fanns en av de första öppna
    konstmarknaderna, där målningar såldes till köpmän utan
    förhandsbeställning. Bruegel målade mest för en krets av rika samlare,
    inte för kyrkan.

    Han är känd för att göra vanliga människor till huvudmotiv. I
    *Bondbröllopet* och *Bonddansen* (ca 1567) äter, dricker och dansar
    bönderna; i *Nederländska ordspråk* (1559) illustrerar över hundra
    figurer var sitt talesätt. Köpmannen Niclaes Jonghelinck beställde en
    serie om årets månader (1565), däribland *Jägarna i snön*, med svarta
    figurer mot vit snö, frusna dammar och skridskoåkare – målad under de
    kalla vintrarna under [lilla istiden](#lilla-istiden-borjar).

    *Babels torn* (1563, Wien) visar den bibliska berättelsen om människor
    som ville bygga ett torn till himlen och straffades med att inte
    längre förstå varandras språk. Tornet liknar Colosseum i Rom, som
    Bruegel sett på sin Italienresa, och byggarbetsplatsen är skildrad med
    kranar, ställningar och stenbrott i teknisk detalj. Många tolkar den
    som en kommentar till högmod – och till Antwerpen, där köpmän talade
    alla språk. Några år senare utbröt bildstormar och [upproret mot
    Spanien](#nederlandska-upproret-1568).

palladio:
  period: 1560
  label: "Palladio"
  title: "Andrea Palladio – arkitekten som kopierades i hela världen"
  wiki:
    - "sv:Andrea Palladio"
    - "sv:Villa Rotonda"
  text: |
    **Andrea Palladio** (1508–1580) började som stenhuggare i Padua och
    Vicenza i Venedigs fastlandsområde. En humanistisk adelsman, Gian
    Giorgio Trissino, upptäckte honom, gav honom det klassiskt klingande
    namnet Palladio och tog honom till Rom för att mäta och rita antika
    ruiner.

    Han byggde främst palats i Vicenza och villor på landsbygden åt
    venetianska adelsfamiljer. När Venedigs handel i Medelhavet hotades av
    osmanerna och de nya portugisiska sjövägarna investerade adeln i
    jordbruk på fastlandet, och villorna var både herrgårdar och
    lantbruksanläggningar. Palladio gav dem tempelfasader med kolonner och
    triangulär gavel, strikt symmetri och proportioner byggda på enkla
    talförhållanden. Den mest kända är Villa Rotonda (påbörjad ca 1567)
    med fyra likadana tempelfasader och en kupol. Materialet var ofta
    billigt tegel täckt med puts som skulle se ut som sten. I Venedig
    byggde han kyrkorna San Giorgio Maggiore och Il Redentore, den senare
    som tack för slutet på en pestepidemi 1577.

    Hans största inflytande kom genom boken *Fyra böcker om arkitekturen*
    (1570), tryckt med träsnitt av hans ritningar. Den blev en mall som
    arkitekter i England, och därifrån i Nordamerika, kunde följa utan att
    resa till Italien. Thomas Jeffersons Monticello och många amerikanska
    statsbyggnader är ”palladianska”, liksom många herrgårdar i Sverige.
    Jämför med samtida [Mimar Sinan](#mimar-sinan-suleymaniyemosken) i
    Istanbul och den senare [nyklassicismen](#nyklassicism-winckelmann).

el-greco:
  period: 1580
  label: "El Greco"
  title: "El Greco – grek i Toledo"
  wiki:
    - "sv:El Greco"
  text: |
    **El Greco** (”greken”) hette egentligen Domenikos Theotokopoulos
    (1541–1614). Han föddes på Kreta, som då tillhörde Venedig, och
    utbildade sig först till ikonmålare i den bysantinska traditionen:
    platta, guldglänsande helgonbilder. Runt 1567 flyttade han till
    Venedig, där han lärde sig oljemåleri och fri penselföring av
    [Tizian](#tizian), och sedan till Rom. 1577 slog han sig ner i Toledo
    i Spanien och stannade där livet ut.

    Hans stil är lätt att känna igen: utdragna, smala kroppar, fladdrande
    ljus, kalla gröna, gula och blå färger och rum som inte följer vanlig
    perspektivgeometri. Den hör till **manierismen**, en sen renässansstil
    som medvetet bröt mot de ”korrekta” proportionerna (se
    [manierism](#manierism)). Huvudverket *Greve Orgaz begravning*
    (1586–88, ca 4,8 × 3,6 m) i kyrkan Santo Tomé visar en jordisk
    begravning nedtill och himlen öppen ovanför.

    Beställarna var kyrkor och kloster i ett Spanien präglat av
    [motreformationen](#motreformation): katolska kyrkan ville ha bilder
    som väckte stark religiös känsla. Kung [Filip II](#filip-ii-1556)
    gillade däremot inte hans altartavla för klostret El Escorial, så El
    Greco fick aldrig rollen som hovmålare. Efter sin död glömdes han
    nästan bort, tills konstnärer runt 1900, bland andra Picasso, såg
    honom som en föregångare till modernismen.

kano-skolan-i-japan:
  period: 1580
  label: "Kanō-skolan i Japan"
  title: "Kanō-skolan: guld på slottsväggarna"
  wiki:
    - "en:Kanō school"
    - "en:Kanō Eitoku"
  text: |
    **Kanō-skolan** var en japansk målarfamilj och verkstad som grundades
    av Kanō Masanobu (1434–1530) och som sedan i nära 400 år, ända till
    1868, var de styrande militärledarnas (shogunernas) officiella målare.
    Kunskapen gick i arv inom släkten och till adopterade elever, ungefär
    som ett skrå.

    Skolans storhetstid kom med Kanō Eitoku (1543–1590). Under
    inbördeskrigens slutskede byggde krigsherrarna [Oda
    Nobunaga](#oda-nobunaga-borjar-ena-landet) och [Toyotomi
    Hideyoshi](#hideyoshi-enar-japan-1590) väldiga borgar, och Eitoku
    dekorerade deras inre. Han målade på **vikskärmar** (byōbu) och
    **skjutdörrar** (fusuma) av papper, med bakgrund av bladguld och motiv
    i tusch och mineralfärger: jättelika tallar, cypresser, tigrar och
    drakar. Guldet var inte bara lyx – det reflekterade det svaga ljuset i
    de mörka borgsalarna. Stilen visade makt; den kallas ofta
    Momoyama-stil efter perioden.

    Motiven och penseltekniken kom ursprungligen från kinesiskt
    tuschmåleri, men Kanō-målarna gjorde dem större, mer dekorativa och
    färgstarka. Mycket gick förlorat när borgarna brändes, till exempel
    Nobunagas Azuchi-borg 1582. Under
    [Tokugawa-shogunatet](#tokugawa-shogunatet-1603) blev skolan en stel
    statlig institution med läroböcker och kopiering av äldre förlagor –
    samtidigt i tid med att Europa byggde upp sina egna konstakademier.

akbars-bokmalare:
  period: 1580
  label: "Akbars bokmålare"
  title: "Akbars bokmålare – miniatyrer i Mogulriket"
  wiki:
    - "en:Mughal painting"
    - "en:Hamzanama"
  text: |
    [Akbar](#akbar) (regerade 1556–1605) var stormogul, alltså kejsare i
    Mogulriket, ett muslimskt rike som omfattade större delen av norra
    Indien. Han kunde troligen inte läsa själv, men lät läsa högt för sig
    och byggde upp en stor verkstad för illustrerade handskrifter, en
    *kitab-khana* (”bokhus”), med över hundra målare, kalligrafer och
    bokbindare.

    Ledarna var två persiska mästare, Mir Sayyid Ali och Abd al-Samad, som
    hans far Humayun tagit med från Iran (se [Mogulmålning tar
    form](#mogulmalning-tar-form)). Merparten av målarna var dock indier,
    många hinduer, som Daswanth och Basawan. Det största projektet var
    *Hamzanama*, en äventyrsberättelse i ca 1 400 stora bilder på tyg, som
    tog omkring 15 år (ca 1562–1577). Senare kom krönikan *Akbarnama* om
    kejsarens egen regering.

    Tekniken var täckande vattenfärg på papper, med pigment av mineraler,
    guld och silver och mycket fina penslar. Stilen blandade persiskt
    **miniatyrmåleri** (små, detaljrika bokbilder i klara färger) med
    indisk livfullhet – och europeiskt inflytande: jesuiter som kom till
    hovet 1580 hade med sig kopparstick och en illustrerad bibel, och
    målarna började pröva skuggning och perspektiv. Verkstaden var ett
    verktyg för Akbars politik att förena ett mångreligiöst rike; samma
    hov­kultur ledde senare till [Taj Mahal](#taj-mahal-paborjas-1632).

caravaggio-barockens-ljus-och-morker:
  period: 1600
  label: "Caravaggio: barockens ljus och mörker"
  title: "Caravaggio och barockens ljus"
  wiki:
    - "sv:Caravaggio"
    - "sv:Barocken"
  text: |
    Michelangelo Merisi da **Caravaggio** (1571–1610) var en norditaliensk
    målare som slog igenom i Rom runt 1600. Hans genombrott var tavlorna
    om aposteln Matteus i kyrkan San Luigi dei Francesi (1599–1600), där
    Kristus kallar Matteus i en mörk krog fylld av vanliga människor.

    Det nya var två saker. För det första ljuset: figurerna belyses hårt
    från ett håll mot en nästan svart bakgrund, så att de liksom skjuter
    ut ur bilden. Tekniken kallas **chiaroscuro** (”ljust-mörkt”), i sin
    extrema form tenebrism. För det andra realismen: han använde modeller
    från gatan, med smutsiga fötter och slitna kläder, och målade direkt
    på duken med oljefärg utan förberedande skisser. Det chockade en del
    beställare, men passade [den katolska
    kyrkans](#tridentinska-motet-jesuiter) nya linje efter reformationen:
    konst skulle beröra och övertyga vanligt folk.

    Detta blev början på **barocken**, stilen ca 1600–1750 med drama,
    rörelse och starka känslor. Caravaggios liv var lika dramatiskt: 1606
    dödade han en man i ett slagsmål, flydde till Neapel, Malta och
    Sicilien och dog 38 år gammal. Hans ljus spreds snabbt genom
    efterföljare över Europa och påverkade bland andra
    [Velázquez](#velazquez) och [Rembrandt](#rembrandt-nattvakten-1642).

rubens:
  period: 1600
  label: "Rubens"
  title: "Rubens – barockens storföretagare"
  wiki:
    - "sv:Peter Paul Rubens"
  text: |
    Peter Paul **Rubens** (1577–1640) var verksam i Antwerpen, i de södra
    Nederländerna som förblev katolska och spanska efter [det nederländska
    upproret](#nederlandska-upproret-1568). Efter åtta år i Italien
    (1600–08), där han studerade antik skulptur, Tizian och
    [Caravaggio](#caravaggio-barockens-ljus-och-morker), blev han norra
    Europas mest efterfrågade målare.

    Hans måleri är barock i sin renaste form: stora dukar fulla av
    virvlande rörelse, starka färger och yppiga, ljusa kroppar – därav
    ordet ”rubensk”. Han drev en verkstad nästan som ett företag: Rubens
    gjorde skisser och slutfinish, medan assistenter (bland dem Anthony
    van Dyck) och specialister på djur eller landskap målade resten.
    Priset berodde på hur mycket mästaren själv målat. Över tusen verk
    tillskrivs honom.

    Kunderna var kungahus och kyrkan. För drottning Maria av Medici målade
    han en cykel på 24 stora dukar om hennes liv (1622–25, nu i Louvren),
    och för Karl I av England taket i Banqueting House i London. Han var
    också diplomat för Spanien och förhandlade 1629–30 fram fred med
    England, mitt under [trettioåriga kriget](#trettioariga-kriget-1618).
    2002 såldes hans *Barnamordet i Betlehem* för 49,5 miljoner pund, då
    ett av de högsta priserna för en gammal mästare.

bernini:
  period: 1620
  label: "Bernini"
  title: "Bernini formar barockens Rom"
  wiki:
    - "sv:Gian Lorenzo Bernini"
    - "en:Ecstasy of Saint Teresa"
  text: |
    Gian Lorenzo **Bernini** (1598–1680) var skulptör och arkitekt i Rom
    och den som mer än någon annan gav staden dess barocka utseende. Han
    arbetade för en rad påvar, främst Urban VIII – samme påve som lät
    ställa Galilei inför rätta ([Galileiprocessen
    1633](#galileiprocessen-1633)).

    Som ung skulptör visade han att marmor kunde se ut som mjuk hud, hår
    och löv. I *Apollon och Dafne* (1622–25, för kardinal Scipione
    Borghese) fångas ögonblicket då nymfen förvandlas till ett lagerträd,
    med fingrar som blir kvistar. *Den heliga Teresas extas* (1647–52) är
    en hel teaterscen i ett kapell, med dolt ljusinsläpp ovanifrån och
    förgyllda strålar – barockens idé att blanda skulptur, arkitektur och
    ljus till ett enda intryck.

    I Peterskyrkan byggde han baldakinen över högaltaret (1623–34), ca 29
    m hög och gjuten i brons, och utanför kolonnaderna kring Petersplatsen
    (1656–67), med 284 kolonner som ”armar” som omsluter pilgrimerna. Allt
    var [motreformationens](#motreformation) propaganda i sten: katolska
    kyrkan visade sin makt och prakt. 1665 bjöds han till Paris av Ludvig
    XIV för att rita om Louvren, men förslaget förkastades; fransmännen
    valde en stramare, egen klassicism, som sedan präglade
    [Versailles](#versailles).

taj-mahal-paborjas-1632-2:
  period: 1620
  label: "Taj Mahal påbörjas 1632"
  same_as: taj-mahal-paborjas-1632

velazquez:
  period: 1620
  label: "Velázquez"
  title: "Velázquez – hovmålaren som målade blicken"
  wiki:
    - "sv:Diego Velázquez"
    - "en:Las Meninas"
  text: |
    Diego **Velázquez** (1599–1660) föddes i Sevilla och blev 1623
    hovmålare hos den spanske kungen Filip IV i Madrid, en tjänst han hade
    i nästan 40 år. Spanien var då världsmakt men på väg utför (se
    [Olivares, nedgång](#olivares-nedgang)); Velázquez målade både kungen,
    hans minister Olivares, hovnarrar och dvärgar vid hovet.

    Han började i [Caravaggios](#caravaggio-barockens-ljus-och-morker)
    stil med hårt ljus och mörka bakgrunder, men utvecklade en lös, snabb
    pensel. På nära håll är en klänning bara några klickar färg; på
    avstånd blir det glänsande siden. Det var ett sätt att återge hur ögat
    faktiskt ser, inte hur saker ”är”. Han träffade [Rubens](#rubens) i
    Madrid 1628 och reste två gånger till Italien, där han 1650 målade ett
    skoningslöst porträtt av påven Innocentius X.

    Huvudverket är *Las Meninas* (1656, ca 3,2 × 2,8 m, Prado). Det visar
    prinsessan Margarita med hovdamer – och Velázquez själv vid en
    jättelik duk. I en spegel i bakgrunden syns kungaparet, som alltså
    står där betraktaren står. Bilden är ett tidigt exempel på en målning
    som handlar om att se och avbildas. Två hundra år senare kallade
    [Manet](#manet-frukost-i-det-grona-1863) honom ”målarnas målare”.

rembrandt-nattvakten-1642:
  period: 1640
  label: "Rembrandt: Nattvakten 1642"
  title: "Rembrandts Nattvakten"
  wiki:
    - "sv:Nattvakten"
    - "sv:Rembrandt"
  text: |
    Rembrandt van Rijn (1606–1669) var den mest kända målaren under [den
    holländska guldåldern](#hollandsk-guldalder). Han verkade i Amsterdam,
    som då var världshandelns centrum tack vare bland annat [Ostindiska
    kompaniet](#voc-1602). 1642 fullbordade han ett beställt grupporträtt
    av ett av stadens borgargarden, en frivillig milis under kapten Frans
    Banninck Cocq.

    Sådana gruppbilder var vanliga: varje medlem betalade för att synas,
    och normen var att alla stod uppradade och lika väl synliga. Rembrandt
    gjorde i stället en scen i rörelse – kaptenen ger order, män laddar
    musköter, en trumslagare slår, en liten flicka i ljust gult lyser mitt
    i vimlet. Ljuset är dramatiskt riktat, i
    [Caravaggios](#caravaggio-barockens-ljus-och-morker) efterföljd.
    Namnet *Nattvakten* kom först senare: fernissan hade mörknat så att
    dagsscenen såg ut som natt.

    Målningen är ca 3,6 × 4,4 m; 1715 skars den ner på sidorna för att
    passa en vägg i rådhuset. I dag hänger den i Rijksmuseum, där den
    sedan 2019 undersöks och restaureras med bland annat röntgen- och
    spektralskanning. Myten att målningen förstörde Rembrandts karriär
    stämmer inte, men han levde över sina tillgångar och gick i
    konkurs 1656.

hollandsk-guldalder:
  period: 1640
  label: "holländsk guldålder"
  title: "Holländsk guldålder: konst för en marknad"
  wiki:
    - "en:Dutch Golden Age painting"
  text: |
    Under 1600-talet blev Nederländerna (Republiken Förenade
    Nederländerna), som brutit sig loss från Spanien ([det nederländska
    upproret](#nederlandska-upproret-1568)), Europas rikaste land per
    invånare. Handel, sjöfart och [Ostindiska kompaniet](#voc-1602) gav en
    stor borgarklass med pengar – och den ville ha tavlor på väggarna.

    Det nya var att konsten såldes på en **öppen marknad**. Den
    kalvinistiska kyrkan förbjöd bilder i kyrkorna, och det fanns inget
    praktfullt kungahov, så de stora beställarna saknades. I stället
    målade konstnärer på spekulation och sålde via handlare, marknader och
    lotterier. Uppskattningsvis tillverkades flera miljoner målningar
    under seklet (siffrorna är osäkra). Målarna specialiserade sig:
    landskap, stilleben, porträtt, havsbilder, kyrkointeriörer eller
    **genremåleri** – scener ur vardagslivet. Bilderna var ofta små och
    billiga.

    Kända namn är Frans Hals (porträtt med snabb pensel), Jacob van
    Ruisdael (landskap), Jan Steen (stökiga hem),
    [Rembrandt](#rembrandt-nattvakten-1642) och
    [Vermeer](#vermeer-flickan-med-parlorhanget-1665). Samtidigt var
    landet ett centrum för vetenskap, optik och boktryck. Guldåldern
    ebbade ut efter det fransk-holländska kriget 1672, då ekonomin och
    konstmarknaden krympte.

vermeer-flickan-med-parlorhanget-1665:
  period: 1660
  label: "Vermeer: Flickan med pärlörhänget ~1665"
  title: "Vermeer och Flickan med pärlörhänget"
  wiki:
    - "sv:Johannes Vermeer"
    - "en:Girl with a Pearl Earring"
  text: |
    Johannes **Vermeer** (1632–1675) levde hela sitt liv i staden Delft.
    Han målade långsamt – bara omkring 35 verk är kända – och mest stilla
    interiörer där en eller två personer läser brev, häller mjölk eller
    spelar instrument, belysta av dagsljus från ett fönster till vänster.

    *Flickan med pärlörhänget* (ca 1665, 44,5 × 39 cm, Mauritshuis i Haag)
    är inget porträtt av en känd person utan en **tronie**: en studie av
    ett ansikte, ett uttryck eller en exotisk dräkt, som såldes på [den
    holländska konstmarknaden](#hollandsk-guldalder). Flickan vänder sig
    om mot oss med öppen mun mot en mörk bakgrund. Turbanens blå är
    ultramarin, gjord av den dyra halvädelstenen lapis lazuli från
    Afghanistan. Pärlan är bara några få penseldrag; den kan ha varit av
    glas eller tenn.

    Vermeers återgivning av ljus har fått många att tro att han använde en
    **camera obscura**, en mörk låda med lins som projicerar en bild – det
    är omdiskuterat men inte bevisat. Delft var en stad för optik:
    [Antonie van Leeuwenhoek](#leeuwenhoek-bakterier-1676), född samma år,
    slipade linser där och blev förvaltare av Vermeers dödsbo. Vermeer dog
    skuldsatt och glömdes bort tills en fransk kritiker lyfte fram honom
    på 1860-talet.

versailles:
  period: 1660
  label: "Versailles"
  title: "Versailles – envälde som arkitektur"
  wiki:
    - "en:Palace of Versailles"
  text: |
    Ludvig XIV (kung 1643–1715) byggde från 1660-talet om sin fars
    jaktslott i Versailles, ca 20 km utanför Paris, till Europas största
    palats (se [Ludvig XIV: Versailles](#ludvig-xiv-versailles)). 1682
    flyttade hovet och regeringen dit. Arkitekterna Louis Le Vau och Jules
    Hardouin-Mansart ritade byggnaderna, Charles Le Brun ledde
    dekorationen och André Le Nôtre anlade trädgården.

    Syftet var politiskt. Kungen hade som barn upplevt adelsuppror och
    ville ha adeln nära sig, upptagen av ceremonier, i stället för i sina
    provinser. Allt i Versailles kretsar kring honom: kungens sovrum
    ligger i mittaxeln, och trädgårdens raka alléer, klippta häckar och
    fontäner visar att även naturen lyder. Stilen är fransk klassicism –
    barock prakt men med strama, symmetriska fasader.

    Spegelsalen (1678–84) är 73 m lång med 357 speglar. Speglarna
    tillverkades i Frankrike av ett statligt manufaktur som grundats 1665
    för att bryta Venedigs monopol – konst och industripolitik gick hand i
    hand. Bygget kostade enorma summor och sysselsatte tusentals arbetare.
    Versailles blev förebild för furstar i hela Europa, i Sverige för
    [Drottningholm](#tessin-och-drottningholm) och [Stockholms
    slott](#stockholms-slott-tessin-d-y). Hundra år senare blev palatset
    en symbol för det som [franska
    revolutionen](#franska-revolutionen-1789) gjorde uppror mot.

tessin-och-drottningholm:
  period: 1660
  label: "Tessin och Drottningholm"
  title: "Tessin och Drottningholms slott"
  wiki:
    - "sv:Drottningholms slott"
    - "sv:Nicodemus Tessin den äldre"
  text: |
    Efter [westfaliska freden](#westfaliska-freden-1648) var Sverige en
    europeisk stormakt, och stormakter behövde palats. Nicodemus Tessin
    d.ä. (1615–1681), född i Stralsund i Pommern, blev Sveriges ledande
    arkitekt. Han hade studerat i Italien, Frankrike och Nederländerna och
    tog hem barockens arkitektur.

    När det gamla slottet på Lovön i Mälaren brann 1661 gav
    änkedrottningen Hedvig Eleonora, Karl X Gustavs änka och förmyndare
    för den unge Karl XI, Tessin uppdraget att bygga nytt. Bygget
    började 1662. Resultatet är ett symmetriskt slott med en stor, ljus
    trappa som representationsrum, och en trädgård i fransk barockstil med
    raka axlar, broderiparterrer (lågt klippta häckar i mönster) och
    fontäner. Hovmålaren [Ehrenstrahl](#ehrenstrahl) bidrog med målningar.

    Tessin d.ä. dog innan allt var klart, och sonen Nicodemus Tessin d.y.
    slutförde arbetet, bland annat trädgården efter mönster av
    [Versailles](#versailles). Senare tillkom Slottsteatern (1766), en av
    världens bäst bevarade barockteatrar med fungerande scenmaskineri, och
    Kina slott. Drottningholm blev världsarv 1991 och är sedan 1981
    kungafamiljens bostad. Tessin d.ä. ritade även Kalmar domkyrka.

stockholms-slott-tessin-d-y:
  period: 1680
  label: "Stockholms slott (Tessin d.y.)"
  title: "Stockholms slott av Tessin d.y."
  wiki:
    - "sv:Stockholms slott"
    - "sv:Nicodemus Tessin den yngre"
  text: |
    Det medeltida slottet Tre Kronor i Stockholm hade byggts om i
    omgångar. Nicodemus Tessin d.y. (1654–1728), son till arkitekten bakom
    [Drottningholm](#tessin-och-drottningholm), hade redan från 1692
    börjat ersätta norra flygeln med en modern fasad, när slottet brann
    ner den 7 maj 1697 – samma vår som [Karl XII](#karl-xii-1697) blev
    kung efter Karl XI:s död.

    Tessin ritade ett helt nytt slott: en fyrkant kring en innergård, med
    släta, strama fasader i romersk högbarock, inspirerade av romerska
    palats. Han hade studerat i Rom på 1670-talet och träffat
    [Bernini](#bernini), och kände också Versailles. Slottet skulle visa
    att Sverige var en stormakt i klass med Frankrike. Han ritade även
    inredning, trädgårdar och ett nytt stadsplanförslag för området.

    Under stora nordiska kriget stoppades bygget i nästan tjugo år av
    brist på pengar. Arbetet återupptogs på 1720-talet, och först 1754,
    långt efter Tessins död, kunde kungafamiljen flytta in. Slottet har
    över 600 rum och är fortfarande kungens officiella residens. Det blev
    också en skola: hantverkare och konstnärer som kallades in från
    Frankrike lade grunden för svensk konstindustri och för
    Konstakademien.

ehrenstrahl:
  period: 1680
  label: "Ehrenstrahl"
  title: "Ehrenstrahl – stormaktens hovmålare"
  wiki:
    - "sv:David Klöcker Ehrenstrahl"
  text: |
    David Klöcker **Ehrenstrahl** (1628–1698) föddes i Hamburg, utbildades
    i Nederländerna och kom till Sverige 1652. Efter studieår i Italien
    och Frankrike blev han hovmålare och adlades 1674 med namnet
    Ehrenstrahl. Han kallas ofta ”den svenska målarkonstens fader”,
    eftersom han var den förste i Sverige med en stor verkstad och
    lärjungar som utbildades här.

    Han målade porträtt av kungafamiljen och adeln, men också stora
    **allegorier** – bilder där personer föreställer idéer, som Rättvisan
    eller Freden – som skulle hylla kungamakten. Stilen var internationell
    barock med [Rubens](#rubens) och italienska målare som förebilder:
    rörelse, draperier, moln och gudar. För
    [Drottningholm](#tessin-och-drottningholm) gjorde han tak- och
    väggmålningar, och i Storkyrkan i Stockholm hänger hans stora
    *Yttersta domen* och *Korsfästelsen* (1690-talet).

    Särskilt kända är hans djurbilder: Karl XI:s hästar, hundar och
    jaktbyten i naturlig storlek, med namn och ibland vikt angivna. Under
    [Karl XI:s envälde](#karl-xi-envalde-1680-reduktionen) blev konsten en
    del av statens självbild. Ehrenstrahl stod i nära samarbete med
    Tessin-familjen; tillsammans gav de stormakten dess visuella språk.

ogata-korin:
  period: 1680
  label: "Ogata Kōrin"
  title: "Ogata Kōrin och Rinpa-stilen"
  wiki:
    - "en:Ogata Kōrin"
    - "en:Rinpa school"
  text: |
    **Ogata Kōrin** (1658–1716) kom från en rik köpmannafamilj i Kyoto som
    sålde lyxtyger till kejsarhovet och samurajeliten. Han slösade bort
    sitt arv och blev yrkesmålare först i 30-årsåldern. Han hade tränats i
    [Kanō-skolans](#kano-skolan-i-japan) teknik men tog sin förebild från
    de äldre Kyoto-konstnärerna Tawaraya Sōtatsu och Hon'ami Kōetsu.

    Stilen kallas **Rinpa**, ”Rin-skolan”, efter Kōrin själv. Den känns
    igen på plana färgytor, starka mönster och bakgrunder av bladguld.
    Hans mest kända verk är paret vikskärmar *Irisar* (ca 1701–05,
    Nezu-museet i Tokyo): blå och gröna irisar mot guld, upprepade i
    rytmiska grupper nästan som ett schablontryck. *Röda och vita
    plommonblommor* visar en stiliserad bäck som ett virvlande mönster
    mellan två träd. Utan rumsdjup och perspektiv blir bilden både natur
    och design.

    Kōrin målade också kimonor, lackarbeten och dekor på keramik åt sin
    bror, krukmakaren Ogata Kenzan. Han hör till
    [Genroku-kulturen](#genroku-kultur), en period då städernas köpmän
    blev rika under Tokugawa-freden och skapade en egen konst – samma
    miljö som födde [ukiyo-e-träsnitten](#edo-trasnitt-ukiyo-e-vaxer).
    Rinpa påverkade långt senare europeisk jugend och modern grafisk
    design.

watteau-rokokon:
  period: 1700
  label: "Watteau: rokokon"
  title: "Watteau och rokokon"
  wiki:
    - "sv:Jean-Antoine Watteau"
    - "sv:Rokoko"
  text: |
    Jean-Antoine **Watteau** (1684–1721) föddes i Valenciennes i norra
    Frankrike och kom fattig till Paris omkring 1702, där han arbetade med
    att måla kopior och teaterdekor. Han dog i tuberkulos bara 36 år
    gammal, men hann skapa en ny genre.

    När han 1717 togs in i den kungliga konstakademien lämnade han
    *Pilgrimsfärden till Cythera*: elegant klädda par i ett drömskt
    parklandskap på väg till (eller från) kärleksgudinnans ö. Akademien,
    som rangordnade bilder från historiemåleri överst till stilleben
    nederst, hade ingen kategori för detta och skapade en ny: **fête
    galante**, ”galant fest”. Penseldragen är lätta och skimrande,
    färgerna dämpade, stämningen melankolisk.

    Watteau räknas som rokokons förste mästare. **Rokoko** är stilen ca
    1720–1770: ljus, lekfull och intim, med pastellfärger och
    asymmetriska, böljande ornament som påminner om snäckor och klippor
    (franska *rocaille*). Bakgrunden var politisk: när [Ludvig XIV dog
    1715](#ludvig-xiv-dor-1715) lämnade adeln det stela
    [Versailles](#versailles) och flyttade in i salonger och stadspalats i
    Paris. Där ville man ha behagliga bilder om kärlek och nöje snarare än
    kungens storhet. Stilen fortsatte med [Boucher](#boucher).

edo-trasnitt-ukiyo-e-vaxer:
  period: 1700
  label: "Edo-träsnitt (ukiyo-e) växer"
  title: "Ukiyo-e: bilder av den flytande världen"
  wiki:
    - "sv:Ukiyo-e"
  text: |
    **Ukiyo-e** betyder ”bilder av den flytande världen” – den flyktiga
    nöjesvärlden i Edo (dagens Tokyo) med teatrar, tehus och
    glädjekvarteret Yoshiwara. Under [Edo-tiden](#edo-tiden-isolering)
    växte en stor och köpstark stadsbefolkning, och den ville ha billiga
    bilder av sina idoler: kabukiskådespelare, kurtisaner och vackra
    kvinnor, senare även landskap.

    Bilderna var **träsnitt**, ett tryck från en skuren träplatta. Arbetet
    var industriellt uppdelat: en konstnär ritade på tunt papper, en
    skärare klistrade ritningen på en platta av körsbärsträ och skar bort
    allt utom linjerna, en tryckare färgade plattan och gnuggade fram
    bilden för hand, och en förläggare finansierade och sålde. Från samma
    plattor kunde hundratals eller tusentals exemplar tryckas. Hishikawa
    Moronobu (död 1694) räknas som den förste mästaren, under
    [Genroku-perioden](#genroku-kultur).

    Tidigt var trycken svartvita och handkolorerade. Runt 1765 kom
    fullfärgstrycket, *nishiki-e* (”brokadbilder”), med en separat platta
    per färg och små markeringar för att passa in arken exakt. Ett tryck
    kostade ungefär som en enkel måltid och var en masskonst, jämförbar
    med dagens affischer. Höjdpunkterna kom med [Hokusai](#hokusai) och
    Hiroshige, och efter 1850-talet påverkade trycken
    [impressionisterna](#impressionism-monet-1874) i Europa.

canaletto:
  period: 1720
  label: "Canaletto"
  title: "Canaletto – Venedig som souvenir"
  wiki:
    - "sv:Canaletto"
  text: |
    **Canaletto** hette egentligen Giovanni Antonio Canal (1697–1768) och
    var son till en teaterdekormålare i Venedig. Han specialiserade sig på
    **vedute** (”vyer”): detaljerade, solbelysta stadsbilder av Canal
    Grande, Markusplatsen och festdagar med gondoler.

    Kunderna var främst brittiska aristokrater på **Grand Tour**, den
    bildningsresa genom Frankrike och Italien som unga överklassmän gjorde
    på 1700-talet. En målning av Canaletto var resans fina souvenir,
    ungefär som ett vykort men handmålat. Hans agent var den brittiske
    köpmannen och konsuln Joseph Smith, som förmedlade beställningar och
    själv byggde en stor samling som han 1762 sålde till kung Georg III;
    därför finns många Canaletto i brittiska kungliga samlingen.

    Bilderna ser fotografiskt exakta ut, och Canaletto använde troligen en
    **camera obscura** (en ljuslåda med lins som projicerar en bild) som
    hjälp för skisser, men han flyttade gärna byggnader för bättre
    komposition. När österrikiska tronföljdskriget stoppade turismen
    flyttade han till London 1746 och målade Themsen i nästan tio år. Hans
    brorson Bernardo Bellotto förde stilen vidare till Dresden och
    Warszawa. Samma turistmarknad försörjde [Piranesi](#piranesi) i Rom;
    Venedigs stora takmålare var samtidigt [Tiepolo](#tiepolo).

hogarth-satiriska-serier:
  period: 1720
  label: "Hogarth: satiriska serier"
  title: "Hogarth – bildserier om moral"
  wiki:
    - "sv:William Hogarth"
    - "en:A Rake's Progress"
  text: |
    William **Hogarth** (1697–1764) var en London-konstnär som utbildades
    till gravör (en som graverar bilder i metallplattor för tryck). Han
    ville skapa en engelsk konst som inte bara härmade Italien och
    Frankrike, och hittade en ny form: ”moderna moraliska ämnen” berättade
    i bildserier.

    *En skökas levnadslopp* (1732, sex bilder) följer en flicka från
    landet som blir prostituerad i London och dör ung. *En libertins
    levnadslopp* (1733–35, åtta bilder) visar en arvtagare som slösar bort
    allt och hamnar på dårhuset, och *Äktenskap à la mode* (1743–45)
    driver med arrangerade äktenskap mellan pengar och titlar. Varje bild
    är fullproppad med detaljer att läsa, nästan som rutor i en tecknad
    serie. *Gin Lane* (1751) visade ginepidemins elände.

    Affärsmodellen var ny: Hogarth målade först oljemålningar, graverade
    dem sedan i koppar och sålde trycken i stora upplagor genom
    förhandsprenumeration till den växande medelklassen. Eftersom
    piratkopior förstörde marknaden drev han fram en lag om upphovsrätt
    för gravyrer 1735, ofta kallad ”Hogarths lag” – en tidig föregångare
    till dagens upphovsrätt för bilder. Hans satir förebådar
    karikatyrteckningen och senare [Goyas](#goya) grafiska serier; i
    porträttkonsten följdes han av [Gainsborough](#gainsborough).

bach-i-musiken:
  period: 1720
  label: "Bach i musiken"
  title: "Bach – barocken i musiken"
  wiki:
    - "sv:Johann Sebastian Bach"
  text: |
    Johann Sebastian **Bach** (1685–1750) var en tysk organist och
    tonsättare (se [Bach](#bach)). Från 1723 till sin död var han kantor
    vid Thomasskolan i Leipzig, vilket betydde att han varje vecka skulle
    leverera musik till stadens lutherska gudstjänster. Tidigare hade han
    tjänat vid furstehov i Weimar och Köthen.

    Han räknas som höjdpunkten i **barockmusiken** (ca 1600–1750), samma
    epok som [Berninis](#bernini) skulptur och [Rubens](#rubens) måleri.
    Den bärande tekniken var **kontrapunkt**: flera självständiga
    melodistämmor som spelas samtidigt och ändå passar ihop. Den
    strängaste formen är **fugan**, där ett kort tema dyker upp i stämma
    efter stämma enligt fasta regler – för en datavetare kan den liknas
    vid ett rekursivt, regelstyrt system. *Das wohltemperierte Klavier*
    (del 1 1722, del 2 1742) innehåller preludier och fugor i alla 24
    tonarter och visar möjligheterna i nya stämningssystem där alla
    tonarter blev användbara.

    Andra kända verk är *Brandenburgkonserterna* (1721) och
    *Matteuspassionen* (1727). Samtiden såg honom som gammalmodig, och
    hans musik glömdes delvis bort, tills Felix Mendelssohn framförde
    Matteuspassionen 1829. Hans italienska samtida [Vivaldi](#vivaldi)
    påverkade honom starkt.

tiepolo:
  period: 1740
  label: "Tiepolo"
  title: "Tiepolo – himlar på taket"
  wiki:
    - "sv:Giovanni Battista Tiepolo"
    - "en:Würzburg Residence"
  text: |
    Giovanni Battista **Tiepolo** (1696–1770) från Venedig var 1700-talets
    främste **takmålare** och den sista stora i en tradition som börjat
    med [Sixtinska kapellet](#michelangelo-sixtinska-kapellet-150812). Han
    arbetade mest i **fresk**: färgpigment i vatten målade direkt på våt
    kalkputs, så att färgen binds in i väggen när putsen torkar. Man måste
    arbeta snabbt, en dagsportion i taget, och kan inte rätta i efterhand.

    Hans tak öppnar sig mot en ljus, molnig himmel full av gudar,
    allegorier och svävande figurer sedda nerifrån, i ljusa pastellfärger.
    Huvudverket är trapphuset i fursteresidenset i Würzburg (1752–53),
    beställt av furstbiskopen: ett tak på drygt 600 m², bland de största
    fresker som gjorts, med de fyra världsdelarna – Europa, Asien, Afrika
    och Amerika – runt kanterna. Bilden av ”Amerika” och ”Afrika” visar
    hur européer då såg på världen de handlade med och koloniserade.

    Tiepolo drev en familjeverkstad med sönerna Giandomenico och Lorenzo
    och var efterfrågad av kyrkor, venetianska adelsfamiljer och furstar.
    1762 kallades han till Madrid för att måla taken i det nya kungliga
    slottet och dog där. Då var smaken på väg att svänga mot den stramare
    [nyklassicismen](#nyklassicism-winckelmann), och hans stil kom att ses
    som gammaldags. Han var samtida med [Canaletto](#canaletto) och
    [Boucher](#boucher).

boucher:
  period: 1740
  label: "Boucher"
  title: "Boucher – rokokons hovmålare"
  wiki:
    - "sv:François Boucher"
  text: |
    François **Boucher** (1703–1770) var den franska rokokons mest
    framgångsrike målare. Han började som gravör och kopierade bland annat
    [Watteaus](#watteau-rokokon) teckningar för tryck, studerade i Italien
    och blev en av Paris mest anlitade konstnärer.

    Hans motiv är mytologiska scener med Venus och nymfer, nakna kroppar i
    rosa och ljusblått, idealiserade herdar och herdinnor på landet, och
    eleganta porträtt. Allt är mjukt, sött och dekorativt – tänkt att
    hänga i salonger, över dörrar och i sovrum. Hans viktigaste beskyddare
    var Madame de Pompadour, Ludvig XV:s officiella älskarinna och en stor
    konstsamlare, som han målade flera gånger. 1765 blev han ”kungens
    förste målare”.

    Boucher arbetade lika mycket för industrin: han ritade mönster för
    vävda bonader (gobelänger) till de statliga manufakturerna i Beauvais
    och Paris, där han blev chef för Gobelins 1755, och förlagor för
    porslin. Men under hans sista år vände smaken. Filosofen Denis
    Diderot, redaktör för [Encyklopedin](#encyklopedin-1751), skrev hårda
    recensioner och menade att Bouchers konst var tom och omoralisk. Det
    nya idealet blev den allvarliga
    [nyklassicismen](#nyklassicism-winckelmann), vars ledare
    [Jacques-Louis David](#david-horatiernas-ed-1784) för övrigt var släkt
    med Boucher.

piranesi:
  period: 1740
  label: "Piranesi"
  title: "Piranesi – Rom i etsning"
  wiki:
    - "sv:Giovanni Battista Piranesi"
    - "en:Imaginary Prisons"
  text: |
    Giovanni Battista **Piranesi** (1720–1778) var utbildad arkitekt i
    Venedig men flyttade 1740 till Rom, där han nästan aldrig fick bygga
    något. I stället blev han 1700-talets främste grafiker av arkitektur.
    Hans teknik var **etsning**: en kopparplatta täcks med vax, bilden
    ritas med en nål genom vaxet, och syra fräter linjerna ner i metallen.
    Plattan kan sedan tryckas i stora upplagor.

    Serien *Vedute di Roma* (vyer av Rom, 135 blad från omkring 1748 till
    hans död) såldes till turister på Grand Tour, precis som
    [Canalettos](#canaletto) målningar av Venedig. Men Piranesi överdrev:
    ruinerna blev jättelika, människorna pyttesmå, himlen dramatisk. Hans
    bilder formade under lång tid hur européer föreställde sig det antika
    Rom.

    Ännu märkligare är *Carceri d'invenzione* (”Fantasifängelser”, ca 1750
    och omarbetade 1761, 16 blad): oändliga valv, trappor som inte leder
    någonstans, rep och hjul i mörka rum. De föregriper romantikens känsla
    för det överväldigande och har inspirerat allt från M.C. Escher till
    filmkulisser och dataspel. Samtidigt grävdes Herculaneum och Pompeji
    fram, och intresset för antiken blev en hel rörelse:
    [nyklassicismen](#nyklassicism-winckelmann).

nyklassicism-winckelmann:
  period: 1760
  label: "Nyklassicism: Winckelmann"
  title: "Winckelmann och nyklassicismen"
  wiki:
    - "sv:Johann Joachim Winckelmann"
    - "sv:Nyklassicism"
  text: |
    Johann Joachim **Winckelmann** (1717–1768) var en tysk skomakarson som
    blev bibliotekarie och flyttade till Rom 1755. Samma år skrev han en
    kort skrift om att efterlikna grekisk konst, där han beskrev den som
    präglad av ”ädel enfald och stilla storhet”. 1764 kom *Den antika
    konstens historia*, där han delade in konsten i perioder som växer,
    blomstrar och förfaller – ett av de första försöken att skriva
    konsthistoria som en utveckling och inte som en samling
    konstnärsbiografier.

    Hans idéer blev program för **nyklassicismen**, stilen ca 1760–1830
    som tog efter grekisk och romersk antik: raka linjer, kolonner,
    tydliga konturer, återhållsamma känslor och moraliska ämnen. Den var
    en reaktion mot rokokons lekfullhet och passade upplysningstidens tro
    på förnuft och dygd. Utgrävningarna av Herculaneum (från 1738) och
    Pompeji (från 1748) gav nya förebilder, och [Piranesis](#piranesi)
    etsningar spred bilden av Rom.

    Winckelmann trodde att de grekiska statyerna var vita marmor, och det
    idealet präglade sedan skulptur och arkitektur i hundratals år. I dag
    vet vi att de ursprungligen var bemålade i starka färger. Han mördades
    i Trieste 1768. Stilen fick genomslag hos [Sergel](#sergel),
    [David](#david-horatiernas-ed-1784) och i Sverige i [den gustavianska
    stilen](#gustaviansk-stil).

sergel:
  period: 1760
  label: "Sergel"
  title: "Sergel – Sveriges nyklassiske skulptör"
  wiki:
    - "sv:Johan Tobias Sergel"
  text: |
    Johan Tobias **Sergel** (1740–1814) var son till en tysk broderare vid
    hovet i Stockholm och blev Sveriges främste skulptör. Han lärde sig
    yrket av franska skulptörer som arbetade med [Stockholms
    slott](#stockholms-slott-tessin-d-y), och 1767–1778 levde han i Rom.
    Där umgicks han i kretsen kring
    [nyklassicismen](#nyklassicism-winckelmann) och studerade antik
    skulptur.

    I Rom gjorde han sina mest kända verk i marmor: *Berusade fauen*
    (1770–74), en halvt liggande skogsvarelse ur grekisk mytologi, sovande
    med kroppen avslappnad, och senare *Amor och Psyke*. Det nya var att
    antikens form – släta ytor, idealiska proportioner – fylldes med kropp
    och sinnlighet. Arbetsgången var typisk för tiden: först en modell i
    lera, sedan gips, och därefter höggs marmorn, ofta med hjälp av
    mätpunkter som överfördes med passare.

    Gustav III kallade hem honom 1778 som hovskulptör. Sergel blev en
    central figur i [den gustavianska kulturen](#gustaviansk-stil) och
    kungens vän. Hans bronsstaty av Gustav III på Skeppsbron göts och
    avtäcktes först 1808, sexton år efter [mordet på
    kungen](#gustav-iii-mordad-1792). Han är också känd för snabba, roliga
    karikatyrteckningar av sig själv och sitt umgänge – en skarp kontrast
    till marmorns allvar.

gainsborough:
  period: 1760
  label: "Gainsborough"
  title: "Gainsborough – porträtt i landskap"
  wiki:
    - "sv:Thomas Gainsborough"
  text: |
    Thomas **Gainsborough** (1727–1788) kom från Suffolk i östra England,
    lärde sig måla i London och arbetade sedan i landsorten och kurorten
    Bath innan han flyttade tillbaka till London 1774. Han var en av
    grundarna av Royal Academy 1768, den brittiska konstakademien, där
    hans rival Joshua Reynolds blev ordförande.

    Brittiska kunder ville framför allt ha porträtt, och Gainsborough
    levde på dem fast han själv helst målade landskap. Han förenade de
    två: i *Mr and Mrs Andrews* (ca 1750) sitter ett nygift godsägarpar
    under ett träd med sina åkrar runt sig – ägarskapet över jorden är en
    del av porträttet. Senare blev hans pensel lös och fjäderlätt, med
    skimrande tyger, som i *Blue Boy* (ca 1770). Den såldes 1921 till den
    amerikanske järnvägsmagnaten Henry Huntington för 182 200 pund, då ett
    rekordpris, och blev en symbol för hur amerikanska förmögenheter köpte
    Europas konst.

    Bakgrunden var ett Storbritannien som blev rikt på handel, kolonier
    och jordbruksförbättringar, med en landadel och en ny förmögen klass
    som ville visa sin status. Gainsborough arbetade i en engelsk
    tradition som [Hogarth](#hogarth-satiriska-serier) öppnat, och hans
    landskap pekar fram mot Constable och [Turner](#turner).

david-horatiernas-ed-1784:
  period: 1780
  label: "David: Horatiernas ed 1784"
  title: "David: Horatiernas ed"
  wiki:
    - "en:Oath of the Horatii"
    - "sv:Jacques-Louis David"
  text: |
    Jacques-Louis **David** (1748–1825) var den franska
    [nyklassicismens](#nyklassicism-winckelmann) ledande målare.
    *Horatiernas ed* beställdes av den kungliga byggnadsförvaltningen åt
    Ludvig XVI, målades i Rom 1784 och visades på Parissalongen 1785, där
    den blev en sensation. Duken är ca 3,3 × 4,25 m och hänger i Louvren.

    Motivet kommer ur den romerska historieskrivaren Livius: tre bröder ur
    familjen Horatius svär inför sin far att strida på liv och död för Rom
    mot tre bröder från grannstaden Alba Longa. Till höger sörjer
    kvinnorna, för familjerna är ingifta i varandra. Bilden är byggd som
    en scen bakom tre valvbågar: männen med raka, spända linjer, kvinnorna
    mjuka och sjunkande. Inga rokokokrumelurer, inga onödiga detaljer –
    skarpt ljus och tydliga konturer, likt en antik relief.

    Budskapet – att plikten mot staten går före familj och känslor –
    lästes snart politiskt. Under
    [revolutionen](#franska-revolutionen-1789) blev David jakobin, röstade
    för att [avrätta Ludvig XVI](#ludvig-xvi-avrattas-1793) och målade
    *Marats död* (1793). Senare blev han
    [Napoleons](#napoleon-kejsare-1804) hovmålare och målade den enorma
    kröningsbilden (1805–07). Hans elever spred stilen över Europa, men
    nästa generation, som [Géricault](#gericault-medusas-flotte-1819),
    bröt mot den.

goya:
  period: 1780
  label: "Goya"
  title: "Goya – från hovet till mörkret"
  wiki:
    - "sv:Francisco de Goya"
    - "en:Los Caprichos"
  text: |
    Francisco de **Goya** (1746–1828) kom från Aragonien och tog sig upp
    till toppen av den spanska konstvärlden. Från 1775 ritade han förlagor
    (kartonger) till den kungliga bonadsfabriken i Madrid: glada scener ur
    folklivet, picknick och lekar. 1789 blev han hovmålare åt Karl IV. Han
    beundrade [Velázquez](#velazquez) och lärde sig av hans lösa pensel.

    1792–93 drabbades han av en sjukdom som gjorde honom helt döv.
    Därefter blev hans konst mer personlig och kritisk. *Los Caprichos*
    (1799) är en serie på 80 grafiska blad som driver med prästers
    girighet, vidskepelse, adelns fåfänga och arrangerade äktenskap – i
    samma tradition som [Hogarths](#hogarth-satiriska-serier) satir. Han
    kombinerade etsning med **akvatint**, en teknik där harts strös på
    plattan så att syran ger ytor av grått i stället för bara linjer. Det
    mest kända bladet heter *Förnuftets sömn föder monster*.

    Porträttet *Karl IV:s familj* (1800) visar kungafamiljen så oglamoröst
    att det ofta läses som tyst satir. När [Napoleon invaderade
    Spanien](#napoleon-i-spanien-1808) skildrade Goya krigets grymheter,
    bland annat i [Tredje maj](#romantik-goya-tredje-maj-1814), och sent i
    livet målade han de mörka ”svarta målningarna” direkt på väggarna i
    sitt hus. Han räknas som en bro mellan gamla mästare och modern konst.

gustaviansk-stil:
  period: 1780
  label: "Gustaviansk stil"
  title: "Gustaviansk stil"
  wiki:
    - "sv:Gustaviansk stil"
  text: |
    **Gustaviansk stil** är den svenska formen av
    [nyklassicismen](#nyklassicism-winckelmann), uppkallad efter Gustav
    III (kung 1771–1792). Den syns i möbler, inredning, arkitektur och
    konsthantverk från ca 1770 till ca 1810. Gustav III var mycket
    intresserad av konst och teater, besökte Paris 1771 och reste i
    Italien 1783–84, och hämtade förebilderna därifrån: den franska Louis
    XVI-stilen och antikens Rom.

    Typiskt är raka, smala ben med räfflor (längsgående spår), ovala och
    rektangulära stolsryggar, enkla kransar och bandrosetter som ornament,
    och ljusa färger – grått, pärlvitt, ljusblått – ofta på målat trä i
    stället för dyra ädelträslag. Kända namn är möbelsnickaren Georg Haupt
    och arkitekten och inredaren Louis Masreliez, som gjorde Gustav III:s
    paviljong på Haga med väggmålningar i antik stil. I skulpturen var
    [Sergel](#sergel) gustavianismens stora namn.

    Stilen hängde ihop med Gustav III:s politik: efter [statskuppen
    1772](#gustav-iii-s-statskupp-1772) ville han bygga ett kulturellt
    glansfullt hov och grundade Kungliga Operan (1782) och Svenska
    Akademien (1786). Senare spreds en enklare variant till prästgårdar
    och bondehem. Under 1900-talet blev ”gustavianskt” en populär
    inredningsstil igen, i dag ett slags svenskt varumärke för ljus, lugn
    inredning.

romantik-goya-tredje-maj-1814:
  period: 1800
  label: "Romantik: Goya: Tredje maj 1814"
  title: "Goyas Tredje maj och romantiken"
  wiki:
    - "en:The Third of May 1808"
    - "sv:Romantiken"
  text: |
    Den 2 maj 1808 gjorde folket i Madrid uppror mot de franska trupper
    som [Napoleon skickat till Spanien](#napoleon-i-spanien-1808). Nästa
    natt, den 3 maj, arkebuserades hundratals spanjorer som straff. Sex år
    senare, när fransmännen drivits ut, beställde den nya spanska
    regeringen två minnesbilder av [Goya](#goya): *Andra maj* och *Tredje
    maj 1808* (1814, ca 2,7 × 3,5 m, Prado).

    I *Tredje maj* står en rad franska soldater med ryggen mot oss,
    ansiktslösa som en maskin. Mittemot lyser en stor lykta upp en man i
    vit skjorta som sträcker upp armarna som en korsfäst, bland lik i blod
    och andra som väntar på sin tur. Det finns ingen hjälte och ingen ära,
    bara utsatta civila. Det var nytt: krigsmålningar hade tidigare hyllat
    segrar och fältherrar. Penseln är grov och snabb, färgerna mörka.

    Bilden räknas till **romantiken**, en rörelse ca 1790–1850 i konst,
    litteratur och musik som satte känsla, individ, natur och nation före
    upplysningens förnuft och nyklassicismens ordning. Romantikerna sökte
    det överväldigande, som stormar, berg och lidande. Kriget mot Napoleon
    var också ett [gerillakrig](#gerillakrig), ett av de första där civila
    och folket självt stod i centrum. *Tredje maj* blev förebild för
    senare bilder av krigets offer, från Manet till Picassos *Guernica*.
    Jämför [Caspar David Friedrich](#caspar-david-friedrich) i Tyskland.

caspar-david-friedrich:
  period: 1800
  label: "Caspar David Friedrich"
  title: "Caspar David Friedrich – landskap som känsla"
  wiki:
    - "sv:Caspar David Friedrich"
    - "en:Wanderer above the Sea of Fog"
  text: |
    Caspar David **Friedrich** (1774–1840) föddes i Greifswald, som då
    tillhörde Svenska Pommern – han föddes alltså som svensk undersåte.
    Han studerade vid konstakademien i Köpenhamn och bodde sedan i
    Dresden. Han är den tyska
    [romantikens](#romantik-goya-tredje-maj-1814) mest kända målare.

    Friedrich målade landskap, men inte som topografiska avbildningar.
    Hans bilder visar dimma, havsstränder, kala träd, kyrkoruiner och
    månljus, och är byggda för att väcka en stämning av ensamhet, längtan
    och andlighet. Ofta står en person med ryggen mot oss och blickar ut
    (en så kallad *Rückenfigur*), så att vi ser landskapet genom hans
    ögon. I *Vandraren över dimhavet* (ca 1818) står en man på en klippa
    ovanför ett hav av moln; i *Munken vid havet* (1808–10) är en liten
    figur nästan uppslukad av tomt hav och himmel. Det romantiska
    begreppet **det sublima** – det storslagna och skrämmande som får
    människan att känna sig liten – är centralt.

    Bilderna målades under Napoleonkrigen, när [Tysk-romerska riket
    upplöstes](#tysk-romerska-riket-upplost-1806), och många läste in tysk
    nationell längtan i dem. Efter hans död glömdes han, tills en
    utställning i Berlin 1906 återupptäckte honom. Hans engelske samtida
    [Turner](#turner) sökte samma sublima natur men med ljus och virvlande
    färg.

hokusai:
  period: 1800
  label: "Hokusai"
  title: "Hokusai – träsnittens mästare"
  wiki:
    - "sv:Katsushika Hokusai"
  text: |
    Katsushika **Hokusai** (1760–1849) var en japansk konstnär från Edo
    (Tokyo) som arbetade i närmare 70 år och gjorde tiotusentals bilder:
    målningar, illustrationer till romaner och framför allt
    [ukiyo-e-träsnitt](#edo-trasnitt-ukiyo-e-vaxer). Han bytte namn ett
    trettiotal gånger och flyttade ofta. Han sa själv att han inte gjort
    något av värde före 70 års ålder.

    Från 1814 gav han ut *Hokusai Manga*, 15 häften med skisser av
    människor, djur, växter, spöken och vardagssysslor – ordet manga
    betydde då ungefär ”spontana teckningar”. Hans mest kända verk är
    serien *Trettiosex vyer av berget Fuji* (ca 1830–32), där [Den stora
    vågen](#hokusai-den-stora-vagen-1831) ingår. Det var nytt att landskap
    blev ett eget säljande motiv inom träsnitten, som tidigare dominerats
    av skådespelare och kurtisaner. Han använde också det nya importerade
    färgämnet **preussiskt blått**, ett syntetiskt pigment uppfunnet i
    Berlin i början av 1700-talet, som gav starka, hållbara blå toner.

    Japan var under Edo-tiden nästan stängt för utlänningar, men efter att
    [Japan öppnades 1853](#perry-1853-japan-oppnas) flödade trycken till
    Europa. Där påverkade de impressionisterna och [van Gogh](#van-gogh),
    en våg som kallas **japonism**: plana färgfält, snett beskurna motiv
    och höga horisonter.

gericault-medusas-flotte-1819:
  period: 1820
  label: "Géricault: Medusas flotte 1819"
  title: "Géricault: Medusas flotte"
  wiki:
    - "en:The Raft of the Medusa"
    - "sv:Théodore Géricault"
  text: |
    I juli 1816 gick den franska fregatten *Medusa* på grund utanför
    nuvarande Mauretanien. Kaptenen var en adelsman som fått posten av den
    återinsatta kungamakten trots att han knappt seglat på 20 år.
    Livbåtarna räckte inte; omkring 150 personer hamnade på en hopsnickrad
    flotte som drogs efter båtarna tills linorna kapades. Efter 13 dagar
    på havet levde 15, och de hade tvingats till kannibalism. Två
    överlevande skrev en bok, och skandalen blev politisk.

    Théodore **Géricault** (1791–1824) var en ung, förmögen målare som
    bestämde sig för att göra händelsen till ett monumentalt verk. Han
    intervjuade överlevande, lät bygga en modell av flotten och studerade
    döda och döende på sjukhus och bårhus för att få kropparna rätt.
    Duken, ca 4,9 × 7,2 m, visades på Parissalongen 1819 och hänger i
    Louvren. Kompositionen bildar två pyramider: döda och förtvivlade
    nederst, och överst en svart man som viftar med ett tygstycke mot ett
    avlägset skepp – en tydlig gest i en tid då slaveriet debatterades.

    Det nya var att en aktuell nyhet, utan hjältar och utan seger, målades
    i det format som var reserverat för historiemåleri. Formen lånade från
    [Davids](#david-horatiernas-ed-1784) skola, men känslan var
    [romantikens](#romantik-goya-tredje-maj-1814). Den unge
    [Delacroix](#delacroix-friheten-1830) stod modell för en av figurerna.
    Géricault dog bara 32 år gammal.

delacroix-friheten-1830:
  period: 1820
  label: "Delacroix: Friheten 1830"
  title: "Delacroix: Friheten leder folket (1830)"
  wiki:
    - "sv:Eugène Delacroix"
    - "en:Liberty Leading the People"
  text: |
    **Eugène Delacroix** (1798–1863) var den ledande franske målaren inom
    **romantiken**, en konstriktning från omkring 1800–1850 som satte
    känsla, dramatik, rörelse och starka färger före den lugna, linjeklara
    *nyklassicismen* (måleri som efterliknade antikens Grekland och Rom).
    Hans förebild var [Géricaults Medusas
    flotte](#gericault-medusas-flotte-1819), en jättemålning om en verklig
    skeppskatastrof.

    *Friheten leder folket* skildrar [julirevolutionen
    1830](#julirevolutionen-1830), då Parisborna under tre dagar störtade
    kung Karl X. En barbröstad kvinna med frygisk mössa och trikoloren –
    en allegori (personifikation) för Friheten, senare kallad Marianne –
    kliver över barrikaden och de döda. Bredvid henne går en arbetare, en
    borgare i hög hatt och en pojke med pistoler: hela folket enat. Duken
    är stor, ungefär 2,6 × 3,25 meter, ett format som tidigare var
    förbehållet historiska och religiösa motiv.

    Det nya var att en aktuell politisk händelse med vanliga människor
    fick samma monumentala behandling som antikens hjältar. Staten köpte
    målningen 1831, men den ansågs snart för upprorisk och hölls länge
    undan från offentligheten. I dag hänger den i Louvren och har blivit
    en symbol för Frankrike och för revolution i allmänhet – den har bland
    annat inspirerat frimärken, sedlar och omslag.

hokusai-den-stora-vagen-1831:
  period: 1820
  label: "Hokusai: Den stora vågen ~1831"
  title: "Hokusai: Den stora vågen vid Kanagawa"
  wiki:
    - "sv:Katsushika Hokusai"
    - "en:The Great Wave off Kanagawa"
  text: |
    **Katsushika Hokusai** (1760–1849) var en japansk konstnär i Edo
    (dagens Tokyo) som gjorde tiotusentals bilder under ett långt liv; se
    även [Hokusai](#hokusai). Han arbetade inom **ukiyo-e**, ”bilder av
    den flytande världen”: billiga träsnitt för stadens borgare med motiv
    från teatern, nöjeskvarteren och landskap.

    *Den stora vågen vid Kanagawa* (omkring 1830–32) ingår i serien
    *Trettiosex vyer av berget Fuji*. En jättelik våg med klolika
    skumtoppar reser sig över tre smala roddbåtar, medan Fuji syns litet i
    bakgrunden. Bilden är bara cirka 25 × 37 cm. Den gjordes som
    **färgträsnitt**: konstnären ritade, en snidare skar ett träblock per
    färg, och en tryckare tryckte blocken efter varandra på papper. Samma
    bild kunde alltså tryckas i tusentals exemplar och säljas för ungefär
    priset av en enkel måltid. Nytt var den importerade syntetiska färgen
    *berlinerblått*, som gav den intensiva blå tonen.

    Japan var nästan stängt för utlänningar fram till
    [1853](#perry-1853-japan-oppnas). Därefter strömmade träsnitt till
    Europa, och deras platta färgfält, beskurna motiv och höga horisont
    påverkade [impressionisterna](#impressionism-monet-1874) och [van
    Gogh](#van-gogh) starkt – ett fenomen som kallas *japonism*.

fotografiet-daguerreotypi-1839:
  period: 1840
  label: "Fotografiet (daguerreotypi 1839)"
  title: "Fotografiet: daguerreotypin 1839"
  wiki:
    - "sv:Daguerreotypi"
    - "en:History of photography"
  text: |
    Den första bestående kamerabilden gjordes av fransmannen Nicéphore
    Niépce omkring 1826–27, med en exponeringstid på många timmar (se
    [fotografi](#fotografi)). Hans kompanjon **Louis Daguerre**
    (1787–1851) utvecklade en praktisk metod, **daguerreotypin**, som
    presenterades i Paris 1839. Franska staten köpte rättigheterna och gav
    bort metoden fritt.

    Tekniken: en försilvrad kopparplåt gjordes ljuskänslig med joddånga,
    exponerades i kameran i några minuter, framkallades med
    kvicksilverånga och fixerades med saltlösning. Resultatet var en
    extremt skarp men unik bild som inte kunde kopieras – ungefär som en
    Polaroid. Samma år visade engelsmannen William Henry Fox Talbot en
    konkurrerande metod med negativ på papper, från vilket man kunde göra
    många positiva kopior. Det är principen bakom nästan all fotografi
    fram till digitalkamerorna.

    För konsten var detta en chock. Porträttmålning var tidigare en stor
    marknad; nu kunde borgerskapet få ett billigt fotoporträtt. Målaren
    Paul Delaroche ska enligt en känd men osäker anekdot ha sagt ”från och
    med idag är måleriet dött”. I stället tvingades målarna att fråga vad
    måleriet kunde som kameran inte kunde – färg, rörelse, subjektivt ljus
    och känsla. Den frågan driver mycket av utvecklingen fram till
    [impressionismen](#impressionism-monet-1874) och vidare mot
    abstraktionen.

turner:
  period: 1840
  label: "Turner"
  title: "J.M.W. Turner – ljusets och ångans målare"
  wiki:
    - "en:J. M. W. Turner"
    - "en:Rain, Steam and Speed – The Great Western Railway"
  text: |
    **Joseph Mallord William Turner** (1775–1851) var en engelsk målare,
    son till en frisör i London, som tidigt antogs till Royal Academy (den
    brittiska konstakademin). Han började med noggranna akvareller av
    landskap och byggnader – *akvarell* är vattenlöslig färg på papper,
    snabb och genomskinlig – men blev alltmer intresserad av ljus, väder
    och atmosfär.

    I hans sena oljemålningar löses föremålen upp i virvlar av ljus, dimma
    och färg. *Regn, ånga och hastighet* (1844) visar ett tåg som rusar
    över en bro på Great Western Railway; loket är nästan bara en mörk
    form i ett gult och grått dis. Det var en av de första målningarna med
    den nya tekniken som motiv, bara femton år efter [järnvägen
    Liverpool–Manchester](#jarnvag-liverpoolmanchester-1830). *Det
    stridbara Téméraire* (1839) visar ett gammalt segelkrigsskepp som
    bogseras bort av en liten ångbåt för att huggas upp – en bild av en
    epok som tar slut.

    Samtida kritiker tyckte ofta att verken såg ofärdiga ut, men
    skribenten John Ruskin försvarade honom. Turner testamenterade sin
    samling – omkring 300 oljemålningar och tiotusentals skisser och
    akvareller – till brittiska staten. Hans lösa, ljusfyllda måleri
    brukar ses som en föregångare till
    [impressionismen](#impressionism-monet-1874), och Monet studerade hans
    verk i London.

prerafaeliterna:
  period: 1840
  label: "prerafaeliterna"
  title: "Prerafaeliterna (1848)"
  wiki:
    - "en:Pre-Raphaelite Brotherhood"
    - "en:Ophelia (painting)"
  text: |
    År 1848 – samma år som [revolutionerna](#ars-revolutioner-1848)
    skakade Europa – bildade tre unga studenter vid Royal Academy i London
    ett hemligt brödraskap: **Dante Gabriel Rossetti**, **John Everett
    Millais** och **William Holman Hunt**. De kallade sig **Pre-Raphaelite
    Brotherhood**, ”prerafaeliterna”, eftersom de ansåg att konsten blivit
    stel och formelartad sedan den italienske renässansmålaren Rafael
    (1483–1520), vars harmoniska kompositioner akademin lärde ut som norm.
    De ville tillbaka till det ärliga, detaljrika måleriet före honom.

    Deras bilder är fyllda av skarpa detaljer – varje blad och blomma är
    noggrant studerat från naturen – och starka, klara färger. För att få
    färgerna att lysa målade de ofta tunt på en våt vit grund i stället
    för på en mörk. Motiven hämtades från Bibeln, medeltida legender,
    Shakespeare och poesi. Mest känd är Millais *Ofelia* (1851–52), som
    visar den drunknande Ofelia flytande bland vattenväxter.

    Först fick de hård kritik, men kritikern John Ruskin – som också
    försvarat [Turner](#turner) – tog dem i försvar. Rörelsen påverkade
    senare William Morris och Arts and Crafts-rörelsen, som ville ersätta
    billig fabriksmassproduktion med gediget hantverk – en reaktion mot
    industrialiseringen.

manet-frukost-i-det-grona-1863:
  period: 1860
  label: "Manet: Frukost i det gröna 1863"
  title: "Manet: Frukost i det gröna (1863)"
  wiki:
    - "sv:Édouard Manet"
    - "en:Le Déjeuner sur l'herbe"
  text: |
    Konstlivet i Paris styrdes av **Salongen**, en årlig statlig
    utställning där en jury av akademiker avgjorde vad som fick visas. Att
    bli antagen var avgörande för att få köpare och statliga
    beställningar. År 1863 refuserade juryn flera tusen verk, och
    protesterna blev så starka att kejsar [Napoleon III](#napoleon-iii)
    lät ordna en egen utställning för dem: *Salon des Refusés*, ”de
    refuserades salong”.

    Störst skandal väckte **Édouard Manet** (1832–1883), en välbärgad
    parisisk målare. Hans *Frukost i det gröna* (omkring 2 × 2,6 meter)
    visar två påklädda unga män i samtida kläder som sitter i en skog med
    en naken kvinna, som tittar rakt ut mot betraktaren. Kompositionen var
    lånad från renässanskonst, men nakna kvinnor var bara acceptabla som
    gudinnor eller nymfer i mytologiska scener. Här var hon tydligt en
    verklig parisiska i en vardaglig situation.

    Lika provocerande var tekniken: platt, hårt ljus utan mjuka
    övergångar, grova penseldrag och en bakgrund som inte följer korrekt
    perspektiv. Manet visade att en målning är färg på en plan yta, inte
    ett fönster mot verkligheten. Två år senare väckte hans *Olympia* ännu
    större skandal. De yngre målare som samlades kring honom blev kärnan i
    [impressionismen](#impressionism-monet-1874).

realism-courbet:
  period: 1860
  label: "realism (Courbet)"
  title: "Realismen och Courbet"
  wiki:
    - "sv:Gustave Courbet"
    - "en:Realism (art movement)"
  text: |
    **Realismen** var en konstriktning i Frankrike från omkring 1848 som
    ville måla den samtida verkligheten som den var – vanliga människor,
    arbete och fattigdom – i stället för antika hjältar, helgon eller
    romantisk dramatik. Den växte fram i samma klimat som [1848 års
    revolutioner](#ars-revolutioner-1848) och den framväxande
    arbetarrörelsen.

    Ledaren var **Gustave Courbet** (1819–1877), son till en bonde i
    Ornans i östra Frankrike. *Stenkrossarna* (1849) visade två
    vägarbetare i trasiga kläder, utan idealisering. *Begravning i Ornans*
    (1849–50) är en ungefär 3 × 7 meter stor duk med en vanlig
    landsortsbegravning – ett format som annars reserverades för
    historiemålning. När Världsutställningen i Paris 1855 refuserade delar
    av hans verk byggde han en egen paviljong, ”Realismens paviljong”, och
    sålde biljetter – en tidig konstnärsdriven utställning utanför statens
    system.

    Courbet var öppet socialist. Under [Pariskommunen
    1871](#pariskommunen-1871) deltog han i kommunens styre, och när
    Vendômekolonnen, ett monument över Napoleon, revs hölls han ansvarig.
    Han dömdes att betala återuppbyggnaden och flydde till Schweiz, där
    han dog. Realismens krav att måla det samtida livet togs vidare av
    Manet och [impressionisterna](#impressionism-monet-1874).

impressionism-monet-1874:
  period: 1880
  label: "Impressionism (Monet 1874)"
  title: "Impressionismen och Monet (1874)"
  wiki:
    - "sv:Impressionism"
    - "sv:Claude Monet"
  text: |
    Den 15 april 1874 öppnade en grupp konstnärer, trötta på att refuseras
    av den statliga Salongen, en egen utställning i fotografen Nadars före
    detta ateljé i Paris. Bland ett trettiotal deltagare fanns **Claude
    Monet** (1840–1926), Pierre-Auguste Renoir, Edgar Degas, Camille
    Pissarro och Berthe Morisot. Monets *Impression, soluppgång* – en
    dimmig hamn i Le Havre med en orange sol – fick en kritiker att
    hånfullt kalla gruppen ”impressionister”. Namnet fastnade.

    Impressionisterna ville fånga det flyktiga ögonblicket: hur ljus och
    färg ser ut en viss timme, i ett visst väder. De målade ofta *en plein
    air*, utomhus, med snabba, synliga penseldrag och rena färger sida vid
    sida i stället för noga blandade toner. Skuggor blev blå och violetta
    i stället för bruna. Två tekniska saker gjorde detta möjligt: färg i
    metalltuber (uppfunnen 1841) som gick att bära ut i naturen, och
    järnvägen som tog målarna till förorter och kust.
    [Fotografiet](#fotografiet-daguerreotypi-1839) gjorde samtidigt exakt
    avbildning mindre viktig, och [japanska
    träsnitt](#hokusai-den-stora-vagen-1831) visade nya sätt att beskära
    bilden.

    Monet målade senare serier av samma motiv i olika ljus – höstackar,
    Rouens katedral – och de enorma näckrosmålningarna i sin trädgård i
    Giverny. Rörelsen blev först en kommersiell framgång tack vare
    konsthandlare som Paul Durand-Ruel, som sålde till amerikanska
    samlare.

van-gogh:
  period: 1880
  label: "van Gogh"
  title: "Vincent van Gogh (1853–1890)"
  wiki:
    - "sv:Vincent van Gogh"
  text: |
    **Vincent van Gogh** var en nederländsk prästson som provade på
    konsthandel, lärarjobb och predikantarbete innan han i 27-årsåldern
    bestämde sig för att bli konstnär. Han målade under bara omkring tio
    år men hann göra drygt 2 000 verk, varav ungefär 860 oljemålningar.
    Han försörjdes hela tiden av sin bror Theo, konsthandlare i Paris, och
    deras brevväxling är en viktig källa till hur han tänkte.

    I Paris 1886–88 mötte han
    [impressionisterna](#impressionism-monet-1874) och samlade på
    [japanska träsnitt](#hokusai-den-stora-vagen-1831). Hans palett blev
    ljus och stark. I Arles i Sydfrankrike 1888 målade han *Solrosor* och
    *Sovrummet*; efter ett psykiskt sammanbrott, då han skar av en del av
    sitt öra, lade han in sig på ett hospital i Saint-Rémy, där han 1889
    målade *Stjärnenatt* med virvlande himmel. Hans stil känns igen på
    tjock färg i synliga, rytmiska penseldrag och färger valda för att
    uttrycka känsla snarare än för att återge verkligheten.

    Han dog 1890 av ett skott, sannolikt självförvållat, 37 år gammal,
    nästan okänd och enligt den gängse uppgiften efter att bara ha sålt en
    enda målning. Efter döden blev han en förebild för expressionismen och
    för bilden av det missförstådda geniet. 1990 såldes hans *Porträtt av
    doktor Gachet* för 82,5 miljoner dollar, då världsrekord.

zorn-och-larsson:
  period: 1880
  label: "Zorn och Larsson"
  title: "Anders Zorn och Carl Larsson"
  wiki:
    - "sv:Anders Zorn"
    - "sv:Carl Larsson"
  text: |
    Kring 1880 åkte många unga svenska konstnärer till Frankrike, eftersom
    den svenska konstakademin upplevdes som konservativ. Där lärde de sig
    friluftsmåleri och ljust, realistiskt måleri, ofta i konstnärskolonin
    Grez-sur-Loing söder om Paris. Väl hemma omkring 1890 vände de sig
    till svensk natur och folkliv – en riktning som kallas
    **nationalromantik**. Två av dem blev Sveriges mest folkkära
    konstnärer.

    **Anders Zorn** (1860–1920) från Mora var en virtuos på akvarell, olja
    och etsning (gravyr där bilden etsas in i en kopparplåt med syra och
    sedan trycks). Han målade med ett mycket begränsat antal färger – i
    princip gult, rött, svart och vitt – men fick fram glödande hud,
    vatten och ljus, till exempel i *Midsommardans* (1897). Han blev
    internationellt eftertraktad porträttmålare, bland annat för
    amerikanska presidenter och miljonärer, och blev mycket rik.

    **Carl Larsson** (1853–1919) är känd för akvarellerna från familjens
    hem Lilla Hyttnäs i Sundborn i Dalarna, samlade i boken *Ett hem*
    (1899). Hemmet hade inretts av hustrun Karin Larsson, själv utbildad
    konstnär, med ljusa färger och hemvävda textilier. Bilderna spreds i
    stora upplagor och formade idealet om det ljusa, enkla svenska hemmet
    – en tidig förebild till senare svensk inredning. Hans monumentala
    *Midvinterblot* (1915) för Nationalmuseum refuserades däremot efter
    långa strider.

munch:
  period: 1880
  label: "Munch"
  title: "Edvard Munch och Skriet"
  wiki:
    - "sv:Edvard Munch"
    - "sv:Skriet"
  text: |
    **Edvard Munch** (1863–1944) var en norsk målare och grafiker. Han
    växte upp i Kristiania (Oslo) och förlorade tidigt mor och syster i
    tuberkulos; sjukdom, död, ångest och kärlekens svartsjuka blev hans
    huvudmotiv. Han studerade i Paris och påverkades av [van
    Gogh](#van-gogh) och andra som använde färg och form för att uttrycka
    känslor snarare än för att avbilda.

    När han ställde ut i Berlin 1892 väckte målningarna sådan upprördhet
    att utställningen stängdes efter en vecka – vilket gjorde honom känd.
    Hans mest berömda motiv, *Skriet* (1893), visar en dödskallelik figur
    på en bro under en blodröd himmel, med händerna mot huvudet. Linjerna
    i landskapet böljar som om hela världen vibrerar av ångesten. Munch
    gjorde flera versioner: målningar, pasteller (torr färgkrita) och en
    litografi (tryck från sten), så att motivet kunde spridas i många
    exemplar. En pastellversion såldes 2012 för omkring 120 miljoner
    dollar.

    Munch samlade sina verk i en serie han kallade *Livsfrisen*, om livets
    och kärlekens stora skeden. Han räknas som en av den
    **expressionistiska** konstens viktigaste föregångare – konst som
    förvränger form och färg för att visa det inre. Temat, människans
    ensamhet och ångest, hade filosofiskt föregåtts av
    [Kierkegaard](#kierkegaard). Munch testamenterade det mesta av sin
    produktion till Oslo kommun.

picasso-och-kubismen-1907:
  period: 1900
  label: "Picasso och kubismen 1907"
  title: "Picasso och kubismen"
  wiki:
    - "sv:Kubism"
    - "sv:Pablo Picasso"
    - "en:Les Demoiselles d'Avignon"
  text: |
    **Pablo Picasso** (1881–1973) var en spansk konstnär som flyttade till
    Paris 1904 och blev 1900-talets mest kända och produktiva konstnär.
    1907 målade han *Flickorna från Avignon*, en ungefär 2,4 × 2,3 meter
    stor duk med fem nakna kvinnor på en bordell i Barcelona. Kropparna är
    kantiga, ansiktena liknar masker – Picasso hade sett afrikanska och
    iberiska skulpturer på museum i Paris – och rummet har inget enhetligt
    djup. Till och med vännerna blev chockerade.

    Tillsammans med fransmannen **Georges Braque** utvecklade han sedan
    **kubismen** (namnet kommer från en kritiker som talade om ”kuber”).
    Grundidén: i stället för att visa ett föremål från en enda punkt, som
    renässansens centralperspektiv gjort i 500 år, visas det från flera
    håll samtidigt, uppbrutet i plana fasetter. Under den *analytiska*
    fasen (cirka 1909–12) blev bilderna nästan gråbruna pussel. I den
    *syntetiska* fasen från 1912 klistrade de in tidningspapper, tapet och
    vaxduk i målningarna – *collaget* var fött, och verkliga föremål blev
    del av konsten.

    Kubismen var samtida med
    [relativitetsteorin](#einstein-relativitetsteorin-1905), och båda
    ifrågasatte en enda, absolut betraktelsepunkt, men någon direkt
    påverkan är inte belagd. Kubismen öppnade vägen för [abstrakt
    konst](#kandinsky-abstraktion), och Picasso använde dess formspråk i
    [Guernica](#guernica-1937).

kandinsky-abstraktion:
  period: 1900
  label: "Kandinsky: abstraktion"
  title: "Kandinsky och den abstrakta konsten"
  wiki:
    - "sv:Wassily Kandinsky"
    - "sv:Abstrakt konst"
  text: |
    I nästan all tidigare konst föreställde bilden något – människor,
    landskap, föremål. **Abstrakt konst** (även kallad nonfigurativ)
    föreställer ingenting igenkännbart: den består bara av färger, former
    och linjer, ungefär som musik består av toner utan att beskriva något.

    **Wassily Kandinsky** (1866–1944) var en rysk jurist som i
    30-årsåldern lämnade en akademisk karriär för att studera måleri i
    München. Omkring 1910–13 lät han motiven i sina färgstarka landskap
    lösas upp tills bara färgfält och linjer återstod. Han brukar räknas
    som en av de första abstrakta målarna, även om dateringen av hans
    tidigaste abstrakta akvarell är omdiskuterad. 1911 grundade han
    gruppen *Der Blaue Reiter* (Den blå ryttaren) och gav ut boken *Om det
    andliga i konsten*, där han hävdade att färger har en direkt verkan på
    själen, som toner. Han upplevde själv färger som ljud (synestesi) och
    kallade sina verk ”kompositioner” och ”improvisationer”.

    Liknande steg togs samtidigt av ryssen Kazimir Malevitj och
    holländaren Piet Mondrian – och, före dem alla men i hemlighet, av
    svenskan [Hilma af Klint](#hilma-af-klint). Efter ryska revolutionen
    återvände Kandinsky en tid till Moskva, men undervisade sedan 1922–33
    vid [Bauhaus](#bauhaus-1919) i Tyskland, där han utvecklade en mer
    geometrisk stil.

hilma-af-klint:
  period: 1900
  label: "Hilma af Klint"
  title: "Hilma af Klint – abstraktion före de andra"
  wiki:
    - "sv:Hilma af Klint"
  text: |
    **Hilma af Klint** (1862–1944) var en svensk konstnär, utbildad vid
    Konstakademien i Stockholm, där kvinnor fått studera sedan 1864. Utåt
    arbetade hon som respekterad landskaps- och porträttmålare. Men hon
    var också djupt engagerad i **spiritism** och teosofi – rörelser som
    trodde att man kunde komma i kontakt med en andlig verklighet bakom
    den synliga. Med fyra andra kvinnor, gruppen ”De fem”, höll hon
    seanser där de upplevde sig få budskap från andeväsen.

    Enligt hennes egen beskrivning fick hon 1906 ett uppdrag att måla
    ”Målningarna till templet”. Fram till 1915 skapade hon 193 verk:
    spiraler, cirklar, snäckformer, symmetriska diagram och ord i klara
    färger. Serien *De tio största* (1907) består av tio målningar på
    omkring 3 × 2,4 meter som skildrar människans livsåldrar. Därmed
    gjorde hon abstrakt konst några år innan
    [Kandinsky](#kandinsky-abstraktion) och andra som brukar räknas som
    pionjärer – om man räknar hennes andligt motiverade bilder som
    abstrakt konst, vilket diskuteras.

    Hon visade nästan aldrig dessa verk och bestämde att de inte fick
    visas förrän 20 år efter hennes död. Det dröjde till 1986 innan de
    fick internationell uppmärksamhet. [Moderna
    Museet](#moderna-museet-1958) gjorde en stor utställning 2013, och
    Guggenheimmuseets i New York utställning 2018–19 blev museets mest
    besökta någonsin, med över 600 000 besökare.

duchamp-och-dadaism:
  period: 1920
  label: "Duchamp och dadaism"
  title: "Duchamp och dadaismen"
  wiki:
    - "sv:Dadaism"
    - "sv:Marcel Duchamp"
    - "en:Fountain (Duchamp)"
  text: |
    **Dadaismen** uppstod 1916 på Cabaret Voltaire i Zürich, i det
    neutrala Schweiz, där konstnärer och poeter som flytt [första
    världskriget](#forsta-varldskriget) samlades. Om det förnuftiga,
    borgerliga Europa kunde skapa massdöden i skyttegravarna, då
    förtjänade dess logik och konst hån. Namnet ”dada” valdes för att det
    var nonsens. Dadaisterna framförde ljuddikter, gjorde collage av
    slumpvis klippta bitar och arrangerade provocerande happenings;
    rörelsen spreds till Berlin, Paris och New York.

    Fransmannen **Marcel Duchamp** (1887–1968) gick längst. Han uppfann
    **readymaden**: ett färdigt industriföremål som konstnären bara väljer
    ut och förklarar vara konst. 1917 skickade han in ett liggande
    porslinsurinoar, signerat ”R. Mutt 1917” och kallat *Fontän*, till en
    utställning i New York som lovat att visa allt som skickades in. Den
    visades inte. Originalet försvann, och de exemplar som finns på museer
    i dag – bland annat på [Moderna Museet](#moderna-museet-1958) – är
    repliker som Duchamp godkände decennier senare.

    Poängen var att konst inte behöver handla om hantverk eller skönhet,
    utan om val och idé: det är sammanhanget, museet, som gör något till
    konst. Den tanken blev grunden för mycket av 1900-talets senare konst,
    från [surrealismen](#surrealism-dali) till
    [konceptkonsten](#konceptkonst). 2004 utsåg en enkät bland brittiska
    konstexperter *Fontän* till 1900-talets mest inflytelserika konstverk.

bauhaus-1919:
  period: 1920
  label: "Bauhaus 1919"
  title: "Bauhaus (1919–1933)"
  wiki:
    - "sv:Bauhaus"
    - "sv:Walter Gropius"
  text: |
    **Bauhaus** var en konst-, design- och arkitekturskola som arkitekten
    **Walter Gropius** grundade i Weimar i Tyskland 1919, samma år som den
    nya demokratiska Weimarrepubliken bildades. Idén var att riva gränsen
    mellan ”fin” konst och hantverk: eleverna arbetade i verkstäder för
    metall, trä, textil, keramik och typografi, och målet var att formge
    vardagsföremål och hus för industriell massproduktion – bra design för
    alla, inte bara för de rika.

    Bland lärarna fanns målarna [Wassily
    Kandinsky](#kandinsky-abstraktion) och Paul Klee och den ungerske
    konstnären László Moholy-Nagy. Stilen blev enkel och geometrisk: rena
    former, inga ornament, primärfärger, nya material som stålrör och
    glas. Marcel Breuers stålrörsfåtölj från 1925 och skolans egen byggnad
    i Dessau (1925–26), med väggar av glas, är klassiker. Uttrycket
    ”formen följer funktionen” sammanfattar idealet.

    Skolan flyttade till Dessau 1925 och till Berlin 1932. Nazisterna såg
    den som vänsterorienterad och ”otysk”, och efter [maktövertagandet
    1933](#hitler-1933) stängdes den. Många lärare emigrerade till USA –
    Gropius till Harvard, sista rektorn Ludwig Mies van der Rohe till
    Chicago – och spred stilen där. Bauhaus påverkade den svenska
    funktionalismen och i förlängningen nästan all modern design, från
    IKEA till gränssnittsdesign.

surrealism-dali:
  period: 1920
  label: "surrealism (Dalí)"
  title: "Surrealismen och Dalí"
  wiki:
    - "sv:Surrealism"
    - "sv:Salvador Dalí"
  text: |
    **Surrealismen** grundades i Paris 1924 när poeten André Breton gav ut
    det första surrealistiska manifestet. Den växte ur
    [dadaismen](#duchamp-och-dadaism) men ville inte bara förstöra utan
    utforska något: det omedvetna. Inspirationen kom från Sigmund Freud,
    den österrikiske läkaren som grundade psykoanalysen och menade att
    drömmar och förträngda begär styr oss. Namnet betyder ungefär
    ”öververklighet”.

    Surrealisterna använde två metoder. Den ena var *automatism*: att
    skriva eller teckna snabbt utan att tänka, för att låta det omedvetna
    styra. Den andra var att måla drömscener med fotografisk precision, så
    att det omöjliga ser verkligt ut. Hit hör belgaren René Magritte och
    framför allt spanjoren **Salvador Dalí** (1904–1989). Hans mest kända
    verk, *Minnets envishet* (1931), visar smältande fickur som hänger
    över en gren och en kant i ett öde kustlandskap. Målningen är
    förvånansvärt liten, ungefär 24 × 33 cm, och finns på MoMA i New York.

    Dalí var en skicklig självmarknadsförare med uppstrukna mustascher och
    gjorde film med Luis Buñuel, reklam och design. Breton uteslöt honom
    ur gruppen, bland annat för att han inte tog avstånd från fascismen
    och för hans kommersialism. Under andra världskriget flydde många
    surrealister till New York, där deras automatism påverkade [den
    abstrakta expressionismen](#abstrakt-expressionism-pollock).

guernica-1937:
  period: 1920
  label: "Guernica 1937"
  title: "Picassos Guernica (1937)"
  wiki:
    - "en:Guernica (Picasso)"
    - "en:Bombing of Guernica"
  text: |
    Under [spanska inbördeskriget](#spanska-inbordeskriget-193639-franco)
    stödde Hitlers Tyskland och Mussolinis Italien general Franco mot den
    spanska republiken. Den 26 april 1937 bombade tyska Condorlegionen och
    italienska plan den baskiska småstaden Guernica under flera timmar.
    Hundratals civila dog; antalet är omstritt. Det var en av de första
    flygbombningarna av en civil stad och sågs som en övning inför ett
    större krig.

    [Picasso](#picasso-och-kubismen-1907), som bodde i Paris, hade fått i
    uppdrag av republiken att göra en målning till Spaniens paviljong på
    världsutställningen i Paris samma år. Efter nyheten målade han på
    drygt en månad *Guernica*, en enorm duk på ungefär 3,5 × 7,8 meter,
    bara i svart, vitt och grått som ett tidningsfoto. Med kubismens
    uppbrutna former visar den en skrikande kvinna med ett dött barn, en
    sönderslagen soldat, en häst med ett spjut i sig, en tjur och en
    glödlampa som lyser över kaoset. Hans partner, fotografen Dora Maar,
    dokumenterade arbetet steg för steg.

    Målningen turnerade för att samla in pengar till flyktingar och
    hamnade sedan på MoMA i New York. Picasso bestämde att den inte fick
    komma till Spanien förrän landet var en demokrati igen. Först 1981,
    sex år efter att [Franco dött](#franco-dor-1975), fördes den till
    Madrid, där den i dag finns på Museo Reina Sofía. Den har blivit en av
    världens mest kända antikrigsbilder.

abstrakt-expressionism-pollock:
  period: 1940
  label: "Abstrakt expressionism (Pollock)"
  title: "Abstrakt expressionism och Pollock"
  wiki:
    - "sv:Abstrakt expressionism"
    - "sv:Jackson Pollock"
  text: |
    **Abstrakt expressionism** var den första konstriktning som uppstod i
    USA och fick världsinflytande, omkring 1943–1960. Den kombinerade
    abstraktion – inga igenkännbara motiv – med *expressionism*, att
    uttrycka känslor och inre tillstånd. Målningarna var ofta enorma,
    flera meter breda, så att betraktaren skulle uppslukas av dem.

    Mest känd är **Jackson Pollock** (1912–1956), son till en
    lantbrukarfamilj i Wyoming. Från 1947 lade han duken på golvet och
    gick runt den medan han droppade, slängde och hällde färg från burkar,
    käppar och stelnade penslar – ofta vanlig industriell lackfärg i
    stället för konstnärsfärg. Resultatet blev täta nät av linjer utan
    centrum eller topp och botten, så kallat *all-over*. Arbetssättet
    kallades *action painting*: själva handlingen var konstverket, och
    målningen ett spår av den. Idén att låta handen arbeta utan styrande
    förnuft hade han delvis från [surrealisternas](#surrealism-dali)
    automatism.

    Andra viktiga namn var Willem de Kooning med våldsamma kvinnofigurer
    och Mark Rothko med stora svävande färgfält. Tidskriften *Life*
    frågade 1949 om Pollock var ”USA:s störste levande målare”, och han
    blev en kändis innan han dog i en bilolycka 44 år gammal. Under kalla
    kriget lyftes rörelsen fram som en symbol för västerländsk frihet, och
    det har senare visat sig att amerikanska staten indirekt stöttade
    utställningar i Europa. Rörelsen markerade att [New York blivit
    konstens centrum](#new-york-blir-konstens-centrum).

new-york-blir-konstens-centrum:
  period: 1940
  label: "New York blir konstens centrum"
  title: "New York blir konstens centrum"
  wiki:
    - "en:New York School (art)"
    - "sv:Museum of Modern Art"
  text: |
    Från 1800-talet till 1930-talet var Paris västerlandets självklara
    konsthuvudstad: där fanns akademierna, konsthandlarna, kritikerna och
    de flesta avantgardister. Under 1940-talet flyttade centrum till New
    York, och det har i stort sett stannat där.

    Orsakerna var främst politiska. Nazismen och [andra
    världskriget](#andra-varldskriget) drev en lång rad europeiska
    konstnärer och arkitekter till USA: surrealisterna André Breton och
    Max Ernst, Piet Mondrian, Marc Chagall, Marcel Duchamp och flera från
    [Bauhaus](#bauhaus-1919). Paris var ockuperat 1940–44. I New York
    fanns redan institutioner som Museum of Modern Art (MoMA, grundat 1929
    med pengar från bland annat familjen Rockefeller), och samlaren Peggy
    Guggenheim öppnade 1942 galleriet Art of This Century, där hon visade
    både européer och unga amerikaner som Pollock.

    Efter kriget var USA världens rikaste land, och nya förmögenheter
    köpte konst. Unga amerikanska målare – [de abstrakta
    expressionisterna](#abstrakt-expressionism-pollock) – blev den första
    amerikanska konst som Europa tog efter, och kritiker som Clement
    Greenberg byggde teorin om varför. Kalla kriget spelade in: amerikansk
    ”fri” konst ställdes mot Sovjetunionens påbjudna socialistiska
    realism. Konsthandlare som Leo Castelli skapade sedan den moderna
    gallerimarknaden. Det var här [popkonsten](#popkonst-warhol) slog
    igenom på 1960-talet.

popkonst-warhol:
  period: 1960
  label: "Popkonst (Warhol)"
  title: "Popkonsten och Andy Warhol"
  wiki:
    - "sv:Popkonst"
    - "sv:Andy Warhol"
  text: |
    **Popkonst** (pop art) uppstod i Storbritannien och USA i slutet av
    1950-talet. I stället för [de abstrakta
    expressionisternas](#abstrakt-expressionism-pollock) allvarliga,
    personliga gester tog popkonstnärerna sina motiv från masskulturen:
    reklam, serietidningar, förpackningar, kändisar och tv. Namnet kommer
    av ”populär”. Amerikanen Roy Lichtenstein förstorade serierutor ända
    ned till tryckets rasterprickar.

    **Andy Warhol** (1928–1987) var son till slovakiska invandrare i
    Pittsburgh och hade varit framgångsrik reklamtecknare i New York. 1962
    ställde han ut 32 målningar av Campbells soppburkar, en för varje
    smak. Samma år började han använda *screentryck* (serigrafi): ett foto
    överförs till en finmaskig duk som fungerar som stencil, och färgen
    pressas igenom. Metoden gjorde det möjligt att upprepa samma bild –
    Marilyn Monroe, Elvis, Coca-Cola-flaskor, men också bilolyckor och
    elektriska stolar – i serier, som på ett löpande band. Hans ateljé
    hette passande nog *The Factory*, fabriken.

    Warhol suddade ut gränsen mellan konst, reklam och kändisskap och
    konstaterade att alla i framtiden skulle bli världsberömda i 15
    minuter. Hans första stora retrospektiv i Europa visades 1968 på
    [Moderna Museet](#moderna-museet-1958) i Stockholm. 2022 såldes hans
    *Shot Sage Blue Marilyn* för 195 miljoner dollar, det högsta pris som
    betalats för ett amerikanskt konstverk på auktion.

moderna-museet-1958:
  period: 1960
  label: "Moderna Museet 1958"
  title: "Moderna Museet (1958)"
  wiki:
    - "sv:Moderna museet"
    - "sv:Pontus Hultén"
  text: |
    **Moderna Museet** i Stockholm öppnade 1958 som en avdelning av
    Nationalmuseum för 1900-talets konst, inrymt i ett gammalt exercishus
    (en byggnad där soldater övade) på Skeppsholmen. Initiativet kom från
    konstnärer och samlare som tyckte att Sverige saknade ett museum för
    modern konst; föreningen Modernamuseets vänner hade bland annat samlat
    in pengar till inköp.

    Under chefen **Pontus Hultén** (1924–2006), som ledde museet 1960–73,
    blev det ett av världens mest uppmärksammade konstmuseer. Hultén
    byggde nära kontakter med New Yorks konstvärld och köpte tidigt
    amerikansk [popkonst](#popkonst-warhol). Han fick [Marcel
    Duchamp](#duchamp-och-dadaism) att godkänna repliker av hans
    readymades till samlingen. 1966 visades *Hon – en katedral* av Niki de
    Saint Phalle, Jean Tinguely och Per Olof Ultvedt: en omkring 25 meter
    lång liggande kvinnofigur som besökarna gick in i. 1968 visades Andy
    Warhols första stora retrospektiv i Europa.

    Museet var också ett experimentellt kulturhus med film, konserter,
    teknik- och konstprojekt – i linje med 1960-talets svenska
    kulturpolitik, där staten aktivt stödde ny konst. 1998 flyttade museet
    in i en ny byggnad på Skeppsholmen ritad av spanske arkitekten Rafael
    Moneo. Senare utställningar, som den stora om [Hilma af
    Klint](#hilma-af-klint) 2013, har bidragit till att skriva om
    konsthistorien.

konceptkonst:
  period: 1960
  label: "konceptkonst"
  title: "Konceptkonst"
  wiki:
    - "sv:Konceptkonst"
    - "en:Sol LeWitt"
  text: |
    **Konceptkonst** är konst där idén – konceptet – är det viktiga, och
    det fysiska föremålet är sekundärt eller saknas helt. Den växte fram i
    USA och Europa i mitten av 1960-talet och byggde vidare på
    [Duchamps](#duchamp-och-dadaism) readymades, som visat att konst kan
    vara ett val eller en tanke snarare än hantverk.

    Amerikanen **Sol LeWitt** skrev 1967 att ”idén blir en maskin som gör
    konsten”. Hans väggmålningar består av skriftliga instruktioner – till
    exempel att dra raka linjer i olika riktningar på en vägg – som andra
    utför; samma verk kan alltså ”köras” på olika museer. För en
    datavetare liknar det ett program som exekveras. Joseph Kosuths *One
    and Three Chairs* (1965) visar en verklig stol, ett foto av stolen och
    en uppslagstext om ordet ”stol” – en fråga om hur saker, bilder och
    språk förhåller sig till varandra. Yoko Ono gav ut instruktionsverk i
    bokform, och nätverket Fluxus gjorde performance och enkla händelser
    till konst.

    Rörelsen var också en reaktion mot konstmarknaden: ett koncept går
    svårt att köpa och sälja som en målning – även om marknaden snart
    lärde sig sälja certifikat och instruktioner. Tiden präglades av [1968
    års uppror](#maj-1968) och protester mot Vietnamkriget, och mycket
    konceptkonst var politisk. Konceptkonsten är en viktig grund för
    dagens samtidskonst, där installationer, video och idébaserade verk
    dominerar.

basquiat:
  period: 1980
  label: "Basquiat"
  title: "Jean-Michel Basquiat (1960–1988)"
  wiki:
    - "sv:Jean-Michel Basquiat"
  text: |
    **Jean-Michel Basquiat** föddes i Brooklyn i New York med en far från
    Haiti och en mor med rötter i Puerto Rico. I slutet av 1970-talet
    skrev han tillsammans med vännen Al Diaz kryptiska, poetiska
    meddelanden signerade *SAMO©* på husväggar i Lower Manhattan.
    Graffitin gjorde honom känd i stadens konst- och musikscen, och
    omkring 1981 hade han gått över till målningar som såldes genom
    gallerier.

    Hans bilder är fyllda av krumelurer, ord, överstrukna texter, kronor,
    dödskallar och anatomiska skisser, målade snabbt med akryl, oljekrita
    och sprayfärg på duk eller hittade material som dörrar. De handlar
    ofta om svart historia, rasism, slaveri och svarta idrottare och
    musiker – perspektiv som sällan syntes i de dåtida konstmuseerna.
    Stilen räknas till *neoexpressionismen*, en återkomst till färgstarkt,
    figurativt och känslosamt måleri efter 1970-talets stränga
    [konceptkonst](#konceptkonst).

    Basquiat blev en stjärna på 1980-talets heta konstmarknad, där nya
    förmögenheter från finansbranschen köpte samtidskonst. Han samarbetade
    1984–85 med [Andy Warhol](#popkonst-warhol). Han dog av en
    heroinöverdos 1988, 27 år gammal. 2017 köpte den japanske affärsmannen
    Yusaku Maezawa en skallmålning från 1982 för 110,5 miljoner dollar,
    ett rekord för en amerikansk konstnär vid den tiden. Graffitins väg in
    i konstvärlden fortsatte med bland andra [Banksy](#banksy).

postmodernism:
  period: 1980
  label: "Postmodernism"
  title: "Postmodernism"
  wiki:
    - "sv:Postmodernism"
    - "en:Postmodern architecture"
  text: |
    **Modernismen** – stilar som [Bauhaus](#bauhaus-1919) och
    funktionalismen – hade lovat att ren, rationell form utan ornament
    skulle skapa ett bättre samhälle. **Postmodernism**
    (”efter-modernism”) är samlingsnamnet för en reaktion från 1960- och
    70-talen: tvivel på att det finns en enda rätt stil eller en stor
    berättelse om framsteg, och lust att blanda, citera och leka.

    Tydligast syns det i arkitekturen. Den amerikanske arkitekten Robert
    Venturi skrev 1966 en bok som hyllade komplexitet och motsägelser och
    vände Mies van der Rohes ”less is more” till ”less is a bore” (mindre
    är tråkigt). Kritikern Charles Jencks förklarade att modernismen dog
    när bostadsområdet Pruitt-Igoe i St. Louis, byggt på 1950-talet efter
    modernistiska ideal, började rivas 1972. Postmoderna byggnader
    återanvände klassiska kolonner, gavlar och färger med ironi – Philip
    Johnsons skyskrapa för telefonbolaget AT&T i New York (1984) fick en
    topp som liknade ett gammalt möbelkrön.

    I bildkonsten handlade postmodernismen om kopior och identiteter:
    Cindy Sherman fotograferade sig själv i roller som påminde om
    filmstillbilder, och andra fotograferade av andras fotografier.
    Filosofer som fransmannen Jean-François Lyotard (1979) beskrev det
    postmoderna tillståndet som misstro mot stora förklaringar.
    Spektakulär, uppseendeväckande arkitektur som [Guggenheim
    Bilbao](#guggenheim-bilbao-1997) växte delvis ur samma frigörelse.

guggenheim-bilbao-1997:
  period: 1980
  label: "Guggenheim Bilbao 1997"
  title: "Guggenheimmuseet i Bilbao (1997)"
  wiki:
    - "en:Guggenheim Museum Bilbao"
    - "sv:Frank Gehry"
  text: |
    **Guggenheim Bilbao** är ett museum för modern och samtida konst som
    öppnade i oktober 1997 i Bilbao i Baskien i norra Spanien. Det ritades
    av den kanadensisk-amerikanske arkitekten **Frank Gehry** (född 1929).
    Byggnaden ser ut som en samling böjda, glänsande former – som ett
    skepp eller en blomma – längs floden, klädd med omkring 33 000 tunna
    plåtar av titan som skiftar i färg med vädret.

    Sådana fritt böjda former var tidigare nästan omöjliga att rita och
    bygga. Gehrys kontor använde CATIA, ett datorprogram för konstruktion
    av flygplan från franska Dassault, för att översätta handgjorda
    modeller till exakta tredimensionella ritningar som stålkonstruktionen
    och varje plåt kunde tillverkas efter. Byggnaden blev ett tidigt
    genombrott för datorstödd design i arkitekturen.

    Bakom projektet låg en affär: den baskiska regionregeringen betalade
    bygget, omkring 100 miljoner dollar, medan den amerikanska
    Guggenheimstiftelsen bidrog med namn, samlingar och ledning. Bilbao
    var en industristad i kris efter att varv och stålverk lagts ned.
    Museet drog omkring en miljon besökare om året, och ”Bilbaoeffekten”
    blev ett begrepp för hur en spektakulär byggnad av en stjärnarkitekt
    kan förvandla en stad. Många städer försökte sedan kopiera receptet,
    med växlande framgång. Stilen brukar räknas till dekonstruktivismen,
    en riktning som växte ur [postmodernismens](#postmodernism) uppgörelse
    med modernismen.

banksy:
  period: 2000
  label: "Banksy"
  title: "Banksy"
  wiki:
    - "sv:Banksy"
    - "en:Love Is in the Bin"
  text: |
    **Banksy** är pseudonym för en anonym brittisk gatukonstnär som
    började i Bristol på 1990-talet. Hans identitet har aldrig officiellt
    bekräftats, vilket är en del av varumärket. Han arbetar främst med
    **schabloner** (stenciler): ett motiv skärs ut ur kartong, hålls mot
    en vägg och sprayas, vilket gör det möjligt att måla ett detaljerat
    motiv på några minuter – viktigt när målningen är olaglig.

    Motiven är enkla, ofta svartvita och ironiska: råttor, poliser som
    kysser varandra, en demonstrant som kastar en blombukett i stället för
    en brandbomb, en flicka som släpper en röd hjärtballong. Teman är
    krig, övervakning, konsumtion och makt. Han har målat på muren mellan
    Israel och Västbanken, öppnat ett hotell i Betlehem (2017) och en
    parodi på ett nöjesfält, *Dismaland* (2015). Verken sprids snabbare
    via foton på nätet och [sociala medier](#sociala-medier) än på gatan,
    där de ofta snabbt tas bort eller sågas ut och säljs.

    Banksy är kritisk till konstmarknaden men har blivit en av dess
    storsäljare. 2018 såldes *Flicka med ballong* på Sotheby's i London
    för drygt en miljon pund – och i samma ögonblick strimlades halva
    duken av en dold dokumentförstörare i ramen. Det delvis förstörda
    verket fick det nya namnet *Love is in the Bin* och såldes 2021 för
    ungefär 18,6 miljoner pund. Han står i en tradition från
    [Basquiat](#basquiat) och 1980-talets graffiti.

ai-weiwei:
  period: 2000
  label: "Ai Weiwei"
  title: "Ai Weiwei"
  wiki:
    - "sv:Ai Weiwei"
    - "en:Sunflower Seeds (artwork)"
  text: |
    **Ai Weiwei** (född 1957) är en kinesisk konstnär och aktivist. Hans
    far, poeten Ai Qing, förvisades under Maos kampanjer, och familjen
    levde i flera år i arbetsläger i västra Kina. Ai Weiwei bodde i New
    York 1981–93, där han påverkades av [Duchamp](#duchamp-och-dadaism)
    och [Warhol](#popkonst-warhol), och återvände sedan till Peking.

    Han arbetar ofta med traditionellt kinesiskt hantverk på provocerande
    sätt: han har släppt en 2000 år gammal urna i golvet och fotograferat
    den när den krossas, och målat Coca-Cola-logotypen på antika kärl. Han
    var konstnärlig rådgivare för nationalstadion ”Fågelboet” inför [OS i
    Peking 2008](#os-2008), men tog sedan avstånd från spelen som
    propaganda. Efter jordbävningen i Sichuan 2008 samlade han in namnen
    på över 5 000 skolbarn som dött i dåligt byggda skolor och publicerade
    dem, vilket myndigheterna försökt tysta. I *Solrosfrön* på Tate Modern
    i London (2010) täckte han golvet med omkring 100 miljoner frön av
    porslin, vart och ett handmålat av hantverkare i porslinsstaden
    Jingdezhen.

    Han använde bloggar och [sociala medier](#sociala-medier) flitigt för
    att kritisera regimen. 2011 hölls han fängslad i 81 dagar utan åtal,
    och han fick inte resa ut förrän 2015. Sedan dess bor han i Europa och
    har gjort verk om flyktingkrisen, bland annat med flytvästar från
    Medelhavet.

digital-konst:
  period: 2000
  label: "digital konst"
  title: "Digital konst"
  wiki:
    - "en:Digital art"
    - "en:Generative art"
    - "en:Computer art"
  text: |
    **Digital konst** är konst som skapas eller visas med datorer. Den är
    äldre än man kan tro: redan 1965 ställde matematikerna Georg Nees och
    Frieder Nake i Stuttgart och A. Michael Noll vid Bell Labs i USA ut
    bilder som ritats av en *plotter* – en ritmaskin med penna – efter
    program de skrivit. Ungerska Vera Molnár gjorde algoritmiska
    variationer av kvadrater. Utställningen *Cybernetic Serendipity* i
    London 1968 visade datorkonst för en bred publik. Tankesättet låg nära
    [konceptkonstens](#konceptkonst) instruktionsverk.

    Efter [webben](#webben-berners-lee-1989) uppstod på 1990-talet
    *nätkonst*, verk som bara existerar i webbläsaren. Program som
    Photoshop (1990) gjorde digital bildbehandling till vardag för
    illustratörer och fotografer. 2001 skapade Casey Reas och Ben Fry
    programspråket **Processing**, tänkt för konstnärer och designer, som
    gjorde **generativ konst** – bilder och animationer som uppstår ur
    kod, regler och slump – tillgänglig för många. På 2000-talet kom stora
    interaktiva installationer med sensorer, projektioner och
    realtidsgrafik, och spelmotorer blev konstnärliga verktyg.

    Ett gammalt problem för digital konst var ekonomiskt: en fil kan
    kopieras utan kostnad, så vad säljer man? Museer och samlare köpte
    fysiska utskrifter, unika installationer eller licenser. Försöket att
    skapa artificiell knapphet ledde senare till
    [NFT-bubblan](#nft-bubblan-2021), och maskininlärningen öppnade för
    [AI-genererade bilder](#ai-genererade-bilder).

nft-bubblan-2021:
  period: 2020
  label: "NFT-bubblan 2021"
  title: "NFT-bubblan 2021"
  wiki:
    - "en:Non-fungible token"
    - "en:Everydays: the First 5000 Days"
  text: |
    En **NFT** (non-fungible token, ”icke utbytbar token”) är en post i en
    *blockkedja* – en offentlig, decentraliserad databas som Ethereum, där
    transaktioner inte kan ändras i efterhand – som anger att en viss
    adress äger en viss unik token. ”Icke utbytbar” betyder att varje
    token är unik, till skillnad från en bitcoin som är utbytbar mot
    vilken annan bitcoin som helst. Standarden ERC-721 för Ethereum
    fastställdes 2018. Själva bildfilen ligger oftast inte i blockkedjan,
    utan token innehåller bara en länk till den. Det man köper är alltså
    ett ägarbevis, inte exklusiv tillgång till bilden, som fortfarande kan
    kopieras fritt.

    NFT:er lovade att lösa [den digitala konstens](#digital-konst) gamla
    problem: hur man säljer något som kan kopieras. I mars 2021 sålde
    auktionshuset Christie's ett collage av 5 000 digitala bilder,
    *Everydays: The First 5000 Days* av amerikanen Mike Winkelmann
    (”Beeple”), för 69,3 miljoner dollar, betalat i kryptovalutan Ether.
    Samlingar av tusentals datorgenererade figurer, som CryptoPunks och
    Bored Ape Yacht Club, handlades för hundratusentals dollar styck, och
    kändisar och företag köpte in sig.

    Boomen drevs av låga räntor, stimulanspengar under [pandemin](#covid),
    stigande kryptokurser och spekulation. Under 2022 rasade
    kryptomarknaden, handelsvolymerna på NFT-marknaderna föll kraftigt och
    de flesta tokens förlorade nästan hela sitt värde. Det påminner om
    tidigare spekulationsbubblor, men har lämnat kvar diskussionen om
    digitalt ägande och om konstnärers rätt till ersättning vid
    andrahandsförsäljning.

ai-genererade-bilder:
  period: 2020
  label: "AI-genererade bilder"
  title: "AI-genererade bilder"
  wiki:
    - "en:Text-to-image model"
    - "en:Artificial intelligence art"
    - "en:Diffusion model"
  text: |
    Med [djupinlärning](#djupinlarning-alexnet-2012) blev det möjligt för
    datorer inte bara att känna igen bilder utan också att skapa dem. 2014
    kom *GAN* (generative adversarial networks), där två neurala nät
    tävlar: ett genererar bilder, det andra försöker avslöja dem som
    falska. 2018 sålde Christie's ett GAN-genererat porträtt, *Edmond de
    Belamy*, för 432 500 dollar.

    Genombrottet för allmänheten kom med **diffusionsmodeller**, som
    tränas att stegvis ta bort brus från bilder och därigenom lär sig
    skapa nya bilder från rent brus, styrda av en textbeskrivning.
    OpenAI:s DALL·E 2, Midjourney och den öppet släppta Stable Diffusion
    kom alla under 2022 och gjorde det möjligt för vem som helst att
    skriva en mening och få en bild på några sekunder. Modellerna tränades
    på miljarder bild–text-par hämtade från nätet – Stable Diffusion på
    datamängden LAION-5B med omkring 5,8 miljarder par – ofta utan
    tillstånd från upphovspersonerna. Se även [generativ
    AI](#generativ-ai).

    Det väckte strid. 2022 vann en AI-genererad bild en konsttävling i
    Colorado, illustratörer och bildbyråer som Getty Images stämde
    AI-företagen, och USA:s upphovsrättsmyndighet har slagit fast att
    bilder helt utan mänskligt skapande bidrag inte kan
    upphovsrättsskyddas. Diskussionen påminner om den kring [fotografiet
    1839](#fotografiet-daguerreotypi-1839): när en maskin kan göra bilder
    billigt, vad blir då konstnärens roll? Då ledde svaret till
    impressionism och abstraktion; vad det blir nu är ännu öppet.
