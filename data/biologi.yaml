poliovaccin-1955:
  period: 1940
  label: "poliovaccin 1955"
  title: "Poliovaccinet"
  wiki:
    - "en:Polio vaccine"
    - "en:Jonas Salk"
  text: |
    Polio (barnförlamning) orsakas av ett virus som sprids via avföring och smutsigt vatten. De flesta smittade märker lite, men omkring en på 200 får förlamning, ibland av andningsmusklerna. Under 1900-talets första hälft kom epidemierna oftare – USA hade 1952 omkring 58 000 fall – och bilden av barn i ”järnlungor” (respiratorer som pumpade luft genom undertryck) skrämde en hel generation.

    Den amerikanske läkaren Jonas Salk utvecklade ett vaccin av avdödat virus som injiceras. Det testades 1954 i en av historiens största kliniska prövningar, med omkring 1,8 miljoner barn, och förklarades säkert och effektivt i april 1955. Några år senare kom Albert Sabins orala vaccin av försvagat levande virus, som kunde ges på en sockerbit och var billigt att sprida i stora kampanjer.

    Vaccinet byggde på en tradition från [Pasteur](#pasteurs-rabiesvaccin-1885): lär immunförsvaret känna igen viruset utan att orsaka sjukdomen. Fallen i rika länder föll snabbt; Sverige hade sitt sista större utbrott på 1950-talet. Efter framgången med [smittkoppor](#smittkoppor-utrotade-1980) startade WHO 1988 ett globalt utrotningsprogram, och det vilda poliovirus som finns kvar har trängts tillbaka till Pakistan och Afghanistan.

genetiska-koden-1966:
  period: 1960
  label: "Genetiska koden 1966"
  title: "Den genetiska koden knäcks"
  wiki:
    - "en:Genetic code"
    - "en:Nirenberg and Matthaei experiment"
  text: |
    När [DNA:s struktur](#dna-strukturen-1953) var känd återstod frågan: hur översätts en följd av fyra ”bokstäver” (baserna A, C, G, T) till proteiner, som byggs av 20 olika aminosyror? Två bokstäver räcker inte (4² = 16 kombinationer), men tre ger 4³ = 64 – tillräckligt. Idén var alltså tripletter, kodoner.

    1961 tillsatte Marshall Nirenberg och Heinrich Matthaei vid amerikanska NIH konstgjort RNA (DNA:s ”arbetskopia”, där T ersätts av U) med bara bokstaven U till ett cellextrakt. Det bildades ett protein av bara aminosyran fenylalanin: UUU betyder alltså fenylalanin. Med liknande experiment och Har Gobind Khoranas syntetiska RNA-sekvenser var alla 64 kodoner kartlagda 1966: 61 kodar för aminosyror (flera kodoner per aminosyra) och tre betyder ”stopp”. Nirenberg, Khorana och Robert Holley fick Nobelpriset 1968.

    Koden är nästan densamma i alla organismer, från bakterier till människor – ett starkt stöd för gemensamt ursprung. Det gör också att en mänsklig gen kan läsas av en bakterie, grunden för bioteknik som insulin från bakterier. Ärftlighetens regler som [Mendel](#mendels-artor-1865) upptäckt fick nu en molekylär förklaring, och koden är det som [mRNA-vacciner](#mrna-vacciner) utnyttjar: man skriver ett meddelande som cellen översätter till protein.

hjarttransplantation-1967:
  period: 1960
  label: "hjärttransplantation 1967"
  title: "Den första hjärttransplantationen"
  wiki:
    - "en:Heart transplantation"
    - "en:Christiaan Barnard"
  text: |
    Den 3 december 1967 transplanterade den sydafrikanske kirurgen Christiaan Barnard ett hjärta från en avliden ung kvinna till 53-årige Louis Washkansky på Groote Schuur-sjukhuset i Kapstaden. Operationen lyckades och nyheten gick jorden runt. Washkansky dog dock efter 18 dagar i lunginflammation – läkemedlen som dämpade immunförsvaret, för att det inte skulle stöta bort hjärtat, gjorde honom försvarslös mot infektioner. Barnards andra patient levde i omkring 19 månader.

    Tekniken hade utvecklats av bl.a. Norman Shumway i USA genom djurförsök, och byggde på hjärt-lungmaskinen som håller blodet syresatt under operationen. Kärnproblemet var avstötning: immunförsvaret angriper främmande vävnad, ungefär som det angriper blod med fel blodgrupp ([blodgrupperna](#blodgrupper-1901) var en tidig insikt om detta). Efter en våg av transplantationer 1968 med dåliga resultat sjönk antalet kraftigt.

    Genombrottet kom med ciklosporin, ett immundämpande medel från en jordsvamp som godkändes i början av 1980-talet. Därefter blev hjärttransplantation en rutinbehandling; i dag görs några tusen per år i världen och många patienter lever i över tio år. Operationen tvingade också fram nya definitioner av död: hjärndöd, alltså att hjärnans alla funktioner upphört, blev kriterium så att organ kunde tas medan hjärtat ännu slog.

smittkoppor-utrotade-1980:
  period: 1960
  label: "smittkoppor utrotade 1980"
  title: "Smittkopporna utrotas"
  wiki:
    - "sv:Smittkoppor"
    - "en:Eradication of smallpox"
  text: |
    Smittkoppor var en virussjukdom som dödade ungefär var tredje smittad och vanställde många överlevande. Bara under 1900-talet uppskattas den ha dödat omkring 300 miljoner människor. Skyddet hade en lång historia: [variolation](#variolation-mot-smittkoppor-1721) med material från sjuka, och från 1796 Edward Jenners vaccin med det ofarliga kokoppsviruset.

    1967 startade Världshälsoorganisationen WHO en intensifierad global kampanj. Sjukdomen hade då fortfarande 10–15 miljoner fall per år. Nyckeln var inte att vaccinera alla utan ”ringvaccination”: hitta varje fall, isolera det och vaccinera alla i dess omgivning. Det fungerade eftersom viruset bara smittar människor, sjukdomen syns tydligt och vaccinet var stabilt och billigt. Det sista naturliga fallet var en sjukhuskock i Somalia i oktober 1977. Den 8 maj 1980 förklarades smittkopporna utrotade.

    Det är fortfarande den enda mänskliga sjukdom som utrotats (bland djursjukdomar har boskapspest utrotats, 2011). Viruset finns kvar i två laboratorier, i USA och Ryssland. Framgången inspirerade kampanjen mot polio efter [poliovaccinet](#poliovaccin-1955), som ännu inte nått ända fram. Eftersom vaccinationen upphörde är dagens befolkning i stort sett oskyddad, vilket gör viruset till en fråga för biologisk säkerhet.

pcr-1983:
  period: 1980
  label: "PCR 1983"
  title: "PCR – att kopiera DNA i provrör"
  wiki:
    - "sv:Polymeraskedjereaktion"
    - "en:Kary Mullis"
  text: |
    1983 körde den amerikanske biokemisten Kary Mullis på företaget Cetus bil en natt i Kalifornien och kom på hur man kan mångfaldiga en vald bit DNA. Metoden, polymeraskedjereaktion (PCR), fungerar i cykler. Värm provet till cirka 95 °C så att DNA:s två strängar separerar. Kyl så att korta konstgjorda DNA-bitar, primrar, fäster precis där den sökta sekvensen börjar och slutar. Låt sedan enzymet DNA-polymeras bygga nya kopior. Varje cykel fördubblar mängden: 30 cykler ger i teorin omkring en miljard kopior.

    Ett problem var att enzymet förstördes av hettan. Lösningen blev Taq-polymeras från bakterien *Thermus aquaticus*, som lever i varma källor i Yellowstone och tål nästan kokning. Med det kunde processen automatiseras i maskiner som bara växlar temperatur. Mullis fick Nobelpriset i kemi 1993.

    PCR gör det möjligt att arbeta med ytterst små mängder DNA, ner till enstaka molekyler. Den blev grunden för genetisk diagnostik, rättsmedicinska DNA-bevis, faderskapstester, studier av forntida DNA och sekvenseringen av [människans arvsmassa](#manniskans-genom-2003). Under [covid-19-pandemin](#covid-19) var PCR-testet standardmetoden för att påvisa viruset. Det bygger direkt på insikterna om [DNA:s dubbelspiral](#dna-strukturen-1953), där varje bas bara passar mot en motsvarande bas.

hiv-identifieras-1983:
  period: 1980
  label: "hiv identifieras 1983"
  title: "Hiv identifieras"
  wiki:
    - "sv:Hiv"
    - "en:Discovery and development of HIV"
    - "en:HIV/AIDS"
  text: |
    1981 rapporterade amerikanska läkare om unga, tidigare friska män som fick ovanliga infektioner och cancer som normalt bara drabbar personer med kraftigt nedsatt immunförsvar. Sjukdomen fick namnet aids (förvärvat immunbristsyndrom). Den spreds via blod och sexuell kontakt, och snart även via blodtransfusioner och delade sprutor.

    1983 isolerade Françoise Barré-Sinoussi och Luc Montagnier vid Pasteurinstitutet i Paris ett nytt virus från en patient. 1984 publicerade Robert Gallos grupp i USA belägg för att viruset orsakar aids; det blev en bitter prioritetsstrid. Viruset fick namnet hiv. Det är ett retrovirus: dess arvsmassa är RNA, som skrivs om till DNA och byggs in i värdcellens DNA. Det angriper särskilt CD4-celler, en sorts vita blodkroppar som samordnar immunförsvaret. Barré-Sinoussi och Montagnier fick Nobelpriset 2008.

    Att viruset var känt gjorde det möjligt att testa blod (från 1985) och utveckla läkemedel. AZT kom 1987; från 1996 kombinerade man tre läkemedel, vilket gjorde hiv från en dödsdom till en kronisk sjukdom med nästan normal livslängd. Men tillgången var ojämn: [aids](#aids) har dödat omkring 40 miljoner människor, flest i [Afrika söder om Sahara](#hiv). Något vaccin finns ännu inte, eftersom viruset muterar snabbt.

klonfaret-dolly-1996:
  period: 1980
  label: "klonfåret Dolly 1996"
  title: "Klonfåret Dolly"
  wiki:
    - "en:Dolly (sheep)"
    - "en:Somatic cell nuclear transfer"
  text: |
    Den 5 juli 1996 föddes ett lamm vid Roslin Institute nära Edinburgh; det offentliggjordes i februari 1997. Dolly var det första däggdjuret som klonats från en vuxen kroppscell. Ian Wilmut och Keith Campbell tog en cell från juvret på ett sexårigt får och flyttade dess cellkärna – som innehåller nästan all arvsmassa – till ett obefruktat ägg vars egen kärna tagits bort. Efter en elektrisk stöt började ägget dela sig som ett embryo och placerades i ett annat får. Det krävdes 277 försök för att få ett levande lamm.

    Resultatet var biologiskt omvälvande. Man trodde att specialiserade celler, som juverceller, hade stängt av gener de inte behövde på ett sätt som inte gick att backa. Dolly visade att en vuxen cells DNA kan ”nollställas” och styra utvecklingen av en hel individ. (Grodor hade klonats från cellkärnor av John Gurdon redan 1962.)

    Dolly ledde till intensiv etisk debatt om att klona människor, vilket många länder förbjöd. Viktigare vetenskapligt blev frågan om omprogrammering: 2006 visade japanen Shinya Yamanaka att fyra gener räcker för att få vanliga celler att bli stamceller, utan ägg alls. Dolly dog 2003. Genredigering med [CRISPR](#crispr-2012) är ett senare, mer precist sätt att ändra arvsmassa; båda vilar på förståelsen av [den genetiska koden](#genetiska-koden-1966).

manniskans-genom-2003-2:
  period: 2000
  label: "Människans genom 2003"
  same_as: manniskans-genom-2003

crispr-2012:
  period: 2000
  label: "CRISPR 2012"
  title: "CRISPR – gensaxen"
  wiki:
    - "sv:CRISPR"
    - "en:CRISPR gene editing"
  text: |
    Bakterier försvarar sig mot virus med ett eget immunsystem. De sparar bitar av virusets DNA i ett särskilt område av sin arvsmassa, CRISPR (förkortning för ett mönster av korta upprepade sekvenser i området). En RNA-kopia av en sådan bit fungerar som en sökmall och leder enzymet Cas9 till virus-DNA som matchar; Cas9 klipper då av DNA-strängen. Systemet upptäcktes stegvis från 1987, bland annat av spanjoren Francisco Mojica.

    2012 visade Emmanuelle Charpentier (fransk mikrobiolog, då verksam vid Umeå universitet) och Jennifer Doudna (amerikansk biokemist i Berkeley) att man kan programmera Cas9 med ett konstgjort guide-RNA på omkring 20 baser, så att det klipper var man vill i vilket DNA som helst. 2013 visade Feng Zhang och George Church att det fungerar i mänskliga celler. När cellen lagar klippet kan man slå ut en gen eller föra in en ny sekvens.

    Tidigare metoder, som zinkfingernukleaser, krävde att man konstruerade ett nytt protein för varje mål – månader av arbete. Med CRISPR byter man bara en kort RNA-sekvens. Metoden spreds på några år till laboratorier över hela världen. 2023 godkändes den första CRISPR-behandlingen, mot sicklecellanemi. 2018 orsakade en kinesisk forskare skandal genom att genredigera embryon som blev barn. Charpentier och Doudna fick Nobelpriset i kemi 2020. Verktyget bygger på kunskapen om [den genetiska koden](#genetiska-koden-1966) och kompletterar [PCR](#pcr-1983).

mrna-vacciner:
  period: 2020
  label: "mRNA-vacciner"
  title: "mRNA-vacciner"
  wiki:
    - "en:MRNA vaccine"
  text: |
    Ett vaccin lär immunförsvaret att känna igen ett smittämne utan att man blir sjuk. Traditionellt injicerar man försvagat eller avdödat virus eller renade virusproteiner, vilket tar lång tid att odla fram. Ett mRNA-vaccin ger i stället cellerna själva instruktionen. mRNA (budbärar-RNA) är den molekyl som bär en gens recept från DNA till cellens proteinfabriker, enligt [den genetiska koden](#genetiska-koden-1966). Man syntetiserar mRNA för ett virusprotein – för covid-19 virusets spikprotein – packar det i små fettkulor och injicerar. Cellerna tillverkar proteinet en kort tid, immunförsvaret lär sig känna igen det, och mRNA:t bryts ner.

    Det största hindret var att främmande mRNA gav kraftiga inflammationsreaktioner och bröts ner snabbt. Ungerskan Katalin Karikó och amerikanen Drew Weissman visade 2005 att om man byter ut en av RNA:s byggstenar (uridin mot en modifierad variant) undviker man reaktionen. Karikó hade under lång tid svårt att få forskningsanslag för idén. De fick Nobelpriset 2023.

    När [covid-19](#covid-19) bröt ut publicerades virusets gensekvens i januari 2020; Moderna hade en vaccinkandidat klar på några dagar, och BioNTech/Pfizers vaccin godkändes i december 2020 – under ett år, mot tidigare ofta tio år eller mer. Effekten mot svår sjukdom var hög, och miljarder doser gavs. Tekniken prövas nu mot influensa, andra infektioner och som skräddarsydda cancervacciner. Den följer den långa linjen från [Pasteurs vacciner](#pasteurs-rabiesvaccin-1885).

alphafold-2020:
  period: 2020
  label: "AlphaFold 2020"
  title: "AlphaFold – proteinveckning med AI"
  wiki:
    - "en:AlphaFold"
  text: |
    Proteiner är långa kedjor av aminosyror (20 sorter) som veckar sig till en bestämd tredimensionell form; formen avgör vad proteinet gör, t.ex. vilka molekyler ett enzym kan binda. Kedjans ordning läses direkt ur genen via [den genetiska koden](#genetiska-koden-1966), men att förutsäga formen ur ordningen var ett av biologins stora olösta problem i ett halvsekel. Experimentellt bestäms formen med röntgenkristallografi eller elektronmikroskopi, vilket kan ta månader eller år per protein.

    Sedan 1994 hålls tävlingen CASP, där metoder testas på proteiner vars form just bestämts men inte publicerats. 2020 nådde AlphaFold 2 från Google DeepMind i London en noggrannhet i nivå med experiment för omkring två tredjedelar av proteinerna – ett stort språng. Systemet är ett djupt neuronnät, en efterföljare till [djupinlärningens genombrott](#djupinlarning-alexnet-2012), tränat på de omkring 170 000 kända strukturerna i den offentliga databasen PDB. Det utnyttjar också att aminosyror som sitter nära varandra i den vikta formen tenderar att mutera tillsammans under evolutionen.

    2021–22 publicerade DeepMind och Europeiska bioinformatikinstitutet förutsagda strukturer för över 200 miljoner proteiner, i praktiken alla kända. Forskare använder dem i läkemedelsutveckling och grundforskning, och liknande metoder används nu för att designa nya proteiner. Demis Hassabis och John Jumper från DeepMind fick Nobelpriset i kemi 2024, tillsammans med David Baker som utvecklat proteindesign.
