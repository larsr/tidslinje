# Biologi & medicin
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

al-zahrawi-kirurgiska-instrument-1000:
  period: 1000
  label: "al-Zahrawi: kirurgiska instrument ~1000"
  title: "al-Zahrawi, kirurgins handbok"
  wiki:
    - "en:Al-Zahrawi"
  text: |
    **al-Zahrawi** (936–1013, latiniserat Abulcasis) var läkare vid hovet i Córdoba, huvudstad i det muslimska Spanien (al-Andalus), som då var en av Europas största och rikaste städer. Omkring år 1000 fullbordade han *al-Tasrif*, ett medicinskt uppslagsverk i 30 delar.

    Den sista delen handlar om kirurgi och var för sin tid unik: den innehåller teckningar av omkring 200 instrument – skalpeller, krokar, tänger, sonder, sågar, instrument för tandvård och förlossning – med beskrivningar av hur de används. Han beskriver bland annat operationer av blåssten, behandling av benbrott, kauterisering (att bränna med glödgat järn för att stoppa blödningar) och sömnad av sår med katgut, tråd av djurtarm som kroppen själv bryter ned.

    Betydelsen låg i att kirurgi presenterades som en lärd disciplin baserad på anatomi, inte bara som hantverk. Kirurgidelen översattes till latin av [Gerhard av Cremona](#gerhard-av-cremona-oversatter-ptolemaios) i Toledo på 1100-talet och användes i Europa i flera hundra år; den franske kirurgen [Gui de Chauliac](#gui-de-chauliac-kirurgi) citerade honom flitigt på 1300-talet. al-Zahrawi verkade under kalifatets sista storhetstid, strax innan [Córdobakalifatet föll sönder](#cordoba-kalifatet-kollapsar-inbordeskrig).

ibn-sina-medicinens-kanon-1025:
  period: 1020
  label: "Ibn Sina: Medicinens kanon ~1025"
  title: "Medicinens kanon"
  wiki:
    - "en:The Canon of Medicine"
    - "sv:Avicenna"
  text: |
    [Ibn Sina](#ibn-sina-avicenna) (980–1037, latiniserat Avicenna) var en persisk läkare och filosof som verkade vid olika hov i Iran. Omkring 1025 fullbordade han *al-Qanun fi al-Tibb*, **Medicinens kanon**, ett verk i fem böcker som samlade det mesta av den tidens medicinska kunskap i ett logiskt system.

    Grunden var den grekiska läran från Hippokrates (400-talet f.Kr.) och Galenos (romersk läkare, 100-talet e.Kr.): kroppen styrs av fyra vätskor – blod, slem, gul och svart galla – och sjukdom är obalans mellan dem. Ibn Sina lade till persisk och indisk kunskap, egna kliniska iakttagelser, beskrivningar av hundratals läkemedel och regler för hur ett läkemedels verkan ska prövas: på en ren sjukdom, i rätt dos, på många fall, med jämförelse mot tid. Det är en tidig föregångare till kliniska prövningar.

    Kanon översattes till latin av [Gerhard av Cremona](#gerhard-av-cremona-oversatter-ptolemaios) på 1100-talet och blev lärobok vid europeiska universitet i nästan 500 år, efter att [Salerno](#salerno-europas-forsta-medicinska-skola) och andra skolor tagit upp den arabiska medicinen. Den kommenterades flitigt, bland annat av [Ibn al-Nafis](#ibn-al-nafis-lungkretsloppet-1242), som i en kommentar beskrev lungkretsloppet. Humoralläran föll först när mikrobiologin på 1800-talet gav sjukdomar konkreta orsaker.

salerno-europas-forsta-medicinska-skola:
  period: 1040
  label: "Salerno: Europas första medicinska skola"
  title: "Läkarskolan i Salerno"
  wiki:
    - "en:Schola Medica Salernitana"
  text: |
    Salerno är en hamnstad i södra Italien, i en region där latinsk, grekisk-bysantinsk, judisk och arabisk kultur möttes. Här växte från 900- och 1000-talet fram **Schola Medica Salernitana**, Europas första kända skola som systematiskt utbildade läkare. Den var ingen formell institution med stadgar från början, utan en samling läkare och lärare som undervisade och skrev läroböcker.

    Undervisningen byggde först på antika latinska texter, men förändrades när [Constantinus Africanus](#constantinus-africanus-oversatter) på 1000-talet översatte arabiska medicinska verk till latin. Det gav skolan en teoretisk grund i den grekisk-arabiska läran om de fyra kroppsvätskorna. Ovanligt nog fanns här kvinnliga läkare, och skrifterna under namnet [Trotula](#salernos-lakare-trotula-om-kvinnors) om kvinnors hälsa blev kända i hela Europa. Skolans populära hälsodikt, *Regimen sanitatis*, gav råd om kost, sömn och hygien.

    Salerno blev förebild för de medicinska fakulteter som snart växte fram vid universitet som [Bologna](#universitetet-i-bologna-1088), Paris och Montpellier. År 1231 införde kejsaren Fredrik II krav på examen i Salerno för att få praktisera som läkare i hans rike – en tidig form av legitimation. Skolan förlorade senare betydelse till universiteten men stängdes formellt först 1811.

constantinus-africanus-oversatter:
  period: 1060
  label: "Constantinus Africanus översätter arabisk medicin"
  title: "Constantinus Africanus"
  wiki:
    - "en:Constantine the African"
  text: |
    **Constantinus Africanus** (död ca 1087) var en man från Nordafrika, troligen från Kairouan i nuvarande Tunisien, som kom till södra Italien på 1070-talet, konverterade till kristendomen och blev munk i klostret Monte Cassino, Benediktinordens moderkloster.

    Där översatte han ett stort antal arabiska medicinska verk till latin. Bland dem fanns *Pantegni*, en latinsk version av persern Ali ibn al-Abbas al-Majusis medicinska handbok från 900-talet, samt skrifter av den judiske läkaren Isaak Israeli från Kairouan. Han angav ofta inte de arabiska författarna utan presenterade texterna som sina egna eller anonyma – något som var vanligt vid tiden men gjorde att upphovsmännen glömdes bort i Europa.

    Före honom hade Västeuropa nästan bara korta, praktiska latinska receptsamlingar. Constantinus översättningar gav för första gången en teoretisk grund – den grekisk-arabiska läran om kroppsvätskor, organ och sjukdomsorsaker – och blev basen för undervisningen i [Salerno](#salerno-europas-forsta-medicinska-skola). Han var en föregångare till den stora översättningsvågen på 1100-talet i Spanien, där [översättarna i Toledo](#toledo-arabisk-vetenskap-till-latin) gjorde bland annat [Ibn Sinas Kanon](#ibn-sina-medicinens-kanon-1025) tillgänglig på latin.

salernos-lakare-trotula-om-kvinnors:
  period: 1080
  label: "Salernos läkare: Trotula om kvinnors hälsa"
  title: "Trotula och kvinnomedicinen"
  wiki:
    - "en:Trotula"
    - "en:Trota of Salerno"
  text: |
    **Trotula** är namnet på en samling av tre latinska texter om kvinnors sjukdomar, förlossningar och hudvård, som växte fram i [Salerno](#salerno-europas-forsta-medicinska-skola) under 1100-talet. Namnet hänger ihop med **Trota**, en kvinnlig läkare i Salerno som verkligen fanns och skrev en egen medicinsk text; hur stor del av samlingen som går tillbaka på henne är omdiskuterat. En av texterna bygger tydligt på arabisk medicin som kommit till Salerno via [Constantinus Africanus](#constantinus-africanus-oversatter).

    Texterna tar upp menstruationsbesvär, fertilitet, graviditet, svåra förlossningar och vård av nyfödda, samt kosmetik. Förklaringarna följer läran om de fyra kroppsvätskorna, där kvinnokroppen ansågs kallare och fuktigare än mannens. Råden är en blandning av praktisk erfarenhet – till exempel om att stödja mellangården vid förlossning – och behandlingar vi i dag ser som verkningslösa.

    Samlingen spreds i över 100 bevarade handskrifter och översattes till flera folkspråk; den var en av de mest använda texterna om kvinnohälsa i Europa fram till 1500-talet. Länge trodde forskare att ”Trotula” var en påhittad person, men på 1990-talet visades att Trota var historisk. Hon och [Hildegard av Bingen](#hildegard-av-bingen-physica-1150) är bland de få kvinnor vars medicinska skrifter bevarats från medeltiden.

hildegard-av-bingen-fods-1098-lakevaxter:
  period: 1100
  label: "Hildegard av Bingen föds 1098: läkeväxter"
  title: "Hildegard av Bingen"
  wiki:
    - "sv:Hildegard av Bingen"
  text: |
    **Hildegard av Bingen** (1098–1179) var en tysk benediktinnunna som blev abbedissa och grundade egna kloster vid Rhen. Hon är en av medeltidens mest mångsidiga gestalter: hon skrev mystiska visionsböcker, komponerade musik som framförs än i dag, brevväxlade med påvar och kejsare och skrev om naturen och läkekonst. Hon helgonförklarades 2012.

    Kloster var vid den här tiden centrala för sjukvården i Europa. De hade örtagårdar, sjukstugor och bibliotek med avskrifter av antika texter, och munkar och nunnor vårdade sjuka. Hildegard växte in i den traditionen. Hennes naturkunskap samlades i [Physica](#hildegard-av-bingen-physica-1150) och *Causae et curae* (”Orsaker och botemedel”), där hon beskrev hundratals växter, djur och stenar och deras läkande egenskaper.

    Hennes arbete byggde mer på lokal folklig erfarenhet och klostertradition än på de grekisk-arabiska texter som samtidigt började nå Europa via [Salerno](#salerno-europas-forsta-medicinska-skola) och Toledo. Därför är hon en viktig källa till vilka växter man faktiskt använde i Tyskland på 1100-talet, bland annat en av de äldsta kända beskrivningarna av humle som konserveringsmedel i öl. Mycket av hennes medicin bygger på läran om kroppsvätskor och förutsätter samband vi inte godtar i dag.

ibn-zuhr-kirurgi-pa-djur-forst:
  period: 1120
  label: "Ibn Zuhr: kirurgi på djur först"
  title: "Ibn Zuhr prövar kirurgi på djur"
  wiki:
    - "en:Ibn Zuhr"
  text: |
    **Ibn Zuhr** (ca 1094–1162, latiniserat Avenzoar) var läkare i Sevilla i det muslimska Spanien och tjänade almoravidiska och sedan almohadiska härskare – två berberdynastier från Marocko som i tur och ordning styrde al-Andalus (se [almohaderna](#almohader-tar-al-andalus)). Han var lärare och vän till [Averroës](#averroes-kommenterar-aristoteles).

    I *al-Taysir* (”Underlättandet”) beskrev han kliniska fynd och behandlingar och var mer kritisk mot antika auktoriteter som Galenos än många samtida. Han beskrev tidigt skabbkvalstret som orsak till skabb, gav en klinisk beskrivning av perikardit (inflammation i hjärtsäcken) och beskrev hur man ger näring till patienter som inte kan svälja, via ett silverrör eller lavemang.

    Det som gör honom särskild i medicinens historia är att han, enligt sina egna texter, prövade kirurgiska ingrepp på djur innan han utförde dem på människor. Han beskriver till exempel att han provade trakeotomi – att öppna luftstrupen – på en get. Idén att testa en metod i en djurmodell innan den används kliniskt är i dag standard i läkemedels- och kirurgisk forskning, och Ibn Zuhr är ett av de tidigaste dokumenterade exemplen. Han verkade samtidigt som [Hildegard av Bingen](#hildegard-av-bingen-physica-1150) i Tyskland, men med helt annan teoretisk utbildning.

hildegard-av-bingen-physica-1150:
  period: 1140
  label: "Hildegard av Bingen: Physica ~1150"
  title: "Hildegards Physica"
  wiki:
    - "en:Physica (Hildegard)"
    - "sv:Hildegard av Bingen"
  text: |
    **Physica** är ett naturkunskapsverk skrivet omkring 1150–1158 av den tyska abbedissan [Hildegard av Bingen](#hildegard-av-bingen-fods-1098-lakevaxter). Det är uppdelat i nio böcker: växter (ca 230 kapitel), grundämnen, träd, stenar, fiskar, fåglar, djur, reptiler och metaller. För varje sak beskriver hon dess natur – varm eller kall, torr eller fuktig, enligt läran om kroppsvätskor och elementen – och hur den kan användas som läkemedel eller föda.

    Verket skiljer sig från de antika och arabiska texter som samtidigt översattes i Salerno och Toledo, genom att det i hög grad bygger på lokal kunskap från Rhenlandet. Hon använde tyska folkliga namn på växterna, inte bara latinska, vilket gör boken till en viktig källa för historisk botanik och tysk ordhistoria. Hon beskriver bland annat humle i öl, som man senare förstått har konserverande effekt.

    Det mesta i Physica är förvetenskapligt: många råd vilar på symboliska samband eller på läran om vätskor och är verkningslösa. Men den visar hur kloster samlade och förmedlade praktisk erfarenhet. Det mer systematiska studiet av växter och djur som naturföremål återkom på 1200-talet med [Albertus Magnus](#albertus-magnus-botanik-och-zoologi) och [Fredrik II:s fågelbok](#fredrik-ii-studier-av-faglar), och på 1400-talet kom [tryckta örtaböcker](#tryckta-ortabocker).

averroes-medicinsk-encyklopedi:
  period: 1160
  label: "Averroës: medicinsk encyklopedi"
  title: "Averroës och medicinens allmänna principer"
  wiki:
    - "en:Averroes"
    - "en:Medicine in the medieval Islamic world"
  text: |
    **Averroës** (Ibn Rushd, 1126–1198) var domare, läkare och filosof i Córdoba i al-Andalus, det muslimskt styrda Spanien. I Europa blev han mest känd för sina [kommentarer till Aristoteles](#averroes-kommenterar-aristoteles), men han skrev också en medicinsk lärobok, *Kulliyat fi al-tibb* (”Allmänna principer i medicinen”), på latin kallad *Colliget*.

    Boken i sju delar går igenom anatomi, hälsa, sjukdomar, symtom, läkemedel, förebyggande levnadsregler och behandling. Den bygger på Galenos – den grekisk-romerske läkaren från 100-talet vars lära dominerade medicinen i över tusen år – men Averroës försökte förankra medicinen i Aristoteles naturfilosofi och ifrågasatte Galenos där resonemangen inte höll. Han beskrev till exempel näthinnan, snarare än linsen, som ögats känsliga del, även om det inte blev allmänt accepterat förrän långt senare.

    Averroës skrev uttryckligen bara de allmänna principerna; hans vän [Ibn Zuhr](#ibn-zuhr-kirurgi-pa-djur-forst) skrev en kompletterande bok om konkreta sjukdomar och behandlingar. *Colliget* översattes till latin på 1200-talet och användes vid europeiska universitet, men nådde aldrig samma ställning som [Ibn Sinas Kanon](#ibn-sina-medicinens-kanon-1025), som var standardlärobok i Europa in på 1600-talet.

maimonides-lakare-hos-saladin:
  period: 1180
  label: "Maimonides, läkare hos Saladin"
  title: "Maimonides – filosof och hovläkare"
  wiki:
    - "en:Maimonides"
    - "en:Saladin"
  text: |
    **Maimonides** (Moses ben Maimon, 1138–1204) föddes i Córdoba i det muslimska Spanien och blev den mest inflytelserika judiske tänkaren under medeltiden. Han skrev en systematisk sammanställning av judisk lag och filosofiverket *Vägledning för villrådiga*, som försöker förena tro med Aristoteles filosofi. Familjen flydde när den nya almohadregimen förföljde judar och kristna, och slog sig till slut ner i Fustat, den gamla delen av Kairo.

    Där blev han läkare vid hovet. **Saladin** (1137–1193) var den kurdiske sultan som enade Egypten och Syrien och [tog Jerusalem från korsfararna 1187](#saladin-vinner-vid-hattin-1187-tar). Maimonides tjänade främst Saladins vesir al-Qadi al-Fadil och sedan sultanens son al-Afdal; uttrycket ”Saladins läkare” är alltså en förenkling.

    Han skrev ett tiotal medicinska verk på arabiska, bland annat om astma, om förgiftningar och om hälsosamma levnadsregler. Han betonade förebyggande vård – kost, sömn, motion och sinnesstämning – och byggde på Galenos, den grekisk-romerske läkare vars lära dominerade medicinen, men pekade också ut motsägelser hos honom. Han verkade i samma kunskapstradition som [Ibn Sina](#ibn-sina-medicinens-kanon-1025) och sin samtida landsman [Averroës](#averroes-medicinsk-encyklopedi), och exemplet visar hur judiska, muslimska och grekiska idéer flöt samman i den arabiskspråkiga världen.

ibn-al-baitar-1-400-lakemedel:
  period: 1200
  label: "Ibn al-Baitar: 1 400 läkemedel"
  title: "Ibn al-Baitars läkemedelsuppslagsverk"
  wiki:
    - "en:Ibn al-Baitar"
    - "en:De materia medica"
  text: |
    **Ibn al-Baitar** (ca 1197–1248) var botaniker och farmakolog från Málaga i al-Andalus, det muslimska Spanien. Han reste genom Nordafrika, Mindre Asien och Syrien för att samla och studera växter, och blev överste botaniker hos [ayyubidsultanen](#ayyubider) al-Kamil i Kairo.

    Hans huvudverk är en alfabetiskt ordnad sammanställning av ”enkla” läkemedel och födoämnen – enkla betyder här enskilda substanser, inte blandningar. Den beskriver omkring 1 400 växter, djurprodukter och mineraler: utseende, var de växer, hur de bereds och vad de används mot. Han citerade ett stort antal tidigare författare men angav också när han själv kontrollerat uppgifterna, och lade till flera hundra substanser som saknades hos föregångarna.

    Den viktigaste föregångaren var **Dioskurides**, en grekisk läkare på 100-talet e.Kr. vars *De materia medica* beskrev omkring 600 växter och var standardverket i över 1 500 år. Ibn al-Baitar fördubblade i praktiken det kända förrådet. Hans verk användes länge i den arabiska världen och översattes till franska på 1800-talet. Traditionen ledde i Europa till [tryckta örtaböcker](#tryckta-ortabocker) på 1400-talet och vidare till [Linnés systematiska namngivning](#linne-binomiala-namn-1753) av växter och djur.

fredrik-ii-studier-av-faglar:
  period: 1220
  label: "Fredrik II: studier av fåglar"
  title: "Fredrik II och falkboken"
  wiki:
    - "sv:Fredrik II (tysk-romersk kejsare)"
    - "en:De arte venandi cum avibus"
  text: |
    **Fredrik II** (1194–1250) var tysk-romersk kejsare och kung av Sicilien, uppvuxen i Palermo där grekisk, arabisk och latinsk kultur möttes. Samtiden kallade honom *stupor mundi*, ”världens förundran”. Han talade flera språk, korresponderade med muslimska lärda, grundade universitetet i Neapel 1224 och [fick Jerusalem genom förhandlingar](#fredrik-ii-far-jerusalem-genom-avtal) i stället för krig.

    Hans vetenskapliga huvudverk är *De arte venandi cum avibus* (”Om konsten att jaga med fåglar”), skrivet omkring 1240-talet. Det är en handbok i falkjakt men också ett av de första verkligt zoologiska verken i Europa. Det beskriver fåglars anatomi, fjäderdräkt, flykt, flyttning och beteende, och bygger i stor utsträckning på egna observationer. Fredrik skrev att han ville beskriva ”det som är, som det är” och rättade Aristoteles där denne enligt hans erfarenhet hade fel. Han testade till exempel om gamar hittar föda med lukt eller syn genom att täcka över deras ögon.

    Detta var ovanligt: den vanliga naturlitteraturen, bestiarierna, blandade djur med moraliska sinnebilder och fabler. Fredriks empiriska hållning hör ihop med [Grosseteste](#grosseteste-optik-och-experimentell) och [Albertus Magnus](#albertus-magnus-botanik-och-zoologi) i samma århundrade, även om den stora vändningen mot systematisk observation kom först under 1500-talet.

ibn-al-nafis-lungkretsloppet-1242:
  period: 1240
  label: "Ibn al-Nafis: lungkretsloppet ~1242"
  title: "Ibn al-Nafis och lungkretsloppet"
  wiki:
    - "en:Ibn al-Nafis"
    - "en:Pulmonary circulation"
  text: |
    **Ibn al-Nafis** (1213–1288) var en arabisk läkare från Damaskus som blev överläkare vid sjukhus i Kairo. Omkring 1242 skrev han en kommentar till anatomidelen av [Ibn Sinas Kanon](#ibn-sina-medicinens-kanon-1025), och i den beskrev han **lungkretsloppet** korrekt för första gången.

    Den rådande läran kom från Galenos, den grekisk-romerske läkaren på 100-talet. Enligt den gick blod från hjärtats högra halva till den vänstra genom osynliga porer i skiljeväggen. Ibn al-Nafis konstaterade att skiljeväggen är tät och saknar porer. Blodet måste därför gå från höger kammare genom lungartären till lungorna, blandas med luft där, och sedan återvända genom lungvenen till vänster förmak. Han förutsade också att det måste finnas förbindelser mellan lungartärens och lungvenens förgreningar – de kapillärer som Marcello Malpighi såg i mikroskop först 1661.

    Han beskrev alltså det ”lilla” kretsloppet genom lungorna, inte hela blodomloppet. Upptäckten fick ingen spridning i Europa; den gjordes om av Michael Servetus 1553 och Realdo Colombo 1559, och om de kände till Ibn al-Nafis är omstritt. Hans text återupptäcktes först 1924. Det stora kretsloppet genom kroppen visades av [Harvey 1628](#harvey-blodomloppet-1628).

albertus-magnus-botanik-och-zoologi:
  period: 1260
  label: "Albertus Magnus: botanik och zoologi"
  title: "Albertus Magnus – medeltidens naturforskare"
  wiki:
    - "sv:Albertus Magnus"
    - "en:Albertus Magnus"
  text: |
    **Albertus Magnus** (ca 1200–1280) var en tysk dominikanermunk, teolog och biskop, lärare i Paris och Köln och lärare till filosofen Thomas av Aquino. Han var en av medeltidens mest produktiva författare och fick redan under sin livstid tillnamnet ”den store”.

    Han ville göra hela Aristoteles naturfilosofi tillgänglig för latinska läsare och skrev omfattande kommentarer till den grekiske filosofens verk, men gick ofta längre än förlagan. I *De vegetabilibus* (om växter) beskriver han växters byggnad och skiljer mellan olika typer av blad och blommor, och han lade märke till att ljus och värme påverkar tillväxt. I *De animalibus* (om djur) lade han till ett stort antal djur som Aristoteles inte känt, särskilt från Nordeuropa, och avfärdade fabler han inte kunnat bekräfta – till exempel att pelikanen föder sina ungar med eget blod. Han skrev att i naturvetenskapen är det erfarenheten som är säker.

    Han studerade också mineraler och kemi och har tillskrivits isoleringen av grundämnet arsenik, men det är osäkert. Tillsammans med [Fredrik II:s fågelstudier](#fredrik-ii-studier-av-faglar) visar hans verk att observation av naturen blev en legitim lärd verksamhet under 1200-talet. Den systematiska klassificeringen av växter och djur kom först med [Linné](#linne-binomiala-namn-1753) 500 år senare.

mansurisjukhuset-i-kairo-1284:
  period: 1280
  label: "Mansurisjukhuset i Kairo 1284"
  title: "Mansurisjukhuset i Kairo"
  wiki:
    - "en:Bimaristan"
    - "en:Complex of Qalawun"
  text: |
    År 1284 lät mamluksultanen Qalawun bygga ett stort sjukhus i Kairo, al-Bimaristan al-Mansuri. **Mamlukerna** var en härskarklass av tidigare slavsoldater, främst av turkiskt och kaukasiskt ursprung, som tog makten i Egypten 1250 och 1260 [stoppade mongolerna](#ain-jalut-1260-mamluker-stoppar). Ordet *bimaristan* är persiskt och betyder ungefär ”de sjukas hus”.

    Sjukhuset ingick i ett komplex med moské, skola och sultanens gravmonument och finansierades genom en **waqf**, en religiös stiftelse vars hyresintäkter från butiker och mark bekostade driften för all framtid. Det ska ha haft plats för omkring 8 000 patienter, även om den siffran är osäker. Det hade separata avdelningar för män och kvinnor och för feber, ögonsjukdomar, kirurgi, magsjukdomar och psykisk sjukdom, ett apotek, en föreläsningssal för undervisning av läkare och personal för både läkarvård och omvårdnad. Vården var gratis för alla, oavsett religion eller kön, och patienter fick pengar när de skrevs ut så att de inte behövde arbeta direkt.

    Sjukhuset byggde på en lång tradition av bimaristaner i Bagdad, Damaskus och Kairo sedan 800-talet. [Ibn al-Nafis](#ibn-al-nafis-lungkretsloppet-1242) arbetade i Kairo vid den här tiden. Det var i drift i flera hundra år. Europas sjukhus var ännu mest religiösa härbärgen för fattiga och sjuka; stora, kommunalt organiserade [stadssjukhus](#stadssjukhus-ospedale-degli-innocenti) växte fram i Italien under 1400-talet.

mondino-offentlig-dissektion-1315:
  period: 1300
  label: "Mondino: offentlig dissektion 1315"
  title: "Mondino och den första offentliga dissektionen"
  wiki:
    - "en:Mondino de Luzzi"
    - "en:History of anatomy"
  text: |
    **Mondino de Luzzi** (ca 1270–1326) var professor i medicin vid [universitetet i Bologna](#universitetet-i-bologna-1088). I januari 1315 dissekerade han offentligt kroppen av en avrättad kvinna inför studenter – den första kända offentliga dissektionen av en människa i Europa sedan antiken. Under antiken hade dissektion av människor gjorts i Alexandria på 200-talet f.Kr., men sedan nästan bara av djur; Galenos, vars lära dominerade medicinen, byggde mycket av sin anatomi på apor och grisar.

    År 1316 skrev Mondino *Anathomia*, en kort handbok som går igenom kroppen i den ordning den dissekerades: först buken (som ruttnade snabbast), sedan bröstkorgen, huvudet och till sist lemmarna. Den blev standardlärobok i Europa i omkring 250 år och trycktes i dussintals upplagor.

    Mondino rättade dock sällan Galenos; han beskrev ofta det texten sa snarare än det han såg. Upplägget blev senare ritualiserat: professorn läste högt ur en text från en upphöjd stol medan en kirurg skar och en assistent pekade. Studenterna lärde sig alltså bekräfta auktoriteten snarare än att granska. Det bröts först när [Vesalius 1543](#vesalius-de-humani-corporis-fabrica-1543) själv dissekerade och visade att Galenos hade fel på över 200 punkter. Mondino står ändå för att dissektion åter blev en del av läkarutbildningen.

spetalska-minskar-i-europa:
  period: 1320
  label: "Spetälska minskar i Europa"
  title: "Spetälskans tillbakagång"
  wiki:
    - "sv:Lepra"
    - "en:History of leprosy"
  text: |
    **Spetälska** (lepra) är en kronisk infektion orsakad av bakterien *Mycobacterium leprae*, en släkting till tuberkulosbakterien. Den angriper nerver och hud, ger känselbortfall och leder till sår, skador och deformationer. Den smittar ganska svårt, via droppar under lång närkontakt, och har lång inkubationstid – ofta flera år.

    Under högmedeltiden var sjukdomen vanlig i Europa, och tusentals **leprosorier** (spetälskehospital) byggdes utanför städerna – i England omkring 300, i Frankrike flera tusen. De sjuka avskildes ofta från samhället med en ritual nästan som en begravning och fick bära särskilda kläder och en skallra eller klapper som varnade andra. Sjukdomen sågs både som straff för synd och som ett tecken på Guds utkorelse.

    Från omkring 1300 började sjukdomen minska kraftigt, och vid 1500-talet var den sällsynt i det mesta av Europa utom i Norden. Orsaken är omdiskuterad. Isoleringen kan ha bidragit, men andra förklaringar väger tyngre: att tuberkulos spred sig och gav en korsimmunitet, förbättrad levnadsstandard, och att [digerdöden](#digerdoden-1-3-av-europa-dor) dödade många svaga och sjuka. Genetiska studier visar att bakterien knappt förändrats sedan medeltiden, så det var människorna och miljön som ändrades. Norrmannen Gerhard Armauer Hansen identifierade bakterien 1873, en av de första sjukdomsalstrare som knöts till en specifik sjukdom. Sedan 1980-talet botas lepra med antibiotika.

pestlakare-och-pestforordningar:
  period: 1340
  label: "Pestläkare och pestförordningar"
  title: "Städernas första svar på digerdöden"
  wiki:
    - "sv:Digerdöden"
    - "en:Plague doctor"
  text: |
    [Digerdöden](#digerdoden-1-3-av-europa-dor) 1347–51 var en pandemi av pest, en sjukdom orsakad av bakterien *Yersinia pestis* som sprids med loppor från råttor och, i lungform, direkt mellan människor. Ungefär en tredjedel av Europas befolkning dog. Ingen visste då vad som orsakade den: den rådande teorin var att sjukdom kom från *miasma*, förorenad och illaluktande luft, eller från en ogynnsam planetkonstellation.

    Ändå svarade städerna praktiskt. Italienska städer anställde särskilda pestläkare, betalda av staden för att behandla alla, även fattiga – en tidig form av offentlig sjukvård. Pistoia utfärdade redan 1348 pestförordningar: förbud mot att föra in kläder från smittade orter, regler för begravningar och för slakt och avfall. Venedig och Florens tillsatte tillfälliga hälsokommissioner. Den kända bilden av pestläkaren med fågelnäbbsmask är för övrigt från 1600-talet, inte 1300-talet.

    Förordningarna byggde på en felaktig teori men fungerade delvis ändå, eftersom att begränsa kontakter och varutransporter även bromsar loppor och smittbärare. De blev grunden för [karantänen](#karantan-i-ragusa-1377) och för permanenta hälsomyndigheter ([pestförordningar i italienska städer](#pestforordningar-i-italienska-stader)). Själva bakterien identifierades först 1894 av Alexandre Yersin.

karantan-i-ragusa-1377:
  period: 1360
  label: "Karantän i Ragusa 1377"
  title: "Ragusa 1377: världens första karantän"
  wiki:
    - "sv:Karantän"
    - "en:Quarantine"
  text: |
    Ragusa, dagens Dubrovnik i Kroatien, var en självstyrande handelsstad vid Adriatiska havet med livlig sjöfart. Den 27 juli 1377 beslutade stadens stora råd att alla som kom från pestsmittade områden måste vistas 30 dagar isolerade på en ö eller i en grannort utanför staden innan de fick komma in. Detta räknas som den första kända lagstadgade karantänen.

    Idén var att vänta ut en eventuell sjukdom: insjuknade personen under isoleringstiden stannade smittan utanför. Ingen visste att pest orsakas av en bakterie, men man hade sett att sjukdomen följde med människor och varor. Venedig och andra städer förlängde senare tiden till 40 dagar – på italienska *quaranta giorni*, därav ordet karantän. Talet 40 hade troligen religiös bakgrund (Jesu 40 dagar i öknen) snarare än medicinsk. Venedig byggde 1423 ett permanent pestsjukhus, ett lasarett, på en ö i lagunen.

    Karantänen växte ur de tidiga [pestförordningarna](#pestlakare-och-pestforordningar) och blev standardvapnet mot epidemier i 500 år, ända tills man förstod smittämnena ([Pasteur](#pasteur-mikrober-och-pastorisering)). Principen används fortfarande, som under covid-19-pandemin 2020.

gui-de-chauliac-kirurgi:
  period: 1360
  label: "Gui de Chauliac: kirurgi"
  title: "Gui de Chauliac: medeltidens kirurgiska lärobok"
  wiki:
    - "sv:Guy de Chauliac"
    - "en:Guy de Chauliac"
  text: |
    Gui de Chauliac (ca 1300–1368) var en fransk läkare och kirurg, utbildad i Montpellier och Bologna, och livläkare hos påvarna i Avignon. Under [digerdöden](#digerdoden-1-3-av-europa-dor) 1348 stannade han kvar i staden, insjuknade själv och överlevde. Han beskrev att pesten kom i två former: en med feber och blodiga upphostningar som dödade på några dagar (i dag kallad lungpest), och en med svullna lymfkörtlar, bölder (böldpest).

    Hans huvudverk *Chirurgia magna* (1363) samlade allt man då visste om kirurgi: sårbehandling, frakturer, bråck, starroperation och användning av sömnsvampar indränkta i opium och andra växtdroger som bedövning. Det byggde mycket på arabiska författare som [al-Zahrawi](#al-zahrawi-kirurgiska-instrument-1000) och Ibn Sina, och på den grekiske läkaren Galenos.

    På den tiden sågs kirurgi som ett hantverk, lägre än den bokliga läkekonsten. Gui argumenterade för att en kirurg måste kunna anatomi, och boken förblev en standardlärobok i Europa i ett par hundra år, översatt till många språk. Hans syn att sår skulle läka med var ledde dock delvis fel; först [Ambroise Paré](#pare-sarvard-utan-kokande-olja) på 1500-talet förnyade sårvården.

pestforordningar-i-italienska-stader:
  period: 1380
  label: "Pestförordningar i italienska städer"
  title: "Från nödåtgärd till permanent hälsomyndighet"
  wiki:
    - "en:Lazaretto"
    - "en:Second plague pandemic"
  text: |
    Efter [digerdöden](#digerdoden-1-3-av-europa-dor) kom pesten tillbaka med några års mellanrum. De norditalienska stadsstaterna – Venedig, Milano, Florens – var Europas rikaste och mest byråkratiska samhällen, och de byggde gradvis upp ett system för att möta den.

    Under 1400-talet blev tillfälliga pestkommissioner permanenta hälsomyndigheter; Venedig inrättade 1486 ett ständigt hälsoråd. Verktygen var: **hälsopass** (intyg att en resande eller ett skepp kom från smittfri ort), [karantän](#karantan-i-ragusa-1377), **lasarett** – isoleringssjukhus utanför staden, det första i Venedig 1423 – samt dödsregister där man noterade dödsorsak. Ett nätverk av informanter rapporterade om utbrott i andra städer så att handel kunde stoppas i tid.

    Detta var det första systematiska försöket i Europa att använda statistik och statlig makt för folkhälsan, århundraden innan man förstod smittan. Ordningen kopierades i resten av Europa. En liknande metod – att leta mönster i var de döda bodde – gav senare genombrottet när [John Snow 1854](#snow-kolera-och-vattenpumpen-1854) spårade kolera till en vattenpump i London.

stadssjukhus-ospedale-degli-innocenti:
  period: 1400
  label: "Stadssjukhus: Ospedale degli Innocenti"
  title: "Ospedale degli Innocenti: barnhem och ny arkitektur"
  wiki:
    - "en:Ospedale degli Innocenti"
  text: |
    Ospedale degli Innocenti ("de oskyldigas sjukhus") i Florens var ett hem för övergivna barn. Det beställdes 1419 av sidenhandlarnas gille, ett av stadens mäktiga yrkesförbund, och öppnade 1445. Ordet *ospedale* betydde vid denna tid en välgörenhetsinrättning för behövande i allmänhet, inte bara sjukvård.

    Behovet var stort: fattiga familjer, ogifta mödrar och tjänstekvinnor kunde inte försörja alla barn, och spädbarn övergavs. Vid ingången fanns ett ställe där man anonymt kunde lämna ett barn (senare en vridbar lucka, *ruota*). Barnen fick vård av ammor, utbildning och yrkesträning. Dödligheten var trots det mycket hög enligt dagens mått.

    Byggnaden ritades av Filippo Brunelleschi, samme man som byggde [domens kupol](#brunelleschis-kupol-i-florens-142036), och räknas som en av de första byggnaderna i renässansstil: en lång loggia (öppen pelargång) med rundbågar i enkla, matematiska proportioner, inspirerade av antiken. Stadssjukhus och välgörenhetsinrättningar finansierade av gillen och rika familjer som [Medici](#medici-i-florens) var typiska för de italienska städerna; i den islamiska världen fanns stora sjukhus redan tidigare, som [Mansurisjukhuset i Kairo](#mansurisjukhuset-i-kairo-1284).

pestens-aterkomster-var-10-e-ar:
  period: 1420
  label: "Pestens återkomster var 10:e år"
  title: "Pesten kommer tillbaka – i 350 år"
  wiki:
    - "en:Second plague pandemic"
    - "sv:Pest"
  text: |
    Pesten försvann inte efter [digerdöden](#digerdoden-1-3-av-europa-dor) 1347–51. Bakterien *Yersinia pestis* levde kvar i gnagarpopulationer och blossade upp igen med ungefär 10–15 års mellanrum ([pesten återkommer](#pesten-aterkommer-var-10-e15-e-ar)). Utbrottet 1361 kallades "barnpesten" eftersom det drabbade barn födda efter 1350, som saknade immunitet, särskilt hårt.

    Varje utbrott dödade kanske 10–20 % av en stads invånare, ibland mer. Följden blev att Europas befolkning, som kan ha fallit med en tredjedel, inte nådde tillbaka till nivån före 1347 förrän omkring 1500. Arbetskraft blev knapp, vilket höjde lönerna och försvagade livegenskapen i Västeuropa. Pestens ständiga hot låg också bakom de växande hälsomyndigheterna ([pestförordningar i italienska städer](#pestforordningar-i-italienska-stader)).

    Denna "andra pestpandemi" pågick i flera hundra år. Bland de sista stora utbrotten i Europa var [London 1665](#pesten-i-london-1665-branden-1666), [Stockholm och Norden 1710](#pest-1710) och Marseille 1720. Varför pesten sedan drog sig tillbaka från Europa är inte helt klarlagt; bättre karantän, ändrad råttpopulation och bättre bostäder har föreslagits.

tryckta-ortabocker:
  period: 1440
  label: "Tryckta örtaböcker"
  title: "Tryckta örtaböcker"
  wiki:
    - "en:Herbal"
    - "en:Gart der Gesundheit"
  text: |
    En örtabok (herbarium) beskrev växter och deras medicinska användning. Under medeltiden var nästan alla läkemedel växtbaserade, och örtaböckerna var läkarnas och apotekarnas uppslagsverk. Grunden var den grekiske läkaren Dioskurides verk från 100-talet e.Kr., kompletterat av arabiska författare som [Ibn al-Baitar](#ibn-al-baitar-1-400-lakemedel) och av europeiska klosterskrifter.

    Med [boktrycket](#gutenbergs-tryckpress-1450) blev örtaböckerna bland de tidigaste tryckta facklitteraturverken, med träsnitt som illustrationer. Ett känt exempel är *Gart der Gesundheit* ("Hälsans trädgård", Mainz 1485) på tyska. Fördelen var att alla exemplar hade samma bild – en handkopierad bild förvanskades för varje avskrift. Nackdelen var att de tidiga träsnitten ofta kopierades från varandra och var schematiska; en växt var svår att känna igen.

    På 1530–40-talen kom böcker av Otto Brunfels och Leonhart Fuchs, där växterna ritades av efter levande exemplar. Det var ett steg mot vetenskaplig botanik baserad på egen observation, som ledde vidare till systematisk beskrivning av arter ([Gesner](#gesner-djurens-historia) för djuren) och till sist [Linnés namnsystem](#linne-binomiala-namn-1753).

forsta-tryckta-medicinska-bockerna:
  period: 1460
  label: "Första tryckta medicinska böckerna"
  title: "Medicinen går i tryck"
  wiki:
    - "en:Incunable"
    - "en:Fasciculus medicinae"
  text: |
    Bland de första böcker som trycktes efter [Gutenbergs](#gutenbergs-tryckpress-1450) uppfinning fanns medicinska texter: kalendrar som angav lämpliga dagar för åderlåtning (att tappa blod, en vanlig behandling), pestskrifter och framför allt de klassiska läroböckerna. [Ibn Sinas Medicinens kanon](#ibn-sina-medicinens-kanon-1025), i latinsk översättning, trycktes första gången 1473 och kom ut i dussintals upplagor, liksom texter av de grekiska läkarna Hippokrates och Galenos.

    Trycket gjorde också nya typer av böcker möjliga. *Fasciculus medicinae* (Venedig 1491) var en av de första med anatomiska bilder, och Hieronymus Brunschwigs kirurgibok (Strassburg 1497) beskrev hur man behandlar skottskador från de nya [krutvapnen](#hakebossor).

    Till en början förstärkte trycket den gamla auktoriteten: Galenos och Ibn Sina blev ännu mer spridda. Men när många läsare hade exakt samma text och samma bild framför sig blev det också lättare att upptäcka var texten stred mot vad man själv såg. Det banade väg för [Vesalius](#vesalius-de-humani-corporis-fabrica-1543) anatomi 1543, som byggde på egna dissektioner och detaljerade tryckta illustrationer.

syfilis-i-europa-1494:
  period: 1480
  label: "Syfilis i Europa 1494"
  title: "Syfilis slår till i Europa"
  wiki:
    - "sv:Syfilis"
    - "en:History of syphilis"
  text: |
    År 1494–95 belägrade den franske kungen Karl VIII Neapel med en armé av legosoldater från hela Europa. Där bröt en ny, våldsam sjukdom ut, med varbölder, smärtor och ofta död inom några månader. När armén upplöstes spreds den över Europa inom några år. Italienarna kallade den "den franska sjukdomen", fransmännen "den neapolitanska".

    Syfilis orsakas av bakterien *Treponema pallidum* och smittar främst sexuellt. I dag förlöper den långsamt, i stadier under många år, men på 1490-talet var den betydligt akutare – troligen för att befolkningen saknade tidigare exponering. Namnet kommer från en dikt av läkaren Girolamo Fracastoro 1530. Behandlingen blev kvicksilver, som var giftigt, och senare bark från guajakträdet från Amerika; ett verkligt botemedel kom först med [penicillinet](#penicillin-1928) på 1940-talet.

    Varifrån sjukdomen kom är omstritt. Den så kallade Columbushypotesen säger att [Columbus](#columbus-1492) sjömän förde den från Amerika 1493, som en del av [det columbianska utbytet](#columbianska-utbytet-majs-potatis). Fynd av skelett från Amerika med tecken på besläktade sjukdomar stöder det, men vissa europeiska skelettfynd från före 1492 och DNA-studier har tolkats som att besläktade treponema-sjukdomar fanns i Europa tidigare.

leonardos-anatomiska-teckningar:
  period: 1500
  label: "Leonardos anatomiska teckningar"
  title: "Leonardos anatomiska teckningar"
  wiki:
    - "en:Leonardo da Vinci's anatomical studies"
    - "sv:Leonardo da Vinci"
  text: |
    Leonardo da Vinci (1452–1519), konstnär och ingenjör i Florens och Milano (se [Leonardo: flygmaskiner](#leonardo-flygmaskiner-mekanik)), studerade människokroppen för att kunna måla den. Särskilt 1507–1513 dissekerade han lik på sjukhus i Florens och Milano – enligt egen uppgift ett trettiotal – och gjorde hundratals detaljerade teckningar.

    Teckningarna var långt före sin tid: skelettet sett från flera vinklar, musklernas lager, kraniets hålor, ett foster i livmodern och hjärtat. Han hällde vax i en oxhjärnas hålrum för att få en avgjutning av hjärnans ventriklar. Han studerade hjärtklaffarna och beskrev hur blodet virvlar i stora kroppspulsådern så att klaffarna stängs – en iakttagelse som bekräftades med moderna metoder först på 1900-talet. Han såg också åderförkalkning hos en gammal man.

    Leonardo publicerade aldrig teckningarna. De hamnade så småningom i den brittiska kungliga samlingen och blev kända först på 1700–1800-talen. Därför fick de inget inflytande; det var [Vesalius](#vesalius-de-humani-corporis-fabrica-1543) tryckta anatomi 1543 som förändrade medicinen. Den offentliga dissektionen som undervisningsmetod hade införts av [Mondino](#mondino-offentlig-dissektion-1315) 200 år tidigare.

paracelsus-kemi-i-medicinen:
  period: 1520
  label: "Paracelsus: kemi i medicinen"
  title: "Paracelsus: läkemedel från kemin"
  wiki:
    - "sv:Paracelsus"
    - "en:Paracelsus"
  text: |
    Paracelsus (Theophrastus von Hohenheim, 1493–1541) var en schweizisk-tysk läkare och alkemist som vandrade runt i Europa, bland annat som fältläkare och kort som stadsläkare i Basel. Han var stridslysten: 1527 brände han offentligt ett exemplar av [Ibn Sinas Kanon](#ibn-sina-medicinens-kanon-1025), symbolen för den gamla läkekonsten, och föreläste på tyska i stället för latin.

    Den rådande teorin, från Galenos på 100-talet, var att sjukdom berodde på obalans mellan fyra kroppsvätskor (blod, slem, gul och svart galla), som behandlades med åderlåtning, kost och örter. Paracelsus menade i stället att sjukdomar har specifika yttre orsaker och angriper specifika organ, och att de ska behandlas med specifika ämnen, ofta mineraler och kemiska preparat som kvicksilver, antimon och järnsalter. Han beskrev gruvarbetares lungsjukdomar som arbetsrelaterade. Han är också känd för principen att "dosen gör giftet" – allt är giftigt, det är mängden som avgör.

    Mycket av hans tänkande var mystiskt och astrologiskt, och kvicksilverbehandlingen mot [syfilis](#syfilis-i-europa-1494) var farlig. Men idén att framställa läkemedel kemiskt och dosera dem noggrant blev en grund för farmakologin och toxikologin. Hans efterföljare, iatrokemisterna, stred med galenikerna i över hundra år, tills [organisk kemi](#wohler-urea-1828-organisk-kemi) på 1800-talet gav läkemedelstillverkningen en verklig grund.

vesalius-de-humani-corporis-fabrica-1543:
  period: 1540
  label: "Vesalius: De humani corporis fabrica 1543"
  title: "Vesalius: den moderna anatomin"
  wiki:
    - "en:De humani corporis fabrica"
    - "sv:Andreas Vesalius"
  text: |
    **Andreas Vesalius** (1514–1564) var en flamländsk läkare och professor i anatomi i Padua i Italien. År 1543, samma år som [Kopernikus bok om solsystemet](#kopernikus-de-revolutionibus-1543), gav han ut *De humani corporis fabrica* ("Om människokroppens byggnad"), sju böcker med drygt 600 sidor och mycket detaljerade träsnitt av skelett, muskler och organ.

    Fram till dess byggde läkarutbildningen på **Galenos**, en grekisk läkare i Romarriket på 100-talet, vars texter lästes högt medan en assistent dissekerade. Galenos hade främst dissekerat djur som apor och grisar, och flera av hans beskrivningar stämde därför inte på människor. Vesalius dissekerade själv människokroppar och visade exempelvis att underkäken är ett enda ben, inte två, och att ett nätverk av blodkärl vid hjärnbasen som Galenos beskrev finns hos vissa djur men inte hos människan.

    Principen att lita på egen observation framför auktoriteter är kärnan i det som kallas [den vetenskapliga revolutionen](#vetenskapliga-revolutionen-borjar). Vesalius byggde vidare på en tradition där även [Leonardos anatomiska studier](#leonardos-anatomiska-teckningar) ingick, fast dessa aldrig publicerades. Hans efterföljare i Padua, bland andra [Fabricius](#fabricius-venklaffar-1603), ledde fram till Harveys upptäckt av blodomloppet.

gesner-djurens-historia:
  period: 1540
  label: "Gesner: djurens historia"
  title: "Gessner: djurens historia"
  wiki:
    - "en:Historiae animalium (Gessner)"
    - "en:Conrad Gessner"
  text: |
    **Conrad Gessner** (1516–1565) var läkare i Zürich och en av renässansens stora samlare av kunskap. Hans *Historiae animalium* ("Djurens historia", 1551–1558) är fem band på sammanlagt runt 4 500 sidor och räknas som början på modern zoologi. Han skrev också *Bibliotheca universalis* (1545), ett försök att förteckna alla böcker skrivna på latin, grekiska och hebreiska, vilket gjort honom känd som bibliografins fader.

    För varje djur samlade Gessner allt han kunde hitta: namn på olika språk, utseende, levnadssätt, användning som mat eller medicin, och vad antika författare och folktro sagt. Materialet blandar egna iakttagelser och brev från korrespondenter med fabler; enhörningar och sjöodjur finns med, ofta försedda med förbehåll. Många av de omkring tusen träsnitten, bland annat en kopia av Dürers berömda noshörning, blev standardbilder i över ett sekel.

    Boken är ett exempel på hur [boktrycket](#gutenbergs-tryckpress-1450) gjorde det möjligt att sprida stora illustrerade uppslagsverk, liksom de [tryckta örtaböckerna](#tryckta-ortabocker) för växter. Gessner ordnade djuren alfabetiskt inom grova grupper; en systematisk indelning efter släktskap kom först senare med [John Ray](#ray-begreppet-art-1686) och [Linné](#linne-binomiala-namn-1753).

pare-sarvard-utan-kokande-olja:
  period: 1560
  label: "Paré: sårvård utan kokande olja"
  title: "Paré: skonsammare sårvård"
  wiki:
    - "en:Ambroise Paré"
  text: |
    **Ambroise Paré** (ca 1510–1590) var en fransk fältskär, alltså en kirurg med hantverksutbildning som barberare snarare än universitetsutbildad läkare. Han tjänade i de franska arméerna och blev senare kirurg åt fyra franska kungar.

    När [handeldvapen](#hjullasgevar) spreds trodde man att skottsår förgiftades av krutet. Standardbehandlingen var att hälla kokande fläderolja i såret för att bränna bort giftet. Vid belägringen av Turin 1537 tog oljan slut, och Paré fick improvisera ett förband av äggula, rosenolja och terpentin. Han sov oroligt, men nästa morgon mådde de soldaterna bättre, med mindre smärta och svullnad, än de som fått oljan. Han slutade med oljan och skrev om det 1545, på franska så att andra fältskärer kunde läsa.

    Paré återinförde också att man vid amputation knöt av blodkärlen med tråd i stället för att bränna såret med glödgat järn, och han konstruerade proteser. Hans hållning, att pröva och jämföra i stället för att följa tradition, påminner om [Vesalius](#vesalius-de-humani-corporis-fabrica-1543) samtida arbete i anatomi. Att infektioner orsakas av mikroorganismer förstod man dock först tre sekler senare, vilket ledde till [Listers antiseptik](#lister-antiseptik-1867).

fabricius-venklaffar-1603:
  period: 1580
  label: "Fabricius: venklaffar 1603"
  title: "Fabricius: klaffarna i venerna"
  wiki:
    - "en:Hieronymus Fabricius"
  text: |
    **Hieronymus Fabricius** (1537–1619), kallad ab Aquapendente efter sin hemstad, var professor i anatomi i Padua, Europas ledande medicinska universitet. Han lät 1594 bygga en anatomisk teater, en brant amfiteater där studenter kunde se dissektioner på nära håll; den finns kvar än i dag.

    I *De venarum ostiolis* ("Om venernas små dörrar", 1603) beskrev han klaffarna i venerna: tunna hudveck på insidan av blodkärlen, särskilt i armar och ben. Andra hade sett dem förut, men Fabricius beskrev dem systematiskt. Han tolkade dem dock inom Galenos gamla modell, där blod ständigt bildas i levern och förbrukas ute i kroppen: klaffarna skulle bromsa blodet så att det inte samlades i fötterna.

    Hans student [William Harvey](#harvey-studerar-i-padua) såg något annat. Klaffarna släpper bara igenom blod i riktning mot hjärtat. Om man trycker på en ven på underarmen kan man se att blodet inte går att pressa åt andra hållet. Det var en av nycklarna till insikten att blodet cirkulerar i ett slutet system, som Harvey publicerade 1628, se [blodomloppet](#harvey-blodomloppet-1628). Fabricius står alltså i kedjan från [Vesalius](#vesalius-de-humani-corporis-fabrica-1543) till Harvey.

harvey-studerar-i-padua:
  period: 1600
  label: "Harvey studerar i Padua"
  title: "Harvey i Padua"
  wiki:
    - "sv:William Harvey"
    - "en:University of Padua"
  text: |
    **William Harvey** (1578–1657), engelsk läkare, studerade medicin i Padua i Italien 1599–1602, efter studier i Cambridge. Universitetet i Padua, som låg i republiken Venedig, var Europas mest ansedda medicinska lärosäte. Det var relativt öppet för protestantiska studenter från norra Europa eftersom Venedig höll inkvisitionen på avstånd.

    I Padua fanns en tradition av anatomi baserad på egna dissektioner, inledd av [Vesalius](#vesalius-de-humani-corporis-fabrica-1543) på 1530–40-talen. Harveys lärare var [Fabricius](#fabricius-venklaffar-1603), som just då studerade klaffarna i venerna, och samtidigt undervisade [Galilei](#galilei-pendel-och-fallrorelse) i matematik vid samma universitet. Om Harvey hörde Galilei är okänt, men miljön präglades av mätning och kontrollerade iakttagelser.

    Tillbaka i London blev Harvey läkare vid S:t Bartholomew's Hospital och senare livläkare åt kungen. Han dissekerade hjärtan hos många djurarter och kombinerade det med en enkel kalkyl: om hjärtat pumpar ut några tiotal gram blod per slag och slår tusentals gånger i timmen, blir mängden per timme många gånger kroppens vikt. Blodet kan alltså inte nybildas hela tiden utan måste gå runt. Det publicerade han 1628, se [blodomloppet](#harvey-blodomloppet-1628).

harvey-blodomloppet-1628-2:
  period: 1620
  label: "Harvey: blodomloppet 1628"
  same_as: harvey-blodomloppet-1628

kininbark-mot-malaria:
  period: 1640
  label: "Kininbark mot malaria"
  title: "Kinabark mot malaria"
  wiki:
    - "en:Cinchona"
    - "sv:Kinin"
  text: |
    **Malaria** är en sjukdom som orsakas av en encellig parasit (av släktet *Plasmodium*) och sprids av myggor. Den ger återkommande feberattacker och var på 1600-talet vanlig även i södra Europa, bland annat i träskmarkerna kring Rom, liksom i England och Sverige. Orsaken var okänd; namnet kommer av italienskans *mal'aria*, "dålig luft".

    Barken från kinaträdet (släktet *Cinchona*), som växer i Anderna i Peru, Bolivia och Ecuador, visade sig bota feberattackerna. Ursprungsbefolkningen kan ha känt till verkan; detaljerna är osäkra. Jesuitmissionärer i Lima förde barken till Europa på 1630–40-talen, och den kallades därför "jesuitpulver". Det gav motstånd i det protestantiska England. Legenden att den spanska vicekungens hustru, grevinnan av Chinchón, botades och gav trädet dess namn anses i dag vara en myt.

    Kinabarken var ett av de första läkemedlen som verkligen botade en specifik sjukdom, i stället för att följa den antika läran om kroppsvätskor. Den verksamma substansen, kinin, isolerades först 1820 av franska kemister. Kinin blev avgörande för europeisk kolonisation av tropiska Afrika och Asien under 1800-talet, och britternas gin och tonic började som ett sätt att få i sig kinin. Plantager i Java ersatte senare de vilda träden. Barken var en del av det större utbytet av växter och sjukdomar mellan världsdelarna, se [det columbianska utbytet](#columbianska-utbytet-majs-potatis).

hooke-celler-1665:
  period: 1660
  label: "Hooke: celler 1665"
  title: "Hooke ser celler i kork"
  wiki:
    - "sv:Cell"
    - "sv:Robert Hooke"
  text: |
    I [Micrographia](#hookes-micrographia-1665) (1665) beskrev **Robert Hooke**, engelsk naturforskare vid Royal Society, vad han såg när han skar en mycket tunn skiva kork med en vass pennkniv och tittade på den i mikroskop. Korken bestod av små tomma rum, ordnade som en bikaka. Han kallade dem *cells*, efter latinets *cella*, litet rum, som i munkarnas celler i ett kloster. Han uppskattade att en kubiktum kork innehöll över en miljard sådana.

    Det Hooke såg var egentligen bara de döda cellväggarna; korkcellerna är tomma eftersom korken är död vävnad från korkeken. Han såg liknande strukturer i andra växter och noterade att levande växters celler var fyllda med saft, men han förstod inte att cellen är livets grundenhet. För honom var "cellerna" en mekanisk struktur som förklarade varför kork är lätt och fjädrande.

    Ordet blev kvar. Under ett och ett halvt sekel efter Hooke såg man allt fler cellstrukturer med bättre [mikroskop](#mikroskop-1590), bland annat [Leeuwenhoeks](#leeuwenhoek-bakterier-1676) encelliga organismer. Först 1838–39 formulerade de tyska biologerna Schleiden och Schwann cellteorin: alla levande varelser består av celler, och cellen är den grundläggande enheten för liv. Hookes iakttagelse är därmed starten på en kedja som leder till dagens cell- och molekylärbiologi.

leeuwenhoek-bakterier-1676:
  period: 1660
  label: "Leeuwenhoek: bakterier 1676"
  title: "Leeuwenhoek ser bakterier"
  wiki:
    - "sv:Antonie van Leeuwenhoek"
    - "sv:Bakterier"
  text: |
    **Antonie van Leeuwenhoek** (1632–1723) var en tygköpman och stadstjänsteman i Delft i Nederländerna, utan universitetsutbildning och utan kunskaper i latin. Han slipade, eller enligt senare undersökningar delvis smälte, egna små glaslinser och byggde enkla mikroskop: en enda pärlstor lins i en mässingsplatta som man höll nära ögat. De bästa förstorade omkring 200–270 gånger, långt mer än dåtidens sammansatta mikroskop.

    År 1676 skrev han till [Royal Society](#royal-society) i London att han i regnvatten och pepparvatten sett myriader av små levande varelser, "animalcules" (smådjur), mycket mindre än något man tidigare sett. Han såg encelliga organismer och, särskilt i plack skrapat från tänderna 1683, det som i dag identifieras som bakterier. Han uppskattade antal och storlek genom jämförelser med sandkorn. Sällskapet var skeptiskt och lät [Hooke](#hooke-celler-1665) upprepa försöken, vilket bekräftade fynden 1677. Leeuwenhoek beskrev senare även [blodkroppar och spermier](#leeuwenhoek-blodkroppar-och-spermier).

    Han skrev runt 190 brev men avslöjade aldrig hur han gjorde linserna, och ingen kunde efterlikna dem på länge. Kopplingen mellan mikroorganismer och sjukdomar gjordes först omkring 200 år senare, med [bakterieteorin](#bakterieteorin) hos Pasteur och Koch. Han bidrog också till att motbevisa uralstring, föreställningen att liv uppstår spontant ur död materia.

redi-mot-uralstring:
  period: 1660
  label: "Redi mot uralstring"
  title: "Redi visar att maskar kommer från flugor (1668)"
  wiki:
    - "en:Francesco Redi"
    - "en:Spontaneous generation"
  text: |
    **Uralstring** (spontan generering) var den urgamla idén att liv kan uppstå direkt ur död materia: maskar ur ruttnande kött, möss ur smutsigt hö, grodor ur gyttja. Tanken fanns redan hos Aristoteles på 300-talet f.Kr. och var fortfarande allmänt accepterad på 1600-talet.

    **Francesco Redi** (1626–1697) var hovläkare hos storhertigen av Toscana i Florens och även poet. 1668 gjorde han ett enkelt men avgörande experiment: han lade kött i flera burkar. Några lämnades öppna, några förseglades och några täcktes med tunn gasväv som släppte in luft men inte flugor. Maskar (fluglarver) dök bara upp i de öppna burkarna; på gasväven lade flugorna ägg som inte nådde köttet. Slutsatsen: larverna kommer från flugornas ägg, inte från köttet.

    Experimentet är ett tidigt exempel på en kontrollgrupp – man ändrar en faktor i taget och jämför. Men frågan var inte avgjord. När [Leeuwenhoek några år senare såg mikroorganismer](#leeuwenhoek-bakterier-1676) i sina mikroskop flyttades debatten ner till den nivån: kanske uppstår inte stora djur ur intet, men väl de små? Den striden fortsatte med [Spallanzanis kokade buljonger](#spallanzani-mot-uralstring) på 1760-talet och avgjordes först av [Pasteur](#pasteur-mikrober-och-pastorisering) runt 1860.

ray-begreppet-art-1686:
  period: 1680
  label: "Ray: begreppet art 1686"
  title: "John Ray definierar arten (1686)"
  wiki:
    - "en:John Ray"
    - "en:Species"
  text: |
    **John Ray** (1627–1705) var en engelsk präst och naturforskare som gjorde det första stora försöket att sortera alla kända växter. I verket Historia Plantarum (1686–1704) beskrev han omkring 18 000 växter (ungefärlig siffra).

    Hans viktigaste bidrag var en tydlig definition av **art**. Tidigare grupperades växter mest efter utseende eller användning (medicinska, ätliga). Ray föreslog ett kriterium baserat på fortplantning: individer som ger upphov till likadana individer ur sina frön hör till samma art; former som aldrig uppstår ur varandras frön är skilda arter. Det är en föregångare till dagens biologiska artbegrepp, där en art är en grupp som kan föröka sig med varandra. Han delade också in blomväxterna i en- och tvåhjärtbladiga, en indelning som till stor del håller än i dag.

    Ray såg arterna som fasta, skapade av Gud, och skrev en uppmärksammad bok om hur naturens ändamålsenlighet visar på en skapare. Hans artbegrepp blev grunden för [Linnés namnsystem](#linne-binomiala-namn-1753) på 1700-talet. Att arter kan förändras föreslogs av [Lamarck](#lamarck-arter-forandras-1809) och förklarades av [Darwin och Wallace](#darwin-och-wallace-evolution-185859).

leeuwenhoek-blodkroppar-och-spermier:
  period: 1700
  label: "Leeuwenhoek: blodkroppar och spermier"
  title: "Leeuwenhoek ser blodkroppar och spermier"
  wiki:
    - "en:Antonie van Leeuwenhoek"
    - "en:Spermatozoon"
  text: |
    **Antoni van Leeuwenhoek** (1632–1723) var en tygköpman i Delft i Nederländerna utan universitetsutbildning. Han slipade egna mikroskop med en enda liten lins, som förstorade uppåt 200–300 gånger – bättre än tidens sammansatta mikroskop. Han skrev hundratals brev om vad han såg till Royal Society i London, fram till sin död 1723.

    Efter [upptäckten av bakterier 1676](#leeuwenhoek-bakterier-1676) beskrev han 1677 **spermier** i sädesvätska, som rörliga "små djur". Han beskrev också noggrant de röda **blodkropparna** (holländaren Swammerdam hade sett dem tidigare) och 1688 såg han blod strömma genom hårfina kärl, **kapillärer**, i en grodyngels svans.

    Kapillärerna var den saknade länken i [Harveys teori om blodomloppet](#harvey-blodomloppet-1628): Harvey hade inte kunnat visa hur blodet tar sig från artärer till vener (italienaren Malpighi hade sett kapillärer i lungor 1661). Spermierna väckte en lång strid om fortplantning: "spermister" trodde att en färdig liten människa satt i spermien, "ovister" att den fanns i ägget. Att båda bidrar förstods först på 1800-talet. Leeuwenhoek fortsatte arbetet som [Robert Hooke](#hooke-celler-1665) börjat och öppnade mikrovärlden för biologin.

variolation-mot-smittkoppor-1721:
  period: 1720
  label: "Variolation mot smittkoppor 1721"
  title: "Variolation mot smittkoppor (1721)"
  wiki:
    - "en:Variolation"
    - "en:Mary Wortley Montagu"
  text: |
    **Smittkoppor** var en av de dödligaste sjukdomarna i historien, orsakad av ett virus. I 1700-talets Europa dog uppskattningsvis 400 000 människor per år, och omkring var tredje smittad dog (ungefärliga siffror). Men den som överlevt blev immun för livet.

    **Variolation** utnyttjade det: man tog var från en smittkoppsblåsa hos en lindrigt sjuk person och ritsade in det i huden på en frisk. Oftast gav det en mildare sjukdom, med en dödlighet på kanske 1–2 procent i stället för omkring 30 procent, och därefter immunitet. Metoden var känd sedan länge i Kina, Indien, Osmanska riket och Afrika. **Lady Mary Wortley Montagu**, gift med det brittiska sändebudet i Konstantinopel och själv ärrad av smittkoppor, lät variolera sin son där och 1721 sin dotter i London under en epidemi. Samma år i Boston fick predikanten Cotton Mather idén från en förslavad afrikan, Onesimus, och läkaren Zabdiel Boylston variolerade hundratals personer – med tydligt lägre dödlighet än bland de naturligt smittade.

    Nackdelen var att de variolerade själva var smittsamma och kunde starta nya utbrott. Därför var [Jenners vaccin 1796](#jenners-vaccin-1796), som använde ofarliga kokoppor, ett stort framsteg. Boylstons jämförelse av dödstal är också en tidig medicinsk statistisk studie. Kedjan slutade med att [smittkoppor utrotades 1980](#smittkoppor-utrotade-1980).

linne-binomiala-namn-1753:
  period: 1740
  label: "Linné: binomiala namn 1753"
  title: "Linnés tvådelade namn (1753)"
  wiki:
    - "sv:Binomialnomenklatur"
    - "sv:Carl von Linné"
    - "en:Species Plantarum"
  text: |
    **Carl von Linné** (1707–1778) var professor i medicin och botanik i Uppsala och skickade ut elever – "apostlar" – över hela världen för att samla växter. Hans system för att ordna naturen presenterades först i [Systema Naturae](#linne-systema-naturae) 1735.

    1753 kom Species Plantarum, där han konsekvent gav varje växtart ett **binomialt namn**: två latinska ord, släkte plus artepitet. Tidigare hade arter beskrivits med långa latinska fraser som samtidigt var beskrivning och namn, t.ex. något i stil med "Rosa med släta stjälkar och fyllda blommor", som ändrades varje gång en ny närliggande art hittades. Linné separerade namnet från beskrivningen: *Homo sapiens* (människa, 1758), *Pinus sylvestris* (tall). Arterna ordnades i en hierarki av släkten, ordningar och klasser – en trädstruktur med unika nycklar, för att tala datavetenskapligt.

    Systemet var lätt att lära sig och blev snabbt internationell standard. Startdatumet för giltiga växtnamn är formellt satt till 1 maj 1753, och för djur till 1758. Linnés indelning av växter efter antalet ståndare och pistiller var dock konstlad och ersattes senare. Han byggde på [John Rays artbegrepp](#ray-begreppet-art-1686) och såg arterna som fasta. Senare blev det tydligt att hierarkin speglar släktskap, något [Darwin och Wallace](#darwin-och-wallace-evolution-185859) förklarade med evolution.

lind-citrus-mot-skorbjugg-1747:
  period: 1740
  label: "Lind: citrus mot skörbjugg 1747"
  title: "Lind testar citrus mot skörbjugg (1747)"
  wiki:
    - "en:James Lind"
    - "sv:Skörbjugg"
  text: |
    **Skörbjugg** är en bristsjukdom som orsakas av för lite **C-vitamin** i kosten. Kroppen kan inte bilda kollagen, bindvävens byggsten: tandköttet blöder, gamla sår går upp och man dör till slut. På långa sjöresor med torkad och saltad mat var den en av de största dödsorsakerna; på George Ansons världsomsegling 1740–44 dog en stor del av besättningen, många av skörbjugg.

    **James Lind** (1716–1794) var skotsk skeppsläkare i brittiska flottan. 1747, ombord på HMS Salisbury, tog han tolv sjömän med skörbjugg, så lika sjuka som möjligt, gav dem samma grundkost och delade in dem i sex par med olika tillägg: cider, utspädd svavelsyra, vinäger, havsvatten, en kryddpasta, eller två apelsiner och en citron per dag. Paret med citrus blev nästan friska på en vecka; inget annat hjälpte tydligt. Det räknas som ett av de första **kontrollerade kliniska försöken** – jämförelse av behandlingar i parallella grupper under lika förhållanden.

    Lind förstod inte orsaken, trodde inte heller helt på sitt resultat och rekommenderade en koncentrerad, inkokt saft som förstörde mycket av vitaminet. Först 1795 införde brittiska flottan citronsaft i ransonerna. C-vitamin identifierades först på 1930-talet. Jämför [Boylstons statistik över variolation](#variolation-mot-smittkoppor-1721) och [John Snows kolerastudie](#snow-kolera-och-vattenpumpen-1854) – tidiga exempel på hur medicin började bygga på systematiska jämförelser.

spallanzani-mot-uralstring:
  period: 1760
  label: "Spallanzani mot uralstring"
  title: "Spallanzani kokar buljong (1760-talet)"
  wiki:
    - "en:Lazzaro Spallanzani"
    - "en:Spontaneous generation"
  text: |
    **Uralstring** är idén att levande varelser kan uppstå spontant ur död materia. [Redi](#redi-mot-uralstring) hade 1668 visat att maskar i kött kommer från flugägg, men när [Leeuwenhoek upptäckte mikroorganismer](#leeuwenhoek-bakterier-1676) trodde många att åtminstone dessa uppstod av sig själva. 1748 hade den engelske prästen John Needham kokat köttbuljong kort, förslutit den med kork och ändå funnit mikrober efter några dagar – som han tolkade som bevis för uralstring.

    **Lazzaro Spallanzani** (1729–1799), italiensk präst och professor i Pavia, upprepade försöket på 1760-talet med större noggrannhet. Han kokade buljongen längre, upp till en timme, och smälte igen flaskhalsarna i glaset. Då uppstod inget liv. Kort kokning eller otäta flaskor gav mikrober. Slutsatsen var att mikroberna kom utifrån eller överlevde kort kokning – inte att de bildades i buljongen.

    Needham invände att lång kokning förstörde en "livskraft" i luften i flaskan. Frågan förblev öppen i ytterligare ett sekel, tills [Pasteur](#pasteur-mikrober-och-pastorisering) omkring 1860 visade med svanhalskolvar – som släpper in luft men inte damm – att buljongen förblir steril. Spallanzanis metod inspirerade fransmannen Nicolas Appert att runt 1800 konservera mat i slutna, kokade behållare – konservburkens ursprung. Spallanzani gjorde också den första konstgjorda inseminationen, på en hund.

