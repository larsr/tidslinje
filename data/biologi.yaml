lavoisier-andning-ar-forbranning:
  period: 1780
  label: "Lavoisier: andning är förbränning"
  title: "Kroppen som en långsam eld"
  wiki:
    - "sv:Antoine Lavoisier"
    - "en:Respiration (physiology)"
  text: |
    **Antoine Lavoisier** (1743–1794) var en fransk kemist som brukar räknas som den moderna kemins grundare; han visade att förbränning är en reaktion med syre (se [kemins revolution](#lavoisier-syre-kemins-revolution)). Han halshöggs under franska revolutionen 1794, inte för sin forskning utan för att han varit skatteindrivare.

    Omkring 1782–1783 gjorde han tillsammans med matematikern Pierre-Simon Laplace ett elegant försök. De satte ett marsvin i en *iskalorimeter*: en behållare omgiven av is, där mängden smält is mäter hur mycket värme djuret avger. Samtidigt mätte de hur mycket koldioxid djuret andades ut och jämförde med hur mycket värme som bildas när kol brinner och ger samma mängd koldioxid. Siffrorna stämde ungefär. Slutsatsen: andning är en långsam förbränning. Kroppen tar upp syre och "bränner" kol och väte från födan till koldioxid och vatten, och kroppsvärmen är förbränningsvärmen.

    Det var ett radikalt steg: livsprocesser kunde mätas och förklaras med samma kemi som en brinnande ljuslåga. Idén ledde vidare till ämnesomsättningsforskning och kalorimätning av mat, och den var en av trådarna som 1840-talets fysiker följde när de formulerade [energiprincipen](#energiprincipen-joule-helmholtz-1847). Att även kroppens ämnen kunde framställas på kemisk väg visades senare av [Wöhlers ureasyntes](#wohler-urea-1828-organisk-kemi).

lamarck-arter-forandras-1809:
  period: 1800
  label: "Lamarck: arter förändras 1809"
  title: "Den första evolutionsteorin"
  wiki:
    - "en:Lamarckism"
    - "sv:Jean-Baptiste de Lamarck"
  text: |
    **Jean-Baptiste Lamarck** (1744–1829) var en fransk naturforskare vid naturhistoriska museet i Paris, expert på ryggradslösa djur och en av dem som myntade ordet *biologi*. I *Philosophie zoologique* (1809) lade han fram den första genomarbetade teorin om att arter förändras över mycket lång tid.

    Den rådande synen, som i [Linnés](#linne-binomiala-namn-1753) klassificering, var att arter är fasta sedan skapelsen. Den inflytelserika anatomen Georges Cuvier visade att arter kan dö ut, men förklarade det med katastrofer, inte förändring. Lamarck föreslog två mekanismer: en inneboende drift mot ökad komplexitet, och att egenskaper som en individ förvärvar under livet ärvs. Organ som används mycket växer, organ som inte används tillbakabildas, och förändringen förs vidare till avkomman. Standardexemplet är giraffen som sträcker på halsen för att nå löv och får ungar med lite längre hals.

    Mekanismen visade sig fel. [Darwin och Wallace](#darwin-och-wallace-evolution-185859) förklarade förändringen med naturligt urval bland slumpmässiga variationer, och [Mendels](#mendels-artor-1865) ärftlighetslära visade att anlag förs vidare oförändrade. På 1880-talet visade August Weismann att kroppens förändringar inte når könscellerna. Lamarcks förtjänst är att han tog den djupa tiden och arternas föränderlighet på allvar ett halvsekel före Darwin. Dagens epigenetik visar att vissa miljöeffekter kan påverka genuttryck över en eller ett par generationer, men det är inte Lamarcks mekanism.

stetoskopet-1816:
  period: 1800
  label: "stetoskopet 1816"
  title: "Att lyssna in i kroppen"
  wiki:
    - "sv:Stetoskop"
    - "en:René Laennec"
  text: |
    **René Laennec** (1781–1826) var en fransk läkare i Paris. 1816 skulle han undersöka en ung kvinna med hjärtbesvär. Att lägga örat direkt mot bröstet, som man gjorde, var opassande och fungerade dessutom dåligt på överviktiga patienter. Han rullade ihop ett pappersark till ett rör, satte det mot bröstet och hörde hjärtat tydligare än någonsin. Snart ersatte han papperet med en ihålig träcylinder, ungefär 25 cm lång, och döpte den till *stetoskop* (grekiska för "bröstbetraktare").

    Det viktiga var inte röret utan metoden. Laennec lyssnade systematiskt på hundratals patienter och jämförde ljuden med vad obduktionerna visade efter döden. I sitt verk från 1819 beskrev han hur till exempel lunginflammation, tuberkulos och hjärtfel låter. Ironiskt nog dog han själv i tuberkulos vid 45 års ålder.

    Stetoskopet var en del av ett större skifte i Paris kring 1800: läkare började ställa diagnos genom att undersöka kroppen och koppla symtom till skador i bestämda organ, i stället för att utgå från patientens berättelse och teorier om kroppsvätskor. Österrikaren Leopold Auenbrugger hade redan 1761 infört att knacka på bröstkorgen och lyssna. Stetoskopet fick sin moderna form med två öronslangar på 1850-talet. Nästa stora språng i att "se in" i kroppen utan att skära kom med [röntgenstrålningen](#rontgenstralning) 1895.

wohler-urea-1828-organisk-kemi:
  period: 1820
  label: "Wöhler: urea 1828, organisk kemi"
  title: "Livets ämnen ur laboratoriet"
  wiki:
    - "en:Wöhler synthesis"
    - "sv:Friedrich Wöhler"
  text: |
    **Friedrich Wöhler** (1800–1882) var en tysk kemist som hade studerat för den svenske kemisten Jöns Jacob Berzelius i Stockholm. Berzelius var en av tidens ledande kemister och hade infört dagens kemiska beteckningar som H₂O. Han hade också gjort skillnad på *oorganiska* ämnen, som salter och mineral, och *organiska*, ämnen som bara bildades i levande organismer. Många trodde, en uppfattning kallad *vitalism*, att det senare krävde en särskild "livskraft".

    1828 upphettade Wöhler det oorganiska saltet ammoniumcyanat (NH₄OCN) och fick urinämne, urea (CO(NH₂)₂) – samma ämne som finns i urin. Han skrev triumferande till Berzelius att han kunnat göra urea "utan att behöva en njure, vare sig av människa eller hund". Lägg märke till att båda ämnena består av exakt samma atomer, bara olika ordnade. Det var ett tidigt exempel på det Berzelius kallade *isomeri*: att egenskaperna beror på hur atomerna sitter ihop, inte bara vilka de är.

    Synen att Wöhler ensam krossade vitalismen är en senare förenkling: ureasyntesen övertygade inte alla, och vitalismen dog ut gradvis. Men under de följande årtiondena framställde kemister allt fler organiska ämnen syntetiskt, och "organisk kemi" kom att betyda kolföreningarnas kemi, oavsett ursprung. Det öppnade för syntetiska färgämnen på 1850-talet, läkemedel och plaster – och stödde den hållning som redan [Lavoisier](#lavoisier-andning-ar-forbranning) hade, att livets processer följer vanlig kemi.

brownsk-rorelse-1827:
  period: 1820
  label: "Brownsk rörelse 1827"
  title: "Pollenkorn som aldrig står still"
  wiki:
    - "sv:Brownsk rörelse"
    - "en:Robert Brown (botanist, born 1773)"
  text: |
    **Robert Brown** (1773–1858) var en skotsk botaniker, känd bland annat för att ha gett cellkärnan dess namn. 1827 studerade han i mikroskop små partiklar som frigjorts ur pollenkorn, ungefär några tusendels millimeter stora, i en vattendroppe. De rörde sig hela tiden i oregelbundna, sicksackande banor och slutade aldrig.

    Först trodde han att rörelsen var ett tecken på liv. Men han upprepade försöket med död växtdel, glaspulver och stendamm och fick samma resultat: rörelsen hade inget med liv att göra. Han kunde dock inte förklara den. Under resten av 1800-talet föreslogs bland annat strömmar i vätskan och avdunstning, men ingen förklaring höll.

    Svaret kom från [Einstein 1905](#einstein-1905-och-1915). Han visade att rörelsen orsakas av att vattenmolekylerna, som rör sig slumpmässigt på grund av värme, ständigt knuffar partikeln från alla håll, och att knuffarna inte tar ut varandra exakt i varje ögonblick. Han förutsade hur långt en partikel i genomsnitt hinner vandra: avståndet växer med kvadratroten ur tiden. Fransmannen Jean Perrin mätte detta 1908 och kunde beräkna Avogadros tal – antalet molekyler i en mol, ungefär 6 · 10²³. Därmed var atomernas och molekylernas existens, som [Dalton](#daltons-atomteori) föreslagit, till sist allmänt accepterad. Matematiken för slumpvandringar blev senare grund för statistisk fysik, diffusionsmodeller och modeller för aktiepriser.

darwin-och-wallace-evolution-185859:
  period: 1840
  label: "Darwin och Wallace: evolution 1858–59"
  title: "Naturligt urval"
  wiki:
    - "sv:Evolution"
    - "sv:Charles Darwin"
    - "sv:Alfred Russel Wallace"
  text: |
    **Charles Darwin** (1809–1882) var en engelsk naturforskare som 1831–1836 seglade jorden runt med fartyget *Beagle* och samlade iakttagelser, bland annat av finkar och sköldpaddor på Galápagosöarna. Redan 1838 hade han sin teori klar men publicerade inte i 20 år. 1858 fick han ett brev från **Alfred Russel Wallace** (1823–1913), en engelsk samlare i dagens Indonesien, som självständigt kommit fram till samma idé. Deras texter lästes upp tillsammans i London 1858, och 1859 kom Darwins bok, se [Arternas uppkomst](#darwin-arternas-uppkomst-1859).

    Teorin bygger på några enkla iakttagelser. Individer i en art skiljer sig åt, och mycket av skillnaden ärvs. Det föds fler individer än som kan överleva. De vars ärftliga egenskaper passar bäst i miljön överlever och får ungar oftare. Över många generationer förändras därför arten gradvis – *naturligt urval*. Med tillräckligt lång tid kan en art dela sig i flera, och alla arter har gemensamma förfäder. Det skiljde sig från [Lamarcks](#lamarck-arter-forandras-1809) idé att förvärvade egenskaper ärvs.

    Teorin väckte stor strid, särskilt om människans ursprung. Den stora svagheten var att Darwin inte visste hur ärftlighet fungerar. Svaret fanns redan hos [Mendel](#mendels-artor-1865), men det uppmärksammades först omkring 1900; föreningen av urval och genetik på 1930–40-talen blev grunden för modern biologi. Idén om variation plus urval har sedan inspirerat genetiska algoritmer inom datavetenskapen.

snow-kolera-och-vattenpumpen-1854:
  period: 1840
  label: "Snow: kolera och vattenpumpen 1854"
  title: "Epidemiologin föds vid en pump"
  wiki:
    - "en:1854 Broad Street cholera outbreak"
    - "sv:John Snow"
  text: |
    **Kolera** är en tarminfektion som orsakas av en bakterie och ger våldsamma diarréer; obehandlad kan den döda inom ett dygn genom uttorkning. Under 1800-talet svepte flera [kolerapandemier](#kolerapandemier) från Indien över världen. Den rådande teorin var att sjukdomar spreds via *miasma*, "dålig luft" från förruttnelse.

    **John Snow** (1813–1858) var en engelsk läkare, även pionjär inom narkos, som misstänkte att kolera i stället spreds via förorenat vatten. När kolera bröt ut i stadsdelen Soho i London i augusti 1854 och omkring 600 människor dog på några veckor, ritade han in dödsfallen på en karta. De samlades kring en vattenpump på Broad Street. Avvikelserna stärkte hans fall: arbetarna på ett närliggande bryggeri, som drack öl och hade egen brunn, klarade sig; en kvinna långt bort som låtit hämta vatten från just den pumpen dog. Han övertalade myndigheterna att ta bort pumpens handtag. Senare visade det sig att brunnen låg nära en läckande avloppsbrunn.

    Snow gjorde också en stor jämförelse mellan hushåll som fick vatten från två olika vattenbolag, varav det ena tog vatten nedströms från förorenade delar av Themsen. Dödligheten var flera gånger högre hos det bolagets kunder – ett tidigt "naturligt experiment". Han övertygade inte alla i sin livstid; [Pasteurs](#pasteur-mikrober-och-pastorisering) bakterieteori kom senare. Men Snow räknas som epidemiologins grundare, och Londons stora avloppssystem byggdes på 1860-talet.

semmelweis-handtvatt:
  period: 1840
  label: "Semmelweis: handtvätt"
  title: "Läkarnas händer dödade mödrarna"
  wiki:
    - "sv:Ignaz Semmelweis"
  text: |
    **Ignaz Semmelweis** (1818–1865) var en ungersk läkare vid det stora allmänna sjukhuset i Wien. Där fanns två förlossningsavdelningar. På den ena, där läkare och läkarstudenter förlöste, dog i perioder omkring 10 procent av mödrarna i *barnsängsfeber*, en svår infektion efter förlossningen. På den andra, som sköttes av barnmorskor, låg dödligheten kring 3–4 procent.

    1847 dog en kollega efter att ha skurit sig på en skalpell vid en obduktion, med samma symtom som de döende mödrarna. Semmelweis drog slutsatsen att läkarna förde över "likpartiklar" från obduktionssalen till kvinnorna med händerna. Han införde tvätt med klorkalklösning före undersökningar, och dödligheten på läkarnas avdelning sjönk på kort tid till omkring 1–2 procent.

    Ändå avvisades han. Han kunde inte förklara *vad* partiklarna var, läkare blev förolämpade av att de själva skulle vara smittbärare, och han publicerade sina resultat sent och angrep kritiker hätskt. Han lämnade Wien, och 1865 dog han på ett mentalsjukhus, sannolikt efter misshandel av personalen. Förklaringen kom först med [Pasteurs](#pasteur-mikrober-och-pastorisering) mikrobteori, och [Listers antiseptik](#lister-antiseptik-1867) gjorde rengöring till standard inom kirurgin. "Semmelweisreflexen" har blivit ett begrepp för att man avvisar nya fakta som strider mot etablerade uppfattningar.

pasteur-mikrober-och-pastorisering:
  period: 1860
  label: "Pasteur: mikrober och pastörisering"
  title: "Mikroberna bakom jäsning och sjukdom"
  wiki:
    - "sv:Louis Pasteur"
    - "sv:Pastörisering"
  text: |
    **Louis Pasteur** (1822–1895) var en fransk kemist som kom att förändra biologi och medicin. Mikroorganismer – levande varelser för små att se med blotta ögat, som bakterier och jästsvampar – hade setts i mikroskop sedan [Leeuwenhoek](#leeuwenhoek-bakterier-1676) på 1670-talet, men deras roll var oklar.

    På 1850–60-talet visade Pasteur att jäsning, till exempel när vin och öl bildas, orsakas av levande jästceller och att när vin blir surt beror det på andra mikrober. Han visade också att mikrober inte uppstår spontant ur död materia. I hans berömda försök med kolvar med svanhalsliknande böjd hals kunde luft komma in men damm och mikrober fastnade i böjen – buljongen förblev oförstörd. Det avgjorde en gammal strid, se [Spallanzani](#spallanzani-mot-uralstring). Han fann att man kunde döda skadliga mikrober i vin, senare mjölk, genom att värma till omkring 55–60 °C en stund, utan att förstöra smaken. Metoden kallas efter honom *pastörisering*.

    Steget till sjukdomar var kort: om mikrober orsakar jäsning och förruttnelse kan de orsaka infektioner. Den *bakterieteori* som Pasteur och tysken Robert Koch etablerade under 1860–80-talen (se [bakterieteorin](#bakterieteorin)) ersatte miasmateorin och förklarade varför [Semmelweis](#semmelweis-handtvatt) och [Lister](#lister-antiseptik-1867) hade rätt. Pasteur utvecklade sedan vacciner, bland annat [mot rabies](#pasteurs-rabiesvaccin-1885).

mendels-artor-1865:
  period: 1860
  label: "Mendels ärtor 1865"
  title: "Ärftlighet i hela enheter"
  wiki:
    - "sv:Gregor Mendel"
    - "en:Mendelian inheritance"
  text: |
    **Gregor Mendel** (1822–1884) var en augustinermunk i Brünn (nuvarande Brno i Tjeckien) som hade studerat naturvetenskap och matematik i Wien. Under åren 1856–1863 korsade han tusentals ärtplantor i klostrets trädgård och räknade avkomman. Han valde egenskaper som bara fanns i två tydliga varianter, till exempel gula eller gröna ärtor, släta eller skrynkliga.

    När han korsade renrasiga gula med renrasiga gröna blev alla barn gula. När de barnen korsades med varandra blev omkring tre fjärdedelar av barnbarnen gula och en fjärdedel gröna – det berömda förhållandet 3:1. Mendel förklarade det så här: varje egenskap styrs av ett par ärftliga "faktorer" (vi säger i dag *gener*), en från varje förälder. En variant kan vara *dominant* (gul) och dölja den andra, *recessiva* (grön). Faktorerna blandas inte ut utan förs vidare oförändrade och fördelas slumpvis. Med G för gul och g för grön ger två Gg-föräldrar GG, Gg, gG och gg lika ofta – tre gula på en grön.

    Han presenterade resultaten 1865 och publicerade 1866, men de ignorerades i 34 år. Det var precis vad [Darwins teori](#darwin-och-wallace-evolution-185859) saknade: förklaringen till hur variation kan bevaras i stället för att spädas ut. Omkring 1900 återupptäcktes arbetet av tre forskare oberoende av varandra, och [Thomas Hunt Morgan](#morgan-gener-sitter-i-kromosomer) visade sedan var generna sitter. Historiker har påpekat att Mendels siffror stämmer misstänkt bra med teorin, men hans slutsatser har bekräftats otaliga gånger.

lister-antiseptik-1867:
  period: 1860
  label: "Lister: antiseptik 1867"
  title: "Att döda bakterierna i såret"
  wiki:
    - "sv:Joseph Lister"
    - "en:Antiseptic"
  text: |
    **Joseph Lister** (1827–1912) var en engelsk kirurg verksam i Glasgow. Med [narkosen](#narkos-1846), som infördes 1846, kunde kirurgerna operera längre och mer avancerat, men många patienter dog ändå av infektioner efteråt. Sår blev varigt och "sjukhusbrand" spred sig; vid amputationer kunde grovt räknat hälften av patienterna dö i vissa sjukhus. Kirurgerna opererade i blodiga rockar som sågs som ett tecken på erfarenhet.

    Lister läste [Pasteurs](#pasteur-mikrober-och-pastorisering) arbeten om att förruttnelse orsakas av mikrober och drog slutsatsen att samma sak hände i sår. Han kunde inte värma såren som Pasteur värmde vin, så han valde ett kemiskt medel: *karbolsyra* (fenol), som användes för att minska stanken från avlopp. Han tvättade sår, instrument och händer med det, lade förband indränkta i det och sprejade det i luften under operationen. Han kallade metoden *antiseptik*, "mot förruttnelse". 1867 rapporterade han att dödligheten vid hans amputationer sjunkit från omkring 45 till omkring 15 procent.

    Metoden mötte motstånd men spreds, särskilt i Tyskland. Mot slutet av 1800-talet ersattes den gradvis av *aseptik*: att hindra bakterier från att komma in alls med ångsterilisering, kokade instrument, rena rockar och gummihandskar. Listers idé fullföljde det [Semmelweis](#semmelweis-handtvatt) förgäves försökt införa. Munvattnet Listerine (1879) är uppkallat efter honom.

koch-tuberkelbakterien-1882-2:
  period: 1880
  label: "Koch: tuberkelbakterien 1882"
  same_as: koch-tuberkelbakterien-1882

pasteurs-rabiesvaccin-1885:
  period: 1880
  label: "Pasteurs rabiesvaccin 1885"
  title: "Pasteurs vaccin mot rabies"
  wiki:
    - "sv:Louis Pasteur"
    - "en:Rabies vaccine"
  text: |
    **Louis Pasteur** (1822–1895) var en fransk kemist och en av grundarna av mikrobiologin, se [mikrober och pastörisering](#pasteur-mikrober-och-pastorisering). På 1880-talet ville han göra det som Edward Jenner gjort mot smittkoppor ([Jenners vaccin 1796](#jenners-vaccin-1796)) mot fler sjukdomar. Jenner hade använt en närbesläktad sjukdom, kokoppor; Pasteur ville i stället *försvaga* själva smittämnet så att det gav skydd utan att ge sjukdom. Han lyckades med hönskolera och mjältbrand.

    Rabies sprids med bett från smittade djur och är nästan alltid dödlig när symtomen väl har börjat. Pasteur kunde inte se smittämnet – det var ett virus, långt för litet för hans mikroskop. Han förde i stället smittan vidare i kaniners ryggmärg och torkade märgen olika många dagar; ju längre torkning, desto svagare. Eftersom rabies har lång inkubationstid (ofta veckor till månader) hinner kroppen bygga upp immunitet även om vaccinet ges efter bettet.

    I juli 1885 fick den nioårige Joseph Meister, som bitits av en rabiessjuk hund, en serie på 13 injektioner av allt starkare material. Han överlevde. Det var ett riskabelt experiment, men framgången gjorde Pasteur världsberömd, och Institut Pasteur i Paris grundades 1887. Att man kunde bekämpa ett smittämne man inte såg pekade fram mot [upptäckten av virus](#virus-upptacks-1892).

virus-upptacks-1892:
  period: 1880
  label: "virus upptäcks 1892"
  title: "Något mindre än bakterier"
  wiki:
    - "sv:Virus"
    - "en:Tobacco mosaic virus"
  text: |
    Under 1870–80-talen hade Pasteur och Robert Koch (se [tuberkelbakterien](#koch-tuberkelbakterien-1882)) visat att många sjukdomar orsakas av bakterier. Bakterier är encelliga organismer, typiskt några tusendels millimeter (mikrometer) stora, och fastnar i porslinsfilter med mycket fina porer.

    Den ryske botanikern **Dmitrij Ivanovskij** studerade 1892 tobaksmosaiksjuka, som ger fläckiga tobaksblad. Han pressade saft ur sjuka blad genom ett sådant bakteriefilter – och den filtrerade saften smittade ändå friska plantor. Han trodde själv att det kanske var ett gift eller mycket små bakterier. Holländaren **Martinus Beijerinck** gick 1898 längre: smittämnet förökade sig bara i levande vävnad och gick inte att odla på näringslösning. Han kallade det *virus* (latin för gift). Samma år visades att mul- och klövsjuka hos djur orsakas av något liknande.

    Virus är typiskt 20–300 nanometer, alltså tio till hundra gånger mindre än bakterier, och kunde inte ses förrän elektronmikroskopet fanns; tobaksmosaikviruset fotograferades först 1939. Vi vet i dag att ett virus är arvsmassa (DNA eller RNA) i ett proteinhölje, som kapar cellens maskineri för att kopiera sig. Antibiotika biter inte på virus. Bland de stora virussjukdomarna finns [spanska sjukan](#spanska-sjukan-1918-50-milj-doda), polio och [hiv](#hiv-identifieras-1983).

blodgrupper-1901:
  period: 1900
  label: "Blodgrupper 1901"
  title: "Landsteiner upptäcker blodgrupperna"
  wiki:
    - "sv:Blodgrupp"
    - "sv:Karl Landsteiner"
  text: |
    Blodtransfusion, att föra över blod från en människa till en annan, hade prövats sedan 1600-talet, men ofta dog mottagaren. Ingen visste varför det ibland fungerade och ibland inte.

    Den österrikiske läkaren **Karl Landsteiner** (1868–1943) blandade 1901 röda blodkroppar från en person med blodvätska (serum) från en annan. Ibland klumpade sig blodkropparna ihop, ibland inte. Han visade att människor faller i grupper, i dag kallade A, B och 0 (AB beskrevs året därpå av hans medarbetare). Förklaringen: på de röda blodkropparnas yta finns molekyler, antigen, av typ A, B, båda eller ingen. Blodet innehåller antikroppar mot de antigen man själv saknar. Får en person med grupp A blod av grupp B angriper antikropparna de främmande cellerna, som klumpar ihop sig och förstörs – en livsfarlig reaktion.

    Det gav en enkel regel: testa och matcha blodet. Grupp 0 kan i nödfall ges till nästan alla, och AB kan ta emot från alla. Första matchade transfusionen gjordes 1907 i New York, och under [första världskriget](#forsta-varldskriget) utvecklades metoder för att lagra blod med citrat som förhindrar att det levrar sig. Blodbanker följde på 1930-talet. Landsteiner var också med och upptäckte Rh-faktorn 1940, och fick Nobelpriset 1930. Blodgruppernas ärftlighet följer [Mendels regler](#mendels-artor-1865), och användes tidigt i faderskapsmål.

morgan-gener-sitter-i-kromosomer:
  period: 1900
  label: "Morgan: gener sitter i kromosomer"
  title: "Morgans bananflugor"
  wiki:
    - "sv:Thomas Hunt Morgan"
    - "en:Boveri–Sutton chromosome theory"
  text: |
    När [Mendels ärftlighetsregler](#mendels-artor-1865) återupptäcktes 1900 visste man att egenskaper ärvs som odelbara enheter, senare kallade *gener*, men inte var i cellen de fanns. *Kromosomer* är trådlika strukturer i cellkärnan som syns i mikroskop när cellen delar sig, och några forskare föreslog redan runt 1902–03 att de bar arvsanlagen.

    Den amerikanske biologen **Thomas Hunt Morgan** (1866–1945) vid Columbia University var först skeptisk. Han föd upp bananflugor (*Drosophila*), som är små, lätta att hålla och får en ny generation på ungefär två veckor. År 1910 hittade han en hane med vita ögon i stället för röda. Den vita ögonfärgen ärvdes nästan bara av hanar, precis som om genen satt på X-kromosomen, könskromosomen som honor har två av och hanar en.

    Morgans grupp ("fluglabbet") visade också att gener på samma kromosom tenderar att ärvas tillsammans, men att de ibland separeras när kromosomer byter bitar med varandra. Ju längre isär två gener sitter, desto oftare skiljs de. Studenten Alfred Sturtevant använde detta 1913 för att göra den första *genkartan*, med generna i rad längs kromosomen. Morgan fick Nobelpriset 1933. Vad en gen kemiskt bestod av visste man inte förrän [DNA-strukturen](#dna-strukturen-1953) klarlades 1953.

salvarsan-1910:
  period: 1900
  label: "Salvarsan 1910"
  title: "Salvarsan, den första magiska kulan"
  wiki:
    - "sv:Paul Ehrlich"
    - "en:Arsphenamine"
  text: |
    **Paul Ehrlich** (1854–1915) var en tysk läkare och kemist. Han hade sett att vissa färgämnen bara färgar vissa celler eller bakterier, och drog slutsatsen att man kunde göra kemiska ämnen som bara angriper smittämnet men inte människans celler – en "magisk kula". Det är grundtanken bakom moderna läkemedel.

    Målet var *syfilis*, en sexuellt överförd sjukdom orsakad av en spiralformad bakterie som upptäcktes 1905. Syfilis var mycket utbredd och kunde efter år leda till förlamning, demens och död. Den dåvarande behandlingen var kvicksilver, som var giftigt och verkade dåligt. Ehrlichs labb provade systematiskt hundratals arsenikföreningar på smittade djur. Förening nummer 606, framtagen 1907 och testad av japanen Sahachiro Hata 1909, fungerade. Den lanserades 1910 under namnet Salvarsan.

    Salvarsan var svår att hantera, hade allvarliga biverkningar och krävde många injektioner, men den botade ofta och blev världens mest förskrivna läkemedel fram till 1940-talet. Viktigare var metoden: att systematiskt testa många varianter av en molekyl mot ett bestämt mål. Samma metod gav [sulfapreparaten](#sulfa-1935) på 1930-talet, och syfilis behandlas i dag med [penicillin](#penicillin-1928). Ehrlich hade fått Nobelpriset 1908 för sin forskning om immunitet.

insulin-1921:
  period: 1920
  label: "Insulin 1921"
  title: "Insulin räddar diabetiker"
  wiki:
    - "sv:Insulin"
    - "en:Frederick Banting"
  text: |
    *Diabetes* (typ 1) innebär att kroppen inte kan ta upp socker ur blodet, och före 1920-talet var den hos barn och unga en dödsdom inom något eller några år. Den enda "behandlingen" var svältdiet. Man visste sedan 1889 att hundar utan bukspottkörtel fick diabetes, och misstänkte att körteln producerade ett hormon (en signalsubstans i blodet), men ingen hade lyckats utvinna det.

    Den kanadensiske kirurgen **Frederick Banting** och studenten **Charles Best** lyckades sommaren 1921 vid University of Toronto, i professor John Macleods labb, framställa ett extrakt som sänkte blodsockret hos diabeteshundar. Biokemisten James Collip renade det så att det kunde ges till människor. I januari 1922 fick 14-årige Leonard Thompson, döende i diabetes, insulin och tillfrisknade. *Insulin* är hormonet som får kroppens celler att ta upp socker ur blodet.

    Banting och Macleod fick Nobelpriset 1923 – ovanligt snabbt – och delade med Best och Collip. Universitetet sålde patentet för en symbolisk summa så att läkemedelsbolag (bland andra Eli Lilly, och i Danmark det som blev Novo Nordisk) kunde massproducera insulin från bukspottkörtlar från slaktdjur. Diabetes blev en kronisk men hanterbar sjukdom. Insulin var 1978 också det första läkemedlet som framställdes med genteknik, av bakterier med inklippt mänsklig gen, ett led i den utveckling som senare gav [PCR](#pcr-1983) och [CRISPR](#crispr-2012).

penicillin-1928:
  period: 1920
  label: "penicillin 1928"
  title: "Fleming upptäcker penicillinet"
  wiki:
    - "sv:Penicillin"
    - "sv:Alexander Fleming"
  text: |
    **Alexander Fleming** (1881–1955) var en skotsk bakteriolog vid S:t Marys sjukhus i London. I september 1928 kom han tillbaka från semester och såg att en av hans odlingsplattor med stafylokocker (bakterier som orsakar bl.a. sårinfektioner) hade förorenats av en mögelsvamp, *Penicillium*. Runt svampen hade bakterierna dött. Han drog slutsatsen att svampen utsöndrade ett ämne som dödar bakterier och kallade det penicillin. Händelsen finns också i [Englandskolumnen](#fleming-penicillin-1928).

    Penicillin hindrar bakterier från att bygga sin cellvägg, något mänskliga celler inte har, vilket gör det till en nästan perfekt "magisk kula" i [Ehrlichs](#salvarsan-1910) mening. Men Fleming lyckades inte rena fram ämnet i användbar mängd och det var instabilt. Han publicerade 1929, men upptäckten låg i stort sett outnyttjad i tio år.

    I Oxford tog farmakologen Howard Florey och biokemisten Ernst Chain upp spåret 1939. De renade penicillinet, visade 1940 att det skyddade möss mot dödliga infektioner och behandlade de första patienterna 1941. Industriell produktion i USA under kriget, med djuptanksjäsning och en mer produktiv mögelstam funnen på en melon, gjorde det tillgängligt i stor skala ([penicillin massproduceras](#penicillin-massproduceras)). Fleming, Florey och Chain fick Nobelpriset 1945. Penicillin inledde antibiotikaeran, men Fleming varnade redan då för resistens: bakterier som överlever för låga doser blir motståndskraftiga, ett växande problem i dag.

sulfa-1935:
  period: 1920
  label: "sulfa 1935"
  title: "Sulfa, de första antibakteriella läkemedlen"
  wiki:
    - "sv:Sulfonamider"
    - "en:Gerhard Domagk"
  text: |
    På 1930-talet följde tyska kemiföretaget IG Farben (Bayer) [Ehrlichs metod](#salvarsan-1910): testa tusentals syntetiska ämnen, här färgämnen, på infekterade möss. Läkaren och forskaren **Gerhard Domagk** (1895–1964) fann 1932 att ett rött färgämne, Prontosil, skyddade möss mot streptokocker, bakterier som orsakar t.ex. barnsängsfeber, halsfluss och blodförgiftning. Resultatet publicerades 1935.

    Samma år visade forskare vid Institut Pasteur i Paris att det verksamma inte var färgen. I kroppen spjälkas Prontosil till *sulfanilamid*, en enkel och redan känd molekyl som inte gick att patentera. Sulfanilamid liknar ett ämne bakterierna behöver för att tillverka folsyra, och blockerar därmed deras tillväxt. Människor får folsyra från maten och påverkas inte på samma sätt. Det ledde till en våg av sulfapreparat.

    Sulfa var det första läkemedlet som brett kunde bota bakteriella infektioner inne i kroppen, flera år före [penicillinets massproduktion](#penicillin-massproduceras). Dödligheten i barnsängsfeber och lunginflammation sjönk märkbart. I USA dog över hundra personer 1937 av en sulfasirap löst i ett giftigt lösningsmedel, vilket ledde till lagen 1938 som kräver säkerhetstester innan läkemedel säljs. Domagk tilldelades Nobelpriset 1939 men tvingades av nazistregimen att avböja; han tog emot det 1947. Sulfapreparat används än i dag, ofta i kombination med andra ämnen.

penicillin-massproduceras:
  period: 1940
  label: "Penicillin massproduceras"
  title: "Penicillinet blir ett läkemedel för alla"
  wiki:
    - "en:Penicillin"
    - "en:History of penicillin"
  text: |
    Alexander Fleming, skotsk bakteriolog i London, såg [1928](#penicillin-1928) att mögelsvampen *Penicillium* dödade bakterier, men kunde varken rena eller tillverka ämnet. Det gjorde Howard Florey och Ernst Chain vid Oxford 1939–41: de renade fram penicillin och visade att det botade infekterade möss och sedan människor. Problemet var mängden – den första patienten, 1941, dog när förrådet tog slut.

    Lösningen kom i USA under andra världskriget. Statliga laboratoriet i Peoria och läkemedelsbolag som Pfizer odlade svampen i stora omrörda tankar (djuptanksjäsning) i en näringslösning av majsstöpvatten, och hittade en mer produktiv svampstam på en möglig melon. Produktionen ökade mångtusenfalt på några år; inför landstigningen i Normandie 1944 fanns penicillin för de allierades sårade soldater. Fleming, Florey och Chain fick Nobelpriset 1945.

    Penicillin hämmar bakteriers byggande av cellvägg och skadar därför inte människans celler. Före det fanns [sulfapreparaten](#sulfa-1935), men penicillin var effektivare. Lunginflammation, blodförgiftning och infekterade sår gick från ofta dödliga till behandlingsbara. Redan Fleming varnade dock för resistens: bakterier som överlever en för svag dos förökar sig – ett problem som växt sedan dess.

