# Indien
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

mahmud-av-ghazni-plundrar-nordindien:
  period: 1000
  label: "Mahmud av Ghazni plundrar Nordindien"
  title: "Mahmud av Ghazni plundrar Nordindien"
  wiki:
    - "en:Mahmud of Ghazni"
    - "en:Somnath temple"
  text: |
    **[Mahmud av Ghazni](#mahmud-av-ghazni)** (se Orienten ~1000) var en
    turkisk-muslimsk sultan som härskade från Ghazni i dagens Afghanistan.
    Mellan omkring 1000 och 1027 gjorde han 17 fälttåg in i norra Indien.
    Indien var då splittrat i många hinduiska kungariken som aldrig enades
    mot honom.

    Målet var främst byte. Hinduiska tempel var rika: de förvaltade guld
    och juveler som skänkts av generationer av troende. Mahmud plundrade
    bland annat Mathura, Kanauj och 1025 det berömda Shivatemplet i
    **[Somnath](#mahmud-plundrar-somnath-templet-1025)** i Gujarat, där
    krönikor talar om tiotals miljoner dinarer i byte och tiotusentals
    döda. Siffrorna är osäkra och delvis överdrivna av krönikörer som
    ville framhäva hans fromhet. Han annekterade bara Punjab, i dagens
    Pakistan, permanent.

    Plundringen av Somnath är än idag ett laddat ämne i Indien, där den
    används i hindunationalistisk politik som symbol för muslimskt
    förtryck; templet återuppbyggdes 1951. Mahmuds fälttåg öppnade vägen
    för senare muslimska erövrare, och [från 1206](#delhisultanatet-1206)
    styrde muslimska sultaner från Delhi över stora delar av norra Indien,
    fram till Mogulriket och britterna.

cholariket-rajaraja-i-thanjavur-templet:
  period: 1000
  label: "Cholariket (Rajaraja I), Thanjavur-templet 1010"
  title: "Cholariket, Rajaraja I och Thanjavur-templet"
  wiki:
    - "sv:Cholariket"
    - "en:Rajaraja I"
    - "en:Brihadisvara Temple, Thanjavur"
  text: |
    **Cholariket** var ett tamilskt kungarike i södra Indien, i dagens
    Tamil Nadu. Ätten fanns sedan antiken men nådde sin storhetstid under
    **Rajaraja I** (regerade 985–1014) och hans son Rajendra I. Det var
    Sydindiens mäktigaste stat och en av få indiska makter med en stark
    flotta.

    Rajaraja erövrade Kerala, norra Sri Lanka och Maldiverna. Han lät
    också mäta upp all jord för att beskatta den – en sorts tidig
    fastighetstaxering. Sonen Rajendra gick längre: han förde krig ända
    till Ganges och skickade omkring 1025 [en flotta som angrep
    Srivijaya](#chola-flottan-anfaller-srivijaya-1025) i Malackasundet (se
    Sydostasien), över 2 500 km bort, för att kontrollera handelsvägarna
    till Kina.

    Rajaraja lät bygga **Brihadishvara-templet** i Thanjavur, invigt 1010
    och tillägnat guden Shiva. Tornet är 66 meter högt, och toppstenen
    väger uppskattningsvis 80 ton. Det var bland världens högsta byggnader
    vid den tiden – betydligt högre än någon kyrka i Europa – och är idag
    världsarv. Inskriptionerna på templets väggar ger detaljerad
    information om administration, löner och donationer.

chola-flottan-anfaller-srivijaya-1025:
  period: 1020
  label: "Chola-flottan anfaller Srivijaya 1025"
  title: "Cholarikets sjöexpedition mot Srivijaya 1025"
  wiki:
    - "en:Chola invasion of Srivijaya"
    - "en:Chola dynasty"
  text: |
    **Cholariket** var en tamilsk stat i södra Indien, en av sin tids
    starkaste sjömakter. Kung **Rajendra I** (styrde 1014–1044) skickade
    1025 en flotta över Bengaliska viken – cirka 2 000 km – mot
    **Srivijaya**, ett handelsimperium med centrum på Sumatra som
    [kontrollerade Malackasundet](#srivijaya-styr-malackasundet).

    Malackasundet är det smala sundet mellan Sumatra och Malackahalvön,
    och den kortaste sjövägen mellan Indiska oceanen och Sydkinesiska
    havet. I dag passerar ungefär en fjärdedel av världens sjöburna handel
    där. Den som kontrollerade sundet kunde ta tull på handeln mellan
    Indien och Kina.

    Cholaflottan anföll ett dussintal hamnar och tog Srivijayas kung till
    fånga. Orsaken var troligen handel: Srivijaya hindrade tamilska
    köpmän. Det är ett av få exempel på en indisk stat som förde krig över
    havet långt bort, och Srivijaya återhämtade sig aldrig helt (se
    [Srivijaya försvagat](#srivijaya-forsvagat-efter-chola-anfallet)).

mahmud-plundrar-somnath-templet-1025:
  period: 1020
  label: "Mahmud plundrar Somnath-templet 1025"
  title: "Mahmud av Ghazni plundrar Somnath 1025"
  wiki:
    - "sv:Mahmud av Ghazni"
    - "en:Somnath temple"
  text: |
    **[Mahmud av Ghazni](#mahmud-av-ghazni)** (styrde 998–1030) var sultan
    av ghaznavidriket, med bas i Ghazni i nuvarande Afghanistan. Han
    gjorde ett 17-tal [plundringståg in i norra
    Indien](#mahmud-av-ghazni-plundrar-nordindien), främst för att ta
    guld, juveler och slavar för att finansiera sina krig i Centralasien.

    År 1025–1026 tågade han cirka 1 500 km genom Tharöknen till
    **Somnath** i Gujarat vid Indiens västkust, ett av de heligaste
    templen för guden Shiva. Templet förstördes, och enligt samtida
    persiska källor togs en skatt värd uppskattningsvis 20 miljoner
    dinarer (guldmynt). Uppgifter om tiotusentals dödade finns, men
    siffrorna är osäkra.

    Varför det spelar roll: Somnath blev en symbol i hindu-muslimska
    relationer. Templet byggdes upp och förstördes flera gånger; det
    nuvarande templet invigdes 1951, efter Indiens självständighet.
    Mahmuds plundringar var början på muslimska rikens närvaro i norra
    Indien, som ledde till [Delhisultanatet (1206)](#delhisultanatet-1206)
    och senare Mogulriket.

chola-under-rajendra-i:
  period: 1040
  label: "Chola under Rajendra I"
  title: "Cholariket under Rajendra I"
  wiki:
    - "en:Rajendra I"
    - "en:Chola dynasty"
  text: |
    **Cholariket** var en tamilsk dynasti i södra Indien (nuvarande Tamil
    Nadu) som var som starkast cirka 950–1150. **Rajendra I** (styrde
    1014–1044) var son till Rajaraja I, som byggt det berömda
    [Brihadishvara-templet i
    Thanjavur](#cholariket-rajaraja-i-thanjavur-templet).

    Rajendra gjorde riket till den dominerande makten i södra Asien. Hans
    armé marscherade norrut ända till Ganges i Bengalen (cirka 1 500 km),
    och han grundade en ny huvudstad, Gangaikonda Cholapuram – "staden för
    den som tog Ganges" – dit han lät bära Ganges vatten. Han tog Sri
    Lanka och anföll Srivijaya i Sydostasien med flotta (se [Chola-flottan
    1025](#chola-flottan-anfaller-srivijaya-1025)). Han dog 1044, så under
    1040-talet styrde hans söner vidare.

    Varför det spelar roll: Cholariket hade ett välorganiserat lokalt
    självstyre med valda bykommittéer, som är väl dokumenterat genom
    tempelinskrifter. Dess bronsskulpturer, särskilt Shiva som dansare
    (Nataraja), är bland Indiens mest kända konstverk. Rikets
    handelsnätverk band ihop Indien, Sydostasien och Kina.

ghaznavider-i-punjab:
  period: 1040
  label: "ghaznavider i Punjab"
  title: "Ghaznaviderna i Punjab"
  wiki:
    - "en:Ghaznavids"
    - "en:Punjab"
  text: |
    **Ghaznaviderna** var en turkiskättad muslimsk dynasti med huvudstad i
    Ghazni, i nuvarande Afghanistan. Under [Mahmud av
    Ghazni](#mahmud-av-ghazni) (död 1030) plundrade de norra Indien gång
    på gång (se [Somnath 1025](#mahmud-plundrar-somnath-templet-1025)) och
    annekterade **Punjab** – "de fem flodernas land", ett bördigt område
    kring Indus bifloder som i dag är delat mellan Pakistan och Indien.

    Efter nederlaget mot seldjukerna vid [Dandanaqan
    1040](#seldjuker-slar-ghaznaviderna-dandanaqan) förlorade
    ghaznaviderna sina iranska områden. Riket krympte till Afghanistan och
    Punjab, och **Lahore** blev en allt viktigare stad, till slut
    huvudstad. Hovet där blev ett centrum för persisk litteratur och
    kultur.

    Varför det spelar roll: Punjab var den första delen av Indien med
    varaktigt muslimskt styre, och blev en bro för persiskt språk och
    islam in i Sydasien. Ghaznaviderna störtades 1186 av ghuriderna, vars
    general grundade **[Delhisultanatet](#delhisultanatet-1206)** (1206).
    Den långa processen ledde så småningom till att västra Punjab i dag
    har muslimsk majoritet – delningen av Indien och Pakistan 1947 skar
    rakt igenom regionen.

cholachalukya-krig:
  period: 1060
  label: "Chola–Chalukya-krig"
  title: "Krigen mellan Chola och Chalukya"
  wiki:
    - "en:Chola dynasty"
    - "en:Western Chalukya Empire"
  text: |
    Sydindien dominerades på 1000-talet av två riken. **Chola** var ett
    tamilskt rike på sydöstkusten med huvudstad Thanjavur, rikt på
    risodling och sjöhandel; det hade till och med [skickat en flotta mot
    Srivijaya](#chola-flottan-anfaller-srivijaya-1025) i dagens
    Indonesien 1025. **Västra Chalukya** (även kallat Kalyani-Chalukya)
    styrde högplatån Deccan i dagens Karnataka och Maharashtra.

    Deras krig pågick i flera generationer, främst om **Vengi** – det
    bördiga deltalandet vid floderna Godavari och Krishna i dagens Andhra
    Pradesh. Stora slag utkämpades vid Koppam 1054, där en Chola-kung
    stupade, och vid Kudalasangamam på 1060-talet. Båda sidor använde
    krigselefanter, och inskrifter skryter med förstörda städer, men
    exakta arméstorlekar är okända.

    Inget av rikena vann slutgiltigt. 1070 löstes Vengi-frågan genom arv:
    Kulottunga I, av blandad Chola- och Chalukya-släkt, blev Chola-kung.
    De långa krigen tärde på båda och banade väg för mindre vasallriken
    som [Hoysala](#hoysala) (se Hoysala). Jämför med den samtida
    europeiska bilden av ändlösa krig mellan furstar om gränsland.

filosofen-ramanuja:
  period: 1060
  label: "filosofen Ramanuja"
  title: "Filosofen Ramanuja"
  wiki:
    - "en:Ramanuja"
    - "en:Vishishtadvaita"
  text: |
    **Ramanuja** (traditionellt 1017–1137, men livslängden på 120 år är
    legendarisk) var en sydindisk teolog och filosof, verksam vid det
    stora Vishnu-templet i Srirangam i Tamil Nadu. Han är en av de
    viktigaste tänkarna inom hinduismen.

    Han argumenterade mot den äldre filosofen Shankaras (700-talet) lära
    **advaita** (”icke-tvåhet”), som säger att bara det gudomliga Brahman
    är verkligt och att världen och jaget i grunden är illusion. Ramanujas
    alternativ, **vishishtadvaita** (”kvalificerad icke-tvåhet”), säger
    att världen och själarna är verkliga men existerar som delar av Gud –
    ungefär som en kropp hör till en person. Det gjorde det möjligt att ha
    ett personligt förhållande till en gud.

    Det var den teoretiska grunden för **bhakti** – fromhet genom
    personlig kärlek och hängivenhet till en gud (här Vishnu), snarare än
    genom ritualer som bara präster kunde utföra. Bhakti-rörelsen blev
    under följande sekler en massrörelse som präglar hinduismen än idag.
    Jämför med Europa, där frågor om förhållandet mellan Gud och världen
    samtidigt diskuterades av skolastiker som Anselm och
    [Abélard](#abelard-undervisar-i-paris).

chola-och-chalukya:
  period: 1080
  label: "Chola och Chalukya"
  title: "Chola och Chalukya under Kulottunga"
  wiki:
    - "en:Kulothunga I"
    - "en:Vikramaditya VI"
  text: |
    Sydindiens två stormakter var **Chola**, ett tamilskt rike på
    sydöstkusten, och **Västra Chalukya** på Deccanplatån längre norrut
    (se [Chola–Chalukya-krig](#cholachalukya-krig)). Under 1080-talet
    styrdes de av två starka kungar.

    Chola styrdes av **Kulottunga I** (1070–1122), som genom sin mor och
    farmor var släkt med både Chola och den östra Chalukya-grenen i Vengi.
    Hans arv förenade de två rikena i öster och avslutade grälet om Vengi.
    Han är känd för att ha avskaffat vägtullar (därav titeln ”han som tog
    bort tullarna”), för en lantmätning av riket 1086 – samma år som
    [Domesday Book](#domesday-book-1086) i England – och för att ha
    skickat en beskickning med 72 köpmän till Kina 1077. Ceylon (Sri
    Lanka) gick däremot förlorat 1070.

    Västra Chalukya styrdes av **Vikramaditya VI** (1076–1126), som
    införde en egen tidräkning (Chalukya-Vikrama-eran) och var beskyddare
    av hovpoeten Bilhana och juristen Vijnaneshvara, vars lagkommentar
    *Mitakshara* fick enorm betydelse för hinduisk arvsrätt ända in i
    brittisk tid. Båda rikena hade efter dessa kungar en nedgång (se
    [Chola avtar](#chola-avtar)).

hoysala:
  period: 1080
  label: "Hoysala"
  title: "Hoysala-riket"
  wiki:
    - "en:Hoysala Empire"
    - "en:Hoysala architecture"
  text: |
    **Hoysala** var en dynasti från bergsområdet Malnad i dagens Karnataka
    i Sydindien. Från början var de lokala hövdingar och vasaller till
    Västra Chalukya, rikets stormakt på Deccanplatån (se [Chola och
    Chalukya](#chola-och-chalukya)). Under slutet av 1000-talet, när Chola
    och Chalukya nötte ut varandra i krig, kunde de växa.

    Kung **Vishnuvardhana** (ca 1108–1152) tog 1116 Gangavadi från Chola
    och gjorde Hoysala till en betydande regional makt. Han konverterade
    enligt traditionen från jainism till vishnuism under påverkan av
    [filosofen Ramanuja](#filosofen-ramanuja) (se filosofen Ramanuja).
    Huvudstaden blev Dwarasamudra (dagens Halebidu). Riket nådde sin
    höjdpunkt på 1200-talet.

    Hoysala är mest kända för sina tempel, med ett hundratal bevarade. De
    är byggda i en mjuk täljsten som gick att skulptera i mycket fina
    detaljer, ofta med stjärnformad planlösning och friser med hundratals
    elefanter, hästar och berättande scener. Templen i Belur (1117) och
    Halebidu blev världsarv 2023. Riket föll på 1340-talet efter angrepp
    från [Delhisultanatet](#delhisultanatet-1206) i norr.

hoysala-2:
  period: 1100
  label: "Hoysala"
  same_as: hoysala

chola-avtar:
  period: 1100
  label: "Chola avtar"
  title: "Cholarikets nedgång"
  wiki:
    - "en:Chola dynasty"
    - "en:Later Cholas"
  text: |
    **Chola** var ett tamilskt rike i sydöstra Indien som omkring
    1000–1070 var en av Asiens stormakter. Det hade erövrat Sri Lanka,
    [plundrat Srivijaya-riket](#chola-flottan-anfaller-srivijaya-1025) i
    dagens Indonesien med sin flotta 1025, och byggt [Brihadisvara-templet
    i Thanjavur](#cholariket-rajaraja-i-thanjavur-templet) (färdigt 1010),
    med ett 66 meter högt tempeltorn.

    Under 1100-talet förlorade riket gradvis sin dominans. Sri Lanka gick
    förlorat redan 1070. Under [Kulottunga I](#chola-och-chalukya)
    (1070–1122) gick områden i nordväst förlorade till den växande
    [Hoysaladynastin](#hoysala) (se Hoysala), som tog Gangavadi 1116, och
    Västra Chalukya tog Vengi en tid. Lokala ledare och vasaller blev mer
    självständiga, och rikets efterträdare var mindre krigiska.

    Detta var ingen kollaps. Chola levde vidare i nästan 200 år och de
    tamilska områdena var fortfarande rika, med handel till Kina och
    Sydostasien och omfattande tempelbyggen. Men riket blev en regional
    makt bland flera. Det slutliga slutet kom 1279, när Pandyadynastin
    från södra Tamil Nadu tog över. Jämför med det spanska imperiet, som
    också långsamt förlorade sin ställning under ett par hundra år efter
    höjdpunkten.

hoysala-bygger-tempel:
  period: 1120
  label: "Hoysala bygger tempel"
  title: "Hoysala-templen i södra Indien"
  wiki:
    - "en:Hoysala Empire"
    - "en:Hoysala architecture"
  text: |
    Indien var på 1100-talet inte ett enat rike utan delat mellan många
    regionala dynastier. **Hoysala** var en av dem, med kärnområde i
    dagens Karnataka i sydvästra Indien, och regerade ungefär 1000–1346.
    Kung **Vishnuvardhana** (ca 1108–1152) gjorde riket i praktiken
    självständigt från sina tidigare överherrar och började bygga de
    tempel dynastin är känd för.

    Det mest kända är Chennakeshava-templet i Belur, påbörjat 1117, samt
    Hoysaleswara-templet i Halebidu från omkring 1121. Templen är byggda
    av täljsten, en mjuk sten som är lätt att skära i när den är nybruten
    men hårdnar med tiden. Det tillät extremt detaljerade skulpturer –
    tusentals figurer av gudar, dansare, djur och vardagsscener. Templen
    står ofta på stjärnformade plattformar.

    Dynastin föll när arméer från Delhisultanatet, den muslimska staten i
    norr (se [Ghurider på väg](#ghurider-pa-vag)), plundrade huvudstaden
    1311 och igen på 1340-talet. Hoysala-templen blev världsarv 2023.
    Jämför med samma tid i Europa: den gotiska stilen föddes i
    [Saint-Denis 1137–44](#saint-denis-1137-forsta-gotiska-kyrkan), och
    [Angkor Wat](#angkor-wat-byggs) byggdes i Kambodja.

ghurider-pa-vag:
  period: 1140
  label: "Ghurider på väg"
  title: "Ghuriderna på väg mot Indien"
  wiki:
    - "en:Ghurid dynasty"
    - "en:Second Battle of Tarain"
    - "sv:Delhisultanatet"
  text: |
    Norra Indien var vid mitten av 1100-talet delat mellan hinduiska
    kungariken, styrda av krigaradeln **rajputer**, som ofta låg i krig
    med varandra. Sedan omkring år 1000 hade turkiska härskare från
    Afghanistan, ghaznaviderna, gjort [plundringståg in i
    Indien](#mahmud-av-ghazni-plundrar-nordindien) och behärskade Punjab i
    nordväst.

    Nu tog en ny makt över i Afghanistan: **ghuriderna**, en dynasti från
    bergsområdet Ghor (se [Ghuriderna i
    Afghanistan](#ghuriderna-i-afghanistan)). Efter att ha bränt
    ghaznavidernas huvudstad Ghazni 1150 vände de blicken mot Indien.
    Muhammad av Ghor tog Multan 1175 och Lahore 1186, där de sista
    ghaznaviderna regerat.

    Den avgörande striden kom vid
    **[Tarain](#ghurider-vid-tarain-1192-tar-delhi)**, norr om Delhi. 1191
    besegrades Muhammad av rajputkungen Prithviraj Chauhan, men året efter
    kom han tillbaka och vann; Prithviraj avrättades. Inom några år var
    stora delar av Gangesslätten erövrad. Efter Muhammads död 1206
    grundade hans general, den förre slaven Qutb ud-Din Aibak,
    **[Delhisultanatet](#delhisultanatet-1206)**. Det blev början på över
    600 år där stora delar av Indien styrdes av muslimska dynastier, fram
    till britternas övertagande på 1800-talet. Qutb Minar i Delhi, ett 73
    meter högt segertorn, påbörjades omkring 1199.

chola-avtar-2:
  period: 1140
  label: "Chola avtar"
  same_as: chola-avtar

ghurider:
  period: 1160
  label: "Ghurider"
  title: "Ghuriderna"
  wiki:
    - "sv:Ghurider"
    - "en:Ghurid dynasty"
  text: |
    **Ghuriderna** var en dynasti från Ghor, ett bergigt område i centrala
    Afghanistan. De var ursprungligen lokala hövdingar under det turkiska
    Ghaznavidriket, men omkring 1150 vände de sig mot sina herrar och
    brände huvudstaden Ghazni. Runt 1160–1180 tog bröderna Ghiyath al-Din
    och [Muhammad av Ghor](#muhammad-av-ghor) över större delen av dagens
    Afghanistan och östra Iran.

    Det viktiga för Indien är att Ghuriderna därifrån började anfalla
    norra Indien. Muhammad av Ghor tog Multan och Lahore (i dagens
    Pakistan) på 1170–80-talen och besegrade 1192 de hinduiska kungarna
    vid Tarain (se ”[Ghurider vid Tarain
    1192](#ghurider-vid-tarain-1192-tar-delhi)”).

    Detta var början på drygt 600 år av muslimskt styre över stora delar
    av Nordindien: först [Delhisultanatet (1206)](#delhisultanatet-1206),
    senare Mogulriket, ända tills britterna tog över på 1700–1800-talen.
    Ett känt byggnadsminne från Ghuriderna är minareten i Jam i
    Afghanistan, 65 meter hög.

ghurider-vid-tarain-1192-tar-delhi:
  period: 1180
  label: "Ghurider vid Tarain 1192, tar Delhi"
  title: "Andra slaget vid Tarain 1192"
  wiki:
    - "en:Second Battle of Tarain"
    - "en:Prithviraj Chauhan"
  text: |
    Norra Indien var på 1100-talet uppdelat mellan hinduiska kungadömen
    styrda av **rajputer**, en krigaradel. Den mäktigaste var **Prithviraj
    Chauhan**, som styrde området kring Ajmer och Delhi. 1191 besegrade
    han [Muhammad av Ghor](#muhammad-av-ghor) (se denna) i det första
    slaget vid Tarain, nordväst om Delhi.

    1192 kom Muhammad tillbaka. Han använde rörliga beridna bågskyttar som
    anföll, låtsades fly och anföll igen, mot rajputernas tyngre armé med
    krigselefanter. Arméstorlekarna i källorna är kraftigt överdrivna
    (hundratusentals); de verkliga är okända men var säkert tiotusentals.
    Ghuriderna vann, och Prithviraj tillfångatogs och avrättades.

    Året efter togs **Delhi**, som blev huvudstad för de muslimska
    erövrarna. Delhi har sedan dess varit Indiens huvudstad under de
    flesta perioder: [Delhisultanatet](#delhisultanatet-1206), Mogulriket,
    britterna från 1911 och dagens republik. Prithviraj blev i
    eftervärlden en hinduisk hjältefigur.

nalanda-forstors-1193:
  period: 1180
  label: "Nalanda förstörs ~1193"
  title: "Nalanda förstörs ~1193"
  wiki:
    - "sv:Nalanda"
    - "en:Nalanda mahavihara"
  text: |
    **Nalanda** i Bihar i nordöstra Indien var ett buddhistiskt kloster
    och lärosäte som fungerat från 400-talet, alltså i omkring 700 år. Det
    beskrivs ofta som ett av världens första universitet: kinesiska
    pilgrimer som Xuanzang (600-talet) berättar om tusentals munkar och
    studenter, föreläsningssalar och ett stort bibliotek. Man studerade
    buddhistisk filosofi, logik, grammatik och medicin.

    Omkring 1193 (dateringen är osäker, 1190-talet till ca 1200) anföll
    den [ghuridiske generalen](#ghurider) **Bakhtiyar Khalji** Bihar.
    Enligt en persisk krönika dödades munkarna och biblioteket brann;
    senare tradition säger att det brann i månader, men det är svårt att
    belägga. Nalanda dog inte helt på en gång, men lärosätet återhämtade
    sig aldrig.

    Förstörelsen av Nalanda och andra kloster, tillsammans med att
    buddhismen redan försvagats i Indien till förmån för hinduismen,
    innebar att buddhismen i stort sett försvann från sitt ursprungsland.
    Den levde vidare i Tibet, Sri Lanka, Sydostasien och Östasien. Jämför
    med att [europeiska universitet (Paris,
    Oxford)](#universitet-i-paris-och-oxford-tar-form) växte fram
    samtidigt.

delhisultanatet-1206:
  period: 1200
  label: "Delhisultanatet 1206"
  title: "Delhisultanatet 1206"
  wiki:
    - "sv:Delhisultanatet"
    - "en:Delhi Sultanate"
  text: |
    När ghuridernas sultan [Muhammad av Ghor](#muhammad-av-ghor) (se
    denna) mördades 1206 tog hans general **Qutb ud-Din Aibak** makten
    över de indiska erövringarna, med Lahore och Delhi som centrum. Aibak
    var ursprungligen en turkisk slav köpt som barn och uppfostrad till
    soldat; därför kallas hans dynasti ”slavdynastin” (eller
    mamlukdynastin).

    **Delhisultanatet** var en muslimsk stat som styrdes av en turkisk och
    afghansk krigarelit över en till stor del hinduisk befolkning. Det
    bestod i över 300 år, fram till 1526, under fem dynastier. Det stod
    emot mongolernas anfall på 1200–1300-talen, vilket få riken klarade,
    och under 1300-talet omfattade det en tid nästan hela den indiska
    halvön.

    Sultanatet förde in persiska som förvaltningsspråk, och ur blandningen
    av persiska och lokala språk växte urdu/hindustani fram. Ny arkitektur
    med valv och kupoler kom till Indien, t.ex. [Qutb Minar](#qutb-minar)
    (se denna). [1526 erövrades Delhi av
    Babur](#babur-vinner-vid-panipat-1526-mogulriket), som grundade
    Mogulriket.

qutb-minar:
  period: 1200
  label: "Qutb Minar"
  title: "Qutb Minar"
  wiki:
    - "sv:Qutb Minar"
    - "en:Qutb Minar"
  text: |
    **Qutb Minar** är en minaret – ett torn vid en moské, varifrån man
    kallar till bön – i södra Delhi. Den påbörjades omkring 1199 av Qutb
    ud-Din Aibak, som strax därefter grundade
    [Delhisultanatet](#delhisultanatet-1206) (se detta), och fullbordades
    av hans efterträdare Iltutmish omkring 1220. Senare sultaner byggde på
    och reparerade efter blixtnedslag.

    Tornet är cirka 73 meter högt, ungefär som ett 24-våningshus, och
    byggt av röd sandsten och marmor, med fem våningar avgränsade av
    balkonger och dekorerat med arabiska inskrifter. Det är världens
    högsta minaret i tegel och sten från medeltiden. Inspirationen kom
    troligen från minareten i Jam i Afghanistan, byggd av
    [ghuriderna](#ghuriderna-i-afghanistan).

    Bredvid ligger Quwwat-ul-Islam-moskén, byggd delvis av material från
    27 rivna hindu- och jaintempel – en markering av det nya styret. På
    gården står också en järnpelare från omkring 400-talet som knappt
    rostat på 1 600 år. Området är världsarv sedan 1993.

iltutmish:
  period: 1220
  label: "Iltutmish"
  title: "Iltutmish, sultan av Delhi 1211–1236"
  wiki:
    - "en:Iltutmish"
    - "sv:Delhisultanatet"
  text: |
    **Iltutmish** var en turkisk slav från Centralasien som köpts av
    **Qutb ud-Din Aibak**, själv en före detta slav och general som 1206
    grundat *[Delhisultanatet](#delhisultanatet-1206)* – det första
    muslimska riket med säte i Delhi, som skulle bestå till 1526.
    Slavsoldater (mamluker) kunde i den muslimska världen stiga till
    högsta makt; därför kallas denna första härskarlinje ofta
    ”slavdynastin”.

    Iltutmish gifte sig med sin herres dotter och blev sultan 1211. Han
    befäste riket mot rivaler i Punjab och Bengalen, införde ett enhetligt
    myntsystem med silvermyntet *tanka* (en föregångare till rupien) och
    erkändes 1229 formellt av kalifen i Bagdad. Han fullbordade **[Qutb
    Minar](#qutb-minar)** i Delhi, ett 73 meter högt segertorn som
    fortfarande står.

    Hans viktigaste beslut var kanske att hålla sig undan mongolerna: när
    den khwarazmiske prinsen Jalal ad-Din flydde till Indien undan Djingis
    khan 1221 vägrade Iltutmish ge honom skydd, och mongolerna vände.
    Efter hans död 1236 regerade dottern **Razia** 1236–1240 – en av
    mycket få kvinnor som styrt ett muslimskt rike i eget namn.

mongoler-vid-indus:
  period: 1220
  label: "mongoler vid Indus"
  title: "Mongolerna vid Indus 1221"
  wiki:
    - "en:Battle of the Indus"
    - "en:Jalal al-Din Mangburni"
  text: |
    När Djingis khan krossade Khwarazmriket (se ”[Mongoler förstör
    Samarkand, Merv](#mongoler-forstor-samarkand-merv)”) flydde shahens
    son **Jalal ad-Din** österut. I november 1221 hann mongolerna ifatt
    honom vid floden Indus, i dagens Pakistan. Hans armé förintades, men
    enligt berättelsen red han själv sin häst ut över en flodbrant och
    simmade över – och Djingis ska ha beundrat modet och låtit honom komma
    undan.

    Djingis gick inte vidare in i Indien; hettan och bergen gjorde det
    mindre lockande, och han hade annat att göra. Men mongolerna kom
    tillbaka: under resten av 1200-talet och in på 1300-talet gjorde de
    upprepade räder in i Punjab, och nordvästgränsen blev Delhisultanatets
    huvudsakliga försvarsproblem. Sultanerna Balban och senare [Alauddin
    Khalji](#alauddin-khalji-slar-mongolerna) (kring 1300) byggde
    fästningar och höll stora stående arméer för att stoppa dem.

    Det lyckades. Till skillnad från Iran, Irak, Ryssland och Kina
    erövrades Indien aldrig av mongolerna. Det betydde också att många
    lärda och hantverkare från de förstörda städerna i Centralasien och
    Iran flydde till Delhi, som blev ett centrum för persisk kultur.
    Ironiskt nog grundades [Mogulriket 1526 av
    Babur](#babur-vinner-vid-panipat-1526-mogulriket), en ättling till
    både Djingis och Timur Lenk.

balban-delhisultanatet:
  period: 1240
  label: "Balban, Delhisultanatet"
  title: "Balban och Delhisultanatet"
  wiki:
    - "en:Ghiyath al-Din Balban"
    - "sv:Delhisultanatet"
  text: |
    **Delhisultanatet** (1206–1526) var en serie muslimska riken med Delhi
    som huvudstad, som styrde stora delar av norra Indien. Härskarna var
    turkiska eller afghanska krigare med rötter i Centralasien, och eliten
    talade persiska, medan majoriteten av befolkningen var hinduer.

    **Ghiyas ud-din Balban** var, som många i sultanatets elit, en före
    detta turkisk slav. Han tillhörde ”de fyrtio” – en grupp mäktiga
    turkiska slavofficerare. Från 1246 var han i praktiken regeringschef
    under den svage sultanen Nasir ud-din Mahmud, och 1266 blev han själv
    sultan, till sin död 1287.

    Balban är känd för att ha stärkt kungamakten hårdhänt. Han krossade
    ”de fyrtio”, som han själv tillhört, byggde upp ett spionnät och
    införde persiskt hovceremoniel: besökare skulle kasta sig ned och
    kyssa hans fötter. Han hävdade att kungen var ”Guds skugga på jorden”.
    Hans viktigaste militära uppgift var att hålla mongolerna borta från
    Punjab, där hans son dog i strid mot dem 1285. Balbans dynasti föll
    strax efter hans död och ersattes 1290 av
    [Khalji-dynastin](#khalji-dynastin-1290).

balban:
  period: 1260
  label: "Balban"
  title: "Balban, sultan av Delhi 1266–1287"
  wiki:
    - "en:Ghiyath al-Din Balban"
    - "en:Mamluk dynasty (Delhi)"
  text: |
    **Ghiyas ud-din Balban** var sultan i **Delhisultanatet** 1266–1287
    (se ”[Balban, Delhisultanatet](#balban-delhisultanatet)”). Han var en
    turkisk före detta slav och var i praktiken den verklige härskaren
    redan från 1246.

    Hans regeringstid präglades av järnhård ordning. Han lät rensa
    skogarna kring Delhi från rövarband, som gjort vägarna osäkra, och
    byggde fästningar längs vägarna. Ett uppror i Bengalen kring 1280
    slogs ned brutalt: guvernören och hans anhängare avrättades och
    hängdes upp längs basargatan i Lakhnauti. Han höll hovet strikt: inga
    skämt, inget skratt, ingen alkohol, och han gav ämbeten bara åt folk
    av hög börd.

    Hans strategi mot mongolerna var försvar. Han höll en stor stående
    armé och lät inte sultanatet expandera söderut, eftersom han ansåg att
    alla resurser behövdes i nordväst. Det var ett rimligt val: mongolerna
    hade just förstört Bagdad och höll stora delar av Afghanistan. Efter
    hans död 1287 föll dynastin snabbt; tre år senare tog Khalji-dynastin
    över, och under Alauddin Khalji (1296–1316) började sultanatet
    expandera mot södra Indien.

khalji-dynastin-1290:
  period: 1280
  label: "Khalji-dynastin 1290"
  title: "Khalji-dynastin i Delhi 1290"
  wiki:
    - "en:Khalji dynasty"
    - "en:Delhi Sultanate"
  text: |
    Sedan 1206 styrdes stora delar av norra Indien av **Delhisultanatet**
    – en muslimsk stat grundad av turkiska slavsoldater som kommit från
    Afghanistan. Majoriteten av undersåtarna var hinduer. Sultanatet
    styrdes av fem dynastier i följd fram till 1526.

    År 1290 tog **Jalaluddin Khalji** makten genom en kupp mot den förra
    dynastin. Khaljierna var en turkisk-afghansk klan som den gamla
    turkiska eliten såg ned på, så bytet var också ett skifte i vem som
    fick ingå i makteliten. Jalaluddin mördades redan 1296 av sin brorson
    **Alauddin Khalji**, som blev den stora gestalten ([se
    1300](#alauddin-khalji-slar-mongolerna)).

    Under khaljierna nådde sultanatet för första gången långt söderut:
    Alauddins general Malik Kafur plundrade riken i södra Indien ända ned
    till Madurai. Samtidigt höll man stånd mot mongolerna, som härjade i
    Iran och Afghanistan. Dynastin varade bara till 1320, då den ersattes
    av Tughluq-dynastin ([se 1320](#muhammad-bin-tughluq-ny-huvudstad)).
    Jämför: samtidigt som Delhi försvarades mot mongolerna lyckades Japan
    också slå tillbaka dem ([1274,
    1281](#mongolisk-invasion-1274-slas-tillbaka)), medan Kina, Ryssland
    och Iran erövrades.

alauddin-khalji-slar-mongolerna:
  period: 1300
  label: "Alauddin Khalji slår mongolerna"
  title: "Alauddin Khalji slår tillbaka mongolerna"
  wiki:
    - "en:Alauddin Khalji"
    - "en:Mongol invasions of India"
  text: |
    **Alauddin Khalji** var sultan i Delhi 1296–1316, inom Khalji-dynastin
    ([se 1290](#khalji-dynastin-1290)). Han tog makten genom att mörda sin
    farbror och svärfar och var hänsynslös, men en av
    [Delhisultanatets](#delhisultanatet-1206) mest framgångsrika härskare.

    Mongolerna i Centralasien – främst **Chagatai-khanatet**, en av
    mongolväldets fyra delar – anföll Indien gång på gång. 1299 och 1303
    nådde de ända fram till Delhi; 1303 belägrades staden i två månader.
    Alauddin slog tillbaka varje gång och vann flera stora slag 1305–1306,
    där tusentals mongoler dödades eller avrättades. Därefter upphörde de
    stora anfallen.

    För att kunna betala en stor stående armé genomförde han radikala
    reformer: han lät mäta upp jorden och tog ut upp till hälften av
    skörden i skatt, och han införde fasta priser på spannmål, hästar och
    andra varor i Delhi, övervakade av spioner – ett av historiens
    tidigaste exempel på statlig priskontroll. Han erövrade också Gujarat,
    Chittor och plundrade södra Indien. Indien slapp därmed mongolernas
    förödelse som drabbade Iran, Ryssland och Kina, men en ättling till
    Djingis khan, Babur, grundade ändå [Mogulriket
    1526](#babur-vinner-vid-panipat-1526-mogulriket).

muhammad-bin-tughluq-ny-huvudstad:
  period: 1320
  label: "Muhammad bin Tughluq: ny huvudstad, kopparmynt"
  title: "Muhammad bin Tughluq – sultanen med de djärva experimenten"
  wiki:
    - "en:Muhammad bin Tughluq"
    - "en:Tughlaq dynasty"
  text: |
    **Muhammad bin Tughluq** var sultan i Delhi 1325–1351, i
    **Tughluq-dynastin** som 1320 tagit över Delhisultanatet efter
    Khalji-dynastin ([se 1290](#khalji-dynastin-1290)). Han var mycket
    lärd – i filosofi, matematik, medicin och poesi – men hans stora
    reformer misslyckades, och han har fått rykte som en briljant men
    opraktisk härskare.

    Två experiment är mest kända. 1327 beordrade han att huvudstaden
    skulle flyttas från Delhi till **Daulatabad** i Deccan, cirka 1 100 km
    söderut, för att bättre kunna styra södra Indien. Stora delar av
    Delhis befolkning tvingades flytta; många dog på vägen. Några år
    senare fick de flytta tillbaka. Omkring 1330 införde han **symboliska
    mynt** i koppar och mässing som skulle gälla som silvermynt. Men
    mynten gick lätt att förfalska, och snart präglade ”varje hus ett
    myntverk”. Valutan kollapsade och staten fick lösa in de falska mynten
    mot riktiga.

    Idén – pengar vars värde bygger på statens garanti snarare än metallen
    – är densamma som i dagens valutor; Kina hade då redan papperspengar.
    Problemet var att staten inte kunde kontrollera utgivningen. Under
    hans styre bröt flera provinser sig loss, bland annat
    [Vijayanagararikets grundande 1336](#vijayanagara-1336) i söder. [Ibn
    Battuta](#ibn-battuta-reser-132554) tjänade vid hans hov.

vijayanagara-1336:
  period: 1340
  label: "Vijayanagara 1336"
  title: "Vijayanagararikets grundande 1336"
  wiki:
    - "en:Vijayanagara Empire"
    - "en:Hampi"
  text: |
    Under början av 1300-talet hade det muslimska
    **[Delhisultanatet](#delhisultanatet-1206)** i norra Indien pressat
    söderut och plundrat de hinduiska rikena i södra Indien. År 1336
    grundade två bröder, **Harihara** och **Bukka**, ett nytt rike vid
    floden Tungabhadra i dagens delstat Karnataka. Det fick namn efter
    huvudstaden Vijayanagara, ”segerns stad”.

    Riket blev under två århundraden den dominerande makten i södra Indien
    och sågs som ett bålverk för hinduisk kultur mot sultanaten i norr.
    Huvudstaden växte till en av världens största städer omkring år 1500 –
    uppskattningar varierar, ofta några hundratusen invånare – med stora
    tempel, bevattningskanaler och marknader. Portugisiska besökare
    jämförde den med Rom.

    Vijayanagara låg i ständig konflikt med sin granne i norr,
    [Bahmanisultanatet](#bahmanisultanatet-1347) (grundat 1347). Riket
    föll 1565 när en allians av muslimska sultanat besegrade det vid
    Talikota och huvudstaden plundrades. Ruinerna vid byn **Hampi** är
    idag ett världsarv och ett av Indiens största ruinområden.

bahmanisultanatet-1347:
  period: 1340
  label: "Bahmanisultanatet 1347"
  title: "Bahmanisultanatet 1347"
  wiki:
    - "en:Bahmani Sultanate"
    - "en:Muhammad bin Tughluq"
  text: |
    På 1340-talet styrdes stora delar av Indien av Delhisultanatet under
    sultanen **[Muhammad bin
    Tughluq](#muhammad-bin-tughluq-ny-huvudstad)**, känd för djärva men
    misslyckade experiment – han flyttade t.ex. huvudstaden omkring 1 100
    km söderut och tvingade befolkningen att följa med, och införde ett
    kopparmynt som snabbt förfalskades. Missnöjet ledde till uppror.

    År 1347 gjorde ståthållare i **Deccan** (högplatån i mellersta Indien)
    uppror och utropade en av sina ledare, **Alauddin Hasan Bahman Shah**,
    till sultan. Det nya muslimska sultanatet fick namnet Bahmani. Det var
    Sydindiens första självständiga muslimska rike och blev ett centrum
    för persiskspråkig kultur och arkitektur.

    I 150 år krigade Bahmani mot det hinduiska
    [Vijayanagara](#vijayanagara-1336) i söder, framför allt om den
    bördiga marken mellan floderna Krishna och Tungabhadra. Omkring
    1490–1520 föll sultanatet sönder i fem mindre sultanat, de s.k.
    Deccansultanaten. Dessa slöt sig samman 1565 och krossade
    Vijayanagara. Senare erövrades de av
    [Mogulriket](#babur-vinner-vid-panipat-1526-mogulriket). Samspelet
    mellan muslimska och hinduiska riken präglar Indiens historia ända
    fram till delningen 1947.

vijayanagara:
  period: 1360
  label: "Vijayanagara"
  title: "Vijayanagara på 1360- och 70-talen"
  wiki:
    - "en:Vijayanagara Empire"
    - "en:Bukka Raya I"
  text: |
    **Vijayanagarariket** grundades 1336 i södra Indien ([se den
    punkten](#vijayanagara-1336)) och var under 1360- och 1370-talen under
    snabb uppbyggnad. Medgrundaren **Bukka I** styrde 1356–1377 och
    utvidgade riket söderut. Hans son Kumara Kampana erövrade omkring 1370
    det lilla muslimska **Maduraisultanatet** längst i söder, som grundats
    av guvernörer från Delhisultanatet. Därmed kontrollerade Vijayanagara
    större delen av södra Indien.

    Samtidigt pågick krig mot det nya
    [Bahmanisultanatet](#bahmanisultanatet-1347) i norr. I krigen 1366–67
    nämns i en del källor tidiga krutvapen, men det är oklart vad det
    rörde sig om. De återkommande striderna gällde framför allt
    **Raichur-doab**, det bördiga landet mellan floderna Krishna och
    Tungabhadra.

    Vijayanagara fick en central roll som beskyddare av hinduiska tempel
    och av sydindiska språk och litteratur, t.ex. telugu och kannada.
    Riket var också rikt på handel: det exporterade bomullstyg, peppar och
    andra kryddor via hamnar på västkusten, och importerade hästar från
    Persien och Arabien till sitt kavalleri – en handel portugiserna
    senare tog över [efter 1498](#vasco-da-gama-i-calicut-1498).

timur-plundrar-delhi-1398:
  period: 1380
  label: "Timur plundrar Delhi 1398"
  title: "Timur plundrar Delhi 1398"
  wiki:
    - "en:Sack of Delhi (1398)"
    - "sv:Delhisultanatet"
  text: |
    **[Delhisultanatet](#delhisultanatet-1206)** var ett muslimskt rike
    som styrt stora delar av norra Indien sedan 1206. På 1390-talet var
    det kraftigt försvagat: provinser hade brutit sig loss (Bahmani,
    Bengalen m.fl.) och två rivaliserande sultaner stred om tronen.

    Hösten 1398 korsade **[Timur Lenk](#timur-lenk-i-samarkand-1370)**
    floden Indus med en stor armé. Före slaget utanför Delhi i december
    lät han enligt samtida källor avrätta omkring 100 000 fångar, som han
    ansåg vara en säkerhetsrisk – siffran är omdiskuterad. Sultanens armé,
    med stridselefanter, besegrades. Timur lovade att skona staden, men
    bråk mellan soldater och invånare ledde till att Delhi plundrades i
    flera dagar och stora delar av befolkningen dödades eller togs som
    slavar. Krönikor säger att staden var öde i två månader efteråt.

    Timur stannade bara några månader och tog med sig enorma byten och
    hantverkare till Samarkand, där de bland annat byggde den stora
    Bibi-Khanym-moskén. Delhisultanatet återhämtade sig aldrig helt. Drygt
    hundra år senare, 1526, kom Timurs ättling **Babur** från
    Centralasien, besegrade den siste Delhisultanen och grundade
    **[Mogulriket](#babur-vinner-vid-panipat-1526-mogulriket)**, som
    styrde Indien till 1857.

delhi-forsvagat-efter-timur:
  period: 1400
  label: "Delhi försvagat efter Timur"
  title: "Delhisultanatet efter Timurs plundring"
  wiki:
    - "sv:Delhisultanatet"
    - "en:Sack of Delhi (1398)"
  text: |
    **Delhisultanatet** var en serie muslimska dynastier som styrde norra
    Indien från Delhi mellan 1206 och 1526. Kring 1300-talets mitt
    omfattade det nästan hela subkontinenten.

    [I december 1398 anföll](#timur-plundrar-delhi-1398) den
    centralasiatiske erövraren **Timur** ([se
    timuriderna](#timurider-i-herat-och-samarkand)). Före slaget lät han
    enligt samtida krönikor döda uppemot 100 000 fångar, och efter segern
    plundrades Delhi i flera dagar. Staden tog decennier att återhämta
    sig. Timur stannade inte – han tog bytet och drog tillbaka till
    Samarkand.

    Efteråt fanns ingen stark makt kvar i Delhi. Den styrande
    Tughlaq-dynastin dog ut 1414 och ersattes av den svaga
    **Sayyid-dynastin** (1414–1451), som i praktiken bara styrde området
    närmast staden. Provinserna gjorde sig självständiga: Gujarat, Malwa,
    Jaunpur och Bengalen blev egna sultanat. I söder fanns redan
    [Bahmanisultanatet](#bahmani) och det hinduiska
    [Vijayanagara](#vijayanagara-1336).

    Indien under 1400-talet var alltså splittrat i många regionala stater,
    ungefär som Italien vid samma tid. Det gjorde området sårbart: 1526
    kom Timurs ättling Babur och [grundade
    Mogulriket](#babur-vinner-vid-panipat-1526-mogulriket) ([se
    Lodi-dynastin 1451](#lodi-dynastin-1451)).

vijayanagara-2:
  period: 1400
  label: "Vijayanagara"
  same_as: vijayanagara

vijayanagara-3:
  period: 1420
  label: "Vijayanagara"
  same_as: vijayanagara

bahmani:
  period: 1420
  label: "Bahmani"
  title: "Bahmanisultanatet i Dekan"
  wiki:
    - "en:Bahmani Sultanate"
    - "en:Bidar"
  text: |
    **Bahmanisultanatet** var ett muslimskt rike på **Dekanplatån**, det
    stora höglandet i centrala och södra Indien. Det [grundades
    1347](#bahmanisultanatet-1347) när en general, Alauddin Bahman Shah,
    gjorde uppror mot [Delhisultanatet](#delhisultanatet-1206).

    Riket låg i nästan ständigt krig med det hinduiska
    **[Vijayanagara](#vijayanagara-1336)** i söder, om den bördiga
    Raichur-regionen mellan floderna Krishna och Tungabhadra. Krigen var
    mycket blodiga; krönikorna nämner tiotusentals dödade i enskilda
    kampanjer.

    Omkring 1425 flyttades huvudstaden från Gulbarga till **Bidar**. Hovet
    drog till sig persiska och centralasiatiska invandrare – soldater,
    administratörer, poeter – vilket gav en spänning mellan nykomlingarna
    och de lokala muslimerna (*dakhni*). Den mest kända ministern, persern
    **Mahmud Gawan**, moderniserade förvaltningen men avrättades 1481
    efter en intrig.

    Den ryske handelsmannen **Afanasij Nikitin** besökte riket på
    1470-talet och skrev en av de första europeiska reseskildringarna från
    Indien. Efter cirka 1490–1518 föll Bahmani sönder i fem efterföljande
    sultanat (Dekansultanaten), som tillsammans krossade
    Vijayanagara 1565.

lodi-dynastin-1451:
  period: 1440
  label: "Lodi-dynastin 1451"
  title: "Lodi-dynastin i Delhi 1451"
  wiki:
    - "en:Lodi dynasty"
    - "en:Bahlul Lodi"
  text: |
    Efter [Timurs plundring av Delhi 1398](#timur-plundrar-delhi-1398) var
    **Delhisultanatet** en skugga av sitt forna jag ([se Delhi försvagat
    efter Timur](#delhi-forsvagat-efter-timur)). 1451 tog **Bahlul Lodi**
    makten, en afghansk adelsman och guvernör i Punjab. **Lodi-dynastin**
    var den första afghanska (pashtunska) dynastin som styrde Delhi, och
    den sista dynastin i sultanatet.

    Bahlul (styrde 1451–1489) återtog områden som fallit bort, särskilt
    sultanatet Jaunpur i öster. Han styrde genom att dela makten med
    afghanska stamledare, som såg honom mer som den främste bland jämlikar
    än som en enväldig kung.

    Hans son **Sikandar Lodi** (1489–1517) flyttade 1504 huvudstaden till
    **Agra**, som senare blev Mogulrikets huvudstad och där Taj Mahal
    byggdes. Barnbarnet **Ibrahim Lodi** försökte stärka kungamakten på
    adelns bekostnad och gjorde sig många fiender.

    Adelsmän i Punjab bjöd då in **Babur**, timurid från Kabul. Vid slaget
    vid **[Panipat](#babur-vinner-vid-panipat-1526-mogulriket)** 1526
    besegrade Baburs cirka 12 000–25 000 man Ibrahims uppskattningsvis 50
    000–100 000, tack vare kanoner och musköter. Ibrahim stupade, och
    Mogulriket grundades. Lodigravarna i Lodiparken i New Delhi finns
    kvar.

guru-nanak-fodd-1469-sikhismen:
  period: 1460
  label: "Guru Nanak född 1469: sikhismen"
  title: "Guru Nanak och sikhismens födelse"
  wiki:
    - "en:Guru Nanak"
    - "en:Sikhism"
  text: |
    **Guru Nanak** (1469–1539) föddes i Punjab, i dagens Pakistan, i en
    hinduisk familj i ett område med många muslimer. Han reste mycket och
    predikade att det finns en enda Gud bortom både hinduismens och islams
    former, och att människan når Gud genom meditation, ärligt arbete och
    tjänande av andra – inte genom ritualer.

    Han avvisade kastsystemet, det hinduiska systemet där människor föds
    in i fasta samhällsgrupper. Ett synligt uttryck är *langar*: en
    gemensam köksmåltid där alla, oavsett kast eller religion, äter
    sittande på samma golv. Den traditionen lever kvar i varje sikhtempel.

    Efter Nanak följde nio guruer (andliga ledare). Den femte lät bygga
    Gyllene templet i Amritsar, och den tionde gjorde 1708 den heliga
    skriften *Guru Granth Sahib* till sikhernas eviga guru. Sikhismen har
    i dag uppskattningsvis 25–30 miljoner anhängare, de flesta i Punjab,
    och är därmed en av världens största religioner. Samtidigt pågick i
    Europa den kritik av kyrkan som ledde till [reformationen
    1517](#luther-95-teser-1517).

vasco-da-gama-i-calicut-1498:
  period: 1480
  label: "Vasco da Gama i Calicut 1498"
  title: "Vasco da Gama når Indien 1498"
  wiki:
    - "en:Vasco da Gama"
    - "en:Zamorin"
  text: |
    **Vasco da Gama** lämnade Lissabon i juli 1497 med fyra skepp och
    omkring 170 man. Han rundade Godahoppsudden ([se Dias
    1488](#dias-rundar-godahoppsudden-1488)), seglade upp längs Östafrika
    och fick i Malindi (i dagens Kenya) en lokal lots som kände
    monsunvindarna. På drygt tre veckor korsade de Indiska oceanen och
    nådde **Calicut** (Kozhikode) på Indiens sydvästkust i maj 1498.

    Calicut var ett nav i den uråldriga handeln i Indiska oceanen, där
    arabiska, persiska, indiska och kinesiska köpmän handlade med peppar,
    kanel, ingefära och tyg. Härskaren, *zamorin*, var föga imponerad av
    portugisernas enkla gåvor. Ändå var kryddorna da Gama tog hem värda
    uppskattningsvis 60 gånger resans kostnad. Bara ungefär 55 av
    besättningen överlevde, främst på grund av skörbjugg.

    Det var första gången Europa och Asien förbands med en direkt sjöväg.
    Portugal byggde snabbt ett nätverk av fästen med våld ([Goa
    1510](#portugisisk-goa-1510), [Malacka
    1511](#portugiser-tar-malacka-1511)). Venedigs och Egyptens
    kryddhandel försvagades. Det var början på 450 år av europeisk
    kolonialmakt i Asien, som slutade med Indiens självständighet 1947.

portugisisk-goa-1510:
  period: 1500
  label: "Portugisisk Goa 1510"
  title: "Portugal erövrar Goa 1510"
  wiki:
    - "en:Portuguese conquest of Goa"
    - "en:Afonso de Albuquerque"
    - "en:Portuguese India"
  text: |
    **Afonso de Albuquerque** (ca 1453–1515) var Portugals guvernör i
    Indien och arkitekten bakom det portugisiska väldet i Asien. Hans plan
    var att kontrollera Indiska oceanens handel genom ett fåtal starka
    befästa hamnar vid nyckelpunkter, i stället för att erövra stora
    landområden.

    1510 erövrade han **Goa**, en ö- och hamnstad på Indiens västkust som
    tillhörde sultanatet Bijapur. Första försöket i mars misslyckades; i
    november intog han staden och lät enligt egna rapporter döda den
    muslimska befolkningen. Goa blev huvudstad för *Estado da Índia*,
    Portugals asiatiska imperium, med fästen från Moçambique till Macao.
    Albuquerque tog sedan [Malacka 1511](#portugiser-tar-malacka-1511) och
    Hormuz 1515.

    Goa blev ”Österns Rom” med stora kyrkor. Här verkade jesuitmissionären
    [Franciskus Xavier](#francisco-xavier-1549), och här inrättades 1560
    en inkvisition. Portugal hade inte resurser att erövra Indien, och
    holländare och britter tog över sjöhandeln på 1600-talet. Men Goa
    förblev portugisiskt i 451 år, ända tills Indien tog det med militär
    makt 1961.

babur-vinner-vid-panipat-1526-mogulriket:
  period: 1520
  label: "Babur vinner vid Panipat 1526: Mogulriket"
  title: "Panipat 1526 – Mogulriket grundas"
  wiki:
    - "sv:Mogulriket"
    - "sv:Babur"
    - "en:First Battle of Panipat"
  text: |
    **Babur** (1483–1530) var en furste från Centralasien, ättling till
    både Timur Lenk och Djingis khan. Han förlorade sitt arvsrike i dagens
    Uzbekistan, tog i stället Kabul och vände sig sedan mot Nordindien,
    som då styrdes av Delhisultanatet under Ibrahim Lodi.

    Vid Panipat norr om Delhi 21 april 1526 besegrade Babur med
    uppskattningsvis 12 000–25 000 man en armé som var flera gånger
    större, kanske 50 000–100 000 man och ett hundratal krigselefanter.
    Avgörande var fältkanoner och musköter, som Babur lärt sig använda av
    osmanerna, och en taktik med sammanbundna kärror som skydd. Det var
    ett av de första slagen i Indien där krut var avgörande.

    Därmed grundades **Mogulriket**, som på sin topp omkring 1700 styrde
    nästan hela Indien med uppskattningsvis 100–150 miljoner invånare och
    en stor del av världens produktion. Babur dog redan 1530, sonen
    Humayun förlorade riket (se [Humayun i exil i
    Persien](#humayun-i-exil-i-persien)), men [sonsonen
    Akbar](#akbar-1556) byggde upp det igen. [Taj
    Mahal](#taj-mahal-paborjas-1632) byggdes av en senare mogulkejsare.

akbar-1556:
  period: 1540
  label: "Akbar 1556"
  title: "Akbar blir mogulkejsare 1556"
  wiki:
    - "sv:Akbar den store"
    - "en:Akbar"
  text: |
    **Akbar** (1542–1605) blev kejsare av Mogulriket i Indien vid 13 års
    ålder 1556, när hans far [Humayun](#humayun-i-exil-i-persien) dog bara
    ett år efter att ha återtagit Delhi. Riket var då litet och hotat.
    Samma år besegrade Akbars förmyndare Bairam Khan den hinduiske
    generalen Hemu i det andra slaget vid Panipat – på samma slagfält där
    [Babur](#babur-vinner-vid-panipat-1526-mogulriket) grundat riket 30 år
    tidigare.

    Akbar regerade i nästan 50 år och räknas som mogulernas störste
    härskare. Han utvidgade riket till större delen av Nordindien och
    delar av Deccan. Han byggde en effektiv förvaltning där ämbetsmän
    rangordnades efter hur många ryttare de skulle hålla (mansab-systemet)
    och ett skattesystem baserat på uppmätta skördar.

    Mest känd är hans religiösa politik: Akbar var muslim men styrde en
    hinduisk majoritet. Han avskaffade 1564 den särskilda skatten för
    icke-muslimer (jizya), gifte sig med rajputiska (hinduiska) prinsessor
    och höll religionsdebatter. Se även Akbar och [Fatehpur Sikri
    ~1570](#fatehpur-sikri). Han var samtida med Elisabet I och Filip II.

akbar:
  period: 1560
  label: "Akbar"
  title: "Akbar den store (1556–1605)"
  wiki:
    - "sv:Akbar den store"
    - "en:Akbar"
  text: |
    **Akbar** var den tredje mogulkejsaren i Indien (se [Akbar
    1556](#akbar-1556)) och regerade i nästan 50 år. Under 1560–70-talen
    expanderade han riket: Rajputana (dagens Rajasthan) genom en blandning
    av erövring – belägringen av Chittor 1568 slutade i en massaker på
    tusentals – och allianser med rajputiska furstar, som fick höga
    poster. Gujarat med dess rika hamnar togs 1573 och Bengalen 1576. Vid
    hans död styrde han uppskattningsvis 100 miljoner människor – ungefär
    lika många som hela Europa.

    Han var själv sannolikt dyslektiker och kunde knappt läsa, men samlade
    ett bibliotek på tiotusentals handskrifter och lät läsa högt för sig.
    Från 1575 höll han religionsdebatter mellan muslimer, hinduer, jainer,
    zoroastrier och jesuiter i ”gudstjänsthuset” i [Fatehpur
    Sikri](#fatehpur-sikri) (se Fatehpur Sikri). Han formulerade en
    politik av ”fred med alla” (sulh-i kul) och skapade till och med en
    egen eklektisk andlig rörelse, Din-i Ilahi, med få anhängare.

    Hans tolerans gjorde Mogulriket stabilt i ett land med hinduisk
    majoritet. Hans barnbarnsbarn [Aurangzeb](#aurangzeb-1658) (1658–1707)
    övergav den politiken, vilket bidrog till rikets nedgång på
    1700-talet.

fatehpur-sikri:
  period: 1560
  label: "Fatehpur Sikri"
  title: "Fatehpur Sikri"
  wiki:
    - "sv:Fatehpur Sikri"
    - "en:Fatehpur Sikri"
  text: |
    **Fatehpur Sikri** är en stad som mogulkejsaren [Akbar](#akbar-1556)
    lät bygga från omkring 1571, cirka 40 km väster om Agra i norra
    Indien. Platsen valdes för att en sufihelig man, Salim Chishti, där
    hade förutsagt födelsen av Akbars efterlängtade son, senare kejsar
    [Jahangir](#jahangir). Namnet betyder ungefär ”segerstaden Sikri”,
    efter Akbars erövring av Gujarat 1573.

    Staden byggdes i röd sandsten på ungefär 15 år och var en tid
    Mogulrikets huvudstad. Den blandar islamisk, persisk och hinduisk
    byggnadskonst – en spegel av Akbars politik. Mest kända är den stora
    moskén med porten Buland Darwaza, omkring 54 meter hög, och Ibadat
    Khana, ”gudstjänsthuset”, där Akbar höll debatter mellan företrädare
    för olika religioner.

    Redan omkring 1585 lämnade Akbar staden, troligen av politiska och
    militära skäl, och möjligen för att vattenförsörjningen var
    otillräcklig. Den förföll men är unikt välbevarad, eftersom ingen
    byggde om den senare. Idag är den med på Unescos världsarvslista.
    Jämför med [Taj Mahal](#taj-mahal-paborjas-1632) i närliggande Agra,
    byggt ett halvsekel senare av Akbars sonson.

akbar-2:
  period: 1580
  label: "Akbar"
  same_as: akbar

engelska-handelsman:
  period: 1580
  label: "engelska handelsmän"
  title: "De första engelska handelsmännen i Indien"
  wiki:
    - "en:Ralph Fitch"
    - "sv:Mogulriket"
  text: |
    Indien styrdes på 1580-talet till stor del av **Mogulriket**, grundat
    1526 [av Babur](#babur-vinner-vid-panipat-1526-mogulriket), en ättling
    till Djingis khan och Timur lenk från Centralasien. Under kejsar
    **[Akbar](#akbar-1556)** (regerade 1556–1605) var det ett av världens
    rikaste länder, med uppskattningsvis 100–150 miljoner invånare –
    ungefär som hela Europa – och stor export av bomullstyger och kryddor.

    Portugiserna hade sedan [Vasco da Gamas resa
    1498](#vasco-da-gama-i-calicut-1498) dominerat Europas sjöhandel med
    Indien. Engelsmännen ville in. 1583 reste en grupp engelska köpmän,
    bland dem **Ralph Fitch**, över land via Syrien och Persiska viken mot
    Indien. De greps av portugiserna i Hormuz, flydde och nådde Akbars
    hov. Fitch reste vidare till Bengalen, Burma och Malackka och kom
    hem 1591.

    Hans berättelser om rikedomarna i Östern bidrog till att Londons
    köpmän år 1600 grundade [Ostindiska
    kompaniet](#ostindiska-kompaniet-1600) (se där). Det började som ett
    rent handelsföretag men tog under 1700- och 1800-talen politisk
    kontroll över stora delar av Indien – en utveckling ingen kunde
    ana 1583.

jahangir:
  period: 1600
  label: "Jahangir"
  title: "Mogulkejsaren Jahangir (1605–1627)"
  wiki:
    - "sv:Jahangir"
    - "en:Nur Jahan"
  text: |
    **Jahangir** (1569–1627) var Mogulrikets fjärde kejsare, son till den
    [store Akbar](#akbar-1556). Mogulriket omfattade då större delen av
    norra och centrala Indien och var, med uppskattningsvis 100–150
    miljoner invånare, ett av världens folkrikaste och rikaste riken.
    Jahangirs namn betyder ”världserövraren”, men hans regering 1605–1627
    var mest fredlig.

    Han var mer intresserad av konst, natur och vin (och opium) än av
    krig. Under honom nådde mogulmåleriet – detaljerade miniatyrmålningar
    av djur, växter och hovliv – sin höjdpunkt, och han skrev en utförlig
    dagbok. Stor makt låg hos hans hustru **Nur Jahan**, en av få kvinnor
    i historien som i praktiken styrde ett så stort rike; mynt präglades i
    hennes namn.

    1615 tog han emot den engelske sändebudet Thomas Roe, som förhandlade
    fram handelsrättigheter åt [Ostindiska
    kompaniet](#ostindiska-kompaniet-1600) ([se
    Surat](#engelsk-handel-i-surat)). Jahangirs son **Shah Jahan**
    efterträdde honom 1628 och lät bygga [Taj
    Mahal](#taj-mahal-paborjas-1632). Jämför: det engelska kompaniet var
    då en obetydlig gäst vid ett hov som var många gånger rikare än
    Englands.

engelsk-handel-i-surat:
  period: 1600
  label: "engelsk handel i Surat"
  title: "Engelska handelsstationen i Surat"
  wiki:
    - "sv:Surat"
    - "en:Battle of Swally"
  text: |
    **Surat** i Gujarat, vid Indiens västkust norr om dagens Mumbai, var
    Mogulrikets viktigaste hamn. Därifrån seglade pilgrimsfartyg till
    Mecka och handelsskepp till Persiska viken och Sydostasien; staden
    hade kanske 100 000–200 000 invånare och var en av världens största
    hamnar.

    Det engelska Ostindiska kompaniet ([se
    1600](#ostindiska-kompaniet-1600)) ville ha fotfäste i Indien men
    stoppades av portugiserna. 1612 slog en liten engelsk flotta
    portugiserna i slaget vid Swally utanför Surat. Det imponerade på
    mogulmyndigheterna, och 1613 fick engelsmännen tillstånd av kejsar
    [Jahangir](#jahangir) att öppna en handelsstation – en ”faktori”, dvs.
    ett lager med kontor och bostäder för köpmännen. Sändebudet Thomas Roe
    utvidgade rättigheterna 1615–1619.

    Surat var kompaniets huvudkontor i Indien fram till 1687, då det
    flyttades till Bombay, som England fått från Portugal 1661 som
    hemgift. Härifrån köptes bomullstyger som blev enormt populära i
    Europa (ord som calico och chintz kommer från Indien). Det var det
    första steget i den process som slutade med brittiskt styre över hela
    Indien.

taj-mahal-paborjas-1632:
  period: 1620
  label: "Taj Mahal påbörjas 1632"
  title: "Taj Mahal påbörjas 1632"
  wiki:
    - "sv:Taj Mahal"
    - "sv:Shah Jahan"
  text: |
    **[Mogulriket](#babur-vinner-vid-panipat-1526-mogulriket)** var ett
    muslimskt imperium som dominerade större delen av Indien från 1526
    till början av 1700-talet. Mogulerna härstammade från Centralasien
    (ättlingar till Timur Lenk och Djingis khan). Kring 1600 hade riket
    uppskattningsvis 100–150 miljoner invånare – i samma storleksordning
    som hela Europa – och var en av världens rikaste stater.

    Stormogulen **Shah Jahan** (regerade 1628–1658) lät 1632 börja bygga
    **Taj Mahal** i Agra som gravmonument över sin hustru Mumtaz Mahal,
    som dött 1631 i sitt fjortonde barnafödande. Uppskattningsvis 20 000
    arbetare byggde i omkring tjugo år; huvudbyggnaden stod klar runt 1643
    och hela anläggningen 1653.

    Byggnaden är av vit marmor med inlagda halvädelstenar och kupolen är
    ungefär 73 meter hög. Den kostsamma byggverksamheten (Shah Jahan
    byggde också Röda fortet i Delhi) tärde på statskassan. Han avsattes
    1658 av sin son [Aurangzeb](#aurangzeb-1658) ([se
    1660-talet](#aurangzeb-1658)) och tillbringade sina sista år fången i
    Agras fort, med utsikt mot Taj Mahal.

taj-mahal-klart-1653:
  period: 1640
  label: "Taj Mahal klart 1653"
  title: "Taj Mahal står klart 1653"
  wiki:
    - "sv:Taj Mahal"
    - "en:Mughal architecture"
  text: |
    **Taj Mahal** i Agra i norra Indien är ett gravmonument som
    stormogulen **Shah Jahan** lät bygga åt sin hustru Mumtaz Mahal ([se
    1632](#taj-mahal-paborjas-1632)). Huvudbyggnaden var klar runt 1643,
    och hela anläggningen med trädgårdar, moské, gästhus och portbyggnader
    runt 1653.

    Anläggningen är cirka 580 × 300 meter. Mausoleet är byggt av vit
    marmor från Makrana, cirka 400 km bort, med inlagda halvädelstenar
    från bland annat Tibet, Sri Lanka och Afghanistan. Enligt traditionen
    användes över 1 000 elefanter för transporterna. Kostnaden
    uppskattades i samtida källor till omkring 32 miljoner rupier – ett
    mycket stort belopp, men uppgiften är osäker.

    Arkitekturen förenar persiska, islamiska och indiska drag: perfekt
    symmetri kring en mittaxel, fyra minareter och en paradisträdgård
    indelad i fyra delar (charbagh). Den räknas som höjdpunkten av
    mogularkitekturen. Kort efter att den blev klar avsattes Shah Jahan av
    sonen Aurangzeb ([se 1658](#aurangzeb-1658)). Idag har Taj Mahal
    uppskattningsvis 6–8 miljoner besökare per år och är världsarv
    sedan 1983.

aurangzeb-1658:
  period: 1660
  label: "Aurangzeb 1658"
  title: "Aurangzeb blir stormogul 1658"
  wiki:
    - "sv:Aurangzeb"
    - "sv:Mogulriket"
  text: |
    **Aurangzeb** (1618–1707) var den siste av de stora härskarna i
    **Mogulriket**, det muslimska imperium som dominerade Indien. Han var
    son till Shah Jahan, [Taj Mahals](#taj-mahal-paborjas-1632) byggherre.
    När fadern blev sjuk 1657 utbröt tronföljdskrig mellan de fyra
    bröderna. Aurangzeb vann 1658, lät avrätta sina bröder och spärrade in
    sin far i Agras fort, där han satt till sin död 1666.

    Aurangzeb regerade i nästan 50 år. Han var en from sunnimuslim och
    styrde mer strikt religiöst än sina föregångare: han återinförde 1679
    *jizya*, en särskild skatt för icke-muslimer, och lät förstöra en del
    hinduiska tempel. Detta skapade motstånd bland hinduer, sikher och
    rajputer (krigararistokratin i Rajasthan).

    Under honom nådde riket sin största utbredning, med nästan hela
    Indiens subkontinent och uppskattningsvis 150 miljoner invånare; det
    beräknas ha stått för omkring en fjärdedel av världens ekonomiska
    produktion. Men han tillbringade sina sista 25 år i fältkrig i södra
    Indien mot maratherna (se [Shivaji](#shivaji-maratherna)), vilket
    tömde statskassan. [Efter hans död
    1707](#aurangzeb-dor-1707-mogulriket-faller) föll riket sönder, vilket
    öppnade för [Brittiska Ostindiska
    kompaniet](#ostindiska-kompaniet-1600).

shivaji-maratherna:
  period: 1660
  label: "Shivaji, maratherna"
  title: "Shivaji och maratherna"
  wiki:
    - "en:Shivaji"
    - "en:Maratha Confederacy"
  text: |
    **Maratherna** är ett folk i västra Indien, i nuvarande delstaten
    Maharashtra (med Mumbai). Området är bergigt, med branta platåer som
    är svåra att erövra. Där bodde hinduiska krigare som tjänat olika
    muslimska sultanat.

    **Shivaji** (1630–1680) var en marathisk adelsman som från 1640-talet
    byggde upp ett eget rike genom att inta bergsfästningar. Han förde
    gerillakrig med lätt kavalleri mot det muslimska sultanatet Bijapur
    och mot [Aurangzeb](#aurangzeb-1658)s mogulrike. Kända episoder: 1659
    dödade han Bijapurs general Afzal Khan vid ett möte där båda
    misstänkte förräderi; 1664 plundrade han den rika mogulhamnen Surat;
    1666 flydde han från fångenskap hos Aurangzeb i Agra, enligt sägnen
    gömd i en fruktkorg. Han byggde också en flotta.

    1674 kröntes han till *chhatrapati*, kung, i ett hinduiskt rike. Efter
    hans död fortsatte maratherna kampen, och på 1700-talet blev
    Maratharikets förbund den största makten i Indien, [tills britterna
    besegrade det 1818](#marathakrigen). Shivaji är idag en stor
    nationalhjälte i Maharashtra; Mumbais flygplats och huvudstation är
    uppkallade efter honom.

engelsk-calcutta-1690:
  period: 1680
  label: "Engelsk Calcutta 1690"
  title: "Calcutta grundas 1690"
  wiki:
    - "sv:Kolkata"
    - "sv:Brittiska Ostindiska Kompaniet"
  text: |
    1690 slog sig **Job Charnock**, agent för [det engelska Ostindiska
    kompaniet](#ostindiska-kompaniet-1600), ner vid floden Hooghly i
    Bengalen i östra Indien. Kompaniet var ett privat aktiebolag med
    monopol på Englands handel med Asien. Platsen omfattade då tre byar;
    kompaniet köpte rättigheterna till dem 1698 och byggde Fort William.

    Bengalen var ett av världens rikaste områden, med export av
    bomullstyger, siden, salpeter (till krut) och senare opium. Calcutta
    (idag Kolkata) blev kompaniets viktigaste bas. Efter slaget vid
    [Plassey 1757](#plassey-1757-ostindiska-kompaniet-tar) tog kompaniet
    makten över Bengalen, och Calcutta var huvudstad i Brittiska Indien
    fram till 1911.

    Staden växte till en av Asiens största; idag har storstadsområdet
    omkring 15 miljoner invånare. Jämför de andra kompanibaserna: Madras
    (1639) och Bombay (som England fick 1661 som hemgift). Från de tre
    handelsplatserna byggdes Brittiska Indien.

aurangzeb-dor-1707-mogulriket-faller:
  period: 1700
  label: "Aurangzeb dör 1707: Mogulriket faller sönder"
  title: "Aurangzeb dör 1707"
  wiki:
    - "sv:Aurangzeb"
    - "sv:Mogulriket"
  text: |
    **Mogulriket** var ett muslimskt imperium i Indien, grundat 1526 av
    Babur, ättling till Djingis khan och Timur Lenk. Det hade byggt [Taj
    Mahal](#taj-mahal-paborjas-1632) och var på 1600-talet ett av världens
    rikaste stater, med uppskattningsvis 100–150 miljoner invånare – fler
    än hela Europa – och kanske en fjärdedel av världens produktion.

    **[Aurangzeb](#aurangzeb-1658)** regerade 1658–1707. Han tog makten
    genom att fängsla sin far Shah Jahan och avrätta sina bröder. Under
    honom nådde riket sin största utbredning, nästan hela subkontinenten.
    Men han var en sträng sunnimuslim som återinförde extraskatten för
    icke-muslimer och rev vissa hinduiska tempel, och han förde krig i
    över 25 år mot **[marathas](#shivaji-maratherna)**, ett hinduiskt
    krigarfolk i västra Indien. Krigen var mycket kostsamma.

    Efter hans död 1707 följde arvsstrider, och provinsguvernörer gjorde
    sig i praktiken självständiga. Inom ett halvsekel var kejsaren i Delhi
    en marionett. In i tomrummet steg marathas och senare det brittiska
    Ostindiska kompaniet (se [Mogulriket i
    upplösning](#mogulriket-i-upplosning)).

mogulriket-i-upplosning:
  period: 1720
  label: "Mogulriket i upplösning"
  title: "Mogulriket i upplösning"
  wiki:
    - "sv:Mogulriket"
    - "en:Maratha Confederacy"
  text: |
    Efter [Aurangzebs död 1707](#aurangzeb-dor-1707-mogulriket-faller) (se
    den) föll **Mogulriket**, det muslimska imperium som styrt större
    delen av Indien i 200 år, sönder. Mellan 1707 och 1719 avlöste sju
    kejsare varandra, flera mördade. Provinsguvernörerna (nawaber och
    nizamer) i Bengalen, Hyderabad och Awadh gjorde sig i praktiken
    självständiga, även om de fortfarande formellt erkände kejsaren.

    Det hinduiska maratha-förbundet i väst expanderade snabbt och tog
    skatt från stora delar av Indien. [1739 plundrade den persiske
    härskaren Nader Shah Delhi](#nader-shah-plundrar-delhi-1739) ([se
    Nader Shah](#nader-shah)), och 1757–1761 kom upprepade afghanska
    invasioner. Marathas själva förlorade mot afghanerna i slaget vid
    Panipat 1761, där uppskattningsvis 60 000–70 000 dog på en dag.

    I detta kaos kunde det brittiska Ostindiska kompaniet, ursprungligen
    ett handelsbolag, värva indiska soldater och ta över. Efter [Plassey
    1757](#plassey-1757-ostindiska-kompaniet-tar) kontrollerade det
    Bengalen, och 1858 avsattes den siste mogulkejsaren formellt. Jämför
    med hur det romerska rikets splittring gav nya makter utrymme.

plassey-1757-ostindiska-kompaniet-tar:
  period: 1740
  label: "Plassey 1757: Ostindiska kompaniet tar Bengalen"
  title: "Slaget vid Plassey 1757"
  wiki:
    - "sv:Slaget vid Plassey"
    - "en:Robert Clive"
  text: |
    Det brittiska **[Ostindiska kompaniet](#ostindiska-kompaniet-1600)**
    var ett privat aktiebolag i London med monopol på brittisk handel med
    Asien – och med egen armé. I Bengalen, Indiens rikaste region med
    uppskattningsvis 20–30 miljoner invånare, hamnade kompaniet i konflikt
    med den lokale härskaren, **nawaben** (guvernören) Siraj ud-Daulah.

    Den 23 juni 1757 möttes de vid Plassey. Kompaniets befälhavare
    **Robert Clive** hade ungefär 3 000 man, varav omkring 800–1 000
    européer och resten indiska soldater, så kallade sepoyer. Nawaben hade
    uppskattningsvis 50 000. Men Clive hade i förväg mutat nawabens
    general Mir Jafar, som höll sina trupper utanför striden. Slaget var
    mer en förhandlad kupp än en militär seger.

    Mir Jafar blev ny nawab men var i praktiken kompaniets marionett. 1765
    fick kompaniet rätten att ta ut skatt i hela Bengalen. Det var början
    på brittiskt styre i Indien, som varade i 190 år till 1947. Jämför:
    ett börsbolag som tar över en stat med fler invånare än hela
    Storbritannien.

    Se även [Nader Shah plundrar Delhi
    1739](#nader-shah-plundrar-delhi-1739), som försvagade Mogulriket.

    Fortsättningen: [Britterna dominerar
    Bengalen](#britterna-dominerar-bengalen).

britterna-dominerar-bengalen:
  period: 1760
  label: "Britterna dominerar Bengalen"
  title: "Britterna dominerar Bengalen"
  wiki:
    - "en:Company rule in India"
    - "en:Warren Hastings"
  text: |
    Efter slaget vid [Plassey
    1757](#plassey-1757-ostindiska-kompaniet-tar) och slaget vid Buxar
    1764 fick det brittiska **[Ostindiska
    kompaniet](#ostindiska-kompaniet-1600)** 1765 *diwani*, rätten att ta
    ut skatt i Bengalen, Bihar och Orissa – ett område med
    uppskattningsvis 20–30 miljoner invånare. Ett handelsbolag hade blivit
    en stat.

    Det första decenniet var i praktiken organiserad plundring. Kompaniets
    anställda tjänade enorma förmögenheter på privat handel och mutor;
    Robert Clive kom hem som en av Storbritanniens rikaste män.
    Skatteintäkterna användes för att köpa indiska varor för export, så
    pengarna flödade ut ur landet. När [svälten 1770](#svalt-1770) slog
    till pressades skatterna ändå ut.

    Skandalerna fick det brittiska parlamentet att ingripa. Regulating Act
    1773 gav London viss kontroll, och **Warren Hastings** blev Bengalens
    första generalguvernör. Han ställdes senare inför riksrätt i en
    process som pågick 1788–1795, men friades. Bengalen blev basen för den
    brittiska erövringen av resten av Indien; Calcutta var huvudstad i
    Brittiska Indien till 1911.

svalt-1770:
  period: 1760
  label: "svält 1770"
  title: "Svälten i Bengalen 1770"
  wiki:
    - "en:Great Bengal famine of 1770"
  text: |
    1768–1769 slog monsunregnen fel i Bengalen och risskördarna
    förstördes. Under 1770 dog uppskattningsvis omkring 10 miljoner
    människor av svält och sjukdomar – ofta anges en tredjedel av
    befolkningen, även om moderna forskare menar att siffran kan vara
    överdriven och att det verkliga dödstalet är osäkert. Som jämförelse
    hade hela Sverige då knappt 2 miljoner invånare.

    Torkan var en naturhändelse, men styret förvärrade den. Bengalen hade
    fem år tidigare kommit under det brittiska [Ostindiska
    kompaniets](#ostindiska-kompaniet-1600) skatteförvaltning ([se
    Britterna dominerar Bengalen](#britterna-dominerar-bengalen)).
    Kompaniet sänkte inte skatterna under krisen, och dess handlare
    anklagades för att ha köpt upp ris och sålt det dyrt. Det fanns inga
    reserver eller nödhjälp att tala om.

    Svälten blev en skandal i London och bidrog till att parlamentet
    började reglera kompaniet 1773. Den var den första av flera stora
    svältkatastrofer under brittiskt styre i Indien; den sista, i Bengalen
    1943, dödade uppskattningsvis 2–3 miljoner. Ekonomen Amartya Sen har
    visat att svält oftare beror på fördelning och politik än på absolut
    matbrist.

tipu-sultan:
  period: 1780
  label: "Tipu Sultan"
  title: "Tipu Sultan (1750–1799)"
  wiki:
    - "sv:Tipu Sultan"
    - "en:Mysorean rockets"
  text: |
    **Tipu Sultan** var härskare över **Mysore** i södra Indien 1782–1799.
    Hans far Hyder Ali, en officer som tagit makten, hade gjort Mysore
    till en av de starkaste indiska staterna. Tipu kallades ”Mysores
    tiger” och använde tigern som symbol överallt.

    Han var britternas farligaste motståndare i Indien och utkämpade fyra
    krig mot [Ostindiska kompaniet](#ostindiska-kompaniet-1600)
    tillsammans med fadern. Han moderniserade armén, sökte allians med
    [revolutionens Frankrike](#franska-revolutionen-1789) och sände
    sändebud ända till [Napoleon](#napoleon). Mysore var känt för sina
    **järnrör-raketer**, med räckvidd på uppemot en kilometer, som skrämde
    de brittiska trupperna. Britterna studerade erövrade raketer, och
    William Congreve utvecklade utifrån dem de Congreve-raketer som
    användes i Napoleonkrigen – och som nämns i USA:s nationalsång (”the
    rockets' red glare”).

    1799 stormade britterna hans huvudstad Seringapatam och Tipu stupade.
    Mysore blev en brittisk lydstat. Med honom försvann det sista stora
    hindret för brittisk dominans i södra Indien. I dagens Indien är han
    omstridd: frihetshjälte för vissa, religiös förtryckare för andra.

marathakrigen:
  period: 1800
  label: "Marathakrigen"
  title: "Marathakrigen 1775–1818"
  wiki:
    - "en:Anglo-Maratha wars"
    - "sv:Marathariket"
  text: |
    **Marathariket** var en hinduisk stormakt i västra och centrala Indien
    som från slutet av 1600-talet tog över stora delar av det
    sönderfallande Mogulriket (det muslimska kejsardöme som styrt större
    delen av Indien sedan 1500-talet). Omkring 1760 dominerade
    marathaförbundet en stor del av subkontinenten.

    Brittiska Ostindiska kompaniet, ett privat handelsbolag med egen armé,
    utkämpade tre krig mot marathas: 1775–1782, 1803–1805 och 1817–1818. I
    det andra kriget besegrade generalen Arthur Wellesley – senare
    hertigen av Wellington som slog Napoleon vid
    [Waterloo](#waterloo-1815) – marathas vid Assaye 1803. I det tredje
    kriget upplöstes riket och dess land annekterades.

    Efter 1818 var kompaniet den överlägset starkaste makten i Indien.
    Kvar fanns främst sikhernas rike i Punjab (erövrat 1849) och
    hundratals vasallfurstendömen. Detta ledde fram till att en handfull
    brittiska tjänstemän och en armé på huvudsakligen indiska soldater
    styrde ett land med uppskattningsvis 150–200 miljoner invånare – och
    till spänningarna som bröt ut i [Sepoyupproret
    1857](#sepoyupproret-1857).

sepoyupproret-1857:
  period: 1840
  label: "Sepoyupproret 1857"
  title: "Sepoyupproret 1857–1858"
  wiki:
    - "sv:Sepoyupproret"
  text: |
    Brittiska Ostindiska kompaniet – ett privat aktiebolag med egen armé –
    styrde 1857 större delen av Indien. Dess armé bestod av cirka 300 000
    indiska soldater, kallade **sepoyer**, och omkring 40 000 britter.
    Missnöjet var stort: kompaniet hade annekterat furstendömen, tagit
    jord från godsägare och upplevdes som ett hot mot hinduisk och
    muslimsk tradition.

    Gnistan var nya gevärspatroner som enligt rykten var insmorda med ko-
    och svinfett; soldaterna skulle bita upp dem, vilket var oacceptabelt
    för både hinduer (kon är helig) och muslimer (grisen är oren). I maj
    1857 gjorde sepoyer i Meerut myteri, marscherade till Delhi och
    utropade den åldrande mogulkejsaren Bahadur Shah II till ledare.
    Upproret spred sig över norra Indien. Båda sidor begick massakrer;
    britternas hämnd var omfattande, och uppskattningsvis hundratusentals
    indier dog.

    Upproret var slaget 1858. Kompaniet upplöstes, och Indien styrdes
    därefter direkt av den brittiska staten (**Brittiska Raj**), med
    drottning Viktoria som kejsarinna från 1877. [Mogulriket, som funnits
    sedan 1526](#babur-vinner-vid-panipat-1526-mogulriket), upphörde
    formellt. I Indien ses upproret ofta som det första
    självständighetskriget, ett förspel till [frigörelsen
    1947](#sjalvstandighet-och-delning-1947).

brittiska-kronan-styr:
  period: 1860
  label: "Brittiska kronan styr"
  title: "Brittiska Raj: kronan tar över Indien 1858"
  wiki:
    - "sv:Brittiska Indien"
    - "en:British Raj"
  text: |
    Fram till 1857 styrdes stora delar av Indien av **[Ostindiska
    kompaniet](#ostindiska-kompaniet-1600)**, ett brittiskt handelsbolag
    med egen armé. Efter det stora upproret 1857–58
    ([sepoyupproret](#sepoyupproret-1857), där indiska soldater i
    kompaniets tjänst gjorde myteri) avskaffade det brittiska parlamentet
    kompaniets makt och lät den brittiska staten – ”kronan” – ta över
    direkt.

    Perioden 1858–1947 kallas **brittiska Raj** (”raj” = styre). En
    vicekung styrde ca 250–300 miljoner människor med bara några tusen
    brittiska ämbetsmän, i samarbete med drygt 500 lokala furstar. 1877
    utropades drottning **Victoria** till kejsarinna av Indien.

    Britterna byggde järnvägar (ca 40 000 km år 1900), telegraf och
    universitet, men styret präglades också av svåra hungersnöder – t.ex.
    1876–78 och 1896–1902 med miljontals döda. Den utbildade indiska
    eliten som växte fram bildade senare självständighetsrörelsen (se
    ”[Indiska nationalkongressen
    1885](#indiska-nationalkongressen-1885)”).

indiska-nationalkongressen-1885:
  period: 1880
  label: "Indiska nationalkongressen 1885"
  title: "Indiska nationalkongressen grundas 1885"
  wiki:
    - "sv:Indiska nationalkongressen"
  text: |
    I december 1885 samlades 72 delegater i Bombay (Mumbai) och grundade
    **Indiska nationalkongressen**. De var mest västutbildade advokater,
    journalister och lärare – en elit som brittiska skolor och universitet
    själva hade skapat. Initiativtagare var bl.a. den pensionerade
    brittiske ämbetsmannen Allan Octavian Hume.

    I början var kongressen lojal mot [brittiska
    kronan](#brittiska-kronan-styr). Den krävde moderata reformer: fler
    indier i förvaltningen, inflytande över budgeten och lägre skatter.
    Ledare som **Dadabhai Naoroji** hävdade att Storbritannien tömde
    Indien på rikedom (”drain theory”). Efter 1905 blev en mer radikal
    falang starkare som krävde självstyre.

    Under **Gandhi** (se ”[Gandhi tillbaka 1915](#gandhi-tillbaka-1915)”)
    blev kongressen en massrörelse med miljontals medlemmar som ledde
    Indien till [självständighet 1947](#sjalvstandighet-och-delning-1947).
    Partiet styrde sedan Indien större delen av tiden fram till 2014, med
    Nehru, Indira Gandhi och Rajiv Gandhi som premiärministrar.

gandhi-tillbaka-1915:
  period: 1900
  label: "Gandhi tillbaka 1915"
  title: "Gandhi återvänder till Indien 1915"
  wiki:
    - "sv:Mahatma Gandhi"
    - "sv:Satyagraha"
  text: |
    **Mohandas Karamchand Gandhi** (1869–1948) var en indisk advokat
    utbildad i London. Han arbetade 1893–1914 i Sydafrika, där han själv
    utsattes för rasdiskriminering och ledde indiernas kamp mot
    diskriminerande lagar. Där utvecklade han metoden **satyagraha**
    (”sanningskraft”) – massiv, ickevåldsam civil olydnad, där man öppet
    bryter orättfärdiga lagar och tar straffet.

    I januari 1915 återvände han till Indien, 45 år gammal. Han reste runt
    i landet, levde enkelt och tog upp böndernas och de fattigas sak.
    Efter [Amritsarmassakern 1919](#amritsar-1919), där brittiska soldater
    sköt ihjäl hundratals obeväpnade indier, blev han ledare för [Indiska
    nationalkongressen](#indiska-nationalkongressen-1885) och gjorde den
    till en massrörelse.

    Kända aktioner är bojkotten av brittiska varor och
    **[saltmarschen](#gandhis-saltmarsch-1930)** 1930, ca 390 km till
    havet för att protestera mot saltskatten. [Indien blev självständigt
    1947](#sjalvstandighet-och-delning-1947), men delades i Indien och
    Pakistan med uppskattningsvis 0,5–1 miljon döda. Gandhi mördades 1948
    av en hinduisk nationalist. Hans metoder inspirerade bl.a. Martin
    Luther King och Nelson Mandela.

amritsar-1919:
  period: 1900
  label: "Amritsar 1919"
  title: "Massakern i Amritsar 1919"
  wiki:
    - "sv:Massakern i Amritsar"
    - "en:Jallianwala Bagh massacre"
  text: |
    Den 13 april 1919 samlades uppskattningsvis 10 000–20 000 obeväpnade
    människor i Jallianwala Bagh, en inhägnad park i staden Amritsar i
    Punjab i nordvästra Indien. Indien var då en brittisk koloni. Den
    brittiske generalen **Reginald Dyer** lät sina soldater spärra
    utgången och skjuta rakt in i folkmassan i ungefär tio minuter, utan
    förvarning, tills ammunitionen började ta slut.

    Enligt brittiska siffror dog 379 personer; indiska källor uppskattade
    över 1 000 döda. Bakgrunden var Rowlattlagarna, som tillät fängslande
    utan rättegång, och protester mot dem.

    Massakern blev en vändpunkt. Många indier som tidigare trott på
    gradvisa reformer inom imperiet slutade göra det. **Mahatma Gandhi** –
    advokaten som blev ledare för den indiska självständighetsrörelsen med
    icke-våldsmetoder – startade 1920 sin första stora kampanj för
    icke-samarbete med britterna. Se även [Gandhis saltmarsch
    1930](#gandhis-saltmarsch-1930) och [självständigheten
    1947](#sjalvstandighet-och-delning-1947).

gandhis-saltmarsch-1930:
  period: 1920
  label: "Gandhis saltmarsch 1930"
  title: "Gandhis saltmarsch 1930"
  wiki:
    - "sv:Saltmarschen"
    - "sv:Mahatma Gandhi"
  text: |
    **Mohandas ”Mahatma” Gandhi** var en indisk advokat utbildad i London
    som utvecklat metoden satyagraha – icke-våldsamt motstånd och civil
    olydnad – i Sydafrika, och som efter 1920 ledde [indiska
    nationalkongressen](#indiska-nationalkongressen-1885) i kampen mot
    brittiskt styre.

    Britterna hade monopol på salt och tog ut skatt på det, något som
    drabbade alla, även de fattigaste. I mars–april 1930 vandrade Gandhi
    med 78 följeslagare omkring 390 km på 24 dagar från sitt ashram till
    kustbyn Dandi, där han kokade saltvatten och plockade salt i strid med
    lagen. Tusentals anslöt längs vägen.

    Aktionen utlöste civil olydnad i hela Indien. Omkring 60 000 människor
    arresterades, bland dem Gandhi själv. Bilder av fredliga demonstranter
    som misshandlades med batonger spreds i världspressen och skadade
    Storbritanniens anseende. Saltmarschen blev en förebild för senare
    rörelser, inte minst Martin Luther Kings
    [medborgarrättsrörelse](#medborgarrattsrorelsen) i USA på
    1950–60-talen. Se även [självständigheten
    1947](#sjalvstandighet-och-delning-1947).

sjalvstandighet-och-delning-1947:
  period: 1940
  label: "Självständighet och delning 1947"
  title: "Indiens självständighet och delning 1947"
  wiki:
    - "sv:Indiens delning"
    - "en:Partition of India"
  text: |
    Efter [andra världskriget](#andra-varldskriget) var Storbritannien
    utarmat och kunde inte längre hålla Indien, där
    självständighetsrörelsen under Gandhi och **Jawaharlal Nehru** hade
    bred uppslutning. Men det muslimska förbundet under **Muhammad Ali
    Jinnah** krävde en egen stat för muslimerna.

    Den 15 augusti 1947 delades Brittiska Indien i två stater: Indien, med
    hinduisk majoritet, och Pakistan, med muslimsk majoritet, i två delar
    på var sin sida om Indien (östra delen blev [Bangladesh
    1971](#bangladesh-1971)). Gränsen drogs hastigt på omkring fem veckor
    av en brittisk jurist som aldrig varit i Indien.

    Delningen utlöste en av historiens största folkförflyttningar:
    uppskattningsvis 12–20 miljoner människor flydde över de nya
    gränserna, och mellan 200 000 och 2 miljoner dödades i våld mellan
    hinduer, sikher och muslimer. Konflikten om Kashmir ledde till krig
    redan 1947 och består än idag; både Indien och Pakistan har idag
    kärnvapen. Indien blev världens största demokrati.

    Se även [Gandhi mördas](#gandhi-mordas).

gandhi-mordas:
  period: 1940
  label: "Gandhi mördas"
  title: "Mordet på Gandhi 1948"
  wiki:
    - "sv:Mahatma Gandhi"
    - "en:Assassination of Mahatma Gandhi"
  text: |
    Den 30 januari 1948, mindre än ett halvår efter Indiens
    självständighet, sköts **Mahatma Gandhi** till döds i New Delhi på väg
    till en bönestund. Han var 78 år. Gandhi var självständighetsrörelsens
    ledare och förespråkare för icke-våld (se [saltmarschen
    1930](#gandhis-saltmarsch-1930)).

    Mördaren, **Nathuram Godse**, var en hindunationalist som ansåg att
    Gandhi varit för eftergiven mot muslimerna och mot Pakistan. Gandhi
    hade under våldet [efter delningen](#sjalvstandighet-och-delning-1947)
    hungerstrejkat för att få slut på massakrerna och för att Indien
    skulle betala ut pengar som Pakistan hade rätt till. Godse
    avrättades 1949.

    Mordet chockade Indien och världen. Regeringen förbjöd tillfälligt den
    hindunationalistiska organisationen RSS. Gandhis idéer om icke-våld
    fick stort inflytande, bland annat på [Martin Luther
    King](#medborgarrattsrorelsen) och Nelson Mandela. Spänningen mellan
    Gandhis och Nehrus sekulära Indien och hindunationalismen präglar
    indisk politik än idag, då hindunationalistiska BJP är regeringsparti.

grona-revolutionen:
  period: 1960
  label: "Gröna revolutionen"
  title: "Gröna revolutionen i Indien"
  wiki:
    - "en:Green Revolution in India"
    - "sv:Norman Borlaug"
  text: |
    På 1960-talet fruktade många att Indien skulle drabbas av massvält.
    Befolkningen ökade snabbt (cirka 450 miljoner 1960), torka 1965–66 gav
    missväxt, och landet var beroende av spannmål från USA. Indien hade
    dessutom drabbats av svältkatastrofer under kolonialtiden, som
    Bengalen 1943 med uppskattningsvis 2–3 miljoner döda.

    ”Gröna revolutionen” var svaret: nya högavkastande sorter av vete och
    ris, framtagna av bland andra amerikanen **Norman Borlaug** i Mexiko
    (Nobels fredspris 1970) och ett forskningsinstitut på Filippinerna.
    Sorterna hade korta, kraftiga strån som inte knäcktes av tunga ax. De
    krävde konstgödsel, bevattning och bekämpningsmedel, som staten
    subventionerade. Satsningen startade 1966–67, främst i delstaten
    Punjab.

    Indiens veteskörd ungefär fördubblades på sju år, och landet blev i
    stort sett självförsörjande på spannmål på 1970-talet. Liknande
    ökningar skedde i stora delar av Asien och Latinamerika. Baksidan:
    sjunkande grundvatten, utarmad jord, förgiftning av bekämpningsmedel,
    och att större bönder gynnades mer än små. Men massvälten uteblev,
    trots att Indiens befolkning sedan dess har mer än tredubblats till
    över 1,4 miljarder.

    Jämför med [Stora språnget 1958](#stora-spranget-1958).

bangladesh-1971:
  period: 1960
  label: "Bangladesh 1971"
  title: "Bangladesh blir självständigt 1971"
  wiki:
    - "en:Bangladesh Liberation War"
    - "en:1971 Bangladesh genocide"
  text: |
    [När Brittiska Indien delades 1947](#sjalvstandighet-och-delning-1947)
    blev Pakistan en stat i två delar, 1 600 km från varandra med Indien
    emellan: Västpakistan (dagens Pakistan) och Östpakistan (dagens
    Bangladesh). Östpakistan hade flest invånare men styrdes från väst,
    och dess språk bengali diskriminerades till förmån för urdu.

    I valet 1970 vann det östbengaliska partiet Awami League under
    **Sheikh Mujibur Rahman** egen majoritet i hela Pakistans parlament.
    Västpakistans militärledning vägrade lämna över makten, och i mars
    1971 slog armén till mot befolkningen i öst. Under nio månader dödades
    uppskattningsvis 300 000 till 3 miljoner människor – siffran är
    omstridd – och omkring 10 miljoner flydde till Indien.

    I december 1971 gick Indien under premiärminister **Indira Gandhi** in
    i kriget. På 13 dagar besegrades den pakistanska armén i öst och
    omkring 90 000 soldater kapitulerade, en av de största
    kapitulationerna sedan [andra världskriget](#andra-varldskriget).
    Bangladesh blev självständigt. USA under Nixon stödde Pakistan, som
    just då hjälpte till att förmedla kontakt med Kina (se [Nixon i Peking
    1972](#nixon-i-peking-1972)); Sovjet stödde Indien. Bangladesh har i
    dag omkring 170 miljoner invånare och är en av världens största
    textilexportörer.

bhopal-1984:
  period: 1980
  label: "Bhopal 1984"
  title: "Gasolyckan i Bhopal 1984"
  wiki:
    - "sv:Bhopalolyckan"
    - "en:Bhopal disaster"
  text: |
    Natten mot den 3 december 1984 läckte omkring 40 ton giftig gas,
    **metylisocyanat**, ut från en bekämpningsmedelsfabrik i staden Bhopal
    i centrala Indien. Fabriken ägdes till största delen av det
    amerikanska kemiföretaget **Union Carbide**. Vatten hade kommit in i
    en lagringstank, gasen bildades i en okontrollerad reaktion och flera
    säkerhetssystem var avstängda eller trasiga.

    Gasmolnet drev över tätt befolkade slumområden medan människor sov.
    Uppskattningsvis 3 000–4 000 dog inom några dagar; senare
    uppskattningar av det totala antalet döda ligger på 15 000–20 000
    eller mer, och hundratusentals fick bestående skador på lungor och
    ögon. Det räknas som världens värsta industriolycka. Jämför med
    [Tjernobyl](#tjernobyl-1986) två år senare (1986), där de direkta
    dödsfallen var några dussin.

    Union Carbide betalade 1989 en uppgörelse på 470 miljoner dollar – i
    snitt några hundra dollar per drabbad. Olyckan blev en symbol för hur
    multinationella företag kunde ha sämre säkerhet i fattiga länder än
    hemma, och ledde till skärpt miljö- och industrilagstiftning i Indien.
    Området är fortfarande förorenat.

liberalisering-1991:
  period: 1980
  label: "liberalisering 1991"
  title: "Indiens ekonomiska liberalisering 1991"
  wiki:
    - "en:Economic liberalisation in India"
    - "en:1991 Indian economic crisis"
  text: |
    Efter [självständigheten 1947](#sjalvstandighet-och-delning-1947)
    byggde Indien en planekonomi inspirerad av Sovjetunionen: staten ägde
    tung industri, import begränsades med höga tullar och företag behövde
    statliga tillstånd för nästan allt – det så kallade **License Raj**
    (tillståndsväldet). Tillväxten var låg, runt 3–4 % per år, och
    kallades skämtsamt den hinduiska tillväxttakten.

    År 1991 hamnade Indien i akut betalningskris: valutareserven räckte
    bara till cirka tre veckors import, delvis för att oljepriset stigit
    under [Gulfkriget](#gulfkriget-1991) och Sovjetunionen (en viktig
    handelspartner) [höll på att falla samman](#sovjet-faller-1991).
    Landet tvingades låna av IMF och pantsätta guld. Finansministern
    **Manmohan Singh** (senare premiärminister 2004–14) genomförde då
    stora reformer: tillståndskraven avskaffades i de flesta branscher,
    tullarna sänktes kraftigt, rupien devalverades och utländska
    investeringar släpptes in.

    Resultatet blev snabbare tillväxt, ofta 6–8 % per år, och framväxten
    av IT-tjänstesektorn kring Bangalore (Infosys, Wipro, TCS). Jämför med
    [Dengs reformer](#dengs-reformer) i Kina från 1978, som gjorde
    liknande saker drygt tio år tidigare. Se även [Ekonomisk
    tillväxt](#ekonomisk-tillvaxt) i Indien efter 2000.

ekonomisk-tillvaxt:
  period: 2000
  label: "Ekonomisk tillväxt"
  title: "Indiens ekonomiska uppgång efter 2000"
  wiki:
    - "en:Economy of India"
    - "sv:Indiens ekonomi"
  text: |
    Efter [liberaliseringen 1991](#liberalisering-1991) (se den) blev
    Indien en av världens snabbast växande ekonomier, med ofta 6–8 %
    tillväxt per år. Ekonomin växte från knappt 500 miljarder dollar år
    2000 till omkring 4 000 miljarder dollar i mitten av 2020-talet, och
    Indien har passerat Storbritannien som en av världens fem största
    ekonomier. Den extrema fattigdomen minskade kraftigt; uppskattningsvis
    flera hundra miljoner människor lyftes ur den.

    Till skillnad från Kina, som växte genom fabriker och export av varor,
    växte Indien till stor del genom **tjänster**, särskilt
    IT-outsourcing. Företag som Infosys, TCS och Wipro skötte
    programvaruutveckling och support för västerländska företag,
    möjliggjort av internet, billig engelsktalande arbetskraft och
    tidsskillnaden mot USA. Bangalore kallas Indiens Silicon Valley. Stora
    digitala projekt är **Aadhaar**, ett biometriskt ID-system med över en
    miljard registrerade, och betalsystemet UPI, ungefär som Swish men för
    hela landet.

    Problemen är kvar: en stor del av arbetskraften jobbar fortfarande i
    jordbruket eller i informell sektor, industrin är liten och BNP per
    person är bara runt en femtedel av Kinas. Se även [Folkrikast i
    världen 2023](#folkrikast-i-varlden-2023).

folkrikast-i-varlden-2023:
  period: 2020
  label: "Folkrikast i världen 2023"
  title: "Indien blir världens folkrikaste land 2023"
  wiki:
    - "en:Demographics of India"
    - "sv:Indiens demografi"
  text: |
    Enligt FN:s beräkningar passerade Indien Kina som världens folkrikaste
    land omkring april 2023, med drygt 1,4 miljarder invånare vardera.
    Kina hade varit störst i århundraden. Indien har inte gjort någon
    folkräkning sedan 2011, så siffrorna är uppskattningar.

    Skillnaden ligger i åldersstrukturen. Kina införde 1980
    **ettbarnspolitiken**, som tvingade de flesta familjer att bara ha ett
    barn; den avskaffades 2015, men födelsetalen har fortsatt att falla
    till runt ett barn per kvinna. Kinas befolkning minskar sedan 2022 och
    åldras snabbt. Indiens befolkning är betydligt yngre – omkring hälften
    är under 30 år – och fortsätter att växa, men långsammare: antalet
    barn per kvinna har fallit från omkring sex på 1950-talet till cirka
    två i dag, och FN räknar med att befolkningen toppar runt 1,7
    miljarder kring 2060.

    En stor ung befolkning kan bli en ekonomisk tillgång, en så kallad
    demografisk utdelning, men bara om det skapas jobb; många unga indier
    är arbetslösa eller arbetar informellt. För perspektiv: världens
    befolkning var ungefär 300 miljoner år 1000 och passerade 8
    miljarder 2022. Se även [Ekonomisk tillväxt](#ekonomisk-tillvaxt).

chandrayaan-3-pa-manen-2023:
  period: 2020
  label: "Chandrayaan-3 på månen 2023"
  title: "Chandrayaan-3 landar på månen 2023"
  wiki:
    - "en:Chandrayaan-3"
    - "en:Indian Space Research Organisation"
  text: |
    **Chandrayaan-3** (sanskrit för ungefär "månfarkost") är en obemannad
    indisk månfärd. Den 23 augusti 2023 landade dess landare Vikram nära
    månens sydpol, och en liten sexhjulig robotbil, Pragyan, rullade ut
    och gjorde mätningar av marken i ungefär två veckor. Indien blev
    därmed det fjärde landet som mjuklandat på månen, efter Sovjetunionen
    (1966), USA och Kina, och det första nära sydpolen.

    Sydpolen är intressant eftersom det i ständigt skuggade kratrar
    troligen finns is, som framtida baser skulle kunna använda för
    dricksvatten, syre och raketbränsle. Föregångaren Chandrayaan-2 hade
    kraschat vid landningsförsöket 2019 på grund av ett programvarufel,
    och några dagar före Chandrayaan-3 hade en rysk landare, Luna 25,
    kraschat i samma område.

    Det mest uppmärksammade var priset: hela uppdraget beräknas ha kostat
    ungefär 75 miljoner dollar – mindre än budgeten för många
    Hollywoodfilmer om rymden. Den indiska rymdorganisationen **ISRO**,
    grundad 1969, är känd för billiga uppdrag; den skickade även en sond
    till Mars 2014. Jämför med Apollo 11, den första bemannade
    [månlandningen 1969](#manlandningen-1969), och med Kinas och USA:s
    planer på nya bemannade månfärder.
