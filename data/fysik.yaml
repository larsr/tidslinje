planck-1900:
  period: 1900
  label: "Planck 1900"
  title: "Planck och energins kvanta"
  wiki:
    - "sv:Max Planck"
    - "en:Planck's law"
  text: |
    **Max Planck** (1858–1947) var en tysk fysiker i Berlin. Han arbetade med *svartkroppsstrålning*: det ljus (inklusive infrarött) som ett varmt föremål sänder ut, där färgfördelningen bara beror på temperaturen – en glödande järnbit går från rött till vitt när den hettas upp. Den klassiska fysiken förutsade att ett varmt föremål skulle stråla ut oändligt mycket energi vid korta våglängder, vilket uppenbart är fel (senare kallat "ultravioletta katastrofen").

    I december 1900 lade Planck fram en formel som passade mätningarna perfekt. För att härleda den fick han anta att energi bara kan utbytas i små paket, *kvanta*, med storleken E = h·f, där f är frekvensen och h en ny naturkonstant, ungefär 6,626·10⁻³⁴ joulesekunder. Konstanten är så liten att kvantiseringen märks bara i atomär skala. Planck såg det själv mest som ett matematiskt knep.

    Det var [Einstein 1905](#einstein-1905-och-1915) som tog idén på allvar och föreslog att ljuset självt består av kvanta, senare kallade fotoner. Sedan använde [Bohr 1913](#bohr-1913) kvanttanken för atomen, och 1925–26 kom den fullständiga [kvantmekaniken](#kvantmekaniken-192526). Planck fick Nobelpriset 1918. Sedan 2019 definieras kilogrammet genom att fixera värdet på Plancks konstant.

einstein-1905-och-1915:
  period: 1900
  label: "Einstein 1905 och 1915"
  title: "Einstein: relativitet och ljuskvanta"
  wiki:
    - "sv:Albert Einstein"
    - "sv:Relativitetsteori"
  text: |
    **Albert Einstein** (1879–1955), tyskfödd fysiker, var 1905 tjänsteman vid patentverket i Bern. Det året publicerade han fyra banbrytande artiklar. En förklarade den fotoelektriska effekten (att ljus kan slå loss elektroner ur metall) med att ljus består av energipaket, fotoner – en vidareutveckling av [Plancks kvanta](#planck-1900). En annan förklarade [brownsk rörelse](#brownsk-rorelse-1827) med att molekyler knuffar på små partiklar, vilket övertygade de sista tvivlarna om att atomer finns.

    Den mest kända är den *speciella relativitetsteorin*. Den utgår från två antaganden: fysikens lagar är desamma för alla som rör sig med konstant hastighet, och ljusets hastighet c (cirka 300 000 km/s) är densamma för alla observatörer – det som [Michelson–Morley](#michelsonmorley-1887) hade antytt. Följderna: klockor i rörelse går långsammare, avstånd krymper i rörelseriktningen, och massa m är en form av energi E, enligt E = mc². Eftersom c² är enormt motsvarar ett gram massa ungefär 9·10¹³ joule, i storleksordningen energin i Hiroshimabomben.

    1915 kom den *allmänna relativitetsteorin*, en ny teori för gravitation: massa och energi kröker rumtiden, och fritt fallande föremål följer de "rakaste" banorna i den krökta geometrin. Den förklarade en avvikelse i Merkurius bana och förutsade att ljus böjs av solen, vilket bekräftades 1919. Den ligger bakom svarta hål, [det expanderande universum](#hubble-universum-expanderar) och [gravitationsvågor](#gravitationsvagor-2015). GPS-satelliternas klockor måste korrigeras för båda teorierna, sammanlagt cirka 38 mikrosekunder per dygn; annars skulle positionen driva iväg i storleksordningen tio kilometer per dygn.

rutherford-atomkarnan-1911:
  period: 1900
  label: "Rutherford: atomkärnan 1911"
  title: "Rutherford hittar atomkärnan"
  wiki:
    - "sv:Ernest Rutherford"
    - "en:Geiger–Marsden experiments"
  text: |
    **Ernest Rutherford** (1871–1937) var en fysiker från Nya Zeeland som arbetade i Kanada och England. Han hade redan fått Nobelpriset i kemi 1908 för att ha visat att [radioaktivitet](#radioaktivitet) innebär att ett grundämne förvandlas till ett annat.

    Den rådande atommodellen var J.J. Thomsons "russinkaka": atomen som en jämnt utspridd positiv massa med [elektronerna](#elektronen-1897) insprängda. I Manchester sköt Rutherfords medarbetare Hans Geiger och Ernest Marsden alfapartiklar (positivt laddade, tunga partiklar från radioaktiva ämnen) mot en extremt tunn guldfolie. De flesta gick rakt igenom, men ungefär en på flera tusen studsade tillbaka i stor vinkel. Rutherford sa att det var lika otroligt som om en granat studsade mot silkespapper.

    Hans tolkning 1911: nästan all massa och all positiv laddning sitter i en pytteliten *kärna*, och resten av atomen är nästan tomt rum med elektroner runt. Kärnan är ungefär 100 000 gånger mindre än atomen i diameter – som en ärta mitt i en fotbollsarena. Men modellen hade ett problem: enligt klassisk fysik borde kretsande elektroner stråla bort sin energi och falla in i kärnan på en bråkdel av en sekund. Det löste [Bohr 1913](#bohr-1913). Rutherford påvisade senare protonen och var med och grundlade kärnfysiken som ledde till [kärnklyvningen](#karnklyvning-1938).

bohr-1913:
  period: 1900
  label: "Bohr 1913"
  title: "Bohrs atommodell"
  wiki:
    - "sv:Niels Bohr"
    - "en:Bohr model"
  text: |
    **Niels Bohr** (1885–1962) var en dansk fysiker som arbetade en tid hos Rutherford i Manchester. [Rutherfords atom](#rutherford-atomkarnan-1911), med elektroner runt en kärna, var enligt klassisk fysik instabil. Dessutom fanns en gammal gåta: upphettade gaser sänder ut ljus bara vid vissa bestämda våglängder (spektrallinjer), och för väte hade man en empirisk formel för dem utan att veta varför.

    Bohr gjorde 1913 ett djärvt antagande: elektronen kan bara röra sig i vissa tillåtna banor med bestämda energier, och i dem strålar den inte. Ljus sänds ut eller tas upp bara när elektronen hoppar mellan två banor, och fotonens energi är skillnaden mellan banornas energier, enligt [Plancks](#planck-1900) E = h·f. Med detta räknade han fram väteatomens spektrallinjer ur naturkonstanter, med god precision.

    Modellen var en hybrid av gammalt och nytt, och fungerade dåligt för atomer med fler elektroner. Den ersattes 1925–26 av den fullständiga [kvantmekaniken](#kvantmekaniken-192526), där elektronen inte har någon bestämd bana alls utan beskrivs av en sannolikhetsvåg. Men idén om diskreta energinivåer och kvantsprång består; den förklarar varför grundämnen har bestämda kemiska egenskaper och ligger bakom t.ex. lasrar och lysdioder. Bohrs institut i Köpenhamn blev 1920-talets centrum för kvantfysiken, och han fick Nobelpriset 1922.

kvantmekaniken-192526:
  period: 1920
  label: "Kvantmekaniken 1925–26"
  title: "Kvantmekaniken formuleras"
  wiki:
    - "sv:Kvantmekanik"
    - "en:Schrödinger equation"
  text: |
    Under åren 1900–1924 hade fysiken samlat på sig en lapptäcksteori: [Plancks kvanta](#planck-1900), Einsteins fotoner och [Bohrs atommodell](#bohr-1913) fungerade men byggde på godtyckliga regler. Fransmannen Louis de Broglie föreslog 1924 att även partiklar som elektroner har vågegenskaper. På drygt ett år 1925–26 kom en sammanhängande teori, i två formuleringar.

    Tysken **Werner Heisenberg** (23 år gammal) skapade 1925 *matrismekaniken*, där mätbara storheter representeras av matriser – tabeller av tal där multiplikationsordningen spelar roll, AB ≠ BA. Österrikaren **Erwin Schrödinger** publicerade 1926 en vågekvation: en partikel beskrivs av en *vågfunktion* ψ(x, t), och ekvationen anger hur den utvecklas över tid. Schrödinger och andra visade snart att formuleringarna är matematiskt likvärdiga. Max Born föreslog 1926 tolkningen att |ψ(x, t)|² är *sannolikheten* att hitta partikeln vid platsen x vid tiden t. Heisenbergs osäkerhetsrelation (1927) säger att läge och rörelsemängd inte samtidigt kan ha exakta värden.

    Teorin förklarar det periodiska systemet, kemiska bindningar och hur halvledare leder ström. Utan den inga [transistorer](#transistorn-1947), [lasrar](#lasern-1960) eller MRI. Den är det mest exakt testade i fysiken, men hur tolkningen ska förstås – vad som "händer" vid en mätning – är fortfarande omdebatterat; Einstein accepterade aldrig slumpen i den. Kombinerad med relativitetsteorin ledde den till [kvantelektrodynamiken](#feynman-qed).

hubble:
  period: 1920
  label: "Hubble"
  title: "Hubble: galaxer och ett expanderande universum"
  wiki:
    - "sv:Edwin Hubble"
    - "en:Hubble's law"
  text: |
    **Edwin Hubble** (1889–1953) var en amerikansk astronom vid Mount Wilson-observatoriet i Kalifornien, som då hade världens största teleskop med en 2,5 meters spegel. I början av 1920-talet var det omstritt om de suddiga "spiralnebulosorna" var gasmoln i vår egen Vintergata eller egna stjärnsystem långt borta.

    År 1923–24 hittade Hubble *cepheider* i Andromedanebulosan. Det är stjärnor som pulserar, och den amerikanska astronomen Henrietta Leavitt hade 1912 visat att deras period avslöjar hur ljusstarka de verkligen är; jämför man med hur ljusa de ser ut kan man räkna ut avståndet. Det blev nära en miljon ljusår (i dag vet vi ungefär 2,5 miljoner), långt utanför Vintergatan. Universum bestod alltså av otaliga galaxer.

    1929 jämförde han avstånd med galaxernas *rödförskjutning* – ljuset förskjuts mot längre våglängder när källan rör sig bort, uppmätt bland annat av Vesto Slipher. Ju längre bort, desto snabbare rör de sig bort: hastighet = H₀ · avstånd. Det tolkades som att universum expanderar, vilket redan hade förutsagts ur [allmänna relativitetsteorin](#einstein-1905-och-1915) av Aleksandr Friedmann och Georges Lemaître. Tänker man baklänges var allt en gång samlat – idén om big bang, som fick stöd av [bakgrundsstrålningen 1965](#bakgrundsstralningen-1965). Hubbles första värde var cirka sju gånger för högt; i dag ligger H₀ runt 70 km/s per megaparsek, och 1998 fann man att expansionen accelererar ([mörk energi](#mork-energi-1998)).

karnklyvning-1938-2:
  period: 1920
  label: "kärnklyvning 1938"
  same_as: karnklyvning-1938

atombomben-1945:
  period: 1940
  label: "Atombomben 1945"
  title: "Atombomben"
  wiki:
    - "sv:Atombomberna över Hiroshima och Nagasaki"
    - "sv:Manhattanprojektet"
  text: |
    Grunden lades 1938 när tyska kemister upptäckte att uranatomer kan klyvas, se [kärnklyvning](#karnklyvning-1938). När en urankärna (isotopen uran-235) träffas av en neutron delar den sig, frigör energi enligt Einsteins E = mc², och släpper ut två–tre nya neutroner som kan klyva fler kärnor – en *kedjereaktion*. Klyvning av ett kilo uran-235 ger ungefär lika mycket energi som 17 000 ton trotyl, miljontals gånger mer än kemisk förbränning per kilo.

    Av rädsla för att Nazityskland skulle hinna först startade USA [Manhattanprojektet](#manhattanprojektet) 1942, med fysikern J. Robert Oppenheimer som vetenskaplig ledare och runt 130 000 anställda totalt. Problemet var materialet: naturligt uran innehåller bara cirka 0,7 procent uran-235, så enorma anläggningar byggdes för anrikning, och kärnreaktorer för att framställa plutonium. Den första bomben testades i New Mexico den 16 juli 1945.

    Den 6 augusti 1945 fälldes en uranbomb över Hiroshima och den 9 augusti en plutoniumbomb över Nagasaki ([Hiroshima, Nagasaki](#hiroshima-nagasaki-1945)), vardera motsvarande ungefär 15–21 tusen ton trotyl. Uppskattningsvis 110 000–210 000 människor dog till slutet av 1945. Japan kapitulerade. Sovjetunionen sprängde sin första bomb 1949 ([atombomb 1949](#atombomb-1949)), och kärnvapenkapprustningen präglade kalla kriget. Samma fysik gav [kärnkraften](#karnkraft-1954).

transistorn-1947-2:
  period: 1940
  label: "transistorn 1947"
  same_as: transistorn-1947

feynman-qed:
  period: 1940
  label: "Feynman: QED"
  title: "Kvantelektrodynamiken"
  wiki:
    - "sv:Kvantelektrodynamik"
    - "sv:Richard Feynman"
  text: |
    *Kvantelektrodynamik* (QED) är teorin för hur ljus och elektriskt laddade partiklar, som elektroner, växelverkar. Den förenar [kvantmekaniken](#kvantmekaniken-192526) med den speciella relativitetsteorin och [Maxwells elektromagnetism](#maxwells-ekvationer-1865). Den grundläggande bilden: laddade partiklar påverkar varandra genom att utbyta fotoner (ljuskvanta).

    Problemet på 1930-talet var att beräkningarna gav oändliga svar så snart man försökte gå bortom första approximationen. Efter kriget löste tre personer oberoende av varandra problemet, med en teknik som kallas *renormering*: oändligheterna kan samlas i elektronens massa och laddning, som man ersätter med de uppmätta värdena. Amerikanerna **Richard Feynman** (1918–1988) och Julian Schwinger samt japanen Shin'ichirō Tomonaga fick Nobelpriset 1965; Freeman Dyson visade att metoderna var likvärdiga.

    Feynmans bidrag var särskilt praktiskt: *Feynmandiagram*, enkla streckgubbsbilder där varje linje och korsning motsvarar en term i en beräkning. De gjorde komplicerade räkningar hanterbara och används i hela partikelfysiken. QED är kanske den mest exakt testade teorin som finns: elektronens magnetiska moment stämmer med experiment på ungefär tolv värdesiffror. Den blev mallen för resten av standardmodellen, inklusive teorin om [kvarkar](#kvarkar-1964) och den svaga kraften med [W- och Z-bosonerna](#w-och-z-bosonerna-1983). Feynman var även med i Manhattanprojektet och känd som pedagog.

lasern-1960:
  period: 1960
  label: "Lasern 1960"
  title: "Lasern"
  wiki:
    - "sv:Laser"
    - "en:Theodore Maiman"
  text: |
    Den 16 maj 1960 fick den amerikanske fysikern Theodore Maiman vid Hughes Research Laboratories en rubinkristall att sända ut en tunn röd stråle av ljus där alla vågor hade samma våglängd och svängde i takt. Det var den första lasern – ordet är en förkortning av engelskans *Light Amplification by Stimulated Emission of Radiation*, ljusförstärkning genom stimulerad emission.

    Principen förutsades av [Einstein](#einstein-1905-och-1915) redan 1917: en atom i ett exciterat (energirikt) tillstånd kan, när en foton med rätt energi passerar, sända ut en identisk foton. Om fler atomer är exciterade än inte (”populationsinversion”) och ljuset studsar fram och tillbaka mellan två speglar, förstärks det lavinartat. Charles Townes hade 1954 byggt samma sak för mikrovågor, masern. Förklaringen av atomernas energinivåer kommer från [kvantmekaniken](#kvantmekaniken-192526).

    Lasern kallades först ”en lösning som söker ett problem”. I dag finns den överallt: optiska fibrer som bär internettrafik, streckkodsläsare, CD- och DVD-spelare, ögonkirurgi, svetsning och skärning, och litografin som tillverkar mikrochip. Den extrema precisionen gjorde också mätningar möjliga som [detektorerna för gravitationsvågor](#gravitationsvagor-2015), som med laserljus mäter längdändringar mindre än en protons diameter.

kvarkar-1964:
  period: 1960
  label: "kvarkar 1964"
  title: "Kvarkar – protonens beståndsdelar"
  wiki:
    - "sv:Kvark"
    - "en:Quark model"
  text: |
    Efter [Rutherfords upptäckt av atomkärnan](#rutherford-atomkarnan-1911) trodde man att protoner och neutroner var odelbara. Men på 1950-talet hittade acceleratorerna hundratals nya kortlivade partiklar, en ”partikelzoo” utan ordning. 1964 föreslog Murray Gell-Mann (Caltech) och oberoende George Zweig (vid CERN) att alla dessa var sammansatta av ett fåtal mindre byggstenar, som Gell-Mann kallade kvarkar.

    Det märkliga var laddningen: kvarkar har en eller två tredjedels elementarladdning. En proton består av två upp-kvarkar (+2/3 vardera) och en ned-kvark (−1/3), summa +1; en neutron av en upp och två ned, summa 0. Med tre sorters kvarkar (upp, ned, sär) kunde partikelzoon ordnas i mönster, ungefär som grundämnena i periodiska systemet.

    Många såg först kvarkar som räknetrick, eftersom ingen fri kvark någonsin setts. Men experiment vid Stanford (SLAC) 1968 sköt elektroner mot protoner och såg att de studsade mot punktformiga delar inuti. Teorin för kraften som binder kvarkarna (kvantkromodynamik) förklarar varför de aldrig kan slitas loss. I dag känner man sex kvarkar; den tyngsta, toppkvarken, hittades 1995. Kvarkarna är en hörnsten i standardmodellen, liksom [W- och Z-bosonerna](#w-och-z-bosonerna-1983) och [Higgsbosonen](#higgsbosonen-2012).

bakgrundsstralningen-1965:
  period: 1960
  label: "bakgrundsstrålningen 1965"
  title: "Ekot från Big Bang"
  wiki:
    - "en:Cosmic microwave background"
    - "en:Discovery of cosmic microwave background radiation"
  text: |
    1965 försökte Arno Penzias och Robert Wilson vid Bell Labs i New Jersey bli av med ett envist brus i en stor hornantenn för mikrovågor. Bruset kom lika starkt från alla riktningar, dag som natt, och motsvarade strålning från något med temperaturen cirka 3 grader över absoluta nollpunkten. De rengjorde till och med antennen från duvspillning – bruset kvarstod.

    En forskargrupp vid Princeton hade just förutsagt detta. Om universum expanderar, som [Hubble visat](#hubble-universum-expanderar), var det tidigare tätt och hett. Ungefär 380 000 år efter början svalnade det så att atomer bildades och ljuset kunde färdas fritt. Det ljuset finns kvar överallt, men expansionen har sträckt ut våglängden från synligt och infrarött ljus till mikrovågor. Uppmätt i dag är temperaturen 2,725 K.

    Upptäckten avgjorde striden mot steady state-teorin (bland andra Fred Hoyles), som sa att universum alltid sett likadant ut. Satelliterna COBE (1989), WMAP och Planck kartlade senare små temperaturskillnader på någon hundratusendel – frön till galaxerna. Mätningarna är grunden för dagens kosmologi, inklusive slutsatsen om [mörk energi](#mork-energi-1998). Penzias och Wilson fick Nobelpriset 1978.

w-och-z-bosonerna-1983:
  period: 1980
  label: "W- och Z-bosonerna 1983"
  title: "W- och Z-bosonerna"
  wiki:
    - "en:W and Z bosons"
    - "en:Electroweak interaction"
  text: |
    Den svaga kraften är den som orsakar radioaktivt betasönderfall, där en neutron blir en proton och sänder ut en elektron. På 1960-talet förenade Sheldon Glashow, Abdus Salam och Steven Weinberg den svaga kraften med elektromagnetismen i en gemensam teori, den elektrosvaga. Den förutsade att den svaga kraften förmedlas av tre tunga partiklar, W⁺, W⁻ och Z⁰, ungefär som ljusets fotoner förmedlar den elektromagnetiska kraften – men med massor nära 86 respektive 97 gånger protonens.

    För att skapa så tunga partiklar krävs mycket energi (E = mc²). Vid CERN utanför Genève byggde man om en accelerator så att protoner och antiprotoner kolliderade frontalt. Nyckeln var Simon van der Meers metod ”stokastisk kylning” som samlade antiprotonerna i en tät stråle. 1983 hittade experimenten UA1 och UA2, med Carlo Rubbia i spetsen för UA1, först W och sedan Z, med de förutsagda massorna. Rubbia och van der Meer fick Nobelpriset 1984.

    Upptäckten bekräftade standardmodellen, teorin om materiens minsta byggstenar (bl.a. [kvarkarna](#kvarkar-1964)) och krafterna mellan dem. Den förstärkte också Europas ställning i partikelfysiken, som tidigare dominerats av USA. Men teorin krävde ytterligare en partikel för att förklara varför W och Z har massa – sökandet efter den slutade med [Higgsbosonen](#higgsbosonen-2012).

hubbleteleskopet-1990-2:
  period: 1980
  label: "Hubbleteleskopet 1990"
  same_as: hubbleteleskopet-1990

mork-energi-1998:
  period: 1980
  label: "mörk energi 1998"
  title: "Mörk energi – universums accelererande expansion"
  wiki:
    - "sv:Mörk energi"
    - "en:Accelerating expansion of the universe"
  text: |
    Sedan [Hubble](#hubble-universum-expanderar) visste man att universum expanderar, och man väntade sig att gravitationen bromsade expansionen. Två grupper – Supernova Cosmology Project under Saul Perlmutter och High-Z Supernova Search Team under Brian Schmidt och Adam Riess – försökte mäta inbromsningen. De använde supernovor av typ Ia: exploderande vita dvärgstjärnor som lyser nästan lika starkt varje gång, så att deras skenbara ljusstyrka anger avståndet.

    1998 kom båda till samma oväntade resultat: avlägsna supernovor var svagare än väntat, alltså längre bort. Expansionen har inte bromsats under de senaste ungefär fem miljarderna åren utan accelererat. Något fungerar som en frånstötande kraft på stor skala. Det fick namnet mörk energi – ett namn på det okända snarare än en förklaring.

    Den enklaste modellen är Einsteins kosmologiska konstant, en energi som varje kubikmeter tomrum har. Tillsammans med [bakgrundsstrålningen](#bakgrundsstralningen-1965) ger mätningarna att mörk energi utgör omkring 70 % av universums energiinnehåll, mörk materia omkring 25 % och vanlig materia bara cirka 5 %. Varför mörk energin har det värde den har är en av fysikens största olösta frågor; en naiv uppskattning från kvantfysiken blir fel med en faktor i storleksordningen 10¹²⁰. Perlmutter, Schmidt och Riess fick Nobelpriset 2011.

higgsbosonen-2012:
  period: 2000
  label: "Higgsbosonen 2012"
  title: "Higgsbosonen hittas"
  wiki:
    - "sv:Higgsboson"
    - "en:Higgs boson"
  text: |
    Standardmodellen, partikelfysikens teori om materiens byggstenar och krafterna mellan dem, hade ett problem: dess ekvationer fungerar bara om partiklarna saknar massa – men elektroner, kvarkar och [W- och Z-bosonerna](#w-och-z-bosonerna-1983) har massa. 1964 föreslog flera grupper, bland dem britten Peter Higgs och belgarna François Englert och Robert Brout, en lösning: hela rymden genomsyras av ett fält, Higgsfältet. Partiklar som växelverkar med det får därmed massa, ju starkare koppling desto tyngre. Fältet borde också visa sig som en partikel, Higgsbosonen.

    Bosonen var svår att hitta eftersom dess massa var okänd och den sönderfaller nästan direkt. CERN byggde Large Hadron Collider (LHC), en 27 km lång ring under gränsen mellan Schweiz och Frankrike där protoner kolliderar med mycket hög energi. Den 4 juli 2012 meddelade experimenten ATLAS och CMS att de sett en ny partikel med massan omkring 125 GeV (ungefär 133 protonmassor). Analysen krävde enorma datamängder och ett globalt datornätverk.

    Higgs och Englert fick Nobelpriset 2013 (Brout hade dött 2011). Upptäckten fullbordade standardmodellen, som inleddes med bl.a. [kvarkarna](#kvarkar-1964). Men den förklarar inte mörk materia, [mörk energi](#mork-energi-1998) eller gravitationen, och LHC har hittills inte sett några nya partiklar bortom modellen.

gravitationsvagor-2015:
  period: 2000
  label: "gravitationsvågor 2015"
  title: "Gravitationsvågor upptäcks"
  wiki:
    - "sv:Gravitationsvåg"
    - "en:First observation of gravitational waves"
    - "en:LIGO"
  text: |
    [Einsteins allmänna relativitetsteori](#einstein-1905-och-1915) (1915) beskriver gravitation som krökning av rumtiden. 1916 förutsade han att accelererande massor sänder ut krusningar i rumtiden som färdas med ljusets hastighet: gravitationsvågor. Han trodde själv att de var för svaga för att någonsin mätas.

    Den 14 september 2015 registrerade de två LIGO-detektorerna i USA (Louisiana och delstaten Washington) en signal som varade ungefär en femtedels sekund. Den kom från två svarta hål, omkring 29 och 36 solmassor, som spiralerat in mot varandra och smält samman ungefär 1,3 miljarder år tidigare. Energi motsvarande cirka tre solmassor strålade ut som gravitationsvågor. Detektorerna är L-formade interferometrar med [laser](#lasern-1960) och 4 km långa armar: en våg förlänger ena armen och förkortar den andra med ungefär en tusendel av en protons diameter, vilket syns som ändrad interferens i laserljuset.

    Rainer Weiss, Kip Thorne och Barry Barish fick Nobelpriset 2017. Det var den första direkta observationen av svarta hål som slås ihop och öppnade ett nytt sätt att observera universum, utöver ljus. 2017 sågs två neutronstjärnor kollidera i både gravitationsvågor och vanliga teleskop; det visade bl.a. att guld och andra tunga grundämnen bildas vid sådana kollisioner. I dag registreras hundratals händelser med LIGO och detektorerna Virgo i Italien och KAGRA i Japan.

james-webb-teleskopet:
  period: 2020
  label: "James Webb-teleskopet"
  title: "James Webb-teleskopet"
  wiki:
    - "sv:James Webb-teleskopet"
    - "en:James Webb Space Telescope"
  text: |
    James Webb Space Telescope (JWST) är ett rymdteleskop byggt av amerikanska NASA tillsammans med europeiska ESA och kanadensiska CSA. Det sköts upp på juldagen 2021 med en europeisk Ariane 5-raket och tog sina första publicerade bilder i juli 2022. Kostnaden blev ungefär 10 miljarder dollar, långt över ursprungliga planer. Namnet kommer från James Webb, som ledde NASA under 1960-talets Apolloprogram.

    Huvudspegeln är 6,5 meter i diameter, byggd av 18 sexkantiga guldbelagda segment som vecklades ut i rymden – jämfört med 2,4 meter för [Hubbleteleskopet](#hubbleteleskopet-1990). Webb ser främst infrarött ljus, alltså värmestrålning med längre våglängd än synligt ljus. Det behövs för att se de första galaxerna: ljus från dem har på vägen sträckts ut av universums expansion till infrarött. För att inte störas av egen värme kyls instrumenten till omkring −230 °C bakom en solskärm stor som en tennisbana, och teleskopet befinner sig 1,5 miljoner km från jorden, i en punkt (L2) där det alltid har jorden och solen på samma sida.

    Webb har sett galaxer som fanns några hundra miljoner år efter Big Bang, fler och ljusstarkare än många modeller förutsagt. Det analyserar också atmosfärer hos planeter kring andra stjärnor genom att se vilka våglängder som absorberas när planeten passerar framför sin stjärna. Det kompletterar mätningar av [bakgrundsstrålningen](#bakgrundsstralningen-1965) när man rekonstruerar universums tidiga historia.

kvantdatorer:
  period: 2020
  label: "kvantdatorer"
  title: "Kvantdatorer"
  wiki:
    - "sv:Kvantdator"
    - "en:Quantum computing"
    - "en:Shor's algorithm"
  text: |
    En vanlig dator räknar med bitar som är 0 eller 1. En kvantdator använder kvantbitar (qubits), fysiska system som följer [kvantmekaniken](#kvantmekaniken-192526): en qubit kan vara i en superposition, en kombination av 0 och 1 med komplexa vikter, och flera qubits kan vara sammanflätade så att deras tillstånd bara kan beskrivas tillsammans. n qubits beskrivs av 2ⁿ sådana vikter. En algoritm manipulerar vikterna så att fel svar tar ut varandra och rätt svar förstärks när man till sist mäter.

    Idén kom från fysikern Richard Feynman 1981–82: kvantsystem är för svåra att simulera på vanliga datorer, så bygg datorer av kvantsystem. 1994 visade Peter Shor att en kvantdator kan faktorisera stora tal snabbt, vilket skulle knäcka [RSA](#rsa-1977). Det gjorde området strategiskt. Men qubits är extremt känsliga: värme och vibrationer förstör superpositionen på bråkdelar av en sekund, så de flesta byggs av supraledande kretsar kylda nära absoluta nollpunkten, eller av fångade joner eller atomer.

    2019 hävdade Google ”kvantöverlägsenhet”: en uppgift utan praktisk nytta löst snabbare än med klassiska superdatorer. Under 2020-talet har maskiner med hundratals till över tusen qubits byggts, och felkorrigering, där många fysiska qubits tillsammans bildar en pålitlig logisk qubit, har börjat fungera i experiment. Att knäcka RSA kräver uppskattningsvis hundratusentals till miljontals fysiska qubits, så nyttiga kvantdatorer ligger troligen år bort. Förväntad första nytta är simulering av molekyler och material.
