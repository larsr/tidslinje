young-ljus-ar-vagor:
  period: 1800
  label: "Young: ljus är vågor"
  title: "Dubbelspalten: ljus interfererar"
  wiki:
    - "en:Young's interference experiment"
    - "sv:Thomas Young"
  text: |
    **Thomas Young** (1773–1829) var en engelsk läkare och fysiker med extremt bred begåvning – han bidrog också till att tolka egyptiska hieroglyfer. Omkring 1801–1803 visade han att ljus beter sig som vågor.

    Under 1700-talet dominerade [Newtons](#newton-opticks-1704) uppfattning att ljus består av små partiklar, medan [Huygens](#huygens) hade föreslagit vågor. Youngs avgörande försök var *dubbelspalten*: ljus från en källa får passera två smala, närliggande springor och träffa en skärm. Om ljus vore partiklar borde man se två ljusa streck. I stället syns ett mönster av många ljusa och mörka ränder. Förklaringen är *interferens*: där vågtoppar från de två springorna möts förstärker de varandra (ljust), där en topp möter en dal tar de ut varandra (mörkt). Det är samma fenomen som när två stenar kastas i en damm. Ur randavståndet kunde Young räkna ut ljusets våglängd: ungefär 0,4 mikrometer för violett och 0,7 för rött.

    Young möttes först av skepsis, men fransmannen Augustin Fresnel byggde på 1810-talet en matematisk vågteori som vann. [Maxwell](#maxwells-ekvationer-1865) visade sedan vad som svänger: elektriska och magnetiska fält. Historien fick en twist när [Einstein 1905](#einstein-1905-och-1915) visade att ljus också kommer i partikelliknande paket, fotoner. Dubbelspalten blev därför ett standardexempel i kvantmekaniken.

goethes-farglara-1810:
  period: 1800
  label: "Goethes färglära 1810"
  title: "Diktaren som utmanade Newton"
  wiki:
    - "en:Theory of Colours"
    - "sv:Johann Wolfgang von Goethe"
  text: |
    **Johann Wolfgang von Goethe** (1749–1832) var Tysklands mest berömde diktare, känd för bland annat *Faust* (se [Goethe](#goethe)). Han ägnade också decennier åt naturvetenskap och ansåg själv att hans färglära, *Zur Farbenlehre* (1810, omkring 1 400 sidor), var hans viktigaste verk.

    Goethe angrep [Newtons prismaförsök](#newton-gravitation-och-prisman-1666). Newton hade visat att vitt ljus är en blandning av färger som ett prisma delar upp. Goethe tyckte att det var orimligt att det rena vita skulle bestå av färger. Han menade i stället att färger uppstår i mötet mellan ljus och mörker och pekade på att färgade kanter syns just där ljusa och mörka ytor möts när man tittar genom ett prisma.

    Som fysik var Goethes teori fel; Newtons förklaring höll, och [Young](#young-ljus-ar-vagor) visade samtidigt att färg motsvarar ljusets våglängd. Men Goethes noggranna iakttagelser av hur vi *upplever* färg – efterbilder, färgade skuggor, att en grå yta ser olika ut beroende på omgivningen – var värdefulla. De påverkade målare som William Turner och blev en tidig del av perceptionspsykologin. Dagens bild förenar båda: färg är både fysik (våglängder) och hjärnans tolkning av signaler från ögats tre sorters tappar, en idé som Young också föreslog.

orsted-strom-ger-magnetism-1820:
  period: 1820
  label: "Ørsted: ström ger magnetism 1820"
  title: "Elektricitet och magnetism hänger ihop"
  wiki:
    - "sv:Hans Christian Ørsted"
    - "en:Electromagnetism"
  text: |
    **Hans Christian Ørsted** (1777–1851) var en dansk fysiker och kemist i Köpenhamn. Våren 1820 lade han märke till att en kompassnål slog ut när han slöt en strömkrets i närheten. Elektrisk ström hade bara varit möjlig att få ut jämnt och länge sedan Alessandro Volta byggde det första batteriet år 1800, efter [Galvanis försök](#galvanis-grodlar) med grodlår.

    Det märkliga var riktningen. Nålen pekade inte mot tråden utan ställde sig vinkelrätt mot den: strömmen omges av ett magnetfält som går i cirklar runt ledaren. Elektricitet och magnetism hade dittills betraktats som två helt olika krafter, även om många, Ørsted själv inräknad, hade anat ett samband. Nu fanns ett enkelt, upprepbart försök.

    Nyheten spreds på veckor. I Paris formulerade André-Marie Ampère samma höst lagar för kraften mellan strömförande ledare (strömmens enhet ampere är uppkallad efter honom), och elektromagneten – en järnkärna lindad med tråd som blir magnetisk när ström flyter – uppfanns 1824. I London vände [Michael Faraday](#faraday-motor-1821-induktion-1831) på frågan: om ström ger magnetism, kan magnetism ge ström? Elektromagneten blev hjärtat i [telegrafen](#telegrafen-morse-1837), och kedjan ledde till [Maxwells](#maxwells-ekvationer-1865) förening av elektricitet, magnetism och ljus. Enheten för magnetisk fältstyrka i det äldre cgs-systemet heter oersted.

faraday-motor-1821-induktion-1831:
  period: 1820
  label: "Faraday: motor 1821, induktion 1831"
  title: "Rörelse blir ström, ström blir rörelse"
  wiki:
    - "sv:Michael Faraday"
    - "sv:Elektromagnetisk induktion"
  text: |
    **Michael Faraday** (1791–1867) var en engelsk fysiker och kemist, son till en smed, som saknade formell utbildning och började som bokbindarlärling. Han blev ändå en av historiens största experimentatorer, vid Royal Institution i London.

    1821, året efter [Ørsteds upptäckt](#orsted-strom-ger-magnetism-1820), byggde han den första elmotorn: en strömförande tråd som hängde ned i en skål med kvicksilver roterade kontinuerligt runt en stavmagnet. Elektrisk energi omvandlades till ihållande rörelse. 1831 kom den större upptäckten, *elektromagnetisk induktion*: när magnetfältet genom en ledarslinga *ändras*, till exempel för att en magnet förs in i en spole, uppstår en spänning i slingan. Ett konstant fält ger ingenting; det är förändringen som räknas. Den inducerade spänningen är proportionell mot hur snabbt det magnetiska flödet genom slingan ändras.

    Induktionen är principen bakom generatorn, där mekanisk rörelse ger ström, och bakom transformatorn, som höjer eller sänker växelspänning. Det gjorde det möjligt att producera el i stor skala, se [Siemens dynamo](#siemens-dynamo-1866) och [de första kraftstationerna](#edisons-kraftstation-1882). Faraday tänkte sig också att rummet runt magneter och laddningar är fyllt av "kraftlinjer" – begreppet fält. Han kunde knappt någon matematik, men [Maxwell](#maxwells-ekvationer-1865) översatte hans bild till ekvationer. Kapacitansens enhet farad är uppkallad efter honom.

carnot-1824:
  period: 1820
  label: "Carnot 1824"
  title: "Hur mycket arbete kan värme ge?"
  wiki:
    - "en:Nicolas Léonard Sadi Carnot"
    - "en:Carnot cycle"
  text: |
    **Sadi Carnot** (1796–1832) var en fransk militäringenjör, son till en av revolutionens ledande politiker. Han såg att Storbritanniens ångmaskiner gav landet ett industriellt och militärt försprång och frågade något nytt: finns det en övre gräns för hur effektiv en värmemotor kan bli? En värmemotor är varje maskin som får mekaniskt arbete ur värme, som [ångmaskinen](#watts-angmaskin-1769). 1824 gav han ut den tunna boken *Réflexions sur la puissance motrice du feu* ("Betraktelser över eldens drivkraft").

    Carnots svar: arbetet kommer av att värme flödar från något varmt till något kallt, ungefär som vatten som faller genom ett vattenhjul. Hur mycket arbete man kan få ut beror bara på temperaturskillnaden, inte på om man använder ånga, luft eller något annat. I modern form är den högsta möjliga verkningsgraden 1 − Tkall/Tvarm, där temperaturerna mäts i kelvin. En maskin med ånga på 200 °C (473 K) som kyls mot 20 °C (293 K) kan alltså som bäst omvandla omkring 38 % av värmen till arbete. Därför byggs kraftverk för så höga temperaturer som möjligt.

    Carnot dog i kolera 36 år gammal och boken ignorerades i nästan tjugo år. Han trodde dessutom att värme var ett ämne som bevaras. När [Kelvin](#kelvin) och [Clausius](#clausius-entropi) omkring 1850 förenade hans resonemang med [energiprincipen](#energiprincipen-joule-helmholtz-1847) blev det termodynamikens andra huvudsats.

energiprincipen-joule-helmholtz-1847:
  period: 1840
  label: "Energiprincipen (Joule, Helmholtz 1847)"
  title: "Energi kan bara byta form"
  wiki:
    - "sv:Energiprincipen"
    - "sv:James Prescott Joule"
  text: |
    **Energiprincipen**, i dag termodynamikens första huvudsats, säger att energi aldrig skapas eller förstörs utan bara omvandlas mellan former: rörelse, värme, kemisk, elektrisk energi och så vidare. Den totala mängden i ett slutet system är konstant. Det låter självklart nu, men omkring 1840 sågs värme ofta som ett eget viktlöst ämne, "värmeämne", som flödade men inte omvandlades.

    **James Prescott Joule** (1818–1889), en engelsk bryggarson och amatörforskare, mätte på 1840-talet hur mycket värme ett givet mekaniskt arbete ger. I hans mest kända försök drev ett fallande lod en skovel som rörde om vatten, och vattnet blev mätbart varmare. Han fann att ungefär 4,2 joule arbete (i dagens enheter) värmer ett gram vatten en grad – den "mekaniska värmeekvivalenten". Energienheten joule är uppkallad efter honom. Den tyske läkaren Julius Robert Mayer hade kommit fram till samma princip 1842, och **Hermann von Helmholtz** (1821–1894), tysk läkare och fysiker, gav den 1847 en allmän matematisk form som omfattade mekanik, värme, elektricitet och levande varelser.

    Principen förenade fysiken och gav ett bokföringsverktyg för allt från ångmaskiner till ämnesomsättning (jämför [Lavoisiers](#lavoisier-andning-ar-forbranning) syn på andning). Tillsammans med [Carnots](#carnot-1824) arbete ledde den till termodynamikens andra huvudsats, formulerad av [Kelvin](#kelvin) och [Clausius](#clausius-entropi): energin bevaras, men den blir allt mindre användbar.

kelvin:
  period: 1840
  label: "Kelvin"
  title: "Kelvin: absoluta nollpunkten och kabeln"
  wiki:
    - "en:Lord Kelvin"
    - "sv:Kelvin"
  text: |
    **William Thomson** (1824–1907), adlad som **Lord Kelvin** 1892, var en brittisk fysiker och ingenjör verksam vid universitetet i Glasgow i över 50 år. Han var 1800-talets typiske vetenskapsman-entreprenör: lika delar teoretiker och uppfinnare med många patent.

    1848 föreslog han en *absolut temperaturskala*, byggd på [Carnots](#carnot-1824) teori om värmemotorer i stället för på hur ett visst ämne, som kvicksilver, utvidgas. Skalan har en naturlig nollpunkt, den *absoluta nollpunkten*, där ingen mer värme kan tas ut ur ett ämne: −273,15 °C. Enheten kelvin (K) har samma stegstorlek som en grad [Celsius](#celsius), så vatten fryser vid 273,15 K. Omkring 1850–1851 formulerade han, parallellt med [Clausius](#clausius-entropi), termodynamikens andra huvudsats: det går inte att bygga en maskin som bara omvandlar värme från en enda temperatur till arbete.

    Kelvin var också den vetenskapliga rådgivaren bakom [Atlantkabeln](#atlantkabeln-1858). Han räknade ut hur signaler förvrängs i långa kablar, uppfann en mycket känslig mottagare (spegelgalvanometern) och blev rik och adlad på det. Han tog också miste ibland: hans uppskattning av jordens ålder till högst omkring 100 miljoner år, byggd på hur fort jorden svalnar, var för kort för Darwins evolution. Han kände inte till radioaktivitetens värme, som upptäcktes först kring 1900; i dag vet vi att jorden är omkring 4,5 miljarder år.

maxwells-ekvationer-1865:
  period: 1860
  label: "Maxwells ekvationer 1865"
  title: "Ljus är elektromagnetiska vågor"
  wiki:
    - "sv:Maxwells ekvationer"
    - "sv:James Clerk Maxwell"
  text: |
    **James Clerk Maxwell** (1831–1879) var en skotsk fysiker. 1865 publicerade han en teori som samlade allt man visste om elektricitet och magnetism i ett fåtal ekvationer. Han byggde på [Faradays](#faraday-motor-1821-induktion-1831) idé om *fält*: att varje punkt i rummet har ett elektriskt fält E och ett magnetiskt fält B, båda vektorer som varierar med plats och tid.

    Ekvationerna säger i ord, i den kompakta form som Oliver Heaviside gav dem omkring 1884: (1) elektriska laddningar ger upphov till ett elektriskt fält; (2) det finns inga magnetiska laddningar – fältlinjerna är slutna; (3) ett magnetfält som ändras ger ett elektriskt fält som cirkulerar (Faradays induktion); (4) elektrisk ström och ett elektriskt fält som ändras ger ett magnetfält som cirkulerar ([Ørsteds](#orsted-strom-ger-magnetism-1820) effekt plus Maxwells eget tillägg). Tillägget i (4) var avgörande: tillsammans med (3) betyder det att ett ändrat E-fält ger ett B-fält som ger ett E-fält och så vidare – en våg som fortplantar sig själv genom tomma rummet.

    Maxwell räknade ut vågens hastighet ur två uppmätta elektriska konstanter och fick omkring 300 000 km/s – ljusets hastighet. Slutsatsen: ljus är en elektromagnetisk våg. [Heinrich Hertz](#hertz-radiovagor-1887) skapade 1887 sådana vågor med gnistor och bekräftade teorin, vilket ledde till radio, radar, mobilnät och wifi. Att ekvationerna ger samma ljushastighet för alla observatörer var en motsägelse mot Newtons mekanik som [Einsteins relativitetsteori](#einstein-1905-och-1915) löste.

clausius-entropi:
  period: 1860
  label: "Clausius: entropi"
  title: "Entropi: varför värme bara går en väg"
  wiki:
    - "sv:Entropi"
    - "sv:Rudolf Clausius"
  text: |
    **Rudolf Clausius** (1822–1888) var en tysk fysiker. 1850 förenade han [Carnots](#carnot-1824) teori om värmemotorer med [energiprincipen](#energiprincipen-joule-helmholtz-1847) och formulerade termodynamikens andra huvudsats: värme går aldrig av sig självt från en kall kropp till en varm. Ett kylskåp kan flytta värme åt "fel" håll, men bara genom att förbruka arbete.

    1865 gav han lagen en storhet att räkna med, och ett namn: *entropi*, betecknad S, från grekiskans ord för förvandling. Förändringen i entropi definieras som tillförd värme delad med den absoluta temperatur (i kelvin) vid vilken den tillförs, ΔS = Q/T. När värmemängden Q går från varmt till kallt minskar entropin lite i den varma kroppen (stort T) och ökar mer i den kalla (litet T), så totalen växer. Andra huvudsatsen blir: i ett isolerat system kan entropin aldrig minska. Clausius sammanfattade: "Universums energi är konstant. Universums entropi strävar mot ett maximum."

    Det förklarar varför processer i naturen har en riktning – varför ett glas som går sönder inte lagar sig självt – och varför ingen maskin kan omvandla all värme till arbete. Österrikaren Ludwig Boltzmann gav på 1870-talet entropin en statistisk tolkning: den mäter hur många mikroskopiska tillstånd som ger samma makroskopiska tillstånd, S = k·log W, där W är antalet tillstånd och k en naturkonstant. [Shannon](#shannon-informationsteori-1948) använde 1948 en formel av samma form för informationsmängd och kallade den också entropi.

hertz-radiovagor-1887:
  period: 1880
  label: "Hertz: radiovågor 1887"
  title: "Hertz visar att radiovågor finns"
  wiki:
    - "sv:Heinrich Hertz"
    - "en:Electromagnetic radiation"
  text: |
    **Heinrich Hertz** (1857–1894) var en tysk fysiker. År 1887 visade han experimentellt något som skotten James Clerk Maxwell hade förutsagt matematiskt drygt tjugo år tidigare i [sina ekvationer för elektricitet och magnetism](#maxwells-ekvationer-1865): att ett elektriskt fält som svänger skapar ett magnetiskt fält som svänger, och vice versa, så att störningen fortplantar sig genom rummet som en våg – en elektromagnetisk våg.

    Hertz sändare var ett gnistgap: två metallkulor med hög spänning emellan, där varje gnista fick ström att svänga fram och tillbaka mycket snabbt. Mottagaren var en enkel metallslinga med ett litet gap, där en svag gnista syntes när vågen träffade. Han mätte våglängder i storleksordningen en meter, och visade att vågorna kunde reflekteras, brytas och polariseras precis som ljus, och att de rörde sig med ljusets hastighet. Därmed var det visat att ljus och dessa nya vågor är samma fenomen, bara med olika våglängd.

    Hertz själv såg ingen praktisk användning. Men bara några år senare byggde [Guglielmo Marconi](#marconi) trådlös telegrafi på exakt samma princip. Enheten för frekvens, hertz (Hz, svängningar per sekund), är uppkallad efter honom – en 5 GHz wifi-signal är samma slags våg som hans gnistor, fast med en våglängd på ungefär sex centimeter.

michelsonmorley-1887:
  period: 1880
  label: "Michelson–Morley 1887"
  title: "Experimentet som inte hittade etern"
  wiki:
    - "en:Michelson–Morley experiment"
    - "en:Luminiferous aether"
  text: |
    På 1800-talet trodde fysiker att ljusvågor, liksom ljudvågor, måste röra sig i något medium. Det tänkta mediet kallades *etern* och skulle fylla hela rymden. Om jorden rör sig genom etern (runt solen i ungefär 30 km/s) borde ljus färdas olika snabbt i olika riktningar relativt oss, ungefär som motvind och medvind.

    De amerikanska fysikerna **Albert Michelson** och **Edward Morley** testade detta 1887 i Cleveland med en *interferometer*: en ljusstråle delas i två som går i vinkelräta armar, studsar mot speglar och förenas igen. Om den ena strålen fördröjs en aning förskjuts mönstret av ljusa och mörka band (interferensmönstret). Apparaten låg på en stenplatta som flöt på kvicksilver så att den kunde vridas. Förväntad förskjutning var ungefär 0,4 band; de såg högst en liten bråkdel av det – i praktiken ingenting.

    Resultatet var en gåta i nästan tjugo år. Fysiker som Hendrik Lorentz föreslog att föremål krymper i rörelseriktningen precis så mycket att effekten döljs. Den radikala lösningen kom med [Einsteins speciella relativitetsteori 1905](#einstein-1905-och-1915): ljusets hastighet är densamma för alla observatörer, och etern behövs inte. Interferometern lever kvar – [gravitationsvågsdetektorn LIGO](#gravitationsvagor-2015) bygger på samma princip med fyra kilometer långa armar.

