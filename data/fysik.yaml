ibn-al-haytham-experimentell-optik:
  period: 1000
  label: "Ibn al-Haytham: experimentell optik, camera obscura"
  title: "Ibn al-Haytham och experimentell optik"
  wiki:
    - "en:Ibn al-Haytham"
    - "en:Book of Optics"
    - "sv:Camera obscura"
  text: |
    **Ibn al-Haytham** (ca 965–1040, latiniserat Alhazen) var en arabisk matematiker och fysiker från Basra som verkade i Kairo. I *Optikens bok* (skriven ca 1011–1021) avgjorde han en gammal tvist: grekerna Euklides och Ptolemaios hade trott att ögat skickar ut strålar mot föremålen. Ibn al-Haytham visade att seendet fungerar tvärtom – ljus från varje punkt på ett föremål går i raka linjer in i ögat.

    Ett av hans redskap var **camera obscura** (”mörkt rum”): ett mörkt rum eller låda med ett litet hål i ena väggen. Ljus genom hålet ger en upp- och nedvänd bild av omvärlden på motsatta väggen. Han använde den för att visa att ljusstrålar går rakt och inte blandas när de korsar varandra. Samma princip finns i varje kamera i dag – linsen ersätter hålet.

    Det nya var metoden: han ställde upp kontrollerade försök med lampor, skärmar och hål och lät resultaten avgöra, inte auktoriteter. Boken översattes till latin omkring 1200 och påverkade [Grosseteste](#grosseteste-optik-och-experimentell), [Roger Bacon](#roger-bacon-experiment-linser) och [Witelo](#witelo-optik-perspectiva), och via dem senare Kepler. Den lade grunden för förståelsen av linser och därmed för [glasögonen](#glasogon-uppfinns-1286-2).

al-biruni-mater-jordens-radie:
  period: 1000
  label: "al-Biruni mäter jordens radie"
  title: "al-Biruni mäter jorden från ett berg"
  wiki:
    - "en:Al-Biruni"
    - "en:Earth radius"
  text: |
    **al-Biruni** (973–ca 1050) var en persisk-centralasiatisk lärd från Khwarezm (vid Aralsjön) som verkade vid hovet hos [Mahmud av Ghazni](#mahmud-av-ghazni) och följde med på dennes fälttåg till Indien. Han skrev om astronomi, matematik, geografi och indisk kultur.

    Hans metod för att mäta jordens radie behövde bara ett berg och ett vinkelinstrument. Först mätte han bergets höjd *h* med trianglar från slätten. Sedan mätte han från toppen hur mycket horisonten ligger under vågrät linje, vinkeln *α*. Synlinjen till horisonten tangerar jordklotet, så en rätvinklig triangel ger cos *α* = *R*/(*R*+*h*), alltså *R* = *h*·cos *α*/(1 − cos *α*).

    Mätningen gjordes vid Nandana i nuvarande Pakistan, och resultatet motsvarar ungefär 6 340 km – nära dagens medelvärde, ca 6 371 km. Exaktheten var delvis tur, eftersom vinkeln är mycket liten och ljusets brytning i luften stör. Äldre metoder krävde två orter långt ifrån varandra: grekern Eratosthenes (ca 240 f.Kr.) jämförde solskuggor i två egyptiska städer. al-Birunis metod kunde göras av en person på en plats. Han funderade också på [om jorden roterar](#al-biruni-kan-jorden-rotera).

ibn-sina-rorelse-och-impuls-mayl:
  period: 1020
  label: "Ibn Sina: rörelse och impuls (mayl)"
  title: "Ibn Sina och kastade föremål"
  wiki:
    - "en:Theory of impetus"
    - "en:Avicenna"
  text: |
    **Ibn Sina** (980–1037, latiniserat Avicenna) var en persisk läkare och filosof, mest känd för [Medicinens kanon](#ibn-sina-medicinens-kanon-1025). Han skrev också om fysik och tog sig an ett problem i Aristoteles lära.

    Den grekiske filosofen Aristoteles (300-talet f.Kr.) menade att ett föremål bara rör sig så länge något skjuter på det. Men vad driver en kastad sten efter att den lämnat handen? Aristoteles svar var att luften runt stenen fortsätter att knuffa den – en förklaring som många redan i antiken tyckte var konstlad.

    Ibn Sina föreslog att kastaren ger stenen en inre egenskap, **mayl** (arabiska ungefär ”böjelse”), som sedan bär rörelsen. Mayl tar inte slut av sig själv utan förbrukas av luftens motstånd; i ett vakuum skulle rörelsen, menade han, fortsätta oavbrutet. Det liknar tröghetslagen – att ett föremål behåller sin rörelse om ingen kraft verkar – men hos Ibn Sina var mayl fortfarande en orsak som höll rörelsen igång, inte rörelsen själv.

    Idén levde vidare i den latinska [impetusteorin](#buridan-impetusteorin) hos Jean Buridan på 1300-talet, och Galilei började sin bana inom den traditionen. Det slutgiltiga steget, där rörelse inte behöver någon orsak alls, kom med Newtons första lag i [Principia 1687](#newton-principia-1687).

al-biruni-kan-jorden-rotera:
  period: 1020
  label: "al-Biruni: kan jorden rotera?"
  title: "al-Biruni: snurrar jorden?"
  wiki:
    - "en:Al-Biruni"
    - "en:Earth's rotation"
  text: |
    Varje dygn verkar hela stjärnhimlen vrida sig ett varv runt jorden. Det kan förklaras på två sätt: antingen roterar himlen, eller så står himlen still och jorden snurrar runt sin axel. Den indiske astronomen Aryabhata hade redan år 499 föreslagit det senare, men de flesta, med Aristoteles och Ptolemaios, avfärdade det: om jorden snurrade borde fåglar och moln blåsa bort västerut. Vid ekvatorn skulle ytan röra sig med ungefär 1 670 km/h.

    [al-Biruni](#al-biruni-mater-jordens-radie) (973–ca 1050), som kände indisk astronomi väl, diskuterade frågan omkring 1030, bland annat i en brevväxling med Ibn Sina och i sitt stora astronomiska verk. Hans slutsats var nykter: astronomiska observationer kan inte avgöra saken, eftersom båda modellerna förutsäger exakt samma rörelser på himlen. Frågan måste avgöras av fysiken, och där lämnade han den öppen.

    Poängen är att han skiljde mellan vad matematiken kan visa och vad fysiken måste visa – en distinktion som återkom när [Nicole Oresme 1377](#oresme-jordens-rotation-mojlig-1377) visade att argumenten mot rotation inte håller. [Kopernikus](#kopernikus-de-revolutionibus-1543) gjorde rotationen till en del av sin modell 1543, men ett direkt fysiskt bevis kom först med Foucaults pendel 1851.

supernovan-1054-dokumenteras-i-kina:
  period: 1040
  label: "Supernovan 1054 dokumenteras i Kina"
  title: "Supernovan 1054"
  wiki:
    - "en:SN 1054"
    - "en:Crab Nebula"
  text: |
    Den 4 juli 1054 noterade astronomerna vid Songdynastins hov en ”gäststjärna” i stjärnbilden Oxen. Den var så ljus att den syntes på dagen i 23 dagar och på natthimlen i nästan två år. Kinesiska hovastronomer förde noggranna loggar eftersom himlafenomen tolkades som tecken om kejsarens styre.

    I dag vet vi att det var en **supernova**: en stjärna med många gånger solens massa som brände slut på sitt bränsle, varpå kärnan kollapsade och de yttre lagren slungades ut i en explosion som tillfälligt lyste som miljarder solar. Resterna syns i dag som **Krabbnebulosan**, ett gasmoln cirka 6 500 ljusår bort som fortfarande expanderar. Mitt i den finns en pulsar, en neutronstjärna – den kollapsade kärnan, ungefär 20 km i diameter – som roterar cirka 30 varv per sekund. Genom att räkna bakåt från nebulosans expansion har man kunnat bekräfta att den uppstod ungefär vid 1050-talet.

    Märkligt nog finns nästan inga europeiska noteringar. En förklaring är att den aristoteliska läran sade att himlen ovanför månen är evigt oföränderlig. Den föreställningen bröts först när [Tycho Brahe](#tycho-pa-ven) mätte en ny supernova 1572 och visade att den låg långt bortom månen. De kinesiska loggarna är i dag värdefulla data för astrofysiker.

shen-kuo-magnetisk-deklination:
  period: 1060
  label: "Shen Kuo: magnetisk deklination"
  title: "Shen Kuo upptäcker deklinationen"
  wiki:
    - "en:Shen Kuo"
    - "en:Magnetic declination"
  text: |
    **Shen Kuo** (1031–1095) var en kinesisk ämbetsman och universalgeni under Songdynastin: astronom, ingenjör, diplomat och general. I sina anteckningar *Mengxi bitan* (”Drömbäckens uppsatser”, 1088) beskrev han allt från fossil och geologi till [Bi Shengs lösa typer](#bi-sheng-losa-typer-1040) och kompassen.

    Han beskrev hur en järnnål gnids mot magnetit (en naturligt magnetisk sten) och sedan hängs i en silkestråd, så att den kan vrida sig fritt och pekar i nord–sydlig riktning. Det är den första tydliga beskrivningen av en magnetisk kompassnål. Han noterade dessutom att nålen inte pekar exakt mot söder utan något åt öster.

    Detta är **magnetisk deklination**: vinkeln mellan riktningen mot den magnetiska polen och mot den geografiska. Den beror på att jordens magnetfält, som uppstår av strömmar i det flytande järnet i jordens kärna, inte är riktat exakt längs rotationsaxeln. Deklinationen varierar mellan platser och ändras över tid; för långa sjöresor måste navigatörer korrigera för den. Européer upptäckte fenomenet först på 1400-talet. Shen Kuos beskrivning kom strax före den första kända användningen av [kompass till sjöss](#magnetkompass-for-navigation-kina-1090); i Europa nämns kompassen först av [Neckam ~1190](#neckam-beskriver-magnetkompassen-1190), och jordens magnetism förklarades av [William Gilbert 1600](#gilbert-de-magnete-1600-ordet).

