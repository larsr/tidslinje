# Övrigt
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

korea-goryeo-dynastin:
  period: 1000
  label: "Korea: Goryeo-dynastin"
  title: "Goryeodynastin i Korea (918–1392)"
  wiki:
    - "sv:Goryeo"
    - "en:Goryeo"
  text: |
    **Goryeo** var den dynasti som styrde Korea 918–1392. Den grundades av
    Wang Geon, som 936 enade koreanska halvön efter en period av
    splittring. Det är från Goryeo som namnet **Korea** kommer, via
    arabiska och europeiska köpmän.

    Staten byggde på kinesisk modell, med examensprov för tjänstemän från
    958, men styrdes i praktiken av en aristokrati. Buddhismen var
    statsreligion. Goryeo är känt för sitt gröna **celadonporslin**, som
    även kineserna ansåg vara världens finaste, och för **[Tripitaka
    Koreana](#korea-goryeo-trasnitt-av-buddhistisk)**: hela den
    buddhistiska kanon tryckt med över 81 000 träblock på 1200-talet, som
    finns bevarade än idag. År 1377 trycktes *Jikji* med lösa metalltyper,
    världens äldsta bevarade bok tryckt så – 78 år före [Gutenbergs
    bibel](#gutenberg-tryckpress-1450-bibeln-1455).

    Goryeo låg i kläm mellan stormakterna. Det fick försvara sig mot
    khitanernas Liaorike (krig 993–1019, med en khitansk armé på
    uppskattningsvis 100 000 man 1018) och underkastades mongolerna på
    1200-talet. Dynastin ersattes 1392 av
    [Joseondynastin](#korea-joseon-1392), som styrde till 1910.

bysans-hagia-sofia-mosaiker:
  period: 1020
  label: "Bysans: Hagia Sofia-mosaiker"
  title: "Hagia Sofias mosaiker"
  wiki:
    - "sv:Hagia Sofia"
    - "sv:Bysantinska riket"
  text: |
    **Bysantinska riket** var det östromerska riket, som fanns kvar i
    nästan tusen år efter att Västrom föll (476), med huvudstaden
    Konstantinopel (dagens Istanbul). Det var grekisktalande och kristet
    ortodoxt.

    **Hagia Sofia** ("Den heliga visheten") byggdes 532–537 under kejsar
    Justinianus och var i nästan tusen år världens största kyrka. Kupolen
    är cirka 31 meter i diameter. Mosaiker – bilder lagda av små bitar
    färgat glas och guld – sattes upp under flera hundra år. På 1000-talet
    tillkom bland annat ett porträtt av kejsarinnan Zoe och hennes make,
    där makens ansikte troligen byttes ut när hon gifte om sig.

    Varför det spelar roll: mosaikerna är bland de främsta exemplen på
    bysantinsk konst, som påverkade ryska ikoner och italiensk konst före
    renässansen. När [osmanerna tog Konstantinopel
    1453](#mehmed-ii-tar-konstantinopel-1453) blev kyrkan moské och
    mosaikerna putsades så småningom över. De togs fram igen efter att
    byggnaden blev museum 1934; sedan 2020 är den åter moské.

korea-goryeo-trasnitt-av-buddhistisk:
  period: 1040
  label: "Korea: Goryeo-träsnitt av buddhistisk kanon"
  title: "Goryeos tryck av buddhistiska kanon"
  wiki:
    - "en:Tripitaka Koreana"
    - "sv:Goryeo"
  text: |
    **[Goryeo](#korea-goryeo-dynastin)** (918–1392) var den koreanska
    dynasti som gett Korea dess namn. Buddhismen var statsreligion. Den
    **buddhistiska kanon** (Tripitaka) är samlingen av buddhistiska
    skrifter – tal av Buddha, regler för munkar och filosofiska texter –
    omfattande tusentals texter.

    Från 1011 lät Goryeo skära hela kanon i träblock för tryck. Projektet
    tog till 1087. Det var tänkt att genom religiös förtjänst skydda
    landet mot invasioner från khitanerna, ett nomadfolk i norr. Blocken
    brändes av mongolerna 1232, och då skars en ny uppsättning:
    **Tripitaka Koreana** (1237–1248), cirka 81 000 träblock med cirka 52
    miljoner tecken, nästan helt utan fel.

    Varför det spelar roll: Tripitaka Koreana finns bevarad i templet
    Haeinsa och är världsarv. Den visar Östasiens försprång i tryckteknik.
    Korea gick sedan vidare till lösa metalltyper – boken Jikji (1377) är
    världens äldsta bevarade bok tryckt så, 78 år före [Gutenbergs
    bibel](#gutenberg-tryckpress-1450-bibeln-1455).

rum-sultanatet-i-anatolien:
  period: 1060
  label: "Rum-sultanatet i Anatolien"
  title: "Rum-sultanatet"
  wiki:
    - "en:Sultanate of Rum"
    - "sv:Seldjuker"
  text: |
    Efter att seldjukerna (en turkisk dynasti som erövrat Iran och Irak)
    krossat Bysans vid [Manzikert
    1071](#manzikert-1071-seldjuker-krossar-bysans) flyttade turkiska
    grupper in i **Anatolien** – den halvö som utgör större delen av
    dagens Turkiet. Omkring 1077 grundade **Suleiman ibn Qutalmish**, en
    avlägsen släkting till de stora seldjuksultanerna, ett eget rike där.

    Det kallades **Rum-sultanatet**. ”Rum” betyder Rom – alltså ”landet
    som tillhört romarna”, eftersom Bysans såg sig som Romarriket. Första
    huvudstaden var Nicaea (İznik), bara ca 100 km från Konstantinopel,
    men den förlorades till korsfararna 1097. Därefter blev **Konya**
    huvudstad.

    Under 1200-talet blomstrade sultanatet: längs handelsvägarna byggdes
    **karavanseraj** – befästa värdshus för köpmän och kameler, med ca en
    dagsresas avstånd (30–40 km) emellan. Sufimystikern Rumi verkade i
    Konya. Efter nederlaget mot mongolerna vid Köse Dağ 1243 blev riket
    mongoliskt lydrike och föll sönder omkring 1300. Ur resterna växte ett
    litet furstendöme som blev **[Osmanska
    riket](#osman-i-grundar-osmanska-staten-1299)**, som [1453 erövrade
    Konstantinopel](#mehmed-ii-tar-konstantinopel-1453).

korea-joseon-1392:
  period: 1380
  label: "Korea: Joseon 1392"
  title: "Joseondynastin i Korea 1392"
  wiki:
    - "sv:Joseondynastin"
    - "en:Taejo of Joseon"
  text: |
    Korea styrdes sedan 918 av **Goryeodynastin**, som gett landet dess
    västerländska namn. På 1300-talet hade Goryeo varit vasall under
    mongolerna och var försvagat av japanska pirater, inre maktkamp och
    korruption. När [Mingdynastin ersatte mongolerna i Kina
    (1368)](#mingdynastin-1368) splittrades hovet i Korea mellan anhängare
    av mongolerna och av Ming.

    År 1388 beordrades generalen **Yi Seong-gye** att anfalla Ming. Han
    ansåg det vansinnigt, vände med armén tillbaka vid gränsfloden Yalu
    och tog makten. 1392 utropade han sig till kung och grundade
    **Joseondynastin**, med Hanyang (dagens Seoul) som huvudstad. Han lät
    Kina godkänna det nya namnet Joseon.

    Joseon blev en av världens mest långlivade dynastier och styrde i över
    500 år, till 1910 då Japan annekterade Korea. Staten byggdes på
    **konfucianism** – en lära om ordning, plikter mellan över- och
    underordnade, och styre genom utbildade ämbetsmän valda genom examen –
    i stället för buddhism. Den mest kända kungen, **[Sejong den
    store](#korea-sejong-1418)**, lät 1443 skapa det koreanska alfabetet
    *[hangul](#korea-hangul-1443)*, som fortfarande används och ofta
    beskrivs som ett av världens mest logiskt konstruerade skriftsystem.

korea-sejong-1418:
  period: 1400
  label: "Korea: Sejong 1418"
  title: "Kung Sejong den store i Korea, 1418"
  wiki:
    - "en:Sejong the Great"
    - "sv:Joseon"
  text: |
    Korea styrdes 1392–1897 av **Joseondynastin**, en av världshistoriens
    mest långlivade. Staten byggde på konfucianism – en lära om ordning,
    plikt och styre genom utbildade ämbetsmän som valdes ut genom
    examensprov.

    **Sejong** blev kung 1418, 21 år gammal, och regerade till 1450. Han
    kallas ”den store” och är Koreas mest uppskattade härskare; han finns
    på 10 000-wonsedeln. Han samlade lärda i en akademi, *Hall of
    Worthies*, för att arbeta med vetenskap och förvaltning.

    Det mest kända resultatet är **hangul**, det koreanska alfabetet, som
    skapades 1443 ([se Korea: hangul 1443](#korea-hangul-1443)). Men under
    hans tid kom också en standardiserad regnmätare (1441), som gjorde det
    möjligt att systematiskt mäta nederbörd i hela landet, samt vattenur,
    solur och astronomiska instrument, flera konstruerade av ingenjören
    **Jang Yeong-sil**, som ursprungligen var av låg börd.

    Sejong lät också samla jordbrukskunskap i handböcker anpassade till
    koreanskt klimat istället för kinesiskt. Jämför med [Ulugh Beg i
    Samarkand](#ulugh-begs-observatorium-i-samarkand) vid samma tid: en
    härskare som själv drev vetenskap.

korea-hangul-1443:
  period: 1420
  label: "Korea: hangul 1443"
  title: "Hangul, det koreanska alfabetet 1443"
  wiki:
    - "sv:Hangul"
    - "en:Sejong the Great"
  text: |
    Före 1443 skrevs koreanska med **kinesiska tecken**. Kinesiska är ett
    logografiskt skriftsystem – varje tecken står för ett ord eller en
    stavelse med betydelse – och man behöver kunna tusentals tecken.
    Dessutom passar det dåligt till koreanska, som har en helt annan
    grammatik. Bara en liten överklass kunde läsa och skriva.

    Kung **Sejong** ([se Korea: Sejong 1418](#korea-sejong-1418)) skapade
    därför tillsammans med lärda ett nytt alfabet, som skapades 1443 och
    offentliggjordes 1446 under namnet *Hunminjeongeum*, ”de rätta ljuden
    för att undervisa folket”. Det kallas idag **hangul**.

    Hangul är ovanligt systematiskt. Det har i dag 24 grundbokstäver (14
    konsonanter, 10 vokaler). Konsonanternas former bygger på hur
    talorganen ser ut när ljudet uttalas – till exempel visar ㄱ (k)
    tungroten som stänger mot gommen. Bokstäverna grupperas i fyrkantiga
    stavelseblock, så att texten ser ut som kinesisk skrift men läses
    fonetiskt. Det sägs att en klok person lär sig det på en förmiddag.

    Överklassen motsatte sig länge hangul och föredrog kinesiska; det blev
    Koreas officiella skrift först på 1900-talet. I dag har Sydkorea nära
    100 % läskunnighet, och 9 oktober firas som hanguldagen.

magellan-avseglar-1519:
  period: 1500
  label: "Magellan avseglar 1519"
  title: "Magellans världsomsegling 1519–1522"
  wiki:
    - "en:Magellan expedition"
    - "en:Ferdinand Magellan"
    - "en:Juan Sebastián Elcano"
  text: |
    **Ferdinand Magellan** (Fernão de Magalhães) var en portugisisk
    sjöofficer i spansk tjänst. Han ville visa att Kryddöarna (Moluckerna)
    låg på Spaniens sida av [Tordesillaslinjen](#tordesillas-1494) och
    kunde nås västerut. I september 1519 lämnade han Spanien med fem skepp
    och omkring 270 man.

    Efter ett myteri och förlust av två skepp hittade han 1520 ett sund
    vid Sydamerikas sydspets, i dag **Magellans sund**. Han döpte havet på
    andra sidan till *Mar Pacífico*, ”det fredliga havet” – [Stilla
    havet](#balboa-ser-stilla-havet-1513). Det visade sig vara mycket
    större än någon trott: överfarten tog över tre månader, besättningen
    åt läder och råttor och många dog i skörbjugg. [Magellan dödades i
    strid på Filippinerna](#magellan-dodas-pa-filippinerna-1521) i
    april 1521.

    Bara ett skepp, *Victoria*, med 18 överlevande under **Juan Sebastián
    Elcano** kom hem i september 1522 – [den första
    världsomseglingen](#elcano-fullbordar-forsta), nästan tre år. Lasten
    av kryddnejlika betalade ändå expeditionen. Den visade jordens
    verkliga storlek och att världshaven hängde samman. Den hade en
    bieffekt: besättningen upptäckte att de ”tappat” en dag, en tidig
    upptäckt av behovet av en datumgräns.

elcano-fullbordar-forsta:
  period: 1520
  label: "Elcano fullbordar första världsomseglingen 1522"
  title: "Första världsomseglingen fullbordas 1522"
  wiki:
    - "sv:Juan Sebastián Elcano"
    - "en:Magellan expedition"
  text: |
    Efter att [Magellan dödats på Filippinerna
    1521](#magellan-dodas-pa-filippinerna-1521) tog basken **Juan
    Sebastián Elcano** över befälet. Av de fem fartygen var bara två kvar,
    och bara ett, *Victoria*, klarade sig hem. Elcano seglade det över
    Indiska oceanen och runt Afrika, undvek portugisiska hamnar och kom
    fram till Spanien i september 1522.

    Av omkring 240–270 man som avseglat 1519 återvände 18 med Victoria
    (några fler kom hem senare på andra vägar). Resan tog tre år. Lasten
    av kryddnejlika räckte ändå för att täcka kostnaden för expeditionen.
    Jämför: idag tar en flygresa runt jorden under två dygn.

    Resan visade konkret att jorden kunde seglas runt och hur enormt stort
    Stilla havet var – större än någon trott. Den avslöjade också att man
    ”tappat” en dag i loggboken, ett första praktiskt möte med problemet
    som långt senare löstes med datumgränsen. Nästa världsomsegling
    gjordes av engelsmannen [Francis Drake
    1577–1580](#drakes-varldsomsegling-157780) (se Drake).

drakes-varldsomsegling-157780:
  period: 1560
  label: "Drakes världsomsegling 1577–80"
  title: "Francis Drakes världsomsegling 1577–1580"
  wiki:
    - "sv:Francis Drake"
    - "en:Francis Drake's circumnavigation"
  text: |
    **Francis Drake** var en engelsk sjökapten och kapare – en privat
    sjöman med kunglig tillåtelse att plundra fiendens fartyg, i praktiken
    en statsunderstödd pirat. Han seglade 1577 från Plymouth med fem
    fartyg och kom hem 1580 med ett, *Golden Hind*. Han var den förste
    befälhavaren som ledde en världsomsegling hela vägen ([Magellan dog
    under sin, 1521](#magellan-dodas-pa-filippinerna-1521)).

    Resan tog nästan tre år. Drake passerade Magellans sund, plundrade
    spanska hamnar och skepp längs Sydamerikas västkust, nådde
    Kalifornien, korsade Stilla havet och kom hem runt Afrika. Bytet,
    framför allt spanskt silver, var så stort att drottning **[Elisabet
    I](#elisabet-i-1558)**s andel uppges ha överstigit kronans övriga
    inkomster för ett år; investerarna fick enligt uppgifter mångdubbelt
    tillbaka.

    Elisabet adlade Drake ombord på hans skepp. Resan visade att Spaniens
    stillahavsimperium var sårbart och skärpte konflikten mellan England
    och Spanien som ledde till [Armadan 1588](#armadan-slas-1588) (se
    där), där Drake var en av de engelska befälhavarna.

korea-imjin-kriget-skoldpaddsskepp:
  period: 1580
  label: "Korea: Imjin-kriget, sköldpaddsskepp"
  title: "Imjin-kriget och sköldpaddsskeppen"
  wiki:
    - "en:Turtle ship"
    - "en:Yi Sun-sin"
    - "en:Japanese invasions of Korea (1592–1598)"
  text: |
    **Imjin-kriget** (1592–1598) är det koreanska namnet på [Japans
    invasioner av Korea](#invaderar-korea-1592) (se där), efter året Imjin
    i den kinesiska kalendercykeln. Koreas stora hjälte var amiralen **Yi
    Sun-sin** (1545–1598). Medan landarmén föll ihop vann han serie efter
    serie av sjöslag och skar av japanernas försörjning sjövägen.

    Hans mest kända vapen var **sköldpaddsskeppet** (geobukseon): ett
    roddkrigsskepp med ett täckt tak, troligen försett med järnspikar och
    kanske plåt, som skyddade besättningen mot den japanska taktiken att
    borda fiendens skepp. Det bar kanoner på alla sidor och ett drakhuvud
    i fören. Det brukar kallas ett av världens första pansrade fartyg, men
    exakt hur det var byggt är omdiskuterat. Det fanns bara ett fåtal.

    Hans mest berömda seger, vid Myeongnyang 1597, vann han med 13 skepp
    mot över 130 japanska. Han stupade i krigets sista slag vid
    Noryang 1598. Jämför: pansarskepp blev standard i Europa först med
    ångfartygen på 1860-talet. Yi Sun-sin är än idag Koreas mest firade
    nationalhjälte.

hudson-soker-nordvastpassagen:
  period: 1600
  label: "Hudson söker nordvästpassagen"
  title: "Henry Hudson och nordvästpassagen"
  wiki:
    - "sv:Henry Hudson"
    - "sv:Nordvästpassagen"
  text: |
    Den **nordvästpassagen** var den hoppfulla sjövägen från Europa till
    Asien norr om Nordamerika. Den skulle kringgå de långa rutterna runt
    Afrika och Sydamerika, som dessutom kontrollerades av Portugal och
    Spanien. Engelsmannen **Henry Hudson** gjorde fyra resor 1607–1611 för
    att hitta en nordlig väg, två för engelska och en för [det holländska
    VOC](#voc-1602).

    På den holländska resan 1609 seglade han uppför floden som nu heter
    Hudsonfloden, i hopp om att den skulle leda till Stilla havet. Det
    gjorde den inte, men resan ledde till att holländarna grundade [Nya
    Amsterdam på Manhattan 1625](#nya-amsterdam-1626) – senare New York.
    1610 seglade han in i den väldiga Hudson Bay i Kanada och övervintrade
    där. Besättningen gjorde myteri 1611 och satte ut Hudson, hans son och
    några till i en liten båt; de sågs aldrig mer.

    Nordvästpassagen visade sig vara fylld av is. Den seglades igenom
    första gången av norrmannen Roald Amundsen 1903–1906, nästan 300 år
    senare. Med klimatuppvärmningen har den i vissa somrar blivit farbar
    för fartyg.

beringsundet-1728:
  period: 1720
  label: "Beringsundet 1728"
  title: "Beringsundet 1728"
  wiki:
    - "sv:Berings sund"
  text: |
    **Beringsundet** är sundet mellan Sibiriens östspets och Alaska, och
    skiljer Asien från Nordamerika. Det är bara cirka 82 km brett på sitt
    smalaste ställe. Mitt i sundet ligger öarna Diomedeöarna, den ena rysk
    och den andra amerikansk, bara 4 km från varandra – och på var sin
    sida om datumgränsen.

    1728 seglade Vitus Bering (se
    [Bering-expeditionen](#bering-expeditionen)) genom sundet och visade
    att kontinenterna inte hängde ihop, men dimman hindrade honom från att
    se Alaska. Kosacken [Semjon Dezjnjov](#ochotsk-vid-stilla-havet-1647)
    hade troligen redan 1648 seglat runt Asiens östspets, men hans rapport
    blev liggande i ett arkiv.

    Under istiderna, när havsnivån var cirka 120 m lägre, var sundet torrt
    land, **Beringia**. Den vanligaste teorin är att människor vandrade
    den vägen från Asien till Amerika för uppskattningsvis 15 000–20 000
    år sedan och blev förfäder till Amerikas ursprungsbefolkning. Under
    kalla kriget var sundet gränsen mellan Sovjetunionen och USA, kallat
    "isridån".

cook-korsar-antarktiska-cirkeln:
  period: 1760
  label: "Cook korsar Antarktiska cirkeln"
  title: "Cook korsar södra polcirkeln 1773"
  wiki:
    - "en:Second voyage of James Cook"
    - "sv:Terra Australis"
  text: |
    Sedan antiken hade geografer trott på en stor sydkontinent, *Terra
    Australis*, som skulle balansera landmassorna på norra halvklotet.
    Många föreställde sig den bördig och folkrik. På sin andra resa
    1772–1775 med fartygen *Resolution* och *Adventure* fick **James
    Cook** i uppdrag att en gång för alla ta reda på om den fanns.

    Den 17 januari 1773 blev hans fartyg de första kända att korsa södra
    polcirkeln (cirka 66,5° syd). Han korsade den tre gånger och nådde som
    längst 71°10' syd i januari 1774, men stoppades av packis. Han seglade
    runt hela jordklotet på höga sydliga breddgrader och visade att en
    eventuell sydkontinent måste ligga nästan helt under isen och vara
    obeboelig. Själva [Antarktis sågs först
    1820](#antarktis-upptacks-1820).

    Resan var också ett tekniskt genombrott: Cook testade en kopia av John
    Harrisons
    **[marinkronometer](#harrisons-h4-loser-longitudproblemet)**, en exakt
    klocka som gjorde det möjligt att bestämma longitud till sjöss. Och
    tack vare surkål och färsk föda dog nästan ingen i skörbjugg (jämför
    [Lind 1747](#lind-citrus-mot-skorbjugg-1747)) – på en resa över tre
    år.

antarktis-upptacks-1820:
  period: 1820
  label: "Antarktis upptäcks 1820"
  title: "Antarktis upptäcks 1820"
  wiki:
    - "en:Discovery of Antarctica"
    - "sv:Antarktis"
  text: |
    Sedan antiken hade geografer spekulerat om en stor sydlig kontinent.
    James Cook seglade runt Antarktis på 1770-talet och [korsade södra
    polcirkeln](#cook-korsar-antarktiska-cirkeln), men såg aldrig land på
    grund av isen.

    I januari 1820 såg flera expeditioner nästan samtidigt Antarktis
    fastland eller dess isshelf: den ryska expeditionen under **Fabian
    Gottlieb von Bellingshausen** (27 januari), den brittiske sjöofficeren
    Edward Bransfield (30 januari), och kort därefter amerikanen Nathaniel
    Palmer. Vem som var först är omtvistat. Bakom intresset låg både
    vetenskap och säljakt – sälskinnsfångare härjade på öarna i Södra
    ishavet och utrotade nästan pälssälarna där på några år.

    Den första landstigningen på fastlandet skedde möjligen 1821
    (amerikanen John Davis), men det är osäkert; säkert belagd är en
    landstigning 1895. Kontinenten är ca 14 miljoner km², större än
    Europa, och täckt av is som i genomsnitt är cirka 2 km tjock. Det
    dröjde till 1911 innan [Roald Amundsen nådde
    sydpolen](#amundsen-pa-sydpolen-1911). Idag regleras kontinenten av
    Antarktisfördraget från 1959, som förbjuder militär verksamhet och
    fryser alla territoriella anspråk.

amundsen-pa-sydpolen-1911:
  period: 1900
  label: "Amundsen på sydpolen 1911"
  title: "Amundsen på sydpolen 1911"
  wiki:
    - "sv:Roald Amundsen"
    - "en:Amundsen's South Pole expedition"
  text: |
    Den norske polarforskaren **Roald Amundsen** nådde den 14 december
    1911 som förste människa sydpolen, med fyra följeslagare. Han hade
    tidigare (1903–06) seglat som förste genom Nordvästpassagen norr om
    Kanada.

    Det var en kapplöpning mot britten **Robert Falcon Scott**, som nådde
    polen 34 dagar senare och fann det norska tältet. Skillnaden låg i
    metoden: Amundsen använde slädhundar och skidor, inspirerad av
    inuiternas teknik, och planerade depåer noggrant. Scott förlitade sig
    på ponnyer, motorslädar som gick sönder och till slut på att dra
    slädarna själva. Alla fem i Scotts polgrupp dog på återvägen, omkring
    18 km från ett förråd.

    Amundsens färd tog 99 dagar och omkring 3 000 km tur och retur.
    Händelsen var en av de sista stora geografiska ”förstagångerna” på
    jorden. Den visade också att anpassning till lokala förhållanden slog
    brittisk prestige. Amundsen försvann 1928 i Arktis under en
    räddningsexpedition.

    Jämför med [Nansen över Grönland 1888](#nansen-over-gronland-1888).

titanic-1912:
  period: 1900
  label: "Titanic 1912"
  title: "Titanic 1912"
  wiki:
    - "sv:RMS Titanic"
  text: |
    RMS Titanic var ett brittiskt passagerarfartyg, världens största vid
    den tiden: 269 meter långt. Natten till 15 april 1912, på jungfruresan
    från Southampton till New York, kolliderade hon med ett isberg i
    Nordatlanten och sjönk på knappt tre timmar.

    Av omkring 2 220 personer ombord dog cirka 1 500. Livbåtarna rymde
    bara 1 178 personer, vilket var lagligt enligt dåtida regler som
    baserades på fartygets tonnage, inte antal passagerare. Klass spelade
    roll: omkring 60 % av första klass överlevde, mot cirka 25 % i tredje
    klass. Bland passagerarna fanns ett hundratal svenskar, många
    emigranter.

    Katastrofen ledde till den första internationella konventionen om
    säkerhet till sjöss (SOLAS) 1914, med krav på livbåtsplats åt alla och
    [radiovakt dygnet runt](#marconi-radio-1895) – ett närliggande fartyg
    hade stängt av sin radio för natten. Isbergsspaningen i Nordatlanten
    startades också. Vraket hittades först 1985 på 3 800 meters djup.

lindbergh-over-atlanten-1927:
  period: 1920
  label: "Lindbergh över Atlanten 1927"
  title: "Lindbergh flyger över Atlanten 1927"
  wiki:
    - "sv:Charles Lindbergh"
    - "en:Spirit of St. Louis"
  text: |
    Den 25-årige amerikanske postflygaren **Charles Lindbergh** flög 20–21
    maj 1927 ensam och utan mellanlandning från New York till Paris i det
    enmotoriga planet Spirit of St. Louis. Flygningen var omkring 5 800 km
    och tog 33,5 timmar. Han kunde inte se rakt fram eftersom en extra
    bränsletank satt framför honom.

    Han vann Orteigpriset på 25 000 dollar. Atlanten hade redan flugits
    över 1919 av Alcock och Brown, men mellan Irland och Newfoundland, en
    kortare sträcka med två piloter. Lindberghs ensamflygning mellan två
    storstäder blev en mediesensation; omkring 100 000 personer tog emot
    honom i Paris.

    Flygningen väckte enormt intresse för flyg och investeringar i
    flygbolag, och reguljära transatlantiska passagerarflyg kom 1939.
    Jämför med [bröderna Wright 1903](#broderna-wright-1903) (12 sekunder)
    – 24 år senare – och med dagens flyg New York–Paris på omkring 7
    timmar. Lindbergh blev senare kontroversiell för sin sympati för
    Nazityskland.

koreakriget-195053:
  period: 1940
  label: "Koreakriget 1950–53"
  title: "Koreakriget 1950–1953"
  wiki:
    - "sv:Koreakriget"
  text: |
    Korea hade varit [japansk koloni 1910–45](#annekterar-korea-1910). När
    Japan kapitulerade delades landet vid 38:e breddgraden: Sovjet
    ockuperade norr, USA söder. 1948 bildades två stater, det
    kommunistiska Nordkorea under **Kim Il-sung** och Sydkorea.

    Den 25 juni 1950 invaderade Nordkorea syd och tog nästan hela halvön.
    FN:s säkerhetsråd – som Sovjet just då bojkottade – godkände en
    motoffensiv, och en FN-styrka ledd av USA landsteg vid Inchon och drev
    nordkoreanerna ända upp mot kinesiska gränsen. Då gick Kina in med
    hundratusentals soldater och tryckte tillbaka FN-styrkan. Från 1951
    stod fronten ungefär stilla nära 38:e breddgraden i ett
    skyttegravskrig.

    Vapenstilleståndet den 27 juli 1953 är fortfarande inget fredsavtal.
    Uppskattningsvis 2,5–3 miljoner dog, varav en stor del civila; USA
    förlorade omkring 36 000 soldater. Sverige skickade ett fältsjukhus
    till Busan och sitter ännu i den neutrala kommission som övervakar
    stilleståndet. Kriget var kalla krigets första stora ”heta” krig. I
    dag är skillnaden mellan de två länderna extrem: Sydkorea är en
    ledande teknikekonomi (Samsung, Hyundai), Nordkorea en isolerad
    diktatur med kärnvapen.

sputnik-1957:
  period: 1940
  label: "Sputnik 1957"
  title: "Sputnik 1957 – den första satelliten"
  wiki:
    - "sv:Sputnik 1"
    - "en:Sputnik crisis"
  text: |
    Den 4 oktober 1957 sköt Sovjetunionen upp **Sputnik 1**, världens
    första konstgjorda satellit. Den var en metallkula på 58 cm och 84 kg
    med fyra antenner, som bara sände en pipande radiosignal. Den varvade
    jorden på 96 minuter och kunde avlyssnas av radioamatörer över hela
    världen.

    Det militära budskapet var det viktiga: raketen, R-7, var en
    interkontinental robot. Om Sovjet kunde placera en satellit i
    omloppsbana kunde de också nå USA med en kärnvapenladdning. I USA
    utlöstes ”Sputnikchocken”. Svaret blev bland annat rymdstyrelsen NASA
    1958, kraftiga satsningar på naturvetenskaplig utbildning, och
    försvarets forskningsorgan **ARPA** 1958 – som tio år senare
    finansierade ARPANET, internets föregångare (se [ARPANET
    1969](#arpanet-1969)).

    En månad senare skickades hunden Laika upp i Sputnik 2. USA:s första
    satellit, Explorer 1, kom i januari 1958. Rymdkapplöpningen ledde
    vidare till [Gagarin 1961](#gagarin-1961) och [månlandningen
    1969](#manlandningen-1969) (se dessa). Som jämförelse finns i dag över
    10 000 aktiva satelliter, de flesta för kommunikation, som Starlink,
    och för GPS och väder.

arpanet-1969:
  period: 1960
  label: "ARPANET 1969"
  title: "ARPANET 1969 – internets föregångare"
  wiki:
    - "sv:ARPANET"
    - "en:Packet switching"
  text: |
    **ARPANET** var ett datornätverk finansierat av ARPA, USA:s
    försvarsdepartements forskningsbyrå, bildad som svar på Sputnik (se
    [Sputnik 1957](#sputnik-1957)). Syftet var att låta forskare på olika
    universitet dela dyra datorer. Tekniken byggde på **paketförmedling**:
    data delas upp i små paket som skickas var för sig och kan ta olika
    vägar, i stället för att en hel ledning kopplas upp som i
    telefonnätet. Idén utvecklades oberoende av Paul Baran i USA och
    Donald Davies i Storbritannien.

    Den 29 oktober 1969 skickades det första meddelandet från UCLA till
    Stanford Research Institute. Det var ”LOGIN”, men systemet kraschade
    efter ”LO”. Noderna var små datorer kallade IMP:ar, byggda av
    företaget BBN; linjerna gick i 50 kbit/s. I december fanns fyra noder,
    1973 ett fyrtiotal. 1971 skickades det första e-postmeddelandet, och
    e-post blev snabbt den mest använda tjänsten.

    På 1970-talet utvecklade Vint Cerf och Bob Kahn protokollen TCP/IP,
    för att koppla ihop olika nätverk till ett ”internet”. ARPANET bytte
    till TCP/IP den 1 januari 1983, det som brukar räknas som internets
    födelsedag. Sverige anslöts 1988 via det nordiska forskningsnätet
    NORDUnet. Det kommersiella genombrottet kom med webben (se [webben,
    Berners-Lee 1989](#webben-berners-lee-1989)).

hubbleteleskopet-1990:
  period: 1980
  label: "Hubbleteleskopet 1990"
  title: "Rymdteleskopet Hubble 1990"
  wiki:
    - "sv:Rymdteleskopet Hubble"
    - "en:Hubble Space Telescope"
  text: |
    **Hubble** är ett optiskt teleskop som skickades upp i omloppsbana
    runt jorden med rymdfärjan Discovery i april 1990. Det har en spegel
    på 2,4 meter och kretsar på omkring 540 km höjd. Fördelen med att vara
    i rymden är att jordens atmosfär inte suddar till bilden. Det är
    uppkallat efter astronomen [Edwin
    Hubble](#hubble-universum-expanderar), som på 1920-talet visade att
    universum expanderar.

    Starten blev pinsam: spegeln var slipad fel med ungefär 2 mikrometer –
    en femtiondel av ett hårstrå – och bilderna blev suddiga. 1993
    monterade astronauter korrigerande optik, ungefär som glasögon, och
    därefter levererade Hubble bilder ingen sett förut. Det reparerades
    och uppgraderades vid sammanlagt fem rymdfärjeuppdrag.

    Hubble har bidragit till att bestämma universums ålder (cirka 13,8
    miljarder år), till upptäckten 1998 att expansionen accelererar ([mörk
    energi](#mork-energi-1998)) och till bilden Hubble Deep Field, som
    visade tusentals galaxer i en till synes tom fläck av himlen. Det
    fungerar fortfarande, över 35 år senare. Efterföljaren är [James
    Webb-teleskopet 2021](#james-webb-teleskopet-2021). Projektet har
    uppskattningsvis kostat över 10 miljarder dollar totalt.

james-webb-teleskopet-2021:
  period: 2020
  label: "James Webb-teleskopet 2021"
  title: "Rymdteleskopet James Webb 2021"
  wiki:
    - "sv:James Webb-teleskopet"
    - "en:James Webb Space Telescope"
  text: |
    **James Webb Space Telescope** (JWST) skickades upp den 25 december
    2021 med en europeisk Ariane 5-raket från Franska Guyana. Det är ett
    samarbete mellan amerikanska NASA och de europeiska och kanadensiska
    rymdorganisationerna. Spegeln är 6,5 meter i diameter, byggd av 18
    sexkantiga guldbelagda segment, och har cirka sex gånger större
    ljusinsamlande yta än Hubbles 2,4 meter. Det var för stort för en
    raket, så det fick vikas ihop och vecklas ut i rymden i ett av de mest
    komplicerade uppdrag som gjorts.

    Till skillnad från Hubble, som ser synligt ljus från omloppsbana runt
    jorden, observerar Webb främst **infrarött ljus** (värmestrålning).
    Därför står det 1,5 miljoner km från jorden, i bortre riktning från
    solen, bakom en solskärm stor som en tennisbana som håller
    instrumenten under –230 °C. Infrarött behövs eftersom ljuset från de
    tidigaste galaxerna har sträckts ut till längre våglängder under resan
    genom det expanderande universum.

    Webb har hittat galaxer från bara 300 miljoner år efter big bang, fler
    och ljusstarkare än teorierna förutsade, och analyserat atmosfären hos
    planeter runt andra stjärnor. Projektet blev många år försenat och
    kostade omkring 10 miljarder dollar. Se även [Hubbleteleskopet
    1990](#hubbleteleskopet-1990).
