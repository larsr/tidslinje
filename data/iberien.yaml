# Spanien / Portugal
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

cordoba-kalifatet-kollapsar-inbordeskrig:
  period: 1000
  label: "Córdoba-kalifatet kollapsar (inbördeskrig från 1009)"
  title: "Córdobakalifatets fall 1009–1031"
  wiki:
    - "en:Caliphate of Córdoba"
    - "en:Fitna of al-Andalus"
  text: |
    Sedan 700-talet var större delen av Iberiska halvön muslimsk, kallad
    **al-Andalus**. Från 929 styrdes den av **kalifatet Córdoba**; en
    kalif är en muslimsk härskare som gör anspråk på att vara ledare för
    alla muslimer. Córdoba var då Västeuropas största stad med kanske 100
    000–500 000 invånare (uppgifterna varierar mycket), jämfört med några
    tusen i Paris eller London. Där fanns gatubelysning, bibliotek med
    enligt traditionen hundratusentals volymer, och ett avancerat
    bevattningsjordbruk.

    Under 990-talet låg den verkliga makten hos fältherren **al-Mansur**,
    som gjorde över 50 fälttåg mot de kristna i norr. När hans söner
    förlorat makten bröt 1009 ett inbördeskrig ut, *fitna*: arabiska,
    berbiska (nordafrikanska) och slaviska (frigivna slavsoldater)
    fraktioner tillsatte och avsatte kalifer i snabb följd. Córdoba
    plundrades 1013. 1031 avskaffades kalifatet helt.

    Resultatet blev ett tjugotal små muslimska stater,
    **[taifariken](#taifa-smariken)** (se ~1020). De var rika men militärt
    svaga, vilket gav de kristna rikena i norr chansen att expandera –
    början på det som kallas *reconquista*, den kristna återerövringen som
    slutade med [Granadas fall 1492](#granada-faller-1492).

kristna-leon-kastilien-navarra:
  period: 1000
  label: "kristna León, Kastilien, Navarra"
  title: "De kristna rikena i norra Spanien"
  wiki:
    - "sv:Kungariket León"
    - "en:Reconquista"
  text: |
    Kring år 1000 fanns de kristna rikena på Iberiska halvön bara i en
    smal remsa längs norra kusten och Pyrenéerna. De var resterna av det
    som aldrig erövrats av muslimerna på 700-talet. De viktigaste var:

    **León** i nordväst, det största och äldsta, som såg sig som arvtagare
    till det kristna västgotiska riket. **Kastilien**, ett grevskap under
    León vid gränsen mot muslimerna; namnet kommer av alla borgar
    (*castillos*) som byggdes där. **Navarra** i Pyrenéerna kring
    Pamplona, med baskisk befolkning. Längre österut fanns grevskapet
    **Barcelona**, som hörde till den frankiska sfären.

    Vid den här tiden var de svaga. Den muslimske fältherren al-Mansur
    plundrade Barcelona 985, León och 997 pilgrimsorten Santiago de
    Compostela. Men när
    [Córdobakalifatet](#cordoba-kalifatet-kollapsar-inbordeskrig) föll
    sönder efter 1009 vände styrkeförhållandet. De kristna rikena tog ut
    skatt, *[parias](#tribut-parias-fran-taifa-rikena)*, av de muslimska
    småstaterna och började flytta gränsen söderut. Kastilien blev med
    tiden det ledande riket, och dess förening med Aragonien 1479 lade
    grunden till Spanien.

taifa-smariken:
  period: 1020
  label: "Taifa-småriken"
  title: "Taifarikena i al-Andalus"
  wiki:
    - "sv:Taifa"
    - "en:Taifa"
  text: |
    När [kalifatet i Córdoba](#cordoba-kalifatet-kollapsar-inbordeskrig)
    föll sönder i inbördeskrig 1009–1031 delades muslimska Spanien,
    al-Andalus, upp i ett tjugotal mindre stater, kallade **taifariken**
    (av arabiska *ta'ifa*, ”parti” eller ”fraktion”). Varje rike styrdes
    av en lokal ledare: arabiska släkter, berbiska (nordafrikanska)
    generaler eller frigivna slavsoldater. Bland de viktigaste var
    Sevilla, Toledo, Zaragoza, Granada, Valencia och Badajoz.

    Kulturellt var detta en guldålder. Varje hov ville glänsa med poeter,
    filosofer och vetenskapsmän, ungefär som renässansens italienska
    stadsstater 400 år senare. I Granada var den judiske lärde **Samuel
    ha-Nagid** vesir och arméchef. Toledo var ett centrum för astronomi,
    där al-Zarqali gjorde de astronomiska tabeller som senare användes i
    hela Europa.

    Militärt var taifarikena svaga och krigade ofta mot varandra. De
    kristna kungarna i norr tog ut stora skyddspengar,
    *[parias](#tribut-parias-fran-taifa-rikena)*, av dem. [1085 erövrade
    Kastilien Toledo](#toledo-erovras-1085). Då kallade taifakungarna i
    panik in de nordafrikanska
    **[almoraviderna](#almoravidrorelsen-borjar-i-sahara)**, strängt
    religiösa berberkrigare, som besegrade kastilianerna men sedan tog
    över taifarikena själva.

sancho-iii-av-navarra:
  period: 1020
  label: "Sancho III av Navarra"
  title: "Sancho III den store av Navarra"
  wiki:
    - "en:Sancho III of Pamplona"
  text: |
    **Sancho III**, kallad den store (ca 992–1035), var kung av
    **Navarra**, ett litet kristet kungarike i västra Pyrenéerna kring
    Pamplona med baskisk befolkning. Efter [Córdobakalifatets kollaps
    1009](#cordoba-kalifatet-kollapsar-inbordeskrig) försvann hotet från
    söder, och Sancho kunde i stället utvidga sin makt bland de kristna
    grannarna.

    Genom arv, giftermål och vapen samlade han under sig Navarra,
    grevskapen Aragonien, Sobrarbe och Ribagorza, grevskapet Kastilien
    (via sin hustru) och tog till slut 1034 även en stor del av León med
    staden León. Han kallade sig ”kung av spanjorerna” och var vid sin död
    den mäktigaste kristna härskaren på Iberiska halvön. Han öppnade också
    landet mot Frankrike, bland annat genom att främja pilgrimsvägen till
    Santiago de Compostela och kyrkoreformer från klostret
    [Cluny](#cluny-reformen).

    När han dog 1035 delade han, enligt sedvänja, sina länder mellan sina
    söner. Det skapade nya kungariken: **Kastilien** (se [Kastilien
    1035](#kastilien-kungarike-1035)) under Ferdinand I och **Aragonien**
    under Ramiro I. Dessa två blev de ledande kristna rikena, och när de
    förenades genom [Ferdinand och Isabellas äktenskap
    1469](#ferdinand-och-isabella-gifter-sig-1469) skapades grunden till
    Spanien.

kastilien-kungarike-1035:
  period: 1020
  label: "Kastilien kungarike 1035"
  title: "Kastilien blir kungarike 1035"
  wiki:
    - "sv:Kastilien"
    - "en:Kingdom of Castile"
  text: |
    **Kastilien** var från början ett grevskap vid östra gränsen av
    kungariket León, i området kring Burgos i norra Spanien. Namnet kommer
    av alla borgar (*castillos*) som byggts där som försvar mot muslimerna
    i söder. Kastilianerna var gränsbor, ofta fria bönder och ryttare, och
    utvecklade ett eget språk, kastilianska – det språk vi idag kallar
    spanska.

    Kung [Sancho III av Navarra](#sancho-iii-av-navarra) hade lagt beslag
    på Kastilien genom sitt äktenskap. Vid hans död 1035 fick sonen
    **Ferdinand I** Kastilien, och han räknas som dess förste kung
    (formellt troligen från 1037). Samma år, 1037, besegrade han sin
    svåger, kungen av León, och tog även León. Han tog ut stora
    skyddspengar av de muslimska [taifarikena](#taifa-smariken) i söder.

    Från detta lilla gränsland växte Spaniens dominerande rike fram.
    Kastilien erövrade [Toledo 1085](#toledo-erovras-1085), större delen
    av Andalusien på 1200-talet och slutligen [Granada
    1492](#granada-faller-1492). Samma år seglade Columbus för Kastiliens
    drottning Isabella, och det var Kastilien som skapade det spanska
    kolonialriket i Amerika. Därför talar idag omkring 500 miljoner
    människor kastilianska.

ferdinand-i-forenar-kastilien-leon:
  period: 1040
  label: "Ferdinand I förenar Kastilien-León"
  title: "Ferdinand I förenar Kastilien och León"
  wiki:
    - "en:Ferdinand I of León"
    - "sv:Reconquista"
  text: |
    Kring år 1000 var Iberiska halvön (Spanien och Portugal) delad: de
    södra två tredjedelarna var muslimska, **al-Andalus**, medan små
    kristna riken låg i norr: León, Kastilien, Navarra, Aragonien och
    grevskapet Barcelona.

    **Ferdinand I** (cirka 1015–1065) blev greve av Kastilien 1029 och tog
    kungatitel. År 1037 besegrade och dödade han sin svåger, kungen av
    León, och tog över hans rike. Kastilien-León blev därmed det starkaste
    kristna riket. Han kallade sig till och med kejsare.

    Varför det spelar roll: Ferdinand utnyttjade att det muslimska
    [kalifatet i Córdoba](#cordoba-kalifatet-kollapsar-inbordeskrig)
    fallit sönder (1031) i små stater, taifa-riken, och tvingade dem att
    betala tribut (se [parias](#tribut-parias-fran-taifa-rikena)).
    Kastilien blev motorn i *reconquista*, den kristna återerövringen av
    halvön, som tog till 1492 att fullborda. Kastiliens språk blev det
    spanska vi känner i dag. Vid sin död delade dock Ferdinand riket
    mellan sina söner, vilket ledde till inbördeskrig (se [Alfons
    VI](#alfons-vi)).

tribut-parias-fran-taifa-rikena:
  period: 1040
  label: "tribut (parias) från taifa-rikena"
  title: "Parias – skyddspengar från taifa-rikena"
  wiki:
    - "en:Parias"
    - "en:Taifa"
  text: |
    År 1031 föll det muslimska **kalifatet i Córdoba**, som styrt större
    delen av Spanien. Det splittrades i ett tjugotal små stater,
    **taifa-riken** (av arabiska *ta'ifa*, "fraktion"), som Sevilla,
    Toledo, Zaragoza och Granada. De var rika och kulturellt blomstrande
    men militärt svaga och ofta i krig med varandra.

    De kristna kungarna i norr, framför allt [Ferdinand
    I](#ferdinand-i-forenar-kastilien-leon) och Alfons VI av
    Kastilien-León, utnyttjade detta. I stället för att erövra
    taifa-rikena tvingade de dem att betala **parias**: årlig tribut i
    guld i utbyte mot fred och "skydd" – i praktiken beskyddarpengar.
    Summorna kunde vara tusentals guldmynt per år och rike.

    Varför det spelar roll: guldet finansierade de kristna rikenas krig
    och kyrkobyggen, till exempel stora donationer till klostret
    [Cluny](#cluny-reformen) i Frankrike. Men när trycket blev för stort
    ([Toledo föll 1085](#toledo-erovras-1085)) kallade taifa-kungarna in
    almoraviderna från Nordafrika, som slog tillbaka de kristna (slaget
    vid [Sagrajas 1086](#almoravider-vinner-vid-sagrajas-1086)).

alfons-vi:
  period: 1060
  label: "Alfons VI"
  title: "Alfons VI av Kastilien och León"
  wiki:
    - "en:Alfonso VI of León and Castile"
    - "en:Toledo School of Translators"
  text: |
    **Alfons VI** (cirka 1040–1109) var son till [Ferdinand
    I](#ferdinand-i-forenar-kastilien-leon), som enat Kastilien och León.
    När Ferdinand dog 1065 delades riket mellan bröderna, och det följde
    inbördeskrig. Alfons förlorade först, men efter att hans bror Sancho
    mördades 1072 blev han kung över hela arvet.

    Han fortsatte att pressa de muslimska taifa-rikena på tribut (se
    [parias](#tribut-parias-fran-taifa-rikena)), och 1085 erövrade han
    **[Toledo](#toledo-erovras-1085)** – den gamla västgotiska huvudstaden
    mitt i halvön, med uppskattningsvis 30 000 invånare. Det var den
    första stora muslimska staden som föll till de kristna, och en
    vändpunkt i reconquista. Han kallade sig "kejsare över de två
    religionerna".

    Men taifa-kungarna blev så skrämda att de kallade in **almoraviderna**
    från Marocko, som krossade Alfons armé vid [Sagrajas
    1086](#almoravider-vinner-vid-sagrajas-1086). Ändå blev Toledo kvar i
    kristna händer, och blev ett centrum för översättning: där översattes
    arabiska verk av Aristoteles, al-Khwarizmi och andra till latin,
    vilket förde in grekisk och arabisk vetenskap i Europa.

el-cid:
  period: 1060
  label: "El Cid"
  title: "El Cid"
  wiki:
    - "sv:El Cid"
  text: |
    **Rodrigo Díaz de Vivar** (cirka 1043–1099), kallad **El Cid** (av
    arabiskans *sayyid*, "herre"), var en kastiliansk riddare. Han tjänade
    först kung Sancho II och sedan dennes bror [Alfons VI](#alfons-vi),
    men förvisades 1081 efter konflikter med kungen.

    Som förvisad blev han legoknekt och kämpade i flera år åt den
    muslimske kungen av Zaragoza – mot både muslimer och kristna. Det
    visar hur flytande gränserna var: mer politik och pengar än religion.
    1094 erövrade han den muslimska staden
    **[Valencia](#el-cid-tar-valencia-1094)** efter en lång belägring, och
    styrde den som en självständig furste tills han dog 1099. Han
    besegrade [almoraviderna](#almoravidrorelsen-borjar-i-sahara) flera
    gånger. Hans änka Jimena höll staden till 1102.

    Varför det spelar roll: El Cid blev Spaniens nationalhjälte genom
    eposet *Cantar de mio Cid* (cirka 1200), ett av de äldsta verken på
    spanska. Myten har gjort honom till en kristen korsriddare; den
    verklige El Cid var mer av en framgångsrik krigsherre som sålde sina
    tjänster. Filmen *El Cid* (1961) med Charlton Heston bygger på
    legenden.

toledo-erovras-1085:
  period: 1080
  label: "Toledo erövras 1085"
  title: "Toledo erövras 1085"
  wiki:
    - "en:Siege of Toledo (1085)"
    - "en:Toledo School of Translators"
  text: |
    Den iberiska halvön (Spanien och Portugal) hade sedan 711 till stor
    del styrts av muslimer – området kallades **al-Andalus**. Efter att
    [kalifatet i Córdoba](#cordoba-kalifatet-kollapsar-inbordeskrig) föll
    sönder 1031 splittrades det i ett tjugotal småkungadömen, **taifas**,
    som ofta betalade beskyddarpengar till de kristna kungarna i norr.

    1085 tog **[Alfons VI](#alfons-vi)**, kung av Kastilien och León, över
    **Toledo** – den gamla huvudstaden från visigoternas tid före 711,
    mitt på halvön. Staden föll efter en blockad och en förhandlad
    överlämning, och en stor del av dess muslimska och judiska befolkning
    fick stanna. Det var den första stora muslimska staden som erövrades
    av de kristna, och en avgörande milstolpe i **reconquista** – den
    kristna återerövringen av halvön som pågick till 1492.

    Toledo blev under 1100- och 1200-talet en bro mellan kulturerna. [Där
    översattes arabiska verk](#toledo-arabisk-vetenskap-till-latin) inom
    filosofi, matematik, astronomi och medicin till latin – bl.a.
    Aristoteles, Euklides och al-Khwarizmi, vars namn gett oss ordet
    *algoritm*. Det var en av de viktigaste kanalerna för kunskapen som
    senare låg till grund för den europeiska vetenskapen. Erövringen fick
    också taifa-kungarna att kalla in almoraviderna från Afrika (se
    [Sagrajas 1086](#almoravider-vinner-vid-sagrajas-1086)).

almoravider-vinner-vid-sagrajas-1086:
  period: 1080
  label: "almoravider vinner vid Sagrajas 1086"
  title: "Slaget vid Sagrajas 1086"
  wiki:
    - "en:Battle of Sagrajas"
    - "sv:Almoraviderna"
  text: |
    När den kastilianske kungen [Alfons VI](#alfons-vi) tagit [Toledo
    1085](#toledo-erovras-1085) blev de muslimska småkungarna i al-Andalus
    (det muslimska Spanien) rädda att de stod på tur. Kungen av Sevilla,
    al-Mu'tamid, kallade därför in **almoraviderna** – den strängt
    religiösa berberrörelse som just erövrat Marocko (se [Almoravider
    grundar Marrakesh](#almoravider-grundar-marrakesh-1070)). Han ska ha
    sagt att han hellre vallade kameler i Afrika än grisar i Kastilien.

    Almoravidledaren **Yusuf ibn Tashfin** korsade Gibraltarsundet och
    mötte Alfons vid Sagrajas (az-Zallaqa) nära Badajoz i oktober 1086.
    Almoraviderna använde disciplinerat fotfolk och trummor, något som
    skrämde de kristna. Alfons hade uppskattningsvis några tusen till
    kanske 10 000 man; han besegrades och skadades. Siffrorna i källorna
    är överdrivna och osäkra.

    Segern stoppade den kristna framryckningen i ett par generationer. Men
    Yusuf såg att taifa-kungarna var splittrade och slappa i sin tro, och
    1090–1094 avsatte han dem en efter en och tog själv över al-Andalus
    (se [Almoravider tar al-Andalus](#almoravider-tar-al-andalus)).
    Inbjudan av en extern hjälpare som sedan tar över är ett mönster som
    återkommer i historien.

el-cid-tar-valencia-1094:
  period: 1080
  label: "El Cid tar Valencia 1094"
  title: "El Cid tar Valencia 1094"
  wiki:
    - "sv:El Cid"
    - "en:El Cid"
  text: |
    **Rodrigo Díaz de Vivar** (ca 1043–1099), känd som **El Cid** (av
    arabiskans *sayyid*, ”herre”), var en kastiliansk adelsman och
    fältherre. Han tjänade först kung [Alfons VI](#alfons-vi), men blev
    landsförvisad efter konflikter med honom och arbetade sedan som
    legoknekt – bl.a. i många år åt den muslimske kungen av Zaragoza, mot
    både muslimer och kristna.

    1094 tog han efter nästan två års belägring **Valencia** på östkusten,
    en av de rikaste städerna i al-Andalus, och styrde den som en egen
    självständig härskare. Han lyckades slå tillbaka
    [almoravidernas](#almoravidrorelsen-borjar-i-sahara) försök att återta
    staden. Efter hans död 1099 höll hans änka Jimena staden till 1102, då
    den utrymdes och föll till almoraviderna.

    El Cid blev Spaniens nationalhjälte genom eposet *Cantar de mio Cid*
    (ca 1200), ett av de äldsta verken i spansk litteratur, och senare
    genom filmen *El Cid* (1961) med Charlton Heston. Myten gjorde honom
    till en kristen korsriddare, men hans verkliga liv visar snarare hur
    flytande gränserna mellan kristna och muslimer var – lojaliteten
    gällde ofta den som betalade.

alfons-i-av-aragonien:
  period: 1100
  label: "Alfons I av Aragonien"
  title: "Alfons I av Aragonien, ”Krigaren”"
  wiki:
    - "sv:Alfons I av Aragonien"
    - "en:Alfonso the Battler"
  text: |
    **Alfons I** (kung 1104–1134) styrde Aragonien och Navarra, kristna
    kungariken i nordöstra Spanien. Han kallades *el Batallador*,
    ”Krigaren”, och sägs ha utkämpat 29 slag mot muslimerna.

    Hans största seger var erövringen av
    **[Zaragoza](#zaragoza-erovras-1118)** 1118 efter en sju månader lång
    belägring. Zaragoza var den sista stora självständiga muslimska staden
    i Ebrodalen och blev Aragoniens huvudstad. Han fördubblade därmed
    ungefär sitt rikes storlek. 1125–1126 gjorde han ett djärvt
    plundringståg djupt in i [almoravidernas
    Andalusien](#almoravidvaldet-i-al-andalus) ända till Granada och tog
    med sig tusentals mozaraber (kristna som levt under muslimskt styre)
    som nybyggare.

    Han var gift med drottning Urraca av Kastilien, men äktenskapet blev
    en katastrof med krig mellan makarna och upplöstes. När han dog
    barnlös 1134 testamenterade han hela riket till riddarordnarna
    ([tempelherrarna](#tempelherreorden-1119),
    [johanniterna](#johanniterorden-1113) och Heliga gravens orden). Adeln
    vägrade godta det, och i stället valdes hans bror, munken Ramiro.
    Riket förenades senare med Barcelona, vilket gav Aragoniens
    Medelhavsimperium.

almoravidvaldet-i-al-andalus:
  period: 1100
  label: "almoravidväldet i al-Andalus"
  title: "Almoravidernas styre i Spanien"
  wiki:
    - "en:Almoravid dynasty"
    - "en:Battle of Uclés (1108)"
  text: |
    Från omkring 1090 styrdes **al-Andalus** – det muslimska Spanien – av
    **almoraviderna**, en strängt religiös berberrörelse från Sahara med
    huvudstad i Marrakesh (se [Almoravider tar
    al-Andalus](#almoravider-tar-al-andalus)). Under början av 1100-talet
    var de på höjden: 1102 tog de Valencia efter [El Cids död](#el-cid),
    och 1108 krossade de en kastiliansk armé vid Uclés, där kung [Alfons
    VI](#alfons-vi):s ende son dödades.

    Styret var hårdare än under de tidigare taifa-kungarna. De religiösa
    lärda inom malikitisk rätt (en av islams fyra sunnitiska rättsskolor,
    som betonar tradition) fick stort inflytande, och verk av teologen
    al-Ghazali brändes offentligt i Córdoba. Kristna och judar fick sämre
    villkor, och många mozaraber (kristna under muslimskt styre)
    deporterades till Nordafrika efter 1126.

    Men den andalusiska kulturen påverkade också erövrarna: palats och
    moskéer i Marrakesh och Tlemcen byggdes i andalusisk stil. Från 1118
    förlorade de Zaragoza till Aragonien, och omkring 1140–1147 föll
    väldet samman under trycket från den nya
    [almohadrörelsen](#almohader-ibn-tumart-mot-almoravider) i Marocko och
    uppror i Spanien. Jämför med hur mongolerna senare övertog den
    persiska kultur de erövrat.

zaragoza-erovras-1118:
  period: 1120
  label: "Zaragoza erövras 1118"
  title: "Zaragoza erövras 1118"
  wiki:
    - "en:Alfonso the Battler"
    - "sv:Reconquista"
    - "sv:Zaragoza"
  text: |
    Den iberiska halvön var på 1100-talet delad mellan muslimska områden i
    söder (al-Andalus) och kristna kungariken i norr. **Reconquista**
    kallas den process, över mer än 700 år, då de kristna rikena gradvis
    tog över halvön, fram till Granadas fall 1492.

    Zaragoza vid floden Ebro hade varit huvudstad i ett av de muslimska
    småkungarikena (*taifa*) och styrdes sedan 1110 av almoraviderna, en
    berbisk dynasti från Marocko. Kung **[Alfonso I av
    Aragonien](#alfons-i-av-aragonien)**, kallad *el Batallador*
    (krigaren) eftersom han sägs ha utkämpat 29 slag, belägrade staden
    från maj 1118 med hjälp av riddare från södra Frankrike som påven gett
    korstågsstatus. Staden gav upp i december efter ungefär sju månader.

    Zaragoza blev Aragoniens huvudstad och gav kungariket kontroll över
    den bördiga Ebrodalen. Många muslimer (kallade *mudéjares*) bodde kvar
    som bönder och hantverkare under kristet styre. Jämför med [Toledo,
    som erövrats](#toledo-erovras-1085) av Kastilien redan 1085 och blev
    centrum för översättningar av arabisk vetenskap (se [översättarskolan
    i Toledo](#oversattarskolan-i-toledo)). Aragonien blev senare en
    Medelhavsmakt och [förenades genom äktenskap med Kastilien
    1469](#ferdinand-och-isabella-gifter-sig-1469) – grunden till dagens
    Spanien.

oversattarskolan-i-toledo:
  period: 1120
  label: "översättarskolan i Toledo"
  title: "Översättarskolan i Toledo"
  wiki:
    - "en:Toledo School of Translators"
    - "sv:Toledo"
  text: |
    Toledo i centrala Spanien hade varit en stor muslimsk stad tills
    kungariket Kastilien erövrade den 1085. Staden behöll sina bibliotek
    och en blandad befolkning av muslimer, judar och kristna som talade
    arabiska. Det gjorde den till den perfekta platsen för att föra över
    kunskap från arabiska till latin, Västeuropas lärdomsspråk.

    Under ärkebiskop **Raimundo** (1125–52) började en rad lärda arbeta
    där – ofta i par: en jude eller arabiskkunnig kristen översatte
    muntligt till kastilianska, och en latinkunnig skrev ner på latin. Det
    var alltså ingen formell skola utan en miljö. De översatte bland annat
    Aristoteles (vars verk ofta bara fanns tillgängliga på arabiska),
    Ptolemaios astronomi, al-Khwarizmis algebra och persern Avicennas
    medicin. Under kung [Alfonso X](#alfonso-x-den-vise) på 1200-talet
    fortsatte arbetet, nu även till kastilianska.

    Betydelsen är svår att överskatta: de nya texterna blev grundstommen
    när de första universiteten ([Bologna, Paris,
    Oxford](#universitet-i-paris-och-oxford-tar-form)) växte fram
    kring 1200. Många ord kom in den vägen: algoritm, algebra, zenit,
    siffra (från arabiska *sifr*, noll). Se även [Gerhard av
    Cremona](#toledo-arabisk-vetenskap-till-latin), den mest produktive
    översättaren, och [Adelard av
    Bath](#adelard-av-bath-oversatter-euklides-fran), som gjorde liknande
    arbete.

portugal-kungarike-1139-lissabon-1147:
  period: 1140
  label: "Portugal kungarike 1139, Lissabon 1147"
  title: "Portugal blir kungarike och tar Lissabon"
  wiki:
    - "sv:Alfons I av Portugal"
    - "en:Siege of Lisbon"
  text: |
    Portugal började som ett grevskap under kungariket León (i nordvästra
    Spanien). **Afonso Henriques** (ca 1109–1185), son till greven, tog
    makten 1128 genom att besegra sin egen mor. Efter en seger över
    muslimerna vid Ourique 1139 började han kalla sig kung. León erkände
    det 1143 och påven 1179. Portugals gränser mot Spanien har sedan
    ändrats mycket lite, vilket gör dem till några av Europas äldsta.

    1147 belägrade Afonso **Lissabon**, då en muslimsk stad med kanske 150
    000 invånare (osäker uppskattning). Han fick hjälp av en flotta med
    uppskattningsvis 10 000–13 000 korsfarare från England, Flandern och
    Tyskland som var på väg till [andra
    korståget](#andra-korstaget-114749) i Palestina. De stannade mot löfte
    om att få plundra staden. Efter fyra månaders belägring kapitulerade
    Lissabon i oktober 1147.

    Det var en av de få framgångarna kopplade till andra korståget, som
    annars misslyckades i Mellanöstern. Lissabon blev huvudstad under
    1200-talet. Portugal blev senare först med de stora upptäcktsresorna:
    på 1400-talet seglade portugiserna längs Afrikas kust och [1498 nådde
    Vasco da Gama Indien sjövägen](#vasco-da-gama-i-calicut-1498).

almohader-tar-al-andalus:
  period: 1140
  label: "almohader tar al-Andalus"
  title: "Almohaderna tar al-Andalus"
  wiki:
    - "sv:Almohader"
    - "sv:Al-Andalus"
  text: |
    **Al-Andalus** var det arabiska namnet på de muslimskt styrda delarna
    av den iberiska halvön (dagens Spanien och Portugal). Kring 1140
    styrdes det av almoraviderna, en berbisk dynasti från Marocko, men
    deras makt höll på att rasa samman, både i Spanien och i Afrika.

    De nya härskarna i Marocko, **almohaderna** (en religiös
    reformrörelse, se [Almohader mot
    almoravider](#almohader-ibn-tumart-mot-almoravider)), gick över
    Gibraltarsundet 1146–47. Under de följande decennierna tog de Sevilla
    (1147), Córdoba och Granada, och 1172 hade de hela al-Andalus under
    sig. Sevilla blev deras europeiska huvudstad; deras minaret där, den
    97 meter höga Giralda (byggd 1184–98), är i dag katedralens klocktorn.

    Almohaderna var strängare mot religiösa minoriteter än tidigare
    härskare. Många judar och kristna flydde norrut eller tvingades
    konvertera. Den kände judiske filosofen och läkaren **Maimonides**
    lämnade Córdoba med familjen och hamnade till slut i Egypten.
    Samtidigt verkade filosofen
    **[Averroës](#averroes-kommenterar-aristoteles)** (Ibn Rushd) vid
    almohadhovet; hans kommentarer till Aristoteles fick stort inflytande
    i Europa. Almohadernas makt i Spanien bröts genom de kristnas seger
    vid [Las Navas de Tolosa 1212](#las-navas-de-tolosa-1212-almohaderna),
    varefter reconquistan gick snabbt.

riddarordnar-calatrava-santiago:
  period: 1160
  label: "Riddarordnar (Calatrava, Santiago)"
  title: "De spanska riddarordnarna"
  wiki:
    - "en:Order of Calatrava"
    - "en:Order of Santiago"
    - "sv:Riddarorden"
  text: |
    En riddarorden var en ny sorts organisation från korstågstiden:
    riddare som avlade munklöften (fattigdom, kyskhet, lydnad) men levde
    som krigare. Förebilden var [tempelherrarna](#tempelherreorden-1119)
    och [johanniterna](#johanniterorden-1113), som grundats i Jerusalem
    kring 1100–1120 för att skydda pilgrimer och korsfararstaterna.

    På den iberiska halvön, där de kristna kungarikena krigade mot
    muslimska al-Andalus (se Reconquista), skapades egna ordnar.
    **Calatravaorden** bildades 1158 när tempelherrarna övergav borgen
    Calatrava söder om Toledo och en abbot och munkar tog över försvaret.
    **Santiagoorden**, uppkallad efter aposteln Jakob (Santiago), Spaniens
    skyddshelgon, grundades omkring 1170 och lät till skillnad från de
    flesta ordnar sina riddare gifta sig. Även Alcántara-orden och i
    Portugal Avis-orden bildades.

    Ordnarna var permanenta, disciplinerade styrkor – något kungarna
    sällan hade – och fick ansvar för gränsborgar. Som belöning fick de
    enorma landområden i de erövrade områdena, särskilt i La Mancha och
    Extremadura. De blev så mäktiga att de spanska kungarna 1489–99 tog
    över stormästarskapen själva. Ordnarna finns kvar i dag som
    hedersorganisationer.

almohader-vinner-vid-alarcos-1195:
  period: 1180
  label: "Almohader vinner vid Alarcos 1195"
  title: "Slaget vid Alarcos 1195"
  wiki:
    - "sv:Slaget vid Alarcos"
    - "en:Battle of Alarcos"
  text: |
    På Iberiska halvön pågick sedan 700-talet en lång kamp mellan kristna
    kungariken i norr (Kastilien, León, Aragonien, Portugal, Navarra) och
    muslimska stater i söder. Den kristna återerövringen kallas
    *reconquista*. På 1100-talet hade [almohaderna](#almohader), en
    berbisk dynasti från Marocko (se ”almohader”), tagit över det
    muslimska Spanien.

    Vid **Alarcos**, söder om Toledo, möttes 1195 kung Alfons VIII av
    Kastilien och almohadkalifen Abu Yusuf al-Mansur. Kastilianerna anföll
    utan att vänta på hjälp från León och Navarra och led ett svårt
    nederlag; förlusterna var stora men exakta siffror saknas.

    Segern gav almohaderna kontroll över stora områden i centrala Spanien
    för en tid och skrämde de kristna kungarna. Men nederlaget fick dem
    också att samarbeta och påven att utlysa korståg, vilket ledde till
    revanschen vid [Las Navas de Tolosa
    1212](#las-navas-de-tolosa-1212-almohaderna) (se detta).

las-navas-de-tolosa-1212-almohaderna:
  period: 1200
  label: "Las Navas de Tolosa 1212: almohaderna krossas"
  title: "Las Navas de Tolosa 1212"
  wiki:
    - "sv:Slaget vid Las Navas de Tolosa"
    - "en:Battle of Las Navas de Tolosa"
  text: |
    Efter nederlaget vid [Alarcos
    1195](#almohader-vinner-vid-alarcos-1195) (se detta) samlade sig de
    kristna rikena på Iberiska halvön. Påven Innocentius III utlyste
    korståg, och 1212 möttes en förenad armé från Kastilien, Aragonien och
    Navarra, med franska riddare, och almohadernas armé under kalifen
    Muhammad al-Nasir vid **Las Navas de Tolosa** i Sierra Morena,
    bergskedjan norr om Andalusien.

    Arméernas storlek är omstridd; moderna uppskattningar ligger i
    storleksordningen 10 000–15 000 på kristna sidan och 20 000–30 000 på
    almohadsidan. Enligt legenden visade en herde de kristna en okänd
    bergspassage så att de kunde gå runt de bevakade passen. Den 16 juli
    1212 krossades almohaderna, och kalifens tältläger plundrades.

    Slaget brukar ses som vändpunkten i *reconquista*, den kristna
    återerövringen. Inom 40 år föll [Córdoba (1236), Valencia
    (1238)](#cordoba-1236-valencia-1238) och [Sevilla
    (1248)](#sevilla-erovras-1248). Kvar av det muslimska Spanien blev
    bara emiratet [Granada, som föll 1492](#granada-faller-1492), samma år
    som Columbus seglade.

kastilienleon-forenas-1230:
  period: 1220
  label: "Kastilien–León förenas 1230"
  title: "Kastilien och León förenas 1230"
  wiki:
    - "sv:Ferdinand III av Kastilien"
    - "en:Crown of Castile"
  text: |
    På Iberiska halvön fanns flera kristna kungariken: Portugal, León,
    Kastilien, Navarra och Aragonien. **León** i nordväst var det äldre,
    men **Kastilien** i mitten hade blivit starkare. De hade varit
    förenade tidigare men delats 1157.

    **Ferdinand III** (1199–1252) blev kung av Kastilien 1217 genom sin
    mor och ärvde León efter sin far 1230. Sedan dess var de två kronorna
    permanent förenade. Kastilien–León omfattade nu ungefär halva halvön
    och var den överlägset starkaste kristna staten där.

    Det gjorde att Ferdinand kunde driva *reconquista*, den kristna
    återerövringen, i högt tempo: Córdoba 1236, Jaén 1246 och Sevilla 1248
    (se ”[Córdoba 1236, Valencia 1238](#cordoba-1236-valencia-1238)”). Han
    helgonförklarades 1671. Föreningen av Kastilien och Aragonien genom
    [Ferdinand och Isabellas äktenskap
    1469](#ferdinand-och-isabella-gifter-sig-1469) lade sedan grunden för
    dagens Spanien.

cordoba-1236-valencia-1238:
  period: 1220
  label: "Córdoba 1236, Valencia 1238"
  title: "Córdoba 1236 och Valencia 1238"
  wiki:
    - "sv:Reconquista"
    - "en:Mosque–Cathedral of Córdoba"
    - "en:James I of Aragon"
  text: |
    Efter segern vid [Las Navas de Tolosa
    1212](#las-navas-de-tolosa-1212-almohaderna) (se detta) föll det
    muslimska Spanien, al-Andalus, sönder i små stater (*taifas*). Två
    kristna kungar utnyttjade det: **[Ferdinand
    III](#kastilienleon-forenas-1230)** av Kastilien–León och **Jakob I**
    av Aragonien, kallad ”Erövraren”.

    **Córdoba** hade varit huvudstad för umayyadernas kalifat och på
    900-talet troligen Västeuropas största stad, med uppskattningsvis 100
    000–500 000 invånare (uppskattningarna varierar kraftigt) och ett
    bibliotek som sades ha hundratusentals volymer. 1236 intogs staden av
    Ferdinand, och Stora moskén gjordes om till katedral; moskén står kvar
    med en katedral byggd mitt i den.

    Jakob I tog först Mallorca 1229 och sedan **Valencia** 1238 efter
    belägring. Muslimska invånare fick ofta stanna som *mudéjares* under
    kristna herrar. [Sevilla föll 1248](#sevilla-erovras-1248). Därefter
    återstod bara [Granada, som föll 1492](#granada-faller-1492). Muslimer
    och judar tvingades senare konvertera eller lämna landet.

sevilla-erovras-1248:
  period: 1240
  label: "Sevilla erövras 1248"
  title: "Kastilien erövrar Sevilla 1248"
  wiki:
    - "en:Siege of Seville"
    - "sv:Reconquista"
    - "sv:Ferdinand III av Kastilien"
  text: |
    Sedan 711 hade större delen av Iberiska halvön styrts av muslimer, på
    arabiska kallat *al-Andalus*. Från norr pågick sedan dess
    *Reconquista* (”återerövringen”) – en utdragen serie krig där de
    kristna kungadömena Kastilien, León, Aragonien och Portugal flyttade
    fram gränsen söderut. Ett avgörande slag stod vid [Las Navas de Tolosa
    1212](#las-navas-de-tolosa-1212-almohaderna), där almohaderna (en
    nordafrikansk dynasti som styrde al-Andalus) besegrades.

    Därefter gick det snabbt. Kung **Ferdinand III av Kastilien** tog
    [Córdoba 1236](#cordoba-1236-valencia-1238), Jaén 1246 och efter ca 16
    månaders belägring **Sevilla** i november 1248. Sevilla var en av de
    största städerna i Västeuropa, med uppskattningsvis 80 000–100 000
    invånare. Den muslimska befolkningen fick lämna staden; kristna
    bosättare från norr flyttade in. Moskén blev katedral, och dess
    minaret, *Giralda*, står fortfarande som klocktorn.

    Samtidigt erövrade Aragonien Mallorca (1229) och Valencia (1238), och
    Portugal nådde sin nuvarande sydgräns 1249. Efter 1248 återstod bara
    emiratet Granada (se ”[Granada (nasrider) kvar
    muslimskt](#granada-nasrider-kvar-muslimskt)”). Sevilla blev senare,
    efter 1503, Spaniens monopolhamn för handeln med Amerika.

granada-nasrider-kvar-muslimskt:
  period: 1240
  label: "Granada (nasrider) kvar muslimskt"
  title: "Emiratet Granada och nasriderna"
  wiki:
    - "en:Emirate of Granada"
    - "en:Nasrid dynasty"
    - "sv:Alhambra"
  text: |
    När Kastilien erövrat Córdoba och Sevilla (se ”[Sevilla erövras
    1248](#sevilla-erovras-1248)”) återstod en muslimsk stat på Iberiska
    halvön: **emiratet Granada** i bergiga sydöstra Spanien, med städerna
    Granada, Málaga och Almería. Det grundades 1238 av **Muhammad I ibn
    al-Ahmar**, den förste av *nasriderna* (dynastin är uppkallad efter en
    förfader, Nasr).

    Granada överlevde i 250 år genom att vara användbart: emiren erkände
    sig som vasall till Kastiliens kung, betalade årlig tribut i guld och
    skickade till och med trupper som hjälpte till vid belägringen av
    Sevilla. Bergen gav skydd, och emiratet spelade ut Kastilien mot
    marinidernas rike i Marocko. Många muslimer från de erövrade områdena
    flydde dit, och befolkningen var tät.

    Nasriderna byggde **Alhambra**, palatsstaden på en höjd över Granada,
    med gårdar, vattenkonst och tusentals inristade verser – i huvudsak
    uppförd på 1300-talet. [Granada föll först 2 januari
    1492](#granada-faller-1492) för Ferdinand och Isabella, samma år som
    [Columbus seglade](#columbus-1492) och [judarna
    utvisades](#judar-utvisas) ur Spanien. Därmed var 781 år av muslimskt
    styre på halvön över.

alfonso-x-den-vise:
  period: 1260
  label: "Alfonso X den vise"
  title: "Alfons X den vise av Kastilien"
  wiki:
    - "sv:Alfons X av Kastilien"
    - "en:Siete Partidas"
  text: |
    **Alfons X** (1221–1284) var kung av Kastilien och León från 1252, son
    till Ferdinand III som erövrat Sevilla (se ”[Sevilla erövras
    1248](#sevilla-erovras-1248)”). Han kallas *el Sabio*, den vise eller
    lärde.

    Hans hov i Toledo och Sevilla var ett centrum för översättning och
    lärdom, där kristna, judiska och muslimska forskare arbetade
    tillsammans. De översatte arabiska verk om astronomi och matematik och
    gjorde en stor bok om schack, tärning och brädspel. Han lät skriva en
    lagbok, *Siete Partidas*, som blev grunden för spansk rätt och senare
    användes även i Latinamerika och delar av USA (Louisiana). Han
    beställde också en historia om Spanien och om världen, och lät
    sammanställa över 400 sånger till Jungfru Maria, *Cantigas de Santa
    María*. Han lät skriva på kastilianska i stället för latin, och lade
    därmed grunden till spanskan som skriftspråk.

    Som politiker var han mindre framgångsrik. Han lade ned stora summor
    på att försöka bli tysk-romersk kejsare (valdes 1257 men erkändes
    aldrig, se ”[interregnum](#interregnum)”). Ett krig om tronföljden mot
    sonen Sancho gjorde att han i praktiken avsattes före sin död. Se även
    ”[Alfonsinska tabellerna](#alfonsinska-tabellerna)”.

alfonsinska-tabellerna:
  period: 1260
  label: "Alfonsinska tabellerna"
  title: "De alfonsinska tabellerna"
  wiki:
    - "en:Alfonsine tables"
    - "sv:Ptolemaios"
  text: |
    **De alfonsinska tabellerna** är astronomiska tabeller som
    sammanställdes i Toledo omkring 1252–1270 på uppdrag av Alfons X av
    Kastilien, av de judiska astronomerna **Judah ben Moses ha-Cohen** och
    **Isaac ibn Sid**. De gav solens, månens och de fem kända planeternas
    positioner för vilket datum som helst.

    Tabellerna byggde på *Ptolemaios* modell (grekisk astronom ca 150
    e.Kr.) där jorden står stilla i mitten och planeterna rör sig i
    cirklar på cirklar, *epicykler*, för att förklara att de ibland tycks
    gå baklänges. Modellen var invecklad men gav användbara förutsägelser.
    Tabellerna förbättrade äldre arabiska tabeller från Toledo och
    användes för kalendrar, navigation och astrologi – de flesta lärda
    ansåg att stjärnorna påverkade människors liv och hälsa.

    De var Europas standardverk i nästan 300 år och trycktes 1483 – ett
    tidigt exempel på hur tryckpressen spred vetenskapliga data.
    [Copernicus använde](#kopernikus-de-revolutionibus-1543) dem. Alfons
    sägs ha skämtat att om han varit med vid skapelsen hade han kunnat ge
    Gud några råd om ett enklare system. Tabellerna ersattes av Reinholds
    tabeller 1551 (byggda på Copernicus) och Keplers Rudolfinska tabeller
    1627, som var långt mer exakta.

sicilianska-aftonsangen-1282-aragonien:
  period: 1280
  label: "Sicilianska aftonsången 1282: Aragonien får Sicilien"
  title: "Sicilianska aftonsången 1282"
  wiki:
    - "en:Sicilian Vespers"
    - "en:War of the Sicilian Vespers"
  text: |
    Sicilien styrdes sedan 1266 av den franske prinsen **Karl av Anjou**,
    som påven hade gett ön. Fransmännens styre var hårt och skatterna
    höga. På påskdagen 1282, vid tiden för kvällsmässan (”aftonsången”),
    utbröt ett upplopp i Palermo efter att en fransk soldat ofredat en
    kvinna. Det spred sig över ön, och uppskattningsvis några tusen
    fransmän dödades.

    Sicilianarna bad kung **Peter III av Aragonien** om hjälp. Aragonien
    var ett rike i nordöstra Spanien med Barcelona som stark handelsstad,
    och Peter var gift med en dotter till Siciliens tidigare kung, vilket
    gav honom anspråk. Han landsteg och blev kung av Sicilien. Det följde
    20 års krig, med påven och Frankrike på Anjous sida.

    Resultatet blev att södra Italien delades: Neapel stannade hos Anjou,
    Sicilien hos Aragonien. Det var början på det aragonska och senare
    spanska väldet i Medelhavet – Sardinien, Neapel och Sicilien hamnade
    så småningom under Spanien och förblev så in på 1700-talet. Händelsen
    inspirerade Verdis opera *Den sicilianska aftonsången* (1855).

reconquistan-avstannar:
  period: 1300
  label: "Reconquistan avstannar"
  title: "Reconquistan avstannar"
  wiki:
    - "sv:Reconquista"
    - "en:Reconquista"
  text: |
    **Reconquistan** (”återerövringen”) var den process genom vilken
    kristna kungadömen i norra Spanien under nästan 800 år erövrade
    Iberiska halvön från muslimska stater. Muslimer från Nordafrika hade
    tagit nästan hela halvön år 711. Efter det kristna genombrottet vid
    [Las Navas de Tolosa 1212](#las-navas-de-tolosa-1212-almohaderna) gick
    det snabbt: Córdoba föll 1236 och [Sevilla
    1248](#sevilla-erovras-1248).

    Därefter fanns bara **emiratet Granada** kvar i sydost ([se
    Granada](#granada-nasrider-kvar-muslimskt)). Under 1300-talet stod
    gränsen nästan stilla i 150 år. Skälen var flera: Kastilien – det
    största kristna kungadömet – hade inbördes strider om tronen; den
    kristna befolkningen räckte inte för att befolka de stora erövrade
    områdena; Granada betalade tribut i guld och var användbart; och
    Nordafrikas marinider kom ibland till Granadas hjälp. Kastilien vann
    över dem vid Salado 1340 och tog Algeciras 1344, men gick inte vidare.

    Portugal hade redan fullbordat sin del 1249 och vände sig mot havet,
    vilket ledde till upptäcktsresorna på 1400-talet. [Granada föll först
    1492](#granada-faller-1492) – samma år som [Columbus
    seglade](#columbus-1492) till Amerika.

granada:
  period: 1320
  label: "Granada"
  title: "Emiratet Granada"
  wiki:
    - "en:Emirate of Granada"
    - "sv:Alhambra"
  text: |
    **Emiratet Granada** var den sista muslimska staten på Iberiska
    halvön. Det grundades 1238 av **Muhammad I ibn Nasr**, när andra
    muslimska områden föll för de kristna kungadömena under reconquistan
    ([se det](#reconquistan-avstannar)). Dynastin kallas nasriderna.
    Granada omfattade ungefär dagens provinser Granada, Málaga och Almería
    i Andalusien.

    Granada överlevde i 250 år genom en kombination av bergig terräng,
    starka befästningar, diplomati och tribut – det betalade ofta guld
    till Kastilien för att få vara i fred, och kunde ibland få hjälp från
    muslimska stater i Nordafrika. Befolkningen ökade när muslimer flydde
    från de erövrade områdena; staden Granada kan ha haft uppskattningsvis
    50 000–100 000 invånare. Handel med siden, socker och torkad frukt
    gick via Genua.

    Under 1300-talet byggdes större delen av **Alhambra**, palatsstaden på
    en kulle ovanför staden, med sina gårdar, vattenkonster och
    detaljerade stuckaturer. Den är idag ett av de mest besökta monumenten
    i Spanien. [Granada föll till Ferdinand och Isabella
    1492](#granada-faller-1492), och därmed fullbordades reconquistan –
    samma år som [judarna fördrevs](#judar-utvisas) från Spanien och
    [Columbus seglade](#columbus-1492).

digerdoden-2:
  period: 1340
  label: "Digerdöden"
  same_as: digerdoden

trastamara-1369:
  period: 1360
  label: "Trastámara 1369"
  title: "Huset Trastámara tar Kastilien 1369"
  wiki:
    - "en:House of Trastámara"
    - "en:Castilian Civil War"
  text: |
    Kastilien var det största kungadömet på Iberiska halvön. Kung **Peter
    I** (1350–1369), kallad ”den grymme” av sina fiender och ”den
    rättvise” av sina anhängare, styrde hårt och lät döda flera släktingar
    och adelsmän. Hans halvbror **Henrik av Trastámara**, en oäkta son
    till den förre kungen, gjorde uppror.

    Inbördeskriget blev en del av
    [hundraårskriget](#hundraarskriget-borjar-1337): Frankrike stödde
    Henrik och skickade Bertrand du Guesclin med legosoldater, medan
    England stödde Peter och skickade Edvard, ”Svarte prinsen”, som vann
    en seger vid Nájera 1367. Men 1369 möttes bröderna i ett tält vid
    Montiel och Henrik dödade Peter med egen hand. Henrik blev kung som
    Henrik II.

    Huset Trastámara styrde sedan Kastilien och från 1412 även Aragonien.
    Det är viktigt för att det knyter ihop senare historia: **Isabella av
    Kastilien** och **Ferdinand av Aragonien**, som båda var Trastámara,
    [gifte sig 1469](#ferdinand-och-isabella-gifter-sig-1469). Deras
    förening blev grunden till Spanien. Det var de som 1492 [erövrade
    Granada](#granada-faller-1492), [fördrev judarna](#judar-utvisas) och
    finansierade [Columbus resa](#columbus-1492).

pogromer-1391:
  period: 1380
  label: "Pogromer 1391"
  title: "Pogromerna i Spanien 1391"
  wiki:
    - "en:Massacre of 1391"
    - "en:Converso"
  text: |
    På Iberiska halvön levde under medeltiden en av Europas största
    judiska befolkningar, kanske uppåt ett par hundratusen människor.
    Judarna hade länge haft en viktig roll som läkare, översättare,
    skatteindrivare och finansiärer åt kungarna. Men efter digerdöden,
    ekonomiska kriser och Kastiliens inbördeskrig ([se Trastámara
    1369](#trastamara-1369)) växte fientligheten, uppeldad av predikanter.

    I juni 1391 utlöste ärkediakonen **Ferrand Martínez** i Sevilla ett
    angrepp på stadens judiska kvarter. Under sommaren spred sig våldet
    till Córdoba, Toledo, Valencia, Barcelona, Mallorca och dussintals
    andra städer. Tusentals judar dödades – uppskattningar varierar
    mycket, ofta flera tusen – och synagogor förstördes. En pogrom är ett
    organiserat massvåld mot en folkgrupp; ordet kommer från ryska och
    används sedan 1800-talet.

    Den stora följden var att tiotusentals judar tvingades eller pressades
    att låta döpa sig. Dessa **conversos** (”omvända”) misstänktes sedan
    för att i hemlighet fortsätta vara judar. Misstankarna ledde till att
    den spanska **inkvisitionen** inrättades 1478 för att utreda dem, och
    [1492 utvisades alla judar](#judar-utvisas) som inte lät döpa sig ur
    Spanien.

portugal-tar-ceuta-1415:
  period: 1400
  label: "Portugal tar Ceuta 1415"
  title: "Portugal erövrar Ceuta 1415"
  wiki:
    - "en:Conquest of Ceuta"
    - "sv:Henrik sjöfararen"
  text: |
    **Ceuta** är en hamnstad på Afrikas nordkust, mitt emot Gibraltar. På
    1400-talet var den en rik muslimsk handelsstad, slutpunkt för
    karavaner som förde guld från Västafrika över Sahara. Portugal var ett
    litet land med ungefär en miljon invånare och hade avslutat sin
    ”reconquista” – återerövringen av landet från muslimerna – redan 1249.

    I augusti 1415 seglade kung **Johan I** med en flotta på
    uppskattningsvis 200 fartyg och kanske 20 000 man över till Ceuta och
    erövrade staden på en dag. Bland deltagarna fanns kungens son, prins
    **Henrik**, senare kallad [Henrik
    sjöfararen](#henrik-sjofararen-madeira-azorerna). Motiven var flera:
    korstågsiver, ära för den unga dynastin, att komma åt guldhandeln och
    att stoppa pirater.

    Erövringen räknas ofta som starten på den **europeiska
    kolonialexpansionen**. Guldet hamnade inte i Ceuta, eftersom
    karavanerna helt enkelt valde andra hamnar. Därför började Portugal i
    stället söka sjövägen längs Afrikas kust för att nå guldet direkt. Det
    ledde till Madeira (1420), Azorerna, Kap Verde, [Godahoppsudden
    (1488)](#dias-rundar-godahoppsudden-1488) och [Vasco da Gamas resa
    till Indien (1498)](#vasco-da-gama-i-calicut-1498). Ceuta tillhör idag
    Spanien.

kastilien-erovrar-kanarieoarna:
  period: 1400
  label: "Kastilien erövrar Kanarieöarna"
  title: "Kanarieöarnas erövring från 1402"
  wiki:
    - "en:Conquest of the Canary Islands"
    - "en:Guanches"
  text: |
    **Kanarieöarna** är en ögrupp i Atlanten utanför Marockos kust. De
    beboddes av **guancherna**, ett folk med nordafrikanskt (berberiskt)
    ursprung som kommit dit omkring 2 000 år tidigare. De levde i
    stenåldersliknande samhällen utan metall och utan båtar som kunde
    förbinda öarna.

    1402 ledde två franska adelsmän, **Jean de Béthencourt** och Gadifer
    de La Salle, en expedition som erövrade de små östra öarna Lanzarote,
    Fuerteventura och El Hierro, i den kastilianske kungens namn.
    Erövringen av de större öarna tog nästan hundra år: Gran Canaria föll
    1483 och Teneriffa först 1496, efter hårt motstånd. Guancherna dödades
    i strid, förslavades och drabbades hårt av europeiska sjukdomar; deras
    språk och kultur dog ut.

    Kanarieöarna blev ett slags provkörning för senare kolonialism i
    Amerika: erövring, slaveri, sockerplantager och omvändelse. De blev
    också en viktig hamn – [Columbus seglade från La Gomera i september
    1492](#columbus-1492), eftersom passadvindarna söder om Kanarieöarna
    blåste rakt västerut över Atlanten. Den rutten användes sedan för de
    flesta resor till Amerika.

henrik-sjofararen-madeira-azorerna:
  period: 1420
  label: "Henrik Sjöfararen: Madeira, Azorerna"
  title: "Henrik Sjöfararen, Madeira och Azorerna"
  wiki:
    - "sv:Henrik Sjöfararen"
    - "sv:Madeira"
    - "sv:Azorerna"
  text: |
    **Henrik Sjöfararen** (1394–1460) var en portugisisk prins, son till
    kung Johan I. Trots namnet seglade han nästan aldrig själv. Han
    organiserade och finansierade expeditioner längs Afrikas västkust och
    ut i Atlanten. Motiven var en blandning av guld, slavar, korståg mot
    muslimer och att hitta den legendariske kristne kungen Prester John.
    Den berömda ”sjöfartsskolan” i Sagres är till stor del en myt.

    Under hans ledning koloniserades **Madeira** från omkring 1420 och
    **Azorerna**, cirka 1 400 km ut i Atlanten, från 1430-talet. Öarna var
    obebodda. Portugiserna använde och utvecklade
    **[karavellen](#karavellen-och-astrolabium-pa-havet)**, ett mindre,
    lättmanövrerat fartyg som kunde kryssa mot vinden.

    På Madeira byggdes på 1400-talets mitt **sockerplantager** drivna med
    slavar. Det blev förebilden för plantageekonomin som senare flyttades
    till Brasilien och Karibien och som drev den [atlantiska
    slavhandeln](#atlantisk-slavhandel-borjar).

    Henriks projekt ledde vidare till [Kap Bojador
    1434](#portugiser-rundar-kap-bojador-1434), Guinea, och efter hans död
    till Bartolomeu Dias ([Godahoppsudden
    1488](#dias-rundar-godahoppsudden-1488)) och Vasco da Gama ([Indien
    1498](#vasco-da-gama-i-calicut-1498)).

portugisisk-slavhandel-borjar-1444:
  period: 1440
  label: "Portugisisk slavhandel börjar 1444"
  title: "Portugisisk slavhandel börjar 1444"
  wiki:
    - "en:Portuguese slave trade"
    - "en:Lagos, Portugal"
  text: |
    I augusti 1444 landsattes cirka 235 afrikaner, tillfångatagna längs
    Mauretaniens kust, i hamnstaden **Lagos** i södra Portugal och såldes
    på en marknad i närvaro av [Henrik
    Sjöfararen](#henrik-sjofararen-madeira-azorerna). Krönikören Gomes
    Eanes de Zurara beskrev hur familjer slets isär – en ovanligt tidig
    skildring av den mänskliga sidan.

    Slaveri var inte nytt. Det fanns i Medelhavsvärlden sedan antiken, och
    arabiska handlare hade länge fört slavar över Sahara. Men det här var
    början på en ny havsburen handel som europeiska stater organiserade,
    och som allt mer kom att bygga på hudfärg.

    Först togs människor i plundringsräder, men snart övergick
    portugiserna till att köpa fångar av afrikanska härskare och handlare
    i utbyte mot hästar, tyger och metallvaror. Påven gav 1452 och 1455
    Portugal formell rätt att förslava ”saracener och hedningar” (bullorna
    *Dum Diversas* och *Romanus Pontifex*).

    Detta utvecklades till den **atlantiska slavhandeln**, som fram till
    1860-talet förde uppskattningsvis 12,5 miljoner afrikaner över
    Atlanten ([se atlantisk slavhandel
    börjar](#atlantisk-slavhandel-borjar)).

ferdinand-och-isabella-gifter-sig-1469:
  period: 1460
  label: "Ferdinand och Isabella gifter sig 1469"
  title: "Ferdinand och Isabella gifter sig 1469"
  wiki:
    - "sv:Ferdinand II av Aragonien"
    - "sv:Isabella I av Kastilien"
  text: |
    Spanien fanns ännu inte som land. Den iberiska halvön bestod av flera
    kungariken: **Kastilien** (största, centrala och norra Spanien),
    **Aragonien** (öster, med Katalonien, Valencia och ägor i Medelhavet
    som Sicilien), Portugal, Navarra, och längst i söder det muslimska
    emiratet **Granada**.

    1469 gifte sig **Isabella** (18 år), halvsyster till Kastiliens kung,
    i hemlighet med **Ferdinand** (17 år), tronföljare i Aragonien. Hennes
    bror ville gifta bort henne med Portugals kung. Paret behövde en
    förfalskad påvlig dispens, eftersom de var kusiner. Isabella blev
    drottning av Kastilien 1474 efter ett tronföljdskrig, och Ferdinand
    kung av Aragonien 1479.

    Länderna förblev formellt skilda, med egna lagar och institutioner,
    men styrdes gemensamt. De kallades *de katolska monarkerna*. 1492 blev
    deras ödesår: [de erövrade Granada](#granada-faller-1492) och
    avslutade den kristna återerövringen
    (*[reconquista](#reconquistan-avstannar)*), de [fördrev alla
    judar](#judar-utvisas) som vägrade konvertera – uppskattningsvis 40
    000–100 000 människor – och de finansierade [Columbus
    resa](#columbus-1492) västerut.

    De införde också den **spanska inkvisitionen** 1478. Deras barnbarn
    **[Karl V](#karl-v-habsburg-1516)** ärvde både Spanien och Habsburgs
    länder och blev 1500-talets mäktigaste härskare.

granada-faller-1492:
  period: 1480
  label: "Granada faller 1492"
  title: "Granadas fall 1492"
  wiki:
    - "en:Granada War"
    - "en:Emirate of Granada"
    - "en:Reconquista"
  text: |
    Sedan 711 hade muslimer (”morer”) styrt stora delar av Iberiska
    halvön. Den kristna återerövringen,
    **[reconquista](#reconquistan-avstannar)**, pågick i nästan 800 år. På
    1400-talet återstod bara emiratet **Granada** i söder, styrt av
    Nasrid-ätten, känd för palatset Alhambra.

    [1469 gifte sig](#ferdinand-och-isabella-gifter-sig-1469) **Isabella
    av Kastilien** och **Ferdinand av Aragonien**, vilket i praktiken
    förenade de två stora kristna rikena till det som blev Spanien. De
    kallas ”de katolska monarkerna”. 1482–1492 förde de krig mot Granada,
    med stora arméer och modernt artilleri. Den 2 januari 1492 överlämnade
    emir Muhammad XII (Boabdil) staden.

    Fredsvillkoren lovade muslimerna religionsfrihet, men löftet bröts:
    från 1499 tvångsomvändes de, och 1609–1614 utvisades deras ättlingar
    ([moriskerna](#moriskerna-utvisas-1609)), uppskattningsvis 300 000
    människor. Samma år som Granada föll [utvisades
    judarna](#judar-utvisas) och [Columbus seglade](#columbus-1492)
    västerut – 1492 är året då Spanien blev ett enat, katolskt och
    expanderande rike.

judar-utvisas:
  period: 1480
  label: "judar utvisas"
  title: "Judarna utvisas ur Spanien 1492"
  wiki:
    - "en:Alhambra Decree"
    - "en:Expulsion of the Jews from Spain"
    - "en:Spanish Inquisition"
  text: |
    Spanien hade en av Europas största judiska befolkningar, med en lång
    tradition av lärdom, handel och medicin. Efter [förföljelser och
    massakrer 1391](#pogromer-1391) hade många judar konverterat till
    kristendomen. 1478 inrättades den **spanska inkvisitionen**, en
    kyrklig domstol under kronan, för att leta upp konvertiter som i
    hemlighet fortsatte med judiska seder.

    Den 31 mars 1492, tre månader efter [Granadas
    fall](#granada-faller-1492), utfärdade [Ferdinand och
    Isabella](#ferdinand-och-isabella-gifter-sig-1469)
    **Alhambradekretet**: alla judar måste döpa sig eller lämna landet
    inom fyra månader. Hur många som gav sig av är omstritt –
    uppskattningarna ligger mellan omkring 40 000 och 100 000 eller fler.
    Många konverterade i stället. De som flydde fick ofta lämna egendom
    bakom sig.

    De spanska judarna, **sefarderna**, spreds till Portugal (där de
    tvångsdöptes 1497), Nordafrika, Italien och främst Osmanska riket, där
    sultanen tog emot dem. Thessaloniki fick judisk majoritet. Senare blev
    Amsterdam ett centrum. De bevarade sitt spanska språk, ladino.
    Dekretet upphävdes formellt först 1968.

columbus-1492:
  period: 1480
  label: "Columbus 1492"
  title: "Columbus seglar västerut 1492"
  wiki:
    - "en:Voyages of Christopher Columbus"
    - "en:Christopher Columbus"
  text: |
    **Kristoffer Columbus** var en sjöman från Genua. Han ville nå Asiens
    kryddor och guld genom att segla västerut, men hade räknat fel: han
    trodde att Japan låg omkring 4 000 km väster om Kanarieöarna. Det
    verkliga avståndet är runt 19 000 km. Portugal sa nej, men Isabella
    och Ferdinand av Spanien sa till slut ja efter [Granadas
    fall](#granada-faller-1492).

    Den 3 augusti 1492 lämnade han Palos med tre små skepp – *Santa
    María*, *Pinta* och *Niña* – och omkring 90 man. Från Kanarieöarna tog
    överfarten fem veckor; i dag tar flyget cirka åtta timmar. Den 12
    oktober nådde han [en ö i Bahamas](#columbus-i-karibien-1492).

    Columbus gjorde fyra resor och dog 1506 i tron att han varit i Asien;
    därför kallas ursprungsbefolkningen fortfarande ”indianer”. Hans resor
    blev starten på den europeiska koloniseringen av Amerika, det
    ”[columbianska utbytet](#columbianska-utbytet-majs-potatis)” av
    växter, djur och sjukdomar, och ett folkmord på [ursprungsbefolkningen
    i Karibien](#tainofolket-dor-ut). [Se även Tordesillasfördraget
    1494](#tordesillas-1494).

tordesillas-1494:
  period: 1480
  label: "Tordesillas 1494"
  title: "Tordesillasfördraget 1494"
  wiki:
    - "en:Treaty of Tordesillas"
    - "en:Inter caetera"
  text: |
    Efter [Columbus resa](#columbus-1492) tvistade de två sjömakterna
    **Spanien** och **Portugal** om vem som ägde de nya länderna. Påven
    Alexander VI drog 1493 en gräns i Atlanten, och 1494 förhandlade
    länderna fram sin egen variant i den spanska staden **Tordesillas**.

    Gränsen blev en nord–sydlig linje 370 sjömil (leguas) väster om Kap
    Verdeöarna, ungefär vid 46° västlig längd. Allt väster om den skulle
    tillhöra Spanien, allt öster om den Portugal. Ingen visste då vad som
    låg där – världen delades upp på en karta som mest var tom.

    Följderna syns än i dag. Brasiliens östspets låg öster om linjen, och
    när [Cabral landade där 1500](#cabral-i-brasilien-1500) blev landet
    portugisiskt – därför talar 210 miljoner brasilianare portugisiska,
    medan resten av Sydamerika talar spanska. Portugal fick [sjövägen runt
    Afrika till Asien](#vasco-da-gama-i-calicut-1498). På andra sidan
    jorden drogs gränsen 1529. England, Frankrike och Nederländerna
    erkände aldrig delningen och koloniserade ändå.

karl-v-habsburg-1516:
  period: 1500
  label: "Karl V (Habsburg) 1516"
  title: "Karl V – Habsburgarnas världsrike"
  wiki:
    - "en:Charles V, Holy Roman Emperor"
    - "en:Habsburg Spain"
  text: |
    **Karl V** (1500–1558) var resultatet av Habsburgarnas
    giftermålspolitik ([se Maximilian I](#maximilian-i)). Genom fyra olika
    arv fick han: Nederländerna och Burgund (1506), Spanien med Neapel,
    Sicilien och kolonierna i Amerika (1516), samt de österrikiska
    länderna (1519). 1519 valdes han dessutom till tysk-romersk kejsare.
    Han styrde ett rike ”där solen aldrig gick ner”.

    Men riket var en samling länder med olika lagar, språk och intressen,
    inte en stat. Karl reste ständigt och förde krig på många fronter: mot
    Frankrike om Italien (han tog Frans I till fånga vid [Pavia
    1525](#frans-i-tillfangatas-vid-pavia-1525)), mot Osmanska riket som
    [belägrade Wien 1529](#wien-belagras-1529), och mot de protestantiska
    furstarna i Tyskland efter [Luthers
    reformation](#luther-95-teser-1517). Under hans tid erövrade
    [Cortés](#aztekriket-faller-1521) aztekriket och [Pizarro
    inkariket](#pizarro-tar-inkariket-1532), och silver från Amerika
    började strömma in.

    Karl misslyckades med att stoppa reformationen. 1555 godtogs i
    [Augsburgska religionsfreden](#augsburgska-religionsfreden-1555) att
    varje furste fick bestämma sitt lands religion. Utmattad abdikerade
    han 1556 och delade riket: Spanien till sonen [Filip
    II](#filip-ii-1556) och Österrike till brodern Ferdinand.

karl-v-kejsare:
  period: 1520
  label: "Karl V kejsare"
  title: "Karl V blir kejsare 1519/1520"
  wiki:
    - "sv:Karl V (tysk-romersk kejsare)"
    - "en:Charles V, Holy Roman Emperor"
  text: |
    **Karl V** (1500–1558) av ätten Habsburg ärvde genom en serie giften
    och dödsfall ett rike utan motstycke: Spanien med dess nya kolonier i
    Amerika, Nederländerna, södra Italien och de österrikiska länderna.
    1519 valdes han till kejsare i Tysk-romerska riket – ett löst förbund
    av hundratals tyska furstendömen och städer – och kröntes i
    Aachen 1520. Det sades att solen aldrig gick ner i hans rike.

    Hans regering präglades av tre ständiga konflikter: krig mot Frankrike
    om Italien, försvar mot Osmanska riket (se [Wien belägras
    1529](#wien-belagras-1529)) och kampen mot [Luthers
    reformation](#luther-95-teser-1517) i Tyskland. Han lyckades inte
    stoppa protestantismen och fick acceptera [Augsburgska religionsfreden
    1555](#augsburgska-religionsfreden-1555).

    Uppgiften var för stor för en person. 1556 abdikerade han, något
    mycket ovanligt, och delade riket: sonen **Filip II** fick Spanien och
    Nederländerna, brodern Ferdinand de österrikiska länderna och
    kejsartiteln. Den uppdelningen i en spansk och en österrikisk
    Habsburg-gren bestod i 150 år.

rom-plundras-1527:
  period: 1520
  label: "Rom plundras 1527"
  title: "Plundringen av Rom 1527"
  wiki:
    - "en:Sack of Rome (1527)"
    - "sv:Sacco di Roma"
  text: |
    I maj 1527 stormade [Karl V](#karl-v-kejsare):s armé Rom. Soldaterna –
    uppskattningsvis 20 000–34 000 man, bland dem tyska legoknektar
    (lantsknektar) som ofta var lutheraner – hade inte fått lön på länge,
    och deras befälhavare dödades vid stormningen. Utan ledning plundrade
    de staden i veckor.

    Bakgrunden var att påven Clemens VII hade gått i förbund med Frankrike
    mot Karl V i krigen om herraväldet över Italien. Påven flydde till
    fästningen Castel Sant'Angelo och tvingades kapitulera. Roms
    befolkning, kanske 55 000 före plundringen, sjönk kraftigt genom mord,
    pest och flykt.

    Händelsen räknas ofta som slutet på högrenässansen i Rom: konstnärer
    flydde och påvemakten var förödmjukad. Den fick också en följd i
    England: påven, nu i praktiken i Karls händer, vågade inte
    ogiltigförklara Henrik VIII:s äktenskap med Katarina av Aragonien –
    Karls moster. Det bidrog till att [Henrik bröt med
    Rom](#henrik-viii-bryter-med-rom-1534) och grundade engelska
    kyrkan 1534.

filip-ii-1556:
  period: 1540
  label: "Filip II 1556"
  title: "Filip II blir kung av Spanien 1556"
  wiki:
    - "sv:Filip II av Spanien"
    - "en:Philip II of Spain"
  text: |
    **Filip II** (1527–1598) var son till Karl V och fick vid faderns
    abdikation 1556 Spanien, Nederländerna, stora delar av Italien och de
    amerikanska kolonierna. 1580 ärvde han dessutom Portugal med dess
    handelsstationer i Afrika och Asien. Filippinerna är uppkallade efter
    honom.

    Han var en byråkratisk kung som styrde från skrivbordet i det enorma
    klosterpalatset El Escorial utanför Madrid och läste tusentals
    dokument själv. Han såg sig som katolicismens försvarare: han stödde
    motreformationen och inkvisitionen och bekämpade protestanterna. Hans
    regering präglades av silver från Amerika (se [silver från
    Potosí](#silver-fran-potosi-1545)) men också av statsbankrutter 1557,
    1560, 1575 och 1596 – krigen kostade ännu mer än inkomsterna.

    De stora händelserna: segern över osmanerna vid [Lepanto
    1571](#lepanto-1571), det [nederländska upproret från
    1568](#nederlandska-upproret-1568), som han aldrig lyckades slå ner,
    och den misslyckade [flottan Armada mot England
    1588](#armadan-slas-1588). Spanien var under hans tid Europas
    starkaste makt, men nedgången började synas mot slutet.

silver-fran-potosi-1545:
  period: 1540
  label: "silver från Potosí 1545"
  title: "Silvret från Potosí 1545"
  wiki:
    - "en:Potosí"
    - "en:Cerro Rico"
  text: |
    1545 hittades ett berg med extremt rik silvermalm, **Cerro Rico**
    (”det rika berget”), i Anderna i dagens Bolivia, på omkring 4 000
    meters höjd. Runt gruvan växte staden Potosí upp och hade omkring 1600
    uppskattningsvis 100 000–150 000 invånare – i samma storleksordning
    som London eller Paris vid samma tid.

    Arbetet utfördes främst av urinvånare genom
    *[mita](#tvangsarbete-mita-i-gruvorna)*, ett tvångsarbetssystem som
    spanjorerna övertog från inkafolket: byar måste skicka en sjundedel av
    de vuxna männen varje år. Dödligheten var mycket hög, av olyckor, kyla
    och kvicksilverförgiftning – från 1570-talet utvanns silvret genom att
    blanda malmen med kvicksilver.

    Potosí stod under en tid för en stor del av världens silverproduktion.
    Det mesta fördes till Spanien och finansierade [Filip
    II](#filip-ii-1556):s krig, men spreds sedan vidare i Europa och
    bidrog till en långvarig inflation, ”prisrevolutionen”, där priserna i
    Europa ungefär fyrdubblades under 1500-talet. En stor del hamnade till
    slut i Kina (se [Silver från Amerika via
    Manila](#silver-fran-amerika-via-manila)). Uttrycket ”vale un Potosí”
    – ”värt ett Potosí” – betyder fortfarande enorm rikedom på spanska.

nederlandska-upproret-1568:
  period: 1560
  label: "Nederländska upproret 1568"
  title: "Nederländska upproret börjar 1568"
  wiki:
    - "sv:Nederländska frihetskriget"
    - "en:Dutch Revolt"
  text: |
    Nederländerna – ungefär dagens Nederländerna, Belgien och Luxemburg –
    var Europas rikaste och mest urbaniserade område, med handelsstäder
    som Antwerpen. Det hade ärvts av [Filip II av
    Spanien](#filip-ii-1556). Där fanns många protestanter, och städerna
    var vana vid självstyre.

    Filip ville centralisera styret, höja skatterna och slå ner
    protestantismen. Efter ett bildstormsuppror 1566, där protestanter
    förstörde kyrkornas helgonbilder, skickade han hertigen av **Alba**
    med omkring 10 000 spanska soldater. Albas ”blodsdomstol” dömde över 1
    000 personer till döden. 1568 började **Vilhelm av Oranien**, en
    ledande adelsman, väpnat uppror – det räknas som början på åttioåriga
    kriget.

    Kriget pågick till 1648. De norra provinserna blev Republiken Förenade
    Nederländerna, medan södra delen (dagens Belgien) förblev spansk och
    katolsk. Den nya republiken blev på 1600-talet världens ledande
    handelsmakt, med [Ostindiska kompaniet (1602)](#voc-1602) och [börsen
    i Amsterdam](#amsterdams-bors). Se även [Nederländska
    frihetskriget](#nederlandska-frihetskriget).

lepanto-1571:
  period: 1560
  label: "Lepanto 1571"
  title: "Slaget vid Lepanto 1571"
  wiki:
    - "sv:Slaget vid Lepanto"
    - "en:Battle of Lepanto"
  text: |
    1570–71 erövrade Osmanska riket Cypern från Venedig (se [Cypern
    osmanskt](#cypern-osmanskt)). Påven samlade då en ”Heliga ligan” med
    Spanien, Venedig och flera mindre italienska stater. Flottan leddes av
    **Don Juan av Österrike**, halvbror till [Filip II](#filip-ii-1556).

    7 oktober 1571 möttes flottorna i Patrasviken utanför västra Grekland.
    Det var det sista stora sjöslaget mellan galärer – fartyg som drevs av
    roddare, ofta slavar och straffångar. Sammanlagt deltog omkring
    400–500 fartyg och uppskattningsvis 150 000–170 000 man, med roddarna
    inräknade. Ligan vann tack vare bättre artilleri och fler arkebuser;
    osmanerna förlorade nästan hela flottan och uppskattningsvis 25 000–30
    000 man. Omkring 12 000–15 000 kristna galärslavar befriades. Bland de
    sårade på den kristna sidan fanns Miguel de Cervantes, senare
    författare till [Don Quijote](#cervantes-don-quijote-1605).

    Segern firades enormt i Europa, men den strategiska effekten var
    begränsad: osmanerna byggde en ny flotta på ett år och behöll Cypern.
    Den bröt ändå bilden av den osmanska flottan som oövervinnlig och
    markerade början på en stabil uppdelning av Medelhavet.

manila-1571:
  period: 1560
  label: "Manila 1571"
  title: "Manila grundas 1571"
  wiki:
    - "sv:Manila"
    - "en:Manila galleon"
  text: |
    1565 började spanjoren **Miguel López de Legazpi** kolonisera
    Filippinerna från Mexiko (se [Spanska anspråk på
    Filippinerna](#spanska-ansprak-pa-filippinerna)). 1571 tog han
    Maynila, en muslimsk handelsort vid Pasigflodens mynning styrd av
    lokala härskare, och gjorde den till huvudstad för den spanska
    kolonin.

    Manila blev ändpunkten för den spanska
    [Manilagaleonen](#manilagaleonerna-till-acapulco), som från 1565 till
    1815 seglade en eller två gånger per år mellan Acapulco i Mexiko och
    Manila. Resan över Stilla havet tog västerut omkring 3 månader, och
    tillbaka österut 4–6 månader. Galeonerna fraktade amerikanskt silver
    till Asien och tog tillbaka kinesiskt siden och porslin och asiatiska
    kryddor.

    Det var första gången det fanns en regelbunden handelslinje som knöt
    ihop Amerika, Asien och – via Mexiko och Atlanten – Europa. Därför ses
    1571 ofta som födelseåret för den globala handeln (se [Silver från
    Amerika via Manila](#silver-fran-amerika-via-manila)). Filippinerna
    förblev spanskt i 327 år, tills USA tog över 1898; därför är landet
    idag till övervägande del katolskt.

personalunion-med-portugal-1580:
  period: 1580
  label: "Personalunion med Portugal 1580"
  title: "Spanien och Portugal förenas 1580"
  wiki:
    - "en:Iberian Union"
    - "sv:Filip II av Spanien"
  text: |
    En **personalunion** betyder att två länder har samma monark men i
    övrigt behåller egna lagar och förvaltning – jämför
    [Kalmarunionen](#kalmarunionen-1397-margareta) i Norden. 1578 stupade
    Portugals unge kung Sebastian i ett fälttåg i Marocko utan arvingar.
    Spaniens kung **Filip II**, vars mor var portugisisk prinsessa, gjorde
    anspråk på tronen, skickade en armé 1580 och blev kung av Portugal.

    Därmed styrde en och samma kung de två största kolonialimperierna:
    Spaniens Amerika och Filippinerna samt Portugals Brasilien,
    handelsstationer i Afrika, Indien (Goa), Malackka och Macao i Kina.
    Det var det första imperium där solen aldrig gick ner.

    Föreningen blev dyr för Portugal. Spaniens fiender – Nederländerna och
    England – anföll nu också portugisiska kolonier, och holländarna tog
    stora delar av Portugals asiatiska handel ([se VOC 1602](#voc-1602))
    och en tid [nordöstra Brasilien](#hollandare-i-nordostra-brasilien).
    [1640 gjorde Portugal uppror](#portugal-fritt-1640) och fick under
    huset Braganza tillbaka sin självständighet, vilket erkändes av
    Spanien 1668.

cervantes-don-quijote-1605:
  period: 1600
  label: "Cervantes: Don Quijote 1605"
  title: "Cervantes: Don Quijote 1605"
  wiki:
    - "sv:Don Quijote"
    - "sv:Miguel de Cervantes"
  text: |
    **Miguel de Cervantes** (1547–1616) var en spansk soldat och
    författare. Han sårades i sjöslaget vid [Lepanto 1571](#lepanto-1571)
    mot osmanerna och förlorade rörligheten i vänster hand, satt fem år
    som slav i Alger efter att pirater tagit honom, och arbetade sedan som
    skatteindrivare och satt i fängelse för oegentligheter i
    räkenskaperna.

    1605 kom första delen av *Don Quijote* (andra delen 1615). Den handlar
    om en lantadelsman som läst så många riddarromaner att han tror sig
    vara riddare och drar ut på äventyr med bonden Sancho Panza som
    väpnare. Den mest kända scenen: han anfaller väderkvarnar som han tror
    är jättar – därav uttrycket ”slåss mot väderkvarnar”.

    Boken räknas ofta som den första moderna romanen: den har realistiska,
    komplexa personer, ironi och lek med själva berättandet. Den blev
    omedelbart en succé och översattes snabbt till engelska och franska.
    Den skrevs under Spaniens ”guldålder” i konst och litteratur,
    samtidigt som imperiet började försvagas (se
    [Olivares](#olivares-nedgang)). Cervantes dog 1616, samma år som
    [Shakespeare](#shakespeare-dor-1616).

moriskerna-utvisas-1609:
  period: 1600
  label: "moriskerna utvisas 1609"
  title: "Moriskerna utvisas 1609–1614"
  wiki:
    - "en:Expulsion of the Moriscos"
    - "sv:Morisker"
  text: |
    **Moriskerna** var ättlingar till de muslimer som bodde kvar i Spanien
    efter att det sista muslimska riket, [Granada, erövrats
    1492](#granada-faller-1492). Under 1500-talet tvingades de konvertera
    till kristendomen, och arabisk dräkt och språk förbjöds. Många behöll
    i hemlighet islamiska seder, och myndigheterna och inkvisitionen
    (kyrkans domstol mot kätteri) misstänkte dem för att samarbeta med
    osmanerna och nordafrikanska pirater.

    1609 beslöt kung **Filip III** att utvisa samtliga. Fram till 1614
    tvingades uppskattningsvis 300 000 människor – omkring 4 procent av
    Spaniens befolkning – ut, de flesta till Nordafrika. Många dog på
    vägen eller överfölls. Jämför med [utvisningen av judarna ur Spanien
    1492](#judar-utvisas), som troligen omfattade 40 000–100 000 personer.

    Effekten var störst i Valencia och Aragonien, där moriskerna i
    Valencia var omkring en tredjedel av befolkningen och utgjorde en stor
    del av jordbruksarbetarna. Hela byar blev öde och jordbruket och
    kreditmarknaden drabbades hårt. Utvisningen räknas som en av de
    största etniska rensningarna i det tidigmoderna Europa.

olivares-nedgang:
  period: 1620
  label: "Olivares, nedgång"
  title: "Olivares och Spaniens nedgång"
  wiki:
    - "en:Gaspar de Guzmán, Count-Duke of Olivares"
    - "en:Decline of Spain"
  text: |
    **Gaspar de Guzmán, greve-hertig av Olivares** (1587–1645) var kung
    Filip IV:s förste minister och Spaniens verklige ledare 1621–1643 –
    den spanska motsvarigheten till [Richelieu](#richelieu) (se där), och
    hans rival. Spanien var fortfarande Europas största makt, med
    besittningar från Amerika och Filippinerna till Italien och
    Nederländerna, men statsfinanserna var i kris trots silvret från
    [Potosí](#potosi-varldens-storsta-silvergruva) (se där).

    Olivares ville stärka imperiet genom en ”union av vapnen”: alla
    delriken – Kastilien, Katalonien, Portugal, Aragonien, Italien –
    skulle bidra med soldater och pengar, inte bara Kastilien. Samtidigt
    återupptog Spanien 1621 kriget mot Nederländerna och drogs in i
    trettioåriga kriget och från 1635 i krig mot Frankrike. Staten gick i
    betalningsinställelse (konkurs) flera gånger och försämrade myntet.

    Kraven ledde 1640 till uppror i både Katalonien och Portugal;
    [Portugal blev självständigt](#portugal-fritt-1640) ([se Personalunion
    med Portugal 1580](#personalunion-med-portugal-1580)). Olivares
    avskedades 1643, samma år som den spanska armén slogs vid Rocroi i
    Frankrike. Vid freden 1648 fick Spanien erkänna [Nederländernas
    självständighet](#nederlanderna-erkanns-1648), och 1659 förlorade det
    sin ledande ställning till Frankrike.

portugal-fritt-1640:
  period: 1640
  label: "Portugal fritt 1640"
  title: "Portugal blir fritt från Spanien 1640"
  wiki:
    - "en:Portuguese Restoration War"
    - "sv:Iberiska unionen"
  text: |
    1580 dog Portugals kung utan arvingar, och Spaniens kung [Filip II tog
    över tronen](#personalunion-med-portugal-1580). Under 60 år hade de
    två länderna samme kung (**Iberiska unionen**), men Portugal behöll
    egna lagar. Med tiden blev portugiserna missnöjda: Spaniens fiender,
    främst [holländarna](#hollandare-i-nordostra-brasilien), angrep
    Portugals kolonier i Brasilien, Afrika och Asien, och Spanien krävde
    allt mer skatter och soldater till sina krig.

    I december 1640, samtidigt som Spanien kämpade med ett uppror i
    Katalonien ([se nästa punkt](#katalanskt-uppror)), stormade en grupp
    portugisiska adelsmän palatset i Lissabon. Hertigen av Braganza
    utropades till kung **Johan IV**. Spanien erkände inte detta, och ett
    krig följde som varade till 1668.

    För att klara sig sökte Portugal allierade, framför allt England. När
    Karl II av England 1662 gifte sig med den portugisiska prinsessan
    Katarina fick England i hemgift Bombay (dagens Mumbai) och Tanger –
    Bombay blev senare ett centrum för Brittiska Indien. Alliansen mellan
    Portugal och England bestod i århundraden. Braganza-ätten styrde
    Portugal till 1910 och Brasilien som kejsardöme till 1889.

katalanskt-uppror:
  period: 1640
  label: "katalanskt uppror"
  title: "Katalanska upproret 1640"
  wiki:
    - "en:Reapers' War"
  text: |
    **Katalonien** i nordöstra Spanien, med Barcelona, hade egna lagar och
    ett eget parlament inom den spanska monarkin. Kungens förste minister,
    greven-hertigen av **[Olivares](#olivares-nedgang)**, ville att alla
    delar av riket skulle bidra lika mycket med soldater och pengar till
    Spaniens ändlösa krig, särskilt mot Frankrike.

    När spanska trupper inkvarterades i Katalonien och plundrade började
    bönder resa sig. I juni 1640 tågade skördearbetare in i Barcelona och
    dödade vicekungen – händelsen kallas ”Blodets Corpus” och sjungs om i
    Kataloniens nationalsång Els Segadors (”Skördemännen”). Katalanerna
    ställde sig sedan under Frankrikes kung.

    Upproret pågick till 1652, då Barcelona föll efter en lång belägring.
    Katalonien fick behålla sina särskilda rättigheter men förlorade 1659
    norra delen, Roussillon, till Frankrike. Upproret visar hur
    överansträngd den spanska stormakten var – samma år, 1640, [bröt sig
    Portugal loss](#portugal-fritt-1640). Konflikten om Kataloniens
    självstyre har följt Spanien ända till
    självständighetsomröstningen 2017.

karl-ii-svag:
  period: 1660
  label: "Karl II svag"
  title: "Karl II av Spanien – den svage kungen"
  wiki:
    - "sv:Karl II av Spanien"
    - "sv:Spanska tronföljdskriget"
  text: |
    **Karl II** (kung av Spanien 1665–1700) var den siste av den spanska
    grenen av **[Habsburgarna](#karl-v-habsburg-1516)**, den släkt som
    styrt både Spanien och det tysk-romerska riket. För att hålla makten
    inom släkten hade Habsburgarna gift sig med kusiner, syskonbarn och
    farbröder i generationer. Karls föräldrar var farbror och syskonbarn.

    Han hade svåra fysiska och sannolikt även kognitiva
    funktionsnedsättningar: han lärde sig gå och tala sent, hade en så
    framskjuten underkäke (”Habsburgkäken”) att han hade svårt att tugga,
    och var ofta sjuk. Samtiden kallade honom ”El Hechizado”, den
    förtrollade, och man försökte driva ut demoner ur honom. Han fick inga
    barn trots två äktenskap.

    Under hans regering fortsatte Spaniens nedgång: statsbankrutter,
    [förlust av Portugal](#portugal-fritt-1640) (erkänt 1668) och områden
    till Frankrike. Den stora frågan blev vem som skulle ärva världsriket
    med kolonier i Amerika och Asien. När han dog 1700 hade han utsett
    [Ludvig XIV](#ludvig-xiv-1643):s sonson, vilket utlöste **[spanska
    tronföljdskriget](#spanska-tronfoljdskriget)** (1701–1714) – ett
    europeiskt storkrig om maktbalansen.

spanska-tronfoljden-hotar:
  period: 1680
  label: "Spanska tronföljden hotar"
  title: "Spanska tronföljden hotar"
  wiki:
    - "sv:Karl II av Spanien"
    - "sv:Spanska tronföljdskriget"
  text: |
    Spaniens kung **[Karl II](#karl-ii-svag)** (regerade 1665–1700) var
    sjuklig och barnlös, troligen delvis en följd av generationer av
    kusingiften inom den habsburgska ätten. Alla i Europa visste att han
    skulle dö utan arvinge, och frågan var vem som då skulle ärva
    världsriket: Spanien, södra Italien, Spanska Nederländerna (ungefär
    dagens Belgien) och stora kolonier i Amerika och Filippinerna.

    Två släkter hade arvsanspråk: de franska Bourbonerna ([Ludvig
    XIV](#ludvig-xiv-1643)) och de österrikiska Habsburgarna. Om någon av
    dem fick allt skulle maktbalansen i Europa rubbas helt. Diplomater
    försökte under 1690-talet förhandla fram delningsplaner.

    När Karl II dog 1700 testamenterade han allt till Ludvig XIV:s sonson
    Filip. Det ledde till [spanska
    tronföljdskriget](#spanska-tronfoljdskriget) 1701–1714 (se det), som
    slutade med att Filip fick Spanien men Bourbonerna lovade att aldrig
    förena Frankrike och Spanien.

bourbon-spanien:
  period: 1700
  label: "Bourbon-Spanien"
  title: "Spanien under Bourbonerna"
  wiki:
    - "sv:Filip V av Spanien"
    - "en:Nueva Planta decrees"
  text: |
    Efter att den spanska grenen av Habsburgarna dött ut med [Karl II
    1700](#karl-ii-svag) tog den franska släkten **Bourbon** över Spanien.
    Den förste var **Filip V** (kung 1700–1746), sonson till Ludvig XIV.
    Han fick behålla tronen efter [spanska
    tronföljdskriget](#spanska-tronfoljdskriget) (se det), men förlorade
    Spaniens besittningar i Europa utanför Spanien: Nederländerna, Milano,
    Neapel och Sicilien.

    Bourbonerna införde franskinspirerad centralisering. Genom de så
    kallade Nueva Planta-dekreten 1707–1716 avskaffades de särskilda
    lagarna och självstyret i Aragonien, Valencia och Katalonien, som
    stött motståndaren. Kastiliansk lag och kastilianska blev norm. Under
    1700-talet följde reformer av förvaltning, flotta och kolonihandel.

    Bourbonerna sitter än idag på Spaniens tron: kung Felipe VI är en
    ättling. Katalonien firar sin nationaldag 11 september till minne av
    att Barcelona föll till Filips trupper 1714 – en direkt rot till
    dagens katalanska självständighetsrörelse.

gibraltar-brittiskt-1713:
  period: 1700
  label: "Gibraltar brittiskt 1713"
  title: "Gibraltar blir brittiskt 1713"
  wiki:
    - "sv:Gibraltar"
  text: |
    **Gibraltar** är en klippa på knappt 7 km² på Spaniens sydspets, vid
    sundet mellan Medelhavet och Atlanten. Sundet är bara cirka 14 km
    brett, så den som har en flottbas där kontrollerar sjövägen in i
    Medelhavet.

    En engelsk-holländsk flotta erövrade Gibraltar 1704 under [spanska
    tronföljdskriget](#spanska-tronfoljdskriget). I [Utrechtfreden
    1713](#utrechtfreden-1713) (se den) avträdde Spanien det formellt "för
    alltid" till Storbritannien, tillsammans med ön Menorca (som senare
    återlämnades). Spanien försökte flera gånger ta tillbaka det, bland
    annat i den stora belägringen 1779–1783 som varade nästan fyra år.

    Gibraltar blev en av hörnstenarna i det brittiska imperiets sjöväg
    till Indien, särskilt efter Suezkanalen 1869, och en viktig bas i båda
    världskrigen. Det är fortfarande ett brittiskt territorium med cirka
    34 000 invånare, som i folkomröstningar (senast 2002) nästan enhälligt
    röstat för att förbli brittiska. Spanien gör fortfarande anspråk på
    området.

jesuiter-utvisas-1767:
  period: 1760
  label: "Jesuiter utvisas 1767"
  title: "Jesuiterna utvisas ur Spanien 1767"
  wiki:
    - "en:Suppression of the Society of Jesus"
    - "sv:Jesuitorden"
  text: |
    **[Jesuitorden](#tridentinska-motet-jesuiter)** är en katolsk orden
    grundad 1540 av Ignatius av Loyola. Den var
    [motreformationens](#motreformation) elitstyrka: den drev Europas
    bästa skolor, var biktfäder åt kungar och missionerade från Japan till
    Paraguay. I Sydamerika styrde jesuiterna stora missionsbyar,
    *reducciones*, med över 100 000 guaraní-indianer.

    På 1700-talet vände sig de katolska kungarna mot orden. De såg den som
    en stat i staten, lojal mot påven snarare än mot kronan, och
    upplysningens tänkare såg den som ett hinder för förnuftet. Portugal
    utvisade jesuiterna 1759, Frankrike förbjöd dem 1764 och Spaniens kung
    Karl III utvisade dem 1767 – i en samordnad aktion över natten i hela
    Spanien och dess kolonier. Flera tusen jesuiter skeppades till
    Kyrkostaten i Italien.

    Under tryck från kungarna upplöste påven Clemens XIV hela orden 1773.
    Den återupprättades 1814. Händelsen visar hur de upplysta
    envåldshärskarna stärkte staten på kyrkans bekostnad. Den förste
    jesuiten som blev påve var Franciskus 2013.

napoleon-i-spanien-1808:
  period: 1800
  label: "Napoleon i Spanien 1808"
  title: "Napoleon i Spanien 1808"
  wiki:
    - "en:Peninsular War"
    - "en:Joseph Bonaparte"
  text: |
    [Napoleon](#napoleon) ville stänga hela Europas hamnar för brittiska
    varor (kontinentalsystemet). Portugal, Storbritanniens gamle
    allierade, vägrade, och 1807 marscherade franska trupper genom Spanien
    och tog Lissabon. Den portugisiska kungafamiljen flydde till
    Brasilien, som därmed blev imperiets centrum.

    Spanien var formellt Frankrikes allierade men styrdes svagt av Karl IV
    och var söndrat av en konflikt med sonen Ferdinand. 1808 lockade
    Napoleon båda till Bayonne i Frankrike, tvingade dem abdikera och
    gjorde sin bror **Joseph Bonaparte** till kung av Spanien. Den 2 maj
    1808 gjorde folket i Madrid uppror; det slogs ned och upprorsmakare
    arkebuserades, en händelse som Francisco Goya målade i *Den tredje maj
    1808*.

    Det blev början på **spansk-portugisiska kriget** 1808–1814, där
    [spanska gerillor](#gerillakrig) och en brittisk armé under Wellington
    band upp uppemot 300 000 franska soldater. Napoleon kallade det sitt
    ”spanska sår”. Frånvaron av kung i Madrid gav dessutom kolonierna i
    Latinamerika anledning att styra sig själva, vilket ledde till [deras
    självständighet 1810–1825](#mexiko-brasilien-peru-fria).

gerillakrig:
  period: 1800
  label: "gerillakrig"
  title: "Gerillakriget i Spanien 1808–1814"
  wiki:
    - "sv:Gerillakrigföring"
    - "en:Peninsular War"
  text: |
    Ordet **gerilla** är spanska och betyder ”litet krig”. Det fick sin
    moderna betydelse under det spanska motståndet mot [Napoleons
    ockupation 1808–1814](#napoleon-i-spanien-1808): små, rörliga grupper
    av civila, bönder, präster och avhoppade soldater som överföll
    konvojer, budbärare och isolerade förläggningar i stället för att möta
    fienden i öppen strid.

    Gerillan kunde inte besegra fransmännen på egen hand, men den tvingade
    dem att sprida ut sina styrkor. En budbärare behövde ofta en eskort på
    hundratals man. Samtidigt kunde en reguljär brittisk-portugisisk armé
    under Wellington slå franska huvudstyrkor. Kriget var extremt grymt på
    båda sidor, med avrättningar av fångar och repressalier mot byar;
    Goyas etsningar *Krigets fasor* visar detta. Uppskattningsvis flera
    hundratusen spanjorer dog, de flesta civila.

    Spanien blev förebild för senare gerillakrig: i [Latinamerikas
    frihetskrig](#mexiko-brasilien-peru-fria), i Mao Zedongs kinesiska
    revolution, i Vietnam och Afghanistan. Grundprincipen – en svagare
    part undviker avgörande slag och nöter ner en starkare ockupant – är
    densamma.

latinamerika-forloras:
  period: 1820
  label: "Latinamerika förloras"
  title: "Spanien och Portugal förlorar Latinamerika 1808–1826"
  wiki:
    - "en:Spanish American wars of independence"
    - "en:Independence of Brazil"
  text: |
    Under 300 år hade Spanien styrt ett kolonialvälde från Kalifornien
    till Kap Horn, och Portugal styrde Brasilien. Silver från gruvorna i
    [Potosí](#potosi-varldens-storsta-silvergruva) och Mexiko hade
    finansierat det spanska imperiet.

    Utlösaren var [Napoleons invasion av Iberiska halvön
    1807–1808](#napoleon-i-spanien-1808). Spaniens kung avsattes och
    ersattes med Napoleons bror, och kolonierna stod utan legitim ledning.
    Lokala eliter av kreoler (spanjorer födda i Amerika) bildade egna
    styren, och efter krig ledda av bl.a. [Simón Bolívar](#bolivar) och
    José de San Martín var hela fastlandet självständigt 1826. Bara Kuba
    och Puerto Rico förblev spanska (till 1898). Portugals kungafamilj
    hade flytt till Rio de Janeiro 1808; när kungen återvände till
    Lissabon utropade kronprinsen Pedro 1822 [Brasilien till självständigt
    kejsardöme](#mexiko-brasilien-peru-fria).

    För Spanien innebar förlusten slutet som stormakt och en lång period
    av inbördeskrig och politisk instabilitet under 1800-talet.
    Utvecklingen kan jämföras med Storbritannien, som just då förlorat USA
    men byggde ut ett nytt imperium i Asien och Afrika.

revolution-1868:
  period: 1860
  label: "Revolution 1868"
  title: "Septemberrevolutionen i Spanien 1868"
  wiki:
    - "en:Glorious Revolution (Spain)"
    - "en:Sexenio Democrático"
  text: |
    Spanien under 1800-talet präglades av ständiga konflikter mellan
    liberaler och konservativa, inbördeskrig om tronföljden
    (carlistkrigen) och militärkupper (*pronunciamientos*). Drottning
    **Isabella II** (regerade 1833–1868) var impopulär på grund av
    korruption, godtycklighet och skandaler vid hovet, och en ekonomisk
    kris 1866 förvärrade läget.

    I september 1868 gjorde flottan och delar av armén uppror under
    generalerna Juan Prim och Francisco Serrano, med stöd av liberaler och
    demokrater. Regeringstrupperna besegrades, och Isabella flydde till
    Frankrike. Revolutionen kallas *La Gloriosa* (”den ärorika”).

    Följde sex år av experiment, kallade **sexenio democrático**: allmän
    rösträtt för män, en liberal författning 1869 och en ny kung,
    italienaren Amadeus av Savojen, som abdikerade 1873. Sökandet efter en
    kung fick även internationella följder – att en preussisk prins
    erbjöds kronan blev utlösande orsak till [fransk-tyska kriget
    1870](#fransk-tyska-kriget-1870). Den första spanska republiken
    1873–1874 var kaotisk, och 1874 återinsattes Bourbonsläkten med
    Isabellas son Alfons XII.

spansk-amerikanska-kriget-1898-kuba:
  period: 1880
  label: "Spansk-amerikanska kriget 1898: Kuba, Filippinerna förloras"
  title: "Spansk-amerikanska kriget 1898"
  wiki:
    - "sv:Spansk-amerikanska kriget"
    - "en:Spanish–American War"
  text: |
    Spanien hade [förlorat nästan hela sitt amerikanska imperium på
    1820-talet](#latinamerika-forloras), men behöll **Kuba**, **Puerto
    Rico** och **Filippinerna**. På Kuba pågick sedan 1895 ett
    självständighetskrig som Spanien slog ner hårt.

    När det amerikanska slagskeppet *Maine* sprängdes i Havannas hamn i
    februari 1898 (orsaken är omstridd; troligen en olycka) piskade
    amerikanska sensationstidningar upp krigsstämning. Kriget varade bara
    drygt tre månader. USA:s flotta förintade två spanska eskadrar, i
    Manila och vid Santiago på Kuba, med mycket få egna förluster. Totalt
    dog ca 3 000 amerikaner, de flesta av sjukdom.

    Spanien förlorade sina sista kolonier: Kuba blev formellt
    självständigt men under amerikansk kontroll, och USA tog Puerto Rico,
    Guam och Filippinerna (för 20 miljoner dollar). USA blev därmed en
    kolonialmakt. I Spanien blev ”katastrofen 1898” en nationell kris. Se
    även ”[Filippinska revolutionen
    1896](#filippinska-revolutionen-1896)”.

neutralt-i-kriget:
  period: 1900
  label: "Neutralt i kriget"
  title: "Spanien och Portugal under första världskriget"
  wiki:
    - "en:Spain in World War I"
    - "en:Portugal in World War I"
  text: |
    När [första världskriget](#forsta-varldskriget) bröt ut 1914
    förklarade sig **Spanien**, en monarki under kung Alfonso XIII,
    neutralt och höll fast vid det hela kriget. Landet var för svagt
    militärt efter [förlusten 1898](#spansk-amerikanska-kriget-1898-kuba)
    och splittrat mellan sympatier för Tyskland (armén, kyrkan) och för
    ententen (liberaler).

    Neutraliteten gav en ekonomisk boom: Spanien sålde livsmedel,
    textilier och metaller till båda sidor. Men vinsterna hamnade hos ett
    fåtal medan priserna steg, vilket ledde till generalstrejken 1917 och
    sociala konflikter som pekar fram mot [spanska inbördeskriget
    1936–39](#spanska-inbordeskriget-193639-franco). [Spanska sjukan
    1918](#spanska-sjukan-1918-50-milj-doda) fick sitt namn för att spansk
    press – utan krigscensur – skrev öppet om den.

    **Portugal**, en republik sedan 1910, var däremot inte neutralt hela
    kriget: för att skydda sina afrikanska kolonier gick landet med på
    ententens sida 1916 och skickade ca 55 000 soldater till västfronten.
    Jämför med Sverige, Norge, Danmark, Nederländerna och Schweiz, som
    förblev neutrala.

spanska-inbordeskriget-193639-franco:
  period: 1920
  label: "Spanska inbördeskriget 1936–39, Franco"
  title: "Spanska inbördeskriget 1936–39"
  wiki:
    - "sv:Spanska inbördeskriget"
    - "sv:Francisco Franco"
  text: |
    1931 blev Spanien republik efter att kungen gått i exil. Landet var
    djupt splittrat mellan vänster (arbetare, jordlösa lantarbetare,
    regionala rörelser i Katalonien och Baskien) och höger (kyrkan,
    godsägare, armén). När vänsterns folkfront vann valet i februari 1936
    gjorde delar av armén uppror i juli.

    Upprorsmakarnas ledare blev generalen **Francisco Franco**. Kriget
    blev en internationell generalrepetition: Hitler och Mussolini
    skickade trupper, flyg och vapen till Franco, medan Sovjetunionen
    hjälpte republiken. Omkring 35 000 frivilliga från ett femtiotal
    länder, bland dem omkring 500 svenskar, kämpade i internationella
    brigader. Tyska flygets bombning av staden Guernica 1937 förevigades
    av Picasso.

    Franco vann 1939. Uppskattningsvis 500 000 dog i kriget, och
    tiotusentals avrättades efteråt. Franco styrde som diktator [till sin
    död 1975](#franco-dor-1975) (se [Franco på 1940-talet](#franco)).
    Kriget visade också vilka vapen och metoder som skulle användas i
    [andra världskriget](#andra-varldskriget), som började fem månader
    senare.

franco:
  period: 1940
  label: "Franco"
  title: "Francos Spanien"
  wiki:
    - "sv:Francisco Franco"
    - "en:Francoist Spain"
  text: |
    **Francisco Franco** (1892–1975) var den general som vann [spanska
    inbördeskriget](#spanska-inbordeskriget-193639-franco) 1939 och
    därefter styrde Spanien som diktator i 36 år, med titeln Caudillo
    (ledare). Hans regim byggde på armén, katolska kyrkan och ett enda
    tillåtet parti, Falangen.

    Trots hjälpen från Hitler och Mussolini höll Franco Spanien formellt
    utanför [andra världskriget](#andra-varldskriget); vid ett möte med
    Hitler 1940 ställde han för höga krav. Han skickade dock frivilliga,
    Blå divisionen, att strida mot Sovjet. Efter kriget var Spanien
    isolerat och fattigt. Förtrycket var hårt: uppskattningsvis
    tiotusentals avrättades efter inbördeskriget, katalanska och baskiska
    språk undertrycktes.

    Under kalla kriget blev Franco acceptabel för väst som antikommunist;
    1953 fick USA militärbaser i Spanien. På 1960-talet växte ekonomin
    snabbt genom turism. Franco utsåg **Juan Carlos** till efterträdare,
    och efter [Francos död 1975](#franco-dor-1975) ledde kungen en
    övergång till demokrati. Jämför med Portugal, där diktaturen föll i
    [nejlikerevolutionen 1974](#nejlikerevolutionen-i-portugal-1974).

franco-dor-1975:
  period: 1960
  label: "Franco dör 1975"
  title: "Franco dör 1975"
  wiki:
    - "sv:Francisco Franco"
    - "en:Spanish transition to democracy"
  text: |
    **Francisco Franco** var den general som vann [spanska inbördeskriget
    1936–39](#spanska-inbordeskriget-193639-franco) mot den vänsterledda
    republiken, med hjälp av Hitler och Mussolini. Kriget och
    förföljelserna efteråt kostade uppskattningsvis 500 000 liv. Franco
    styrde sedan Spanien som diktator i 36 år: en katolsk, nationalistisk
    och auktoritär regim med censur, förbjudna partier och förtryck av
    regionala språk som katalanska och baskiska.

    Spanien höll sig formellt neutralt i [andra
    världskriget](#andra-varldskriget) och var efteråt isolerat. Under
    kalla kriget blev Franco ändå accepterad som antikommunist; USA fick
    militärbaser 1953. På 1960-talet följde en snabb ekonomisk tillväxt,
    ”det spanska undret”, delvis tack vare massturismen – det var då
    svenska charterresor till Spanien tog fart.

    Franco hade utsett **Juan Carlos**, barnbarn till den siste kungen,
    till efterträdare. När Franco dog den 20 november 1975 förväntades
    Juan Carlos fortsätta diktaturen, men han ledde i stället en fredlig
    övergång till demokrati: fria val 1977 och en ny författning 1978. Ett
    kuppförsök 1981 stoppades av kungen i ett tv-tal. Spanien gick med i
    EG 1986 (se [Demokrati, EG 1986](#demokrati-eg-1986)). Jämför med
    [nejlikerevolutionen](#nejlikerevolutionen-i-portugal-1974) i
    grannlandet Portugal året innan.

nejlikerevolutionen-i-portugal-1974:
  period: 1960
  label: "nejlikerevolutionen i Portugal 1974"
  title: "Nejlikerevolutionen i Portugal 1974"
  wiki:
    - "sv:Nejlikerevolutionen"
    - "en:Portuguese Colonial War"
  text: |
    Portugal var en diktatur sedan 1926, under Antonio Salazar 1932–68 och
    därefter Marcelo Caetano. Regimen, kallad **Estado Novo** (”den nya
    staten”), hade hemlig polis och censur. Portugal var Europas
    fattigaste land men höll fast vid sitt kolonialvälde i Afrika: Angola,
    Moçambique och Guinea-Bissau. Där pågick sedan 1961 befrielsekrig.
    Kring 40 procent av statsbudgeten gick till krigsmakten och
    värnplikten var upp till fyra år.

    Den 25 april 1974 gjorde unga officerare, trötta på de meningslösa
    kolonialkrigen, en kupp. Signalen var att en förbjuden protestsång,
    ”Grândola, Vila Morena”, spelades på radio. Folk strömmade ut på
    gatorna och satte röda nejlikor i soldaternas gevärspipor. Bara ett
    fåtal dödades.

    Inom ett år blev kolonierna självständiga, och omkring en halv miljon
    portugiser från kolonierna flyttade hem. I Angola och Moçambique
    följde dock långa inbördeskrig. Efter en orolig period med risk för en
    kommunistisk maktövertagning blev Portugal demokrati med en ny
    författning 1976 och [gick med i EG 1986](#demokrati-eg-1986).
    Nejlikerevolutionen inledde en våg av demokratiseringar: Grekland
    1974, [Spanien efter Franco 1975](#franco-dor-1975) (se det), och
    senare Latinamerika och Östeuropa.

demokrati-eg-1986:
  period: 1980
  label: "Demokrati, EG 1986"
  title: "Spanien och Portugal: demokrati och EG 1986"
  wiki:
    - "en:1986 enlargement of the European Communities"
    - "en:Spanish transition to democracy"
  text: |
    Både Spanien och Portugal var diktaturer långt in på 1970-talet:
    Portugal till [nejlikerevolutionen
    1974](#nejlikerevolutionen-i-portugal-1974) och Spanien till [Francos
    död 1975](#franco-dor-1975) (se dessa). Båda genomförde sedan
    övergångar till demokrati med nya författningar 1976 respektive 1978.
    Spanien gav dessutom regioner som Katalonien och Baskien eget
    självstyre. Ett militärt kuppförsök i det spanska parlamentet den 23
    februari 1981 misslyckades när kung Juan Carlos i tv tog ställning för
    demokratin.

    Den 1 januari 1986 gick båda länderna med i EG (föregångaren till EU,
    se [EG 1973](#eg-1973)). Medlemskapet sågs som en garanti för att
    demokratin skulle bestå, och det gav tillgång till en stor marknad och
    stora stöd från EG:s regional- och jordbruksfonder till vägar,
    flygplatser och infrastruktur. Grekland, som också lämnat
    militärdiktatur 1974, hade gått med 1981.

    Spanien moderniserades snabbt: OS i Barcelona och världsutställningen
    i Sevilla 1992 och Spaniens första snabbtåg samma år symboliserade
    det. Spanien gick med i Nato 1982. EG-utvidgningen söderut blev en
    förebild för utvidgningen österut 2004, där också EU-medlemskap
    användes som ett sätt att befästa demokrati efter diktatur.

madridbomberna-2004:
  period: 2000
  label: "Madridbomberna 2004"
  title: "Terrorattentaten i Madrid 11 mars 2004"
  wiki:
    - "sv:Terrorattentaten i Madrid 2004"
    - "en:2004 Madrid train bombings"
  text: |
    Morgonen den 11 mars 2004 exploderade tio bomber på fyra pendeltåg på
    väg in till Madrid under rusningstrafik. 193 människor dödades och
    omkring 2 000 skadades. Det är det dödligaste terrordådet i Europa
    sedan Lockerbiebombningen 1988. Bomberna var dolda i ryggsäckar och
    utlöstes med mobiltelefoner.

    Gärningsmännen var en grupp islamistiska extremister, främst från
    Marocko, inspirerade av terrornätverket **al-Qaida**, som låg bakom
    [11 september 2001](#september-2001-11). Motivet kopplades till att
    Spanien deltog i [Irakkriget](#irakkriget). Spaniens konservativa
    regering under José María Aznar skyllde först på den baskiska
    separatistgruppen **ETA**, som i decennier utfört attentat för ett
    självständigt Baskien.

    Attentatet skedde tre dagar före parlamentsvalet. Många väljare
    uppfattade regeringens ETA-förklaring som ett försök att dölja
    kopplingen till Irak, och socialisten José Luis Rodríguez Zapatero
    vann oväntat. Han drog snabbt hem de spanska trupperna från Irak.
    Händelsen visade att terror kan påverka val i en demokrati. Ett år
    senare, juli 2005, slog liknande attentat till mot Londons
    kollektivtrafik (52 döda).
