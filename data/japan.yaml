# Japan
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

heian-tiden-fujiwara-no-michinaga:
  period: 1000
  label: "Heian-tiden, Fujiwara no Michinaga"
  title: "Heiantiden och Fujiwara no Michinaga"
  wiki:
    - "sv:Heianperioden"
    - "en:Fujiwara no Michinaga"
  text: |
    **Heiantiden** (794–1185) är perioden då Japans huvudstad var
    Heian-kyō, dagens **Kyoto**. Staden byggdes enligt kinesisk förebild
    med rutnätsgator och hade kanske 100 000 invånare. Det var en tid av
    fred och förfinad hovkultur, där poesi, kalligrafi och klädfärger var
    viktigare än krig.

    Formellt styrde kejsaren, men i praktiken hade släkten
    **[Fujiwara](#fujiwara-valdet)** makten. Deras metod: gifta in sina
    döttrar med kejsarna, och sedan styra som regenter åt de unga kejsare
    som var deras barnbarn. **Fujiwara no Michinaga** (966–1028) drev det
    längst – fyra av hans döttrar blev kejsarinnor, och han var morfar
    till tre kejsare. Han skrev en berömd dikt där han jämför sig med
    fullmånen som ”inte saknar något”.

    Mönstret – en skenmakt hos kejsaren medan någon annan styr – blev
    bestående i Japan. Från 1185 tog krigaradeln, **samurajerna**, över
    makten genom shoguner (militära härskare), och kejsaren förblev en
    symbolisk figur ända till 1868. Under Michinaga levde också Murasaki
    Shikibu, som skrev [Genji
    monogatari](#genji-monogatari-murasaki-shikibu) vid hans dotters hov.

genji-monogatari-murasaki-shikibu:
  period: 1000
  label: "Genji monogatari (Murasaki Shikibu)"
  title: "Genji monogatari – Berättelsen om Genji"
  wiki:
    - "sv:Genji monogatari"
    - "sv:Murasaki Shikibu"
  text: |
    **Genji monogatari** (”Berättelsen om Genji”) skrevs i början av
    1000-talet, uppskattningsvis 1000–1012, av **Murasaki Shikibu**, en
    hovdam hos kejsarinnan Shōshi, dotter till [Fujiwara no
    Michinaga](#heian-tiden-fujiwara-no-michinaga). ”Murasaki Shikibu” är
    ett smeknamn; hennes riktiga namn är okänt.

    Boken handlar om prins Genji, en vacker och begåvad kejsarson utan
    rätt till tronen, och hans kärleksaffärer och liv vid hovet i Kyoto.
    Den omfattar 54 kapitel, över 1 000 sidor i översättning, och nära 400
    personer. Fokus ligger på känslor, relationer och förgänglighet
    snarare än handling – det japanska begreppet *mono no aware*, en
    vemodig känsla för att allt vackert är tillfälligt.

    Den kallas ofta världens första roman, alltså en lång prosaberättelse
    med psykologiskt utvecklade personer. Det är en definitionsfråga, men
    verket är 600 år äldre än [Don Quijote
    (1605)](#cervantes-don-quijote-1605). Intressant nog skrevs den på
    japanska med kana-skrift, som främst användes av kvinnor, medan männen
    skrev på kinesiska – lärdomens språk. Därför skrevs mycket av den
    tidens stora japanska litteratur av kvinnor. Jämför
    [Shahnameh](#firdausi-shahnameh-1010) i Persien, skriven samtidigt på
    folkspråk.

fujiwara-valdet:
  period: 1020
  label: "Fujiwara-väldet"
  title: "Fujiwaraklanens välde i Japan"
  wiki:
    - "en:Fujiwara clan"
    - "sv:Heianperioden"
  text: |
    **Fujiwara** var en adelssläkt som i praktiken styrde Japan från
    800-talet till slutet av 1000-talet, under **Heianperioden**
    (794–1185, uppkallad efter huvudstaden Heian-kyō, dagens Kyoto).
    Kejsaren var formellt härskare men hade sällan verklig makt.

    Metoden var giftermål: Fujiwara-döttrar gifte sig med kejsare, och
    deras söner blev kejsare som barn. Fujiwara-ledaren styrde då som
    regent åt sitt eget barnbarn. Höjdpunkten var **[Fujiwara no
    Michinaga](#heian-tiden-fujiwara-no-michinaga)** (966–1028), som var
    far till fyra kejsarinnor och morfar till tre kejsare.

    Varför det spelar roll: mönstret – en symbolisk kejsare och en verklig
    makthavare bakom – blev ett kännetecken för Japans historia. Senare
    tog krigaradeln, samurajerna, och deras militärledare ([shogunerna,
    från 1192](#kamakura-shogunatet-1192)) över samma roll. Kejsaren
    behöll sin symboliska ställning ända till i dag.

hovkultur:
  period: 1020
  label: "hovkultur"
  title: "Hovkulturen i Heian-Japan"
  wiki:
    - "sv:Heianperioden"
    - "sv:Genji monogatari"
  text: |
    Under **Heianperioden** (794–1185) utvecklades vid kejsarhovet i Kyoto
    en förfinad aristokratisk kultur. Några tusen adelspersoner levde ett
    liv med poesitävlingar, kalligrafi (skönskrift), doftjämförelser och
    sträng etikett. Klädsel i rätt färgkombination för årstiden var
    viktigt.

    Kvinnor vid hovet skrev med *kana*, ett nytt fonetiskt skriftsystem
    för japanska, medan män skrev på kinesiska. Därför är många av
    periodens stora verk skrivna av kvinnor. Det mest kända är **[Genji
    monogatari](#genji-monogatari-murasaki-shikibu)** ("Berättelsen om
    Genji", cirka 1010) av hovdamen Murasaki Shikibu – ofta kallad
    världens första roman. Ett annat är Sei Shōnagons *Kuddboken*, en
    sorts dagbok med listor och betraktelser.

    Varför det spelar roll: hovkulturen formade japansk estetik in i
    modern tid. Samtidigt var adeln ointresserad av landsbygden och
    militären, vilket lämnade utrymme åt krigarklassen (samurajerna) att
    ta över makten på 1100-talet.

byodo-in-1052:
  period: 1040
  label: "Byōdō-in 1052"
  title: "Byōdō-in-templet 1052"
  wiki:
    - "en:Byōdō-in"
    - "en:Pure Land Buddhism"
  text: |
    **Byōdō-in** är ett buddhistiskt tempel i Uji, söder om Kyoto. Det
    började som villa åt [Fujiwara no
    Michinaga](#heian-tiden-fujiwara-no-michinaga), den mäktigaste mannen
    i Japan (se [Fujiwara-väldet](#fujiwara-valdet)). Hans son Yorimichi
    gjorde om det till tempel 1052, och 1053 byggdes den berömda
    **Fenixhallen**.

    1052 ansågs vara början på *mappō*, "lagens sista tid" – en
    buddhistisk tro att läran förfaller och att människor inte längre kan
    nå frälsning av egen kraft. Därför växte **Rena landets buddhism**:
    tron att man genom att åkalla buddhan Amida kan återfödas i hans
    paradis, "det rena landet". Fenixhallen, med en förgylld Amidastaty
    och speglad i en damm, ska föreställa just detta paradis på jorden.

    Varför det spelar roll: byggnaden är en av få bevarade träbyggnader
    från Heianperioden och är världsarv. Fenixhallen finns avbildad på det
    japanska 10-yensmyntet. Rena landets buddhism blev senare (från
    1200-talet) Japans största buddhistiska riktning.

zenkunen-kriget-1051:
  period: 1040
  label: "Zenkunen-kriget 1051"
  title: "Zenkunen-kriget 1051–1062"
  wiki:
    - "en:Former Nine Years' War"
    - "en:Minamoto clan"
  text: |
    **Zenkunen-kriget** ("det tidigare nioårskriget") utkämpades i Mutsu,
    Japans nordöstra gränsland långt från huvudstaden Kyoto. Där hade
    släkten **Abe**, lokala stormän, blivit så mäktiga att de slutat
    betala skatt och lyda hovets guvernörer.

    Hovet i Kyoto hade ingen egen armé att tala om. Därför skickades
    **Minamoto no Yoriyoshi** och hans son Yoshiie, ledare för
    krigarsläkten Minamoto, med sina egna krigare. Kriget varade i
    praktiken tolv år (1051–1062), trots namnet. Minamoto vann till slut
    med hjälp av en annan lokal släkt, Kiyohara. Arméerna var små,
    troligen några tusen man.

    Varför det spelar roll: kriget visade att den verkliga militära makten
    nu låg hos krigarsläkter – **samurajerna** – snarare än hos hovet.
    Minamoto byggde upp lojalitet bland krigare i östra Japan. Ett drygt
    sekel senare tog Minamoto no Yoritomo makten och blev Japans [förste
    shogun (1192)](#kamakura-shogunatet-1192), militär diktator, ett
    system som varade till 1868.

go-sanjo-begransar-fujiwara:
  period: 1060
  label: "Go-Sanjō begränsar Fujiwara"
  title: "Kejsar Go-Sanjō utmanar Fujiwara"
  wiki:
    - "en:Emperor Go-Sanjō"
    - "en:Fujiwara clan"
  text: |
    I Heian-tidens Japan (794–1185) hade kejsaren mest ceremoniell makt.
    Det verkliga styret låg i nästan 200 år hos släkten
    **[Fujiwara](#fujiwara-valdet)**, som gifte in sina döttrar med
    kejsarna och sedan styrde som regenter åt sina egna barnbarn – en makt
    byggd på svärfarsrollen.

    **Go-Sanjō** (kejsare 1068–1073) var den förste kejsaren på ungefär
    170 år vars mor inte var en Fujiwara. Han var därför inte beroende av
    dem och kunde agera självständigt. 1069 inrättade han ett kontor som
    granskade **shōen** – stora skattebefriade gods som adel och tempel
    samlat på sig, vilket urholkade statens skattebas. Gods utan giltiga
    papper skulle dras in. Det träffade Fujiwara hårdast, eftersom de ägde
    flest.

    Han abdikerade 1073, kanske med avsikt att fortsätta styra bakom
    kulisserna, men dog redan året därpå. Hans son Shirakawa förverkligade
    idén 1086 genom systemet **insei**, där en avgången kejsare styr (se
    [Insei](#insei-abdikerade-kejsare-styr-1086)). Det var början på
    slutet för Fujiwaras makt och ett steg mot [krigaradelns
    (samurajernas) övertagande på 1180-talet](#genpei-kriget-118085).

insei-abdikerade-kejsare-styr-1086:
  period: 1080
  label: "Insei: abdikerade kejsare styr (1086)"
  title: "Insei – de abdikerade kejsarnas styre"
  wiki:
    - "en:Cloistered rule"
    - "en:Emperor Shirakawa"
  text: |
    I Heian-tidens Japan hade släkten **Fujiwara** i nästan 200 år styrt
    genom att gifta in döttrar med kejsarna och sedan agera regenter (se
    [Go-Sanjō begränsar Fujiwara](#go-sanjo-begransar-fujiwara)). Kejsaren
    själv var bunden av ceremonier och hovets regler.

    1086 abdikerade kejsar **Shirakawa** till förmån för sin åttaårige
    son, men fortsatte att styra från sitt eget palats som ”pensionerad
    kejsare” (jōkō, och efter att ha blivit munk hō-ō). Systemet kallas
    **insei**, ”styre från klostret”. Fördelen var att han slapp
    ritualerna, kunde agera fritt och hade ett eget kansli och egen
    ekonomi, som byggde på de stora skattebefriade godsen (shōen) som han
    nu själv samlade på sig. Fujiwara-regenterna blev åsidosatta.
    Shirakawa dominerade i drygt 40 år, till sin död 1129.

    Systemet ledde till att flera ”kejsare” fanns samtidigt – den sittande
    och en eller flera avgångna – vilket skapade rivalitet. De använde
    krigarsläkterna **[Taira](#taira-och-minamoto-stiger)** och
    **Minamoto** som sin militär. Det gav samurajerna en politisk roll,
    och efter [Genpei-kriget 1180–1185](#genpei-kriget-118085) tog
    krigarna själva makten i form av
    [shogunatet](#kamakura-shogunatet-1192). Kejsaren blev åter en symbol
    – fram till 1868.

insei:
  period: 1100
  label: "Insei"
  title: "Insei under Shirakawa"
  wiki:
    - "en:Cloistered rule"
    - "en:Emperor Shirakawa"
  text: |
    **Insei** (”styre från klostret”) var det japanska system där en
    kejsare abdikerade men fortsatte att styra bakom kulisserna som
    ”pensionerad kejsare”, medan en ung släkting satt formellt på tronen
    och skötte ceremonierna (se [Insei: abdikerade kejsare styr
    1086](#insei-abdikerade-kejsare-styr-1086)).

    Under 1100–1120 var det ex-kejsaren **Shirakawa** (som abdikerat 1086)
    som styrde Japan. Han lät tre kejsare i följd sitta på tronen: sin
    son, sitt barnbarn och sitt barnbarnsbarn. Han sade enligt en berömd
    anekdot att de enda saker han inte kunde kontrollera var floden Kamos
    vatten, tärningarnas fall och munkarna på berget Hiei – de
    buddhistiska klostren hade egna beväpnade munkarmeer som marscherade
    ner till huvudstaden för att pressa hovet.

    För att hålla munkarna och oroligheterna i schack anlitade ex-kejsarna
    krigare från provinserna, främst släkterna
    **[Taira](#taira-och-minamoto-stiger)** och **Minamoto**. Det gjorde
    samurajerna, som dittills varit lokala godsherrars beväpnade män, till
    aktörer i huvudstadens politik. När de rivaliserande ex-kejsarna och
    Fujiwara 1156 drabbade samman ([Hōgen-upproret](#hogen-upproret-1156))
    var det krigarna som avgjorde, och från 1185 styrde de själva Japan.

hiraizumi-fujiwara-i-norr:
  period: 1100
  label: "Hiraizumi-Fujiwara i norr"
  title: "Norra Fujiwara i Hiraizumi (1087–1189)"
  wiki:
    - "en:Northern Fujiwara"
    - "en:Hiraizumi"
    - "en:Chūson-ji"
  text: |
    Japan styrdes formellt från kejsarhovet i Kyoto, men i landets
    nordöstra del (dagens Tōhoku-region, då kallad Mutsu) byggde en
    sidogren av den mäktiga [Fujiwara-släkten](#fujiwara-valdet) upp ett
    nästan självständigt rike. Grundaren **Fujiwara no Kiyohira** tog
    makten efter ett lokalt krig på 1080-talet och gjorde staden
    **Hiraizumi** till sitt centrum.

    Rikedomen kom från guld (norra Japan var landets viktigaste guldkälla)
    och från hästar, som krigarklassen behövde. Hiraizumi blev under
    ungefär hundra år en av Japans största städer efter Kyoto. Det mest
    kända som finns kvar är templet Chūson-ji med *Konjikidō*, en liten
    hall från 1124 helt täckt av bladguld.

    Slutet kom 1189. Under kriget mellan krigarklanerna [Taira och
    Minamoto](#taira-och-minamoto-stiger) ([Genpei-kriget
    1180–85](#genpei-kriget-118085)) gav Fujiwara skydd åt den besegrade
    hjälten Minamoto no Yoshitsune, som hamnat i konflikt med sin bror.
    Brodern **Minamoto no Yoritomo**, som just blivit Japans militära
    härskare, använde det som skäl att krossa Hiraizumi. Därmed samlades
    hela Japan under den nya [krigarregeringen i
    Kamakura](#kamakura-shogunatet-1192). Hiraizumi blev världsarv 2011.

taira-och-minamoto-stiger:
  period: 1120
  label: "Taira och Minamoto stiger"
  title: "Krigarklanerna Taira och Minamoto"
  wiki:
    - "en:Taira clan"
    - "en:Minamoto clan"
    - "sv:Samuraj"
  text: |
    Under Heianperioden (794–1185) styrdes Japan av ett förfinat hov i
    Kyoto, där familjen Fujiwara dominerade genom att gifta in sina
    döttrar i kejsarfamiljen. Hovet hade ingen egen armé av betydelse. I
    provinserna växte i stället en klass av beväpnade godsägare och
    krigare fram – de som senare kallades **samurajer**.

    Två klaner, båda härstammande från avsatta kejsarsöner, blev de
    viktigaste: **Taira** (även kallade Heike), starka i västra Japan och
    kring Inlandshavet, och **Minamoto** (även kallade Genji), starka i
    öst. Hovet använde dem för att bekämpa pirater och upproriska
    provinser, och under 1100-talet blev de allt mer oumbärliga.

    När hovfraktioner började strida om makten (se [Hōgen-upproret
    1156](#hogen-upproret-1156) och [Heiji 1159](#heiji-1159)) var det
    krigarna som avgjorde. Taira-ledaren Taira no Kiyomori blev landets
    mäktigaste man. Men i [Genpei-kriget 1180–85](#genpei-kriget-118085)
    vann Minamoto, och 1192 blev Minamoto no Yoritomo *shogun* – militär
    härskare – i [Kamakura](#kamakura-shogunatet-1192). Därefter styrdes
    Japan av krigare, inte av hovet, i nästan 700 år, fram till
    Meiji-restaurationen 1868. Kampen mellan klanerna skildras i eposet
    *Heike monogatari*, Japans motsvarighet till Iliaden.

hogen-upproret-1156:
  period: 1140
  label: "Hōgen-upproret 1156"
  title: "Hōgen-upproret 1156"
  wiki:
    - "en:Hōgen rebellion"
    - "en:Emperor Go-Shirakawa"
  text: |
    I Japan styrdes landet formellt av kejsaren, men från slutet av
    1000-talet hade abdikerade kejsare ofta den verkliga makten – de
    styrde från ett kloster medan en ung släkting satt på tronen (så
    kallat *[insei](#insei-abdikerade-kejsare-styr-1086)*, klosterstyre).
    Det skapade rivaliteter inom kejsarfamiljen och inom den mäktiga
    hovsläkten Fujiwara.

    När den tidigare kejsaren Toba dog 1156 bröt en strid ut mellan den
    regerande kejsaren **Go-Shirakawa** och hans äldre bror, den
    abdikerade **Sutoku**, som ville få tillbaka makten åt sin linje. Båda
    sidor kallade in krigare från klanerna Taira och Minamoto – och
    splittrade klanerna själva, så att fäder och söner stred på olika
    sidor. Själva striden i Kyoto var kort, en nattlig attack i juli 1156
    med några hundra krigare per sida.

    Go-Shirakawa vann. Sutoku förvisades och flera förlorare avrättades,
    för första gången på över 300 år i Kyoto. Den viktiga följden var att
    det nu var uppenbart att krigarna, inte hovadeln, avgjorde vem som
    hade makten. Tre år senare kom nästa strid (se [Heiji
    1159](#heiji-1159)), och vägen var öppen för krigarklanernas styre (se
    [Taira och Minamoto stiger](#taira-och-minamoto-stiger)).

heiji-1159:
  period: 1140
  label: "Heiji 1159"
  title: "Heiji-upproret 1159"
  wiki:
    - "en:Heiji rebellion"
    - "en:Taira no Kiyomori"
  text: |
    Efter [Hōgen-upproret 1156](#hogen-upproret-1156) (se dit) dominerade
    två krigarklaner hovet i Kyoto: **Taira**, ledd av **Taira no
    Kiyomori**, och **Minamoto**, ledd av Minamoto no Yoshitomo. Båda hade
    stridit på den segrande sidan, men Kiyomori hade belönats bättre, och
    rivaliteten växte.

    I januari 1160 (i japansk kalender slutet av Heiji-perioden 1159)
    passade Yoshitomo och en allierad hovman på när Kiyomori var på
    pilgrimsresa. De tog den abdikerade kejsaren Go-Shirakawa och den unge
    kejsaren till fånga och brände ett palats. Men Kiyomori skyndade
    tillbaka, kejsarna lyckades fly till hans sida, och Minamoto
    besegrades i strider i Kyoto. Yoshitomo mördades under flykten.

    Kiyomori skonade dock Yoshitomos unga söner, däribland 13-årige
    **Yoritomo** och spädbarnet **Yoshitsune**. Det blev ett ödesdigert
    misstag. [Taira dominerade Japan i 20
    år](#taira-no-kiyomori-dominerar); Kiyomori blev den förste krigaren
    som fick högsta ämbetet vid hovet och gifte in sin dotter i
    kejsarfamiljen. Men 1180 gjorde Yoritomo uppror, och i [Genpei-kriget
    1180–85](#genpei-kriget-118085) utplånade Minamoto Taira-klanen.
    Yoritomo blev shogun – militär härskare – och grundade Japans första
    [krigarregering i Kamakura](#kamakura-shogunatet-1192).

taira-no-kiyomori-dominerar:
  period: 1160
  label: "Taira no Kiyomori dominerar"
  title: "Taira no Kiyomori"
  wiki:
    - "sv:Taira no Kiyomori"
    - "en:Taira no Kiyomori"
  text: |
    På 1100-talet styrdes Japan formellt av kejsaren i Kyoto, men den
    verkliga makten låg hos hovfamiljer, främst Fujiwara, och hos
    abdikerade ex-kejsare. Samtidigt växte en ny klass: krigare,
    *samurajer*, som organiserades i stora klaner. De två mäktigaste var
    **Taira** och **Minamoto**.

    **Taira no Kiyomori** (1118–1181) segrade i två korta inbördesstrider
    i Kyoto [1156](#hogen-upproret-1156) och [1160](#heiji-1159) och
    krossade då Minamoto. Han blev 1167 den förste krigaren som fick
    hovets högsta civila ämbete, kanslerämbetet. Han gifte in sin dotter i
    kejsarfamiljen, och hans barnbarn blev kejsar Antoku. Han tjänade
    också på handel med Songkina.

    Kiyomoris dominans väckte ilska hos både hovadel och andra krigare. Ur
    detta växte [Genpei-kriget 1180–85](#genpei-kriget-118085) (se detta),
    där Minamoto vann och grundade
    [Kamakura-shogunatet](#kamakura-shogunatet-1192) – början på nästan
    700 år av krigarstyre i Japan, fram till 1868.

genpei-kriget-118085:
  period: 1180
  label: "Genpei-kriget 1180–85"
  title: "Genpei-kriget 1180–85"
  wiki:
    - "sv:Genpei-kriget"
    - "en:Genpei War"
  text: |
    Genpei-kriget var ett inbördeskrig i Japan mellan de två stora
    krigarklanerna **Taira** (även Heike) och **Minamoto** (även Genji);
    namnet sätts ihop av de sinojapanska läsningarna av klannamnen, Gen
    och Hei. Taira hade dominerat hovet i Kyoto sedan 1160 under [Taira no
    Kiyomori](#taira-no-kiyomori-dominerar) (se denna).

    1180 kallade en prins till uppror, och Minamoto no Yoritomo, som levt
    i exil i östra Japan, samlade krigare där. Efter flera års strider,
    där hans halvbror **Yoshitsune** var den lysande fältherren, avgjordes
    kriget i sjöslaget vid **Dan-no-ura** 1185. Taira förintades, och den
    sexårige kejsaren Antoku drunknade.

    Kriget är källan till mycket av Japans krigarideal och litteratur,
    framför allt *Heike monogatari*, ett epos om Tairas fall och om att
    allt är förgängligt. Segern ledde till [Kamakura-shogunatet
    1192](#kamakura-shogunatet-1192) (se detta), den första
    militärregeringen. Krigarna, samurajerna, skulle styra Japan
    till 1868.

kamakura-shogunatet-1192:
  period: 1180
  label: "Kamakura-shogunatet 1192"
  title: "Kamakura-shogunatet"
  wiki:
    - "sv:Kamakurashogunatet"
    - "en:Kamakura shogunate"
  text: |
    En **shogun** var ursprungligen en tillfällig titel för en general som
    skulle bekämpa ”barbarer”. Efter segern i
    [Genpei-kriget](#genpei-kriget-118085) (se detta) byggde **Minamoto no
    Yoritomo** upp en egen krigarregering i staden **Kamakura** i östra
    Japan, långt från kejsarhovet i Kyoto. 1192 fick han titeln shogun,
    och den blev nu permanent.

    Shogunatet (japanska *bakufu*, ”tältregering”) var en militär
    administration som utnämnde krigare till militärguvernörer och
    förvaltare av gods över hela landet. Kejsaren behöll en ceremoniell
    och religiös roll men förlorade den verkliga makten. Det liknar på
    vissa sätt europeisk feodalism: lojalitet mellan herre och vasall i
    utbyte mot jord.

    Efter Yoritomos död 1199 tog hans hustrus familj Hōjō makten som
    regenter (se ”[Hōjō-regenter styr](#hojo-regenter-styr)”).
    Kamakura-shogunatet slog tillbaka [mongolernas invasioner
    1274](#mongolisk-invasion-1274-slas-tillbaka) och
    [1281](#andra-mongolinvasionen-1281-kamikaze) men föll 1333. Sedan
    följde Ashikaga- och Tokugawashogunaten; systemet avskaffades först
    vid Meiji-restaurationen 1868.

hojo-regenter-styr:
  period: 1200
  label: "Hōjō-regenter styr"
  title: "Hōjō-regenterna"
  wiki:
    - "en:Hōjō clan"
    - "en:Shikken"
  text: |
    När Minamoto no Yoritomo, grundaren av
    [Kamakura-shogunatet](#kamakura-shogunatet-1192) (se detta), dog 1199
    var hans söner unga och svaga. Den verkliga makten togs av hans änka
    **Hōjō Masako** och hennes far **Hōjō Tokimasa**. Familjen Hōjō styrde
    sedan som *shikken*, regenter åt shogunen. Båda Yoritomos söner
    mördades, och från 1219 var shogunerna barn eller marionetter från
    andra familjer.

    Japan fick alltså ett system med flera lager skenmakt: en kejsare utan
    makt i Kyoto, en shogun utan makt i Kamakura och den verkliga makten
    hos shogunens regent. 1221 försökte ex-kejsaren Go-Toba återta makten
    ([Jōkyū-kriget](#jokyu-kriget-1221)), men Hōjō vann på en månad och
    fick därefter större kontroll också över västra Japan.

    1232 införde Hōjō en lagbok för krigarklassen, *[Goseibai
    shikimoku](#hojo-lagen-1232)*, som byggde på praxis och rättvisa
    snarare än kinesisk lag. Hōjō ledde försvaret mot [mongolernas
    invasioner 1274](#mongolisk-invasion-1274-slas-tillbaka) och
    [1281](#andra-mongolinvasionen-1281-kamikaze), men kostnaderna
    försvagade dem, och regimen föll 1333.

jokyu-kriget-1221:
  period: 1220
  label: "Jōkyū-kriget 1221"
  title: "Jōkyū-kriget 1221"
  wiki:
    - "en:Jōkyū War"
    - "en:Kamakura shogunate"
  text: |
    Sedan 1192 hade Japan två maktcentra: kejsarhovet i Kyoto, som hade
    prestige och ceremonier, och
    **[Kamakura-shogunatet](#kamakura-shogunatet-1192)** – en
    militärregering under en *shogun* (överbefälhavare) med säte i
    Kamakura i öster, som i praktiken kontrollerade krigarklassen,
    samurajerna. Efter grundaren Minamoto no Yoritomos död tog hans
    hustrus släkt, **Hōjō**, över som regenter (*shikken*) och styrde i
    shogunens namn.

    1221 försökte den tidigare kejsaren **Go-Toba** utnyttja oron och
    förklarade Hōjō-regenten fredlös. Han räknade med att samurajerna
    skulle ställa sig på kejsarens sida. De gjorde det inte: Hōjō Masako,
    Yoritomos änka, höll ett känt tal där hon påminde krigarna om vad de
    var skyldiga shogunatet. En stor armé marscherade mot Kyoto och vann
    på ungefär en månad.

    Go-Toba förvisades till Oki-öarna, där han dog. Shogunatet
    konfiskerade mark från kejsartrogna adelsmän, delade ut den till sina
    egna krigare och inrättade ett kontor i Kyoto för att övervaka hovet.
    Kriget avgjorde att krigarna, inte hovet, styrde Japan – ett
    förhållande som höll fram till 1868 (Meijirestaurationen).

hojo-lagen-1232:
  period: 1220
  label: "Hōjō-lagen 1232"
  title: "Goseibai Shikimoku – samurajernas lag 1232"
  wiki:
    - "en:Goseibai Shikimoku"
    - "en:Hōjō Yasutoki"
  text: |
    1232 lät regenten **Hōjō Yasutoki** sammanställa *Goseibai Shikimoku*,
    en lagsamling på 51 artiklar. Den var den första lagen skriven för och
    av krigarklassen i Japan. Tidigare lagar byggde på kinesiska
    förebilder och hovets traditioner, som passade dåligt för samurajernas
    vardagskonflikter.

    Lagen handlade främst om praktiska tvister: vem som äger mark, hur arv
    delas, vad en förvaltare får och inte får göra, straff för våld.
    Kvinnor kunde ärva och äga mark, vilket var vanligt i den tidiga
    Kamakura-tiden. Principen var att döma efter sedvana och ”förnuft”
    (*dōri*), och lagen var kort och begriplig nog att lokala krigare
    kunde följa den. Efter Jōkyū-kriget 1221 hade shogunatet många nya
    markägare och tvister att hantera, vilket var ett skäl till att lagen
    behövdes.

    Shikimoku förblev grunden för krigarrätten i flera hundra år och
    användes som läsebok för att lära barn skriva ännu under Edoperioden
    (1600–1868). Jämför i tid med [Magna Carta i England
    1215](#magna-carta-1215) och [Magnus Lagabötes landslag i Norge
    1274](#magnus-lagabotes-landslag) – under 1200-talet kodifierades lag
    på många håll.

nichiren:
  period: 1240
  label: "Nichiren"
  title: "Nichiren och lotussutrans buddhism"
  wiki:
    - "en:Nichiren"
    - "en:Nichiren Buddhism"
  text: |
    **Nichiren** (1222–1282) var en japansk buddhistisk munk. Buddhismen
    hade kommit till Japan via Korea och Kina på 500-talet, och under
    1200-talet uppstod flera nya inriktningar som riktade sig till vanligt
    folk, inte bara till munkar och adel. Bland dem fanns Rena
    landet-buddhismen (där man förlitar sig på buddhan Amidas nåd) och zen
    (meditation).

    Nichiren hävdade att endast *Lotussutran*, en av buddhismens heliga
    skrifter, innehöll den sanna läran. Det räckte att recitera dess titel
    – *Namu Myōhō Renge Kyō*. Han angrep alla andra skolor häftigt och
    skrev 1260 en skrift till shogunatet där han varnade för att landet
    skulle drabbas av katastrofer och utländsk invasion om man inte följde
    honom. Han förvisades två gånger och var nära att avrättas 1271.

    När mongolerna faktiskt anföll Japan 1274 och 1281 (se ”[Mongolisk
    invasion 1274 slås tillbaka](#mongolisk-invasion-1274-slas-tillbaka)”)
    sågs han av anhängarna som en profet. Hans skola är en av få
    buddhistiska rörelser som är uttalat nationell och kompromisslös. Den
    lever kvar: Sōka Gakkai, en modern lekmannarörelse inom
    Nichirenbuddhismen, har miljontals medlemmar och står nära ett
    japanskt regeringsparti, Kōmeitō.

mongolisk-invasion-1274-slas-tillbaka:
  period: 1260
  label: "Mongolisk invasion 1274 slås tillbaka"
  title: "Mongolernas invasioner av Japan 1274 och 1281"
  wiki:
    - "sv:Mongolernas invasioner av Japan"
    - "en:Kamikaze (typhoon)"
  text: |
    Kublai khan krävde att Japan skulle underkasta sig och skickade flera
    sändebud från 1266. Kamakura-shogunatet (Japans militärregering, styrd
    av Hōjō-släkten) vägrade. 1274 sände Kublai en flotta från Korea, som
    mongolerna erövrat: uppskattningsvis 15 000–40 000 mongoliska,
    kinesiska och koreanska soldater på 600–900 fartyg.

    De landsteg i **Hakatabukten** på ön Kyūshū. Samurajerna var vana vid
    strider där krigare utmanade varandra en och en; de möttes nu av
    grupptaktik, giftpilar och exploderande krutbomber (sådana bomber,
    *tetsuhau*, har hittats i vrak). Efter kort tids strider drog sig
    invasionsarmén tillbaka till fartygen – och en storm sänkte en del av
    flottan. Varför de drog sig tillbaka är omdiskuterat.

    Japan byggde en stenmur, ca 20 km lång och ungefär 2 m hög, längs
    Hakatabukten. 1281 kom en mycket större invasion, enligt källorna
    kanske 140 000 man i två flottor (siffran är osäker). Muren höll dem i
    schack i flera veckor tills en tyfon ödelade flottan. Japanerna såg
    stormarna som *kamikaze*, ”gudomlig vind”, som skyddade landet – ett
    ord som återanvändes för självmordspiloterna i andra världskriget.
    Krigens kostnader försvagade shogunatet, som föll 1333.

andra-mongolinvasionen-1281-kamikaze:
  period: 1280
  label: "Andra mongolinvasionen 1281: kamikaze"
  title: "Andra mongolinvasionen av Japan 1281 – ”kamikaze”"
  wiki:
    - "en:Mongol invasions of Japan"
    - "en:Kamikaze (typhoon)"
  text: |
    Kublai khan, mongolernas härskare i Kina, krävde att Japan skulle
    underkasta sig. Japan vägrade. [Ett första anfall
    1274](#mongolisk-invasion-1274-slas-tillbaka) avbröts efter några
    dagar. 1281 kom en mycket större invasion i två flottor från Korea och
    södra Kina, enligt källorna över 100 000 man och flera tusen fartyg –
    en av de största sjöburna invasionerna före 1900-talet. Siffrorna är
    osäkra och troligen överdrivna.

    Japan styrdes då av **Kamakura-shogunatet** – en militärregering under
    en *shogun* (fältherre), medan kejsaren hade mest symbolisk roll.
    Samurajerna hade byggt en stenmur längs Hakatabukten på Kyushu och
    höll invasionsstyrkan kvar på fartygen i veckor. I augusti slog en
    tyfon till och sänkte en stor del av flottan.

    Japanerna tolkade stormen som gudomlig hjälp: *kamikaze*,
    ”gudavinden”. Undervattensarkeologi tyder på att många skepp var
    hastigt byggda flodbåtar som inte klarade öppet hav. Myten om ett
    ointagligt Japan levde kvar, och 1944–45 tog man namnet för
    självmordspiloterna. Japan ockuperades inte av en främmande makt
    förrän 1945. Kostnaden för försvaret försvagade dock shogunatet ([se
    Kamakura försvagas](#kamakura-forsvagas)).

kamakura-forsvagas:
  period: 1300
  label: "Kamakura försvagas"
  title: "Kamakura-shogunatet försvagas"
  wiki:
    - "en:Kamakura shogunate"
    - "en:Hōjō clan"
  text: |
    Sedan 1185 styrdes Japan av **Kamakura-shogunatet**, en
    militärregering i staden Kamakura nära dagens Tokyo. Formellt utsågs
    *shogunen* (överbefälhavaren) av kejsaren i Kyoto, men den verkliga
    makten låg hos shogunens regenter i familjen **Hōjō**. Kejsaren hade i
    praktiken bara religiös och ceremoniell roll.

    Försvaret mot mongolinvasionerna 1274 och 1281 ([se
    det](#mongolisk-invasion-1274-slas-tillbaka)) hade varit dyrt. Men
    eftersom det var ett försvarskrig fanns inget erövrat land att belöna
    samurajerna med, och många krigare blev skuldsatta och missnöjda.
    Shogunatet utfärdade 1297 ett skuldavskrivningsdekret som skadade
    krediten. Samtidigt delades arv mellan alla söner, så gårdarna blev
    allt mindre.

    Kejsar **Go-Daigo**, som tillträdde 1318, ville återta den verkliga
    makten. Hans första komplotter avslöjades, men 1333 gick flera stora
    samurajer, bland andra Ashikaga Takauji, över till hans sida. Kamakura
    stormades och Hōjō-ledarna begick självmord – uppskattningsvis flera
    hundra. Se [Kenmu-restaurationen 1333](#kenmu-1333) och
    [Ashikaga-shogunatet 1336](#ashikaga-shogunatet-1336).

kenmu-1333:
  period: 1320
  label: "Kenmu 1333"
  title: "Kenmu-restaurationen 1333"
  wiki:
    - "en:Kenmu Restoration"
    - "en:Emperor Go-Daigo"
  text: |
    År 1333 föll **Kamakura-shogunatet**, den militärregering som styrt
    Japan sedan 1185 ([se Kamakura försvagas](#kamakura-forsvagas)).
    Kejsar **Go-Daigo**, som länge konspirerat mot shogunatet, fick stöd
    av flera mäktiga samurajer – bland dem Ashikaga Takauji och Nitta
    Yoshisada – och huvudstaden Kamakura stormades.

    Go-Daigo försökte nu något som inte skett på flera hundra år: att låta
    kejsaren styra själv, som i den klassiska kejsartiden före
    samurajerna. Perioden kallas **Kenmu-restaurationen** efter den
    tidsperiod (*nengō*, regeringsdevis) han utropade 1334. Men han
    belönade främst hovadeln i Kyoto och inte de samurajer som hade gjort
    jobbet, och han hade inget fungerande sätt att styra provinserna.

    Redan 1335–36 vände sig Ashikaga Takauji mot honom, intog Kyoto och
    satte en annan kejsare på tronen. Go-Daigo flydde söderut till Yoshino
    och grundade ett eget hov. Därmed hade Japan två konkurrerande
    kejsarhov – Norra och Södra hovet – i nästan 60 år, fram till 1392.
    Restaurationen blev en ideologisk förebild långt senare:
    Meiji-restaurationen 1868 återgav kejsaren makten och moderniserade
    Japan.

ashikaga-shogunatet-1336:
  period: 1320
  label: "Ashikaga-shogunatet 1336"
  title: "Ashikaga-shogunatet 1336"
  wiki:
    - "en:Ashikaga shogunate"
    - "en:Ashikaga Takauji"
  text: |
    **Ashikaga Takauji** var en samurajledare som först hjälpt kejsar
    Go-Daigo att störta Kamakura-shogunatet 1333 men sedan vände sig mot
    honom ([se Kenmu 1333](#kenmu-1333)). 1336 intog han Kyoto, insatte en
    ny kejsare och utfärdade en lag som grundade en ny militärregering;
    1338 fick han titeln *shogun* (överbefälhavare och i praktiken landets
    härskare).

    Ashikaga-shogunatet, även kallat **Muromachi-shogunatet** efter
    stadsdelen i Kyoto där shogunerna bodde, varade till 1573. Det var
    svagare än föregångaren: de regionala krigsherrarna, kallade *daimyo*,
    fick allt mer egen makt. De första 60 åren präglades av kriget mellan
    Norra och Södra hovet, och efter [Ōnin-kriget
    1467–77](#onin-kriget-1467-sengoku-tiden) föll landet sönder i
    Sengoku-perioden, ”de krigande staternas tid”.

    Samtidigt var det en kulturell storhetstid. Zen-buddhismen fick stort
    inflytande, och då utvecklades mycket av det vi idag ser som typiskt
    japanskt: *nō*-teatern, teceremonin, stenträdgårdar och tuschmåleri.
    Guldpaviljongen (Kinkaku-ji, 1397) i Kyoto byggdes av en
    Ashikaga-shogun. [Handeln med Ming-Kina](#ashikaga-handlar-med-ming)
    blomstrade.

nord-och-sydhov-strider:
  period: 1340
  label: "Nord- och sydhov strider"
  title: "Nord- och sydhovet i Japan 1336–1392"
  wiki:
    - "en:Nanboku-chō period"
    - "en:Ashikaga Takauji"
  text: |
    I Japan hade kejsaren sedan länge mest en ceremoniell roll. Den
    verkliga makten låg hos **shogunen**, en militär härskare som ledde
    samurajklassen. [År 1333 försökte kejsaren](#kenmu-1333) **Go-Daigo**
    ta tillbaka makten och störtade det dåvarande shogunatet. Men en av
    hans generaler, **Ashikaga Takauji**, vände sig mot honom, [intog
    Kyoto 1336](#ashikaga-shogunatet-1336), satte en annan medlem av
    kejsarfamiljen på tronen och utnämndes 1338 till shogun.

    Go-Daigo flydde söderut till bergen vid Yoshino och höll fast vid att
    han var den rättmätige kejsaren. Under nästan 60 år fanns därför två
    kejsarhov: **nordhovet** i Kyoto, som stöddes av Ashikaga, och
    **sydhovet** i Yoshino. Perioden kallas Nanbokuchō, ”nord- och
    sydhovens tid”. Krigsherrar i provinserna bytte sida efter vad som
    gynnade dem, och kriget var mer ett utdraget lapptäcke av lokala
    strider än stora slag.

    Konflikten löstes 1392 ([se den punkten](#hoven-forenas-1392)). Den
    blev politiskt känslig långt senare: 1911 slog den japanska regeringen
    fast att sydhovet varit det legitima – trots att dagens kejsarlinje
    härstammar från nordhovet.

ashikaga-yoshimitsu:
  period: 1360
  label: "Ashikaga Yoshimitsu"
  title: "Ashikaga Yoshimitsu (1358–1408)"
  wiki:
    - "en:Ashikaga Yoshimitsu"
    - "en:Kinkaku-ji"
  text: |
    **Ashikaga Yoshimitsu** var den tredje **shogunen** – Japans militäre
    överhärskare – av Ashikagasläkten, och han blev shogun 1368 som
    tioåring. Under hans tid nådde
    [Ashikagashogunatet](#ashikaga-shogunatet-1336) sin höjdpunkt.

    Han är förknippad med tre saker. För det första avslutade han 1392 det
    nästan 60-åriga inbördeskriget mellan nord- och sydhovet (se ”[Hoven
    förenas 1392](#hoven-forenas-1392)”). För det andra öppnade han
    officiell handel med det nya **[Mingkina](#ming)** och accepterade
    titeln ”Japans kung” från Mingkejsaren – vilket innebar att formellt
    erkänna Kina som överhöghet, något senare japanska historiker såg som
    förödmjukande. Handeln gav dock stora inkomster, t.ex. kinesiska
    kopparmynt som blev Japans huvudsakliga valuta. För det tredje var han
    en stor kulturmecenat: han byggde **Kinkaku-ji**, Guldpaviljongen i
    Kyoto, och stödde **nō**-teatern, en stiliserad dramatisk form med
    masker, musik och dans, som utvecklades av skådespelarna Kan'ami och
    Zeami under hans beskydd.

    Efter honom försvagades shogunatet, och 1467 utbröt
    [Ōnin-kriget](#onin-kriget-1467-sengoku-tiden) som inledde Sengoku, en
    lång period av inbördeskrig mellan krigsherrar.

hoven-forenas-1392:
  period: 1380
  label: "Hoven förenas 1392"
  title: "Japans hov förenas 1392"
  wiki:
    - "en:Nanboku-chō period"
    - "en:Imperial Regalia of Japan"
  text: |
    Sedan 1336 hade Japan haft två konkurrerande kejsarhov: **nordhovet**
    i Kyoto, som stöddes av Ashikagashogunerna, och **sydhovet** i bergen
    vid Yoshino söder om Kyoto (se ”[Nord- och sydhov
    strider](#nord-och-sydhov-strider)”). Shogunen var Japans militäre
    överhärskare; kejsaren hade mest religiös och ceremoniell betydelse
    men var viktig för att ge makten legitimitet.

    På 1380-talet hade sydhovet förlorat nästan allt militärt stöd.
    Shogunen **[Ashikaga Yoshimitsu](#ashikaga-yoshimitsu)** förhandlade
    fram en uppgörelse 1392: sydhovets kejsare Go-Kameyama återvände till
    Kyoto och lämnade över de tre **kejserliga regalierna** – en spegel,
    ett svärd och en juvel, som enligt traditionen givits av solgudinnan
    och som en legitim kejsare måste ha. I gengäld lovades att kronan i
    fortsättningen skulle växla mellan de två grenarna av kejsarsläkten.

    Det löftet hölls aldrig; nordhovets gren behöll tronen, och dagens
    kejsare härstammar därifrån. Återföreningen stärkte Yoshimitsus
    ställning och gav Japan några decennier av relativ fred, innan
    [Ōnin-kriget 1467](#onin-kriget-1467-sengoku-tiden) inledde ett sekel
    av inbördeskrig.

ashikaga-handlar-med-ming:
  period: 1400
  label: "Ashikaga handlar med Ming"
  title: "Ashikaga-shogunatets handel med Ming"
  wiki:
    - "en:Ashikaga shogunate"
    - "en:Ashikaga Yoshimitsu"
    - "en:Kangō trade"
  text: |
    Japan styrdes 1336–1573 formellt av en kejsare, men den verkliga
    makten låg hos en **shogun** (militär diktator) från släkten
    **Ashikaga**, med säte i Kyoto. Under shogunen fanns regionala
    krigsherrar, *shugo*, som styrde provinserna.

    Shogunen **[Ashikaga Yoshimitsu](#ashikaga-yoshimitsu)** (makthavare
    ungefär 1368–1408) tog 1402 emot titeln ”Japans kung” från
    Mingkejsaren. Det innebar att Japan formellt erkände sig som
    underordnat Kina – något som senare japanska historiker såg som
    förödmjukande. Men det öppnade för lönsam handel.

    Handeln kallas **tally-handeln** (kangō bōeki), eftersom varje
    officiellt fartyg måste visa ett numrerat intyg som passade mot ett
    motstycke i Kina – ett tidigt slags autentiseringssystem för att
    skilja legala handelsskepp från pirater (*wakō*), som härjade längs
    Kinas kust. Japan sålde svärd, koppar, svavel och solfjädrar; man
    köpte silke, böcker och framför allt **kinesiska kopparmynt**, som
    blev Japans huvudsakliga valuta.

    Rikedomen finansierade bland annat Yoshimitsus Guldpaviljong
    (Kinkaku-ji) i Kyoto. Handeln avbröts och återupptogs flera gånger och
    upphörde slutligen omkring 1547.

ashikaga-forsvagas:
  period: 1420
  label: "Ashikaga försvagas"
  title: "Ashikaga-shogunatet försvagas"
  wiki:
    - "en:Ashikaga shogunate"
    - "en:Ashikaga Yoshinori"
    - "en:Ōnin War"
  text: |
    Japan styrdes av shoguner (militära diktatorer) från släkten
    **Ashikaga** i Kyoto. Men shogunens makt vilade på att de regionala
    krigsherrarna, *shugo*, var lojala – och de blev allt mer
    självständiga och byggde egna arméer.

    Shogunen **Ashikaga Yoshinori** (1429–1441), som valts genom
    lottdragning bland bröderna, försökte återta makten med hårda metoder:
    han konfiskerade land och lät avrätta eller förvisa motståndare, och
    han slog ned buddhistklostret Enryaku-ji. Han kallades ”den onde
    shogunen”. 1441 blev han inbjuden till en fest av krigsherren Akamatsu
    Mitsusuke och mördades där.

    Efter det hade shogunatet aldrig samma makt igen. Samtidigt växte
    bondeuppror (*ikki*), där bönder krävde skuldavskrivning – 1428 krävde
    ett stort uppror i Kyotoområdet att alla skulder skulle strykas.

    Konflikten kulminerade i **Ōnin-kriget**
    [(1467–1477)](#onin-kriget-1467-sengoku-tiden), ett krig mellan
    krigsherrar om shogunens efterträdare som ödelade stora delar av
    Kyoto. Det inledde den 100-åriga
    **[Sengoku-perioden](#sengoku-krigsherrar)**, ”de stridande staternas
    tid”, då Japan i praktiken saknade centralmakt.

muromachi-kultur:
  period: 1440
  label: "Muromachi-kultur"
  title: "Muromachikulturen"
  wiki:
    - "en:Muromachi period"
    - "sv:Nō"
  text: |
    **Muromachiperioden** (1336–1573) är den tid då
    [Ashikaga-shogunerna](#ashikaga-shogunatet-1336) styrde Japan från
    stadsdelen Muromachi i Kyoto. Politiskt var det en orolig tid, men
    kulturellt skapades mycket av det vi i dag ser som typiskt japanskt.

    En stor drivkraft var **zenbuddhismen**, en meditationsinriktad form
    av buddhism som betonar enkelhet och direkt upplevelse. Zenkloster
    fungerade som kulturcentrum. Ur detta kom **stenträdgårdar** (som
    Ryōan-ji, cirka 1500) med krattat grus och stenar, **tuschmåleri** i
    svart bläck (främst munken **Sesshū**, 1420–1506), och
    **teceremonin**, en ritualiserad formell teservering som utvecklades
    under 1400-talet.

    Teatern **nō**, med masker, långsamma rörelser och sång, fick sin form
    av **Zeami** (cirka 1363–1443) med stöd av [shogunen
    Yoshimitsu](#ashikaga-yoshimitsu). Även blomsterarrangemanget
    *ikebana* och arkitekturstilen *shoin-zukuri* – med tatamimattor,
    skjutdörrar och en nisch för konst – kommer härifrån.

    Shogunen **Ashikaga Yoshimasa** (1449–1473) var en dålig ledare men
    stor estet; han byggde Silverpaviljongen (Ginkaku-ji) medan Kyoto
    förstördes i [Ōnin-kriget](#onin-kriget-1467-sengoku-tiden).

onin-kriget-1467-sengoku-tiden:
  period: 1460
  label: "Ōnin-kriget 1467: Sengoku-tiden"
  title: "Ōnin-kriget 1467 och början på Sengoku"
  wiki:
    - "en:Ōnin War"
    - "en:Sengoku period"
  text: |
    Japan hade en kejsare, men den verkliga makten låg hos en **shogun** –
    en militär överbefälhavare. Sedan 1338 kom shogunerna från
    [Ashikaga-släkten](#ashikaga-shogunatet-1336) i Kyoto. Under dem stod
    regionala storgodsägare och krigsherrar, **daimyo**.

    1467 utbröt **Ōnin-kriget** om vem som skulle bli nästa shogun. De två
    mäktigaste vasallerna, Hosokawa och Yamana, tog var sin sida, och
    striderna utkämpades till stor del inne i huvudstaden Kyoto. Kriget
    varade till 1477, båda huvudpersonerna dog under det, och stora delar
    av Kyoto brann ned. Ingen vann.

    Resultatet var att shogunen förlorade nästan all verklig makt. Japan
    föll sönder i över hundra år av inbördeskrig mellan daimyo –
    **[Sengoku-tiden](#sengoku-krigsherrar)**, ”de stridande staternas
    tid” (ca 1467–1600). Den avslutades genom att tre krigsherrar – Oda
    Nobunaga, Toyotomi Hideyoshi och Tokugawa Ieyasu – enade landet.
    [Tokugawa-shogunatet](#tokugawa-shogunatet-1603) 1603–1868 gav sedan
    Japan 250 år av fred och isolering.

sengoku-krigsherrar:
  period: 1480
  label: "Sengoku: krigsherrar"
  title: "Sengoku-tidens krigsherrar"
  wiki:
    - "en:Sengoku period"
    - "en:Daimyo"
    - "en:Gekokujō"
  text: |
    Efter [Ōnin-kriget (1467–1477)](#onin-kriget-1467-sengoku-tiden) hade
    Japans militärregering,
    [Ashikaga-shogunatet](#ashikaga-shogunatet-1336) i Kyoto, nästan ingen
    verklig makt. Landet föll sönder i omkring 100–200 självständiga
    områden styrda av **daimyo** – krigsherrar som bara lydde sig själva.
    Perioden kallas **Sengoku**, ”de stridande staternas tid”, efter en
    liknande kaosperiod i det gamla Kina.

    En typisk process var *gekokujō*, ”de lägre störtar de högre”:
    vasaller tog över sina herrars land, och nya daimyo kom ofta från
    blygsamma bakgrunder. Ett exempel är **Hōjō Sōun**, som från
    1490-talet byggde upp ett mäktigt område kring dagens Tokyo. Daimyo
    byggde slott, stiftade egna lagar och samlade arméer av samurajer och
    bondesoldater.

    Det var våldsamt men inte stagnation: handeln växte, nya städer
    uppstod, och beväpnade buddhistiska bondeförbund (Ikkō-ikki) styrde
    vissa provinser självständigt. [1543 kom portugiser med
    musköter](#portugiser-pa-tanegashima-1543-muskoter), som snabbt
    kopierades i stor skala. Kriget pågick till omkring 1600 ([se
    Sekigahara](#sekigahara-1600)).

sengoku:
  period: 1500
  label: "Sengoku"
  title: "Sengoku-tiden i början av 1500-talet"
  wiki:
    - "en:Sengoku period"
    - "en:Ashikaga shogunate"
  text: |
    Under de första årtiondena av 1500-talet var Japan mitt i
    **Sengoku-tiden** (ca 1467–1600), ”de stridande staternas tid”. Det
    fanns en kejsare i Kyoto, men han var fattig och maktlös – kejsare
    Go-Kashiwabara fick vänta 21 år, till 1521, på sin kröningsceremoni
    eftersom det inte fanns pengar. Inte heller shogunen, militärledaren
    av [Ashikaga-ätten](#ashikaga-shogunatet-1336), hade verklig makt.

    I stället styrde regionala krigsherrar, **daimyo**, som Hōjō i öster,
    Imagawa, Takeda, Uesugi, Ōuchi och Mōri. De byggde borgar på berg,
    stiftade egna lagar och förde ständiga krig mot varandra med arméer av
    samurajer och värvade bönder (*ashigaru*).

    Trots krigen växte ekonomin: silvergruvorna i Iwami öppnade 1526 och
    gjorde Japan till en av världens största silverproducenter, vilket
    senare finansierade handeln med Kina. Teceremonin och zen-präglad
    konst blomstrade. [1543 kom de första européerna (portugiser) med
    musköter](#portugiser-pa-tanegashima-1543-muskoter), och [1549 började
    den kristna missionen](#francisco-xavier-1549).

sengoku-2:
  period: 1520
  label: "Sengoku"
  same_as: sengoku

portugiser-pa-tanegashima-1543-muskoter:
  period: 1540
  label: "Portugiser på Tanegashima 1543: musköter"
  title: "Portugiserna på Tanegashima 1543 – musköter till Japan"
  wiki:
    - "en:Tanegashima (gun)"
    - "sv:Sengokuperioden"
  text: |
    1543 drev ett kinesiskt skepp med några portugisiska handelsmän i land
    på ön **Tanegashima** söder om Kyushu. De var de första européerna i
    Japan. Ortens herre köpte två av deras musköter (arkebuser, tidiga
    eldvapen som avfyrades med en glödande lunta) och lät sina smeder
    kopiera dem.

    Japan befann sig då i
    [Sengokuperioden](#onin-kriget-1467-sengoku-tiden) (”de krigande
    staternas tid”, ca 1467–1600), när landet var splittrat mellan
    krigsherrar (daimyo) som ständigt stred med varandra. Efterfrågan på
    vapen var enorm, och japanska smeder var mycket skickliga. Inom några
    decennier tillverkades eldvapen i stor skala, och Japan hade vid
    slutet av 1500-talet sannolikt fler musköter än något europeiskt land.

    Det förändrade krigföringen. Oda Nobunaga använde i slaget vid
    Nagashino 1575 uppskattningsvis 1 000–3 000 musketörer mot ett
    anstormande rytteri. Eldvapnen hjälpte de krigsherrar som enade Japan
    (se [Oda Nobunaga börjar ena
    landet](#oda-nobunaga-borjar-ena-landet)). Efter 1600 minskade
    användningen under [Tokugawa-shogunatets](#tokugawa-shogunatet-1603)
    långa fred.

francisco-xavier-1549:
  period: 1540
  label: "Francisco Xavier 1549"
  title: "Francisco Xavier i Japan 1549"
  wiki:
    - "sv:Franciskus Xavier"
    - "en:Francis Xavier"
  text: |
    **Francisco Xavier** (1506–1552) var en baskisk präst och en av
    grundarna av jesuitorden (se [tridentinska mötet,
    jesuiter](#tridentinska-motet-jesuiter)). Från 1542 verkade han som
    missionär i Portugals asiatiska handelsstationer: [Goa i
    Indien](#portugisisk-goa-1510), Malacka och Moluckerna.

    I Malacka träffade han en japan, Anjiro, och 1549 reste han till
    Kagoshima i södra Japan – den första kristna missionen där. Han
    stannade i drygt två år, reste till Kyoto men fick inte audiens hos
    kejsaren, och insåg att det var de lokala krigsherrarna (daimyo) som
    hade makten. Han lärde sig att uppträda med prakt snarare än i
    fattigdom för att bli tagen på allvar. Han dog 1552 på en ö utanför
    Kina, på väg dit.

    Missionen blev en framgång: omkring 1600 fanns det uppskattningsvis
    300 000 kristna i Japan, delvis eftersom daimyo ville åt portugisisk
    handel. Men shogunerna såg kristendomen som ett politiskt hot. Den
    förbjöds 1614, kristna förföljdes och efter [Shimabara-upproret
    1637–38](#shimabara-1637) stängdes Japan i stort sett för européer
    till 1850-talet.

oda-nobunaga-borjar-ena-landet:
  period: 1560
  label: "Oda Nobunaga börjar ena landet"
  title: "Oda Nobunaga börjar ena Japan"
  wiki:
    - "sv:Oda Nobunaga"
    - "en:Oda Nobunaga"
  text: |
    Japan var under Sengokuperioden (ca 1467–1600, ”de krigande staternas
    tid”) splittrat mellan hundratals krigsherrar (daimyo). Kejsaren i
    Kyoto hade bara ceremoniell betydelse och shogunen – den militära
    ledaren som formellt styrde i kejsarens namn – hade förlorat sin makt.

    **Oda Nobunaga** (1534–1582) var en mindre daimyo från Owari, nära
    dagens Nagoya. 1560 besegrade han vid Okehazama med uppskattningsvis 2
    000–3 000 man en armé som var tio gånger större, och dödade dess
    ledare. 1568 intog han Kyoto och satte in en marionettshogun, som han
    avsatte 1573. Han krossade buddhistiska kloster som var militära
    maktfaktorer – 1571 brände han klosterkomplexet på berget Hiei och
    dödade tusentals – och använde musköter i stor skala (se [Portugiser
    på Tanegashima 1543](#portugiser-pa-tanegashima-1543-muskoter)). Han
    gynnade handel genom att avskaffa tullar och skrån och var vänligt
    inställd till jesuiterna.

    1582, när han kontrollerade ungefär en tredjedel av Japan, förråddes
    han av en av sina generaler och tog sitt liv i templet Honnō-ji.
    Enandet fullbordades av hans generaler: [Toyotomi Hideyoshi
    (1590)](#hideyoshi-enar-japan-1590) och [Tokugawa
    Ieyasu](#tokugawa-shogunatet-1603), som 1603 grundade det shogunat som
    styrde Japan till 1868.

hideyoshi-enar-japan-1590:
  period: 1580
  label: "Hideyoshi enar Japan 1590"
  title: "Toyotomi Hideyoshi enar Japan 1590"
  wiki:
    - "sv:Toyotomi Hideyoshi"
    - "en:Sengoku period"
  text: |
    Japan hade sedan 1467 varit splittrat i
    **[Sengoku-perioden](#onin-kriget-1467-sengoku-tiden)** (”de krigande
    staternas tid”), då lokala krigsherrar, **daimyo**, slogs om makten
    medan kejsaren och shogunen (militär överbefälhavare) saknade verklig
    makt. Krigsherren [Oda Nobunaga](#oda-nobunaga-borjar-ena-landet)
    började ena landet men tvingades till självmord 1582 efter ett
    förräderi.

    Hans general **Toyotomi Hideyoshi** (1537–1598) tog över. Han var son
    till en fattig bonde och fotsoldat – en enorm klassresa i ett stelt
    samhälle. Med arméer på upp till omkring 200 000 man besegrade han
    sina rivaler, och 1590 föll den sista, Hojo-klanen vid Odawara. Japan
    var enat för första gången på över ett sekel.

    Hideyoshi utfärdade ”svärdsjakten” 1588: bönder fick inte äga vapen,
    och samhället delades fast i samurajer och bönder. Han lät mäta upp
    all jord för beskattning. Han förbjöd också kristen mission 1587 och
    lät korsfästa 26 kristna 1597. Hans enande ledde direkt till
    [invasionen av Korea 1592](#invaderar-korea-1592) (se där) och efter
    hans död till Tokugawa-shogunatet ([se
    1603](#tokugawa-shogunatet-1603)).

invaderar-korea-1592:
  period: 1580
  label: "invaderar Korea 1592"
  title: "Japans invasion av Korea 1592"
  wiki:
    - "en:Japanese invasions of Korea (1592–1598)"
    - "sv:Toyotomi Hideyoshi"
  text: |
    Efter att ha enat Japan ([se 1590](#hideyoshi-enar-japan-1590)) ville
    **Toyotomi Hideyoshi** erövra Kina under Mingdynastin, och vägen gick
    genom Korea, då styrt av Joseondynastin och Kinas lydstat. 1592
    landsteg omkring 150 000 japanska soldater i Busan. Arméerna var
    härdade efter ett sekel av inbördeskrig och hade gott om musköter.
    Seoul föll på knappt tre veckor.

    Japanerna stoppades av tre saker: amiralen **Yi Sun-sin** slog den
    japanska flottan och skar av förbindelserna (se
    [Imjin-kriget](#korea-imjin-kriget-skoldpaddsskepp)), koreanska
    gerillastyrkor, och Kina som skickade arméer på tiotusentals man till
    Koreas hjälp. Efter fredsförhandlingar invaderade Japan igen 1597. När
    Hideyoshi dog 1598 drog sig japanerna tillbaka.

    Kriget var ett av 1500-talets största krig i världen – betydligt
    större än samtida europeiska krig – med uppskattningsvis
    hundratusentals döda, kanske över en miljon inklusive civila och
    svält. Korea ödelades, och tiotusentals koreaner fördes som fångar
    till Japan, bland dem krukmakare som grundade japanska
    porslinstraditioner. Kostnaden försvagade Ming ([se
    1600](#ming-forsvagas)) och sådde ett bestående koreanskt agg mot
    Japan.

sekigahara-1600:
  period: 1600
  label: "Sekigahara 1600"
  title: "Slaget vid Sekigahara 1600"
  wiki:
    - "en:Battle of Sekigahara"
    - "sv:Tokugawa Ieyasu"
  text: |
    Efter Toyotomi Hideyoshis död 1598 ([se
    1590](#hideyoshi-enar-japan-1590)) skulle hans femårige son styra med
    hjälp av ett regentråd. Den mäktigaste av regenterna, **Tokugawa
    Ieyasu** (1543–1616), började bygga egen makt. Japans krigsherrar
    delades i två läger: den östra armén under Ieyasu och den västra under
    Ishida Mitsunari, lojal mot Hideyoshis ätt.

    Den 21 oktober 1600 möttes de vid Sekigahara, en dal i centrala Japan.
    Uppskattningsvis 160 000–200 000 man deltog sammanlagt, i stort sett
    lika mycket som i Europas största slag under samma århundrade. Slaget
    avgjordes på några timmar när flera befälhavare på den västra sidan,
    efter hemliga förhandlingar, bytte sida mitt i striden. Mitsunari
    tillfångatogs och avrättades.

    Sekigahara räknas ofta som Japans mest avgörande slag. Det gav Ieyasu
    kontroll över landet, och 1603 utnämndes han till shogun ([se
    Tokugawa-shogunatet](#tokugawa-shogunatet-1603)). Tokugawa-släkten
    styrde sedan Japan i 265 år. De krigsherrar som stått på
    förlorarsidan, bland dem Satsuma och Choshu, bar på agget – och var de
    som störtade shogunatet 1868.

tokugawa-shogunatet-1603:
  period: 1600
  label: "Tokugawa-shogunatet 1603"
  title: "Tokugawa-shogunatet 1603–1868"
  wiki:
    - "sv:Tokugawashogunatet"
    - "sv:Edoperioden"
  text: |
    En **shogun** var Japans militäre överbefälhavare som i praktiken
    styrde landet, medan kejsaren i Kyoto hade en religiös och ceremoniell
    roll. 1603 gav kejsaren titeln till **Tokugawa Ieyasu**, segraren vid
    Sekigahara ([se 1600](#sekigahara-1600)). Han styrde från Edo, dagens
    Tokyo, som då var en liten stad men kring 1720 hade omkring en miljon
    invånare – kanske världens största stad.

    Tokugawa-släkten skapade ett system för att förhindra nya
    inbördeskrig. De omkring 250–300 lokala furstarna (daimyo) måste
    vartannat år bo i Edo och lämna familjen kvar där som gisslan när de
    reste hem. Samhället delades i fasta klasser: samurajer, bönder,
    hantverkare och köpmän. Kristendomen förbjöds, och från 1630-talet
    [stängdes landet nästan helt](#sakoku-japan-stangs-163339):
    utlänningar fick inte komma in och japaner inte resa ut. Bara
    holländare och kineser fick handla, på en liten ö i Nagasaki.

    Resultatet blev 250 år av fred, ”[Edoperioden](#edo-tiden-isolering)”,
    med städer, handel, kabukiteater och färgträsnitt. När amerikanska
    krigsfartyg 1853 tvingade fram öppning föll systemet, och 1868 tog
    kejsaren tillbaka makten (Meiji-restaurationen) och Japan
    moderniserades i rekordfart.

sakoku-japan-stangs-163339:
  period: 1620
  label: "Sakoku: Japan stängs 1633–39"
  title: "Sakoku: Japan stänger sig 1633–39"
  wiki:
    - "en:Sakoku"
    - "en:Dejima"
  text: |
    **Sakoku** (”stängt land”) är namnet på den politik som Japans
    militärregering, **[Tokugawa-shogunatet](#tokugawa-shogunatet-1603)**,
    införde genom en serie förordningar 1633–1639. En **shogun** var
    Japans faktiske militäre härskare; kejsaren hade bara ceremoniell
    roll.

    Japaner förbjöds att resa utomlands, och den som återvände riskerade
    döden. Kristendomen, som spridits av portugisiska och spanska
    missionärer [sedan 1549](#francisco-xavier-1549) och kanske haft 300
    000 anhängare, förbjöds och kristna förföljdes. Portugiserna utvisades
    1639 efter [Shimabara-upproret](#shimabara-1637) (se nästa punkt).
    Kvar fick bara holländarna – som inte missionerade – stanna, på den
    lilla konstgjorda ön Dejima i Nagasakis hamn, cirka 120 × 75 meter.
    Även kinesiska och koreanska köpmän handlade under kontroll.

    Syftet var att stoppa utländskt inflytande och hindra mäktiga lokala
    herrar från att berika sig på utrikeshandel. Isoleringen varade i över
    200 år, tills amerikanska örlogsfartyg under Perry tvingade fram
    öppning 1853–54. Japan fick fred och inre tillväxt men halkade efter
    tekniskt, vilket gjorde moderniseringen efter 1868 desto snabbare och
    mer genomgripande.

shimabara-1637:
  period: 1620
  label: "Shimabara 1637"
  title: "Shimabara-upproret 1637–38"
  wiki:
    - "en:Shimabara Rebellion"
  text: |
    **Shimabara-upproret** var ett bondeuppror på halvön Shimabara och
    öarna Amakusa på Kyushu, Japans sydligaste huvudö. Området hade många
    kristna, eftersom portugisiska missionärer varit aktiva där.

    Orsakerna var både ekonomiska och religiösa: den lokala herren
    pressade bönderna med mycket höga skatter efter missväxt och torterade
    kristna. Uppskattningsvis 30 000–40 000 upprorsmän – bönder, fiskare
    och arbetslösa samurajer – leddes av en karismatisk tonåring, Amakusa
    Shirō, och barrikaderade sig i den gamla borgen Hara.

    Shogunatet samlade en armé på över 100 000 man; till och med
    holländarna fick beskjuta borgen från ett fartyg. Borgen föll i april
    1638 och nästan alla försvarare dödades. Upproret bekräftade för
    regeringen att kristendomen var ett hot, och året därpå utvisades
    portugiserna – det sista steget i isoleringspolitiken
    **[sakoku](#sakoku-japan-stangs-163339)** ([se föregående
    punkt](#sakoku-japan-stangs-163339)). Därefter levde japanska kristna
    i hemlighet i över 200 år.

edo-tiden-isolering:
  period: 1640
  label: "Edo-tiden, isolering"
  title: "Edo-tiden och Japans isolering"
  wiki:
    - "sv:Edoperioden"
    - "en:Sakoku"
  text: |
    **Edo-tiden** (1603–1868) är den period då Japan styrdes av
    **[Tokugawa-shogunatet](#tokugawa-shogunatet-1603)** – en
    militärregering under en **shogun** (överbefälhavare) av
    Tokugawa-släkten, med säte i Edo (dagens Tokyo). Kejsaren i Kyoto hade
    bara ceremoniell roll. Efter mer än ett sekel av inbördeskrig gav
    Tokugawa landet 250 år av fred.

    Shogunen kontrollerade omkring 260 regionala herrar, **daimyo**, bland
    annat genom systemet *sankin-kōtai*: varje daimyo måste bo vartannat
    år i Edo och lämna familjen där som gisslan när han reste hem. Resorna
    kostade mycket, vilket höll herrarna fattiga – och gav upphov till
    vägar, värdshus och handel.

    Efter 1639 var landet stängt
    (**[sakoku](#sakoku-japan-stangs-163339)**, [se
    1633–39](#sakoku-japan-stangs-163339)): ingen fick resa ut, och bara
    holländare och kineser fick handla, i Nagasaki. Kunskap om europeisk
    vetenskap kom ändå in via holländska böcker (”holländska studier”).
    Samhället delades i strikta stånd: samurajer, bönder, hantverkare,
    köpmän. Isoleringen bröts först när amerikanska örlogsfartyg kom 1853.

edo:
  period: 1660
  label: "Edo"
  title: "Edo – världens största stad"
  wiki:
    - "sv:Edo"
    - "en:Great fire of Meireki"
  text: |
    **Edo** (dagens Tokyo) var säte för
    **[Tokugawa-shogunatet](#tokugawa-shogunatet-1603)**, den
    militärregering som styrde Japan 1603–1868. Shogunen hade makten,
    medan kejsaren satt i Kyoto med enbart ceremoniell roll. Edo var ett
    fiskeläge när Tokugawa Ieyasu gjorde det till sin bas 1590.

    Staden växte mycket snabbt, mycket tack vare *sankin-kōtai*: alla
    omkring 260 regionala herrar (daimyo) måste bo i Edo vartannat år med
    stora följen av samurajer, och lämna familjen där. Kring 1700 hade Edo
    uppskattningsvis omkring en miljon invånare, troligen världens största
    stad – större än London (cirka 600 000) och Paris (cirka 500 000).

    1657 förstörde den stora **Meireki-branden** uppskattningsvis 60–70
    procent av staden och dödade kanske 100 000 människor – betydligt fler
    än [Londons brand 1666](#pesten-i-london-1665-branden-1666), då få
    dog. Staden byggdes om med brandgator. Under
    [Edo-tiden](#edo-tiden-isolering) växte en livlig stadskultur bland
    köpmän och hantverkare: kabukiteater, träsnitt (ukiyo-e) och
    haikupoeten Bashō (1644–1694). Edo bytte namn till Tokyo, ”östra
    huvudstaden”, 1868, när kejsaren flyttade dit.

genroku-kultur:
  period: 1680
  label: "Genroku-kultur"
  title: "Genroku-kulturen"
  wiki:
    - "en:Genroku"
    - "sv:Matsuo Bashō"
  text: |
    **Genroku** är namnet på en japansk tidsperiod 1688–1704, men används
    för den blomstrande stadskultur som kännetecknade slutet av
    1600-talet. Japan var då enat och fredligt under
    [Tokugawa-shogunatet](#tokugawa-shogunatet-1603) (militärregeringen)
    och i stort sett [stängt mot omvärlden](#edo-tiden-isolering).

    Freden gjorde städerna rika: [Edo](#edo) (Tokyo) hade kanske en miljon
    invånare omkring 1720, troligen världens största stad. Köpmännen var
    formellt lågt stående men hade pengar, och det uppstod en
    populärkultur för dem: kabukiteater, bunraku (dockteater), träsnitt
    (ukiyo-e, "bilder av den flytande världen") och nöjeskvarter.

    Kända namn är poeten **Matsuo Bashō**, haikuns mästare, dramatikern
    Chikamatsu Monzaemon och romanförfattaren Ihara Saikaku. Mycket av det
    vi idag ser som typiskt japanskt – haiku, kabuki, träsnitt som senare
    Hokusais – fick sin form här. Jämför med samtidens Europa, där en
    borgerlig publik också växte fram.

edo-2:
  period: 1700
  label: "Edo"
  same_as: edo

yoshimune:
  period: 1720
  label: "Yoshimune"
  title: "Tokugawa Yoshimune"
  wiki:
    - "sv:Tokugawa Yoshimune"
    - "en:Kyōhō Reforms"
  text: |
    **Tokugawa Yoshimune** (1684–1751) var **shogun** i Japan 1716–1745.
    Shogun var landets militära härskare, som hade den verkliga makten
    medan kejsaren var en ceremoniell figur.
    [Tokugawa-släkten](#tokugawa-shogunatet-1603) hade styrt sedan 1603.

    När han tog över hade staten ekonomiska problem efter Genroku-tidens
    lyx (se [Genroku-kultur](#genroku-kultur)). Han genomförde
    **Kyōhō-reformerna**: sparsamhet vid hovet, nyodling av mark, kontroll
    av rispriset (ris var basen för skatterna och samurajernas löner – han
    kallades "riskshogunen") och en låda där vanliga människor kunde lägga
    förslag och klagomål direkt till shogunen.

    Han lättade 1720 på förbudet mot västerländska böcker, så länge de
    inte handlade om kristendom. Det öppnade för **rangaku**, "holländska
    studier" – japanska studier av europeisk medicin, astronomi och teknik
    via holländarna, det enda europeiska folk som fick handla med Japan.
    Den kunskapen gjorde att Japan var bättre förberett när landet
    tvingades öppnas 1853–1854.

tenmei-svalten:
  period: 1780
  label: "Tenmei-svälten"
  title: "Tenmeisvälten i Japan 1782–1788"
  wiki:
    - "en:Great Tenmei famine"
    - "sv:Tokugawa-shogunatet"
  text: |
    Japan styrdes då av
    **[Tokugawa-shogunatet](#tokugawa-shogunatet-1603)**:
    militärdiktatorer, shoguner, styrde från [Edo](#edo) (Tokyo) medan
    kejsaren var en symbolisk gestalt i Kyoto. Landet var sedan 1630-talet
    [nästan helt stängt för omvärlden](#edo-tiden-isolering), så missväxt
    kunde inte mötas med import. Namnet Tenmei kommer från den japanska
    tideräkningsperioden 1781–1789.

    Svälten började med kalla, regniga somrar 1782–83 som förstörde
    risskördarna, särskilt i nordöstra Japan (Tōhoku). 1783 hade vulkanen
    **Asama** ett stort utbrott som spred aska över jordbruksmark. Samma
    år hade Laki på Island ett enormt utbrott som sänkte temperaturen på
    norra halvklotet; båda kan ha förvärrat kylan. Uppskattningsvis 200
    000–900 000 människor dog; siffrorna är osäkra. Japans befolkning var
    då omkring 30 miljoner.

    Svälten gav upplopp i städerna, där folk plundrade rishandlares lager,
    och bidrog till att den mäktige rådgivaren Tanuma Okitsugu föll. Hans
    efterträdare Matsudaira Sadanobu införde Kanseireformerna:
    spannmålsreserver, sparsamhet och hårdare ideologisk kontroll.

perry-1853-japan-oppnas:
  period: 1840
  label: "Perry 1853: Japan öppnas"
  title: "Perry och Japans öppnande 1853–1854"
  wiki:
    - "sv:Matthew C. Perry"
    - "en:Perry Expedition"
  text: |
    Sedan 1630-talet hade Japan under **Tokugawa-shogunatet** – en militär
    regering ledd av en ärftlig överbefälhavare (shogun) medan kejsaren
    hade en ceremoniell roll – följt en politik av nästan total isolering,
    *[sakoku](#sakoku-japan-stangs-163339)*. Kristendomen var förbjuden,
    japaner fick inte resa utomlands, och den enda västerländska handeln
    skedde via ett litet holländskt handelskontor på en konstgjord ö i
    Nagasaki.

    I juli 1853 seglade den amerikanske kommendören **Matthew Perry** in i
    Edobukten (Tokyo) med fyra krigsfartyg, varav två ångdrivna – ”de
    svarta skeppen”. Han krävde att Japan skulle öppna hamnar för
    amerikanska fartyg och kom tillbaka 1854 med nio fartyg. Japan, som
    såg vad som hänt Kina i [Opiumkriget](#opiumkriget-183942-hongkong),
    gav efter och skrev under **Kanagawafördraget**. Fler ojämlika
    handelsavtal med väststaterna följde 1858.

    Förnedringen undergrävde shogunatets legitimitet. Efter
    inbördesstrider avsattes shogunen 1868, och makten återgick formellt
    till kejsaren i **[Meijirestaurationen](#meiji-restaurationen-1868)**.
    Japan moderniserades sedan i rasande fart och blev på bara ca 40 år en
    industrimakt som [besegrade Ryssland 1905](#seger-over-ryssland-1905)
    – en helt annan väg än Kinas.

meiji-restaurationen-1868:
  period: 1860
  label: "Meiji-restaurationen 1868"
  title: "Meiji-restaurationen 1868"
  wiki:
    - "sv:Meijirestaurationen"
    - "sv:Kejsar Meiji"
  text: |
    I över 250 år hade Japan styrts av **shogunen** – en militär
    överbefälhavare ur [Tokugawasläkten](#tokugawa-shogunatet-1603) –
    medan kejsaren var en symbolisk figur. Landet var nästan stängt för
    utlänningar. När amerikanska krigsfartyg [under Matthew Perry
    1853](#perry-1853-japan-oppnas) tvingade fram handelsavtal visade sig
    shogunatet svagt.

    År 1868 störtade unga samurajer från sydvästra Japan shogunen och
    ”återställde” makten till den 15-årige kejsaren **Meiji** – därav
    namnet **restaurationen**. I praktiken styrde en liten grupp
    reformatorer i hans namn.

    Det som följde var en av historiens snabbaste moderniseringar:
    samurajklassen avskaffades, allmän värnplikt och skolplikt infördes,
    järnväg (första linjen 1872), telegraf, fabriker och en armé och
    flotta efter europeisk modell. Inom ca 30 år [besegrade Japan Kina
    (1895)](#kinesisk-japanska-kriget-1894) och inom 40 år [Ryssland
    (1905)](#seger-over-ryssland-1905). Japan blev Asiens första
    industriella stormakt – men det ledde också till japansk imperialism
    fram till 1945.

meiji-konstitutionen:
  period: 1880
  label: "Meiji-konstitutionen"
  title: "Meijikonstitutionen 1889"
  wiki:
    - "sv:Meijikonstitutionen"
    - "en:Meiji Constitution"
  text: |
    År 1889 fick Japan en skriven grundlag, **Meijikonstitutionen**,
    uppkallad efter [kejsar Meiji](#meiji-restaurationen-1868). Den var
    den första konstitutionen i Asien med ett valt parlament. Japanska
    ledare hade rest runt i Europa och valde medvetet [den preussiska
    (tyska) modellen](#tyska-riket-1871-bismarck), eftersom den gav
    monarken stor makt – inte den brittiska, där parlamentet styrde.

    Kejsaren förklarades ”helig och okränkbar” och var överbefälhavare för
    armé och flotta. Parlamentet, **riksdagen**, hade två kammare: ett
    utnämnt överhus och ett valt underhus. Rösträtten var begränsad till
    män som betalade en viss skatt – ungefär 1 % av befolkningen vid
    första valet 1890.

    Systemet gav partier och val en plats men lämnade militären direkt
    underställd kejsaren och utom politisk kontroll. Det möjliggjorde att
    militären på 1930-talet tog över politiken och drev Japan in i krig.
    Konstitutionen ersattes 1947 av den amerikanskt skrivna
    efterkrigskonstitutionen, som gäller än idag.

seger-over-kina-1895:
  period: 1880
  label: "seger över Kina 1895"
  title: "Japans seger över Kina 1895"
  wiki:
    - "en:Treaty of Shimonoseki"
    - "en:Triple Intervention"
  text: |
    Japans seger i [första kinesisk-japanska kriget
    (1894–95)](#kinesisk-japanska-kriget-1894) visade att [Meijitidens
    modernisering](#meiji-restaurationen-1868) fungerat: på mindre än 30
    år hade ett land utan modern armé byggt en krigsmakt som besegrade
    Ostasiens traditionella stormakt.

    Genom **Shimonosekifördraget** 1895 fick Japan **Taiwan** (som blev
    japansk koloni till 1945), ett krigsskadestånd som motsvarade flera
    gånger den japanska statsbudgeten, och inflytande i Korea. Japan fick
    även Liaodonghalvön i Manchuriet, men Ryssland, Frankrike och Tyskland
    tvingade Japan att lämna tillbaka den – den så kallade
    **trippelinterventionen**. Ryssland arrenderade sedan själv området
    med hamnen Port Arthur, vilket väckte stor bitterhet i Japan.

    Skadeståndet finansierade Japans industrialisering och upprustning.
    Rivaliteten med Ryssland ledde till [rysk-japanska kriget
    1904–05](#rysk-japanska-kriget), som Japan också vann, och 1910
    annekterades Korea. Japan blev en kolonialmakt i europeisk stil – en
    utveckling som slutade i [andra världskriget](#andra-varldskriget).

seger-over-ryssland-1905:
  period: 1900
  label: "Seger över Ryssland 1905"
  title: "Rysk-japanska kriget 1904–05"
  wiki:
    - "sv:Rysk-japanska kriget"
    - "sv:Slaget vid Tsushima"
  text: |
    Japan och Ryssland krigade 1904–05 om inflytande över Manchuriet
    (nordöstra Kina) och Korea. Japan hade på bara 40 år, sedan
    [Meijirestaurationen 1868](#meiji-restaurationen-1868), gått från ett
    isolerat feodalt land till en industrialiserad stat med modern armé
    och flotta efter västerländsk förebild.

    Japan anföll den ryska flottan i Port Arthur utan krigsförklaring.
    Ryssland skickade sin Östersjöflotta runt halva jordklotet, omkring 33
    000 km på sju månader. I slaget vid Tsushima i maj 1905 förintade
    amiral **Togo Heihachiro** den nästan helt: av 38 ryska fartyg sänktes
    eller kapitulerade de flesta. Totalt dog uppskattningsvis 130 000–170
    000 soldater i kriget.

    Det var första gången i modern tid som en asiatisk stat besegrade en
    europeisk stormakt i ett stort krig, vilket väckte uppmärksamhet över
    hela kolonialvärlden. I Ryssland bidrog nederlaget till
    revolutionen 1905. Japan fick fritt fram i Korea ([annekterat
    1910](#annekterar-korea-1910)) och fortsatte expandera – se
    [Manchuriet 1931](#manchuriet-ockuperas-1931).

annekterar-korea-1910:
  period: 1900
  label: "annekterar Korea 1910"
  title: "Japan annekterar Korea 1910"
  wiki:
    - "en:Korea under Japanese rule"
    - "en:Japan–Korea Treaty of 1910"
  text: |
    Korea styrdes sedan 1392 av Joseondynastin, en monarki som länge levt
    under kinesiskt beskydd. Efter att Japan [besegrat Kina
    1895](#seger-over-kina-1895) och [Ryssland
    1905](#seger-over-ryssland-1905) fanns ingen kvar att skydda Korea.
    1905 blev landet japanskt protektorat, och i augusti 1910 annekterades
    det formellt.

    Japansk kolonialstyre varade i 35 år, till 1945. Japan byggde
    järnvägar, fabriker och skolor, men i japanskt intresse. Koreaner
    tvingades så småningom ta japanska namn, koreanska förbjöds i
    skolorna, och under [andra världskriget](#andra-varldskriget)
    tvångsrekryterades hundratusentals till arbete och militärtjänst,
    däribland kvinnor som tvingades till sexuellt slaveri (så kallade
    ”tröstkvinnor”). Ett fredligt uppror 1 mars 1919 slogs ned med
    uppskattningsvis tusentals döda.

    När Japan kapitulerade 1945 delades Korea vid 38:e breddgraden mellan
    Sovjet och USA, vilket ledde till [Koreakriget
    1950–53](#koreakriget-195053) och den delning som finns än idag.
    Ockupationen är fortfarande en källa till spänningar mellan Sydkorea
    och Japan.

manchuriet-ockuperas-1931:
  period: 1920
  label: "Manchuriet ockuperas 1931"
  title: "Japan ockuperar Manchuriet 1931"
  wiki:
    - "sv:Mukdenincidenten"
    - "sv:Manchukuo"
  text: |
    Manchuriet är nordöstra Kina, rikt på kol, järn och jordbruksmark.
    Japan hade sedan [segern över Ryssland
    1905](#seger-over-ryssland-1905) kontroll över en järnväg där,
    Sydmanchuriska järnvägen, bevakad av den japanska Kwantungarmén.

    I september 1931 sprängde japanska officerare själva en bit av
    järnvägen nära Mukden (Shenyang) och skyllde på kineserna – den så
    kallade Mukdenincidenten. Detta gjordes utan klartecken från
    regeringen i Tokyo. Armén ockuperade på några månader hela Manchuriet,
    ett område ungefär lika stort som Frankrike och Tyskland tillsammans.
    1932 skapades marionettstaten Manchukuo med Kinas siste kejsare,
    **Puyi**, som formell härskare.

    Nationernas förbund fördömde ockupationen, och Japan lämnade då
    förbundet 1933 utan konsekvenser – ett mönster Italien och Tyskland
    följde. Händelsen visade också att militären i praktiken styrde Japans
    politik. Den ledde till [fullt krig mot Kina 1937](#nanking-1937) och
    sedan till [Pearl Harbor 1941](#pearl-harbor).

pearl-harbor:
  period: 1940
  label: "Pearl Harbor"
  title: "Attacken mot Pearl Harbor 1941"
  wiki:
    - "sv:Attacken mot Pearl Harbor"
    - "en:Pacific War"
  text: |
    Den 7 december 1941 anföll Japan USA:s Stillahavsflotta i **Pearl
    Harbor** på Hawaii utan krigsförklaring. Sex hangarfartyg skickade
    omkring 350 flygplan i två vågor. Omkring 2 400 amerikaner dödades,
    åtta slagskepp skadades eller sänktes och ett par hundra flygplan
    förstördes. USA:s egna hangarfartyg låg dock inte i hamnen – det blev
    avgörande senare.

    Bakgrunden: Japan hade krigat i Kina sedan 1937 och ockuperat [Franska
    Indokina](#fransk-indokina-saigon-1862) (dagens Vietnam m.m.). USA
    svarade 1941 med ett oljeembargo, och Japan importerade större delen
    av sin olja från USA. Japans plan var att slå ut den amerikanska
    flottan tillfälligt och snabbt ta oljefälten i Nederländska Ostindien
    (dagens Indonesien).

    Följden blev den motsatta: USA, som dittills hållit sig utanför
    kriget, gick in med full kraft. Fyra dagar senare förklarade Hitler
    krig mot USA, och [andra världskriget](#andra-varldskriget) blev på
    riktigt globalt. Redan i juni 1942 sänkte USA fyra japanska
    hangarfartyg vid Midway. USA:s industri producerade under kriget
    mångdubbelt mer än Japans. Se även [Hiroshima och Nagasaki
    1945](#hiroshima-nagasaki-1945).

hiroshima-nagasaki-1945:
  period: 1940
  label: "Hiroshima, Nagasaki 1945"
  title: "Atombomberna över Hiroshima och Nagasaki 1945"
  wiki:
    - "sv:Atombombningarna av Hiroshima och Nagasaki"
  text: |
    Den 6 augusti 1945 fällde USA en atombomb – en bomb där energin kommer
    från klyvning av atomkärnor – över staden **Hiroshima**. Bomben
    motsvarade omkring 15 000 ton vanligt sprängämne. Tre dagar senare,
    den 9 augusti, föll en plutoniumbomb (cirka 21 000 ton) över
    **Nagasaki**. Bomberna kom från
    [Manhattanprojektet](#manhattanprojektet) (se det).

    Uppskattningsvis 90 000–140 000 människor dog i Hiroshima och 60
    000–80 000 i Nagasaki före årets slut, av tryckvåg, brand och
    strålning. Som jämförelse dödade en enda natt med brandbomber över
    Tokyo i mars 1945 omkring 100 000 – men nu räckte ett plan och en
    bomb.

    Den 8 augusti förklarade även Sovjetunionen krig mot Japan, och den 15
    augusti meddelade kejsaren kapitulation. Historiker diskuterar
    fortfarande hur mycket bomberna respektive Sovjets krigsförklaring
    betydde. Bomberna är de enda kärnvapen som använts i krig. De inledde
    kärnvapenkapprustningen under kalla kriget: [Sovjet sprängde sin
    första bomb 1949](#atombomb-1949), och 1961 testade Sovjet en vätebomb
    som var ungefär 3 000 gånger starkare än Hiroshimabomben.

shinkansen-1964:
  period: 1960
  label: "Shinkansen 1964"
  title: "Shinkansen 1964 – det första snabbtåget"
  wiki:
    - "sv:Shinkansen"
    - "en:Tokaido Shinkansen"
  text: |
    Den 1 oktober 1964, nio dagar före OS i Tokyo, öppnades **Tokaido
    Shinkansen** mellan Tokyo och Osaka, världens första
    höghastighetsjärnväg. Tågen gick i 210 km/h och kortade restiden för
    de 515 kilometrarna från cirka 6,5 till 4 timmar (snart 3 tim 10 min).
    Som jämförelse var Sveriges snabbaste tåg då ungefär hälften så
    snabba.

    Hemligheten var en helt ny bana med bredare spårvidd än Japans gamla
    smalspår, svaga kurvor, inga plankorsningar och elektrisk drift med
    motorer i varje vagn i stället för ett tungt lok. Projektet kostade
    ungefär dubbelt så mycket som planerat, och delvis finansierades det
    med ett lån från Världsbanken. Det var en symbol för Japans återkomst
    efter [krigsnederlaget](#nederlag-1945), se [ekonomiska
    undret](#ekonomiska-undret).

    Shinkansen har transporterat över 10 miljarder passagerare utan en
    enda dödsolycka genom urspårning eller kollision. Den visade att
    järnväg kunde konkurrera med flyg på sträckor runt 500 km. Frankrikes
    TGV följde 1981, Tyskland och Sverige (X2000 1990) senare, och Kina
    har sedan 2008 byggt världens överlägset största snabbtågsnät, över 40
    000 km.

ekonomiska-undret:
  period: 1960
  label: "ekonomiska undret"
  title: "Japans ekonomiska under"
  wiki:
    - "en:Japanese economic miracle"
  text: |
    1945 låg Japan i ruiner: städerna var bombade, [Hiroshima och
    Nagasaki](#hiroshima-nagasaki-1945) förstörda (se det) och industrin
    nere. USA ockuperade landet till 1952, gav det en demokratisk
    författning, genomförde en jordreform och bröt delvis upp de stora
    familjekonglomeraten. [Koreakriget 1950–53](#koreakriget-195053) gav
    Japan stora amerikanska beställningar.

    Från mitten av 1950-talet till 1973 växte Japans ekonomi med i snitt
    omkring 9–10 procent per år – ekonomin fördubblades ungefär vart
    åttonde år. 1968 gick Japan om Västtyskland och blev världens näst
    största ekonomi. Drivkrafterna var hög sparkvot, utbildad arbetskraft,
    livstidsanställning, statlig industripolitik via handelsministeriet
    MITI och export av allt mer avancerade varor: först textil, sedan stål
    och fartyg, sedan bilar och elektronik från Toyota, Honda, Sony och
    Panasonic. Toyotas produktionssystem med just-in-time-leveranser
    kopierades sedan över hela världen.

    Tillväxten bromsade efter [oljekrisen 1973](#yom-kippur-1973-oljekris)
    men fortsatte, och på 1980-talet ansågs Japan hota USA:s
    teknikledning. 1990 sprack en enorm fastighets- och aktiebubbla, och
    därefter följde ”det förlorade decenniet” med stagnation och
    deflation. Kina, Sydkorea och Taiwan har senare följt liknande
    exportdrivna modeller.

bubbla-krasch-1990:
  period: 1980
  label: "Bubbla, krasch 1990"
  title: "Japans bubbelekonomi och kraschen 1990"
  wiki:
    - "en:Japanese asset price bubble"
    - "en:Lost Decades"
  text: |
    Efter [andra världskriget](#andra-varldskriget) [växte Japan snabbare
    än nästan något annat land](#ekonomiska-undret), och på 1980-talet var
    det världens näst största ekonomi, ledande inom bilar och elektronik
    (Toyota, Sony, Nintendo). Efter **Plazaavtalet** 1985 – en
    överenskommelse mellan de stora industriländerna om att försvaga
    dollarn – steg yenen kraftigt, och Japans centralbank sänkte räntan
    för att stötta ekonomin. Billiga lån strömmade in i aktier och
    fastigheter.

    Resultatet blev en **bubbla**: priser som drivs långt över verkligt
    värde av förväntan om fortsatta prisökningar. Börsindexet Nikkei
    tredubblades mellan 1985 och 1989. Det sades att marken under
    kejsarpalatset i Tokyo var värd mer än all mark i Kalifornien. När
    centralbanken höjde räntan 1989–90 sprack bubblan: Nikkei föll med
    omkring 60 % på tre år och markpriserna sjönk i 15 år.

    Bankerna satt med enorma dåliga lån, och Japan fick **det förlorade
    decenniet** – i praktiken två till tre decennier av låg tillväxt och
    fallande priser. Nikkei nådde inte 1989 års nivå igen förrän 2024.
    Jämför med IT-bubblan år 2000 och [finanskrisen
    2008](#finanskrisen-2008), som följde samma mönster.

fukushima-2011:
  period: 2000
  label: "Fukushima 2011"
  title: "Jordbävningen, tsunamin och Fukushima 2011"
  wiki:
    - "sv:Kärnkraftsolyckan i Fukushima"
    - "en:Fukushima nuclear accident"
    - "en:2011 Tōhoku earthquake and tsunami"
  text: |
    Den 11 mars 2011 drabbades nordöstra Japan av en jordbävning med
    magnituden 9,0–9,1, den kraftigaste som uppmätts i Japan. Den utlöste
    en tsunami med vågor upp till 40 meter som svepte in över kusten.
    Omkring 18 000–20 000 människor dog, de allra flesta drunknade.

    Vid kärnkraftverket **Fukushima Daiichi** stängdes reaktorerna
    automatiskt av vid skalvet, men tsunamivågen, cirka 14 meter, slog ut
    reservgeneratorerna som skulle driva kylningen. Utan kylning smälte
    bränslet i tre reaktorer (en **härdsmälta**), och vätgasexplosioner
    förstörde reaktorbyggnader. Radioaktiva ämnen släpptes ut och omkring
    150 000 människor evakuerades. Det klassas som den värsta
    kärnkraftsolyckan sedan [Tjernobyl 1986](#tjernobyl-1986), och båda
    har högsta nivå (7) på den internationella skalan.

    Själva strålningen har officiellt kopplats till ett fåtal dödsfall,
    men evakueringen och stressen beräknas ha bidragit till över 2 000
    dödsfall bland äldre och sjuka. Olyckan fick stora följder: Japan
    stängde tillfälligt alla sina reaktorer, och Tyskland under
    [Merkel](#merkel) beslöt att avveckla kärnkraften helt (sista
    reaktorerna stängdes 2023). Rivningen av kraftverket beräknas ta 30–40
    år.
