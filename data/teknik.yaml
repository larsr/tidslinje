# Teknik & elektricitet
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

vattenkvarnar-sprids-i-europa:
  period: 1000
  label: "Vattenkvarnar sprids i Europa"
  title: "Vattenkvarnen – medeltidens motor"
  wiki:
    - "sv:Vattenkvarn"
    - "en:Watermill"
  text: |
    En **vattenkvarn** låter strömmande vatten driva ett hjul, vars rotation via axlar och kugghjul driver en kvarnsten som mal säd till mjöl. Tekniken var känd redan av romarna (den beskrivs av arkitekten Vitruvius på 20-talet f.Kr.), men det var under högmedeltiden, omkring 1000–1300, som den spreds till nästan varje bäck i Västeuropa.

    Det finns två huvudtyper av hjul: *underfallshjul*, där vattnet strömmar under hjulet, och *överfallshjul*, där vattnet faller ner i skovlar ovanifrån och vikten driver hjulet – mer effektivt men kräver en damm eller fallhöjd. En kvarn gav i storleksordningen några kilowatt, vilket ersatte handkraften hos många människor eller flera dragdjur.

    Det viktiga var att samma kraft kunde användas till mycket mer än mjöl. Med en **kamaxel** – en axel med utstickande tappar som omvandlar rotation till upp-och-ned-rörelse – kunde kvarnen driva hammare för valkning av tyg, sågar, blåsbälgar till smedjor och senare [masugnar](#masugnar-sprids-i-europa) samt [papperstillverkning](#papperskvarn-i-xativa-spanien-1150). Hur utbrett det var visar [Domesday-inventeringen i England 1086](#domesday-raknar-5-600-vattenkvarnar). Där vatten saknades kom [väderkvarnen](#vaderkvarn-dokumenterad-i-england-1185). Vattenkraft förblev den viktigaste icke-muskulära energikällan fram till ångmaskinen på 1700-talet.

krut-i-kinesiska-vapen:
  period: 1000
  label: "krut i kinesiska vapen"
  title: "Krutet blir vapen i Song-Kina"
  wiki:
    - "sv:Krut"
    - "en:History of gunpowder"
  text: |
    **Krut** (svartkrut) är en blandning av salpeter (kaliumnitrat), träkol och svavel. Nyckeln är salpetern: den innehåller syre som frigörs vid upphettning, så blandningen kan brinna mycket snabbt utan tillgång till luft. Kolet är bränslet och svavlet sänker antändningstemperaturen. Senare standardrecept är ungefär 75 % salpeter, 15 % kol och 10 % svavel.

    Krutet upptäcktes troligen av kinesiska daoistiska alkemister – sökare efter livselixir – på 800-talet, och en text från den tiden varnar för blandningar som brinner upp och sveder skägget. Under Songdynastin (960–1279), som ständigt hotades av nomadfolk i norr, började man använda det militärt: brandpilar, brandbomber som slungades med katapult och rökbomber. De tidiga blandningarna hade låg salpeterhalt och brann snarare än exploderade.

    De första skrivna recepten finns i en [militärhandbok från 1044](#krutformel-1044). Utvecklingen gick sedan mot sprängladdningar, eldrör och [krutbomber mot mongolerna](#kinesiska-krutbomber-mot-mongolerna). Via mongolerna och handelsvägarna nådde kunskapen [Europa på 1200-talet](#krut-nar-europa), där [kanoner](#kanoner-avbildas-forsta-gangen-1326) på sikt förändrade krigföring, borgar och statsbygge.

papperspengar-i-kina-1024:
  period: 1020
  label: "Papperspengar i Kina 1024"
  title: "Världens första statliga sedlar"
  wiki:
    - "en:Jiaozi (currency)"
    - "en:History of paper money in China"
  text: |
    I Songdynastins Kina (960–1279) var vardagsmynten av koppar eller, i provinsen Sichuan, av järn. Järnmynt har lågt värde per vikt, så större affärer krävde kilovis med mynt. Köpmän i Sichuan började därför omkring år 1000 utfärda **jiaozi**: papperskvitton på deponerade mynt, som kunde lämnas vidare i stället för mynten.

    När flera utfärdare gick i konkurs tog staten över. År 1024 (enligt vissa källor beslutat 1023) inrättades ett statligt kontor i Chengdu som fick monopol på att ge ut sedlarna, med fast nominellt värde, begränsad giltighetstid och en reserv i mynt. Det var de första statliga sedlarna i världen. Möjligheten fanns för att Kina redan behärskade blocktryck – att skära text och bild i träplattor – vilket också försvårade förfalskning.

    Erfarenheterna blev blandade: när staten behövde pengar till krig tryckte den fler sedlar, vilket gav inflation. Samma problem följer pappers- och digitalpengar än i dag. Under mongoliska Yuandynastin var sedlar huvudvaluta, och [Marco Polo](#marco-polo-hos-kublai) beskrev dem med förundran för européer. Europas första sedlar gavs ut först 1661 av Stockholms Banco – över 600 år senare.

kinesiska-vattenklockor:
  period: 1020
  label: "kinesiska vattenklockor"
  title: "Kinesiska vattenklockor"
  wiki:
    - "en:Water clock"
    - "en:Escapement"
  text: |
    En **vattenklocka** mäter tid genom att vatten rinner in i eller ut ur ett kärl i jämn takt; vattennivån visar hur mycket tid som gått. Problemet är att flödet minskar när kärlet töms, eftersom trycket sjunker. Kinesiska klockmakare löste det med flera kärl i trappa: varje kärl fylls på från det ovanför, så att det sista får ett nästan konstant flöde. Dygnet var indelat i 100 *ke*, ungefär 14,4 minuter vardera.

    Vattenklockor fanns i Babylonien, Egypten och Grekland, men i Kina utvecklades de långt. År 725 byggde munken Yi Xing och ingenjören Liang Lingzan en vattendriven himmelsglob med en tidig form av **gång** (eng. escapement): en mekanism som låter ett hjul röra sig ett steg i taget i stället för fritt, så att rörelsen blir jämn och räkningsbar. Gången är kärnan i alla mekaniska ur.

    Höjdpunkten kom med [Su Songs klocktorn](#su-songs-klocktorn-forsta-kanda) 1088–1092. Exakt tid var en statsangelägenhet: kalendern och kejsarens ritualer krävde precisa astronomiska förutsägelser. I Europa kom [mekaniska ur med spindelgång](#mekaniska-ur-med-spindelgang) kring 1280, drivna av vikter i stället för vatten, som inte fryser.

bi-sheng-losa-typer-1040:
  period: 1040
  label: "Bi Sheng: lösa typer ~1040"
  title: "Bi Sheng uppfinner lösa typer"
  wiki:
    - "en:Bi Sheng"
    - "en:Movable type"
  text: |
    I Kina trycktes böcker sedan 700-talet med **blocktryck**: varje sida skars för hand i en träplatta, som sedan färgades in och pressades mot papper. Det fungerar bra för upplagor men varje ny sida kräver en ny platta. **Bi Sheng** (ca 990–1051), en hantverkare vi bara känner genom en beskrivning av [Shen Kuo](#shen-kuo-magnetisk-deklination) från 1088, kom omkring 1040 på ett alternativ: **lösa typer**.

    Han gjorde ett tecken per liten bit av bränd lera. Typerna placerades i en järnram med en blandning av harts, vax och pappersaska, som värmdes så att typerna satt fast när den svalnade. Efter tryckningen värmdes ramen igen och typerna kunde återanvändas. Med två ramar kunde man sätta en sida medan den andra trycktes.

    I Kina slog tekniken ändå inte igenom. Kinesisk skrift har tusentals tecken, så sättaren måste leta i enorma typförråd, och blocktryck förblev det dominerande sättet ända in på 1800-talet. Korea, som redan gjort [stora träsnittsprojekt](#korea-goryeo-trasnitt-av-buddhistisk), gick vidare med typer av metall på 1200-talet. I Europa blev lösa typer revolutionerande med [Gutenbergs tryckpress](#gutenbergs-tryckpress-1450), eftersom ett alfabet på några dussin tecken gör systemet enkelt och snabbt.

krutformel-1044:
  period: 1040
  label: "krutformel 1044"
  title: "Världens första krutrecept"
  wiki:
    - "en:Wujing Zongyao"
    - "en:Gunpowder"
  text: |
    Mellan 1040 och 1044 sammanställde en kommitté av ämbetsmän under ledning av Zeng Gongliang, på uppdrag av Songkejsaren, *Wujing Zongyao* – ungefär ”Sammanfattning av de viktigaste militära teknikerna”. Bakgrunden var att Songriket pressades militärt av grannstater i norr och väster.

    Boken innehåller de äldsta kända skrivna recepten på [krut](#krut-i-kinesiska-vapen). Det är tre olika blandningar, för brandbomber som kastades med katapult och för giftiga rökbomber. Utöver salpeter, svavel och kol innehöll de bland annat harts, vax och arsenik. Salpeterhalten var lägre än i senare krut, ungefär hälften av blandningen, så de brann häftigt men exploderade inte. Boken beskriver också eldkastare som drevs av nafta och en tidig magnetiserad ”sydvisare”.

    Att recepten skrevs ner i en officiell handbok visar att krutet nu var statlig militärteknik, inte alkemi. Under de följande två seklerna utvecklades starkare blandningar med mer salpeter, och därmed sprängbomber och eldrör. I Europa dök det första kända krutreceptet upp 200 år senare, hos [Roger Bacon](#krutrecept-i-europa-bacon-1267), och snart användes [kanoner på slagfälten](#kanoner-vid-crecy-1346).

magnetkompass-for-navigation-kina-1090:
  period: 1060
  label: "Magnetkompass för navigation (Kina ~1090)"
  title: "Kompassen kommer till sjöss"
  wiki:
    - "en:History of the compass"
    - "sv:Kompass"
  text: |
    En **magnetkompass** är en magnetiserad nål som kan vrida sig fritt och därför ställer in sig efter jordens magnetfält, i ungefär nord–sydlig riktning. I Kina hade man länge känt till att magnetit (naturligt magnetisk järnmalm) pekar mot syd och använt det i spådomskonst och geomantik (feng shui). [Shen Kuo](#shen-kuo-magnetisk-deklination) beskrev 1088 en magnetiserad nål upphängd i en silkestråd.

    Den första kända uppgiften om kompass på fartyg kommer från Zhu Yu, som omkring 1117 beskrev hur sjömän i hamnstaden Guangzhou på 1090-talet använde den: på natten navigerade de efter stjärnorna, på dagen efter solen, och vid mulet väder ”tittar de på sydvisaren”. Nålen kunde flyta på vatten med hjälp av ett litet träflöte.

    Före kompassen var navigation på öppet hav beroende av klar himmel, så att kompassen fungerade vid moln och dimma gjorde segling säkrare och möjliggjorde längre rutter. Den underlättade den kinesiska och arabiska handeln över Indiska oceanen. I Europa beskrivs den först av [Alexander Neckam ~1190](#neckam-beskriver-magnetkompassen-1190); om den kom via arabiska sjöfarare eller uppfanns oberoende är oklart. Tillsammans med [akterrodret](#akterroder) och senare [karavellen](#karavellen-och-astrolabium-pa-havet) var den en förutsättning för de europeiska oceanresorna på 1400-talet.

su-songs-klocktorn-forsta-kanda:
  period: 1080
  label: "Su Songs klocktorn: första kända kedjedrift"
  title: "Su Songs astronomiska klocktorn"
  wiki:
    - "en:Su Song"
    - "en:Chain drive"
  text: |
    **Su Song** (1020–1101) var en kinesisk ämbetsman, astronom och ingenjör under Songdynastin. På kejserligt uppdrag byggde han 1088–1092 i huvudstaden Kaifeng ett ungefär 12 meter högt klocktorn, beskrivet i detalj i boken *Xin Yixiang Fayao* (1092), med illustrationer som gjort att moderna forskare kunnat bygga repliker.

    Tornet drevs av ett vattenhjul med 36 skopor. En skopa fylldes tills den var tung nog att tippa en vippa, varpå hjulet rörde sig ett steg och nästa skopa ställdes på plats – en **gång**, mekanismen som delar upp en jämn kraft i lika stora steg (se [kinesiska vattenklockor](#kinesiska-vattenklockor)). Hjulet drev en roterande armillarsfär – en modell av himmelskoordinaterna – på toppen, en stjärnglob och dockor som visade och slog timmarna.

    Kraften överfördes till den roterande sfären med en **kedjedrift**: en sluten kedja kring två kugghjul, samma princip som på en cykel. Det är den äldsta kända kedjan för kontinuerlig kraftöverföring; i Europa beskrevs den av Leonardo da Vinci först på 1400-talet. Tornet monterades ned när [Jin erövrade Kaifeng 1127](#jin-erovrar-kaifeng-1127) och kunde inte återskapas. Europa fick [mekaniska ur](#mekaniska-ur-med-spindelgang) oberoende kring 1280.

domesday-raknar-5-600-vattenkvarnar:
  period: 1080
  label: "Domesday räknar ~5 600 vattenkvarnar"
  title: "Domesday Book räknar kvarnar"
  wiki:
    - "en:Domesday Book"
    - "en:Watermill"
  text: |
    Efter erövringen av England 1066 lät normanden [Vilhelm Erövraren](#vilhelm-erovraren) 1086 genomföra en enorm inventering av landet, kallad [Domesday Book](#domesday-book-1086): vem som ägde vilken mark, hur mycket boskap, plogar och invånare som fanns, och vad allt var värt i skatt. Syftet var skatteuppbörd och kontroll, men den blev en unik ögonblicksbild av ett medeltida samhälle.

    Bland det som räknades fanns **vattenkvarnar**, cirka 5 600 stycken (siffran varierar något beroende på hur man tolkar posterna) i omkring 3 000 orter. England hade då kanske 1,5–2 miljoner invånare, så det blev i storleksordningen en kvarn per 300–400 personer, eller per 50 hushåll. Det visar att [vattenkvarnen](#vattenkvarnar-sprids-i-europa) inte längre var en raritet utan vardaglig infrastruktur i nästan varje by med en bäck.

    Kvarnarna ägdes oftast av godsherren, och bönderna var ofta tvungna att mala sin säd där mot en avgift – ett av de sätt på vilka det feodala systemet tog ut överskott. Domesday-siffrorna används av historiker som ett av de bästa måtten på att medeltidens Europa inte var tekniskt stillastående, utan systematiskt ersatte muskelkraft med vattenkraft långt före den industriella revolutionen.

hjulplog-och-hastsele-sprids-i-europa:
  period: 1100
  label: "Hjulplog och hästsele sprids i Europa"
  title: "Hjulplog och hästsele"
  wiki:
    - "en:Heavy plough"
    - "en:Horse collar"
  text: |
    Romarnas **årder** var i princip en spetsig käpp som rispar ytan – fungerar i Medelhavets lätta jordar men dåligt i Nordeuropas tunga, blöta lerjordar. **Hjulplogen**, eller den tunga plogen, hade tre delar: en kniv som skär lodrätt, ett plogjärn som skär vågrätt, och en *vändskiva* som vänder upp torven. Den vände jorden, förbättrade dräneringen och begravde ogräs. Den krävde dock stor dragkraft, ofta sex eller åtta oxar, vilket främjade samarbete mellan bönder och långa smala åkerremsor.

    Den andra nyheten var **bogträet** eller hästselen. Antikens sele drog över hästens hals och tryckte mot luftstrupen när den drog hårt. Den vadderade bogkragen vilar i stället mot skuldrorna, och med den kan en häst dra ungefär lika tungt som en oxe men gå betydligt snabbare. Kombinerat med hästskor av järn blev hästen ett effektivt dragdjur.

    Båda teknikerna var kända tidigare men spreds brett i Västeuropa under 1000- och 1100-talet. Tillsammans med [treskiftesbruket](#treskiftesbruk-och-hjulplog-hojer) gav de större skördar, vilket bidrog till att Europas befolkning ungefär fördubblades mellan 1000 och 1300 (siffrorna är osäkra). Det överskottet gjorde städer, katedraler som [Saint-Denis](#saint-denis-1137-forsta-gotiska-kyrkan) och universitet möjliga.

gotisk-byggteknik-spetsbage-stravpelare:
  period: 1120
  label: "Gotisk byggteknik: spetsbåge, strävpelare (Saint-Denis 1137)"
  title: "Gotikens byggteknik"
  wiki:
    - "sv:Gotisk arkitektur"
    - "en:Flying buttress"
  text: |
    Romanska kyrkor (ca 1000–1150) hade rundbågar och tunga tunnvalv. Ett valv trycker inte bara nedåt utan också utåt, så väggarna måste vara mycket tjocka och fönstren små. Gotiken, som började när abbot Suger byggde om klosterkyrkan [Saint-Denis](#saint-denis-1137-forsta-gotiska-kyrkan) norr om Paris 1137–1144, löste det med tre tekniker.

    **Spetsbågen** leder kraften brantare nedåt än rundbågen, och dess höjd kan väljas fritt oavsett bredd, vilket underlättar valv över rektangulära fält. **Kryssribbvalvet** samlar valvets last i stenribbor som leder ned till pelare, så att väggarna mellan dem inte bär särskilt mycket. **Strävpelare** och strävbågar – stenbågar som går från valvet över sidoskeppens tak till kraftiga pelare utanför – tar upp det utåtriktade trycket.

    Resultatet var att väggarna kunde ersättas av stora fönster i färgat glas och att kyrkorna kunde bli mycket högre. Koret i Beauvais når cirka 48 meter och rasade delvis 1284 – byggmästarna arbetade med tumregler och erfarenhet, inte hållfasthetsberäkningar, som kom först på 1600–1700-talet. Stilen spreds snabbt, med [Notre-Dame](#notre-dame-gotiken-nar-nya-hojder) och Chartres som höjdpunkter. Två sekler senare visade [Brunelleschis kupol](#brunelleschis-kupol-i-florens-142036) en annan väg: en enorm kupol utan strävbågar.

papperskvarn-i-xativa-spanien-1150:
  period: 1140
  label: "Papperskvarn i Xàtiva, Spanien ~1150"
  title: "Papperskvarnen i Xàtiva"
  wiki:
    - "en:History of paper"
    - "en:Xàtiva"
  text: |
    **Papper** tillverkas genom att växtfibrer slås sönder till en massa i vatten, som sedan lyfts upp på en sil så att fibrerna bildar ett tunt ark som pressas och torkas. Tekniken uppfanns i Kina, traditionellt tillskriven ämbetsmannen Cai Lun år 105 e.Kr., och nådde den islamiska världen på 700-talet; Bagdad hade pappersbruk omkring år 800. Där tillverkades det främst av linne- och hampatrasor.

    Xàtiva (arabiska Shatiba), nära Valencia i det då muslimska Spanien, var känt för sitt papper vid mitten av 1100-talet, och geografen [al-Idrisi](#al-idrisis-varldskarta-1154) skrev att det inte fanns något liknande i världen och att det exporterades öster- och västerut. Det räknas som det tidigaste belägget för papperstillverkning i Europa. Det är oklart om den drevs med vattenkraft eller för hand.

    Det avgörande steget kom när européer, med säkerhet i Fabriano i Italien på 1200-talet, kopplade papperstillverkningen till [vattenkvarnen](#vattenkvarnar-sprids-i-europa): kamaxeldrivna hammare slog sönder trasorna, mycket snabbare än för hand. Papper var långt billigare än pergament av djurhud, där en bok kunde kräva hundratals djurhudar. Det billiga pappret var en förutsättning för [Gutenbergs tryckpress](#gutenbergs-tryckpress-1450) och den explosion av [tryckerier](#tryckerier-i-250-stader-ar-1500) som följde.

notre-dame-gotiken-nar-nya-hojder:
  period: 1160
  label: "Notre-Dame: gotiken når nya höjder"
  title: "Notre-Dame och den gotiska ingenjörskonsten"
  wiki:
    - "en:Notre-Dame de Paris"
    - "en:Gothic architecture"
    - "en:Flying buttress"
  text: |
    Katedralen Notre-Dame i Paris [påbörjades 1163](#notre-dame-i-paris-paborjas-1163) och var i huvudsak färdig efter ungefär hundra år. Den blev ett av de stora exemplen på **gotisk** byggstil, som utvecklats i klosterkyrkan Saint-Denis strax norr om Paris ([Saint-Denis 1137](#gotisk-byggteknik-spetsbage-stravpelare)).

    Gotiken är i grunden en lösning på ett lastproblem. Ett stenvalv trycker inte bara nedåt utan också utåt, och i den äldre romanska stilen fick tjocka väggar med små fönster ta upp det trycket. Gotikens byggmästare använde tre knep: **spetsbågen**, som leder kraften brantare nedåt än en rundbåge; **ribbvalvet**, där stenribbor samlar lasten till några få punkter; och **strävbågar** (flygande strävpelare), som leder sidotrycket ut till fristående pelare utanför byggnaden. Väggen bär då nästan ingenting och kan ersättas av stora glasfönster. Notre-Dames valv når ungefär 33 meter.

    Byggmästarna hade ingen hållfasthetslära i modern mening utan arbetade med erfarenhetsbaserade proportionsregler och provade sig fram. Gränsen syntes i Beauvais, där man byggde valv på omkring 48 meter – och delar av dem rasade 1284. Nästa stora steg i konstruktionsförståelse kom med [Brunelleschis kupol](#brunelleschis-kupol-i-florens-142036) i Florens. Notre-Dame brann 2019 och återinvigdes i december 2024.

vaderkvarn-dokumenterad-i-england-1185:
  period: 1180
  label: "Väderkvarn dokumenterad i England 1185"
  title: "Väderkvarnen kommer till Europa"
  wiki:
    - "sv:Väderkvarn"
    - "en:Windmill"
  text: |
    År 1185 nämns en väderkvarn i Weedley i Yorkshire som hyrdes ut för en årlig avgift. Det är ett av de äldsta säkra beläggen för väderkvarnar i Europa, och inom några decennier fanns de spridda över England, Nordfrankrike och Flandern.

    Den tidiga europeiska typen var **stolpkvarnen**: hela kvarnhuset vilar på en grov stolpe och vrids för hand så att vingarna vänds mot vinden. Vingarna sitter på en nästan horisontell axel och roterar i ett vertikalt plan, precis som på en modern vindturbin; via kugghjul driver axeln en kvarnsten. Det fanns äldre väderkvarnar i Persien, kända sedan omkring 900-talet, men de hade vertikal axel och segel som snurrade horisontellt bakom en skyddsmur. Den europeiska konstruktionen anses ha uppstått självständigt.

    Fördelen var att kvarnen inte behövde en strömmande flod. [Vattenkvarnar](#vattenkvarnar-sprids-i-europa) var redan vanliga – [Domesday-boken räknade ~5 600](#domesday-raknar-5-600-vattenkvarnar) i England 1086 – men i platta landskap och där floder frös fyllde vinden en lucka. Senare kom tornkvarnen, där bara taket med vingarna vrids. I Nederländerna användes väderkvarnar från 1400-talet för att pumpa bort vatten och torrlägga land, och fram till ångmaskinen var vind, vatten och muskler de enda kraftkällorna.

akterroder:
  period: 1180
  label: "akterroder"
  title: "Akterrodret"
  wiki:
    - "en:Rudder"
    - "en:Steering oar"
  text: |
    Ett **akterroder** är ett roder som sitter på gångjärn på akterstäven – den lodräta balken längst bak i skeppet – mitt i fartygets längdlinje, och som styrs med en rorkult. Det är den lösning alla fartyg har i dag.

    Före akterrodret styrde europeiska skepp med en **styråra** monterad på ena sidan, oftast den högra. Därför heter höger sida på ett fartyg fortfarande *styrbord* – det var där styrbrädet satt på vikingaskeppen. En styråra fungerar, men den blir otymplig när fartygen växer och är svår att hantera i hög sjö eller när skeppet lutar.

    Kina hade akterroder mycket tidigare; lermodeller av båtar med sådant roder finns från Handynastin, omkring 100-talet e.Kr. I Europa dyker det upp på avbildningar omkring 1180, bland annat på en dopfunt i Winchester. Om tekniken kom från Asien eller utvecklades självständigt vet man inte.

    Akterrodret gjorde det möjligt att bygga större och djupare fartyg och att segla mer kontrollerat mot vinden. Det var en förutsättning för Hansans koggar på Östersjön och senare för [karavellerna](#karavellen-och-astrolabium-pa-havet) som tog portugiserna runt Afrika. Tillsammans med [kompassen](#neckam-beskriver-magnetkompassen-1190), som kom till Europa samtidigt, förändrade det sjöfarten.

kinesiska-krutbomber-mot-mongolerna:
  period: 1200
  label: "Kinesiska krutbomber mot mongolerna"
  title: "Krutbomber i kriget mot mongolerna"
  wiki:
    - "en:History of gunpowder"
    - "en:Thunderclap bomb"
    - "en:Fire lance"
  text: |
    **Krut** är en blandning av salpeter (kaliumnitrat), svavel och träkol. Salpetern avger syre när den hettas upp, så blandningen kan brinna mycket snabbt utan tillgång till luft. Kinesiska alkemister upptäckte blandningen under första årtusendet, och den [första nedskrivna formeln](#wujing-zongyao-1044-forsta-nedskrivna) är från 1044. De tidiga blandningarna innehöll relativt lite salpeter och brann snarare än exploderade; de användes i brandpilar och brandbomber.

    Under 1200-talet ökade salpeterhalten och vapnen blev explosiva. Jindynastin, som styrde norra Kina och var grundad av jurchenfolket från Manchuriet, använde bomber med järnhölje – kallade ”himmelsskakande åska” – först mot Songdynastin och sedan mot mongolerna, särskilt vid belägringen av huvudstaden Kaifeng 1232. När höljet sprängdes slungades järnsplitter ut. Man använde också **eldlansar**: rör av bambu eller papper fyllda med krut som sprutade eld och projektiler – en direkt föregångare till geväret.

    Det räckte inte. Mongolerna [krossade Jin 1234](#mongoler-krossar-xi-xia-1227-och-jin) och tog själva över tekniken och de kinesiska ingenjörerna. Genom deras väldiga rike spreds kunskapen västerut, och några decennier senare [nådde krutet Europa](#krut-nar-europa).

treskiftesbruk-och-hjulplog-hojer:
  period: 1220
  label: "Treskiftesbruk och hjulplog höjer skördarna"
  title: "Treskiftesbruk och tung plog"
  wiki:
    - "en:Three-field system"
    - "en:Heavy plough"
  text: |
    Under högmedeltiden, ungefär 1000–1300, växte Europas befolkning kraftigt – grovt räknat från omkring 40 till omkring 75 miljoner. Det möjliggjordes av ett jordbruk som gav mer mat per hektar och per arbetare. Två tekniker var centrala.

    **Treskiftesbruket** delade byns åkrar i tre delar. Ett år såddes en del med höstsäd (vete eller råg), en med vårsäd (havre, korn) eller baljväxter som ärter och bönor, och den tredje fick ligga i träda (vila). Nästa år roterade man. I det äldre tvåskiftesbruket låg halva jorden i träda varje år; nu var det en tredjedel, så den odlade arealen ökade med ungefär en tredjedel. Baljväxterna binder dessutom kväve ur luften och gödslar marken, och havren kunde föda hästar.

    Den **tunga hjulplogen** hade ett vertikalt kniv-blad (en kultor) som skar jorden, en plogbill som skar under, och en vändskiva som vände tiran. Den äldre årdern bara rispade ytan och fungerade på lätta medelhavsjordar; hjulplogen klarade de tunga, fuktiga lerjordarna i Nordeuropa. Den krävde ofta sex till åtta dragdjur, vilket gynnade samarbete i byn och långa, smala tegar. Tillsammans med [hästselen](#hjulplog-och-hastsele-sprids-i-europa) och [vattenkvarnarna](#vattenkvarnar-sprids-i-europa) skapade detta ett överskott som försörjde städer, katedralbyggen och universitet – och en befolkning som gjorde [digerdöden](#digerdoden-1-3-av-europa-dor) så förödande när den kom.

kinesiska-raketer:
  period: 1240
  label: "Kinesiska raketer"
  title: "Kinesiska krutraketer"
  wiki:
    - "en:History of rockets"
    - "en:Fire arrow"
  text: |
    En **raket** drivs framåt av att den stöter ut gas bakåt; enligt principen om verkan och motverkan, som Newton formulerade på 1600-talet, får raketen då en lika stor knuff framåt. Den behöver ingen luft att ”trycka mot”, vilket är skälet till att raketer fungerar i rymden.

    De första raketerna var kinesiska. När man fyllde ett rör med [krut](#krut-i-kinesiska-vapen), öppet i ena änden, och fäste det på en pil eller pinne, fick man en ”eldpil” som flög av egen kraft. Exakt när det skedde är omdiskuterat eftersom ordet för brandpil användes både om pilar med brinnande krut och om självgående raketer, men under 1200-talet, i krigen mellan Song, Jin och mongolerna, fanns raketer med säkerhet. Under Mingdynastin byggdes ställ som sköt dussintals samtidigt och till och med tvåstegsraketer.

    Militärt var de oprecisa och användes mest för att skapa panik. Tekniken spreds via mongolerna och den arabiska världen till Europa och Indien. I Mysore i Indien utvecklades på 1780-talet raketer med järnhölje som besvärade britterna så mycket att engelsmannen William Congreve byggde vidare på dem. Den moderna rakettekniken med flytande bränsle började med Robert Goddard i USA 1926 och ledde till [Sputnik 1957](#sputnik-1957).

krut-nar-europa:
  period: 1240
  label: "krut når Europa"
  title: "Krutet når Europa"
  wiki:
    - "en:History of gunpowder"
    - "en:Gunpowder"
  text: |
    **Krut** – en blandning av salpeter, svavel och träkol – hade använts i kinesiska vapen i över två hundra år när kunskapen nådde Europa omkring mitten av 1200-talet. Vägen gick sannolikt genom det mongoliska riket, som från 1220-talet sträckte sig från Kina till Östeuropa. Mongolerna använde [kinesiska krutvapen](#kinesiska-krutbomber-mot-mongolerna) och kinesiska ingenjörer i sina fälttåg, bland annat när de [anföll Polen och Ungern 1241](#mongoler-i-polen-och-ungern-1241); om krut användes där är dock omstritt. Handelsvägarna längs Sidenvägen var också öppna för köpmän och sändebud, som kan ha fört med sig kunskapen.

    Den svåra delen var **salpetern** (kaliumnitrat). Den bildas när organiskt material som gödsel och urin bryts ner, och måste utvinnas ur jord och renas. Utan tillräckligt ren salpeter brinner blandningen bara. Därför dröjde det innan européerna kunde tillverka verkningsfullt krut i större mängder.

    De första europeiska beskrivningarna är från 1260-talet, se [Bacons krutrecept](#krutrecept-i-europa-bacon-1267). Till en början var krut mest fyrverkeri och kuriositet. Kanoner dyker upp på bild först [1326](#kanoner-avbildas-forsta-gangen-1326), och under de följande två hundra åren förändrade krutvapnen krigföringen: borgmurar blev sårbara, och stater som hade råd med artilleri fick ett försprång.

krutrecept-i-europa-bacon-1267:
  period: 1260
  label: "Krutrecept i Europa (Bacon ~1267)"
  title: "Bacons krutrecept"
  wiki:
    - "en:Roger Bacon"
    - "en:History of gunpowder"
  text: |
    Omkring 1267 beskrev den engelske franciskanermunken [Roger Bacon](#roger-bacon-experiment-linser) i sina skrifter till påven en leksak som fanns ”i många delar av världen”: ett pulver av salpeter och andra ämnen i ett pergamentrör stort som ett finger ger en knall som överröstar åska och en blixt starkare än blixten. Det är en av de äldsta europeiska beskrivningarna av krut.

    Det sägs ofta att Bacon gömde ett exakt recept i ett chiffer – sju delar salpeter, fem delar hassel-träkol och fem delar svavel. Den uppgiften kommer från en senare text, och tolkningen bygger på att en 1900-talsforskare dechiffrerade ett anagram; den anses i dag osäker. Bacon själv uppfann alltså inte krutet och gav inte heller en säker formel. Andra europeiska recept från ungefär samma tid finns i en latinsk samling tillskriven ”Marcus Graecus”.

    Som jämförelse hade Kina en [nedskriven krutformel redan 1044](#wujing-zongyao-1044-forsta-nedskrivna), och Bacons omnämnande av leksaker i ”många delar av världen” antyder att kunskapen kommit utifrån. Det effektiva svartkrut som användes i senare tiders vapen består av ungefär 75 % salpeter, 15 % träkol och 10 % svavel. Inom sextio år fanns de [första kanonerna](#kanoner-avbildas-forsta-gangen-1326) i Europa.

glasogon-uppfinns-1286-2:
  period: 1280
  label: "Glasögon uppfinns ~1286"
  title: "Glasögonen"
  wiki:
    - "sv:Glasögon"
    - "en:Glasses"
  text: |
    Glasögonen uppfanns i norra Italien, troligen i Pisa eller Venedig, omkring 1286. Belägget är en predikan i Florens 1306 av dominikanermunken Giordano da Pisa, som säger att det ännu inte gått tjugo år sedan konsten att göra glasögon upptäcktes och att han själv träffat uppfinnaren. Vem det var vet man inte; namn som tillskrivits uppfinningen, till exempel Salvino degli Armati, bygger på senare förfalskningar.

    De första glasögonen hade två **konvexa linser** – utåtbuktande, tjockare på mitten – i ramar av ben, metall eller trä, nitade ihop och balanserade på näsan. Konvexa linser samlar ljuset och hjälper mot **ålderssynthet**, att ögats egen lins efter ungefär 45 års ålder blir stelare och inte längre kan ställa in skärpan på nära håll. Konkava linser mot närsynthet dök upp först på 1400-talet. Grunden var dels optikteori från [Roger Bacon](#roger-bacon-experiment-linser) och hans föregångare, dels venetianska glasmakares skicklighet med klart glas.

    Effekten var stor: skrivare, munkar och hantverkare kunde fortsätta läsa och göra precisionsarbete i decennier längre. Linsslipningen utvecklades till ett hantverk, och tre hundra år senare satte nederländska glasögonmakare ihop två linser och fick [mikroskopet](#mikroskop-1590) och [teleskopet](#teleskopet-1608).

mekaniska-ur-med-spindelgang:
  period: 1280
  label: "mekaniska ur med spindelgång"
  title: "Det mekaniska uret och spindelgången"
  wiki:
    - "en:Verge escapement"
    - "en:History of timekeeping devices"
  text: |
    Ett mekaniskt ur behöver tre delar: en energikälla, ett kugghjulsverk som räknar och driver visare, och en **gång** – en mekanism som släpper fram energin i små, jämna steg. I de första europeiska uren, från omkring 1270–1300, var energikällan ett fallande lod på ett snöre lindat kring en trumma. Utan broms skulle lodet bara rasa; gången gör att det sjunker ryckvis med ett jämnt tempo.

    **Spindelgången** (verge escapement) består av ett kronhjul med sågtandade kuggar och en lodrät axel, spindeln, med två små flikar (paletter). Kronhjulet trycker undan den ena paletten, spindeln vrider sig, den andra paletten hakar i en kugg på motsatta sidan och skjuts i sin tur undan. Ovanpå spindeln sitter en vågrät balk med vikter, en *foliot*, vars tröghet bestämmer takten. Varje fram-och-tillbaka-svängning släpper fram en kugg: en ”tick-tack”.

    Noggrannheten var dålig, ofta en kvarts timme per dag eller mer, eftersom foliotens takt beror på drivkraften och friktionen. Tidigare [vattenur](#kinesiska-vattenklockor), som [Su Songs klocktorn](#su-songs-klocktorn-forsta-kanda) i Kina 1092, hade en annan sorts gång driven av vatten. Den mekaniska gången var ändå det avgörande steget: den gjorde tid till något som maskiner mäter i diskreta steg, en idé som återkommer i varje dators klocksignal. Precisionen kom 1656 med [Huygens pendelur](#huygens-pendelur), som förbättrade noggrannheten till omkring 15 sekunder per dag.

mekaniska-kyrkur:
  period: 1300
  label: "Mekaniska kyrkur"
  title: "Kyrkornas mekaniska ur"
  wiki:
    - "en:History of timekeeping devices"
    - "en:Salisbury Cathedral clock"
  text: |
    Under början av 1300-talet installerades [mekaniska ur med spindelgång](#mekaniska-ur-med-spindelgang) i kyrktorn, kloster och katedraler runt om i Europa. De första hade ofta ingen urtavla alls: de slog en klocka för att markera tiden, och ordet för ur på flera språk (engelska *clock*, franska *cloche*) kommer från ordet för klocka. Bland tidiga exempel finns Sankt Eustorgio i Milano (omkring 1309) och katedralerna i Norwich och Salisbury; Salisbury-uret från omkring 1386 går fortfarande.

    Uren drevs av tunga lod och hade järnkugghjul smidda för hand. De var dyra prestigeprojekt för städer och kyrkor. Mot slutet av århundradet kom astronomiska ur som också visade månfaser och planeternas lägen, till exempel [Dondis astrarium 1364](#dondis-astrarium-1364).

    Uret ändrade hur tid uppfattades. Tidigare delades dygnet i kanoniska timmar efter klostrens böner, och ”timmarna” var olika långa beroende på årstid eftersom dagen delades i tolv lika delar mellan soluppgång och solnedgång. Mekaniska ur räknade jämnlånga timmar, och i städerna började arbete, marknader och möten styras av urets slag. Noggrannheten var låg – avvikelser på en kvart om dygnet var vanliga – men tekniken förbättrades ständigt och ledde till fjäderdrivna [bärbara ur](#barbart-ur-henlein) på 1500-talet.

kanoner-avbildas-forsta-gangen-1326:
  period: 1320
  label: "Kanoner avbildas första gången 1326"
  title: "De första bilderna av kanoner"
  wiki:
    - "en:Milemete Guns"
    - "en:History of cannon"
  text: |
    År 1326 skrev engelsmannen Walter de Milemete en handskrift om kungars plikter till den blivande Edvard III. I marginalen finns en målning av ett vasformat metallkärl liggande på en bänk, med en stor pil i mynningen och en riddare som tänder krutet med en glödande stav. Det är den äldsta kända europeiska bilden av en **kanon**. Samma år nämns i ett dokument från Florens kanoner och järnkulor för stadens försvar.

    Principen är enkel: krut i ett slutet rör förbränns och bildar snabbt stora mängder het gas som driver ut projektilen. Svårigheten var materialet. Röret måste tåla ett mycket högt tryck, och de tidiga kanonerna var små och ofta farligare för skytten än för målet. Kina var före: en bronskanon daterad 1288 har hittats i Manchuriet, och de kinesiska [eldlansarna](#kinesiska-krutbomber-mot-mongolerna) var föregångare.

    Kanonerna spreds snabbt: de användes i ett slag mellan engelsmän och fransmän [vid Crécy 1346](#kanoner-vid-crecy-1346), men mer för skräck än verkan. Under 1400-talet blev de stora och kraftfulla nog att rasera medeltida borgmurar; när osmanerna [intog Konstantinopel 1453](#mehmed-ii-tar-konstantinopel-1453) använde de jättekanoner. Det tvingade fram nya fästningar med låga, tjocka vallar och gynnade kungar som kunde finansiera artilleri framför lokala adelsmän.

kanoner-vid-crecy-1346:
  period: 1340
  label: "Kanoner vid Crécy 1346"
  title: "De första kanonerna på ett europeiskt slagfält"
  wiki:
    - "sv:Slaget vid Crécy"
    - "en:History of cannon"
  text: |
    Slaget vid Crécy i norra Frankrike 1346 var ett av de stora slagen i [hundraårskriget](#hundraarskriget-borjar-1337) mellan England och Frankrike. Engelsmännen under kung Edvard III vann främst tack vare sina långbågsskyttar, men flera samtida krönikor (bland annat den florentinske köpmannen Giovanni Villani) uppger att engelsmännen också hade några små kanoner med sig. Uppgiften är omdiskuterad, men Crécy brukar räknas som ett av de första slagfält i Europa där krutvapen användes.

    En tidig kanon var i princip ett rör av gjutet brons eller hopsmitt järn, stängt i ena änden. Man fyllde det med krut – en blandning av salpeter (kaliumnitrat, ca 75 %), träkol och svavel som brinner explosivt utan tillgång till luft – och en sten- eller järnkula, och tände genom ett litet hål. Krutet var uppfunnet i Kina flera hundra år tidigare och hade nått Europa på 1200-talet ([krut når Europa](#krut-nar-europa)); den äldsta europeiska bilden av en kanon är från [1326](#kanoner-avbildas-forsta-gangen-1326).

    År 1346 var kanonerna mest skrämmande buller med liten träffsäkerhet. Men tekniken utvecklades snabbt: under 1400-talet blev belägringskanonerna så stora att de kunde skjuta sönder medeltida stadsmurar, vilket avgjorde [Konstantinopels fall 1453](#mehmed-ii-tar-konstantinopel-1453). Det gjorde riddarborgar föråldrade och gynnade stater med pengar nog att köpa artilleri.

dondis-astrarium-1364:
  period: 1360
  label: "Dondis astrarium 1364"
  title: "Dondis astrarium: ett mekaniskt solsystem"
  wiki:
    - "en:Giovanni Dondi dell'Orologio"
    - "en:Astrarium"
  text: |
    Giovanni de' Dondi (ca 1330–1388) var läkare och astronom i Padua i norra Italien. Han arbetade i omkring 16 år (ca 1348–1364) på ett **astrarium**: ett urverk som inte bara visade tiden utan också var på himlen solen, månen och de fem då kända planeterna befann sig, plus en kalender med kyrkans rörliga högtider.

    Maskinen var omkring en meter hög, med sju urtavlor, och drevs av ett viktdrivet urverk av samma slag som de nya [mekaniska uren med spindelgång](#mekaniska-ur-med-spindelgang) (en mekanism som släpper fram kugghjulet ett steg i taget och därmed reglerar farten). Dondi använde över hundra kugghjul, en del med ovanliga former, för att efterlikna de krångliga planetbanorna i Ptolemaios jordcentrerade modell från [Almagest](#gerhard-av-cremona-oversatter-ptolemaios), där planeter rör sig i cirklar på cirklar (epicykler). Han lämnade en detaljerad beskrivning med ritningar; originalet har gått förlorat, men flera rekonstruktioner har byggts efter den.

    Astrariet visar att europeisk finmekanik redan på 1300-talet kunde modellera matematiska teorier i metall – ett slags analog dator. Den närmaste föregångaren är [Su Songs astronomiska klocktorn](#su-songs-klocktorn-forsta-kanda) i Kina på 1000-talet, och längre bak den grekiska Antikythera-mekanismen.

masugnar-sprids-i-europa:
  period: 1380
  label: "Masugnar sprids i Europa"
  title: "Masugnen: smält järn i stor skala"
  wiki:
    - "sv:Masugn"
    - "en:Blast furnace"
  text: |
    Före masugnen framställdes järn i små blästerugnar: järnmalm och träkol upphettades till omkring 1 200 °C, inte tillräckligt för att smälta järnet. Man fick en svampig klump (lupp) som smiddes för att pressa ut slaggen. Det gav bara några tiotal kilo åt gången.

    En **masugn** är ett högt schakt där malm, träkol och kalksten fylls på uppifrån medan kraftiga bälgar, drivna av vattenhjul, blåser luft underifrån. Temperaturen blir så hög att järnet tar upp kol och smälter; ut rinner flytande **tackjärn** med ca 4 % kol. Tackjärnet är hårt och sprött men kan gjutas – till exempel till kanonkulor och kanoner – eller färskas (kolet bränns bort) till smidbart järn. En masugn producerade vida mer än en blästerugn och kunde gå dygnet runt i månader.

    Kina hade gjutjärn sedan ca 500 f.Kr. I Europa är Lapphyttan i Västmanland, från ca 1200-talet, en av de äldsta kända masugnarna, och tekniken spreds på 1300–1400-talen i bland annat Rhenlandet, Liège och Sverige. Den förutsatte [vattenkraft](#vattenkvarnar-sprids-i-europa) och enorma mängder träkol, vilket ledde till skogsskövling; lösningen blev senare [koks i masugnen 1709](#koks-i-masugnen-1709). Att göra stål billigt lyckades först med [Bessemer 1856](#bessemerstal-1856).

hakebossor:
  period: 1380
  label: "hakebössor"
  title: "Hakebössan: det första handeldvapnet"
  wiki:
    - "en:Arquebus"
    - "sv:Hakebössa"
  text: |
    En hakebössa (på tyska *Hakenbüchse*, därav engelskans *arquebus*) var ett tidigt handeldvapen: ett kort järn- eller bronsrör på en trästock. Namnet kommer av en hake under pipan som man hakade fast mot en mur eller ett stöd för att ta upp rekylen, eftersom vapnet var tungt och kraftigt.

    De första handeldvapnen kring 1350–1400 avfyrades genom att man för hand höll en glödande lunta (en långsamt brinnande snodd) mot ett krutfyllt tändhål. Under 1400-talet kom luntlåset: en S-formad arm som med ett avtryckarliknande handtag förde luntan ner i krutpannan. Då kunde skytten hålla blicken på målet. Räckvidden var kort och omladdningen tog en minut eller mer – en långbåge sköt mångdubbelt snabbare – men en bössa krävde bara några veckors träning, medan en bågskytt tränades i åratal.

    Hakebössorna fortsatte den utveckling som började med de första [kanonerna](#kanoner-vid-crecy-1346). De ledde till [hjullåsgevär](#hjullasgevar) och musköter, som spreds över världen – till exempel till Japan med [portugiserna 1543](#portugiser-pa-tanegashima-1543-muskoter) – och gjorde till slut rustningar och riddare militärt överflödiga.

zheng-hes-jatteskepp:
  period: 1400
  label: "Zheng Hes jätteskepp"
  title: "Zheng Hes skattskepp"
  wiki:
    - "sv:Zheng He"
    - "en:Chinese treasure ship"
  text: |
    Zheng He (1371–1433) var en muslimsk eunuck och amiral i Kinas Mingdynasti. Mellan 1405 och 1433 ledde han sju stora expeditioner över Indiska oceanen till Sydostasien, Indien, Arabiska halvön och Östafrika ([Zheng Hes flottor](#zheng-hes-flottor-140533)). En typisk flotta bestod av omkring 250–300 fartyg och ca 27 000 man.

    De största fartygen, "skattskeppen", beskrivs i senare kinesiska källor som omkring 120–130 meter långa med nio master. Många forskare anser det tekniskt orimligt för träskepp och tror att de snarare var ca 60–70 meter – men även det var mycket stort. Som jämförelse var Columbus flaggskepp Santa María 1492 knappt 25 meter. Kinesiska skepp hade tekniker som Europa saknade eller fick senare: vattentäta skott (avdelningar som hindrar att ett läckage sänker hela skeppet), [akterroder](#akterroder) och [magnetkompass](#magnetkompass-for-navigation-kina-1090).

    Syftet var inte erövring eller handel i europeisk mening utan att visa kejsarens makt och ta emot tribut. Efter 1433 lades expeditionerna ner ([Ming upphör med flottexpeditionerna](#ming-upphor-med-flottexpeditionerna-1433)), och några årtionden senare var det i stället de små portugisiska karavellerna som öppnade sjövägen mellan Europa och Asien.

brunelleschis-kupol-i-florens-142036:
  period: 1420
  label: "Brunelleschis kupol i Florens 1420–36"
  title: "Brunelleschis kupol: ingenjörskonst utan ställning"
  wiki:
    - "sv:Florens domkyrka"
    - "en:Brunelleschi's Dome"
  text: |
    Katedralen Santa Maria del Fiore i Florens hade sedan 1300-talet en öppning för en kupol som ingen visste hur man skulle bygga: ett åttahörnigt hål ca 45 meter brett, högt ovanför marken. Det fanns inte trä nog för en vanlig byggställning av den storleken. 1418 vann Filippo Brunelleschi (1377–1446), ursprungligen guldsmed, tävlingen om uppdraget, och kupolen byggdes 1420–36.

    Hans lösningar: två skal, ett inre bärande och ett yttre lättare, med gångar emellan, vilket minskade vikten. Teglet murades i ett fiskbensmönster så att varje varv bar sig självt medan murbruket härdade, och ringar av sten, järn och trä höll emot de krafter som annars tryckt isär kupolen. Han konstruerade också nya lyftmaskiner, bland annat en oxdriven vinsch med växel så att lasten kunde vändas mellan upp och ner utan att vända oxarna. Kupolen väger enligt uppskattningar omkring 37 000 ton.

    Det är fortfarande världens största murade kupol, något större än Pantheon i Rom (ca 43 m, gjuten betong). Kupolen blev en symbol för renässansen och för ingenjören som kreativ uppfinnare; gotiska byggare ([gotisk byggteknik](#gotisk-byggteknik-spetsbage-stravpelare)) använde i stället strävpelare utanför väggarna. Brunelleschi ritade också [Ospedale degli Innocenti](#stadssjukhus-ospedale-degli-innocenti) och formulerade reglerna för centralperspektiv i måleriet.

gutenbergs-tryckpress-1450:
  period: 1440
  label: "Gutenbergs tryckpress ~1450"
  title: "Gutenbergs tryckpress"
  wiki:
    - "sv:Johannes Gutenberg"
    - "en:Printing press"
  text: |
    Johannes Gutenberg (ca 1400–1468) var guldsmed i Mainz i Tyskland. Omkring 1450 hade han utvecklat ett komplett system för att trycka böcker med **lösa typer**: separata metallbokstäver som sätts ihop till sidor, trycks, och sedan återanvänds. Hans bibel, med 42 rader per sida, blev klar ca 1455 i uppskattningsvis 180 exemplar.

    Uppfinningen bestod av flera delar: ett handgjutinstrument där typer kunde gjutas snabbt och exakt lika höga; en legering av bly, tenn och antimon som smälte lätt men blev hård; ett oljebaserat bläck som fastnade på metall; och en skruvpress lånad från vin- och papperstillverkning. Det var den kombinerade processen, inte en enskild idé, som var nyskapande.

    Lösa typer fanns tidigare i Asien – [Bi Sheng](#bi-sheng-losa-typer-1040) i Kina på 1040-talet med lertyper, och metalltyper i Korea på 1200–1300-talet – men med tusentals kinesiska tecken var vinsten liten. Med ett alfabet på några dussin tecken blev metoden mycket effektiv. Inom 50 år fanns [tryckerier i 250 städer](#tryckerier-i-250-stader-ar-1500), och tryckpressen gjorde det möjligt för [Luthers teser](#luther-95-teser-1517) att spridas över Europa på veckor. Jämförelsen med internet är vanlig: ett nytt medium som sänkte kostnaden för att kopiera och sprida text dramatiskt.

tryckerier-i-250-stader-ar-1500:
  period: 1460
  label: "Tryckerier i 250 städer år 1500"
  title: "Tryckkonsten exploderar: 250 städer på 50 år"
  wiki:
    - "sv:Inkunabel"
    - "en:Global spread of the printing press"
  text: |
    Efter att [Gutenberg](#gutenbergs-tryckpress-1450) visat metoden i Mainz spreds den med tyska boktryckare som flyttade: Rom 1467, Venedig 1469, Paris 1470, London 1476 ([Caxton](#caxton-trycker-i-london-1476)), Stockholm 1483. Omkring år 1500 fanns tryckerier i uppskattningsvis 250 städer, och Venedig var med ett hundratal tryckare Europas boktryckarhuvudstad.

    Böcker tryckta före 1501 kallas **inkunabler** (av latin för "vagga"). Man räknar med omkring 30 000 olika utgåvor och i storleksordningen 10–20 miljoner exemplar under dessa 50 år – fler böcker än som troligen hade kopierats för hand i Europa under hela medeltiden. Priset på en bok sjönk kraftigt, och identiska exemplar gjorde det möjligt att hänvisa till "sidan 42", rätta fel i nya upplagor och bygga vidare på exakta texter, tabeller och bilder.

    Särskilt viktigt för vetenskapen var att siffertabeller och diagram nu kunde återges utan avskrivningsfel. Tryckt matematik ([Paciolis Summa](#pacioli-summa-1494-dubbel-bokforing)), medicin ([de första tryckta medicinska böckerna](#forsta-tryckta-medicinska-bockerna)) och astronomi nådde hela Europa. Ett par decennier senare möjliggjorde trycket reformationen.

karavellen-och-astrolabium-pa-havet:
  period: 1480
  label: "Karavellen och astrolabium på havet"
  title: "Karavellen och sjöastrolabiet"
  wiki:
    - "sv:Karavell"
    - "en:Mariner's astrolabe"
  text: |
    En **karavell** var ett litet, snabbt segelfartyg, typiskt 20–30 meter långt, som portugiserna utvecklade på 1400-talet för att utforska Afrikas västkust. Den hade grunt djupgående och oftast trekantiga latinsegel, lånade från arabisk sjöfart. Sådana segel gjorde att fartyget kunde segla betydligt närmare vinden än de fyrkantsriggade skeppen, vilket behövdes för att ta sig hem mot de förhärskande nordliga vindarna längs Afrika. [Columbus](#columbus-1492) två mindre skepp 1492, Niña och Pinta, var karaveller.

    Ute på öppet hav behövde man veta sin position. **Latituden** (avståndet norr–söder om ekvatorn) kan bestämmas ur solens eller polstjärnans höjd över horisonten. Portugiserna förenklade det tunga och komplexa [astrolabiet](#chaucer-traktat-om-astrolabium-1391) till ett sjöastrolabium: en tung mässingsring med gradskala och ett vridbart sikte, öppen så att vinden inte skulle få den att svänga. Tillsammans med tabeller över solens höjd vid olika datum kunde man räkna ut latituden till ungefär en grads noggrannhet.

    Detta gjorde att [Vasco da Gama](#vasco-da-gama-i-calicut-1498) kunde segla runt Afrika till Indien 1498. Longituden (öst–väst) gick däremot inte att mäta till sjöss förrän med [Harrisons kronometer](#harrisons-h4-loser-longitudproblemet) på 1760-talet.

barbart-ur-henlein:
  period: 1500
  label: "Bärbart ur (Henlein)"
  title: "Henlein och det bärbara uret"
  wiki:
    - "sv:Peter Henlein"
    - "en:Watch"
  text: |
    Peter Henlein (ca 1485–1542) var en låssmed i Nürnberg som omkring 1510 gjorde små bärbara ur – i en samtida skrift beskrivna som ur som går 40 timmar och kan bäras i en börs. Han tillskrivs ofta uppfinningen av fickuret, men flera hantverkare arbetade med samma sak vid samma tid, och de så kallade "Nürnbergägg" (avlånga ur som bars i halsen) kom något senare.

    Tekniken som gjorde det möjligt var **drivfjädern**. Tidigare [tornur](#mekaniska-kyrkur) drevs av fallande vikter, vilket kräver att uret står stilla och har höjd. En hoprullad stålfjäder lagrar i stället energi när den spänns och kan ligga ner i en liten dosa. Problemet är att fjäderns kraft avtar när den slappnar av, så uret saktade in; lösningar som stackfreed och senare snäcka (en konisk spole som jämnar ut kraften) användes.

    De tidiga bärbara uren var dyra statusföremål med ofta bara timvisare och kunde gå fel en kvart eller mer per dag. Precisionen kom först när [Huygens](#huygens) på 1670-talet uppfann balanshjul med spiralfjäder, som ger en jämn svängning. Den vägen ledde till [Harrisons marina kronometer](#harrisons-h4-loser-longitudproblemet) och till armbandsur.

hjullasgevar:
  period: 1500
  label: "hjullåsgevär"
  title: "Hjullåset: gevär utan glödande lunta"
  wiki:
    - "sv:Hjullås"
    - "en:Wheellock"
  text: |
    Tidiga handeldvapen, som [hakebössorna](#hakebossor), avfyrades med en glödande lunta. Det var opraktiskt: luntan kunde slockna i regn, glödet syntes i mörker och den var farlig nära krutförråd. Omkring 1500 kom **hjullåset**, som skapade gnistor mekaniskt i stället.

    Principen liknar en modern tändare. Ett stålhjul med räfflad kant dras upp med en nyckel så att en fjäder spänns. En hane håller en bit svavelkis (pyrit) mot hjulet. När man trycker av släpps fjädern, hjulet snurrar mot stenen och gnistorna antänder krutet i krutpannan. Skisser av en liknande mekanism finns i Leonardo da Vincis anteckningar från ca 1500, och tekniken utvecklades i södra Tyskland, troligen Nürnberg.

    Hjullåset gjorde det möjligt att bära ett laddat vapen redo att skjuta, och därmed pistolen – ett vapen för ryttare som kunde avfyras med en hand. Men mekanismen var finmekanik, ungefär lika krånglig som ett ur, och därför dyr. Infanteriet behöll de billigare luntlåsmusköterna; under 1600-talet ersattes båda av det enklare flintlåset, där en flinta slår mot ett stålstycke. Flintlåset dominerade sedan till 1800-talet.

gruvteknik-i-tyskland-och-sachsen:
  period: 1520
  label: "Gruvteknik i Tyskland och Sachsen"
  title: "Djupa gruvor i Sachsen och Böhmen"
  wiki:
    - "en:Ore Mountains"
    - "en:History of mining"
  text: |
    Kring 1500 upplevde gruvdriften i Centraleuropa en boom. I Erzgebirge (Malmbergen) på gränsen mellan Sachsen och Böhmen, och i Tyrolen och Harz, hittades stora silver- och kopparfyndigheter. Nya gruvstäder som Annaberg (1496) och Joachimsthal växte fram på några år. Silver från Joachimsthal präglades till stora mynt kallade *Joachimsthaler*, förkortat *thaler* – därifrån kommer orden daler och dollar.

    När gruvorna blev djupare blev de tekniska problemen större: vattnet trängde in och malmen måste lyftas hundratals meter. Lösningen var maskiner drivna av vattenhjul och hästvandringar: pumpar med kolvar i rad (pumpstänger), lyftverk med kedjor och kärl, och bälgar för ventilation. Man drev också långa avvattningsstollar, tunnlar som ledde ut vattnet. Gruvbolagen var ofta organiserade med andelar (kuxe), en tidig form av aktiebolag, och finansierades av storbanker som [Fugger](#fuggers-bankimperium).

    Tekniken beskrevs utförligt med träsnitt av Georgius Agricola i [De re metallica 1556](#agricola-de-re-metallica-1556), som blev standardverket i 200 år. Tyska bergsmän spreds till gruvor i hela Europa, även Sverige. Problemet med att pumpa ut vatten ur djupa gruvor var också det som drev fram de första ångmaskinerna, som [Saverys ångpump 1698](#saverys-angpump-1698).

agricola-de-re-metallica-1556:
  period: 1540
  label: "Agricola: De re metallica 1556"
  title: "Agricola: gruvteknikens handbok"
  wiki:
    - "en:De re metallica"
    - "en:Georgius Agricola"
  text: |
    **Georgius Agricola** (latiniserat namn för Georg Bauer, 1494–1555) var en tysk läkare som arbetade i silvergruvstäderna i Erzgebirge i Böhmen och Sachsen, Europas dåtida centrum för [gruvteknik](#gruvteknik-i-tyskland-och-sachsen). Han ska inte förväxlas med finländaren Mikael Agricola, som gjorde den [finska bibelöversättningen](#agricola-finsk-bibel).

    *De re metallica* ("Om metallerna"), utgiven året efter hans död, beskriver i tolv delar hela kedjan: att leta malm, bryta den, pumpa ut vatten, ventilera gruvor, krossa, tvätta och smälta malm samt analysera metallhalter. Boken har omkring 290 träsnitt som visar maskinerna i detalj: vattenhjul och hästvandringar som driver kolvpumpar och kedjepumpar, bälgar för ventilation, smältugnar.

    Den var standardverk i ungefär två hundra år och är en tidig teknisk manual i modern mening: konkret, illustrerad och baserad på observation snarare än antika auktoriteter. Den beskriver också arbetarnas sjukdomar. Gruvornas ständiga problem med vatten blev senare drivkraften bakom de första ångmaskinerna, till exempel [Saverys ångpump](#saverys-angpump-1698). En kuriositet: den första engelska översättningen (1912) gjordes av den blivande amerikanske presidenten Herbert Hoover, som var gruvingenjör, och hans fru Lou Henry Hoover.

mercatorprojektionen-1569-2:
  period: 1560
  label: "Mercatorprojektionen 1569"
  same_as: mercatorprojektionen-1569

strumpvavstol-1589:
  period: 1580
  label: "Strumpvävstol 1589"
  title: "Strumpstolen: den första stickmaskinen"
  wiki:
    - "en:Stocking frame"
    - "en:William Lee (inventor)"
  text: |
    År 1589 byggde **William Lee**, en engelsk präst i byn Calverton nära Nottingham, en maskin som stickade: strumpstolen. Enligt traditionen inspirerades han av att se en kvinna sticka för hand. Maskinen hade en rad krokförsedda nålar, en för varje maska i en rad, så att en hel rad maskor bildades i en rörelse i stället för en åt gången. Det gjorde den många gånger snabbare än handstickning.

    Lee sökte patent hos drottning Elisabet I men fick avslag. Ett skäl som brukar anges är att hon fruktade att de många handstickerskorna skulle bli arbetslösa; ett annat att de första strumporna var grova i ull, medan hon ville ha siden. Lee flyttade till Frankrike för att få stöd där. Konstruktionen förbättrades och användes, i grunden oförändrad, i över två hundra år.

    Strumpstolen räknas som en av de första textilmaskinerna och ett tidigt exempel på mekanisering av hantverk. Den föregick industrialiseringens textilmaskiner som [den flygande skytteln](#kays-flygande-skyttel-1733) och [spinning jenny](#spinning-jenny-1764). Frågan Elisabet ställde, om maskiner tar jobb, återkom när arbetare på 1810-talet krossade just strumpstolar i Nottingham, och den diskuteras än i dag kring automation.

mikroskop-1590:
  period: 1580
  label: "mikroskop ~1590"
  title: "Det sammansatta mikroskopet"
  wiki:
    - "en:Microscope"
    - "en:Zacharias Janssen"
  text: |
    Omkring 1590 dök det upp instrument i Nederländerna där två linser i ett rör förstorade små föremål. Uppfinningen tillskrivs ofta glasögonmakarna Hans och Zacharias Janssen i Middelburg, men källäget är osäkert och uppgifterna kommer delvis från långt senare vittnesmål. Det var samma glasögonmakarmiljö som strax efter gav [teleskopet](#teleskopet-1608), och båda byggde på konsten att slipa linser som funnits sedan [glasögonen uppfanns](#glasogon-uppfinns-1286-2) kring 1286.

    Principen i ett sammansatt mikroskop är att en objektivlins nära föremålet ger en förstorad bild som en andra lins, okularet, förstorar ytterligare. De första instrumenten förstorade bara några gånger, kanske upp till omkring tio, och bilden var suddig och hade färgkanter eftersom linserna inte var perfekta. Ordet "mikroskop" myntades i Rom 1625 för ett instrument som Galilei byggt.

    Det verkliga genombrottet kom i mitten av 1600-talet. [Hookes Micrographia](#hookes-micrographia-1665) visade en ny värld av små strukturer, och [Leeuwenhoek](#leeuwenhoek-bakterier-1676) såg bakterier med ett enkelt mikroskop med en enda, mycket liten lins. Sammansatta mikroskop blev överlägsna först på 1800-talet, när man lärde sig korrigera linsfelen.

teleskopet-1608:
  period: 1600
  label: "Teleskopet 1608"
  title: "Teleskopet uppfinns"
  wiki:
    - "en:History of the telescope"
    - "en:Hans Lipperhey"
  text: |
    I oktober 1608 sökte **Hans Lipperhey**, en tyskfödd glasögonmakare i Middelburg i Nederländerna, patent hos generalstaterna (republikens styrande församling) på ett rör med två linser som fick avlägsna saker att se närmare ut. Inom några veckor gjorde åtminstone en annan holländare liknande anspråk, och patentet avslogs eftersom uppfinningen uppenbarligen redan var känd. Vem som verkligen var först är oklart.

    Det första teleskopet hade en konvex (utåtbuktande) objektivlins framtill, som samlar ljuset, och en konkav (inåtbuktande) okularlins vid ögat. Det förstorade ungefär tre gånger och gav en upprättstående bild. Det var användbart till lands och till sjöss: man kunde se fientliga skepp eller trupper innan de själva såg en, något som intresserade en republik mitt i frihetskriget mot Spanien.

    Nyheten spreds på månader över Europa. [Galilei](#galileis-teleskop) förbättrade instrumentet och vände det mot himlen 1609. Kepler föreslog 1611 en konstruktion med två konvexa linser som gav större synfält, och den blev standard i astronomin. Linserna gav färgkanter, ett problem [Newton](#newton-gravitation-och-prisman-1666) gick runt genom att bygga ett spegelteleskop. Teleskopet kom ur samma linsslipartradition som [mikroskopet](#mikroskop-1590).

hollandska-fluitskepp:
  period: 1600
  label: "holländska fluitskepp"
  title: "Fluitskeppet: lastbil på havet"
  wiki:
    - "en:Fluyt"
  text: |
    Fluiten (holländska *fluyt*) var ett handelsfartyg som utvecklades i Nederländerna kring 1590–1600, med staden Hoorn som tidigt centrum. Den var konstruerad för en sak: att frakta så mycket gods som möjligt så billigt som möjligt.

    Skrovet var långt, ungefär fyra till sex gånger längre än brett, med platt botten och rundad akter. Däcket var smalt längst upp, enligt en vanlig förklaring för att avgifterna i Öresund länge beräknades efter däckets bredd. Riggen var enkel och hade block och taljor som gjorde att ett fartyg på några hundra ton kunde seglas av kanske ett tiotal man, ungefär hälften av besättningen på jämförbara engelska fartyg. Fluiten var i regel obeväpnad eller lätt beväpnad. Varven i Zaan-området använde vinddrivna sågverk och standardiserade delar, vilket gjorde bygget snabbt och billigt.

    Fluiten blev ryggraden i den nederländska frakthandeln, särskilt i Östersjöhandeln med spannmål och virke, och bidrog till att Nederländerna blev 1600-talets ledande handelsmakt med [Ostindiska kompaniet](#voc-1602) och [Amsterdams börs](#amsterdams-bors). Jämfört med den tidigare [karavellen](#karavellen-och-astrolabium-pa-havet), byggd för upptäcktsresor, var fluiten byggd för effektiv massfrakt.

schickards-raknemaskin-1623:
  period: 1620
  label: "Schickards räknemaskin 1623"
  title: "Schickards räknemaskin"
  wiki:
    - "en:Wilhelm Schickard"
    - "en:Mechanical calculator"
  text: |
    **Wilhelm Schickard** (1592–1635) var professor i Tübingen i Tyskland och undervisade i hebreiska och astronomi. År 1623 skrev han till [Kepler](#kepler-1609) och beskrev en maskin han kallade "räkneuret", som kunde addera och subtrahera sexsiffriga tal automatiskt och hjälpa till med multiplikation. Det är den äldsta kända beskrivningen av en mekanisk räknemaskin.

    Maskinen hade två delar. Den övre var en mekaniserad version av [Napiers](#napier-logaritmer-1614) räknestavar, roterbara cylindrar med multiplikationstabeller som gav delprodukter. Den undre var ett adderverk med kugghjul, ett per siffra. När ett hjul gick från 9 till 0 flyttade en enkel kugge nästa hjul ett steg: en mekanisk minnessiffra (carry), samma sak som en heltalsadderare i en processor gör i dag. Om summan blev för stor ringde en klocka, en tidig överflödesindikator.

    Ett exemplar som beställts åt Kepler brann upp innan det levererats, och Schickard dog i pesten under [trettioåriga kriget](#trettioariga-kriget-1618). Maskinen glömdes bort, och breven och skisserna hittades först på 1900-talet; därför fick [Pascals maskin](#pascals-raknemaskin-1642) från 1642 länge äran som den första. Rekonstruktioner har visat att konstruktionen fungerar, även om carry-mekanismen hade begränsningar vid många samtidiga minnessiffror.

pascals-raknemaskin-1642:
  period: 1640
  label: "Pascals räknemaskin 1642"
  title: "Pascalinen"
  wiki:
    - "en:Pascal's calculator"
    - "sv:Blaise Pascal"
  text: |
    Som 18-åring, 1642, började [Blaise Pascal](#pascal-lufttryck) konstruera en räknemaskin för att hjälpa sin far, som var skatteintendent i Rouen och ägnade nätter åt att summera kolumner av belopp. Efter ett femtiotal prototyper presenterades maskinen, kallad pascalinen, 1645, och han fick 1649 ett kungligt privilegium, en sorts patent. Omkring tjugo exemplar byggdes och ett antal finns bevarade.

    Pascalinen var en låda med en rad hjul, ett per siffra, som man vred med en penna. Den kunde addera direkt; subtraktion gjordes med niokomplement, ett trick där man adderar talets komplement i stället, samma princip som datorer i dag använder (tvåkomplement) för att subtrahera med en adderare. Det viktigaste konstruktionsdetaljen var minnessiffran: en fallande vikt som förde över en etta till nästa hjul när ett hjul passerade 9, vilket fungerade även när många siffror slog om samtidigt (som 999 + 1). Maskinen hade också varianter för det franska myntsystemet med 20 sous per livre och 12 deniers per sou.

    Den var dyr och ömtålig och blev aldrig någon kommersiell framgång. Men den var den första räknemaskinen som var känd och spridd; [Schickards äldre maskin](#schickards-raknemaskin-1623) blev känd först på 1900-talet. [Leibniz](#leibniz-raknemaskin) byggde vidare och tillförde multiplikation. Programspråket Pascal (1970) är uppkallat efter honom.

luftpump:
  period: 1640
  label: "luftpump"
  title: "Luftpumpen"
  wiki:
    - "en:Vacuum pump"
    - "en:Robert Boyle"
  text: |
    En luftpump suger ut luft ur ett slutet kärl. Den första byggdes omkring 1650 av [Otto von Guericke](#guerickes-vakuum) i Magdeburg. Principen liknar en vattenpump: en kolv dras ut i en cylinder så att luft från kärlet strömmar in i cylindern; en ventil stängs, kolven trycks tillbaka och luften släpps ut. Varje slag tar bort en del av den kvarvarande luften, så att trycket sjunker steg för steg utan att någonsin nå noll.

    Guerickes pump var klumpig och krävde flera mans arbete. I England byggde **Robert Hooke**, då assistent, 1658–59 en förbättrad pump åt **Robert Boyle** (1627–1691), en irländsk adelsman och naturforskare. Den hade en glaskupa man kunde se in i och ställa föremål i. Boyle visade att en fjäder, ett ljus och ett djur påverkades av vakuumet, att ljud inte går genom tomrum och att föremål faller lika fort utan luft. Pumpen var dyr och svår att få tät, och bara ett fåtal fungerande exemplar fanns i Europa.

    Luftpumpen blev 1600-talets stora vetenskapliga instrument, som en partikelaccelerator i dag, och symbolen för den experimentella vetenskap som [Royal Society](#royal-society) förespråkade. Den ledde till [Boyles lag](#boyles-lag-1662), och i förlängningen vakuumtekniken bakom glödlampor, elektronrör och halvledartillverkning.

huygens-pendelur-2:
  period: 1660
  label: "Huygens pendelur"
  same_as: huygens-pendelur

hookes-micrographia-1665:
  period: 1660
  label: "Hookes Micrographia 1665"
  title: "Hookes Micrographia"
  wiki:
    - "en:Micrographia"
    - "sv:Robert Hooke"
  text: |
    **Robert Hooke** (1635–1703) var en engelsk naturforskare och uppfinnare, anställd som "experimentkurator" vid [Royal Society](#royal-society) med uppgift att visa nya experiment vid varje möte. Han hade tidigare byggt [luftpumpen](#luftpump) åt Robert Boyle. År 1665 gav han ut *Micrographia* ("Små teckningar"), den första stora boken om vad man ser i mikroskop.

    Boken innehåller 57 detaljerade kopparsticksbilder från hans eget sammansatta [mikroskop](#mikroskop-1590), som förstorade kanske 30–50 gånger: en lopps ben och hår, en flugas sammansatta öga med tusentals linser, en nålspets som såg grov och ojämn ut, iskristaller och mögel. Den mest berömda bilden är en hel lus, utvikbar och flera gånger större än boksidan. Bilderna var så slående att boken blev en bästsäljare; dagboksskrivaren Samuel Pepys skrev att han satt uppe till två på natten och läste den.

    I boken myntade Hooke ordet "cell" för de små rummen han såg i kork, se [Hookes celler](#hooke-celler-1665). Han diskuterade också fossil som rester av levande varelser och föreslog att ljus är en snabb vibration. *Micrographia* visade att det fanns en hel värld under synförmågans gräns, och inspirerade [Leeuwenhoek](#leeuwenhoek-bakterier-1676) att börja med sina egna, ännu skarpare observationer.

leibniz-raknemaskin:
  period: 1660
  label: "Leibniz räknemaskin"
  title: "Leibniz räknemaskin och trappvalsen"
  wiki:
    - "en:Stepped reckoner"
    - "en:Leibniz wheel"
  text: |
    [Gottfried Wilhelm Leibniz](#leibniz-kalkyl-1675) började på 1670-talet konstruera en räknemaskin som, till skillnad från [Pascals](#pascals-raknemaskin-1642), kunde multiplicera och dividera direkt. Han visade en trämodell för Royal Society i London 1673. Maskinen, kallad *Staffelwalze* på tyska ("trappvalsräknaren"), byggdes i ett par metallexemplar fram till omkring 1694; ett finns bevarat i Hannover.

    Uppfinningen som gick vidare var **trappvalsen** (Leibnizhjulet): en cylinder med nio kuggar av olika längd, från en kugge som går en niondel av längden till en som går hela vägen. Ett litet kugghjul som förs längs cylindern griper in i 0 till 9 kuggar beroende på läget. Siffran ställs in genom läget, och ett varv på veven adderar den siffran. Multiplikation blir upprepad addition med vev, kombinerad med en flyttbar del som skiftar ett decimalsteg, precis som skriftlig multiplikation. Mekanismen för minnessiffror var dock inte helt pålitlig.

    Trappvalsen användes i de första kommersiellt framgångsrika räknemaskinerna, Thomas de Colmars aritmometer från 1820, och i mekaniska räknare ända in på 1900-talet. Leibniz skrev också 1703 om det binära talsystemet med bara 0 och 1, och drömde om ett kalkylspråk där tvister kunde avgöras genom att räkna. Båda idéerna pekar fram mot [Boolesk algebra](#boole-boolesk-algebra-1854) och datorn.

saverys-angpump-1698:
  period: 1680
  label: "Saverys ångpump 1698"
  title: "Saverys ångpump (1698)"
  wiki:
    - "en:Thomas Savery"
    - "en:Savery engine"
  text: |
    Engelska gruvor gick allt djupare under 1600-talet och fylldes av grundvatten. Att pumpa med hästar var dyrt. **Thomas Savery** (ca 1650–1715), en engelsk militäringenjör, tog 1698 patent på "att höja vatten med eld" – den första kommersiellt sålda ångdrivna maskinen.

    Den hade ingen kolv. Ånga från en panna fylldes i ett slutet kärl; sedan sprutades kallt vatten på kärlet så att ångan kondenserade till vatten. Då uppstod ett nästan tomt utrymme – ett vakuum – och lufttrycket utanför pressade upp vatten underifrån genom ett rör med backventil. Därefter släpptes ny ånga in med övertryck som tryckte vattnet vidare uppåt. Principen byggde på 1600-talets upptäckt av lufttrycket ([Torricellis barometer](#torricelli-barometer), [Guerickes vakuum](#guerickes-vakuum)): lufttrycket kan bara lyfta vatten omkring 10 meter, i praktiken mindre.

    Maskinen var ineffektiv, slukade bränsle och pannorna kunde explodera, så den fick liten betydelse i gruvorna. Men Saverys breda patent gjorde att [Thomas Newcomen](#newcomens-angmaskin-1712) fick samarbeta med honom när han 1712 byggde den första användbara kolvmaskinen – den linje som ledde till [Watts ångmaskin](#watts-angmaskin-1769).

papins-tryckkokare:
  period: 1680
  label: "Papins tryckkokare"
  title: "Papins tryckkokare och kolvidén"
  wiki:
    - "en:Denis Papin"
    - "en:Pressure cooker"
  text: |
    **Denis Papin** (1647–ca 1713) var en fransk fysiker som arbetade som assistent åt den holländske fysikern [Christiaan Huygens](#huygens) i Paris och åt Robert Boyle i London, mannen bakom [Boyles lag](#boyles-lag-1662) om gasers tryck och volym. Som protestant (hugenott) kunde han inte återvända till Frankrike och levde ett osäkert liv i England och Tyskland.

    1679 visade han sin **"digester"**, en tryckkokare: ett tätt slutet järnkärl där trycket stiger när vattnet kokar. Vid högre tryck kokar vatten vid högre temperatur än 100 °C, så även ben mjuknar och kan bli buljong. För att kärlet inte skulle sprängas uppfann han **säkerhetsventilen**, en vikt som lyfts av för högt tryck – en detalj som blev livsviktig på alla senare ångpannor.

    Omkring 1690 beskrev Papin en cylinder med kolv: vatten under kolven kokas, ångan lyfter kolven, ångan kyls och kondenserar, och lufttrycket trycker ner kolven igen. Det är precis principen i [Newcomens ångmaskin 1712](#newcomens-angmaskin-1712). Papin byggde själv aldrig en fungerande maskin i stor skala, medan [Savery](#saverys-angpump-1698) valde den kolvlösa vägen.

newcomens-angmaskin-1712-2:
  period: 1700
  label: "Newcomens ångmaskin 1712"
  same_as: newcomens-angmaskin-1712

koks-i-masugnen-1709:
  period: 1700
  label: "koks i masugnen 1709"
  title: "Darby smälter järn med koks (1709)"
  wiki:
    - "en:Abraham Darby I"
    - "en:Coke (fuel)"
  text: |
    En **masugn** är ett högt schakt där järnmalm (järnoxid) hettas upp med kol. Kolet brinner, och kolmonoxiden tar syret från malmen så att flytande järn rinner ut i botten. I tusentals år användes **träkol**, framställt genom att bränna ved med lite luft. Men England hade ont om skog, och träkol var dyrt. Sverige, med stora skogar, blev därför en av Europas stora järnexportörer.

    Stenkol fanns gott om, men innehåller svavel som gör järnet sprött. 1709 lyckades **Abraham Darby** (1678–1717), en kväkare och järnbrukare i Coalbrookdale i västra England, använda **koks** i stället: stenkol som hettats utan luft så att svavel och andra flyktiga ämnen till stor del drivs bort, på samma sätt som ved blir träkol. Koks är dessutom hårdare än träkol och klarar tyngden av mer malm, så ugnarna kunde göras större.

    Först användes koksjärnet till gjutgods som grytor; det lämpade sig dåligt för smide förrän nya metoder kom senare under 1700-talet. Men Coalbrookdale göt cylindrar till [Newcomens ångmaskiner](#newcomens-angmaskin-1712), och 1779 byggdes världens första järnbro där. Billigt järn från kol blev en förutsättning för [ångmaskiner](#watts-angmaskin-1769), räls och senare [billigt stål](#bessemerstal-1856).

kays-flygande-skyttel-1733:
  period: 1720
  label: "Kays flygande skyttel 1733"
  title: "Kays flygande skyttel (1733)"
  wiki:
    - "en:Flying shuttle"
    - "en:John Kay (flying shuttle)"
  text: |
    Att **väva** betyder att föra en tråd (inslaget) fram och tillbaka mellan ett stort antal spända längsgående trådar (varpen). Inslaget sitter på en **skyttel**, ett båtformat trästycke. Före 1733 kastades skytteln för hand från ena sidan till den andra; för breda tyger behövdes två vävare.

    **John Kay** (1704–ca 1779), en vävskedsmakare från Lancashire i nordvästra England, satte 1733 skytteln på hjul i en ränna och lät den slås iväg av en klubba som vävaren drog i med ett snöre. En person kunde nu väva breda tyger och mycket snabbare – ofta anges ungefär en fördubbling av takten. Uppfinningen var omtyckt av fabrikörer men hatad av vävare som fruktade arbetslöshet; Kays hus ska ha attackerats, och han dog fattig i Frankrike efter att ha kämpat förgäves för att få betalt för patentet.

    Viktigast var följden: vävarna förbrukade nu garn snabbare än handspinnerskorna hann spinna. Bristen på garn drev fram [spinning jenny 1764](#spinning-jenny-1764) och vattendrivna spinnmaskiner, och när garnet sedan blev överflödigt kom [Cartwrights mekaniska vävstol](#cartwrights-mekaniska-vavstol). Detta växelspel mellan spinning och vävning blev motorn i textilindustrin, den första sektorn i [den industriella revolutionen](#industriella-revolutionen-watts).

harrisons-kronometer-paborjas:
  period: 1720
  label: "Harrisons kronometer påbörjas"
  title: "Harrison börjar bygga sjöuret (1730-talet)"
  wiki:
    - "en:John Harrison"
    - "en:Marine chronometer"
  text: |
    Till sjöss kunde man mäta **latitud** (läget nord–syd) med solens höjd vid middagstid, men inte **longitud** (läget öst–väst). Jorden roterar 15 grader per timme, så om man vet tiden i hemmahamnen och ser när det är middag lokalt, ger tidsskillnaden longituden. Det kräver en klocka som går exakt i månader på ett gungande, fuktigt fartyg med växlande temperatur. Pendelur ([Huygens](#huygens)) fungerar inte på ett fartyg. Fel i longitud orsakade många skeppsbrott; 1707 förliste fyra brittiska krigsskepp vid Scillyöarna med omkring 1 400 man (ungefärlig siffra).

    1714 utlovade brittiska parlamentet ett pris på upp till 20 000 pund – en förmögenhet – för en metod som gav longituden med en halv grads noggrannhet. **John Harrison** (1693–1776), en självlärd snickare och urmakare från Lincolnshire, hade redan byggt ovanligt exakta träur. Han färdigställde sitt första sjöur, H1, 1735: ett stort mässingsur med två sammanlänkade balanser i stället för pendel, och kompensation för temperaturen. Det testades till Lissabon 1736 med lovande resultat.

    Harrison fick stöd för att förbättra konstruktionen och ägnade decennier åt H2 och H3. Konkurrenten var astronomernas "månavståndsmetod", där man jämförde månens läge mot stjärnorna med tabeller. Genombrottet kom först med det lilla fickursformade [H4](#harrisons-h4-loser-longitudproblemet).

askledaren:
  period: 1740
  label: "Åskledaren"
  title: "Åskledaren"
  wiki:
    - "sv:Åskledare"
    - "en:Lightning rod"
  text: |
    På 1700-talet slog blixten regelbundet ned i kyrktorn, som ofta var de högsta byggnaderna. Kyrkklockor ringdes vid åska i tron att ljudet skulle skydda, och klockringare dog. Krutförråd, ofta förlagda i kyrkor, kunde explodera; i Brescia i Italien dödade en sådan explosion 1769 enligt uppgift omkring 3 000 personer (osäker siffra).

    **Benjamin Franklin**, boktryckaren och forskaren i Philadelphia (se [Franklins drake](#franklins-drake-1752)), föreslog 1750 och publicerade 1753 hur man skyddar byggnader: en spetsig metallstång på taket, förbunden med en tjock metalledning ner i marken. Blixten följer den väg som leder ström lättast, och strömmen förs då ner i jorden genom metallen i stället för genom murverk och trä, som annars kan explodera av den plötsliga hettan eller fatta eld.

    Åskledaren var en av de första praktiska tillämpningarna av elektricitetsforskningen och spreds snabbt i Nordamerika och Europa, även i Sverige. Den mötte motstånd: vissa präster menade att det var att trotsa Guds vilja, och i Storbritannien bråkade man om spetsiga eller runda stänger – delvis av politiska skäl, eftersom Franklin stödde de upproriska amerikanska kolonierna. Principen med jordning är densamma i dagens elinstallationer.

harrisons-h4-loser-longitudproblemet:
  period: 1740
  label: "Harrisons H4 löser longitudproblemet"
  title: "Harrisons H4 löser longitudproblemet (1761)"
  wiki:
    - "en:John Harrison"
    - "en:Longitude prize"
    - "en:Marine chronometer"
  text: |
    **John Harrison** (1693–1776), den självlärde engelske urmakaren, hade sedan 1730-talet byggt stora sjöur (se [H1–H3](#harrisons-kronometer-paborjas)) för att lösa **longitudproblemet**: att bestämma ett fartygs läge i öst–västlig riktning genom att jämföra lokal tid med tiden i hemmahamnen. Varje minuts fel i klockan motsvarar en kvarts grads fel, vid ekvatorn ungefär 28 km.

    H4, färdigt 1759, var inte ett stort maskineri utan ett fickur på 13 cm i diameter. Det hade en snabbt svängande balans, temperaturkompensation och fina diamantlager. På en resa till Jamaica 1761–62 gick det fel med bara omkring 5 sekunder på 81 dagar, långt inom kravet för det högsta priset. Longitudkommissionen, dominerad av astronomer som föredrog sin egen metod med månavstånd, ställde ändå nya krav. Först 1773, efter att kung Georg III själv ingripit, fick Harrison större delen av prispengarna.

    H4 visade att mekaniska ur kunde ge navigeringsprecision. Kopior användes av James Cook på hans andra resa på 1770-talet, och i början av 1800-talet blev **kronometern** standard på örlogs- och handelsfartyg. Det gjorde sjöfarten säkrare och var en förutsättning för Storbritanniens världsomspännande flotta och handel. Idén att läge kan bestämmas genom exakt tidmätning är också själva grundprincipen för dagens GPS.

watts-angmaskin-1769:
  period: 1760
  label: "Watts ångmaskin 1769"
  title: "Watts ångmaskin (1769)"
  wiki:
    - "en:Watt steam engine"
    - "sv:James Watt"
  text: |
    Sedan 1712 pumpade [Newcomens ångmaskiner](#newcomens-angmaskin-1712) vatten ur gruvor. De fungerade så att ånga fyllde en cylinder, kallt vatten sprutades in, ångan kondenserade och lufttrycket tryckte ner kolven. Men varje slag kyldes hela cylindern ner och måste värmas upp igen, och därför slukade de enorma mängder kol.

    **James Watt** (1736–1819) var instrumentmakare vid universitetet i Glasgow. När han lagade en modell av Newcomens maskin insåg han 1765, med hjälp av [Blacks lära om latent värme](#black-latent-varme), var värmen förlorades. Lösningen var den **separata kondensorn**: ångan leds ut i ett separat, ständigt kallt kärl för att kondensera, medan cylindern hålls varm hela tiden. Patentet kom 1769. Watts maskiner behövde ungefär en fjärdedel av kolet jämfört med Newcomens (ungefärlig siffra).

    Med affärspartnern **Matthew Boulton** i Birmingham började han tillverka maskiner från 1776; precisa cylindrar borrades av kanontillverkaren John Wilkinson. På 1780-talet kom en dubbelverkande maskin som ger roterande rörelse genom en växel, och en centrifugalregulator som automatiskt reglerar farten – en tidig återkopplingsmekanism, föregångare till reglerteknik. Nu kunde ångan driva textilfabriker, inte bara pumpar. Enheten för effekt, watt, är uppkallad efter honom, och han införde själv måttet hästkraft. Maskinen blev symbolen för [den industriella revolutionen](#industriella-revolutionen-watts) och ledde vidare till [ånglok](#trevithicks-lok-1804) med högtrycksånga.

spinning-jenny-1764:
  period: 1760
  label: "spinning jenny 1764"
  title: "Spinning jenny (ca 1764)"
  wiki:
    - "en:Spinning jenny"
    - "en:James Hargreaves"
  text: |
    Att **spinna** är att dra ut och tvinna ihop fibrer (ull, bomull, lin) till en tråd. I tusentals år gjordes det med slända och från medeltiden med spinnrock, en tråd i taget, ofta av kvinnor i hemmen. Efter [Kays flygande skyttel](#kays-flygande-skyttel-1733) vävde vävarna snabbare, och garnet räckte inte till.

    **James Hargreaves** (ca 1720–1778), vävare och snickare i Lancashire i nordvästra England, byggde omkring 1764 en handdriven maskin, spinning jenny ("jenny" troligen en förvanskning av engine, maskin). En ram med flera spolar och en rörlig vagn drog ut och tvinnade fibrerna. En person kunde driva först 8 spolar samtidigt, senare modeller upp till 80 eller fler. Tråden var dock svag och användes främst som inslag.

    Spinnare som fruktade för sitt levebröd förstörde hans maskiner, och han flyttade till Nottingham. Konkurrenten var Richard Arkwrights vattendrivna **water frame** (patent 1769), som gav starkare tråd men krävde stora fabriker vid vattendrag – det blev starten för fabrikssystemet. 1779 kombinerade Samuel Crompton båda i "mulan". När garnet blev billigt och rikligt drevs vävningen fram mot [Cartwrights mekaniska vävstol](#cartwrights-mekaniska-vavstol). Bomullsindustrin blev den första stora industrin i [den industriella revolutionen](#industriella-revolutionen-watts) – med råvara odlad av slavar i Amerika.

montgolfiers-ballong-1783:
  period: 1780
  label: "Montgolfiers ballong 1783"
  title: "Montgolfiers varmluftsballong (1783)"
  wiki:
    - "en:Montgolfier brothers"
    - "sv:Luftballong"
  text: |
    **Joseph-Michel** och **Jacques-Étienne Montgolfier** var söner till en pappersfabrikör i Annonay i södra Frankrike. De märkte att varm luft och rök lyfter lätta tygpåsar, och byggde en stor ballong av tyg fodrad med papper. Principen: varm luft är tunnare (har lägre densitet) än kall luft, och ballongen flyter uppåt av samma skäl som trä flyter i vatten – lyftkraften är lika med vikten av den kalla luft som ballongen tränger undan. De trodde själva att röken innehöll en särskild lyftande gas.

    Den 4 juni 1783 steg en obemannad ballong offentligt i Annonay. I september flög ett får, en anka och en tupp inför kung Ludvig XVI i Versailles. Den 21 november 1783 genomförde Pilâtre de Rozier och markisen d'Arlandes den första bemannade fria flygningen i Paris, omkring 9 km på cirka 25 minuter. Bara tio dagar senare flög fysikern **Jacques Charles** en ballong fylld med **vätgas**, en gas som [Cavendish](#cavendish) beskrivit 1766 och som är cirka 14 gånger lättare än luft. Vätgasballongen var effektivare och blev den dominerande typen.

    För första gången kunde människor lyfta från marken. Ballonger användes sedan för väderforskning och militär spaning, och ledde till 1900-talets luftskepp. Men ballonger driver med vinden; styrd flygning med motor och vingar fick vänta till [bröderna Wright 1903](#broderna-wright-1903). 1783 dog också [Euler](#euler-blind-men-produktiv), enligt traditionen efter en beräkning om ballongers stigning.

cartwrights-mekaniska-vavstol:
  period: 1780
  label: "Cartwrights mekaniska vävstol"
  title: "Vävningen mekaniseras"
  wiki:
    - "en:Power loom"
    - "en:Edmund Cartwright"
  text: |
    **Edmund Cartwright** (1743–1823) var en engelsk präst utan teknisk utbildning som 1785 tog patent på en vävstol som drevs av en yttre kraftkälla – först djur eller vattenhjul, senare ångmaskiner – i stället för av vävarens armar och ben. En vävstol korsar trådar: längsgående varptrådar lyfts och sänks, och en tvärgående inslagstråd skjuts igenom med en skyttel. Cartwrights maskin gjorde alla dessa rörelser automatiskt.

    Bakgrunden var en flaskhals. Spinningen hade redan mekaniserats med [spinning jenny](#spinning-jenny-1764) och liknande maskiner, så det fanns plötsligt mer garn än handvävarna hann väva, trots att [Kays flygande skyttel](#kays-flygande-skyttel-1733) redan hade gjort handvävningen snabbare. Cartwrights första maskiner var klumpiga och hans egen fabrik gick i konkurs; först efter förbättringar av andra (omkring 1800–1820-talet) blev mekaniska vävstolar lönsamma.

    Därefter gick det fort: kring mitten av 1800-talet fanns grovt räknat ett par hundra tusen mekaniska vävstolar i Storbritannien, och hundratusentals handvävare förlorade sin försörjning. Textilfabriken med ångdrivna maskiner i långa rader blev industrialismens symbol, drivna av [Watts ångmaskin](#watts-angmaskin-1769). Några år senare visade [Jacquards vävstol](#jacquardvavstolen-med-halkort-1804) hur även själva mönstret kunde styras automatiskt.

jacquardvavstolen-med-halkort-1804:
  period: 1800
  label: "Jacquardvävstolen med hålkort 1804"
  title: "Hålkort styr maskinen"
  wiki:
    - "en:Jacquard machine"
    - "en:Joseph Marie Jacquard"
  text: |
    **Joseph Marie Jacquard** (1752–1834) var en vävare från Lyon, centrum för Frankrikes sidenindustri. 1804 presenterade han en anordning som monterades ovanpå en vävstol och vävde invecklade mönster automatiskt.

    Principen: mönstret lagras på en kedja av styva kort med hål. Varje kort motsvarar en rad i tyget. Vid varje kast pressas en uppsättning nålar mot kortet; där det finns ett hål går nålen igenom och lyfter en viss varptråd, där det saknas hål stannar tråden nere. Inslagstråden passerar sedan mellan upplyfta och nedsänkta trådar. Att byta mönster betyder bara att byta korten – maskinen är densamma. I dagens språk: programmet är skilt från hårdvaran och lagrat binärt, hål eller inte hål. Jacquard byggde på tidigare försök av bland andra Basile Bouchon (1725) och Jacques de Vaucanson.

    Uppfinningen hotade skickliga mönstervävare och möttes av protester i Lyon, men spreds snabbt; inom några år fanns tusentals Jacquardvävstolar i Frankrike. Den blev en direkt inspiration för datorns förhistoria: [Charles Babbage](#babbages-differensmaskin-1822) planerade att mata sin analytiska maskin med hålkort, och [Ada Lovelace](#ada-lovelace-1843) skrev att den "väver algebraiska mönster så som Jacquardvävstolen väver blommor och löv". 1890 använde Herman Hollerith hålkort för USA:s folkräkning; hans företag blev senare IBM, och hålkort användes för datorprogram långt in på 1970-talet.

trevithicks-lok-1804:
  period: 1800
  label: "Trevithicks lok 1804"
  title: "Det första ångloket på räls"
  wiki:
    - "en:Richard Trevithick"
    - "en:Penydarren locomotive"
  text: |
    **Richard Trevithick** (1771–1833) var en gruvingenjör från Cornwall i sydvästra England. Hans viktigaste idé var *högtrycksånga*. [Watts ångmaskin](#watts-angmaskin-1769) arbetade med ånga nära atmosfärstryck och behövde en stor kondensor där ångan kyldes till vatten för att skapa undertryck. Trevithick lät i stället ångan arbeta vid flera atmosfärers tryck och släppte ut den direkt i luften. Det gav en mycket mindre och lättare maskin per kraftenhet – tillräckligt lätt för att kunna bära sig själv på hjul. Watt hade avfärdat högtryck som livsfarligt, och pannexplosioner var mycket riktigt en verklig risk.

    Den 21 februari 1804 drog Trevithicks lok vid järnverket i Penydarren i Wales omkring 10 ton järn och ett sjuttiotal passagerare ungefär 16 km på drygt fyra timmar. Det var första gången ett ånglok gick på räls. Men det blev ingen kommersiell framgång: loket var så tungt att de spröda gjutjärnsskenorna sprack. 1808 visade han ett lok på en cirkelbana i London mot betalning, men publiken var liten.

    Trevithick dog fattig, men principen levde vidare. Med starkare räls och bättre pannor ledde den till [Stephensons Rocket](#stephensons-rocket-1829) och [den första moderna järnvägen](#jarnvag-liverpoolmanchester-1830) ett kvartssekel senare.

fultons-angbat-1807:
  period: 1800
  label: "Fultons ångbåt 1807"
  title: "Ångan tar sig ut på vattnet"
  wiki:
    - "en:North River Steamboat"
    - "sv:Robert Fulton"
  text: |
    **Robert Fulton** (1765–1815) var en amerikansk ingenjör som började som porträttmålare och som tidigare försökt sälja en ubåt, *Nautilus*, till Napoleon. I augusti 1807 gick hans ångbåt, *North River Steamboat* (senare kallad *Clermont*), uppför Hudsonfloden från New York till Albany, omkring 240 km, på ungefär 32 timmar. En segelslup behövde ofta flera dagar, beroende på vinden.

    Fulton var inte först. Fransmannen Claude de Jouffroy körde en ångbåt 1783, amerikanen John Fitch hade reguljär trafik på Delawarefloden 1790 och skotska *Charlotte Dundas* drog pråmar 1803. Men Fulton var den förste som fick det att löna sig: han kombinerade en importerad maskin från Boulton & Watt (se [Watts ångmaskin](#watts-angmaskin-1769)) med ett skrov anpassat för den och med ett monopol på trafiken som hans partner Robert Livingston hade skaffat.

    Effekten blev störst på floderna. Efter [Louisianaköpet](#louisianakopet-1803) blev Mississippi USA:s pulsåder, och ångbåtar kunde gå *mot* strömmen, vilket gjorde inlandet till en del av världsekonomin. Att korsa Atlanten med ånga tog längre tid: reguljär ångbåtstrafik över Atlanten kom först 1838. Ungefär samtidigt som Fulton byggde [Trevithick](#trevithicks-lok-1804) det första ångloket – ångkraft blev kärnan i 1800-talets transportrevolution både till lands och sjöss.

babbages-differensmaskin-1822:
  period: 1820
  label: "Babbages differensmaskin 1822"
  title: "En maskin som räknar ut tabeller"
  wiki:
    - "en:Difference engine"
    - "sv:Charles Babbage"
  text: |
    **Charles Babbage** (1791–1871) var en engelsk matematiker vid Cambridge. På hans tid räknades tabeller över logaritmer, trigonometriska funktioner och navigationsdata ut för hand av människor – "computers" – och de innehöll många fel, vilket kunde kosta fartyg.

    1822 föreslog Babbage en mekanisk maskin som räknade ut sådana tabeller automatiskt och tryckte dem direkt. Den byggde på *differensmetoden*: för ett polynom, till exempel p(x) = x² + x + 41, blir differenserna mellan på varandra följande värden till slut konstanta (här är andradifferensen alltid 2). Då kan hela tabellen fås genom att bara *addera*, ingen multiplikation behövs – och addition kan kugghjul göra. Många funktioner kan approximeras med polynom i små intervall. Maskinen skulle räkna med 20-siffriga decimaltal.

    Brittiska staten satsade omkring 17 000 pund, en enorm summa, men maskinen blev aldrig färdig, bland annat på grund av konflikter med mekanikern och för att Babbage själv gick vidare till en större idé: den *analytiska maskinen* (från 1834), en allmän programmerbar dator med separat minne och räkneenhet, styrd av hålkort som i [Jacquardvävstolen](#jacquardvavstolen-med-halkort-1804). Den beskrevs och programmerades på papper av [Ada Lovelace](#ada-lovelace-1843). Den svenske boktryckaren Georg Scheutz och hans son byggde faktiskt en fungerande differensmaskin på 1850-talet. 1991 byggde Science Museum i London Babbages Difference Engine No. 2 efter hans ritningar, och den fungerade. Den första förverkligade programmerbara datorn kom över hundra år senare, med [Zuses Z3](#zuses-z3-1941).

stephensons-rocket-1829:
  period: 1820
  label: "Stephensons Rocket 1829"
  title: "Loket som vann tävlingen"
  wiki:
    - "en:Stephenson's Rocket"
    - "sv:George Stephenson"
  text: |
    **George Stephenson** (1781–1848) var en engelsk gruvingenjör som inte lärde sig läsa förrän i 18-årsåldern, och hans son **Robert Stephenson** (1803–1859) en av tidens främsta ingenjörer. När [järnvägen Liverpool–Manchester](#jarnvag-liverpoolmanchester-1830) byggdes var det oklart om tågen skulle dras av lok eller av stationära ångmaskiner med vajrar. Bolaget anordnade därför i oktober 1829 en tävling, Rainhill-provet, med ett pris på 500 pund.

    Stephensons *Rocket* var det enda lok som klarade alla prov. Med vagnar gick det i snitt omkring 19 km/h och utan last som mest uppemot 45 km/h. Det var inte först – [Trevithicks lok](#trevithicks-lok-1804) kom 25 år tidigare – men det samlade flera förbättringar som blev standard. Den viktigaste var *tubpannan*: i stället för en enda stor tub gick de heta rökgaserna genom ett tjugotal tunna kopparrör genom vattnet, vilket gav mycket större värmeöverförande yta och därmed mer ånga. Dessutom leddes den förbrukade ångan ut genom skorstenen så att den drog luft genom elden och gjorde den hetare ju fortare loket gick.

    Med Rocket och linjen 1830 började järnvägsåldern på allvar. Inom 20 år hade Storbritannien grovt räknat 10 000 km järnväg. Stephenson hade även bestämt spårvidden 1 435 mm, som blev standard i stora delar av världen, inklusive Sverige. Järnvägen och [telegrafen](#telegrafen-morse-1837) växte sedan upp tillsammans, eftersom telegrafen behövdes för att säkert styra tågtrafiken.

telegrafen-morse-1837:
  period: 1820
  label: "telegrafen (Morse 1837)"
  title: "Meddelanden med elektricitetens fart"
  wiki:
    - "sv:Telegraf"
    - "sv:Samuel Morse"
    - "en:Morse code"
  text: |
    Före den elektriska telegrafen kunde inget meddelande färdas fortare än en ryttare, ett fartyg eller en optisk signalkedja. Frankrike och Sverige hade sådana optiska telegrafer kring 1800 – torn med rörliga armar eller luckor inom synhåll från varandra – men de fungerade inte i mörker eller dimma.

    Efter [Ørsteds upptäckt](#orsted-strom-ger-magnetism-1820) och uppfinningen av elektromagneten försökte många skicka signaler med ström. 1837 fick två engelsmän, William Cooke och Charles Wheatstone, patent på en telegraf där nålar på mottagarsidan pekade ut bokstäver; den användes längs järnvägarna. Samma år visade amerikanen **Samuel Morse** (1791–1872), egentligen porträttmålare, sitt system tillsammans med Alfred Vail. Det var enklare: en enda ledning (med jorden som återledare), en strömbrytare hos avsändaren och en elektromagnet hos mottagaren som först ritade, senare klickade. Tecknen kodades som korta och långa pulser – punkter och streck – där vanliga bokstäver fick korta koder (E = ·) och ovanliga längre, samma princip som i dagens datakomprimering.

    Morses system blev världsstandard efter linjen mellan Washington och Baltimore, se [Morsetelegraf 1844](#morsetelegraf-1844). Telegrafen var det första nätet för elektronisk kommunikation: den skilde för första gången informationen från fysisk transport och gjorde det möjligt att samordna tåg, börser och nyheter. Kulmen var [Atlantkabeln](#atlantkabeln-1858).

morsetelegraf-1844:
  period: 1840
  label: "Morsetelegraf 1844"
  title: "\"What hath God wrought\""
  wiki:
    - "sv:Samuel Morse"
    - "en:Morse code"
  text: |
    Den 24 maj 1844 skickade **Samuel Morse** (1791–1872), amerikansk målare som blivit uppfinnare, meddelandet "What hath God wrought" ("Vad har Gud åstadkommit", ett bibelcitat) från Högsta domstolens sal i Washington till Baltimore, omkring 60 km bort. Linjen hade byggts med 30 000 dollar från kongressen. Principen, en strömbrytare i ena änden och en elektromagnet i den andra, beskrivs vid [telegrafen 1837](#telegrafen-morse-1837).

    Morsesystemet vann över konkurrenterna för att det var billigt och robust: en enda tråd, enkel utrustning och en kod av korta och långa pulser. Snart lärde sig telegrafister att lyssna på klicken och skriva ned texten direkt, ungefär 20–40 ord i minuten. Morsekoden som användes internationellt standardiserades 1865 och användes inom sjöfarten ända till 1999; SOS (··· – – – ···) är det mest kända exemplet.

    Spridningen gick mycket fort. 1850 fanns omkring 20 000 km telegraflinje i USA, ofta byggda längs järnvägarna, och 1861 nådde linjen Stillahavskusten. Telegrafen förändrade nyhetsförmedling (nyhetsbyråer som Associated Press bildades), börser och militär ledning. I Storbritannien gick motsvarande utbyggnad parallellt, se [telegrafen i Storbritannien](#telegraf). Nästa stora steg var att korsa haven, med [Atlantkabeln](#atlantkabeln-1858), och sedan att överföra tal, med [telefonen](#bells-telefon-1876).

atlantkabeln-1858:
  period: 1840
  label: "Atlantkabeln 1858"
  title: "Den första tråden under Atlanten"
  wiki:
    - "en:Transatlantic telegraph cable"
  text: |
    1858 lades den första telegrafkabeln över Atlantens botten, cirka 3 200 km från Irland till Newfoundland i Kanada. Projektet leddes av den amerikanske affärsmannen Cyrus Field. Kabeln bestod av en kopparledare isolerad med *guttaperka* – en naturgummiliknande saft från ett sydostasiatiskt träd, det enda material som då höll i havsvatten – och armerad med järntråd.

    Den 16 augusti 1858 utväxlade drottning Viktoria och USA:s president James Buchanan gratulationer. Drottningens 98 ord tog omkring 16 timmar att överföra. Problemet var fysiken: en lång kabel i ledande havsvatten fungerar som en jättelik kondensator, så pulserna smetades ut och blev svåra att skilja åt. [William Thomson (Kelvin)](#kelvin) förstod detta och ville använda svag ström och en känslig mottagare, men chefelektrikern höjde i stället spänningen till uppemot 2 000 volt. Efter knappt fyra veckor slutade kabeln fungera.

    Först 1866 fungerade en hållbar kabel, lagd av ångfartyget *Great Eastern* och byggd efter Thomsons principer. Då gick det att skicka omkring 8 ord i minuten, senare mycket fler. Ett meddelande mellan London och New York, som med fartyg tog cirka tio dagar, kom nu fram på minuter. Kring 1900 omgavs jorden av ett nät av sjökablar, ägt mest av brittiska företag – det första globala kommunikationsnätet, en föregångare till dagens fiberkablar under haven, som bär det mesta av internettrafiken mellan kontinenterna. Grunden var [Morsetelegrafen](#morsetelegraf-1844).

bessemerstal-1856:
  period: 1840
  label: "Bessemerstål 1856"
  title: "Billigt stål i stora mängder"
  wiki:
    - "en:Bessemer process"
    - "en:Henry Bessemer"
  text: |
    **Stål** är järn med en liten, kontrollerad halt kol, ungefär 0,2–1 procent. Det är både starkt och segt. Råjärn från masugnen innehåller i stället omkring 4 procent kol och är sprött, medan smidesjärn har nästan inget kol och är mjukt. Före 1850-talet var stål dyrt; det tog dagar att framställa några kilo, och det användes mest till verktyg, vapen och fjädrar.

    **Henry Bessemer** (1813–1898) var en engelsk uppfinnare som 1856 patenterade en metod: man blåser luft genom smält råjärn i en stor behållare, en *konverter*. Syret i luften förbränner kolet och andra föroreningar, och reaktionen ger så mycket värme att järnet förblir flytande utan extra bränsle. Ett parti om några ton blev färdigt på ungefär 20 minuter. Amerikanen William Kelly hade gjort liknande försök tidigare.

    Först fungerade metoden dåligt: fosfor i den brittiska malmen gjorde stålet sprött, och svårt att få rätt kolhalt. Viktiga lösningar kom från Sverige: vid Edsken i Gästrikland lyckades Göran Fredrik Göransson 1858 göra gott Bessemerstål av fosforfattig svensk malm, och Sandvik grundades på det. Stålpriset föll kraftigt de följande decennierna. Billigt stål gjorde det möjligt med långvariga järnvägsräls (se [den transkontinentala järnvägen](#transkontinental-jarnvag-1869)), stålfartyg, broar och skyskrapor. Från 1860-talet konkurrerade Siemens–Martin-metoden, utvecklad bland annat av [Werner Siemens](#siemens-dynamo-1866) bror Wilhelm, och den tog till slut över.

siemens-dynamo-1866:
  period: 1860
  label: "Siemens dynamo 1866"
  title: "Generatorn som startar sig själv"
  wiki:
    - "en:Dynamo"
    - "sv:Werner von Siemens"
  text: |
    **Werner von Siemens** (1816–1892) var en tysk ingenjör och industriman som 1847 grundade det som blev Siemens, ett av världens största elektroteknikföretag, ursprungligen för att bygga telegraflinjer. En *dynamo* är en generator som omvandlar mekanisk rörelse till elektrisk likström, enligt [Faradays induktion](#faraday-motor-1821-induktion-1831): spolar som roterar i ett magnetfält får en spänning inducerad i sig.

    Tidiga generatorer använde permanentmagneter och var svaga. Siemens idé 1866–67 var den *dynamoelektriska principen*: låt magnetfältet skapas av elektromagneter som matas av generatorns egen ström. Lite restmagnetism i järnet räcker för att starta; den ger lite ström, som stärker magneten, som ger mer ström – en positiv återkoppling som byggs upp tills maskinen ger full effekt. Ungefär samtidigt kom engelsmännen Charles Wheatstone och Samuel Varley på samma princip.

    Det gjorde det för första gången billigt att producera mycket elektricitet ur ångmaskiner eller vattenkraft. Belgaren Zénobe Gramme byggde 1871 den första praktiskt användbara dynamon för industrin. Det banade väg för elektrisk båglampsbelysning, elektrolys, spårvagnar och [Edisons kraftstation](#edisons-kraftstation-1882). Likströmsdynamon fick sedan konkurrens av växelströmsgeneratorn i [strömkriget](#stromkriget-tesla-och-vaxelstrom) på 1880–90-talet, där växelström vann eftersom spänningen enkelt kan transformeras.

bells-telefon-1876:
  period: 1860
  label: "Bells telefon 1876"
  title: "Rösten blir elektrisk ström"
  wiki:
    - "sv:Telefon"
    - "sv:Alexander Graham Bell"
  text: |
    **Alexander Graham Bell** (1847–1922) var en skotskfödd lärare för döva som flyttade till Kanada och sedan till Boston. Hans intresse för hur tal bildas och kan överföras ledde till telefonen. Den 14 februari 1876 lämnade han in sin patentansökan – samma dag som Elisha Gray lämnade in en ansökan om ett liknande system, vilket ledde till årtionden av rättsstrider. Italienaren Antonio Meucci och tysken Philipp Reis hade också tidigare apparater.

    Principen: ljudvågor sätter ett tunt membran i svängning. Membranet påverkar en elektrisk krets så att strömmen varierar i takt med ljudet – en *analog* signal, där strömstyrkan i varje ögonblick motsvarar lufttrycket. I mottagaren driver strömmen en elektromagnet som får ett annat membran att svänga likadant och återskapa ljudet. Till skillnad från [telegrafen](#morsetelegraf-1844), som bara skickade av och på, överförde telefonen en kontinuerligt varierande signal. Bells första fungerande samtal, i mars 1876, lär ha varit "Mr. Watson, come here, I want to see you" till hans assistent.

    Telefonen spreds snabbt i städerna, med manuella växlar där telefonister kopplade samtal. Stockholm hade en tid kring 1880-talets slut fler telefoner än någon annan stad i världen, och L. M. Ericsson grundades 1876 för att reparera och snart bygga telefonapparater. Automatiska växlar och elektroniska förstärkare som [elektronröret](#elektronroret-trioden-1906) gjorde sedan rikstelefoni möjlig. Bell Telephone Company blev AT&T, vars forskningslabb senare skapade [transistorn](#transistorn-1947).

edisons-fonograf-1877:
  period: 1860
  label: "Edisons fonograf 1877"
  title: "Ljudet som kunde sparas"
  wiki:
    - "sv:Fonograf"
    - "sv:Thomas Edison"
  text: |
    **Thomas Edison** (1847–1931) var en amerikansk uppfinnare och företagare med över tusen patent. Han byggde vid Menlo Park i New Jersey ett av världens första industriella forskningslaboratorier – en "uppfinningsfabrik". 1877, när han arbetade med att förbättra telegraf och [telefonen](#bells-telefon-1876), kom han på hur ljud kunde lagras.

    *Fonografen* var helt mekanisk. Man talade in i en tratt mot ett membran med en nål. En cylinder klädd med tennfolie vreds runt med en vev, och nålen ristade in ett spår vars djup följde ljudvågorna. Vid uppspelning följde nålen spåret, membranet svängde likadant och ljudet återskapades. Det första som spelades in lär ha varit "Mary had a little lamb". Kvaliteten var dålig och foliet höll bara några uppspelningar, men effekten var sensationell – för första gången i historien kunde en röst höras efter att den talat.

    Fransmannen Édouard-Léon Scott de Martinville hade redan 1857 kunnat *rita* ljudvågor på papper, men inte spela upp dem. Fonografen förbättrades med vaxcylindrar, och 1887 kom Emile Berliners *grammofon* med platta skivor som kunde pressas i många exemplar och tog över marknaden. Inspelat ljud skapade skivindustrin och förändrade musiken, och var en grund för radions och filmens ljud. Edison följde upp med [glödlampan](#edisons-glodlampa) och [sin kraftstation](#edisons-kraftstation-1882).

edisons-kraftstation-1882:
  period: 1880
  label: "Edisons kraftstation 1882"
  title: "Pearl Street: ett av de första elnäten"
  wiki:
    - "en:Pearl Street Station"
    - "sv:Thomas Edison"
  text: |
    **Thomas Edison** (1847–1931) var en amerikansk uppfinnare och företagsbyggare. Hans verkliga innovation var inte bara [glödlampan](#edisons-glodlampa) utan hela systemet runt den. Den 4 september 1882 startade hans kraftstation på Pearl Street i Manhattan, New York, en av världens första kommersiella centralstationer för el.

    Kolbaserade ångmaskiner drev generatorer (dynamor, se [Siemens dynamo](#siemens-dynamo-1866)) som gav *likström*, alltså ström som alltid går åt samma håll, på cirka 110 volt. Ledningar i marken gick ut till kunderna, och Edisons företag utvecklade också elmätare, säkringar och strömbrytare. I början försörjdes ett åttiotal kunder med några hundra lampor, inom ett område på runt en kvadratkilometer.

    Svagheten var likströmmen. Effektförlusten i en ledning ökar med kvadraten på strömmen, och med låg spänning krävs stor ström. Därför kunde en likströmsstation bara nå kunder ett par kilometer bort, och varje stadsdel skulle behöva en egen. Det öppnade för konkurrenten växelström, som med transformatorer kunde gå upp i spänning för transport och ner igen hos kunden – det som utlöste [strömkriget](#stromkriget-tesla-och-vaxelstrom). Pearl Street blev ändå mallen för [elnäten](#elnat-i-staderna): central produktion, distribution, mätning och betalning per förbrukad energi.

stromkriget-tesla-och-vaxelstrom:
  period: 1880
  label: "strömkriget, Tesla och växelström"
  title: "Strömkriget: likström mot växelström"
  wiki:
    - "en:War of the currents"
    - "sv:Nikola Tesla"
  text: |
    På 1880-talet stred två system om att elektrifiera världen. [Thomas Edisons](#edisons-kraftstation-1882) *likström* flödar i en riktning. *Växelström* byter riktning många gånger per sekund (i dag 50 gånger i Europa, 60 i USA). Växelströmmens förespråkare var industrimannen **George Westinghouse** och uppfinnaren **Nikola Tesla** (1856–1943), född i dagens Kroatien av serbisk familj, som 1888 patenterade en elmotor för växelström (induktionsmotorn) som Westinghouse köpte.

    Den avgörande fördelen var transformatorn, som bygger på [Faradays induktion](#faraday-induktion-1831): den kan bara höja och sänka spänningen för växelström. Förlusten i en ledning är proportionell mot strömmen i kvadrat. Höjer man spänningen tio gånger behövs en tiondel så stor ström för samma effekt, och förlusten blir en hundradel. Växelström kunde alltså skickas långt från stora kraftverk.

    Edisons sida svarade med en skrämselkampanj om att växelström var livsfarlig, bland annat kopplat till den första elektriska stolen 1890. Men Westinghouse belyste världsutställningen i Chicago 1893 och fick bygga kraftverket vid Niagarafallen, som från 1896 skickade ström till Buffalo ungefär 40 km bort. Växelströmmen vann och blev grunden för [elnäten](#elnat-i-staderna). I dag används ändå åter högspänd likström (HVDC) för mycket långa sträckor och sjökablar, eftersom modern kraftelektronik kan omvandla den effektivt.

marconi:
  period: 1880
  label: "Marconi"
  title: "Marconi gör radion användbar"
  wiki:
    - "sv:Guglielmo Marconi"
    - "en:Invention of radio"
  text: |
    **Guglielmo Marconi** (1874–1937) var en italiensk uppfinnare och företagare. Som ung läste han om [Hertz radiovågor](#hertz-radiovagor-1887) och började 1895 experimentera med att skicka telegrafsignaler utan tråd. Han förbättrade antenner (en hög antenn plus jordning ökade räckvidden kraftigt) och mottagare, och nådde några kilometer.

    Italien visade lite intresse, så han flyttade 1896 till Storbritannien, tog patent och grundade ett bolag. 1899 sände han över Engelska kanalen, och i december 1901 hävdade han att han tagit emot morsebokstaven "S" (tre korta pulser) från Cornwall i England till Newfoundland, cirka 3 500 km. Just det försöket har ifrågasatts, men långdistanssändningar bekräftades snart av andra försök. Signalerna var [morsekod](#morsetelegraf-1844), inte tal: gnistsändare gav korta störningsstötar, inte en jämn våg som kan bära ljud.

    Marconi delade Nobelpriset i fysik 1909 med tysken Ferdinand Braun. Andra arbetade parallellt, till exempel Aleksandr Popov i Ryssland, Oliver Lodge i England och Nikola Tesla, och patentstriderna var många. Trådlös telegrafi blev snabbt standard på fartyg; nödanropen från Titanic 1912 visade värdet. Att sända röst och musik krävde [elektronröret](#elektronroret-trioden-1906), och det ledde fram till [rundradion på 1920-talet](#radio-i-varje-hem).

elektronroret-trioden-1906:
  period: 1900
  label: "Elektronröret (trioden 1906)"
  title: "Elektronröret: den första förstärkaren"
  wiki:
    - "sv:Elektronrör"
    - "en:Triode"
  text: |
    Ett *elektronrör* är en glasbehållare utan luft (vakuum) med elektroder. En upphettad tråd, katoden, sänder ut [elektroner](#elektronen-1897) som dras mot en positivt laddad platta, anoden. Engelsmannen John Ambrose Fleming byggde 1904 en *diod* med två elektroder: ström kan bara gå åt ett håll, vilket gör att den kan omvandla radiosignaler till något en hörlur kan återge.

    Amerikanen **Lee de Forest** lade 1906 till en tredje elektrod, ett galler mellan katod och anod: *trioden* (först kallad audion). En liten spänning på gallret styr en stor ström mellan katod och anod – precis som en vattenkran. Det gör röret till en *förstärkare*, och med återkoppling till en *oscillator* som genererar jämna svängningar. de Forest förstod inte själv riktigt hur det fungerade; förbättrat vakuum och förståelse kom runt 1912–1915.

    Förstärkningen förändrade allt. Rikstelefoni över långa avstånd blev möjlig (USA:s första kust-till-kust-linje 1915), och en jämn bärvåg kunde bära tal och musik, vilket ledde till [rundradion](#radio-i-varje-hem), [TV](#tv) och radar. Röret kan också användas som snabb strömbrytare, och därför byggdes tidiga elektroniska datorer som [ENIAC](#eniac-1945) med runt 18 000 rör. Rören var stora, varma och gick ofta sönder, och ersattes successivt av [transistorn](#transistorn-1947), som gör samma sak i ett fast material.

elnat-i-staderna:
  period: 1900
  label: "elnät i städerna"
  title: "Städerna elektrifieras"
  wiki:
    - "en:Electrification"
    - "sv:Elnät"
  text: |
    Runt sekelskiftet 1900 byggdes elnät i städer i Europa och Nordamerika. Efter [strömkriget](#stromkriget-tesla-och-vaxelstrom) blev mönstret större kraftverk som producerar växelström, högspänningsledningar och transformatorstationer som sänker spänningen lokalt. Mindre nät slogs ihop, och man enades successivt om standarder: 50 Hz i Europa, 60 Hz i Nordamerika.

    Första stora kunderna var belysning och spårvagnar. Elektrisk spårväg ersatte hästspårvagnar i de flesta större städer mellan ungefär 1890 och 1910. Sedan kom fabrikerna: tidigare drev en enda ångmaskin hela fabriken via axlar och remmar, nu kunde varje maskin få en egen elmotor. Det gjorde det möjligt att ordna fabriken efter arbetsflödet, en förutsättning för [löpande bandet](#lopande-bandet-1913). Billigare kraft från vattenkraftverk spelade stor roll i länder som Sverige, Norge och Schweiz.

    Spridningen var ojämn. Städer fick el långt före landsbygden, och i USA hade ungefär två tredjedelar av hushållen el vid 1930 men bara omkring en tiondel av gårdarna. Ett elnät är i sig en tidig form av infrastruktur som allt annat byggs ovanpå: det är förutsättningen för [radion i hemmen](#radio-i-varje-hem), kylskåp, och senare datorer.

lopande-bandet-1913:
  period: 1900
  label: "löpande bandet 1913"
  title: "Ford och det löpande bandet"
  wiki:
    - "sv:Löpande band"
    - "en:Ford Model T"
  text: |
    **Henry Ford** (1863–1947) var en amerikansk biltillverkare. Hans [Model T](#ford-t-1908) (1908) var tänkt som en enkel, robust bil för vanliga människor. För att göra den billig nog införde han 1913 i fabriken i Highland Park, Michigan, det rörliga löpande bandet: bilen förflyttas mekaniskt förbi arbetare som var och en gör en enda, kort, standardiserad arbetsuppgift.

    Idén byggde på flera tidigare. Utbytbara delar (alla exemplar av en del är så lika att vilken som helst passar) hade utvecklats i amerikansk vapenindustri under 1800-talet. Chicagos slakterier hade "nedmonteringsband" där djurkroppar hängde på en rörlig krok. Ingenjören Frederick Taylor hade studerat arbetsmoment med tidtagarur för att effektivisera dem. Och [elmotorer](#elnat-i-staderna) gjorde det möjligt att placera maskiner efter arbetsflödet.

    Effekten var enorm: monteringstiden för ett chassi sjönk från ungefär tolv timmar till runt en och en halv. Priset på en Model T föll från 850 dollar 1908 till under 300 dollar i mitten av 1920-talet, och totalt såldes över 15 miljoner. Men arbetet var monotont och personalomsättningen hög, så Ford fördubblade 1914 lönen till 5 dollar per dag. Massproduktionen – senare kallad fordism – blev mönstret för 1900-talets industri, och höga löner plus billiga varor skapade masskonsumtionen.

radio-i-varje-hem:
  period: 1920
  label: "Radio i varje hem"
  title: "Rundradion kommer in i hemmen"
  wiki:
    - "sv:Radio"
    - "en:History of radio"
  text: |
    Före 1920 var radio i huvudsak trådlös telegrafi mellan två parter, med morsekod (se [Marconi](#marconi)). *Rundradio* betyder att en sändare når många mottagare samtidigt med tal och musik. Det krävde [elektronröret](#elektronroret-trioden-1906), som kunde skapa en jämn bärvåg och förstärka svaga signaler. Ljudet läggs på bärvågen genom att variera dess styrka (amplitudmodulering, AM).

    Stationen KDKA i Pittsburgh brukar räknas som den första kommersiella, med sändningen av presidentvalsresultatet i november 1920. BBC startade 1922 och Svensk radio (Radiotjänst) 1925. Utvecklingen gick snabbt: i USA hade ungefär 40 procent av hushållen radio 1930 och omkring 80 procent 1940. Billiga kristallmottagare med hörlurar kunde byggas hemma; rörmottagare med högtalare blev en möbel i vardagsrummet. Finansieringen skilde sig: reklam i USA, licensavgift i Storbritannien och Sverige.

    Radion gjorde för första gången samma röst hörbar i miljontals hem samtidigt. Det skapade masskultur (populärmusik, sportreferat, radioteater) men också ett nytt politiskt verktyg: Roosevelts "brasaftonsamtal" under [New Deal](#new-deal), och nazisternas billiga folkmottagare efter [1933](#hitler-1933). Tekniken och industrin bakom radion blev grunden för [TV](#tv) och radar.

tv:
  period: 1920
  label: "TV"
  title: "Televisionen"
  wiki:
    - "sv:Television"
    - "en:History of television"
  text: |
    Television betyder att överföra rörliga bilder elektriskt. Grundproblemet är att en bild måste delas upp i punkter som skickas en i taget och sätts ihop igen på mottagarsidan, tillräckligt snabbt för att ögat ska uppfatta rörelse – ungefär som en skärm som ritas rad för rad.

    Två spår konkurrerade. Det *mekaniska*: en snurrande skiva med hål i spiral (patenterad av tysken Paul Nipkow 1884) avsöker bilden. Skotten **John Logie Baird** visade 1926 rörliga bilder med 30 linjer på det sättet, och BBC sände ett tag med hans system. Det *elektroniska*: en elektronstråle i ett vakuumrör sveper över bilden, både i kameran och i bildröret (katodstrålerör) där den får en fluorescerande skärm att lysa. Amerikanen Philo Farnsworth demonstrerade ett helelektroniskt system 1927, och ryskfödde Vladimir Zworykin utvecklade kamerarör för RCA. Elektroniken vann eftersom den klarade många fler linjer.

    BBC startade reguljära sändningar med elektronisk högupplöst TV (405 linjer) 1936, och Nazityskland sände från OS i Berlin samma år. Kriget stoppade utbyggnaden, men efter 1945 slog TV igenom: i USA hade under tio procent av hushållen TV 1950 men omkring 90 procent 1960. Sverige fick reguljära sändningar 1956. TV tog över radions roll som gemensam kulturell mötesplats, se [radion](#radio-i-varje-hem), och bildröret var standard tills platta skärmar tog över på 2000-talet.

jetmotorn:
  period: 1920
  label: "jetmotorn"
  title: "Jetmotorn"
  wiki:
    - "sv:Jetmotor"
    - "en:Frank Whittle"
  text: |
    En jetmotor (gasturbin) suger in luft, komprimerar den med en kompressor, sprutar in bränsle och förbränner det. De heta gaserna driver en turbin som i sin tur driver kompressorn, och strömmar sedan ut bakåt i hög hastighet. Enligt Newtons tredje lag (verkan och motverkan) trycks motorn och flygplanet framåt. En kolvmotor med propeller tappar effektivitet nära ljudhastigheten, eftersom propellerbladens spetsar då rör sig överljudssnabbt; jetmotorn öppnade för mycket högre fart och höjd.

    Två personer kom fram till idén oberoende av varandra. Brittiske flygofficeren **Frank Whittle** patenterade en turbojet 1930 men fick knappt något stöd; hans motor gick på provbänk 1937. Tysken **Hans von Ohain** fick däremot stöd av flygplanstillverkaren Heinkel, och Heinkel He 178 blev det första jetdrivna flygplanet i augusti 1939, några dagar före [krigsutbrottet](#polen-anfalls-1939). Det brittiska Gloster E.28/39 flög 1941. Det första jetjaktplanet i strid var tyska Messerschmitt Me 262 1944, cirka 870 km/h – betydligt snabbare än de propellerplan det mötte.

    Efter kriget gjorde jetmotorn passagerarflyget snabbt och billigt. Brittiska de Havilland Comet (1952) var först, och Boeing 707 (1958) slog igenom. Dagens flygplan använder turbofläktmotorer, där en stor fläkt framtill driven av turbinen flyttar det mesta av luften förbi förbränningen, vilket är tystare och snålare. Samma gasturbinprincip används i kraftverk och fartyg.

zuses-z3-1941:
  period: 1940
  label: "Zuses Z3 1941"
  title: "Zuses Z3: den första programstyrda datorn"
  wiki:
    - "sv:Z3 (dator)"
    - "sv:Konrad Zuse"
  text: |
    **Konrad Zuse** (1910–1995) var en tysk byggingenjör som tröttnade på de långa hållfasthetsberäkningarna i jobbet. I sina föräldrars lägenhet i Berlin byggde han från 1936 räknemaskiner. Den första, Z1, var helt mekanisk och opålitlig. Z3, klar i maj 1941, byggdes av omkring 2 600 telefonreläer – elektromekaniska strömbrytare som slår om när en ström går genom en spole.

    Z3 räknade binärt med *flyttal* (tal lagrade som mantissa och exponent, ungefär som 1,23·10⁵, fast i bas 2) med 22 bitars ordlängd, och hade ett minne för 64 tal. Programmet lästes från hålremsa, gamla filmremsor med hål. Den klarade ungefär 3–4 additioner per sekund och en multiplikation på cirka tre sekunder. Den saknade villkorliga hopp, men 1998 visades att den teoretiskt ändå är turingkomplett (kan beräkna allt en [turingmaskin](#turingmaskinen-1936) kan) med ett omständligt trick. Dess binära flyttalsrepresentation liknar i princip dagens.

    Z3 förstördes i ett bombanfall 1943 och fick under kriget liten uppmärksamhet; tyska myndigheter såg den inte som strategiskt viktig. Parallellt byggdes på andra håll: Colossus i Storbritannien (1943–44, elektronrör, för kodknäckning) och [ENIAC](#eniac-1945) i USA. Zuse konstruerade också Plankalkül, ett tidigt högnivåspråk som dock inte implementerades förrän långt senare, före [Fortran](#fortran-1957). Hans efterkrigsföretag byggde datorer tills det köptes upp av Siemens.

eniac-1945:
  period: 1940
  label: "ENIAC 1945"
  title: "ENIAC, elektronisk dator i stor skala"
  wiki:
    - "sv:ENIAC"
    - "en:ENIAC"
  text: |
    ENIAC (Electronic Numerical Integrator and Computer) byggdes 1943–45 vid University of Pennsylvania av **John Mauchly** och **J. Presper Eckert** på uppdrag av amerikanska armén. Syftet var att räkna ut skjuttabeller för artilleri: hur långt en granat flyger beroende på vinkel, vind och laddning, något som annars gjordes för hand av hundratals "computers" – oftast kvinnor med räknemaskiner.

    ENIAC hade omkring 18 000 [elektronrör](#elektronroret-trioden-1906), vägde runt 27 ton, fyllde ett rum och drog ungefär 150 kilowatt. Den räknade decimalt, inte binärt, och klarade omkring 5 000 additioner per sekund – ungefär tusen gånger snabbare än reläbaserade maskiner som [Zuses Z3](#zuses-z3-1941). Den programmerades genom att koppla om kablar och ställa in vred, vilket kunde ta dagar. De sex kvinnor som skötte programmeringen, bland andra Jean Bartik och Kathleen McNulty, räknas i dag som några av de första programmerarna.

    ENIAC blev klar efter krigsslutet och tillkännagavs 1946. Bland de första verkliga uppgifterna var beräkningar för vätebomben. Bristen på lagrat program ledde direkt till EDVAC-rapporten och [von Neumann-arkitekturen](#von-neumann). Eckert och Mauchly byggde sedan UNIVAC (1951), en av de första kommersiella datorerna. Rören gick ofta sönder; ersättaren, [transistorn](#transistorn-1947), uppfanns bara två år senare. En dagens mobiltelefon räknar ungefär en miljard gånger snabbare.

karnkraft-1954:
  period: 1940
  label: "kärnkraft 1954"
  title: "Kärnkraften"
  wiki:
    - "sv:Kärnkraft"
    - "en:Obninsk Nuclear Power Plant"
  text: |
    Ett kärnkraftverk utnyttjar samma fysik som [atombomben](#atombomben-1945), men styrd: kedjereaktionen där urankärnor klyvs och frigör neutroner hålls exakt i balans, så att varje klyvning i genomsnitt orsakar precis en ny. Det görs med styrstavar som fångar neutroner, och med en *moderator* (vatten eller grafit) som bromsar neutronerna så att de lättare klyver uran-235. Värmen kokar vatten till ånga som driver en turbin och generator, precis som i ett kolkraftverk. Bränslet är bara svagt anrikat, några procent uran-235, och kan inte explodera som en bomb.

    Den första kedjereaktionen åstadkoms av Enrico Fermi i Chicago 1942. Sovjetiska Obninsk började leverera el till nätet i juni 1954, med blygsamma 5 megawatt. Brittiska Calder Hall (1956) och amerikanska Shippingport (1957) var de första i större skala. USA:s president Eisenhower lanserade 1953 programmet "Atoms for Peace". Kärnkraft för ubåtar kom samtidigt; USS Nautilus 1954.

    På 1960–70-talen byggdes många reaktorer, bland annat i Sverige, som i dag får ungefär 30 procent av sin el från kärnkraft. Ett kilo uran i en reaktor kan ge lika mycket energi som tiotals ton kol, och utan koldioxidutsläpp vid drift. Nackdelarna: radioaktivt avfall som måste isoleras i hundratusentals år, risk för spridning av kärnvapenmaterial, höga byggkostnader och olyckor – Three Mile Island 1979, Tjernobyl 1986 och Fukushima 2011 – som har präglat debatten.

fortran-1957:
  period: 1940
  label: "Fortran 1957"
  title: "Fortran, det första stora programspråket"
  wiki:
    - "sv:Fortran"
    - "en:John Backus"
  text: |
    De första datorerna, som [ENIAC](#eniac-1945) och dess efterföljare, programmerades i maskinkod eller assembler: instruktion för instruktion, med minnesadresser och register. Det var långsamt, felbenäget och programmen var bundna till en enda maskintyp. Många trodde att automatiskt översatta program aldrig skulle bli lika snabba som handskrivna.

    **John Backus** (1924–2007) ledde ett team på IBM som från 1954 utvecklade FORTRAN (FORmula TRANslation), levererat 1957 för IBM 704. Programmeraren skrev formler nästan som i matematiken, till exempel *X = (A + B) \* C*, och loopar med DO-satser. En *kompilator* – ett program som översätter hela källkoden till maskinkod – gjorde om det. Teamet lade stor möda på att kompilatorn skulle optimera koden, så att resultatet blev nästan lika snabbt som handskriven kod. Det övertygade skeptikerna: ett program som tidigare krävde runt tusen maskininstruktioner kunde skrivas med ett tjugotal satser.

    Fortran blev snabbt standard för vetenskapliga och tekniska beräkningar och används fortfarande inom väder, klimat och fysik; delar av numeriska bibliotek som BLAS och LAPACK, som NumPy anropar, är skrivna i Fortran. Alternativen kom snart: Lisp (1958) för symbolisk beräkning, COBOL (1959) för administration och ALGOL (1958–60), som Backus var med och beskrev med den formella grammatiknotationen BNF. Tidigare idéer fanns, t.ex. [Zuses](#zuses-z3-1941) Plankalkül och Grace Hoppers kompilatorer.

integrerade-kretsar:
  period: 1960
  label: "Integrerade kretsar"
  title: "Den integrerade kretsen"
  wiki:
    - "en:Integrated circuit"
    - "en:Invention of the integrated circuit"
    - "en:Moore's law"
  text: |
    [Transistorn](#transistorn-1947) ersatte [elektronröret](#elektronroret-trioden-1906) men måste fortfarande lödas ihop för hand med motstånd och kondensatorer. Datorer med tiotusentals komponenter blev opålitliga och dyra – ”siffrornas tyranni”. 1958 byggde Jack Kilby på Texas Instruments en krets där flera komponenter satt i ett enda stycke germanium. 1959 tog Robert Noyce på Fairchild Semiconductor fram en bättre metod: den plana kiselkretsen, där transistorer och ledningar fotograferas och etsas fram i lager på en kiselskiva.

    Noyces metod är i grunden fortfarande hur chip tillverkas: litografi, där ljus genom en mask avgör var material ska läggas på eller tas bort. Eftersom allt tillverkas på en gång kostar en krets med tusen transistorer ungefär lika mycket som en med tio. Tidiga kunder var USA:s militär och rymdprogram; Apollos styrdator använde integrerade kretsar.

    1965 noterade Gordon Moore, senare medgrundare av Intel, att antalet komponenter per krets fördubblats varje år; ”Moores lag” blev senare en fördubbling ungefär vartannat år och höll i ett halvsekel. Från några få transistorer 1960 till tiotals miljarder i dagens processorer. Nästa steg var att lägga en hel processor på ett chip: [Intel 4004](#intel-4004-1971).

intel-4004-1971:
  period: 1960
  label: "Intel 4004 1971"
  title: "Intel 4004 – den första mikroprocessorn"
  wiki:
    - "en:Intel 4004"
    - "en:Microprocessor"
  text: |
    Japanska Busicom beställde 1969 chip till en räknemaskin från det unga företaget Intel. I stället för många specialkretsar föreslog Ted Hoff och Stanley Mazor en generell, programmerbar processor; Federico Faggin och Masatoshi Shima konstruerade den. Resultatet, Intel 4004, såldes från november 1971 och var den första kommersiella mikroprocessorn: en hel CPU på ett enda chip.

    Den hade omkring 2 300 transistorer, räknade med 4 bitar åt gången och klockades i upp till 740 kHz – ungefär lika mycket räknekraft som [ENIAC](#eniac-1945), som fyllde ett rum och vägde 27 ton. Det var möjligt tack vare [integrerade kretsar](#integrerade-kretsar) och en ny teknik med transistorgrindar av kisel i stället för metall. Intel köpte tillbaka rättigheterna från Busicom och sålde chipet till alla.

    Följden blev en linje: 8008 (1972), 8080 (1974, i de första hobbydatorerna) och 8086/8088 (1978–79), som valdes till [IBM PC](#ibm-pc-1981). Dess instruktionsuppsättning, x86, lever kvar i de flesta PC och servrar. Jämförelse: en modern processor har tiotals miljarder transistorer – omkring tio miljoner gånger fler. Konkurrenter som Motorola och senare ARM-arkitekturen (i nästan alla mobiler) följde samma idé.

arpanet-1969-2:
  period: 1960
  label: "ARPANET 1969"
  same_as: arpanet-1969

ibm-pc-1981:
  period: 1980
  label: "IBM PC 1981"
  title: "IBM PC"
  wiki:
    - "en:IBM Personal Computer"
    - "en:IBM PC compatible"
  text: |
    I augusti 1981 lanserade IBM, då världens största datorföretag, sin Personal Computer. Hemdatorer fanns redan – Apple II (1977), Commodore PET – men IBM:s namn gjorde persondatorn till ett seriöst kontorsverktyg. För att hinna klart på omkring ett år byggde ett litet team i Boca Raton, Florida, maskinen av färdiga komponenter: processorn Intel 8088 (en ättling till [Intel 4004](#intel-4004-1971)) och operativsystemet PC DOS, som licensierades från det lilla företaget Microsoft. Grundpriset var omkring 1 565 dollar.

    Arkitekturen var öppen: IBM publicerade de tekniska specifikationerna, och vem som helst kunde bygga instickskort. Det enda IBM ägde var BIOS, den lilla grundprogramvaran i ett minneschip. Compaq och andra skrev 1982–83 egna BIOS-versioner som betedde sig likadant, och ”IBM-kompatibla” kloner började säljas billigare. Microsoft hade behållit rätten att sälja DOS till andra.

    Följden var att makten i branschen flyttade från maskintillverkaren till Microsoft och Intel, ”Wintel”. IBM sålde sin PC-division till kinesiska Lenovo 2005. Konkurrenten Apple valde motsatt väg med slutna system och grafiskt gränssnitt (Macintosh 1984). Den standardiserade PC:n blev plattformen för kontorsdatorer, spel och sedan internetuppkoppling via [webben](#webben-1989), och x86 dominerar fortfarande servrar.

webben-1989:
  period: 1980
  label: "webben 1989"
  title: "World Wide Web"
  wiki:
    - "sv:World Wide Web"
    - "en:Tim Berners-Lee"
  text: |
    I mars 1989 skrev Tim Berners-Lee, brittisk fysiker och programmerare vid partikelfysiklaboratoriet CERN i Genève, ett förslag om ett informationssystem för att hålla ordning på dokument spridda över många datorer. Hans chef skrev i marginalen ”vagt men spännande”. 1990–91 byggde han de tre delar som fortfarande utgör webben: HTML (ett språk för dokument med länkar), URL (adresser till resurser) och HTTP (protokollet för att hämta dem), plus den första webbläsaren och servern.

    Webben är inte samma sak som internet. Internet, som växte ur [ARPANET](#arpanet-1969), är nätverket som flyttar datapaket mellan datorer; webben är en tjänst ovanpå det, liksom e-post. Idén om länkad text, hypertext, fanns tidigare (Ted Nelson på 1960-talet, Apples HyperCard 1987), och konkurrerande system som Gopher fanns. Avgörande var att CERN 1993 släppte webben fritt utan licensavgifter.

    Samma år gjorde webbläsaren Mosaic, med bilder i texten, webben lätt för vanliga människor. Antalet webbplatser växte från omkring 130 1993 till miljontals före år 2000. Webben blev grunden för e-handel, sökmotorer, sociala medier och, med [smartphonen](#smartphonen-2007), ett ständigt närvarande gränssnitt. Kommunikationen säkras med kryptering som bygger på [RSA](#rsa-1977) och liknande metoder.

gsm-1991:
  period: 1980
  label: "GSM 1991"
  title: "GSM – den europeiska mobiltelefonstandarden"
  wiki:
    - "sv:GSM"
    - "en:GSM"
  text: |
    GSM (först Groupe Spécial Mobile, senare Global System for Mobile Communications) var den andra generationens mobiltelefoni, 2G. Den första generationen var analog och nationell: Norden hade NMT från 1981, som fungerade i flera nordiska länder men inte i övriga Europa. 1982 började europeiska teleförvaltningar arbeta på en gemensam digital standard, och 1991 ringdes det första GSM-samtalet i Finland.

    Digitalt betyder att talet omvandlas till bitar, komprimeras och skickas i tidsluckor: varje radiokanal på 200 kHz delas i åtta tidsluckor, så åtta samtal turas om (tidsmultiplex). Det gav bättre kapacitet, kryptering av samtalet och ett SIM-kort som bar abonnemanget, så att man kunde byta telefon. Som en sidofunktion fanns textmeddelanden, SMS, max 160 tecken – en tjänst som blev oväntat populär.

    Standarden gjorde det möjligt att använda samma telefon i hela Europa och spreds sedan över världen; i USA konkurrerade den med det amerikanska systemet CDMA. Nordiska företag var centrala: Ericsson byggde nät och Nokia blev världens största telefontillverkare. GSM var en förutsättning för mobiltelefonens massgenombrott och följdes av 3G, 4G och 5G, med mobilt internet som möjliggjorde [smartphonen](#smartphonen-2007). Liksom [mikroprocessorn](#intel-4004-1971) bars tekniken av allt billigare chip.

smartphonen-2007:
  period: 2000
  label: "Smartphonen 2007"
  title: "Smartphonen"
  wiki:
    - "sv:Smartphone"
    - "en:IPhone (1st generation)"
  text: |
    Den 9 januari 2007 presenterade Steve Jobs [Apples iPhone](#iphone-2007) som ”en iPod, en telefon och en internetkommunikatör” i ett. Smarta telefoner fanns redan – BlackBerry med tangentbord för e-post, Nokias Symbian-telefoner, Windows Mobile – men de styrdes med knappar eller penna och visade webben dåligt. iPhone hade en stor pekskärm som kände av flera fingrar samtidigt, en riktig webbläsare och inget fysiskt tangentbord. 2008 öppnade App Store, där utomstående kunde sälja program.

    Google svarade med Android, ett operativsystem baserat på Linux som telefontillverkare fick använda gratis; den första Android-telefonen kom 2008. Android har i dag den klart största andelen av världens telefoner, Apples iOS en mindre men lönsammare. Nokia och BlackBerry, som dominerade 2007, föll på några år.

    Telefonen blev möjlig genom flera kedjor: allt kraftfullare och strömsnålare chip (ARM-processorer, en fortsättning på [integrerade kretsar](#integrerade-kretsar)), litiumjonbatterier, billiga sensorer (GPS, accelerometer, kamera) och snabba mobilnät som byggde vidare på [GSM](#gsm-1991). Följden var att [webben](#webben-1989) och internet fanns i fickan hos några miljarder människor. Taxi, bank, karta, kamera och nyheter samlades i en enhet; sociala medier blev mobila. För många i fattigare länder blev smartphonen den första och enda datorn.

billiga-solceller:
  period: 2000
  label: "billiga solceller"
  title: "Solcellerna blir billiga"
  wiki:
    - "sv:Solcell"
    - "en:Swanson's law"
  text: |
    En solcell omvandlar ljus direkt till elektricitet. Den består av kisel med två olika ”dopade” skikt (med små mängder andra grundämnen) som bildar ett elektriskt fält. När en foton slår loss en elektron driver fältet den åt ett håll – en ström. Att ljus kommer i paket, fotoner, som kan slå loss elektroner förklarade [Einstein](#einstein-1905-och-1915) 1905 (den fotoelektriska effekten). Den första praktiska kiselcellen byggdes på Bell Labs 1954 med omkring 6 % verkningsgrad och användes först i satelliter, där priset inte spelade någon roll.

    Priset har fallit dramatiskt. En solpanelmodul kostade omkring 100 dollar per watt i mitten av 1970-talet och runt 0,2–0,3 dollar per watt i början av 2020-talet – en minskning med över 99 %. Ungefär varje fördubbling av den totalt tillverkade mängden har sänkt priset med cirka 20 %. Drivkrafterna var tyska subventioner kring 2000–2010 som skapade en stor marknad, och därefter massproduktion i Kina, som i dag tillverkar den stora majoriteten av världens paneler.

    Solel har blivit en av de billigaste formerna av ny elproduktion på soliga platser och står för den snabbast växande delen av världens nya kapacitet. Problemet är att den bara produceras när solen skiner; därför hör den ihop med billigare lagring, som [batterier](#elbilar-och-batterier). Jämfört med [kärnkraft](#karnkraft-1954) är solparker snabba att bygga men kräver stor yta och ger varierande effekt. Verkningsgraden för kommersiella paneler ligger i dag runt 20–23 %.

djupinlarning-alexnet-2012:
  period: 2000
  label: "djupinlärning (AlexNet 2012)"
  title: "Djupinlärningens genombrott: AlexNet"
  wiki:
    - "en:AlexNet"
    - "sv:Djupinlärning"
  text: |
    Ett artificiellt neuronnät är en funktion byggd av många lager: varje lager tar en vektor av tal, multiplicerar med en matris av vikter och tillämpar en enkel olinjär funktion. Vikterna justeras genom att jämföra nätets svar med rätt svar och beräkna åt vilket håll varje vikt ska ändras (bakåtpropagering, populär från 1986). Idén är gammal, men i decennier fungerade djupa nät, med många lager, sämre än andra metoder.

    2012 deltog Alex Krizhevsky, Ilya Sutskever och Geoffrey Hinton vid University of Toronto i tävlingen ImageNet: att klassificera 1,2 miljoner bilder i 1 000 kategorier. Deras nät, AlexNet, hade åtta lager och omkring 60 miljoner vikter, och de tränade det på två grafikkort (GPU:er) avsedda för datorspel. Andelen bilder där rätt svar saknades bland nätets fem bästa gissningar var cirka 15 %, mot omkring 26 % för näst bästa bidrag – ett ovanligt stort språng.

    Tre saker samverkade: stora märkta datamängder från internet, GPU:er som gör matrisräkning parallellt, och tekniska knep som aktiveringsfunktionen ReLU (max(0, x)) och ”dropout” (att slumpvis stänga av delar av nätet under träning). Inom några år ersatte djupinlärning äldre metoder i bildigenkänning, taligenkänning och översättning. Arkitekturen transformer (2017) ledde sedan till stora språkmodeller och [generativ AI](#generativ-ai-2), och liknande metoder låg bakom [AlphaFold](#alphafold-2020). Hinton fick Nobelpriset i fysik 2024 tillsammans med John Hopfield.

generativ-ai-2:
  period: 2020
  label: "Generativ AI"
  title: "Generativ AI"
  wiki:
    - "en:Generative artificial intelligence"
    - "en:Transformer (deep learning architecture)"
  text: |
    Generativ AI är system som skapar nytt innehåll – text, bild, ljud, kod – i stället för att bara klassificera. Stora språkmodeller (LLM:er) som GPT tränas på en enkel uppgift: givet en text, förutsäg nästa ord (egentligen nästa ”token”, en ordbit). Modellen är ett neuronnät av typen transformer, föreslagen av forskare på Google 2017, där en mekanism kallad uppmärksamhet låter varje ord vikta information från alla andra ord i texten. Med hundratals miljarder vikter och träning på en stor del av den skrivna texten på internet uppstår förmågor som översättning, sammanfattning och programmering.

    Genombrottet för allmänheten var ChatGPT från OpenAI i november 2022, som fick omkring 100 miljoner användare på ungefär två månader. Modellen hade efterjusterats med mänsklig återkoppling för att följa instruktioner och föra samtal. Bildgeneratorer som DALL-E, Midjourney och Stable Diffusion (2022) använder diffusionsmodeller, som lär sig att stegvis omvandla brus till en bild som matchar en textbeskrivning.

    Det bygger direkt på [djupinlärningens genombrott](#djupinlarning-alexnet-2012) och på grafikprocessorer i stora datacenter; träning av de största modellerna kostar hundratals miljoner dollar och mycket el. Tekniken används för programmering, kundtjänst och forskning, bl.a. [i matematiken](#ai-i-matematiken-formella-bevis-i-lean). Problem är påhittade fakta (”hallucinationer”), upphovsrätt, desinformation och påverkan på arbetsmarknaden. Hur långt utvecklingen går är omstritt.

elbilar-och-batterier:
  period: 2020
  label: "elbilar och batterier"
  title: "Elbilar och litiumjonbatterier"
  wiki:
    - "sv:Litiumjonbatteri"
    - "en:Electric car"
  text: |
    Elbilar är äldre än bensinbilar – omkring 1900 var en stor del av USA:s bilar eldrivna – men blybatterier var tunga och räckte kort, och [Ford T](#ford-t-1908) med förbränningsmotor vann. Det som ändrade läget var litiumjonbatteriet. I det vandrar litiumjoner mellan två elektroder när man laddar och laddar ur; litium är den lättaste metallen, vilket ger mycket energi per kilo. Grunden lades av Stanley Whittingham på 1970-talet, John Goodenough (koboltoxid-katoden 1980) och Akira Yoshino (första kommersiellt användbara cellen 1985). Sony började sälja dem 1991 för videokameror. De tre fick Nobelpriset i kemi 2019.

    Batterier för mobiler och bärbara datorer drev upp volymen. Tesla visade med Roadster (2008) och Model S (2012) att elbilar kunde vara snabba och ha lång räckvidd. Batteripriset per kilowattimme har fallit från över 1 000 dollar kring 2010 till omkring 100–150 dollar på 2020-talet, ungefär 90 %. Kinesiska tillverkare som CATL och BYD dominerar nu produktionen, ofta med den billigare och tåligare kemin litiumjärnfosfat.

    Omkring en av fem nya bilar i världen 2024 var laddbara, med Kina, Norge (över 90 %) och andra nordiska länder i täten. Elmotorn omvandlar runt 90 % av energin till rörelse, mot omkring 25–30 % för en bensinmotor. Samma batterier lagrar nu el från [solceller](#billiga-solceller) i elnätet. Utmaningar är gruvdrift efter litium, kobolt och nickel, laddinfrastruktur och återvinning.
