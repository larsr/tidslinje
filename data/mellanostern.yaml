# Mellanöstern
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

fatimidkalifatet-i-kairo:
  period: 1000
  label: "Fatimidkalifatet i Kairo"
  title: "Fatimidkalifatet i Kairo"
  wiki:
    - "en:Fatimid Caliphate"
    - "sv:Kairo"
  text: |
    Islam delades tidigt i två huvudriktningar: **sunniter**, majoriteten, och **shiiter**, som ansåg att ledarskapet borde gå i arv i profeten Muhammeds familj via hans dotter Fatima och svärson Ali. **Fatimiderna** var en shiitisk dynasti (av den ismailitiska grenen) som gjorde anspråk på att härstamma från Fatima – därav namnet.

    De tog makten i Tunisien 909 och erövrade Egypten 969, där de grundade **Kairo** som ny huvudstad. De utropade sig till kalifer, det vill säga ledare för alla muslimer, i direkt konkurrens med den sunnitiska abbasidiska kalifen i Bagdad. Kring år 1000 kontrollerade de Nordafrika, Egypten, Palestina, Syrien och de heliga städerna Mecka och Medina.

    Egypten var rikt tack vare Nilens jordbruk och handeln mellan Indiska oceanen och Medelhavet. Fatimiderna grundade 970 moskén och lärosätet **al-Azhar** i Kairo, ett av världens äldsta fortfarande verksamma universitet. Kalifatet försvagades under 1000-talet och [upphörde 1171](#saladin-tar-egypten-fatimiderna-faller) när Saladin tog makten och återinförde sunnismen – samme Saladin som [återtog Jerusalem från korsfararna 1187](#saladin-vinner-vid-hattin-1187-tar).

al-hakim-river-gravkyrkan-1009:
  period: 1000
  label: "al-Hakim river Gravkyrkan 1009"
  title: "Al-Hakim river Gravkyrkan 1009"
  wiki:
    - "en:Al-Hakim bi-Amr Allah"
    - "en:Church of the Holy Sepulchre"
  text: |
    **Al-Hakim** (985–1021) var den sjätte fatimidiske kalifen i Kairo, som härskade över Egypten och Palestina. Han blev kalif som elvaåring och är känd som en av historiens mest oberäkneliga härskare. Han förbjöd bland annat vissa grönsaker, schack och att kvinnor gick ut, lät döda många ämbetsmän och växlade mellan att förfölja och gynna kristna och judar.

    1009 beordrade han att **Gravkyrkan** i Jerusalem skulle rivas. Gravkyrkan är byggd över den plats där Jesus enligt traditionen begravdes och uppstod, och är kristendomens heligaste byggnad. Den förstördes ända ner till grunden runt själva graven. Kyrkan byggdes upp igen först på 1030- och 1040-talen efter ett avtal med Bysans.

    Förstörelsen väckte stor upprördhet i Västeuropa och användes nästan 90 år senare som ett av argumenten för det **[första korståget](#forsta-korstaget-jerusalem-intas-1099)** 1096–1099. Al-Hakim försvann spårlöst 1021 under en nattlig ritt. En grupp anhängare ansåg att han var gudomlig och inte dött; ur den växte **druserna**, en religiös gemenskap som än idag finns i Libanon, Syrien och Israel.

ibn-al-haytham-optik:
  period: 1000
  label: "Ibn al-Haytham, optik"
  title: "Ibn al-Haytham – optikens grundare"
  wiki:
    - "sv:Ibn al-Haytham"
    - "en:Book of Optics"
  text: |
    **Ibn al-Haytham** (ca 965–ca 1040), i Europa kallad *Alhazen*, var en matematiker och fysiker från Basra i dagens Irak som verkade i Kairo. Enligt en berättelse lovade han kalifen al-Hakim att reglera Nilens översvämningar, insåg att det var omöjligt och låtsades vara galen för att undgå straff – och fick under husarresten tid att forska.

    Hans viktigaste insats gällde hur vi ser. De antika grekerna trodde ofta att ögat sänder ut strålar som ”känner av” föremål. Ibn al-Haytham visade i stället att ljus reflekteras från föremålen och går in i ögat – den förklaring vi använder idag. Han studerade reflektion och brytning, linser, och beskrev **camera obscura**: ett mörkt rum där ljus genom ett litet hål ger en upp-och-nervänd bild på väggen, principen bakom kameran.

    Lika viktig var hans metod. Han krävde att påståenden skulle prövas med upprepade, kontrollerade experiment och matematisk analys, och skrev att den som söker sanningen ska misstro även sina auktoriteter. Han räknas därför som en föregångare till den vetenskapliga metoden. [Hans bok](#ibn-al-haytham-optikens-bok) översattes till latin omkring 1200 och påverkade bland andra [Roger Bacon](#roger-bacon-experiment-optik), Kepler och, via linsteknik, [glasögon](#glasogon-uppfinns-1286) och [teleskop](#galileis-teleskop-1609).

fatimider:
  period: 1020
  label: "Fatimider"
  title: "Fatimiderna kring 1020–1040"
  wiki:
    - "en:Fatimid Caliphate"
    - "en:Al-Mustansir Billah"
  text: |
    **Fatimiderna** var en shiitisk muslimsk dynasti som från 969 styrde Egypten från **Kairo** och gjorde anspråk på att vara kalifer – ledare för alla muslimer – i konkurrens med de sunnitiska abbasidiska kaliferna i Bagdad (se [Fatimidkalifatet ~1000](#fatimidkalifatet-i-kairo)). Sunniter och shiiter är islams två huvudriktningar, som delades i en strid om vem som skulle leda muslimerna efter profeten Muhammed.

    Efter den oberäknelige kalifen [al-Hakims](#al-hakim-river-gravkyrkan-1009) försvinnande 1021 blev styret lugnare. Kalifen **az-Zahir** (1021–1036) slöt fred med Bysans, och avtalet gjorde det möjligt att bygga upp Gravkyrkan i Jerusalem igen. Under hans son **al-Mustansir**, som regerade i 60 år (1036–1094) – längst av alla muslimska härskare – nådde riket sin största ekonomiska blomstring. Egypten var navet i handeln mellan Indiska oceanen och Medelhavet.

    Men från mitten av 1000-talet gick det utför: en serie låga Nilöversvämningar 1065–1072 gav svält, soldaterna gjorde uppror, och de turkiska [seldjuker](#seldjuker-tranger-in-i-khorasan)na (se seldjuker) tog Syrien och Jerusalem 1073. Splittringen i Mellanöstern var en orsak till att [första korståget kunde ta Jerusalem 1099](#forsta-korstaget-jerusalem-intas-1099).

ibn-al-haytham-optikens-bok:
  period: 1020
  label: "Ibn al-Haytham: Optikens bok"
  title: "Ibn al-Haytham: Optikens bok"
  wiki:
    - "en:Book of Optics"
    - "sv:Ibn al-Haytham"
  text: |
    **Optikens bok** (arabiska *Kitab al-Manazir*) skrevs av **Ibn al-Haytham** i Kairo omkring 1011–1021, ett verk i sju band. Ibn al-Haytham var en matematiker och fysiker från Basra ([se ~1000](#ibn-al-haytham-optik)).

    Boken avgjorde en gammal fråga: hur ser vi? Antika tänkare som Euklides och Ptolemaios trodde att ögat sände ut strålar. Ibn al-Haytham argumenterade att ljus från en ljuskälla reflekteras mot föremål och sedan i raka linjer in i ögat. Han visade det med experiment, bland annat med mörka rum och små hål (**camera obscura**), och visade matematiskt hur reflektion i speglar och brytning av ljus i vatten och glas fungerar. Han beskrev också ögats anatomi.

    Det nya var metoden: hypoteser prövades med kontrollerade, upprepbara experiment och matematik. Boken översattes till latin omkring 1200 som *De aspectibus* och var Europas standardverk i optik i 400 år. Den låg bakom förståelsen av linser som ledde till [glasögon i Italien omkring 1290](#glasogon-uppfinns-1286), och senare till mikroskop och [teleskop kring 1600](#galileis-teleskop-1609), vilka Galileo och Kepler använde. Därför kallas han ibland optikens fader.

seldjuker-tranger-in-i-khorasan:
  period: 1020
  label: "seldjuker tränger in i Khorasan"
  title: "Seldjukerna tränger in i Khorasan"
  wiki:
    - "sv:Seldjuker"
    - "en:Seljuk Empire"
    - "en:Battle of Dandanaqan"
  text: |
    **Seldjukerna** var en ledande släkt bland **oghuzturkarna**, turkisktalande nomader som levde med hästar och boskap på stäpperna öster om Kaspiska havet. De var nyligen omvända till sunniislam. Kring 1020–1035 drev de sina hjordar söderut in i **Khorasan**, en rik region i nordöstra Iran och dagens Afghanistan och Turkmenistan, som då hörde till Ghaznaviderriket (se [Mahmud av Ghazni](#mahmud-av-ghazni)).

    Ghaznaviderna försökte stoppa dem, men 1040 besegrade seldjukerna under bröderna Tughril och Chaghri en ghaznavidisk armé vid [Dandanaqan](#seldjuker-slar-ghaznaviderna-dandanaqan). Ghaznavidernas tunga armé med krigselefanter klarade inte de snabba ryttarna i öknen. Därefter gick det fort: 1055 intog Tughril [Bagdad](#seldjuker-tar-bagdad-1055-tughril-sultan) och fick titeln sultan av den abbasidiske kalifen, som förblev religiöst överhuvud men utan politisk makt.

    Seldjukerna skapade ett stort rike från Centralasien till Medelhavet. 1071 besegrade de Bysans vid **[Manzikert](#manzikert-1071-seldjuker-krossar-bysans)** och öppnade Anatolien (dagens Turkiet) för turkisk inflyttning – början på att området blev turkiskt. Bysans bad då västerlandet om hjälp, vilket blev en direkt utlösande orsak till första korståget 1095. Det osmanska riket växte senare fram ur samma turkiska invandring.

seldjuker-tar-bagdad-1055-tughril-sultan:
  period: 1040
  label: "Seldjuker tar Bagdad 1055, Tughril sultan"
  title: "Seldjukerna tar Bagdad 1055"
  wiki:
    - "en:Tughril"
    - "en:Seljuk Empire"
  text: |
    **Bagdad** var huvudstad för det **abbasidiska kalifatet** – kalifen var formellt ledare för hela den sunnimuslimska världen, en sorts andlig och politisk efterträdare till profeten Muhammed. Men sedan 945 hade kalifen ingen verklig makt; han kontrollerades av en shiamuslimsk iransk dynasti, buyiderna.

    **Tughril Beg** (cirka 990–1063), ledare för de turkiska seldjukerna som besegrat ghaznaviderna vid [Dandanaqan 1040](#seldjuker-slar-ghaznaviderna-dandanaqan), tågade in i Bagdad 1055 – officiellt för att befria kalifen. Kalifen gav honom titeln **sultan** ("makt, myndighet"), vilket gjorde honom till den världsliga härskaren medan kalifen förblev religiös symbol.

    Varför det spelar roll: uppdelningen mellan kalif (religion) och sultan (politisk-militär makt) blev en modell i den islamiska världen. [Seldjukerna](#seldjukriket-grundas) gjorde turkar till härskande klass i stora delar av Mellanöstern i nästan tusen år – fram till Osmanska rikets fall 1922. De stärkte också sunniislam mot shiitiska rörelser, bland annat genom att grunda skolor, [madrasor](#nizam-al-mulk-grundar-madrasor).

fatimiderna-forsvagas:
  period: 1040
  label: "fatimiderna försvagas"
  title: "Fatimidkalifatet försvagas"
  wiki:
    - "en:Fatimid Caliphate"
  text: |
    **Fatimiderna** var en shiamuslimsk dynasti som från 909 styrde Nordafrika och från 969 Egypten. De grundade **Kairo** och moskén och lärosätet al-Azhar, och gjorde anspråk på att vara de rättmätiga kaliferna, i konkurrens med abbasiderna i Bagdad. Namnet kommer från Fatima, profeten Muhammeds dotter.

    Vid 1000-talets mitt började de försvagas. De förlorade Nordafrika när lokala vasaller bytte sida (se [Banu Hilal](#banu-hilal-beduiner-odelagger-ifriqiya)). Under 1060-talet drabbades Egypten av sju års svält när Nilen inte svämmade över som vanligt, samtidigt som turkiska, berbiska och sudanesiska truppavdelningar i armén slogs mot varandra. Kairo plundrades, och kalifens bibliotek – ett av världens största – skingrades.

    Varför det spelar roll: seldjukerna tog [Syrien och Jerusalem](#jerusalem-seldjukiskt-1073) från fatimiderna på 1070-talet. Splittringen mellan seldjuker och fatimider gjorde det lättare för korsfararna att [ta Jerusalem 1099](#forsta-korstaget-jerusalem-intas-1099). Fatimiderna [avsattes slutligen av Saladin 1171](#saladin-tar-egypten-fatimiderna-faller).

manzikert-1071-seldjuker-krossar-bysans:
  period: 1060
  label: "Manzikert 1071: seldjuker krossar Bysans"
  title: "Slaget vid Manzikert 1071"
  wiki:
    - "sv:Slaget vid Manzikert"
    - "en:Battle of Manzikert"
  text: |
    **Bysans** var det östromerska riket med huvudstad Konstantinopel (Istanbul) – fortsättningen på Romarriket, kristet och grekisktalande. **Seldjukerna** var en turkisk dynasti från Centralasien som på 1000-talet erövrat Iran och Irak och gjort sig till beskyddare av den sunnimuslimska kalifen i Bagdad.

    I augusti 1071 möttes kejsar **Romanos IV** och sultanen **Alp Arslan** vid Manzikert nära Vansjön i östra Turkiet. Bysans hade uppskattningsvis 40 000 man (bedömningarna varierar från 20 000 till 70 000), men delar av armén deserterade och kejsaren tillfångatogs – första gången en romersk kejsare hamnat i en muslimsk härskares fångenskap.

    Själva slaget var inte så blodigt. Det förödande var följden: inbördeskrig i Bysans, och under de följande tio åren vällde turkiska nomadgrupper in över Anatolien, som dittills varit rikets kärnland. Där uppstod [Rum-sultanatet](#rum-sultanatet-i-anatolien), och så småningom dagens Turkiet. Bysans vände sig i nöd till påven om hjälp – en direkt bakgrund till korstågen från 1095 (se [Påven utlyser korståg i Clermont 1095](#paven-utlyser-korstag-i-clermont-1095)).

jerusalem-seldjukiskt-1073:
  period: 1060
  label: "Jerusalem seldjukiskt 1073"
  title: "Turkarna tar Jerusalem 1073"
  wiki:
    - "en:Atsiz ibn Uvaq"
    - "en:Fatimid Caliphate"
  text: |
    Jerusalem hade sedan 970-talet styrts av **fatimiderna** – en shiamuslimsk dynasti med säte i Kairo som konkurrerade med den sunnimuslimska kalifen i Bagdad. Staden var helig för judar, kristna och muslimer, och europeiska pilgrimer kunde i regel resa dit.

    Omkring 1073 intogs staden av **Atsiz**, en turkmensk krigsherre i seldjukernas tjänst (seldjukerna var den turkiska dynasti som just besegrat Bysans vid [Manzikert](#manzikert-1071-seldjuker-krossar-bysans)). Efter ett uppror 1077 lät Atsiz enligt källorna massakrera tusentals av stadens invånare. Mellanöstern var vid denna tid ett lapptäcke av rivaliserande turkiska befälhavare, arabiska emirer och fatimider.

    Berättelser om att pilgrimer trakasserades under turkiskt styre användes i Europa som argument för korståg. Ironiskt nog hade fatimiderna hunnit återta Jerusalem 1098 – bara ett år innan korsfararna stormade staden 1099 (se [Första korståget](#forsta-korstaget-jerusalem-intas-1099)). Korsfararna mötte alltså en splittrad muslimsk värld, vilket var en avgörande orsak till att de lyckades.

forsta-korstaget-jerusalem-intas-1099:
  period: 1080
  label: "Första korståget: Jerusalem intas 1099, massaker"
  title: "Första korståget och Jerusalem 1099"
  wiki:
    - "sv:Första korståget"
    - "en:Siege of Jerusalem (1099)"
  text: |
    Efter påven Urban II:s uppmaning 1095 (se [Påven utlyser korståg i Clermont](#paven-utlyser-korstag-i-clermont-1095)) gav sig uppskattningsvis 60 000–100 000 människor iväg österut 1096. En första våg av fattiga och dåligt beväpnade, ”folkkorståget”, mördade judar i Rhenlandet på vägen och förintades sedan av turkarna i Anatolien. Huvudhären, ledd av franska och normandiska adelsmän, samlades i Konstantinopel 1097.

    Färden var fruktansvärd: hetta, svält, sjukdom. Belägringen av Antiokia i Syrien tog 1097–1098 nästan åtta månader. Korsfararna gynnades av att den muslimska världen var splittrad mellan rivaliserande seldjukiska härskare och fatimiderna i Egypten. När de i juni 1099 nådde Jerusalem återstod kanske 12 000–15 000 stridande.

    Den 15 juli 1099 stormades staden. Korsfararna dödade en stor del av invånarna, muslimer och judar – samtida krönikor talar om att man vadade i blod. Moderna forskare uppskattar antalet döda till omkring 3 000 snarare än de 70 000 som senare arabiska källor anger, men det var en massaker som även samtiden såg som exceptionell. Den brändes in i det muslimska minnet och används i propaganda än idag. Korståget ledde till [korsfararstater](#korsfararstater)na (se korsfararstater).

korsfararstater:
  period: 1080
  label: "korsfararstater"
  title: "Korsfararstaterna"
  wiki:
    - "sv:Korsfararstaterna"
    - "en:Crusader states"
  text: |
    Efter första korståget 1096–1099 grundade de europeiska ledarna fyra egna stater längs Medelhavets östkust, i dagens Israel, Palestina, Libanon, Syrien och sydöstra Turkiet. Tillsammans kallades de **Outremer** (franska för ”bortom havet”). Se [Korsfararstater: Jerusalem, Antiokia, Edessa, Tripoli](#korsfararstater-jerusalem-antiokia).

    De styrdes enligt europeiskt feodalt mönster: en kung eller greve som gav land till vasaller i utbyte mot krigstjänst. Men européerna var en liten minoritet – kanske några hundra tusen bland en befolkning av muslimer, österländska kristna och judar som var många gånger fler. De var beroende av ständig påfyllning från Europa och av italienska handelsstäder som Venedig och Genua för transport och handel.

    För att försvara sig byggde de väldiga borgar, som Krak des Chevaliers i Syrien, och nya riddarordnar uppstod (se [Johanniterorden](#johanniterorden-1113), [Tempelherreorden](#tempelherreorden-1119)). Edessa föll redan 1144, vilket utlöste andra korståget. [Saladin tog Jerusalem 1187](#saladin-vinner-vid-hattin-1187-tar), och den sista stora fästningen, Akko, föll 1291 – staterna överlevde alltså i knappt 200 år. Kontakten gav Europa nya varor, idéer och arabisk lärdom.

korsfararstater-jerusalem-antiokia:
  period: 1100
  label: "Korsfararstater: Jerusalem, Antiokia, Edessa, Tripoli"
  title: "De fyra korsfararstaterna"
  wiki:
    - "sv:Kungariket Jerusalem"
    - "en:Crusader states"
  text: |
    Efter [första korståget (1096–1099)](#forsta-korstaget-jerusalem-intas-1099) grundade de europeiska ledarna fyra stater längs Medelhavets östkust (se [korsfararstater](#korsfararstater)):

    **Grevskapet Edessa** (1098–1144), i dagens sydöstra Turkiet, längst in i landet och svårast att försvara; det föll först och utlöste [andra korståget](#andra-korstaget-114749). **Furstendömet Antiokia** (1098–1268) i nordvästra Syrien, kring en av antikens största städer. **Kungariket Jerusalem** (1099–1291) i dagens Israel/Palestina och Libanon, det viktigaste, med en kung som formellt var de övrigas överherre; först Godfrid av Bouillon, som vägrade bära kungakrona där Kristus burit en törnekrona, sedan hans bror Balduin I. **Grevskapet Tripoli** (1109–1289) i dagens Libanon.

    Tillsammans var de ett smalt kustland, cirka 700 km långt men ofta bara 50–100 km brett. Européerna (kallade ”franker”) var en liten elit som styrde över en majoritet av muslimer och österländska kristna, och var beroende av italienska flottor. Under ett par generationer anpassade de sig till lokala seder, vilket chockade nyanlända korsfarare. [Saladin tog Jerusalem 1187](#saladin-vinner-vid-hattin-1187-tar), och den sista resten, Akko, föll 1291.

zengi-i-mosul:
  period: 1120
  label: "Zengi i Mosul"
  title: "Zengi i Mosul"
  wiki:
    - "en:Imad al-Din Zengi"
    - "en:Zengid dynasty"
  text: |
    Efter [första korståget (1096–99)](#forsta-korstaget-jerusalem-intas-1099) hade västeuropeiska riddare grundat fyra så kallade [korsfararstater](#korsfararstater-jerusalem-antiokia) i Mellanöstern: kungariket Jerusalem, Antiochia, Tripoli och Edessa. De muslimska härskarna i området var splittrade och stred mest med varandra.

    **Imad ad-Din Zengi** (ca 1085–1146) var en turkisk krigsherre i tjänst hos seldjukerna, den turkiska dynasti som formellt styrde stora delar av Mellanöstern. 1127 blev han *atabeg* (guvernör och förmyndare åt en ung prins, i praktiken självständig härskare) i **Mosul** i dagens norra Irak, och 1128 tog han även Aleppo i Syrien. Han var hård och skoningslös, och lade mer kraft på att ta muslimska grannstäder, särskilt Damaskus, än på korsfararna.

    Men hans erövring av Edessa 1144 – första gången en korsfararstat föll – gjorde honom till en hjälte i den muslimska världen och utlöste andra korståget (se [Zengi tar Edessa 1144](#zengi-tar-edessa-1144)). Han mördades 1146 av en av sina slavar. Hans son **[Nur ad-Din](#nur-ad-din)** fortsatte enandet av Syrien, och via Nur ad-Dins tjänst kom Saladin till makten – den som till slut [tog Jerusalem 1187](#saladin-vinner-vid-hattin-1187-tar). Zengi står alltså i början av den kedja som ledde till korsfararstaternas fall.

zengi-tar-edessa-1144:
  period: 1140
  label: "Zengi tar Edessa 1144"
  title: "Zengi erövrar Edessa 1144"
  wiki:
    - "en:Siege of Edessa (1144)"
    - "sv:Grevskapet Edessa"
  text: |
    **Edessa** (dagens Şanlıurfa i sydöstra Turkiet) var huvudstad i grevskapet Edessa, den första av de fyra korsfararstater som västeuropeiska riddare grundat i Mellanöstern under [första korståget](#forsta-korstaget-jerusalem-intas-1099) 1098. Det låg längst norrut och österut, långt från de andra korsfararstaterna och hade stor kristen armenisk och syrisk befolkning.

    1144 var greven, Joscelin II, borta med sin armé. **Zengi**, den turkiske härskaren över Mosul och Aleppo (se [Zengi i Mosul](#zengi-i-mosul)), utnyttjade tillfället och belägrade staden från slutet av november. Hans ingenjörer grävde under murarna och fick en del att rasa; staden föll efter ungefär fyra veckor, på julafton 1144. Många av de västerländska invånarna dödades, medan de lokala kristna i stort sett skonades.

    Det var första gången en korsfararstat föll, och nyheten chockade Europa. Påven Eugenius III utlyste [andra korståget (1147–49)](#andra-korstaget-114749), som blev ett misslyckande. I den muslimska världen gjorde segern Zengi till en förkämpe för jihad, heligt krig – en idé som hans son [Nur ad-Din](#nur-ad-din) och sedan Saladin byggde vidare på. Resterna av grevskapet föll 1150.

nur-ad-din:
  period: 1140
  label: "Nur ad-Din"
  title: "Nur ad-Din"
  wiki:
    - "en:Nur ad-Din (died 1174)"
    - "en:Zengid dynasty"
  text: |
    **Nur ad-Din** (1118–1174) var son till Zengi (se [Zengi i Mosul](#zengi-i-mosul)) och ärvde Aleppo när fadern mördades 1146. Han var en av de mest betydelsefulla muslimska härskarna under korstågstiden och den som lade grunden för Saladins framgångar.

    Hans viktigaste insats var att ena Syrien. Han slog tillbaka [andra korståget](#andra-korstaget-114749), tog Damaskus 1154 och kunde därmed hota korsfararstaterna från ett sammanhängande område. Till skillnad från sin hårdföre far gjorde han en religiös sak av kriget: han byggde skolor, sjukhus och moskéer och gjorde propaganda för jihad (heligt krig) mot korsfararna och för att återta Jerusalem. Han lät tillverka en predikstol som skulle ställas i al-Aqsa-moskén i Jerusalem när staden erövrats.

    På 1160-talet tävlade han med kungen av Jerusalem om kontrollen över Egypten, där fatimiddynastin var svag. Han skickade sin general Shirkuh och dennes brorson **Saladin**, som till slut tog makten i Egypten 1169–71 (se [Saladin tar Egypten](#saladin-tar-egypten-fatimiderna-faller)). Saladin blev därefter alltmer självständig. När Nur ad-Din dog 1174 tog Saladin över även Syrien – och därmed var korsfararstaterna omringade. Predikstolen ställdes slutligen i al-Aqsa när [Saladin tog Jerusalem 1187](#saladin-vinner-vid-hattin-1187-tar).

saladin-tar-egypten-fatimiderna-faller:
  period: 1160
  label: "Saladin tar Egypten, fatimiderna faller 1171"
  title: "Saladin tar Egypten 1169–1171"
  wiki:
    - "sv:Saladin"
    - "sv:Fatimider"
  text: |
    **Fatimiderna** var en shiamuslimsk dynasti som styrt Egypten sedan 969 och grundat Kairo. De var rivaler till den sunnimuslimska abbasidkalifen i Bagdad (islam är sedan 600-talet delad i sunni och shia, ursprungligen i frågan om vem som skulle leda de troende). Kring 1160 var fatimidväldet svagt, och både kungariket Jerusalem och [Nur ad-Din](#nur-ad-din) i Syrien (se dit) försökte ta kontroll över det rika Egypten.

    Nur ad-Din skickade sin kurdiske general Shirkuh och dennes brorson **Saladin** (Salah ad-Din, 1137–1193). 1169 blev Shirkuh vesir (regeringschef) åt den fatimidiske kalifen men dog efter två månader, och Saladin tog över. När den siste fatimidkalifen dog 1171 lät Saladin avskaffa kalifatet och erkänna abbasidkalifen i stället. Egypten blev åter sunnimuslimskt.

    Med Egyptens rikedomar blev Saladin mäktigare än sin herre. Efter Nur ad-Dins död 1174 tog han även Syrien och omringade därmed korsfararstaterna. [1187 krossade han Jerusalems armé vid Hattin](#saladin-vinner-vid-hattin-1187-tar) och erövrade Jerusalem, vilket utlöste [tredje korståget](#tredje-korstaget-118992) med [Rikard Lejonhjärta](#rikard-lejonhjarta). Hans dynasti, ayyubiderna, styrde till 1250; han var känd även i Europa för sin ridderlighet. Al-Azhar i Kairo, grundat av fatimiderna, är i dag ett av världens äldsta universitet.

saladin-vinner-vid-hattin-1187-tar:
  period: 1180
  label: "Saladin vinner vid Hattin 1187, tar Jerusalem"
  title: "Hattin och Jerusalems fall 1187"
  wiki:
    - "sv:Slaget vid Hattin"
    - "sv:Saladin"
    - "en:Siege of Jerusalem (1187)"
  text: |
    **Saladin** (Salah ad-Din, ca 1137–1193) var en kurdisk härförare som [1171 tog makten i Egypten](#saladin-tar-egypten-fatimiderna-faller) och sedan i Syrien. Han grundade **ayyubiddynastin** och var den förste på länge som enade de muslimska länderna runt [korsfararstaterna](#korsfararstater) – de kristna stater som grundats längs Levantens kust efter första korståget 1099.

    I juli 1187 lockade han korsfararnas armé ut i den torra slätten vid **Hattin** nära Tiberiassjön. Den kristna armén, uppskattningsvis 15 000–20 000 man, var utmattad av törst och omringades; nästan hela armén dödades eller tillfångatogs, och kung Guy av Jerusalem blev fånge. Saladins armé var troligen något större.

    I oktober kapitulerade **Jerusalem**. Till skillnad från [korsfararnas blodbad 1099](#forsta-korstaget-jerusalem-intas-1099) lät Saladin invånarna köpa sig fria, vilket gav honom eftermäle även i Europa som en ädel fiende. Förlusten utlöste [tredje korståget](#tredje-korstaget-118992) (se detta).

ayyubider:
  period: 1200
  label: "Ayyubider"
  title: "Ayyubiderna"
  wiki:
    - "sv:Ayyubider"
    - "en:Ayyubid dynasty"
  text: |
    **Ayyubiderna** var den dynasti som Saladin grundade 1171, uppkallad efter hans far Ayyub. De var kurder och styrde Egypten, Syrien, delar av Irak, Jemen och västra Arabien. Riket fungerade som en familjefederation: efter Saladins död 1193 delades det mellan bröder, söner och brorsöner som ofta slogs med varandra.

    Runt 1200 tog Saladins bror **al-Adil** över och enade riket igen; därefter styrde hans son **al-Kamil** Egypten (1218–1238). Ayyubiderna stod emot [femte korståget](#femte-korstaget-mot-egypten-1217) (se detta) och gjorde [1229 ett uppmärksammat avtal med kejsar Fredrik II](#fredrik-ii-far-jerusalem-genom-avtal) som tillfälligt lämnade Jerusalem till de kristna. De byggde skolor (madrasor), befästningar som citadellet i Kairo och stödde handel med italienska städer.

    Deras armé byggde alltmer på **mamluker**, slavsoldater av främst turkiskt ursprung, köpta som unga och tränade till elitkrigare. 1250 störtade mamlukerna dynastin i Egypten och grundade [Mamluksultanatet](#mamluker-i-egypten-1250), som 1260 stoppade mongolerna vid [Ain Jalut](#ain-jalut-1260-mamluker-stoppar).

femte-korstaget-mot-egypten-1217:
  period: 1200
  label: "femte korståget mot Egypten 1217"
  title: "Femte korståget 1217–1221"
  wiki:
    - "sv:Femte korståget"
    - "en:Fifth Crusade"
  text: |
    Efter att [fjärde korståget hamnat i Konstantinopel (1204)](#fjarde-korstaget-plundrar-konstantinopel) försökte påvarna igen. Strategin var nu att anfalla **Egypten**, det rika kärnlandet i ayyubidernas rike (se ”[Ayyubider](#ayyubider)”), och sedan byta det mot Jerusalem. Korstågsarmén bestod av ungerska, österrikiska, tyska, frisiska och italienska kontingenter och leddes delvis av det påvliga sändebudet Pelagius.

    1218 belägrades hamnstaden **Damietta** vid Nilens mynning. Den föll efter omkring 17 månader, 1219, då en stor del av invånarna dött av svält och sjukdom. Sultanen al-Kamil erbjöd att lämna tillbaka Jerusalem i utbyte mot Damietta, men Pelagius vägrade. Under belägringen besökte [Franciskus av Assisi](#franciskus-av-assisi) sultanen för att försöka omvända honom.

    1221 marscherade korsfararna mot Kairo just när Nilen svämmade över. Egyptierna öppnade dammar, armén blev instängd i lera och vatten och måste kapitulera och lämna Damietta. Allt var förlorat. Jerusalem kom i stället till de kristna genom förhandling 1229 (se ”[Fredrik II:s korståg](#fredrik-ii-s-korstag-1228)”).

fredrik-ii-far-jerusalem-genom-avtal:
  period: 1220
  label: "Fredrik II får Jerusalem genom avtal 1229"
  title: "Fredrik II får Jerusalem utan strid 1229"
  wiki:
    - "sv:Fredrik II (tysk-romersk kejsare)"
    - "en:Sixth Crusade"
  text: |
    **Fredrik II** (1194–1250) var tysk-romersk kejsare och samtidigt kung av Sicilien – en ovanligt bildad härskare som växte upp i det mångkulturella Palermo och enligt uppgift talade bland annat arabiska. Han hade lovat påven att leda ett korståg men sköt upp det så länge att han bannlystes (uteslöts ur kyrkan) 1227.

    När han ändå seglade till Mellanöstern 1228, med en liten armé, förhandlade han i stället för att kriga. Den egyptiske sultanen **al-Kamil** (av ayyubiddynastin, Saladins efterträdare) var upptagen av konflikter med sina egna släktingar och gick med på ett tioårigt fredsavtal 1229: de kristna fick Jerusalem, Betlehem och Nasaret, medan muslimerna behöll Tempelberget med Klippdomen och al-Aqsamoskén.

    Det var en diplomatisk framgång som troende på båda sidor avskydde: påven för att en bannlyst kejsare ”befriat” Jerusalem genom att kompromissa med muslimer, och muslimska kritiker för att sultanen gett bort staden. [Jämför med det första korståget 1099](#forsta-korstaget-jerusalem-intas-1099), då Jerusalem togs med massaker. Uppgörelsen höll inte: 1244 plundrades staden av khwarazmiska legosoldater (på flykt undan mongolerna), och den förblev sedan i muslimska händer fram till 1917.

mamluker-i-egypten-1250:
  period: 1240
  label: "Mamluker i Egypten 1250"
  title: "Mamlukerna tar makten i Egypten 1250"
  wiki:
    - "sv:Mamluker"
    - "en:Mamluk Sultanate"
  text: |
    *Mamluk* betyder på arabiska ”ägd”. Mamluker var slavsoldater: pojkar, ofta turkisktalande från stäpperna norr om Svarta havet, som köptes, konverterades till islam och tränades till elitkrigare. När de vuxit upp frigavs de oftast men förblev lojala mot sin herre och sina kamrater. Ayyubiddynastin, som grundats av Saladin, byggde sin armé kring dem.

    1250, mitt under Ludvig IX:s korståg (se ”[Ludvig IX:s sjunde korståg 1248](#ludvig-ix-s-sjunde-korstag-1248)”), mördade mamlukerna den nye sultanen Turanshah. En kort tid styrde **Shajar al-Durr**, änka till den förre sultanen, som en av få kvinnliga sultaner i islams historia, och sedan mamlukbefälhavare. Det blev början på **Mamluksultanatet**, som styrde Egypten och Syrien 1250–1517.

    Systemet var unikt: makten gick i första hand inte i arv, utan nya slavar köptes hela tiden in och de skickligaste befälhavarna kämpade sig fram till sultanstiteln. Mamlukerna stoppade mongolerna vid [Ain Jalut 1260](#ain-jalut-1260-mamluker-stoppar) och drev ut de sista korsfararna ([Akko 1291](#akko-faller-1291-korstagen-slut)). Kairo blev den islamiska världens största och rikaste stad. Sultanatet besegrades av [osmanerna 1517](#osmaner-erovrar-syrien-och-egypten), men mamlukerna levde kvar som elit i Egypten ända tills Napoleon slog dem 1798.

mongoler-forstor-bagdad-1258:
  period: 1240
  label: "mongoler förstör Bagdad 1258"
  title: "Mongolerna förstör Bagdad 1258"
  wiki:
    - "en:Siege of Baghdad (1258)"
    - "sv:Abbasider"
  text: |
    **Bagdad** hade sedan 762 varit huvudstad för *abbasidkalifatet*. En kalif var islams ledare, efterträdare till profeten Muhammed. Under 800–900-talen var Bagdad kanske världens största stad, centrum för vetenskap och översättning av grekiska verk (”Visdomens hus”). Kring 1250 hade kalifen förlorat nästan all politisk makt, men titeln hade fortfarande stor symbolisk tyngd.

    Storkhanen Möngke skickade sin bror **Hülegü** västerut med en stor armé, troligen 100 000 man eller mer inklusive kristna georgier och armenier. Kalifen al-Mustasim vägrade underkasta sig och underskattade hotet. Efter knappt två veckors belägring kapitulerade staden den 10 februari 1258. Mongolerna plundrade i en vecka. Dödssiffran är okänd; samtida källor uppger 200 000 till 800 000 eller mer – troligen överdrivet, men det var en massaker i stor skala. Kalifen avrättades, enligt traditionen inrullad i en matta och trampad av hästar (för att inte spilla kungligt blod).

    Biblioteken förstördes; det sägs att Tigris blev svart av bläck. Bevattningssystemen förföll, och Irak var i århundraden ett glesbefolkat utkantsområde. Händelsen ses ofta som slutet på islams guldålder. Kalifatet levde kvar som en skuggtitel hos mamlukerna i Kairo.

ain-jalut-1260-mamluker-stoppar:
  period: 1260
  label: "Ain Jalut 1260: mamluker stoppar mongolerna"
  title: "Slaget vid Ain Jalut 1260"
  wiki:
    - "sv:Slaget vid Ain Jalut"
    - "en:Kitbuqa"
  text: |
    Efter att ha förstört Bagdad 1258 (se ”[mongoler förstör Bagdad 1258](#mongoler-forstor-bagdad-1258)”) tog Hülegüs mongoler Aleppo och Damaskus i Syrien 1260. De skickade sändebud till Kairo och krävde att mamluksultanen Qutuz skulle underkasta sig. Han lät döda sändebuden. Samtidigt kom budet att storkhanen Möngke dött; Hülegü drog sig österut med större delen av armén och lämnade kvar uppskattningsvis 10 000–20 000 man under generalen **Kitbuqa**.

    Den 3 september 1260 möttes de och mamlukarmén, ungefär lika stor eller något större, vid **Ain Jalut** (”Goliats källa”) i dagens norra Israel. Mamlukerna använde mongolernas eget knep: en låtsad flykt som lockade in fienden i en fälla. Kitbuqa dödades. Det var en av de första gångerna en mongolisk armé besegrades i ett stort fältslag utan att mongolerna senare kom tillbaka och tog revansch.

    Slaget räddade Egypten och satte gränsen för mongolernas expansion i sydväst. Mamluker och mongoler var båda ryttare från samma stäpper – många mamluker var kiptjaker, som mongolerna fördrivit. En av befälhavarna, [Baibars (se den)](#baibars), mördade Qutuz på hemvägen och tog själv makten. Jämför med att [mongolerna vände efter Ungern 1242](#mongoler-i-polen-och-ungern-1241) och misslyckades mot [Japan 1274 och 1281](#mongolisk-invasion-1274-slas-tillbaka).

baibars:
  period: 1260
  label: "Baibars"
  title: "Baibars, mamluksultan 1260–1277"
  wiki:
    - "sv:Baibars"
    - "en:Siege of Antioch (1268)"
  text: |
    **Baibars** (ca 1223–1277) föddes bland kiptjakerna, ett turkiskt nomadfolk norr om Svarta havet. Som ung såldes han som slav – i kaoset efter mongolernas härjningar på stäppen – och kom till Egypten där han tränades som mamluk (slavsoldat, se ”[Mamluker i Egypten 1250](#mamluker-i-egypten-1250)”). Han var med och slog Ludvig IX:s korsfarare vid Mansura 1250 och ledde förtruppen vid Ain Jalut 1260. På hemvägen mördade han sultanen Qutuz och tog makten.

    Han blev mamluksultanatets egentlige grundare. Han byggde upp ett postsystem med brevduvor och hästreläer mellan Kairo och Damaskus (ca 4 dagar), en effektiv armé och ett nätverk av befästningar. Han installerade en överlevande släkting till abbasiderna som kalif i Kairo, vilket gav hans styre religiös legitimitet efter Bagdads fall.

    Militärt förde han krig på två fronter. Mot mongolerna i Ilkhanatet höll han gränsen i Syrien. Mot korsfararna tog han en rad borgar och städer, bl.a. **Antiokia** 1268, en av de äldsta korsfararstaterna; massakern och slavförsäljningen där var bland de värsta under korstågstiden. Hans efterträdare fullbordade verket när Akko föll 1291. Baibars är idag en folkhjälte i arabisk historieskrivning.

osman-i-grundar-osmanska-staten-1299:
  period: 1280
  label: "Osman I grundar osmanska staten ~1299"
  title: "Osman I grundar osmanska staten (~1299)"
  wiki:
    - "sv:Osman I"
    - "en:Osman I"
  text: |
    Efter att mongolerna 1243 krossat det turkiska Rum-sultanatet i Anatolien (dagens Turkiet) splittrades området i många små turkiska furstendömen, *beylik*. Ett av de minsta låg i nordväst, vid gränsen mot det försvagade **Bysantinska riket** – den grekisktalande fortsättningen av romarriket med huvudstad i Konstantinopel.

    Furstendömets ledare hette **Osman**, och ”[osmaner](#osmaner-till-europa-gallipoli-1354)” (på engelska ”Ottomans”) betyder Osmans folk. Omkring 1299 räknas traditionellt som året då han blev självständig, men källorna är sena och mycket är legend. Hans fördel var läget: krig mot bysantinerna lockade krigare som ville ha byte och religiös ära (*gazi*, krigare för islam).

    Osman erövrade småstäder och slog en bysantinsk här vid Bafeus 1302. Hans son Orhan tog Bursa 1326 ([se det](#osmaner-tar-bursa-1326)). Ingen kunde då ana följden: ättlingarna tog [Konstantinopel 1453](#konstantinopel-faller-1453) och styrde ett imperium från Ungern till Irak och Algeriet. Osmanska riket bestod till 1922 – över 600 år, med samma dynasti hela tiden. [Jämför med Habsburg](#rudolf-av-habsburg-1273), som också fick sin start på 1200-talet.

osmaner-vaxer-i-anatolien:
  period: 1300
  label: "Osmaner växer i Anatolien"
  title: "Osmanerna växer i Anatolien"
  wiki:
    - "sv:Osmanska riket"
    - "en:Rise of the Ottoman Empire"
  text: |
    **Anatolien** är den stora halvö som utgör dagens asiatiska Turkiet. Omkring 1300 var den uppdelad i ett tjugotal små turkiska furstendömen (*beylik*), som vuxit fram efter att mongolerna krossat det tidigare turkiska seldjukriket. Ett av dem leddes av Osman ([se ~1299](#osman-i-grundar-osmanska-staten-1299)), i nordväst nära det Bysantinska riket.

    Under 1300-talets första decennier erövrade osmanerna systematiskt den bysantinska landsbygden runt de stora städerna Bursa, Nicaea (Iznik) och Nicomedia (Izmit). Bysans var svagt: det hade aldrig återhämtat sig efter att korsfarare [plundrat Konstantinopel 1204](#fjarde-korstaget-plundrar-konstantinopel), och det hyrde till och med legosoldater som vände sig mot det, som det katalanska kompaniet. Många bysantinska bönder och krigare gick över till osmanerna.

    Osmanernas styrka var att de kombinerade religiöst motiverad kamp mot de kristna med pragmatism: kristna fick behålla sin religion mot särskild skatt, och lokala eliter kunde göra karriär. Inom några decennier hade de tagit Bursa (1326, [se det](#osmaner-tar-bursa-1326)), Nicaea (1331) och Nicomedia (1337), och 1354 tog de sitt första fäste i Europa, Gallipoli. Det var början på ett imperium som bestod till 1922.

osmaner-tar-bursa-1326:
  period: 1320
  label: "Osmaner tar Bursa 1326"
  title: "Osmanerna tar Bursa 1326"
  wiki:
    - "en:Siege of Bursa"
    - "en:Orhan"
  text: |
    **Bursa** var en rik bysantinsk stad i nordvästra Anatolien, cirka 100 km söder om Konstantinopel (dagens Istanbul) på andra sidan Marmarasjön. Den var känd för sin sidenhandel och sina varma källor. Osmanerna, ett litet turkiskt furstendöme grundat av Osman ([se ~1299](#osman-i-grundar-osmanska-staten-1299)), hade belägrat den i flera år genom att skära av dess förbindelser.

    1326 gav staden upp till Osmans son **Orhan**, troligen efter förhandlingar snarare än storm. Osman dog ungefär samtidigt och begravdes där. Bursa blev osmanernas första huvudstad, och för första gången hade de en stor stad med köpmän, hantverk och förvaltning.

    Det var en vändpunkt: från att vara ett krigarband blev osmanerna en stat. Orhan slog egna mynt, byggde moskéer och skolor och skapade en organiserad armé. Nicaea (1331) och Nicomedia (1337) följde, och snart korsade osmanerna till Europa ([Gallipoli 1354](#osmaner-till-europa-gallipoli-1354)). Huvudstaden flyttades till Edirne på 1360-talet och sedan till [Konstantinopel 1453](#konstantinopel-faller-1453), men Bursa förblev viktig – de första sultanernas gravar finns där. Staden har idag uppskattningsvis 3 miljoner invånare.

digerdoden-i-kairo:
  period: 1340
  label: "Digerdöden i Kairo"
  title: "Digerdöden i Kairo 1348–1349"
  wiki:
    - "en:Black Death in the Middle East"
    - "en:Mamluk Sultanate"
  text: |
    **Kairo** var på 1340-talet en av världens största städer, uppskattningsvis med några hundratusen invånare (uppskattningarna varierar kraftigt) – större än någon stad i Europa. Egypten och Syrien styrdes av **[mamlukerna](#mamluker)**, en elit av soldater som köpts som slavar i unga år och sedan själva tagit makten (1250–1517). Kairo var navet i handeln mellan Indiska oceanen och Medelhavet.

    Pesten kom till Egypten hösten 1347 med fartyg till Alexandria och nådde Kairo 1348. Samtida krönikörer skriver om tusentals döda per dag, men sådana siffror är osäkra. Forskare tror att Egypten förlorade en fjärdedel till hälften av befolkningen.

    En intressant skillnad mot Västeuropa: där steg lönerna efter pesten när arbetskraft blev bristvara. I Egypten var jordbruket beroende av ett stort konstbevattningssystem längs Nilen, som krävde mycket arbete att underhålla, och mamlukeliten pressade ut mer skatt i stället för att släppa greppet. Många historiker menar att Egypten därför återhämtade sig långsammare än Europa – ett exempel på att samma katastrof kan få olika följder beroende på samhällets uppbyggnad.

osmaner-till-europa-gallipoli-1354:
  period: 1340
  label: "osmaner till Europa (Gallipoli 1354)"
  title: "Osmanerna tar Gallipoli 1354"
  wiki:
    - "en:Fall of Gallipoli"
    - "sv:Osmanska riket"
  text: |
    **Osmanerna** var en turkisk dynasti som omkring år 1300 grundade ett litet furstendöme i nordvästra Anatolien (dagens Turkiet), uppkallat efter grundaren Osman. På 1300-talet växte det snabbt på bekostnad av det försvagade **Bysantinska riket** – den grekisktalande fortsättningen av romarriket med huvudstad i Konstantinopel.

    Bysans var splittrat av inbördeskrig, och en av parterna, Johannes VI Kantakuzenos, anlitade osmanska soldater och släppte därmed in dem på Balkan. I mars 1354 raserade en jordbävning murarna i staden **Gallipoli** på Europasidan av Dardanellerna (sundet mellan Egeiska havet och Marmarasjön). Osmanska trupper under Süleyman Pasha, son till sultanen Orhan, flyttade in och stannade.

    Det var osmanernas första permanenta fäste i Europa – ett brohuvud. Därifrån erövrade de [Adrianopel (ca 1369)](#osmaner-tar-adrianopel-edirne), besegrade serberna vid [Kosovo 1389](#kosovo-1389) och korsfararna vid [Nikopolis 1396](#nikopolis-1396), och tog slutligen [Konstantinopel 1453](#konstantinopel-faller-1453). Osmanska riket kom att styra Balkan i omkring 500 år, vilket fortfarande präglar regionens religioner, språk och konflikter.

osmaner-tar-adrianopel-edirne:
  period: 1360
  label: "Osmaner tar Adrianopel (Edirne)"
  title: "Osmanerna tar Adrianopel ca 1369"
  wiki:
    - "sv:Edirne"
    - "sv:Murad I"
  text: |
    **Adrianopel** (idag Edirne i nordvästligaste Turkiet, nära gränsen till Grekland och Bulgarien) var en av Bysantinska rikets viktigaste städer i Europa, grundad av den romerske kejsaren Hadrianus. Den låg vid huvudvägen mellan Konstantinopel och Balkan.

    Efter att osmanerna fått fotfäste i [Gallipoli 1354](#osmaner-till-europa-gallipoli-1354) ryckte de fram genom Thrakien, landskapet väster om Konstantinopel. Under sultanen **Murad I** (1362–1389) intogs Adrianopel; exakt år är omdiskuterat, ofta anges 1369. Osmanerna gjorde så småningom staden till sin **huvudstad** under namnet Edirne. Att ha huvudstaden i Europa visade att de inte såg sig som tillfälliga plundrare utan tänkte stanna och bygga ett rike på Balkan.

    Konstantinopel var nu inringat av osmanskt land och hade i praktiken krympt till en stadsstat som betalade tribut. Bulgariska och serbiska furstar besegrades i tur och ordning, t.ex. vid Maritsa 1371 och [Kosovo 1389](#kosovo-1389). Edirne förblev huvudstad tills [Konstantinopel intogs 1453](#konstantinopel-faller-1453). Murad I införde också *janitsjarerna*, ett elitinfanteri rekryterat bland kristna pojkar som togs från sina familjer – en av Europas första stående arméer.

kosovo-1389-2:
  period: 1380
  label: "Kosovo 1389"
  same_as: kosovo-1389

nikopolis-1396:
  period: 1380
  label: "Nikopolis 1396"
  title: "Korståget till Nikopolis 1396"
  wiki:
    - "sv:Slaget vid Nikopolis"
    - "sv:Bayezid I"
  text: |
    Efter segern vid [Kosovo 1389](#kosovo-1389) kontrollerade osmanerna under sultanen **Bayezid I**, kallad *Yıldırım* (”blixten”) för sina snabba fälttåg, stora delar av Balkan och belägrade Konstantinopel. Ungerns kung **Sigismund** (senare tysk-romersk kejsare) var nu direkt hotad och lyckades få till ett korståg – ett heligt krig som påven välsignade.

    Hären bestod av ungrare, franska och burgundiska riddare, tyskar, valaker och andra – uppskattningsvis 15 000–20 000 man, ett av de sista stora korstågen. Den 25 september 1396 möttes de vid fästningen **Nikopolis** vid Donau, i dagens Bulgarien. De franska riddarna ville ha äran att anfalla först och stormade mot Sigismunds råd. De bröt igenom de osmanska förtrupperna men kördes fast mot pålar och reservstyrkor uppe på en höjd, och hela hären besegrades. Bayezid lät avrätta flera tusen fångar; rika adelsmän fick köpas fria för stora lösesummor.

    Nederlaget visade att Västeuropa inte kunde stoppa osmanerna. Det som räddade Konstantinopel för stunden var i stället att Timur Lenk besegrade Bayezid vid Ankara 1402 ([se den punkten](#timur-besegrar-osmanerna-vid-ankara-1402)).

timur-besegrar-osmanerna-vid-ankara-1402:
  period: 1400
  label: "Timur besegrar osmanerna vid Ankara 1402"
  title: "Slaget vid Ankara 1402"
  wiki:
    - "sv:Slaget vid Ankara"
    - "sv:Bayezid I"
  text: |
    Kring år 1400 var två erövrare på väg mot varandra: **Timur Lenk** från Centralasien, som just [plundrat Delhi (1398)](#timur-plundrar-delhi-1398), Aleppo och Damaskus (1400–01), och den osmanske sultanen **Bayezid I**, ”blixten”, som besegrat korsfararna vid [Nikopolis 1396](#nikopolis-1396) och belägrade Konstantinopel. Båda ansåg sig ha rätt till Anatolien, och de utbytte förolämpande brev.

    Den 20 juli 1402 möttes de nära **Ankara**. Arméernas storlek är mycket osäker; moderna uppskattningar ligger kring 85 000–140 000 på Timurs sida och 85 000–120 000 på Bayezids, alltså ett av de största slagen i sin tid. Timur hade lett om en bäck så att osmanerna fick ont om vatten, och mitt i slaget bytte Bayezids tatariska och anatoliska trupper sida. Osmanerna besegrades och Bayezid tillfångatogs. Han dog i fångenskap året därpå.

    Följden blev ett tioårigt osmanskt inbördeskrig mellan Bayezids söner, kallat *interregnum*. Det gav Konstantinopel 50 års andrum – [staden föll först 1453](#konstantinopel-faller-1453). Timur drog tillbaka österut och dog 1405 på väg att anfalla Kina. Riket återhämtade sig snabbare än någon väntat sig, och [Bayezids sonson Mehmed II erövrade Konstantinopel](#mehmed-ii-tar-konstantinopel-1453).

murad-ii:
  period: 1420
  label: "Murad II"
  title: "Murad II, osmansk sultan"
  wiki:
    - "sv:Murad II"
    - "sv:Osmanska riket"
  text: |
    **Osmanska riket** var ett turkiskt sultanat som grundats i nordvästra Anatolien omkring 1300 och som under 1300-talet tagit stora delar av Balkan. 1402 led det en katastrof när [Timur besegrade och tillfångatog sultanen Bayezid I vid Ankara](#timur-besegrar-osmanerna-vid-ankara-1402), och riket föll i ett tioårigt inbördeskrig.

    **Murad II** (sultan 1421–1451, med ett kort avbrott) återställde riket. Han slog ned uppror, belägrade Konstantinopel 1422 utan framgång, erövrade Thessaloniki från Venedig 1430 och kämpade mot Ungern och mot den albanske upprorsledaren Skanderbeg.

    1444 abdikerade han till förmån för sin 12-årige son **Mehmed**. Då bröt ett kristet korståg vapenvilan, och Murad återkom och vann en stor seger vid **Varna** ([se Varna 1444](#varna-1444)). 1448 besegrade han ungrarna igen vid Kosovo. Han byggde också ut **janitsjarerna** – en elitstyrka av soldater som rekryterades som pojkar från kristna familjer på Balkan, konverterades och tränades som sultanens personliga armé.

    När han dog 1451 hade han lagt grunden för [sonens erövring av Konstantinopel 1453](#mehmed-ii-tar-konstantinopel-1453).

mamluker-2:
  period: 1420
  label: "mamluker"
  same_as: mamluker

mehmed-ii-tar-konstantinopel-1453:
  period: 1440
  label: "Mehmed II tar Konstantinopel 1453"
  title: "Mehmed II erövrar Konstantinopel"
  wiki:
    - "sv:Mehmet II"
    - "sv:Konstantinopels fall"
  text: |
    **Mehmed II** (1432–1481) blev osmansk sultan för andra gången 1451, 19 år gammal. Han talade flera språk, var intresserad av vetenskap och västerländsk konst – och var hänsynslös. Han lät döda sin spädbarnsbror vid trontillträdet, en praxis som senare blev lag.

    Hans första mål var **Konstantinopel**. Han byggde fästningen Rumeli Hisarı på Bosporens europeiska sida 1452 för att kontrollera sundet. Han samlade uppskattningsvis 50 000–80 000 man mot cirka 7 000–8 000 försvarare. Han lät den ungerske ingenjören **Orban** gjuta en jättekanon, över 8 meter lång, som sköt stenkulor på uppemot 500 kg – men bara några gånger per dag. Stadsmurarna, som hade hållit i 1 000 år, sköts sönder.

    När försvararna spärrade inloppet Gyllene hornet med en kedja lät Mehmed dra cirka 70 fartyg över land på smorda stockar. Efter 53 dagar, den 29 maj 1453, [stormades staden](#konstantinopel-faller-1453). Han fick tillnamnet *Fatih*, ”Erövraren”.

    Han gjorde staden till osmansk huvudstad, förvandlade Hagia Sofia till moské och flyttade in befolkning från hela riket. Han erövrade sedan Serbien, [Bosnien](#osmaner-tar-bosnien-trapezunt) och Krim och anföll 1480 till och med Otranto i Italien.

osmaner-tar-bosnien-trapezunt:
  period: 1460
  label: "Osmaner tar Bosnien, Trapezunt"
  title: "Osmanerna tar Trapezunt 1461 och Bosnien 1463"
  wiki:
    - "en:Empire of Trebizond"
    - "en:Ottoman conquest of Bosnia and Herzegovina"
    - "en:Mehmed II"
  text: |
    Osmanska riket – det turkiska riket som [1453 erövrat Konstantinopel](#konstantinopel-faller-1453) (dagens Istanbul) – fortsatte under sultan **[Mehmed II](#mehmed-ii-tar-konstantinopel-1453)** (”Erövraren”) att svälja grannstaterna.

    **Trapezunt** (dagens Trabzon i nordöstra Turkiet) var ett litet grekiskt kejsardöme vid Svarta havets kust, bildat 1204 när [korsfarare plundrade Konstantinopel](#fjarde-korstaget-plundrar-konstantinopel). Det var den sista resten av den bysantinska (östromerska) världen och föll 1461 utan större strid. Därmed var 2000 år av grekiskt statsliv i Mindre Asien slut.

    **Bosnien** var ett kristet kungarike på Balkan. Mehmed erövrade det 1463 på några veckor och lät avrätta den siste kungen. Hercegovina följde 1482. Under de följande 400 åren av osmanskt styre gick en stor del av befolkningen över till islam – därför finns i dag de muslimska bosniakerna. Den religiösa blandningen (muslimer, ortodoxa serber, katolska kroater) är en direkt förklaring till konflikterna i Bosnienkriget 1992–95, då omkring 100 000 dog.

osmaner-mot-mamluker:
  period: 1480
  label: "Osmaner mot mamluker"
  title: "Osmanerna mot mamlukerna"
  wiki:
    - "en:Ottoman–Mamluk War (1485–1491)"
    - "en:Mamluk Sultanate"
  text: |
    **Mamlukerna** var en militärkast i Egypten: soldater som köpts som slavpojkar (främst från Kaukasus och stäppen), utbildats och sedan själva [tagit makten 1250](#mamluker-i-egypten-1250). Deras sultanat omfattade Egypten, Syrien och Hijaz med de heliga städerna Mecka och Medina. De hade [stoppat mongolerna 1260](#ain-jalut-1260-mamluker-stoppar) och [kastat ut de sista korsfararna 1291](#akko-faller-1291-korstagen-slut).

    På 1480-talet blev det krig mellan mamlukerna och det växande **Osmanska riket** om gränslandet i sydöstra Anatolien (dagens Turkiet). Kriget 1485–1491 slutade oavgjort, och mamlukerna klarade sig bra – deras kavalleri var fortfarande starkt.

    Men mamlukerna föraktade eldvapen, som de såg som ovärdiga en ryttare. Det blev ödesdigert: [1516–1517 krossade sultan Selim I dem](#osmaner-erovrar-syrien-och-egypten) med artilleri och janitsjarer (infanteri med musköter) vid Marj Dabiq och Ridaniya, och tog Syrien och Egypten. Osmanska riket fördubblades nästan och blev det ledande muslimska riket. Samtidigt försvagades mamlukerna av att portugiserna ([se Vasco da Gama 1498](#vasco-da-gama-i-calicut-1498)) tog kryddhandeln som tidigare gått via Egypten.

osmaner-erovrar-syrien-och-egypten:
  period: 1500
  label: "Osmaner erövrar Syrien och Egypten 1516–17"
  title: "Osmanerna erövrar Syrien och Egypten 1516–17"
  wiki:
    - "en:Ottoman–Mamluk War (1516–1517)"
    - "en:Selim I"
    - "en:Battle of Marj Dabiq"
  text: |
    Sultan **Selim I** (”den grymme”, regerade 1512–1520) hade just besegrat Persiens shah vid [Chaldiran 1514](#chaldiran-1514). Nu vände han sig mot **mamlukerna**, den egyptiska militärelit av före detta slavsoldater som styrde Egypten och Syrien sedan 1250.

    Vid **Marj Dabiq** norr om Aleppo i augusti 1516 krossade osmanernas kanoner och musköter mamlukernas ryttararmé, och sultanen al-Ghawri dog under striden. I januari 1517 vann Selim igen vid Ridaniya utanför Kairo. Den siste mamluksultanen hängdes vid en av Kairos stadsportar. Kampanjen tog bara omkring fem månader.

    Resultatet var enormt: Osmanska riket fördubblades ungefär i yta och fick Egyptens spannmål och skatteintäkter, Syrien, Palestina med Jerusalem, och skydd över Mecka och Medina. Sultanerna började se sig som **kalifer** – ledare för hela den sunnimuslimska världen. Under Selims son Süleyman den store nådde riket sin höjdpunkt. Egypten förblev osmanskt till 1800-talet och Syrien och Palestina till första världskriget 1917–18.

suleyman-den-store-1520:
  period: 1520
  label: "Süleyman den store 1520"
  title: "Süleyman den store blir sultan 1520"
  wiki:
    - "sv:Süleyman I"
    - "en:Suleiman the Magnificent"
  text: |
    **Süleyman I** (regerade 1520–1566) var sultan i Osmanska riket, det turkiskspråkiga muslimska imperiet med huvudstad i Istanbul (Konstantinopel, erövrat 1453). Under hans 46 år nådde riket sin största makt; i väst kallades han ”den store” eller ”den praktfulle”, i Turkiet ”lagstiftaren” efter sitt omfattande lagverk.

    Militärt tog han Belgrad 1521 och ön Rhodos 1522, krossade Ungern vid [Mohács 1526](#mohacs-1526), [belägrade Wien 1529](#wien-belagras-1529) och [tog Bagdad](#osmaner-tar-bagdad) och Irak från Persien på 1530-talet. Hans flotta behärskade stora delar av Medelhavet. Riket sträckte sig från Ungern till Persiska viken och Nordafrika, med uppskattningsvis 15–25 miljoner invånare – fler än något europeiskt land.

    Kulturellt var det en guldålder: arkitekten **Sinan** byggde Süleymaniye-moskén i Istanbul. Süleyman var samtida med [Karl V](#karl-v-kejsare), Frans I av Frankrike och Henrik VIII, och allierade sig med Frankrike mot Habsburgarna – ett av de första förbunden mellan en kristen och en muslimsk stormakt.

osmaner-tar-bagdad:
  period: 1540
  label: "Osmaner tar Bagdad"
  title: "Osmanerna tar Bagdad 1534"
  wiki:
    - "en:Ottoman–Safavid War (1532–1555)"
    - "en:Ottoman Iraq"
  text: |
    Bagdad hade varit huvudstad för det abbasidiska kalifatet och den islamiska världens kulturella centrum, tills mongolerna förstörde staden 1258. I början av 1500-talet var Irak omstritt mellan två stormakter: det sunnimuslimska Osmanska riket och det shiamuslimska [Safavidriket](#safavider) i Persien, som tog Bagdad 1508.

    Under sitt fälttåg mot Persien 1533–1536 intog sultan **[Süleyman den store](#suleyman-den-store-1520)** Bagdad 1534 utan större strid. Han lät restaurera gravarna efter både sunni- och shiamuslimska helgon för att visa sig som beskyddare av alla muslimer. Osmanerna fick därmed kontroll över Mesopotamien och handelsvägarna ner mot Persiska viken, som de nådde vid Basra några år senare.

    Safaviderna tog tillbaka Bagdad 1624, men osmanerna [återerövrade den 1638](#murad-iv-atertar-bagdad-1638), och därefter förblev Irak osmanskt fram till första världskriget, då britterna tog det och skapade staten Irak. Gränsen mellan Osmanska riket och Persien som fastställdes 1639 ligger i stora drag kvar som gräns mellan Irak och Iran.

lepanto-1571-2:
  period: 1560
  label: "Lepanto 1571"
  same_as: lepanto-1571

cypern-osmanskt:
  period: 1560
  label: "Cypern osmanskt"
  title: "Cypern blir osmanskt 1571"
  wiki:
    - "en:Ottoman conquest of Cyprus"
    - "en:Siege of Famagusta"
  text: |
    Cypern hade sedan 1489 varit en koloni under Venedig, som då var en handelsrepublik med ett nätverk av ön- och hamnbesittningar i östra Medelhavet. Ön låg bara omkring 70 km från den osmanska kusten och var omgiven av osmanskt territorium.

    1570 invaderade Osmanska riket under sultan Selim II, son till [Süleyman den store](#suleyman-den-store-1520), med en armé på uppskattningsvis 60 000–100 000 man. Huvudstaden Nicosia föll efter sju veckor och tusentals invånare dödades. Fästningsstaden **Famagusta** höll ut i elva månader. När den kapitulerade i augusti 1571 lät den osmanske befälhavaren tortera ihjäl den venetianske befälhavaren Marcantonio Bragadin, vilket väckte enorm vrede i Europa.

    Förlusten utlöste slaget vid Lepanto två månader senare (se [Lepanto 1571](#lepanto-1571)), där en kristen flotta besegrade osmanerna – men Cypern förblev osmanskt i 300 år. Osmanerna flyttade turkiska bosättare dit, och ön fick en grekisk och en turkisk befolkning. Storbritannien tog över 1878. Den grekisk-turkiska splittringen ledde till Turkiets invasion 1974, och ön är delad än idag.

osmaner-mot-persien:
  period: 1580
  label: "Osmaner mot Persien"
  title: "Osmansk-persiska kriget 1578–1590"
  wiki:
    - "en:Ottoman–Safavid War (1578–1590)"
    - "en:Ottoman–Persian Wars"
  text: |
    Det **Osmanska riket** (dagens Turkiet med Balkan, Arabvärlden och Nordafrika) och det persiska **[Safavidriket](#safavider)** (dagens Iran) var 1500- och 1600-talens två stora islamiska rivaler i Mellanöstern. Rivaliteten var både politisk och religiös: osmanerna var sunnimuslimer, safaviderna hade gjort shiaislam till statsreligion. De krigade om Irak, Kaukasus (Georgien, Armenien, Azerbajdzjan) och östra Anatolien.

    Kriget 1578–1590 inleddes när osmanerna utnyttjade oroligheter i Persien efter shah Tahmasp I:s död 1576. Osmanska arméer, ofta på tiotusentals man, erövrade Kaukasus och Tabriz, Persiens tidigare huvudstad. Vid freden i Konstantinopel 1590 fick Persien avstå stora områden. Den unge shahen Abbas I ([se 1588](#abbas-i-1588-isfahan)) slöt freden för att få andrum.

    Freden höll inte. Abbas moderniserade sin armé och tog 1603–1618 tillbaka det förlorade och därtill [Bagdad 1624](#osmaner-tar-bagdad). Krigen fortsatte till freden i Zuhab 1639, som gav en gräns som i stort sett fortfarande är gränsen mellan Irak/Turkiet och Iran. Konflikten mellan sunni och shia i regionen har delvis rötter i denna rivalitet.

osmaner-stagnerar:
  period: 1600
  label: "Osmaner stagnerar"
  title: "Det osmanska riket stagnerar (1600-talet)"
  wiki:
    - "en:Transformation of the Ottoman Empire"
    - "sv:Osmanska riket"
  text: |
    Det **Osmanska riket**, med huvudstad i Istanbul, hade nått sin höjdpunkt under [Süleyman den store](#suleyman-den-store-1520) (1520–1566). Det sträckte sig från Ungern till Persiska viken och från Algeriet till Kaukasus, med kanske 20–30 miljoner invånare. Kring 1600 började historiker tala om stagnation, även om dagens forskare snarare ser en omvandling än ett förfall.

    Flera problem samverkade. Sultanerna efter Süleyman lämnade styret åt storvesirer (regeringschefer) och hovfraktioner; flera sultaner avsattes eller mördades, bland dem Osman II 1622. **Janitsjarerna**, elitinfanteriet som ursprungligen rekryterats bland kristna pojkar, blev en ärftlig och upprorisk kast. Silvret från Amerika (se [Potosí](#potosi-varldens-storsta-silvergruva)) skapade inflation, och stora bondeuppror, Celali-upproren, härjade Anatolien 1595–1610. Långa krig mot Habsburg (1593–1606) och Persien gav inga vinster.

    Riket var fortfarande mycket starkt: det [erövrade Kreta 1669](#kretakriget) och [belägrade Wien 1683](#wien-belagras-1683-och-raddas). Men efter nederlaget vid Wien började en lång reträtt. Det upplöstes efter första världskriget 1922, och ur det föddes Turkiet och stora delar av dagens Mellanöstern.

murad-iv-atertar-bagdad-1638:
  period: 1620
  label: "Murad IV återtar Bagdad 1638"
  title: "Murad IV återtar Bagdad 1638"
  wiki:
    - "sv:Murad IV"
    - "en:Treaty of Zuhab"
  text: |
    **[Osmanska riket](#osmaner-stagnerar)** – det turkiska imperiet med huvudstad i Istanbul – och **[Safavidernas Persien](#safavider)** (dagens Iran) var rivaler i över hundra år, bland annat om Mesopotamien (dagens Irak). Gränsen gick mellan sunnimuslimskt och shiamuslimskt styre. [Bagdad bytte ägare flera gånger](#osmaner-tar-bagdad); 1624 hade perserna tagit staden.

    **Murad IV** (sultan 1623–1640) blev sultan som 11-åring i ett rike präglat av palatsintriger och upproriska soldater. Som vuxen återställde han ordningen med hård hand – han lät avrätta tusentals och förbjöd tobak, kaffe och alkohol. 1638 ledde han själv en stor armé till Bagdad och intog staden efter en belägring på drygt en månad.

    Freden i **Zuhab** 1639 drog en gräns som i stort sett motsvarar dagens gräns mellan Irak och Iran. Att Irak blev arabiskt-osmanskt och Iran persiskt har alltså rötter i denna fred, nästan 400 år gammal.

kretakriget:
  period: 1640
  label: "Kretakriget"
  title: "Kretakriget 1645–1669"
  wiki:
    - "en:Cretan War (1645–1669)"
    - "en:Siege of Candia"
  text: |
    **Kreta** hade tillhört **Venedig** i över 400 år. Venedig var en stadsrepublik vars rikedom byggde på handel i Medelhavet, men under 1500–1600-talen hade det **osmanska riket** (det turkiska imperiet) tagit de flesta av Venedigs öar och baser. Kreta var den sista stora.

    1645 landsteg osmanska trupper på Kreta och tog snabbt det mesta av ön. Men huvudstaden **Candia** (dagens Heraklion) höll ut i en belägring som varade i drygt 21 år, 1648–1669 – en av de längsta i historien. Uppskattningsvis över 100 000 soldater dog på båda sidor. Frivilliga från hela Europa, bland annat franska trupper, kom till Venedigs hjälp.

    1669 kapitulerade Candia, och Kreta blev osmanskt fram till 1898. Kriget dränerade Venedig ekonomiskt; republiken var inte längre en stormakt. För osmanerna var det en seger men visade att riket hade svårt att avsluta krig snabbt. Freden kom under de effektiva **[Köprülü-vesirerna](#koprulu-vesirerna)** (se 1660-talet), vars nästa stora projekt blev [belägringen av Wien 1683](#wien-belagras-1683-och-raddas).

koprulu-vesirerna:
  period: 1660
  label: "Köprülü-vesirerna"
  title: "Köprülü-vesirerna"
  wiki:
    - "en:Köprülü era"
    - "en:Köprülü Mehmed Pasha"
  text: |
    I det **osmanska riket** leddes regeringen av en **storvesir**, ungefär en premiärminister under sultanen. I mitten av 1600-talet var riket i kris: sultanerna var unga eller svaga, storvesirer byttes ofta (ibland flera per år), statskassan var tom och [Kretakriget](#kretakriget) mot Venedig gick dåligt.

    1656 utsågs den drygt 70-årige albanskfödde **Köprülü Mehmed Pasha** till storvesir, på villkor att han fick fria händer. Han lät avrätta tiotusentals verkliga och misstänkta motståndare, slog ned uppror och fick ordning på finanserna och armén. Efter hans död 1661 tog sonen **Fazıl Ahmed** över; han erövrade Kreta 1669 och områden i Polen. Ämbetet stannade i släkten i flera generationer – därav ”Köprülü-vesirerna”.

    Perioden gav riket en sista expansionsvåg. Men Fazıl Ahmeds efterträdare Kara Mustafa [belägrade Wien 1683](#wien-belagras-1683-och-raddas) med en armé på kanske 100 000–150 000 man och förlorade stort. Därefter [tog Habsburgarna Ungern](#osmaner-trangs-ur-ungern), och [freden i Karlowitz 1699](#karlowitz-1699) blev första gången osmanerna förlorade stora landområden i Europa.

osmaner-trangs-ur-ungern:
  period: 1680
  label: "Osmaner trängs ur Ungern"
  title: "Osmanerna trängs ut ur Ungern"
  wiki:
    - "en:Great Turkish War"
    - "sv:Eugen av Savojen"
  text: |
    Sedan [slaget vid Mohács 1526](#mohacs-1526) hade Osmanska riket (det turkiska imperiet) behärskat större delen av Ungern i ungefär 150 år. Efter det [misslyckade anfallet mot Wien 1683](#wien-belagras-1683-och-raddas) (se det) bildades **Heliga ligan**: Österrike, Polen, Venedig och senare Ryssland, med stöd av påven.

    Habsburgska arméer erövrade Buda (dagens Budapest) 1686 efter en lång belägring och slog osmanerna vid Mohács 1687. Den viktigaste segern kom vid Zenta 1697 under fältherren **Eugen av Savojen**, där uppskattningsvis 20 000–30 000 osmanska soldater dog medan de kejserliga förlusterna var några hundra.

    Kriget avslutades i [freden i Karlowitz 1699](#karlowitz-1699) (se den). Ungern blev en del av Habsburgarnas välde, och därmed lades grunden till det som senare blev Österrike-Ungern. För Osmanska riket var det första gången det tvingades avstå stora landområden – början på en lång tillbakagång som slutade när riket upplöstes 1922.

karlowitz-1699:
  period: 1680
  label: "Karlowitz 1699"
  title: "Freden i Karlowitz 1699"
  wiki:
    - "sv:Freden i Karlowitz"
    - "en:Great Turkish War"
  text: |
    **Freden i Karlowitz** (dagens Sremski Karlovci i Serbien) avslutade 1699 kriget mellan Osmanska riket och Heliga ligan (Österrike, Polen, Venedig, Ryssland), som pågått sedan [belägringen av Wien 1683](#wien-belagras-1683-och-raddas).

    Osmanska riket avstod nästan hela Ungern och Transsylvanien till Habsburgarna, Podolien (i dagens Ukraina) till Polen och stora delar av Dalmatien och Peloponnesos till Venedig. Ryssland fick Azov vid Svarta havet i ett separat avtal 1700. Förhandlingarna förmedlades av England och Nederländerna.

    Det var första gången Osmanska riket i ett fredsavtal formellt avstod stora områden till kristna stater. Historiker ser det som slutet på den osmanska expansionen och början på det som på 1800-talet kallades den orientaliska frågan – vad Europa skulle göra med ett försvagat osmanskt rike. [Sveriges Karl XII](#karl-xii-1697) fick några år senare (efter [Poltava 1709](#poltava-1709)) skydd hos just osmanerna.

osmaner-forlorar-mot-ryssland-1774:
  period: 1760
  label: "Osmaner förlorar mot Ryssland 1774"
  title: "Freden i Küçük Kaynarca 1774"
  wiki:
    - "en:Treaty of Küçük Kaynarca"
    - "en:Russo-Turkish War (1768–1774)"
  text: |
    **Osmanska riket** var det turkiska stormaktsrike med huvudstad i Istanbul som sedan 1400-talet styrde Balkan, Anatolien, Mellanöstern och Nordafrika. Kriget mot [Katarina den storas](#katarina-den-stora) Ryssland 1768–1774 blev en katastrof: den ryska flottan, som seglat ända runt Europa från Östersjön, förintade den osmanska vid Çeşme i Egeiska havet 1770, och ryska arméer nådde Donau.

    Freden i Küçük Kaynarca (i dagens Bulgarien) 1774 gav Ryssland fotfäste vid Svarta havet, rätt till fri handelssjöfart genom Bosporen och gjorde Krimkhanatet – en tatarisk vasallstat till sultanen – formellt självständigt. Nio år senare annekterade Ryssland Krim ([se 1783](#krim-annekteras-1783)). Ryssland fick också en vag rätt att föra de ortodoxa kristnas talan i Osmanska riket, som senare användes som förevändning för inblandning.

    Det var första gången osmanerna förlorade muslimskt befolkat land i ett fredsavtal. Det inledde den långa nedgång som européerna kallade ”Östernfrågan”: vem skulle få vad när riket föll? Frågan drev Krimkriget 1853–56 och ledde till slut till första världskriget.

napoleon-i-egypten-1798:
  period: 1780
  label: "Napoleon i Egypten 1798"
  title: "Napoleons fälttåg i Egypten 1798–1801"
  wiki:
    - "sv:Napoleons fälttåg i Egypten"
    - "sv:Rosettestenen"
  text: |
    1798 skickade Frankrikes revolutionära regering general **[Napoleon Bonaparte](#napoleon)** med uppskattningsvis 35 000–40 000 soldater till Egypten, formellt en del av Osmanska riket men styrt av *mamlukerna*, en krigarkast av ursprungliga slavsoldater. Målet var att hota Storbritanniens handelsväg till Indien och skapa en fransk koloni.

    Napoleon besegrade mamlukerna i Pyramidslaget i juli 1798. Men bara några veckor senare förintade brittiske amiralen **Horatio Nelson** den franska flottan vid Abukir (Nilslaget), och armén var instängd. Ett fälttåg in i Syrien misslyckades vid Akko. 1799 smet Napoleon hem till Frankrike och tog makten i en kupp; armén han lämnade kvar kapitulerade 1801.

    Det bestående resultatet var vetenskapligt. Napoleon tog med omkring 150 forskare som kartlade landet i det gigantiska verket *Description de l’Égypte*. Soldater hittade 1799 **Rosettestenen** med samma text på grekiska och i hieroglyfer, med vars hjälp Champollion knäckte hieroglyferna 1822. Fälttåget startade också modern egyptologi och Europas fascination för Orienten, och banade väg för [Muhammad Ali](#muhammad-ali-i-egypten) (se 1805).

muhammad-ali-i-egypten:
  period: 1800
  label: "Muhammad Ali i Egypten"
  title: "Muhammad Ali i Egypten (styrde 1805–1848)"
  wiki:
    - "sv:Muhammad Ali av Egypten"
  text: |
    **Muhammad Ali** (1769–1849) var en albanskfödd officer som kom till Egypten 1801 med en osmansk styrka för att driva ut fransmännen efter [Napoleons fälttåg](#napoleon-i-egypten-1798). I kaoset efteråt tog han makten och erkändes 1805 av sultanen som *pascha* (guvernör). Formellt var Egypten kvar i Osmanska riket, men i praktiken var han självständig.

    1811 lät han mörda de kvarvarande ledarna för mamlukerna, den gamla krigareliten, vid en bankett på citadellet i Kairo. Sedan moderniserade han landet ovanifrån efter europeisk modell: värnpliktsarmé, statliga fabriker för textilier och vapen, skolor och studenter skickade till Frankrike, och omfattande bevattning för exportgrödan bomull. Jämför med [Peter den store](#peter-den-store-1682) i Ryssland och [Meiji-Japan 1868](#meiji-restaurationen-1868).

    Hans armé erövrade Sudan och Syrien och hotade till och med sultanen i Istanbul 1839, tills europeiska stormakter ingrep. Hans ättlingar styrde Egypten till 1952, då Nasser tog makten. Moderniseringen gav dock enorma skulder som till slut ledde till brittisk ockupation 1882.

grekiska-upproret:
  period: 1820
  label: "Grekiska upproret"
  title: "Grekiska upproret ur osmansk synvinkel 1821–1830"
  wiki:
    - "sv:Grekiska frihetskriget"
    - "en:Mahmud II"
  text: |
    För **Osmanska riket** – det turkiska imperium som i 400 år styrt Balkan, Anatolien, arabvärlden och Nordafrika – var det [grekiska upproret 1821](#greklands-frihetskrig-1821) det första lyckade utbrytningsförsöket av ett kristet folk på grund av nationalism. Riket var vid den här tiden försvagat: lokala guvernörer agerade självständigt och armén låg efter de europeiska.

    Sultan **Mahmud II** tvingades be om hjälp av sin formelle vasall **Muhammad Ali**, Egyptens härskare, som moderniserat sin armé efter europeiskt mönster. Egyptiska trupper var på väg att krossa upproret när Storbritannien, Frankrike och Ryssland ingrep och förstörde den osmansk-egyptiska flottan vid Navarino 1827. Ryssland gick sedan i krig med sultanen 1828–1829 och nådde nära Konstantinopel.

    Nederlaget visade osmanerna att riket måste moderniseras för att överleva. Mahmud II upplöste 1826 det gamla elitinfanteriet janitsjarerna (tusentals dödades) och började de reformer som fortsatte i [Tanzimat](#tanzimat-reformer) från 1839. Samtidigt blev Muhammad Ali en rival som 1831–1833 självt angrep sultanen.

tanzimat-reformer:
  period: 1840
  label: "Tanzimat-reformer"
  title: "Tanzimat – Osmanska rikets reformer 1839–1876"
  wiki:
    - "sv:Tanzimat"
  text: |
    **Tanzimat** (turkiska för ”omorganisation”) var en serie reformer i Osmanska riket, det turkiska imperium som styrde Anatolien, Balkan, arabvärlden och delar av Nordafrika. Riket hade under början av 1800-talet förlorat [Grekland](#greklands-frihetskrig-1821), hotats av den egyptiske härskaren Muhammad Ali och halkat efter Europa militärt och ekonomiskt.

    Reformerna inleddes 1839 med ett kejserligt dekret, som lovade alla undersåtar – muslimer, kristna och judar – säkerhet för liv och egendom, rättvis beskattning och ordnad värnplikt. Ett nytt dekret 1856 gav formell likhet inför lagen för icke-muslimer. Under perioden infördes moderna domstolar och lagböcker efter fransk förebild, statliga skolor, ett centraliserat skattesystem, telegraf, banker och en modern armé. 1876 fick riket sin första författning och ett parlament.

    Resultaten blev blandade: staten blev effektivare, men skulderna till europeiska banker växte så att riket gick i statsbankrutt 1875. Sultan Abdülhamid II upphävde författningen 1878 och styrde enväldigt. Reformernas idéer levde vidare bland de ”[unga turkarna](#ungturkarna-1908)”, som tog makten 1908, och i [Atatürks moderna Turkiet efter 1923](#turkiet-1923-ataturk).

suezkanalen-1869:
  period: 1860
  label: "Suezkanalen 1869"
  title: "Suezkanalen öppnas 1869"
  wiki:
    - "sv:Suezkanalen"
    - "en:Ferdinand de Lesseps"
  text: |
    **Suezkanalen** är en 164 km lång grävd kanal genom Egypten som förbinder Medelhavet med Röda havet. Den byggdes 1859–1869 av ett franskt bolag under ledning av diplomaten **Ferdinand de Lesseps**, till stor del med egyptiska tvångsarbetare; uppskattningsvis tiotusentals dog under bygget.

    Effekten var enorm: sjövägen London–Bombay (Mumbai) kortades från runt 19 800 km runt Afrikas sydspets till ungefär 11 600 km – nästan halva sträckan. Det gjorde ångfartyg lönsamma på Asienrutterna och knöt Indien tätare till Storbritannien.

    Egypten skuldsatte sig så hårt för bygget att landet 1875 tvingades sälja sina aktier till Storbritannien, och 1882 ockuperade britterna Egypten (se ”[Britterna i Egypten 1882](#britterna-i-egypten-1882)”). Kanalen förblev en strategisk flaskhals: [Suezkrisen 1956](#suezkrisen-1956) och fartyget Ever Given som blockerade den i sex dagar 2021 visar det. Omkring 12 % av världshandeln går fortfarande här.

britterna-i-egypten-1882:
  period: 1880
  label: "Britterna i Egypten 1882"
  title: "Storbritannien ockuperar Egypten 1882"
  wiki:
    - "en:Anglo-Egyptian War"
    - "sv:Ahmed Urabi"
  text: |
    Egypten var formellt en del av det osmanska riket (Turkiet), men styrdes självständigt av en vicekung, **khediven**. Moderniseringsprojekt och [Suezkanalen](#suezkanalen-1869) hade gjort landet hopplöst skuldsatt hos europeiska banker, och från 1876 kontrollerade Storbritannien och Frankrike landets finanser.

    1881–82 ledde arméofficeren **Ahmed Urabi** ett nationalistiskt uppror under parollen ”Egypten åt egyptierna”. Britterna bombarderade Alexandria och besegrade Urabis armé vid Tel el-Kebir i september 1882. Därefter ockuperades Egypten; formellt var det tillfälligt, men brittiska trupper stannade till 1956.

    Det viktigaste motivet var **Suezkanalen**, livlinan till Indien. Ockupationen drog in britterna i Sudan (Khartum 1885) och utlöste rivaliteten med Frankrike som bidrog till kapplöpningen om Afrika (se ”[Berlinkonferensen 1884](#berlinkonferensen-1884-kapplopningen-om)”). Egyptisk nationalism mot britterna ledde senare till Nassers revolution 1952 och [Suezkrisen 1956](#suezkrisen-1956).

armeniska-massakrer-1894:
  period: 1880
  label: "armeniska massakrer 1894"
  title: "Hamidiska massakrerna på armenier 1894–1896"
  wiki:
    - "en:Hamidian massacres"
    - "sv:Abdülhamid II"
  text: |
    **Armenierna** är ett kristet folk med eget språk som i århundraden levt i östra Anatolien (idag östra Turkiet) och Kaukasus. I det osmanska riket var de en minoritet med lägre rättslig ställning än muslimer. När armenier krävde reformer och skydd mot skatteindrivning och övergrepp från kurdiska stammar, slog regimen till.

    Under sultanen **Abdülhamid II** (regerade 1876–1909), som styrde enväldigt och såg armeniska krav som ett hot mot rikets sammanhållning, dödades 1894–96 uppskattningsvis 80 000–300 000 armenier i en serie massakrer, bl.a. i Sasun och Istanbul. Hundratals byar förstördes. Därför kallas han ibland ”den röde sultanen”.

    Europas stormakter protesterade men ingrep inte. Massakrerna var ett förstadium till det **[armeniska folkmordet 1915](#armeniska-folkmordet-1915)**, då ungefär 1 miljon armenier dödades (se den punkten). De visar hur ett mångnationellt imperium i sönderfall vände sig mot sina minoriteter.

ungturkarna-1908:
  period: 1900
  label: "Ungturkarna 1908"
  title: "Ungturkiska revolutionen 1908"
  wiki:
    - "sv:Ungturkarna"
    - "en:Young Turk Revolution"
  text: |
    **Ungturkarna** var en rörelse av unga officerare, studenter och ämbetsmän i det osmanska riket som ville modernisera och rädda det krympande imperiet. Deras viktigaste organisation var **Kommittén för enighet och framsteg**. Sultanen **Abdülhamid II** hade 1878 upphävt konstitutionen och styrt enväldigt med censur och hemlig polis.

    I juli 1908 gjorde trupper i Makedonien uppror, och sultanen tvingades återinföra konstitutionen och parlamentet. Först jublade alla folkgrupper – turkar, araber, armenier, greker, judar. Efter ett kontrarevolutionärt försök 1909 avsattes Abdülhamid. Men riket fortsatte förlora mark: Bosnien, Libyen och nästan hela Balkan 1908–1913.

    1913 tog en trojka av ungturkiska ledare – Enver, Talat och Cemal – makten genom en kupp. De gick in i [första världskriget](#forsta-varldskriget) på Tysklands sida 1914 och bär ansvaret för det [armeniska folkmordet 1915](#armeniska-folkmordet-1915). Rörelsens turkiska nationalism lade också grunden till [Atatürks Republiken Turkiet 1923](#turkiet-1923-ataturk).

armeniska-folkmordet-1915:
  period: 1900
  label: "armeniska folkmordet 1915"
  title: "Armeniska folkmordet 1915"
  wiki:
    - "sv:Armeniska folkmordet"
  text: |
    Under [första världskriget](#forsta-varldskriget) anklagade den [ungturkiska regeringen](#ungturkarna-1908) i det osmanska riket den kristna armeniska minoriteten för att samarbeta med fienden Ryssland. Den 24 april 1915 greps några hundra armeniska intellektuella och ledare i Istanbul; de flesta mördades. Det datumet är idag minnesdag.

    Därefter deporterades armenierna i Anatolien. Män i vapenför ålder dödades ofta direkt, medan kvinnor, barn och äldre tvingades på dödsmarscher genom öknen mot Syrien, utan mat och vatten, och utsattes för massakrer. Uppskattningsvis 600 000 till 1,5 miljoner armenier dog, ofta anges ca 1 miljon – en majoritet av rikets armeniska befolkning. Även assyrier och greker drabbades.

    Det räknas som ett av 1900-talets första folkmord. Juristen Raphael Lemkin, som myntade ordet folkmord (genocid) 1944, hänvisade just till det. Turkiet erkänner det fortfarande inte som folkmord; Sveriges riksdag gjorde det 2010. Se även ”[armeniska massakrer 1894](#armeniska-massakrer-1894)”.

balfourdeklarationen-1917:
  period: 1900
  label: "Balfourdeklarationen 1917"
  title: "Balfourdeklarationen 1917"
  wiki:
    - "sv:Balfourdeklarationen"
  text: |
    Den 2 november 1917 skrev den brittiske utrikesministern **Arthur Balfour** ett kort brev till Lord Rothschild, en ledare för de brittiska judarna. Där sades att den brittiska regeringen ”ser med välvilja på upprättandet i Palestina av ett nationalhem för det judiska folket”, med förbehållet att inget skulle göras som skadade rättigheterna för de ”icke-judiska samfunden” i landet.

    Palestina tillhörde då det osmanska riket, och den arabiska befolkningen utgjorde ca 90 % av invånarna (uppskattningsvis ca 700 000 människor). Storbritannien ville vinna stöd från judar i USA och Ryssland för krigsansträngningen. Samtidigt hade britterna lovat araberna självständighet (McMahon-korrespondensen) och i hemlighet delat upp området med Frankrike (Sykes–Picot-avtalet 1916) – motstridiga löften.

    Efter kriget fick Storbritannien Palestina som mandatområde (ett förvaltat territorium under Nationernas förbund), och deklarationen skrevs in i mandatet. Judisk invandring ökade och konflikten med araberna växte. Det ledde till [staten Israel 1948](#israel-1948) och den israelisk-palestinska konflikten som pågår än idag.

turkiet-1923-ataturk:
  period: 1920
  label: "Turkiet 1923 (Atatürk)"
  title: "Republiken Turkiet 1923 och Atatürk"
  wiki:
    - "sv:Mustafa Kemal Atatürk"
    - "sv:Turkiets historia"
  text: |
    Osmanska riket, som i 600 år hade härskat över stora delar av Mellanöstern, Nordafrika och Balkan, förlorade [första världskriget](#forsta-varldskriget). Segrarna planerade i Sèvresfreden 1920 att stycka även det turkiska kärnlandet. Officeren **Mustafa Kemal**, hjälten från [Gallipoli 1915](#gallipoli-1915), ledde ett självständighetskrig och drev ut grekiska, franska och andra styrkor.

    Den 29 oktober 1923 utropades Republiken Turkiet med Ankara som huvudstad och Kemal som president. Han fick senare namnet Atatürk, ”turkarnas fader”. Under 15 år genomförde han en radikal modernisering uppifrån: sultanatet och kalifatet (den islamiska ledartiteln) avskaffades, religion skildes från staten, det latinska alfabetet ersatte det arabiska 1928, kvinnor fick rösträtt 1934 och efternamn infördes.

    Samtidigt var det ett enpartistyre, och kurdiska uppror slogs ned. I ett befolkningsutbyte 1923 flyttades uppskattningsvis 1,2 miljoner grekisk-ortodoxa och omkring 400 000 muslimer mellan Turkiet och Grekland. Spänningen mellan Atatürks sekularism och religiös politik präglar Turkiet än idag.

saudiarabien-1932:
  period: 1920
  label: "Saudiarabien 1932"
  title: "Saudiarabien bildas 1932"
  wiki:
    - "sv:Saudiarabien"
    - "en:Ibn Saud"
  text: |
    **Abd al-Aziz ibn Saud** var ledare för huset Saud, en släkt som sedan 1700-talet varit allierad med wahhabismen, en strikt sunnimuslimsk rörelse. 1902 erövrade han Riyadh med ett litet antal män, och under tre decennier tog han kontroll över större delen av Arabiska halvön, däribland Hijaz med de heliga städerna Mecka och Medina 1925.

    1932 slogs områdena samman till Konungariket Saudiarabien, uppkallat efter familjen. Landet var då fattigt, med en befolkning på uppskattningsvis 2–3 miljoner, mestadels nomader och bönder, och inkomster främst från pilgrimer till Mecka.

    Allt förändrades när amerikanska oljebolag hittade olja 1938. Saudiarabien har idag några av världens största oljereserver och blev ledande i oljekartellen OPEC. Oljepengarna finansierade både modernisering och spridning av wahhabismen globalt. Ibn Sauds söner har styrt landet sedan hans död 1953; nuvarande kronprinsen Mohammed bin Salman är hans sonson.

    Jämför med [olja 1908](#olja-1908).

israel-1948:
  period: 1940
  label: "Israel 1948"
  title: "Staten Israel 1948"
  wiki:
    - "sv:Israel"
    - "sv:Israeliska självständighetskriget"
  text: |
    Palestina hade varit en del av Osmanska riket och styrdes efter första världskriget av Storbritannien. Sionismen, en judisk nationell rörelse från 1890-talet, ville skapa ett judiskt hemland där. Judisk invandring växte, särskilt under nazitiden, vilket ledde till konflikter med den arabiska majoriteten. Efter [Förintelsen](#forintelsen) ökade det internationella stödet för en judisk stat.

    1947 föreslog FN att dela Palestina i en judisk och en arabisk stat. Judiska ledare accepterade, arabiska ledare avvisade. Den 14 maj 1948 utropade **David Ben-Gurion** staten Israel. Dagen efter anföll Egypten, Jordanien, Syrien, Irak och Libanon. Israel vann kriget och utökade sitt territorium. Den svenske FN-medlaren **Folke Bernadotte** mördades av judiska extremister i september 1948.

    Omkring 700 000 palestinier flydde eller fördrevs – på arabiska kallat Nakba, katastrofen. Samtidigt flydde eller fördrevs uppskattningsvis 800 000 judar från arabländer, de flesta till Israel. Konflikten fortsatte med nya krig [1956](#suezkrisen-1956), [1967](#sexdagarskriget-1967) och [1973](#yom-kippur-1973-oljekris) och pågår än idag.

suezkrisen-1956:
  period: 1940
  label: "Suezkrisen 1956"
  title: "Suezkrisen 1956"
  wiki:
    - "sv:Suezkrisen"
  text: |
    Suezkanalen, [öppnad 1869](#suezkanalen-1869), förbinder Medelhavet med Röda havet och var livsnerven för Europas oljeimport och handel med Asien. Den ägdes av ett mestadels brittiskt-franskt bolag. Egyptens president **Gamal Abdel Nasser**, en officer som tagit makten i en kupp 1952 och var ledande för den arabiska nationalismen, förstatligade kanalen i juli 1956.

    Storbritannien, Frankrike och Israel gjorde upp en hemlig plan: Israel anföll Egypten i oktober, och britter och fransmän landsteg sedan under förevändning att skilja parterna åt. Militärt lyckades det, men USA:s president Eisenhower vägrade stödja operationen och hotade att sälja brittiska statsobligationer, vilket kunde knäcka pundet. Sovjet hotade samtidigt med vedergällning.

    Britter och fransmän tvingades dra sig tillbaka. FN skickade sin första stora fredsbevarande styrka, där svenska soldater ingick. Krisen visade att Storbritannien och Frankrike inte längre var supermakter och påskyndade avkoloniseringen. Nasser blev en hjälte i arabvärlden.

    Se även [Britterna i Egypten 1882](#britterna-i-egypten-1882).

sexdagarskriget-1967:
  period: 1960
  label: "Sexdagarskriget 1967"
  title: "Sexdagarskriget 1967"
  wiki:
    - "sv:Sexdagarskriget"
  text: |
    [Israel bildades 1948](#israel-1948) och vann då ett krig mot sina arabiska grannar; omkring 700 000 palestinier flydde eller fördrevs. Efter det rådde spänd vapenvila. I maj 1967 stängde Egyptens president **Gamal Abdel Nasser** Tiransundet för israelisk sjöfart, körde ut FN:s fredsstyrka från Sinaihalvön och flyttade fram trupper. Syrien och Jordanien slöt upp.

    Den 5 juni 1967 anföll Israel först. Flygvapnet förstörde det egyptiska flygvapnet på marken redan de första timmarna. På sex dagar erövrade Israel Sinaihalvön och Gaza från Egypten, Västbanken och östra Jerusalem från Jordanien, och Golanhöjderna från Syrien. Israels yta tredubblades ungefär. Uppskattningsvis 800 israeler och kanske 15 000–20 000 araber dödades.

    Kriget formar Mellanöstern än i dag. Israel fick kontroll över omkring en miljon palestinier på Västbanken och i Gaza, och började bygga bosättningar där. FN:s resolution 242 krävde att Israel lämnade områden i utbyte mot fred – principen ”land mot fred”. Egypten och Syrien försökte ta tillbaka områdena i [Yom Kippur-kriget 1973](#yom-kippur-1973-oljekris) (se det). Sinai lämnades tillbaka efter fredsavtalet med Egypten 1979; Västbanken och Gaza är kärnan i konflikten än i dag (se [Oslo-avtalen](#oslo-avtalen)).

yom-kippur-1973-oljekris:
  period: 1960
  label: "Yom Kippur 1973, oljekris"
  title: "Yom Kippur-kriget och oljekrisen 1973"
  wiki:
    - "sv:Oktoberkriget"
    - "sv:Oljekrisen 1973"
  text: |
    Den 6 oktober 1973, på den judiska försoningsdagen **Yom Kippur**, anföll Egypten och Syrien Israel överraskande för att ta tillbaka områden som förlorats i [Sexdagarskriget 1967](#sexdagarskriget-1967) (se det). Egyptiska trupper gick över Suezkanalen och syrier ryckte fram på Golanhöjderna. Israel tog stora förluster de första dagarna men vände kriget, med hjälp av en amerikansk luftbro av vapen. Sovjet stödde araberna. Efter knappt tre veckor kom vapenvila. Omkring 2 600 israeler och uppskattningsvis 8 000–18 000 araber dog.

    Som svar på USA:s stöd till Israel införde de arabiska oljeländerna inom **OPEC** (oljeexporterande länders organisation) ett embargo mot USA och Nederländerna och minskade produktionen. Oljepriset fyrdubblades på några månader, från cirka 3 till 12 dollar per fat. I västvärlden följde bensinköer, bilfria söndagar och ransonering; Sverige ransonerade bensin och eldningsolja vintern 1973–74.

    Oljekrisen avslutade efterkrigstidens snabba tillväxt och följdes av ”stagflation” – hög inflation och hög arbetslöshet samtidigt. Den ledde till satsningar på kärnkraft, energisnålare bilar och [olja från Nordsjön](#olja-i-nordsjon) (se det). Kriget ledde också till fredsavtalet mellan Egypten och Israel 1979. En andra oljekris kom efter [Iranska revolutionen 1979](#iranska-revolutionen-1979) (se det).

iranirakkriget:
  period: 1980
  label: "Iran–Irakkriget"
  title: "Iran–Irakkriget 1980–1988"
  wiki:
    - "sv:Iran–Irakkriget"
  text: |
    I september 1980 anföll Irak, styrt av diktatorn **Saddam Hussein**, grannlandet Iran. Saddam ville utnyttja kaoset efter [Iranska revolutionen 1979](#iranska-revolutionen-1979) (se det) för att ta oljerika gränsområden och kontroll över gränsfloden Shatt al-Arab, och fruktade att Iran skulle sprida sin revolution till Iraks shiamuslimska majoritet.

    Iran slog tillbaka och kriget blev ett utnötningskrig som påminde om [första världskriget](#forsta-varldskriget): skyttegravar, massanfall av infanteri – Iran skickade även tonårsfrivilliga i vågor – och Irak använde kemiska vapen, senapsgas och nervgas, mot iranska soldater och mot sina egna kurder, som i Halabja 1988 med omkring 5 000 döda. Båda sidor besköt varandras städer med robotar och anföll oljetankfartyg i Persiska viken.

    Kriget slutade 1988 med vapenvila och i stort sett oförändrade gränser. Uppskattningsvis 500 000 eller fler dog. USA, Sovjet, Frankrike och arabiska gulfstater stödde Irak för att hålla Iran tillbaka, och Iraks enorma krigsskulder till bland annat Kuwait blev en orsak till att Saddam invaderade Kuwait två år senare (se [Gulfkriget 1991](#gulfkriget-1991)). Kriget präglar fortfarande Irans ledare och dess satsningar på robotar och egen vapenproduktion.

gulfkriget-1991:
  period: 1980
  label: "Gulfkriget 1991"
  title: "Gulfkriget 1991"
  wiki:
    - "sv:Kuwaitkriget"
  text: |
    Den 2 augusti 1990 invaderade Irak under **Saddam Hussein** grannlandet Kuwait, ett litet men mycket oljerikt land. Irak var skuldsatt efter [Iran–Irakkriget](#iranirakkriget) (se det), anklagade Kuwait för att pressa ner oljepriset och gjorde gamla anspråk på landet. Med Kuwait skulle Irak kontrollera omkring en femtedel av världens kända oljereserver och hota Saudiarabien.

    FN:s säkerhetsråd krävde tillbakadragande. Eftersom kalla kriget just tagit slut röstade Sovjet inte emot. USA under president George H. W. Bush byggde en koalition av ett trettiotal länder med omkring 950 000 soldater, varav cirka 700 000 amerikaner. Operation Ökenstorm inleddes den 17 januari 1991 med fem veckors flygbombningar. Det var det första kriget där precisionsstyrda vapen, smygflygplan och satellitnavigering med GPS spelade stor roll, och CNN sände direkt från Bagdad. Markkriget tog bara 100 timmar.

    Koalitionen förlorade knappt 300 soldater; Iraks förluster uppskattas till 20 000–35 000 eller fler. Retirerande irakier satte eld på över 600 kuwaitiska oljekällor. Saddam fick sitta kvar och slog ned uppror bland shiamuslimer och kurder. USA behöll trupper i Saudiarabien, något som Usama bin Ladin använde i sin propaganda. Konflikten med Saddam ledde vidare till [Irakkriget 2003](#irakkriget).

oslo-avtalen:
  period: 1980
  label: "Oslo-avtalen"
  title: "Osloavtalen 1993"
  wiki:
    - "sv:Osloavtalen"
  text: |
    Sedan [Sexdagarskriget 1967](#sexdagarskriget-1967) (se det) hade Israel ockuperat Västbanken och Gaza, med omkring två miljoner palestinier. Den palestinska befrielseorganisationen **PLO**, ledd av **Jassir Arafat**, betraktades av Israel som en terrororganisation. 1987 började den första **intifadan**, ett palestinskt uppror med strejker, stenkastning och demonstrationer.

    1993 förhandlade israeler och palestinier i hemlighet i Norge, förmedlat av norska diplomater. Den 13 september 1993 skakade Israels premiärminister **Yitzhak Rabin** och Arafat hand på Vita husets gräsmatta under president Clinton. PLO erkände Israels rätt att existera, Israel erkände PLO, och en palestinsk myndighet fick begränsat självstyre i delar av Gaza och Västbanken. De svåraste frågorna – gränser, Jerusalem, flyktingarna och de israeliska bosättningarna – sköts upp till senare förhandlingar inom fem år.

    Rabin, Arafat och utrikesminister Shimon Peres fick Nobels fredspris 1994. Men avtalet attackerades från båda håll: palestinska Hamas utförde självmordsattentat, och 1995 mördades Rabin av en israelisk högerextremist. Förhandlingarna kollapsade 2000, följt av en andra, våldsammare intifada. Bosättningarna har växt kraftigt sedan dess, och konflikten pågår, med [kriget i Gaza från 2023](#oktober-2023-gazakriget-7) som senaste stora kapitel.

irak-2003:
  period: 2000
  label: "Irak 2003"
  title: "Irakkriget 2003–2011"
  wiki:
    - "sv:Irakkriget"
    - "en:Iraq War"
  text: |
    Den 20 mars 2003 [invaderade en koalition ledd av USA och Storbritannien Irak](#irakkriget). Den irakiska armén föll snabbt, Bagdad intogs på tre veckor och diktatorn **Saddam Hussein**, som styrt sedan 1979, greps i december 2003 och avrättades 2006. Motiveringen – att Irak hade massförstörelsevapen och band till al-Qaida – visade sig vara felaktig.

    Det som följde var värre än invasionen. USA upplöste den irakiska armén och sparkade medlemmar av Saddams parti från statsförvaltningen, vilket lämnade hundratusentals beväpnade och arbetslösa män. Ett uppror bröt ut, och 2006–07 blev det inbördeskrig mellan **shiamuslimer** (majoriteten, förtryckta under Saddam) och **sunnimuslimer** (Saddams maktbas) – islams två huvudinriktningar, som delades i en tvist om vem som skulle efterträda profeten Muhammed på 600-talet.

    Uppskattningar av antalet döda irakier varierar kraftigt, från omkring 200 000 till flera hundra tusen. Nästan 4 500 amerikanska soldater dog och kostnaden för USA beräknas till över 1 000 miljarder dollar. Iran fick stort inflytande i Irak. Ur resterna av al-Qaida i Irak växte senare terrorgruppen IS fram. Se även [Syrienkriget, IS](#syrienkriget-is).

arabiska-varen-2011:
  period: 2000
  label: "arabiska våren 2011"
  title: "Arabiska våren 2011"
  wiki:
    - "sv:Arabiska våren"
    - "en:Arab Spring"
  text: |
    **Arabiska våren** var en våg av folkliga uppror i arabvärlden som började i Tunisien i december 2010, när gatuförsäljaren Mohamed Bouazizi satte eld på sig själv efter trakasserier från myndigheterna. Protesterna spred sig snabbt, ofta organiserade och dokumenterade via mobiltelefoner, [Facebook och Twitter](#sociala-medier). Bakom låg arbetslöshet bland unga, stigande matpriser, korruption och diktatorer som suttit i decennier.

    Inom ett år föll fyra ledare: Tunisiens Ben Ali (efter 23 år), Egyptens **Hosni Mubarak** (efter 30 år, efter 18 dagars protester på Tahrirtorget i Kairo), Libyens **Muammar al-Gaddafi** (efter 42 år, dödad efter ett inbördeskrig där NATO bombade) och Jemens Saleh. I Bahrain slogs protesterna ned med hjälp av saudiska trupper.

    Resultaten blev mest nedslående. Bara Tunisien blev en demokrati, och även den har sedan urholkats. I Egypten valdes islamisten Muhammad Mursi, men militären tog makten igen 2013. Libyen, Jemen och Syrien hamnade i långvariga inbördeskrig som dödat hundratusentals och drev miljoner på flykt, bland annat mot Europa 2015. Jämför med [revolutionsåret 1848](#revolution-1848) i Europa, som också spred sig snabbt och mestadels slogs tillbaka. Se även [Syrienkriget, IS](#syrienkriget-is).

syrienkriget-is:
  period: 2000
  label: "Syrienkriget, IS"
  title: "Syriska inbördeskriget och Islamiska staten"
  wiki:
    - "sv:Inbördeskriget i Syrien"
    - "sv:Islamiska staten"
    - "en:Syrian civil war"
  text: |
    I Syrien började protester under [arabiska våren 2011](#arabiska-varen-2011) mot president **Bashar al-Assad**, vars familj styrt sedan 1970. Regimen svarade med att skjuta mot demonstranter, och konflikten blev ett inbördeskrig mellan regimen och många olika rebellgrupper. Det blev också ett ombudskrig: Iran, den libanesiska milisen Hizbollah och från 2015 Ryssland stödde Assad, medan Turkiet, Gulfstaterna och USA stödde olika rebeller. Regimen använde bland annat kemiska vapen och fatbomber mot civila.

    I kaoset växte **Islamiska staten** (IS), en extrem sunnimuslimsk terrorgrupp som uppstått ur al-Qaida i Irak (se [Irak 2003](#irak-2003)). 2014 erövrade IS stora delar av Syrien och Irak, inklusive miljonstaden Mosul, och utropade ett **kalifat** – en islamisk stat som gjorde anspråk på att styra alla muslimer. IS begick folkmord på yazidier, filmade avrättningar och låg bakom terrorattentat i Europa, som i Paris 2015 (130 döda). Tusentals européer, däribland uppskattningsvis 300 från Sverige, reste för att ansluta sig.

    En koalition ledd av USA, tillsammans med kurdiska och irakiska styrkor, krossade kalifatet till 2019. Kriget i Syrien dödade uppskattningsvis 500 000–600 000 människor och drev omkring 13 miljoner, ungefär hälften av befolkningen, på flykt. Se även [Assad faller 2024](#assad-faller-2024).

oktober-2023-gazakriget-7:
  period: 2020
  label: "7 oktober 2023, Gazakriget"
  title: "Hamas attack 7 oktober 2023 och Gazakriget"
  wiki:
    - "en:Gaza war"
    - "en:October 7 attacks"
    - "sv:Hamas"
  text: |
    **Gaza** är en smal kustremsa vid Medelhavet, ungefär 40 km lång, där drygt 2 miljoner palestinier bodde. Den islamistiska rörelsen **Hamas** har styrt Gaza sedan 2007, och Israel och Egypten har sedan dess haft en blockad av området. Konflikten mellan israeler och palestinier om samma land pågår sedan [Israels grundande 1948](#israel-1948).

    Den 7 oktober 2023 bröt tusentals Hamaskrigare igenom gränsstängslet och angrep israeliska samhällen, militärbaser och en musikfestival. Omkring 1 200 människor dödades, de flesta civila, och cirka 250 fördes som gisslan till Gaza. Det var den dödligaste dagen för judar sedan [Förintelsen](#forintelsen). Israel svarade med ett omfattande bombkrig och markinvasion av Gaza för att krossa Hamas och befria gisslan.

    Kriget blev ett av de mest förödande i modern tid för en civilbefolkning. Enligt Gazas hälsomyndighet, som styrs av Hamas men vars siffror FN bedömt som i stort sett tillförlitliga, dödades över 60 000 palestinier, och större delen av bebyggelsen förstördes. FN-organ varnade för och konstaterade svält. Kriget spred sig till Libanon (Hizbollah), Jemen och direkta attacker mellan Israel och Iran. Internationella brottmålsdomstolen utfärdade arresteringsorder mot både Israels premiärminister Netanyahu och Hamasledare. Se även [Assad faller 2024](#assad-faller-2024).

assad-faller-2024:
  period: 2020
  label: "Assad faller 2024"
  title: "Assadregimen faller 2024"
  wiki:
    - "en:Fall of the Assad regime"
    - "sv:Bashar al-Assad"
  text: |
    Efter inbördeskrigets värsta år (se [Syrienkriget, IS](#syrienkriget-is)) hade **Bashar al-Assad** med hjälp av Ryssland, Iran och den libanesiska milisen Hizbollah återtagit större delen av Syrien. Från omkring 2020 var kriget nästan fruset: rebellerna höll provinsen Idlib i nordväst, kurdledda styrkor nordost. Landet var utarmat och regimen finansierades delvis genom smuggling av drogen captagon.

    Hösten 2024 var Assads beskyddare försvagade: Ryssland var bundet av [kriget i Ukraina](#krig-mot-ukraina) och Hizbollah hade tagit svår skada i kriget med Israel. Den 27 november 2024 inledde rebellgruppen **Hayat Tahrir al-Sham** (HTS) – en islamistisk rörelse med rötter i al-Qaida som senare tagit avstånd från den – en offensiv från Idlib. Regeringsarmén föll ihop nästan utan strid. Aleppo föll på några dagar och den 8 december 2024 intogs Damaskus. Assad flydde till Moskva. Familjen Assads 54 år vid makten var över.

    När fängelserna öppnades, som det ökända Saydnaya, blev regimens omfattande tortyr synlig. HTS-ledaren Ahmed al-Sharaa blev övergångspresident och västvärlden har lättat på sanktionerna. Landet är fortfarande splittrat och har präglats av våldsamma sammanstötningar med minoriteter. Jämför med [arabiska våren 2011](#arabiska-varen-2011), som började Syrienkriget.
