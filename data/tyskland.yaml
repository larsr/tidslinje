# Tyskland
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

otto-iii-dor-1002:
  period: 1000
  label: "Otto III dör 1002"
  title: "Otto III dör 1002"
  wiki:
    - "en:Otto III, Holy Roman Emperor"
    - "sv:Tysk-romerska riket"
  text: |
    **Otto III** (980–1002) var kung av Tyskland och från 996 kejsare. Han hörde till den ottonska (sachsiska) ätten som 962 återupplivat kejsardömet i väst – det som senare kallades **tysk-romerska riket**, en lös sammanslutning av Tyskland, norra Italien och angränsande länder under en vald kung som påven krönte till kejsare.

    Otto blev kung som treåring; hans mor, en bysantinsk prinsessa, och farmor styrde i hans ställe. Som vuxen drömde han om att återupprätta det antika Romarriket med Rom som huvudstad. Han lät sin lärare Gerbert bli påve (Sylvester II, se även [arabiska siffror ~1000](#gerbert-pave-sylvester-ii-for-in)), och år 1000 besökte han Gnesen i Polen och erkände [Bolesław](#bolesaw-i-i-polen) som självständig härskare, samt stödde [Ungerns kristnande](#stefan-i-kront-till-ungerns-kung-1000).

    Romarna gjorde uppror mot honom 1001, och han dog i januari 1002, bara 21 år gammal, troligen av malaria, utan barn. Hans död avslutade drömmen om ett Rom-centrerat kejsardöme. Hans kusin [Henrik II](#henrik-ii-kejsare-1014) tog över och inriktade sig på Tyskland. Ottos politik mot Polen och Ungern bidrog till att de blev självständiga kristna kungariken i stället för tyska lydstater.

henrik-ii-kejsare-1014:
  period: 1000
  label: "Henrik II kejsare 1014"
  title: "Henrik II kröns till kejsare 1014"
  wiki:
    - "en:Henry II, Holy Roman Emperor"
  text: |
    **Henrik II** (973–1024) var den siste kungen av den ottonska ätten. Han blev tysk kung 1002 efter sin barnlöse kusin Otto III, och påven krönte honom till kejsare i Rom 1014. Kejsartiteln betydde att han var världslig ledare för den västliga kristenheten, men den verkliga makten vilade på hur mycket av Tyskland och Italien han kunde kontrollera.

    Henrik stödde sig i hög grad på kyrkan. Han utsåg själv biskopar och abbotar och gav dem stora landområden; de kunde inte ärva bort jorden, så den gick tillbaka till kungen när de dog. Det gjorde biskoparna till lojala ämbetsmän i stället för självständiga furstar. 1007 grundade han biskopsdömet Bamberg. Han förde också långa krig mot [Bolesław I av Polen](#bolesaw-i-i-polen) (1002–1018).

    Hans kyrkopolitik fick stora följder. Att kungen tillsatte biskopar ledde senare till **[investiturstriden](#investiturstriden-borjar)** (från 1075) – striden om vem som fick utse biskopar, kungen eller påven. Henrik och hans hustru Kunigunda blev helgonförklarade, ovanligt för en kung. Han dog barnlös 1024 och efterträddes av [Konrad II](#konrad-ii-saliska-dynastin-1024), den förste av den saliska ätten.

konrad-ii-saliska-dynastin-1024:
  period: 1020
  label: "Konrad II, saliska dynastin 1024"
  title: "Konrad II och den saliska dynastin 1024"
  wiki:
    - "en:Conrad II, Holy Roman Emperor"
    - "en:Salian dynasty"
  text: |
    **Konrad II** (ca 990–1039) valdes till tysk kung 1024, när den ottonska ätten dött ut med den barnlöse Henrik II. Tyskland var inte ett arvkungadöme: kungen valdes av stormännen, i det här fallet vid ett möte vid Rhen med tusentals deltagare. Konrad blev den förste av den **saliska dynastin** (efter salierna, en frankisk folkgrupp), som styrde fram till 1125.

    Han kröntes till kejsare i Rom 1027, i närvaro av [Knut den store](#knut-den-store-kung-av-england-danmark). Hans största politiska framgång var att han 1033 fick **kungariket Burgund** (se [Burgund 1033](#burgund-till-riket-1033)) till riket. Han gav också mindre riddare rätt att ärva sina län, vilket gjorde dem lojala mot kungen i stället för mot sina närmaste herrar – en motvikt till de stora furstarnas makt. Han började bygga [domkyrkan i Speyer](#speyerdomen-paborjas) som ättens gravkyrka.

    Det tysk-romerska riket bestod nu av tre kungariken: Tyskland, Italien och Burgund. Den saliska ätten är mest känd för sitt senare möte med kyrkan: Konrads sonsons son Henrik IV hamnade i **investiturstriden** med påven och fick 1077 gå i botgöring i snön utanför borgen [Canossa](#canossa-1077).

burgund-till-riket-1033:
  period: 1020
  label: "Burgund till riket 1033"
  title: "Burgund läggs till tysk-romerska riket 1033"
  wiki:
    - "en:Kingdom of Burgundy"
    - "en:Kingdom of Arles"
  text: |
    **Kungariket Burgund** (även kallat Arelat, efter staden Arles) omfattade ungefär dagens västra Schweiz, Franche-Comté och Rhônedalen i östra Frankrike, ner till Medelhavet vid Marseille. Det ska inte förväxlas med **hertigdömet Burgund** kring Dijon, som hörde till Frankrike.

    Den siste burgundiske kungen, Rudolf III, var barnlös och hade lovat riket till den tyske kejsaren. När han dog 1032 tog kejsar [Konrad II](#konrad-ii-saliska-dynastin-1024) över, efter att ha besegrat en fransk rival, och kröntes 1033. Därmed bestod tysk-romerska riket av tre kungariken: Tyskland, Italien och Burgund.

    Varför spelar det roll? Burgund gav kejsaren kontroll över passen genom Alperna, de viktiga vägarna mellan Tyskland och Italien, och Rhônedalen, en huvudväg mellan Nordeuropa och Medelhavet. I praktiken var kejsarens makt där svag, och området föll successivt till Frankrike – Lyon 1312, Dauphiné 1349, Provence 1481. Gränsfrågan mellan det franska och det tyska i området mellan Rhen och Rhône har sedan dess varit en återkommande konfliktkälla, ända in i 1900-talets krig om Alsace-Lorraine.

speyerdomen-paborjas:
  period: 1020
  label: "Speyerdomen påbörjas"
  title: "Speyerdomen påbörjas"
  wiki:
    - "sv:Speyerdomen"
    - "sv:Romansk stil"
  text: |
    **Speyerdomen** i staden Speyer vid Rhen i sydvästra Tyskland började byggas omkring 1030 av kejsar [Konrad II](#konrad-ii-saliska-dynastin-1024), den förste kejsaren av den saliska ätten. Den skulle bli ättens gravkyrka, och åtta tyska kejsare och kungar ligger begravda där. Den invigdes 1061.

    Vid färdigställandet var den med sina drygt 130 meters längd uppskattningsvis världens största kyrka, och den är fortfarande världens största bevarade kyrka i **romansk stil**. Romansk stil var den dominerande byggstilen i Europa ca 1000–1200: tjocka murar, rundbågar, små fönster och tunga valv, inspirerade av romerska byggnader. Speyer var en av de första stora kyrkorna med stenvalv över hela mittskeppet, i stället för brandfarligt trätak.

    Byggnaden var ett politiskt budskap: kejsaren visade att han var Guds utvalde och jämbördig med påven. Jämför med [Brihadishvara-templet i Indien](#cholariket-rajaraja-i-thanjavur-templet), invigt 1010, som också var en kunglig maktsymbol. Romansk stil ersattes på 1100-talet av gotiken, med spetsbågar och stora fönster, som i [Notre-Dame i Paris](#notre-dame-i-paris-paborjas-1163). Domen är idag världsarv.

henrik-iii:
  period: 1040
  label: "Henrik III"
  title: "Kejsar Henrik III (1039–1056)"
  wiki:
    - "sv:Henrik III (tysk-romersk kejsare)"
    - "sv:Tysk-romerska riket"
  text: |
    **Henrik III** (1017–1056) var tysk kung från 1039 och kejsare av **Tysk-romerska riket** från 1046. Tysk-romerska riket var en lös union av tyska, italienska och burgundiska länder, vars kung kröntes till kejsare av påven och såg sig som arvtagare till det antika Rom och Karl den store.

    Henrik III var kanske den mäktigaste kejsaren under medeltiden. Han var djupt religiös och ville rena kyrkan från korruption, särskilt *simoni* – köp och försäljning av kyrkliga ämbeten. När tre rivaliserande påvar gjorde anspråk på påvestolen lät han avsätta alla tre (se [synoden i Sutri 1046](#synoden-i-sutri-1046-kejsaren-avsatter)) och tillsatte tyska reformpåvar.

    Varför det spelar roll: ironiskt nog stärkte han den reformrörelse som sedan vände sig mot kejsarmakten. Reformpåvarna började hävda att ingen världslig härskare fick utse kyrkans män. När Henrik dog 1056 och efterträddes av sin sexårige son Henrik IV, bröt den konflikten ut öppet – [investiturstriden](#investiturstriden-borjar) (se [Canossa 1077](#canossa-1077)).

synoden-i-sutri-1046-kejsaren-avsatter:
  period: 1040
  label: "synoden i Sutri 1046: kejsaren avsätter tre påvar"
  title: "Synoden i Sutri 1046"
  wiki:
    - "en:Synod of Sutri"
  text: |
    På 1040-talet var påvedömet en del av Roms adelsfamiljers maktkamp. Tre män gjorde anspråk på att vara påve: Benedictus IX (som enligt uppgift sålt ämbetet), Silvester III och Gregorius VI (som köpt det av Benedictus).

    Tyske kungen **Henrik III** tågade till Italien för att krönas till kejsare. I december 1046 sammankallade han en *synod* – ett kyrkomöte med biskopar – i Sutri, norr om Rom. Mötet avsatte påvarna (Benedictus formellt strax efteråt i Rom), och Henrik lät välja en tysk biskop till påve, Clemens II, som genast krönte honom till kejsare.

    Varför det spelar roll: det var höjdpunkten för kejsarens makt över kyrkan. Henrik tillsatte sedan flera reformpåvar som bekämpade köp av ämbeten och krävde celibat för präster. Men reformen fick egen dynamik: 1059 bestämdes att kardinaler – inte kejsaren eller romarna – skulle välja påven, vilket är grunden för dagens konklav. Inom 30 år förödmjukade påven kejsaren (se [Canossa 1077](#canossa-1077)). Jämför med [Henrik III](#henrik-iii) som person och härskare.

henrik-iv:
  period: 1060
  label: "Henrik IV"
  title: "Kejsar Henrik IV (1056–1106)"
  wiki:
    - "sv:Henrik IV (tysk-romersk kejsare)"
  text: |
    **Henrik IV** (1050–1106) blev tysk kung som sexåring 1056, när hans far [Henrik III](#henrik-iii) dog, och kejsare 1084. Under hans barndom styrde hans mor och mäktiga biskopar, och kungamakten försvagades. Han regerade i 50 år – en av medeltidens längsta och mest stormiga regeringar.

    Hans regering präglades av två konflikter. Den första var mot de sachsiska adelsmännen i norra Tyskland, som gjorde uppror mot hans borgbyggen (1073–1075). Den andra, och viktigare, var **[investiturstriden](#investiturstriden-borjar)** mot påven **[Gregorius VII](#gregorius-vii-pave-1073)** om vem som skulle utse biskopar. Han bannlystes och tvingades göra bot i [Canossa 1077](#canossa-1077), men tog sedan revansch: han erövrade Rom 1084, tillsatte en motpåve och lät kröna sig till kejsare.

    Varför det spelar roll: Henrik IV:s regering visade att kejsaren inte längre kunde styra kyrkan som sin far gjort. Han dog avsatt av sin egen son, Henrik V. Konflikten försvagade kejsarmakten långsiktigt, vilket är en orsak till att Tyskland förblev splittrat i hundratals småstater till 1871, medan Frankrike och England centraliserades.

investiturstriden-borjar:
  period: 1060
  label: "investiturstriden börjar"
  title: "Investiturstriden"
  wiki:
    - "sv:Investiturstriden"
    - "sv:Wormskonkordatet"
  text: |
    **Investiturstriden** var striden om vem som fick utse biskopar och abbotar – kungen eller påven. *Investitur* betyder ungefär "insättning i ämbetet" och syftar på ceremonin där en ny biskop fick sin stav och ring, symbolerna för ämbetet.

    Biskopar var inte bara präster utan också stora jordägare och politiska ämbetsmän, som ofta styrde hela regioner och ställde upp soldater åt kungen. I det Tysk-romerska riket var de kejsarens viktigaste stöd. Kyrkliga reformivrare menade att kungar som sålde och delade ut ämbeten korrumperade kyrkan. 1075 förbjöd påven **[Gregorius VII](#gregorius-vii-pave-1073)** lekmäns investitur; kejsar **[Henrik IV](#henrik-iv)** svarade med att förklara påven avsatt, och påven bannlyste kejsaren (se [Canossa 1077](#canossa-1077)).

    Striden slutade med en kompromiss, **[konkordatet i Worms](#konkordatet-i-worms-1122)** 1122: påven gav biskopen de andliga symbolerna, kejsaren den världsliga makten. Varför det spelar roll: konflikten skapade en tydlig skillnad mellan kyrka och stat i Västeuropa – två konkurrerande maktcentra – som saknades i Bysans och den islamiska världen. Många historiker ser det som en rot till den västerländska idén om åtskillnad mellan religion och politik.

canossa-1077:
  period: 1060
  label: "Canossa 1077"
  title: "Gåendet till Canossa 1077"
  wiki:
    - "en:Road to Canossa"
  text: |
    I [investiturstriden](#investiturstriden-borjar) (striden om vem som fick utse biskopar) förklarade kejsar **[Henrik IV](#henrik-iv)** 1076 påven **[Gregorius VII](#gregorius-vii-pave-1073)** avsatt. Påven svarade med att *bannlysa* honom – utesluta honom ur kyrkan – och befria hans undersåtar från deras trohetsed. De tyska furstarna, som ändå var missnöjda, hotade att välja en ny kung om bannlysningen inte hävdes inom ett år.

    Henrik tog sig mitt i vintern över Alperna till borgen **Canossa** i norra Italien, där påven bodde hos grevinnan Matilda. Enligt berättelsen stod kejsaren barfota i botgörarskjorta i snön utanför porten i tre dagar, i januari 1077, tills påven släppte in honom och hävde bannlysningen.

    Varför det spelar roll: händelsen var en symbol för att påven kunde förödmjuka även den mäktigaste världslige härskaren. Politiskt var det dock ett smart drag av Henrik, som räddade sin tron. "Gå till Canossa" blev ett uttryck för att förödmjuka sig och be om förlåtelse; Bismarck sade 1872, under hans konflikt med katolska kyrkan, "vi går inte till Canossa".

henrik-iv-mot-paven-motkungar:
  period: 1080
  label: "Henrik IV mot påven, motkungar"
  title: "Henrik IV, påven och Canossa"
  wiki:
    - "sv:Henrik IV (tysk-romersk kejsare)"
    - "sv:Investiturstriden"
  text: |
    **Henrik IV** (kung 1056, kejsare 1084–1105) styrde det Tysk-romerska riket – ett löst förbund av tyska hertigdömen plus norra Italien, vars kung kunde krönas till kejsare av påven. Kungen hade länge utsett biskoparna, som var både kyrkoledare och stora feodalherrar med jord och soldater. De var kungens viktigaste stöd.

    Påven **[Gregorius VII](#gregorius-vii-pave-1073)**, präglad av [Cluny-reformen](#cluny-reformen) (se Cluny-reformen), förbjöd 1075 lekmän att utse biskopar. Det blev **[investiturstriden](#investiturstriden-borjar)** – striden om vem som fick utse biskopar, kungen eller påven. Henrik förklarade påven avsatt; påven bannlyste Henrik och löste hans undersåtar från lydnadsplikten. Tyska furstar hotade att välja ny kung, och Henrik tvingades 1077 gå till borgen **[Canossa](#canossa-1077)** i norra Italien och enligt traditionen stå barfota i snön i tre dagar för att få förlåtelse. ”Gå till Canossa” betyder än idag att förödmjuka sig.

    Furstarna valde ändå en **motkung**, Rudolf av Schwaben, och inbördeskrig följde. Henrik slog tillbaka, tog Rom 1084 och lät en motpåve kröna honom. Han avsattes till slut av sin egen son, Henrik V. Konflikten försvagade den tyska kungamakten varaktigt, en orsak till att Tyskland förblev splittrat ända till 1871.

henrik-v:
  period: 1100
  label: "Henrik V"
  title: "Henrik V och konkordatet i Worms"
  wiki:
    - "sv:Henrik V (tysk-romersk kejsare)"
    - "sv:Konkordatet i Worms"
  text: |
    **Henrik V** (kung 1106, kejsare 1111–1125) styrde det Tysk-romerska riket, ett löst förbund av tyska hertigdömen och norra Italien. Han tog makten genom att 1105 göra uppror mot sin egen far, [Henrik IV](#henrik-iv), med stöd av påven och furstar som tröttnat på konflikten med kyrkan.

    Men väl på tronen fortsatte han samma kamp i **[investiturstriden](#investiturstriden-borjar)** – striden om vem som fick utse biskopar, kungen eller påven. 1111 tog han till och med påven Paschalis II till fånga i Rom för att tvinga fram kejsarkröning och erkännande av sin rätt. Han bannlystes, och tyska furstar gjorde uppror mot honom.

    1122 slöts till slut **[konkordatet i Worms](#konkordatet-i-worms-1122)**, en kompromiss: kyrkan skulle välja biskoparna och ge dem ring och stav (de andliga symbolerna), men kejsaren fick närvara vid valet och ge dem spiran som symbol för de världsliga rättigheterna – land och makt. Det skilde för första gången tydligt mellan andlig och världslig makt. Han gifte sig med Matilda, dotter till Henrik I av England. När han dog barnlös 1125 slocknade den saliska dynastin.

investiturstriden-fortsatter:
  period: 1100
  label: "investiturstriden fortsätter"
  title: "Investiturstriden"
  wiki:
    - "sv:Investiturstriden"
    - "en:Investiture Controversy"
  text: |
    **Investiturstriden** var konflikten om vem som fick utse biskopar och abbotar – kungen eller påven. ”Investitur” betyder insättning i ämbetet, ceremonin där den nya biskopen fick sin ring och stav. Det låter som en formsak men handlade om enorm makt: biskopar ägde stora landområden, hade egna soldater och var kungens viktigaste ämbetsmän. Den som utsåg dem kontrollerade en stor del av riket.

    Striden blossade upp 1075 när påven **[Gregorius VII](#gregorius-vii-pave-1073)** förbjöd kungar att utse biskopar, och ledde till att kejsar Henrik IV gick till [Canossa 1077](#canossa-1077) (se [Henrik IV mot påven](#henrik-iv-mot-paven-motkungar)). Den fortsatte med inbördeskrig, motkungar och motpåvar i nästan 50 år och utspelade sig även i England och Frankrike.

    I England löstes den 1107 och i Tyskland 1122 med **konkordatet i Worms**: kyrkan valde biskopen och gav de andliga symbolerna, kungen gav de världsliga rättigheterna (se [Henrik V](#henrik-v)). Resultatet var en tydligare gräns mellan andlig och världslig makt än i andra kulturer, som Bysans eller Kina där härskaren också var religiös ledare. Den uppdelningen ses ofta som en rot till den västerländska idén om att stat och kyrka är skilda saker.

konkordatet-i-worms-1122:
  period: 1120
  label: "Konkordatet i Worms 1122"
  title: "Konkordatet i Worms 1122"
  wiki:
    - "sv:Konkordatet i Worms"
    - "sv:Investiturstriden"
  text: |
    Ett konkordat är ett avtal mellan påven och en stat. Det i Worms slöts mellan kejsare **[Henrik V](#henrik-v)** av det tysk-romerska riket och påven **Calixtus II**, och avslutade **[investiturstriden](#investiturstriden-borjar)** – striden om vem som fick utse biskopar och abbotar, kungen eller påven.

    Frågan var inte bara religiös. Biskopar var stora jordägare och furstar; i det tyska riket var de kejsarens viktigaste stöd, eftersom deras ämbeten inte gick i arv. Konflikten hade brutit ut 1075, och 1077 tvingades kejsar Henrik IV att stå barfota i snön utanför borgen [Canossa](#canossa-1077) för att få påvens förlåtelse. Därefter följde krig och motpåvar i nästan 50 år.

    Kompromissen var att skilja på två roller: kyrkan valde biskopen och gav honom ring och stav (symboler för den andliga makten), medan kejsaren gav honom spiran som symbol för de världsliga länderna. I Tyskland fick kejsaren dessutom närvara vid valen. Uppdelningen mellan andlig och världslig makt blev en tidig byggsten i den västerländska idén att kyrka och stat är olika saker – något som saknade motsvarighet i exempelvis Bysans, där kejsaren dominerade kyrkan.

konrad-iii-hohenstaufen-1138:
  period: 1120
  label: "Konrad III, Hohenstaufen 1138"
  title: "Konrad III – den förste Hohenstaufen 1138"
  wiki:
    - "en:Conrad III of Germany"
    - "en:Hohenstaufen"
    - "en:Guelphs and Ghibellines"
  text: |
    Det tysk-romerska riket (ungefär dagens Tyskland, Österrike, Schweiz, Nederländerna, Tjeckien och norra Italien) hade ingen ärftlig kung: furstarna valde. 1138 valde de **Konrad III** av släkten **Hohenstaufen** (även kallade Staufer, efter borgen Staufen i Schwaben). Han blev den förste av en ätt som innehade kronan fram till 1254.

    Valet startade en lång konflikt med den rivaliserande släkten **Welf**, som hade Bayern och Sachsen och själva räknat med kronan. Striden spred sig till Italien, där partierna kallades ghibelliner (kejsartrogna, efter Staufer-borgen Waiblingen) och guelfer (påvetrogna, efter Welf). Dessa partinamn delade italienska städer i över 200 år; Dante, författaren till *[Den gudomliga komedin](#dante-divina-commedia)*, landsförvisades från Florens till följd av sådana partistrider.

    Konrad deltog i [andra korståget 1147](#andra-korstaget-114749), där hans här slogs sönder av turkarna vid Dorylaion i Anatolien. Han kröntes aldrig till kejsare av påven. Han efterträddes 1152 av sin brorson **[Fredrik I Barbarossa](#fredrik-i-barbarossa-1152)**, som valdes delvis för att han hade både Staufer- och Welfsläkt och kunde förena dem.

fredrik-i-barbarossa-1152:
  period: 1140
  label: "Fredrik I Barbarossa 1152"
  title: "Fredrik I Barbarossa 1152"
  wiki:
    - "sv:Fredrik I Barbarossa"
    - "sv:Huset Hohenstaufen"
  text: |
    **Fredrik I** (ca 1122–1190) av släkten Hohenstaufen valdes till tysk kung 1152 och kröntes till kejsare av påven 1155. Italienarna kallade honom *Barbarossa*, ”rödskägget”. Han valdes delvis för att han hade både Staufer- och Welf-släkt och kunde ena de två rivaliserande släkterna (se [Konrad III](#konrad-iii-hohenstaufen-1138)).

    Hans mål var att återupprätta kejsarmakten, särskilt i norra Italien. De rika italienska städerna, som Milano, hade blivit i praktiken självstyrande och han ville åter få ut skatter och lojalitet. Han gjorde sex fälttåg till Italien; 1162 lät han jämna Milano med marken. Men städerna gick samman i [Lombardiska förbundet](#lombardiska-forbundet) och besegrade honom vid [Legnano 1176](#barbarossa-forlorar-vid-legnano-1176) (se dit). Han låg också i konflikt med påven, som stödde städerna.

    I Tyskland lyckades han bättre och krossade 1180 sin främste rival, Henrik Lejonet av Welf-släkten. Han [drunknade 1190](#barbarossa-drunknar-1190) i en flod i Anatolien på väg till tredje korståget, 67 år gammal. Legenden säger att han inte är död utan sover i berget Kyffhäuser och ska vakna när Tyskland behöver honom. Därav namnet på Hitlers anfall mot Sovjetunionen 1941: Operation Barbarossa.

barbarossa-forlorar-vid-legnano-1176:
  period: 1160
  label: "Barbarossa förlorar vid Legnano 1176"
  title: "Slaget vid Legnano 1176"
  wiki:
    - "sv:Slaget vid Legnano"
    - "sv:Fredrik I Barbarossa"
  text: |
    Kejsar **Fredrik I Barbarossa** av det tysk-romerska riket (se [Fredrik I Barbarossa 1152](#fredrik-i-barbarossa-1152)) ville återupprätta kejsarens makt och skatteintäkter i de rika städerna i norra Italien. Han förstörde Milano 1162, men städerna gick 1167 samman i **[Lombardiska förbundet](#lombardiska-forbundet)** (se dit) med stöd av påven.

    I maj 1176, nära Legnano nordväst om Milano, mötte Fredriks armé – uppskattningsvis 3 000 riddare – förbundets styrkor. Förbundet hade färre riddare men ett stort fotfolk av beväpnade stadsbor samlade kring *carroccio*, en oxdragen vagn med stadens fanor och ett altare. Fotfolket höll stånd kring vagnen medan Milanos riddare återhämtade sig och anföll. Kejsarens armé flydde, och Fredrik själv försvann en tid och troddes död.

    Det var en av de första gångerna i medeltida Europa som stadsmilis besegrade en riddarhär. Fredrik slöt fred med påven 1177 och med städerna i Konstanz 1183: de fick i praktiken styra sig själva. Därmed kunde städer som Milano, Venedig och Florens utvecklas till de stadsstater som senare blev renässansens centrum. Slaget nämns i Italiens nationalsång.

barbarossa-drunknar-1190:
  period: 1180
  label: "Barbarossa drunknar 1190"
  title: "Fredrik Barbarossa drunknar 1190"
  wiki:
    - "sv:Fredrik I Barbarossa"
    - "en:Frederick Barbarossa"
  text: |
    **[Fredrik I Barbarossa](#fredrik-i-barbarossa-1152)** (”rödskägg”, ca 1122–1190) var tysk-romersk kejsare 1155–1190 och ur släkten Hohenstaufen. Det tysk-romerska riket omfattade Tyskland, norra Italien och mer; kejsaren var vald av furstarna och försökte ständigt hävda sig mot påven och de rika norditalienska städerna. Barbarossa gjorde sex fälttåg till Italien men förlorade mot städernas förbund vid [Legnano 1176](#barbarossa-forlorar-vid-legnano-1176).

    1189 ledde han, nära 70 år gammal, den tyska delen av [tredje korståget](#tredje-korstaget-118992), uppskattningsvis 12 000–20 000 man (äldre uppgifter om 100 000 är överdrivna). Han tog sig genom Bysans och vann mot seldjukerna vid Konya. Den 10 juni 1190 drunknade han i floden Saleph i dagens Turkiet, kanske vid ett försök att ta sig över.

    Armén föll då sönder; bara en liten del nådde Akko. Barbarossa blev senare en nationalmyt: enligt legenden sover han i berget Kyffhäuser och ska vakna när Tyskland behöver honom. Nazityskland döpte invasionen av Sovjetunionen 1941 efter honom.

henrik-vi-far-sicilien:
  period: 1180
  label: "Henrik VI får Sicilien"
  title: "Henrik VI får Sicilien"
  wiki:
    - "en:Henry VI, Holy Roman Emperor"
    - "en:Kingdom of Sicily"
  text: |
    **Henrik VI** (1165–1197) var [Fredrik Barbarossas](#fredrik-i-barbarossa-1152) son och tysk-romersk kejsare 1191–1197. Han var gift med Konstantia, arvtagerska till det normandiska **[kungariket Sicilien](#roger-ii-normandiska-kungariket-sicilien)**, som omfattade Sicilien och hela södra Italien. Det riket hade grundats av normandiska äventyrare på 1000-talet och var ett av Europas rikaste, med blandad grekisk, arabisk och latinsk kultur.

    När den siste normandiske kungen dog 1189 valde sicilianarna en annan kandidat, Tankred. Henrik misslyckades med en första invasion 1191, men med lösensumman för Rikard Lejonhjärta (se ”[fången i Österrike](#fangen-i-osterrike)”) kunde han finansiera en ny och kröntes i Palermo julen 1194.

    Nu omringades påvens kyrkostat av kejsarmakt både i norr och söder, vilket påvarna såg som ett hot mot sin självständighet. Henrik dog redan 1197, 32 år gammal. Hans son [Fredrik II](#fredrik-ii) (se denna) växte upp på Sicilien, och kampen mellan påve och Hohenstaufen om Italien präglade 1200-talet.

fredrik-ii:
  period: 1200
  label: "Fredrik II"
  title: "Kejsar Fredrik II"
  wiki:
    - "sv:Fredrik II (tysk-romersk kejsare)"
    - "en:Frederick II, Holy Roman Emperor"
  text: |
    **Fredrik II** (1194–1250) var son till [Henrik VI](#henrik-vi-far-sicilien) och barnbarn till [Barbarossa](#fredrik-i-barbarossa-1152), kung av Sicilien från 1198 och tysk-romersk kejsare 1220–1250. Han växte upp i Palermo, en stad med arabisk, grekisk och latinsk kultur, och talade enligt uppgift flera språk, däribland arabiska. Samtida kallade honom *stupor mundi*, ”världens förundran”.

    Han förknippas med tre saker: hans korståg 1228–29 då han förhandlade sig till Jerusalem utan strid (se ”[Fredrik II:s korståg](#fredrik-ii-s-korstag-1228)”); den ständiga konflikten med påvarna, som bannlyste honom flera gånger och kallade honom Antikrist; och hans intellektuella hov, där han grundade universitetet i Neapel 1224, skrev en bok om falkjakt och lät utföra naturvetenskapliga experiment.

    Han styrde främst från Sicilien och gav de tyska furstarna stora friheter för att få deras stöd. Det bidrog till att Tyskland förblev splittrat i hundratals småstater ända till 1871, medan Frankrike och England centraliserades. Efter hans död föll Hohenstaufen snabbt.

welfer-mot-hohenstaufen:
  period: 1200
  label: "welfer mot Hohenstaufen"
  title: "Welfer mot Hohenstaufen"
  wiki:
    - "en:Welf (family)"
    - "sv:Hohenstaufen"
    - "en:Guelphs and Ghibellines"
  text: |
    Det tysk-romerska rikets kungar valdes av de tyska furstarna, och under 1100–1200-talen slogs två släkter om kronan: **Hohenstaufen** (från Schwaben i sydväst) och **welferna** (från Bayern och Sachsen). I Italien blev striden ett partisystem: ghibelliner (kejsarvänliga, efter den staufiska borgen Waiblingen) mot guelfer (påvevänliga, efter ”Welf”). Dessa partinamn delade italienska städer i över hundra år.

    När [Henrik VI](#henrik-vi-far-sicilien) dog 1197 var hans son Fredrik bara tre år. Furstarna valde 1198 två kungar: Filip av Schwaben (Hohenstaufen) och welfen **Otto IV**. Tio års inbördeskrig följde. Filip mördades 1208, och Otto blev kejsare, men han bröt med påven, som då stödde unge [Fredrik II](#fredrik-ii).

    Det avgjordes vid [Bouvines 1214](#bouvines-1214) (se detta), där Otto förlorade. Fredrik II kröntes 1215 i Aachen. Striden visar varför Tyskland förblev svagt centraliserat: varje kung måste köpa furstarnas stöd med privilegier.

tyska-orden-till-preussen-1230:
  period: 1220
  label: "Tyska orden till Preussen 1230"
  title: "Tyska orden till Preussen 1230"
  wiki:
    - "sv:Tyska ordensstaten"
    - "en:Prussian Crusade"
  text: |
    **Prusserna** var ett baltiskt folk, släkt med letter och litauer, som bodde längs Östersjökusten i dagens nordöstra Polen och Kaliningrad. De var hedniska och hade motstått missionsförsök. Den polske hertigen Konrad av Masovien, vars land plundrades av prusserna, kallade omkring 1226 in **Tyska orden** (se ”[Tyska orden 1190](#tyska-orden-1190)”) och lovade dem land.

    Från 1230 erövrade orden Preussen i ett krig som pågick i över 50 år, till 1283, med två stora uppror. Prusserna dödades, underkuvades eller assimilerades; deras språk dog ut på 1700-talet. Tyska bosättare och städer som Thorn (Toruń), Kulm och Königsberg (grundat 1255, i dag Kaliningrad) etablerades.

    Det blev en ordensstat oberoende av Polen, något Konrad inte avsett. Konflikten mellan orden och Polen–Litauen pågick i 200 år. Namnet Preussen överfördes senare till den tyska stat som från Berlin enade Tyskland 1871. Efter 1945 delades området mellan Polen och Sovjetunionen och tyskarna fördrevs. Jämför med [Svärdsriddarna](#svardsriddarna) i Livland.

fredrik-ii-s-korstag-1228:
  period: 1220
  label: "Fredrik II:s korståg 1228"
  title: "Fredrik II:s korståg 1228–29"
  wiki:
    - "sv:Sjätte korståget"
    - "en:Sixth Crusade"
  text: |
    Kejsar **[Fredrik II](#fredrik-ii)** (se denna) hade lovat att ta korset redan 1215 men skjutit upp det. När han 1227 avbröt resan på grund av sjukdom bannlyste påven Gregorius IX honom. Fredrik reste ändå 1228 – som bannlyst korsfarare, en paradox: påven predikade samtidigt mot honom.

    Fredrik, som talade arabiska, förhandlade med ayyubidsultanen **al-Kamil** i Egypten (se ”[Ayyubider](#ayyubider)”), som hade egna konflikter med sina släktingar och ville undvika krig. Med en armé på bara några tusen man fick Fredrik genom avtalet i Jaffa 1229 Jerusalem, Betlehem och Nasaret för tio år, utan strid. Muslimerna behöll Klippdomen och al-Aqsamoskén.

    Det var mer än tredje och [femte korstågen](#femte-korstaget-mot-egypten-1217) åstadkommit med tiotusentals döda. Men både kristna och muslimska hardliners fördömde avtalet. Jerusalem förlorades igen 1244, när khwarezmiska legosoldater på flykt från mongolerna plundrade staden, och kom inte under kristet styre förrän britterna tog den 1917.

fredrik-ii-dor-1250:
  period: 1240
  label: "Fredrik II dör 1250"
  title: "Kejsar Fredrik II dör 1250"
  wiki:
    - "sv:Fredrik II (tysk-romersk kejsare)"
    - "en:Guelphs and Ghibellines"
  text: |
    **Fredrik II** (1194–1250) av Hohenstaufensläkten var tysk-romersk kejsare och kung av Sicilien. Det tysk-romerska riket var ett löst förbund av furstendömen och städer i dagens Tyskland, Österrike, Nederländerna, Schweiz och norra Italien, med en vald kung/kejsare. Fredrik regerade mest från Sicilien och södra Italien, där han grundade universitetet i Neapel (1224), skrev en bok om falkjakt och omgav sig med kristna, judiska och muslimska lärda. Samtiden kallade honom *stupor mundi*, ”världens under”.

    Hans liv dominerades av konflikten med påvarna. De fruktade att en kejsare som styrde både norra och södra Italien skulle klämma åt Kyrkostaten däremellan. Fredrik bannlystes flera gånger och påven förklarade honom avsatt 1245. Kriget i Italien mellan kejsarens anhängare (*ghibelliner*) och påvens (*guelfer*) pågick när han dog i december 1250.

    Efter hans död föll Hohenstaufens makt snabbt; hans sonson Konradins avrättning i Neapel 1268 utplånade släkten. I Tyskland följde ett interregnum utan erkänd kung (se ”[interregnum](#interregnum)”), och furstarna stärkte sin makt. Det bidrog till att Tyskland förblev splittrat i hundratals stater ända till 1871, medan Frankrike och England centraliserades.

interregnum:
  period: 1240
  label: "interregnum"
  title: "Det stora interregnumet i Tyskland 1250–1273"
  wiki:
    - "en:Great Interregnum"
    - "sv:Tysk-romerska riket"
  text: |
    *Interregnum* är latin för ”mellan regeringar” – en period utan erkänd härskare. I Tyskland avser det åren efter Fredrik II:s död 1250 (eller hans son Konrad IV:s död 1254) fram till valet av Rudolf av Habsburg 1273.

    Det tysk-romerska rikets kung valdes av rikets främsta furstar. Efter Hohenstaufensläktens fall kunde de inte enas. 1257 valdes två kungar samtidigt, båda utlänningar: **Rikard av Cornwall**, bror till Englands kung, och **Alfons X av Kastilien** (se ”[Alfonso X den vise](#alfonso-x-den-vise)”). Rikard besökte Tyskland bara några gånger; Alfons satte aldrig sin fot där. Rösterna hade i praktiken köpts.

    Under tiden tog furstar, biskopar och städer över kungens rättigheter: tullar, mynt, domstolar och borgar. Städerna slöt förbund för att skydda handeln, t.ex. Rhenska stadsförbundet 1254, och Hansan växte (se ”[Hansan växer](#hansan-vaxer)”). Interregnumet befäste ett mönster: kejsaren hade titel men begränsad makt, och de sju kurfurstar som valde honom (formaliserat i [Gyllene bullan 1356](#gyllene-bullan-1356)) föredrog svaga kandidater. Det gjorde Tyskland till ett lapptäcke av stater i flera hundra år – jämför med hur Frankrike under samma tid samlades under en stark kung.

rudolf-av-habsburg-1273:
  period: 1260
  label: "Rudolf av Habsburg 1273"
  title: "Rudolf av Habsburg väljs till kung 1273"
  wiki:
    - "sv:Rudolf I av Habsburg"
    - "sv:Huset Habsburg"
    - "en:Battle on the Marchfeld"
  text: |
    Efter interregnumet (se ”[interregnum](#interregnum)”) – omkring tjugo år utan en erkänd tysk kung – valde furstarna 1273 **Rudolf av Habsburg** (1218–1291). Han var en greve med gods i Schweiz och Elsass, 55 år gammal och relativt obetydlig. Det var just därför han valdes: furstarna ville ha en kung som inte hotade deras makt.

    Rudolf visade sig dock skicklig. Han angrep den mäktigaste fursten i riket, kung **Ottokar II av Böhmen**, som hade lagt beslag på Österrike under interregnumet. I slaget på **Marchfeld** 1278 (nära Wien), ett av medeltidens största ryttarslag med uppskattningsvis tiotusentals deltagare, dödades Ottokar. Rudolf gav Österrike till sina söner.

    Det blev grunden för **Habsburgs** makt. Släkten styrde Österrike i över 600 år, till 1918. Den innehade den tysk-romerska kejsartiteln nästan oavbrutet 1438–1806 och kom under 1500-talet att genom giftermål styra Spanien, Nederländerna och stora delar av Amerika (Karl V). En liten greve från Schweiz blev alltså stamfar till en av Europas mäktigaste dynastier.

schweiziska-edsforbundet-1291:
  period: 1280
  label: "Schweiziska edsförbundet 1291"
  title: "Schweiziska edsförbundet 1291"
  wiki:
    - "en:Old Swiss Confederacy"
    - "en:Federal Charter of 1291"
  text: |
    I augusti 1291 slöt de tre alpdalarna (”kantonerna”) **Uri, Schwyz och Unterwalden** ett förbund där de lovade att hjälpa varandra mot yttre fiender. Förbundsbrevet från 1291 finns bevarat. Hotet var främst ätten **Habsburg**, som ägde stora områden i trakten och ville styra dalarna direkt. Bakgrunden var också ekonomisk: passet över Sankt Gotthard hade öppnats för handel mellan Italien och Nordeuropa, vilket gjorde dalarna värdefulla.

    Bönderna i bergen visade sig vara skickliga soldater. Vid Morgarten 1315 och Sempach 1386 besegrade de habsburgska riddarhärar. Fler städer och områden anslöt sig, till exempel Luzern, Zürich och Bern, och förbundet blev i praktiken självständigt från det tysk-romerska riket långt innan det erkändes formellt 1648.

    Detta är ursprunget till dagens Schweiz, och 1 augusti är fortfarande nationaldag. Legenden om **Wilhelm Tell** hör till samma tid men är troligen påhittad. Schweiziska pikenerare – fotsoldater med långa spjut – blev senare Europas mest eftertraktade legosoldater; därför har påven än idag en schweizergarde.

henrik-vii:
  period: 1300
  label: "Henrik VII"
  title: "Henrik VII, tysk-romersk kejsare (1308–1313)"
  wiki:
    - "en:Henry VII, Holy Roman Emperor"
  text: |
    **Henrik VII** av Luxemburg valdes 1308 till tysk kung. Det tysk-romerska riket – ett löst förbund av furstendömen, städer och biskopsdömen i Tyskland, Österrike, Tjeckien och delar av Italien – hade ingen ärftlig kung. Kungen valdes av de främsta furstarna, och de valde gärna en svag kandidat. Henrik var en mindre greve.

    Han är känd för att han försökte återupprätta kejsarmakten i Italien. Ingen tysk kung hade krönts till kejsare i Rom sedan 1220. Henrik tågade över Alperna 1310 med en liten här och kröntes 1312 i Rom. Hans försök att stoppa striderna mellan italienska städer misslyckades, och han dog 1313 i malaria under ett fälttåg. Dante ([se 1300](#dante-divina-commedia)) hade sett honom som Italiens räddare och gav honom en hedersplats i Paradiset i *Divina Commedia*.

    Hans viktigaste arv var dynastiskt: han skaffade sin son kungariket Böhmen. Därmed blev ätten Luxemburg en av rikets ledande familjer, och hans sonson Karl IV blev kejsare och utfärdade Gyllene bullan 1356 ([se det](#gyllene-bullan-1356)).

ludvig-av-bayern-mot-paven:
  period: 1320
  label: "Ludvig av Bayern mot påven"
  title: "Ludvig av Bayern mot påven"
  wiki:
    - "en:Louis IV, Holy Roman Emperor"
    - "en:Defensor pacis"
  text: |
    **Ludvig IV av Bayern** (från ätten Wittelsbach) valdes 1314 till tysk kung, men en rival, Fredrik av Habsburg, valdes samtidigt. Efter att ha besegrat Fredrik 1322 vägrade påven **Johannes XXII** i Avignon att erkänna honom. Påven menade att ingen fick bli kung i det tysk-romerska riket utan påvens godkännande, och bannlyste Ludvig 1324.

    Ludvig svarade med att tåga till Rom och låta kröna sig till kejsare 1328 av Roms folk – utan påve – och lät till och med utse en motpåve. Han fick stöd av lärda kritiker av påvemakten, som **Marsilius av Padua**, som i boken *Defensor pacis* (1324) hävdade att statens makt kommer från folket och att kyrkan inte har någon världslig makt, och den engelske filosofen **William av Ockham** (känd för ”Ockhams rakkniv”).

    1338 förklarade de tyska kurfurstarna (de furstar som valde kungen) i Rhens att den som de valt var kung utan påvens godkännande. Det var ett viktigt steg i att skilja statens makt från kyrkans – en tanke som 200 år senare blev central i reformationen. Gyllene bullan 1356 ([se det](#gyllene-bullan-1356)) skrev in valregeln i lag.

digerdoden-judeforfoljelser:
  period: 1340
  label: "Digerdöden, judeförföljelser"
  title: "Digerdöden och judeförföljelserna i Tyskland"
  wiki:
    - "en:Black Death persecutions"
    - "en:Strasbourg massacre"
  text: |
    När **digerdöden** – den pestepidemi som 1347–1351 dödade uppskattningsvis en tredjedel av Europas befolkning – spred sig behövde människor en förklaring. Ingen visste att den spreds via loppor och bakterier. Ett rykte spred sig från södra Frankrike och Schweiz: att judarna hade förgiftat brunnarna. Under tortyr ”erkände” några judar i Savojen 1348, och erkännandena skickades vidare mellan städer.

    1348–1351 utplånades judiska samhällen i hundratals städer, främst i det tysk-romerska riket. I **Strasbourg** brändes uppskattningsvis 2 000 judar i februari 1349 – innan pesten ens nått staden. Liknande massakrer skedde i Basel, Köln, Mainz, Frankfurt, Erfurt och många andra städer. Ofta låg ekonomiska motiv bakom: de som var skyldiga judiska långivare pengar blev av med skulderna. Påven Klemens VI påpekade att judar dog av pesten lika mycket som kristna, men det hjälpte inte.

    Många överlevande flydde österut till Polen, där kung Kasimir III tog emot dem. Det är en viktig orsak till att Östeuropa blev centrum för europeisk judendom fram till Förintelsen. Förföljelserna är ett tidigt och fruktansvärt exempel på syndabocksjakt under en kris.

    Förföljelserna återkom: jämför med [pogromerna 1391](#pogromer-1391).

gyllene-bullan-1356:
  period: 1340
  label: "Gyllene bullan 1356"
  title: "Gyllene bullan 1356"
  wiki:
    - "sv:Gyllene bullan"
    - "en:Golden Bull of 1356"
  text: |
    **Gyllene bullan** var en grundlag för det tysk-romerska riket, utfärdad 1356 av kejsar **Karl IV** av ätten Luxemburg (sonson till Henrik VII, [se det](#henrik-vii)). Namnet kommer av det gyllene sigillet (*bulla* på latin) som hängde i dokumentet. Riket var ett löst förbund av hundratals furstendömen, städer och biskopsdömen i Tyskland, Österrike, Tjeckien och angränsande områden, där kungen valdes.

    Tidigare hade kungaval ofta lett till dubbelval och inbördeskrig, och påven hade gjort anspråk på att godkänna den valde ([se Ludvig av Bayern](#ludvig-av-bayern-mot-paven)). Gyllene bullan fastställde exakt vilka sju **kurfurstar** (”valfurstar”) som fick välja kungen: ärkebiskoparna av Mainz, Köln och Trier, kungen av Böhmen, pfalzgreven vid Rhen, hertigen av Sachsen och markgreven av Brandenburg. Majoritet räckte, och valet skedde i Frankfurt. Påven nämndes inte alls.

    Systemet gällde i stort sett till rikets upplösning 1806 – nästan 450 år. Det stärkte kurfurstarna och gjorde Tyskland till ett lappverk av halvsjälvständiga stater i stället för en centraliserad stat som Frankrike eller England. Det är en av anledningarna till att Tyskland enades först 1871.

hansan-stralsundsfreden-1370:
  period: 1360
  label: "Hansan: Stralsundsfreden 1370"
  title: "Stralsundsfreden 1370"
  wiki:
    - "sv:Freden i Stralsund"
    - "sv:Hansan"
  text: |
    **Hansan** var ett förbund av nordtyska handelsstäder, med Lübeck i centrum, som från 1200-talet dominerade handeln i Östersjön och Nordsjön. Hanseköpmän hade kontor från London till Novgorod och Bergen, och kontrollerade handeln med sill, spannmål, pälsar, salt och tyg. I perioder var omkring 70 städer aktiva medlemmar och ännu fler lösare anslutna. Många svenska städer, särskilt Visby och Stockholm, hade starkt tyskt inflytande.

    Den danske kungen **Valdemar Atterdag** hotade Hansans intressen: han tog Skåne, där det stora sillfisket och de viktiga Skånemarknaderna fanns, och [plundrade Visby 1361](#valdemar-atterdag-tar-visby-1361). Hansestäderna gick 1367 samman i den s.k. Kölnkonfederationen, allierade sig med bl.a. [kung Albrekt av Sverige](#albrekt-av-mecklenburg), och förde krig mot Danmark. De härjade de danska kusterna och tog Köpenhamn.

    I freden i **Stralsund** 1370 fick Hansan handelsfrihet, låga tullar och kontroll över fästningarna längs Skånes kust i 15 år, samt rätt att godkänna nästa danske kung. Det var Hansans maktmässiga höjdpunkt – ett handelsförbund av städer som tvingade ett kungarike på knä. Hansan försvagades först på 1500-talet när starkare stater, nya handelsvägar över Atlanten och holländsk konkurrens tog över.

furstar-och-stader:
  period: 1380
  label: "Furstar och städer"
  title: "Furstar och städer i Tyskland, 1380-talet"
  wiki:
    - "sv:Tysk-romerska riket"
    - "en:Swabian League of Cities"
    - "sv:Gyllene bullan"
  text: |
    Det **tysk-romerska riket** var inte en stat i modern mening utan en lös sammanslutning av hundratals mer eller mindre självständiga enheter: furstendömen, biskopsdömen, riddargods och fria städer. Kejsaren valdes, och sedan **[Gyllene bullan](#gyllene-bullan-1356)** 1356 – en slags grundlag – gjordes valet av sju furstar, s.k. kurfurstar. Kejsarens egen makt var svag; han hade varken stående armé eller rikstäckande skatter.

    Under 1300-talet växte städerna i rikedom av handel och hantverk. Städer i södra Tyskland gick samman i förbund, t.ex. det **schwabiska stadsförbundet** (1376), för att försvara sig mot furstar och riddare som ville beskatta eller underlägga dem. Konflikten blev öppet krig: 1388 besegrades städerna vid Döffingen av greven av Württemberg, och kung Wenzel förbjöd 1389 stadsförbunden.

    Utfallet var viktigt på lång sikt. I England och Frankrike blev kungamakten starkare och landet enades kring den. I Tyskland vann i stället **furstarna**, och landet förblev splittrat i hundratals småstater ända till 1871. I norr kunde dock Hansan fortsätta som en självständig makt ([se Stralsundsfreden 1370](#hansan-stralsundsfreden-1370)).

jan-hus-branns-i-konstanz-1415:
  period: 1400
  label: "Jan Hus bränns i Konstanz 1415"
  title: "Jan Hus bränns 1415"
  wiki:
    - "sv:Jan Hus"
    - "sv:Konciliet i Konstanz"
  text: |
    **Jan Hus** (ca 1370–1415) var präst och rektor för universitetet i Prag i **Böhmen** (ungefär dagens Tjeckien), då en del av det tysk-romerska riket. Han predikade på tjeckiska och var inspirerad av engelsmannen [John Wycliffe](#wycliffe-bibeln): han kritiserade kyrkans rikedom, försäljningen av *avlat* (brev som påstods förkorta straffet i skärselden mot betalning) och hävdade att Bibeln stod över påven.

    Hus kallades till **kyrkomötet i Konstanz** ([se Konstanzkonciliet](#konstanzkonciliet-avslutar-schismen-1417)) för att försvara sina åsikter. Kejsar Sigismund gav honom ett skyddsbrev som lovade fri lejd. Men väl där arresterades han, och när han vägrade ta tillbaka sina läror dömdes han som kättare och brändes på bål den 6 juli 1415. Löftesbrottet väckte stor vrede i Böhmen.

    Hans död utlöste hussitkrigen ([se nästa punkt](#hussitkrigen-1419)). Hus ses som en föregångare till reformationen: när [Martin Luther 1519](#luther-95-teser-1517) anklagades för att vara ”[hussit](#hussitkrigen-1419)” svarade han att han kanske var det. Hus blev också en tjeckisk nationalsymbol, och 6 juli är fortfarande helgdag i Tjeckien. Han bidrog dessutom till det tjeckiska skriftspråket, bl.a. med de diakritiska tecken (som č och š) som fortfarande används.

hussitkrigen-1419:
  period: 1400
  label: "hussitkrigen 1419"
  title: "Hussitkrigen 1419–1434"
  wiki:
    - "sv:Hussitkrigen"
    - "sv:Jan Žižka"
  text: |
    Efter att **[Jan Hus](#jan-hus-branns-i-konstanz-1415)** bränts som kättare 1415 gjorde hans anhängare, **hussiterna**, uppror i Böhmen. 1419 stormade en folkmassa rådhuset i Prag och kastade ut rådsherrar genom fönstret – ”den första defenestrationen i Prag”. När kung Wenzel dog samma år och hans bror kejsar Sigismund, som anklagades för Hus död, skulle ärva tronen, blev det krig.

    Påven utlyste fem korståg mot hussiterna mellan 1420 och 1431, med arméer från hela Tyskland. Alla besegrades. Hussitledaren **Jan Žižka**, en enögd (senare helt blind) lågadlig veteran, byggde en armé av bönder och stadsbor och uppfann en ny taktik: **vagnborgar** – stridsvagnar av förstärkta lastvagnar som kedjades ihop till en mobil fästning, med **handeldvapen** och små kanoner. Det var ett av de första krigen där krutvapen användes systematiskt av fotfolk. Det tjeckiska ordet *píšťala* (”pipa”) för ett sådant vapen kan vara ursprunget till ordet pistol.

    Kriget slutade 1434 när moderata hussiter besegrade radikala, och 1436 fick böhmarna rätt att ta nattvarden med både bröd och vin. Böhmen förblev religiöst självständigt in i reformationstiden, ett hundra år före Luther.

hussitkrigen:
  period: 1420
  label: "Hussitkrigen"
  title: "Hussitkrigen 1419–1434"
  wiki:
    - "sv:Hussitkrigen"
    - "sv:Jan Hus"
  text: |
    **Jan Hus** var en präst och universitetslärare i Prag som kritiserade kyrkans rikedom och avlatshandeln (att man kunde köpa sig förlåtelse för synder). Han kallades till [kyrkomötet i Konstanz](#konstanzkonciliet-avslutar-schismen-1417) med löfte om fri lejd, men [brändes ändå som kättare 1415](#jan-hus-branns-i-konstanz-1415). I Böhmen (dagens Tjeckien) blev han martyr, och hans anhängare, **hussiterna**, gjorde uppror.

    Påven och kejsaren Sigismund skickade fem korståg mot Böhmen 1420–1431, ofta med arméer på tiotusentals man. Alla slogs tillbaka. Hussiternas ledare **Jan Žižka** använde en ny taktik: vagnborgar – ringar av sammankedjade stridsvagnar (hästdragna kärror) med kanoner och tidiga handeldvapen. Ordet *pistol* kommer troligen från hussiternas tjeckiska ord *píšťala* (”pipa”). Det var ett av de första krigen där krut spelade en avgörande roll i fältslag.

    Till slut splittrades hussiterna själva: 1434 besegrade de moderata de radikala vid Lipany. 1436 fick de moderata viktiga eftergifter, bland annat rätten att ta nattvardsvinet.

    Hussiterna var en föregångare till **reformationen**: när [Luther 100 år senare (1517)](#luther-95-teser-1517) protesterade mot avlaten anklagades han för att vara ”en ny Hus”.

gutenberg-tryckpress-1450-bibeln-1455:
  period: 1440
  label: "Gutenberg: tryckpress ~1450, Bibeln 1455"
  title: "Gutenbergs tryckpress och Bibel"
  wiki:
    - "sv:Johannes Gutenberg"
    - "sv:Gutenbergbibeln"
    - "sv:Boktryckarkonst"
  text: |
    **Johannes Gutenberg** (cirka 1400–1468) var guldsmed i Mainz. Omkring 1450 hade han utvecklat ett komplett system för tryck med **lösa metalltyper**: enskilda bokstäver gjutna i en legering av bly, tenn och antimon, som kunde sättas ihop till sidor, tryckas och sedan återanvändas.

    Den viktigaste uppfinningen var **gjutinstrumentet**, som snabbt kunde massproducera identiska bokstäver – det var standardiserade, utbytbara delar, en tidig form av industriell produktion. Därtill en oljebaserad trycksvärta som fäste på metall och en tryckpress byggd efter vinpressar.

    Lösa typer fanns redan i Kina ([Bi Sheng, cirka 1040](#bi-sheng-losa-typer-1040), med lertyper) och i Korea, där en bok trycktes med metalltyper 1377. Men med tusentals kinesiska tecken var fördelen liten; med ett alfabet på några dussin tecken var den enorm.

    Gutenbergbibeln blev klar omkring 1455, i uppskattningsvis 160–180 exemplar, varav cirka 49 finns kvar. Att skriva av en bibel för hand tog en skrivare ungefär ett år till kostnad av flera årslöner. Gutenberg själv tjänade dåligt; hans finansiär **Johann Fust** tog över verkstaden efter en rättstvist. Se även [Boktryck sprider kunskap snabbt](#boktryck-sprider-kunskap-snabbt).

tryckerier-i-alla-storre-stader:
  period: 1460
  label: "Tryckerier i alla större städer"
  title: "Boktrycket sprids över Europa"
  wiki:
    - "sv:Boktryckarkonst"
    - "sv:Inkunabel"
    - "en:Aldus Manutius"
  text: |
    Gutenberg tryckte sin bibel i Mainz omkring 1455 ([se Gutenberg](#gutenberg-tryckpress-1450-bibeln-1455)). Tekniken var först en hemlighet, men när Mainz plundrades 1462 under en strid mellan två ärkebiskopar flydde tryckarna och tog kunskapen med sig.

    Spridningen gick därefter mycket snabbt, särskilt längs handelsvägarna. Tryckerier startades i Köln (1464), Rom och Subiaco (1465), Basel (cirka 1468), Venedig (1469), Paris (1470), Nürnberg och Utrecht. 1480 fanns det tryckerier i över 100 städer, 1500 i uppskattningsvis 250. Tyskland och Italien låg i topp.

    **Venedig** blev världens tryckcentrum med flera hundra tryckare före 1500. Förläggaren **Aldus Manutius** införde där omkring 1500 kursivstil och små böcker i fickformat – billiga, bärbara böcker för studenter, ungefär som pocketböcker. I Nürnberg trycktes 1493 den rikt illustrerade *Nürnbergkrönikan* i över 1 000 exemplar.

    Tryckeriet blev ett nytt slags företag: kapitalkrävande (pressar, papper och metall), med marknadsföring, förlagskataloger och tidiga upphovsrättsliknande privilegier. Det är en av de första branscherna som påminner om modern industri.

maximilian-i:
  period: 1480
  label: "Maximilian I"
  title: "Maximilian I av Habsburg"
  wiki:
    - "en:Maximilian I, Holy Roman Emperor"
    - "en:House of Habsburg"
  text: |
    Det tysk-romerska riket var ett löst förbund av hundratals tyska furstendömen, kyrkliga områden och fria städer, med en vald kejsare överst. Sedan 1438 valdes nästan alltid kejsaren från ätten **Habsburg** i Österrike.

    **Maximilian I** (tysk kung 1486, kejsare 1508–1519) är mest känd för sin äktenskapspolitik. Han gifte sig 1477 med Maria av Burgund och fick därmed de rika Nederländerna. Hans son Filip gifte sig med Johanna av Kastilien, arvtagare till Spanien. Resultatet blev att Maximilians sonson [Karl V](#karl-v-habsburg-1516) ärvde nästan halva Europa plus de spanska kolonierna. Ett känt talesätt löd: ”Låt andra föra krig – du, lyckliga Österrike, gifter dig.”

    Maximilian försökte också modernisera riket: på riksdagen i Worms 1495 förbjöds privata fejder och en gemensam domstol inrättades. Han lät familjen Taxis bygga ett postsystem med ridande kurirer i stafett mellan Innsbruck och Bryssel – början på den europeiska posten. Han skapade också landsknektarna, tyska yrkessoldater med långa pikar.

behaims-glob-1492:
  period: 1480
  label: "Behaims glob 1492"
  title: "Behaims glob 1492"
  wiki:
    - "en:Erdapfel"
    - "en:Martin Behaim"
  text: |
    Världens äldsta bevarade jordglob tillverkades 1490–1492 i Nürnberg under ledning av köpmannen och navigatören **Martin Behaim**, som hade varit i portugisisk tjänst. Den kallas *Erdapfel* (”jordäpplet”), är cirka 51 cm i diameter och finns i dag på Germanisches Nationalmuseum i Nürnberg.

    Det intressanta är vad den visar: den gjordes precis innan [Columbus kom tillbaka](#columbus-1492) från sin första resa. Där finns alltså ingen Amerika. Atlanten är ett öppet hav mellan Europa och Asien, och Japan (”Cipangu”) ligger ungefär där Mexiko faktiskt ligger. Kartan byggde på den antike geografen Ptolemaios, [Marco Polos reseskildringar](#marco-polo) och portugisiska upptäckter längs Afrika.

    Behaim gjorde samma misstag som Columbus: jorden för liten och Asien för stort. Med de siffrorna verkade en resa västerut till Asien rimlig. I verkligheten är det omkring 19 000 km från Kanarieöarna till Japan västerut – med Amerika och Stilla havet i vägen. Att bildade européer redan visste att jorden var rund är också något globen visar.

luther-95-teser-1517:
  period: 1500
  label: "Luther: 95 teser 1517"
  title: "Luthers 95 teser 1517"
  wiki:
    - "sv:Martin Luthers 95 teser"
    - "en:Martin Luther"
    - "en:Indulgence"
  text: |
    **Martin Luther** (1483–1546) var munk och teologiprofessor i Wittenberg i Sachsen. Han upprördes över **avlatshandeln**: kyrkan sålde brev som sades förkorta tiden i skärselden (ett tänkt reningsstadium efter döden) för en själv eller döda släktingar. Pengarna skulle bland annat finansiera Peterskyrkan i Rom. Säljaren Johann Tetzel påstods ha sagt: ”När pengen i kistan klingar, själen ur skärselden springer.”

    Den 31 oktober 1517 skickade Luther **95 teser** – påståenden för akademisk debatt – till sin ärkebiskop, och enligt traditionen spikade han upp dem på kyrkdörren i Wittenberg. Tack vare boktryckarkonsten ([se Gutenberg ~1450](#gutenbergs-tryckpress-1450)) spreds de över Tyskland på veckor. Luthers kärnidé blev att människan räddas av tro och Guds nåd, inte av goda gärningar eller köpta tjänster, och att Bibeln står över påven.

    Han bannlystes 1521, översatte Bibeln till tyska och fick stöd av furstar. Resultatet blev **reformationen**: västkyrkan splittrades i katoliker och protestanter. Den ledde till religionskrig, däribland [trettioåriga kriget 1618–48](#trettioariga-kriget-1618). Sverige blev [lutherskt under Gustav Vasa från 1527](#reformation-vasteras-1527).

fuggers-bankimperium:
  period: 1500
  label: "Fuggers bankimperium"
  title: "Fuggers bankimperium"
  wiki:
    - "en:Jakob Fugger"
    - "en:Fugger family"
    - "en:Fuggerei"
  text: |
    Familjen **Fugger** från Augsburg i södra Tyskland började som vävare och textilhandlare. Under **Jakob Fugger** (1459–1525), kallad ”den rike”, blev de Europas mäktigaste bankirer. Han lånade ut pengar till Habsburgarna och fick som säkerhet rätten till silver- och kopparbrytning i Tyrolen och Ungern. Under en period kontrollerade Fugger en stor del av Europas kopparproduktion.

    Hans mest kända affär var valet 1519. Den tysk-romerske kejsaren valdes av sju kurfurstar, och både [Karl av Habsburg](#karl-v-habsburg-1516) och [Frans I](#frans-i) av Frankrike försökte muta dem. Karl vann med hjälp av omkring 850 000 floriner, varav Fugger stod för cirka 540 000. Jakob skrev senare till kejsaren och påminde om att han inte hade blivit kejsare utan honom. Fugger förmedlade också pengarna från avlatshandeln [som Luther angrep](#luther-95-teser-1517).

    Jakob Fugger räknas ofta som en av de rikaste personerna i historien. Han byggde också **Fuggerei** (1516), ett bostadsområde för fattiga i Augsburg, som fortfarande finns – hyran är än i dag 0,88 euro om året. Familjen förlorade stort när Spanien gick i betalningsinställelse flera gånger efter 1557.

bondekriget-152425:
  period: 1520
  label: "Bondekriget 1524–25"
  title: "Tyska bondekriget 1524–25"
  wiki:
    - "en:German Peasants' War"
    - "en:Twelve Articles"
    - "en:Thomas Müntzer"
  text: |
    Det **tyska bondekriget** var det största folkupproret i Europa före franska revolutionen. Det började i sydvästra Tyskland sommaren 1524 och spred sig till Schwaben, Franken, Thüringen och Alperna. Uppskattningsvis 300 000 bönder deltog.

    Bakgrunden var ökande krav från godsägare och kloster: högre avgifter, mer dagsverken (obetalt arbete på herrgårdens mark) och inskränkt rätt att jaga, fiska och hugga ved i allmänningarna. [Luthers reformation](#luther-95-teser-1517) gav idéerna bränsle: om Bibeln stod över påven, varför skulle bönderna lyda herrar som inte hade stöd i Bibeln? I **De tolv artiklarna** (1525) krävde bönderna bland annat att livegenskapen skulle avskaffas och att församlingar själva fick välja präst. Radikale predikanten **Thomas Müntzer** gick längre och talade om att upprätta Guds rike med svärd.

    Luther tog avstånd och skrev skriften *Mot de mördande och rövande bondehoparna*. Furstarnas yrkesarméer slog ned upproret; uppskattningsvis 70 000–100 000 bönder dödades, och Müntzer avrättades. Lärdomen blev att den lutherska reformationen allierade sig med furstarna, inte med folket.

    Jämför med [Dackefejden 1542](#dackefejden-1542), ett bondeuppror i Sverige.

augsburgska-bekannelsen-1530:
  period: 1520
  label: "Augsburgska bekännelsen 1530"
  title: "Augsburgska bekännelsen 1530"
  wiki:
    - "sv:Augsburgska bekännelsen"
    - "en:Philip Melanchthon"
    - "sv:Uppsala möte"
  text: |
    Tretton år efter [Luthers 95 teser](#luther-95-teser-1517) kallade kejsar **[Karl V](#karl-v-habsburg-1516)** till en riksdag i Augsburg för att lösa religionsstriden i det tysk-romerska riket. De lutherska furstarna och städerna – kallade **protestanter** sedan de protesterat mot ett riksdagsbeslut 1529 – fick lägga fram vad de trodde på.

    Texten skrevs av Luthers medarbetare **Philipp Melanchthon**, eftersom Luther själv var bannlyst och inte kunde komma. Den 25 juni 1530 lästes den högt på tyska inför kejsaren. Den består av 28 artiklar och sammanfattar den lutherska läran: människan blir rättfärdig inför Gud genom tro, inte genom gärningar; präster får gifta sig; nattvarden ges med både bröd och vin till alla. Tonen var försonlig för att visa att lutheranerna inte var kättare.

    Kejsaren förkastade den, och de protestantiska furstarna bildade det militära Schmalkaldiska förbundet. Men **Augsburgska bekännelsen** blev den lutherska kyrkans viktigaste bekännelseskrift och gäller än i dag, bland annat i Svenska kyrkan, där den fastställdes vid [Uppsala möte 1593](#uppsala-mote-1593).

augsburgska-religionsfreden-1555:
  period: 1540
  label: "Augsburgska religionsfreden 1555"
  title: "Augsburgska religionsfreden 1555"
  wiki:
    - "sv:Augsburgska religionsfreden"
    - "en:Peace of Augsburg"
  text: |
    Efter [Luthers reformation 1517](#luther-95-teser-1517) hade Tysk-romerska riket – ett lappverk av hundratals tyska furstendömen och fria städer under en vald kejsare – delats mellan lutherska och katolska furstar. Kejsar [Karl V](#karl-v-kejsare) försökte återställa enheten och besegrade till och med de protestantiska furstarna militärt 1547, men kunde inte genomdriva katolicismen.

    Freden i Augsburg 1555 löste frågan med principen som senare formulerades *cuius regio, eius religio* – ”den som styr landet bestämmer dess religion”. Varje furste valde katolicism eller lutherdom för sitt område; undersåtar som inte ville följa fick rätt att flytta. Kalvinister omfattades inte alls.

    Freden gav Tyskland drygt 60 år av relativt lugn. Men den var bräcklig: kalvinismen spreds ändå, och tvister om kyrkogods och biskopsdömen växte. 1618 brast det i [trettioåriga kriget](#trettioariga-kriget-1618) (Sverige gick in 1630), som dödade uppskattningsvis en fjärdedel till en tredjedel av Tysklands befolkning. [Westfaliska freden 1648](#westfaliska-freden-1648) bekräftade principen men lade till kalvinismen.

motreformation:
  period: 1560
  label: "Motreformation"
  title: "Motreformationen i Tyskland"
  wiki:
    - "sv:Motreformationen"
    - "en:Counter-Reformation"
  text: |
    Med **motreformationen** (eller den katolska reformen) menas katolska kyrkans svar på den protestantiska reformationen, ungefär 1545–1650. Grunden lades av Tridentinska mötet (1545–1563), som slog fast den katolska läran och skärpte disciplinen bland präster (se [tridentinska mötet, jesuiter](#tridentinska-motet-jesuiter)).

    I Tyskland var läget efter [Augsburgska religionsfreden 1555](#augsburgska-religionsfreden-1555) att varje furste bestämde religion för sitt område. Omkring 1560 var kanske 70 % av Tysklands befolkning protestanter. Under de följande decennierna vände trenden i många områden: katolska furstar som hertigarna av Bayern och Habsburgarna i Österrike tvingade fram återkatolicering, och jesuiterna byggde skolor och universitet som Ingolstadt och Dillingen som utbildade en ny katolsk elit. Kyrkokonsten förändrades också: barocken, med sina pampiga och känslomässiga kyrkor, är motreformationens stil.

    Spänningarna mellan de två lägren växte, och båda bildade militära förbund 1608–09. 1618 utbröt [trettioåriga kriget](#trettioariga-kriget-1618). Södra Tyskland och Österrike förblev katolska, norra Tyskland lutherskt – en uppdelning som syns än idag.

haxprocesser:
  period: 1580
  label: "Häxprocesser"
  title: "Häxprocesserna (~1560–1660)"
  wiki:
    - "en:Witch trials in the early modern period"
    - "sv:Häxprocesserna i Sverige"
  text: |
    **Häxprocesser** var rättegångar mot människor, oftast kvinnor, anklagade för att genom en pakt med djävulen skada grannar, boskap eller skördar. Idén om häxan som djävulens medbrottsling spreds genom bland annat handboken *Malleus Maleficarum* (1486). Toppen kom 1560–1660 – alltså inte under medeltiden utan under den tid då vetenskapen började växa fram.

    Uppskattningsvis 40 000–60 000 människor avrättades i Europa, ungefär hälften i det splittrade Tysk-romerska riket. Där fanns hundratals små furstendömen och biskopsdömen utan stark central kontroll, och lokala domstolar kunde använda tortyr fritt: den torterade pressades att ange ”medbrottslingar”, vilket gjorde att processerna spreds som kedjereaktioner. I Würzburg och Bamberg avrättades enbart på 1620-talet ett par tusen personer.

    Orsakerna anses vara en blandning av [religiös oro efter reformationen](#luther-95-teser-1517), krig, missväxter under ”lilla istiden” (en kall klimatperiod) och grannkonflikter. I Sverige kom en våg senare, under ”Det stora oväsendet” 1668–1676, med omkring 300 avrättade. Processerna ebbade ut när domare började kräva bättre bevis.

    Jämför med häxprocessen i Nordamerika: [Salem 1692](#salem-1692).

trettioariga-kriget-1618:
  period: 1600
  label: "Trettioåriga kriget 1618"
  title: "Trettioåriga kriget börjar 1618"
  wiki:
    - "sv:Trettioåriga kriget"
    - "en:Defenestrations of Prague"
  text: |
    **Trettioåriga kriget** (1618–1648) började i Böhmen (dagens Tjeckien). De protestantiska böhmiska ständerna gjorde uppror mot sin katolske kung från huset Habsburg, den dynasti som också innehade titeln tysk-romersk kejsare. Upproret startade med **defenestrationen i Prag** 1618, då två kejserliga ståthållare och en sekreterare kastades ut genom ett fönster (de överlevde, enligt legenden tack vare en gödselhög).

    Det som började som en religiös och lokal konflikt växte till ett europeiskt maktkrig. Danmark gick in 1625, Sverige under [Gustav II Adolf](#gustav-ii-adolf-1611) 1630 (se [Breitenfeld 1631](#breitenfeld-1631-lutzen-1632)), och 1635 det katolska Frankrike – på protestanternas sida, mot Habsburg. Det visar att maktpolitik vägde tyngre än religion.

    Kriget utkämpades främst i Tyskland och var ett av de mest förödande i Europas historia. Uppskattningsvis 4–8 miljoner dog, mest av svält och farsoter; Tysklands befolkning minskade med kanske 20–30 procent, i vissa områden med över hälften – proportionellt värre än första världskriget. [Westfaliska freden 1648](#westfaliska-freden-1648) gav Sverige stora landområden och grundlade idén om suveräna stater som inte blandar sig i varandras inre angelägenheter.

kepler-planetlagarna-1609:
  period: 1600
  label: "Kepler: planetlagarna 1609"
  title: "Keplers planetlagar 1609"
  wiki:
    - "sv:Keplers lagar"
    - "sv:Johannes Kepler"
  text: |
    **Johannes Kepler** (1571–1630) var en tysk matematiker och astronom, assistent och efterträdare till Tycho Brahe i Prag. [Kopernikus](#kopernikus-1543) hade 1543 föreslagit att planeterna går runt solen, men i cirkelbanor, och hans modell stämde inte bättre med mätningarna än den gamla jordcentrerade.

    Kepler använde Tychos mycket noggranna mätningar av Mars (se [Uraniborg](#tycho-brahe-pa-ven-uraniborg)). Efter åratal av räknande fann han att den bästa cirkelbanan avvek med 8 bågminuter – ett fel som Tychos data var för exakta för att tillåta. I *Astronomia nova* 1609 publicerade han två lagar: (1) planeterna rör sig i ellipser med solen i en brännpunkt; (2) en linje från solen till planeten sveper över lika stora ytor på lika lång tid – planeten går fortare nära solen. Den tredje lagen (1619) säger att omloppstiden i kvadrat är proportionell mot medelavståndet i kub.

    Det var ett av de första exemplen på att en naturlag i modern mening formulerades ur mätdata. [Newton visade 1687](#newton-principia-1687) att alla tre lagarna följer av hans gravitationslag. Keplers lagar används fortfarande för att beräkna satellitbanor.

breitenfeld-1631-lutzen-1632:
  period: 1620
  label: "Breitenfeld 1631, Lützen 1632"
  title: "Breitenfeld 1631 och Lützen 1632"
  wiki:
    - "sv:Slaget vid Breitenfeld (1631)"
    - "sv:Slaget vid Lützen (1632)"
  text: |
    1630 landsteg **[Gustav II Adolf](#gustav-ii-adolf-1611)** med omkring 13 000 man i Pommern och gick in i trettioåriga kriget ([se 1618](#trettioariga-kriget-1618)). Han ville skydda protestanterna, men framför allt göra Östersjön svensk och hindra den katolske kejsaren att nå kusten. Frankrike betalade en del av kostnaderna ([se Richelieu](#richelieu)).

    Vid **Breitenfeld** nära Leipzig i september 1631 mötte den svensk-sachsiska armén, cirka 40 000 man, den kejserliga armén under Tilly, omkring 35 000 man. Saxarna flydde, men svenskarna höll stånd tack vare sin rörliga taktik med små enheter, snabba lätta kanoner och musketerare som sköt salvor. Det var protestanternas första stora seger och gjorde Sverige till en stormakt över en natt. Gustav Adolf marscherade sedan genom Tyskland ända till München.

    Vid **Lützen** i november 1632 mötte han Wallenstein, kejsarens främste fältherre, med cirka 19 000 man på varje sida. Svenskarna vann, men [kungen stupade i dimman](#gustav-ii-adolf-stupar-1632) under ett kavallerianfall, 37 år gammal. Hans död gjorde den sexåriga Kristina till drottning med Axel Oxenstierna som ledare. Sverige stannade i kriget till 1648 och fick vid freden Pommern, Wismar och Bremen-Verden. Gustav Adolfsdagen den 6 november firas än idag med bakelser.

westfaliska-freden-1648:
  period: 1640
  label: "Westfaliska freden 1648"
  title: "Westfaliska freden 1648"
  wiki:
    - "sv:Westfaliska freden"
    - "sv:Trettioåriga kriget"
  text: |
    **Westfaliska freden** avslutade 1648 **[trettioåriga kriget](#trettioariga-kriget-1618)** (1618–1648) i Tyskland och samtidigt det [åttioåriga kriget](#nederlandska-frihetskriget) mellan Spanien och Nederländerna. Förhandlingarna pågick i flera år i städerna Münster och Osnabrück i regionen Westfalen, med omkring 100 delegationer – en av de första stora fredskonferenserna.

    Kriget hade börjat som en religionskonflikt mellan katoliker och protestanter inom det **tysk-romerska riket** (ett löst förbund av hundratals tyska stater under en kejsare i Wien), men blev en maktkamp där Sverige, Frankrike, Spanien och Danmark deltog. Tyskland förlorade uppskattningsvis 20–40 procent av befolkningen genom strider, svält och pest – i vissa områden mer än hälften. Det är relativt sett jämförbart med andra världskriget.

    Freden slog fast att varje furste fick bestämma sitt lands religion (katolsk, luthersk eller reformert), att de tyska staterna i praktiken blev självständiga, och att Nederländerna och Schweiz var fria. Sverige fick Pommern med mera ([se separat punkt](#sverige-far-pommern-1648)). Freden ses ofta som ursprunget till idén om suveräna stater som inte blandar sig i varandras inre angelägenheter – det så kallade westfaliska systemet.

brandenburg-preussen-vaxer:
  period: 1680
  label: "Brandenburg-Preussen växer"
  title: "Brandenburg-Preussen växer"
  wiki:
    - "sv:Brandenburg-Preussen"
    - "sv:Fredrik Vilhelm I av Brandenburg"
  text: |
    **Brandenburg-Preussen** var ett utspritt furstendöme i norra Tyskland: Brandenburg runt Berlin, hertigdömet Preussen långt österut (vid dagens Kaliningrad) och spridda områden i väst. Det styrdes av släkten Hohenzollern. [Trettioåriga kriget](#trettioariga-kriget-1618) (1618–1648) hade ödelagt landet.

    **Fredrik Vilhelm**, kallad den store kurfursten (1640–1688), byggde upp staten igen. Han skapade en stående armé på uppskattningsvis 30 000 man, ett effektivt skattesystem och en centraliserad förvaltning. 1675 slog han svenskarna vid Fehrbellin, en uppmärksammad seger. Han tog emot [hugenottiska flyktingar från Frankrike 1685](#nantes-ediktet-upphavs-1685-hugenotter) för att få in yrkeskunnande.

    Detta lade grunden till [kungariket Preussen 1701](#preussen-kungarike-1701) (se det) och den militärstat som under 1700-talet blev en stormakt under [Fredrik den store](#fredrik-den-store). 1871 enade Preussen Tyskland. En del av vägen till det moderna Tyskland börjar alltså här.

preussen-kungarike-1701:
  period: 1700
  label: "Preussen kungarike 1701"
  title: "Preussen blir kungarike 1701"
  wiki:
    - "sv:Kungariket Preussen"
    - "sv:Fredrik I av Preussen"
  text: |
    1701 krönte kurfursten **Fredrik III** av Brandenburg sig själv till **Fredrik I, kung i Preussen**, i Königsberg (dagens Kaliningrad). Kurfurste betyder en av de furstar som valde det tysk-romerska rikets kejsare. Kungatiteln gällde Preussen eftersom det låg utanför det tysk-romerska riket, där bara kejsaren kunde vara kung. Kejsaren gick med på det i utbyte mot preussiska soldater i [spanska tronföljdskriget](#spanska-tronfoljdskriget).

    Titeln "i Preussen" i stället för "av Preussen" var en kompromiss, eftersom västra Preussen ännu tillhörde Polen. Fredrik I själv var mest känd för slöseri och prakt, men titeln gav Hohenzollern-släkten samma rang som andra kungahus.

    Sonen Fredrik Vilhelm I, "soldatkungen", byggde upp armén till uppskattningsvis 80 000 man – mycket för ett land med drygt 2 miljoner invånare. Sonsonen [Fredrik den store](#fredrik-den-store) (1740–1786) gjorde Preussen till stormakt. Ur detta kungarike enades Tyskland 1871 (se [Brandenburg-Preussen växer](#brandenburg-preussen-vaxer)).

bach:
  period: 1720
  label: "Bach"
  title: "Johann Sebastian Bach"
  wiki:
    - "sv:Johann Sebastian Bach"
  text: |
    **Johann Sebastian Bach** (1685–1750) var en tysk tonsättare och organist, kanske den mest inflytelserika i västerländsk musik. Han verkade i Tyskland hela livet, de sista 27 åren som kantor (musikansvarig) vid Thomaskyrkan i **Leipzig** från 1723. Där skrev han varje vecka nya kantater (verk för kör och orkester) till gudstjänsterna.

    Hans stil är **barock** – musik från cirka 1600–1750, med rika utsmyckningar och flera samtidiga melodistämmor (kontrapunkt). Kända verk: *Brandenburgkonserterna* (1721), *Das wohltemperierte Klavier* (1722 och 1742), som utforskar alla 24 tonarter, *Matteuspassionen* (1727) och Toccata och fuga i d-moll. Totalt finns över 1 000 verk bevarade.

    Han var mer känd som organist än tonsättare under sin livstid och ansågs gammalmodig. Musiken glömdes nästan bort tills Felix Mendelssohn framförde Matteuspassionen 1829. Hans fugor, med strikta regler för hur stämmor imiterar varandra, har fascinerat matematiker och datavetare, till exempel i boken *Gödel, Escher, Bach* (1979). Hans musik finns på Voyager-sondernas guldskivor.

    Jämför med [Vivaldi](#vivaldi), vars konserter Bach arrangerade.

fredrik-den-store:
  period: 1740
  label: "Fredrik den store"
  title: "Fredrik den store (kung av Preussen 1740–1786)"
  wiki:
    - "sv:Fredrik II av Preussen"
  text: |
    **Fredrik II** av Preussen, kallad den store, var kung 1740–1786. Preussen var ett nordtyskt kungarike med Berlin som huvudstad, utspritt i flera delar och med bara cirka 2,2 miljoner invånare 1740 – färre än dagens Stockholmsregion. Ändå byggde Fredrik upp en av Europas starkaste arméer, från ungefär 80 000 till nära 200 000 man.

    Han förknippas med tre saker: överfallet på Österrike 1740 då han tog den rika provinsen Schlesien (se [österrikiska tronföljdskriget](#osterrikiska-tronfoljdskriget)), **[sjuårskriget](#sjuarskriget-slut-1763)** 1756–1763 där Preussen med nöd och näppe överlevde mot Österrike, Frankrike, Ryssland och Sverige, samt idén om det *upplysta enväldet* – en kung med all makt som ändå säger sig styra förnuftigt för folkets bästa. Han avskaffade tortyr i förhör, införde religionstolerans, brevväxlade med filosofen [Voltaire](#voltaire) och spelade själv flöjt i slottet Sanssouci.

    Varför det spelar roll: Preussen blev under honom en stormakt jämbördig med Österrike. Rivaliteten mellan dem avgjordes först 1866, och det var Preussen som enade Tyskland 1871 – grunden till det tyska rike som sedan drev två världskrig.

osterrikiska-tronfoljdskriget:
  period: 1740
  label: "österrikiska tronföljdskriget"
  title: "Österrikiska tronföljdskriget 1740–1748"
  wiki:
    - "sv:Österrikiska tronföljdskriget"
    - "sv:Pragmatiska sanktionen"
  text: |
    Kejsar Karl VI av Habsburg dog 1740 utan söner. Habsburgarna var den släkt som styrde Österrike, Böhmen, Ungern och mycket mer. Karl hade i ett avtal, *pragmatiska sanktionen*, fått Europas furstar att lova att dottern **[Maria Teresia](#maria-teresia)** skulle få ärva allt. När han dog bröt flera av dem löftet.

    Först ut var [Fredrik II av Preussen](#fredrik-den-store), som i december 1740 marscherade in i Schlesien (dagens sydvästra Polen), en rik provins med ungefär en miljon invånare. Frankrike, Bayern och Spanien gick också mot Österrike, medan Storbritannien stödde Maria Teresia. Kriget utkämpades även i Nordamerika och Indien – ett tidigt exempel på att europeiska krig blev globala via kolonierna.

    Freden i Aachen 1748 lät Maria Teresia behålla tronen men Preussen fick behålla Schlesien. Ingen var nöjd, och bara åtta år senare bröt [sjuårskriget](#sjuarskriget-slut-1763) ut (1756–1763), i praktiken en returmatch. Kriget visar hur arvsregler för en enda familj kunde avgöra krig och fred för miljontals människor.

sjuarskriget-slut-1763:
  period: 1760
  label: "Sjuårskriget slut 1763"
  title: "Sjuårskrigets slut 1763"
  wiki:
    - "sv:Sjuårskriget"
    - "en:Treaty of Hubertusburg"
  text: |
    **Sjuårskriget** 1756–1763 var två krig i ett. I Europa försökte Österrike, Frankrike, Ryssland och Sverige krossa Preussen och [ta tillbaka Schlesien](#osterrikiska-tronfoljdskriget). Samtidigt slogs Storbritannien och Frankrike om kolonier i Nordamerika, Karibien, Västafrika och Indien. Därför har det kallats det första världskriget.

    Preussen under [Fredrik den store](#fredrik-den-store) var nära total kollaps; Berlin ockuperades kortvarigt två gånger. Räddningen kom 1762 när ryska kejsarinnan Elisabet dog och hennes efterträdare Peter III, en beundrare av Fredrik, bytte sida. Sverige, som deltog i det så kallade pommerska kriget, gjorde ingen vinst. Freden i Hubertusburg i februari 1763 återställde läget: Preussen behöll Schlesien. Uppskattningsvis omkring en miljon människor dog totalt, och Preussen förlorade kanske en tiondel av sin befolkning.

    Resultatet: Preussen var nu en erkänd stormakt, och Storbritannien blev världens ledande kolonialmakt (se [Parisfreden 1763](#parisfreden-1763-kanada-forloras)). Men alla stater hade enorma skulder, vilket ledde till skattekonflikter som utlöste både amerikanska och [franska revolutionen](#franska-revolutionen-1789).

kant:
  period: 1780
  label: "Kant"
  title: "Immanuel Kant (1724–1804)"
  wiki:
    - "sv:Immanuel Kant"
    - "sv:Kategoriska imperativet"
  text: |
    **Immanuel Kant** var filosof i Königsberg i Ostpreussen (i dag Kaliningrad i Ryssland) och lämnade nästan aldrig staden. Han räknas som en av de viktigaste filosoferna sedan antiken.

    I *Kritik av det rena förnuftet* (1781) försökte han förena två riktningar: rationalisterna, som menade att kunskap kommer ur förnuftet, och empiristerna, som menade att den kommer ur erfarenheten. Hans svar var att vi bara kan känna världen som den visar sig för oss, genom former som vårt eget förstånd lägger på den – rum, tid och orsak och verkan. Jämför med hur en datorskärm visar data i ett format som bestäms av skärmen och programmet, inte av datan själv.

    I etiken formulerade han det **kategoriska imperativet**: handla bara efter en regel som du kan vilja att alla följer, och behandla aldrig människor enbart som medel. I uppsatsen ”Vad är upplysning?” (1784) gav han upplysningen dess motto: *sapere aude*, våga använda ditt eget förstånd. Hans skrift om evig fred 1795 föreslog ett förbund av fria stater, en idé som pekar fram mot Nationernas förbund och FN.

    Se även [Newton: Principia 1687](#newton-principia-1687), den fysik som Kant ville ge en filosofisk grund.

goethe:
  period: 1780
  label: "Goethe"
  title: "Johann Wolfgang von Goethe (1749–1832)"
  wiki:
    - "sv:Johann Wolfgang von Goethe"
    - "sv:Faust"
  text: |
    **Goethe** är Tysklands nationalskald, ungefär vad [Shakespeare](#shakespeare-fodd-1564) är för England. Han blev berömd över en natt 1774 med romanen *Den unge Werthers lidanden*, om en ung man som tar livet av sig av olycklig kärlek. Den blev en europeisk sensation – unga män klädde sig som Werther. Den hörde till *Sturm und Drang* (storm och längtan), en litterär rörelse som satte känslan före upplysningens förnuft och som ledde fram till romantiken.

    Från 1775 bodde han i det lilla hertigdömet Weimar, där han var minister i ett decennium och tillsammans med vännen **Friedrich Schiller** skapade den så kallade Weimarklassicismen. Hans huvudverk är dramat *Faust* (del 1 1808, del 2 publicerad 1832), om en lärd man som säljer sin själ till djävulen i utbyte mot kunskap och upplevelser.

    Goethe var också naturforskare: han studerade växternas form och [skrev en färglära](#goethes-farglara-1810) som angrep [Newton](#newton-principia-1687) (och hade fel om fysiken men intressanta iakttagelser om färgseende). Det tyska kulturinstitutet Goethe-Institut är uppkallat efter honom.

tysk-romerska-riket-upplost-1806:
  period: 1800
  label: "Tysk-romerska riket upplöst 1806"
  title: "Tysk-romerska riket upplöses 1806"
  wiki:
    - "sv:Tysk-romerska riket"
    - "sv:Rhenförbundet"
  text: |
    **Tysk-romerska riket** hade funnits sedan Otto den stores kröning 962 (eller Karl den stores år 800). Det var inget enhetligt land utan ett lapptäcke av omkring 300 furstendömen, fria städer och kyrkliga stater i dagens Tyskland, Österrike, Tjeckien och angränsande områden, under en vald kejsare som sedan 1400-talet nästan alltid var en Habsburgare från Wien. [Voltaire](#voltaire) skämtade att det varken var heligt, romerskt eller ett rike.

    [Napoleon](#napoleon) slog Österrike vid Austerlitz 1805 och drog sedan om kartan. 1803 hade de flesta kyrkliga staterna och små fria städerna slagits ihop med större grannar. I juli 1806 skapade han **Rhenförbundet**, ett förbund av 16 sydvästtyska stater under fransk beskydd som lämnade riket. Den 6 augusti 1806 lade kejsar Frans II ned kejsarkronan och förklarade riket upplöst, efter omkring 1 000 år. Han behöll titeln kejsare av Österrike.

    Förenklingen från hundratals till omkring 40 stater banade väg för en senare tysk enhet. Efter Napoleon bildades Tyska förbundet 1815, och Preussen enade Tyskland 1871.

tullunionen-1834:
  period: 1820
  label: "Tullunionen 1834"
  title: "Tyska tullunionen 1834"
  wiki:
    - "sv:Tyska tullunionen"
  text: |
    Efter Napoleonkrigen var Tyskland inget land utan ett löst förbund (Tyska förbundet) av 39 stater: kungadömen som Preussen, Bayern och Sachsen, småfurstendömen och fria städer. Varje stat hade egna tullar, mynt och mått. En vara som fraktades från Hamburg till Österrike kunde behöva passera ett tiotal tullgränser.

    **Zollverein** (tullunionen) bildades 1834 på initiativ av Preussen. Medlemsstaterna avskaffade tullarna sinsemellan och hade gemensamma yttertullar. Från start omfattade den 18 stater med omkring 23 miljoner invånare. Österrike, Preussens rival om ledarskapet i Tyskland, stod utanför.

    Tullunionen gav en stor inre marknad som drev på industrialiseringen och järnvägsbyggandet, och band de mindre staterna ekonomiskt till Preussen. Den blev därmed en förövning till det politiska enandet i **[Tyska riket 1871](#tyska-riket-1871-bismarck)** under Bismarck. Den jämförs ofta med EU:s föregångare [EEG (1957)](#romfordraget-1957), som också började som en tullunion.

n-1848:
  period: 1840
  label: "1848"
  title: "Marsrevolutionen i Tyskland 1848–1849"
  wiki:
    - "en:German revolutions of 1848–1849"
    - "sv:Frankfurtparlamentet"
  text: |
    Tyskland var 1848 ett förbund av 39 stater, de största Österrike och Preussen, styrda av furstar med begränsade eller inga parlament. Den liberala medelklassen ville ha en enad tysk nation med författning, pressfrihet och parlament; hantverkare och bönder led av missväxt och industrialiseringens omvandling.

    Nyheten om [februarirevolutionen i Paris](#revolution-1848) utlöste i mars 1848 uppror i Berlin, Wien och många andra städer. Furstarna gav efter, och i maj samlades ett folkvalt parlament, **Frankfurtparlamentet**, med cirka 600 ledamöter – främst professorer, jurister och tjänstemän. Det skrev en liberal författning för ett enat Tyskland och erbjöd 1849 kejsarkronan till kung Fredrik Vilhelm IV av Preussen.

    Han vägrade att ta emot en krona ”från rännstenen”, alltså från folket. Under 1849 återtog furstarna kontrollen med militär, och sista motståndet krossades. Hundratusentals besvikna tyskar emigrerade, många till USA. Enandet kom i stället 1871 genom Bismarcks krig, ovanifrån och under Preussen (se [Tyska riket 1871](#tyska-riket-1871-bismarck)). Svart-röd-gul, den flagga revolutionärerna använde, blev senare Tysklands flagga.

marx-kommunistiska-manifestet:
  period: 1840
  label: "Marx: Kommunistiska manifestet"
  title: "Kommunistiska manifestet 1848"
  wiki:
    - "sv:Kommunistiska manifestet"
    - "sv:Karl Marx"
  text: |
    **Karl Marx** (1818–1883) var en tysk filosof och journalist, och **Friedrich Engels** (1820–1895) son till en textilfabrikör som sett arbetarnas villkor i Manchester. På uppdrag av ett litet hemligt sällskap, Kommunisternas förbund, skrev de *Kommunistiska manifestet*, som publicerades i London i februari 1848 – veckor före [revolutionerna i Europa](#ars-revolutioner-1848), men utan att påverka dem.

    Det korta häftet hävdar att historien drivs av klasskamp. Under industrialismen står borgarklassen (bourgeoisien, de som äger fabriker och kapital) mot arbetarklassen (proletariatet, de som bara har sin arbetskraft att sälja). Marx menade att kapitalismen skulle leda till allt större kriser och att arbetarna skulle ta makten och avskaffa privat ägande av produktionsmedlen. Det slutar: ”Proletärer i alla länder, förenen eder!”

    Marx huvudverk *Kapitalet* kom 1867. Hans idéer blev grunden för de socialdemokratiska arbetarpartierna (det svenska grundades 1889) och för de kommunistiska [revolutionerna i Ryssland 1917](#revolutionerna-1917) och [Kina 1949](#folkrepubliken-1949). Därmed påverkade de 1900-talet kanske mer än någon annan politisk text – på gott och ont.

tyska-riket-1871-bismarck:
  period: 1860
  label: "Tyska riket 1871 (Bismarck)"
  title: "Tyska riket grundas 1871 – Bismarck"
  wiki:
    - "sv:Otto von Bismarck"
    - "sv:Tyska kejsarriket"
  text: |
    **Otto von Bismarck** (1815–1898) var en konservativ preussisk godsägare som blev Preussens premiärminister 1862. Hans motto var att Tysklands enande inte skulle avgöras genom tal och majoritetsbeslut, [som 1848](#n-1848), utan ”genom järn och blod”. Han förde tre korta krig: mot Danmark 1864 (som förlorade Schleswig-Holstein), mot Österrike 1866 (som utestängdes från tyska angelägenheter) och [mot Frankrike 1870–1871](#fransk-tyska-kriget-1870).

    Den 18 januari 1871 utropades **Tyska riket** i spegelsalen i Versailles, med den preussiske kungen Vilhelm I som kejsare och Bismarck som rikskansler. Riket hade ca 41 miljoner invånare och blev snabbt Europas största industrimakt, med ledande kemi-, stål- och elindustri. Bismarck styrde till 1890.

    Inrikes bekämpade han både katolska kyrkan och socialdemokraterna, men införde också världens första statliga [sjukförsäkring (1883)](#socialforsakring-bismarck), olycksfallsförsäkring och ålderspension (1889) – förebilder för välfärdsstater, inklusive Sveriges. Utrikes byggde han ett komplicerat system av allianser för att isolera Frankrike. Efter hans avgång raserades det, och den nya maktbalansen ledde mot [första världskriget](#forsta-varldskriget).

socialforsakring-bismarck:
  period: 1880
  label: "Socialförsäkring (Bismarck)"
  title: "Bismarcks socialförsäkringar 1883–1889"
  wiki:
    - "sv:Otto von Bismarck"
    - "en:Social security in Germany"
  text: |
    **Otto von Bismarck** var preussisk premiärminister och Tysklands förste rikskansler (regeringschef) 1871–1890. Han hade [enat Tyskland genom tre krig 1864–1871](#tyska-riket-1871-bismarck) och var en konservativ maktpolitiker.

    När det socialdemokratiska partiet växte bland industriarbetarna försökte Bismarck dels förbjuda det (socialistlagarna 1878), dels ta udden av dess krav. Han införde världens första statliga obligatoriska **socialförsäkringar**: sjukförsäkring 1883, olycksfallsförsäkring 1884 och ålders- och invaliditetspension 1889. Arbetare, arbetsgivare och staten betalade gemensamt. Pensionsåldern var 70 år, när få arbetare blev så gamla.

    Modellen kopierades i hela Europa och är grunden för dagens välfärdsstater – även Sverige, som införde allmän folkpension 1913. Jämför: USA fick sin motsvarighet (Social Security) först [1935](#new-deal). Ironiskt nog var avsikten att stoppa socialismen, men resultatet blev en av socialdemokratins centrala byggstenar.

koch-tuberkelbakterien-1882:
  period: 1880
  label: "Koch: tuberkelbakterien 1882"
  title: "Robert Koch upptäcker tuberkelbakterien 1882"
  wiki:
    - "sv:Robert Koch"
    - "sv:Tuberkulos"
  text: |
    Den 24 mars 1882 presenterade den tyske läkaren **Robert Koch** i Berlin beviset för att **tuberkulos** orsakas av en bakterie, *Mycobacterium tuberculosis*. Tuberkulos – lungsot – var då en av de vanligaste dödsorsakerna i Europa; Koch själv angav att den orsakade ungefär var sjunde dödsfall.

    Koch utvecklade metoder som blev grunden för bakteriologin: att odla bakterier i renkultur på fast näringsmedium (agar i petriskålar, som kom från hans labb), färgning och mikrofotografi. Han formulerade också **Kochs postulat** – kriterier för att visa att en viss mikrob orsakar en viss sjukdom. 1883 identifierade han [kolerabakterien](#kolerapandemier). Han fick Nobelpriset 1905.

    Någon bot fanns inte förrän antibiotikan streptomycin kom 1944. Men kunskapen ledde till sanatorier, mjölkkontroll och vaccinet BCG (1921). Tuberkulos dödar fortfarande drygt en miljon människor om året, främst i fattiga länder. Se även ”[bakterieteorin](#bakterieteorin)”.

benz-bil-1886:
  period: 1880
  label: "Benz bil 1886"
  title: "Benz Patent-Motorwagen 1886"
  wiki:
    - "sv:Benz Patent-Motorwagen"
    - "sv:Karl Benz"
    - "sv:Bertha Benz"
  text: |
    År 1886 patenterade den tyske ingenjören **Karl Benz** en trehjulig vagn driven av en bensinmotor – **Benz Patent-Motorwagen**, som räknas som den första praktiskt användbara bilen. Motorn var en encylindrig fyrtaktsmotor på under 1 hästkraft, och toppfarten låg kring 16 km/h.

    1888 körde hans fru **Bertha Benz** utan makens vetskap bilen ca 100 km från Mannheim till Pforzheim med sina söner – den första långa bilresan, som gav reklam och förbättringar. Samtidigt byggde Gottlieb Daimler och Wilhelm Maybach egna bilar; bolagen slogs senare ihop till Daimler-Benz (Mercedes-Benz). Konkurrerande tekniker var ångbilar och [elbilar](#elbilar-och-batterier), som runt 1900 faktiskt var vanliga i USA.

    Bilen blev massprodukt först med Henry [Fords Model T (1908)](#ford-t-1908) och [löpande band (1913)](#lopande-bandet-1913). Förbränningsmotorn formade 1900-talets städer, oljeberoende och utsläpp – idag ersätts den åter av elbilar.

einstein-relativitetsteorin-1905:
  period: 1900
  label: "Einstein: relativitetsteorin 1905"
  title: "Einstein och relativitetsteorin 1905"
  wiki:
    - "sv:Speciella relativitetsteorin"
    - "sv:Albert Einstein"
  text: |
    År 1905 – hans ”mirakelår” – publicerade den 26-årige **Albert Einstein**, då tekniker vid patentverket i Bern, fyra banbrytande artiklar. En förklarade den fotoelektriska effekten med [ljuskvanta](#planck-kvanta) (som gav honom Nobelpriset 1921), en bevisade att atomer finns via [brownsk rörelse](#brownsk-rorelse-1827), och två lade grunden till den **speciella relativitetsteorin**.

    Teorin bygger på två antaganden: fysikens lagar är desamma för alla som rör sig med jämn hastighet, och ljusets hastighet (ca 300 000 km/s) är densamma för alla observatörer. Följden blir att tid och rum är relativa: klockor i rörelse går långsammare och längder krymper. Ur teorin följer också **E = mc²** – massa och energi är samma sak, vilket förklarar energin i atomkärnor.

    1915 kom den **allmänna relativitetsteorin**, som beskriver gravitation som krökning av rumtiden. Den bekräftades vid solförmörkelsen 1919 och gjorde Einstein världsberömd. Utan korrektioner för båda teorierna skulle GPS-positioner drifta ca 10 km per dygn.

planck-kvanta:
  period: 1900
  label: "Planck: kvanta"
  title: "Max Planck och kvantumhypotesen 1900"
  wiki:
    - "sv:Max Planck"
    - "sv:Plancks konstant"
  text: |
    Kring 1900 försökte fysiker förklara strålningen från heta föremål – varför glödande järn först lyser rött och sedan vitt. Den klassiska fysiken gav absurda svar: den förutsade oändlig energi vid korta våglängder.

    I december 1900 löste den tyske fysikern **Max Planck** problemet med ett matematiskt trick: han antog att energi bara kan avges i bestämda små portioner, **kvanta**, där energin är frekvensen gånger en konstant – idag kallad **Plancks konstant** (ca 6,6 × 10⁻³⁴ joulesekunder). Planck själv såg det som en nödlösning, inte som en beskrivning av verkligheten.

    [Einstein tog idén på allvar 1905](#einstein-1905-och-1915) och visade att ljus självt består av kvanta (fotoner). Ur detta växte på 1920-talet **[kvantmekaniken](#kvantmekaniken-192526)** fram (Bohr, Heisenberg, Schrödinger), teorin för atomer och elektroner. Den är grunden för halvledare, [transistorer](#transistorn-1947), laser, LED och därmed all modern elektronik – och för [kvantdatorer](#kvantdatorer). Planck fick Nobelpriset 1918.

weimar-hyperinflation-1923:
  period: 1920
  label: "Weimar, hyperinflation 1923"
  title: "Weimarrepubliken och hyperinflationen 1923"
  wiki:
    - "sv:Weimarrepubliken"
    - "en:Hyperinflation in the Weimar Republic"
  text: |
    Weimarrepubliken var Tysklands första demokrati, 1918–1933, uppkallad efter staden där grundlagen skrevs. Den föddes ur nederlaget i [första världskriget](#forsta-varldskriget) och fick ta på sig Versaillesfreden, som krävde enorma krigsskadestånd.

    Kriget hade finansierats med lån och sedelpress. När Tyskland inte betalade skadestånd ockuperade Frankrike och Belgien i januari 1923 Ruhrområdet, Tysklands industrihjärta. Regeringen betalade de strejkande arbetarna genom att trycka ännu mer pengar. I november 1923 kostade en dollar 4,2 biljoner mark, och priser kunde fördubblas på några dagar. Löner betalades ut två gånger om dagen och folk bar sedlar i skottkärror.

    Inflationen stoppades med en ny valuta, rentenmark, där en ny mark motsvarade en biljon gamla. Men medelklassens besparingar hade utplånats, vilket undergrävde förtroendet för demokratin. Samma år gjorde [Hitler](#hitler-1933) ett misslyckat kuppförsök i München. Rädslan för inflation präglar tysk ekonomisk politik än idag, bl.a. i Europeiska centralbankens uppdrag.

hitler-1933:
  period: 1920
  label: "Hitler 1933"
  title: "Hitler tar makten 1933"
  wiki:
    - "sv:Adolf Hitler"
    - "sv:Nazistiska maktövertagandet i Tyskland"
  text: |
    **Adolf Hitler** var en österrikiskfödd före detta soldat som ledde NSDAP, Nationalsocialistiska tyska arbetarpartiet (nazisterna). Partiet var ett marginalparti på 1920-talet men växte explosivt under [depressionen](#depressionen): från 2,6 % av rösterna 1928 till 37 % i juli 1932, då arbetslösheten låg kring 30 %.

    Den 30 januari 1933 utnämndes Hitler till rikskansler av president Hindenburg; konservativa politiker trodde att de kunde kontrollera honom. Inom månader hade han avskaffat demokratin. Riksdagshusbranden i februari användes som förevändning att avskaffa medborgerliga rättigheter, och i mars gav fullmaktslagen regeringen rätt att stifta lagar utan parlamentet. Fackföreningar och andra partier förbjöds, och de första koncentrationslägren öppnades.

    Det som följde var upprustning, förföljelse av judar (Nürnberglagarna 1935, Kristallnatten 1938) och till slut [andra världskriget](#andra-varldskriget) och [Förintelsen](#forintelsen) (se 1940-talet). Fallet är det klassiska exemplet på hur en demokrati kan avskaffas på lagliga vägar på kort tid.

polen-anfalls-1939:
  period: 1920
  label: "Polen anfalls 1939"
  title: "Tyskland anfaller Polen 1939"
  wiki:
    - "sv:Invasionen av Polen"
    - "sv:Molotov–Ribbentrop-pakten"
  text: |
    Den 1 september 1939 anföll Tyskland Polen med omkring 1,5 miljoner soldater. Två dagar senare förklarade Storbritannien och Frankrike krig mot Tyskland – andra världskriget i Europa hade börjat.

    Bara en vecka tidigare hade Tyskland och Sovjetunionen slutit Molotov–Ribbentrop-pakten, en icke-angreppspakt med ett hemligt tillägg som delade Östeuropa mellan dem. Den 17 september gick Sovjet in i östra Polen. Polen besegrades på omkring fem veckor. Tyskarna använde snabba pansarförband samordnade med flyg, det som kallades blixtkrig.

    Västmakterna hade dessförinnan följt eftergiftspolitik: i Münchenavtalet 1938 lät de Hitler ta delar av Tjeckoslovakien i hopp om fred. Polen led oerhört under ockupationen: uppskattningsvis 5–6 miljoner polska medborgare dog under kriget, omkring 17 % av befolkningen, varav ungefär hälften var judar. Se även [Andra världskriget](#andra-varldskriget) och [Förintelsen](#forintelsen).

forintelsen:
  period: 1940
  label: "Förintelsen"
  title: "Förintelsen"
  wiki:
    - "sv:Förintelsen"
  text: |
    Förintelsen (på engelska Holocaust, på hebreiska Shoah) var [Nazitysklands](#hitler-1933) systematiska mord på omkring sex miljoner judar 1941–45, ungefär två tredjedelar av Europas judar. Nazisterna mördade också romer (uppskattningsvis 200 000–500 000), personer med funktionsnedsättning, homosexuella, politiska motståndare och miljontals sovjetiska krigsfångar och polska civila.

    Förföljelsen började 1933 med uteslutning från yrken och Nürnberglagarna 1935. Efter anfallet på Sovjetunionen 1941 sköt mobila förband, Einsatzgruppen, över en miljon judar vid massgravar. På Wannseekonferensen i januari 1942 samordnades den ”slutgiltiga lösningen”. Judar deporterades i godståg till förintelseläger i det ockuperade Polen. I Auschwitz-Birkenau mördades omkring 1,1 miljoner, de flesta i gaskammare direkt vid ankomsten.

    Förintelsen var unik i sin industriella organisation – byråkrati, järnvägsscheman, registrering. Efter kriget ledde den till Nürnbergrättegångarna, FN:s folkmordskonvention 1948 och begreppet brott mot mänskligheten. Den var också en drivkraft bakom [Israels grundande 1948](#israel-1948).

nederlag-1945:
  period: 1940
  label: "nederlag 1945"
  title: "Tysklands nederlag 1945"
  wiki:
    - "sv:Tysklands kapitulation"
    - "sv:Slaget om Berlin"
  text: |
    Efter nederlagen vid [Stalingrad 1943](#stalingrad) och de allierades landstigning i Normandie i juni 1944 trängdes Tyskland tillbaka från båda håll. Våren 1945 stormade Röda armén Berlin; striden kostade uppskattningsvis 100 000 sovjetiska soldaters liv. Hitler begick självmord i sin bunker 30 april. Tyskland kapitulerade villkorslöst 8 maj 1945 (Segerdagen i väst).

    Landet låg i ruiner. Omkring 7–9 miljoner tyskar hade dött i kriget. Städerna var bombade, och 12–14 miljoner tyskar flydde eller fördrevs från områden i öst som tillföll Polen och Sovjet. Totalt kostade [andra världskriget](#andra-varldskriget) uppskattningsvis 70–85 miljoner människoliv, det dödligaste kriget i historien.

    Segrarmakterna USA, Sovjet, Storbritannien och Frankrike delade Tyskland och Berlin i fyra ockupationszoner. I Nürnbergrättegångarna 1945–46 dömdes nazistiska ledare, ett av de första internationella krigsförbrytartribunalerna. I Asien fortsatte kriget till Japans kapitulation i augusti efter [atombomberna](#atombomben-1945). Se även [delning 1949](#delning-1949).

delning-1949:
  period: 1940
  label: "delning 1949"
  title: "Tysklands delning 1949"
  wiki:
    - "sv:Tysklands delning"
    - "sv:Berlinblockaden"
  text: |
    Efter 1945 var Tyskland delat i fyra ockupationszoner. När samarbetet mellan Sovjetunionen och västmakterna bröt samman blev delningen permanent. 1948–49 blockerade Sovjet alla land- och vattenvägar till Västberlin, och västmakterna försörjde staden via en luftbro: under elva månader flög de in omkring 2,3 miljoner ton förnödenheter, i perioder ett plan var tredje minut.

    I maj 1949 bildades Förbundsrepubliken Tyskland (Västtyskland) av de tre västzonerna, med Bonn som huvudstad och **Konrad Adenauer** som förbundskansler. I oktober svarade Sovjet med Tyska demokratiska republiken (DDR, Östtyskland), en kommunistisk enpartistat.

    Västtyskland fick marknadsekonomi och [Marshallhjälp](#marshallplanen) och upplevde ett ”ekonomiskt under”. Från DDR flydde omkring 2,7 miljoner till väst fram till 1961, då [Berlinmuren](#berlinmuren-1961) byggdes. Delningen var kalla krigets mest konkreta symbol och varade i 41 år, tills Tyskland [återförenades 1990](#aterforeningen-1990), året efter [murens fall](#murens-fall-1989).

berlinmuren-1961:
  period: 1960
  label: "Berlinmuren 1961"
  title: "Berlinmuren byggs 1961"
  wiki:
    - "sv:Berlinmuren"
  text: |
    Efter [andra världskriget](#andra-varldskriget) [delades Tyskland](#delning-1949) i en västtysk demokrati och ett kommunistiskt Östtyskland (DDR) under Sovjet. Huvudstaden Berlin låg mitt i DDR men var också delad, och Västberlin blev en västlig ö. Gränsen mellan öst och väst i övrigt var stängd, men i Berlin kunde man fortfarande ta tunnelbanan västerut.

    Det gjorde många: 1949–61 flydde omkring 2,7 miljoner människor, ofta unga och utbildade som läkare och ingenjörer, av ett land på 18 miljoner. Natten mot den 13 augusti 1961 spärrade DDR gränsen med taggtråd, som snart ersattes av en mur. Den kom att omge hela Västberlin, cirka 155 km, med vakttorn, minor och en ”dödszon”.

    Minst 140 människor dödades vid muren vid flyktförsök. Muren blev kalla krigets främsta symbol; Kennedy talade 1963 i Västberlin (”Ich bin ein Berliner”) och Reagan 1987 (”Tear down this wall”). Den stod i drygt 28 år, tills den 9 november 1989 – se [Murens fall 1989](#murens-fall-1989).

murens-fall-1989:
  period: 1980
  label: "Murens fall 1989"
  title: "Berlinmurens fall 1989"
  wiki:
    - "sv:Berlinmurens fall"
    - "en:Revolutions of 1989"
  text: |
    På 1980-talet var Sovjetunionen i ekonomisk kris. Den nye ledaren **Michail Gorbatjov**, från 1985, införde öppenhet (glasnost) och reformer (perestrojka) och lät förstå att Sovjet inte längre skulle skicka stridsvagnar för att rädda kommunistregimerna i Östeuropa, som i Ungern 1956 och Prag 1968 (se [Pragvåren 1968](#pragvaren-1968)). 1989 föll regimerna en efter en: Polen fick delvis fria val i juni (se [Solidaritet](#solidaritet)), och Ungern öppnade gränsen mot Österrike, vilket gjorde att tusentals östtyskar flydde den vägen.

    I Östtyskland växte massdemonstrationer, särskilt måndagsdemonstrationerna i Leipzig, med uppåt 70 000 och sedan hundratusentals deltagare. Den 9 november 1989 skulle regimen meddela nya, lättare reseregler. Talesmannen Günter Schabowski fick en lapp utan instruktioner och sade på en direktsänd presskonferens, på fråga om när, att de gällde ”omedelbart”. Tusentals berlinare strömmade till gränsövergångarna, och vakterna öppnade till slut bommarna.

    Samma natt dansade folk på muren. Den revs fysiskt under 1990. Murens fall ledde till [Tysklands återförening 1990](#aterforeningen-1990) (se det) och Sovjetunionens upplösning 1991 (se [Sovjet faller 1991](#sovjet-faller-1991)), och markerar i praktiken slutet på kalla kriget. Sammetsrevolutionen i Tjeckoslovakien och revolutionen i Rumänien följde samma år.

aterforeningen-1990:
  period: 1980
  label: "återföreningen 1990"
  title: "Tysklands återförening 1990"
  wiki:
    - "sv:Tysklands återförening"
  text: |
    Efter [Berlinmurens fall](#murens-fall-1989) (se det) i november 1989 gick det snabbt. Östtyskland (DDR) höll sitt första fria val i mars 1990, där partier som ville ha snabb återförening vann. Den 1 juli fick DDR västtyska D-mark som valuta, med växelkursen 1:1 för löner och mindre sparbelopp – politiskt populärt men ekonomiskt förödande för östtysk industri, som plötsligt blev olönsam.

    Västtysklands förbundskansler **Helmut Kohl** drev processen. Segrarmakterna från andra världskriget – USA, Sovjet, Storbritannien och Frankrike – hade formellt kvar rättigheter över Tyskland. I ”två-plus-fyra-fördraget” godtog de återföreningen. Gorbatjov accepterade att det enade Tyskland fick vara med i Nato, i utbyte mot bland annat tyska pengar till Sovjet. [Storbritanniens Thatcher](#thatcher) och [Frankrikes Mitterrand](#mitterrand) var skeptiska till ett stort Tyskland. Den 3 oktober 1990 upphörde DDR att existera; dess fem delstater gick in i Förbundsrepubliken.

    Det enade Tyskland fick cirka 80 miljoner invånare (16 miljoner från öst) och blev Europas klart största ekonomi. Återföreningen blev dyr: överföringar från väst till öst har beräknats till uppskattningsvis 1,5–2 biljoner euro. Miljontals östtyskar förlorade jobbet, och skillnaderna i lön och politiska åsikter mellan öst och väst märks fortfarande. Oron för ett starkt Tyskland var en drivkraft bakom EU och euron (se [EU 1993](#eu-1993)).

euron-2002:
  period: 2000
  label: "Euron 2002"
  title: "Euron införs 2002"
  wiki:
    - "sv:Euro"
    - "en:Euro"
  text: |
    **Euron** är den gemensamma valutan för en del av EU:s medlemsländer. Den infördes som bokföringsvaluta 1999 och som sedlar och mynt den 1 januari 2002, då tolv länder samtidigt bytte ut sina gamla valutor – bland dem Tysklands **D-mark**, Frankrikes franc och Italiens lire. Omkring 300 miljoner människor fick nya pengar över en natt; det var den största valutaväxlingen i historien.

    För Tyskland var det ett stort offer. D-marken var symbolen för efterkrigstidens framgång och stabilitet, och den tyska centralbanken (Bundesbank) var känd för att hålla inflationen låg. Enligt en vanlig tolkning var euron delvis ett pris för Tysklands [återförening 1990](#aterforeningen-1990): Frankrike ville binda det större Tyskland hårdare till Europa. Tyskland krävde i gengäld att den nya Europeiska centralbanken skulle ligga i Frankfurt och att länderna skulle hålla budgetunderskott under 3 % av BNP.

    Euron gjorde handel och resor enklare, men länderna kunde inte längre devalvera sin egen valuta vid kris. Det blev ett problem i [eurokrisen från 2010](#eurokrisen). I dag används euron av ett tjugotal EU-länder. Sverige röstade nej i en folkomröstning 2003.

merkel:
  period: 2000
  label: "Merkel"
  title: "Angela Merkel, Tysklands förbundskansler 2005–2021"
  wiki:
    - "sv:Angela Merkel"
    - "en:Angela Merkel"
  text: |
    **Angela Merkel** (född 1954) växte upp i kommunistiska Östtyskland och arbetade som forskare i kvantkemi innan hon gick in i politiken efter [Berlinmurens fall 1989](#murens-fall-1989). Hon blev ledare för det kristdemokratiska partiet CDU och 2005 Tysklands första kvinnliga **förbundskansler** (regeringschef). Hon satt i 16 år, nästan lika länge som Helmut Kohl.

    Hennes period präglades av kriser. Under **eurokrisen** (2010–15) var hon Europas mest inflytelserika ledare och krävde åtstramningar av Grekland och andra skuldsatta länder i utbyte mot nödlån. Under **flyktingkrisen 2015** lät hon Tyskland ta emot omkring en miljon asylsökande, främst från Syrien ("Wir schaffen das" – vi klarar det). Efter kärnkraftsolyckan i [Fukushima 2011](#fukushima-2011) beslöt hon att avveckla Tysklands kärnkraft.

    Hennes stil var försiktig och pragmatisk. Efteråt har hon kritiserats för att ha gjort Tyskland beroende av rysk gas, bland annat genom gasledningarna Nord Stream, och för att ha underskattat Putin – vilket blev tydligt vid [Rysslands invasion av Ukraina 2022](#rysslands-invasion-av-ukraina-2022). Se även [Krim 2014](#krim-2014) och [energikris](#energikris).
