# Kina
# Varje nod: period (första året i 20-årsperioden), label (texten i tabellen),
# title, wiki (språk:Artikel), text (Markdown; [text](#id) länkar till en annan nod).
# same_as: id betyder att noden visar samma artikel som en annan nod.

songdynastin:
  period: 1000
  label: "Songdynastin"
  title: "Songdynastin i Kina (960–1279)"
  wiki:
    - "sv:Songdynastin"
  text: |
    **Songdynastin** styrde Kina 960–1279. Den grundades av generalen Zhao Kuangyin, som enade landet efter en period av splittring. Huvudstaden **Kaifeng** hade kring år 1000 uppskattningsvis 500 000–1 miljon invånare – sannolikt världens största stad – och hela riket kanske 60–100 miljoner, mer än hela Europa tillsammans.

    Songtiden var en ekonomisk och teknisk blomstringstid. Riket styrdes av utbildade tjänstemän som rekryterades genom **kejserliga examensprov** i klassiska texter, inte genom börd. Världens första sedlar började användas omkring 1024. Boktryck med träblock var spritt, och på 1040-talet uppfann [Bi Sheng](#bi-sheng-losa-typer-i-brand-lera-1040) tryck med lösa typer, 400 år före [Gutenberg](#gutenbergs-tryckpress-1450) (se ~1450). Kompassen användes för sjöfart, krut för vapen (se [krut i vapen](#krut-i-vapen)), och järnproduktionen kan ha varit lika stor som Europas kring 1700.

    Militärt var dynastin svagare. Den kunde inte besegra stäppfolken i norr, och betalade i stället tribut (se [Shanyuan 1005](#fred-i-shanyuan-med-liao-1005)). 1127 förlorade den norra Kina till jurchenfolket och fortsatte som Södra Song. 1279 erövrades hela landet av mongolerna under Khubilai khan. Historiker diskuterar varför Songs teknik inte ledde till en industriell revolution som i England 700 år senare.

fred-i-shanyuan-med-liao-1005:
  period: 1000
  label: "fred i Shanyuan med Liao 1005"
  title: "Freden i Shanyuan 1005"
  wiki:
    - "en:Chanyuan Treaty"
    - "sv:Liaodynastin"
  text: |
    Norr om Song-Kina låg **Liaodynastin**, ett rike grundat av **khitanerna**, ett nomadfolk från dagens Mongoliet och Manchuriet. Liao kontrollerade också ett område kring dagens Peking. Khitanerna var så kända att namnet ”Khitai” blev ordet för Kina på ryska (Kitaj) och i medeltida europeiska texter (Cathay).

    1004 invaderade Liao Song-riket med en stor armé och nådde Shanyuan, bara cirka 150 km från Songs huvudstad Kaifeng. I stället för att slåss till slutet slöt man ett fredsavtal i januari 1005: Song skulle varje år betala 100 000 tael silver (ett tael är cirka 37 gram, alltså ungefär 3,7 ton) och 200 000 rullar siden. Båda härskarna skulle behandla varandra som jämlikar.

    För Song var summan liten – mindre än 1–2 procent av statens inkomster – och mycket billigare än krig. Freden höll i över hundra år och gav handel över gränsen som delvis gav tillbaka silvret. Jämför med England samtidigt, som betalade [danegäld](#danegeld-till-vikingar) till vikingarna: samma strategi, men där köpte betalningarna bara kortare respit. Avtalet kallas ibland världens första moderna fredsfördrag mellan jämbördiga stater.

krut-i-vapen:
  period: 1000
  label: "krut i vapen"
  title: "Krutet blir vapen i Kina"
  wiki:
    - "sv:Krut"
    - "en:History of gunpowder"
  text: |
    **Krut** är en blandning av salpeter (kaliumnitrat), svavel och träkol som brinner mycket snabbt eftersom salpetern själv levererar syre. Det upptäcktes av kinesiska alkemister, troligen på 800-talet, när de letade efter ett odödlighetselixir. En text från omkring 850 varnar för blandningar som bränt skägg och hus.

    Under Songdynastin började man använda det militärt. År 1044 publicerades handboken *[Wujing Zongyao](#wujing-zongyao-1044-forsta-nedskrivna)*, med de första kända recepten på krut, avsedda för brandpilar, brandbomber som slungades med katapult och rökbomber. Det tidiga krutet hade för lite salpeter för att explodera ordentligt; det brann i stället, som ett brandvapen. På 1100-talet kom eldlansar (rör med krut fäst på spjut), och de äldsta bevarade kanonerna i metall är från omkring 1280-talet.

    Tekniken spreds västerut via mongolerna och nådde Europa på 1200-talet; [Roger Bacon beskrev ett recept omkring 1267](#krutrecept-i-europa-bacon-1267). Krut i kanoner förändrade sedan Europa i grunden: borgar blev sårbara, [Konstantinopels murar föll 1453](#konstantinopel-faller-1453) för osmanskt artilleri, och riddarväsendet ersattes av infanteri med skjutvapen. Ironiskt nog blev det europeiska stater, inte Kina, som utnyttjade uppfinningen mest.

statliga-papperspengar-jiaozi-1024:
  period: 1020
  label: "Statliga papperspengar (jiaozi) 1024"
  title: "Världens första statliga sedlar (jiaozi) 1024"
  wiki:
    - "en:Jiaozi (currency)"
    - "sv:Sedel"
  text: |
    I provinsen Sichuan i Kina använde man järnmynt, som var så tunga och lite värda att man behövde kilovis med mynt för större köp. Köpmän började därför lämna in mynt hos handelshus och få ett papperskvitto, **jiaozi** ("bytbart"), som kunde användas som betalning.

    År 1024 tog **[Songdynastins](#songdynastin)** stat (960–1279) över utgivningen och skapade världens första statligt utgivna sedlar. De trycktes med träblock i flera färger för att försvåra förfalskning, och hade från början en reserv i mynt bakom sig.

    Problemet som följde var detsamma som i dag: frestelsen att trycka för mycket. Senare under Song och Yuan (mongolerna) blev det inflation. [Marco Polo](#marco-polo-hos-kublai) skrev med förundran om kinesiska papperspengar kring 1290. I Europa kom de första sedlarna först i Stockholm 1661 (Palmstruchs Stockholms banco) – över 600 år senare.

ambetsmannaexamina:
  period: 1020
  label: "ämbetsmannaexamina"
  title: "Kinas ämbetsmannaexamina"
  wiki:
    - "en:Imperial examination"
  text: |
    Kina rekryterade statliga tjänstemän genom **ämbetsmannaexamina** (kejserliga examina): skriftliga prov på konfucianska klassiker – texter om moral, styre och ritualer – samt poesi och politiska essäer. Systemet fanns sedan 600-talet, men under **[Songdynastin](#songdynastin)** (960–1279) blev det den huvudsakliga vägen till makt.

    Proven var i flera steg, på provins- och huvudstadsnivå och till sist inför kejsaren. Bara någon procent klarade de högsta nivåerna. På 1000-talet skrev tiotusentals personer på varje provtillfälle; på 1200-talet uppskattningsvis hundratusentals. Svaren skrevs av och anonymiserades för att undvika fusk och favorisering.

    Varför det spelar roll: det var en meritokrati – makt genom prov snarare än börd – sjuhundra år innan Europa införde liknande system. Brittiska civiltjänstens prov (1850-talet) inspirerades delvis av Kina. Nackdelen var att det belönade utantillkunskap i gamla texter. Systemet avskaffades 1905.

bi-sheng-losa-typer-i-brand-lera-1040:
  period: 1040
  label: "Bi Sheng: lösa typer i bränd lera (~1040)"
  title: "Bi Sheng uppfinner lösa typer (~1040)"
  wiki:
    - "en:Bi Sheng"
    - "en:Movable type"
  text: |
    Före Bi Sheng trycktes kinesiska böcker med *blocktryck*: en hel sida skars ut i ett träblock. Det fungerade, men varje ny sida krävde ett nytt block. **Bi Sheng** var en hantverkare under [Songdynastin](#songdynastin) som kring 1040 uppfann **lösa typer**: ett separat tecken per bit, gjort i bränd lera, som kunde sättas ihop på en järnplatta med vax och harts, tryckas, och sedan återanvändas.

    Vi vet om honom bara genom forskaren [Shen Kuo](#shen-kuo-magnetkompass-deklination), som beskrev metoden i en bok omkring 1088. Problemet för kinesiskan var antalet tecken: tusentals olika, jämfört med ett par dussin bokstäver i latinska alfabetet. Därför förblev blocktrycket dominerande i Kina i århundraden.

    Varför det spelar roll: Bi Sheng var cirka 400 år före **[Gutenberg](#gutenbergs-tryckpress-1450)** (~1450). Koreanerna gick vidare med lösa typer i metall (Jikji, 1377, världens äldsta bevarade bok tryckt så). Men det var med alfabetets fåtal tecken, och Gutenbergs gjutformar och press, som tekniken fick sitt explosiva genomslag – en påminnelse om att en uppfinning behöver rätt sammanhang.

wujing-zongyao-1044-forsta-nedskrivna:
  period: 1040
  label: "Wujing Zongyao 1044: första nedskrivna krutformeln"
  title: "Wujing Zongyao 1044 – första krutformeln"
  wiki:
    - "en:Wujing Zongyao"
    - "sv:Krut"
  text: |
    **Wujing Zongyao** ("Sammanfattning av de viktigaste militära teknikerna") var en militär handbok som Songdynastins regering lät sammanställa och som blev klar 1044. Den innehåller de äldsta kända skriftliga recepten på **krut** – en blandning av salpeter (kaliumnitrat), svavel och träkol.

    Krut hade upptäckts av kinesiska alkemister, troligen på 800-talet, när de letade efter livselixir. I boken används det för brandbomber, rökbomber och brandpilar – inte för kanoner. Salpeterhalten var lägre än i senare krut, så det brann snarare än exploderade. Boken beskriver också en [tidig kompass](#magnetkompass-for-navigation-kina-1090): en järnfisk magnetiserad genom uppvärmning, som flöt i vatten.

    Varför det spelar roll: under de följande två århundradena utvecklade kineserna eldlansar, raketer och de första kanonerna (1200-talet). Mongolerna förde tekniken västerut, och i Europa nämns [krut cirka 1267](#krutrecept-i-europa-bacon-1267) och [kanoner från 1320-talet](#kanoner-avbildas-forsta-gangen-1326). Krutet förändrade sedan krigföring, borgar och statsbyggande över hela världen.

wang-anshis-reformer:
  period: 1060
  label: "Wang Anshis reformer"
  title: "Wang Anshis reformer 1069–1085"
  wiki:
    - "en:Wang Anshi"
    - "en:New Policies (Song dynasty)"
  text: |
    **[Songdynastin](#songdynastin)** (960–1279) styrde ett Kina med uppskattningsvis 100 miljoner invånare – mer än hela Europa – och en avancerad ekonomi med [papperspengar](#statliga-papperspengar-jiaozi-1024) och tryckta böcker. Men staten hade stora utgifter för en armé på över en miljon man och för [tribut (fredsbetalningar)](#fred-i-shanyuan-med-liao-1005) till grannfolken i norr.

    **Wang Anshi** (1021–1086) var kansler under kejsar Shenzong och drev från 1069 de så kallade **Nya politiken**. Den innehöll bl.a. statliga lån till bönder i vårsådden (till lägre ränta än privata ockrare), skatt i pengar i stället för tvångsarbete, ny lantmätning för rättvisare jordskatt, lokala milisgrupper för att minska kostnaden för yrkesarmén, och statliga inköp för att jämna ut priser. [Ämbetsexamina](#ambetsmannaexamina) skulle pröva praktiska kunskaper snarare än poesi.

    Motståndarna, ledda av historikern Sima Guang, menade att staten tog över det som borde skötas av familjer och lokala eliter, och att tjänstemän missbrukade lånesystemet. Striden splittrade ämbetsmannakåren i fraktioner i decennier. Debatten – hur mycket staten ska styra ekonomin – känns igen från 1900-talets diskussioner om välfärdsstat och planekonomi.

shen-kuo-magnetkompass-deklination:
  period: 1060
  label: "Shen Kuo: magnetkompass, deklination"
  title: "Shen Kuo och magnetkompassen"
  wiki:
    - "en:Shen Kuo"
    - "en:Dream Pool Essays"
  text: |
    **Shen Kuo** (1031–1095) var kinesisk ämbetsman under [Songdynastin](#songdynastin) – han arbetade med bland annat astronomi, finanser, vattenbyggnad och som diplomat – och en av historiens mest mångsidiga vetenskapsmän. Hans anteckningsbok *Drömbäckens essäer* (Mengxi bitan, ca 1088) innehåller iakttagelser om allt från geologi till teknik.

    Där finns den första tydliga beskrivningen av en **magnetisk kompassnål**: en nål som strukits mot magnetit (ett naturligt magnetiskt mineral) och hängts upp i en silkestråd pekar mot söder. Han noterade också att nålen inte pekar exakt mot den geografiska polen utan lite åt sidan – det vi kallar **missvisning** eller deklination. I Europa beskrevs kompassen först ca 1190, och missvisningen uppmärksammades först på 1400-talet.

    I samma bok beskriver han [Bi Shengs tryckning med lösa typer](#bi-sheng-losa-typer-i-brand-lera-1040) av bränd lera (ca 1040) – 400 år före [Gutenberg](#gutenbergs-tryckpress-1450) – samt fossil av havsdjur i berg som han tolkade som tecken på att landet en gång varit havsbotten. Se även [Kompassen beskrivs (Shen Kuo, ~1088)](#kompassen-beskrivs-shen-kuo-1088).

su-songs-astronomiska-klocktorn-1092:
  period: 1080
  label: "Su Songs astronomiska klocktorn 1092"
  title: "Su Songs klocktorn 1092"
  wiki:
    - "en:Su Song"
    - "en:Escapement"
  text: |
    **Su Song** (1020–1101) var en hög ämbetsman under [Songdynastin](#songdynastin), som också var astronom, läkare och ingenjör. På uppdrag av kejsaren byggde han och ett team ett astronomiskt klocktorn i huvudstaden Kaifeng, färdigt 1092.

    Tornet var drygt 10 meter högt och drevs av ett vattenhjul. Det avgörande var ett **gångverk** – en mekanism som släpper fram hjulet i små, jämna steg, så att tiden mäts regelbundet. Hjulets skopor fylldes med vatten en efter en och utlöste ett steg när de blev tillräckligt tunga. Högst upp roterade en **armillarsfär** (en modell av himlens koordinater i bronsringar) som följde stjärnorna, i mitten en himmelsglob, och på fem våningar dök dockor upp och ringde i klockor, slog på trummor och visade tavlor med tiden. Han använde också en **[kedjedrift](#su-songs-klocktorn-forsta-kanda)**, en av de första kända i världen.

    Su Song skrev en detaljerad beskrivning med ritningar, vilket gör att tornet har kunnat rekonstrueras. Det plockades ner när Jurchen-folket [tog Kaifeng 1127](#jin-erovrar-kaifeng-1127) och kunde inte sättas ihop igen. [Europas första mekaniska klockor med gångverk](#mekaniska-ur-med-spindelgang) dök upp ca 1280–1300 – nästan 200 år senare, och om de påverkades av Kina vet man inte.

kejsar-huizong-konst:
  period: 1100
  label: "Kejsar Huizong, konst"
  title: "Kejsar Huizong – konstnären på tronen"
  wiki:
    - "en:Emperor Huizong of Song"
    - "en:Jingkang incident"
  text: |
    **Huizong** (kejsare 1100–1126) var den åttonde kejsaren av [Songdynastin](#songdynastin), som styrde ett Kina med uppskattningsvis 100 miljoner invånare och huvudstaden Kaifeng, då kanske världens största stad med omkring en miljon invånare.

    Han var en av Kinas största konstnärer: han målade fåglar och blommor med extrem precision och skapade en egen stil av kalligrafi, ”smalt guld”, med tunna eleganta penndrag. Han samlade över 6 000 målningar och tusentals antika bronser i kataloger, grundade en statlig målarakademi med examen, och lät bygga en jättelik trädgård i Kaifeng med sällsynta stenar som fraktades från hela riket – en dyrbar och illa omtyckt verksamhet.

    Som härskare var han en katastrof. Han lät rådgivare som Cai Jing styra, och ingick 1120 en allians med Jurchen-folket i norr mot Liao-riket (se [Jurchen grundar Jin 1115](#jurchen-grundar-jin-1115)). När Jurchen märkte att Songs armé var svag vände de sig mot Song själva. Huizong abdikerade i panik 1125, och [1127 erövrade Jurchen Kaifeng](#jin-erovrar-kaifeng-1127) och förde honom och hans son i fångenskap till Manchuriet, där han dog 1135. Song flydde söderut och fick [ny huvudstad i Hangzhou](#sodra-song-med-hangzhou).

jurchen-grundar-jin-1115:
  period: 1100
  label: "Jurchen grundar Jin 1115"
  title: "Jurchen grundar Jin-dynastin 1115"
  wiki:
    - "en:Jin dynasty (1115–1234)"
    - "en:Jurchen people"
  text: |
    **Jurchen** var ett folk i Manchuriet (nordöstra Kina) som levde av jakt, fiske, jordbruk och hästuppfödning. De var underställda **Liao-riket**, en stat som skapats av khitan-folket och som styrde Mongoliet, Manchuriet och nordligaste Kina (ordet ”Kina” på ryska, *Kitaj*, kommer från khitan).

    1115 utropade jurchenledaren **Aguda** en egen dynasti, **Jin** (”guld”). Med en armé av ryttare – kanske bara 20 000 vid starten – krossade han Liao, vars huvudstäder föll 1120–1122. Song-Kina, som hade allierat sig med Jurchen för att få tillbaka områden som Liao tagit, upptäckte att den nya grannen var farligare. [1127 tog Jin Songs huvudstad Kaifeng](#jin-erovrar-kaifeng-1127) och tillfångatog två kejsare (se [Kejsar Huizong](#kejsar-huizong-konst)).

    Därefter var Kina uppdelat i över hundra år: Jin i norr och Södra Song i söder, med gräns längs floden Huai. Jin antog snabbt kinesisk förvaltning. Resterna av Liao-eliten flydde västerut och grundade Kara Khitai i Centralasien (se [Sultan Sanjar](#sultan-sanjar)). [Jin föll till mongolerna 1234](#mongoler-krossar-xi-xia-1227-och-jin). Jurchens ättlingar, manchuerna, erövrade hela Kina 1644 och grundade Qing, landets sista dynasti.

jin-erovrar-kaifeng-1127:
  period: 1120
  label: "Jin erövrar Kaifeng 1127"
  title: "Jin erövrar Kaifeng 1127"
  wiki:
    - "en:Jingkang incident"
    - "sv:Jindynastin"
    - "en:Kaifeng"
  text: |
    [Songdynastin](#songdynastin) (960–1279) styrde Kina under en period av stark ekonomisk och teknisk utveckling. Men i norr fanns folk som Song inte kunde besegra militärt. **Jurchen**, ett folk från Manchuriet, [grundade 1115 riket](#jurchen-grundar-jin-1115) **Jin** och störtade 1125 det tidigare nordriket Liao – med stöd från Song, som hoppades återfå förlorade områden.

    Alliansen slog tillbaka. Jin vände sig mot Song och erövrade 1127 huvudstaden **Kaifeng**, troligen världens största stad med uppskattningsvis omkring en miljon invånare. Den förre kejsaren **[Huizong](#kejsar-huizong-konst)** – en framstående målare och kalligraf men svag härskare – och hans son, den regerande kejsaren, fördes bort till norr tillsammans med tusentals av hovets medlemmar. De dog i fångenskap. Händelsen kallas Jingkang-katastrofen efter regeringsperioden.

    Song förlorade hela norra Kina men en överlevande prins grundade [Södra Song](#sodra-song-med-hangzhou) med huvudstad i Hangzhou (se dit). Kina var därefter delat i ett nordligt och ett sydligt rike i över hundra år, tills mongolerna erövrade båda (Jin 1234, Song 1279).

sodra-song-med-hangzhou:
  period: 1120
  label: "Södra Song med Hangzhou"
  title: "Södra Song och Hangzhou"
  wiki:
    - "sv:Songdynastin"
    - "en:Hangzhou"
  text: |
    Efter att Jin-riket [erövrat norra Kina och huvudstaden Kaifeng 1127](#jin-erovrar-kaifeng-1127) (se dit) utropade sig en överlevande prins till kejsare **Gaozong** i södra Kina. Efter några år på flykt gjorde han **Hangzhou** vid Yangtzedeltat till huvudstad (1138). Perioden fram till 1279 kallas **Södra Song**.

    Trots att riket bara hade ungefär halva Kina blev det ett av de mest avancerade samhällena i världen. Södra Kina var rikt på ris, och nya tidigmogna rissorter gav två skördar per år. Staten gav ut [papperspengar](#statliga-papperspengar-jiaozi-1024) i stor skala (sedlar hade börjat användas i Song på 1000-talet, århundraden före Europa). Sjöhandeln med Sydostasien, Indien och Arabien blomstrade, med hjälp av [kompass](#kompass-i-sjofart) och stora fartyg med vattentäta skott.

    Hangzhou hade troligen över en miljon invånare – mer än tio gånger så många som någon europeisk stad. Marco Polo beskrev den på 1200-talet som världens finaste stad. Södra Song [föll till slut för mongolerna under Kublai khan 1279](#song-faller-1279). För jämförelse: Europas största städer omkring 1200, som Paris och Venedig, hade kanske 50 000–100 000 invånare.

fred-songjin-1142:
  period: 1140
  label: "Fred Song–Jin 1142"
  title: "Freden mellan Song och Jin 1142"
  wiki:
    - "en:Treaty of Shaoxing"
    - "en:Jin–Song wars"
  text: |
    Efter att Jin-riket (grundat av jurchen-folket från Manchuriet) erövrat norra Kina 1127 (se [Jin erövrar Kaifeng](#jin-erovrar-kaifeng-1127)) fortsatte kriget i femton år. Södra Song-rikets generaler, framför allt **[Yue Fei](#yue-fei-avrattas)**, vann flera segrar och kunde ha gått vidare norrut.

    Men kejsare Gaozong och hans kansler **Qin Hui** ville ha fred. 1141–42 slöts Shaoxing-fredsavtalet. Gränsen drogs längs floden Huai, mellan Gula floden och Yangtze – Jin fick hela norra Kina. Song erkände sig som vasall (underordnad) till Jin och skulle årligen betala 250 000 silver-taels (en tael är drygt 35 gram, alltså omkring 9 ton silver) och 250 000 balar siden. Som en del av uppgörelsen avrättades Yue Fei (se dit).

    Avtalet var förödmjukande men för Song i praktiken billigt: summan var en liten del av statens inkomster, och freden gav utrymme för en ekonomisk blomstring i söder. Gränsen höll med några avbrott i ungefär 70 år. Jämför med hur Bysans ofta köpte fred med betalningar till grannfolk. Både Jin och Song föll till slut för mongolerna, [Jin 1234](#mongoler-krossar-xi-xia-1227-och-jin) och Song 1279. Jämför med [freden i Shanyuan 1005](#fred-i-shanyuan-med-liao-1005), där Song också köpte fred.

yue-fei-avrattas:
  period: 1140
  label: "Yue Fei avrättas"
  title: "Yue Fei avrättas 1142"
  wiki:
    - "sv:Yue Fei"
    - "en:Qin Hui"
  text: |
    **Yue Fei** (1103–1142) var general i Södra Song-riket och den som ledde de mest framgångsrika motangreppen mot Jin-riket, som [erövrat norra Kina 1127](#jin-erovrar-kaifeng-1127). Han kom från en enkel bondefamilj; enligt legenden tatuerade hans mor orden ”tjäna landet med yttersta lojalitet” på hans rygg. Hans armé var känd för disciplin.

    År 1140 besegrade han Jin-trupper vid Yancheng och närmade sig den gamla huvudstaden Kaifeng. Men kejsare Gaozong och kanslern **Qin Hui** ville förhandla fram fred. Yue Fei beordrades att dra sig tillbaka, enligt traditionen genom tolv brådskande order samma dag. Han lydde, men fängslades på falska anklagelser om förräderi och avrättades i januari 1142 (enligt kinesisk kalender i slutet av 1141), 39 år gammal. Hans död var i praktiken en del av fredsuppgörelsen med Jin (se [Fred Song–Jin 1142](#fred-songjin-1142)).

    Yue Fei rehabiliterades efter 20 år och blev i eftervärlden Kinas främsta symbol för lojalitet och patriotism. Vid hans grav i [Hangzhou](#sodra-song-med-hangzhou) finns järnstatyer av Qin Hui och hans fru knäböjande i skam; besökare spottade traditionellt på dem. Historien används fortfarande i kinesisk populärkultur och nationalistisk retorik.

kompass-i-sjofart:
  period: 1160
  label: "Kompass i sjöfart"
  title: "Kompassen till sjöss i Kina"
  wiki:
    - "sv:Kompass"
    - "en:History of the compass"
  text: |
    Kineserna hade länge känt till att en magnetiserad nål ställer in sig i nord–sydlig riktning. Den användes först för spådom och geomanti (fengshui, läran om hur byggnader ska placeras i landskapet). Den äldsta säkra beskrivningen av en kompass med magnetiserad nål finns hos [Shen Kuo omkring 1088](#kompassen-beskrivs-shen-kuo-1088), och omkring 1117 beskriver Zhu Yu hur sjömän i Guangzhou använde den när himlen var mulen.

    Under [Songdynastin](#songdynastin) (960–1279) blev kompassen ett vanligt navigationsinstrument. Den gjorde det möjligt att segla över öppet hav utan att se stjärnor eller kust, vilket ökade säkerheten för den stora handeln mot Sydostasien, Indien och Arabien.

    Kompassen dyker upp i europeiska texter omkring 1190 ([Alexander Neckam](#kompassen-namns-i-europa-neckam-1190), se denna) och i arabiska källor ungefär samtidigt. Om den spreds från Kina eller uppfanns igen är omdiskuterat. Tillsammans med bättre skepp och sjökort var den en förutsättning för de europeiska upptäcktsresorna på 1400-talet – jämför med satellitnavigering (GPS) i dag: en teknik som gör en hel typ av resande säker.

song-flotta:
  period: 1160
  label: "Song-flotta"
  title: "Songdynastins flotta"
  wiki:
    - "en:Song dynasty"
    - "en:Battle of Caishi"
  text: |
    [Songdynastin](#songdynastin) styrde Kina 960–1279. [1127 förlorade den hela norra Kina](#jin-erovrar-kaifeng-1127) till jurchenfolkets Jinrike och flydde söderut, med ny huvudstad i Hangzhou. Kvar fanns ”Södra Song”, ett rikt men militärt utsatt land där floden Yangtze blev försvarslinjen. Därför byggde man upp Kinas första permanenta stående flotta, grundad 1132.

    Flottan använde hjulbåtar drivna med trampkraft (människor som trampade skovelhjul), och [tidiga krutvapen](#krut-i-vapen) som brandbomber kastade med katapult. Vid slaget vid Caishi 1161 stoppade en mindre Songflotta en mycket större Jinarmé som försökte ta sig över Yangtze; källorna anger tiotusentals man, men siffrorna är osäkra.

    Flottan och den livliga sjöhandeln gjorde Södra Song till en av världens mest kommersiella ekonomier. Den räckte dock inte mot mongolerna, som byggde egen flotta och vann det sista [slaget vid Yamen 1279](#song-faller-1279) – då Song föll och Kina blev en del av Mongolväldet.

zhu-xi-nykonfucianism:
  period: 1180
  label: "Zhu Xi: nykonfucianism"
  title: "Zhu Xi och nykonfucianismen"
  wiki:
    - "sv:Zhu Xi"
    - "sv:Nykonfucianism"
  text: |
    **Konfucianismen** är den etiska och politiska lära som går tillbaka på Konfucius (ca 551–479 f.Kr.) och handlar om plikter, ordning, utbildning och goda relationer mellan härskare och undersåtar, föräldrar och barn. Efter Handynastin hade buddhismen och daoismen fått stort inflytande i Kina, eftersom de gav svar på frågor om världens natur och själen som konfucianismen saknade.

    **Zhu Xi** (1130–1200), verksam under [Songdynastin](#songdynastin), sammanfogade tidigare tänkares idéer till ett helt system, *nykonfucianismen*. Den förklarar världen med två begrepp: *li*, den ordnande principen i allt, och *qi*, materien eller livskraften. Genom studier och självdisciplin kan människan förstå principen och bli moraliskt god. Han valde ut fyra klassiska texter, ”De fyra böckerna”, och skrev kommentarer till dem.

    Från 1313 till 1905 var Zhu Xis kommentarer grunden för Kinas statliga [ämbetsmannaprov](#ambetsmannaexamina), alltså i nästan 600 år. Hans lära blev också statsideologi i Korea ([Joseondynastin](#korea-joseon-1392)) och mycket inflytelserik i Japan under Tokugawa. Den formade hela Östasiens syn på utbildning och hierarki.

gula-floden-byter-lopp-1194:
  period: 1180
  label: "Gula floden byter lopp 1194"
  title: "Gula floden byter lopp 1194"
  wiki:
    - "sv:Gula floden"
    - "en:Course of the Yellow River"
  text: |
    **Gula floden** (Huang He), cirka 5 500 km lång, är Kinas näst längsta flod och den nordkinesiska civilisationens vagga. Den bär enorma mängder slam från lössplatån, som avsätts på botten. Därför ligger flodbädden på slätten ofta högre än marken omkring, hållen på plats av vallar. När en vall brister kan floden ta en helt ny väg.

    1194 bröt floden igenom vallarna vid Yangwu och började rinna söderut in i floden Huai, och mynnade därmed söder om Shandonghalvön i stället för norr om den – en förflyttning av mynningen med flera hundra kilometer. Området var vid denna tid [gräns mellan Jinriket i norr och Södra Song](#fred-songjin-1142).

    Förändringen gav återkommande översvämningar och förstörde Huaiflodens avrinning i århundraden. Floden låg kvar i den södra fåran till 1855, då den återigen bytte till en nordlig väg. Gula floden har kallats ”Kinas sorg”: översvämningen 1887 och den avsiktliga vallgenombrytningen 1938 krävde var för sig hundratusentals liv.

mongoler-anfaller-jin-1211:
  period: 1200
  label: "Mongoler anfaller Jin 1211"
  title: "Mongolerna anfaller Jinriket 1211"
  wiki:
    - "en:Mongol conquest of the Jin dynasty"
    - "en:Jin dynasty (1115–1234)"
  text: |
    Norra Kina styrdes sedan 1127 av **Jinriket**, grundat av jurchenfolket från Manchuriet, medan [Songdynastin](#songdynastin) höll södra Kina. Jin hade uppskattningsvis 40–50 miljoner invånare och en stor armé och hade länge spelat ut mongoliska stammar mot varandra.

    1211 anföll [Djingis khan](#djingis-khan-1206) med en armé på uppskattningsvis 65 000–100 000 ryttare. Vid passet Yehuling besegrades en mycket större Jinarmé. Mongolerna var ännu dåliga på belägringar, men lärde sig av kinesiska och muslimska ingenjörer. 1215 föll huvudstaden **Zhongdu** (dagens Peking) efter belägring och plundrades och brann. Jin flyttade huvudstaden söderut till Kaifeng.

    Erövringen av Jin avbröts när Djingis vände sig mot [Khwarezm 1219](#krossar-khwarezm-1219) och fullbordades först 1234 av hans son Ögedei. Befolkningen i norra Kina föll drastiskt under dessa decennier, men hur mycket som berodde på död och hur mycket på flykt och sämre folkräkning är omstritt. [Södra Song föll till mongolerna 1279](#song-faller-1279).

mongoler-krossar-xi-xia-1227-och-jin:
  period: 1220
  label: "Mongoler krossar Xi Xia 1227 och Jin 1234"
  title: "Mongolerna krossar Xi Xia och Jin"
  wiki:
    - "en:Western Xia"
    - "en:Jin dynasty (1115–1234)"
    - "en:Mongol conquest of the Jin dynasty"
  text: |
    Kring 1200 var dagens Kina delat i flera riken. I nordväst låg **Xi Xia** (Västra Xia), styrt av tangutfolket, med egen skrift och buddhistisk kultur. I norr låg **Jinriket**, grundat av jurchenfolket från Manchuriet, som 1127 tagit norra Kina från Songdynastin. Songdynastin höll södra Kina (se ”[Song faller 1279](#song-faller-1279)”).

    Xi Xia hade varit mongolernas vasall men vägrade ställa upp med trupper. Djingis khans arméer krossade riket 1227, samma år som han dog, och genomförde massakrer; tangutfolket och dess kultur försvann nästan helt som självständig enhet. Mot Jin förde mongolerna krig från 1211 – Peking (då Zhongdu) föll redan 1215. Jin föll slutligen 1234 sedan mongolerna, i allians med Song, intagit huvudstaden Kaifeng 1233. Den siste kejsaren tog livet av sig.

    Förlusterna var enorma. Skattelängderna i norra Kina sjönk från omkring 40–50 miljoner registrerade personer till runt 10 miljoner. En del av minskningen beror på att förvaltningen kollapsade och folk flydde, men krig, svält och epidemier dödade miljoner. Direkt efter Jins fall vände mongolerna sig mot Song – ett krig som skulle ta 45 år.

kublai-erovrar-yunnan:
  period: 1240
  label: "Kublai erövrar Yunnan"
  title: "Kublai erövrar Dali (Yunnan) 1253"
  wiki:
    - "en:Mongol conquest of the Dali Kingdom"
    - "en:Dali Kingdom"
  text: |
    På 1250-talet förberedde mongolerna sitt stora angrepp på Songdynastin i södra Kina. Song var välförsvarat med floder, befästa städer och en flotta. Storkhanen Möngke valde därför att omringa det, och sände sin bror **Kublai** mot **kungadömet Dali** i Yunnan, sydvästra Kina – ett bergigt land med bl.a. bai- och yifolk, som varit självständigt i drygt 300 år.

    1253 marscherade Kublai genom svår bergsterräng och tog huvudstaden Dali. Han skonade invånarna, på råd av sina kinesiska rådgivare, och lät den gamla kungafamiljen fortsätta som lokala förvaltare. Det var en tidig signal om hans styrelsesätt: han lyssnade på kinesiska lärda och förstod att ett jordbrukssamhälle var mer värt levande än ödelagt.

    Erövringen hade två följder. Yunnan, som aldrig tidigare varaktigt tillhört ett kinesiskt rike, blev en del av Kina och har varit det sedan dess. Och mongolerna kunde nu angripa Song också från sydväst, och slå mot Vietnam (som gjorde motstånd). Kublai blev storkhan 1260 och grundade Yuandynastin 1271 (se ”[Kublai khan: Yuan 1271](#kublai-khan-yuan-1271)”).

kublai-khan-yuan-1271:
  period: 1260
  label: "Kublai khan: Yuan 1271"
  title: "Kublai khan grundar Yuandynastin 1271"
  wiki:
    - "sv:Khubilai khan"
    - "sv:Yuandynastin"
  text: |
    **Kublai khan** (1215–1294) var sonson till Djingis khan. Han blev storkhan 1260 och vann sedan ett inbördeskrig mot sin bror Ariq Böke. Till skillnad från tidigare mongoliska ledare hade han länge levt i norra Kina och omgav sig med kinesiska rådgivare.

    1271 utropade han en ny kinesisk dynasti, **Yuan** (”ursprunget”), efter mönster av tidigare kejsardynastier. Han flyttade huvudstaden från Karakorum i Mongoliet till Dadu, ”den stora huvudstaden”, nybyggd där Peking ligger idag. Det är början på Pekings ställning som Kinas huvudstad. Han erövrade Songdynastin i söder 1279 (se ”[Song faller 1279](#song-faller-1279)”) och styrde därmed hela Kina – det första enade Kina sedan 900-talet.

    Yuan var både kinesisk och mongolisk. Kublai använde pappersmynt i stor skala (Marco Polo beskrev det förvånat), byggde ut Kejsarkanalen till Peking och främjade handel. Men befolkningen delades in i fyra klasser med mongoler överst och sydkineser underst. Hans försök att erövra Japan (1274, 1281), Vietnam och Java misslyckades. Dynastin föll 1368 efter inflation, översvämningar och uppror, och ersattes av Mingdynastin.

song-faller-1279:
  period: 1260
  label: "Song faller 1279"
  title: "Songdynastins fall 1279"
  wiki:
    - "sv:Songdynastin"
    - "en:Battle of Yamen"
    - "en:Battle of Xiangyang"
  text: |
    **Songdynastin** (960–1279) styrde Kina under en period av stor ekonomisk och teknisk utveckling: tryckning med lösa typer ([Bi Sheng, ca 1040](#bi-sheng-losa-typer-1040)), magnetkompass i sjöfart, krut i krigföring, pappersmynt och en befolkning som kring år 1200 kan ha nått 100 miljoner eller mer. Från 1127 höll Song bara södra Kina (*Södra Song*), med huvudstad i Hangzhou, en av världens största städer.

    Mongolernas krig mot Song pågick från 1235 och var deras svåraste. Södra Kina var kuperat, fullt av floder och risfält där kavalleri inte kom fram, och Song hade starka befästningar och en flotta. Avgörande blev belägringen av tvillingstäderna **Xiangyang och Fancheng** vid Hanfloden 1268–1273, ungefär fem år. Mongolerna fick hjälp av muslimska ingenjörer från Ilkhanatet som byggde motviktskatapulter (*trebucheter*) som kunde kasta stenar på uppskattningsvis 100 kg.

    Hangzhou kapitulerade 1276. Rester av hovet flydde söderut med en barnkejsare. I sjöslaget vid **Yamen** (nära dagens Hongkong) i mars 1279 förlorade Songs flotta; enligt traditionen hoppade ministern Lu Xiufu i havet med den 8-årige kejsaren på ryggen. Det var första gången hela Kina styrdes av ett främmande folk. Jämför med [Mingdynastin som 1368](#mingdynastin-1368) drev ut mongolerna, och [manchuerna (Qing)](#qing-manchuer) som tog Kina 1644.

marco-polo-hos-kublai:
  period: 1280
  label: "Marco Polo hos Kublai"
  title: "Marco Polo hos Kublai khan"
  wiki:
    - "sv:Marco Polo"
    - "en:Kublai Khan"
  text: |
    **Marco Polo** (1254–1324) var en köpman från Venedig. 1271 reste han, 17 år gammal, med sin far och farbror österut längs **sidenvägen** – handelsvägarna genom Centralasien. Resan tog uppskattningsvis tre och ett halvt år. Han stannade i Kina i ungefär 17 år och återvände 1295 sjövägen via Sumatra och Indien.

    I Kina tjänade han **Kublai khan**, Djingis khans sonson, som hade erövrat hela Kina och grundat Yuan-dynastin ([se 1300](#kublai-khan-yuan-1271)). Kublai styrde från Khanbaliq, dagens Peking, och anställde gärna utlänningar eftersom han misstrodde kineserna. Att resan alls gick att göra berodde på den ”[mongoliska freden](#pax-mongolica-oppnar-sidenvagen)”: för första gången kontrollerades hela vägen från Svarta havet till Stilla havet av samma familj.

    Hemma hamnade Polo i krigsfångenskap i Genua och berättade då om resan för en medfånge, som skrev boken *Il Milione*. Den beskrev papperspengar, kolbrytning, postsystem och jättelika städer – sådant som lät som skryt i Europa. En del forskare har ifrågasatt om han alls var i Kina, men de flesta anser detaljerna för träffsäkra. Boken inspirerade senare [Columbus](#columbus-1492).

yuan:
  period: 1300
  label: "Yuan"
  title: "Yuan-dynastin (1271–1368)"
  wiki:
    - "sv:Yuandynastin"
    - "en:Yuan dynasty"
  text: |
    **Yuan** var den dynasti som mongolerna grundade i Kina. Kublai khan, Djingis khans sonson, [utropade den 1271](#kublai-khan-yuan-1271) och fullbordade erövringen av södra Kina, som styrdes av Song-dynastin, 1279. Det var första gången hela Kina styrdes av ett främmande folk. Huvudstaden blev Khanbaliq, dagens Peking.

    Omkring 1300 var Kina en del av världens största sammanhängande imperium. Mongolerna införde ett etniskt rangsystem: mongoler överst, sedan centralasiater och muslimer (som ofta fick bli skatteindrivare och ämbetsmän), sedan nordkineser och längst ner sydkineserna. De kinesiska tjänstemannaexamina, som urvalet av ämbetsmän byggt på i århundraden, avskaffades och återinfördes först 1315 i begränsad form.

    Samtidigt gav mongolerna fri handel: papperspengar användes i hela riket (vilket förvånade [Marco Polo](#marco-polo-hos-kublai)), Kejsarkanalen förlängdes till Peking och kontakterna med Iran och Europa var livliga. Kinesisk teater blomstrade. Men från 1320-talet drabbades landet av svält, översvämningar och pest ([se 1320](#svalt-och-oversvamningar)). Hyperinflation av pappersvalutan och uppror följde, och 1368 drevs mongolerna ut och [Ming-dynastin](#mingdynastin-1368) tog över.

svalt-och-oversvamningar:
  period: 1320
  label: "Svält och översvämningar"
  title: "Svält och översvämningar i Yuan-Kina"
  wiki:
    - "en:Yuan dynasty"
    - "en:Red Turban Rebellions"
  text: |
    Från 1320-talet och framåt drabbades Kina under den mongoliska **Yuan-dynastin** ([se Yuan](#yuan)) av en lång rad naturkatastrofer: torka, gräshoppor, svält och framför allt översvämningar längs **Gula floden**. Floden bär så mycket slam att botten höjs och den lätt bryter igenom vallarna; den har bytt lopp flera gånger i historien och kallas ”Kinas sorg”. Kinesiska källor talar om miljontals döda, men siffrorna är osäkra.

    Samtidigt var regeringen svag: mellan 1328 och 1333 hade riket flera kejsare, med hovstrider och mord. Statens papperspengar trycktes i allt större mängder, vilket gav kraftig inflation. När staten 1351 tvingade uppskattningsvis 150 000 arbetare att reparera Gula flodens vallar blev det gnistan till stora uppror. Det har också föreslagits att pesten fanns i Kina vid denna tid, men det är omstritt.

    Katastroferna tolkades enligt kinesisk tradition som tecken på att dynastin förlorat *himlens mandat* – tanken att en härskare styr med himlens godkännande, som kan dras tillbaka. De så kallade [Röda turbanernas uppror](#roda-turbanernas-uppror-1351) ledde till att Zhu Yuanzhang, en fattig bondson och före detta munk, drev ut mongolerna och grundade [Ming-dynastin 1368](#mingdynastin-1368). Jämför med [Europas stora svält 1315–17](#stora-svalten-131517).

roda-turbanernas-uppror-1351:
  period: 1340
  label: "Röda turbanernas uppror 1351"
  title: "Röda turbanernas uppror 1351"
  wiki:
    - "en:Red Turban Rebellions"
    - "sv:Yuandynastin"
  text: |
    Kina styrdes sedan 1271 av den mongoliska **Yuandynastin**, grundad av Kublai khan, sonson till Djingis khan. Mongolerna var en liten härskande minoritet, och på 1340-talet var styret försvagat av maktstrider, inflation (Yuan använde papperspengar och tryckte för mycket) och naturkatastrofer. [Gula floden svämmade över](#svalt-och-oversvamningar) och bytte lopp, vilket ledde till svält.

    År 1351 kallade regeringen in uppskattningsvis 150 000 arbetare för att leda om floden. Bland dem spreds uppror, organiserade av en buddhistisk sekt, **Vita lotus**, som förkunnade att Maitreya, en framtida Buddha, skulle komma och upprätta en rättvis värld. Rebellerna bar röda huvudbonader och kallades därför Röda turbanerna. Upproret spred sig över stora delar av södra och mellersta Kina.

    Ur kaoset steg en fattig bondson och före detta munk, **Zhu Yuanzhang**, som byggde upp en egen armé, slog ut rivaliserande rebelledare och 1368 drev mongolerna ut ur Peking. Han grundade **Mingdynastin** ([se 1368](#mingdynastin-1368)). Det är ett av få fall där en person av enkel härkomst blev kejsare av Kina.

mingdynastin-1368:
  period: 1360
  label: "Mingdynastin 1368"
  title: "Mingdynastin grundas 1368"
  wiki:
    - "sv:Mingdynastin"
    - "sv:Hongwu"
  text: |
    År 1368 drev rebelledaren **Zhu Yuanzhang** den mongoliska [Yuandynastin](#yuan) ut ur Peking ([se Röda turbanernas uppror 1351](#roda-turbanernas-uppror-1351)) och utropade sig till kejsare med regeringsnamnet **Hongwu**. Han var son till fattiga bönder och hade varit tiggarmunk när hans familj dog av svält och epidemi – en av få kinesiska kejsare av så enkel härkomst. Dynastin han grundade kallades **Ming**, ”den lysande”, och styrde Kina i 276 år, till 1644.

    Hongwu ville återställa ett ordnat, självförsörjande bondesamhälle efter mongoltiden. Han lät räkna befolkningen och kartlägga jorden – folkräkningen 1393 gav omkring 60 miljoner invånare, troligen en underskattning. Han var också misstänksam och brutal: i flera utrensningar avrättades uppskattningsvis tiotusentals ämbetsmän och deras familjer, och han avskaffade posten som kansler för att själv styra allt.

    Under Ming byggdes mycket av den **kinesiska muren** vi ser idag, [Förbjudna staden](#forbjudna-staden-byggs) i Peking uppfördes (1406–1420), och [amiralen Zheng He](#zheng-hes-flottor-140533) seglade med enorma flottor till Östafrika (1405–1433). Jämför: Kina hade vid denna tid ungefär lika många invånare som hela Europa.

ming:
  period: 1380
  label: "Ming"
  title: "Mingdynastin under Hongwu, 1380–1398"
  wiki:
    - "sv:Mingdynastin"
    - "sv:Hongwu"
  text: |
    Kina styrdes under 1380- och 90-talen av **Mingdynastins** grundare, kejsar **Hongwu** (Zhu Yuanzhang), en fattig bondson som tagit makten 1368 efter mongolernas fall ([se 1368](#mingdynastin-1368)). Han byggde upp en stark centralmakt i huvudstaden Nanjing.

    År 1380 avrättade han sin kansler Hu Weiyong, anklagad för en sammansvärjning, och avskaffade sedan kanslersämbetet helt. Utrensningarna efter detta, och efter en senare påstådd konspiration 1393, krävde uppskattningsvis 30 000–40 000 människors liv. Kejsaren styrde nu själv alla ministerier – ett system som gjorde Mingkina beroende av kejsarens personliga förmåga, och som längre fram gav eunucker vid hovet stor makt. Han lät också föra jordregister och folkregister; folkräkningen 1393 gav omkring 60 miljoner invånare.

    Hongwu förbjöd privat utrikeshandel till sjöss (*haijin*, ”havsförbudet”) för att stoppa pirater och kontrollera kontakter med omvärlden. När han dog 1398 utbröt ett inbördeskrig, som hans son **Yongle** vann 1402. Yongle flyttade huvudstaden till Peking, byggde [Förbjudna staden](#forbjudna-staden-byggs) och skickade [Zheng He:s flottor](#zheng-hes-flottor-140533) till Indiska oceanen.

zheng-hes-flottor-140533:
  period: 1400
  label: "Zheng Hes flottor 1405–33"
  title: "Zheng Hes skattflottor 1405–1433"
  wiki:
    - "sv:Zheng He"
    - "en:Ming treasure voyages"
    - "en:Yongle Emperor"
  text: |
    Kejsaren **Yongle** (styrde 1402–1424) i Mingdynastin hade tagit makten genom en blodig kupp mot sin brorson. För att visa sin legitimitet utåt skickade han ut sju jätteexpeditioner under eunucken **Zheng He**. Den första flottan 1405 hade enligt källorna 317 fartyg och nästan 28 000 man.

    De största ”skattskeppen” beskrivs i senare källor som cirka 120 meter långa; moderna forskare tror snarare på 60–75 meter, men även det är mycket större än Columbus *Santa María* (cirka 20–25 meter). Resorna gick till Sydostasien, Indien, Persiska viken, Arabien och Östafrika.

    Syftet var inte erövring eller handel i europeisk mening, utan **tributsystemet**: främmande härskare skulle erkänna kejsaren som överhuvud och skicka gåvor, mot att de fick ännu dyrare gåvor tillbaka och rätt att handla. Flottan ingrep ibland militärt, t.ex. på Sri Lanka 1411.

    Efter Yongles död minskade intresset, och 1433 tog resorna slut ([se Ming upphör med flottexpeditionerna](#ming-upphor-med-flottexpeditionerna-1433)). Jämför: [Columbus seglade 1492](#columbus-1492) med tre fartyg och cirka 90 man.

forbjudna-staden-byggs:
  period: 1400
  label: "Förbjudna staden byggs"
  title: "Förbjudna staden byggs 1406–1420"
  wiki:
    - "sv:Förbjudna staden"
    - "en:Yongle Emperor"
  text: |
    **Förbjudna staden** är det kejserliga palatset i Peking. Den kallas så eftersom vanligt folk inte fick gå in utan kejsarens tillstånd. Den byggdes 1406–1420 på order av kejsaren **Yongle** i Mingdynastin, som flyttade huvudstaden från Nanjing i söder till Peking i norr – hans gamla maktbas och närmare den mongoliska gränsen som var Kinas största hot.

    Anläggningen täcker cirka 72 hektar, omgiven av en tio meter hög mur och en vallgrav, och har omkring 900–1000 byggnader. Traditionella uppgifter talar om uppemot en miljon arbetare, men siffran är osäker. Stockar av värdefullt trä fraktades från sydvästra Kina, tusentals kilometer bort, delvis via Kejsarkanalen.

    Palatset var kejsarnas säte i nästan 500 år, för 24 kejsare under Ming- och Qingdynastierna, fram till att den siste kejsaren Puyi abdikerade 1912. I dag är det museum med uppemot 15–17 miljoner besökare om året.

    Samtidigt pågick [Zheng Hes flottexpeditioner](#zheng-hes-flottor-140533) – båda var uttryck för en kejsare som ville visa makt i en enorm skala.

ming-upphor-med-flottexpeditionerna-1433:
  period: 1420
  label: "Ming upphör med flottexpeditionerna 1433"
  title: "Ming avslutar flottexpeditionerna 1433"
  wiki:
    - "en:Ming treasure voyages"
    - "en:Haijin"
  text: |
    [Zheng Hes sjunde och sista expedition](#zheng-hes-flottor-140533) kom hem 1433 (Zheng He själv dog troligen under resan). Därefter skickade Kina inga fler stora flottor. Under de följande årtiondena minskades flottan kraftigt, och senare under 1400- och 1500-talen begränsades bygget av stora havsgående fartyg.

    Orsakerna var flera. Resorna var mycket dyra och gav inga direkta inkomster – de var prestigeprojekt för kejsaren Yongle, som dog 1424. Den konfucianska ämbetsmannaklassen (de examinerade tjänstemännen som styrde riket) var emot dem och såg dem som eunuckernas slöseri. Hotet från mongolerna i norr krävde pengar till armén och senare till Kinesiska muren. Och Kinesiska kejsarkanalen hade rustats upp, så att spannmål kunde fraktas inrikes istället för längs kusten.

    Därtill gällde sedan 1370-talet ett **sjöfartsförbud** (*haijin*) för privat utrikeshandel, för att stoppa pirater. Handeln fortsatte ändå, men ofta illegalt.

    Beslutet brukar ses som en vändpunkt: bara 50–60 år senare började Portugal och Spanien sina oceanresor. Historiker varnar dock för att överdriva – Kina var fortfarande världens största ekonomi i flera hundra år till.

tumu-krisen-1449-kejsaren-tillfangatas:
  period: 1440
  label: "Tumu-krisen 1449: kejsaren tillfångatas"
  title: "Tumu-krisen 1449"
  wiki:
    - "en:Tumu Crisis"
    - "en:Zhengtong Emperor"
  text: |
    Efter att [mongolerna jagats ut ur Kina 1368](#mingdynastin-1368) fortsatte mongoliska stammar norr om muren att vara Mingdynastins största hot. På 1440-talet enade ledaren **Esen** från oiraterna (västmongoler) stora delar av stäppen. Konflikter om handel och tribut ledde till att han anföll 1449.

    Kejsaren **Zhengtong**, då 22 år, leddes av sin mäktige eunuck och rådgivare **Wang Zhen** att själv leda ett fälttåg. Armén var stor – uppgifterna talar om uppemot en halv miljon man, men siffran är troligen överdriven. Den var dåligt förberedd och försörjd. Vid poststationen **Tumu**, cirka 100 km nordväst om Peking, omringades den av Esens ryttare, som kanske var 20 000. Stora delar av armén förintades, Wang Zhen dödades och kejsaren tillfångatogs.

    I Peking utsåg man snabbt kejsarens bror till ny kejsare, så att Esen inte kunde utpressa hovet. Ministern Yu Qian organiserade försvaret av huvudstaden. Kejsaren släpptes 1450, sattes i husarrest och tog 1457 tillbaka tronen genom en kupp.

    Katastrofen gjorde Ming defensivt. Svaret blev att bygga ut **[Kinesiska muren](#muren-byggs-ut)** i den form vi ser i dag, mest under 1500-talet.

muren-byggs-ut:
  period: 1460
  label: "Muren byggs ut"
  title: "Mingdynastin bygger ut Kinesiska muren"
  wiki:
    - "en:Great Wall of China"
    - "en:Ming dynasty"
  text: |
    Kina styrdes 1368–1644 av **[Mingdynastin](#mingdynastin-1368)**, som hade drivit ut de mongoliska härskarna. Men mongolerna på stäppen i norr förblev ett hot. 1449 tillfångatogs till och med den kinesiske kejsaren själv av mongoler i [slaget vid Tumu](#tumu-krisen-1449-kejsaren-tillfangatas).

    Efter den chocken gick Ming över från offensiva fälttåg till försvar. På 1470-talet byggde generalen **Yu Zijun** en lång mur i Ordosregionen. Under följande hundra år byggdes muren ut kraftigt, och från mitten av 1500-talet i bränt tegel och sten. Det mesta av det som turister ser i dag, till exempel vid Badaling nära Peking, är från denna Ming-tid, inte från antiken.

    En kinesisk mätning 2009 kom fram till att Ming-murarna är ungefär 8 850 km långa, ungefär avståndet Stockholm–Peking i luftlinje. Muren hindrade inte alla räder, och [1644 släpptes manchuerna in](#ming-faller-1644) genom en port av en kinesisk general. Myten att muren syns från rymden med blotta ögat är falsk.

ming-2:
  period: 1480
  label: "Ming"
  same_as: ming

portugiser-i-kanton-1517:
  period: 1500
  label: "Portugiser i Kanton 1517"
  title: "Portugiserna når Kanton 1517"
  wiki:
    - "en:Tomé Pires"
    - "en:Battle of Tunmen"
    - "en:Portuguese Macau"
  text: |
    Efter att ha tagit Malacka 1511 ([se den](#portugiser-tar-malacka-1511)) sökte portugiserna handel med **Kina**, som då styrdes av **[Mingdynastin](#mingdynastin-1368)**. Ming förbjöd privat utrikeshandel; utländska länder fick bara skicka ”tributbeskickningar” där de erkände kejsarens överhöghet och fick gåvor i utbyte.

    1517 seglade Fernão Pires de Andrade till **Kanton** (Guangzhou) i södra Kina med en ambassadör, Tomé Pires, som efter lång väntan fick resa mot Peking. Men det gick illa: Malackas avsatte sultan var en kinesisk tributvasall och klagade på portugiserna, och en portugisisk kapten byggde ett fort utan tillstånd och uppträdde våldsamt. Kejsaren dog 1521, ambassaden fängslades, och kinesiska flottan drev ut portugiserna i strider 1521–22.

    Först på 1550-talet fick Portugal fäste i **[Macao](#portugiser-i-macao-1557)**, en halvö nära Kanton, där de fick handla mot avgift. Macao blev en mellanhand i handeln mellan Kina och Japan, särskilt med silver och siden, och förblev portugisiskt till 1999 – den sista europeiska kolonin i Asien, två år efter att Hongkong återlämnats.

wang-yangming:
  period: 1520
  label: "Wang Yangming"
  title: "Wang Yangming (1472–1529)"
  wiki:
    - "sv:Wang Yangming"
    - "en:Wang Yangming"
  text: |
    **Wang Yangming** var en kinesisk ämbetsman, general och filosof under Mingdynastin (1368–1644). Kinas statsideologi var då nykonfucianismen i den form Zhu Xi formulerat på 1100-talet: man nådde moralisk insikt genom att noggrant studera klassiska texter och tingen i världen – och det var dessa texter som examineringen för ämbetsmän byggde på.

    Wang hävdade i stället att den moraliska kunskapen redan finns i varje människas eget sinne, och att kunskap och handling är oskiljbara: att veta vad som är rätt utan att göra det är inte att veta. Han var också praktiskt verksam och slog bland annat ner ett stort uppror av en kunglig prins 1519 på några veckor.

    Hans lära blev mycket inflytelserik i Kina under 1500-talet, och senare i Japan, där den påverkade samurajer och reformatorerna kring Meijirestaurationen 1868. Jämför med den samtida [europeiska reformationen](#luther-95-teser-1517), där Luther också betonade individens inre övertygelse framför auktoriteter och lärda tolkningar.

portugiser-i-macao-1557:
  period: 1540
  label: "Portugiser i Macao 1557"
  title: "Portugiserna i Macao 1557"
  wiki:
    - "sv:Macao"
    - "en:Portuguese Macau"
  text: |
    Portugiserna [nådde Kina 1513](#portugiser-i-kanton-1517), men relationen blev dålig: Mingdynastins kejsare tillät bara handel i form av tribut från lydstater, och privat utrikeshandel var formellt förbjuden. Portugiserna betraktades länge som pirater.

    Omkring 1557 fick de ändå tillstånd att slå sig ner på halvön **Macao** vid Pärlflodens mynning, nära Kanton (Guangzhou). De betalade en årlig avgift och hjälpte enligt traditionen till mot pirater (se [wokou-pirater](#wokou-pirater)). Macao blev nav i en lukrativ handel: Kina ville ha silver men fick inte handla direkt med Japan, så portugiserna fraktade japanskt silver till Kina och kinesiskt siden till Japan. Det var också porten för jesuitmissionärer till Kina, som [Matteo Ricci 1582](#matteo-ricci-i-kina-1583).

    Macao förblev portugisiskt i över 440 år och lämnades tillbaka till Kina först 1999 – två år efter Hongkong – som den sista europeiska kolonin i Asien. Idag är det en särskild administrativ region känd för sina kasinon.

wokou-pirater:
  period: 1540
  label: "wokou-pirater"
  title: "Wokou-piraterna"
  wiki:
    - "en:Wokou"
    - "en:Haijin"
  text: |
    *Wokou* betyder ungefär ”japanska banditer” på kinesiska. Det var sjörövare som härjade längs Kinas och Koreas kuster, med en topp på 1550-talet. Trots namnet var många av dem, kanske de flesta under 1500-talet, kineser; de hade japanska, portugisiska och andra medhjälpare.

    Orsaken var Mingdynastins handelsförbud (*haijin*): privat sjöhandel med utlandet var förbjuden, men efterfrågan var enorm – Japan hade silver, Kina hade siden och porslin. Smugglingen blev därför storskalig och beväpnad. Ledare som Wang Zhi styrde hela flottor från baser i Japan. Under 1550-talet plundrades kuststäder i Zhejiang och Fujian, och tusentals dödades.

    Generaler som **Qi Jiguang** byggde nya arméer och slog tillbaka piraterna på 1560-talet. Den viktigare lösningen var dock politisk: 1567 lättade Mingdynastin på handelsförbudet och tillät privat handel från hamnen Yuegang. Kombinerat med det spanska silvret via Manila (se [Silver från Amerika via Manila](#silver-fran-amerika-via-manila)) blev Kina därefter ett centrum i världshandeln.

    Se även [Portugiser i Macao 1557](#portugiser-i-macao-1557), som växte fram ur samma förbjudna handel.

silver-fran-amerika-via-manila:
  period: 1560
  label: "Silver från Amerika via Manila"
  title: "Silver från Amerika till Kina via Manila"
  wiki:
    - "en:Manila galleon"
    - "en:Single whip reform"
  text: |
    Under Mingdynastin hade Kina stora problem med sitt penningsystem: pappersmynt hade tappat allt värde och kopparmynt räckte inte till. Silver blev det man faktiskt räknade i. På 1570–80-talen genomfördes ”en-piskreformen” (yi tiao bian fa), där skatter som tidigare betalats i varor och arbete slogs ihop och skulle betalas i silver. Kinas uppskattningsvis 150 miljoner invånare behövde därför enorma mängder silver – men Kina hade få egna gruvor.

    Silvret kom från Japan och, efter 1571, från spanska Amerika. Manilagaleonerna (se [Manila 1571](#manila-1571)) fraktade [silver från Potosí](#silver-fran-potosi-1545) och Mexiko över Stilla havet, där kinesiska handelsmän bytte det mot siden och porslin. I Kina var silver värt ungefär dubbelt så mycket i förhållande till guld som i Europa, så handeln var mycket lönsam. Uppskattningsvis en tredjedel till hälften av allt silver som bröts i Amerika hamnade till slut i Kina.

    Det var den första verkligt globala ekonomin: en gruvarbetare i Bolivia, en sidenvävare i Kina och en köpman i Sevilla var del av samma kedja. Beroendet hade också baksidor: när silverflödet sjönk på 1630-talet drabbades Kina av en kris som bidrog till [Mingdynastins fall 1644](#ming-faller-1644).

matteo-ricci-i-kina-1583:
  period: 1580
  label: "Matteo Ricci i Kina 1583"
  title: "Matteo Ricci i Kina 1583"
  wiki:
    - "sv:Matteo Ricci"
    - "en:Jesuit China missions"
  text: |
    **Matteo Ricci** (1552–1610) var en italiensk **jesuit** – medlem av den katolska orden [Jesu sällskap](#tridentinska-motet-jesuiter), grundad 1540, som satsade på utbildning och mission. Han kom till Kina 1583, under Mingdynastin, som i stort sett var stängd för utlänningar. Han lärde sig kinesiska, klädde sig som en konfuciansk lärd och anpassade kristendomen till kinesiska seder, till exempel genom att tillåta förfädersriter.

    Hans dörröppnare var vetenskap. Han ritade en världskarta på kinesiska (1602) som för många kineser blev första mötet med Amerika, översatte med den lärde Xu Guangqi Euklides geometri, och demonstrerade urverk och astronomi. 1601 fick han som förste europé bo i Peking.

    Ricci gjorde få konvertiter, men jesuiterna blev en kanal för kunskap åt båda hållen: de ledde senare det kinesiska kejserliga astronomiska ämbetet och spred i Europa kunskap om Kina och Konfucius. Påven förbjöd 1715 jesuiternas anpassning till kinesiska riter, och kejsaren svarade med att förbjuda missionen. Ricci begravdes i Peking med kejserlig tillåtelse, något exceptionellt för en utlänning.

    Jämför med [Francisco Xavier 1549](#francisco-xavier-1549), som försökte samma sak i Japan.

ming-forsvagas:
  period: 1600
  label: "Ming försvagas"
  title: "Mingdynastin försvagas"
  wiki:
    - "sv:Mingdynastin"
    - "en:Transition from Ming to Qing"
  text: |
    **Mingdynastin** styrde Kina 1368–1644. Kring 1600 var Kina världens folkrikaste land med uppskattningsvis 150–200 miljoner invånare – fler än hela Europa – och hade en blomstrande ekonomi baserad på silver (se [Manilagaleonerna](#manilagaleonerna-till-acapulco)). Men staten var i kris.

    Kejsar **Wanli** (regerade 1572–1620) bojkottade i decennier sina ämbetsmän och vägrade utse nya, så att förvaltningen förlamades. Hovets eunucker (kastrerade tjänare, ofta med stor makt) som Wei Zhongxian förföljde reformivriga ämbetsmän på 1620-talet. Kriget i Korea mot Japan ([se 1592](#invaderar-korea-1592)) och andra fälttåg tömde statskassan. Klimatet blev kallare (”lilla istiden”) med missväxter, och silverimporten minskade på 1630-talet, vilket gjorde det svårt för bönderna att betala skatten.

    I nordost enade **Nurhaci** 1616 de jurchenska stammarna (senare kallade manchuer) och anföll Ming. [Bondeuppror bröt ut](#bondeuppror-li-zicheng), och [1644 intog rebelledaren Li Zicheng Peking](#ming-faller-1644); den siste Mingkejsaren hängde sig. Manchuerna tog sedan makten och grundade Qingdynastin, som styrde till 1912. Uppskattningsvis tiotals miljoner dog i övergången.

bondeuppror-li-zicheng:
  period: 1620
  label: "Bondeuppror (Li Zicheng)"
  title: "Bondeuppror i Kina – Li Zicheng"
  wiki:
    - "en:Li Zicheng"
    - "en:Transition from Ming to Qing"
  text: |
    **Mingdynastin** hade styrt Kina sedan 1368, men på 1620–30-talen var den i kris. Kejsarhovet var splittrat av eunuckintriger, staten var bankrutt, och en kall period (den så kallade [lilla istiden](#lilla-istiden-borjar)) gav missväxt och svält i norra Kina. Samtidigt kostade kriget mot manchuerna i nordost enorma summor.

    Staten skar ner bland annat på det kurirväsende som gav arbete åt många män. En av dem som blev arbetslös var **Li Zicheng** (1606–1645), som blev ledare för ett av flera bondeuppror. Hans armé växte till kanske hundratusentals man, lockade av löften om jordreform och skattebefrielse. En annan rebelledare, Zhang Xianzhong, härjade samtidigt i Sichuan.

    I april 1644 intog Li huvudstaden Peking, och den siste Mingkejsaren hängde sig. Li utropade sig till kejsare, men höll Peking bara i några veckor: en Ming-general öppnade passet vid Kinesiska muren för manchuerna, som slog Li och tog makten (se ”[Ming faller 1644](#ming-faller-1644)” och ”[Qing](#qing-manchuer)”). Uppskattningsvis tiotals miljoner dog i krig, svält och epidemier under övergången.

ming-faller-1644:
  period: 1640
  label: "Ming faller 1644"
  title: "Mingdynastin faller 1644"
  wiki:
    - "sv:Mingdynastin"
    - "en:Transition from Ming to Qing"
  text: |
    **Mingdynastin** styrde Kina 1368–1644. Den grundades efter att mongolernas Yuan-dynasti drivits ut, och är känd för att ha byggt ut Kinesiska muren till dess nuvarande form, byggt Förbjudna staden i Peking, Zheng Hes stora flottexpeditioner (1405–1433) och porslin. Kina hade kring 1600 uppskattningsvis 150–200 miljoner invånare.

    Under 1600-talet kollapsade staten: svält efter en kall period, statsbankrutt, korruption och eunuckernas makt vid hovet, samtidigt som manchuerna angrep i nordost. Inflödet av silver från Amerika, som Kinas ekonomi blivit beroende av, minskade också. Bonderebellen **[Li Zicheng](#bondeuppror-li-zicheng)** intog Peking i april 1644, och den siste kejsaren, Chongzhen, hängde sig på en kulle bakom palatset.

    Ming-generalen Wu Sangui, som vaktade muren vid Shanhaiguan, valde då att släppa in **manchuerna** för att slå rebellerna. Manchuerna tog Peking själva och grundade **[Qingdynastin](#qing-manchuer)** (se nästa punkt). Ming-trogna fortsatte motståndet i södra Kina i årtionden; den siste Ming-pretendenten dödades 1662. Jämför med samtidiga kriser i Europa: [engelska inbördeskriget](#inbordeskriget-1642) och [Fronden](#fronden-1648).

qing-manchuer:
  period: 1640
  label: "Qing (manchuer)"
  title: "Qingdynastin – manchuerna tar Kina"
  wiki:
    - "sv:Qingdynastin"
    - "sv:Manchuer"
  text: |
    **Manchuerna** var ett folk från Manchuriet, nordost om Kinesiska muren. Under ledaren Nurhaci (död 1626) organiserades de i militära enheter kallade *fänikor*, och sonen Hong Taiji tog 1636 namnet **Qing** (”ren”) för sin dynasti. 1644 intog de Peking (se ”[Ming faller](#ming-faller-1644)”).

    Manchuerna var en liten minoritet – kanske några hundratusen bland uppskattningsvis 150 miljoner kineser. De styrde genom att behålla det kinesiska ämbetsmannasystemet och dess examina, men krävde tecken på underkastelse: alla kinesiska män måste raka framhuvudet och bära lång fläta (*queue*) på manchuiskt vis. Vägran kunde straffas med döden. Erövringen av södra Kina var blodig, med massakrer som i Yangzhou 1645.

    Qing blev Kinas sista kejsardynasti och styrde till 1912. Under kejsarna [Kangxi](#kangxi-1661) (se 1661), Yongzheng och Qianlong nådde riket sin största utsträckning – med Mongoliet, Tibet, Xinjiang och Taiwan – och ungefär dagens gränser. Befolkningen växte till över 300 miljoner kring 1800. På 1800-talet försvagades Qing av opiumkrigen och Taipingupproret.

kangxi-1661:
  period: 1660
  label: "Kangxi 1661"
  title: "Kejsar Kangxi 1661"
  wiki:
    - "sv:Kangxi"
    - "en:Treaty of Nerchinsk"
  text: |
    **Kangxi** (1654–1722) var den andre [Qing](#qing-manchuer)kejsaren att styra hela Kina – Qing var den manchuiska dynasti som tagit makten 1644. Han blev kejsare som sjuåring 1661 och regerade i 61 år, längst av alla kinesiska kejsare. Han räknas som en av Kinas mest kapabla härskare och var samtida med Ludvig XIV och Peter den store.

    Hans viktigaste insatser: han slog ned de tre feodalherrarnas uppror i södra Kina (1673–1681), ett krig som kunde ha fällt dynastin; [erövrade Taiwan 1683](#taiwan-till-qing-1683); och slöt 1689 **[fördraget i Nertjinsk](#nertjinskfordraget-1689)** med Ryssland – Kinas första avtal med en europeisk stat – som fastställde gränsen i Amurområdet och stoppade rysk expansion där i 170 år. Han förde också krig mot mongolerna i väst.

    Kangxi var intellektuellt nyfiken: han studerade geometri och astronomi med jesuitmissionärer vid hovet, och lät ta fram den stora Kangxi-ordboken (1716) med cirka 47 000 tecken – fortfarande en referens för teckensystem som Unicode. Han lät jesuiterna kartlägga riket. Under hans styre återhämtade sig Kina efter [Ming-kollapsen](#ming-faller-1644), och befolkningen började växa snabbt.

taiwan-till-qing-1683:
  period: 1680
  label: "Taiwan till Qing 1683"
  title: "Taiwan erövras av Qing 1683"
  wiki:
    - "en:Qing conquest of the Kingdom of Tungning"
    - "sv:Koxinga"
  text: |
    Kina styrdes sedan 1644 av **[Qing](#qing-manchuer)**-dynastin, manchuer från nordöst som störtat den [kinesiska Ming-dynastin](#ming-faller-1644). Ming-lojalister gjorde motstånd. Den mest kända var **Koxinga** (Zheng Chenggong), som 1662 drev ut holländarna från Taiwan och gjorde ön till bas för ett eget rike.

    1683 skickade Qing-kejsaren [Kangxi](#kangxi-1661) (se Kangxi) en flotta på uppskattningsvis 300 fartyg och 20 000 man under amiral Shi Lang. Efter sjöslaget vid Penghu-öarna gav Zheng-familjen upp. Taiwan blev för första gången formellt en del av ett kinesiskt rike, som del av provinsen Fujian.

    Det avslutade det sista Ming-motståndet. Taiwan låg därefter under Qing till 1895, då det avträddes till Japan. Den historiken ingår i dagens konflikt mellan Kina och Taiwan: Kina hänvisar bland annat till Qing-tiden som grund för sina anspråk.

nertjinskfordraget-1689:
  period: 1680
  label: "Nertjinskfördraget 1689"
  title: "Fördraget i Nertjinsk 1689"
  wiki:
    - "en:Treaty of Nerchinsk"
  text: |
    Under 1600-talet hade ryska pälsjägare och kosacker tagit sig [österut genom Sibirien](#jermak-erovrar-sibirien) ända till floden Amur, där de stötte på [Qing-Kina](#qing-manchuer). Det blev strider, bland annat kring det ryska fortet Albazin.

    1689 slöts **fördraget i Nertjinsk** i Sibirien. Det var Kinas första avtal med en europeisk stat. Ryssland drog sig tillbaka från Amurområdet, och gränsen drogs längs bergen norr om floden. I gengäld fick Ryssland rätt till handel med Kina. Förhandlingsspråket var latin, med jesuitmissionärer som tolkar, och texter fanns även på ryska och manchuiska.

    Gränsen höll i ungefär 170 år, tills Ryssland tog Amurområdet 1858–1860 när Kina var försvagat av opiumkrigen. Fördraget är intressant eftersom Kina där förhandlade som jämlike, och inte, som vanligt i kinesisk diplomati, behandlade utlänningen som en tributpliktig vasall.

    Se även [Kangxi 1661](#kangxi-1661), kejsaren som slöt fördraget.

kangxi:
  period: 1700
  label: "Kangxi"
  title: "Kejsar Kangxi"
  wiki:
    - "sv:Kangxi"
    - "sv:Qingdynastin"
  text: |
    **Kangxi** (1654–1722) var Kinas kejsare 1661–1722 – 61 år, den längsta regeringstiden i Kinas historia. Han var den andre Qing-kejsaren, alltså av den manchuiska dynastin som erövrat Kina 1644.

    Han säkrade dynastins makt: slog ner upproret av tre feodalherrar i södra Kina 1673–1681, [erövrade Taiwan 1683](#taiwan-till-qing-1683) (se det), slöt gränsavtal med Ryssland i [Nertjinsk 1689](#nertjinskfordraget-1689) (se det) och besegrade de mongoliska dzungarerna. Han var intresserad av lärdom: lät sammanställa *Kangxis ordbok* med cirka 47 000 tecken, och studerade västerländsk matematik och astronomi med jesuitmissionärer vid hovet.

    Hans tid inledde en lång period av fred och välstånd under honom, sonen [Yongzheng](#yongzheng) (se den) och sonsonen [Qianlong](#qianlong) – ibland kallad "den höga Qing". Kinas befolkning växte från uppskattningsvis 150 miljoner till över 300 miljoner under 1700-talet. Han var samtida med Ludvig XIV och Peter den store.

yongzheng:
  period: 1720
  label: "Yongzheng"
  title: "Kejsar Yongzheng"
  wiki:
    - "sv:Yongzheng"
    - "sv:Qingdynastin"
  text: |
    **Yongzheng** (1678–1735) var Kinas kejsare 1722–1735, den tredje i Qing-dynastin, son till [Kangxi](#kangxi-1661) (se den) och far till [Qianlong](#qianlong). Han tog makten efter en bitter strid mellan Kangxis många söner, och det ryktades länge att han förfalskat faderns testamente.

    Hans korta regeringstid var en tid av hårt arbete och reformer. Han var känd för att läsa och kommentera tusentals rapporter från tjänstemän personligen. Han inrättade **Storrådet**, ett litet hemligt råd som blev den egentliga regeringen i nästan 200 år, minskade korruptionen genom att ge tjänstemän högre fasta löner, och reformerade skatterna så att statskassan växte kraftigt.

    Han förbjöd kristen mission 1724 och stramade åt kontrollen över tankar och skrifter. Hans reformer lade den ekonomiska grunden för sonen Qianlongs långa regering (1735–1796), då Qing-riket nådde sin största utbredning. Han var samtida med [Walpole](#walpole) i Storbritannien och [frihetstiden](#frihetstiden) i Sverige.

qianlong:
  period: 1740
  label: "Qianlong"
  title: "Kejsar Qianlong (regerade 1735–1796)"
  wiki:
    - "en:Qianlong Emperor"
    - "sv:Qingdynastin"
  text: |
    **Qianlong** var kejsare av Kina 1735–1796 och den fjärde härskaren av **[Qingdynastin](#qing-manchuer)** – en dynasti från Manchuriet, norr om Kina, som erövrat landet 1644 och styrde till 1912. Han abdikerade efter 60 år för att inte regera längre än sin farfar [Kangxi](#kangxi-1661), men behöll den verkliga makten till sin död 1799.

    Hans tid räknas som Qingrikets höjdpunkt. Genom erövringen av dsungarerna, ett mongoliskt folk, 1755–1759 – med massdödande som nära utplånade dem – lades Xinjiang och stora delar av Centralasien till riket, som nådde ungefär sin största utsträckning. Befolkningen växte kraftigt, från uppskattningsvis 150–200 miljoner till omkring 300 miljoner – fler än hela Europa. Han lät sammanställa *Siku Quanshu*, ett gigantiskt bibliotek på omkring 36 000 band, men lät samtidigt förstöra tusentals böcker som ansågs fientliga mot dynastin.

    1757 begränsade han all västerländsk sjöhandel till hamnen Kanton (Guangzhou). Britternas försök att ändra det (se [Macartney 1793](#macartney-beskickningen-1793)) misslyckades, och spänningarna ledde till opiumkriget 1839–1842 och Kinas långa nedgång.

macartney-beskickningen-1793:
  period: 1780
  label: "Macartney-beskickningen 1793"
  title: "Macartneys beskickning till Kina 1793"
  wiki:
    - "en:Macartney Embassy"
    - "en:Canton System"
  text: |
    Storbritannien köpte stora mängder te, siden och porslin från Kina men fick betala nästan allt i silver, eftersom kineserna ville ha lite av det britterna sålde. Handeln var dessutom begränsad till hamnen Kanton (Guangzhou) och sköttes via ett fåtal licensierade kinesiska köpmän.

    1792 skickades diplomaten **George Macartney** med omkring 700 personer och hundratals lådor med gåvor – teleskop, planetarium, kanoner, klockor – för att be kejsar **[Qianlong](#qianlong)** om ambassad i Peking, fler hamnar och lägre tullar. Det blev strid om ceremonin: Macartney vägrade utföra *kowtow*, att knäböja och slå pannan i golvet nio gånger, och knäföll bara på ett ben som inför sin egen kung.

    Kejsaren avslog allt med ett brev där det stod att Kina ”har allt i överflöd” och inte behöver britternas varor. Brevet blev ett exempel på Kinas självtillräcklighet – Kina var då världens största ekonomi. Men britterna hittade en vara kineserna ville ha: [indiskt opium](#opiumsmuggling). Det ledde till opiumkriget 1839–42, då Kina tvingades öppna sig.

opiumsmuggling:
  period: 1820
  label: "Opiumsmuggling"
  title: "Opiumsmugglingen till Kina 1820–1839"
  wiki:
    - "en:Opium trade in China"
    - "en:Lin Zexu"
  text: |
    Britterna köpte stora mängder te, siden och porslin från Kina, men Kina ville inte ha brittiska varor i utbyte – betalningen skedde i silver, vilket gav Storbritannien ett stort handelsunderskott. **[Qingdynastin](#qing-manchuer)**, de manchuriska kejsare som styrde Kina 1644–1912, begränsade all utrikeshandel till hamnen Kanton (Guangzhou).

    Lösningen för det brittiska Ostindiska kompaniet blev **opium**, ett beroendeframkallande narkotikum utvunnet ur vallmo. Kompaniet hade monopol på opiumodling i Bengalen i Indien och sålde det på auktion till privata handlare som smugglade in det i Kina, där opium var förbjudet. Importen växte från uppskattningsvis 4 000 lådor per år runt 1800 till omkring 40 000 lådor 1838 (en låda ≈ 60 kg). Silverflödet vände och gick nu ut ur Kina.

    Miljontals kineser blev beroende, och statens ekonomi och administration försvagades. Kejsaren skickade 1839 ämbetsmannen **Lin Zexu** till Kanton för att stoppa handeln; han beslagtog och förstörde över 1 000 ton opium. Britternas svar blev [Opiumkriget 1839–1842](#opiumkriget-183942-hongkong). Jämför med senare tiders narkotikapolitik: här var det en stat som drev på narkotikahandeln mot ett annat lands vilja.

opiumkriget-183942-hongkong:
  period: 1840
  label: "Opiumkriget 1839–42, Hongkong"
  title: "Första opiumkriget 1839–1842 och Hongkong"
  wiki:
    - "sv:Första opiumkriget"
    - "sv:Hongkongs historia"
  text: |
    När den kinesiske ämbetsmannen Lin Zexu 1839 beslagtog och förstörde över 1 000 ton brittiskt opium i Kanton (se [Opiumsmuggling](#opiumsmuggling)), svarade Storbritannien med krig, för att skydda handeln och öppna Kina för brittiska varor.

    Det blev ett ojämnt krig mellan en industrialiserad sjömakt och ett agrart imperium. Britterna satte in ett par tiotal krigsfartyg, bl.a. det järnklädda ångfartyget *Nemesis*, och omkring 20 000 man som mest. De kinesiska djunkerna och fästningarna med gamla kanoner hade ingen chans. Britterna intog kuststäder och hotade Nanjing; Kina förlorade uppskattningsvis 20 000 soldater, britterna bara några hundra i strid.

    I **Nanjingfördraget** 1842 fick Storbritannien ön **Hongkong**, fem hamnar öppnades för handel och Kina betalade 21 miljoner silverdollar i skadestånd. Det var det första av de ”ojämlika fördragen”, och inledde det som i Kina kallas ”hundra år av förödmjukelse” (till [1949](#folkrepubliken-1949)). Ett andra opiumkrig följde 1856–1860. Hongkong förblev brittiskt till 1997. Kinas försvagning bidrog också till [Taipingupproret](#taipingupproret-1850).

taipingupproret-1850:
  period: 1840
  label: "Taipingupproret 1850"
  title: "Taipingupproret 1850–1864"
  wiki:
    - "sv:Taipingupproret"
  text: |
    **Taipingupproret** var ett inbördeskrig i Kina mot **Qingdynastin**, de manchuriska kejsare som styrt Kina sedan 1644. Det leddes av **Hong Xiuquan**, en man som misslyckats i de statliga ämbetsexamina och efter en sjukdom fick syner. Påverkad av kristna missionärsskrifter trodde han att han var Jesu yngre bror, sänd för att utrota demoner – vilka han identifierade med manchuerna.

    Bakgrunden var fattigdom, befolkningsöverskott (Kina hade uppskattningsvis 400 miljoner invånare), korruption och statens försvagning efter [Opiumkriget](#opiumkriget-183942-hongkong). Taipingrörelsen förespråkade jordreform, förbud mot opium och fotbindning, och viss jämlikhet mellan könen. 1853 intog den Nanjing, som blev huvudstad i ”det himmelska fridsriket” (*Taiping Tianguo*), och kontrollerade stora delar av södra Kina i elva år.

    Upproret krossades 1864 av regionala arméer ledda av kinesiska ämbetsmän, med visst stöd av västerländska officerare. Uppskattningsvis 20–30 miljoner människor dog, främst av svält och sjukdomar – ett av historiens blodigaste krig, jämförbart med [första världskriget](#forsta-varldskriget). Qingdynastin överlevde men var kraftigt försvagad, och [föll 1912](#qing-faller-1911-republik).

sjalvstarkningsrorelsen:
  period: 1860
  label: "Självstärkningsrörelsen"
  title: "Självstärkningsrörelsen i Kina ca 1861–1895"
  wiki:
    - "en:Self-Strengthening Movement"
    - "sv:Qingdynastin"
  text: |
    Efter förödmjukande nederlag mot Storbritannien och Frankrike i [opiumkrigen](#opiumkriget-183942-hongkong) (1839–42 och 1856–60) och det förödande **[Taipingupproret](#taipingupproret-1850)** (1850–64, ett inbördeskrig med uppskattningsvis 20–30 miljoner döda) försökte Qingdynastins ämbetsmän modernisera Kina. Programmet kallades **Självstärkningsrörelsen**.

    Idén var ”kinesisk lära som grund, västerländsk lära för praktiskt bruk”: behåll det konfucianska samhället och kejsarmakten, men köp västerländsk teknik. Man byggde vapenfabriker, varv, en modern flotta, telegraflinjer och skickade studenter utomlands. Drivande var regionala ämbetsmän som **Li Hongzhang**.

    Resultatet blev splittrat och halvhjärtat, eftersom hovet och den konservativa eliten bromsade djupare reformer. Det visade sig brutalt 1894–95, när Kinas moderna flotta krossades av Japan (se ”[Kinesisk-japanska kriget 1894](#kinesisk-japanska-kriget-1894)”). Jämför med Japans [Meijireformer](#meiji-restaurationen-1868) samtidigt, som gick mycket längre.

kinesisk-japanska-kriget-1894:
  period: 1880
  label: "Kinesisk-japanska kriget 1894"
  title: "Första kinesisk-japanska kriget 1894–95"
  wiki:
    - "sv:Första kinesisk-japanska kriget"
  text: |
    Kriget gällde **Korea**, som traditionellt var en lydstat till Kina men som Japan ville ha inflytande över. När ett bondeuppror bröt ut i Korea 1894 skickade båda länderna trupper, och i augusti förklarades krig.

    På papperet var Kina starkare, med en större befolkning (ca 400 miljoner mot Japans ca 40) och en flotta med moderna tyskbyggda slagskepp från [Självstärkningsrörelsen](#sjalvstarkningsrorelsen). Men den kinesiska armén var splittrad mellan regionala befälhavare, korrumperad och dåligt utbildad. Japan vann till lands i Korea och Manchuriet och till sjöss vid Yalufloden, och tog flottbasen Weihaiwei.

    I fredsavtalet i Shimonoseki 1895 tvingades Kina erkänna Koreas ”självständighet”, avträda **Taiwan** till Japan och betala ett enormt krigsskadestånd. Nederlaget mot ett asiatiskt grannland chockade Kina, ledde till krav på reformer och revolution, och startade en ny våg av europeiska anspråk på kinesiska hamnar. Se även ”[seger över Kina 1895](#seger-over-kina-1895)”.

boxarupproret-1900:
  period: 1900
  label: "Boxarupproret 1900"
  title: "Boxarupproret 1900"
  wiki:
    - "sv:Boxarupproret"
  text: |
    Boxarupproret var ett uppror i norra Kina 1899–1901 mot utländskt inflytande och kristna missionärer. ”Boxarna” var en folklig rörelse (egentligen ”De rättfärdiga och harmoniska nävarna”) som utövade kampsport och trodde sig vara osårbara för kulor. Kina styrdes då av Qingdynastin, en manchuisk kejsarätt sedan 1644, som var kraftigt försvagad efter förlorade krig mot Storbritannien och Japan.

    Sommaren 1900 belägrade boxarna utländska ambassader i Peking i 55 dagar. Änkekejsarinnan **Cixi**, den verkliga makthavaren, ställde sig på boxarnas sida och förklarade krig mot stormakterna. En allians av åtta länder (bl.a. Japan, Ryssland, Storbritannien, USA, Tyskland och Frankrike) skickade omkring 20 000 soldater som intog Peking och plundrade staden.

    Tiotusentals kinesiska kristna och några hundra utlänningar dödades. Kina tvingades betala 450 miljoner tael silver i skadestånd, ungefär lika mycket som statens intäkter under flera år. Förödmjukelsen bidrog till att Qingdynastin [föll 1911](#qing-faller-1911-republik).

    Jämför med [Självstärkningsrörelsen](#sjalvstarkningsrorelsen).

qing-faller-1911-republik:
  period: 1900
  label: "Qing faller 1911, republik"
  title: "Xinhairevolutionen 1911"
  wiki:
    - "sv:Xinhairevolutionen"
    - "en:1911 Revolution"
  text: |
    Qingdynastin hade styrt Kina sedan 1644, men efter opiumkrigen, [Taipingupproret](#taipingupproret-1850) (1850–64, uppskattningsvis 20–30 miljoner döda), nederlaget mot Japan 1895 och [Boxarupproret](#boxarupproret-1900) var den svag och impopulär. Härskarna var manchuer, en minoritet, vilket gjorde den kinesiska nationalismen ännu starkare.

    I oktober 1911 gjorde militära enheter myteri i Wuchang. Provins efter provins förklarade sig oberoende. Den 1 januari 1912 utropades Republiken Kina med **Sun Yat-sen**, läkare och ledare för revolutionära rörelser, som provisorisk president. Den sexårige kejsaren **Puyi** abdikerade i februari 1912 – slutet på över 2 000 år av kejsardöme.

    Republiken blev dock instabil. Generalen Yuan Shikai tog makten och försökte till och med göra sig till kejsare. Efter hans död 1916 föll landet sönder i krigsherrarnas styre, där regionala militärer kontrollerade varsin del. Detta ledde till kampen mellan nationalisterna (Kuomintang) och kommunisterna – se [Långa marschen 1934](#langa-marschen-1934) och [Folkrepubliken 1949](#folkrepubliken-1949).

langa-marschen-1934:
  period: 1920
  label: "Långa marschen 1934"
  title: "Långa marschen 1934–35"
  wiki:
    - "sv:Långa marschen"
    - "sv:Mao Zedong"
  text: |
    Efter 1927 rådde inbördeskrig i Kina mellan nationalistpartiet Kuomintang, lett av **Chiang Kai-shek**, och kommunistpartiet. Kommunisterna hade byggt upp en egen bas i provinsen Jiangxi i sydöstra Kina, men omringades av nationalistiska styrkor 1934.

    I oktober 1934 bröt omkring 86 000 kommunister igenom och inledde en reträtt som varade ett år. Den gick över berg, floder och träskmarker till Shaanxi i nordväst, uppskattningsvis 10 000 km enligt den officiella berättelsen (forskare menar att den verkliga sträckan var kortare). Bara omkring 8 000 av dem som startade nådde fram.

    Under marschen blev **Mao Zedong** partiets ledande gestalt. Långa marschen blev kinesiska kommunisternas grundmyt, som berättelse om uthållighet. Från basen i Yan'an byggde partiet upp sin styrka under [kriget mot Japan (från 1937)](#nanking-1937) och vann inbördeskriget 1949 (se [Folkrepubliken 1949](#folkrepubliken-1949)).

nanking-1937:
  period: 1920
  label: "Nanking 1937"
  title: "Massakern i Nanking 1937"
  wiki:
    - "sv:Massakern i Nanking"
  text: |
    1937 inledde Japan ett fullskaligt krig mot Kina, det som blev en del av [andra världskriget](#andra-varldskriget) i Asien. I december 1937 intog japanska trupper Nanking (Nanjing), då Kinas huvudstad.

    Under omkring sex veckor dödade japanska soldater krigsfångar och civila i stor skala, och tiotusentals kvinnor våldtogs. Antalet döda är omstritt: den kinesiska officiella siffran är 300 000, många historiker anger 100 000–200 000, och vissa japanska nationalister förnekar massakern. En grupp västerlänningar, bland dem den tyske nazistpartimedlemmen **John Rabe**, upprättade en säkerhetszon som skyddade uppskattningsvis 200 000 människor.

    Kriget mellan Japan och Kina 1937–45 kostade uppskattningsvis 15–20 miljoner kinesiska liv. Massakern i Nanking är än idag en känslig fråga i relationen mellan Kina och Japan, särskilt när japanska skolböcker eller politiker tonar ned den. Jämför med [Förintelsen](#forintelsen) i Europa samma period.

folkrepubliken-1949:
  period: 1940
  label: "Folkrepubliken 1949"
  title: "Folkrepubliken Kina 1949"
  wiki:
    - "sv:Folkrepubliken Kina"
    - "sv:Kinesiska inbördeskriget"
  text: |
    Efter Japans kapitulation 1945 återupptogs inbördeskriget i Kina mellan nationalisterna (Kuomintang) under **Chiang Kai-shek** och kommunisterna under **Mao Zedong**. Nationalisterna hade amerikanskt stöd men var korrupta, och hyperinflation slog sönder ekonomin. Kommunisterna vann stöd bland bönderna genom att lova jord.

    Den 1 oktober 1949 utropade Mao Folkrepubliken Kina från Himmelska fridens port i Peking. Chiang flydde med omkring 1–2 miljoner anhängare till ön Taiwan, där Republiken Kina lever kvar. Frågan om Taiwans status är fortfarande en av världens farligaste konflikthärdar.

    Världens folkrikaste land, med omkring 540 miljoner invånare, var nu kommunistiskt. Under jordreformen dödades uppskattningsvis 1–2 miljoner godsägare. Kina gick med i [Koreakriget 1950](#koreakriget-195053) och förlorade hundratusentals soldater. Se även [Stora språnget 1958](#stora-spranget-1958). Efter Maos död 1976 inledde Deng Xiaoping [marknadsreformer](#dengs-reformer) som gjorde Kina till världens näst största ekonomi.

stora-spranget-1958:
  period: 1940
  label: "Stora språnget 1958"
  title: "Stora språnget 1958–62"
  wiki:
    - "sv:Stora språnget"
    - "en:Great Chinese Famine"
  text: |
    Stora språnget var en kampanj som **Mao Zedong** startade 1958 för att på några år göra Kina till en industrimakt och ”gå om Storbritannien” i stålproduktion inom 15 år. Bönderna organiserades i jättelika folkkommuner med tiotusentals medlemmar, där privat ägande och egna kök avskaffades.

    Miljontals bönder beordrades att smälta järn i små ugnar på bakgårdar; resultatet var mest oanvändbart järn, och kastruller och redskap smältes ned. Samtidigt infördes pseudovetenskapliga jordbruksmetoder. Lokala ledare rapporterade uppblåsta skördar av rädsla, och staten krävde ut spannmål baserat på de falska siffrorna, även för export. En kampanj mot sparvar ledde till insektsplågor.

    Resultatet blev den största hungersnöden i historien. Uppskattningar av antalet döda 1959–61 ligger mellan 15 och 45 miljoner, ofta runt 30 miljoner. Jämför med [Holodomor 1932–33](#holodomor-193233), som hade liknande orsaker men mindre omfattning. Maos ställning försvagades, och för att återta makten startade han [kulturrevolutionen 1966](#kulturrevolutionen-1966).

kulturrevolutionen-1966:
  period: 1960
  label: "Kulturrevolutionen 1966"
  title: "Kulturrevolutionen i Kina 1966–1976"
  wiki:
    - "sv:Kulturrevolutionen"
    - "sv:Mao Zedong"
  text: |
    **Mao Zedong** ledde kommunisterna till seger i Kinas [inbördeskrig 1949](#folkrepubliken-1949). Hans ”[stora språng](#stora-spranget-1958)” 1958–62, ett försök att snabbindustrialisera med folkkommuner och bakgårdsugnar för stål, orsakade en svält där uppskattningsvis 15–45 miljoner dog. Mao förlorade inflytande till mer pragmatiska ledare som Liu Shaoqi och Deng Xiaoping.

    1966 slog Mao tillbaka genom att uppmana ungdomar att angripa ”borgerliga element” i partiet och samhället. Miljoner skolelever och studenter bildade **rödgardister**, som med Maos ”lilla röda bok” i hand förödmjukade, misshandlade och dödade lärare, intellektuella och partifunktionärer, och förstörde tempel och kulturarv. Liu Shaoqi dog i fångenskap; Deng skickades att arbeta i en traktorfabrik. När kaoset blev för stort skickades omkring 17 miljoner unga ut på landsbygden för att ”lära av bönderna”.

    Uppskattningsvis dog mellan några hundratusen och 2 miljoner människor; universiteten var i stort sett stängda i flera år. Kulturrevolutionen tog slut när Mao dog 1976. Deng Xiaoping tog sedan makten och inledde 1978 de [marknadsreformer](#dengs-reformer) som gjort Kina till en ekonomisk supermakt. Erfarenheten av kaoset förklarar en del av dagens kinesiska ledares betoning på stabilitet.

nixon-i-peking-1972:
  period: 1960
  label: "Nixon i Peking 1972"
  title: "Nixon besöker Kina 1972"
  wiki:
    - "en:1972 visit by Richard Nixon to China"
    - "sv:Richard Nixon"
  text: |
    Efter [kommunisternas seger 1949](#folkrepubliken-1949) erkände USA inte Folkrepubliken Kina utan bara regeringen på Taiwan. De båda länderna slogs mot varandra i [Koreakriget](#koreakriget-195053) (se det) och hade ingen diplomatisk kontakt i över 20 år. Samtidigt hade Kina och Sovjetunionen blivit fiender; 1969 stred de vid gränsfloden Ussuri.

    USA:s president **Richard Nixon**, en hård antikommunist, och hans säkerhetsrådgivare **Henry Kissinger** såg en chans att utnyttja splittringen. Kissinger reste i hemlighet till Peking 1971 via Pakistan. I februari 1972 besökte Nixon Kina i en vecka och träffade Mao Zedong. Besöket sändes live i amerikansk tv. En vanlig fras sedan dess är att ”bara Nixon kunde åka till Kina” – en hök kunde inte anklagas för att vara mjuk mot kommunismen.

    Kina hade redan 1971 tagit över Taiwans plats i FN och i säkerhetsrådet. Fulla diplomatiska förbindelser kom 1979. Närmandet pressade Sovjet och öppnade för de handelsförbindelser som efter [Dengs reformer](#dengs-reformer) gjorde Kina till ”världens fabrik”. Taiwanfrågan lämnades medvetet oklar, och den är fortfarande den farligaste punkten mellan USA och Kina.

dengs-reformer:
  period: 1980
  label: "Dengs reformer"
  title: "Deng Xiaopings reformer från 1978"
  wiki:
    - "sv:Deng Xiaoping"
    - "en:Chinese economic reform"
  text: |
    **Deng Xiaoping** (1904–1997) var en veteran i Kinas kommunistparti som rensats ut två gånger under Mao Zedong. Efter Maos död 1976 blev han från 1978 landets verklige ledare. Kina var då fattigt: BNP per person var lägre än i många afrikanska länder, efter katastrofer som [Det stora språnget](#stora-spranget-1958) (1958–62, uppskattningsvis 15–45 miljoner döda i svält) och [kulturrevolutionen](#kulturrevolutionen-1966) (1966–76).

    Deng införde **reform och öppning**: bönder fick sälja överskott på egen hand, privata småföretag tilläts, och **särskilda ekonomiska zoner** som Shenzhen öppnades för utländska företag. Shenzhen gick från en ort med uppskattningsvis 30 000 invånare till en storstad med över 17 miljoner i dag. Partiet behöll dock all politisk makt. Hans motto: det spelar ingen roll om katten är svart eller vit, så länge den fångar möss.

    Resultatet blev den snabbaste långvariga ekonomiska tillväxt världen sett: runt 10 % per år i 30 år, och omkring 800 miljoner människor lyftes ur extrem fattigdom. Samtidigt slog Deng ner demokratirörelsen på [Himmelska fridens torg 1989](#himmelska-fridens-torg-1989). Se även [WTO 2001](#wto-2001) och [Xi 2012](#xi-2012).

himmelska-fridens-torg-1989:
  period: 1980
  label: "Himmelska fridens torg 1989"
  title: "Massakern på Himmelska fridens torg 1989"
  wiki:
    - "sv:Massakern på Himmelska fridens torg"
    - "en:1989 Tiananmen Square protests and massacre"
  text: |
    Våren 1989 samlades studenter och arbetare på **Himmelska fridens torg** (Tiananmen), det enorma torget mitt i Peking. De protesterade mot korruption och inflation och krävde yttrandefrihet och mer demokrati. Under sex veckor deltog upp till en miljon människor, och protester spreds till omkring 400 städer. Flera tusen studenter hungerstrejkade.

    Partiledningen under **Deng Xiaoping** var splittrad, men hårdlinjerna vann. Undantagstillstånd utlystes och natten mot den 4 juni 1989 gick armén in med stridsvagnar och skarp ammunition. Antalet döda är fortfarande okänt; uppskattningar varierar från några hundra till flera tusen. Bilden av en ensam man som ställer sig framför en rad stridsvagnar blev en av 1900-talets mest kända.

    Händelsen inträffade samma år som [Berlinmuren föll](#murens-fall-1989) och de kommunistiska regimerna i Östeuropa kollapsade nästan utan våld. Kinas ledning drog den motsatta slutsatsen: ekonomisk öppning skulle fortsätta, men partiets maktmonopol fick aldrig ifrågasättas. Händelsen är censurerad i Kina än i dag. Se även [Dengs reformer](#dengs-reformer) och [Hongkong](#hongkong) (2020).

wto-2001:
  period: 2000
  label: "WTO 2001"
  title: "Kina går med i WTO 2001"
  wiki:
    - "sv:Världshandelsorganisationen"
    - "en:China and the World Trade Organization"
  text: |
    **Världshandelsorganisationen (WTO)** är en internationell organisation, grundad 1995, som sätter regler för handel mellan länder: medlemmarna förbinder sig att hålla låga tullar, behandla andra medlemmar lika och lösa tvister via WTO. I december 2001, efter 15 års förhandlingar, blev Kina medlem. Kina lovade att sänka tullar, öppna marknader och skydda utländska patent, och fick i gengäld permanent tillgång till världsmarknaden.

    Effekten var enorm. Kinas export ökade ungefär sex–sju gånger på tio år och landet blev världens största exportör 2009 – "världens fabrik". Västerländska företag flyttade produktion till Kina för att utnyttja billig arbetskraft; konsumenter i väst fick billigare kläder, leksaker och elektronik. Kina byggde upp valutareserver på över 3 000 miljarder dollar.

    Baksidan för väst var att industriarbeten försvann. Ekonomer har beräknat att konkurrensen från Kina – "Kinachocken" – kostade USA uppemot en miljon jobb i tillverkningsindustrin, koncentrerat till vissa regioner, vilket bidragit till politiskt missnöje (se [Trump åter 2025](#trump-ater-2025)). Förhoppningen att handel skulle göra Kina mer demokratiskt infriades inte. Se även [Dengs reformer](#dengs-reformer) och [Xi 2012](#xi-2012).

os-2008:
  period: 2000
  label: "OS 2008"
  title: "Olympiska spelen i Peking 2008"
  wiki:
    - "sv:Olympiska sommarspelen 2008"
    - "en:2008 Summer Olympics"
  text: |
    Sommar-OS i Peking i augusti 2008 var Kinas stora uppvisning för världen, ungefär som Tokyo-OS 1964 hade varit för Japan och Seoul 1988 för Sydkorea. Kina lade uppskattningsvis 40 miljarder dollar på spelen och tillhörande infrastruktur – nya tunnelbanelinjer, flygplatsterminal och arenor som "Fågelboet" – vilket gjorde dem till de dyraste spelen dittills. Öppningsceremonin, med 15 000 medverkande, började 8/8/2008 klockan 20.08, eftersom åtta är ett lyckotal i Kina.

    Kina vann flest guldmedaljer (48), före USA – första gången USA inte toppade sedan Sovjetunionens dagar. Samma år invigdes den första höghastighetsjärnvägen mellan Peking och Tianjin; i dag har Kina mer höghastighetsräls än resten av världen tillsammans.

    Spelen var också omstridda. Våren 2008 slogs protester i Tibet ned, och den olympiska fackelstafetten möttes av demonstrationer i bland annat London och Paris. Människorättsorganisationer kritiserade tvångsförflyttningar och censur. Ändå blev OS en symbol för Kinas återkomst som stormakt, samtidigt som [finanskrisen 2008](#finanskrisen-2008) drabbade väst. Peking blev 2022 första stad att arrangera både sommar- och vinter-OS. Se även [WTO 2001](#wto-2001).

xi-2012:
  period: 2000
  label: "Xi 2012"
  title: "Xi Jinping tar makten 2012"
  wiki:
    - "sv:Xi Jinping"
    - "en:Xi Jinping"
  text: |
    **Xi Jinping** (född 1953) är son till en kommunistisk revolutionsveteran som rensades ut under Mao; själv skickades han som tonåring till landsbygden under [kulturrevolutionen](#kulturrevolutionen-1966). I november 2012 blev han generalsekreterare för Kinas kommunistparti – landets högsta post – och 2013 president.

    Xi bröt med den kollektiva ledning som Deng Xiaoping infört för att undvika en ny Mao. Han inledde en stor antikorruptionskampanj som straffat över en miljon partimedlemmar, men som också slog ut politiska rivaler. 2018 avskaffades begränsningen till två mandatperioder för presidenten, och 2022 fick han en tredje period som partiledare. Han har skärpt kontrollen över internet, näringsliv och civilsamhälle. I provinsen Xinjiang har uppskattningsvis en miljon uiguriska muslimer satts i läger för "omskolning", och i Hongkong krossades demokratirörelsen (se [Hongkong](#hongkong)).

    Utrikes driver han en mer offensiv politik: **Nya sidenvägen** (Belt and Road, 2013), ett program av infrastrukturlån och -investeringar i över 140 länder, militära baser på konstgjorda öar i Sydkinesiska havet och ökat tryck mot Taiwan. Relationen till USA har blivit en strategisk rivalitet med handelskrig och exportförbud för avancerade chip. Se även [Dengs reformer](#dengs-reformer).

covid-19-wuhan:
  period: 2020
  label: "Covid-19 (Wuhan)"
  title: "Covid-19 bryter ut i Wuhan"
  wiki:
    - "en:COVID-19 pandemic in mainland China"
    - "en:Origin of SARS-CoV-2"
  text: |
    I december 2019 rapporterade läkare i **Wuhan**, en industristad med omkring 11 miljoner invånare i centrala Kina, om fall av en okänd lunginflammation. Många tidiga fall hade koppling till Huananmarknaden, där levande vilda djur såldes. I januari 2020 identifierades orsaken som ett nytt coronavirus, senare kallat SARS-CoV-2, och kinesiska forskare publicerade dess arvsmassa den 11 januari.

    Myndigheterna tystade först läkare som varnade, bland andra ögonläkaren Li Wenliang, som själv dog i sjukdomen i februari 2020. Den 23 januari 2020 stängdes Wuhan helt ned – en karantän av ett slag världen aldrig sett. Kina byggde ett sjukhus med 1 000 bäddar på tio dagar. Kina förde sedan en **nollcovidpolitik** med massiv testning, smittspårning via mobilappar och omfattande nedstängningar, till exempel av Shanghai med 25 miljoner invånare i två månader 2022. Den övergavs plötsligt i december 2022 efter ovanliga protester.

    Virusets ursprung är omstritt. De flesta forskare anser att det mest troliga är att det spred sig från djur till människor på marknaden, men många, bland annat några amerikanska underrättelsetjänster, håller en läcka från Wuhans virologiska institut som möjlig. Kina har inte gett full tillgång till tidiga data. Se även [Covid-19](#covid-19) under Globalt.

hongkong:
  period: 2020
  label: "Hongkong"
  title: "Hongkong och demokratirörelsen"
  wiki:
    - "sv:Hongkong"
    - "en:2019–2020 Hong Kong protests"
    - "en:Hong Kong national security law"
  text: |
    **Hongkong** var brittisk koloni från [Opiumkriget 1842](#opiumkriget-183942-hongkong) till 1997, då den lämnades tillbaka till Kina. Enligt avtalet skulle Hongkong under 50 år styras enligt principen **"ett land, två system"**: staden skulle behålla egna lagar, fri press, oberoende domstolar och en kapitalistisk ekonomi, med löfte om att på sikt få välja sin ledare fritt. Med 7,5 miljoner invånare var Hongkong ett av världens finanscentrum.

    2014 blockerade studenter centrala Hongkong i 79 dagar i **paraplyrörelsen** för fria val. 2019 utlöste ett lagförslag om utlämning till Kina de största protesterna i stadens historia; vid en demonstration i juni deltog enligt arrangörerna omkring 2 miljoner människor. Protesterna pågick i månader och blev allt våldsammare, med tårgas och ockuperade universitet.

    Peking svarade i juni 2020 med en **nationell säkerhetslag** som kriminaliserade "subversion" och "samarbete med utländska krafter" med straff upp till livstid. Oppositionens ledare fängslades eller flydde, den demokrativänliga tidningen Apple Daily stängdes och valsystemet ändrades så att bara "patrioter" kan väljas. Hundratusentals har emigrerat, många till Storbritannien. Det blev i praktiken slutet på "ett land, två system", 27 år före utsatt tid. Jämför med [Himmelska fridens torg 1989](#himmelska-fridens-torg-1989) och se [Xi 2012](#xi-2012).
