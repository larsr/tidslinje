[project]
name = "tidslinje"
version = "0.1.0"
description = "Världstidslinje 1000–idag, renderad från YAML och Markdown"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3",
    "pyyaml>=6",
    "tzdata",
]

[dependency-groups]
dev = [
    "playwright==1.56.0",
    "zizmor>=1",
]

[tool.uv]
package = false
